mechanic: pull_portal_fallback

levels:
  - id: L01
    title: First Pull
    layout: |
      #######
      #C@G  #
      #######
    expected_trace:
      - input: right
        events: [pull_crate]
      - input: right
        events: [pull_crate]
    expected_events: [pull_crate]
    design_notes: >
      Minimal pull witness. Solver should verify whether the current win
      condition and layout produce the intended crate-on-goal result.
    analysis:
      proof_status: candidate_fixture

  - id: L02
    title: No Push
    layout: |
      ########
      #@C G  #
      #   ####
      #      #
      ########
    expected_trace:
      - input: right
        events: [push_crate_failed]
    expected_events: [push_crate_failed, pull_crate]
    design_notes: >
      The first visible attempt fails because the crate cannot be pushed.
      A verified version should require the player to route around and pull.
    analysis:
      proof_status: candidate_fixture

  - id: L03
    title: Open The Hall
    layout: |
      ########
      # C@ G #
      ########
    expected_events: [pull_crate]
    design_notes: >
      Intended to show that pulling a crate out of a choke point can create
      a path. The exact intended trace should be generated once runtime exists.
    analysis:
      proof_status: candidate_fixture

  - id: L04
    title: Clean Portal
    win:
      type: event_occurs
      event: portal_teleport
    layout: |
      #########
      #@ A    #
      #   B G #
      #########
    expected_trace:
      - input: right
        events: [walk]
      - input: right
        events: [portal_enter, portal_teleport]
    expected_events: [portal_enter, portal_teleport]
    design_notes: >
      Establish ordinary portal behavior before blocked exits are introduced.
    analysis:
      proof_status: candidate_fixture

  - id: L05
    title: Blocked Exit
    win:
      type: event_occurs
      event: portal_fallback_push
    layout: |
      #########
      #@ A    #
      #   BC  #
      #########
    expected_trace:
      - input: right
        events: [walk]
      - input: right
        events: [portal_enter, portal_exit_blocked, portal_fallback_push]
    expected_events: [portal_exit_blocked, portal_fallback_push]
    design_notes: >
      The crate blocks portal B's exit, so entering A should push A rather
      than teleporting the player.
    analysis:
      proof_status: candidate_fixture

  - id: L06
    title: Build The Block
    win:
      type: event_occurs
      event: portal_fallback_push
    layout: |
      ############
      #          #
      # @ A      #
      #    C     #
      #   B      #
      #          #
      ############
    expected_events: [pull_crate, portal_exit_blocked, portal_fallback_push]
    design_notes: >
      Intended application: pull the crate onto the paired portal exit, then
      use the blocked-exit fallback to move the entrance portal.
    analysis:
      proof_status: candidate_fixture

  - id: L07
    title: Portal As Key
    win:
      type: event_occurs
      event: portal_fallback_push
    layout: |
      ############
      #@ A       #
      #    C     #
      #   B      #
      #          #
      ############
    expected_events: [pull_crate, portal_fallback_push]
    design_notes: >
      The moved portal should become a spatial key that opens the upper route.
      Solver must reject this candidate if the goal is reachable without the
      fallback push.
    analysis:
      proof_status: candidate_fixture

  - id: L08
    title: Jammed Portal
    win:
      type: event_occurs
      event: portal_fallback_failed
    layout: |
      ########
      # @A#  #
      ###BC###
      ########
    expected_trace:
      - input: right
        events: [portal_enter, portal_exit_blocked, portal_fallback_failed]
    expected_events: [portal_exit_blocked, portal_fallback_failed]
    design_notes: >
      The paired exit is blocked by a crate and the entrance portal cannot
      move because a wall is directly behind it.
    analysis:
      proof_status: candidate_fixture

  - id: L09
    title: Doorway Portal
    win:
      type: player_on_goal
    layout: |
      #########
      #@ A G  #
      ###BC####
      #########
    expected_events: [portal_exit_blocked, portal_fallback_push]
    design_notes: >
      The portal itself blocks the corridor. Repeated blocked-exit fallback
      pushes move it out of the way so the player can stand on the goal.
    analysis:
      proof_status: candidate_fixture

  - id: L10
    title: Build And Open
    win:
      type: event_occurs
      event: portal_fallback_push
    layout: |
      ############
      ###  #     #
      # @ A G   #
      #    C######
      ####B ######
      #          #
      ############
    expected_events: [pull_crate, portal_exit_blocked, portal_fallback_push]
    design_notes: >
      First pull the crate into the paired portal's exit, then return to the
      entrance and push the portal along the corridor until the goal opens.
    analysis:
      proof_status: candidate_fixture

  - id: L11
    title: Long Doorway
    win:
      type: player_on_goal
    layout: |
      ###########
      #@ A  G  #
      ###BC#####
      ###########
    expected_events: [portal_exit_blocked, portal_fallback_push]
    design_notes: >
      A longer corridor variant of Doorway Portal. The player must push the
      entrance portal multiple times before stepping onto the goal.
    analysis:
      proof_status: candidate_fixture

  - id: L12
    title: Push Into Jam
    win:
      type: event_occurs
      event: portal_fallback_failed
    layout: |
      ##########
      #@ A #   #
      ###BC#####
      ##########
    expected_events: [portal_fallback_push, portal_fallback_failed]
    expected_trace:
      - input: right
        events: [walk]
      - input: right
        events: [portal_enter, portal_exit_blocked, portal_fallback_push]
      - input: right
        events: [walk]
      - input: down
        events: [portal_enter, portal_exit_blocked, portal_fallback_failed]
    design_notes: >
      The first blocked entry pushes A right. The second blocked entry cannot
      push A because the next cell is a wall.
    analysis:
      proof_status: candidate_fixture

  - id: L13
    title: Longer Pull
    layout: |
      ##########
      # C@  G  #
      ##########
    expected_events: [pull_crate]
    design_notes: >
      A longer version of the first pull witness, used to make the pull motion
      feel deliberate rather than accidental.
    analysis:
      proof_status: candidate_fixture

  - id: L14
    title: Hard Stop
    win:
      type: event_occurs
      event: push_crate_failed
    layout: |
      #######
      # @C  #
      #######
    expected_trace:
      - input: right
        events: [push_crate_failed]
    expected_events: [push_crate_failed]
    design_notes: >
      A compact negative witness for the no-push rule.
    analysis:
      proof_status: candidate_fixture

  - id: L15
    title: Sealed Shuttle
    win:
      type: player_on_goal
    layout: |
      #########
      #@ A#####
      ### B G #
      #########
    expected_events: [portal_enter, portal_teleport]
    design_notes: >
      The goal chamber is sealed from the start area, so ordinary teleport is
      the only way to reach it.
    analysis:
      proof_status: candidate_fixture

  - id: L16
    title: Vertical Doorway
    win:
      type: player_on_goal
    layout: |
      #####
      ##@##
      ##A##
      ##G##
      #B ##
      #####
    expected_events: [portal_exit_blocked, portal_fallback_push]
    design_notes: >
      A vertical version of the doorway idea. Blocked portal entries push A
      downward until the goal cell opens.
    analysis:
      proof_status: candidate_fixture

  - id: L17
    title: Vertical Jam
    win:
      type: event_occurs
      event: portal_fallback_failed
    layout: |
      #####
      ##@##
      ##A##
      ##B##
      ##C##
      #####
    expected_trace:
      - input: down
        events: [portal_enter, portal_exit_blocked, portal_fallback_failed]
    expected_events: [portal_exit_blocked, portal_fallback_failed]
    design_notes: >
      The paired exit is blocked by a crate, but A cannot move because B is
      directly in its push destination.
    analysis:
      proof_status: candidate_fixture

  - id: L18
    title: Very Long Doorway
    win:
      type: player_on_goal
    layout: |
      ############
      #@ A   G   #
      ###BC#######
      ############
    expected_events: [portal_exit_blocked, portal_fallback_push]
    design_notes: >
      A longer corridor that requires repeated fallback pushes before the
      player can walk to the goal.
    analysis:
      proof_status: candidate_fixture

  - id: L19
    title: Three Push Jam
    win:
      type: event_occurs
      event: portal_fallback_failed
    layout: |
      ############
      #@ A  #    #
      ###BC#######
      ############
    expected_events: [portal_fallback_push, portal_fallback_failed]
    expected_trace:
      - input: right
        events: [walk]
      - input: right
        events: [portal_enter, portal_exit_blocked, portal_fallback_push]
      - input: right
        events: [walk]
      - input: down
        events: [portal_enter, portal_exit_blocked, portal_fallback_failed]
    design_notes: >
      The entrance portal can move several times before reaching a wall and
      demonstrating the fallback failure condition.
    analysis:
      proof_status: candidate_fixture

  - id: L20
    title: Wide Build
    win:
      type: event_occurs
      event: portal_fallback_push
    layout: |
      ##############
      #            #
      #  @ A       #
      #     C      #
      #    B       #
      #            #
      ##############
    expected_events: [pull_crate, portal_exit_blocked, portal_fallback_push]
    design_notes: >
      A wider version of Build The Block. The extra space gives the player
      room to see that the crate must become the portal exit blocker.
    analysis:
      proof_status: candidate_fixture
