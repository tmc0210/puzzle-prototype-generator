levels:
  - id: RA_CURR_2026_07_05_L01_INTRO_PUSH_v1
    title: Intro push v1
    role: mechanic_witness
    status: candidate
    targets: [K_runtime_smoke]
    known_before: []
    target_learning: [K_runtime_smoke]
    support_level: high
    expected_solver_evidence: [solvable, player_win_standard, expected_trace_replays, full_graph_complete]
    expected_llm_player_evidence: []
    layout: |-
      ######
      #@.CG#
      ######
    design_notes: >
      Curriculum slot 1 intro witness. No anchors and no material mechanics: the
      player walks once, then pushes one crate onto one target. Solver evidence
      gives a 2-step shortest solution and complete graph; event probe proves every
      win path requires push_object. Independent evidence reviewer returned
      supports_claim / required_action:none; independent puzzle critic returned
      proposal_ready_with_caveats / required_action:none for first-slot role fit.
      Caveat: this is only an intro witness, not a depth-bearing puzzle.
    expected_trace:
      - input: right
        events: [walk]
      - input: right
        events: [push_object]

  - id: RA_CURR_2026_07_05_L02_FIXED_PL_PUSH_PULL_v1
    title: Fixed P/L push-pull v1
    role: mechanic_witness
    status: candidate
    targets: [K_runtime_smoke]
    known_before: [K_runtime_smoke]
    target_learning: [K_runtime_smoke]
    support_level: high
    expected_solver_evidence: [solvable, player_win_standard, expected_trace_replays, full_graph_complete]
    expected_llm_player_evidence: []
    layout: |-
      ########
      #@CG####
      #...#P##
      #...#L##
      #.CG.###
      ########
    design_notes: >
      Curriculum slot 2 fixed P/L teaching witness. P/L is sealed in a wall pocket:
      complete reachable event scan reports no anchor shift or material events. The
      top mini-task requires push_object; the bottom mini-task requires pull_object
      after the player stands on the lower goal. Complete event probes prove every
      win path requires both push and pull. Goal-deletion counterfactuals show the
      upper target is the push witness and the lower target is the pull witness.
      Independent evidence reviewer returned supports_claim / required_action:none;
      independent puzzle critic returned proposal_ready_with_caveats /
      required_action:none. Caveat: this is a two-witness teaching level, not a
      depth-bearing puzzle; the lower crate has non-winning push affordances, but
      every win still requires pull.
    expected_trace:
      - input: right
        events: [push_object]
      - input: down
      - input: down
      - input: right
      - input: down
      - input: right
        events: [pull_object]

  - id: RA_CURR_2026_07_05_L03_FIXED_PL_HANDOFF_v1
    title: Fixed P/L handoff v1
    role: mechanic_witness
    status: candidate
    targets: [K_runtime_smoke]
    known_before: [K_runtime_smoke]
    target_learning: [K_runtime_smoke]
    support_level: medium
    expected_solver_evidence: [solvable, player_win_standard, expected_trace_replays, full_graph_complete]
    expected_llm_player_evidence: []
    layout: |-
      ########
      ########
      #@C.#P##
      #..G#L##
      #.....##
      ########
    design_notes: >
      Curriculum slot 3 fixed P/L application. A single crate and single target
      form a push-to-pull handoff: the crate must first be pushed into alignment
      above the goal, then pulled from the pull side to cover it. Complete event
      probes prove every win path requires both push_object and pull_object; because
      the layout has exactly one crate, the returned push/pull events are the same
      crate. Complete reachable scan reports no anchor shift or material events.
      Independent evidence reviewer returned supports_claim / required_action:none;
      independent puzzle critic returned proposal_ready_with_caveats /
      required_action:none. Caveat: intentionally short early application witness,
      not a challenge-depth puzzle; wall-pocketed P/L is functional rather than
      aesthetic centerpiece.
    expected_trace:
      - input: right
        events: [push_object]
      - input: down
      - input: right
      - input: down
        events: [pull_object]

