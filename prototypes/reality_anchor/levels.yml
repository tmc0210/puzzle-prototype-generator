      The compact claim is a fixed P/L chain extract into fixed B/S material bind:
      the shortest route uses two consecutive P-side chain pushes, leaves a
      residual crate covering the left target, converts the chain-end crate into
      sticky material, merges it with the waiting M, then uses an L-side pull to
      move the merged sticky vertical body so the lower waiting sticky cell covers
      the lower target. Full graph analysis is complete: shortest cost 9, 68
      reachable states, 130 legal transitions, and 1 winning state. Event-count
      probes prove every win requires push_object >= 2, force_chain >= 1,
      pull_object >= 1, box_to_sticky >= 1, sticky_merge >= 1, and
      move_sticky_rigid >= 1; force_chain >= 2 is only an intended-shortest-route
      fact because a 21-step alternate uses one force_chain. Fixed-anchor scans
      report no reachable P/L or B/S anchor shift. Goal-prune checks retain both
      targets: removing the left target admits a one-push shortest win, while
      removing the lower target collapses the puzzle to 2 steps and bypasses
      pull, material bind, and sticky-rigid movement. Opening comfort and
      redundant-element prune were completed for this exact v6. Independent
      evidence review_2 returned supports_with_caveats / required_action:none;
      independent puzzle critic review_2 returned proposal_ready_with_caveats /
      required_action:none, supporting aesthetic 4 floor and difficulty 3 floor,
      but not 5/4. 2026-07-11 human playtest marked this candidate as reject
      without additional comment; removed from playable and not entered as a
