mechanic: reality_anchor
levels:
  - id: RA_CURR_2026_07_05_L01_INTRO_PUSH_v1
    title: Intro push v1
    role: mechanic_witness
    status: accepted
    targets: [K_runtime_smoke]
    known_before: []
    target_learning: [K_runtime_smoke]
    support_level: high
    expected_solver_evidence: [solvable, player_win_standard, expected_trace_replays, full_graph_complete]
    expected_llm_player_evidence: []
    layout: |-
      ######
      #@.CG#
      ######
    design_notes: >
      Curriculum slot 1 intro witness. No anchors and no material mechanics: the
      player walks once, then pushes one crate onto one target. Solver evidence
      gives a 2-step shortest solution and complete graph; event probe proves every
      win path requires push_object. Independent evidence reviewer returned
      supports_claim / required_action:none; independent puzzle critic returned
      proposal_ready_with_caveats / required_action:none for first-slot role fit.
      Caveat: this is only an intro witness, not a depth-bearing puzzle. 2026-07-04
      human playtest accepted it as RA_CAND_0007, aesthetic 2 / difficulty 1:
      the most basic no-anchor teaching level.
    expected_trace:
      - input: right
        events: [walk]
      - input: right
        events: [push_object]

  - id: RA_CURR_2026_07_05_L02_FIXED_PL_PUSH_PULL_v1
    title: Fixed P/L push-pull v1
    role: mechanic_witness
    status: rejected
    targets: [K_runtime_smoke]
    known_before: [K_runtime_smoke]
    target_learning: [K_runtime_smoke]
    support_level: high
    expected_solver_evidence: [solvable, player_win_standard, expected_trace_replays, full_graph_complete]
    expected_llm_player_evidence: []
    layout: |-
      ########
      #@CG####
      #...#P##
      #...#L##
      #.CG.###
      ########
    design_notes: >
      Curriculum slot 2 fixed P/L teaching witness. P/L is sealed in a wall pocket:
      complete reachable event scan reports no anchor shift or material events. The
      top mini-task requires push_object; the bottom mini-task requires pull_object
      after the player stands on the lower goal. Complete event probes prove every
      win path requires both push and pull. Goal-deletion counterfactuals show the
      upper target is the push witness and the lower target is the pull witness.
      Independent evidence reviewer returned supports_claim / required_action:none;
      independent puzzle critic returned proposal_ready_with_caveats /
      required_action:none. Caveat: this is a two-witness teaching level, not a
      depth-bearing puzzle; the lower crate has non-winning push affordances, but
      every win still requires pull. 2026-07-04 human playtest rejected the lower
      affordance shape for this slot: players can first try pushing from the left
      and receive no feedback before learning pull. Superseded by v2.
    expected_trace:
      - input: right
        events: [push_object]
      - input: down
      - input: down
      - input: right
      - input: down
      - input: right
        events: [pull_object]

  - id: RA_CURR_2026_07_05_L02_FIXED_PL_PUSH_PULL_v2
    title: Fixed P/L push-pull v2
    role: mechanic_witness
    status: accepted
    targets: [K_runtime_smoke]
    known_before: [K_runtime_smoke]
    target_learning: [K_runtime_smoke]
    support_level: high
    expected_solver_evidence: [solvable, player_win_standard, expected_trace_replays, full_graph_complete]
    expected_llm_player_evidence: []
    layout: |-
      ########
      #@CG####
      #...#P##
      ###.#L##
      #C.G.###
      ########
    design_notes: >
      Human-feedback revision of L02 v1. The upper push witness is unchanged. The
      lower crate is moved one cell left, and the cells above / upper-right of it
      are sealed so the player is guided to stand on the right and learn pull-side
      movement directly. The returned solution uses one upper push followed by two
      consecutive rightward pulls on the lower crate. Complete graph analysis is
      51 states; push/pull required probe is complete with no missing-event bypass;
      pull-count probe is complete with no win below two pull events. Reachable scan
      reports no P/L shift or material events. Independent review_2 evidence
      reviewer and puzzle critic both returned proposal_ready_with_caveats /
      required_action:none. Caveat: this is a low-depth teaching witness, not a
      challenge puzzle. 2026-07-04 human playtest accepted it as RA_CAND_0008,
      aesthetic 2 / difficulty 1: simple push/pull anchor introduction.
    expected_trace:
      - input: right
        events: [push_object]
      - input: down
      - input: right
      - input: down
      - input: down
      - input: left
      - input: right
        events: [pull_object]
      - input: right
        events: [pull_object]

  - id: RA_CURR_2026_07_05_L03_FIXED_PL_HANDOFF_v1
    title: Fixed P/L handoff v1
    role: mechanic_witness
    status: rejected
    targets: [K_runtime_smoke]
    known_before: [K_runtime_smoke]
    target_learning: [K_runtime_smoke]
    support_level: medium
    expected_solver_evidence: [solvable, player_win_standard, expected_trace_replays, full_graph_complete]
    expected_llm_player_evidence: []
    layout: |-
      ########
      ########
      #@C.#P##
      #..G#L##
      #.....##
      ########
    design_notes: >
      Curriculum slot 3 fixed P/L application. A single crate and single target
      form a push-to-pull handoff: the crate must first be pushed into alignment
      above the goal, then pulled from the pull side to cover it. Complete event
      probes prove every win path requires both push_object and pull_object; because
      the layout has exactly one crate, the returned push/pull events are the same
      crate. Complete reachable scan reports no anchor shift or material events.
      Independent evidence reviewer returned supports_claim / required_action:none;
      independent puzzle critic returned proposal_ready_with_caveats /
      required_action:none. Caveat: intentionally short early application witness,
      not a challenge-depth puzzle; wall-pocketed P/L is functional rather than
      aesthetic centerpiece. 2026-07-04 human playtest found two effective moves
      too small and asked for a slightly larger same-crate push/pull familiarization
      exercise. Superseded by v2.
    expected_trace:
      - input: right
        events: [push_object]
      - input: down
      - input: right
      - input: down
        events: [pull_object]

  - id: RA_CURR_2026_07_05_L03_FIXED_PL_HANDOFF_v2
    title: Fixed P/L handoff v2
    role: mechanic_witness
    status: accepted
    targets: [K_runtime_smoke]
    known_before: [K_runtime_smoke]
    target_learning: [K_runtime_smoke]
    support_level: medium
    expected_solver_evidence: [solvable, player_win_standard, expected_trace_replays, full_graph_complete]
    expected_llm_player_evidence: []
    layout: |-
      #########
      #########
      #@C..#P##
      #....#L##
      #.##G####
      #....####
      #########
    design_notes: >
      Human-feedback revision of L03 v1. The same crate is pushed right twice on
      the push side, then pulled down twice on the pull side to cover the target.
      A wall left of the target blocks the earlier one-pull-then-return-to-push
      bypass found by the count probe. Complete graph analysis is 130 states; the
      returned solution is 6 steps with two push_object and two pull_object events.
      Push/pull required probe, push-count probe, and pull-count probe are all
      complete with no missing-event or below-count winning bypass. Reachable scan
      reports no P/L shift or material events. Independent review_2 evidence
      reviewer and puzzle critic both returned proposal_ready_with_caveats /
      required_action:none before the micro wall tweak. Post-tweak review_3 evidence
      reviewer returned supports_with_caveats / required_action:none; puzzle critic
      returned supports_design_claim / required_action:none. Caveat: this remains
      early operation familiarization,
      not a challenge-depth puzzle. 2026-07-04 human playtest first accepted it as
      RA_CAND_0009, aesthetic 2 / difficulty 2: simple push/pull application; a
      follow-up human note flagged the opening down-right-down lower-left dead end
      as too long for slot 3, so one lower-left cell was walled off without changing
      the 6-step push/pull handoff solution.
    expected_trace:
      - input: right
        events: [push_object]
      - input: right
        events: [push_object]
      - input: down
      - input: right
      - input: down
        events: [pull_object]
      - input: down
        events: [pull_object]

  - id: RA_CURR_2026_07_05_L04_MOVABLE_PL_TIMING_v1
    title: Movable P/L timing v1
    role: challenge
    status: accepted
    targets: [K_runtime_smoke]
    known_before: [K_runtime_smoke]
    target_learning: [K_runtime_smoke]
    support_level: medium
    expected_solver_evidence: [solvable, player_win_standard, expected_trace_replays, full_graph_complete]
    expected_llm_player_evidence: []
    layout: |-
      #########
      #..PL...#
      #.G..@C.#
      #########
    design_notes: >
      Curriculum slot 4 movable P/L timing candidate. The shortest witness first
      pulls the only crate left, then pushes the movable P/L anchor three cells to
      shift the push/pull boundary, then pushes the same crate onto the target.
      Complete graph analysis reports a 10-step shortest solution over 124 states.
      An order scan reports no winning path with anchor shift before any crate
      event, so the anchor movement is not an opening move. Instance-level event
      probes prove all wins require pull_object:crate#1, push_object:crate#1, and
      anchor_boundary_shift:push_pull. Reachable scan reports no material events.
      Independent evidence review_2 returned supports_with_caveats /
      required_action:none; independent puzzle critic returned
      proposal_ready_with_caveats / required_action:none. Caveat: the evidence
      proves required event existence, not a unique route or exact event counts;
      the anchor movement is a repeated three-step boundary sweep. 2026-07-04
      human playtest accepted it as RA_CAND_0010, aesthetic 3 / difficulty 2:
      simple structure with clear logic.
    expected_trace:
      - input: left
        events: [pull_object]
      - input: left
        events: [pull_object]
      - input: left
      - input: up
      - input: right
        events: [push_object, anchor_boundary_shift]
      - input: right
        events: [push_object, anchor_boundary_shift]
      - input: right
        events: [push_object, anchor_boundary_shift]
      - input: down
      - input: left
        events: [push_object]
      - input: left
        events: [push_object]

  - id: RA_CURR_2026_07_05_L05_LONG_EDGE_PL_v1
    title: Long-edge P/L relay v1
    role: challenge
    status: rejected
    targets: [K_runtime_smoke]
    known_before: [K_runtime_smoke]
    target_learning: [K_runtime_smoke]
    support_level: medium
    expected_solver_evidence: [solvable, player_win_standard, expected_trace_replays, full_graph_complete]
    expected_llm_player_evidence: []
    layout: |-
      ##########
      #PL@G#####
      #........#
      #.CG#.CG.#
      ##########
    design_notes: >
      Curriculum slot 5 P/L long-edge relay candidate. The shortest witness first
      pulls the horizontal P/L anchor right from its L side, then loops to its P
      side and pushes the same anchor right again so the anchor covers the upper
      target. The lower row then requires ordinary crate push on the left target
      and ordinary crate pull on the right target. Complete analysis reports a
      19-step shortest solution over 243 reachable states. Instance-level event
      probe proves every win requires pull_object:push_pull_anchor,
      push_object:push_pull_anchor, push_object:crate#1, and pull_object:crate#2.
      Direction-aware probe further proves every win requires the anchor pull and
      anchor push to move the P/L anchor horizontally right, i.e. along the long
      edge in the same direction. Goal-prune counterfactuals keep all three
      targets: deleting the top target bypasses the P/L pull/push, deleting the
      left lower target bypasses crate push, and deleting the right lower target
      bypasses crate pull. Independent evidence reviewer returned
      supports_with_caveats / required_action:none; independent puzzle critic
      returned proposal_ready_with_caveats / required_action:none. Caveat:
      vertical P/L movement is reachable in non-winning exploration, so this
      candidate should be described as requiring horizontal same-direction
      long-edge P/L pull and push in winning paths, not as fully forbidding
      vertical P/L interactions. 2026-07-04 human playtest rejected this version
      for weak causal coupling: the top P/L task, left push, and right pull read
      as a stitched checklist, especially the right pull. Superseded by v2.
    expected_trace:
      - input: right
        events: [pull_object, anchor_boundary_shift]
      - input: down
      - input: left
      - input: left
      - input: left
      - input: up
      - input: right
        events: [push_object, anchor_boundary_shift]
      - input: down
      - input: left
      - input: down
      - input: right
        events: [push_object]
      - input: up
      - input: right
      - input: right
      - input: right
      - input: right
      - input: right
      - input: down
      - input: right
        events: [pull_object]

  - id: RA_CURR_2026_07_05_L05_LONG_EDGE_PL_v2
    title: Long-edge P/L relay v2
    role: challenge
    status: rejected
    targets: [K_runtime_smoke]
    known_before: [K_runtime_smoke]
    target_learning: [K_runtime_smoke]
    support_level: medium
    expected_solver_evidence: [solvable, player_win_standard, expected_trace_replays, full_graph_complete]
    expected_llm_player_evidence: []
    layout: |-
      ###########
      #PL@G######
      #.##.....##
      #.#CG....##
      #.CG#....##
      #........##
      ###########
    design_notes: >
      Human-feedback revision of L05 v1. The ordinary crate pull is no longer a
      right-side add-on target: the middle crate must be pulled right to open the
      lower loop that reaches the left side. The player then pushes the lower
      crate onto its target and returns to the P side to push the same horizontal
      P/L anchor right onto the top target. Complete graph analysis reports a
      17-step witness over 4331 reachable states. Direction-aware event probe is
      complete with no winning bypass missing anchor_pull_right, anchor_push_right,
      crate_pull, or crate_push. Anchor shift count probe is complete with no win
      below two P/L shifts. Goal-prune counterfactuals retain all three targets:
      deleting the top target bypasses anchor_push_right, deleting the middle
      target bypasses ordinary crate push/pull responsibilities, and deleting the
      lower target bypasses crate_push. This version intentionally keeps the
      middle target to prevent the pulled gate crate from replacing the lower
      push crate. 2026-07-04 human playtest rejected the opening fixed P/L pull:
      the P/L timing should be an active middle-step inference, not first-step
      execution or final-only tag. Superseded by v3.
    expected_trace:
      - input: right
        events: [pull_object, anchor_boundary_shift]
      - input: down
      - input: down
      - input: right
        events: [pull_object]
      - input: down
      - input: down
      - input: left
      - input: left
      - input: left
      - input: left
      - input: up
      - input: right
        events: [push_object]
      - input: left
      - input: up
      - input: up
      - input: up
      - input: right
        events: [push_object, anchor_boundary_shift]

  - id: RA_CURR_2026_07_05_L05_LONG_EDGE_PL_v3
    title: Long-edge P/L relay v3
    role: challenge
    status: rejected
    targets: [K_runtime_smoke]
    known_before: [K_runtime_smoke]
    target_learning: [K_runtime_smoke]
    support_level: medium
    expected_solver_evidence: [solvable, player_win_standard, expected_trace_replays, full_graph_complete]
    expected_llm_player_evidence: []
    layout: |-
      ###########
      #PL.G######
      #.##C....##
      #.#..#...##
      #...CG#..##
      #....#.@.##
      ###########
    design_notes: >
      Human-feedback revision of L05 v2. The P/L anchor is no longer touched on
      the first move: the opening ordinary crate pull sequence creates a space
      debt that lets the player reach the top P/L area. The P/L right pull occurs
      in the middle of the route, the lower crate is then pulled into a temporary
      position, and the P/L right push changes the boundary before the lower crate
      is finally pushed onto its target. Complete graph analysis reports a 34-step
      shortest solution over 1203 reachable states. Direction-aware event probe is
      complete with no winning bypass missing anchor_pull_right, anchor_push_right,
      crate_pull, or crate_push; anchor shift count probe is complete with no win
      below two P/L shifts. Caveat: this version deliberately fixes the P/L timing
      issue but is longer and more crate-pull heavy, so critic should attack route
      length and whether the early crate manipulation reads as setup rather than
      padding. Independent review_3 evidence reviewer returned
      supports_with_caveats / required_action:none, but puzzle critic returned
      revise_required / structural_revision: the 34-step route and five early
      crate#1 pulls read too much like route tax before the P/L insight. Removed
      from playable pending a deeper v4 redesign.
    expected_trace:
      - input: up
      - input: up
      - input: up
      - input: left
      - input: left
      - input: right
        events: [pull_object]
      - input: right
        events: [pull_object]
      - input: right
        events: [pull_object]
      - input: down
      - input: left
      - input: left
      - input: up
      - input: left
        events: [pull_object]
      - input: left
        events: [pull_object]
      - input: up
      - input: left
      - input: right
        events: [pull_object, anchor_boundary_shift]
      - input: down
      - input: down
      - input: left
      - input: down
      - input: left
        events: [pull_object]
      - input: left
      - input: up
      - input: up
      - input: up
      - input: right
        events: [push_object, anchor_boundary_shift]
      - input: left
      - input: down
      - input: down
      - input: down
      - input: right
      - input: right
        events: [push_object]
      - input: right
        events: [push_object]

  - id: RA_CURR_2026_07_05_L05_LONG_EDGE_PL_v4
    title: Long-edge P/L relay v4
    role: challenge
    status: candidate
    targets: [K_runtime_smoke]
    known_before: [K_runtime_smoke]
    target_learning: [K_runtime_smoke]
    support_level: medium
    expected_solver_evidence: [solvable, player_win_standard, expected_trace_replays, full_graph_complete]
    expected_llm_player_evidence: []
    layout: |-
      #########
      #PL..G###
      #.#..####
      #.##C@G##
      #......##
      #########
    design_notes: >
      Human-feedback and critic-driven revision of L05 v3. The opening ordinary
      crate pull is compressed to one high-responsibility move: it opens the
      route into the upper P/L corridor and prepositions the same crate beside
      the lower target. The P/L anchor is then handled in the middle of the
      route, first by a right pull from the L side and then by two right pushes
      from the P side. This three-step boundary shift makes the previously
      prepositioned crate finishable from the left, so the final ordinary-crate
      push recovers the opening move instead of acting as a stitched add-on.
      Complete graph analysis reports a 24-step shortest solution over 85
      reachable states. Direction-aware event probe is complete with no winning
      bypass missing anchor_pull_right, anchor_push_right, crate_pull, or
      crate_push; anchor shift count probe is complete with no win below three
      P/L boundary shifts. Independent evidence review returned pass, and
      independent puzzle critic returned accept. Caveat: the level is strongly
      guided and the second consecutive P/L right push is more reinforcement
      than a new insight, but that is acceptable for the fifth curriculum slot.
      Pending human playtest; not archived yet.
    expected_trace:
      - input: right
        events: [pull_object]
      - input: down
      - input: left
      - input: left
      - input: up
      - input: up
      - input: up
      - input: left
      - input: right
        events: [pull_object, anchor_boundary_shift]
      - input: down
      - input: down
      - input: down
      - input: left
      - input: left
      - input: left
      - input: up
      - input: up
      - input: up
      - input: right
        events: [push_object, anchor_boundary_shift]
      - input: right
        events: [push_object, anchor_boundary_shift]
      - input: down
      - input: right
      - input: down
      - input: right
        events: [push_object]

  - id: RA_CURR_2026_07_05_L06_MULTI_AXIS_PL_v1
    title: Multi-axis P/L relay v1
    role: challenge
    status: rejected
    targets: [K_runtime_smoke]
    known_before: [K_runtime_smoke]
    target_learning: [K_runtime_smoke]
    support_level: medium
    expected_solver_evidence: [solvable, player_win_standard, expected_trace_replays, full_graph_complete]
    expected_llm_player_evidence: []
    layout: |-
      ##########
      #PL@.#####
      #..GG#...#
      #.CG#.CG.#
      #........#
      ##########
    design_notes: >
      Curriculum slot 6 multi-axis P/L application candidate. The shortest witness
      uses three required P/L direction-action groups: vertical down pull,
      horizontal right pull, and horizontal right push. It also requires ordinary
      left-crate push and right-crate pull. Complete analysis reports a 31-step
      shortest solution over 9028 reachable states. Instance-level event probe
      proves all wins require anchor pull, anchor push, push_object:crate#1, and
      pull_object:crate#2. Direction-aware probe proves all wins require
      anchor_pull_down, anchor_pull_right, anchor_push_right, left_crate_push, and
      right_crate_pull. Goal-prune counterfactuals keep all four targets: deleting
      either upper target releases a missing-anchor_push_right win, while deleting
      either lower target lowers cost and releases a missing right_crate_pull win.
      Independent evidence reviewer returned supports_with_caveats /
      required_action:none; independent puzzle critic returned
      proposal_ready_with_caveats / required_action:none. Caveats: the left crate
      is pushed onto its target, pulled back to reopen access, and pushed back
      later, which may feel like functional rework; the visual skeleton is close
      to L05, though this candidate adds vertical P/L routing and upper double
      target pressure. Do not claim unique ordering or that only the three
      required P/L shift directions are reachable. 2026-07-04 human playtest
      praised the left-side push/pull-back/re-push contradiction but rejected the
      right side as stitched-on extra space. Superseded by v2.
    expected_trace:
      - input: down
      - input: left
      - input: left
      - input: down
      - input: right
        events: [push_object]
      - input: up
      - input: down
        events: [pull_object, anchor_boundary_shift]
      - input: left
        events: [pull_object]
      - input: down
      - input: right
      - input: right
      - input: up
      - input: up
      - input: right
        events: [pull_object, anchor_boundary_shift]
      - input: up
      - input: left
      - input: left
      - input: left
      - input: down
      - input: right
        events: [push_object, anchor_boundary_shift]
      - input: left
      - input: down
      - input: right
        events: [push_object]
      - input: down
      - input: right
      - input: right
      - input: right
      - input: right
      - input: right
      - input: up
      - input: right
        events: [pull_object]

  - id: RA_CURR_2026_07_05_L06_MULTI_AXIS_PL_v2
