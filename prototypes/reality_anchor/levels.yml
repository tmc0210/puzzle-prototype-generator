      - input: right
        events: [push_object, box_to_sticky]
      - input: right
        events: [push_object, move_sticky_rigid]
      - input: right
        events: [push_object, move_sticky_rigid]

  - id: RA_CURR_2026_07_05_L10_MOVABLE_BS_TIMED_JOIN_CUT_v2
    title: Movable B/S timed join-cut v2
    layout: |-
      #########
      #.....#.#
      #..BS#G.#
      ##.M.MM.#
      #M@#....#
      #########
    design_notes: >
      Human-feedback revision of L10 v1. This candidate keeps the slot constraints:
      no P/L, movable B/S, and real box/sticky conversion. Unlike v1, the player
      cannot win by opening with B/S movement: an order probe is complete with no
      win where B/S shifts before any sticky_merge. The returned 13-step witness
      first pushes a crate into S side to trigger box_to_sticky and sticky_merge,
      then uses B/S twice: once to move into the upper channel and once to trigger
      sticky_to_box, cutting a sticky cell back into a crate. The cut crate is then
      pushed down, and the remaining sticky pair is moved onto the target. Complete
      analysis reports 221 reachable states; the core event probe proves all wins
      require B/S shift, box_to_sticky, sticky_merge, sticky_to_box, sticky rigid
      movement, and crate push. A count probe proves all wins require at least two
      B/S shifts; reachable scan reports no P/L hit. Single target, so invalid
      goal prune is skipped. Independent evidence reviewer returned supports_claim
      / required_action:none; independent puzzle critic returned
      supports_with_noncore_caveats / required_action:none. Caveat: the win chain
      remains strongly forced and close to the L11 boundary, but it directly fixes
      the rejected v1 issue that B/S was only an opening button. 2026-07-04 human
      playtest rejected this version for large redundant space, a redundant left
      crate, and redundant upper-right space. Superseded by v3.
    expected_trace:
      - input: up
      - input: right
        events: [push_object, box_to_sticky, sticky_merge]
      - input: up
        events: [push_object, anchor_boundary_shift]
      - input: left
      - input: up
      - input: right
        events: [push_object, anchor_boundary_shift, sticky_to_box]
      - input: down
      - input: right
      - input: down
        events: [push_object]
      - input: right
        events: [push_object, move_sticky_rigid]

