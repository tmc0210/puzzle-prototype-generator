      preserving the left-side contradiction the human liked: the only crate is
      first pushed onto the lower target, then pulled back out to reopen routing,
      and finally pushed back onto the target after the P/L anchor has been moved.
      The compact layout still requires three P/L direction-action groups
      (anchor_pull_down, anchor_pull_right, anchor_push_right) plus ordinary
      crate_pull and crate_push. Complete graph analysis reports a 23-step
      shortest solution over 945 reachable states. Direction-aware event probe is
      complete with no winning bypass missing anchor_pull_down, anchor_pull_right,
      anchor_push_right, crate_pull, or crate_push. The P/L movements occur in the
      middle of the route rather than as a final-only tag, and the last win action
      returns to the ordinary crate push. Independent review_2 evidence reviewer
      returned supports_with_caveats / required_action:none; puzzle critic returned
      supports_design_claim / required_action:none. Human playtest later accepted
      it as a compact strong-logic level, aesthetic 4 / difficulty 4; archived
      as RA_CAND_0011.
    expected_trace:
      - input: down
      - input: left
      - input: left
      - input: down
      - input: right
        events: [push_object]
      - input: up
      - input: down
        events: [pull_object, anchor_boundary_shift]
      - input: left
        events: [pull_object]
      - input: down
      - input: right
      - input: right
      - input: up
      - input: up
      - input: right
        events: [pull_object, anchor_boundary_shift]
      - input: up
      - input: left
      - input: left
      - input: left
