    design_notes: >
      Human-feedback revision of RA_LEX_2026_07_06_VACATE_BIND_RETURN_v1. The
      far-right activity column, containing the right-upper sticky and the space
      above it, is removed. Complete analysis keeps the same 27-step witness while
      reducing the graph from 691 reachable states / 1517 legal transitions to
      449 / 975. Complete core7 probe still proves all wins require P/L shift,
      B/S shift, pull, box_to_sticky, sticky_to_box, sticky rigid movement, and
      sticky_merge. Target-vacate probe still proves top_goal [3,1] must go
      covered -> uncovered -> covered before win. Local variants that also moved
      the start left by deleting or shifting the top-row sticky handle were
      complete no-win graphs, so this v2 performs the safe structural deletion
      without overclaiming that the start can be locally left-shifted. Superseded
      by v3, which keeps this trimmed structure but moves the start within the
      same initial SCC to remove the first-step object-push affordance.
