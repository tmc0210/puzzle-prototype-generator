    design_notes: >
      Fresh challenge candidate from the allowed Reality Anchor lexicon, not an
      archive variant. Design corpus used:
      prototypes/reality_anchor/mechanism_lab/lexicon.md; excluded source:
      prototypes/reality_anchor/mechanism_lab/runs/. Earlier same-turn attempts
      RA_FRESH_2026_07_08_PULL_BRUSH_TAIL_v1,
      RA_FRESH_2026_07_08_PULL_BRUSH_TAIL_v2, and
      RA_FRESH_2026_07_08_PULL_BRUSH_RETURN_v3 were superseded before queue
      submission. The core idea combines a B/S moving-boundary brush with a later
      P/L anchor return. The lower target consumes the first brush-tail material
      cut; the upper target prevents early finish and forces P/L anchor
      migration. Full explain-layout with 300k graph budget is complete:
      shortest cost 34, 104786 reachable states / 247141 legal transitions /
      670 winning states. Core6 probe is complete/no bypass for pull_object,
      anchor_boundary_shift:box_sticky, force_chain, move_sticky_rigid,
      sticky_to_box, and anchor_boundary_shift:push_pull. Count probes prove at
      least two B/S shifts and at least two P/L shifts are required; a negative
      B/S>=4 probe found a 68-step win with only two B/S shifts, so no stronger
      B/S count claim is made. Goal-prune checks retain both targets: deleting
      the upper target drops the shortest cost to 9 and bypasses pl_shift;
      deleting the lower target drops the shortest cost to 8 and bypasses
      material_cut plus pl_shift. Opening comfort is tight but acceptable for a
      challenge: first irreversible win-reaching exit distance is 2 and the
      first legal input is only walk. Redundant-element prune trimmed v3's pure
      outer wall columns into this v4 layout. Independent evidence reviewer and
      puzzle critic both returned proposal_ready_with_caveats /
      required_action:none for v4. Critic posture was aesthetic >=4 low pass,
      difficulty >=3 pass, not a 5-point compact benchmark, but 2026-07-08
      human playtest overrides that posture and archives the level as
      RA_CAND_0024 negative example, aesthetic 1 / difficulty 3. The human
      verdict is that three sticky cells and two movable anchors promise richer
      cut/splice, long-chain pushing, or sticky-geometry use, while actual play
      is mostly push/pull maneuvering without enough player insight. Do not
      return this level to the playable queue as a positive candidate. Evidence:
