      #S.....#
      ###M.G.#
      ########
    design_notes: >
      Curriculum slot 8 fixed B/S joining candidate. There is no P/L anchor; B/S
      is fixed and defines a horizontal box/sticky split. The first move pushes a
      crate from box side into sticky side, converting it with box_to_sticky and
      immediately joining it to the lower sticky cell. The new upper sticky cell
      then becomes the only usable handle for pushing the merged rigid body right
      until the lower cell covers the target. Complete analysis reports a 5-step
      shortest solution over 186 reachable states. Complete event probe proves all
      wins require box_to_sticky, sticky_merge, and move_sticky_rigid; reachable
      scan reports no P/L shift, no B/S shift, no sticky_to_box, and no split.
      Goal-prune is skipped because this is a single-target level. Independent
      evidence reviewer returned supports_claim / required_action:none;
      independent puzzle critic returned proposal_ready_with_caveats /
      required_action:none. Caveat: this is a short mechanism witness whose
      conversion and join happen on the first move; it should be treated as a
      fixed-B/S joining demonstration, not a high-density puzzle.
      2026-07-04 human playtest rejected the start placement because the opening
      down move directly enters the correct conversion. Superseded by v2.
