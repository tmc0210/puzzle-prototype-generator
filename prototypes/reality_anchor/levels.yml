  - id: RA_FRESH_2026_07_09_VACATE_MATERIAL_LOCK_v4
    title: Vacate material lock v4
    layout: |-
      #######
      #...G.#
      #L.BS.#
      #P.CM##
      #..CG@#
      #######
    lineage:
      source: fresh_design_review_loop
      created_by: codex
      created_at: "2026-07-09"
    design_notes: >
      Fresh Reality Anchor compact challenge from the 2026-07-09 design-review
      loop. The puzzle is a small P/L-enabled B/S vacate material lock: first
      the B/S anchor is pushed upward so its S end covers the upper target; the
      player then feeds the lower target by pushing a crate into sticky side,
      which requires pulling B/S back down and temporarily vacating the upper
      target; finally B/S is pushed back up to recover the upper target while
      the lower target stays covered by sticky material. Full graph analysis is
      complete: shortest cost 10, 638 reachable states, 1352 legal transitions,
      and 5 winning states. Core event probe is complete with no winning bypass
      missing B/S shift, box_to_sticky, sticky rigid movement, pull, or any
      crate push. Count probes prove every win needs at least three B/S shifts,
      at least one box_to_sticky, at least two sticky rigid moves, and at least
      one pull. Target-vacate probe proves every win requires the upper target
      to be covered, then uncovered, then covered again. Deleting the upper
      target drops the shortest solution to 9 and removes the final recovery;
      deleting the lower target collapses the puzzle to 2 steps. Independent
      evidence review returned supports_with_caveats / required_action:none;
      independent puzzle critic returned supports_with_noncore_caveats /
      required_action:none, but 2026-07-09 human playtest overrides that
      posture and archives the level as RA_CAND_0027 negative example,
      aesthetic 1 / difficulty 2. The human verdict is that affordance is poor:
      P/L is movable but the solution does not need to move it, and sticky can
      stick but the solution does not use sticky geometry. The trace triggers
      material-conversion and sticky-merge labels, but player-facing play does
      not consume any sticky geometric structure, so visible mechanism
      possibilities overpromise the actual insight. Do not return this level to
      the playable queue as a positive candidate. Pre-submission checks retained
      both targets, kept the compact start with caveat, and found no safe
      redundant-element prune. Evidence:
