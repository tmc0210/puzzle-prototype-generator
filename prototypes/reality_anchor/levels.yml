  - id: RA_EXP_2026_07_04_DUAL_LOCKSTEP_v4
    title: Dual lockstep v4
    role: challenge
    status: accepted
    targets: [K_runtime_smoke]
    known_before: [K_runtime_smoke]
    target_learning: [K_runtime_smoke]
    support_level: none
    expected_solver_evidence: [solvable, player_win_standard, expected_trace_replays, full_graph_complete]
    expected_llm_player_evidence: []
    layout: |-
      ###########
      ###.PL.####
      ##@BS.G####
      ###.MM...G#
      #####..####
      ###########
    design_notes: >
      Feedback revision of DUAL_LOCKSTEP_v3. Human playtest liked the stacked-anchor and
      box-chain pressure, but questioned the lower-right M and surrounding empty cells.
      Counterfactuals showed the old lower-right M and isolated lower spaces were removable:
      no-right-box and no-right-box-no-right-space versions remain 19-step solved. However,
      deleting the lower row or keeping either lower buffer cell alone is complete unsolved.
      v4 therefore keeps only the two lower buffer cells actually needed by the down-shifted
      sticky pair, and removes the misleading extra material/space. Event probe is complete
      with no winning bypass missing P/L shift, B/S shift, pull, material normalization,
      sticky_merge, or sticky rigid movement. 2026-07-04 human playtest accepted it as
      RA_CAND_0005, aesthetic 4 / difficulty 4:
      the player-facing contradiction is clear, and constructing the sticky plus anchor
      three-cell chain is an interesting, high-mechanism challenge. 2026-07-04 goal-prune
      audit removed the left of the two adjacent upper targets as redundant: removing either
      single upper target preserves 19-step cost and core-event necessity, but removing both
      creates a 17-step bypass missing pull, so the right upper target is retained.
    expected_trace:
      - input: right
        events: [push_object, anchor_boundary_shift, sticky_to_box]
      - input: down
      - input: right
        events: [push_object, force_chain, move_sticky_rigid, box_to_sticky, sticky_merge]
      - input: left
      - input: up
      - input: up
      - input: right
        events: [push_object, anchor_boundary_shift]
      - input: down
        events: [push_object, force_chain, anchor_boundary_shift, move_sticky_rigid]
      - input: left
      - input: down
      - input: right
        events: [push_object, anchor_boundary_shift, sticky_to_box]
      - input: right
        events: [push_object, anchor_boundary_shift, sticky_to_box]
      - input: right
        events: [push_object, anchor_boundary_shift]
      - input: up
        events: [pull_object]
      - input: left
      - input: down
      - input: right
        events: [push_object, force_chain, anchor_boundary_shift]
      - input: up
      - input: down
        events: [pull_object, anchor_boundary_shift]

  - id: RA_EXP_2026_07_04_FIXED_BS_SIDECAR_FERRY_v2
    title: Fixed B/S sidecar ferry v2
    role: challenge
    status: rejected
    targets: [K_runtime_smoke]
    known_before: [K_runtime_smoke]
    target_learning: [K_runtime_smoke]
    support_level: none
    expected_solver_evidence: [solvable, player_win_standard, expected_trace_replays, full_graph_complete]
    expected_llm_player_evidence: []
    layout: |-
      ###########
      #####SB####
      ####GG#####
      ####M.C...#
      #...#.....#
      #....@PL..#
      ###########
    design_notes: >
      review_2 合格待玩候选，proposal_ready_with_caveats。两个锚点同关，其中 B/S
      被墙腔固定，只作为稳定材料边界；P/L 可移动但只需右推一次，用于把目标下方
      操作点切到 push side。C 从 B 列左推到 S 列时 box_to_sticky，并与侧挂 M
      sticky_merge；左格下方是墙、上方目标室封死，普通箱没有自己的向上施力面，
      只能由右侧把手格作为 sticky 刚体携带上移。固定锚点探针完整证明所有胜路都
      包含 P/L shift、box_to_sticky、sticky_merge 与 sticky rigid movement，且
      B/S 在可达图中无位移。初始普通箱替代版与 post-merge 普通箱替代版均完整无解，
      用于回应“黏性只是多推几步省操作”的失败模式。非核心 caveat：P/L 一次右推
      更像区域切换提示而非独立 aha；B/S 仍可能被读成区域标签；定位为中期过渡关。
      2026-07-04 human playtest allowed keeping it as teaching / mechanism introduction,
      but noted redundant space. v2 is replaced by the compact v3.
    expected_trace:
      - input: right
        events: [push_object, anchor_boundary_shift]
      - input: up
      - input: right
      - input: up
      - input: left
        events: [push_object, box_to_sticky, sticky_merge]
      - input: down
      - input: left
      - input: up
        events: [push_object, move_sticky_rigid]

  - id: RA_EXP_2026_07_04_FIXED_BS_SIDECAR_FERRY_v3
    title: Fixed B/S sidecar ferry v3
    role: challenge
    status: rejected
    targets: [K_runtime_smoke]
    known_before: [K_runtime_smoke]
    target_learning: [K_runtime_smoke]
    support_level: none
    expected_solver_evidence: [solvable, player_win_standard, expected_trace_replays, full_graph_complete]
    expected_llm_player_evidence: []
    layout: |-
      ##########
      #####SB###
      ####GG####
      ####M.C.##
      #...#...##
      #....@PL.#
      ##########
    design_notes: >
      Compact feedback revision of v2 for early/mid transition play. B/S remains fixed in
      a wall chamber and provides the material boundary; P/L shifts right once to let the
      player reach the upper work face. C is pushed left through the fixed B/S boundary,
      triggers box_to_sticky, sticky_merge with the side M, and then the merged sticky pair
      is moved upward onto the two targets. Initial ordinary-box and postmerge ordinary-box
      analogs are complete unsolved, so the sticky conversion is structural rather than
