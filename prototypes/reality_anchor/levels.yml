  - id: RA_CURR_2026_07_05_L12_FIXED_PARALLEL_DUAL_JOIN_v1
    title: Fixed parallel dual join v1
    layout: |-
      ###########
      ##..@..####
      #P#.C..#B##
      #L#...G.S##
      ##..M.G.###
      ###########
    design_notes: >
      第十二关槽位候选：两个竖向、互相平行、墙隔离的固定锚点。B/S
      提供材料边界，P/L 提供 pull 区。返回 5 步 witness 先下推 C，
      触发 box_to_sticky 与 sticky_merge，制造竖向二连黏块；随后在
      P/L pull 区连续右拉这个二连结构，使两个目标同时被同一结构覆盖。
      Complete graph 为 887 states / 2256 transitions，最短 5。Core probe
      证明所有胜路都需要 pull_object、box_to_sticky、sticky_merge 与
      move_sticky_rigid。Fixed P/L probe 证明 fixed_push_pull_effect
      complete/no bypass，且 reachable scan 无 anchor_boundary_shift:push_pull；
      fixed B/S probe 证明 fixed_box_sticky_effect、box_to_sticky、sticky_merge
      与 sticky_rigid_move complete/no bypass，且 reachable scan 无
      anchor_boundary_shift:box_sticky。Goal-prune 反事实保留两个目标：删上目标
      释放缺 box_to_sticky / sticky_merge 的胜路，删下目标释放缺 pull /
      sticky_merge / sticky_rigid 的胜路。有效 repo-local skill review：
      evidence reviewer 返回 supports_claim / required_action:none；puzzle critic
      返回 supports_with_noncore_caveats / required_action:none。Caveat：这是
      固定平行双锚点过渡应用关，5 步较短，不应包装成高密度双锚挑战。
      2026-07-05 human feedback rejected it: the level is too simple and has no
      meaningful world-interleaving insight. Sticky material is effectively used as
      a step-saving handle rather than for unique reachability or separation, and
      the P/L anchor does not create a meaningful player-side constraint. Removed
      from playable and to be redesigned.
    expected_trace:
      - input: down
        events: [push_object, box_to_sticky, sticky_merge]
      - input: right
      - input: down
      - input: right
        events: [pull_object, move_sticky_rigid]
      - input: right
        events: [pull_object, move_sticky_rigid]

  - id: RA_CURR_2026_07_05_L13_FIXED_ORTHOGONAL_PULL_CONVERT_v2
    title: Fixed orthogonal pull-convert v2
    layout: |-
      ###########
      ####BS#####
      #P#......##
      #L#.C.G..##
      ###..MG..##
      ###...@..##
      ###########
    design_notes: >
      第十三关槽位候选：P/L 是竖向固定锚点，B/S 是横向固定锚点，
      两者正交且都墙隔离。返回 5 步 witness 中，玩家绕到 C 右侧，
      第一次向右移动在 P/L pull 区拉 C，同时让 C 跨过 B/S 材料边界，
      触发 box_to_sticky 与 sticky_merge，生成竖向二连黏块；第二次
      向右 pull 消费该二连结构并覆盖两个目标。Complete graph 为
      1239 states / 3506 transitions，最短 5。Fixed B/S probe 证明
      fixed_box_sticky_effect、pull_event、box_to_sticky、sticky_merge 与
      sticky_rigid_move 均 complete/no bypass，且 reachable scan 无
      anchor_boundary_shift:box_sticky。Fixed P/L probe 证明 fixed_push_pull_effect
      与 material_normalization complete/no bypass，且 reachable scan 无
      anchor_boundary_shift:push_pull。Goal-prune 反事实保留两个目标：删上目标
      释放 2 步、缺 fixed_box_sticky_effect / box_to_sticky / sticky_merge
      的胜路；删下目标也释放缺这些组的胜路。有效 repo-local skill review：
      evidence reviewer 返回 supports_claim / required_action:none；puzzle critic
      返回 supports_with_noncore_caveats / required_action:none。Caveat：这是
      固定正交双锚点微应用，5 步较短；与 L12 都使用二连黏块覆盖双目标，
      差异在于本关的第一次 P/L pull 同时触发 B/S 转化/合并。
      2026-07-05 human feedback rejected it: the level is too simple and too close
      to L12, with no real insight into the interleaved worlds. Triggering pull and
      material conversion in analysis is not enough; the player can read it as a
      trivial pull sequence rather than a meaningful dual-anchor structure. Removed
      from playable and to be redesigned.
    expected_trace:
      - input: up
      - input: up
      - input: left
      - input: right
        events: [pull_object, box_to_sticky, sticky_merge]
      - input: right
        events: [pull_object, move_sticky_rigid]

