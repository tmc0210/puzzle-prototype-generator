  - id: RA_CURR_2026_07_05_L11_MOVABLE_BS_RELAY_CUT_v1
    title: Movable B/S relay-cut v1
    layout: |-
      #########
      #G.M.#..#
      ##@BS..M#
      #.G.M..M#
      #########
    design_notes: >
      第十一关槽位候选：无 P/L，可推动 B/S，比 L10 v2 更偏 relay-cut
      的双区域结构。运行时初始归一化后，上方 M 显示为 C。返回 10 步
      witness 先推动下方黏块并触发 sticky_merge，再移动 B/S 左移触发
      box_to_sticky，随后推动上方黏块触发 sticky_to_box，最后第二次移动
      B/S 覆盖下方目标。完整分析给出 429 reachable states 的 complete
      graph。core_no_crate probe 证明所有胜路都需要 B/S shift、
      box_to_sticky、sticky_merge、sticky_to_box 和 move_sticky_rigid；
      order probe 证明不存在 B/S 在 sticky_merge 前移动的胜路；count
      probe 证明所有胜路至少两次 B/S shift；reachable scan 证明无 P/L
      命中。goal-prune 反事实保留两个目标：删上目标会释放缺
      sticky_merge / sticky_to_box 的胜路，删下目标会释放缺
      box_to_sticky / sticky_merge / move_sticky_rigid 的短路。独立
      evidence reviewer 返回 supports_claim / required_action:none；独立
      puzzle critic 返回 supports_with_noncore_caveats / required_action:none。
      Caveat：ordinary crate push 不是全胜路必要，不应声称切出的普通箱
      必须被推动；核心主张是拼接、切割、B/S 双位移和黏块移动不可省。
      2026-07-05 human feedback rejected it: the sticky merge / material
      conversion chain is only an event witness. The crate that becomes sticky is
      left in the corner and never later consumed as a meaningful changed object,
      so the player-facing solution is just pushing a box and sticky material
      onto two targets. This does not satisfy the required standard that
      conversions must produce later-used reachability, structural separation, or
      object-role change.
    expected_trace:
      - input: down
      - input: right
      - input: right
        events: [push_object, move_sticky_rigid]
      - input: right
        events: [push_object, move_sticky_rigid, sticky_merge]
      - input: up
      - input: left
        events: [push_object, anchor_boundary_shift, box_to_sticky]
      - input: up
      - input: left
        events: [push_object, move_sticky_rigid, sticky_to_box]
      - input: left
        events: [push_object]
      - input: down
        events: [push_object, anchor_boundary_shift]

  - id: RA_CURR_2026_07_05_L11_MOVABLE_BS_APPLIED_CUT_v1
    title: Movable B/S applied cut v1
    layout: |-
      #########
      ##....###
      ##.BS#G.#
      ##.M.MM.#
      #.@#...##
      ####G####
      #########
    design_notes: >
      第十一关槽位候选：无 P/L，可推动 B/S，并把拼接与切割放进同一条
      后续被消费的因果链。运行时初始归一化后，左侧 M 显示为 C。返回
      15 步 witness 先将 C 推入 S 侧，触发 box_to_sticky 与 sticky_merge
      形成三连；之后才两次推动 B/S，其中第二次触发 sticky_to_box，将左端
      切回普通箱。切出的普通箱随后继续下推两次覆盖下目标，剩余二连黏块
      再作为刚体移动覆盖上目标。Complete graph 为 284 states / 680
      transitions，最短 15。核心 probe complete/no bypass；count probes
      证明所有胜路至少两次 B/S 位移、至少三次 crate#1 推动、至少两次
      sticky rigid movement；order probe 证明不存在 B/S 位移早于 sticky_merge
      的胜路。Goal-prune 反事实保留两个目标：删上目标会释放缺
      sticky_rigid 的胜路，删下目标会释放少于三次 crate#1 推动的胜路。
      有效 repo-local skill review：evidence reviewer 返回
      supports_with_caveats / required_action:none；puzzle critic 返回
      supports_with_noncore_caveats / required_action:none。Caveat：不声明唯一解、
      实例级全路径对象身份、全路径精确事件顺序，也不声明新黏块作为三连刚体
      被后续消费；本关定位为 L11 常规应用关，而非高难亮点关。
      2026-07-05 human feedback rejected it: this version violates the
      fresh_required lineage policy by functioning as a copied/variant structure of
      an existing level, and the player-facing sticky/box changes still do not
      produce a satisfying independent structural insight. Removed from playable
      and to be redesigned from a fresh causal family.
    expected_trace:
      - input: up
      - input: right
        events: [push_object, box_to_sticky, sticky_merge]
      - input: up
        events: [push_object, anchor_boundary_shift]
      - input: left
      - input: up
      - input: right
        events: [push_object, anchor_boundary_shift, sticky_to_box]
