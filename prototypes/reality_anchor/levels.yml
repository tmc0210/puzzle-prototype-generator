      B/S 绑定债、B/S 解绑定债和刚体黏块回返谱系组合成状态责任反转：top_goal
      [3,1] 必须先覆盖、再腾空、最终回填。完整 core7 probe 证明所有胜路都包含
      P/L shift、B/S shift、pull、box_to_sticky、sticky_to_box、sticky rigid movement
