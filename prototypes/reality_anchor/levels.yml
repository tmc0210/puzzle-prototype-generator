    design_notes: >
      Curriculum slot 7 fixed B/S sticky rigid intro witness. There is no P/L
      anchor; B/S is fixed in a wall pocket and only defines the sticky side. The
      player pushes the upper cell of a vertical sticky pair twice; the lower cell
      moves as part of the same rigid body and covers the only target. Complete
      analysis reports a 2-step shortest solution over 16 reachable states. Core
      event probe proves all wins require push_object:sticky#1 and
      move_sticky_rigid. Reachable scan reports no P/L shift, no B/S shift, and no
      material conversion, split, or merge. A concrete ordinary-box analog is
      complete unsolved, so in this layout the target cannot be covered without
      sticky rigid movement. Goal-prune is skipped because this is a single-target
      level. Independent evidence reviewer returned supports_with_caveats /
      required_action:none; independent puzzle critic returned
      proposal_ready_with_caveats / required_action:none. Caveat: this is a
      right-right tiny mechanism witness rather than a puzzle; the box analog
      evidence applies to the listed analog, not every possible box-only redesign.
      2026-07-04 human playtest rejected this version because the two sticky
      cells start already joined, so it does not witness sticky joining. Superseded
      by v2.
