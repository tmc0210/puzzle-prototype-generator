  - id: RA_CURR_2026_07_05_L10_MOVABLE_BS_CUTBACK_v1
    title: Movable B/S cutback v1
    layout: |-
      #########
      #@BS.#..#
      #..C..G.#
      #..M#####
      #########
    design_notes: >
      第十关槽位候选：无 P/L，可推动 B/S。初始归一化后，上方 C
      与下方 M 都在 S 侧，形成被下方墙锁住的竖向黏块。玩家必须先
      右推 B/S 一格，移动材料边界并触发 sticky_to_box，将竖向黏块
      切成两个普通箱子；随后把上方箱子推回 S 侧，触发 box_to_sticky，
      再推动回黏后的黏块覆盖目标。完整分析给出 5 步最短解和 47 个
      reachable states 的 complete graph。core event probe complete/no
      bypass，证明所有胜路都需要 anchor_boundary_shift:box_sticky、
      sticky_to_box、box_to_sticky、move_sticky_rigid 和
      push_object:crate#1；reachable scan 证明无 P/L 命中。单目标，
      因此无效 goal prune skipped。独立 evidence reviewer 返回
      supports_claim / required_action:none；独立 puzzle critic 返回
      supports_with_noncore_caveats / required_action:none。caveat 是
      第一步即推 B/S、关卡短且脚本化；它是可动 B/S 切割回黏 witness，
      不应包装成充分体现时机选择的复杂应用题。
      2026-07-05 human feedback rejected it for the L10 slot: the player has no
      meaningful pre-anchor work, pushes B/S immediately as the only obvious
      action, and the anchor is not used again after the opening cut. Removed
      from playable and superseded by a timed join/cut revision.
