mechanic: reality_anchor

required_docs:
  - prototypes/reality_anchor/docs/mechanic_exposure_sequence.yml
  - prototypes/reality_anchor/docs/miner_probe_prior_v1.md
  - prototypes/reality_anchor/docs/goal_prune_check.md
  - prototypes/reality_anchor/docs/opening_comfort_check.md
  - prototypes/reality_anchor/docs/redundant_element_prune.md

tool_commands:
  tool_maturity: "npx tsx src/cli.ts tool-maturity prototypes/reality_anchor"
  explain_layout: "npx tsx src/cli.ts explain-layout prototypes/reality_anchor <layout-file|-> --id <id> --targets K_runtime_smoke --max-states 300000 --graph-max-states 300000 --write"
  try_inputs: "npx tsx src/cli.ts try-inputs prototypes/reality_anchor <layout-file|-> --id <id> --inputs <input1,input2,...> [--write]"
  event_probe: "npx tsx prototypes/reality_anchor/reports/probe_dual_axis_candidate.ts <layout-file> <id> 300000 80"
  fixed_anchor_probe: "npx tsx prototypes/reality_anchor/reports/probe_fixed_anchor_candidate.ts <layout-file> <id> <box_sticky|push_pull> 300000 80 strong_material"

design_corpus:
  allowed_design_sources:
    - prototypes/reality_anchor/mechanism_lab/lexicon.md
  excluded_sources:
    - prototypes/reality_anchor/mechanism_lab/runs/
  policy:
    - "Allowed during initial design and Design Studio revisions as a vocabulary / parts source, including re-query after tools expose a bypass or missing structural responsibility."
    - "Do not read excluded sources unless the current brief explicitly authorizes them."

prototype_specific_workflows:
  - id: invalid_goal_prune
    kind: pre_submission_check
    execution_phase: pre_delivery
    default_status: run_before_submission_or_when_requested
    trigger:
      - "A Reality Anchor candidate is being prepared for human review or the playable queue."
      - "Human playtest feedback asks to audit or clean targets; any layout change creates a new candidate version that must re-enter the playable queue."
      - "A level has two or more targets and some targets may be only side-effect coverage."
    authority_docs:
      - prototypes/reality_anchor/docs/goal_prune_check.md
    forbidden_unless:
      - "Do not write this workflow into generic skills or cross-prototype docs."
      - "Do not delete the only target in a level."
      - "Do not delete a target when cost drops, the expected trace stops winning, graph search is incomplete, or core event necessity fails."
      - "Do not silently mutate a human-reviewed ready_for_archive version; if target cleanup changes layout, create a new candidate version and re-enter the playable queue."
  - id: opening_comfort_check
    kind: pre_submission_check
    execution_phase: pre_delivery
    default_status: run_before_submission_when_opening_is_flagged_or_start_changes
    trigger:
      - "起点影响 opening commitment、可读性、核心机制覆盖或 bypass。"
      - "experience brief 的 level_brief.expected_difficulty 为 3。"
      - "experience brief 的 level_brief.expected_difficulty 为 4。"
      - "brief 或原型文档要求显式起点比较。"
      - "修改起点会改变 solve instance。"
    authority_docs:
      - prototypes/reality_anchor/docs/opening_comfort_check.md
    forbidden_unless:
      - "若推荐起点不同于已验证实例，必须重跑相关证据。"
      - "起点诊断不是独立通过条件。"
  - id: redundant_element_prune
    kind: pre_submission_check
    execution_phase: pre_delivery
    default_status: run_before_submission_or_when_feedback_flags_redundancy
    trigger:
      - "人类反馈指出冗余空地、无用墙体、无用箱子、无用黏块、无用锚点或外框过厚。"
      - "候选准备提交给人类查看或进入待玩列表，且布局中存在明显 leaf / pocket / thick border / isolated object。"
      - "目标剔除、起点调整或其它 cleanup 后产生新的空地、对象或墙体冗余。"
    authority_docs:
      - prototypes/reality_anchor/docs/redundant_element_prune.md
      - prototypes/reality_anchor/docs/goal_prune_check.md
      - prototypes/reality_anchor/docs/opening_comfort_check.md
    forbidden_unless:
      - "不要把该流程提升为通用 Sokoban 要求。"
      - "不要跳过 goal_prune 直接处理初始压在目标上的对象。"
      - "不要在完整图或核心事件 probe 不完整时 clean prune。"
      - "不要因 solver success alone 删除、墙化或裁剪要素。"
      - "不要在人类 ready_for_archive 后静默改布局；若反馈后裁剪改变布局，必须形成新版候选并重新进入待玩列表。"
