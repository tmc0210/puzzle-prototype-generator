- case: CASE_A
  intended_reversal: "玩家原本以为黏块切成箱后关系解除，后来发现同一批材料竟要反复重绑、再切与转向，因此切割只是循环中段。"
  subject_cost_fit: borderline
  heaviest_cost_outside_subject: "两套锚点的多轮搬移与回位"
  designer_action: revise_structure
  exact_basis: "步骤6、10、15-16、19、21-27反复切割、重绑和转向。"

- case: CASE_B
  intended_reversal: "玩家原本以为双格黏块应整体运送，后来发现同一批材料竟要切成两箱分别排位，再共同传力。"
  subject_cost_fit: well_supported
  heaviest_cost_outside_subject: "B/S终局拉动与短程绕行"
  designer_action: keep
  exact_basis: "步骤1-3切成两箱，7-11分别排位，12共同进入三物体受力链。"

- case: CASE_C
  intended_reversal: "玩家原本以为三格黏条是成形后的运输体，后来发现同一批材料竟要切成两箱一黏，分别覆盖三目标。"
  subject_cost_fit: well_supported
  heaviest_cost_outside_subject: "B/S的两次右移与排位空间"
  designer_action: keep
  exact_basis: "步骤1合成三格条，10-11切出两箱，13-17三份材料各自收束。"

- case: CASE_D
  intended_reversal: "玩家原本以为B/S锚点持续右移就是进展，后来发现同一锚点竟要三次左移复位，因此后退才开启后半程。"
  subject_cost_fit: structurally_underpaid
  heaviest_cost_outside_subject: "后半段P/L、黏体与两箱的独立长链"
  designer_action: change_family
  exact_basis: "步骤6-8右拉B/S，14-16原路左拉；21以后主解转由P/L与切箱承担。"

- case: CASE_E
  intended_reversal: "玩家原本以为三格黏条首次切箱后即可分送，后来发现同一批材料竟要两度重绑，最终再整体切开同时收束。"
  subject_cost_fit: borderline
  heaviest_cost_outside_subject: "七步纯走位与多轮边界往返"
  designer_action: revise_structure
  exact_basis: "步骤4初切，13重绑，14再切，15再重绑，30重建后双目标收束。"

- case: CASE_F
  intended_reversal: "玩家原本以为上方箱只是独立搬运物，后来发现同一箱竟要跨界并入黏体，成为牵动B/S的受力链。"
  subject_cost_fit: well_supported
  heaviest_cost_outside_subject: "下方箱排位与B/S一次往返"
  designer_action: keep
  exact_basis: "步骤7上箱跨界合黏，9-10该黏体参与B/S下拉再上推的终局链。"

- case: CASE_G
  intended_reversal: "玩家原本以为七格C形黏体应保持整体，后来发现同一批材料竟要切断连接、分成双臂与箱，并按顺序各自收束。"
  subject_cost_fit: borderline
  heaviest_cost_outside_subject: "长接近通道与切割后的跨区走位"
  designer_action: revise_structure
  exact_basis: "步骤2合成七格C形体，14切成双臂与三箱；18、25、32分段完成且上臂须先行。"
