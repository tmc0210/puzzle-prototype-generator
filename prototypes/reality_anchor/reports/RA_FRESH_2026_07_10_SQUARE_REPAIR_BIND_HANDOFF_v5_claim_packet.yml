candidate_version: RA_FRESH_2026_07_10_SQUARE_REPAIR_BIND_HANDOFF_v5
review_iteration: 4
claim_last_review: true

slot_brief:
  intended_role: late_challenge
  known_before: all_current_reality_anchor_runtime_rules
  target: 双锚点后期挑战；难度至少 4、审美至少 4；不预先主张 5。

design_claim:
  player_insight: >-
    开局补成的 2x2 不是成品。B/S 只刷下排后，玩家要从唯一上口纵剪右列，得到 L3；
    剩余箱必须先让位，再在固定 P/L 的 pull 侧变成缺角单格。真正洞见是主动把完整方块
    拆成 1+3，并让两部分在偏移一格的位置重绑为可整体交付的黏态正方形。
  opening_revision_claim: >-
    v5 不再让关键补角成为唯一首步。玩家先在 13 状态可逆区读图，再主动站到 M 下方承诺；
    这只修复操作舒适度，不把新增走位或 dead exits计入难度。
  causal_chain:
    - 向右 walk 后向上推动 M 过 B/S，M 转箱并补成箱态 2x2。
    - B/S 上移一次，下排转 MM，形成上 CC、下 MM 的混合刷子。
    - 唯一上口纵推右列，以 force chain 生成三格 L 与剩余单箱。
    - 单箱左推让位，再从固定 P/L 的 pull 侧向下抽成单格 M。
    - L3 左拉与单格 M 重并为偏移 2x2；整体左拉三格覆盖四目标。
  why_not_execution: >-
    23 步里 14 步是 walk，六步上口路线仍不计作结构难度；开局新增的一步也不计分。
    4 档只来自玩家否定“完整方块直接朝目标横剪”，并规划纵剪、单箱让位、pull 侧补角、
    偏移重绑的职责链。若同距离 early dead exit 不公平、墙齿泄题，或 1+3 只是沿墙执行，
    则难度/审美门槛失败。
  falsification:
    - 任一完整事件或形状探针发现旁路，核心 claim 失败。
    - 若新增开局只制造无信息试错而未改善观察，v5 优化 claim 失败。
    - 若 1+3 拆分与偏移重绑没有主动规划价值，构造 claim 失败。
    - 若独立 critic 评分低于难度4或审美4，不得继续提交。

lineage_claim:
  relation: fresh_family_pre_submission_revision
  archive_variant_authorized: false
  why_not_archive_variant: v5 来自本轮 fresh v4 的原型专属开局缓冲与纯外框裁剪，不使用 archive 布局或因果链。

lexicon_used:
  - B/S 绑定债：箱资源生成黏块形状
  - B/S 移动边界刷产物：远程生成与门口消费
  - P/L 边界交接：推入、跨侧与抽取分配
new_linkage: >-
  M 跨 B/S 补成箱态正方形；移动 B/S 远程刷出 CC/MM。唯一上口消费右列并剪成 L3+箱；
  箱让位后由固定 P/L 抽成单格 M，再与 L3 偏移重绑成黏态正方形并整体交付。
