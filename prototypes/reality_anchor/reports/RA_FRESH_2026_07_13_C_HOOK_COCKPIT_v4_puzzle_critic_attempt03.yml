aesthetic_target_fit:
  target: 4
  result: supports_target_4_not_5
  reason: >-
    七格 C 的完整几何同时决定换行、凹口操作位、双臂同步传力与中央目标回补；两枚锚点一直承担终局目标责任，
    没有 RA_CAND_0024/0027 的 affordance 空转，也没有 RA_CAND_0030/0032 的退休或拼接。紧凑题面在 step 10 给出三目标同步完成的清晰回报，足以支撑审美4。
    但 RU1 错路反馈很快，RU2 又在对齐后直接显形，缺少 RA_CAND_0022/0025 所示的强反直觉重构或更深的核心几何反复，故不支持审美5。

difficulty_target_fit:
  target: 3
  result: supports_target_3_with_upper_boundary
  reason: >-
    玩家需要在进入旧凹口前读出 P/L 的 pull-side 后果，并把“C 下移”同时理解为凹口换行、双轨对齐与中央通道开启；这形成一个真实的应用级计划节点。
    但错误入口最多两次 left 即暴露且可廉价试出，step 3 后的 RU2 基本是连续右拉的直接兑现；因此支持难度3，不支持把它描述为高难、多阶段搜索或两个等量洞见。

