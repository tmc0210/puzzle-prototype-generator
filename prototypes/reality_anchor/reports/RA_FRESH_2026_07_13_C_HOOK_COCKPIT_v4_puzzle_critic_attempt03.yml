independent_reading:
  status: completed
  initial_verdict: supports_with_noncore_caveats
  initial_review_loop_state: proposal_ready_with_caveats
  initial_required_action: none
  player_goal_seen: >-
    玩家开局看见右侧上下两枚目标分别紧邻 L/P 与 S/B 两个横向锚点的右端，中央目标则已由七格 sticky 的下横臂覆盖；
    因而可形成的玩家目标是：先让七格 sticky 的上下横臂对齐两枚锚点所在的 y2、y4 两行，再从凹口内把整块 sticky 向右拉，
    既把两枚锚点同步推到右侧目标，又让 sticky 的竖脊回到中央目标。
  salient_relations_seen:
    - >-
      开局七格 sticky 的横臂位于 y1、y3，而 L/P、S/B 分别位于 y2、y4；玩家在 step 1-3 走到 (3,4) 后向下移动，
      把整块 sticky 下拉一格，使两条横臂改到 y2、y4，同时让 (3,3) 从被 sticky 覆盖变成空目标；
      这既完成与两枚锚点的纵向对齐，也把中央目标所在格变成稍后进入凹口的通路。
    - >-
      sticky 下移后，玩家在 step 4-8 从下方绕到 (3,3)，再进入凹口内的 (2,3)；step 9 向右拉使整块 sticky 右移一格，
      上下横臂右端来到 (4,2)、(4,4)，竖脊来到 x2；因此下一次右拉会让两条横臂同时接触 x5 的 L 与 S，
      而不是只处理其中一枚锚点。
    - >-
      step 10 玩家从 (3,3) 向右移动并再次拉动整块 sticky；上下横臂同步把 L/P 与 S/B 从 x5-6 推到 x6-7，
      P、B 覆盖 (7,2)、(7,4)，同时 sticky 竖脊到达 (3,3)；三个目标在同一步重新全部被对象覆盖，
      所以后续不再需要拆开处理任一锚点或回补中央目标。
  unclear_or_unreadable_parts:
    - >-
      raw packet 只给出一条成功回放，没有同一决策状态下玩家会认真考虑的失败方向；因此目前无法判断“先下移、再入凹口右拉”
      是需要提前排除替代方案的洞见，还是从两行错位与唯一凹口入口即可立即读出的显然执行。
    - >-
      本阶段未提供目标玩家、目标角色或目标难度，故只能判断结构是否形成玩家侧因果，不能判断它是否匹配某个具体难度档或教学窗口。
  initial_quality_risks:
    - >-
      规范解共十个输入，但改变对象的只有 step 3、step 9、step 10；其余主要是站位与绕行。若候选意图承载较高难度，难度可能更多来自看懂一次纵向对齐和凹口拉动，
      而不是持续展开的多阶段推理。
    - >-
      开局上下目标、两枚横锚点和七格 sticky 的两条横臂呈强烈的成对对齐图示，可能把正确计划提示得过早；这不破坏紧凑的一体化终局，
      但可能削弱发现过程的惊喜与替代方案压力。
    - >-
      与 archive 低分例中“黏块几何没有兑现期待”及“前后子段割裂”不同，本布局的七格 sticky 几何直接承担纵向对齐、凹口入位、双锚点传力和中央目标回补，
      暂未看到对象原地退休或无关机制拼接；风险集中在计划是否过于透明，而非机制覆盖虚假或结构割裂。
  exact_basis:
    - "layout：七格 sticky 初始占据 y1 的 x1-3、(1,2) 及 y3 的 x1-3；L/P 在 y2 的 x5-6，S/B 在 y4 的 x5-6，目标在 (3,3)、(7,2)、(7,4)。"
    - "exact_inputs step 3 (down)：整块 sticky 下移一格，横臂从 y1/y3 改到 y2/y4，并使 (3,3) 由覆盖目标变为空目标。"
    - "exact_inputs step 7-8 (left, left)：玩家经空出的 (3,3) 进入 sticky 凹口内的 (2,3)。"
    - "exact_inputs step 9 (right)：玩家第一次从凹口向右拉，整块 sticky 右移，令下一次右拉可同时接触 L 与 S。"
    - "exact_inputs step 10 (right)：sticky 再右移并同步推动两枚锚点，P/B 覆盖右侧上下目标，sticky 竖脊覆盖中央目标并获胜。"

player_facing_merits:
  - id: M1_relocate_and_repurpose_complete_C
    target_ref: RU1_relocate_whole_C / OS1_lower_complete_C / OS2_enter_relocated_notch
    visible_setup: >-
      开局完整七格 C 的横臂在 y1、y3，锚点线在 y2、y4，且 C 的下臂覆盖 (3,3) 目标；旧凹口同行右侧紧邻可被拉动的 P/L。
    player_operation: >-
      玩家先到 (3,4) 向下拉完整 C 一格，再从右侧经已腾空的 (3,3) 走入新凹口 (2,3)。
    board_change: >-
      C 不拆分而整体换行，上下臂同时对齐两条锚轨；原本只是已覆盖目标的 (3,3) 变成进入凹口的通路。
    followup_effect: >-
      玩家获得不会拖动 P/L 的内部拉位，后续可沿同一方向横拉整个 C，并让中央格在终局重新承担目标责任。
    reason: >-
      形状、目标与通路不是事件标签式并列出现，而是在同一次整体下移中互相改写用途，兑现了完整 C 与凹口的玩家侧意义。
  - id: M2_double_arm_single_payoff
    target_ref: RU2_use_notch_as_cockpit / OS3_prime_double_hook / OS4_double_hook_finish
    visible_setup: >-
      step 8 后玩家位于 (2,3)，身后是 C 的左竖脊；上下臂右端分别在两枚锚点左方两格，两枚锚点的 P、B 右端各紧邻目标。
    player_operation: >-
      玩家从凹口内连续向右拉两次：step 9 让双臂同时贴到 L 与 S，step 10 再拉使双臂同步传力。
    board_change: >-
      第二次右拉把 L/P 与 S/B 同时从 x5-6 推到 x6-7，P、B 覆盖上下目标；同一平移还把 C 的左竖脊送到 (3,3)。
    followup_effect: >-
      三个目标在一次同步终局中全部完成，不存在先消费双锚、再拼接另一个黏块入目标段，也没有任一锚点在完成后退休。
    reason: >-
      双臂、凹口、左竖脊与两种锚边界均在同一刚体平移的可见结果中兑现，形成紧凑且可读的终局回报。

supported_reasoning:
  - unit_ref: RU1_relocate_whole_C
    support_level: supported_with_caveat
    reason: >-
      旧凹口是玩家会认真考虑的明显入口；从右向左进入会在 pull side 连续拖动 P/L，并最终让 L 堵住玩家右前格，
      因而“不能直接使用旧凹口、必须先让完整 C 换行”是行动前可见的计划理由。可是该失败在两次 left 内就显形，
      强玩家还可直接从 pull side 关系预判，所以它只支撑一个轻量但真实的重定位判断，不支撑强反直觉或高搜索深度。
  - unit_ref: RU2_use_notch_as_cockpit
    support_level: supported_as_resolution_not_separate_deep_insight
    reason: >-
      step 3 后两条 C 臂与锚点同排、各隔一格，P/B 又各距目标一格；玩家一旦进入 (2,3)，连续右拉两次的后果直接可见。
      RU2 的操作与反馈完整兑现了 RU1 建立的局面，但其玩家问题几乎被摆法直接回答，更适合作为漂亮终局执行，而不是第二个独立难点。

