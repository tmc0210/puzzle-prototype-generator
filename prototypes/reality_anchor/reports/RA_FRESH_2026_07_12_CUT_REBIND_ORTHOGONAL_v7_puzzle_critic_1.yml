aesthetic_target_fit: >-
  支持审美4保底，不支持当前材料直接追求5。step 14 把底部四锚停位与上方切割绑在一次可推导变化上，三次重拼各自消费不同目标，明显强于 RA_CAND_0024 的机制承诺落空；
  但 RU2 实为等价顺序的两步效率差，后段三次向右再绑定仍有手势重复，缺少 RA_CAND_0022 的短而尖锐或 RA_CAND_0025 的单一主动构造亮点。
difficulty_target_fit: >-
  玩家侧支持末期难度4边界，不支持5。真正可分析的因果主要是：四目标确定双锚停位并触发跨区域切割，以及屋顶 L 目标要求保留并接回黏条；
  RU2 的上下顺序均可获胜且汇合相同终局，只是 35/37 步换位效率差，不能当作必需顺序推理。pilot 的执行压力 band5 只说明规范解较密集，不能补足难度5洞见。

language_drift:
  obvious_overpackaging: false
  examples:
    - target_ref: player_reasoning.player_goal
      packaged_phrase: "闭合黏桥、穿过上下窄口"
      concrete_restatement: "初始 x4 三格柱连接 x5 的上下端；B/S 边界移到 x4/x5 后，x4 变三箱、x5 留两个黏端点，箱再分别向右与端点重拼。"
      why_no_information_was_added: "这些词可对应具体对象和列关系，不属于纯造名；问题在该字段提前写出解法，而非术语本身不可定位。"
  required_action: none

critic_items:
  - id: CRIT_PLAYER_GOAL_IS_SOLUTION
    type: core_blocker
    target_ref: player_reasoning.player_goal
    design_relation: >-
      玩家在 step 0 实际只看见八个目标、底部两枚锚点和上方 C 形材料；通过移动锚点后才会看见 C 形材料切成三箱两端，并在后续操作中形成屋顶横条、中部横条和最终 L。
    attack: >-
      当前 player_goal 已直接写出“让锚点铺满四目标、拆桥、穿过窄口、重拼成 L 与中部黏块”，这是完整解法摘要，不是玩家在行动前拥有的目标。
      它把 RU1 与 RU3 应当产生的计划理由预先塞进 goal，导致 reasoning units 重复领功。应改为规则层目标（覆盖全部目标）及玩家可见的局部子目标，不得提前命名最终材料职责。
    evidence_basis: "canonical.step_0 布局；player_reasoning.player_goal.description；RU1/RU3 conclusions。"
    player_facing_effect: "无法据当前说明判断玩家问题是否自然产生，因为答案已写进问题前提。"
    blocks_proposal_ready: true
    expected_designer_response: revise_claim
  - id: CRIT_RU_PREMISE_TIMING_AND_ALTERNATIVE
    type: core_blocker
    target_ref: player_reasoning.reasoning_units.RU1_and_RU3
    design_relation: >-
      RU1 要从 step 0 的四目标、墙、双锚和 C 形列关系推出 step 14 的停位切割；RU3 要从 step 24/30 的屋顶缺口、剩余箱和通路推出 step 34-35 的最终相邻合并。
    attack: >-
      RU1 第二 premise 引用 canonical.steps_1_9，RU3 第二 premise 引用 canonical.steps_31_34，均把执行过程或未来结果当作行动前 premise；
      RU1 的 overshoot 又在四底目标已覆盖且右墙显然可见后才尝试，不是玩家会认真考虑的竞争路线。结论本身有可见几何支持，但 packet 必须把支持移回决策状态，并把 overshoot 降为即时 feedback，而非 alternative 证明。
    evidence_basis: "RU1 premises/alternative 与 RU3 premises 的 state_ref；canonical.step_0、step_24、step_30 的可见局面。"
    player_facing_effect: "当前文档夸大了被展示的行动前推理强度，尤其会误把执行后确认写成洞见。"
    blocks_proposal_ready: true
    expected_designer_response: revise_claim
  - id: CRIT_RU2_EQUIVALENT_ORDER_ONLY
    type: nonblocking_risk
    target_ref: player_reasoning.RU2_split_output_order
    design_relation: >-
      step 14 后玩家可先走上端形成屋顶横条，也可先右推最下箱形成中部横条；bottom-first 再用19步处理余料，总长37并到达与35步 canonical 完全相同的 final state。
    attack: >-
      更新后的 claim 已诚实限定为“等价换序、规范顺序少两步”，因此没有结构过 claim；但普通通关玩家无需发现最短顺序，RU2 只提供换位优化，不能作为末期难度4/5的独立核心推理单元。
    evidence_basis: "bottom_first_win 37步事实；canonical 35步；solution_uniqueness.result=equivalent_variants_only。"
    player_facing_effect: "玩家可自由选择上下顺序，错误选择不造成结构性后果，只增加两步执行。"
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CRIT_SCORE_BOUNDARY_FOUR_NOT_FIVE
    type: score_boundary
    target_ref: design_target_and_slot_brief
    design_relation: >-
      step 14 的双锚停位兼切割和 step 24-35 的屋顶 L 收束提供两个真实结构读点；三次重拼的目标职责不同，但上下端先后可交换、后段输入外观相似。
    attack: "人评锚点支持审美4、难度4的末期综合关边界；当前没有足够短促反直觉或不可替代的多层因果支持审美5/难度5。"
    evidence_basis: "RA_CAND_0017/0022/0025 正例、RA_CAND_0024 负例；canonical steps 14/20/30/35；37步等价换序。"
    player_facing_effect: "体验更像规则综合与形状收束的阶段挑战，而非必须逐层反直觉重构的极难标杆。"
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CRIT_REBIND_REPETITION
    type: nonblocking_risk
    target_ref: canonical.steps_20_30_34_35
    design_relation: >-
      玩家三次从箱左侧向右推入黏侧；棋盘分别得到屋顶二格条、中部二格条、接入屋顶条的单格黏块，后续目标责任确实不同。
    attack: "功能分工避免纯重复，但相似手势与往返会稀释后半段新信息密度；这是审美5边界，不是结构 blocker。"
    evidence_basis: "canonical visible changes at steps 20、30、34-35。"
    player_facing_effect: "玩家可能在理解第一次再绑定后，把后两次体验为流程兑现。"
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking

