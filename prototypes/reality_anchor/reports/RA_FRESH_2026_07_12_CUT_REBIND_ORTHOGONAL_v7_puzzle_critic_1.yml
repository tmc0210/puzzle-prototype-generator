  - graph_fact: "完整图在 graph_states=500001、budget=500000 时 exhausted；SCC/graph 未路由。"
    neutral_meaning: "不能得出完整 SCC、全图唯一或所有深度解族结论。"
    player_facing_interpretation: "该事实不说明关卡是否有洞见、是否好玩，也不改变玩家看到的目标与材料关系。"
