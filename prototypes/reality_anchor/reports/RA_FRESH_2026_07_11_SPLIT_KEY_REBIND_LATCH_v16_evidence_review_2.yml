    player_facing_interpretation: "不能据此判断完整解空间、分支质量、唯一解、所有最短解或完整 SCC。"
    verdict_effect: caveat
  - limit: event_gate_scope
    detail: >-
      五个 complete no-win 结果只证明各 forbidden event pattern 单独被禁用时不存在胜局；它们不证明
      某个特定事件实例、固定触发次数、固定相对顺序、固定对象身份或 packet 叙事中的整条具体路线
      为所有胜局共有。
  - limit: sticky_split_scope
    detail: "sticky_split 仅由 canonical shortest trace 触发，且已有完整 witness 证明它不是 all-win gate。"
  - limit: reachable_exposure_scope
    detail: >-
      complete_reachable_scan=false，因此不能外推完整 reachable event inventory；本轮之所以不形成
      later-exposure blocker，仅因为 dual_anchor 已是 exposure sequence 的末阶段且没有
      forbidden_if_seen_anywhere 声明。
  - limit: object_evidence
    detail: "无 object instance、object participation 或 per-object necessity 证据。"
  - limit: calibrated_metrics_ignored
    detail: >-
      calibrated_trace_metrics 不是机制证据；本审查没有用 execution-pressure、reuse band、步数或
      指标聚合支持或反驳 player_insight、审美、难度与关卡质量。
  - limit: design_claim_boundary
    detail: >-
      player_insight、why_not_execution、状态责任是否能被玩家读出属于设计判断；工具证据这里只支持
      返回 trace 的事件、快照、时序，以及五个事件模式级 all-win 前提。

