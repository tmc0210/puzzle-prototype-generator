  - proposal 可带 caveats 继续；审美按 4、难度按 4 交接，不应宣称当前材料支持审美 5 或难度高于 4。
  - 上黏格后段责任、RU2/RU3 廉价失败方向以及 step 11 跨区转换的界面可读性应保留为玩家侧风险。
