critic_items:
  - id: CI1_aesthetic_ceiling_4
    type: score_boundary
    target_ref: design_target.aesthetic_score_target
    design_relation: >-
      上箱经 step 1/4 下推再回送，P/L 经 step 5/8 交换右目标覆盖半格，B/S 在 step 11 同步改写两箱，
      下部黏格在 step 15/17 合并并切回。
    attack: >-
      这些关系足以越过“只有推拉腾挪”的低分警戒，但 RU2、RU3 的错误方向都只需极短试探即可排除，
      没有达到 5 分正例中的强反直觉重构或主动构造密度。
    evidence_basis: canonical.step_1,4,5,8,11,15,17；RU2/RU3 replayed_attempt；RA_CAND_0022/0025/0024/0028 人评。
    player_facing_effect: 玩家能获得紧凑、连贯的双锚闭环，但惊喜更集中在单一正确链，解前选择与终局再解释不足以支撑 5。
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI2_difficulty_ceiling_4
    type: score_boundary
    target_ref: design_target.difficulty_score_target
    design_relation: 三个 RU 分别对应 step 1-4、5-11、12-17 的顺序链。
    attack: >-
      RU1 alternative 只声称一手后无即时收益而不声称不可恢复；RU2、RU3 alternative 均在第二输入即 front_blocked。
      加上 opening 只有一个 forced viable exit，当前材料支持跨段规划，但不支持高于 4 的搜索或剪枝难度。
    evidence_basis: hard_fact_summary_for_critic.initial_scc_size_2_with_one_forced_viable_exit；三个 replayed_attempt 的 exact inputs/outcomes。
    player_facing_effect: 玩家主要需要理解侧别并沿反馈修正，错误成本低，强竞争方向有限。
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI3_upper_sticky_consumption_boundary
    type: nonblocking_risk
    target_ref: RU3_merge_then_cut_vertical_pair; mechanism_scope.central[3]
    design_relation: >-
      初始黏格从 (5,5) 被拉到 (3,5)，与 (3,6) 黏格合并；终手整条左移后，上格变箱停在 (2,5)，
      下格变箱覆盖 (2,6) 目标。
    attack: >-
      上半黏格确实参与 merge、rigid move 和 sticky_to_box，但其切回后的箱不覆盖目标，也没有后续责任。
      从玩家侧看，它更像沿必经 pull 路线被强制携带并自动并入下格，而非玩家为双格终局主动分配的第二项用途。
    evidence_basis: canonical.step_14-17；RU3 alternative [left, down] 在第二手立即失败；resolution.final_state_ref。
    player_facing_effect: 终局闭环清楚，但“构造竖条”的设计价值低于事件列表所暗示的双格责任，限制审美上探。
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI4_player_goal_is_partly_solution_language
    type: improvement_opportunity
    target_ref: player_reasoning.player_goal
    design_relation: 玩家起点看到三目标、双锚、两箱和右下黏格，但尚未经历侧别交换与同步转黏。
    attack: >-
      “判断两枚锚点、两个箱与右下黏格怎样共享有限的操作位”是设计者对完整解的概括，不完全是玩家在 step 0
      能形成的单一目标。更贴近玩家的问题应是：怎样在不丢失右侧通路与目标覆盖的前提下，把 B/S 送到左目标行并让底目标材料可拉取。
    evidence_basis: canonical.step_0 layout；player_goal.state_ref；RU1/RU2 的 later-state premises。
    player_facing_effect: 不影响关卡本身成立，但当前措辞把三个阶段压成抽象“共享操作位”，弱化了玩家逐步发现的问题边界。
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI5_lineage_boundary
    type: diagnostic_note
    target_ref: archive_lineage_policy
    design_relation: packet 声称 fresh，且未授权 archive variant；可见链为上箱回送、P/L 侧别换位、双箱转黏和竖条切回。
    attack: >-
      提供的人类 archive 摘要只显示主题层相似，未显示当前布局、对象角色或完整因果链继承；因此没有依据判定未授权 variant。
      “先写 reasoning sketch”仍只是来源声明，不能被用作审美加分。
    evidence_basis: archive_lineage_policy.candidate_relation/why_not_archive_variant；四条 human archive comments。
    player_facing_effect: lineage 对当前玩家侧 verdict 无正负效果。
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking

