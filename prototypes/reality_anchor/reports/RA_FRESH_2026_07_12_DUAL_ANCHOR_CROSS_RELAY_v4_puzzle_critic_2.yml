aesthetic_target_fit: >-
  支持审美 4 保底，不支持当前 packet 的 5 分追求。相较 RA_CAND_0024，本关不止是锚点腾挪：step 4 的箱位
  反向回收、step 8 的覆盖半格交换、step 11 的双箱同步转黏和 step 15-17 的合并切回形成了可见闭环。
  但相较 RA_CAND_0022 与 RA_CAND_0025 的强反直觉计划和主动构造，RU2、RU3 的失败方向几乎立刻暴露，
  且合并竖条的上半格在终局只被随带切回而不承担目标或后续操作责任，因此尚不足以支持 5。
difficulty_target_fit: >-
  支持难度 4，不支持高于 4。玩家必须跨越 step 1-11 预见两个锚点对站位、侧别和材料的连续交接，不能只追逐
  最近目标；这高于单纯路线执行。另一方面，initial SCC 只有 size 2 且一个 viable exit，三个 replayed alternatives
  都在一至两次输入内显示无收益或直接失败，后段在 step 11 后也接近强制收束，未显示足以支持更高档的选择面或剪枝负担。

