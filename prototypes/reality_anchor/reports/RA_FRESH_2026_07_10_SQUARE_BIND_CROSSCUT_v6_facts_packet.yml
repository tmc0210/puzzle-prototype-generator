player_facing_reading:
  opening_read: >-
    顶部 P/L 被完整墙层封住，只作为清楚的左右 force-mode 边界；B/S 位于两枚上方
    目标右侧，玩家右边有一格可逆观察缓冲。下方四个箱排成 2x2，其中右列已经压在
    双目标上；左侧与下方各有一个单格目标。玩家能预见 B/S 左移会依次刷过两列。
  intended_solution_read: >-
    B/S 左移两次后覆盖上方双目标，四箱变成完整 2x2 黏块。玩家从第二次位移释放的
    入口绕到左把手，横拉正方形；跨线后左列成为两箱、右列仍是竖直黏条。上箱立刻
    左拉进单格目标；玩家绕到黏条右侧把整条拉回原双目标列；最后从下方把下箱拉进
    下目标，落入封闭终点并胜利。
  commitment_points:
    - 第一次 B/S 位移后出口仍封闭；第二次位移前不能移动 sticky 或切列。
    - 完整 2x2 横切前的决策区有 3 个 commitment，其中 2 个为 dead，只有 1 个继续核心计划。
    - 横切后的决策区有 4 个 commitment，2 viable/2 dead；上箱、黏条、下箱的顺序需要预见最终把手。
    - 下箱进入 [3,7] 后玩家落到 [3,8] 单格封闭位，因此必须作为最后责任。
  state_responsibility:
    box_sticky_anchor: 左移两次构造 2x2，并最终覆盖 [3,3]/[4,3]。
    four_crates_as_square: 两列依次进入 sticky side，必须完整合并后才可离开上层。
    cut_left_column: 横切后成为两枚独立箱，分别覆盖 [2,5] 与 [3,7]。
    retained_right_column: 横切后保持竖直黏条，整体回填 [5,5]/[5,6]。
    push_pull_anchor: 墙封固定，不承诺移动；其边界让所有关键拉取具有 pull 语义。
  payoff_and_resolution: >-
    开局的 2x2 箱阵先收拢为一个正方形，再按列解开：两格保持为可见竖条回到原位，
    两格获得独立性并向左、向下分配。六个目标最终由 B/S 两格、黏条两格与两个箱
    精确覆盖，兑现构造、切列与三路职责。

archive_taste_context:
  examples:
    - candidate_id: RA_CAND_0022
      role: positive_5_aesthetic_4_difficulty_anchor
      human_scores: {aesthetic: 5, difficulty: 4}
      human_comment: >-
        这关的操作非常反直觉，将一个箱子先送入看似死局的死角，构造出拉锚点将两个箱子反向送入目标。
        空间利用率高，结构精巧。在较短的步骤中要求强玩家洞见以发现反直觉操作，是优秀的范例。
      calibration_use: 高分要求短而强的反直觉洞见与高空间职责；v6 的长走位必须接受攻击。
    - candidate_id: RA_CAND_0025
      role: positive_4_4_constructor_anchor
      human_scores: {aesthetic: 4, difficulty: 4}
      human_comment: >-
        在狭小紧凑的空间中，将L形反复活塞这一关键高难结构赋予合适的包装以要求玩家主动构造，
        前几步构造不喧宾夺主，终局也有恰到好处的提示。整体达到强4分水准，是构造关优秀案例。
      calibration_use: v6 必须证明 2x2 主动构造与目标列提示达到同级别，而非事件 witness。
    - candidate_id: RA_CAND_0006
      role: negative_high_difficulty_route_tax_anchor
      human_scores: {aesthetic: 2, difficulty: 5}
      human_comment: >-
        已有关卡的强复杂度变体，用较小目标位置改动极大弱化机制美感并增加腾挪难度；
        这种增加难度的方式实为较差反例，仅做归档。
      calibration_use: 难度 5 不可由目标位置和腾挪路线堆出；v6 的 17 步走位是核心攻击点。
    - candidate_id: RA_CAND_0024
      role: negative_1_aesthetic_affordance_anchor
      human_scores: {aesthetic: 1, difficulty: 3}
      human_comment: >-
        看起来机制利用率高、双锚点和三个黏块承诺精彩切割拼接或几何利用，实际几乎只用推拉腾挪，
        缺乏玩家洞见；双锚点可动污染读题，最终只得到腾挪关。警示是不要迷信指标和探针。
      calibration_use: v6 必须真实消费 2x2 与切列几何；固定 P/L 不得制造可动假信号。
  all_aesthetic_1_entries_read:
    - RA_CAND_0024
    - RA_CAND_0027
  additional_warning_from_RA_CAND_0027: >-
    事件标签不能替代黏块几何；v6 只有在 2x2 构造、切列和竖条回位成为玩家必要职责时才可过门。

