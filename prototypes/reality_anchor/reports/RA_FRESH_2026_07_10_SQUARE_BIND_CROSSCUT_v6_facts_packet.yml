prototype_context:
  confirmed_rules:
    - P/L 定义 push/pull 两侧；本候选 P/L 被墙完全固定。
    - B/S 定义 box/sticky 两侧；合法动作后全局材料归一化。
    - 相邻 sticky 合并成刚体，刚体任一目标格受阻则整步失败。
    - push/pull 可以沿运动方向通过多个可动物体传力。
  win_condition: 所有 G 被箱、黏块或任意锚点格覆盖；玩家不算覆盖。
  object_and_event_semantics:
    box_sticky_shift: B/S 本体平移并重写全局材料边界。
    box_to_sticky: 箱跨到 sticky side。
    sticky_merge: 不同 sticky 来源合并为同一刚体。
    sticky_to_box: sticky 格跨回 box side 后变成独立箱。
    move_sticky_rigid: sticky 连通刚体整体移动。
  tool_boundary:
    runtime_adapter: available
    solver_graph_agency: available
    event_count_and_phase_probes: available
    raw_sampler: available_but_not_used
    curated_miner: unavailable

