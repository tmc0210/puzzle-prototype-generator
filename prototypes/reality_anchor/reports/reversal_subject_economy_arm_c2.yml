cases:
  - case: CASE_D
    main_player_facing_merit: 双边界接力改写同批材料，终局回照前段。
    dominant_aesthetic_problem: 往返搬运后另开P/L与分箱长链，洞见失焦。
    aesthetic_band: 2-3
    verdict: borderline
    reason: B/S回撤有意义，却不足以统摄后半成本。
    perceived_reversal: 玩家原本以为B/S只需向右搬运黏料，后来发现同一B/S竟要拉回原侧，才能接续后段受力，因此前进是在准备回撤。
    subject_cost_fit: structurally_underpaid
    heaviest_cost_outside_subject: P/L两次下移、终局三次回推及分箱拉位。

  - case: CASE_B
    main_player_facing_merit: 切黏成两箱后借三物链牵边界收束，紧凑可读。
    dominant_aesthetic_problem: 两箱分离与排线略像执行题，首次失败信息有限。
    aesthetic_band: 4+
    verdict: playtest_worthy
    reason: 同一双箱组的切分、排线、连锁共享一条因果线。
    perceived_reversal: 玩家原本以为切出的双箱组要各自送位，后来发现同一双箱组竟要排成力链牵动B/S，因此切分是在制造传力件。
    subject_cost_fit: well_supported
    heaviest_cost_outside_subject: 中段绕行与首箱分离定位。

  - case: CASE_G
    main_player_facing_merit: 七格C形黏体的合成、切断与双臂分流构成清晰大变形。
    dominant_aesthetic_problem: 长通道压慢验证，错序代价到较晚才显露。
    aesthetic_band: 4+
    verdict: playtest_worthy
    reason: 同一C形材料的先合后拆直接制造三路目标与次序约束。
    perceived_reversal: 玩家原本以为七格C形黏体合成后应保持整体，后来发现同一C形黏体竟须切断连接并先安置上臂，因此成形是为可控拆解。
    subject_cost_fit: well_supported
    heaviest_cost_outside_subject: 通往三端目标的长走廊与错序回滚。

  - case: CASE_E
    main_player_facing_merit: 同一材料越界切分、拉回重粘再切，形态循环可见。
    dominant_aesthetic_problem: 切合循环多次复述同一答案，长走位削弱新鲜后果。
    aesthetic_band: 2-3
    verdict: borderline
    reason: 反转成立但主语只是一箱，其余重构与双目标收尾成本过重。
    perceived_reversal: 玩家原本以为右侧切出的箱应继续送位，后来发现同一箱竟要拉回边界重粘成L形，因此已完成的切分只是临时态。
    subject_cost_fit: structurally_underpaid
    heaviest_cost_outside_subject: 两轮额外切合、远端双目标排布与最长回走。

  - case: CASE_C
    main_player_facing_merit: 三格黏条先合后拆，三种最终单元各赴目标，因果清楚。
    dominant_aesthetic_problem: 关键洞见出现后余程偏兑现，探索层次稍薄。
    aesthetic_band: 4+
    verdict: playtest_worthy
    reason: 同一三格材料的身份反转直接解释全部三目标，外围成本很轻。
    perceived_reversal: 玩家原本以为箱并入两格黏体后应保持三格刚体，后来发现同一三格材料竟要再切成两箱一黏分别落位，因此合并是为精确拆分。
    subject_cost_fit: well_supported
    heaviest_cost_outside_subject: 切分后两箱的短距离分送。

  - case: CASE_A
    main_player_facing_merit: 小空间反复切合材料并移动双锚点，状态互锁密度高。
    dominant_aesthetic_problem: 反转主语在箱、黏组与锚点间漂移，主矛盾不够聚焦。
    aesthetic_band: 4+
    verdict: playtest_worthy
    reason: 整体靠高耦合成立；只按回粘箱的反转看，后续多轮重排明显超支。
    perceived_reversal: 玩家原本以为B/S切出的那只箱已与黏体分离，后来发现同一只箱竟要被拉回重粘，因此切开是在换取重组姿态。
    subject_cost_fit: structurally_underpaid
    heaviest_cost_outside_subject: 双锚点多次换位及其后的再切与终局转向。

  - case: CASE_F
    main_player_facing_merit: 十步内让B/S被推离、拉回再推定型，几乎无空走。
    dominant_aesthetic_problem: 锚点反向虽清楚，箱位准备较脚本化，探索余量小。
    aesthetic_band: 4+
    verdict: playtest_worthy
    reason: B/S是稳定单主语，两箱和力链都直接造成其往返与终局。
    perceived_reversal: 玩家原本以为B/S被上推后已完成让路，后来发现同一B/S竟要经黏体力链下拉再推回，因此离位只是为重排传力关系。
    subject_cost_fit: well_supported
    heaviest_cost_outside_subject: 两箱的一次横移与一次越界合黏。

cross_case_notes: 单主语反转最强的是C、G：合体并非终态，而是为可读拆分制造条件；B、F也以很少外围动作兑现反向用途。D、E、A虽有局部回撤或重粘，但其主语不足以解释双锚点、多轮切合与长回走；A仍可凭整体高耦合进入试玩，不等于局部反转经济。步数只用来定位玩家感到的拖沓处，未作自动加减分。
