player_facing_reading:
  opening_read: >-
    P/L 完全墙封，只留下清楚的左右 force-mode；第一次左移 B/S 是短 setup。此时
    下行入口开放，玩家看到两枚仍压在双目标上的独立箱、旁边一条竖黏条，以及左、下
    两个空目标，因而“保留独立箱并立刻分配”是可执行读法。
  intended_solution_read: >-
    玩家必须否定这个近解，先把 B/S 再左移一次，使已解箱也变黏并与竖条合成完整
    2x2。随后从同一中央房间左拉正方形；边界把左列解码成两箱，右列黏条直接留在
    双目标。上箱左拉入目标，下箱最后向下拉入封闭终点。
  concrete_false_read: >-
    只移动一次 B/S 后，上箱可先覆盖左目标，下箱也能进入终点列，看起来只差一次
    下拉；但玩家被两个箱卡在 pull 世界交叉口。向下会拆掉已解上箱，向左会把下箱
    拉过所需列，完整后继图无胜。
  state_responsibility:
    box_sticky_anchor: 两次左移构造完整 2x2，并最终覆盖 [3,3]/[4,3]。
    initially_solved_crates: 诱使玩家保留独立性；正确解必须把它们并入刚体。
    complete_square: 作为耦合搬运器，把两箱同步横移到可分配列。
    retained_right_column: 横切后保持竖黏条并直接覆盖 [4,5]/[4,6]。
    cut_left_column: 成为两箱，分别覆盖 [2,5] 与 [3,7]。
    push_pull_anchor: 固定且无移动承诺；其 pull 前格规则既执行正确解，也制造假方案死结。
  payoff_and_resolution: >-
    看似已解的两箱并不是应被保护的终态，而是必须牺牲独立性、与邻列绑定的搬运器
    一半；完整正方形横移后又在目标列按箱/黏分工解码。六个目标最终由 B/S、竖黏条
    与两箱各承担两格，形成紧凑的绑定—横移—解码闭环。

