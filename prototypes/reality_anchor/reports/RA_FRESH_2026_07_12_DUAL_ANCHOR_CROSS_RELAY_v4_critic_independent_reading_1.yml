      因而后续既获得横向 B/S 的操作位，又保留上箱等待边界变化。
    - >-
      P/L 先从 x5 推到 x6，使 L 覆盖右目标 (6,3)，随后从上方再向下推一格，使覆盖者由 L 变为 P；
