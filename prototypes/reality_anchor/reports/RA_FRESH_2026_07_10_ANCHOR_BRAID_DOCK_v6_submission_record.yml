lexicon_used:
  - id: pl_transverse_handle_gate_matrix
    name: P/L 横向把手：玩家前格门与锚点占格门
    use: P/L 下推释放旧 L 半格，另一锚点随后消费该把手与非接触半格门
  - id: pl_pull_extraction_vertical_two_cell_object
    name: P/L pull 抽取把手：前格门、占格目标门与扫带
    use: 玩家从旧 L 半格左拉垂直 B/S，二格刚体目标位共同决定合法性
  - id: pl_mixed_force_chain_wall
    name: P/L 长轴墙廊：L 端余量棘轮（mixed-chain 补谱）
    use: 两锚分别在中段同链上移、终局同链左移，两次 n2 建立并结算状态债
  - id: single_object_goal_piston_order_lock
    name: 单箱目标活塞顺序锁：推入覆盖与回撤撤销
    use: 提取“目标覆盖必须主动撤销”的责任，改写为上目标覆盖/腾位/恢复及下目标端点接力
new_linkage: >-
  双锚编结·目标接力：P/L 先释放 B/S 的抽取把手；B/S 的临时覆盖随后反过来占住
  P/L pull 把手。腾位后 P 端先覆盖下目标，最终 B/S pull 让两锚同链左移，
  同时恢复上目标并把下目标覆盖从 P 端交给 L 端。全链只使用两种锚点的二格刚体、
  端点、把手和 mixed force chain，不依赖 crate/sticky 材料标签。
nonblocking_caveats:
  - 存在 21 步可恢复 P/L 往返 detour；不声称所有胜路保持六次对象动作直连
  - 非最优胜路可先移动并复原 B/S；不声称首次 B/S shift 全局固定
  - 审美与难度均保守为 4，不支持 5
