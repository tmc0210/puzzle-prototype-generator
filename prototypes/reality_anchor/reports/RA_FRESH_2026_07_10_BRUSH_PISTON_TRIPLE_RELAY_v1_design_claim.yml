design_claim:
  player_insight: >-
    唯一箱子第一次被拉到上目标时会跨过刚抬升的 B/S 边界变成 M；玩家却不能把这次覆盖当作完成，
    而要再次移动 B/S 把它刷回 C，并把 P/L 下拉成后半段的活塞导轨。随后箱子被主动推离旧目标并再次变成 M，
    B/S 下压让出混链位置；最后连续左拉 P/L，第一拉把 M、P/L 与边界一起重写为 C，第二拉把 P 端送回旧目标，
    再从下方把 C 拉入中目标。底目标同时由 S 端接管，形成 C、P、S 三种终局责任。
  causal_chain:
    - 从中廊上拉水平 B/S，使箱子横向抽取线落在 sticky 侧。
    - 右拉唯一箱子两格；第二格暂时覆盖上目标并 C->M。
    - 从下方再次右拉 B/S；边界右移使目标上的 M->C，并释放 P/L 下拉把手。
    - 下拉竖直 P/L，把中上工作区切换为可推活塞面，同时为末段左拉留下长轴余量。
    - 绕回箱子左侧，把已覆盖上目标的 C 主动右推离位并再次 C->M。
    - 下推 B/S，把 S 端的终局目标线与 P/L 混链线对齐。
    - 第一次左拉 P/L 触发 n2 混链，刚体 M 随链左移并 M->C；第二次左拉继续 n2，使 P 端覆盖旧上目标。
    - 从中目标上方下拉 C；C 覆盖中目标，S 覆盖底目标，P/C/S 三责同时闭合。
  state_reuse_claim: >-
    [2,2]-[4,3] 的小中廊先是 B/S 抬升与箱子刷写区，继而是 P/L 换相后的推离区，
    最后成为 M/P/L 混链回抽与箱子下拉区；同一上目标依次由 M、C 暂占，最终交给 P。
  why_not_execution: >-
    Trace Metric 只校准执行压力与空间复用。玩家侧价值必须来自“已覆盖目标仍需主动放弃”、
    “同一箱子两次变 M 又两次变回 C”以及“双锚不是并列机关，而是共同组成末段活塞”的因果重读；
    若独立 critic 认为这些只是标签堆叠或短走廊按键序列，高指标不得作为放行理由。
  falsification:
    - 完整终止胜态图不 complete 或 winning state 不唯一，候选失败。
    - 纯 walk 压缩后的可胜对象宏图存在第二条 loop-erased 初态到胜态路径，候选失败。
    - 任一胜路绕过两种锚点位移、两次 box_to_sticky、两次 sticky_to_box、两次 force_chain:n2、B/S 下推、P/L 末段双拉或既定 P/C/S 目标分工，候选失败。
    - 任一必要对象动作可交换到另一必要阶段之前且仍获胜，候选失败。
    - 独立 critic 的审美或难度低于 4，或任一正式 reviewer 的 required_action 非 none，不得提交。

lexicon_used:
  - heading: B/S 移动边界刷产物：远程生成与门口消费
    realization: B/S 先上拉、再右拉、最后下推；同一箱子因此在目标口经历 C->M->C->M，并为末段混链留下刷线状态。
  - heading: P/L pull 抽取把手：前格门、占格目标门与扫带
    realization: P/L 先被下拉建立纵向余量，末段从 L 端连续左抽；玩家前格、锚两格扫带与箱/M 占格共同锁序。
  - heading: P/L 长轴墙廊：L 端余量棘轮（mixed-chain 补谱）
    realization: 末段两次左拉均为 n2；第一次把 M 与锚同链抽回并改写为 C，第二次继续抽回并让 P 端接管上目标。
  - heading: 单箱目标活塞顺序锁：推入覆盖与回撤撤销
    realization: 箱子在上目标形成两次临时覆盖，随后必须主动推离；旧目标最终由 P 接管，箱子改投中目标。

new_linkage: >-
  B/S 抬升刷入 M -> B/S 右拉刷回 C -> P/L 下拉换相 -> 单箱离位再刷 M ->
  B/S 下压对齐 -> P/L 双级 n2 把 M 刷回 C 并接管旧目标 -> C 下拉、S 侧接管，
  把移动边界、目标活塞和 mixed-chain 余量棘轮编成一条严格唯一的 P/C/S 三责回织链。
