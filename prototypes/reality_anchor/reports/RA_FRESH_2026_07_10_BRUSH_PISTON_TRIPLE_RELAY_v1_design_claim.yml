human_feedback_contract:
  rejected_interpretation: 用两条真正可胜、职责不同或必要动作次序不同的计划制造非线性
  required_interpretation: >-
    推箱子式唯一解内部，通过同一箱子的多次材质改写、同一目标的职责易手、
    同一中廊在刷线与混链阶段的复用，形成非线性阅读。
  unique_solution_boundary: >-
    允许纯走位路径差异，也允许完整返回同一对象宏状态后可被 loop erase 的空转；
