critic_items:
  - id: CI_PLAYER_GOAL_NAMES_SOLUTION
    type: core_blocker
    target_ref: player_goal
    design_relation: "玩家看见六个目标与可覆盖它们的对象；真实目标是覆盖全部目标，但字段直接要求‘用同一根重拼竖直黏条’与指定 P/L/箱分工，预先写入了规范解。"
    attack: "该表述不是玩家在行动前拥有的目标，而是解法命名；它把 RU1-RU4 本应产生的问题提前回答，削弱 player_question 的评审可读性。"
    evidence_basis: "facts packet 的 win_condition 是 all_targets_covered_by_objects；claim 的 player_goal 额外指定重拼竖条、上下箱和 P/L 各自覆盖哪一列。"
    player_facing_effect: "无法从该字段区分玩家自然形成的目标、设计者期望路线和事后规范解摘要。"
    blocks_proposal_ready: true
    expected_designer_response: revise_claim
  - id: CI_NO_MERGE_ROUTE_UNRESOLVED
    type: context_gap
    target_ref: RU4_reweave_middle_then_move_as_rigid_bar.alternative
    design_relation: "规范路线把中箱推入 x=7 两端点之间并形成竖条，随后整体右送；但另有64步胜路完全跳过 box_to_sticky 与 sticky_merge。"
    attack: "64 对 21 的长度差只能说明执行成本，不说明无重拼路线在玩家概念上更难、更隐蔽或只是笨重绕路。若它以更直接的逐件腾挪获胜，实际玩家可能避开回织洞见，仍会部分重演 RA_CAND_0024 的机制承诺落空。"
    evidence_basis: "event gate 只证明 avoiding win first cost=64；claim 未给出该路线的可见入口、核心对象角色、关键局面或与规范路线的玩家问题对比。"
    player_facing_effect: "当前不能判断‘重拼是游戏末期挑战的核心体验’还是‘重拼仅是优化路线’，因此审美5追求和 target role 尚不能完全放行。"
    blocks_proposal_ready: true
    expected_designer_response: add_context_next_review
  - id: CI_RU3_ALTERNATIVE_THIN
    type: nonblocking_risk
    target_ref: RU3_cut_old_bridge_and_assign_outputs
    design_relation: "玩家把 B/S 移到 B=x6、S=x7 后得到三箱与两端点，并在后续使用中箱回织。"
    attack: "该单元说明了正确停位的结果，却没有展示另一个合法停位的局部收益、具体矛盾与可见反馈；单独看 RU3，可能更接近坐标对齐执行而非独立推理。"
    evidence_basis: "RU3 提供 premises、conclusion 与 feedback，但没有 alternative；其价值目前主要由 RU1 的早切反例及 RU4 的后续消费支撑。"
    player_facing_effect: "不推翻整体至少4的跨阶段难度，但限制把每个单元都计为强推理，也限制难度5主张。"
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI_AESTHETIC_FOUR_NOT_FIVE
    type: score_boundary
    target_ref: target_scores.aesthetic
    design_relation: "规范解在小棋面完成让槽、切割、对象改职、回织和整条入目标；无重拼路线仍可获胜。"
    attack: "当前结构足以守住4分下界，但在无重拼路线的玩家侧性质未说明前，不支持5分审美主张。"
    evidence_basis: "相较 RA_CAND_0025，规范路线具有同等级紧凑构造与更明确的几何角色改写；相较 RA_CAND_0022，尚缺少能排除概念性逃课路线并确认唯一强烈终局重读的玩家侧材料。"
    player_facing_effect: "试玩若自然发现回织路线，回报清晰；若更自然地逐件绕行，则核心惊喜和凝练度会下降。"
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI_GRAPH_BUDGET_LIMIT
    type: diagnostic_note
    target_ref: graph_facts
    design_relation: "图搜索达到约300001状态、650484转移与13个胜态后耗尽预算。"
    attack: "该事实不能用于宣称 unique、完整 SCC、完整分支质量或更高审美。"
    evidence_basis: "facts packet 已明确完整图预算耗尽及上述结论 unknown。"
    player_facing_effect: "没有新增可由玩家感知的局面关系，仅限制评审结论边界。"
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking

diagnostic_interpretations:
  - graph_fact: "reachable_states_seen=300001，transitions_seen=650484，winning_states_seen=13，budget=300000，status=exhausted。"
    neutral_meaning: "搜索耗尽预算；unique、完整 SCC 与完整分支质量均 unknown。"
    player_facing_interpretation: "没有足够图事实说明玩家只会遇到单一胜利结构，也没有足够图事实否定当前规范路线的玩家侧因果链。"
    verdict_effect: none

handoff_notes:
  - "下一轮先把 player_goal 改写为玩家可见的胜利目标，例如‘让六个目标全部被对象覆盖’，把重拼竖条与对象分工留在 reasoning conclusion/resolution。"
  - "下一轮需从现有64步无重拼路线提供玩家侧摘要：入口局面、主要对象操作、棋盘具体变化、为何它是非阻塞长绕路或为何它构成概念逃课；不得只重复 cost=64。"
  - "若无重拼路线只是高执行成本但概念更直接，建议结构修订以让回织成为所有合理胜路责任；若它本身需要更深的因果链且不稀释回织的自然可发现性，可作为非阻塞风险保留。"
  - "本评审不授予 accepted/mainline/reference，也不替代最终 judge。"
