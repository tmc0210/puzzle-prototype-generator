independent_reading:
  status: completed
  player_goal_seen: "把右侧四个 G 全部用对象覆盖；棋面把顶部 P/L 双锚区、底部 B/S 转换区与中间黏块几何同时放进达成目标的操作空间。"
  salient_relations_seen:
    - "玩家看见中列三格纵向 M 及其右上、右下两格 m，右侧四个 G 与上下两个锚区；规范操作先移动黏刚体，再跨 P/L 与 B/S 边界，棋盘由黏体发生 n3 黏转箱并切出 n1、随后 n1 箱转黏并重拼 n1，因此后续目标覆盖必须利用切后对象角色与重拼后的几何继续改序。"
    - "玩家若开局立即向右，眼前 B/S 边界会立刻造成 n3 黏转箱与 n1 切割；棋盘过早获得分离件，但从该局面到胜利最短还需 36 步、总计 37 步，因此规范 21 步路线要求先用向上四步及后续锚区操作改变局面，再消费切割结果。"
    - "规范路线中箱转黏与黏重拼各发生一次；完成这些操作后棋盘能在 21 步获胜，跳过任一事件仍存在 64 步胜路，因此重拼明确改变后续路线效率与操作责任，却不是所有胜路的硬门。"
  unclear_or_unreadable_parts:
    - "facts packet 未展示逐步棋面，尚不能仅凭事件表确认每次切割与重拼发生时玩家可见的具体局部形状、哪一目标/通道因此新增或失去可达操作。"
    - "完整图预算耗尽，unique、完整 SCC 与所有胜路顺序未知；该图事实本身不提供玩家侧质量结论。"
  initial_quality_risks:
    - "64 步无箱转黏/无重拼胜路可能是非阻塞长绕路，也可能削弱‘拼接是核心洞见’的承诺；必须由 claim 中的玩家问题、alternative 与可归因反馈说明为何 21 步因果链而非路线税成立。"
    - "规范解 21 步、非行走事件 25 个且执行压力 band 4，只说明状态操作密集；若额外事件没有被后续具体消费，困难度可能来自执行与改序负担而非至少 4 分的结构推理。"
    - "紧凑、近对称的黏块与双锚布局具有清晰视觉骨架，但若 claim 不能把切割、分件、重拼逐项连到可预测的后续操作，仍可能重演 RA_CAND_0024 的机制外观强而玩家洞见弱。"

player_facing_merits:
  - id: MERIT_REUSED_COLUMN
    exact_scene: "开局玩家在 (3,6)，完整 C 形位于 x=5..6、P/L 位于其上方；玩家先沿左侧空列上行并向右推动完整 C 形一格，旧 x=5 连接柱位置成为 P/L 下方连续竖槽，随后三次 down 能把 P/L 拉过刚腾出的同一列，使后续 P/L 可从下方回推中箱。"
    player_facing_value: "同一列先承担黏体占位、再承担锚点通道、最后承担回推准备，前一步的空间让渡被后一步直接消费，形成紧凑而可归因的空间复用。"
  - id: MERIT_CUT_ASSIGNMENT
    exact_scene: "C 形右移后连接柱落在 x=6、上下端点落在 x=7；玩家把 B/S 右推到 B=x6、S=x7，棋盘把 x=6 三格转换成箱并把 x=7 上下黏端点分开，于是上下箱留在左列目标，中箱获得被 P/L 回推的独立角色。"
    player_facing_value: "切割不是装饰性事件：切后同一原物被分配为两个已覆盖件、一个待回织中箱和两个黏端点，直接改变后续每个对象能执行的操作。"
  - id: MERIT_REBIND_PAYOFF
    exact_scene: "切后 x=7 上下端点之间留出中间缺口；玩家把 P/L 从下方带回中线并推动 x=6 中箱进入缺口，第20步出现三格竖直黏条，第21步再将整条刚体右送至 x=8 的三目标，同时 P/L 留在 x=6 中央目标。"
    player_facing_value: "中箱先作为切割产物、再作为连接件改变两个端点的刚体关系，最后新刚体一次承担三目标覆盖；拼接结果立即产生新的整体移动能力和清晰终局回报。"
  - id: MERIT_EARLY_CUT_TEMPTATION
    exact_scene: "开局向右会立即使 B/S 触发 n3 黏转箱与 n1 切割，看似先获得分件；但该局面最短仍需 36 步，而先上行移动完整 C 形后规范路线总计 21 步。"
    player_facing_value: "最邻近的机制动作给出真实局部收益却破坏高效顺序，要求玩家在切之前先判断完整几何还需承担的通道让渡责任。"

supported_reasoning:
  - unit_ref: RU1_make_anchor_chute_before_cut
    reason: "行动前能看见 P/L 下方被连接柱占据；先整体右移会具体空出连续竖槽，且开局立即切割虽合法并有反馈却把最短总成本提高到 37，因此问题不是唯一显然动作。"
  - unit_ref: RU2_pull_pl_through_reused_column
    reason: "C 形右移后玩家位于 L 侧、继续向右被刚体占位阻止，而向下能把身后的 P/L 拉入新槽；锚点下移被 RU4 回推中箱继续消费。"
  - unit_ref: RU3_cut_old_bridge_and_assign_outputs
    reason: "B/S 的箱侧与黏侧分别对准 x=6 连接柱、x=7 端点时，操作会把一个 C 形拆成角色不同的三箱与两端点，切后对象分工可从棋盘结果直接观察。"
  - unit_ref: RU4_reweave_middle_then_move_as_rigid_bar
    reason: "中箱与上下端点的缺口同轴，P/L 已被前序移动到可回推位置；把中箱推入缺口后新竖条才可作为整体右移并同时覆盖右列三目标，兑现了前序让槽、拉锚与切割分工。"

