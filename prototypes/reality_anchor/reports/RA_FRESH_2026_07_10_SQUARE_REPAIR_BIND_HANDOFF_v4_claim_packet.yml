candidate_version: RA_FRESH_2026_07_10_SQUARE_REPAIR_BIND_HANDOFF_v4
review_iteration: 3
claim_last_review: true

slot_brief:
  intended_role: late_challenge_or_capstone
  known_before: all_current_reality_anchor_runtime_rules
  target: 双锚点后期挑战；难度至少 4，追求更高；审美至少 4，追求 5。

target_role_notes: >-
  这是形状修复、拆分与交接题，不把搜索规模、事件次数或被迫开局当谜底。
  玩家要把同四格材料依次解释为箱态正方形、CC/MM 混合刷子、1+3 分裂态和
  偏移黏态正方形；每次变形都为下一种把手关系服务。

design_claim:
  player_insight: >-
    开局补成的 2x2 不是应直接搬向目标的成品。B/S 只刷下排后，玩家必须从唯一上口
    沿纵轴剪右列，使箱与黏块互相传力并得到 L3；剩余箱则先横向让位，再在固定 P/L
    的 pull 侧被抽成缺角单格。真正洞见是主动把完整方块拆成 1+3，再让两部分在偏移
    一格的位置重绑，恢复成能整体拉入目标的黏态 2x2。
  causal_chain:
    - 向上推动初始 M 过 B/S 边界，M 转箱并补成箱态 2x2；缺角材料被纳入主体。
    - 把 B/S 向上移动一次，下排两箱转为相连 MM，形成上 CC、下 MM 的混合刷子。
    - 绕到唯一上口后向下推右上箱；force chain 下移右列并归一化，生成三格 L 黏块与剩余单箱。
    - 先把单箱左推让位，再从固定 P/L 的 pull 侧把它向下抽成单格 M。
    - 把 L3 左拉一格与单格 M 合并，得到偏移黏态 2x2；随后整体左拉三格覆盖四目标。
  why_not_execution: >-
    规范解 22 步中有 13 次 walk，B/S 位移后到唯一上口尤其有连续六步走位；这些不计作
    结构难度。所主张的 4 档只来自玩家必须否定“完整方块直接向目标剪”的合理读法，
    并提前规划纵剪、单箱让位、pull 侧补角、偏移重绑的多阶段职责链。若 critic 认为
    墙齿已把纵剪提示得过强、六步路线主导节奏，或 1+3 只是顺序执行，则门槛失败并须改版。
  required_winning_path_events:
    - one movable B/S shift
    - one sticky_to_box occurrence
    - at least three box_to_sticky occurrences
    - at least three sticky_merge occurrences
    - at least one force_chain
    - at least one pull_object through fixed P/L semantics
    - at least five sticky rigid moves
  required_winning_path_shapes:
    - completed crate 2x2
    - exact sticky 2x2
    - exact singleton plus L3 split
    - exact offset 2x2 rebound
  forbidden_winning_path_events:
    - win_without_moving_BS
    - win_without_fixed_PL_pull_semantics
    - win_without_any_required_shape
  falsification:
    - 任一完整 all-solution/count/shape probe 发现旁路，核心 claim 失败。
    - 若提前横剪并非玩家会相信的计划，或其失败只能靠试错发现，状态重读 claim 失败。
    - 若 1+3 拆分与偏移重绑没有主动规划价值，只是沿墙执行，构造 claim 失败。
    - 若 P/L 可移动、B/S 无需移动或任一锚点只作图标，双锚点承诺失败。
    - 若玩家侧独立评审只支持难度 3 或审美低于 4，不得进入提交前优化与待玩列表。

lineage_claim:
  relation: fresh_structural_replacement
  archive_variant_authorized: false
  why_not_archive_variant: >-
    本版针对前两轮 critic 的“强制构造、二元重试、路线税”结论更换为缺角修复—纵剪—
    1+3 重绑结构；没有使用 archive、package 其它 level 或其它线程候选的布局与因果链。

lexicon_used:
  - B/S 绑定债：箱资源生成黏块形状
  - B/S 移动边界刷产物：远程生成与门口消费
  - P/L 边界交接：推入、跨侧与抽取分配
new_linkage: >-
  初始 M 跨过 B/S 先补成箱态正方形；移动 B/S 只刷其下排，远程生成 CC/MM 混合刷子。
  唯一上口消费右列并把正方形剪成 L3+箱；箱先让位，再由固定 P/L 抽成单格 M，最终与
  L3 在偏移位置重绑成黏态正方形并整体交付。两条边界不是各演一次，而是共同完成
  “补角—刷形—拆分—跨侧补角—重绑”的同一材料循环。
