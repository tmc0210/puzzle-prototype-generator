designer_claim:
  player_experience_core: >-
    多个空间分离的 P/L 目标活塞不能逐个保留完成；一件完整、连通且具有多个远端触点的
    巨大黏块把互相冲突的最后动作压成同一拍。
  player_action: >-
    玩家先用 B/S 把分离箱构件逐列并入巨大主体，形成上下双钩，再绕到主体背面右推，
    让两个远端触点同拍推动两只目标箱。
  visible_payoff: >-
    分离材料逐段并入同一巨大轮廓；终拍整块 C 形平移，两只目标箱同时从 CG 变为 C*。
  why_this_growth_exists: >-
    尝试把 baseline 直接领取成品的开局改成由玩家主动构造多触点完成形，再立即使用同一结构收束活塞。
  work_identity_conditions:
    - 构造后的完成形必须保持一个视觉完整、机械连通的巨大主体。
    - 胜利终拍必须由完成形同拍推动两个空间分离的目标箱。
    - B/S 转换出的材料必须进入最终完成形，不能在核心动作前退休。

packaging_account:
  opening: 玩家看到厚脊、三列分离箱构件、可横移的 B/S 与上下两只目标活塞。
  preparation: 玩家向右推动 B/S，使箱构件逐列变为 sticky 并接入主体。
  reveal_or_use: 第三列完成上下钩尖，形成可同时命中两个目标箱的双钩 C 形。
  ending: 玩家绕到厚脊背面右推，两个远端触点同拍收束目标后立即胜利。
  every_major_element_role:
    - 厚脊是持续存在的巨大主体、构造基底和终拍受力把手。
    - 八只箱构件与 B/S 共同承担完成形的前序构造。
    - 上下目标箱、目标和 P/L 形成不能逐个保留的活塞终局。
    - 左侧通道连接构造位置与主体背面。
  known_perceptible_defects:
    - 正确胜路中的三次 B/S 右移都属于唯一可胜承诺；是否构成主动构造交由 fresh reviewer 判断。

