designer_claim:
  player_experience_core: >-
    三个空间分离的 P/L 目标活塞都要求自己成为最后动作，无法逐个保留完成；
    一个完整三叉黏块把三个互相冲突的最后动作压成同一拍。
  player_action: >-
    玩家可以验证单个锁箱推入后必须拉回，再绕到巨大结构左侧，把完整结构连续右推两次，
    由第二次推动同时命中三个目标箱。
  visible_payoff: 完整巨大结构平移，三个远距横臂同拍接触，三个目标同时由 CG 变为 C* 并立即结束。
  why_this_level_exists: 直接、完整地呈现多个“最后动作”之间的矛盾，以及完整多触点结构的一拍解法。
  work_identity_conditions:
    - 三个目标各自在只能从 L 侧原路退出的一格锁箱口，单独完成不能累积。
    - 同步动作开始时三叉结构保持一个连通刚体和三个等相位触点。
    - 胜利终拍由同一输入的完整结构力链同时推动三只目标箱。

packaging_account:
  opening: 玩家开局位于三只目标活塞与完整大结构之间，可观察锁口和三条对应横臂。
  preparation: 玩家不逐个纠缠活塞，绕到结构背面。
  reveal_or_use: 第一次右推进入三触点相邻的承诺位，第二次右推形成三分支同步力链。
  ending: 三个目标同拍覆盖后立即胜利。
  every_major_element_role:
    - 21 格三叉结构是视觉主体、唯一三触点同步 driver 和终局直接受力对象。
    - 三只箱、三个目标与狭廊共同形成三个不能分别保留的 P/L 活塞。
    - P/L 决定单锁回撤关系并在终拍切下三个越界触点。
    - B/S 只承担巨大 sticky 的材料边界合同。
  known_perceptible_defects:
    - 顶部或底部绕行较长，但不计作谜题难度。
    - B/S 隔离固定，没有独立玩家操作回报。

