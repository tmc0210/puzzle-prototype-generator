review_attempt_id: RA_TREE_FORGED_V6_REVIEW_01
prototype_id: reality_anchor
review_target: growth_child
prototype_rules:
  confirmed_rules:
    - 玩家所在 P/L 边界一侧在输入时决定本次为 push 或 pull。
    - push/pull 受力闭包会递归包含同方向目标格上的全部可动物；任一分支被墙或越界时整步原子失败。
    - 多格 sticky 以完整连通分量作为刚体移动，移动后才按 B/S 边界归一化、合并或切分。
    - 所有目标必须同时被 crate、sticky 或锚点覆盖才胜利；玩家覆盖不计。
  win_condition: all_targets_covered_by_objects
  object_and_event_semantics:
    - 单箱在 P 侧推过边界后，玩家落在 L 侧；狭廊中离开只能 pull 回箱子并撤销目标覆盖。
    - 一个大型 sticky 的多个前沿格可在同一输入中接触多只独立箱，形成原子多分支力链。
    - 力链内对象同步移动；同一输入不存在可用于设计的隐藏先后顺序。
    - 固定 B/S 可让边界左侧保持 sticky、右侧保持 crate；最终接触齿跨线后可被切为 crate。
  player_prior:
    - 游戏后期玩家，已掌握小黏块组可达性、可动性、拼接、切分和刚体移动。
    - 已掌握 B/S、P/L、锚点移动、多对象力链和常规腾挪。
    - 能迅速识别巨大结构、触点对齐和明显几何意图并稳定执行走位；这些不作为难度。
human_review_constraints:
  - statement: 本任务允许忽略由超大型完整结构本身造成的额外绕行与回返走位审美损失； 这类走位不作为质量门阻断项，也不计入难度。
    human_source_ref: human_brief_2026_07_15#giant_structure_walking_aesthetic_exemption
