  opening_read: >-
    开局中央是一块轮廓极醒目的三齿巨型 sticky，三条横臂的前端与右侧三只箱子、三个目标逐行对应；
    玩家很快能读出应从左侧推动整块结构，让三条齿同时成为活塞。玩家却出生在结构右侧中段，
    首次有效操作面位于左上侧，需要先沿上方空地绕到那里。
  player_actually_does: >-
    玩家先连续走十二步，从巨型结构右侧绕至最上方横臂的左侧；随后向右推动整个 sticky 两次。
    第一次推动把三条齿整体送到三只箱子旁，第二次推动在同一原子输入中让三条齿共同传力，
    将三只独立箱子同时推上各自目标，并使跨过固定 B/S 边界的三个齿端转化为 crate。
  key_visible_changes:
    - 巨型三齿 sticky 第一次整体右移一格，三条齿端同时与三只箱子完成对齐。
    - 第二次右推让完整刚体再次平移，并在一个同步力链中把三只箱子同时送上三处目标。
    - 同一次终局输入中，越过固定 B/S 边界的三个 sticky 齿端同时切为 crate，三处目标一起变为覆盖态。
  visible_payoff: >-
    一个右推动作让玩家亲眼看到巨型三齿结构同时驱动三条相隔的物体线；三只箱子同步落位、
    三个齿端同步变材质，回报集中且与开局构图直接对应。
  ending_read: >-
    第二次推动后所有目标同时覆盖，关卡立即结束，没有高潮后的清理步骤；收束本身清楚、完整。
