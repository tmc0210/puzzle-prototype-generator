experience_core:
  experience_statement: 玩家面对几个彼此空间分离、各自推上目标后若要离开就必须拉回撤销的 P/L 活塞， 先建立“它们不可能逐个都作为最后一步”的矛盾；随后准备并操作一个视觉上完整的大型黏块， 用分布在结构不同位置的多个触点在同一刚体动作中把所有活塞同时送入目标。
  player_action: 先使各活塞处于可被共同推进的同相状态，再把完整大黏块送入承诺位并完成一次同步终局 stroke。
  visible_payoff: 大结构整体平移，多个远端触点同拍命中各自箱子，多个目标在同一帧同时由 G 变为 * 并立即胜利。
  identity_conditions:
    - 每个目标活塞单独推入后，若关卡尚未胜利，玩家必须 pull 回撤并撤销该目标。
    - 同步终局动作开始前，大结构是一个视觉完整且机械连通的 sticky 刚体。
    - 同一次刚体移动通过至少两个空间分离触点推动至少两个独立目标箱，并立即达成所有目标。
    - 少一触点、少一结构连接或任一触点分支被墙拒绝时，不能得到同一同步胜利。
    - 巨大结构的准备、移动和终局使用属于同一因果链，前置对象不在高潮前退休。
