    claim: >-
      代表性的上活塞单独 right 推入目标后尚未胜利；紧接的 left 会 pull 同一箱并撤销覆盖。
      三个口袋在布局中仅作 y 方向平移，具有相同墙与 P/L 侧关系。
  - claim_id: three_tip_identity_for_same_stroke
    claim: >-
      删除下臂最右触点后，相同 canonical inputs 的最后一拍只产生 force_chain:n3 与 sticky_to_box:n2，
      只覆盖上、中目标且终态不胜；本声明不推及该反事实的全局可解性。
  - claim_id: connected_structure_identity_for_same_stroke
    claim: >-
      删除竖脊连接格后，相同 canonical inputs 只移动上部 sticky#2，最后一拍为 force_chain:n3 与 sticky_to_box:n2，
      下部不在同一输入的受力闭包且终态不胜；本声明不推及该反事实的全局可解性。
  - claim_id: lock_exits_create_contradiction
    claim: >-
      打开三个目标口袋的向下侧出口后，给定反事实 trace 依次以 push_object:crate#1、#2、#3
