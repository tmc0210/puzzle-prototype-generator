reviews:
  - case: CASE_A
    main_player_facing_merit: "合并、切分、换绑与两类锚点移动在狭小空间连续改写可操作形态。"
    dominant_aesthetic_problem: "中段多次往返搬锚与重绑，玩家可能更像维护状态账本而非追逐清晰矛盾。"
    aesthetic_band: 4+
    verdict: playtest_worthy
    reason: "变化虽多，但多数彼此制约并服务终局重定向；紧凑空间足以支撑复杂度，需实测确认可读性。"

  - case: CASE_B
    main_player_facing_merit: "短序列把黏条切成两箱，再要求分置、对线并以三物受力链收束。"
    dominant_aesthetic_problem: "切割后的箱体整理偏常规，前三步已暴露主要做法。"
    aesthetic_band: 4+
    verdict: playtest_worthy
    reason: "边界转化直接产生后半段所需对象，最终又让锚点参与同一条因果链，篇幅与内容匹配。"

  - case: CASE_C
    main_player_facing_merit: "先将箱并入黏条，再切回多箱分送三目标，材料形态贯穿完整生产链。"
    dominant_aesthetic_problem: "各阶段近似按顺序执行，目标分发较像流程验收，缺少持续的选择压力。"
    aesthetic_band: 2-3
    verdict: borderline
    reason: "机制表达清楚且收束整洁，但已给信息呈现的是线性加工与逐个落点，尚不足以稳证审美4。"

  - case: CASE_D
    main_player_facing_merit: "两类锚点接力完成搬运、切箱和终局推进，远端目标与材料变化相互牵制。"
    dominant_aesthetic_problem: "B/S三格往返和P/L连续推进造成明显重复，34步中较多成本用于复位与运输。"
    aesthetic_band: 2-3
    verdict: borderline
    reason: "局部链条有力度，但核心变化被长距离锚点摆渡稀释；需要实测其空间压力是否足以抵消重复。"

  - case: CASE_E
    main_player_facing_merit: "同一黏条反复切成箱、回并成L形、再切割覆盖双目标，形态记忆形成连贯主线。"
    dominant_aesthetic_problem: "多次左右撤销式重绑与最长七步走位拖慢节奏，终局前准备显得偏长。"
    aesthetic_band: 4+
    verdict: playtest_worthy
    reason: "反复并非纯复位：每次跨界都改变形状或目标关系，终局复用此前形态，复杂成本基本获得回收。"

  - case: CASE_F
    main_player_facing_merit: "十步内箱、黏体、B/S受力链高度密集，几乎每次移动都改变解题状态。"
    dominant_aesthetic_problem: "P/L在摘要中完全不参与，B/S末尾下拉再上推也可能呈现为机械回摆。"
    aesthetic_band: 2-3
    verdict: borderline
    reason: "主体链条紧凑，但闲置的整组锚点会削弱构图诚实性；需实测末两步是否产生真正洞见。"

  - case: CASE_G
    main_player_facing_merit: "七格C形黏体一次切割后分成双臂与三箱，宏观形态变化鲜明且带顺序约束。"
    dominant_aesthetic_problem: "首次合并后有长通勤，P/L未参与；大片走廊与多个收尾目标让单次切割承担过重。"
    aesthetic_band: 2-3
    verdict: block
    reason: "核心景象有辨识度，但32步和十一格纯走位主要用于抵达与逐项收尾，现有整体经济性不足审美4。"

cross_case_notes: "B以最短篇幅让转化结果成为后续工具，经济性最佳；A、E靠多阶段形态复用支撑复杂度。C、D有完整机制链，却分别受线性流程与重复摆渡拖累。F的密度未消除闲置P/L疑点；G虽有最大形态奇观，但通勤、闲置组件和分散收尾使外围成本最重。"
