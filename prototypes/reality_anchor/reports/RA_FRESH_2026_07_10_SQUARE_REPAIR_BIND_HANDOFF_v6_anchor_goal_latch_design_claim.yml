candidate_version_planned: v6_anchor_goal_latch
lineage: current_turn_revision_after_human_feedback
review_iteration_planned: 5

human_feedback_correction:
  rejected_interpretation: "让中段出现两条真正可胜计划"
  required_interpretation: "保持唯一正确解法，以唯一解内部的回读、次序锁和空间变义降低线性"

slot_brief:
  intended_role: late_challenge
  allowed_exposure_through: all_current_reality_anchor_runtime_rules
  target: "双锚点后期挑战；难度至少4并追求更高，审美至少4并追求5"

design_claim:
  player_insight: >-
    B/S 上移并刷出 CC/MM 后，锚点还没有完成职责。玩家必须先穿过锚点未来要占据的双目标门，
    在门另一侧取得纵剪把手；剪切完成后再从外侧把 B/S 横推到双目标上，永久关闭刚刚使用的通路，
    然后回到中央用固定 P/L 完成单格抽取、偏移重绑与最终交付。
  causal_chain:
    - M 补角生成箱态 2x2；B/S 上移一次刷成上箱下黏。
    - 玩家穿过尚未被 B/S 占据的目标门，从唯一上口纵剪出单箱与 L3。
    - 玩家从门外侧把 B/S 横推一格覆盖双目标；该动作关闭回路，且早做会失去纵剪把手。
    - 返回中央让单箱让位，经固定 P/L 抽成单格 M，与 L3 偏移重绑。
    - 只在 B/S 双目标已覆盖后，重绑 2x2 才可向左交付四个材料目标并获胜。
  why_not_execution: >-
    新增价值来自目标次序锁和同一双格门的状态变义，而不是第二条胜路或无信息绕行：
    B/S 既是远程刷线工具，也是必须延后关闭的目标门。若横推动作可任意提前/省略，
    或门格回访只是普通走路，claim 失败。
  falsification:
    - 完整胜向图存在两条玩家可解释的不同 winning responsibility chains，候选失败。
    - 任一胜解可以在纵剪前把 B/S 推上双目标，或完全不覆盖双锚目标，候选失败。
    - 任一胜解绕过 M 补角、B/S 纵向刷线、1+3 剪切、P/L 抽取、偏移重绑，候选失败。
    - 规范解没有在状态改变后重访目标门/上方回路，候选失败。
    - 独立 critic 仍把它读成纯阶段串联或走位税，候选失败。

tool_questions:
  - "完整图的 winning states / winning regions / viable commitments 是否支持唯一胜责链？"
  - "B/S 横向归位是否必发生在纵向刷线和第一次剪切之后？"
  - "目标门格是否先作为玩家通路、后被 B/S 覆盖，且回访不是 shuttle？"
  - "四种核心形态与双锚点职责是否仍为必经？"

lexicon_parts:
  - "B/S 绑定债：箱资源生成黏块形状"
  - "B/S 移动边界刷产物：远程生成与门口消费"
  - "P/L 边界交接：推入、跨侧与抽取分配"
new_linkage: >-
  将 B/S 的纵向刷线与横向目标门闩分成两个有次序约束的职责：先让门保持开放供玩家取得纵剪把手，
  再由门外侧把锚点推入双目标封门；材料 2x2 的重绑与左侧交付只能在门闩责任完成后收束。
