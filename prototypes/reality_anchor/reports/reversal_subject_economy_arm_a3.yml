reviews:
  - case: CASE_G
    main_player_facing_merit: 首推把箱与双黏臂合为醒目的大形，随后切割又拆回可分别调度的部件，状态转折清楚。
    dominant_aesthetic_problem: 大段纯走位和远距分送稀释两次关键变形；次序错误到后段才暴露，回滚惩罚难以局部预见。
    aesthetic_band: 2-3
    verdict: block
    reason: 有强烈场面变化，但有效决策过疏，关键禁忌更像延迟陷阱，未达到审美4。

  - case: CASE_E
    main_player_facing_merit: 三格黏条切箱、回并成L形，再以重建后的整体切割同时收束双目标，材料历程有回环。
    dominant_aesthetic_problem: 中段多次左右拆并近似撤销刚完成的状态，七步纯走位又让终局因果暂时脱离视野。
    aesthetic_band: 2-3
    verdict: borderline
    reason: 结尾能回收前置塑形，但过程的往返负担偏重，需要实玩确认洞见感是否胜过手续感。

  - case: CASE_C
    main_player_facing_merit: 单箱并入黏条成为三格整体，整体搬运后再切成两箱一黏块，三种终态恰好分赴三目标。
    dominant_aesthetic_problem: 决定性切割完成后，三个部件基本依次直送目标，后段惊喜和选择压力较弱。
    aesthetic_band: 4+
    verdict: playtest_worthy
    reason: 合并、搬运、分裂、分送构成一条易读且完整的材料逻辑，瑕疵主要在收尾略程式化。

  - case: CASE_B
    main_player_facing_merit: 黏条过界变成双箱后必须分开整队，最终借三物受力链把锚点拉上目标，短程内前后强关联。
    dominant_aesthetic_problem: 开头连续左推接近强制执行，中段调位空间有限，首次体验可能更像找唯一站位。
    aesthetic_band: 4+
    verdict: playtest_worthy
    reason: 切割不是展示而是终局受力链的前提，结构紧凑，且最终动作能解释此前调位。

  - case: CASE_F
    main_player_facing_merit: 两箱、黏块与B/S在极小空间互相让位，箱子过界并黏后又参与锚点受力链，动作持续改写局面。
    dominant_aesthetic_problem: 末两步先下拉再上推同一锚点，外观近似原路撤销，胜因可能不如过程密度直观。
    aesthetic_band: 4+
    verdict: playtest_worthy
    reason: 几乎无空转且前置箱位确实汇入结尾链条；需实玩观察末步是否读成收束而非开关试探。

  - case: CASE_A
    main_player_facing_merit: 两类锚点交替改变黏体的合并、切箱与再绑定条件，早期拆出的材料会在后段重新参与塑形。
    dominant_aesthetic_problem: 多次短促重绑与锚点换位缺少单一醒目的中段里程碑，玩家可能只感到连续维护局面。
    aesthetic_band: 4+
    verdict: playtest_worthy
    reason: 小空间内各次变形大多有后续用途，耦合足以支撑高档；但信息负荷需要实玩检验。

  - case: CASE_D
    main_player_facing_merit: B/S远拉携材、切箱，再转由P/L和分离箱完成收束，两套受力关系确有接力。
    dominant_aesthetic_problem: B/S三次右移后又三次左返，末尾P/L再连续三推，长距离重复把关键切割包在搬运劳动中。
    aesthetic_band: 2-3
    verdict: borderline
    reason: 局部因果成立，却缺少与34步规模相称的认知跃迁；整体更像耐心编排而非紧致洞见。

cross_case_notes: B、C把边界变形直接变成终局所需的部件或受力关系，核心想法最容易被玩家读出；F、A密度较高且耦合真实，但仍需防止维护步骤遮住里程碑。E、D的主要风险是往返操作近似撤销，G则把少数强变形摊在长走位和迟发次序陷阱之间。审美4应由计划被清晰改写并得到回收来支撑，而不是由事件、步数或机制覆盖率支撑。
