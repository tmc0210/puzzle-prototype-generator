design_claim:
  player_insight: >-
    中央四目标不是把第一次成形的方块直接送入即可。玩家要把同一批材料先拆成上下两层，
    再把 B/S 当成四笔状态机：上刷绑定、下刷释放、再次上刷重绑，最后横移覆盖锚点双目标。
    每一笔之间都必须回到中央改写材料的相对位置；过早锁住目标或把锚点送终点都会失去下一笔把手。
  causal_chain:
    - 初始 M 上推越过 B/S，补成箱态 2x2；随后从上口拆分右列并把左上箱让位。
    - 通过固定 P/L 的 push/pull 分工，把两箱留在中央上层目标、把黏条送到下层偏移位置。
    - 第一次纵移 B/S 向上，远程把中央上层改成黏态；玩家把上层压入下层并重组刚体。
    - 纵移 B/S 向下，释放上层两箱；玩家重排剩余黏条，使下一次刷线只得到目标所需的 2x2。
    - B/S 再次向上完成中央 2x2 重绑；最后横移一格覆盖锚点双目标，唯一终态同时满足六目标。
  why_not_execution: >-
    难点应来自四次 B/S 位移之间的状态责任：同一中央格反复承担箱、黏块、目标覆盖、
    拉取把手和再次刷线输入。规范解虽长，若其中的往返只是路线税、玩家无需预测下一次刷线产物，
    或 critic 判定 57 次 walk 主导体验，则本 claim 失败，不能以高执行指标补救。
  falsification:
    - 完整图若不是 complete，或存在不同对象/锚点终态与不同胜责链，候选失败。
    - 任一胜解少于四次 B/S 位移，候选失败。
    - 任一胜解可绕过 sticky_to_box、box_to_sticky:n2、pull crate、pull sticky、force chain 或 sticky rigid movement，候选失败。
    - 玩家侧若把四笔锚点读成机械往返而非状态改写，审美门槛失败。
    - 独立 critic 的审美或难度低于4，或 required_action 非 none，候选不得提交。

lexicon_used:
  - "B/S 绑定债：箱资源生成黏块形状"
  - "B/S 移动边界刷产物：远程生成与门口消费"
  - "P/L 边界交接：推入、跨侧与抽取分配"
new_linkage: >-
  将同一中央目标区作为连续三次 B/S 纵向刷线的共享 consumer，并把 B/S 本体的横移终点做成双目标锁扣；
  材料目标与锚点目标互相限制收束次序，从而保持唯一胜责链但让同一空间反复变义。

tool_questions:
  - "完整图是否只有一个对象/锚点终态，且所有胜解至少四次移动 B/S？"
  - "双向材质转换、P/L pull、force chain 与黏块刚体移动是否全胜路必经？"
  - "SCC 的分叉/合流是否是同一职责链内的重排，而不是第二种可胜计划？"
  - "57 次 walk 是否让玩家体验退化为 RA_CAND_0006 / RA_CAND_0024 所警告的腾挪复杂度？"
