  aesthetic_target_fit: >-
    3/5，不达审美 4 分门槛。三目标职责接力和末段 P/L 双拉有可见结构，但 B/S 的材质循环只作用于
    singleton，玩家没有使用黏连、拆分、形状占格或刚体几何；双锚与多次转换的视觉承诺高于实际洞见，
    与 RA_CAND_0024/0027 的警戒同类但程度较轻，因此高于 1 分反例、低于 RA_CAND_0026 的干净 4 分。
  difficulty_target_fit: >-
    4/5 可支持，5/5 不支持。玩家要维护三目标临时职责、主动把已上目标的箱推离，并预见 P/L 两次左拉后的
    P/C/S 终局分工；但完整规范链在开局之后高度固定，局部可行动作多为顺序执行，且部分表面复杂度来自标签叠加与换侧走位。
  critic_items:
    - id: PC1_SINGLETON_MATERIAL_AFFORDANCE_GAP
      type: core_blocker
      target: player_insight
      claim_relation: >-
        facts 已明确 M 永远是 singleton、没有 sticky_merge，C 与 M 的单格移动几何相同；这使“材质循环”不能作为高审美核心洞见。
      evidence_basis: >-
        规范链两次 box_to_sticky:n1、两次 sticky_to_box:n1；唯一一次 move_sticky_rigid 仍只移动单格 M。
        RA_CAND_0024/0027 的人评均把“高机制标签但没有黏块几何消费”判为审美 1 分警戒。
      player_facing_reason: >-
        玩家看到 B/S 边界反复把 C/M 改名，却不必因材质改变任何推拉计划、占格推理或形状判断；真正被消费的是锚点位置与目标占格，
        材质标签只是伴随效果。它抬高机制承诺，却没有兑现对应洞见，令整体不足以达到审美 4。
      blocks_proposal_ready: true
      expected_designer_response: change_family
    - id: PC2_REPOSITION_ROUTE_TAX
      type: nonblocking_risk
      target: why_not_execution
      claim_relation: step8→14 的五步换侧不是独立洞见，只是执行成本。
      evidence_basis: >-
        step8 下拉 P/L 后，step9-13 连续 left,left,left,up,up；直到 step14 才从箱左侧右推。
      player_facing_reason: >-
        P/L 下移确实把后续推箱与末段锚点位置准备好，因此换侧有因果起点；但五个中间格只承担通路，
        玩家没有在途中重新分配资源或作选择。它可保留为短小地图的必要绕位，却不能用于把审美或难度推到 5。
      blocks_proposal_ready: false
      expected_designer_response: accept_as_nonblocking
    - id: PC3_FIXED_RELAY_COGNITIVE_LINEARITY
      type: score_boundary
      target: why_not_execution
      claim_relation: 空间不再一次性穿行，但认知层仍是一条固定对象接力链。
      evidence_basis: >-
        规范解 10 个对象步；原完整图 SCC 读数为 solution_irreversible_steps=11、scripted=7/11、
        forced viable commitments=9/11，且开局后多数局面只有一个可胜继续方向。
      player_facing_reason: >-
        目标职责反复变化让地图比旧 v5 更有回织感，但玩家通常在完成当前局部动作后只需寻找下一个唯一把手；
        难度主要是预见整条接力，不是持续重估多个职责候选。因此支持难度 4，不支持难度或审美 5。
      blocks_proposal_ready: false
      expected_designer_response: accept_as_nonblocking
    - id: PC4_WEAK_WALK_MACRO_AUDIT_SUPERSEDED
      type: context_gap
      target: evidence_support
      claim_relation: 用户要求必要对象动作不可换序；原 strict bridge PASS 的压缩方式不足以单独支持这一硬门槛。
      evidence_basis: >-
        原 audit 对任意单向纯 walk edge 直接做 DSU union；本原型中纯 walk 不保证反向仍是纯 walk，
        例如 canonical step3 left 是 walk，而反向 right 会拉身后箱。该弱连通压缩会丢失有向站位责任。
        controller 后续提供 directed-pure-walk-SCC 重审（51 宏、13 个相关宏、2 条 simple 胜路归约为 1 个对象计划），
        但 initial fact-only 阶段尚待独立审计者复核。
      player_facing_reason: >-
        若单向换位被误当成自由走位，工具可能把实际的动作顺序差异吞掉；在用户唯一解硬门槛下不能以旧 bridge PASS 放行。
      blocks_proposal_ready: true
      expected_designer_response: add_context_next_review
    - id: PC5_OPENING_ERROR_BRANCH_CONTEXT
      type: context_gap
      target: role_fit
      claim_relation: 正确开局门控清楚，但错误分支公平性材料不足。
      evidence_basis: >-
        起始 SCC 有 4 个对象 commitment、2 个 win-reachable、2 个 dead；两条最短入口都上拉同一 B/S，
        但 packet 未给两条 dead commitment 的玩家可见后果、可恢复性或失败时距。
      player_facing_reason: >-
        B/S 横锚横在两条上行路线后方，使玩家无论从 B 端还是 S 端上行都会先把它抬起，正确开局本身公平；
        但 P/L 或 B/S 的其它早动看起来同样合理，若其失败只在末段暴露，会把 4 分挑战变成试错税。
      blocks_proposal_ready: true
      expected_designer_response: add_context_next_review
  diagnostic_interpretations:
    - graph_fact: complete_graph=151 states/282 transitions/1 winning state
      neutral_meaning: 当前 exact 布局的可达状态图完整且只有一个胜态；单独不证明解法计划唯一。
