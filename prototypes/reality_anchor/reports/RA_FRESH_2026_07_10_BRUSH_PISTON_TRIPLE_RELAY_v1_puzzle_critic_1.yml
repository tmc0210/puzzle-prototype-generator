      neutral_meaning: 可胜子图开局存在分叉与汇合，规范链中七次交接来源 SCC 很小或入口即出口；这些数值本身不判质量。
      player_facing_interpretation: 开局的两个端部入口可给轻微站位自由，但进入接力后多数关键动作局部固定，支持“空间回织、认知仍偏固定链”的阅读。
      verdict_effect: caveat
    - graph_fact: 删除任一目标后最短成本从19降到11/9/5并绕过核心链。
      neutral_meaning: 三个目标都对当前完整任务有约束作用，不能只凭删目标继续完成同一链。
      player_facing_interpretation: 三目标职责接力不是装饰；上、中、下目标分别迫使 P、箱、S 完成终局分工。
