  handoff_notes:
    - >-
      即使后续 directed-walk 独立审计确认唯一对象计划，PC1 的玩家侧审美阻塞仍独立成立；证据完整不能把 singleton 材质标签提升为洞见。
    - >-
      若继续此 family，修改目标应是让 C/M 状态产生真实操控差异或形状消费，而不是增加转换次数、对象步或走位长度。

claim_followup:
  claim_read: true
  verdict_changed: false
  score_or_state_changed: false
  change_summary: >-
    claim 对三目标责任链的叙述与事实一致，但没有提供 singleton C/M 的任何新几何或操控 consumer；
    它反而明确把“两次变 M、两次变回 C”列为核心洞见，并在 why_not_execution 中承认若这只是标签则 claim 失败，
    因而 PC1 被确认。claim 之后新增的有向 pure-walk SCC 独立攻击则把旧 weak-DSU 唯一性缺口收窄为
    “对象位移/职责计划唯一、首次接触端与输入串不唯一”，没有改变 taste verdict。
  change_reason: >-
    新材料解决了对象动作换序的证据边界，却没有改变玩家实际使用的对象模型：M 始终是 singleton，
    C/M 的差别从未改变合法动作、占格形状、推拉方法或目标职责。
  final_verdict: hold_or_reject
  final_review_loop_state: rejected_candidate
  final_required_action: reject_or_change_family
  final_critic_items:
    - id: PC1_SINGLETON_MATERIAL_AFFORDANCE_GAP
      final_status: confirmed_core_blocker
      effect: aesthetic_3_below_floor_4
      reason: >-
        claim 以 C->M->C->M->C 作为核心重读，但每一阶段仍是同一个单格可推拉对象；
        B/S 刷界没有下游形状门、黏连、拆分或对象模型差异来消费材质。
    - id: PC2_REPOSITION_ROUTE_TAX
      final_status: retained_nonblocking_risk
      effect: blocks_score_5_not_submission_by_itself
      reason: P/L 下移被后续推面和终局位置消费，但五步换侧本身只是到达箱左侧的通路执行。
    - id: PC3_FIXED_RELAY_COGNITIVE_LINEARITY
      final_status: retained_score_boundary
      effect: difficulty_4_supported_but_no_5
      reason: 空间回访显著改善一次性穿行，但十段对象动作仍是一条高度固定的接力链。
    - id: PC4_WEAK_WALK_MACRO_AUDIT_SUPERSEDED
      final_status: resolved_by_stronger_independent_audit_with_scope_caveat
      effect: none_on_taste_verdict
      reason: >-
        旧审计不可采；独立有向审计在完整 151/282/1 图上只压 pure-walk SCC，得到 51 宏、13 个可胜相关宏，
        完整枚举 2 条 node-simple 胜路且未截断。二者十段对象动作、前后对象配置与终局职责完全相同，
        仅首次上拉 B/S 的接触端为 S/B、输入前缀分别为 left-up-left 与 left-left-up，并在 step3 exact-state 汇合。
        因此“不允许必要对象动作换序”的用户硬门槛通过；输入串/操控接触端并不唯一，必须如实保留该口径。
    - id: PC5_OPENING_ERROR_BRANCH_CONTEXT
      final_status: unresolved_context_gap_for_any_future_revision
      effect: no_additional_action_because_candidate_already_rejected
      reason: 两条 dead opening commitment 的可见后果与失败延迟仍无玩家侧材料；若换 family 后再送审，应补错误分支公平性。
    - id: PC6_LEXICON_ROLE_OVERCLAIM
      final_status: confirmed_core_supporting_blocker
      effect: reinforces_aesthetic_reject
      reason: >-
        `P/L pull 抽取把手`与末段混链相符；但 `B/S 移动边界刷产物`没有区别产物的 consumer，
        `P/L 长轴墙廊`要求沿锚长轴的墙廊余量而本局是竖直锚横向抽拉，
        `单箱目标活塞顺序锁`要求 P 侧推入目标后被迫 L 侧回撤撤销，而本局是另一套拉入—推离—锚端接管链。
        四条 lexicon 中只有一条完整命中、一条只到事件 witness、两条结构归属不符，不能支撑“单一清晰洞见”的主张。
  lexicon_assessment:
    - heading: B/S 移动边界刷产物：远程生成与门口消费
      fit: partial_event_witness_only
      reading: 有边界移动与 C/M 改写，但没有该词条要求的差异产物 consumer。
    - heading: P/L pull 抽取把手：前格门、占格目标门与扫带
      fit: supported
      reading: 末段从 L 侧抽动二格 P/L，并以 n2 扫带 singleton M/C，属于真实结构责任。
    - heading: P/L 长轴墙廊：L 端余量棘轮（mixed-chain 补谱）
      fit: not_supported_by_geometry
      reading: 候选中的 P/L 竖放、向左横移，既非沿长轴运动，也无一格高墙廊/尾墙容量分类。
    - heading: 单箱目标活塞顺序锁：推入覆盖与回撤撤销
      fit: not_supported_by_action_model
      reading: 上目标的箱由拉入后另行推离，没有该词条的 P 侧推入—被迫 L 侧回撤动作对。

