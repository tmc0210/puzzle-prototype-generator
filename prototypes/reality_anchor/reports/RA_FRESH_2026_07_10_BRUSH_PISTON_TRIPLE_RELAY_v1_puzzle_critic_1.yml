        [4,3]、[3,3]、[3,2] 等核心格在 B/S 抽取、箱子换侧、B/S 下推与 P/L 末段扫带中承担不同责任，
        因而确有状态变化后的复用；但 step8→14 的五步连续 walk 主要是从右下绕到箱子左侧，沿途没有新的局面判断。
