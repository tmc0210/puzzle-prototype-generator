experiment: reality_anchor_opening_cognition_packet_order_pilot
candidate_version: RA_FRESH_2026_07_11_SPLIT_KEY_REBIND_LATCH_v17
sample_size:
  conditions: 3
  fresh_agents_per_condition: 1
  calibration_scope: single_level_pilot_not_general_proof
sealed_human_reference:
  primary_contradiction: "P/L 锚点不可达。"
  lower_structure: "结构繁琐且几何 payoff 弱；顺手推两步即可显形，没有观察到有趣的形状性质。"

condition_results:
  A_static_blind_read:
    result_ref: prototypes/reality_anchor/reports/RA_OPENING_COGNITION_EXPERIMENT_RESULT_A_STATIC.yml
    observed_primary_contradiction: "顶部目标与材料分离、单格颈部运输困难。"
    lower_structure_read: "材料转换与分流站。"
    alignment_with_human_primary_contradiction: false
    useful_observations:
      - "指出 P/L 的角色无法由静态题面解释。"
      - "指出宏观洞察可能退化成狭窄空间中的繁琐执行。"
    failure_mode: >-
      把目标覆盖分布误读成跨区运输问题，并为下方复杂结构赋予“转换/暂存/出货”的功能故事；
      没有识别玩家真实最显著的 P/L 可达性矛盾。

  B_bounded_opening_exploration:
    result_ref: prototypes/reality_anchor/reports/RA_OPENING_COGNITION_EXPERIMENT_RESULT_B_EXPLORE.yml
    budget_used: 8
    resets_used: 1
    natural_opening_found: [right, down]
    observed_primary_contradiction_after_play: "持续绑定后的方向约束与解绑/重绑。"
    lower_structure_read_after_play: "利用大黏块联动 B/S 并生成下方黏块，再分配目标。"
    alignment_with_human_primary_contradiction: false
    useful_observations:
      - "确认两步即可触发大规模结构变化。"
      - "指出一次输入同时改变多对象，后续可能退化为中高负担状态搜索。"
      - "指出 P/L 在探索窗口内仍未参与，可能成为额外搜索分支。"
    failure_mode: >-
      操作反馈纠正了静态运输误读，却诱发新的局部机制故事：把 pull/刚体联动理解为需要专门解绑的
      持续绑定问题。有限探索提高了操作事实理解，但没有自动恢复熟练玩家的整体矛盾识别。

  C_designer_framed_control:
    result_ref: prototypes/reality_anchor/reports/RA_OPENING_COGNITION_EXPERIMENT_RESULT_C_FRAMED.yml
    observed_primary_contradiction: "先牺牲独立性形成共享体，后牺牲共享性恢复分配。"
    lower_structure_read: "B/S 驱动的可逆装配台与共享性相变。"
    alignment_with_human_primary_contradiction: false
    framing_vocabulary_reproduced:
      - shared_U_shape
      - reversible_assembly_station
      - reversible_phase_change
      - selective_reweave
    useful_observations:
      - "承认远端黏格与 U 形必要性仅凭裸盘面不自解释。"
      - "承认设计框架可能高估题面的自解释程度。"
    failure_mode: >-
      designer framing 显著控制了 critic 使用的宏观目标、矛盾和结构命名；即使保留少量质疑，
      主体判断仍从独立观察退化为对 designer 故事的复述与内部一致性检查。

cross_condition_findings:
  - >-
    静态裸读可暴露角色不清和执行噪声，但对缺乏原型经验的临时 critic，不能可靠恢复熟练玩家
    最显著的整体目标与矛盾；它会用一般空间推箱经验填补未知机制。
  - >-
    约25%最短解长度的开局探索足以发现自然首拍与局部机制反馈，但不足以保证形成正确宏观模型；
    探索者可能把局部反馈重新故事化。
  - >-
    designer player-facing reading 在解法揭示前出现会产生强 framing；当前 claim-last 路由不能视为独立玩家侧判断。
  - >-
    A/B 两组都部分识别“复杂结构可能只是搜索负担”，说明盲读/探索适合作为风险探针；但它们不应
    单独授予玩家逻辑清晰或 proposal-ready。

production_implications:
  blind_read_role: "低成本显著性与噪声探针；不作为唯一质量裁决。"
  bounded_exploration_role: "当静态读法不稳或图复杂时升级；用于记录认知变化，不要求通关。"
  missing_capability: >-
    player-equivalent procedural prior。临时 critic 只有规则文本，没有通过教程/前置关形成的操作经验；
    单靠规则表与8步试探不能稳定替代熟练玩家。
  recommended_reviewer_architecture:
    - "同一 critic 先做 blind read，再按风险决定是否有限探索，最后才看解与 designer claim。"
    - "正式高难/大图候选需要原型熟练的独立 player trace，或先让 reviewer 经过中性教程/前置关熟悉化。"
    - "designer claim 只能用于对照并识别 post-hoc，不得反向提高 blind/solution 阶段的玩家侧评价。"
  next_validation_needed: >-
    在至少一组人评正例和一组人评负例上复现实验，并增加每个条件的独立样本；单关单样本只能证明
    当前路由存在 framing 风险，不能确定最优探索预算或把静态盲读升级为硬门槛。
