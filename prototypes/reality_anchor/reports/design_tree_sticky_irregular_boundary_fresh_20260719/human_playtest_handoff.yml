tree_story: >-
  根节点先让玩家直接读取预制 T 形的近端操作面与远端触边责任；construct_prefix 把同一读取前移为两根横条间的主动错位构形；
  apply_suffix 再让规整 2x2 与错位 Z 都通过第一次边界动作，只由后继转向和覆盖交接反向证明此前为何必须构成异形。
  三关分别集中见证、向前增加构造、向后增加应用，高潮始终是小异形黏块在墙齿、墙口与 B/S 边界附近的可动性和动后状态。
classification_calibration_boundary: >-
  RA_CAND_0010、RA_CAND_0015、RA_CAND_0011 仅用于校准 baseline 与两个生长档位的角色差异；
  其“推拉锚点也可以被推拉”体验核心没有进入布局素材、作品身份条件或关卡高潮。

