    notes: "S 形四格母体向左一格；预期边界外切出 1 crate，边界内直接留下三格 L 连通残体。"
    layout: |
      ##########
      # #BS#  G#
      #        #
      #        #
      # #  MM@ #
      ##  MM   #
      # #      #
      ##########
