    notes: "浅切留下三格 L 后，玩家从右侧绕到上方外侧站位，接触 L 的右上横趾并向下推动整个残体；左侧三墙一口把切出 crate 的反向站位 x2,y5 隔离，同时仍允许深切时由残体受力链把 crate 推入该口。"
