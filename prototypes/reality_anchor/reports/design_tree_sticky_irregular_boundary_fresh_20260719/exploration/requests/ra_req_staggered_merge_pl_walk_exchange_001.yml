do_not_repeat:
  - 不复采单纯的两横条 S/2x2 合并后向墙齿平移；新材料必须加入由合并体带动可移动 P/L 的同链关系。
  - 不复采开放上下双带使对象绕到外侧的结构；外侧入口必须由锚点让出的旧半格生成。
  - 不复采竖条封墙带、接上肩或下肩后在缺角内立即连续正交 pull 的结构。
  - 不把左右、上下纯镜像、墙齿平移、普通走位长度或目标覆盖变化作为新材料。
  - 不发布只有 anchor shift 事件、只有 sticky merge 事件、只有首个合法 pull 而没有动作后操作面事实的 witness。
  - 不使用候选布局坐标、完整关卡包装、目标结构、完整解、难度判断或 structure family 去留结论。

materialization_target: >-
  发布若干极小、可运行的局面卡及近邻对照，分别给出开始摆法、非空输入、逐步事件、动作后玩家与对象占格、
  P/L 位移、旧半格第一步动作类型、外侧 pull 后操作面、exact-state 回返结果与另一面 pull 结果。
  至少保留一组“分离组件均不能带动 P/L、S 与 2x2 均可 merge 并由合并体带动 P/L”的正负对照，
  以及一组“让位旧半格为 walk 出口、S 保留外拉/回返/换面可能，而 2x2 只在后段 consumer 失败；移除 consumer 后差异消失”的局部结构谱。
