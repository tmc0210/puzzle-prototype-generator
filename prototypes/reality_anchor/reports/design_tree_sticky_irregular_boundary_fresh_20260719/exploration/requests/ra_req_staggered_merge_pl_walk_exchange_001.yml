request_id: RA_REQ_STAGGERED_MERGE_PL_WALK_EXCHANGE_001
exploration_id: RA_EXP_STICKY_IRREGULAR_BOUNDARY_FRESH_20260719

design_space: >-
  展开一个由两根分离二格横条、一个可移动 P/L 锚点、局部站位边界与后段墙齿或交换格 consumer 组成的局部结构空间。
  同一起态应允许玩家主动把横条合并为错位 S 或齐平 2x2，两种 merge 均真实合法；分离组件不能单独带动 P/L，
  只有合并体能从玩家接触的近端把手把力传到远端接触格，并在同一 force chain 中带动 P/L 一格。
  锚点移动后让出的旧半格必须位于合并体及受力闭包之外，玩家进入它的第一步为 walk，并可由此换到合并体外侧。
  局部后继需采样外侧 pull、回到换把后同一 exact state 的可逆分支，以及再取得另一操作面作正交 pull 的可能性。
  错误 2x2 不得在 merge 或 P/L 中继前被提前淘汰；差异应到后段墙齿或交换格 consumer 才出现，
  由其填平的角占用刚体目标格、玩家交换格或回返所需格而失败，错位 S 则保留对应局部关系。

sampling_axes:
  - 两根横条的初始分离方向与可主动接入关系：错位 S merge、齐平 2x2 merge；两者合体前均可达且合法。
  - 接收横条与驱动横条的施力面分配：分离时谁缺少独立把手，合并后哪个近端格可把力传到远端接触格。
  - P/L 朝向及合并体接触 P/L 的相对方向；只采样能让整个锚点平移一格的合法受力闭包。
  - 分离组件对 P/L 的负对照：驱动条单独、接收条单独、延后 merge；记录是否出现锚点位移或提前跨侧。
  - 合并体对 P/L 的正对照：错位 S 与 2x2 是否都能带动锚点；记录 force chain、anchor shift 与动作后完整占格。
  - P/L 让位旧半格相对合并体的关系：旧 P 半格或旧 L 半格、位于近端或侧端；要求玩家首次进入时为 walk。
  - 让位前后的玩家可达性：移动前无外侧入口，移动后由旧半格接到至少一个外侧施力面；排除预先开放的外回路。
  - 外侧第一手：不同外侧面上的轴向 pull；记录动作后玩家位置、合并体占格与仍可达操作面。
  - exact-state 回返：外侧 pull 后的反向 pull 是否能回到换把后的同一完整状态，而非只回到同一对象位姿。
  - 另一面操作：回返或继续后，玩家能否取得与第一手不共线的操作面并完成正交 pull。
  - 后段 consumer 类型：远端墙齿、填角对应的玩家交换格、填角对应的刚体目标格；分别记录 S 与 2x2 的动作差异。
  - consumer 删除对照：移除墙齿或开放交换格后，2x2 的对应后继动作是否恢复，用于定位差异责任。
  - 误用对照：merge 前一形状已经非法、P/L 可被玩家单独搬动、旧半格第一步触发 pull、外侧面只有唯一连续兑现。

