request_id: RA_REQ_FIXED_PL_HANDLE_CLOSURE_WITH_AGENCY_001
exploration_id: RA_EXP_STICKY_IRREGULAR_BOUNDARY_FRESH_20260719
design_space: >-
  探索固定 P/L 边界附近的 3—6 格连通异形黏块局部结构：玩家先从一侧对刚体完成一次合法对象动作，
  再实际换到另一侧的不同操作面继续移动同一刚体；换把完成后，旧侧把手应因异形自身占格、站位关系、
  墙口或边界关系而关闭，或只能形成回到同一完整状态的可逆回返，不能留下“从旧侧继续推”和
  “从新侧继续牵”两种非等价胜向动作族。同时，动作后局面仍应给玩家至少两个可读取的局部站位或
  操作选择，避免把换把退化成唯一通道代走。只产出局部结构事实与接法，不设计完整关卡、目标或难度。
sampling_axes:
  - 3—6 格连通非矩形轮廓：L、Z/S、短阶梯、单缺角、双高度突出部及其非镜像近邻
  - 固定 P/L 边界方向与换把轴：竖边界横向换把、横边界纵向换把
  - 旧把手关闭来源：刚体自遮挡、形状移动后占据回路口、墙口只封玩家站位、边界使旧站位模式失配
  - 动作后玩家关系：旧侧不可达、新侧可达；两侧均可达但旧侧对象动作非法；旧侧只可完整回返
  - 局部能动性：换把后保留两个以上合法站位/走位选择，其中只有部分维持后续对象关系
  - 反向与回返：立即反向、跨界后反向、恢复旧把手、无法恢复旧把手
  - 解族筛查：完整局部状态图中是否存在 push/pull 模式不同或对象方向不同的非等价继续族
current_material_refs:
  - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/exploration/lexicon.md
  - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/exploration/lexicon_index.md
  - prototypes/reality_anchor/mechanism_lab/lexicon.md
do_not_repeat:
  - 只把对象放进单宽或唯一绕行通道，以强制走位替代玩家换把判断
  - 玩家处于 U 形内槽、可在同一格无成本切换左右内壁的驾驶舱结构
  - 仅靠增加直线移动距离、墙齿数量或目标距离制造步骤
  - 只证明一条最短解，不继续检查旧侧推与新侧牵的完整替代动作族
  - 围绕某个完整候选坐标、目标位置、难度或作品去留做采样
materialization_target: >-
  发布若干 runtime-backed 局面卡片；每张给出开始摆法、关键换把动作、动作后完整局面、旧把手为何关闭、
  玩家仍保留的局部选择、最小 consumer、近邻失败对照和完整局部图中的继续动作族说明。优先给出至少一张
  不依赖唯一通道、且旧侧继续动作被结构性排除的正向材料；若采样表明固定 P/L 加静态墙无法同时满足两项，
  记录明确的局部不可能边界与最接近的失败谱，而不是包装成正向 family。
