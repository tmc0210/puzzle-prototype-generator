do_not_repeat:
  - 不采样“多个分离组件先合并，再用 gate 阻止 anchor-first”的 v1—v5 路线。
  - 不把 B/S 搬运、独立钥匙、按钮、长走路或单一强制动作当作构造本身。
  - 不用预先开放的外回路让分离组件提前取得后段把手。
  - 不用紧贴缺角的连续正交 pull 替代轴向外换把、回返读取与第二操作面。
  - 不要求 P/L 让出的旧半格在动作后立即与玩家相邻；该假设已有负材料。
  - 不把 sticky_to_box 或 sticky_split 事件本身当正向成果；必须证明残体的后续可操作关系。
  - 不在切分时用明显墙位或站位不可达直接删除错误结果；差异应由更后的局部 consumer 产生。
  - 不保留可晚合并回正确异形的多个 sticky 残片，也不让切出 crate 替代残体完成后段。
materialization_target: >-
  发布至少一组 runtime-backed 局面卡片：同一连通母体具有两个玩家可选且切分当下均合法的身份输出；
  正确输出直接留下一个连通小异形，并实际支持“外侧轴向施力—反向回到同一完整状态—换到另一正交面”的
  局部操作面生命周期；近邻输出至少通过首次外侧动作，随后才被独立墙齿或站位 consumer 拒绝，且移除 consumer 后恢复。
  同组必须包含切出 crate 晚粘回、替代残体、先移动 B/S 与过切/不切的负对照，并明确证据只覆盖局部结构，
  不评价完整关卡、难度、family 去留或解族唯一性。
