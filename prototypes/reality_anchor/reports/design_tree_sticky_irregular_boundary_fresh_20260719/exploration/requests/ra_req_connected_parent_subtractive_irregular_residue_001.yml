request_id: ra_req_connected_parent_subtractive_irregular_residue_001
exploration_id: RA_EXP_STICKY_IRREGULAR_BOUNDARY_FRESH_20260719
design_space: >-
  从一个开局已连通的黏块母体出发，由玩家主动选择跨越固定或可移动 B/S 边界的深度、方向或时机，
  使部分占格转回 crate，并让未越界部分直接留下一个仍连通的小型异形残体。探索重点是减法式身份构造：
  构造动作前后始终只有一个承担后段责任的连通黏块，不以多个分离组件在后段重新合并为前提。
  正向局部材料应让至少两个合法切分结果在切分本身之后仍可操作，而其中一个 L、S、阶梯或其它非规整残体
  能继续提供轴向外侧把手、可撤销回返状态和另一正交面；规整或另一近邻残体则由更后的墙口、站位格或
  P/L 操作面关系拒绝，不能在切分动作当下因普通墙位或唯一站位提前淘汰。切出的 crate 应留在残体后段
  受力闭包之外，或被局部地形隔离，不能重新黏回、替代残体完成后段，也不能成为独立钥匙子题。
sampling_axes:
  - 母体占格拓扑：4—6 格连通条、L、T、S/Z、阶梯及只差一格的近邻形状。
  - B/S 边界：固定/可移动、水平/竖直、标签朝向，以及切线穿过母体的不同深度。
  - 主动切分变量：玩家选择跨线一格/两格、先轴向 stroke/先正交 stroke、边界先移/母体先移；排除纯强制结算。
  - 输出身份图：一个连通异形残体加若干 crates、一个规整连通残体加若干 crates、以及产生多个 sticky 组件的负对照。
  - 切分后玩家接触面：立即外侧轴向把手、短 walk 后外侧把手、可反向回到同一完整状态、可从第二正交面再次施力。
  - P/L 相对关系：切分后同一残体从 P 侧 push 转为 L 侧 pull，或从 L 侧 pull 转为 P 侧 push；P/L 不单独搬运、不充当按钮。
  - 后段局部 consumer：只进入远端趾/填角目标格的墙齿、只占玩家换面站位的墙口、移除 consumer 后近邻残体恢复合法。
  - 切出 crates 的去向：留在 box side 死袋、被边界隔离、可移动但不进入残体受力线；测试能否晚粘回或替代残体。
  - 时序负对照：不切分、过切、先移动 B/S、切后先处理 crate、以及尝试把多个残余组件重新合并。
