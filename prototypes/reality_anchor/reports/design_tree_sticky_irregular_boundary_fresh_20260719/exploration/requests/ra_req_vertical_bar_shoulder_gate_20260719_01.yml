  - prototypes/reality_anchor/mechanism_lab/lexicon.md#bs-边界黏合箱组形成横条或-l-形黏块
  - prototypes/reality_anchor/mechanism_lab/lexicon.md#黏块过墙口的通过与回推条件
do_not_repeat:
  - 不补纯平移、纯旋转或上下镜像而动作后关系相同的摆法。
  - 不发布预制完整 L 直接过墙口的材料；必须保留单格接上肩或下肩的主动合体过程。
  - 不把开放外回路中分离竖条可提前 pull 的摆法当作正向材料。
  - 不用普通站位墙在合体前直接判掉一种肩位；两种肩位必须先成为合法连通刚体，再由动后通路、外把手或远臂足迹产生差异。
  - 不以目标覆盖、最短步数、完整关卡可解性或难度评价替代局部操作面 consumer。
materialization_target: >-
  发布一组可复用的局面卡与近邻谱：至少包含两种肩位都可主动合体的非空 runtime replay、分离竖条封住外把手的
  可核验局部事实、合并体由新凸格跨 P/L 平移的动作前后状态，以及肩位差异在墙带通路、外侧 pull 把手或远臂
  墙口 consumer 中形成的至少一种正向差异；同时保存墙带过宽和过度封闭的近邻误用边界。
