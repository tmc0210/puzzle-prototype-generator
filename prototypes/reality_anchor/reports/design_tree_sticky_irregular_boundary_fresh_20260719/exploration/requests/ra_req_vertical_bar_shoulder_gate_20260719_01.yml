request_id: ra_req_vertical_bar_shoulder_gate_20260719_01
exploration_id: RA_EXP_STICKY_IRREGULAR_BOUNDARY_FRESH_20260719
design_space: >-
  在固定或有机 P/L 分区附近，让一根双格竖向黏块占住窄墙带的唯一通口，构造侧另有一个单格材料可分别接到
  竖条的上肩或下肩，主动形成两种竖向镜像三格 L。展开这样的局部几何：分离竖条尚未获得墙带外侧的 pull
  站位或等价外把手，两种肩位合体本身都合法且可由玩家主动完成；合并体从新凸格平移后，上下肩位造成的
  不同腾空格分别改变墙带通路、外侧拉把手和远臂墙口足迹。局部材料只陈述动作、站位与动后占格关系，
  不判断哪一种肩位应进入任何完整关卡。
sampling_axes:
  - 竖向二格条相对墙带通口的占位方式：恰好封住通口、仅封一半、或留下可被玩家提前穿越的一格余量。
  - 单格材料的接入侧：上肩、下肩；两种接入是否共享同一构造侧活动空间并都实际触发 sticky merge。
  - P/L 相对关系：分离竖条旧面不可形成后继方向的有效 push/pull；合体新凸格在平移前提供 P 侧 push，动作后玩家进入 L 侧。
  - 合并体平移后的腾空格：上方缺角或下方缺角是否把构造侧连到墙带外侧，以及玩家能否实际走到外把手而非只在静态拓扑上连通。
  - 外侧把手用途：从合并体外侧继续沿轴 pull、执行一次可回撤 pull，或转到正交面；记录动作后完整状态与可回返边界。
  - 远臂局部 consumer：墙口齿、刚体目标格墙或玩家站位门；比较上下肩位的远端占格集合怎样改变后继合法动作。
  - 近邻泄漏：墙带过宽导致分离竖条可提前取得外把手；额外封墙过强导致某一肩位合体前已经非法；只作正向材料的误用边界。
