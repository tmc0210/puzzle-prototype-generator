  - prototypes/reality_anchor/mechanism_lab/lexicon.md#bs-边界黏合箱组形成横条或-l-形黏块
  - prototypes/reality_anchor/mechanism_lab/lexicon.md#黏块过墙口的通过与回推条件

do_not_repeat:
  - 不重复只给预制 S 形并执行 left,down 的既有材料；必须从两条分离横条开始并实际比较合并对齐。
  - 不把正对或错位之一做成唯一合法的局部移动、单行道动画或无选择的自动合并。
  - 不只记录 sticky_merge、sticky_to_box、force_chain 或目标覆盖事件；必须保存后继 consumer 对两种完整占格的实际差异。
  - 不补纯镜像、平移、换墙皮、换目标位置或增加走位的重复 case。
  - 不制作完整关卡、候选包装、难度判断、设计树关系或 family 去留结论。

materialization_target: >-
  发布一组 runtime-backed 局面卡：从同一类两横条分离起态出发，至少给出一个可主动错位合并为 S 的正向 case、
  一个可主动正对合并为 2x2 的局部可行对照，以及一个移走或错开后继 consumer 的退化对照；
  每个 case 保存非空输入、合并前后渲染、关键动作事件、完整刚体占格、consumer 结果与工具边界，
  并明确哪些站位或边界旋钮让玩家必须按后继远端足迹选择合并对齐。
