do_not_repeat:
  - 不复采开放上下双带让分离组件从外侧提前越界、后段再合体的结构。
  - 不复采竖条或构造体封住墙带、合体后只剩缺角内连续正交 pull 的结构。
  - 不依赖可移动 P/L 让出的旧半格与动作后玩家立即相邻；该 immediate walk-exit 条件已是避重边界。
  - 不把 B/S 转化、sticky_merge、P/L push/pull 或 anchor shift 事件本身当作正向材料；必须保存动作后对象身份、连通性与操作面差异。
  - 不用普通墙在 merge 前封死某个构造选择，也不让目标轮廓提前给出唯一形状。
  - 不发布 candidate 坐标、完整布局、完整解、目标包装、难度评价或 structure-family 去留答案。

materialization_target: >-
  发布极小、可运行的局面卡与近邻对照，逐项保存开始身份与连通图、非空输入、转化/merge 事件、受力闭包、动作后完整状态、
  分离组件能否延后合体、完整连体能否通过 handoff、外侧面可达性、exact-state 回返结果及另一面 pull 动作表。
  至少形成一组“两个构造结果均合法完成 B/S 转化与 merge；分离身份不能先行通过 P/L，连体身份可以”的身份门材料，
  以及一组“正确与错误连体都通过 handoff，差异只在后段墙齿或交换格 consumer 首次出现；移除 consumer 后错误近邻恢复”的局部结构谱。
