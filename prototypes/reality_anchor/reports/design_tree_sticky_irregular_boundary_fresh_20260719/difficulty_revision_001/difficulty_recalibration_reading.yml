human_corrections_integrated:
  first_feedback: >-
    上一树的流程与体验核心方向正确，但 delivery exact 的实际玩家难度被高估：baseline 与 construct 只有一次二择，
    apply 只是把同一差异延迟几步揭示，仍没有让熟练玩家持续管理状态。
  second_feedback: >-
    修订不应机械地统一增加推演层。异形真实腾挪、操作面保存或恢复、可逆状态管理，以及与固定或可移动 P/L 的有机推拉，
    都能形成有效难度；上一树后两个节点删除 baseline 已有的 P/L 操作维度，造成文档生长而玩家负担下降。
  combined_conclusion: >-
    新树必须同时守住两点：难度来自玩家持续操纵同一异形关系，而非单次答案识别；
    生长节点必须保留、深化或等强替代父节点已有的有意义操作维度，不能靠删维度获得更直白的流程。

prior_tree_player_side_diagnosis:
  common_pattern: >-
    三个 exact 都具有清楚作品身份、可解性、机械必要性与集中回报，但玩家一旦作出唯一关键二择，后续关系基本固定。
    证据支持“答案为什么机械必要”，没有让熟练玩家在解题过程中持续更新多个活的操作关系。
  baseline_001_v3:
    human_observed_difficulty: 1-2
    previous_target: 3
    actual_player_load: >-
      玩家从两个首次操作面中识别一个可胜方向；正确横推后只需紧接一次 pull 扫带 B/S。
      P/L 确实改变了终手推拉语义，但它没有形成需要保存、恢复或重新取得的操作面生命周期。
    why_not_3: >-
      唯一有效判断在首次对象 commitment 时完成，之后是清楚的短兑现。P/L 的存在与远臂机械必要不能补偿缺少持续操纵。
    preserved_value: >-
      预制异形、近端肩窝与远端扫带同刚体耦合仍是合格体验核心定义；问题是难度定位，而非作品身份方向。
  construct_prefix_001_v2:
    human_observed_difficulty: 1-2
    previous_target: 4
    actual_player_load: >-
      玩家在 2x2 与错位异形之间作一次构形二择；墙齿直接显出规整形的失败，正确合并后只剩取把手和一次兑现。
    why_not_4: >-
      新增 construct_prefix 让形状由玩家主动构造，但没有保留 baseline 的 P/L 推拉维度，也没有新增操作面恢复或可逆状态管理；
      玩家关系在文档上生长，实际操纵却更直接。
    preserved_value: >-
      构造结果由同一墙齿与 B/S 立即消费，非拼接关系成立；难度失败不否定这种生长方法本身。
  apply_suffix_001_v4:
    human_observed_difficulty: 2-3
    previous_target: 4
    actual_player_load: >-
      玩家仍只在规整形与错位形之间作一次关键选择；错误形状也能完成第一次边界移动，几步后才在覆盖交接中失败。
    why_not_stable_3_to_5: >-
      delayed reveal 增加了因果距离，却没有增加新的玩家操纵维度。正确形状一旦选定，core 与 suffix 仍是高度确定的连续兑现；
      P/L、把手恢复与真实回返管理均不再存在。
    preserved_value: >-
      后继消费第一次边界动作留下的状态并反向筛选构造，apply_suffix 非拼接关系成立；新树应保留这种反约束，但提升玩家实际负担。

difficulty_first_principles:
  player_side_definition: >-
    对熟悉全部规则、拥有全图视野并能稳定执行的后期玩家，难度是仍需维护、更新或反转的操作关系。
    一项关系只有在玩家实际选择和操纵中继续存活，才构成难度；工具发现它必要不等于玩家承担了它。
  single_binary_boundary: >-
    单次二择指玩家在一个关键时刻从两个清楚候选中选出正确操作面、形状或方向，之后只剩走位与唯一兑现。
    把错误反馈推迟几步、增加相同输入的执行长度或让错误支路更深，不改变它仍是一次二择。
  sustained_judgment: >-
    持续判断不要求长解或统一增加多层预判。第一次正确对象操作之后，玩家仍需根据更新后的异形位置、
    可用操作面、推拉侧或可逆状态作有意义决定；早期动作留下的关系在后续操作中继续活着。
  valid_load_families:
    - >-
      真实异形腾挪：完整占格在紧凑空间中限制多个方向，玩家连续选择施力面并维护后继接触，而非只认出正确轮廓。
    - >-
      操作面保存/恢复：玩家取得某个把手后要避免封死它，或有意放弃后通过另一动作恢复；把手本身成为可管理状态。
    - >-
      可逆性管理：玩家区分可回返腾挪与会改变边界、形状或接触面的承诺，并可能暂时撤销表面进展以恢复操作可能性。
    - >-
      P/L 有机结合：P/L 改变同一异形从哪里被推或拉、玩家旧格是否腾出、远端轮廓怎样扫带；锚点固定或可移动均可。
    - >-
      状态反转与短洞见：在小空间中主动离开看似完成的状态，再用恢复出的操作面完成异形边界关系；无需靠长流程制造难度。
    - >-
      后继反约束：早期多个局部可行状态在后续不再等价，但后继还应保留异形的真实操纵，而非只延迟宣布答案。
  invalid_load_claims:
    - 机械不可替代、事件必经、唯一解、graph/SCC 数量与 solver 搜索量
    - 普通走路、路线税、无判断执行长度、输入精度与规则回忆
    - 一眼可见的单次形状二择、反馈迟缓 deadend 或 delayed reveal 本身
    - 隐藏信息、视觉噪声、大地图、机制数量与事件覆盖
    - P/L 或 B/S 只作为标签、按钮或完成后退休的独立前置

push_pull_correction:
  role: >-
    P/L 是本体验核心可调用的结构性边界，不是必须每关出现的配额。它可以改变同一异形近端的施力方式、
    操作面能否保存或恢复、动作是否可逆，以及远端轮廓如何触边，因此完全可以承担核心难度。
  organic_use_test:
    - 移除或固定 P/L 后，异形的可用操作面、推拉方向、回返路径或远端作用至少有一项应真实改变。
    - 玩家必须在解题中读取并利用这项改变，而不是只执行一次显然的 anchor 输入。
    - 若 P/L 自身可动，它的位移必须重写同一异形的操作关系；锚点搬运不能成为与异形割裂的新主角。
  growth_test: >-
    子节点可以不用 P/L，但若父节点的 P/L 已承担真实操作维度，删除它时必须以同核心且不更低的腾挪、把手或可逆关系替代。
    删除后只剩一次形状二择，说明玩家负担退化，不因节点名为 construct 或 apply 而合格。

classification_calibration:
  use_scope: classification_only
  material_use_forbidden: true
  sequence:
    - candidate_id: RA_CAND_0010
      human_difficulty: 2
      calibration_role: simple_lower_band
      player_load_reading: >-
        一个清楚的状态/时机转换、即使涉及可移动 P/L，也仍可能只是结构简单的练习；“用了锚点”不能自动抬到 3。
    - candidate_id: RA_CAND_0015
      human_difficulty: 3
      calibration_role: compact_sustained_application
      player_load_reading: >-
        难度 3 可以来自紧凑且清晰的连续责任：同一对象与锚点关系在链条前后都活着，玩家要持续处理它们；不要求大地图或深层预判。
    - candidate_id: RA_CAND_0011
      human_difficulty: 4
      calibration_role: compact_state_reversal
      player_load_reading: >-
        难度 4 可以来自小空间中的强反直觉状态反转：先满足状态、再主动撤销以恢复通路或操作可能性，最后重新完成；短解也可有强逻辑。
  group_difference: >-
    2→3→4 的差别不是事件或步数逐项增加，而是玩家关系从一次清楚转换，发展为持续处理同一关系，
    再发展为需要主动反转和恢复状态的紧凑洞见。这里只校准档位，不借用三关的具体布局与结构。

revised_tree_difficulty_contract:
  baseline:
    target: 3
    minimum_player_relation: >-
      baseline 可以直接给异形和边界，但第一次正确对象操作之后仍须存在有意义的异形操纵；
      玩家至少持续管理一种活的维度：真实多面腾挪、操作面保存/恢复、可逆状态或与 P/L 的有机推拉。
    excluded_baseline_shape: >-
      两个操作面中选对一个、随后强制完成终手的 discovery，即使远端机械责任清楚，也仍属于 1—2。
  growth_nodes:
    target_range: [3, 5]
    load_preservation: >-
      每个子节点必须保留、深化或等强替代父节点已有的有意义操作维度；关系可以重组，但玩家实际负担不能因删 P/L、删回返空间或删多面腾挪而下降。
    construct_prefix_reading: >-
      若未来生长为 construct_prefix，构造选择必须继续影响异形后续怎样取得、保存或恢复操作面；不能只让玩家选一次形状，构造完成后再执行唯一 consumer。
    apply_suffix_reading: >-
      若未来生长为 apply_suffix，后继必须消费核心动后状态并把约束传回早期操纵，同时继续让玩家管理同一异形；不能只把错误答案的揭示推迟。
    numeric_boundary: >-
      不要求节点难度机械单调增加，也不预设节点数量；但任何存活子节点都不能退回 1—2 的单次二择。
  difficulty_4_to_5: >-
    更高档位可以来自强状态反转、多面把手生命周期、P/L 与异形可逆性的高耦合或多次承诺管理；
    这些关系必须保持题面可读、服务同一异形核心，不靠噪声与机械试错。

future_designer_player_side_checks:
  - 第一次正确对象动作之后，玩家还需要读取哪个更新后的异形状态，而不是只执行答案？
  - 玩家正在保存、放弃或恢复哪个操作面；这项关系能否被实际棋盘看见和消费？
  - 哪些动作局部可逆，哪些动作改变了形状、边界或后续把手；玩家为何需要管理这个差别？
  - 若使用 P/L，它具体怎样改变同一异形的推拉侧、旧格腾出、接触面或回返，而不是只增加事件？
  - 删除父节点的一项有意义维度后，子节点是否只剩更简单的形状判断；若是，生长关系尚未成立。
  - 难度是否仍能在去掉普通走路、强制步骤、delayed reveal 和 solver 数字后被清楚描述？

material_reading:
  current_task_lexicon: >-
    T 肩窝、S 斜趾、阶梯远端格与两横条合并材料都证明具体异形足迹可被局部 consumer 区分，适合作为词汇；
    它们本身多为短 witness，不能直接满足新 baseline 的持续玩家负担。
  future_material_gap: >-
    后续若需要 Explorer，缺口应表述为异形多面腾挪、操作面保存/恢复、可逆性或 P/L 改写同一异形操纵关系的局部结构空间，
    而不是要求加步数、加分支或复刻某个完整候选。本 assignment 不写 request。

designer_conclusion:
  experience_core_preserved: true
  work_identity_preserved: true
  difficulty_relabel_only_sufficient: false
  prior_delivery_exact_reuse_claimed: false
  new_layout_designed: false
  summary: >-
    新树仍研究异形近端操作与远端边界作用的同刚体耦合，但 baseline 从一开始就必须让熟练玩家持续操纵这个关系。
    难度可以来自真实腾挪、把手生命周期、可逆状态、P/L 有机推拉或状态反转，不统一要求更多推演层；
    任何子节点都必须守住父节点已有的有效操作维度，不能越生长越简单。

