scope:
  purpose: >-
    从熟练后期玩家侧解释上一树为何未达到原标注难度，并为同一体验核心的新树建立 3—5 的有效负担定义。
  output_boundary:
    - 只记录难度重校准与体验简报依据。
    - 不设计布局、对象摆法、动作串、solve instance 或 structure family。
    - 不产生节点、树、review、冻结、delivery、levels 或 playable queue 状态。

