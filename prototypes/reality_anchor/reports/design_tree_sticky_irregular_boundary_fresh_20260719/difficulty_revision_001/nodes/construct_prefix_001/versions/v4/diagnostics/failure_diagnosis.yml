  inputs: 59
  is_win: true
  first_bs_shift_step: 1
  first_material_action_step: 33
  first_full_sticky_step: 36
  object_action_difference:
    canonical_prefix:
      - push_object:crate + force_chain
      - 两次独立 push_object:crate
      - B/S 扫线 box_to_sticky 与 sticky_merge
    bypass_prefix:
      - B/S 先把开局上下两排各自转为 sticky group
      - push_object:sticky#2 左移下条
      - push_object:sticky#2 上推并 sticky_merge
  why_non_equivalent: >-
    这不是纯走位、exact 回返环或独立必要步骤换序。B/S 的先后直接改写材料身份、施力闭包与 merge 的发生原因：
    canonical 中 B/S 在已排好的箱轮廓上生成完整刚体；旁路中 B/S 先完成并退休，玩家之后操纵两个 sticky group 才构造成 S。
    对象职责和依赖因果不同，故属于第二个玩家逻辑类。
  violated_claims:
    - active construction 必须先产生候选，再由 B/S identity gate 生成 handoff 所需刚体。
    - B/S 定位应保存刚形成的完整异形，而不是在构造前完成并退休。
    - 所有胜族都应让前序构造与 identity gate 保持同一因果链。

