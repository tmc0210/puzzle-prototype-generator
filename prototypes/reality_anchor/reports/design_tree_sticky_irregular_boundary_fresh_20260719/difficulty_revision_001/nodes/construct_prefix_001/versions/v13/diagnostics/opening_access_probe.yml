    当前 exact probe 在 P-side 完成 opening cut；H0 前冻结对象/锚点的 walk-only 可达域无法取得任何列出的
    L-side 等价 pull face，而 H0 的首次 P push 使 L 自身让出 (6,8)，玩家随即只用 walk 进入外侧并取得 H1。
    主链继续完成两次 H1 与 up H2，未执行 exact loop；repeat、母体上尾与第二格 deep cut 回归保持。
    cut crate 的 east 分支有界，south 分支虽有一次重并，但 former cut cell 不进入也不复现 intended H2 footprint。
    Designer 只据此把 probe 交给 Controller 作 candidate 决策，不形成正式 candidate。
  evidence_limit: >-
    只覆盖列出的 exact-layout/current-runtime trace、冻结对象 walk-only BFS 与有界 crate 分支；
    不声称完整图、解族唯一性、全局 crate 不可操作或待玩质量。
