complete_graph_eligibility:
  status: invalidated_by_non_equivalent_win
  why: >-
    同一 exact 开局、同一四箱总量、两种 active construction、B/S push-to-pull identity gate、固定 P/L handoff、
    两形状同链外拉与 exact return、下侧把手和首次后段 consumer 分化均已由非空 current runtime replay 支持。
  mandatory_next_checks:
    - 所有胜族是否都在 handoff 前形成完整四格 sticky，排除分组件后续重排与延后 merge。
    - 是否存在先移动 B/S、把两条先转黏后再排形的等价或非等价族，以及它是否削弱主动构造关系。
    - B/S 少移、多移或反复扫线是否仍可保持连通并绕过固定 handoff。
    - 2x2 是否可从其它面、其它位置避开 (5,6) 墙后覆盖目标。
    - S 是否存在不经过外侧 handle/read-return 的更直白胜族，导致父节点负担未被实际承担。

