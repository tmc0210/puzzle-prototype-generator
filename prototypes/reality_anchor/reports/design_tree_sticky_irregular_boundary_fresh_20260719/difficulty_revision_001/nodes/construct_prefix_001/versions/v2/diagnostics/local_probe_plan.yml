probe_scope: local_and_full_layout_draft
layout_ref: ../layout.txt
runtime: current_reality_anchor
complete_graph_run: false
probes:
  - id: upper_shoulder_full_draft_win
    purpose: >-
      主动接上肩、由新凸格从 P 侧推出、进入对侧下缺角正交 pull，随后绕到外侧连续两次水平 pull，
      再从另一面终段 pull 覆盖三目标。
    inputs: [right, right, right, down, right, down, down, right, right, up, up, right, right, down, down, left, left, up, down]
  - id: lower_shoulder_far_arm_tooth
    purpose: >-
      主动把同一单格改接下肩；合体与跨 P/L 均合法，进入对侧上缺角后，正交 pull 的远臂目标格撞墙。
    inputs: [up, right, down, left, down, right, right, right, up, right, up]
  - id: premerge_old_face_no_forward_leak
    purpose: >-
      单格移到下肩准备位但暂不合体，玩家走到裸竖条旧上肩面；向右不能推出竖条，向左至多回撤一格，
      玩家随即回到 P 侧而不能继续从同一旧面 pull。
    inputs: [up, right, down, left, down, up, up, right, right, down, right, right, left, left]
