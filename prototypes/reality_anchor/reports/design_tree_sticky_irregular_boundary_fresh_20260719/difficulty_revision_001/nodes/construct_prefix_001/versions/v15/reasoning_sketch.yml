structure_hypothesis:
  relation: single_upper_left_target_stop
  statement: >-
    相对 v13 formal exact 只把 `(3,6)` 从 floor 改成 wall。切分后 B/S 位于
    `(4,6)(4,7)`；无论玩家从 `(5,6)` 还是 `(5,7)` 向左施力，刚体上半格的
    左移目标 `(3,6)` 都撞墙，所以 v13 的 B/S-left 胜族应被关闭。保留 `(3,7)`
    使玩家仍可从左侧接触 S 半格，并允许实际检查 B/S-right 是否成为占道承诺。

