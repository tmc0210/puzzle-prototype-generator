minimal_conflict:
  statement: >-
    单墙确实保留了左侧 `(3,7)`，但该格只给 B/S-right 提供施力面；它不能让仍在 x=4 的
    B/S 向上移动。直接回粘仍必须让玩家站在 `(4,8)`，而该格是保持 second deep cut
    blocked 的既有责任墙。B/S 右移到 x=5 后，向上所需的 `(5,8)` 又被锚点本体、
    `(4,8)` 墙与 `(5,9)` 墙隔成不可达格；若从上方把锚点下推，新的反推站位 `(5,9)`
    本身仍是墙。于是保留下来的单格 walk 面只生成右移 commitment，没有生成 reverse remerge。

player_side_reading: >-
  这一格墙齿在图上清楚地把左移关掉，右移也确实给出可读的占道错误选择；canonical 的
  P push、跨界外绕和 L pulls 没有被污染。但作品要求的 cut↔remerge 可逆状态管理不再存在，
  玩家只剩“不要碰右移陷阱”的单向判断，不能据 canonical 仍可胜而升格为 candidate。

