  core: 首次 P push 让 L gate 自身腾空，玩家只走路绕到外侧，再做两次 H1 右拉与一次 H2 上拉。
  bs_wrong_branch: 从保留的 `(3,7)` 把 B/S 推入 x=5 时，锚点占住核心通道；该选择可以是不可恢复承诺，但不得替代 L 或参与目标分工。
  reversibility_requirement: opening cut 之后仍应存在一次反向竖移，使 crate 回黏并恢复四格 mother。

