  preserved_from_v8_stage1b:
    - 墙、地板、玩家、B/S、四格母体和 dummy target 的全部坐标
    - B/S 一格切分与回粘母体关系
    - H0、H1、H2 的异形 footprint 与负责母体尾格失败的墙
