what_the_canonical_path_proved:
  - 最短解为 27 输入，raw shortest path count 为 1；canonical replay 非空且最终获胜。
  - canonical 对象序列包含 B/S 转化、单格移动、sticky merge、由新低阶格发起的 push:right、两次 pull:right 与终段 pull:down。
  - 下带 L 可以合法合体并跨入 P/L 关系；其远臂随后撞到 wall-mouth tooth，失败状态不在 win-backreach 中。
  - 因而“错误构造在后继 wall mouth 才受消费”这一局部关系本身成立。

