non_equivalent_winning_family_diagnosis:
  conclusion: true_non_equivalent_winning_families_exist
  evidence:
    - >-
      正确上带构造位姿 `7,5;8,5;7,6` 不支配所有 terminal-win 路径；存在不经过该位姿仍可获胜的路径，
      所以 active construct 不是所有胜族的必经玩家关系。
    - >-
      跨 P/L 后位姿 `8,5;9,5;8,6` 同时存在从同一上带 L 以 `push:right` 和 `pull:right`
      首次进入的 win-corridor classes。这不是纯走位或可逆超调差异，而是启动把手、force mode 与跨界因果不同。
    - >-
      位姿 `9,5;10,5;9,6` 也不支配所有胜路，并存在由断开/异位组件经 push 进入、以及从右侧 pull:left
      回入的多种 first-entry classes；组件可在合体前后分别搬运，再于 P/L 后段收敛。
    - >-
      只有墙齿正确列 `10,5;11,5;10,6` 与最终胜位姿 `10,6;11,6;10,7` 支配所有胜路；
      这只能证明结尾收敛，不能证明前缀构造或 parent 的启动换把被保留。
  player_meaning: >-
    玩家可以先从可达的 L 侧外面牵动双格条，或把尚未合体的组件分别送过边界，再于后段合体/收敛；
    因此无需先解决“在 P 侧构成正确 L，并由新低阶格启动跨界”这个设计题。
  why_single_win_state_is_insufficient: >-
    多个对象因果族最终都落到同一个目标位姿，所以 terminal winning state 数量为 1；
    作品身份依赖到达过程中的构造与换把，而不是只依赖终局占格。

family_failure_boundary:
  failed_family: 两格条可独立移动、单格后接、开放外侧回路与固定竖 P/L 的并置 family
  conflict: >-
    为让正确 L 合体后真实取得 L 侧外部 pull 把手，外侧空间必须可达；但同一可达性也让未合体双格条
    先被 pull 越界。用单纯静态墙封该外侧面又会同时封掉合体后的 parent 换把，或把另一构造提前泄题。
  material_gap: >-
    需要一种局部关系，使两个候选构造在合体前都可成立，但只有正确合体会开放/生成后继操作面，
    且该面在未合体组件上不可提前使用；这应作为抽象 Explorer 请求由 Controller 另行决定是否 dispatch。

