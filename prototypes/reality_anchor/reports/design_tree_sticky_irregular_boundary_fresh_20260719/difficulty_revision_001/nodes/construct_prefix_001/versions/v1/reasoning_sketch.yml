node_id: construct_prefix_001
exact_version: v1
candidate_id: RA_DIFFICULTY_CONSTRUCT_PREFIX_UPPER_L_V1
design_status: rejected_not_submitted

intended_player_problem: >-
  玩家先把经 B/S 变黏的单格接到双格条左下，主动构成上带三格 L；新生成的低阶格随即作为
  P 侧启动把手，把同一 L 推过固定 P/L。之后仍要完成 parent 的外侧换把、两次水平 pull、
  墙齿列判断与终段换到底侧 pull:down。另一个看似合理的下带 L 会在跨界后由远臂撞墙齿拒绝。

