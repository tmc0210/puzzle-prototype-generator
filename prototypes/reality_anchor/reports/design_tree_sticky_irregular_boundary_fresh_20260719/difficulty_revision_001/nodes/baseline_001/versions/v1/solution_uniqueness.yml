equivalence_account: >-
  两条最短 raw path 只在第一次从 L 的上格或下格左面推动，以及相应纯走位次序上不同；对象职责、
  四个里程碑与因果先后完全相同。完整图中终手前的额外对象移动均位于可逆子图；已专门验证正确列右侧
  多 pull:right 一格后，可用 `up,left,left,left,down,left,up,right,right,right,down` 返回超调前 exact state。
  所有胜路必须按顺序首次进入四个支配位姿，且每次首次进入的 mode/direction 唯一，因此不存在旧 push、
  提前正交下牵、超调后下牵或其它目标分配的非等价胜解。

bypass_audit:
  immediate_second_push_after_opening: fixed P/L makes player land on pull side; unavailable
  old_left_face_push_right: old faces are reachable but are on pull side; unavailable
  early_pull_down: left tooth blocks lower-toe target
  notch_pull_down: right tooth blocks the player/object relation that would bypass the lower-toe handle
  overrun_pull_down: right tooth blocks the overrun lower-toe target
  non_equivalent_winning_family_found: false

