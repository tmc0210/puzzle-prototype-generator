evidence_boundaries:
  supported:
    - current exact 在 current runtime 与声明的 terminal-win 图语义下的可解性、图完整性和全部终止胜态。
    - 两条最短 raw 路径的对象签名等价，以及所有胜路对四个位姿的支配和首次进入 source/mode/direction。
    - 落盘 canonical replay 的逐步机械字段，以及一次 pull:right 超调后返回同一 exact state 的原始步骤。
    - 四个指定删除反事实在各自 exact layout 上的完整图与最短解族变化。
  not_supported:
    - 不有限枚举含任意可逆环的所有 raw 输入串；对象胜族只按 raw JSON 中明示的因果等价关系归类。
    - 不证明难度、审美、可读性、惊喜、玩家自然发现概率或最终应否入选。
    - 不执行或替代 independent evidence review、fresh quality review、coach、pre-submission workflow 或人类试玩。
    - 反事实只解释指定 cell 删除后的机械变化，不把其转换为通用关卡设计规则。

