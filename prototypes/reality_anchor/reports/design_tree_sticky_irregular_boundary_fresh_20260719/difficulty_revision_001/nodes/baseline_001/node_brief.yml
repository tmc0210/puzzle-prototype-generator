design_brief: >-
  让玩家持续操纵一个三格 L 黏块：先从固定 P/L 的 P 侧推出，实际绕到外侧换成 L 侧牵引，
  再判断低阶突出部何时与双墙齿之间的单列缺口对齐，最后第二次换到底侧把手下牵入目标。
  难度来自真实换把、可逆超调与异形占格，而不是一次二择或增加推演层。

player_relationship:
  opening: 玩家紧邻三格 L 的两个旧推面，能看见竖向 P/L、右下双墙齿与夹在其中的单列目标。
  first_object_action: 从 P 侧向右推动三格 L 一格，玩家随即落入 L 侧，不能原地继续同向 push。
  continued_reading: >-
    玩家沿上回路取得上横臂右端外侧把手，连续两次 pull:right；第一次仍让低阶格对着左墙齿，
    第二次才使低阶格位于墙齿缺口上方。随后沿下回路取得低阶格下方把手并 pull:down。
  payoff: L 的上横臂与低阶格同时落入三个目标；低阶突出部成为终手实际把手。

structure_family: 三格 L 外侧换把 + 双墙齿单列钥匙孔 + 上下双回路
structure_hypothesis: >-
  把 Explorer 的“旧左面越界后模式失配”关系左移一列，使第一次 push 后玩家立即进入 L 侧；
  再用左右两枚形状墙把低阶格的合法下移时机压到中间一列，但保留右侧可逆超调和上下外侧走位。
  这样旧把手不是不可达，关键正解也不是唯一通道代走。

material_use:
  source_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/exploration/lexicon.md#三格-l-外侧换把旧推面越界失配与低阶格封向
  extracted_relation: 固定竖 P/L 使可达旧面失去同向 push；低阶格墙独立关闭过早正交下拉。
  reconstruction: >-
    未沿用材料卡目标或完整布局；改写边界相对位置、目标形状、右侧可逆空间与双墙齿 consumer，
    形成两次外侧换把和一个后继对齐判断。

