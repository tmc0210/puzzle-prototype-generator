design_brief: >-
  v14 双格左轨墙封住 B/S 横漂与已知胜族，但也封死玩家换列到 B/S 下侧，required reverse remerge 不可达。
  v15 相对 v13 formal exact 只保留一个最小左移目标止挡（优先验证单墙 (3,6)，Designer 可在同一一格责任范围选等价单墙），
  使 B/S 向左平移因刚体任一目标格撞墙而失败，同时保留另一左侧 walk 格，让玩家仍能绕到下方执行 reverse remerge。
  允许 B/S 从 canonical cut state 向右进入 x=5 通道；该分支若存在，必须在 actual exact 中不能胜、不能替代 L、不能让 B/S 成为独立目标，
  并由其占据核心通道形成清楚 commitment。它不要求可逆；主链已有纵向 cut↔remerge 可逆状态。
  保留 v13 opening access、P/L push→跨界→外绕→pull、H1×2、up H2、mother/deep/crate 关系。
  P/L counterfactual 继续按操作关系变化判断。先做 formal-target probe 与 bounded first-win，不写 formal v15 candidate/submission、不跑完整图。

