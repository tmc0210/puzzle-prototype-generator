required_outputs:
  - 相对 v13 formal layout 只作一个 floor→wall 的 exact diff；canonical 21 步 H2 win 与 opening pre/post access 保持。
  - canonical cut state 的 B/S left 平移 actual force_blocked；reverse vertical remerge actual legal并恢复母体；deep cut 仍 blocked。
  - 若 B/S right 平移 actual legal，运行该 commitment 分支的 bounded reachability/first-win：不得完成 H0/H1/H2 或任何目标分工；记录是否可恢复但不强求。
  - bounded actual first-win 覆盖 v13 B/S-left、direct L, skip H1, mother/deep/crate 路线；无 actual 非等价胜族才通过。
  - P/L counterfactual 若把 exact 关系改成连续 push，记录为 responsibility_changed；不因 counterfactual 可解性本身失败。
  - 通过只写 probe_passed_for_candidate；失败写最小冲突。不得写 formal candidate、完整图、uniqueness/submission。
