design_brief: >-
  v4 shared-opening local integration 已成立；本轮不得修改 layout/start/goals/objects 或玩家关系，只完成 current exact 的解族与送审判定。
  先用预声明预算枚举 terminal-win graph，并针对分组件延后合体、先动 B/S 后排形、B/S 少扫/反扫、2x2 绕墙、
  S 跳过外拉—exact return—下侧换面的旁路做可重跑审计。完整图能闭合则声明 unique_complete；若在合理预声明预算内无法完成，
  只能按标准声明 unique_within_budget 并把未覆盖范围写清，不能把“一个胜态”或最短解当唯一性。
  发现任何非等价胜族则 current v4 不提交，写失败诊断；只有玩家逻辑类唯一/等价、canonical current replay 完整、
  前序 active construction 与父节点操作面生命周期都由胜族实际承担时，才补 node brief、design reading、solution uniqueness、review actual replay 与 submission。

