design_brief: >-
  原教练唯一方向如下，保持其自然语言语义：不要一开始就把可用异形完整交给玩家，而要让玩家在进入 baseline 的换把与墙口腾挪之前，
  主动形成那个同时保有后续把手与远端突臂的连通形状。局部应当存在不止一种看似能继续的构造，只有预见后段如何跨 P/L、
  恢复操作面并穿过墙口，玩家才能判断哪种形状与接触关系值得保留；新增内容仍由同一个异形关系主导，而不是另接一段拼接表演。
  如果玩家不理解后段的换把、操作面与墙口关系，也能顺着局部唯一动作完成构造，或者构造结束后整段关系随即退休，就不要保留这次生长。
  人类难度纠偏继续有效：子节点不能通过删除 P/L、回返管理或多面腾挪而比父节点更简单；难度可来自真实异形腾挪、状态恢复或与异形有机结合的推拉锚点，
  不要求单纯增加推演层。完整执行单节点设计、exact replay、玩家侧重读、解族自查和 Designer 送审准备；若局部材料缺口阻塞，先写 abstract exploration request 交 Controller 调度。

