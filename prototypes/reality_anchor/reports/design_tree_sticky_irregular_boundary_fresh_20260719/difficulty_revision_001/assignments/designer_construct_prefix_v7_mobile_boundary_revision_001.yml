design_brief: >-
  v6 的抽象减法门槛得到一半正材料：同一连通母体可由不同切分深度留下三格 L、五格异形或规整残体，
  异形残体也可从新的外侧面继续刚体移动；但开放局部中切出 crate 可以晚粘回，简单三墙一口隔离只覆盖直接反推，
  未证明长路径不会回粘。因此 v6 不形成 exact，也不能靠死袋、独立封箱或更长执行把身份问题藏起来。
  选择一个 v7 family：可以保留“连通母体减法”，但只有当 B/S 边界的有意义移动、P/L 推拉转换或同一异形的
  可逆状态管理自然改变晚粘回关系时才继续；晚粘回也可成为玩家必须主动进入再撤销的同核心状态，前提是它不把异形退休、
  不让 crates 成为独立钥匙。也可以完全换 family。无论选择什么，正确构造后都必须继续承担冻结 baseline 已有的
  P/L 外侧换把、exact-state 或等价回返读取、另一正交操作面和墙口远端责任；不得把它们压成一次形状二择。
  难度可以来自真实异形腾挪、移动 B/S/P/L、操作面保存恢复或状态反转，不要求增加更多层延迟推演。
  先写 family reasoning 并用最小 runtime probe 验证局部责任；局部链完整后才画 v7 exact，禁止直接跑大图。

controller_verified_v6_boundary:
  positive_facts:
    - 同一连通母体可经浅切与深切产生不同连通残体。
    - 至少一个三格 L 或五格异形残体可在切分后接受真实外侧轴向刚体动作。
  negative_facts:
    - 无额外关系时，切出 crate 存在晚粘回并触发 box_to_sticky 与 sticky_merge 的合法 replay。
    - 静态三墙一口只证明直接反推站位受限，不足以证明长路径隔离。
  use_boundary: >-
    这些事实只用于关闭 v6 门槛与确定 v7 风险；不得读取 Explorer raw run、坐标、layout、replay 或 proposed family，
    不把局部材料当作完整关卡设计。

