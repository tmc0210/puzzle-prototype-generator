design_brief: >-
  为难度修订树制作一个全新 baseline：保持小型异形黏块的近端操作关系与远端墙口、墙边或锚点边界作用由同一刚体持续耦合，
  目标难度 3。人类明确允许难度来自异形真实腾挪、操作面保存/放弃/恢复、动作可逆性管理，或与固定/可移动 P/L 的有机推拉；
  不要求统一增加推演层，也不要求一定使用 P/L。第一次正确对象动作之后，玩家仍应继续操纵和重新读取同一异形关系，
  不能回到一次显然二择加唯一兑现。请 fresh 选择 structure family，不把上一树任一 frozen exact 当布局底稿。
