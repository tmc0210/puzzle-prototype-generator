  - 最多列三个局部 runtime gates：progressive outside-handle、pre-shift direct finish blocked、mother/deep-cut/crate substitution blocked；本阶段不运行。
  - 逐项说明 B/S 与 P/L 如何都保持对同一异形的操作责任；若选择删去一个锚点，必须由不更低的真实异形操作关系替代。
