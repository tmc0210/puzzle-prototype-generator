design_brief: >-
  v8 stage1 partial 已证明 post-cut 三格 L 的 H0→非恒等 H1→H2，以及 H0 direct blocked / H1 预放恢复。
  本阶段只补齐尚未运行的 identity/substitution 门槛：把实际可移动 B/S 的一格切分接到同一 progressive 局部链；
  B/S 必须由玩家移动并留下三格 L+crate，反向可回粘母体，但同方向第二格深切在锚点可达状态中不存在。
  正确 L 完成 H0→H1→H2；回粘四格母体能承担相同 P 侧 stroke 与外侧非恒等进位，直到 H1-like 正交动作才由额外尾格失败。
  切出 crate 不得被独立施力、进入 P/L 链、覆盖目标或替代 L。只做无胜利目标的 combined local probe；不形成 candidate、不跑图。

