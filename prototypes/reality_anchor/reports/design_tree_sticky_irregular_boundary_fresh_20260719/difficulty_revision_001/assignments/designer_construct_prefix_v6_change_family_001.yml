design_brief: >-
  v1—v5 已关闭：开放回路允许延后合体；封门缺角删弱换把；可动 P/L 旧半格不能 immediate walk；shared identity gate 可被 anchor-first 反转；
  双格 access throat 未形成 exact。停止围绕“多个分离组件先合并、再阻止 anchor-first”修补。
  回到冻结 baseline 与教练方向，选择不同前序模型：玩家必须主动形成或留下一个连体小异形，随后进入 P/L 外侧换把、回返与墙口多面腾挪；
  分离组件不能在后段延后完成同一构造。允许考虑 B/S 切分、箱黏身份变换、从较大连体对象中主动留下 L/S/阶梯或其它完全不同方式，
  但不预设必须使用切分；正确构造后父节点操作面生命周期不得简化，错误结果只由后段关系消费。
  第一阶段只写一个新 family reasoning 或 abstract Explorer request，不画布局、不跑图。

