design_brief: >-
  construct v1/v2/v3 的失败边界已经明确：不能让分离组件从开放回路延后合体；不能用构造体封门后把父节点换把压成连续拉；
  不能假设可动 P/L 让出的旧半格会立即成为玩家 walk 出口。三个 family 均关闭，不沿其几何修补。
  回到冻结 baseline 与原教练方向：玩家在进入 P/L 换把和墙口腾挪前主动形成完整异形，后段反向区分构造结果；
  正确构造后仍实际承担父节点的外侧换把、可逆回返读取和多面终拉。可以考虑 B/S 转化、身份边界或其它有机结构，
  使分离组件不能先行跨界、合并只能在 handoff 前发生；也可选择完全不同方向。可动 P/L 仍允许，但不得依赖已被否定的 immediate walk-exit 假设。
  第一阶段只选一个新 family 或写 abstract Explorer request，不画布局、不跑图；最终只有 v4 exact、非空 replay、完整解族与玩家侧关系同时成立才写 submission。

