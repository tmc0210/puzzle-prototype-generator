design_brief: >-
  v10 的核心局部链均成立：实际 B/S 切分、P push 后跨入 L 世界、repeat push 阻断、纯 walk 离场、外侧非恒等 H1 pull、
  H2 正交动作、母体远尾墙责任与第二格深切阻断。唯一失败是玩家在取得 H2 操作面时也到达 cut crate 东侧，right 可独立 pull
  crate 一格。v11 不再把“crate 发生任何移动”自动判死，而把它作为同一身份/可逆状态关系的明确分支审查。
  若 crate 位移可以覆盖或替代 H2 目标、让 L 退休、产生非等价胜族，或要求一个独立清理子题，family 失败。
  只有当该位移不能胜且能由 B/S 回粘—再切、同一 P/L/形状操作或短而可读的原关系恢复，且恢复后玩家仍完整承担 L 的 H1→H2，
  才可保留。Designer 也可用不删弱主链的局部几何改变消除该施力，但不得封掉 v10 纯 walk 离场或 H2 footprint。
  本阶段只做 provisional H2 target 下的 crate-state runtime probe 与 reasoning，不形成正式 candidate、不跑完整图。

