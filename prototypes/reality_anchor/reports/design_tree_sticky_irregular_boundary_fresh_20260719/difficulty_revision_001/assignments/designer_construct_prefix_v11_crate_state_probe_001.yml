required_outputs:
  - 用 provisional H2 footprint 目标运行 intended v10 主链，确认仍由同一 L 的 H2 动作即时覆盖，cut crate 不在目标上。
  - 从相同 H1/H2 取面状态执行 crate east pull，测试它能否直接/随后覆盖目标、替代 L 或形成另一对象分工。
  - 若保留 crate 分支，必须给 current-runtime 恢复 witness，并证明恢复依赖同一 B/S/P/L/异形关系而非独立清理；恢复后仍需完整 H1→H2。
  - 若用几何消除 crate 施力，必须重跑 v10 的跨界、纯 walk、H1→H2、母体尾格与深切 gates；任一退化即失败。
  - 通过只写 probe_passed_for_candidate；失败写最小非等价/不可恢复冲突。不得写正式 layout、完整图、uniqueness 或 submission。
