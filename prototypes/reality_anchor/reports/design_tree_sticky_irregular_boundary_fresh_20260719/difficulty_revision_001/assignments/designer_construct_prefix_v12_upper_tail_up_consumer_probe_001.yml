design_brief: >-
  v11 证明 cut crate 首次位移不胜，但第二次可占 H2 目标，B/S 回粘后又没有同核心恢复 witness，故下尾/向下 H2 family 关闭。
  v12 保留已成立的 B/S 身份切换、P/L 跨界、repeat push 阻断、纯 walk 离场与外侧非恒等 H1；将母体/L 关系上下镜像或等价旋转，
  使切出的余料位于上方，H2 从下侧向上 pull。正确 L 的 H2 footprint 不经过 cut crate 的操作面；回粘母体多出的上尾则在同一 H2 向上
  位移时进入独占墙齿。第一次 P push 后玩家仍必须进入 L 世界并拥有不移动任何对象的纯 walk 离场。
  实际 B/S 一格切分/反向回粘、第二格深切阻断、cut crate 四面 substitution 必须同布局成立。
  先做无目标 combined runtime probe，不形成 candidate、不跑图。

runtime_parser_exception: >-
  current CLI 要求至少一个 G；允许一个完全隔离、从未覆盖且不触发 win 的 dummy target。

