required_outputs:
  - current-runtime 正 replay：实际 B/S 切分；P 侧首次 push 到 H0 后玩家位于 L 世界；绕到右外侧后 L pull 到 H1，再正交 H2。
  - H0 后立即同方向 right 输入不得移动 L，state unchanged 或仅失败；记录玩家世界、失败原因与对象占格。
  - 重跑回粘母体 H1-like 尾格失败、第二格深切阻断与 cut crate 四面动作表；P/L 移位后任一退化即停止。
  - 写 v9 reasoning 说明 P/L 为什么有机强制换把而非标签；全部通过写 probe_passed，不得形成正式 candidate/目标/图/submission。
