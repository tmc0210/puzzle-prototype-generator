design_brief: >-
  v8 combined 局部链成立，但正式目标版被定向反例否决：H0 后玩家仍在 P 世界，可连续第二次 right push 到与 canonical H1
  相同对象状态，再直接 H2 获胜，完全跳过外换把与 L 侧 pull。该旁路不能靠阻挡对象右移解决，因为 intended pull 需要同一对象位移。
  v9 只调整 P/L 边界关系：第一次 P 侧 right push 后，玩家必须跨入 L 世界；在 L 世界从对象左侧再次 right 不得移动对象，
  玩家只有绕到对象右外侧后才能以 L 侧 right pull 进入非恒等 H1。保留 v8 的实际 B/S 一格切分、回粘母体、H1→H2 墙口、
  第二格深切与 cut crate substitution 阻断。先做无目标 combined runtime probe，不形成 candidate、不跑图。

runtime_parser_exception: >-
  current CLI 要求至少一个 G；允许一个完全隔离、从未覆盖且不触发 win 的 dummy target。

