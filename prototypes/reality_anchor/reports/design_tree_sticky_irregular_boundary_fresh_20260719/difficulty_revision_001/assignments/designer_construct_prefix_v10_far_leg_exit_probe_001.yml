required_outputs:
  - actual B/S 切分后，首次 P push 让玩家进入 L 世界；立即同向输入不移动异形；至少一个垂直/正交离场输入是纯 walk。
  - 玩家由该离场绕到外侧，L pull 到非恒等 H1，再从 H1 新面正交施力到 H2；canonical probe 不含 exact loop。
  - 回粘母体完成同前段，在 H1-like→H2 因唯一额外尾格 force_blocked；玩家目标格开放。
  - 第二格深切与 cut crate 全面 substitution 回归通过；P/L 跨界或纯 walk 离场任一退化即停止。
  - 写 v10 reasoning 说明新异形朝向怎样保存近端操作与远端责任；通过只写 probe_passed，不得形成目标/candidate/图/submission。
