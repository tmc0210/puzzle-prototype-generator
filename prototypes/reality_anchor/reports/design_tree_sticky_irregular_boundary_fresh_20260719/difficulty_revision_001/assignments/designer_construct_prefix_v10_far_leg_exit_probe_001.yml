design_brief: >-
  v9 把首次 P-side push 后玩家送入 L 世界，成功关闭连续 second push；但 H0 玩家被对象关系夹死：left 拉回 L、
  up 独立拉动 cut crate 并重新 merge、down/right occupied，外换把不可达。v10 保留 P/L 跨界语义，改变母体/L 的朝向、
  施力接触行或切尾位置，使首次 push 后的 L-world 玩家至少有一个真实 walk 离场方向；该步不得移动 L、crate 或锚点，
  随后玩家绕到异形外侧以 L-side pull 进入非恒等 H1，再从新正交面进入 H2。
  允许使用“近端横臂、远端下腿”的镜像/旋转 L 或其它三格异形，以及对应四格母体；但母体多出的切尾必须仍在 H1-like→H2
  接受额外远端墙责任。实际 B/S 一格切分、反向回粘、第二格深切阻断、cut crate 不可独立替代仍需同布局成立。
  先做无目标 combined runtime probe，不形成 candidate、不跑图。

runtime_parser_exception: >-
  current CLI 要求至少一个 G；允许一个完全隔离、从未覆盖且不触发 win 的 dummy target。

