design_brief: >-
  v13 opening/access probe 已用 current runtime 与 walk-only reachability 通过：P-side 切分后 H0 前无法到达等价 L-side pull faces；
  首次 P push 让 L 自身腾出门格，玩家纯 walk 外绕后取得 H1，继续两次非恒等 pull 与 up H2；repeat、母体上尾、deep cut 和有界 crate 回归保持。
  现在只在 H2 footprint (10,6)(9,7)(10,7) 放正式目标，移除 dummy G，形成 v13 current exact。
  canonical 必须实际包含 P-side B/S 切分、首次 P push 跨界、L 腾门后的纯 walk 外绕、H1 pulls 与 H2 up pull；不执行 exact loop。
  本阶段运行 formal replay、玩家侧重读和定向 first-win 审计，不跑无界完整图、不写 uniqueness/submission。

