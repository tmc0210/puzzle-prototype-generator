required_outputs:
  - 正式 layout 无 dummy target；三个 G 只由 canonical H2 结果覆盖，cut crate/anchors 不承担目标。
  - canonical/review replay 同一 exact/hash，21 步或 mechanically equivalent chain 在 H2 当步 win。
  - 定向审计至少覆盖：v12 direct L-pull family、repeat push、跳过 H1、不切/回粘母体、deep cut、cut crate 目标/替代、B/S-first 后退休、P/L 可删/同侧替代。
  - design_reading 说明切分后仍需更新 access、P/L 世界、外换把与远端 H2 责任；不把 pure walking 的长度计作难度。
  - 任一非等价胜族即撤回；审计通过只写 candidate_ready_for_graph，不写 solution_uniqueness/submission。
