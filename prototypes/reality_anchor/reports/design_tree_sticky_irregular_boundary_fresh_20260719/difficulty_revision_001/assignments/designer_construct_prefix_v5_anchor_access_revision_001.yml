design_brief: >-
  v4 的 shared-opening、S/2x2 identity gate、固定 P/L handoff、外拉/回返/下侧终拉均成立；唯一已知致命旁路是玩家能从 step1 先完成 B/S，
  再排形与 merge，反转 active construction 的因果顺序。v5 只修订 opening/access 结构：B/S 在玩家作出可感的构造承诺前不得接触，
  但 S 与 2x2 两种 active construction 仍都必须合法、局部可信，不能用单一强制动作或墙形直接宣布正确形状。
  一旦 access gate 打开，尽量保持 v4 已验证的 B/S push→绕位 pull、完整 handoff、外侧 pull、可逆回返与下侧 consumer 链；
  不新增独立钥匙子题，不把 anchor access 变成长走路或一次按钮。当前先形成 v5 exact 与 local/runtime gate probes：证明 anchor-first 不可达、
  两种构造均可开启同一 B/S access、下游链仍成立。通过后才跑解族；发现新的非等价胜族则不提交。

