design_brief: >-
  current v1 已因非等价胜族撤回，不在该 exact 上收窄声明或继续补墙。回到冻结 baseline 与原教练方向，允许更换 structure family：
  玩家必须在进入 P/L 换把与墙口腾挪前主动形成同时保有后续把手与远端突臂的异形；前段至少两个局部合理构造，
  只能由后段的跨 P/L、操作面恢复与墙口责任区分。父节点的真实换把、回返与多面腾挪必须继续存活或由不更低的同核心关系替代，
  不能靠删除 P/L 或把后段变成动画避开 v1 旁路。若新的局部材料缺口阻塞，先写 abstract explorer request；否则完成 v2 exact、
  current runtime replay、玩家侧重读、完整解族自查与 raw diagnostics。只有不存在非等价胜族且作品关系成立时才写 submission。

