  - 一个不评价目标条件的最小 combined runtime probe：先形成正确 B/S 配对态，再由同一 L 完成 P/L 轴向 stroke、外换把、反向回返与第二正交施力；可按 runtime_parser_exception 放置 dummy G。
  - 记录 handoff 前后对象占格、P/L 与 B/S 占格、玩家站位，以及回返时非玩家状态 exact comparison。
  - 同布局从回粘母体态出发运行等价首段探针；说明它为何不能替代正确配对态，且原因不是普通不可达或独立 crate 子题。
  - 通过时只写 stage2_passed；任一门槛失败即写最小冲突并停止。不得写正式 layout、canonical、完整图或 submission。
