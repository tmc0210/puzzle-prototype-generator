design_brief: >-
  v7 stage1 已用 current runtime 证明：玩家移动 B/S 可把连通四格母体切成三格 L+crate，撤回 B/S 可回粘恢复母体，
  再切后完整 state key 精确恢复。本阶段只验证该正确配对态能否有机接入冻结 baseline 的 P/L 操作面生命周期；
  仍然不是正式 candidate，不跑完整图、不设胜利目标。必须由同一三格 L 完成 P 侧轴向 stroke、玩家换到外侧后 L 侧 pull、
  反向回到同一 handoff 非玩家状态，并从第二正交面再次施力。B/S 不得替代任一步，也不得在 P/L 链前退休为无关按钮。
  同一局部布局还要验证回粘四格母体不能完成等价 P/L 链；失败原因必须是完整占格/边界关系，而非简单封死玩家站位。

runtime_parser_exception: >-
  current CLI 要求至少一个 G；允许放置一个与玩家、对象、动作路径、受力闭包和结论完全隔离的 parser-only dummy target。
  该 G 不得被 probe 覆盖、不得触发 win、不得参与站位或几何责任，产物必须显式标注其唯一用途。

