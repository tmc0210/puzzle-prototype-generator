required_outputs:
  - 列出相对 v13 exact 的最小 diff；canonical 21 步 H2 win 与 opening pre/post access/P-L relation 保持。
  - current-runtime depth cycle：mother→correct cut→deep cut，并分别能返回 correct cut；记录 B/S、sticky components、crates 与 exact state comparison。
  - mother/deep branches bounded 无 win、无 H2 footprint/目标分工、无规整残体或 crate substitution；返回后仍完整执行 correct L H0→H1→H2。
  - B/S-left actual blocked；B/S-right commitment bounded non-win；actual first-win 审计无非等价胜族才通过。
  - P/L counterfactual 按关系变化记录，不因全推可解性失败。
  - 通过只写 probe_passed_for_candidate；任一 state branch actual 胜族或不可恢复即失败。不得写 formal candidate、完整图、uniqueness/submission。
