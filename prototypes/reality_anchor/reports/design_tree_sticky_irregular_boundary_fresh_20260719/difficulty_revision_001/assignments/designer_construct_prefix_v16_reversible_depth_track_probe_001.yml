design_brief: >-
  v15 单墙封住 B/S-left 胜族并保持 canonical/access，但 v13 的 `(4,8)` deep-cut 墙同时占据玩家执行 reverse remerge 所需的 driver cell，
  bounded 603 states 无 mother restore。v16 不再强制阻断 deep cut；把 B/S 纵向关系物化为可逆三态轨：mother、正确一格 cut、过切。
  相对 v13 formal exact 固定最小 diff 候选为：(3,6) floor→wall，封 B/S-left；(4,8)(4,9) wall→floor，
  让玩家可从下侧把 B/S 在三个纵向深度间推回。Designer 可在不扩大三格责任范围的前提下修正等价坐标，但必须列 exact diff。
  正确一格 cut 后走原 H0→外绕→H1×2→up H2。mother 与过切必须 actual 可达、可返回正确 cut state，但不能胜、不能目标分工、
  不能用规整残体或 crates 替代 L。B/S-right commitment 继续 bounded non-win，B/S-left blocked。
  opening pre/post access 与 P/L 操作关系必须保持。先做 formal-target probe 与 bounded first-win，不写 formal v16 candidate/submission、不跑完整图。

