design_brief: >-
  v1 开放回路出现绕过主动构造的非等价胜族；v2 以竖条封门生成缺角，却把正确构造后的操作压成连续正交拉，无法恢复父节点外侧换把。
  两个 family 均已关闭，不沿原几何补墙。回到冻结 baseline 与原教练方向：前序构造必须被后段跨 P/L、操作面恢复和墙口责任反向约束，
  同时父节点已有的换把、回返读取与多面腾挪继续由玩家实际承担或被不更低的同核心关系替代。可以选择完全不同的异形、构造方式或空间；
  人类明确允许可移动 P/L 或“推拉锚点也被推拉”，但只有当它有机服务同一异形的把手生命周期时才可使用，不得成为独立锚点题。
  第一阶段只选择一个不同 family 或提出 abstract Explorer request；形成局部关系后再逐级验证，禁止直接跑大图。最终只有 current v3 exact、
  非空 replay、完整解族与玩家侧关系同时成立才写 submission。

