design_brief: >-
  v8 stage1/stage1b 已用 current runtime 证明完整 combined local chain：玩家实际移动一格 B/S 切出三格 L+crate；
  同一 L 经 P 侧 H0、外侧非恒等 H1 到正交 H2；回粘母体承担相同前段后由额外尾格在 H2 输入撞墙；
  第二格深切不可达，cut crate 的四面均不能独立施力。现在把 H2 footprint 物化为正式目标并形成 v8 candidate。
  正式布局不得含 dummy G；所有目标必须在 canonical H2 由同一 L 的动作结果覆盖，cut crate 不覆盖目标。
  canonical 必须实际包含 B/S 切分、P 侧 stroke、玩家外换把、L 侧非恒等 pull 与 H2 正交 pull，且不执行 exact loop。
  本阶段只做 current-runtime replay、玩家侧重读与定向反例审计；不跑无界完整图，不写 uniqueness/submission。

