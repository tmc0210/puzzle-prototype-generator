design_brief: >-
  v12 的 combined 局部链与 formal canonical 均成立，但首个 directed audit 找到 16 步非等价胜族：玩家切分后已能进入 L 侧，
  用连续 L-side pulls 替代首次 P-side push，跳过 P/L 跨界、repeat rejection 与 pure-walk exit。H1/H2 上尾结构保留；
  v13 只重做 opening-side access。B/S 切分动作必须从 P-side access 或等价的 P-only 起点完成，且切分后、首次 H0 push 前，
  玩家仅靠 walk 不得到达任何能把三格 L 沿 intended 轴向送往 H1/H2 的 L-side pull face。
  首次 P push 后玩家跨入 L 世界，并由 L 让出的旧占格、缺口或既有回路开放纯 walk 外绕；此后才能取得 intended L-side H1 pull。
  不得用独立钥匙、一次性门、隐藏区域或 B/S 先完成后退休实现 access gate；开放关系必须由同一 L 的非恒等移动产生。
  保留 v12 的 up H2、母体上尾、deep cut 与 cut crate 回归。先做无目标 opening/access runtime probe，不形成 candidate、不跑图。

runtime_parser_exception: >-
  current CLI 要求至少一个 G；允许一个完全隔离、从未覆盖且不触发 win 的 dummy target。

