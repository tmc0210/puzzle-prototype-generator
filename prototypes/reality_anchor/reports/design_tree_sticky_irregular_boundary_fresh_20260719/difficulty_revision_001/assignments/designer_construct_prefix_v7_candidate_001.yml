required_outputs:
  - 正式 layout 不含 parser-only dummy target；所有 G 都由 canonical 中有责任的对象覆盖，高潮后尽快触发 win。
  - canonical 必须从四格母体开局，实际移动 B/S 形成 L+crate，并由同一 L 完成 P/L 轴向、外换把、exact 回返与第二正交动作。
  - design_reading 从熟练玩家侧说明第一次切分后仍有哪些新判断；普通 walking 与唯一执行不计为难度。
  - 定向检查至少覆盖：不切/回粘母体直进、B/S-first 后退休、crate 独立目标/钥匙、跳过回返、跳过外换把、跳过第二操作面。
  - 任一非等价胜路即保存诊断并停止；若局部检查通过，也只回报 candidate_ready_for_graph，不写 submission。
