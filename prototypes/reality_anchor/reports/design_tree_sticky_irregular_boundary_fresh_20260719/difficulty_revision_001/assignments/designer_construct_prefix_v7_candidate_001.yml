design_brief: >-
  v7 stage1/2 已分别证明可移动 B/S 的“L+crate—回粘母体—精确恢复 L+crate”身份循环，以及正确 L 在同一局部结构中
  完成 P 侧轴向 stroke、外侧 L pull、exact 回返和第二正交 pull；四格母体能承担前三段，却因额外下尾在第二正交输入撞墙。
  现在把这条局部关系物化为一个正式 v7 candidate exact。开局必须给四格连通母体与可移动 B/S，玩家要主动形成 L 配对态；
  回粘母体是可读可逆状态，不是即时死路。随后同一 L 必须实际完成 stage2 的 P/L 多面链，墙口/目标在第二正交责任处集中兑现并尽快结束。
  可以压缩无责任空地，但不得压掉玩家外换把与回返空间；不得把正确切分变为开局唯一合法对象动作，也不得让 dummy target 进入正式布局。
  本阶段只完成 current-runtime candidate layout、非空 canonical replay、review actual replay 与玩家侧 design reading；
  先做定向反例检查，但不跑无界完整图、不写 solution_uniqueness 或 submission。

