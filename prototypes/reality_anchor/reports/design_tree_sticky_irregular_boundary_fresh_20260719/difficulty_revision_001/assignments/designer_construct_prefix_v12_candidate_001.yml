required_outputs:
  - 正式 layout 无 dummy target；所有 G 在 H2 由同一 L 的最终 up 动作结果覆盖，win 立即或极短收束。
  - canonical/review replay 来自同一 exact/layout hash，实际包含 B/S、P/L 跨界、纯 walk 离场、H1 外拉和 H2 向上终段。
  - 定向审计至少覆盖：repeat push、跳过 H1、不切/回粘母体、第二格深切、cut crate 目标/替代、B/S-first 后退休、P/L 同侧替代/可删。
  - design_reading 从熟练玩家侧说明第一次切分后仍持续有哪些判断，不计 walking、步数、事件数或 delayed reveal 本身。
  - 任一非等价胜族即撤回并保存诊断；全部局部审计通过只写 candidate_ready_for_graph，不写 uniqueness/submission。
