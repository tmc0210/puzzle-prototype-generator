design_brief: >-
  v12 final probe 已用 current runtime 通过全部局部门槛：实际 B/S 切出上方余料与三格 L；P push 后玩家进入 L 世界；
  repeat push 阻断；玩家纯 walk 离场后外侧 pull 到非恒等 H1；从下侧 up pull 到 H2；回粘母体同前段只因唯一上尾撞墙；
  第二格深切在最终布局 runtime destination_blocked；H2 取面路线不经过可施力 cut crate face。
  现在把 H2 footprint 物化为正式 v12 目标并形成 current exact candidate。移除 dummy G，目标只放 H2 三格，cut crate/B/S/P/L 不承担独立目标。
  canonical 必须包含实际 B/S 切分、P/L 跨界、纯 walk 外换把、至少一次 L-side 非恒等 H1 pull 与向上 H2；不执行 exact loop。
  本阶段只做 replay、玩家侧重读与定向胜族审计，不跑无界完整图、不写 uniqueness/submission。

