design_brief: >-
  人类确认上一棵树的流程与体验核心方向正确，但三个 delivery exact 的实际难度分别只有 1–2、1–2、2–3，
  原因都是熟练玩家只承担一次二择；第三关仅把差异延迟数步揭示。人类进一步纠正：难度不必统一来自更多层推演，
  异形的真实腾挪、操作面保存/恢复、可逆状态管理以及与 P/L 锚点的有机推拉都可以承担难度；上一树从 baseline 到两个
  生长节点反而删除 P/L 操作维度，使玩家负担下降。请保持原体验核心、作品身份边界、后期玩家前序和
  RA_CAND_0010/0015/0011 的分类校准边界，重写本轮体验简报，使新的 baseline 与后续生长真实定位在 3–5。
  不得把机械不可替代性、solver 复杂度、普通走路、无判断执行长度、隐藏信息或一眼可见的单次二择计作玩家难度；
  也不得让子节点通过删去父节点已有的有意义操作维度而“越生长越简单”。本 assignment 不设计布局。
