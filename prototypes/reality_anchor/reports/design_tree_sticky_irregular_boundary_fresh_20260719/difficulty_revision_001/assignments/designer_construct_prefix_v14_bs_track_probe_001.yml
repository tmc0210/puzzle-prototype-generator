required_outputs:
  - 相对 v13 formal layout 只作阻止 B/S 横向漂移所需的最小墙变更；列出 exact diff 与墙责任。
  - current-runtime canonical 仍在 H2 win；opening pre/post access、repeat push、mother、deep cut 与 crate 回归保持。
  - 切分后枚举 B/S 四向：左右横移阻断；同向深切阻断；反向回粘仍合法且恢复母体。
  - bounded first-win 审计至少覆盖 v13 的 23 步 B/S 旁路、direct L-pull、skip H1、mother/deep/crate actual exact 路线。
  - P/L 删除/同侧反事实只比较玩家操作关系；若变为全推而非 exact 同关系，记录为 P/L responsibility changed，不据 solvability 本身撤回。
  - 全部通过只写 probe_passed_for_candidate；任一 actual 非等价胜族即失败。不得写 formal candidate、完整图、uniqueness/submission。
