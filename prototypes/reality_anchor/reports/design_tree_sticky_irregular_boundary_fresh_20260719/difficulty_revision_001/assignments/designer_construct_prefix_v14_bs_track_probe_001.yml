design_brief: >-
  v13 修复了 opening direct L-pull，但 formal exact 有实际 23 步旁路：opening cut 后 B/S 从 (4,6)(4,7) 横移到 (3,6)(3,7)，
  再走相同 L 核心链并获胜，产生无责任的锚点终态。v14 只给 B/S 一格纵向身份轨增加最小横向止挡：
  canonical opening cut、允许的反向回粘、首次 P push 腾门、纯 walk 外绕、H1×2 与 up H2 均须保持；切分后 B/S 的左右横移
  以及同方向第二格 deep cut 必须由 current runtime 阻断。
  同时纠正 P/L counterfactual 的判断：删除 P/L 或把活动区全置 P-side 后仍可能有全推解；这不是 actual exact 的胜族。
  评价重点是操纵关系是否改变。若 counterfactual 把 exact 的 P-push→跨界→外绕→L-pulls 改成连续 push，反而证明 P/L 对 actual
  玩家关系有责任；只有删除/同侧替代后仍保留相同操作面生命周期，才算 P/L 无责任。
  本阶段在 v13 formal target exact 上只验证最小 track wall 与 bounded first-win，不写 formal v14 candidate/submission、不跑完整图。

