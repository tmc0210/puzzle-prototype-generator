design_brief: >-
  v4 family 的局部责任已由 task-local 材料支持，但上一 Designer 未把不同对象总量的“三格 L 与四格 2x2”整合进共享开局和统一 handoff，
  因而没有 exact。当前 assignment 只处理这一个整合问题，不重新选择 identity-gate family、不做开放探索：玩家从同一组分离材料主动形成两种等格数、均合法的连体结果；
  不得给 L 分支的多余第 4 箱另编职责。允许结合 input 中已发布的四格错位 S/2x2 主动合并材料，把比较改成同对象总量的 S 与 2x2，
  B/S 身份门保证分离组件不能延后合体；两种完整形状都经历同一 B/S 推转拉与固定 P/L handoff；handoff 后保留外侧 pull、跨侧反推回 exact state、
  以及下侧正交 pull；只有后段墙齿/交换格首次区分正确异形。父节点操作面生命周期不得删弱。
  本轮只画 v4 layout 草案并跑 local/full runtime probes，确认共享开局与统一链成立；暂不跑 complete graph、不写 submission。
  若无法整合，写清具体机械冲突并撤回 family，不继续扩图或补墙。

