design_brief: >-
  v8 family 已选定“一格 B/S 母体/L 切换—P/L 外侧非恒等进位—新露面正交消费”。本阶段只运行 reasoning 中的
  三个局部门槛，不做正式 candidate：正确 L 从 H0 经外侧 pull 到非恒等 H1，H1 新露出的入口/把手允许正交 H2；
  H0 不能直接做等价正交终段，移除负责墙位或预放 H1 后恢复；母体能承担相同前段，到 H1-like 后才由额外尾格失败，
  且 B/S 第二格深切、独立 crate 施力与目标重分在该局部结构中不存在。
  H1 反向恢复 H0 只记录可逆性，不得出现在 canonical 前进 probe 中。任一门槛失败即停止。

runtime_parser_exception: >-
  current CLI 要求至少一个 G；允许一个与玩家、对象、动作路径、受力闭包和结论完全隔离、从未覆盖且不触发 win 的 dummy target。

