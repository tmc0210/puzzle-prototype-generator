solution_uniqueness_claim_extracted:
  result: unique_complete
  search_scope: complete
  search_budget: max_states=300000; graph_max_states=300000
  equivalence_account: >-
    两条最短 raw path 只在第一次从 L 的上格或下格左面推动，以及相应纯走位次序上不同；
    对象职责、四个里程碑与因果先后相同。完整图中所有胜路都依次首次进入同四个位姿，
    每个位姿的首次进入 mode/direction 唯一；正确列右侧多 pull:right 一格属于可逆子图，
    已有 exact-state return trace。声明不存在旧 push、提前下牵、超调后下牵或其它目标分配的非等价胜解。

mechanical_claims:
  - claim_id: exact_solvable
    claim: >-
      current v1 的 16 步 canonical 输入全部合法，依次执行
      push:right、pull:right、pull:right、pull:down 四次对象操纵，并在第 16 步立即获胜。

  - claim_id: solution_logic_unique
    claim: >-
      current v1 的 complete terminal-win graph 为 227 states / 610 legal transitions /
      1 terminal winning state；最短 cost 16，有 2 条 raw 最短路径但只有 1 个对象签名，
      且所有胜路都必须按顺序进入四个声明的对象里程碑位姿。

  - claim_id: fixed_pl_handle_switch_necessity
    claim: >-
      所有胜路第一次进入首个位姿均为 push:right，后续三次首次进入分别只能为
      pull:right、pull:right、pull:down；第一次跨越固定 P/L 后，旧左侧接触面即使可达也不能继续 push:right。
      只移除 P/L 的反事实完整图把最短解缩为 cost 7 的四次全 push 对象签名。

  - claim_id: left_tooth_order_necessity
    claim: >-
      只移除左墙齿 [8,6] 的反事实完整图把最短解缩为 cost 10，
      对象顺序改为 push:right、pull:down、pull:right、pull:right；因此该墙齿机械上阻止提前正交下牵。

  - claim_id: right_tooth_lower_toe_handle_necessity
    claim: >-
      只移除右墙齿 [10,6] 的反事实完整图把最短解缩为 cost 12；
      最短路终手从上臂格直接 pull:down，而不再需要玩家站到低阶突出部下方牵引该突出部。

  - claim_id: lower_toe_identity_necessity
    claim: >-
      删除 L 的低阶突出格 [6,5] 并同步删除其对应目标 [9,6] 后，异形退化成二格横条；
      反事实完整图最短解为 cost 11，且对象签名退化为四次纯 pull。

  - claim_id: overrun_reversible
    claim: >-
      canonical 前 9 步后的正确列位姿再多 pull:right 一格仍合法；随后 11 个声明输入全部合法，
      并精确返回超调前的完整 runtime state。

  - claim_id: no_post_terminal_cleanup
    claim: canonical 最后一次 pull:down 当步达到唯一 terminal winning state，不需要后续整理。

