evidence_boundaries:
  - 完整图与里程碑支配只支持 current v1 的可达结构、终止胜态与解族，不产生难度、审美、可读性或 campaign placement 结论。
  - 四个反事实只支持各自指定 cell 删除后的机械变化，不把该变化外推为通用设计规则或审美必要性。
  - P/L 声明限于固定边界改变当前对象操纵模式、以及 remove-P/L 反事实中的对象签名变化；不评价其是否构成体验高潮。
  - 低阶突出格声明限于指定删格反事实，不声称任何 L 形都必须使用该构造。
  - 可逆性声明限于落盘 overrun trace 精确返回同一 runtime state，不声称所有错误动作都可逆。

