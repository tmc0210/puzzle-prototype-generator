      6,4;7,4;6,5 --push:right--> 7,4;8,4;7,5，
      7,4;8,4;7,5 --pull:right--> 8,4;9,4;8,5，
      8,4;9,4;8,5 --pull:right--> 9,4;10,4;9,5，
      9,4;10,4;9,5 --pull:down--> 9,5;10,5;9,6。
