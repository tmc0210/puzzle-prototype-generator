claims:
  - claim_id: exact_solvable
    claim: >-
      current v1 的 16 步 canonical 输入全部合法，依次执行 push:right、pull:right、pull:right、pull:down，
      并在第 16 步立即获胜。
    status: supported
    evidence_basis:
      - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/difficulty_revision_001/nodes/baseline_001/versions/v1/canonical_replay.json
      - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/difficulty_revision_001/nodes/baseline_001/versions/v1/diagnostics/canonical_replay_verification.json
      - >-
        canonical replay verification 对 16 步的 input、mode_before、events、player、sticky_cells 与 win 逐字段复算，
        all_steps_legal=true、every_step_matches_claimed_record=true、final_win=true；本次无写盘重跑为 pass。
    limits:
      - 只支持 packet 固定的 current v1 solve instance。

  - claim_id: solution_logic_unique
    claim: >-
      current v1 的 complete terminal-win graph 为 227 states / 610 legal transitions / 1 terminal winning state；
      最短 cost 16，有 2 条 raw 最短路径但只有 1 个对象签名，且所有胜路都必须按顺序进入四个声明的对象里程碑位姿。
    status: supported
    evidence_basis:
      - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/difficulty_revision_001/nodes/baseline_001/versions/v1/diagnostics/complete_graph_audit.json
      - >-
        complete graph 未触及 300000 state 上限；四次 avoiding search 均找不到绕开对应位姿的胜态，
        每个位姿仅有声明的 source pose、mode 与 direction 首次进入类。
      - solution_uniqueness_review.status=supported
    limits:
      - 一个 terminal winning state 本身不证明唯一逻辑类；本结论依赖完整 milestone-first-entry audit 与等价关系，而非只依赖胜态数量。

  - claim_id: fixed_pl_handle_switch_necessity
    claim: >-
      所有胜路第一次进入首个位姿均为 push:right，后续三次首次进入分别只能为
      pull:right、pull:right、pull:down；第一次跨越固定 P/L 后，旧左侧接触面即使可达也不能继续 push:right。
      只移除 P/L 的反事实完整图把最短解缩为 cost 7 的四次全 push 对象签名。
    status: supported
    evidence_basis:
      - prototypes/reality_anchor/README.md
      - prototypes/reality_anchor/mechanic.yml
      - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/difficulty_revision_001/nodes/baseline_001/versions/v1/diagnostics/complete_graph_audit.json
      - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/difficulty_revision_001/nodes/baseline_001/versions/v1/diagnostics/counterfactual_audit.json
      - >-
        current 图的第一里程碑首次进入仅为 push:right，第二里程碑首次进入仅为 pull:right；
        remove_pl 仅把 [5,1] P 与 [6,1] L 改为墙，解析后 push_pull_anchor_present=false，
        完整图为 577 states / 1683 transitions / 2 terminal wins，最短 cost 7，
        4 条最短 raw witness 的唯一签名均为 push:right、push:right、push:right、push:down。
    limits:
      - 反事实只支持这两个锚点格在当前顶墙内改为墙后的 exact layout，不支持其它 P/L 布局的通用结论。

  - claim_id: left_tooth_order_necessity
    claim: >-
      只移除左墙齿 [8,6] 的反事实完整图把最短解缩为 cost 10，
      对象顺序改为 push:right、pull:down、pull:right、pull:right；因此该墙齿机械上阻止提前正交下牵。
    status: supported
    evidence_basis:
      - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/difficulty_revision_001/nodes/baseline_001/versions/v1/diagnostics/complete_graph_audit.json
      - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/difficulty_revision_001/nodes/baseline_001/versions/v1/diagnostics/counterfactual_remove_left_tooth.txt
      - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/difficulty_revision_001/nodes/baseline_001/versions/v1/diagnostics/counterfactual_audit.json
      - >-
        mutation audit 确认唯一改动为 [8,6] #->.；反事实完整图 270 states / 758 transitions / 2 terminal wins，
        唯一最短 raw witness cost 10，声明的 pull:down 在两次水平 pull 之前发生。
    limits:
      - “阻止”只指该 exact 单格删除对照下 current v1 胜路顺序的机械差异，不外推为审美必要性或一般墙齿规则。

  - claim_id: right_tooth_lower_toe_handle_necessity
    claim: >-
      只移除右墙齿 [10,6] 的反事实完整图把最短解缩为 cost 12；
      最短路终手从上臂格直接 pull:down，而不再需要玩家站到低阶突出部下方牵引该突出部。
    status: supported
    evidence_basis:
      - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/difficulty_revision_001/nodes/baseline_001/versions/v1/diagnostics/canonical_replay_verification.json
      - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/difficulty_revision_001/nodes/baseline_001/versions/v1/diagnostics/counterfactual_remove_right_tooth.txt
      - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/difficulty_revision_001/nodes/baseline_001/versions/v1/diagnostics/counterfactual_audit.json
      - >-
        mutation audit 确认唯一改动为 [10,6] #->.；反事实完整图 270 states / 760 transitions / 3 terminal wins，
        7 条最短 raw witness 已完整枚举且 cost 12；其终手均由 player [10,5] 以 pull:down 作用于上臂 [10,4]。
        current canonical 终手则由 player [9,6] 牵引低阶突出格 [9,5]。
    limits:
      - 反事实的终手结论覆盖全部最短 witness，不声称其所有非最短胜路都必须采用同一终手接触格。

  - claim_id: lower_toe_identity_necessity
    claim: >-
      删除 L 的低阶突出格 [6,5] 并同步删除其对应目标 [9,6] 后，异形退化成二格横条；
      反事实完整图最短解为 cost 11，且对象签名退化为四次纯 pull。
    status: supported
    evidence_basis:
      - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/difficulty_revision_001/nodes/baseline_001/versions/v1/diagnostics/counterfactual_remove_lower_toe.txt
      - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/difficulty_revision_001/nodes/baseline_001/versions/v1/diagnostics/counterfactual_audit.json
      - >-
        mutation audit 确认仅有 [6,5] M->. 与 [9,6] G->. 两项耦合改动；解析结果 sticky_cell_count=2，
        完整图 333 states / 929 transitions / 3 terminal wins，唯一最短 witness cost 11，
        对象签名为 pull:right、pull:right、pull:right、pull:down。
    limits:
      - 该证据只支持“删低阶格并同步删对应目标”的耦合反事实，不能分离归因于对象删格还是目标删格，也不产生审美身份判断。

  - claim_id: overrun_reversible
    claim: >-
      canonical 前 9 步后的正确列位姿再多 pull:right 一格仍合法；随后 11 个声明输入全部合法，
      并精确返回超调前的完整 runtime state。
    status: supported
    evidence_basis:
