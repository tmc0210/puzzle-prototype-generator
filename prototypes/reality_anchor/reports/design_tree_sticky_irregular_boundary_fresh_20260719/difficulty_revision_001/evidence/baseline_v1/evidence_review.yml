      evidence_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/difficulty_revision_001/nodes/baseline_001/versions/v1/diagnostics/complete_graph_audit.json
  equivalence_evidence_basis:
    - >-
      complete_graph_audit.json 与本次无写盘重跑均报告 graph status=complete，
      227 个 reachable states、610 条 legal transitions、1 个 terminal winning state；
      实际状态数远低于预先声明的 300000 上限。
    - >-
      两条且仅两条最短 raw 胜路已完整枚举，cost 均为 16，且对象签名均为
      push:right、pull:right、pull:right、pull:down；差异只在首次从 L 的上格或下格左面接触及相应纯走位次序。
    - >-
      完整图分别删除四个目标 sticky 位姿后搜索，均不存在绕开该位姿的 terminal win；
