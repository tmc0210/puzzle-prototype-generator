        Ply:11,4|C:|M:9,4;10,4;9,5|PL:P:5,1;L:6,1|BS:B:1,1;S:1,2；本次无写盘重跑为 pass。
    limits:
      - 只支持该一次向右超调及落盘 return inputs，不声称其它超调或错误动作可逆。

  - claim_id: no_post_terminal_cleanup
    claim: canonical 最后一次 pull:down 当步达到唯一 terminal winning state，不需要后续整理。
