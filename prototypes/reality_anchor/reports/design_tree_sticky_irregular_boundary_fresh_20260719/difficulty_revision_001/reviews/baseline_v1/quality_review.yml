  candidate_id: RA_DIFFICULTY_BASELINE_L_KEYHOLE_V1
  exact_version: v1
  opening_read: >-
    熟练后期玩家开局即看见左侧预制三格 L 形黏块、右下同形三目标，以及目标竖腿下方由 (8,6) 与 (10,6) 两墙夹出的单格窄口。上方隔墙中的 P/L 把玩家起点与黏块所在侧分为推、拉两种操作世界；B/S 只把活动室明确置于黏世界。目标轮廓直接提示保持 L 形、先横向对准竖腿再从下方收口，题面没有 delayed reveal。
  player_actually_does: >-
    玩家先上走取得左侧施力位，把整个 L 形向右推一格；玩家随刚体跨入 P/L 的拉世界后，不再继续推，而是从上方绕到右侧，连续向右拉两格。此时 L 形竖腿位于 x=9，玩家再沿右侧与下侧通路换到竖腿下方，最后向下拉一格，把保持连通的 L 形整体送入三目标。规范回放中的十二次 walk 只完成换把与到达操作面，不作为挑战或回报计入。
  key_visible_changes:
    - >-
      replay step 2 将黏块从 {(6,4),(7,4),(6,5)} 整体平移到 {(7,4),(8,4),(7,5)}；玩家从 x=5 的 push 侧进入 x=6 的 pull 侧，随后 step 3 起 modeBefore 为 pull，形成可直接操作验证的换把关系。
    - >-
      replay steps 8-9 从右侧把 L 形依次拉到 {(8,4),(9,4),(8,5)} 与 {(9,4),(10,4),(9,5)}。墙 (8,6) 与 (10,6) 会分别阻断竖腿少拉或多拉后的向下整体移动；开放的上、右、下操作面又允许玩家回到相反侧修正横向位置，因此对位是可见且可逆的局部试探，而不是迟到才揭晓的死路。
    - >-
      replay step 16 将 L 形从 {(9,4),(10,4),(9,5)} 下拉到 {(9,5),(10,5),(9,6)}；上臂落在横向双目标，竖腿穿过单格窄口落在下目标，三格同时覆盖后立即胜利。
  visible_payoff: >-
    最后一拉集中兑现了开局可见的 L 形目标轮廓：竖腿进入仅容一格的窄口，上臂同时落入横向双目标，完整异形保持连通且全体被同一次刚体移动消费。回报来自形状、操作侧与窄口的共同作用，不来自事件标签或机械唯一性。
  ending_read: >-
    step 16 的下拉就是高潮与胜利，之后没有额外走位、复位或清理。虽然目标轮廓让正确对位相当直白，但这是一段完整、低噪声的异形换把与入槽收束；直白不构成同题可修的完成质量缺点。
