experience_core:
  experience_statement: 熟练玩家在墙口、墙边或锚点边界附近真实腾挪一块小型异形黏块。异形的偏置近端既是当前施力面， 也是后续需要保存、转换或恢复的操作资源；远端突臂、缺口或错位轮廓则随同一刚体运动持续接触、避让或扫带边界责任对象。 玩家在每次有意义移动后重新读取完整占格、可用操作面和回返状态，必要时借 P/L 改变同一几何接触的推拉关系， 最终让具体二维拓扑得到规整替代物无法保留的合法动作、恢复路径与动后状态。
  player_action: 玩家比较完整异形的多个接触面与移动方向，在实际推拉中取得、保存、转换或恢复操作面，管理哪些移动可回返、 哪些移动会改变后续边界关系，并让近端操作与远端作用在同一紧凑因果链中持续耦合。
  visible_payoff: 关键动作后，玩家此前维护的操作关系与远端边界责任同画面兑现：异形恢复或获得所需把手， 同时使墙口通行、锚点位置、材料状态、对象位置或目标覆盖发生集中变化；随后尽快结束。
  identity_conditions:
    - 核心操作时必须存在一块连通小异形；其具体二维拓扑至少形成两个不重合的职责区域：近端负责玩家施力或后续把手，远端负责边界接触、避让或扫带。
    - 近端与远端职责必须由同一刚体动作或紧邻且不可拆的操作链耦合；若拆成两个独立对象或两个退休子题，作品身份不成立。
    - 墙、B/S 或 P/L 边界必须对异形的合法动作、操作位、推拉语义、回返性或动后状态承担可验证责任。
    - 玩家必须先读取完整占格集合的后继位置，再亲自选择操作面、方向和时机执行关键推拉；不能只执行显然唯一动作或观看强制结算。
    - 若使用 P/L，其作用必须有机改变同一异形的施力侧、把手生命周期、可逆性或远端边界作用；P/L 本体不得成为与异形割裂的主要子题。
    - 关键差异必须被当前关卡消费，支持对象不得在异形关系结束后另起主要任务；高潮后尽快结束。
    - 不同节点可以使用不同异形、边界与局部结构，但都必须保持“同一异形的近端操作关系与远端边界作用持续耦合”的玩家关系。
