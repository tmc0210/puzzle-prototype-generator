allowed_mechanisms:
  - 小型异形黏块刚体移动与墙或棋盘边界阻挡
  - 黏块拼接与切分
  - B/S 锚点边界及其移动
  - 固定或可移动 P/L 锚点，只要它真实改变异形的施力侧、操作面、可逆性或恢复路径
  - 推拉锚点自身被推动或拉动，但不得取代异形成为主要体验核心
  - 玩家前序内的基本推拉、力链与目标覆盖
