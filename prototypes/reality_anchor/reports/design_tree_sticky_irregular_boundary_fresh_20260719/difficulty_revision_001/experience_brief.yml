human_difficulty_correction:
  feedback_refs:
    - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/human_feedback_difficulty_001.yml
    - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/human_feedback_difficulty_002.yml
  preserved:
    - Studio 流程、原体验核心方向与设计树亲缘方法仍成立。
    - 异形黏块在墙口、墙边和锚点边界的可动性仍是作品主角。
    - baseline、construct_prefix 与 apply_suffix 仍只描述玩家和同一核心关系的不同生长方式，不预设必须各做一个。
  corrected_reading: >-
    有效难度不等于多加一层延迟推演。熟练玩家在紧凑空间中真实腾挪异形、取得并保存或恢复操作面、
    管理可逆与承诺状态，以及让异形跨越 P/L 推拉关系完成同一几何任务，都可以形成 3—5 的玩家负担。
    关键是这些操作持续改变玩家随后怎样接触、移动和回收同一异形，而不是把一个答案藏到更多步之后。
  growth_correction: >-
    子节点可以重组地图与机制，也不要求形式上保留同一锚点；但父节点中已经有意义的操作维度必须继续存活、
    被重新解释或由不更低的同核心操作关系替代。若删除 P/L、回返管理或多面腾挪后只剩更直白的形状二择，
    即使文档上新增了前序或后继，也不构成合格生长。

prototype_context:
  confirmed_rules:
    - P/L 锚点把棋盘分成推世界与拉世界；没有 P/L 时全图为推世界。
    - B/S 锚点把棋盘分成箱世界与黏世界；没有 B/S 时全图为箱世界，关卡作者不能直接放置独立 M。
    - 两类锚点均为可移动的 1x2 或 2x1 刚体，只平移不旋转；同类型每关最多一个。
    - 推与拉都对一个物体实例施力，力可沿运动方向传递；玩家与受力闭包同时平移。
    - 黏块按四邻接组成刚体；相邻黏格自动合并，跨入箱世界的黏格变为独立箱子，剩余黏格按连通块分裂。
    - 任一刚体的任一部分被墙、棋盘边界或不可移动结构阻挡时，整个动作失败且状态不变。
  win_condition: >-
    每步移动、箱黏归一化与黏块合并全部结算后，所有目标必须由箱子、黏块格或任一锚点格覆盖；玩家覆盖目标不计胜利。
  object_and_event_semantics:
    - sticky_block 的可见身份来自当前连通形状；整个连通块作为一个刚体受力和移动。
    - push_object 与 pull_object 只陈述输入时的施力方式；不自动证明该操作具有玩家价值。
    - move_sticky_rigid 只证明黏块刚体发生移动；形状是否承担核心责任仍需近邻反事实和玩家侧重读。
    - anchor_boundary_shift 只证明锚点移动；P/L 或 B/S 是否改变异形的操作关系仍需由 exact 关卡证明。
    - sticky_merge、sticky_split、box_to_sticky 与 sticky_to_box 只陈述结算事件，不能替代作品身份或难度。
  allowed_mechanisms:
    - 小型异形黏块刚体移动与墙或棋盘边界阻挡
    - 黏块拼接与切分
    - B/S 锚点边界及其移动
    - 固定或可移动 P/L 锚点，只要它真实改变异形的施力侧、操作面、可逆性或恢复路径
    - 推拉锚点自身被推动或拉动，但不得取代异形成为主要体验核心
    - 玩家前序内的基本推拉、力链与目标覆盖
  tool_boundary:
    - runtime replay、solver、graph、agency、layout analyzer 与反事实工具只验证规则事实、可解性、解族、旁路、事件和对象参与。
    - 状态数、SCC、commitment 数、最短步数与 solver 搜索量不直接表示玩家难度。
    - task-local lexicon 与全局 lexicon 只提供可改造的局部词汇，不评价完整关卡、难度、审美或 family 前途。
    - PuzzleScript exporter、curated miner、seed factories 与 candidate generator 在 Reality Anchor v0 中不可用。

player_context:
  basic_sokoban_experience_assumed: true
  stage: late_game
  player_prior:
    - 玩家拥有全图视野、正常几何直觉和稳定操作能力。
    - 玩家已充分熟悉规整小黏块组的可达性、可动性和基本腾挪。
    - 玩家已充分熟悉黏块拼接、切分及其状态变化。
    - 玩家已充分熟悉 B/S 锚点、固定或可移动 P/L 锚点及各类基础推拉、绕位与力链技巧。
    - 玩家会迅速剪除一眼可见的形状二择、显然方向、基本站位和短死路；这些不计为后期谜题难度。
    - 玩家不会因普通走路、执行唯一动作、规则回忆或输入精度而获得有效挑战。
  prerequisite_mechanisms:
    - push_object
    - pull_object
    - move_sticky_rigid
    - sticky_merge
    - sticky_split
    - box_to_sticky
    - sticky_to_box
    - anchor_boundary_shift:box_sticky
    - anchor_boundary_shift:push_pull
  known_prior_level_refs: []
  known_prior_level_note: >-
    本简报不假定某个归档 exact 已被玩家玩过；归档候选只用于人类校准与作品防撞，不作为规则教学前序或设计素材。

experience_seed:
  human_seed: >-
    围绕 L、T、Z/S、阶梯或其它小型异形黏块，研究其在墙口、墙边与锚点边界附近的可动性、动作可逆性和动作后状态；
    不同节点可使用不同异形，但核心思考和高潮始终由具体占格拓扑与边界关系主导。
  designer_interpretation: >-
    同一异形刚体的不同部位在一段紧凑操作中共同承担空间责任：近端轮廓决定玩家当前从哪里、以推还是拉施力，
    以及下一次还能否重新取得把手；远端突臂、缺口或错位占格同时接触、避让或扫带墙与锚点边界。
    玩家需要在实际腾挪中维护这两端的关系，可能暂时放弃一个操作面再恢复它，或借 P/L 改变同一接触的推拉语义，
    最终让完整异形获得规整替代物无法保留的合法运动、回返关系和动后状态。

