    - 明确异形真实腾挪、操作面生命周期、可逆状态管理与 P/L 有机结合均可承担难度
    - 明确子节点不得靠删除父节点已有的有意义操作维度取得表面生长
    - 保持三份指定归档样本只作档位角色与组内差异校准
