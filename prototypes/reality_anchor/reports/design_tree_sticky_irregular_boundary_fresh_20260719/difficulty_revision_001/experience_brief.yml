experience_core:
  experience_statement: >-
    熟练玩家在墙口、墙边或锚点边界附近真实腾挪一块小型异形黏块。异形的偏置近端既是当前施力面，
    也是后续需要保存、转换或恢复的操作资源；远端突臂、缺口或错位轮廓则随同一刚体运动持续接触、避让或扫带边界责任对象。
    玩家在每次有意义移动后重新读取完整占格、可用操作面和回返状态，必要时借 P/L 改变同一几何接触的推拉关系，
    最终让具体二维拓扑得到规整替代物无法保留的合法动作、恢复路径与动后状态。
  visible_setup: >-
    开局或核心阶段清楚展示一块小型连通异形、至少一个负责的墙或锚点边界，以及当前可用操作面与下一状态所需操作面之间的矛盾；
    玩家可以用全图信息理解问题，不靠隐藏规则或误触试错。
  player_action: >-
    玩家比较完整异形的多个接触面与移动方向，在实际推拉中取得、保存、转换或恢复操作面，管理哪些移动可回返、
    哪些移动会改变后续边界关系，并让近端操作与远端作用在同一紧凑因果链中持续耦合。
  visible_payoff: >-
    关键动作后，玩家此前维护的操作关系与远端边界责任同画面兑现：异形恢复或获得所需把手，
    同时使墙口通行、锚点位置、材料状态、对象位置或目标覆盖发生集中变化；随后尽快结束。
  why_level_exists: >-
    它把黏块刚体规则推进为真正的二维操控：玩家不只是识别正确轮廓，而是把异形不同部位当作会随移动变化的操作资源与作用端，
    在可逆和承诺状态之间管理完整形状，必要时利用 P/L 让同一几何关系从推转拉或从拉转推。
  core_boundary:
    central_objects:
      - 核心动作时保持连通的小型异形黏块及其具体二维拓扑
      - 异形近端的偏置操作面、肩窝、缺口或等价施力关系及其保存/恢复状态
      - 异形远端突臂或错位轮廓在同一操作链中的边界接触范围
      - 实际改变合法动作、操作位、回返性或动后状态的墙口、墙边、B/S 或 P/L 边界
    supporting_objects:
      - 只提供必要站位、反馈或目标收束的墙、空地、箱子与目标
      - 若不改变异形操作关系、只提供标签或一次按钮效果的锚点

work_identity:
  conditions:
    - >-
      核心操作时必须存在一块连通小异形；其具体二维拓扑至少形成两个不重合的职责区域：近端负责玩家施力或后续把手，远端负责边界接触、避让或扫带。
    - >-
      近端与远端职责必须由同一刚体动作或紧邻且不可拆的操作链耦合；若拆成两个独立对象或两个退休子题，作品身份不成立。
    - >-
      墙、B/S 或 P/L 边界必须对异形的合法动作、操作位、推拉语义、回返性或动后状态承担可验证责任。
    - >-
      玩家必须先读取完整占格集合的后继位置，再亲自选择操作面、方向和时机执行关键推拉；不能只执行显然唯一动作或观看强制结算。
    - >-
      若使用 P/L，其作用必须有机改变同一异形的施力侧、把手生命周期、可逆性或远端边界作用；P/L 本体不得成为与异形割裂的主要子题。
    - >-
      关键差异必须被当前关卡消费，支持对象不得在异形关系结束后另起主要任务；高潮后尽快结束。
    - >-
      不同节点可以使用不同异形、边界与局部结构，但都必须保持“同一异形的近端操作关系与远端边界作用持续耦合”的玩家关系。
  counterfactuals:
    - >-
      把异形替换为等数量直条、矩形或其它规整黏块后，若相同操作面生命周期、边界作用和动后状态仍成立，则具体拓扑没有承担责任。
    - >-
      删去关键突臂、补平缺口或改变近邻轮廓后，至少应失去远端接触、合法通行、操作位、回返或恢复路径之一。
    - >-
      移走负责的墙或锚点边界、预先把边界对象移到结果位置后，若玩家仍管理同一套操作面与状态，则边界没有结构责任。
    - >-
      把近端把手与远端作用端拆成两个可独立操作对象后，若玩家仍做同一判断，则刚体耦合不成立。
    - >-
      若 P/L 可删除、固定在结果侧或替换成普通走道而不改变异形的操纵与回返，则 P/L 只是机制信号，不属于作品关系。
    - >-
      若构造、拼接、锚点搬运或腾挪完成后全部退休，剩余异形高潮可独立解决，则新增流程是拼接子题。
  difficulty_preservation_conditions:
    - 父节点已有的操作面管理、回返关系、推拉转换或同一对象多次责任，必须在子节点中继续被玩家实际承担或由不更低的同核心关系替代。
    - 子节点不能把父节点的真实腾挪压缩成一次形状二择，再用延迟失败或更多执行步伪装生长。
    - construct_prefix 必须让构造选择与后续操作面/可逆状态相互约束，不能让构造完成后只剩强制使用。
    - apply_suffix 必须消费核心动后状态，并保留此前有意义的操纵维度；后继不能以删除 P/L 或回返空间来换取单一路线。
  archive_collision_boundaries:
    - 不复刻 RA_CAND_0025 的主动 L 构造与反复活塞完整关系。
    - 不复刻 RA_CAND_0029 的两阶段不同活塞推动 B/S 并归位完整关系。
    - 不把 RA_CAND_0010、RA_CAND_0015 或 RA_CAND_0011 的 P/L 布局、路径或目标结构移植为本树设计。

difficulty_model:
  first_principle: >-
    玩家难度来自熟练玩家在已知规则和全图信息下，仍需持续维护、更新或反转的操作关系；
    它衡量玩家实际思考什么，不衡量工具枚举多少状态或答案执行多少步。
  valid_sources:
    irregular_maneuvering: >-
      异形多个占格在紧凑空间中共同限制移动；玩家必须连续选择施力面与顺序，避免失去下一次接触或恢复路径。
    handle_lifecycle: >-
      玩家需要取得、保存、主动放弃再恢复某个操作面；此前移动如何改变后续把手始终可感且仍在因果链中。
    reversibility_management: >-
      玩家区分局部可逆腾挪与会改变完整形状/边界关系的承诺，可能先离开看似完成的状态再恢复到更有用的状态。
    organic_push_pull: >-
      P/L 真实改变同一异形从哪个方向能被推或拉、玩家能否进入旧格、以及远端轮廓怎样扫带边界；固定或可移动 P/L 均可。
    causal_projection: >-
      玩家预见早期动作留下的形状、操作面或边界状态怎样被后续消费；这是可选来源，不要求所有节点统一增加更多推演层。
    compact_counterintuition: >-
      小空间中的反直觉状态反转可以在短解中形成高难，只要玩家必须主动撤销表面进展或恢复操作可能性，而非执行提示明确的唯一动作。
  non_sources:
    - 机械不可替代性、事件必经、唯一解、完整图或 solver 复杂度
    - 普通走路、路线税、输入精度、规则记忆与无判断执行长度
    - 一眼可见的单次二择、把失败反馈机械地延迟几步或堆叠反馈迟缓 deadend
    - 隐藏信息、视觉噪声、无责任大地图、机制数量与事件覆盖
    - P/L、B/S 或异形只出现但不改变玩家操纵关系的 affordance 信号
  sustained_judgment_definition: >-
    “持续”不要求长解或多层预判；它要求第一次正确对象操作之后，玩家仍需依据更新后的异形位置、操作面、推拉侧或可逆状态作有意义判断。
    若第一次选择已经决定成败，之后只剩走位和唯一兑现，则不是本轮 3—5 所需的持续负担。
  scale:
    difficulty_3: >-
      清楚、紧凑但不止一次显然二择。熟练玩家需在同一异形上完成一段真实操作关系，例如保存/恢复把手、管理一次可逆状态，
      或让 P/L 与异形前后责任同时存活；局部动作可读，但完整操纵不能被首个选择一次性解决。
    difficulty_4: >-
      至少一个早期看似合理或局部完成的状态需要被重新解释；玩家要协调异形多面腾挪、操作面生命周期、状态恢复或 P/L 推拉转换，
      并让这些维度共同决定后续边界作用。难点可以来自强洞见或紧凑高耦合，不要求更长路线。
    difficulty_5: >-
      多个仍可理解的异形状态或操作资源在紧凑空间中强耦合，玩家需跨越多次承诺维护可逆性、推拉侧与远端责任；
      任何高负担都必须服务同一异形核心，不靠噪声、机械试错或拼接子题。
  calibration_boundary: >-
    以上档位是后续 Designer 的玩家侧目标和 reviewer 的独立判断背景，不是步数、分支数、SCC 或事件数门槛；
    exact 难度仍需由 fresh 玩家侧审查与人类试玩决定。

level_brief:
  baseline_packaging_intent: direct_but_sustained_realization
  expected_difficulty: 3
  tree_expected_difficulty_range: [3, 5]
  stage: late_game
  expected_scale: >-
    优先紧凑、小到中小型；空间应容纳异形真实腾挪、操作面转换与必要回返，不用大地图或多机制数量制造分量。
  expected_player_load: >-
    baseline 直接给予同一体验核心，但不能只让玩家做一次操作面二择。熟练玩家需要在完整异形上持续维护至少一种活的操作关系：
    操作面保存/恢复、可逆状态管理、异形多面腾挪或与 P/L 有机推拉；第一次正确对象动作之后仍有新的玩家判断。
  baseline_setup_policy:
    - 可以直接给予成形异形，不要求 baseline 主动构造形状。
    - 题面应清楚展示异形、负责边界和当前操作矛盾，不靠隐藏信息制造难度。
    - 可以使用固定或可移动 P/L；若使用，它必须改变异形的真实操纵关系，而非只标注终手推拉模式。
    - 允许为异形多面腾挪与把手恢复保留必要空间；不把所有走位压成唯一通道，也不把空地本身当难度。
    - 关键回报后只保留必要的可见兑现与短收束，不追加清理劳动。
  growth_load_policy:
    - 生长节点只增加 construct_prefix 或 apply_suffix 关系，但玩家侧有效操作维度不得低于父节点。
    - 子节点不必沿用父地图或同一机制；若移除父节点的 P/L、回返或多面腾挪，必须以同核心、可感且不更低的操作关系替代。
    - 新前序或后继必须让玩家更深入地操纵同一异形关系，不能只把正确答案提前构造或把失败延迟揭示。
    - 难度不要求随树机械递增，但子节点不能因关系生长而实际退回 1—2 的单次二择。
  non_goals:
    - 不在本 brief 中指定具体异形、朝向、目标数、坐标、动作串、房间尺寸或 structure family。
    - 不把可动锚点本身设为与异形割裂的主要谜题。
    - 不要求每个节点统一增加推演层、机制数、对象数或步骤数。
    - 不把证据完整、机械不可替代或 delayed reveal 当作难度补偿。

