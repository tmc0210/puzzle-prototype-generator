mechanical_claims:
  - claim_id: exact_solvable
    claim: current v3 五步 canonical 全部合法并获胜。
  - claim_id: opening_two_faces_one_viable
    claim: >-
      complete opening 有 8-state initial SCC、2 个首次对象 commitments；上方下推为唯一 dead commitment，
      下方肩窝横推为唯一 viable commitment。
  - claim_id: canonical_remote_anchor_sweep
    claim: >-
      前四步把完整四格 T 向右对位并保留 pull 把手；第 5 步下拉同一 T，事件含 pull_object、force_chain:n2、
      anchor_boundary_shift:box_sticky 与 move_sticky_rigid，使 B/S 下移并由 B 覆盖目标，立即胜利。
  - claim_id: distal_right_arm_necessity
    claim: >-
      相对 current v3 只删除 T 的远端右臂后，同一五步仍全部合法，终手仍下拉剩余 L 形，
      但不含 force_chain 或 B/S shift，目标未覆盖且不胜。
  - claim_id: fixed_push_pull_role
    claim: >-
      current v3 所有胜路必经 fixed pull effect；可达图中 P/L 本体从不移动，且不存在绕过 fixed P/L effect 的胜路。
  - claim_id: solution_logic_unique
    claim: complete graph 为 19 states / 34 legal transitions / 1 winning state；两个 opening commitments 仅一个可胜。
  - claim_id: outline_trim_isomorphic
    claim: >-
      相对 frozen v2 只裁封闭纯墙外列后，按 (x,y)->(x-1,y) 平移，19 个状态、34 条 action/event-labeled edges
      与唯一 winning state 全部一一相同。
  - claim_id: no_post_sweep_cleanup
    claim: canonical 第 5 步远端扫带 B/S 后立即胜利，无后续清理。

