evidence_boundaries:
  - 完整图与 commitment 事实只支持 current v3 的可达/解族，不支持难度或质量。
  - 删远臂只支持该五步动作组中远端右臂的机械责任，不支持审美结论。
  - 裁边同构只支持机械等价；不直接产生 review 保留或玩家质量结论。
  - fixed P/L 只声明所有胜路中的 pull effect 必经且锚点不移动，不声明 P/L 是审美高潮。

