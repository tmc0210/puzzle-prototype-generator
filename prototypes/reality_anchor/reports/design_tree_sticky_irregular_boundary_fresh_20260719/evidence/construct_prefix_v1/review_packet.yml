evidence_boundaries:
  - complete graph 的一个 winning state 不能单独证明事件必经性；解族结论须结合 complete agency/SCC 与 exact replay。
  - 去墙齿反事实同时把该格变为可走地面；只核验同一 2x2 消费动作由 blocked 恢复为合法并胜利，不外推其他身份结论。
  - 删远端上臂反事实只核验该格对同一 canonical 输入触发 B/S 位移的机械责任，不评价审美、难度或树增长。
  - raw layout analysis 未提供 instance-level object participation；对象职责只按逐步 exact state、规则合同和隔离反事实核验。

