mechanical_claims:
  - claim_id: exact_solvable
    claim: current v2 八步 canonical 全部合法并获胜。
  - claim_id: active_s_construction
    claim: 第 4 步把两根横条主动合并为四格错位 S，之后从右侧取得把手。
  - claim_id: shared_consumer_divergence
    claim: >-
      错位 S 与规整 2x2 都能实际构造并到达同一右侧 consumer 操作位；S 的最终 left 合法并触发 force_chain/B-S shift 获胜，
      2x2 的同一次 left 因墙齿阻挡而原子失败、不胜。
  - claim_id: wall_tooth_responsibility
    claim: >-
      相对 current v2 只把墙齿 [3,2] 改为地面后，同一 2x2 七步路径终手恢复合法，触发同类 force_chain/B-S shift 并获胜。
  - claim_id: distal_upper_arm_necessity
    claim: >-
      相对 current v2 只删除 S 的远端上臂 [4,1] 后，canonical 八步仍合法且合并发生，但终手只移动黏块，
      不产生 force_chain/B-S shift 且不胜。
  - claim_id: solution_logic_unique
    claim: complete graph 为 133 states / 350 transitions / 1 win；initial region 4 commitments 仅 1 viable。
  - claim_id: outline_trim_isomorphic
    claim: >-
      相对 frozen v1 只裁封闭纯墙外列后，按 (x,y)->(x-1,y) 平移，133 个状态、350 条 action/event-labeled edges
      与唯一 winning state 全部一一相同。
  - claim_id: no_post_consumer_cleanup
    claim: canonical 第 8 步推动 S 与 B/S 后立即胜利，无后续清理。
