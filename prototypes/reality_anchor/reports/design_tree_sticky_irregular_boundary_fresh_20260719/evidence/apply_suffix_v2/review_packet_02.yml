evidence_boundaries:
  - 两个 winning states 不能单独证明等价；解族结论须结合两条实际胜利 replay、complete graph、对象终局和已提取的变体等价账户。
  - solution-family graph probe 只机械证明所有可达 2x2 状态均不可达胜态、两个胜态对象签名相同；玩家逻辑等价仍须结合两条实际 replay。
  - win_at_core 反事实移动一个目标位置，改变两个 ASCII 格；只支持两种构造都能完成同一 B/S 左移并满足该 core 胜利条件。
  - 删除下端目标反事实只支持该目标对当前 exact 排除 2x2 完成态的机械责任，不评价它是否自然、优雅或像补锁。
  - 远趾反事实使用忠实 state injection，因为 ASCII 无法编码 S-on-goal；probe 必须证明 goals 与 step-7 source 对齐且唯一删除 [4,4]。
  - layout analysis 未提供 instance-level object participation；对象职责只按逐步 exact state、规则合同与隔离反事实核验。

