solution_uniqueness_claim_extracted:
  result: equivalent_variants_only
  search_scope: complete
  search_budget: maxStates=300000
  known_raw_winning_variants:
    - cost 9，末拍从右上把手上推同一 Z，玩家终位 [6,3]。
    - cost 11，core 后在同一可达区域换到另一把手，上推同一 Z，玩家终位 [5,4]。
  equivalence_account: >-
    两条胜路在 core 后对象状态相同，最终都上推同一完整 Z、移动同一 B/S，并得到完全相同的对象终局；
    只差玩家在同一可达区选择的下方接触点，不改变构造、对象职责、目标分配或不可逆因果顺序。

mechanical_claims:
  - claim_id: exact_solvable
    claim: 当前 v3 exact 的九步 canonical 输入全部合法并获胜。
  - claim_id: neutral_two_step_opening_commitments
    claim: >-
      正确 offset-Z 分支以 up,left 进入第一次对象承诺，错误 2x2 分支以 left,up 进入第一次对象承诺；
      两者第一步都只 walk，第二步才移动黏块。前者承诺态 forward closure 52 states / 2 wins，
      后者承诺态 forward closure 54 states / 0 wins。
  - claim_id: canonical_construct_core_suffix_chain
    claim: >-
      第 5 步形成四格错位 Z；第 8 步左推同一 Z 并触发 force_chain 与 B/S 左移，尚未胜；
      第 9 步上推同一 Z，再次触发 force_chain 与 B/S 上移并立即胜利。
  - claim_id: boundary_coverage_handoff_on_suffix
    claim: >-
      第 8 步后 S 占下端目标 [4,3]；第 9 步后 B 覆盖上端目标 [4,1]，
      同一 Z 的远趾由 [4,4] 上移到 [4,3] 接替 S，完成下端覆盖。
  - claim_id: square_same_core_but_no_win
    claim: >-
      规整 2x2 能完成同类 B/S 左移 core，并能沿十三步反击把 B/S 上推到上端；
      但最终下端目标只由玩家站住，不算覆盖，当前 exact 不胜。
  - claim_id: square_cannot_complete_current_exact
    claim: >-
      complete graph 为 176 states / 441 transitions / 2 wins；2x2 承诺态全部 54 个 forward reachable states 中
      没有胜态，因此当前 exact 无 2x2 胜利解族。
  - claim_id: lower_handoff_target_mechanical_responsibility
    claim: >-
      相对 current v3 只删除下端目标 [4,3] 后，同一 2x2 十三步反击全部合法并获胜；
      该目标对排除不做远趾覆盖交接的 2x2 结果承担机械责任。
  - claim_id: core_equivalence_under_core_win_condition
    claim: >-
      把上端目标移到第一次 B/S 左移后 B 所在的 [4,2] 并保留下端目标时，
      Z 的八步 core 与 2x2 的五步 core 都合法并在同类 B/S 左移后获胜。
  - claim_id: distal_toe_mechanical_necessity
    claim: >-
      从 canonical 第 8 步后的 current-v3 状态只删除远趾 [4,4]，保留 goals、player、近端上推面与 B/S；
      输入 up 合法并移动剩余黏块，但不产生 force_chain 或 anchor shift，B/S 不动且不胜。
  - claim_id: solution_logic_family_unique
    claim: >-
      complete graph 有 2 个 winning states、1 个 winning object signature，初始 4 个 commitments 仅 1 个可胜；
      两条实际胜利 replay 共享同一 offset-Z 构造、core 后对象状态、suffix 对象职责和对象终局。
  - claim_id: no_post_suffix_cleanup
    claim: canonical 第 9 步同拍完成 B/S 上移与远趾补位并立即进入胜态，没有后续清理。

