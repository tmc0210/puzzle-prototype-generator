forbidden_sources:
  - designer 的 node_brief、design_reading、submission 与审美/难度自评；solution_uniqueness 仅作为本包明确提取声明的定位来源
  - experience_brief、human_brief、archive calibration、design_tree、parent、growth_relation 与玩家质量 review
  - task-local explorer 语料、旧 exact、旧 evidence/review、designer action、当前对话与 Controller 审美解释

evidence_boundaries:
  - winning states 数与对象签名不能单独证明玩家逻辑等价；须结合两条实际胜利 replay 与 complete graph。
  - 删除下端目标只支持该目标的机械排旁路责任，不评价目标是否自然或优雅。
  - win-at-core 反事实移动一个目标，改变两个 ASCII 格，只支持两种构造能完成同类 core 并满足该反事实胜利条件。
  - 远趾反事实使用 current-v3 canonical 第 8 步后的结构化状态注入；须核验 source state、goals 和唯一删除格。
  - 工具事实不支持审美、难度、包装或树关系判断。

