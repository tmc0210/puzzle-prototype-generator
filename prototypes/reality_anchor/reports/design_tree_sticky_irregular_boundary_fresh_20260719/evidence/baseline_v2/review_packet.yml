    - 完整图只有一个 winning state；初始可逆走位排列与回退不改变对象职责、目标分配或因果顺序。
  equivalence_account: >-
    完整图与 agency graph 记录两个 opening commitment，其中只有肩窝横推进入 win-reaching region；
    所有胜路保持“横推完整 T 对准远臂列，再下拉 T 触发 B/S”的对象职责和因果顺序。

mechanical_claims:
  - claim_id: exact_solvable
    claim: 当前 exact layout 可由非空输入 down,right,right,right,down 合法通关。
  - claim_id: canonical_event_chain
    claim: >-
      终手合法，包含 pull_object:sticky#1、force_chain:n2、anchor_boundary_shift:box_sticky 与 move_sticky_rigid，
      终态由 B 端覆盖唯一目标而胜利。
  - claim_id: solution_logic_class_unique
    claim: >-
      在完整 19-state / 34-transition 图中只有一个 winning state；agency graph 的两个 opening commitment
      只有一个可胜，且所有胜路只留下同一个玩家逻辑类。
  - claim_id: no_direct_anchor_or_upper_face_win_bypass
    claim: >-
      完整图中唯一另一 opening commitment 是从上方操作面下推 T，进入 dead region；不存在不经 T 横推再下拉的胜利 commitment。
  - claim_id: remote_arm_mechanical_necessity
    claim: >-
      删除 T 的远端右臂成为近邻 L 形后，同一五步仍全部合法，但终手不含 force_chain 或 B/S 位移，且不胜利。
  - claim_id: boundary_alignment_mechanical_necessity
    claim: >-
      保持完整 T、只把 B/S 横移一格后，同一五步仍全部合法，但终手不含 force_chain 或 B/S 位移，且不胜利。
  - claim_id: connected_irregular_body_participation
    claim: >-
      当前 exact 中四格 T 在第 4、5 步作为同一 connected sticky rigid body 移动；第 5 步由其远端占格把 B/S 纳入力链。

