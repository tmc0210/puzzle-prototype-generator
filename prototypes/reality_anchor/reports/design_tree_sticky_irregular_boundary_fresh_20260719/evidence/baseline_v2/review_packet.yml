  - experience_brief、archive_calibration、design archive 与人类审美评语
  - task-local explorer 语料及其 runs
  - 任何旧 report、旧 exact、旧 review、designer action、当前设计对话或 Controller 审美解释

evidence_boundaries:
  - complete graph 只有一个 winning state 不能单独证明每条路径都含某事件；事件链另由 exact replay 和 agency commitment 事实支持。
  - 反事实只核验作品身份中的机械关系，不评价审美、难度或是否值得冻结。
  - raw layout analysis 未提供 instance-level object participation；对象参与仅按逐步 exact state 与事件核验，证据不足处应写 unknown。

