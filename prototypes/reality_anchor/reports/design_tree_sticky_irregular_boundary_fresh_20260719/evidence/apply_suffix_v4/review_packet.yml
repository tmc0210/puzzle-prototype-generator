  - claim_id: square_cannot_complete_current_exact
    claim: complete graph 176/441/2；2x2 commitment 的 54-state forward closure 为 0 wins。
  - claim_id: lower_target_responsibility
    claim: 相对 v4 只删除下端目标 [1,3] 后，同一 2x2 十三步路线全部合法并获胜。
  - claim_id: core_equivalence_counterfactual
    claim: 把上端目标移到 core 后 B 所在 [1,2] 时，Z 八步 core 与 2x2 五步 core 都合法并获胜。
  - claim_id: distal_toe_necessity
    claim: 从 v4 canonical 第8步状态只删除远趾 [1,4] 后，up 合法但无 force_chain/anchor shift，B/S 不动且不胜。
  - claim_id: solution_logic_family_unique
    claim: complete graph 有2 wins/1 object signature，4 commitments 仅1 viable；两条胜利 replay 同属 offset-Z handoff 逻辑类。
  - claim_id: outline_trim_isomorphic
    claim: >-
      相对 v3 只裁纯墙外列后，按 (x,y)->(x-3,y) 平移，176 states、441 action/event-labeled edges 与2个胜态全部一一相同。
  - claim_id: no_post_suffix_cleanup
    claim: canonical 第9步同拍完成 B/S 上移与远趾补位并立即胜利。
