review_attempt_id: RA_QUALITY_BASELINE_V3_001
prototype_id: reality_anchor
review_target: baseline
prototype_rules:
  confirmed_rules:
    - P/L 锚点把棋盘分成推世界与拉世界；P 与 L 是同一可移动刚体的两端。
    - B/S 锚点把棋盘分成箱世界与黏世界；B 与 S 是同一可移动刚体的两端。
    - 推与拉都对一个物体实例施力，力可沿运动方向传递；玩家与受力闭包同时平移。
    - 黏块按四邻接组成刚体，整个连通块原子移动；任一格受阻则动作失败且状态不变。
  win_condition: 全部目标必须由箱子、黏块格或锚点格覆盖；玩家站在目标上不计胜利。
  player_prior:
    - 玩家已熟悉规整黏块可动性、拼接切分、B/S 与 P/L 锚点、基础推拉和腾挪。
    - 玩家会迅速剪除显然站位和短死路；这些不计为谜题价值。
fresh_review_firewall:
  - Stage A 只读取规则、自主归档校准、actual layout 与以下非空 mechanical replay。
  - 禁止读取体验简报、design_tree、旧 exact/review、Designer 说明、hard review、redundant workflow、对话或修改说明。
  - Stage A verdict 写定后才可读取 Stage B coach context。
