experience_core:
  experience_statement: >-
    熟练玩家面对紧邻墙口、墙边或锚点边界的小型异形黏块，从偏置操作面主动施力，让同一刚体的近端保留操作关系，
    远端突臂同时接触、避让或扫带边界对象；由具体轮廓得到规整替代物不能保留的动作与动后状态。
  player_action: 玩家比较操作面和方向，预见完整占格后继位置，再亲自推拉整块异形，让近端操作与远端边界作用耦合。
  visible_payoff: 关键动作后近端与远端职责同画面兑现，边界对象位置或目标覆盖立即变化，随后尽快结束。
  identity_conditions:
    - 小型连通异形至少有近端操作与远端边界作用两个不重合职责区域。
    - 两种职责由同一刚体动作或不可拆动作组耦合。
    - 墙或锚点边界对合法动作、操作位或动后状态承担结构责任。
    - 玩家主动读取完整占格并选择操作面、方向和时机。
    - 差异立即被当前关卡消费，高潮后没有独立清理子题。
