independent_reading:
  review_target: baseline_root
  node_id: baseline_001
  candidate_id: RA_STICKY_IRREGULAR_BASELINE_001
  exact_version: v3
  opening_read: >-
    熟练玩家开局会看到一个极紧凑的两段动作装置：上沿横置的 P/L 给出左右推拉分界，
    T 形黏块横跨分界，下方伸出一格作为操作面；右侧 B/S 紧贴黏块，而目标就在 B 的正下方。
    墙体把注意力收束到“先把整个异形块推过分界，再让其轮廓带动锚点”这一条可读关系上。
  player_actually_does: >-
    玩家沿左下方的最短通路绕过墙角，站到 T 形黏块下伸格的左侧；先从推侧把整个刚体向右推一格，
    自己随之进入拉侧，再向下移动并把整个黏块向下拉。黏块右上臂在这次刚体下移中顶动 B/S，
    使 B/S 整体下移并由 B 覆盖目标。
  key_visible_changes:
    - T 形黏块第一次整体右移，从横跨 P/L 分界变为把玩家操作面与右侧 B/S 对齐。
    - 最后一次向下操作同时拉动整个异形黏块、形成 force chain，并把 B/S 整体压到下一行。
    - B 从目标正上方落到 G，动作完成当步立即胜利。
  visible_payoff: >-
    最后一步把此前对齐的异形轮廓一次性兑现：整块黏块下沉、右臂推动 B/S、B 落上目标同时发生，
    回报集中且能直接从棋盘读出。
  ending_read: >-
    B 覆盖唯一目标后立即结束，没有高潮后的回收、重复操作或清理劳动；P/L 的分界责任、
    黏块的刚体与轮廓责任、B/S 的位移责任都已在胜路中可感兑现。
  parent_delta_read: not_applicable
