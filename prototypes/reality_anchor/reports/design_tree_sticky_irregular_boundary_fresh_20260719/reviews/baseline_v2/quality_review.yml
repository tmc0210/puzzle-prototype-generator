  candidate_id: RA_STICKY_IRREGULAR_BASELINE_001
  exact_version: v2
  opening_read: >-
    玩家在一个很小的封闭题面中立即看见四格 T 形黏块：三格横臂下接一格短柄；
    它的右下方紧邻横向 B/S，B 的正下方就是唯一目标。墙体把玩家留在黏块左侧，
    同时给出从上方接近横臂和从下方接近短柄的两种读图入口；墙槽中的 P/L 则明确提示操作世界发生分区。
  player_actually_does: >-
    规范回放中，玩家选择下路，经过三次短走位来到 T 形短柄左侧，先把整块向右推一格；
    随后向下移动并拉动同一个黏块刚体。第二次施力使黏块横臂的右端向下顶住 S，
    通过力链把整枚 B/S 一并向下移动，让 B 覆盖目标。
  key_visible_changes:
    - >-
      第 4 步中，T 形黏块保持连通形状整体右移：横臂由 (4,3)-(6,3) 移到 (5,3)-(7,3)，
      短柄由 (5,4) 移到 (6,4)，右端由此来到 S 的正上方。
    - >-
      第 5 步中，玩家下移并把整个 T 形黏块下拉一格；黏块右端、S 与 B 形成同向力链，
      B/S 从第 4 行同步移到第 5 行，B 最终落在 (8,5) 的目标上。
  visible_payoff: >-
    最后一次下拉把“异形黏块整体移动”“横臂远端施力”和“锚点边界整体下移”集中成一个清楚的同步变化；
    目标在 B 的落点立即被覆盖，玩家能直接把胜利归因于刚完成的对位与力链。
  ending_read: >-
    核心同步位移完成后立刻胜利，没有追加搬运、回程或清理劳动；五个输入中的两次对象操作形成紧凑的推后即拉收束。
  parent_delta_read: not_applicable
