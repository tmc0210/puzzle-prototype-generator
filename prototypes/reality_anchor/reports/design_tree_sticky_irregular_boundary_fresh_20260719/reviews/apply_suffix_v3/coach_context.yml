allowed_mechanisms:
  - 小型异形黏块刚体移动与墙或棋盘边界阻挡
  - 黏块拼接与切分
  - B/S 锚点边界及其移动
  - P/L 推拉区域及其移动，但只在有机改变或利用异形边界关系时使用
  - 推拉锚点自身被推动或拉动，但不得成为主要体验核心
  - 玩家前序内的基本推拉、力链与目标覆盖

stage_b_task: >-
  在 Stage A 已写定的前提下，判断 current v3 是否仍非拼接地增加 parent 的 apply_suffix、是否保持作品身份，
  以及它是否应替换同节点旧 delivery exact 并冻结。若存活，判断三节点设计树是否仍充分；只给一个最高优先教练决定。
