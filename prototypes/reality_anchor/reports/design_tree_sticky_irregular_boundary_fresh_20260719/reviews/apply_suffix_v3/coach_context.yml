experience_core:
  experience_statement: >-
    熟练玩家面对一个紧邻墙口、墙边或锚点边界的小型异形黏块，先把它读成因轮廓不齐而难以安全折向、贴边或回返的刚体；
    随后从偏置操作面主动施力，让完整异形在紧邻核心动作组中移动：近端维持施力或回返关系，远端突臂或错位占格同时接触、
    避让或扫带边界责任对象。玩家看到同一次刚体运动因具体形状而得到规整替代物无法保留的合法动作与动后状态。
  player_action: >-
    玩家比较异形不同操作面和移动方向，预见完整占格集合的去向，再亲自推或拉整块异形，利用近端操作关系让远端轮廓
    在边界处完成所需接触、避让或扫带，并读取动作是否保留回返或造成有意状态承诺。
  visible_payoff: >-
    关键动作后，异形近端与远端职责在同一画面兑现：它仍保留所需操作/回返关系，而远端边界接触使锚点、对象位置或
    目标覆盖集中变化；规整替代形或删去关键突臂会漏掉作用对象或留下不同的不可用状态。
  identity_conditions:
    - 核心动作时必须存在连通小型异形黏块，其二维拓扑至少形成近端操作与远端边界作用两个不重合职责区域。
    - 两种职责必须由同一刚体动作或紧邻且不可拆开的动作组耦合，不能拆成两个退休子题。
    - 墙口、墙边或锚点边界必须对合法动作、操作位、回返性或动后状态承担结构责任。
    - 玩家必须先读取完整占格集合的后继位置，再亲自选择操作面、方向和时机。
    - 关键动作差异必须立即可见并被当前关卡消费；高潮后尽快结束。
    - 所有树节点保持“近端操作关系与远端边界作用由同一异形刚体耦合”。

