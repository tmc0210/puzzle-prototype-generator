  exact_version: v3
  opening_read: 开局是一个极紧凑的两目标局面：竖直 B/S 锚点旁已有一组横向黏块，下方另有一组横向黏块；上方目标要求锚点最终上移，左侧目标又使锚点与黏块在收束时必须重新分配覆盖责任。熟练玩家能直接看出下方黏块需要先进入上方结构，但还需读清合并后不规则外形的两个受力接触面。
  player_actually_does: 玩家先把下方横向黏块向左推，再从下方向上推，使它与上方横向黏块合并成错位的四格刚体；随后绕到右侧，先向左推动该刚体并连带 B/S 锚点左移，再从下方向上推动同一刚体并连带锚点上移，以锚点覆盖上方目标、黏块覆盖下方目标完成关卡。
  key_visible_changes:
    - 两组横向黏块在一次上推后合并为错位的四格整体，局面从两个简单材料变成一个具有两个不同接触面的刚体。
    - 第一次推动合并体时，整个不规则形状左移并把 B/S 锚点带向左侧，下方目标先由 S 格覆盖。
    - 第二次推动同一合并体时，形状与锚点整体上移，B 格覆盖上方目标，而黏块接过刚被锚点让出的下方目标并立即触发胜利。
  visible_payoff: 合并所得的不规则四格形状不是事件展示；它的错位轮廓连续提供横向、纵向两个不同接触面，让玩家亲眼看到同一刚体先把锚点推左、再把锚点推上，并在最终一步完成目标覆盖交接。
  ending_read: 第二次推动既是形状的再次应用也是最终收束；两个目标当步同时获得正确覆盖，胜利后没有额外搬运、复位或清理。
  parent_delta_read: 冻结父节点同样先合并出错位四格黏块，但只用一次向左推动让锚点覆盖单个目标。当前版本重新布置两项目标与纵向空间，使第一次左推只完成中间交接；合并体仍留在可继续施力的位置，随后必须再以另一接触面上推锚点，最终由锚点和黏块分别覆盖两个目标。新增体验集中在同一形状的连续复用，没有另起一段无关流程。
