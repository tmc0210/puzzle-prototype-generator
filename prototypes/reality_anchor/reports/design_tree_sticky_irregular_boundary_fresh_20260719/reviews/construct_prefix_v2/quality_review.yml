  candidate_id: RA_STICKY_IRREGULAR_CONSTRUCT_PREFIX_001
  exact_version: v2
  opening_read: 玩家一眼看见目标、横置 B/S 与上方黏块横条挤在顶边，另一条黏块横条和玩家位于下方回旋空间；B/S 下方的墙使“合成什么形状才能向左推动整条顶边”成为开局的主要读图问题。
  player_actually_does: 玩家先把下方两格黏块只向右错开一格，再绕到其下方上推，使两条横条合成错位的四格刚体；随后绕到刚体右侧向左推，让上臂传力推动 B/S、下臂同时越过 B/S 下方的墙口。若不先错位而直接上推，会得到左移时下排撞墙的规整方块，因此这一步不是无需理解的合并动画。
  key_visible_changes:
    - 下方横条先横移一格，明确改变了将要形成的黏块轮廓。
    - 上推后两条横条合并为错位四格刚体，轮廓变化集中且可见。
    - 最后一推中四格刚体整体左移并经上臂传力，横置 B/S 同步左移一格。
  visible_payoff: 玩家亲手构造的错位刚体在一次左推中同时避开下方墙体并推动 B/S，使 B 格覆盖最左侧目标并立即获胜。
  ending_read: 合并后只有一次短绕位和一次决定性的整体推动；形状的用途在构造后立刻兑现，胜利紧随边界位移发生，没有高潮后清理。
  parent_delta_read: 冻结父版本直接给出预制的不规则四格黏块，玩家先横推它、再下拉并带动 B/S 向下覆盖目标；当前版本把黏块拆成两条横条，要求玩家先选择恰好一格的错位并合成可穿过墙口的刚体，再以一次左推带动 B/S。新增内容把玩家从使用现成轮廓改为先决定轮廓，且没有增加闲置对象或独立收尾。
