experience_core:
  experience_statement: >-
    熟练玩家从小型异形的偏置操作面主动施力，让同一刚体的近端保留操作关系、远端轮廓同时接触或避让墙/锚点边界，
    得到规整替代物无法保留的合法动作与动后状态。
  player_action: 玩家预见完整占格后继位置，选择操作面、方向和时机，亲自推拉异形并读取其动后承诺。
  visible_payoff: 近端与远端职责在同一画面兑现，边界对象或目标覆盖集中变化，高潮后立即收束。
  identity_conditions:
    - 连通小异形必须有近端操作与远端边界作用两个职责区域。
    - 两职责由同一刚体动作或不可拆动作组耦合。
    - 墙或锚点边界承担结构责任。
    - 玩家主动读取并选择，差异立即被本关消费。
