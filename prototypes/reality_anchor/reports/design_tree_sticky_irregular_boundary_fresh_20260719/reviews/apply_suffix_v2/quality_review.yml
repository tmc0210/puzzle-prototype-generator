independent_reading:
  review_target: growth_child
  node_id: apply_suffix_001
  candidate_id: RA_STICKY_IRREGULAR_APPLY_SUFFIX_001
  exact_version: v2
  opening_read: >-
    熟练后期玩家开局会看见一枚纵向 B/S 位于两个同列目标的右侧，上方与下方各有一条两格黏块；下方紧凑回廊提供把下条先横移、再从下方顶起的操作位。目标、锚点与两条黏块的相对位置直接把注意力集中在如何让两条材料形成能改变边界位置的同一刚体上。
  player_actually_does: >-
    玩家先把下方两格黏块左推一格，绕到其下方向上推，使它与上方两格黏块合并成错位四格刚体；随后绕到刚体右侧向左推，刚体经力链把纵向 B/S 左移到目标列，再从刚体下方向上推，使同一刚体继续把 B/S 上移。
  key_visible_changes:
    - 下方两格黏块先横移再上移，与上方两格黏块合并为错位四格连通形状。
    - 合并后的同一刚体向左移动，并通过力链让纵向 B/S 整体左移一列。
    - 同一刚体随后向上移动，再通过另一接触面让 B/S 整体上移一格。
    - 最后一次移动同时让 B 格覆盖上方目标、错位刚体的左下黏格覆盖下方目标，立即结算胜利。
  visible_payoff: >-
    错位四格形状不是视觉承诺或单次事件标签：它的不同伸出部分连续提供横向、纵向两次有效接触，第二次动作把锚点与黏块同时送上两个目标，形状责任与终局反馈集中在同一拍兑现。
  ending_read: >-
    第二次推动边界后立即胜利，没有目标已显然却仍需走位、拆分或搬运的高潮后清理；终局也保留了锚点和错位黏块共同盖目标的可读图像。
  parent_delta_read: >-
    冻结父节点同样先合并出错位四格黏块，但其收束是该刚体横向推动水平 B/S 一次后覆盖单一目标。当前版本把 B/S 与目标改成纵向关系：完成对应的横向推动后并不结束，同一错位形状还必须从另一操作侧继续向上推动 B/S，并由锚点和黏块共同完成两个目标；新增内容实际延长的是同一形状的可见用途，而不是另起一段对象已退休的子题。
