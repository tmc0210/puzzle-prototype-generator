coach_authority: tree_decision
experience_core:
  experience_statement: 熟练玩家面对一个紧邻墙口、墙边或锚点边界的小型异形黏块，先把它读成一个因轮廓不齐而难以安全折向、贴边或回返的刚体； 随后玩家从其偏置操作面主动施力，让完整异形在一个紧邻的核心动作组中移动：近端轮廓维持玩家的施力或回返关系， 远端突臂或错位占格同时接触、避让或扫带边界责任对象。玩家由此亲眼看到，同一次刚体运动因具体形状而得到规整替代物无法保留的合法动作和动后状态。
  player_action: 玩家比较异形不同操作面和移动方向，预见完整占格集合在下一步或紧邻短序列中的去向，再亲自推或拉整块异形， 利用近端取得的操作关系让远端轮廓在边界处完成所需接触、避让或扫带，并读取该动作是否保留回返或造成有意的状态承诺。
  visible_payoff: 关键动作后，异形的近端与远端职责在同一画面中兑现：它仍保留所需操作/回返关系，而远端边界接触使通路、锚点、材料状态、对象位置或目标覆盖发生集中可见变化； 近邻规整形或删去关键突臂的替代物会被阻挡、漏掉作用对象或留下不同的不可用状态。
  identity_conditions:
    - 核心动作时必须存在一块连通的小型异形黏块；其具体二维拓扑至少形成两个不重合的职责区域：近端负责玩家施力或保留操作关系，远端负责边界接触、避让或扫带。
    - 近端与远端职责必须由同一个刚体动作或紧邻且不可拆开的核心动作组耦合；若拆成两个独立对象或两个退休子题，作品身份不成立。
    - 墙口、墙边或锚点边界必须对该异形的合法动作、操作位、回返性或动后状态承担可验证的结构责任，而不是视觉布景。
    - 玩家必须先读取完整占格集合的后继位置，再亲自选择操作面、方向和时机执行关键推拉；不能只执行显然唯一动作或观看强制结算。
    - 关键动作后的差异必须立刻可见并被当前关卡消费；高潮后尽快结束，支持对象不得在异形关系结束后另起主要子题。
    - 不同树节点可以使用不同异形、不同边界和不同局部结构，但都必须保持“近端操作关系与远端边界作用由同一异形刚体耦合”这一玩家关系。
