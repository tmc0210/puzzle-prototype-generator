independent_reading:
  review_target: growth_child
  node_id: construct_prefix_001
  candidate_id: RA_STICKY_IRREGULAR_CONSTRUCT_PREFIX_001
  exact_version: v1
  opening_read: >-
    熟练玩家开局会看见左上目标、普通箱与横置 B/S 紧密排成一线，B/S 右侧已有一条两格黏块；下方小室里还有另一条两格黏块和可供绕位的紧凑空间。目标显然要求玩家让左上这条物体链向左移动，而下方黏块当前既没有与上方黏块连通，也没有直接接触锚点。
  player_actually_does: >-
    玩家先把下方两格黏块向右推一格，再从下方把它向上推，使它与上方两格黏块错位相接并合并成四格阶梯状刚体。随后玩家绕到该刚体的右下操作面向左推动；刚体整体左移时，其左上凸格顶住 B/S，力继续传到普通箱，将普通箱送上目标。
  key_visible_changes:
    - 下方两格黏块先横移，获得能够向上对接、同时保留右侧操作位的位置。
    - 向上推动后，两条规整黏块立即合并为上下错位的四格阶梯状刚体，棋盘上的主要形状关系清楚改变。
    - 最后一推同时左移阶梯状黏块、B/S 与普通箱，普通箱覆盖左上目标并立刻结算胜利。
  visible_payoff: >-
    玩家刚刚亲手形成的阶梯状黏块在最后一次输入中立即作为整体被推动：右下凸格提供施力面，左上凸格把力交给 B/S，再把普通箱送上目标。构造、异形刚体运动与锚点边界力链在同一个清楚动作中集中兑现。
  ending_read: >-
    普通箱覆盖唯一目标后立即结束；关键力链之后没有额外走位、复位或清理劳动。
  parent_delta_read: >-
    冻结父节点开局已经给出一块横三格、中央下凸的四格黏块，玩家先把它右推，再从下方拉动它与竖置 B/S 形成向下力链。当前版本改为两条彼此分离的横向两格黏块：玩家先定位并合并出上下错位的四格阶梯形，再从右侧把该形状与横置 B/S、普通箱一并向左推动。新增可感内容集中在合并前的定位与形状形成，最终收束的方向和操作面也随之改变。
