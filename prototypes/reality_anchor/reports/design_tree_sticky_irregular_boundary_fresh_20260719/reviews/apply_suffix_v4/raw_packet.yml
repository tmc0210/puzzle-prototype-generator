prototype_rules:
  confirmed_rules:
    - B/S 锚点把棋盘分成箱世界与黏世界；B/S 为可移动 1x2 刚体，只平移不旋转。
    - 推或拉对一个物体实例施力，力可沿运动方向传递；玩家与受力闭包同时平移。
    - 四邻接黏块自动合并为刚体；整个刚体任一格受阻则动作原子失败。
  win_condition: 全部目标必须由箱、黏块格或锚点格覆盖；玩家覆盖不计胜利。
  player_prior:
    - 玩家已熟悉规整黏块可动性、拼接切分、B/S/P-L 锚点与基础推拉腾挪。
    - 玩家会快速剪除基本站位和短死路。
fresh_review_firewall:
  - Stage A 只读规则、自主归档校准、以下 actual parent/candidate layouts 与非空 mechanical replays。
  - 禁止体验简报、design_tree、旧 exact/review、Designer 说明、hard review、redundant workflow、对话或修改说明。
  - Stage A verdict 写定后才可读取 Stage B coach context。
