experience_core:
  experience_statement: >-
    熟练玩家从小型异形的偏置操作面主动施力，让同一刚体的近端保留操作/回返关系、远端轮廓同时接触或扫带墙/锚点边界，
    得到规整替代物无法保留的合法动作与动后状态。
  player_action: 玩家预见完整占格后继位置，比较操作面与方向，亲自推拉异形并读取其状态承诺。
  visible_payoff: 近端与远端职责同画面兑现，锚点位置与目标覆盖集中变化，高潮后立即胜利。
  identity_conditions:
    - 连通小异形具有近端操作与远端边界作用两个职责区域。
    - 两职责由同一刚体动作或不可拆动作组耦合。
    - 墙/锚点边界承担结构责任。
    - 玩家主动读取并选择，差异立即被当前关卡消费。
