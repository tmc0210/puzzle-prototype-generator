  exact_version: v4
  opening_read: 熟练玩家开局会先看到竖直 B/S 的左上与左侧各有一枚目标，B/S 右侧贴着一组横向黏块，另一组横向黏块位于下方开放区；目标与边界关系直接提示 B/S 最终既要向左又要向上，而两组分离黏块需要先形成能够从右下侧施力的整体。
  player_actually_does: 玩家先把下方二格黏块左推，再从下方把它上推，使其与上方二格黏块合并为错位的四格刚体；随后绕到刚体右侧，先左推整块并带动竖直 B/S 左移，再从下方上推同一刚体并带动 B/S 上移，完成全部目标。
  key_visible_changes:
    - 下方二格黏块经过一次左移和一次上移，与原本贴近 S 的二格黏块合并成错位四格刚体；原先分离的两组材料由此获得统一运动轮廓。
    - 第一次推动合体后的刚体时，四格黏体与竖直 B/S 同时左移，S 明确覆盖左侧下目标，局面从构形阶段切换为锚点搬运阶段。
    - 紧接着的上推让同一四格黏体与 B/S 同时上移：B 覆盖左上目标，黏体的一格回填 S 刚刚腾出的下目标，两个目标在一次连续状态交接中同时收束。
  visible_payoff: 现场拼出的不规则四格黏体并非只触发一次锚点移动；它沿拐角连续承担横向和纵向施力，最终让 B 与黏块分别占据两个目标，第二次推动把第一次推动留下的占位关系直接变成胜利图形。
  ending_read: 第二次带动 B/S 后立即胜利，没有高潮后的清理；终局对象集中在左上目标区，B 与黏块分别覆盖目标的结果清楚可见。
  parent_delta_read: 冻结父节点同样要求把两组黏块拼成错位四格刚体，但其收束只需一次向左推动，让横向 B/S 覆盖单一目标。当前候选把终段改成竖直 B/S 与上下两个目标：合体黏块先左推锚点覆盖下目标，再上推锚点覆盖上目标，并由自身回填下目标；新增体验发生在第一次边界移动之后，且持续复用同一刚体、锚点与目标关系。
