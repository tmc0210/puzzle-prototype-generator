  selected_start_position: [4, 3]
  selection: keep_current
  selection_reason: >-
    当前起点在材料左侧直接呈现“两个规整横条—墙齿—B/S/目标消费者”的完整问题；首步 right 是可撤回的材料试探，
    并非不可逆承诺，down 又提供主动观察空间。它的最近不可逆出口距离为 1、最近可胜出口距离为 3，
    正确出口前只接触 2 个 dead exit，优于所有远端候选的长回程与 4 个早期死分支。
    [4,4] 虽把所有出口整体延后一拍，却不增加全图可见信息，而且当前起点已允许玩家自行走到该观察格；
    强制增加这一步会成为包装空走。故没有候选在不泄露正确 S、不过度诱导错误合并且不增加赶路的前提下优于当前起点。

