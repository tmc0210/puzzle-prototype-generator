rereview:
  rereview_required: true
  authority_reason: >-
    redundant_element_prune authority 允许满足 expected trace、完整图、核心事件、opening 与最外圈全墙硬门的纯墙外框裁剪，
    但未明确授权 exact 改变后保留既有 evidence / 阶段 A / 阶段 B review。按 docs/21 与本 assignment，
    only-outline-trim 仍形成新 exact v2，必须由 Controller 重新进入所需硬证据与 fresh A/B 链；本 artifact 不写该状态。

tool_runs:
  - command: >-
      npx tsx src/cli.ts explain-layout prototypes/reality_anchor <five-counterfactual-layouts>
      --id <case-id> --targets K_runtime_smoke --max-states 300000 --graph-max-states 300000
    result: 5/5 complete; graph, SCC, agency and opening facts recorded above
  - command: >-
      npx tsx src/cli.ts try-inputs prototypes/reality_anchor <five-counterfactual-layouts>
      --id <case-id> --inputs right,down,right,up,right,right,up,left
    result: 5/5 canonical replay legal and winning with the same construction/payoff events
  - command: >-
      npx tsx src/cli.ts try-inputs prototypes/reality_anchor <five-counterfactual-layouts>
      --id <case-id> --inputs down,right,up,right,right,up,left
    result: 5/5 preserve legal 2x2 construction and step-7 left force_blocked/no-win shared consumer
  - command: >-
      npx tsx prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/pre_submission/construct_prefix_v1/redundant_prune/verify_outline_graph_isomorphism.ts
      prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/nodes/construct_prefix_001/layout.txt
      prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/pre_submission/construct_prefix_v1/redundant_prune/proposed_exact_v2_trimmed_outline.txt
    result: >-
      complete; 133/350/1 on both sides; after (x,y)->(x-1,y), state keys, action/event-labeled edges
      and winning-state keys are all equal

