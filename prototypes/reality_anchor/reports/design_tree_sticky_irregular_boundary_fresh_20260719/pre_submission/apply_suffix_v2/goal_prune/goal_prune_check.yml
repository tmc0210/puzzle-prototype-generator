goal_prune_check:
  status: clean
  applicability: two_target_reviewed_exact_formally_assigned
  target_count: 2
  targets_checked:
    - target: [4, 1]
      role: 上端 B 目标；要求 core 后继续执行同一 Z/B/S 的纵向 suffix。
      action: keep
      reason: >-
        单删上端目标后最短成本从 8 降到 6，命中 authority 的必须保留条件。完整图中初始 4 个 commitments 有 2 个可胜；
        规整 2x2 可用 down,left,up,right,up,left 在第一次 B/S 左移时直接覆盖唯一剩余的下端目标并获胜，
        不需要正确错位 Z、第二次纵向 force chain 或覆盖交接。canonical 八拍仍全合法并最终获胜，但已在第 7 拍提前胜利，
        不能抵消该非等价构造旁路。
      counterfactual_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/pre_submission/apply_suffix_v2/goal_prune/counterfactual_remove_upper_target.txt
      counterfactual_sha256: 8952f8d43e725631e67bac8aaf332870e9edaa41c478f29cd72e5e694de3d195
      single_cell_diff:
        coordinate: [4, 1]
        from: G
        to: .
      cost_delta: "8->6"
      graph_status: complete
      graph_facts:
        reachable_states: 124
        legal_transitions: 298
        winning_states: 2
        initial_commitments: 4
        initial_viable_commitments: 2
      expected_trace_win: true
      expected_trace_boundary: 8 拍全合法；第 7 拍已胜，第 8 拍后仍胜。
      core_event_bypass:
        - correct_offset_Z_construction
        - second_vertical_force_chain
        - boundary_coverage_handoff
      bypass_witness:
        inputs: [down, left, up, right, up, left]
        legal_through_step: 6
        final_win: true
        final_state_key: "Ply:7,4|C:|M:5,3;6,3;5,4;6,4|PL:none|BS:B:4,2;S:4,3"
        final_events: ["push_object:sticky#1", "force_chain:n2", "anchor_boundary_shift:box_sticky", move_sticky_rigid]
      player_side_responsibility: >-
        上端目标让第一次横推后的 S 暂占下端格只能是中间状态；玩家必须预见并完成第二次上推，
        因而它承担“后继继续消费 core 状态并反向筛选构造”的责任，不是顺路覆盖。

    - target: [4, 3]
      role: 下端覆盖交接目标；suffix 时由 Z 远趾接替上移后的 S。
      action: keep
      reason: >-
        单删下端目标后最短成本仍为 8，canonical 八拍仍合法获胜，完整图也 complete；但可胜初始 commitments 从 1 增至 2，
        winning states 从 2 增至 3。规整 2x2 的十四拍深层反击全部合法并获胜：它可上抬后直接推动 B/S，
        使 B 覆盖上端目标，却不需要 Z 的远趾接替 S 腾出的下端格。该非等价构造胜族命中 core/构造旁路必须保留条件。
      counterfactual_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/pre_submission/apply_suffix_v2/goal_prune/counterfactual_remove_lower_target.txt
      counterfactual_sha256: 37746e01a51c6cf98d1c4eb8de797cf5ace122557db033de9e65ebc0b43123f8
      single_cell_diff:
        coordinate: [4, 3]
        from: G
        to: .
      cost_delta: "8->8"
      graph_status: complete
      graph_facts:
        reachable_states: 162
        legal_transitions: 401
        winning_states: 3
        initial_commitments: 4
        initial_viable_commitments: 2
      expected_trace_win: true
      expected_trace_boundary: canonical 8 拍全合法并在第 8 拍获胜。
      core_event_bypass:
        - correct_offset_Z_construction
        - distal_toe_target_handoff
        - canonical_second_force_chain_mode
      bypass_witness:
        inputs: [down, left, up, right, up, left, down, down, left, up, up, left, left, up]
        legal_through_step: 14
        final_win: true
        final_state_key: "Ply:4,3|C:|M:5,2;6,2;5,3;6,3|PL:none|BS:B:4,1;S:4,2"
        final_events: ["push_object:box_sticky_anchor", "anchor_boundary_shift:box_sticky", "box_to_sticky:n2", "sticky_merge:n1"]
      player_side_responsibility: >-
        下端目标把 B/S 上移时必然腾出的格继续留在同一边界应用中；只有正确 Z 的远趾能在同拍接替覆盖。
        删除它会把规则 2x2 的直接推锚结果重新视为完成态，消除此前构造偏移的后继责任。

