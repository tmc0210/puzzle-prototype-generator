        down: {events: [walk], irreversible: false}
        right: {events: ["push_object:sticky#2", move_sticky_rigid], irreversible: true}
      whether_core_chain_preserved: true
      player_read: 下条左侧的 right 立即把材料推向错误方向；正确构造还需五拍绕回，明显恶化误触与节奏。

    - candidate_start_position: [8, 5]
      layout_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/pre_submission/apply_suffix_v2/opening_comfort/candidate_start_8_5.txt
      is_current_start: true
      shortest_solution_cost: 8
      shortest_solution_delta: "0"
      shortest_inputs: [left, down, left, up, right, up, left, up]
      initial_scc_size: 14
      initial_exit_source_distances: [0, 2, 2, 3, 3, 5]
      initial_win_exit_source_distances: [0]
      dead_exits_before_first_win_exit: 0
      first_step_legal_events:
        up: {events: [walk], irreversible: false}
        down: {events: [walk], irreversible: false}
        left: {events: ["push_object:sticky#2", move_sticky_rigid], irreversible: true}
      whether_core_chain_preserved: true
      player_read: >-
        当前起点可上下观察，但已站在下条正确右侧操作面；最自然 left 第一手就是唯一可胜构造承诺，
        nearest win exit=0，直接泄露 offset Z 的第一步，低于难度 4 apply_suffix 所需的开局读题空间。

    - candidate_start_position: [5, 6]
      layout_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/pre_submission/apply_suffix_v2/opening_comfort/candidate_start_5_6.txt
      shortest_solution_cost: 12
      shortest_solution_delta: "+4"
