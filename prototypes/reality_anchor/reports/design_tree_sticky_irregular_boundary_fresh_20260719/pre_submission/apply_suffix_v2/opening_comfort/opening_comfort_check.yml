      first_step_legal_events:
        up: {events: ["push_object:sticky#2", move_sticky_rigid, "sticky_merge:n1"], irreversible: true}
        left: {events: [walk], irreversible: false}
        right: {events: [walk], irreversible: false}
      whether_core_chain_preserved: true
      player_read: 正对 2x2 上推合并，up 第一手即不可逆错误构造；把有意义反例变成误触而非判断。

    - candidate_start_position: [7, 6]
      layout_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/pre_submission/apply_suffix_v2/opening_comfort/candidate_start_7_6.txt
      shortest_solution_cost: 10
      shortest_solution_delta: "+2"
      initial_scc_size: 14
      initial_exit_source_distances: [0, 1, 2, 3, 4, 5]
      initial_win_exit_source_distances: [2]
      dead_exits_before_first_win_exit: 1
      first_step_legal_events:
        up: {events: ["push_object:sticky#2", move_sticky_rigid, "sticky_merge:n1"], irreversible: true}
        left: {events: [walk], irreversible: false}
        right: {events: [walk], irreversible: false}
      whether_core_chain_preserved: true
      player_read: 同样贴住 2x2 合并面；正确路线虽仅两步远，错误构造却被自然第一手强烈诱导。

    - candidate_start_position: [8, 6]
      layout_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/pre_submission/apply_suffix_v2/opening_comfort/candidate_start_8_6.txt
      shortest_solution_cost: 9
      shortest_solution_delta: "+1"
      shortest_inputs: [up, left, down, left, up, right, up, left, up]
      initial_scc_size: 14
      initial_exit_source_distances: [1, 1, 2, 3, 4, 4]
      initial_win_exit_source_distances: [1]
      dead_exits_before_first_win_exit: 0
      first_step_legal_events:
        up: {events: [walk], irreversible: false}
        left: {events: [walk], irreversible: false}
      whether_core_chain_preserved: true
      player_read: >-
        起点位于下条右下观察格：up 走到右侧后才可 left 构造 offset Z；left 走到下方后才可 up 合并 2x2。
        两条主题相关构造入口都需要一拍站位后才承诺，玩家能先读两根材料、双目标与 B/S，又不直接得到正确操作面。

  selected_start_position: [8, 6]
  selection: propose_new_start
  selection_reason: >-
    [8,6] 是唯一同时满足“首步仅观察走位”“下一拍自然分成正确 offset Z 与有意义错误 2x2”且只增加一拍的候选。
    当前 [8,5] 把唯一可胜左推直接放在第一手；[8,4] 虽有相同数值缓冲，却把另一近邻承诺导向无主题的向下推条；
    [6,6]/[7,6] 又把 2x2 错误合并贴到第一手。其余左侧候选增加 4—8 拍赶路或更多先行死出口。
    因而 [8,6] 在不泄露正确 Z、不过度惩罚错误构造且保持紧凑的前提下优于 reviewed start。

