      initial_exit_source_distances: [1, 1, 2, 3, 4, 4]
      initial_win_exit_source_distances: [4]
      dead_exits_before_first_win_exit: 3
      first_step_legal_events:
        up: {events: [walk], irreversible: false}
        right: {events: [walk], irreversible: false}
      whether_core_chain_preserved: true
      player_read: 下方最左端把玩家送入较长横走；三个死出口先于正确构造，不比当前题面更清楚。

    - candidate_start_position: [6, 6]
      layout_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/pre_submission/apply_suffix_v2/opening_comfort/candidate_start_6_6.txt
      shortest_solution_cost: 11
