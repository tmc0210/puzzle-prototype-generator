        down: {events: ["push_object:sticky#2", move_sticky_rigid], irreversible: true}
        left: {events: [walk], irreversible: false}
        right: {events: [walk], irreversible: false}
      whether_core_chain_preserved: true
      player_read: 同样把无关向下推条放在第一手，开局缓冲数值虽短但误触责任过重。

    - candidate_start_position: [8, 4]
      layout_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/pre_submission/apply_suffix_v2/opening_comfort/candidate_start_8_4.txt
