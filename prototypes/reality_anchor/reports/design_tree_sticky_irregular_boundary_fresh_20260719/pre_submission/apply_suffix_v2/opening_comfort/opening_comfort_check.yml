        down: {events: [walk], irreversible: false}
        left: {events: [walk], irreversible: false}
      whether_core_chain_preserved: true
      player_read: >-
        这是一个安全近邻：down 后进入正确右侧操作面；但 left 后最邻近的对象动作是把下条向下推离构造区，
        形成与题目应比较的 offset Z / 2x2 无关的诱饵。

    - candidate_start_position: [5, 5]
      layout_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/pre_submission/apply_suffix_v2/opening_comfort/candidate_start_5_5.txt
