rereview:
  rereview_required: true
  authority_reason: >-
    redundant_element_prune authority 允许在满足完整图、核心事件、opening 与最外圈全墙硬门后执行纯墙外框裁剪，
    但没有明确授权 exact 改变后保留既有 evidence / 阶段 A / 阶段 B review。按 docs/21 与本 assignment，
    只改轮廓仍形成新 exact v3，必须由 Controller 重新进入所需硬证据与 fresh A/B 链；本 artifact 不授予该状态。

tool_runs:
  - command: >-
      npx tsx src/cli.ts explain-layout prototypes/reality_anchor <each-counterfactual-layout>
      --id <case-id> --targets K_runtime_smoke --max-states 300000 --graph-max-states 300000
    result: 6/6 complete; candidate graph facts recorded above
  - command: >-
      npx tsx src/cli.ts try-inputs prototypes/reality_anchor <each-counterfactual-layout>
      --id <case-id> --inputs down,right,right,right,down
    result: 6/6 exact replays read; remove/wallify P/L fail win, tooth and all outline trims preserve win and events
  - command: >-
      npx tsx prototypes/reality_anchor/reports/probe_fixed_anchor_candidate.ts <each-counterfactual-layout>
      <case-id> push_pull 300000 80 strong_material
    result: complete raw md/json artifacts retained in this assignment output directory
  - command: >-
      npx tsx prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/pre_submission/baseline_v2/redundant_prune/verify_outline_graph_isomorphism.ts
      prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/nodes/baseline_001/layout.txt
      prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/pre_submission/baseline_v2/redundant_prune/proposed_exact_v3_trimmed_outline.txt
    result: >-
      complete; 19/34/1 on both sides; after (x,y)->(x-1,y), state keys, action/event-labeled edges,
      and winning-state keys are all equal

operation:
  reviewed_v2_modified: false
  new_exact_proposed: true
  controller_state_modified: false
  delivery_or_playable_state_modified: false
  shared_prototype_files_modified: false

