tool_runs:
  - command: >-
      npx tsx src/cli.ts explain-layout prototypes/reality_anchor <each-candidate-layout>
      --id <candidate-id> --max-states 300000 --graph-max-states 300000
    result: 8/8 complete; every graph 19 states / 34 transitions / 1 win; every initial SCC 8 states
  - command: >-
      npx tsx src/cli.ts try-inputs prototypes/reality_anchor <each-candidate-layout>
      --id <candidate-and-direction-id> --inputs <up|down|left|right>
    result: 8 candidates x 4 directions replayed; first-step legality and events recorded above
  - command: >-
      npx tsx src/cli.ts try-inputs prototypes/reality_anchor <reviewed-layout>
      --id RA_PRE_BASELINE_V2_OPENING_SCC_REVERSIBILITY --inputs down,right,right,right,left
    result: >-
      第 4 拍进入 player [5,4] / T 右移 state；第 5 拍 left 合法并恢复原对象配置及 player [4,4]，
      证明该 state 属于原始 initial SCC。

operation:
  start_changed: false
  reviewed_artifact_modified: false
  new_delivery_exact_proposed: false
  rereview_required: false
  rationale: 当前起点在完整 SCC 枚举后的玩家侧比较中仍最优。

version_effect: unchanged
result_exact_version: v2
controller_boundary: >-
  本 artifact 只记录 Designer 的 opening_comfort 专业检查；未执行 construct/apply opening 或 redundant_element_prune，
  未写冻结、delivery、playable queue、pre-submission 总状态或其它 Controller 状态。
