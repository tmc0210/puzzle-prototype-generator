opening_comfort_check:
  status: clean
  applicability: expected_difficulty_3_and_formal_start_comparison_requested
  enumeration_scope: >-
    枚举原始完整图 initial SCC 的全部 8 个 state。前 7 个 state 共享原对象配置、仅玩家位置不同；
    第 8 个 state 是 T 已右推一格、玩家位于 [5,4] 的可逆对象态，输入 left 可拉回原对象配置，故同属原始 SCC。
  current_start_position: [2, 3]
  current_shortest_cost: 5
  initial_scc:
    status: complete
    state_count: 8
    outgoing_exits:
      - id: dead_upper_face_push
        source_player_position: [4, 2]
        source_object_state: original
        exit_input: down
        exit_events: ["push_object:sticky#1", move_sticky_rigid]
        win_reaching: false
      - id: win_core_pull
        source_player_position: [5, 4]
        source_object_state: T_already_shifted_right_one_cell
        exit_input: down
        exit_events: ["pull_object:sticky#1", "force_chain:n2", "anchor_boundary_shift:box_sticky", move_sticky_rigid]
        win_reaching: true

  candidates:
    - candidate_start_position: [2, 2]
      candidate_state_kind: original_objects_player_relocated
      layout_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/pre_submission/baseline_v2/opening_comfort/candidate_start_2_2.txt
      shortest_solution_cost: 6
      shortest_solution_delta: "+1"
      shortest_inputs: [down, down, right, right, right, down]
      graph_status: complete
      graph_facts: {reachable_states: 19, legal_transitions: 34, winning_states: 1}
      initial_scc_size: 8
      initial_exit_source_distances:
        dead_upper_face_push: 2
        win_core_pull: 5
      initial_win_exit_source_distances: [5]
      dead_exits_before_first_win_exit: 1
      first_step_legal_events:
        down: [walk]
        right: [walk]
      whether_core_chain_preserved: true
      player_read: 起点偏在上支；死出口比正确出口近三步，增加折返并自然偏向错误上操作面。

    - candidate_start_position: [3, 2]
      candidate_state_kind: original_objects_player_relocated
      layout_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/pre_submission/baseline_v2/opening_comfort/candidate_start_3_2.txt
      shortest_solution_cost: 7
      shortest_solution_delta: "+2"
      shortest_inputs: [left, down, down, right, right, right, down]
      graph_status: complete
      graph_facts: {reachable_states: 19, legal_transitions: 34, winning_states: 1}
      initial_scc_size: 8
      initial_exit_source_distances:
        dead_upper_face_push: 1
        win_core_pull: 6
      initial_win_exit_source_distances: [6]
      dead_exits_before_first_win_exit: 1
      first_step_legal_events:
        left: [walk]
        right: [walk]
      whether_core_chain_preserved: true
      player_read: 上方直道把玩家朝死出口摆正；正确下支需先反向退回，读题重心被错误诱导吞掉。

    - candidate_start_position: [4, 2]
      candidate_state_kind: original_objects_player_relocated
      layout_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/pre_submission/baseline_v2/opening_comfort/candidate_start_4_2.txt
      shortest_solution_cost: 8
      shortest_solution_delta: "+3"
      shortest_inputs: [left, left, down, down, right, right, right, down]
      graph_status: complete
      graph_facts: {reachable_states: 19, legal_transitions: 34, winning_states: 1}
      initial_scc_size: 8
      initial_exit_source_distances:
        dead_upper_face_push: 0
        win_core_pull: 7
      initial_win_exit_source_distances: [7]
      dead_exits_before_first_win_exit: 1
      first_step_legal_events:
        down: ["push_object:sticky#1", move_sticky_rigid]
        left: [walk]
      whether_core_chain_preserved: true
      player_read: 起点即贴住错误不可逆下推；自然第一手会进入 dead region，不符合本难度定位的开局缓冲。

    - candidate_start_position: [2, 3]
      candidate_state_kind: reviewed_exact_current_start
      layout_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/pre_submission/baseline_v2/opening_comfort/candidate_start_2_3.txt
      shortest_solution_cost: 5
      shortest_solution_delta: "0"
      shortest_inputs: [down, right, right, right, down]
      graph_status: complete
      graph_facts: {reachable_states: 19, legal_transitions: 34, winning_states: 1}
      initial_scc_size: 8
      initial_exit_source_distances:
        dead_upper_face_push: 3
        win_core_pull: 4
      initial_win_exit_source_distances: [4]
      dead_exits_before_first_win_exit: 1
      first_step_legal_events:
        up: [walk]
        down: [walk]
      whether_core_chain_preserved: true
      player_read: >-
        玩家从上下支路的共同门厅开局，合法第一步均只是 walk；既能先看 T 的上操作面，也能走到下方肩窝，
        不把任何对象动作塞进第一步。死出口只比正确出口近一格，构成核心的操作面比较，而不是长程误导。

    - candidate_start_position: [2, 4]
      candidate_state_kind: original_objects_player_relocated
      layout_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/pre_submission/baseline_v2/opening_comfort/candidate_start_2_4.txt
      shortest_solution_cost: 4
      shortest_solution_delta: "-1"
      shortest_inputs: [right, right, right, down]
      graph_status: complete
      graph_facts: {reachable_states: 19, legal_transitions: 34, winning_states: 1}
      initial_scc_size: 8
      initial_exit_source_distances:
        dead_upper_face_push: 4
        win_core_pull: 3
      initial_win_exit_source_distances: [3]
      dead_exits_before_first_win_exit: 0
      first_step_legal_events:
        up: [walk]
        right: [walk]
      whether_core_chain_preserved: true
      player_read: 开局更温和地朝正确肩窝偏置，但把下支变成自然前进方向，削弱上下操作面的中性比较。

    - candidate_start_position: [3, 4]
      candidate_state_kind: original_objects_player_relocated
      layout_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/pre_submission/baseline_v2/opening_comfort/candidate_start_3_4.txt
      shortest_solution_cost: 3
      shortest_solution_delta: "-2"
      shortest_inputs: [right, right, down]
      graph_status: complete
      graph_facts: {reachable_states: 19, legal_transitions: 34, winning_states: 1}
      initial_scc_size: 8
      initial_exit_source_distances:
        dead_upper_face_push: 5
        win_core_pull: 2
      initial_win_exit_source_distances: [2]
      dead_exits_before_first_win_exit: 0
      first_step_legal_events:
        left: [walk]
        right: [walk]
      whether_core_chain_preserved: true
      player_read: 起点已在下方进攻走廊；正确方向明显更近，观察空间仍在但读题选择被压缩成向右执行。

    - candidate_start_position: [4, 4]
      candidate_state_kind: original_objects_player_relocated
      layout_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/pre_submission/baseline_v2/opening_comfort/candidate_start_4_4.txt
      shortest_solution_cost: 2
      shortest_solution_delta: "-3"
      shortest_inputs: [right, down]
      graph_status: complete
      graph_facts: {reachable_states: 19, legal_transitions: 34, winning_states: 1}
      initial_scc_size: 8
      initial_exit_source_distances:
        dead_upper_face_push: 6
        win_core_pull: 1
      initial_win_exit_source_distances: [1]
      dead_exits_before_first_win_exit: 0
      first_step_legal_events:
        left: [walk]
        right: ["push_object:sticky#1", move_sticky_rigid]
      whether_core_chain_preserved: true
      player_read: 玩家贴住正确肩窝，最自然第一手就是核心横推；虽可逆，却只剩两拍兑现，读图与操作面比较不足。

    - candidate_start_position: [5, 4]
      candidate_state_kind: original_initial_scc_state_with_T_shifted_right
      layout_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/pre_submission/baseline_v2/opening_comfort/candidate_start_5_4_scc_state.txt
      shortest_solution_cost: 1
      shortest_solution_delta: "-4"
      shortest_inputs: [down]
      graph_status: complete
      graph_facts: {reachable_states: 19, legal_transitions: 34, winning_states: 1}
      initial_scc_size: 8
      initial_exit_source_distances:
        dead_upper_face_push: 7
        win_core_pull: 0
      initial_win_exit_source_distances: [0]
      dead_exits_before_first_win_exit: 0
      first_step_legal_events:
        down: ["pull_object:sticky#1", "force_chain:n2", "anchor_boundary_shift:box_sticky", move_sticky_rigid]
        left: ["pull_object:sticky#1", move_sticky_rigid]
      whether_core_chain_preserved: false
      player_read: >-
        该 SCC state 已预先完成 T 的关键横推；down 一拍直接完成远端力链，玩家不再选择操作面或亲自建立对位，
        因而虽是合法 SCC state，却不能作为本作品起点。

  selected_start_position: [2, 3]
  selection: keep_current
  selection_reason: >-
    当前起点是上下观察支路的中性门厅：两种第一步都只 walk，离错误/正确不可逆出口源分别为 3/4 步，
    给玩家足够的观察与站位空间，同时把上操作面与下肩窝的比较保留为题目本身。向上移动会过度诱导 dead exit；
    向下移动虽改善数值上的 win-exit 距离，却逐步泄露正确方向；从已右推 SCC state 开局则直接删除核心横推。
    因此没有候选在不削弱五拍核心及读题中性的前提下优于 reviewed exact 当前起点。

core_chain_invariant:
  preserved_by_selected_start: true
  selected_shortest_inputs: [down, right, right, right, down]
  selected_terminal_events: ["pull_object:sticky#1", "force_chain:n2", "anchor_boundary_shift:box_sticky", move_sticky_rigid]
  graph_status: complete
  object_and_goal_layout_unchanged: true

