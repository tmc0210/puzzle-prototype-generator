source: human
scope: 难度来源与树生长负担的补充纠偏
human_feedback_verbatim: >-
  也不是说一定要加推演深度，加腾挪难度、加入推拉锚点也是可以的啊。比如说你这个第一关用了推拉锚点，
  后面两关反而没用，那越生长越简单了肯定不对。
correction_to_controller_reading:
  - 不要求所有难度都来自更多层的延迟推演。
  - 异形刚体的真实腾挪、操作面保存与恢复、动作可逆性管理可以构成难度。
  - P/L 锚点可以使用；若与异形黏块有机结合，锚点自身可移动也允许。
  - 普通走路、无判断的执行长度和精确操作仍不计作有效难度。
growth_problem_observed: >-
  baseline 使用了 P/L 推拉语义，两个生长节点反而移除 P/L，只留下更直接的形状二择；
  生长关系在文档上增加了前序或后继，但玩家实际操作维度和负担下降。
revision_boundary:
  - 子节点可以重组地图和机制，不要求机械继承父布局。
  - 但玩家与异形核心的关系必须增长，不能通过删去已有的有意义操作维度使后续更简单。
  - RA_CAND_0010、RA_CAND_0015、RA_CAND_0011 继续只校准档位角色与组内差异，不作为布局或结构素材。
