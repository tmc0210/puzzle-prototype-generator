status: completed_archive_calibration_only

scope_contract:
  task_class: prototype_specific_level_design
  completed_work:
    - 独立读取 clean human-reviewed archive index
    - 读取全部明确审美 1 分样本的人类原评语与卡内实际布局
    - 自主选择并读取与异形黏块、边界关系和包装责任相关的正例、下界与边界原评语
    - 记录现有异形黏块作品身份的防撞边界
    - 按 human_brief 对另一体验核心的 baseline 与两个生长档位做分类校准
  explicitly_not_done:
    - 未画任何候选布局
    - 未选择正式 structure family
    - 未定义或冻结本树的正式体验核心与作品身份
    - 未读取任何未列入 assignment input_refs 的旧 reports、旧 exact、旧审查或工具报告
    - 未把归档关卡转成设计素材，也未向 task-local Explorer 提供归档内容
    - 未提前进入 baseline
  reason_for_stopping: >-
    Explorer 首批已验证 task-local 材料尚未发布；按 assignment 与 Designer 合同，当前阶段只完成归档校准。

archive_read:
  full_index_or_retrieval_summaries_read: true
  index_ref: prototypes/reality_anchor/design_archive/index.yml
  archive_status_used: clean_archive_and_human_reviewed_only
  authority_rule: 人类原评语用于审美校准；index 摘要仅用于定位，工具结论与未归档报告不作审美权威。

all_aesthetic_1_records_read:
  - candidate_id: RA_CAND_0024
    candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0024.md
    human_comment_id: HP_RA_FRESH_2026_07_08_PULL_BRUSH_RETURN_v4_wall_trim_001
    calibration: >-
      三格黏块与双可动锚点抬高了玩家对切割、拼接、长链和几何利用的期待，实际只兑现推拉腾挪；
      机制信号、事件覆盖和目标反转不能补偿核心洞见缺失。
  - candidate_id: RA_CAND_0027
    candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0027.md
    human_comment_id: HP_RA_FRESH_2026_07_09_VACATE_MATERIAL_LOCK_v4_001
    calibration: >-
      可动 P/L 不需要移动、sticky 能黏却不需要利用黏块几何；标签触发不等于玩家真正使用 affordance。
  - candidate_id: RA_CAND_0030
    candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0030.md
    human_comment_id: HP_RA_FRESH_2026_07_12_CUT_REBIND_ORTHOGONAL_v7_001
    calibration: >-
      双锚只在开局搬运后退休，大图和大量材料只兑现普通黏块腾挪；自然方向生成大量反馈迟缓的 deadend，
      高设计成本和高机制信号不能补偿缺少亮点。
  - candidate_id: RA_CAND_0031
    candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0031.md
    human_comment_id: HP_RA_FRESH_2026_07_11_TWIN_LOOM_RESECTION_v31_001
    calibration: >-
      十几步单行道机制演出不被后续空间或对象复用，最终只剩显然的重复拉动顺序锁；
      合并、切割、锚点移动等事件齐全也不构成玩家内容。
  - candidate_id: RA_CAND_0032
    candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0032.md
    human_comment_id: HP_RA_FRESH_2026_07_12_DUAL_ANCHOR_CROSS_RELAY_v4_001
    calibration: >-
      开局双锚交接与末段黏块入目标互相割裂，前段对象完成后退休；不得拼接无关子题来抬高机制覆盖、难度或审美。

selected_related_positive_records_read:
  - candidate_id: RA_CAND_0025
    candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0025.md
    human_comment_id: HP_RA_FRESH_2026_07_09_ACTIVE_L_REBIND_v4_001
    archive_role: direct_irregular_sticky_positive_and_collision_anchor
    human_calibration: aesthetic_5_difficulty_4
    player_side_read: >-
      狭小空间中，玩家主动构造 L 形并反复把它作为活塞使用；前段构造不过度抢戏，右上双目标对 L 形收束提供提示，
      形状、构造、重复用途和终局消费形成同一条紧凑逻辑。
  - candidate_id: RA_CAND_0029
    candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0029.md
    human_comment_id: HP_STUDIO_L_1_001
    archive_role: irregular_sticky_piston_positive_and_collision_anchor
    human_calibration: aesthetic_4_difficulty_4
    player_side_read: >-
      两次把上方黏块作为活塞推动 B/S 并最终归位，而且两次局部活塞结构不同；同一组要素在不同阶段承担推动与回收责任，
      空间和对象复用形成价值。原 comment 的 difficulty_score 为 3，候选最新 review 字段为 4，本记录保留该差异。

