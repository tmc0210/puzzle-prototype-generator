selected_related_boundary_records_read:
  - candidate_id: RA_CAND_0020
    candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0020.md
    human_comment_id: HP_RA_LEX_2026_07_08_SPLIT_BRIDGE_DUAL_ENDPOINT_v1_001
    archive_role: accepted_irregular_geometry_boundary
    calibration: >-
      固定 B/S 切开 C 形大黏块，产生上下 sticky 端点和中心 crate bridge，三个输出由几何对称的三次行动消费。
      清晰几何可把重复结构抬到审美 3，但重复分支本身不构成更高阶玩家关系。
  - candidate_id: RA_CAND_0021
    candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0021.md
    human_comment_id: HP_RA_LEX_2026_07_07_RATCHET_SPLIT_TOOTH_v2_001
    archive_role: accepted_irregular_boundary_force_chain_boundary
    calibration: >-
      P/L 作为 force-chain 推杆强推大黏块，经固定 B/S 切开并把端点送入墙齿目标；结构特殊但人评为审美 3、难度 3，
      不应仅凭大黏块、双锚和特殊力链包装成更高档作品。

other_core_classification_only:
  calibration_core: 推拉锚点也可以被推拉
  use_boundary: >-
    以下三关只用于校准同组中 baseline 与两个生长档位的分类角色和差异幅度；不提取布局、结构、机制组合、包装或高潮，
    不作为当前异形黏块任务的设计素材，也不提供给 Explorer。
  records:
    - candidate_id: RA_CAND_0010
      candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0010.md
      human_comment_id: HP_RA_CURR_2026_07_05_L04_MOVABLE_PL_TIMING_v1_001
      human_assigned_role: baseline
      classification_read: >-
        直接、低噪声地让同一箱子经历拉箱、移动 P/L、在新边界下推箱入目标；baseline 的角色是先把核心事实和因果链清楚成立，
        不要求提前承担高难包装。
    - candidate_id: RA_CAND_0015
      candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0015.md
      human_comment_id: HP_RA_CURR_2026_07_05_L05_LONG_EDGE_PL_v4_001
      human_assigned_role: growth_slot_1
      classification_read: >-
        同一普通箱承担开局与收尾，P/L 的长边同向拉推进入更完整的耦合链；相对 baseline 的档位差来自对象职责与应用关系加深，
        不是单纯增加步骤。
    - candidate_id: RA_CAND_0011
      candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0011.md
      human_comment_id: HP_RA_CURR_2026_07_05_L06_MULTI_AXIS_PL_v2_001
      human_assigned_role: growth_slot_2
      classification_read: >-
        小空间中要求箱子先进入目标再被拉出，形成多方向、反直觉的强逻辑；第二生长档位校准的是玩家关系和洞见强度的进一步提升。
        该关的 P/L 为固定锚点，因此这里只服从 human_brief 做角色与差异程度分类，不把它主张为当前体验核心的同一作品或设计材料。

irregular_sticky_collision_boundary:
  existing_accepted_identities_to_avoid_repeating:
    - anchor_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0025.md
      boundary: >-
        不复刻“横向三格黏块经 B/S 切出一端、再把剩余部分推成 L 形、反复用 L 形作活塞、右上双目标提示并消费 L 形”的完整作品身份；
        仅换 L 朝向、坐标、墙皮、目标位置或步数仍视为碰撞。
    - anchor_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0029.md
      boundary: >-
        不复刻“上方黏块分两阶段以不同活塞结构推动 B/S 并最终归位、同组要素完成推动与回收”的作品身份；
        仅更换活塞形状或边界朝向不足以形成新玩家关系。
    - anchor_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0020.md
      boundary: >-
        不复刻“固定 B/S 切开 C 形大黏块，得到上下 sticky 端点与中心 crate bridge，再以对称重复分支分别消费三个输出”的结构关系。
    - anchor_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0021.md
      boundary: >-
        不复刻“用 P/L 作为 force-chain 推杆强推 C 形或近邻大黏块通过固定 B/S，切开后把端点送入墙齿目标”的结构关系。
  rejected_nearby_failures_not_to_rebuild:
    - refs:
        - prototypes/reality_anchor/design_archive/candidates/RA_CAND_0024.md
        - prototypes/reality_anchor/design_archive/candidates/RA_CAND_0027.md
      boundary: 不得只陈列异形黏块与可动锚点、触发合并切割标签，却让玩家实际只做普通腾挪或完全不使用形状拓扑。
    - refs:
        - prototypes/reality_anchor/design_archive/candidates/RA_CAND_0030.md
        - prototypes/reality_anchor/design_archive/candidates/RA_CAND_0031.md
        - prototypes/reality_anchor/design_archive/candidates/RA_CAND_0032.md
      boundary: 不得用长单行道机制演出、退休锚点、迟缓 deadend 或割裂子题包装异形黏块高潮。
  novelty_test_for_future_design: >-
    新节点必须由另一种玩家关系成立：异形的具体占格拓扑与墙口、墙边或锚点边界共同改变合法动作、操作位、回返性或动作后状态，
    且这一差异必须被玩家主动读取和利用。只换异形轮廓、朝向、绝对坐标、边界标签、重复次数或目标摆法，不足以越过防撞边界。

player_side_calibration:
  confirmed_player_prior:
    - 后期玩家已熟悉规整小黏块组的可达性与可动性
    - 已熟悉黏块拼接、切分和状态变化
    - 已熟悉 B/S 与 P/L 锚点推拉和基础腾挪
  implications:
    - 不把规则回忆、规整黏块基础腾挪、读图失误、执行唯一动作或 solver 复杂度当作难度。
    - 异形必须是核心操作对象；规整替代物若仍保留同一核心判断，则作品身份不成立。
    - 墙口、墙边或锚点边界必须实际改变异形的合法动作、操作位、回返性或动后局面，不能只是布景。
    - 玩家必须亲自比较异形动作前后的状态差异；强制动画或事件标签不构成洞见。
    - 构造、拼接和切割只在持续服务异形高潮时成立，完成后退休的前置子题属于拼接。
    - 对预期难度 3 至 5 的后期关，简短清楚仍可成立，但必须有真实、非显然的玩家关系；不得靠路线税、重复处理或反馈迟缓 deadend 虚构难度。
    - 高 affordance 对象抬高玩家期待；任何可动锚点、异形黏块、切割或拼接信号若未兑现具体职责，都是非补偿性缺点。

