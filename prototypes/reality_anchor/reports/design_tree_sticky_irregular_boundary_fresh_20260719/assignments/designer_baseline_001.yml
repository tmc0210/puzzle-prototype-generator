design_brief: >-
  制作一个预期难度 3、紧凑且可独立游玩的直白 baseline：熟练玩家必须主动读取同一小型异形的完整占格集合，
  从其近端偏置操作面施力，使远端突臂或错位轮廓在墙口、墙边或锚点边界处产生规整替代物不能保留的
  合法动作或动后状态。baseline 可以直接给出成形异形，不要求主动构造；关键关系要由玩家亲自完成并集中兑现，
  高潮后尽快结束。首批 T/L 材料只是可改造词汇，不强制采用其形状、次序、双锚或 family；必须避开 archive_calibration
  记录的已有异形作品身份。完整执行 Design Studio Loop、非空 exact replay、玩家侧重读和解族唯一性送审门；只有符合
  送审条件时才写 submission.yml，否则在允许产物中保留诊断并明确返回材料缺口或撤回理由。
