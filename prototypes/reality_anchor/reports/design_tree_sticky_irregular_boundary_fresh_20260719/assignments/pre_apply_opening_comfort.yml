design_brief: >-
  只执行 Reality Anchor `opening_comfort_check`。这是后期难度 4 的 apply_suffix：玩家先把两根横条构造成
  offset Z，再让同一 Z/B-S 连续完成横向 core 与纵向覆盖接力；规整 2x2 可以完成 core 但不能完成 suffix。
  请枚举原始 initial SCC 的全部潜在起点 state，比较开局是否允许先读材料、双目标和 B/S 边界，又不会贴脸
  诱导错误构造或直接泄露 offset Z 的正确操作面。最终由 Designer 选择保留当前起点或提出单一更优起点。
  不得执行冗余检查，不覆盖冻结 artifact、不写 Controller 状态。改变起点时写新的 delivery exact 并明确
  rereview_required；保留时记录 version_effect=unchanged 及玩家侧理由。
