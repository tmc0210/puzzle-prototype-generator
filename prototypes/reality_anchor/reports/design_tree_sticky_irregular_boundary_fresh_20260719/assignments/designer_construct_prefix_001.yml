design_brief: >-
  原教练唯一方向如下，保持其自然语言语义，不改写成施工清单：下一步增加前序构造，不直接交给玩家已经就位的完整关系，
  而让玩家先主动形成或摆正一种异形状态，使近端仍可承担随后施力，远端突臂又恰好能在核心动作中作用于边界对象。
  前序里的局部可行构造必须只有在玩家预见后面的整块运动与远端接触时才会被区分；若玩家无需预见核心动作便能顺手
  得到正确状态，或材料变化本身盖过异形近端与远端的耦合，就放弃这次生长。冻结 baseline 只提供共享体验核心、作品身份
  和玩家关系对照，不是地图底稿。完整执行单节点 Design Studio Loop；目标难度保持人类指定的 3~5 后期范围，新增价值来自
  非拼接前序选择，不来自步骤、机制或 deadend 数量。可使用或重构最新 task-local 材料，也可自行构造；若有材料缺口，先写
  abstract exploration request，由 Controller 调度 Explorer。
