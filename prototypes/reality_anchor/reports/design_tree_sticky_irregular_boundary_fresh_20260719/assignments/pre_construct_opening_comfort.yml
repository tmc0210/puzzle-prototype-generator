design_brief: >-
  只执行 Reality Anchor `opening_comfort_check`。这是后期难度 4 的 construct_prefix：玩家先把两根规整横条
  构造成 S 与 2x2，再由同一墙齿/B-S 消费者区分其可动性。请枚举原始 initial SCC 的全部起点 state，
  比较开局是否让玩家先读到两种构造材料与消费者，而不在第一手自然诱导关键不可逆承诺，也不要把正确 S
