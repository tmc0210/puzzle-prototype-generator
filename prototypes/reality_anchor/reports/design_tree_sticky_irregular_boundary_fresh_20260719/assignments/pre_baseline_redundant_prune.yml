design_brief: >-
  在 goal_prune 与 opening_comfort 均已完成后，只执行 Reality Anchor `redundant_element_prune`。从玩家侧检查该短 baseline
  中的厚外框、叶状空地、口袋、墙齿和任何看似未参与的格子/对象；对每个严肃裁剪候选做单变量实物反事实，核验
  current canonical、完整图、核心事件、T 形近端操作—远端 B/S 扫带与开局读题是否保持。不能因 solver 仍可解就删，
  也不能把 compact 当作唯一价值。最终选择保持 v2 或提出单一新 exact；不覆盖冻结 v2、不写 Controller 状态，
  不处理其它节点。若 exact 改变，明确 rereview_required。
