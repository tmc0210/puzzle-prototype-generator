design_brief: >-
  纠偏后教练的唯一方向如下，保持其自然语言语义，不改写成施工清单：让核心动作留下的异形位置与操作关系继续被
  同一边界应用消费，使若干都能完成眼前边界动作的构造状态，只有保留正确近端操作面或回返关系的那一种能够完成整关；
  后继约束应反向改变玩家此前怎样构造异形。若核心动作之后不要求玩家重新理解前面的构造选择，只是顺手完成另一段流程，
  就不要保留这次生长。冻结 parent 只提供共享体验核心、非拼接 construct_prefix 与玩家关系对照，不是地图底稿；允许重构
  layout、异形拓扑、边界朝向与支持对象。完整执行单节点 Design Studio Loop，目标难度保持人类指定的 3~5 后期范围，
  不以步数、机制数量、deadend 数量或长收尾制造档位。可使用/重构 task-local 材料，也可自行构造；若材料缺口，先写
  abstract exploration request，由 Controller 调度 Explorer。
