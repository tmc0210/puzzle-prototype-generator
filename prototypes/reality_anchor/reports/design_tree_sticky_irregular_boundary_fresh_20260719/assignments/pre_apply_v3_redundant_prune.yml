design_brief: >-
  在 current v3 的 goal-prune、opening-comfort 与回审均完成后，只执行 Reality Anchor `redundant_element_prune`。
  从玩家侧检查厚外框、中央/下方活动室、叶状空地、双目标附近口袋、墙齿和任何未参与的地形/对象；对严肃裁剪
  候选做单变量实物反事实，核验 canonical、完整图、neutral two-step opening、offset Z 与 2x2 的构造分歧、
  同一 Z/B-S 的横向 core—纵向 suffix—覆盖交接及解族是否保持。不能因可解或图更小就删，不能把两个主题入口
  所需的站位空间判成冗余。最终保持 v3 或提出单一新 exact；不覆盖冻结 v3、不写 Controller 状态，不处理其它节点。
  若 exact 改变，明确 rereview_required。
