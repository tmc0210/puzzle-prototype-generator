      prior_claim: 保持完整 T、只把 B/S 横移一格后，同一五步全合法但不胜利。
      reason: >-
        真正只把 B/S 左移一格的反事实仍由同一五步胜利；第 4 步先把 B/S 推回原对齐位。
        旧右移 artifact 还同时改了目标和右侧墙界，不能作为单变量证据。
      evidence_refs:
