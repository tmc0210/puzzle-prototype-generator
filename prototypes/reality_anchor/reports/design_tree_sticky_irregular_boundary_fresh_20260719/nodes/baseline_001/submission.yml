designer_claim:
  player_experience_core: >-
    一个小型 T 形刚体把近端操作面与远端占格绑定在同一动作组；玩家必须选对肩窝并保留 pull 把手，
    才能让远端右臂扫带边界口袋中的 B/S。
  player_action: >-
    玩家比较上方直接下推与下方肩窝横推，选择后者把 T 向右推一格，再从左臂下方把完整 T 下拉。
  visible_payoff: >-
    下拉终手同时移动完整 T、触发二对象 force chain、使 B/S 向下移一格并由 B 覆盖目标，立即结束。
  why_this_level_exists: >-
    用最小的可执行操作面分岔呈现“近端施力正确，但胜负由同一异形的远端足迹决定”。
  work_identity_conditions:
    - T 的中央脚、左臂和右臂分别承担横推近端、下拉把手和远端扫带，且必须属于同一刚体。
    - B/S 位于玩家不可直接取得施力位的单向目标口袋，胜利只能由远端作用列触发。
    - 上下两个操作面都允许首次对象动作，但只有肩窝横推保留正确远端列与第二手 pull 关系。

packaging_account:
  opening: 玩家从 T 左侧观察区可走向上方左臂或下方中央脚肩窝，并看见右侧封闭的 B/S 与目标。
  preparation: 玩家只需选择首次对象操作面；不要求构造、切割、回收或重复活塞操作。
  reveal_or_use: 横推 T 将远端右臂对准 S，同时让玩家落在左臂 pull 侧；错误下推留下可读的死局形状。
  ending: 正确下拉把 B/S 扫入目标，终手立即胜利，没有清理尾巴。
  every_major_element_role:
    - 四格 T 是视觉主体与唯一近端/远端耦合刚体；缺少右臂时相同两手不能移动 B/S。
    - B/S、目标和外墙共同形成不可直接操作的单向落点口袋，并提供终手边界位移回报。
    - 左侧上/下通路把两个不同操作面外显为一活一死的首次 commitment。
    - 顶部 P/L 固定原型的 push/pull 语义边界，不承担独立玩家操作。
  known_perceptible_defects:
    - 正确 commitment 后只剩一次强制兑现，关卡没有持续多阶段推演；这是紧凑 baseline 的上限。
    - 固定 P/L 与核心区空间分离，玩家侧反馈主要来自 T 与 B/S，而非 P/L 本体。

