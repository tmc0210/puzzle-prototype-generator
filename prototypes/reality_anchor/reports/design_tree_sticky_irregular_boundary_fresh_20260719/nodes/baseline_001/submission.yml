  evidence_limits:
    - explain-layout 未返回 instance-level object participation；对象职责由逐步状态、事件和精确占格差异支持。
    - 删去 T 远端右臂的反事实只证明相同核心输入下右臂的机械必要，不证明审美或独立玩家难度。
    - 不再声明 B/S 初始横向坐标机械必要；有效单变量左移反事实仍可由同一五步胜利。
    - 旧 counterfactual_shifted_bs.txt 同时改目标和右侧墙界，已从 submission 引用移除。
    - 图工具的 near-discovery reading hint 不是质量 verdict；难度 3 只按玩家侧一次操作面判断的下界主张。
    - fixed-anchor 的 strong_material combined probe 还要求本作品身份未声明的 normalization、box_to_sticky、sticky_merge；只引用三个逐项 complete 的无旁路结果。

designer_self_verdict: submit_for_independent_review
