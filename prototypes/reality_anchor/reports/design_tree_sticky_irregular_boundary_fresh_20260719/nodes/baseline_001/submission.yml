      - 唯一 winning state 之前可有初始可逆走位排列或回退；它们不改变对象职责、目标分配或因果顺序。
    equivalence_account: >-
      完整图的两个 opening commitment 中只有肩窝横推可胜，上方下推为 dead；
      所有胜路都经过同一个 T 横推再下拉的玩家逻辑类。
    evidence_refs:
