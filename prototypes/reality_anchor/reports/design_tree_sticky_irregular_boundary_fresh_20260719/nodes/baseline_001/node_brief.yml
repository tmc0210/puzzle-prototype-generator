player_relation: >-
  玩家从观察位可以走向 T 形左臂上方，直接把整块向下推；也可以走向中央脚左侧的肩窝，先横推一格进入 pull 侧，
  再从新形成的近端接触面下拉。只有肩窝路线会让远臂在同一刚体动作中扫带封闭口袋里的 B/S，使 B 端落到目标。
  玩家必须同时投影近端施力关系与远端占格去向，而不是只判断黏块能否移动。

structure_family_hypothesis: >-
  使用预制四格 T 形作为小型异形；固定且不可操作的 P/L 只提供 push-to-pull 的动作语义切换，
  B/S 位于玩家无法直接到达的单向落点口袋。T 的中央脚是第一手近端施力端，左臂是第二手 pull 接触端，
  右臂是唯一能在第二手接触 B/S 的远端作用端。开局上下两条短路分别通向左臂上方与中央脚肩窝，
  让玩家必须选择操作面；目标紧邻 B/S 的下一停位，使远臂扫带立即兑现并结束。

reasoning_sketch:
  player_problem: >-
    题面给出一块已成形 T、封闭 B/S 目标口袋和固定 P/L。玩家需要判断怎样让 B/S 向下移动一格；
    锚点本体不可直接站位操作，而开局分岔允许从左臂上方把 T 向下推，或从肩窝改变 T 的横向位置。
  visible_premises:
    - T 形右臂与 S 端横向错开一格；直接下拉时右臂不会接触 S。
    - 上路可以把 T 整体下推，但会让中央脚进入封闭底袋并失去重新横向对准远臂的操作空间。
    - 玩家可从肩窝向右推动中央脚，推动后仍位于左臂下方并进入 pull 侧。
    - B 端正下方是唯一目标；B/S 下一停位被外墙包围，玩家不能从侧面或下方直接施力。
    - T 形向右后，远臂恰好位于 S 端上方；随后下拉会把 S/B 纳入同一 force chain。
  expected_judgment: >-
    玩家应预见“先右移改变远臂列，再下拉利用肩窝保留的近端把手”，并区分这与“直接下拉 T”所得动后状态。
  expected_operation_relation: >-
    从观察位走下路到肩窝 -> push right 移动完整 T 且进入 pull side -> pull down 移动完整 T；
    第二手中右臂推动 B/S 向下一格，近端左臂维持 pull 接触。
  feedback_and_ending: >-
    第二手同时显示 sticky 刚体下移、force chain、B/S 下移和 B 端覆盖目标；该动作后立即胜利，不追加清理。
  update_rule: >-
    若 replay、完整图或近邻反事实显示玩家可直接移动 B/S、无需 T 远臂、规整替代物保留同一胜法，
    或第一手只是强制动画，则从实际差异重构口袋、操作位或开局观察空间并形成新 exact。

packaging_intent:
  opening: 玩家在核心区左侧拥有一个小型可逆岔口，向上或向下都能到达一个可操作的 T 形表面。
  preparation: 只需选择上方左臂操作面或下方肩窝操作面；不要求构造、拼接或切割。
  reveal_or_use: 上路下推与下路横推的选择直接区分远臂是否能进入 B/S 作用列并保留第二手把手。
  ending: 正确第二手扫带 B/S 覆盖唯一目标后立即结束。

identity_counterfactual_plan:
  - 删除 T 形右端格成为 L 形：相同核心输入应不接触 B/S，目标保持空置。
  - 把 B/S 从远臂第二手目标格移开：T 仍可折向移动，但目标不应被覆盖。
  - 打开 B/S 口袋让玩家直接获得锚点把手：若出现不依赖 T 远臂的胜法，则结构责任失败。
  - 从上路直接把 T 向下推：应产生不同且不可胜的动后状态，证明玩家必须读取操作面与远端足迹。

archive_collision_account: >-
  本 family 不构造或反复使用 L 形活塞，不执行两阶段 B/S 推动与归位，不切开 C 形产生三输出，
  也不以 P/L 作 force-chain 推杆强推大黏块过 B/S；核心是一次 T 形近端把手与远臂扫带的耦合。

