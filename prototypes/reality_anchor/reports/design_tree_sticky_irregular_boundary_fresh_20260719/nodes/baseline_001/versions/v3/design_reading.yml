known_perceptible_defects:
  - 正确 commitment 后只剩一次强制兑现，没有持续多阶段推演；这是直白 baseline 的上限。
  - 顶部固定 P/L 主要承担语义边界，局部视觉反馈弱于 T 与 B/S；本体不移动。

