designer_claim:
  player_experience_core: >-
    玩家先从两根分离横条主动构造异形，再用近端右把手驱动完整形体；胜负由左下缺口避墙与远端上臂推动边界对象共同决定。
  player_action: >-
    先把下条右推一格，再从下方上推与固定上条合并成 S；绕到右侧 left，使完整 S 越过墙齿并推动 B/S。
  visible_payoff: >-
    终局左推同时移动四格 S、触发二对象 force chain、使 B/S 左移，并由 B 覆盖目标后立即结束。
  why_this_level_exists: >-
    把 baseline 的近端—远端联合读取向前生长：异形不再预制，玩家须依据后继完整运动主动选择合并偏移。
  work_identity_conditions:
    - 两横条开局分离，2x2 与 S 两种合并都合法且都保留同方向右把手。
    - S 左下缺口避开墙齿，上层远端格在同一 left 中接触 S 端并推动 B/S。
    - 上条在合并前不可单独操作，B/S 不能由玩家直接取得获胜把手。

growth_account:
  parent_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/nodes/baseline_001
  frozen_parent_core: 异形刚体把近端操作面与远端作用格绑定，远端作用不可直接操作的边界对象后立即结束。
  added_construct_prefix: 从两个局部均可行且都保留后继把手的合并中，根据后继完整轮廓主动构造 S。
  non_splicing_verdict: passed
  non_splicing_reason: 构造无独立结算；紧接的同一 left 同时消费缺口与远端接触，并直接结束。
  deliberately_not_inherited: 不继承 parent 地图、预制 T、P/L pull 或上下操作路；只保持体验身份。

packaging_account:
  opening: 玩家在下条左侧，同时看见目标、B/S、上条、下条与墙齿；右侧活动室完整保留。
  preparation: 选择直接上推成 2x2，或先右移再上推成 S；两种合并都有真实动后状态和右把手。
  reveal_or_use: 同向 left 中，2x2 原子撞墙，S 以缺口避墙并由远端臂推动 B/S。
  ending: 正确终拍让 B 覆盖目标并立即胜利，无回收或清理。
  every_major_element_role:
    - 固定上条提供远端臂；其左格独占 B/S 接触责任。
    - 可移动下条承担构造选择，并形成近端右把手与左下缺口。
    - 墙齿是 S/2x2 shared consumer；移除会恢复 2x2 胜法。
    - B/S 同时封住上条左操作面并充当终局边界对象；B 左移覆盖目标。
    - 右侧活动室与下方回廊承担两种构造、观察和取把手换位，不提供直接 B/S 旁路。
    - 单层外墙只围合矩形；v1 的无责任纯墙列已删除。
  known_perceptible_defects:
    - 2x2 撞墙后正确偏移高度透明，重玩难度明显下降。
    - 正确合并后只有换位与一次兑现，没有第二次异形应用。
    - 顶行关系紧凑且目标方向清楚，整体处于难度 4 低端。

