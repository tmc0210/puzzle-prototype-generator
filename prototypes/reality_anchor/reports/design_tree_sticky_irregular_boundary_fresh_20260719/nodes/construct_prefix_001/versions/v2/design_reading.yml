known_perceptible_defects:
  - 2x2 终局撞墙后正确偏移会非常直接，重玩难度明显低于首次读取。
  - 正确 S 合并后只有换位与一次兑现，没有第二次形态应用。
  - 顶行目标、B/S 与上条紧密相邻，远端作用线较醒目，降低搜索负担。

designer_conclusion: >-
  current v2 的 replay、complete graph/opening、S/2x2 shared-consumer、远端臂反事实与裁边同构均支持原结构假设；
  construct_prefix 非拼接关系保持，轮廓更集中且无新增可感缺点，可以送交 fresh 独立审查。
