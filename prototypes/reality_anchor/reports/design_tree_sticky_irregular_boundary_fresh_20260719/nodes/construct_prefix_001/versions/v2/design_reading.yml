reasoning_sketch:
  player_problem: >-
    目标在 B 左侧，但 B/S 和上横条不可直接操作。下横条既能直接上推成 2x2，
    也能先右移再上推成 S；玩家必须依据稍后的同一左推选择构造偏移。
  visible_premises:
    - 两种合并都合法，且都保留下层右侧把手。
    - 左下墙齿只进入 2x2 左移的目标格，位于 S 的错位缺口。
    - S 上层远端格会在同一次左推中接触 S 端；B 左移一格即覆盖目标。
  expected_judgment: >-
    主动破坏整齐对齐，把下条先右移一格；所构 S 同时留下墙齿缺口与远端 B/S 接触臂。
  operation_and_feedback: >-
    right 横移下条，绕下方 up 合并成 S，再绕到右侧 left；终手同时移动完整 S、推动 B/S 并胜利。
  non_splicing_read: >-
    构造完成时没有独立结算；S/2x2 差异只由紧接的同一 left 动作消费，且该动作同时检验缺口和远端接触。

player_side_reread:
  opening_view: >-
    9x6 裁边后玩家仍从下条左侧看见顶行目标—B/S—上条、左下墙齿与完整右侧活动室；
    删除的只有不可达纯墙列。
  first_meaningful_choice: >-
    可以直接绕下方上推成 2x2，也可先把下条右推一格再上推成 S。两种构造都成功 merge，
    也都允许走到同一方向的右把手，答案不在构造合法性上提前泄露。
  viable_read: >-
    S 的错位左下缺口避开 [3,2] 墙齿，而上层左端仍能接触 S 端；终局 left 同时满足两项责任。
  dead_read: >-
    2x2 构造与取把手全合法，最后 left 才因左下格撞墙齿而 force_blocked，B/S 保持原位。
  payoff_and_ending: >-
    正确终拍由近端右把手驱动完整 S，远端臂将 B/S 左推，B 覆盖唯一目标后立即结束。

difficulty_read:
  target: 4
  verdict: supported_at_lower_edge
  player_reasoning_burden:
    - 主动放弃整齐 2x2，选择一格错位合并。
    - 两种构造都合法且都有同向把手，必须投影完整后继占格。
    - 同时跟踪左下缺口避墙与上层远臂接触 B/S 两项远近责任。
  limit: 2x2 试错会迅速暴露答案，且正确 S 合并后只有换位与一次兑现，故只主张难度 4 低端。

structural_responsibility:
  construction_prefix: 两根分离横条让玩家主动决定合并偏移；上条在合并前被边界与墙固定。
  irregular_body: S 的右把手、左下缺口与上层远臂必须属于同一合并刚体，并在终拍同时兑现。
  shared_consumer: >-
    当前墙齿让 2x2 同向 left 原子阻塞；移墙后同一 2x2 输入恢复合法并推动 B/S 获胜，证明形状选择由 shared consumer 产生。
  remote_arm: 删上层远臂后构造、merge、把手和左移全保留，但 B/S 不动且不胜。
  activity_room: 右侧活动室保留合并后绕位、观察与取把手空间；本 revision 没有继续裁剪。

growth_account:
  parent_core_preserved: 同一异形刚体仍把近端操作面与远端边界作用绑定，并在作用 B/S 后立即结束。
  added_construct_prefix: 异形不再预制；玩家必须根据后继完整运动，从两个均可行的合并中主动构造 S。
  non_splicing_verdict: passed
  reason: 构造差异没有独立结算，唯一后继对象动作直接读取并消费 S/2x2 轮廓。

