player_relation: >-
  玩家面对上下分离的两根横向黏条。上条被左侧 B/S 与右侧墙封住，不能单独操作；下条既可直接上推成 2x2，
  也可先右推一格再上推成错位 S。两种合并都给出下层右侧把手，玩家必须在构造时预见随后的整块左移：
  2x2 的左下格会撞墙齿，S 的缺口则让同一左推合法；与此同时 S 的远端上臂把 B/S 向左推进唯一目标。
  近端施力、远端触物与异形缺口在同一终局刚体动作中结算。

structure_family_hypothesis: >-
  把材料中的“两横条主动合并”压缩成一个封闭构造室，并把原本只证明通行性的墙齿动作改造成即时获胜动作。
  水平 B/S 同时承担上条左侧固定边界与终局远端对象：合并前它阻止玩家取得上条左把手，合并后只有错位 S
  能在避开左下墙齿的同时，用上层远臂推动 B/S 一格。2x2 与 S 都由玩家主动构造且都保留右侧把手，
  因而选择依据不是局部可操作性，而是对后续整块运动和远端接触的投影。

reasoning_sketch:
  player_problem: >-
    目标在 B 左侧一格，但 B/S 被上方横条从右侧抵住，玩家又无法进入目标行直接操作。玩家必须利用下方横条与上条合并，
    再从合并体右侧施力；问题是应让两条整齐重合，还是先造成一格错位。
  visible_premises:
    - 上条左邻 B/S、右邻墙且上方封闭，开局不能被单独横推或竖推。
    - 下条可从左侧右推，也可由下方直接上推；这分别通向错位 S 与 2x2。
    - 两种合并后，下层右侧都存在玩家可抵达的推动面。
    - B/S 左移一格即可让 B 覆盖唯一目标，且玩家不能直接进入 B/S 的右侧。
    - 2x2 左移需要占用墙齿格；错位 S 的左下缺口避开该格，而上层左端仍会接触 S 端。
  expected_judgment: >-
    玩家应在移动下条之前投影合并后的左侧轮廓，判断“整齐”会被墙齿锁死，而向右错一格会同时保留右把手、
    留出墙齿缺口并把远端上臂放到 B/S 的作用线上。
  expected_operation_relation: >-
    从下条左侧 push right 一格 -> 绕到其下方 push up，与上条合并成 S -> 绕到下层右侧 push left；
    最后一手推动完整 S，左下缺口避墙，上层远臂将 B/S 左推一格。
  feedback_and_ending: >-
    正确最后一手同时出现 sticky 合并体刚体左移、B/S force chain 左移和 B 覆盖目标，并立即胜利。
    2x2 的同方向尝试应产生原子阻塞，给出可读但不代替预判的反馈。
  non_splicing_test: >-
    前缀不是独立钥匙制作：S 与 2x2 的差别没有在构造完成时结算，唯一回报是后继同一左推动作对完整轮廓的读取；
    若去掉墙齿或把 B/S 移出上臂作用线，构造选择就失去责任。终局也不新增另一种操作语法或清理阶段。
  update_rule: >-
    若实际 replay 显示上条可被提前推动、玩家可直接操作 B/S、2x2 也能获胜、存在不经两条合并的胜法，
    或正确构造被局部几何强制而不需预见终局，则按实际差异修改固定面、行走区或终局目标，不以声明覆盖实物。

packaging_intent:
  opening: 玩家从下条左侧开始，能看见上条、B/S、目标与左下墙齿之间的紧凑整体关系。
  preparation: 主动选择直接上推成 2x2，或先右推再上推成错位 S；两者都保留后继右侧操作面。
  reveal_or_use: 从右侧左推合并体，同一动作检验缺口、驱动完整异形并让远端上臂推动边界对象。
  ending: B/S 左移一格后 B 覆盖唯一目标，立即结束，不追加回收或清理。

parent_contrast:
  inherited_core: >-
    保留父节点“近端可操作面与远端足迹必须联合读取、远端作用边界对象后立即结束”的体验核心。
  added_relation: >-
    父节点开局已给出 T；本节点要求玩家先从两个局部均可行的合并方式中主动构造正确异形，
    构造差异只由随后整块运动与远端接触兑现。
  deliberately_not_inherited: >-
    不继承父节点地图、T 形、P/L pull 语义、上下路线或其具体 B/S 口袋；这里只冻结体验身份与对比关系。

identity_counterfactual_plan:
  - 去掉左下墙齿：2x2 的终局左推应恢复合法并形成额外胜法，证明缺口轮廓承担选择责任。
  - 去掉 S 的远端上臂格：终局异形仍可能左移，但不应推动 B/S 或获胜，证明远端格承担对象作用责任。
  - 把 B/S 移出上层作用线：构造与左移仍可能成立，但目标不应被覆盖。
  - 尝试直接上推形成 2x2：应保留右侧把手，但终局左推被墙齿原子阻塞。
  - 检查不合并、过度横移或从其他表面推动下条的路线：均不得产生绕过构造差异的胜法。

archive_collision_account: >-
  本节点不切割黏块、不构造并反复使用 L 形活塞、不执行两阶段 B/S 推动与归位，也不用 P/L 推杆强推大黏块过边界。
  唯一增长是两根短横条主动合并成 S 或 2x2，并由同一终局左推消费缺口与远端上臂。

