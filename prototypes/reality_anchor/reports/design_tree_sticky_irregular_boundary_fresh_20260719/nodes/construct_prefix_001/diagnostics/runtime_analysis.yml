bypass_and_solution_family_reading:
  result: one_player_logic_class
  support:
    - 完整图只有一个 winning state 与一个 winning region。
    - 可胜 SCC 子图无 branching 或 merging；初始 SCC 五个出口中只有 canonical S 合并出口可胜。
    - 终局 SCC 只有 canonical 左推一个出口，且该动作同时包含 sticky 刚体移动与 B/S 边界位移。
    - 2x2、过度搬动或其他合并结果可以合法出现，但不形成第二个可胜 SCC 分支。
  raw_variants: >-
    玩家可在初始 SCC 内走位、回退或多搬动下条后再恢复 canonical 对齐；这些不改变最终必须构造同一 S、
    从同一右把手左推、由同一远端上臂移动同一 B/S 的对象职责与因果顺序。

evidence_limits:
  - explain-layout 未返回 instance-level object participation；对象职责由精确状态格、事件和单变量反事实支持。
  - complete graph 支持当前 exact 的可达旁路和解族声明，不评价玩家是否觉得构造选择自然或困难。
  - 去墙齿反事实证明墙齿/缺口的机械责任，但其开放格也改变局部可走区域；这里只引用同一 2x2 输入恢复合法并获胜的直接结果。
  - 删远端上臂反事实只证明该格对相同核心输入的机械必要，不单独证明审美、难度或父子树关系。
