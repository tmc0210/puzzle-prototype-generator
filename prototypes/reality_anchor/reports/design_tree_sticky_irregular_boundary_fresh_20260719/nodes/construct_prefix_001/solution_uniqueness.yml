logic_class_account: >-
  完整图只支持一个玩家逻辑类：把下条右移一格，再从下方上推与固定上条合并成错位 S；
  随后绕到下层右把手左推完整 S，缺口避开墙齿，远端上臂推动 B/S 左移覆盖目标。
  可胜 SCC 路径只有 s0 -> s3 -> s4，分别由 S 合并和终局边界推动离开；不存在第二个可胜构造出口或第二个胜态。

known_raw_winning_variants:
  - 初始 SCC 内允许纯走位、回退或搬动下条后再恢复正确偏移；它们不改变最终 S 的占格、右把手、B/S 目标分配或因果先后。
  - agency r1 有两个可回到胜路的 commitment，但只有一个 progress/optimal；额外者属于合并前 detour，不形成另一构造答案。

equivalence_account: >-
  只把合并前可逆搬动与走位顺序视为等价。所有胜路最终必须形成同一四格 S
  [[5,1],[6,1],[6,2],[7,2]]，再从右侧左推，使同一上层远端格推动同一 B/S 到同一唯一胜态；
  对象职责、目标分配和不可逆因果顺序完全相同。

