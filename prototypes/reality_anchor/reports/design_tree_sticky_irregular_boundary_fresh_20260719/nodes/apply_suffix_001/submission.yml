experience_core_claim: >-
  玩家先构造一个右上错位 Z，而不是同样能完成眼前左推的 2x2。两种构造都能在 core 中把同一 B/S 左移、让 S 暂占边界下端目标；
  只有 Z 在动后保留可上推的近端操作面和能接替 S 的远趾。suffix 上推同一刚体时，远趾把 B/S 向上转角，
  B 覆盖上端目标，远趾原拍补住下端目标，后继因此反向决定此前的偏移构造。

parent_relation_claim:
  inherited: >-
    保留 parent 的主动两横条构造，以及“近端操作面与远端不规则轮廓由同一刚体动作耦合”的身份。
  growth: >-
    parent 在第一次边界动作就分出正确构造；本节点让 Z 与 2x2 都真实完成第一次 B/S 左移，
    再由同一边界覆盖的 suffix 交接反向筛选前序构造，增加的是后继应用而不是重复 core。
  non_splicing: >-
    suffix 没有新对象或独立清理；它继续移动 core 已触碰的同一 Z 与同一 B/S。上下目标是同一边界覆盖的两个连续职责，
    core 时由 B/S 暂时承担，suffix 时由 B 与远趾原拍交接。

