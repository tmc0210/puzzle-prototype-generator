    claim: canonical 8 拍全部合法并在最后一拍获胜。
    evidence_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/nodes/apply_suffix_001/canonical_replay.json
  - id: same_immediate_core
    claim: 正确 Z 与错误 2x2 都能用一次左推触发相同事件族并把 B/S 从 x=5 移到 x=4；该拍均不胜。
    evidence_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/nodes/apply_suffix_001/diagnostics/runtime_analysis.yml#square_counterplay
  - id: suffix_consumes_irregular_relation
    claim: 正确 suffix 同一拍移动完整 Z、上移同一 B/S，并由远趾覆盖 S 腾出的下端目标。
    evidence_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/nodes/apply_suffix_001/diagnostics/runtime_analysis.yml#canonical_replay
  - id: square_bypass_rejected
    claim: 2x2 可通过上抬与直接推锚让 B 到上端，但不能覆盖下端目标；该 14 拍回放合法且不胜。
    evidence_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/nodes/apply_suffix_001/diagnostics/runtime_analysis.yml#square_counterplay
  - id: complete_graph
    claim: 完整可达图有 176 状态、441 合法边、2 胜态；初始 4 个承诺仅 1 个可胜。
    evidence_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/nodes/apply_suffix_001/diagnostics/runtime_analysis.yml#complete_graph
  - id: unique_logic_family
    claim: 两个胜态属于同一 Z、同一对象终局、同一上移应用的两个玩家把手变体；不存在 2x2 胜利解族。
    evidence_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/nodes/apply_suffix_001/solution_uniqueness.yml

identity_counterfactual_results:
  - change: 删除下端覆盖交接目标。
    result: 已证实 2x2 深层旁路恢复获胜。
    identity_reading: suffix 不再反向筛选构造。
  - change: 把上端目标移到 core 后 B 所在格。
    result: Z 与 2x2 都在相同 core 左推后获胜。
    identity_reading: 两种构造的第一次边界动作确实等价完成。
  - change: 从 core 后正确 Z 删除远趾，保留近端上推面。
    result: 上推合法但 B/S 不动、不胜。
    identity_reading: 远趾是传递 anchor 作用并接替覆盖的因果部件。
identity_counterfactual_evidence_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/nodes/apply_suffix_001/diagnostics/runtime_analysis.yml#counterfactuals

attempt_account:
  v1: >-
    拒绝。单一上端目标允许 2x2 在 core 后整体上抬，腾出左下通道，再由玩家直接上推 B/S 获胜；
    这是完整图中的真实第三胜态，不是等价站位。
  v2: >-
    通过 designer runtime 与反事实检查。没有用墙封死 v1 旁路，而是把同一 B/S 上移必然腾出的边界下端覆盖交接纳入 suffix；
    2x2 仍能执行旁路的对象移动，但不能完成作品要求的同一边界应用。

quality_reading:
  strengths:
    - 错误构造真实完成 core，后继而非第一拍决定构造。
    - canonical 的 core 与 suffix 紧邻，结尾一拍同时显示近端传力、远端推锚与覆盖交接。
    - 深层 2x2 旁路被关系责任否决，而不是被路线墙齿否决。
  review_risks:
    - 独立 reviewer 需判断双目标是否被自然读成同一边界覆盖交接，而不是额外清单锁。
    - 独立 reviewer 需判断 core 后的第二个 Z 把手变体是否仍保持 suffix 的紧邻应用感。
  designer_reading_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/nodes/apply_suffix_001/design_reading.yml

