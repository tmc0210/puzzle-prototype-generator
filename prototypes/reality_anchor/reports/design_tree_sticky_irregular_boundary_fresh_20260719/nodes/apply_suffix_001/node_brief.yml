self_constructed_relation: >-
  把“两横条可合并成错位形或 2x2”的前序改造成右上错位 Z 与 2x2，并把局部墙齿 pass/fail 改为两拍同锚点转角应用：
  两种形状都能先把竖直 B/S 向左推动一格；只有 Z 在该动作后把玩家留在右上格下方，同时让左下趾贴住移动后的 S 端，
  因而可立即向上推动同一刚体，把 B 推到边界上端的同时以远趾补住 S 刚离开的下端目标，完整维持同一条边界覆盖。

player_relation: >-
  玩家从两条分离横条中选择合并偏移。直接上推得到 2x2；先把下条向左移一格再上推得到右上错位 Z。
  两者都能从下层右侧向左推动完整刚体，并在同一拍把竖直 B/S 向左移动一格，完成眼前的边界动作。
  但该动作后上端目标仍在 B 的上方、下端目标暂由 S 覆盖：Z 让玩家正好停在右上格下方，向上输入会推动完整异形，
  远端左下趾既把刚才移动过的 S 端向上顶，又在 S 离位后补住下端目标。2x2 则把玩家留在轮廓外的空列；
  它即使绕路抬起方块、再直接把 B/S 上推，也只能得到上端覆盖而暴露下端缺口，不能完成同一边界应用。

structure_family_hypothesis: >-
  使用一个竖直 B/S 作为两拍共享的边界责任对象。第一拍是横向 core：合并体左推并把 B/S 左移；第二拍是紧邻 suffix：
  玩家利用第一拍留下的正交近端操作面把同一刚体上推，异形远趾把已经左移的 B/S 转向上推；B 覆盖上端目标时，
  同一远趾接替 S 覆盖下端目标。2x2 与 Z 的第一拍都合法且产生相同 B/S 左移；只有完整的第二拍覆盖把它们重新区分，
  因此后继约束反向决定玩家此前是否先左移下条。

reasoning_sketch:
  player_problem: >-
    边界上端目标位于 B 的左上方，竖直 B/S 需要先向左再向上转角；横移后下端目标由 S 暂时覆盖。
    玩家必须让自己构造的黏块在第一次推动 anchor 后，同时留下一个可用的正交操作面和一个能在上推时接替 S 的远端占格。
  visible_premises:
    - 上横条被左侧 S 端、右墙与上方墙位限制，不能单独完成目标；下横条可直接上推或先左移再上推。
    - 两种合并体都能从下层右侧左推，且上层左格都会接触 S 端，使 B/S 向左移动一格。
    - B 左移一格后仍位于上端目标下方，而 S 正覆盖下端目标；必须上移 B/S，并在同一动作中补回 S 腾出的下端格。
    - 右上错位 Z 左推后，玩家位于其右上格正下方；同一形状的左下趾同时落在移动后 S 端正下方。
    - 2x2 左推后玩家位于方块右侧空列，向上不会接触黏块；其下排也没有伸到 S 端下方。
    - 2x2 可以绕行上抬并直接推动 B/S，但该路径会把 S 从下端目标移走，规则方块没有远趾可接替覆盖。
  expected_judgment: >-
    玩家应把“B/S 能否先左移”与“左移后能否在同一转角动作里迁移整条边界覆盖”分开读取：
    眼前第一拍不筛形，真正要求是构造一个在动后同时保留近端上推面、远端 anchor 接触趾与下端接替占格的错位 Z。
  expected_operation_relation: >-
    从下条右侧 push left 一格 -> 绕到下方 push up，与上条合并成右上错位 Z ->
    绕到下层右侧 push left，使完整 Z 与 B/S 同步左移 -> 玩家原地 push up，
    近端右上格驱动完整 Z，远端左下趾把同一 B/S 向上推，并接替 S 覆盖下端目标。
  feedback_and_ending: >-
    第一拍清楚显示 B/S 向左移动、下端目标被 S 覆盖但上端仍空；第二拍紧接显示异形正交移动、同一 B/S 向上转角，
    B 与远趾分别接管上下两个目标并立即结束。2x2 的第一拍同样成功，错误只在后续迁移覆盖时暴露。
  suffix_non_splicing_test: >-
    后继不引入新对象或独立任务；上下目标共同标示同一条边界覆盖，后继只继续使用第一拍已移动的同一 B/S、
    第一拍留下的玩家位置和同一异形刚体。若只要求 B/S 左移一格，Z 与 2x2 都是等价的 core 完成状态；
    正因为同一 anchor 上移时必须把下端覆盖交给构造体，玩家才必须在前序构造 Z。删除第二拍覆盖迁移会直接消除这项构造区分。
  update_rule: >-
    若实际完整图显示 2x2 或其它形状可在第一拍后同时覆盖上下目标，或第一拍只有正确 Z 能移动 anchor，
    则当前 suffix 关系失败；应按实际旁路责任修改同一边界应用，不得追加独立锁或第二段任务。

packaging_intent:
  opening: 玩家看见上下错开的两个边界目标、竖直 B/S、固定上条和可移动下条；目标关系提示要迁移整条覆盖而非只移动 B。
  preparation: 选择直接上推成 2x2，或先把下条左移一格再上推成右上错位 Z；两者都保留下层右侧横推面。
  reveal_or_use: 第一拍两种形状都能推动 B/S 左移；正确 Z 的动后近端面允许立即上推，并由远趾完成 anchor 转角与下端接替。
  ending: 第二拍让 B 与远趾同时覆盖上下目标，紧接核心边界动作结束，不追加回收或清理。

parent_contrast:
  inherited_core: >-
    保留 parent 的主动两横条构造，以及“近端操作面、异形缺口/错位轮廓与远端 B/S 作用由同一刚体动作耦合”的共享身份。
  added_relation: >-
    parent 的 S/2x2 在第一次边界左推即分出成败；本节点让两个构造状态都完成第一次边界动作，
    再由该动作留下的玩家位置、近端接触和远端趾决定能否把同一 B/S 转角到目标，后继反向约束前序构造。
  deliberately_not_inherited: >-
    不继承 parent 地图、S 朝向、水平 B/S、墙齿或一步结束结构；冻结 parent 只提供体验身份、合格 construct_prefix 与玩家关系对照。

identity_counterfactual_plan:
  - 直接构造 2x2 并完成第一次左推：应真实移动 B/S 一格但不胜；它可绕路把 B 推到上端目标，却会暴露下端目标。
  - 删除 Z 的远端左下趾：相同输入应保留近端上推，但第二拍不接触 B/S，目标保持空置。
  - 删除下端目标：2x2 的绕路上抬与直接推锚应能获胜，证明下端接替责任才反向区分构造。
  - 将上端目标移到 B/S 第一次左移后的 B 格：Z 与 2x2 都应在眼前 core 动作后胜利，证明 suffix 才反向区分构造。

archive_collision_account: >-
  本节点不切割异形、不构造并反复使用 L 形活塞、不执行同向两阶段 B/S 活塞推动与归位，也不用 P/L 推杆强推大黏块过边界。
  两拍只移动同一 B/S 一次向左、一次向上；作品关系是第一拍动后近端把手与远端趾共同允许转角 suffix，
  而不是重复活塞或锚点回收。

