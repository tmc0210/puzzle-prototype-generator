node_id: apply_suffix_001
candidate_id: RA_STICKY_IRREGULAR_APPLY_SUFFIX_001
exact_version: v2
reading_mode: designer_player_side_reread
layout_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_fresh_20260719/nodes/apply_suffix_001/layout.txt

visible_read:
  opening: >-
    两个目标在 B/S 左侧形成一条竖直边界：下端与 S 同高，上端在 B 的左上方。固定上横条贴着 S，
    可移动下横条与它隔一行。玩家首先读到的不是“把某件东西送到远处”，而是要先让 B/S 左移贴边，再把整条覆盖向上迁移。
  immediate_choices:
    - 直接从下方上推下横条，得到紧凑 2x2。
    - 先把下横条向左推一格，再从下方上推，得到右上错位 Z。
  tempting_wrong_read: >-
    2x2 更紧凑、合并更直接；它也确实能在左推时带动 B/S，使 S 覆盖下端目标，因此不是一眼可排除的假按钮。

moment_to_moment:
  construction: >-
    正确准备只多一个有意义的偏移：先左移下横条。绕到下方上推后，玩家能直接看见左下远趾、右上近端面与 B/S 的相对位置。
  core: >-
    从右侧左推时，Z 与 2x2 都让 B/S 左移；B 仍在上端目标下方，S 已压住下端目标。反馈明确告诉玩家“第一件事做对了，但覆盖还没迁完”。
  suffix: >-
    Z 的 canonical 动后站位正位于右上格下方；立即上推时，近端输入移动完整刚体，左下远趾同时顶起 S。
    B 覆盖上端目标，而远趾接替 S 覆盖下端目标，两个变化发生在同一拍并结束。
  wrong_construction_feedback: >-
    2x2 左推后，向上输入只会走进空格，首先暴露近端关系不对。即使玩家继续探索并找到“抬高 2x2、再直接上推 B/S”的绕法，
    最后仍会看见下端目标裸露在玩家脚下；错误由规则轮廓缺少接替趾解释，而不是由隐藏禁令解释。

insight_reading:
  primary_judgment: >-
    需要构造的不是任意能推动 anchor 的大块，而是一个在 core 动后仍有正交操作面、并能在 anchor 上移时把 S 的旧职责接过来的不规则轮廓。
  causal_chain:
    - 下横条左移，决定合并后的远趾位置。
    - 合并成 Z，保留右上操作面与左下接替趾。
    - core 左推，让两种构造都真实完成 B/S 左移，并让 S 暂占下端目标。
    - suffix 上推同一 Z；近端面传力，远趾推动 B/S 并补住 S 腾出的目标。
  why_suffix_reverses_prefix: >-
    若只看 core，Z 与 2x2 都合格；只有预见 B/S 上移时的覆盖交接，玩家才有理由在最初多做一次左移并构造 Z。

variant_reading:
  canonical_handle: core 后从右上格下方立即上推，零对象外步骤进入 suffix。
  equivalent_handle: 玩家也可在同一 core 后向下、向左绕两步，从下排右格下方上推同一 Z。
  classification: >-
    两种把手都只把同一 Z 向上平移一格，触发同一 B/S 上移与同一双目标覆盖，终局对象位置完全相同；
    它们不改变构造判断、对象顺序或边界责任，因此是玩家站位变体，不是第二解法。

quality_assessment:
  target_difficulty: 4
  stage: late_game
  strengths:
    - 错误 2x2 能完成 core，避免把构造选择退化为先验形状猜测。
    - canonical suffix 紧接 core，前序偏移在同一对象、同一边界上立即兑现。
    - 已证实的 2x2 深层旁路不是被墙硬封，而是由同一覆盖交接责任自然否决。
    - 结尾一拍同时展示传力、anchor 转角和远趾补位，反馈集中。
  watchpoints:
    - 双目标若被只读成“多盖一个格”会削弱作品感；玩家侧成立依赖它们在 core 时由 B/S 连续覆盖、在 suffix 时原拍交接，而非远处分散收集。
    - 地图短、执行轻，难度主要来自关系重读，不应包装成高操作压力关。
    - canonical 并非唯一输入串；独立 reviewer 应判断另一 Z 把手是否仍保留紧邻的同一应用感。
  rejected_revision_direction: >-
    不采用局部墙口封死 2x2 上抬路线；那会把错误反馈变成路线税，并不能说明为何异形正确。
  current_judgment: >-
    双目标不是事后补锁：下端目标在 core 时已由同一 S 覆盖，suffix 上移同一 B/S 必然腾空它；正确远趾在同一刚体动作里接替该格。
    三项反事实分别证明删除交接责任会恢复 2x2 胜利、把胜利提前到 core 会让两种构造都胜、删除远趾会让上推不再移动 anchor。

designer_verdict: submit_for_independent_review
