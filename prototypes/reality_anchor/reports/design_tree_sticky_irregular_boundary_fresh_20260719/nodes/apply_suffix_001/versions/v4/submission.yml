designer_claim:
  player_experience_core: >-
    玩家先构造右上错位 Z，而不是同样能完成眼前左推的 2x2。两种构造都能在 core 中把同一 B/S 左移、让 S 暂占下端目标；
    只有 Z 在动后保留可上推的近端操作面和能接替 S 的远趾。suffix 上推同一刚体时，远趾把 B/S 向上转角，
    B 覆盖上端目标，远趾原拍补住下端目标，后继因此反向决定此前的偏移构造。
  player_action: >-
    玩家必须从中立起点先走到操作位，主动选择偏移、合并 Z、用它左推同一 B/S，再从正交把手上推同一 Z 完成覆盖交接。
  visible_payoff: >-
    结尾同一拍中，B 登上上端目标，S 离开下端目标，Z 的左下远趾立即接替下端覆盖。
  why_this_level_exists: >-
    它让不规则轮廓的远端部分不只是形状标记，而成为后继边界转向和目标职责交接的必要执行部件；后继由此反向筛选看似同样合格的前序构造。
  work_identity_conditions:
    - 错误 2x2 必须也能完成第一次 B/S 左移，使选择不能靠眼前 core 判断。
    - 正确 Z 必须保留右上近端操作面和左下远趾，并在连续两次动作中作用于同一 B/S。
    - suffix 必须由远趾在同拍推动 B/S 并接替 S 腾出的下端目标。
    - 所有胜解必须保持同一构造、对象职责、目标分配和边界动作因果顺序。

parent_relation_claim:
  inherited: >-
    保留 parent 的主动两横条构造，以及近端操作面与远端不规则轮廓由同一刚体动作耦合的身份。
  growth: >-
    parent 在第一次边界动作就分出正确构造；本节点让 Z 与 2x2 都真实完成第一次 B/S 左移，
    再由同一边界覆盖的 suffix 交接反向筛选前序构造，增加的是后继应用。
  non_splicing: >-
    suffix 没有新对象或独立清理；它继续移动 core 已触碰的同一 Z 与同一 B/S。上下目标是同一边界覆盖的连续职责，
    core 时由 B/S 暂时承担，suffix 时由 B 与远趾原拍交接。

packaging_account:
  opening: >-
    玩家从 [5,6] 开始；up 和 left 都先走一格，第二拍才分别承诺 offset-Z 与 2x2。起点不直接把首个输入标成正确答案。
  preparation: >-
    正确路线只多一次有意义的下横条左移，再从下方把两横条合并成 Z；没有与核心无关的前置对象。
  reveal_or_use: >-
    Z 与 2x2 都先左推 B/S；只有 Z 随后的正交上推能让远趾推动同一 B/S 并接替下端覆盖。
  ending: >-
    suffix 上推一拍同时完成上端 B 覆盖和下端远趾接替，立即胜利，无高潮后清理。
  every_major_element_role:
    - 固定上横条提供 Z 的上臂和 suffix 近端操作面。
    - 可移动下横条的横向偏移决定远趾是否存在。
    - B/S 是两次连续边界动作和覆盖迁移的同一 consumer。
    - 上端目标要求 suffix 真正发生；下端目标要求远趾接替 S。
    - 中央与下方活动室承担两种 opening、构造分流、core/suffix 把手和等价把手绕位。
    - 单层外墙只界定目标通道和活动室；v3 的五列不可达纯墙已经删除。
    - 起点 [5,6] 让正确与错误构造都先站位、后承诺。
  known_perceptible_defects:
    - none_identified

