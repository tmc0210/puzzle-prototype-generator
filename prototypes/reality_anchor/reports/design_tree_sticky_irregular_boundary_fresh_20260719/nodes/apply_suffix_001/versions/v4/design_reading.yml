reasoning_sketch:
  player_problem: >-
    玩家要在两条都能完成眼前 B/S 左移的构造中，预见哪一种轮廓还能在下一拍把同一 B/S 上移，并接替 S 腾出的下端目标。
  visible_premises:
    - 两条黏横条一上一下；下横条既可向左偏移，也可直接上推。
    - B/S 左侧的两个目标属于同一竖直覆盖边界；第一次左移只能让 S 暂时压住下端目标。
    - 起点 [5,6] 与两种首个操作面都隔一拍普通走位，不直接替玩家标注正确构造。
    - 7x8 外轮廓已经是单层封闭边界；没有不可达厚墙板干扰活动室与目标口袋的读取。
  expected_judgment: >-
    规整 2x2 虽能推动 anchor，却缺少 B/S 上移时接替 S 的左下远趾；应先左移下横条，再上推合并成右上错位 Z。
  operation_relation: >-
    offset Z 左推同一 B/S 完成 core；随后上推同一完整刚体，近端面承受输入、远趾推动 B/S 并补住下端目标。
  feedback: >-
    core 后 B 仍在上端目标下方、S 暂压下端目标；suffix 一拍同时看到 B 上目标与远趾接替 S。2x2 即使深挖到直接上推 B/S，仍把下端目标留空。

visible_read:
  opening: >-
    两个目标在 B/S 左侧形成竖直边界：下端与 S 同高，上端在 B 的左上方。固定上横条贴着 S，可移动下横条与它隔一行。
    玩家从右下活动室开始，向上或向左都只是走一格；第二拍才分别触碰“先左移下横条”的 offset-Z 路线和“直接上推”的 2x2 路线。
  immediate_choices:
    - up 后 left：先把下横条左移一格，保留错位关系。
    - left 后 up：直接把下横条上推，与固定横条合并成规整 2x2。
  tempting_wrong_read: >-
    2x2 更紧凑、合并更直接；它也确实能在 core 左推中带动 B/S 并让 S 覆盖下端目标，因此不是假按钮。
  outline_trim_reading: >-
    v4 只删除 v3 左侧三列、右侧两列不可达纯墙，保留原 x=3..9 的完整棋盘。动态格、操作空间、两条首步、目标口袋和对象相对位置均只做 x-3 平移；
    玩家读到的是同一活动构图，但不再看见没有责任的厚墙板。完整标注图同构证明动作与事件没有被外框压缩改写。

moment_to_moment:
  construction: >-
    正确准备只多一个有意义的偏移：先左移下横条。绕到下方上推后，玩家能直接看见左下远趾、右上近端面与 B/S 的相对位置。
  core: >-
    从右侧左推时，Z 与 2x2 都让 B/S 左移；B 仍在上端目标下方，S 已压住下端目标。反馈说明第一次边界动作成立，但覆盖尚未迁完。
  suffix: >-
    Z 的 canonical 动后站位正位于右上格下方；立即上推时，近端输入移动完整刚体，左下远趾同时顶起 S。
    B 覆盖上端目标，而远趾接替 S 覆盖下端目标，两个变化在同一拍发生并结束。
  wrong_construction_feedback: >-
    2x2 左推后，直接向上只会走进空格，先暴露近端关系不对。即使继续探索到“抬高 2x2、再直接上推 B/S”，
    最后仍会看见下端目标只被玩家站住；规则明确规定玩家不算覆盖。

insight_reading:
  primary_judgment: >-
    需要构造的不是任意能推动 anchor 的大块，而是一个在 core 后仍有正交操作面、并能在 anchor 上移时把 S 的旧职责接过来的不规则轮廓。
  causal_chain:
    - 下横条左移，决定合并后的远趾位置。
    - 合并成 Z，保留右上操作面与左下接替趾。
    - core 左推，让两种构造都真实完成 B/S 左移，并让 S 暂占下端目标。
    - suffix 上推同一 Z；近端面传力，远趾推动 B/S 并补住 S 腾出的目标。
  why_suffix_reverses_prefix: >-
    若只看 core，Z 与 2x2 都合格；只有预见 B/S 上移时的覆盖交接，玩家才有理由在最初选择 offset 路线。

work_identity:
  experience_statement: >-
    玩家构造不规则 Z，使同一完整刚体的近端操作面和远端趾在连续两次边界移动中分工；第二次移动把 B/S 转向上推并原拍完成覆盖交接。
  player_action: >-
    玩家必须亲自选择偏移、合并 Z、用它左推同一 B/S，再从正交把手上推同一 Z 完成 B/S 上移。
  visible_payoff: >-
    结尾同一拍中，B 登上上端目标，S 离开下端目标，Z 的左下远趾立即接替下端覆盖。
  core_boundary:
    central_objects: [two_sticky_bars, merged_offset_z, box_sticky_anchor, upper_goal, lower_handoff_goal]
    supporting_objects: [single_layer_outline_walls, player_start]
  identity_conditions:
    - 正确构造必须保留右上近端操作面和左下远趾，而错误 2x2 也必须能完成第一次 B/S 左移。
    - core 与 suffix 必须继续作用于同一 Z 和同一 B/S，不能换成独立清理对象。
    - suffix 必须由远趾在同拍推动 B/S 并接替 S 腾出的下端目标。
    - 所有胜解必须保持同一构造、对象职责、目标分配与两次边界动作因果顺序。
  identity_counterfactuals:
    - 删除下端目标，2x2 深层路线恢复为胜解，后继不再筛选构造。
    - 把胜利目标移到 core 后 B/S 已覆盖的位置，Z 与 2x2 都在 core 获胜，suffix 身份消失。
    - core 后删除 Z 的左下远趾，上推仍合法但不再移动 B/S，也不能获胜。

variant_reading:
  canonical_handle: core 后从右上格下方立即上推，零对象外步骤进入 suffix。
  equivalent_handle: 玩家也可在同一 core 后向下、向左绕两步，从另一处下方把手上推同一 Z。
  classification: >-
    两种把手都只把同一 Z 向上平移一格，触发同一 B/S 上移与同一双目标覆盖，终局对象位置完全相同；
    它们不改变构造判断、对象顺序或边界责任，因此是玩家站位变体。

growth_account:
  inherited_core: >-
    保留 construct parent 的主动两横条构造，以及近端操作面、错位轮廓与远端 B/S 作用由同一刚体动作耦合的作品身份。
  added_apply_relation: >-
    parent 在第一次边界动作就区分 S/2x2；本节点让 Z 与 2x2 都先完成同一 B/S 左移，再由该动后状态能否上移同一 B/S 并交接下端覆盖反向筛选前序构造。
  non_splicing: >-
    suffix 不引入新对象或独立任务；它继续消费 core 已移动的同一 Z、同一 B/S、同一双目标边界和 core 留下的玩家位置。

quality_assessment:
  target_difficulty: 4
  stage: late_game
  strengths:
    - 正误构造都先经一拍站位、第二拍才承诺，起点不替玩家标注答案。
    - 错误 2x2 能完成 core，后继而非第一拍决定构造。
    - canonical suffix 紧接 core，前序偏移在同一对象、同一边界上立即兑现。
    - 结尾一拍同时展示传力、anchor 转角和远趾补位，反馈集中。
    - 纯墙裁边只收回无责任轮廓，没有牺牲活动空间或 opening comfort。
  known_perceptible_defects:
    - none_identified
  review_risks:
    - 双目标若未被玩家读成同一边界的暂占与交接，可能只像“多盖一个格”；fresh reviewer 需从实物独立判断。
    - canonical 并非唯一输入串；另一把手多两拍普通走位，但不改变对象逻辑。
  evidence_boundary: >-
    图、replay、反事实与同构只支持可解性、解族、机械身份责任和纯裁边不变量；不证明审美、实际难度或玩家偏好，也不让 v4 继承 v3 review。

designer_verdict: submit_for_independent_review
