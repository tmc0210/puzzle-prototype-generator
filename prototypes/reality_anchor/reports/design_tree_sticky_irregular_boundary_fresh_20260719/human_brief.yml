task_id: RA_STUDIO_STICKY_IRREGULAR_BOUNDARY_FRESH_20260719
human_confirmation: confirmed_2026-07-19
task_class: prototype_specific_level_design
prototype_id: reality_anchor
freshness_requirement: fresh_required

experience_seed: >-
  围绕黏块构成的 L 形、俄罗斯方块形等小型异形结构，研究它们在墙口、墙边和锚点边界附近的
  可动性、动作可逆性与动作后的状态变化。形状、构造和切割方式不受限制；不同设计树节点可以
  使用不同异形，但每个节点的核心思考与高潮必须仍由异形黏块的具体几何和边界关系主导。

work_identity_boundary:
  - 异形黏块必须是核心操作对象，其占格拓扑实际改变关键操作关系；规整替代物不能保留同一套核心判断。
  - 墙口、墙边或锚点边界必须承担结构责任，实际改变异形的合法动作、操作位、回返性或后续状态。
  - 玩家必须亲自读取并利用异形动作前后的状态差异，不能只观看强制机制动画。
  - 构造、拼接、切割可以服务核心，但不能完成后退休成与异形高潮割裂的独立子题。
  - P/L 或 B/S 锚点及其移动只能有机改变或利用异形边界关系；不能让“锚点也可以被推拉”取代异形核心。
  - 生长节点只能以 construct_prefix 或 apply_suffix 非拼接地改变玩家与同一核心的关系。

player_prior:
  - 关卡位于游戏后期。
  - 玩家已充分熟悉规整形状小黏块组的可达性与可动性。
  - 玩家已充分熟悉黏块拼接、切分及相关状态变化。
  - 玩家已充分熟悉 B/S 锚点推拉、P/L 锚点及各类基础腾挪技巧。
  - 上述知识不作为教学内容、规则记忆测试或虚构难度来源。

allowed_mechanisms:
  - 小型异形黏块刚体移动与墙或棋盘边界阻挡
  - 黏块拼接与切分
  - B/S 锚点边界及其移动
  - P/L 推拉区域及其移动，但仅限与异形黏块有机结合
  - 推拉锚点自身被推动或拉动，但不得成为主要体验核心
  - 当前 Reality Anchor 规则中已属于玩家前序的基本推拉、力链和目标覆盖

level_constraints:
  expected_difficulty_range: [3, 5]
  stage: late_game
  different_sticky_shapes_across_nodes: allowed
  identity_and_climax_must_remain_seed_centered: true
  avoid_collision_with_archived_irregular_sticky_levels: true
  difficulty_is_player_side_not_tool_complexity: true

additional_archive_calibration:
  classification_only: true
  forbidden_as_design_material: true
  refs:
    - candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0010.md
      calibration_role: baseline
    - candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0015.md
      calibration_role: growth_slot_1
    - candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0011.md
      calibration_role: growth_slot_2
  calibration_core: 推拉锚点也可以被推拉
  use_boundary: >-
    只校准同一关卡组中 baseline 与两个生长档位的分类角色和差异程度；不提取布局、结构、机制组合、
    包装或高潮作为本任务设计素材，也不得提供给 task-local Explorer。

review_constraints:
  - fresh Explorer 不读取归档、历史候选、旧 reports、旧 exact、旧审查或 Designer 设想。
  - 每个新 exact version 使用 fresh evidence reviewer 与 fresh level reviewer。
  - 同一 exact version 的阶段 A 与阶段 B 由同一 fresh level reviewer 连续完成。
  - 不预设冻结节点数量；由存活节点的阶段 B 决定树的生长方向与充分性。
  - 独立审查从熟练后期玩家侧判断，不把规整黏块基础腾挪、机械试错或 solver 复杂度当作作品价值。

