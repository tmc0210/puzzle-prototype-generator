experience_core:
  experience_statement: >-
    熟练玩家面对一个紧邻墙口、墙边或锚点边界的小型异形黏块，先把它读成一个因轮廓不齐而难以安全折向、贴边或回返的刚体；
    随后玩家从其偏置操作面主动施力，让完整异形在一个紧邻的核心动作组中移动：近端轮廓维持玩家的施力或回返关系，
    远端突臂或错位占格同时接触、避让或扫带边界责任对象。玩家由此亲眼看到，同一次刚体运动因具体形状而得到规整替代物无法保留的合法动作和动后状态。
  visible_setup: >-
    开局或核心阶段清楚展示一块小型连通异形、一个承担责任的墙口/墙边/锚点边界，以及异形近端操作面与远端轮廓将同时受到约束的空间矛盾；
    玩家可以先观察这一关系，不靠隐藏信息或规则记忆猜测。
  player_action: >-
    玩家比较异形不同操作面和移动方向，预见完整占格集合在下一步或紧邻短序列中的去向，再亲自推或拉整块异形，
    利用近端取得的操作关系让远端轮廓在边界处完成所需接触、避让或扫带，并读取该动作是否保留回返或造成有意的状态承诺。
  visible_payoff: >-
    关键动作后，异形的近端与远端职责在同一画面中兑现：它仍保留所需操作/回返关系，而远端边界接触使通路、锚点、材料状态、对象位置或目标覆盖发生集中可见变化；
    近邻规整形或删去关键突臂的替代物会被阻挡、漏掉作用对象或留下不同的不可用状态。
  why_level_exists: >-
    它把玩家已熟悉的黏块刚体规则推进到真正由二维拓扑主导的空间推理：玩家不是处理一个更大的箱子，也不是观看合并切割动画，
    而是把异形的不同部位当作同一动作中的操作端和边界作用端，预见并利用动作后的具体状态。
  core_boundary:
    central_objects:
      - 一块在核心动作时保持连通的小型异形黏块及其具体占格拓扑
      - 异形近端的偏置操作面、肩窝、缺口或等价施力关系
      - 异形远端突臂或错位轮廓在同一核心动作组中的边界接触范围
      - 实际改变动作合法性、操作位、回返性或动后状态的墙口、墙边或锚点边界
    supporting_objects:
      - 仅提供推拉语义或站位转换的 P/L 锚点
      - 仅作为可动边界、材料结算或可见反馈载体的 B/S 锚点
      - 用于收束和显示动后状态的目标、箱子、墙体或必要空地

work_identity:
  conditions:
    - >-
      核心动作时必须存在一块连通的小型异形黏块；其具体二维拓扑至少形成两个不重合的职责区域：近端负责玩家施力或保留操作关系，远端负责边界接触、避让或扫带。
    - >-
      近端与远端职责必须由同一个刚体动作或紧邻且不可拆开的核心动作组耦合；若拆成两个独立对象或两个退休子题，作品身份不成立。
    - >-
      墙口、墙边或锚点边界必须对该异形的合法动作、操作位、回返性或动后状态承担可验证的结构责任，而不是视觉布景。
    - >-
      玩家必须先读取完整占格集合的后继位置，再亲自选择操作面、方向和时机执行关键推拉；不能只执行显然唯一动作或观看强制结算。
    - >-
      关键动作后的差异必须立刻可见并被当前关卡消费；高潮后尽快结束，支持对象不得在异形关系结束后另起主要子题。
    - >-
      不同树节点可以使用不同异形、不同边界和不同局部结构，但都必须保持“近端操作关系与远端边界作用由同一异形刚体耦合”这一玩家关系。
  counterfactuals:
    - >-
      把异形替换为等数量的直条、矩形或其它规整黏块后，若相同操作面、方向、边界作用和动后状态仍全部成立，则具体拓扑没有承担责任，已不是本作品。
    - >-
      删去关键突臂、补平缺口或把偏置轮廓改成近邻形状后，至少应失去远端接触、合法通行、操作位、回返或所需动后状态之一；否则形状差异只是装饰。
    - >-
      移走负责的墙口/墙边/锚点边界、把开口放宽或预先把边界对象移到结果位置后，若核心判断仍原样成立，则边界没有结构责任。
    - >-
      把近端把手与远端作用端拆成两个可独立操作对象后，若玩家仍做同一判断，则刚体耦合没有成为体验核心。
    - >-
      若构造、拼接、切割或锚点搬运完成后全部退休，异形高潮可以单独解决，则新增流程是拼接子题，不属于共享作品身份。
    - >-
      若关键动作被做成无需比较形状后继位置的强制动画，或工具标签齐全但玩家只做普通腾挪，则主动几何读取已经丢失。
  archive_collision_boundaries:
    - >-
      不复刻 RA_CAND_0025 的“横向三格经 B/S 切端、构造 L 形、反复作活塞并由双目标提示消费”的完整关系；换朝向、坐标或墙皮不构成新作品。
    - >-
      不复刻 RA_CAND_0029 的“两阶段用上方黏块以不同活塞结构推动 B/S 并最终归位”的完整关系。
    - >-
      不复刻 RA_CAND_0020 的“固定 B/S 切开 C 形为上下 sticky 端点与中心 crate bridge，再以对称重复分支消费三个输出”的关系。
    - >-
      不复刻 RA_CAND_0021 的“P/L 作 force-chain 推杆强推 C 形或近邻大黏块过固定 B/S，再把切开端点送入墙齿目标”的关系。

level_brief:
  baseline_packaging_intent: direct_clear_realization
  expected_difficulty: 3
  tree_expected_difficulty_range: [3, 5]
  stage: late_game
  expected_scale: >-
    紧凑、小到中小型；只保留一块核心小型异形、一个明确负责的边界关系和兑现动后状态所必需的最少支持对象，
    不用大地图或多机制数量制造分量。
  expected_player_load: >-
    baseline 让熟练玩家在清楚题面中进行一次真实但可读的二维后继投影：同时跟踪近端操作关系与远端占格去向，并判断动作后是否仍可操作或可回返。
    难度来自这项非显然几何耦合，不来自规则教学、长走位、重复处理、机械试错或 solver 搜索量。
  baseline_setup_policy:
    - 可以直接给予已经成形的异形和核心边界局面，不要求 baseline 主动构造形状。
    - 核心关系必须由玩家主动完成，不能是开局贴脸触发的强制 witness。
    - 对预期难度 3，起点应提供与题面相称的观察和站位空间，再进入关键不可逆承诺。
    - 关键动作后只保留必要的可见兑现与短收束，不追加清理劳动。
  non_goals:
    - 不把可动锚点本身设为主要谜题。
    - 不把拼接、切割或事件覆盖数量设为 baseline 目标。
    - 不在本 brief 中指定具体异形、操作方向、目标数、步数、坐标或 structure family。

