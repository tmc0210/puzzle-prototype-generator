  - Explorer 的 raw runs，除非未来 assignment 明确授权
  - 旧 reports、旧 exact、旧审查、旧 critic 或未归档自评

prototype_specific_routing:
  - 每个节点设计前及每次处理教练意见前，读取 assignment 指定的最新 task-local lexicon 与索引；新材料不得静默改变正在验证或送审的 exact。
  - 后续节点 assignment 才能进入 layout、solve instance、非空 replay、玩家侧重读和解族唯一性自查；本 brief 不授予该阶段资格。
  - 新局部材料缺口必须先抽象成与候选坐标、包装和 family 去留无关的设计空间，再由 Controller 调度 Explorer。
  - Reality Anchor 的 invalid_goal_prune、opening_comfort_check 与 redundant_element_prune 都是原型专属 pre_submission_check；只在 Controller 后续正式分配时执行。
  - expected_difficulty 为 3，后续提交前 opening_comfort_check 适用；任何起点改动都会改变 solve instance 并要求重跑相关证据。
  - 提交前若存在多个目标、明显 leaf/pocket/thick border 或孤立对象，按 design_handoff 由 Controller 编排 goal prune 与 redundant element prune。

human_review_constraints:
  - fresh Explorer 不读取归档、历史候选、旧 reports、旧 exact、旧审查或 Designer 设想。
  - 每个新 exact version 使用 fresh evidence reviewer 与 fresh level reviewer。
  - 同一 exact version 的阶段 A 与阶段 B 由同一 fresh level reviewer 连续完成，阶段 A verdict 写定后才能读取本 brief 和树关系。
  - 不预设冻结节点数量，也不在本 brief 决定生长方向；由存活节点的阶段 B 判断下一关系与树的充分性。
  - 独立审查从熟练后期玩家侧判断，不把规整黏块基础腾挪、机械试错、事件标签或 solver 复杂度当作作品价值。
  - 阶段 A 独立 reviewer 自主完成其归档校准，不接受本 Designer 代选的唯一 anchors。

