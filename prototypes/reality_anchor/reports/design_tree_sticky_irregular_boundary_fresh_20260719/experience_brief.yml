    首批 T 形材料验证了一个可用局部词汇：肩窝侧提供近端把手，第二手移动时远臂比 L 形多覆盖一格，因而可扫带 B/S 或被同格墙阻挡。
    这只支持“近端施力与远端边界作用由同一异形刚体耦合”的抽象关系；本 brief 不选 T 形、right/down 次序、双锚组合或任何图示摆法为正式 family。
