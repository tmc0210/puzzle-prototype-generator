reviews:
  - case: CASE_B
    main_player_facing_merit: 切开的两箱先分置、再共同传力，短程内用途连续改写。
    dominant_aesthetic_problem: 最终三物链较难从静态布局预读。
    aesthetic_band: 4+
    verdict: playtest_worthy
    perceived_reversal: 玩家原本以为B/S锚点只是切开黏条的边界，后来发现同一锚点竟然要被三物链向上拉动并完成目标，因此边界本身也成了货物。
    reason: 分割、排布与终局传力收束成一个紧凑矛盾，反转清楚而非靠事件量取胜。

  - case: CASE_D
    main_player_facing_merit: 两类锚点接力改写材料形态，前后阶段互相设条件。
    dominant_aesthetic_problem: B/S三次往返与后段多次拉推使主线略显漫长。
    aesthetic_band: 4+
    verdict: playtest_worthy
    perceived_reversal: 玩家原本以为B/S锚点向右搬运黏料后即可留置，后来发现同一锚点竟然必须退回原侧，才能为后续切箱让路，因此外运其实是往返布置。
    reason: 往返并非纯复位，材料携带、切箱和P/L收尾形成强耦合；仍需实测确认过程可读性。

  - case: CASE_A
    main_player_facing_merit: 黏料在合并、切箱、重绑间反复换义，两锚点持续互锁。
    dominant_aesthetic_problem: 多轮重组相似，玩家可能只感到操作密集而抓不住阶段目的。
    aesthetic_band: 4+
    verdict: playtest_worthy
    perceived_reversal: 玩家原本以为被B/S切出的两只箱子已与黏体分家，后来发现同一材料组竟然还要重绑、再成形并再次切开，因此切割不是定型而是暂态。
    reason: 反复变形确有统一逻辑与终局回收，但信息负荷高，价值要由实际游玩验证。

  - case: CASE_G
    main_player_facing_merit: 巨型材料组的合体与拆体制造明确的先后次序矛盾。
    dominant_aesthetic_problem: 十一步纯走位与宽长通道稀释了关键洞见的密度。
    aesthetic_band: 4+
    verdict: playtest_worthy
    perceived_reversal: 玩家原本以为七格C形材料组应作为整体运输，后来发现同一材料组竟然必须切断三格连接并先安置上黏臂，因此合体是为精确拆体作准备。
    reason: 可行但不可回头的支线次序给反转真实后果；空间拖沓尚不足以掩盖核心结构。

  - case: CASE_C
    main_player_facing_merit: 一箱并入两格黏料，最终自然分派为三份覆盖三目标。
    dominant_aesthetic_problem: 合并后平移、切两箱、各自入位的展开过于顺承，矛盾偏弱。
    aesthetic_band: 2-3
    verdict: borderline
    perceived_reversal: 玩家原本以为三格黏条是统一搬运件，后来发现同一材料组竟然要被切成两箱一黏并分投三处，因此合并只是分配前的中间态。
    reason: 材料生命周期完整且易读，但解法更像按规则展开，缺少足以抬到高档的反直觉压力。

  - case: CASE_F
    main_player_facing_merit: 两箱、黏格与B/S在极小空间内连续互相传力。
    dominant_aesthetic_problem: 收尾下拉再上推若反馈不清，容易被体验成一次开关往返。
    aesthetic_band: 4+
    verdict: playtest_worthy
    perceived_reversal: 玩家原本以为被推到上方目标的B/S锚点已经就位，后来发现同一锚点竟然还须下拉传力再推回，因此终点同时是中继位。
    reason: 离开已覆盖位置再回归的矛盾紧凑鲜明，且前置箱与黏料合并共同支撑这一动作。

  - case: CASE_E
    main_player_facing_merit: 同一批材料反复切开与重组，末步一次覆盖双目标有回收感。
    dominant_aesthetic_problem: L形的切、并、再切重复过多，七步纯走位又削弱中段张力。
    aesthetic_band: 2-3
    verdict: borderline
    perceived_reversal: 玩家原本以为从黏条右端切出的箱子应独立送位，后来发现同一格材料竟然要跨回边界并重组为L形，因此成箱只是暂借形态。
    reason: 反转成立且终局呼应，但多次近似往返让亮点迟迟不落地，尚难确认复杂度带来等量体验。

cross_case_notes: CASE_B与CASE_F最紧凑地把“已完成”的状态翻成中继状态；CASE_A、CASE_D靠多阶段耦合获得厚度，却更依赖实际可读性。CASE_G的合拆与不可回头次序最具结构后果，但走位稀释明显。CASE_C的分派过于顺承，CASE_E则让有效反转淹没在重复往返中；二者暂不宜仅凭机制覆盖量升档。
