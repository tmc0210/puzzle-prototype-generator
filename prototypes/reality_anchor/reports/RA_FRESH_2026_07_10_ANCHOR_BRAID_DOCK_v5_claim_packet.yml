candidate_version: RA_FRESH_2026_07_10_ANCHOR_BRAID_DOCK_v5
review_iteration: 2
claim_last_review: true
design_target:
  role: late_game_challenge
  aesthetic_score_target: "至少4，追求5"
  difficulty_score_target: "至少4，追求5"
design_claim:
  player_insight: >-
    目标 T 明示一横一竖两锚的终态，但两个二格锚点不能依次归位。P/L 必须先背离目标释放 B/S 抽取站位；
    B/S 中段率先完整泊位，却必须主动离开以腾出 P/L 把手；最后 B/S 左拉碰上 P/L，二锚同链共同闭合 T。
    核心洞见是“先泊—腾位—同泊”。
  causal_chain:
    - P/L 下移释放旧 L 半格
    - B/S 经旧 L 半格左拉
    - 两锚同链上移，B/S 完整临时泊位
    - B/S 右移撤销泊位并腾出 P/L pull handle
    - P/L 上拉到目标行但右错一格
    - B/S 左拉碰撞 P/L，二锚同链左移并同时完成 T
  why_not_execution: >-
    第一手对象动作背离目标；完整目标覆盖是必须撤销的把手债；最终一手同时移动两个不同锚点并兑现开局轮廓。
    每个位置同时承担目标、玩家站位、非接触半格门和 force-chain 垫片责任，难度来自未来把手而非路线长度。
  falsification:
    - 任一胜路绕过任一锚点位移、任一锚点 pull、两次 mixed chain 或中段/终局的 exact n2 transition
    - 规范解中的 P/L 下移没有产生随后被 B/S 左抽消费的站位
    - B/S 不必先完整泊位再腾位
    - final B/S pull 不同时移动 P/L
    - 体验主要是唯一显然动作、长走位或普通腾挪
target_role_notes: >-
  追求低噪声、短而强耦合的后期 challenge。没有材料对象，避免 B/S affordance 污染；
  4 格 T 负责开局终态提示和终局一手 payoff。
