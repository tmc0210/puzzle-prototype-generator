candidate_version: RA_FRESH_2026_07_10_ROLE_RELAY_REWEAVE_v1
review_iteration: 5
claim_last_review: true

slot_brief:
  intended_role: late_challenge
  target_role_notes: >-
    双可动锚、两箱、三目标的紧凑后期题；难度与审美均至少4并追求更高，
    但不预先主张5。核心目标是唯一职责链内的状态回读，不以多条可胜计划制造宽度。

design_claim:
  player_insight: >-
    开局二箱力链同时生成“底部已交付箱”和“仍需回收的上层载体箱”。玩家不能直接把载体
    上拉当作进展；精炼路线借竖放 P/L 的 L 行右拉、P 行左推，把玩家换回上层并复原抽取廊。
    接着连续左拉 B/S，把材质边界移入中廊；载体上抽后，B/S 下压并由 B 端接管中央目标。
    同一载体再被横抽过边界变为 M，绕右廊回访后拉入玩家刚站过的右目标。三个目标最终分别
    由原箱、B 锚、再生黏块接力完成。
  causal_chain:
    - P 侧向下推动二箱 force chain；远端箱覆盖底目标，近端箱留下为载体债。
    - 在 L 行右拉 P/L、在 P 行左推复位；墙廊把这两手变成不移动载体的换层通路。
    - 在 L 侧连续左拉 B/S 两格，把 B/S 分界从右廊定位到中央廊道。
    - 上抽载体；随后下推 B/S，让 B 端覆盖中央目标并腾出横向 pull 线。
    - 载体连续右抽，跨新边界变成 M；M 再右移一格，为右廊绕行留下把手。
    - 玩家绕到右目标并站上去；最后离开目标、把身后 M 拉入旧位才获胜。
  state_reuse_claim: >-
    中廊先是 P/L 回返与玩家换层通路，继而是 B/S 泊位、载体抽取线、C->M 跨界线；
    右廊先给锚点定位余量，后给 M 与玩家形成反向终局把手。每次回访看到的对象占用、
    动作语义和目标责任都已改变。
  unique_solution_claim: >-
    不可逆可胜子图只有一条 SCC 链，三个目标职责和 n2->P/L回返->B/S双定位->载体上抽->
    B接管->C转M->M交付的职责里程碑唯一。存在一条27步非最优路线，会先左拉 B/S 一格，
    再完成 P/L 往返，并于规范 step9 的 exact state 汇合；它交换同一准备段中的两项必要操作，
    不改变对象职责或后续里程碑。是否仍越过用户的“唯一解”口径必须由 critic 独立判断，
    designer 不用 one winning state 或 SCC 标签自证。
  why_not_execution: >-
    execution band 4 与 space-reuse band 5 只说明规范解紧凑且反复使用少量格子。
    4档主张只能来自玩家读出：二箱力链留下可回收载体、P/L 往返避免提前扰动载体、
    B/S 既定位材质线又承担中央目标、同一箱必须换成 M 才能从目标下方反向回填。
    若 P/L 往返只是路线机关、两次 B/S 左拉只是重复输入，或玩家无需理解目标接力即可沿廊执行，
    则指标不得补分，候选不合格。
  falsification:
    - 完整图、事件最低计数或目标角色证据出现旁路，核心 claim 失败。
    - 出现不同目标分工、不同载体、不同转换产物或不同不可逆 SCC 职责链的胜路，唯一职责链 claim 失败。
    - 独立 critic 若把27步准备交换判为第二解法，候选必须返工，不得提交。
    - 独立 critic 若判 P/L 往返/B/S双拉为执行税，或审美、难度任一低于4，候选不得提交。

