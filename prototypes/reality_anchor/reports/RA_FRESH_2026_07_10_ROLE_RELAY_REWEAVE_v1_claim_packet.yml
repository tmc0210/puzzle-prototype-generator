lexicon_used:
  - heading: P/L 横向把手：玩家前格门与锚点占格门
    realization: 竖放 P/L 在 L 行右拉、P 行左推复位；窄廊与回返格消费两套把手。
  - heading: P/L pull 抽取把手：前格门、占格目标门与扫带
    realization: L 侧先抽出水平 B/S，再从窄列抽出载体箱；对象目标格与玩家前格同时受限。
  - heading: P/L 边界交接 / 边界活塞本体谱：箱链残余债
    realization: P 侧推动二箱链后，远端箱留在底目标，近端箱成为后续独立抽取与转换的残余债。
  - heading: B/S 移动边界刷产物：远程生成与门口消费
    realization: 连续左拉把材质边界织入中廊，载体随后横抽跨界成为 M，并由右目标与绕行把手消费。

new_linkage: >-
  二箱残余债 -> P/L 双侧回返门 -> B/S 中廊定位 -> B 锚目标接管 ->
  残余箱跨界再生为 M -> 右目标反向交付。目标不是三个独立归位任务，
  而是箱、锚、黏块在一条职责链中的三段接力。
