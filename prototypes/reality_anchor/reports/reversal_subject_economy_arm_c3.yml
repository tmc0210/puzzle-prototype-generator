reviews:
  - case: CASE_G
    main_player_facing_merit: 合并再精确断开，使同一大形状兼具整体承载与分支次序锁。
    dominant_aesthetic_problem: 漫长接近与切割后的禁返回路，把核心洞见稀释成路线管理。
    aesthetic_band: 4+
    verdict: playtest_worthy
    reason: 上黏臂必须先行，使切割真正改写规划；但空间成本显著压低纯度。
    perceived_reversal: 玩家原本以为七格C形黏体应保持整体搬运，后来发现七格C形黏体竟须割断连接格并先处理上臂，因此合并只是为精确拆分。
    subject_cost_fit: borderline
    heaviest_cost_outside_subject: 切割前后的长通道回走，尤其十一格纯走位。

  - case: CASE_A
    main_player_facing_merit: 黏料反复合并、切箱、再黏和转向，两锚点持续改写其受力。
    dominant_aesthetic_problem: 状态转换过密，玩家可能只剩局部执行，难形成单一顿悟。
    aesthetic_band: 4+
    verdict: playtest_worthy
    reason: 每次重组都改变后续操控条件，复杂度大体被同一材料逻辑回收。
    perceived_reversal: 玩家原本以为合并后的黏体应保持成形推进，后来发现合并后的黏体竟须反复切开、再黏并转向，因此稳定形状反而只是暂态。
    subject_cost_fit: well_supported
    heaviest_cost_outside_subject: 两套锚点反复换位带来的操作负担。

  - case: CASE_D
    main_player_facing_merit: B/S往返搬料、P/L接管末段，呈现两类边界的连续传递。
    dominant_aesthetic_problem: 两阶段更像串联流程；后段锚点接管没有重释前段经验。
    aesthetic_band: 2-3
    verdict: block
    reason: 搬运和切箱各有功能，却没有一个玩家预期被翻转，长流程主要放大执行。
    perceived_reversal: none
    subject_cost_fit: structurally_underpaid
    heaviest_cost_outside_subject: 两套锚点串联造成的全程往返。

  - case: CASE_F
    main_player_facing_merit: 上方箱越界黏合，使B/S的下拉与回推成为同一短链的两面。
    dominant_aesthetic_problem: 末两步锚点原路复位，略像开关式收尾。
    aesthetic_band: 4+
    verdict: playtest_worthy
    reason: 箱、黏体与边界互相改写，反直觉集中，动作关系几乎没有空转。
    perceived_reversal: 玩家原本以为上方箱子应直接送往目标，后来发现上方箱子竟须越界并入黏体，因此它的价值是改造受力链而非占点。
    subject_cost_fit: well_supported
    heaviest_cost_outside_subject: B/S锚点的下拉再回推。

  - case: CASE_B
    main_player_facing_merit: 切开的两箱先分工定位，最终又合成三物受力链。
    dominant_aesthetic_problem: 中段分箱摆位偏程序化，结尾惊喜依赖受力链是否易读。
    aesthetic_band: 4+
    verdict: playtest_worthy
    reason: 分裂并非一次性效果，而是改写两份材料的职责并回收到结尾。
    perceived_reversal: 玩家原本以为两格黏体应作为整体运送，后来发现两格黏体竟须切成两箱分别布位，因此分裂后的独立性正是最终合力的前提。
    subject_cost_fit: well_supported
    heaviest_cost_outside_subject: 两箱分开布阵所需的绕行空间。

  - case: CASE_C
    main_player_facing_merit: 一箱并成三格黏条，再拆为两箱一黏格，三份各归目标。
    dominant_aesthetic_problem: 三个目标提前暴露拆分答案，切割后的配送近于清单。
    aesthetic_band: 2-3
    verdict: borderline
    reason: 形态闭环完整，但反转可由目标数预读，顿悟强度尚未稳到审美4。
    perceived_reversal: 玩家原本以为三格黏条应整体送达，后来发现三格黏条竟须拆成两箱和一格黏料，因此一次合并是在准备三路分工。
    subject_cost_fit: well_supported
    heaviest_cost_outside_subject: 切割后把三份材料分别送达的走位。

  - case: CASE_E
    main_player_facing_merit: 同一材料在箱与L形黏体间往返，重建后一次切出双目标。
    dominant_aesthetic_problem: 多次左右撤销相似状态，核心顿悟被往复执行冲淡。
    aesthetic_band: 2-3
    verdict: borderline
    reason: 身份反转成立，最终双覆盖也有回收；重复再黏却较少带来新理解。
    perceived_reversal: 玩家原本以为右端材料单元切成箱后应独立送达，后来发现右端材料单元竟须回界再黏、再度切分，因此成箱只是临时身份。
    subject_cost_fit: borderline
    heaviest_cost_outside_subject: 跨层绕行与多轮相反方向复位。

cross_case_notes: >-
  真正有力的案例都让同一具体材料的身份变化改写后续规划，而非只展示一次转换。A、F、B的外部对象大多服务于这一改写；C虽经济，三目标却过早泄底。G的先上臂约束提升了切割含义，但长通道索价偏高。D缺少自然的同主语反转，两套系统只形成接力。E有身份回转，重复复位却削弱收益。
