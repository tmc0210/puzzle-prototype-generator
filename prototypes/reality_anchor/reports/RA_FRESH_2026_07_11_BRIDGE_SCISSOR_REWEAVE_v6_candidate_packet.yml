candidate_id: RA_FRESH_2026_07_11_BRIDGE_SCISSOR_REWEAVE_v6
candidate_version: v6

prototype_context:
  confirmed_rules:
    - "P/L 将棋盘按锚点朝向分为推侧和拉侧；动作模式取玩家输入前所在侧。"
    - "B/S 将棋盘按锚点朝向分为箱侧和黏侧；合法动作后全图归一化。"
    - "相邻黏格自动拼成四邻接刚体；跨入箱侧的黏格变箱，剩余连通分量可分裂。"
    - "两格锚点是可移动刚体；力可沿方向传递。"
  win_condition: "结算移动、归一化和黏合后，六个目标全部由箱、黏格或任一锚点格覆盖；玩家不计。"
  object_and_event_semantics:
    - "M/m 是黏块格；m 同时带目标。C/* 是箱格；* 同时带目标。"
    - "anchor_boundary_shift:push_pull 与 anchor_boundary_shift:box_sticky 分别表示对应锚点发生平移。"
    - "sticky_to_box:n3 + sticky_split:n1 表示连接柱三格变箱，并把原 C 形剩余部分拆成两个端点。"
    - "box_to_sticky:n1 + sticky_merge:n1 表示中箱跨回黏侧并把上下端点桥接为三格竖条。"
  tool_boundary:
    - "solver 与 event-avoiding BFS 可证明可解、最短 cost、事件存在及特定事件的全胜路必要性。"
    - "300000 状态主图耗尽；不主张完整 SCC、唯一解或完整分支质量。"
    - "指标只描述规范解执行压力与空间复用，不证明洞见或审美。"

slot_brief:
  intended_role: game_late_dual_anchor_challenge
  target: "黏块拼接/切割的双锚点游戏末期困难关；要求难度至少4，审美至少4，追求更高。"
  difficulty_expectation: "4_or_higher"

mechanic_exposure_context:
  mechanic_window: dual_anchor
  allowed_exposure_through: dual_anchor
  claimed_core_events:
    all_solution_required:
      - anchor_boundary_shift:push_pull
      - anchor_boundary_shift:box_sticky
      - pull_object
      - sticky_to_box
      - sticky_split
      - move_sticky_rigid
    canonical_optimal_required_but_not_all_wins:
      - box_to_sticky
      - sticky_merge
    configuration:
      - push_pull_anchor_and_box_sticky_anchor_coexist

design_target:
  aesthetic_score_target: "4_floor_seek_5"
  difficulty_score_target: "4_or_higher"
  target_role_notes: >-
    目标难度来自三次可见的因果重读：先移动整块以制造锚点通道；再用另一锚点剪断旧桥；
    最后把被剪出的中箱作为新桥，由 P/L 同时承担推杆和左列中目标。避免靠纯路线长度或噪声增难。

solve_instance:
  layout: |-
    ###########
    ####PL#####
    ###..Mm.G##
    ###..MG.G##
    ###..Mm.G##
    ###...#####
    ###@BS..###
    ###########
  player_start: [3, 6]
  player_goal: null
  win_condition: all_targets_covered_by_objects

mechanism_scope:
  central:
    - "C 形黏块右移一格后，旧连接柱移到 x=6，原 x=5 竖列成为 P/L 的三格下拉通道。"
    - "P/L 从 y=1 连续下拉到 y=4，随后承担回推中箱与覆盖左中目标的双重职责。"
    - "B/S 从 x=4/5 右移到 x=6/7，把 x=6 三格连接柱切成三个箱并拆开 x=7 的上下黏端点。"
    - "规范最短路线把 x=6 中箱推到 x=7 黏侧，桥接上下端点成竖条，再把整条推至 x=8 三目标。"
  allowed_support:
    - walk
    - force_chain
    - target_vacate_and_refill
  incidental_allowed: []
  required_winning_path_events:
    - anchor_boundary_shift:push_pull
    - anchor_boundary_shift:box_sticky
    - pull_object
    - sticky_to_box
    - sticky_split
    - move_sticky_rigid
  forbidden_winning_path_events: []
  forbidden_if_seen_anywhere: []

player_reasoning:
  canonical_trace_ref: prototypes/reality_anchor/reports/trace_RA_FRESH_2026_07_11_BRIDGE_SCISSOR_REWEAVE_v6_CANONICAL.json
  player_goal:
    description: "让棋盘上的六个目标全部被箱、黏块或锚点格覆盖。"
    state_ref: trace_step_0
  reasoning_units:
    - id: RU1_make_anchor_chute_before_cut
      player_question: "先推 B/S 立即切桥，还是先移动完整 C 形？"
      premises:
        - statement: "初始 C 形连接柱位于 x=5；P/L 正在其上方 x=4/5，向下没有完整占格空间。"
          state_ref: trace_step_0
        - statement: "C 形右移到 x=6/7 后，x=5 从 y=2 到 y=4 全部空出，而左侧三目标暂由右移后的连接柱覆盖。"
          state_ref: trace_step_6
      conclusion: "先右移完整 C 形，用旧连接柱的空位制造 P/L 下拉通道；早切虽立即得到三个箱，却失去短路线的锚点通道。"
      operation_refs: [SEG1]
      alternative:
        status: exact_trace
        description: "开局立刻 right 推 B/S，马上触发切割，获得看似直接的局部收益。"
        local_gain: "第1步就出现 sticky_to_box:n3 + sticky_split:n1。"
        from_state_ref: trace_step_0
        exact_inputs: [right]
        blocked_operation: null
        result_state_ref: prefix_EARLY_CUT_step_1
        concrete_outcome: "仍可解，但最短后缀36步，总成本37；规范路线总成本21。"
      feedback:
        - state_ref: trace_step_6
          visible_change: "整块 C 向右一格；x=5 三格竖槽清空，P/L 正下方出现连续通路。"
    - id: RU2_pull_pl_through_reused_column
      player_question: "C 形右移后，为什么不能继续把它直接推向右目标，而要先处理 P/L？"
      premises:
        - statement: "第6步后玩家位于 x=5 的 L 侧，右方是 C 形；right 不再是 push，前格被占使动作失败。"
          state_ref: trace_step_6
        - statement: "玩家向下时，身后正是 P/L；刚清出的 x=5 竖槽允许二格锚点整体连续下移。"
          state_ref: trace_step_6
      conclusion: "利用侧别反转连续 down 三次，把 P/L 拉到 C 形下沿；它随后才能从下方回推并成为终局横向推杆。"
      operation_refs: [SEG2]
      alternative:
        status: structural_block
        description: "在第6步状态继续 right，试图把完整 C 形直接推向右目标。"
        local_gain: "若仍是推侧，可让 C 形更接近右列。"
        from_state_ref: trace_step_6
        exact_inputs: [right]
        blocked_operation: right
        result_state_ref: trace_step_6
        concrete_outcome: "玩家已处于 L 侧且前格被 C 形占据，动作非法；必须先使用 P/L 下拉通道。"
      feedback:
        - state_ref: trace_step_9
          visible_change: "P/L 从顶行移到 y=4，原三格空槽被锚点逐段穿过，右侧 C 形保持在位。"
    - id: RU3_cut_old_bridge_and_assign_outputs
      player_question: "B/S 应停在哪里，才会留下左列箱端、右侧分离端点和可重织的中箱？"
      premises:
        - statement: "右移后的 C 形连接柱在 x=6，端点在 x=7；B/S 初始边界不足以切过 x=6。"
          state_ref: trace_step_12
        - statement: "B/S 连续右推两格后，箱侧覆盖 x<=6，黏侧从 x=7 开始。"
          state_ref: trace_step_14
      conclusion: "将 B/S 推到 B=x6/S=x7，连接柱三格变成独立箱，上下端点留作黏块；左列上、下目标继续由箱覆盖，中箱留给 P/L 重织。"
      operation_refs: [SEG3]
      alternative:
        status: not_claimed
        description: "只推 B/S 一格会让边界停在 x=5，右移后的 C 形仍整体处于黏侧。"
        local_gain: "锚点更接近材料，但还未切断。"
        from_state_ref: trace_step_13
        exact_inputs: []
        blocked_operation: null
        result_state_ref: trace_step_13
        concrete_outcome: "尚无 sticky_to_box 或 sticky_split；核心材料分工没有发生。"
      feedback:
        - state_ref: trace_step_14
          visible_change: "x=6 变成三个箱，x=7 只剩上下两个分离黏端点；旧 C 桥被清楚剪开。"
    - id: RU4_reweave_middle_then_move_as_rigid_bar
      player_question: "切出的中箱与两个端点怎样同时满足左右两列三目标？"
      premises:
        - statement: "切割后 x=6 上下箱已经覆盖左列上下目标，中箱位于 x=6,y=3；x=7 上下端点彼此不相邻。"
          state_ref: trace_step_14
        - statement: "P/L 可从 y=4 上推回 y=3，并从左侧形成 P/L—中箱的同轴力链。"
          state_ref: trace_step_19
        - statement: "中箱进入 x=7 后位于黏侧，正好桥接 x=7,y=2/4 两端点。"
          state_ref: trace_step_20
      conclusion: "先用 P/L 把中箱推到 x=7 重拼成三格竖条，再继续推动整条到 x=8；P/L 停在 x=6/7，其中 P 格覆盖左列中目标。"
      operation_refs: [SEG4, SEG5]
      alternative:
        status: exact_trace
        description: "刻意避免 box_to_sticky/sticky_merge，改用逐个箱、端点和锚点覆盖六目标。"
        local_gain: "不必在第20步把中箱送回端点之间。"
        from_state_ref: trace_step_0
        exact_inputs: [up, up, right, right, down, left, left, down, right, right, up, up, up, up, down, down, left, left, up, up, right, right, left, down, right, left, left, down, right, right, left, up, up, up, right, down, right, right, down, up, left, left, left, down, right, up, right, right, left, down, left, left, down, down, down, right, up, up, left, up, right, left, up, right]
        blocked_operation: null
        result_state_ref: no_merge_bypass_step_64_win
        concrete_outcome: >-
          可胜但需64步。该路线在 C 形右移后立刻切桥，未先把 P/L 拉到底部形成共享推杆；
          随后分别抽走三只箱、逐个把上下黏端点送到 x=8 上下目标、把 P/L 泊到 x=8 中目标，
          再把三只箱逐个回填 x=6 三目标。它用“五个分件 + P/L 分别占位”替代一次重织，
          玩家概念更直白但必须维护更多独立对象、反复让位和回填；作为非阻塞逃课风险保留。
      feedback:
        - state_ref: trace_step_20
          visible_change: "x=7 中箱转黏并与上下端点拼成连续三格竖条。"
        - state_ref: trace_step_21
          visible_change: "三格条整体右移覆盖 x=8 三目标；x=6 上下箱与 P/L 同时覆盖左列三目标，立即胜利。"
  operation_segments:
    - id: SEG1
      step_range: "1-6"
      exact_inputs: [up, up, up, up, right, right]
      purpose: "走到 C 形左侧并把完整 C 形右移一格，制造 P/L 下拉槽。"
      supports_reasoning_units: [RU1_make_anchor_chute_before_cut]
    - id: SEG2
      step_range: "7-9"
      exact_inputs: [down, down, down]
      purpose: "在 L 侧沿空槽连续拉下 P/L。"
      supports_reasoning_units: [RU2_pull_pl_through_reused_column]
    - id: SEG3
      step_range: "10-14"
      exact_inputs: [left, left, down, right, right]
      purpose: "返回 B/S 左侧并右推两格，切开旧 C 桥。"
      supports_reasoning_units: [RU3_cut_old_bridge_and_assign_outputs]
    - id: SEG4
      step_range: "15-17"
      exact_inputs: [up, left, up]
      purpose: "走到 P/L 下方并把它推回中线。"
      supports_reasoning_units: [RU4_reweave_middle_then_move_as_rigid_bar]
    - id: SEG5
      step_range: "18-21"
      exact_inputs: [left, up, right, right]
      purpose: "从左侧用 P/L 推中箱重拼竖条，再把竖条整体送入右目标列。"
      supports_reasoning_units: [RU4_reweave_middle_then_move_as_rigid_bar]
  resolution:
    resolves: [RU1_make_anchor_chute_before_cut, RU2_pull_pl_through_reused_column, RU3_cut_old_bridge_and_assign_outputs, RU4_reweave_middle_then_move_as_rigid_bar]
    operation_refs: [SEG1, SEG2, SEG3, SEG4, SEG5]
    final_state_ref: trace_step_21
    visible_confirmation: "右列三目标被同一竖直黏条覆盖，左列上下为箱、中央为 P/L；六目标同时完成。"
  trace_partition:
    status: complete
    ordered_segment_ids: [SEG1, SEG2, SEG3, SEG4, SEG5]
    uncovered_steps: []
    overlapping_steps: []

