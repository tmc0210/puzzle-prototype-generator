      不用走位或 commitment 数量补难度；用可见半绑定近解的真实失败与完整绑定的
      反向计划选择争取难度 4。
  - id: PC-06
    response: revise_now
    action: >-
      保留 2x2 按列横切几何，但开放第二次 B/S 位移前的独立材料方案，并让该方案
      具备明确局部进展而非浅死分支。
  - id: PC-07
    response: accept_as_nonblocking
    action: >-
      三项原型专属提交前优化继续保持 proposal_ready 后执行，不用其为设计升档。
