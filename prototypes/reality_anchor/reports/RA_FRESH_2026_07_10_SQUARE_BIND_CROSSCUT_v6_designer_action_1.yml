      pull knot 且完整不可胜。完整 2x2 因此从强制动画改为对局部近解的主动否定。
  - id: PC-02
    response: revise_now
    action: >-
      把难度重心改为“保留独立箱的近解”与“牺牲独立性、先耦合搬运再解码”之间
      的状态重读；后续证据须展示具体诱饵动作、局部收益、死结原因与完整无胜枚举。
  - id: PC-03
    response: revise_now
    action: >-
      让横切后的竖黏条直接落到双目标列，删除 v6 的黏条回拉与七步换把手；同时
      墙化无职责开局观察袋，把规范解由 23 步压到 15 步。
  - id: PC-04
    response: accept_as_nonblocking
    action: >-
      不预宣称审美 5；以独立 critic 对 v7 的玩家侧闭环重新定标，硬门槛仍为 4。
