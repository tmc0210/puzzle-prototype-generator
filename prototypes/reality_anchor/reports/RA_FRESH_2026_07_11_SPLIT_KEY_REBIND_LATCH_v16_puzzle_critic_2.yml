  change_summary: >-
    主张与初审的保守读法一致：它把核心洞见限定为独立箱—共享刚体—切回箱—选择性重织的
    状态责任，把 P/L 限定为被抬升解锁的泊位，并明确不以 execution-pressure band 5 追认
    审美或难度 5。首轮 designer action 的七项 item 均已逐项处理；两项 blocker 已通过
    原型语义纠正、结构证据与主张降级消解，其余边界继续保留。
  change_reason: >-
    claim 没有把 sticky_split 冒充切割定义，也没有重新声称 P/L 会改变末段施力侧；falsification
    与完整 event gate 对齐。它没有提供足以消除 P/L 目标税、走廊脚本和终局立即重织边界的新材料，
    所以维持 proposal_ready_with_caveats 和 4/4、不支持 5。
  final_verdict: supports_with_noncore_caveats
  final_review_loop_state: proposal_ready_with_caveats
  final_required_action: none
