      claim_followup_effect: supports_difficulty_4_not_5
    - id: PC2_CUT_REWEAVE_PAYOFF_BOUNDARY
      status: remains_nonblocking_score_boundary
      claim_followup_effect: supports_aesthetic_4_not_5
    - id: PC2_OPENING_COMFORT_RISK
