      - player_insight
      - counterintuitive_reframe
      - surprise_and_payoff
  aesthetic_target_fit: >-
    支持审美 4 下界，不支持 5。相对 RA_CAND_0024/0027，v16 真实消费了共享黏块轮廓及其
    “造形—搬运—切开—重织”职责；相对 RA_CAND_0022，反直觉抉择不够鲜明；相对 RA_CAND_0017，
    P/L 只是被 U 形单向解锁的目标泊位，终局切织又以连续下压立即收束。整体主题完整、题面紧凑，
    但仍是保守低位 4，而非 5 分结构。
  difficulty_target_fit: >-
    支持难度 4，不支持 5。难点来自预测大黏块刚体轮廓、保存施力格、理解共享性先有利后有害，
    以及在切割后保留一格独立责任；这不是单靠 28 步长度成立。但中段动作受墙口强引导，P/L 是
    四次直线拉，终局是三次同向下压，一旦读懂相位后执行较显然，低于 RA_CAND_0017 的难度 5 标尺。
  critic_items:
    - id: PC2_PL_TARGET_TAX_BOUNDARY
      type: score_boundary
      target: role_fit
      claim_relation: >-
        本轮是双锚末期挑战；P/L 必须不仅“有移动”，还应检查其玩家侧责任是否足以匹配高耦合预期。
      evidence_basis: >-
        U 形抬升后才可进入上层，P/L 位移又是任何胜局的必要事件；但规范解 step18-21 只是从 L 侧
        连续横拉四格覆盖一对目标，之后 P/L 不再改变 B/S—黏块终局链。
      player_facing_reason: >-
        这是真实的一向依赖，所以不是 RA_CAND_0027 式可删装饰；然而玩家对 P/L 的决策基本是
        “通路打开后把它拉到底”，仍带目标税性质，只支持双锚 4 分下界，不支持 5 分高耦合。
      blocks_proposal_ready: false
      expected_designer_response: accept_as_nonblocking
    - id: PC2_CORRIDOR_SCRIPT_BOUNDARY
      type: score_boundary
      target: why_not_execution
      claim_relation: >-
        状态责任成立不等于整条解法都需要持续推理；需攻击墙口是否替玩家决定了后半动作。
      evidence_basis: >-
        规范解中 P/L 为四次同向拉，回程为固定上层通道，终局为三次连续 down；完整 graph 又未闭合，
        当前不能借分支事实证明这些走廊段具有额外选择质量。
      player_facing_reason: >-
        前半造形、吸收、抬升与末段材质重读提供结构难度；后半若玩家已找到正确相位，则较多动作
        由地形直接指示。该风险限制审美和难度上限，但不推翻现有 4/4 下界。
      blocks_proposal_ready: false
      expected_designer_response: accept_as_nonblocking
    - id: PC2_CUT_REWEAVE_PAYOFF_BOUNDARY
      type: score_boundary
      target: player_insight
      claim_relation: >-
        切割与重织需要是玩家理解的状态反转，而不能只凭 sticky_split 事件或视觉标签获得高分。
      evidence_basis: >-
        step27 触发 sticky_to_box:n3 与 sticky_split:n1，step28 紧接着 box_to_sticky:n2 与
        sticky_merge:n1 并获胜；另有 66 步胜路避开 sticky_split，但所有胜路仍必须 sticky_to_box。
      player_facing_reason: >-
        “切开三格、只重织两格、留一格独立”在材质分配上成立，足以满足拼接/切割 brief；但
        canonical 中切后没有新的绕位或分支选择，payoff 主要是早期状态的回读，支持 4 不支持 5。
      blocks_proposal_ready: false
      expected_designer_response: accept_as_nonblocking
    - id: PC2_OPENING_COMFORT_RISK
      type: nonblocking_risk
      target: role_fit
      claim_relation: >-
        晚期紧凑题仍应让玩家在首个不可逆材质承诺前读清 L 形、B/S、三箱和上层 P/L 债。
      evidence_basis: >-
        玩家出生在 L 形缺角旁，能在小口袋内先走动观察，未出生即触发；但首个有效对象动作基本是
        向右推出 L 形，随后下拉即一次性把三箱并入共享体，题面把首拍提示得很强。
      player_facing_reason: >-
        开局不是强迫即时提交，40 个 walkable cells 也比 v10 更有呼吸；不过自主试探余量仍有限，
        试玩需观察玩家是在读共享轮廓，还是只把开局体验为“沿缺角唯一方向按键”。
      blocks_proposal_ready: false
      expected_designer_response: accept_as_nonblocking
    - id: PC2_STICKY_SPLIT_SEMANTIC_NOTE
      type: diagnostic_note
      target: diagnostic_reading
      claim_relation: >-
        本轮“切割”按原型规则由 sticky_to_box 定义；sticky_split 只是可能伴随的拓扑后果。
      evidence_basis: >-
        禁用 sticky_to_box 的 BFS 在 2861 个可达状态闭合且无胜局；禁用 sticky_split 时存在
        66 步胜路，但该路线仍于 step38 触发 sticky_to_box:n3。
      player_facing_reason: >-
        玩家即使走长路避开 split 事件，也仍必须让黏块跨 B 侧恢复成箱，实际经历切割语义；因此
        该 bypass 不违反“涉及黏块拼接/切割”的 brief，也不能复用首轮的错误 blocker。
      blocks_proposal_ready: false
      expected_designer_response: accept_as_nonblocking
    - id: PC2_PARTIAL_GRAPH_BOUNDARY
      type: diagnostic_note
      target: diagnostic_reading
      claim_relation: >-
        graph 事实只限定可审边界，不证明唯一解、所有最短解、完整 SCC 或分支质量。
      evidence_basis: >-
        graph 在 1,000,000 状态预算耗尽，见到 1,000,001 个状态、2,416,276 条合法转移和 6 个胜态；
        complete graph claims 为 none。
      player_facing_reason: >-
        这些数字不能消除走廊脚本风险，也不能证明玩家必然以 canonical 的节奏理解 U 形；当前
        玩家侧 4/4 判断只依赖可见状态链与人评标尺，不依赖完整图外推。
      blocks_proposal_ready: false
      expected_designer_response: accept_as_nonblocking
  diagnostic_interpretations:
    - graph_fact: graph_exhausted_at_1000000_with_6_winning_states_seen
      neutral_meaning: >-
        预算内已找到胜态并枚举大量转移，但搜索未闭合，没有完整 SCC、全部胜路、所有最短解或
        分支结构结论。
      player_facing_interpretation: >-
        无法据此判断玩家会面对多少有意义的分支，也不能把该图事实用作“不脚本”或“必有洞见”的证明。
      verdict_effect: none
    - graph_fact: complete_event_avoiding_search_blocks_wins_without_sticky_to_box_but_not_without_sticky_split
      neutral_meaning: >-
        所有胜局都至少触发一次 sticky_to_box；sticky_split 不是所有胜局共有事件。
      player_facing_interpretation: >-
        每位通关玩家都必须经历黏块跨 B 侧恢复成箱的切割语义，但不一定观察到引擎记录的拓扑 split。
      verdict_effect: merit
  handoff_notes:
    - >-
      当前 critic 支持审美 4、难度 4，均不支持 5；这两个分数是人评档案校准后的试玩候选下界，
      不是工具指标自动得分。
    - >-
      P/L 的真实职责是“U 形抬升后才开放的一向目标泊位”；不要在后续文案中恢复“改写终局力侧”
      或“与 B/S 双向耦合”的旧说法。
    - >-
      开局舒适仍是提交前原型专属检查与试玩观察点；本次 critic 只把当前开局读法评为非阻塞风险，
      不把未来 pre_submission_check 当作现有设计优点或隐藏通过条件。

claim_followup:
