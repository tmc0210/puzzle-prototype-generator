critic_items:
  - id: CI3_NO_MERGE_ROUTE_CAVEAT
    type: nonblocking_risk
    target_ref: RU4_reweave_middle_then_move_as_rigid_bar.alternative
    design_relation: "玩家在 P/L 尚未拉到底时提前切桥，会得到 x=4 三箱与 x=5 两端点；随后不回织，而是分别送两端点、P/L 和三箱到 x=6/x=4 六目标，64步获胜。"
    attack: "该路线仍以六对象逐件分配为更直白的概念，穷举型玩家可能绕过重拼；因此不能声称 merge 是所有胜路硬门，也不能据当前材料主张审美5。"
    evidence_basis: "v7 facts、claim 与 submission delta 均保留同构64步路线，并明确其对象调度、让位和回填显著更笨重。"
    player_facing_effect: "替代路线不是短而干净的洞见路线，不推翻规范路线的核心因果或审美4下界，但应在试玩中观察自然发现率。"
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI3_RU3_ALTERNATIVE_THIN
    type: nonblocking_risk
    target_ref: RU3_cut_old_bridge_and_assign_outputs
    design_relation: "玩家把 B/S 停在 B=x4、S=x5 后得到三箱与两端点，后续让中箱回织、上下箱保留左列覆盖。"
    attack: "RU3 仍未单独给出另一个合法停位的局部收益与具体失败；该段独立看更接近精确对位，其推理价值主要由 RU1 早切反例与 RU4 后续消费承担。"
    evidence_basis: "v7 claim 沿用 v6 reasoning 并压缩为 relation；submission delta 明确 player_reasoning 语义未变，因此 v6 的该非阻塞边界也应保留。"
    player_facing_effect: "不破坏整体至少4的跨阶段难度，但限制难度5主张。"
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI3_AESTHETIC_FIVE_BOUNDARY
    type: score_boundary
    target_ref: target_scores.aesthetic
    design_relation: "规范路线将 x=4 中箱回织进 x=5 两端点并整体覆盖 x=6 三目标；逐件路线仍可避开回织获胜。"
    attack: "视觉紧缩与规范回织体验支持4分下界；在试玩确认玩家自然选择回织且逐件路线不稀释终局惊喜前，不支持5分。"
    evidence_basis: "RA_CAND_0025 提供强4紧凑构造下界，RA_CAND_0022 提供5分精巧构造正锚，RA_CAND_0024 提供机制承诺落空警戒；裁边不改变当前候选的核心分数边界。"
    player_facing_effect: "更紧凑画布减少视觉空耗，但玩家最终选择哪条路线仍决定回织惊喜是否成为主要体验。"
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI3_PRE_SUBMISSION_STAGE_ONLY
    type: diagnostic_note
    target_ref: pre_submission_stage
    design_relation: "exact v7 已按固定顺序完成 goal_prune、opening_comfort_check 与 redundant_element_prune，后者裁去三列纯外墙。"
    attack: "这些检查只记录提交阶段状态；不得把检查完成、目标保留或外墙裁剪流程本身当作玩家推理、审美或难度证据。"
    evidence_basis: "v7 facts 明确 quality_evidence=false，submission delta 也将 checks 与 exact version 完整性分开记录。"
    player_facing_effect: "只有裁边后的实际棋面呈现可被玩家感知；流程通过本身没有玩家侧效果。"
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI3_GRAPH_BUDGET_LIMIT
    type: diagnostic_note
    target_ref: graph_fact
    design_relation: "v7 图搜索保持 exhausted，完整图相关结论 unknown。"
    attack: "该事实不能用于宣称 unique、完整 SCC、完整分支质量或任何玩家侧优点。"
    evidence_basis: "facts 与 submission delta 均保留 graph exhausted 及 complete-graph claims unknown。"
    player_facing_effect: "不新增可感知关系，只限制最终结论范围。"
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking

