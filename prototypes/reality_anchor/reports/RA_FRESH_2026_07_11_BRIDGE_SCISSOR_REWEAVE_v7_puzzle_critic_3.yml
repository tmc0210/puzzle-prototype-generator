    reason: "只陈述六目标全部被对象覆盖，与 exact v7 的 x=4/x=6 目标列和 win_condition 一致，不预先泄露对象分工。"
  - unit_ref: RU1_make_anchor_chute_before_cut
    reason: "claim 将 C 形、空槽和 P/L 全部迁移为 x=3..4/x=3 的 exact v7 坐标；开局立即切桥仍是合法且有局部收益的37步替代，问题在行动前真实存在。"
  - unit_ref: RU2_pull_pl_through_reused_column
    reason: "C 形右移后继续 right 被挡，三次 down 把 P/L 拉入新槽；该锚点位置在 RU4 被消费为回推中箱的准备，不是走位复述。"
  - unit_ref: RU3_cut_old_bridge_and_assign_outputs
    reason: "B=x4/S=x5 的停位把 x=4 三格变箱并留下 x=5 端点，切后对象分别承担左列覆盖、中箱回织与右列端点责任；v7 坐标与 layout 对齐。"
  - unit_ref: RU4_reweave_middle_then_move_as_rigid_bar
    reason: "P/L、中箱和 x=5 端点缺口构成同轴关系；中箱回填后形成的新竖条才能整体送入 x=6 三目标，兑现前序让槽、拉锚和切割分工。"

