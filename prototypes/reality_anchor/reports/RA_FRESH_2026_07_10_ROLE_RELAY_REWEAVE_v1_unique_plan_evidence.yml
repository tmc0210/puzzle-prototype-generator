    这不是两条职责不同的宏观计划，也不改变目标分工；两路进入同一 s29 并 exact-state 汇合，
    之后共享全部不可逆里程碑。但它确实交换了两个必要锚动作的先后，不能把它隐去为纯走位差异。
  comparison_ref: prototypes/reality_anchor/reports/order_witness_comparison_RA_FRESH_2026_07_10_ROLE_RELAY_REWEAVE_v1.json

