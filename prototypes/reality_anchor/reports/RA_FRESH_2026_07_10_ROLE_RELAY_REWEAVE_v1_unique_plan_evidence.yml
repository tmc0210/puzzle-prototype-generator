lexicon_used:
  entries:
    - P/L 横向把手：玩家前格门与锚点占格门
    - P/L pull 抽取把手：前格门、占格目标门与扫带
    - P/L 边界交接 / 边界活塞本体谱：箱链残余债
    - B/S 移动边界刷产物：远程生成与门口消费
  linkage: >-
    二箱残余债 -> P/L 双侧回返门 -> B/S 中廊定位 -> B 锚接管中央目标 ->
    载体跨界 C->M -> 右廊反向交付。

designer_conclusion:
  irreversible_responsibility_chain_unique: true
  target_assignment_unique: true
  strict_object_action_order_unique: false
  submission_boundary: >-
    若“唯一解”指唯一不可逆职责链、允许同 SCC 内最终 exact-state 汇合的冗长可逆预置，
    本候选满足；若“唯一解”还要求两个必要锚动作绝不能交换先后，则本候选不满足，
    必须继续重构，不能由设计者自行宣称通过。该边界必须显式交给独立 puzzle critic。
