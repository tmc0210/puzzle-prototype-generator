canonical_solution:
  inputs: left down right up left right down right left left up right down right right right down left down
  flat_events: >-
    walk | push_object:crate#1 | force_chain:n2 |
    pull_object:push_pull_anchor | anchor_boundary_shift:push_pull | walk |
    push_object:push_pull_anchor | anchor_boundary_shift:push_pull |
    walk | walk | walk |
    pull_object:box_sticky_anchor | anchor_boundary_shift:box_sticky |
    pull_object:box_sticky_anchor | anchor_boundary_shift:box_sticky |
    pull_object:crate#1 | walk |
    push_object:box_sticky_anchor | anchor_boundary_shift:box_sticky |
    pull_object:crate#1 |
    pull_object:crate#1 | box_to_sticky:n1 |
    pull_object:sticky#1 | move_sticky_rigid |
    walk | walk |
    pull_object:sticky#1 | move_sticky_rigid
  key_player_reading:
    - step: 2
      event: push_object:crate#1 + force_chain:n2
      reading: 二箱纵链一次受力；远端箱锁定底部目标，近端箱留下后续回收债。
    - steps: 3-5
      event: P/L 右拉后左推复位
      reading: 玩家借竖锚的 L 行与 P 行完成双侧回返，不改变最终锚位，但换得不提前搬动载体箱的站位。
    - steps: 9-10
      event: B/S 连续左拉两格
      reading: 材质边界从右廊移入中廊；第二次左拉在所有胜路中不能早于至少一次 P/L 位移。
    - step: 11
      event: pull_object:crate#1
      reading: 将近端载体箱上抽到中廊，释放 B/S 下移并为后续横抽存料。
    - step: 13
      event: B/S 下推
      reading: B 端接管中央目标，同时把材质边界放到载体箱的横抽线上。
    - steps: 14-16
      event: crate 横抽、跨界 C->M、M 继续右抽
      reading: 同一载体从箱债改任为黏块目标载荷。
    - step: 19
      event: M 向下拉回右目标
      reading: 底箱、B 锚、再生 M 分别闭合三个目标职责。
  trace_ref: prototypes/reality_anchor/reports/trace_RA_FRESH_2026_07_10_ROLE_RELAY_REWEAVE_v1_CANONICAL.json

