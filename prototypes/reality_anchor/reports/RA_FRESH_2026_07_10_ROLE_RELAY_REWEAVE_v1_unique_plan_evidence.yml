    convergence_reaches_early_state: true
    reverse_inputs: up left down up right down
  object_order_difference:
    canonical: P/L 右拉左推回返 -> 第一次 B/S 左拉
    early_witness: 载体上拉 -> 第一次 B/S 左拉并保持 -> 载体下推复位 -> P/L 右拉左推回返
