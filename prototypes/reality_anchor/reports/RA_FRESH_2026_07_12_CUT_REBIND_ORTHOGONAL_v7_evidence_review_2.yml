evidence_limits:
  - >-
    layout graph 在 reachableStateCount=500001 时因 maxStates=500000 耗尽；不能推出
    完整图唯一性、完整 SCC、所有深度解族或完整图上的 merge 必经性。
  - >-
    anchor_boundary_shift:push_pull、box_to_sticky、sticky_merge、move_sticky_rigid 的
    避事件扫描均 exhausted，只能支持声明预算内未见旁路，不能支持 all-solution necessity。
  - >-
    旧 bounded stdout 的 ruleCounterfactuals.stickyMergeDisabled 没有关闭 runtime 合并
    语义，因此既不能作为 exact no-merge bypass，也不能作为关闭 sticky merge 后仍可获胜的
    反事实证据；仅其独立的避事件扫描与最短层枚举部分可按各自边界使用。
  - >-
    objectParticipation 为空；证据支持事件 pattern、逐步状态和规范最短 trace 中的三次
    重拼，不支持 per-object necessity 或未记录的实例级身份归因。
  - >-
    calibrated_trace_metrics 不属于 evidence；本审查不评价审美、难度、好玩程度、玩家问题
    显著性或 campaign placement。
