redundant_element_prune:
  status: clean
  candidate_version: RA_FRESH_2026_07_13_C_HOOK_COCKPIT_v4
  sequence: [goal_prune, object_remove_prune, object_wallify_prune, space_prune, wall_outline_prune]
  candidates_checked:
    - element: { kind: space, id_or_cell: [1, 5] }
      action_tested: wall_prune
      result: keep
      reason: >-
        该格是玩家站在(1,4)从 C 下臂左端向下拉完整 C 时的前方落脚格；与中、右把手共同表达
        三个接触点移动同一连通刚体。虽不在 canonical trace，仍承担 read_graph/opening choice。
      hard_facts: { cost_delta: 10->10, graph_status: complete, expected_trace_win: true, core_event_bypass: none, opening_delta: initial_scc_10_to_9, target_obligation_bypass: none }
      semantic_role: read_graph
    - element: { kind: space, id_or_cell: [2, 5] }
      action_tested: wall_prune
      result: keep
      reason: >-
        该格是从 C 下臂中格向下拉完整 C 的前方落脚格；墙化后只剩右端唯一把手，会加重 cheap-affordance 过度引导。
      hard_facts: { cost_delta: 10->10, graph_status: complete, expected_trace_win: true, core_event_bypass: none, opening_delta: individual_wall_initial_scc_10_to_8_and_dead_exits_2_to_3, target_obligation_bypass: none }
      semantic_role: read_graph
    - element: { kind: space, id_or_cell: [[1, 5], [2, 5]] }
      action_tested: wall_prune
      result: keep
      reason: >-
        组合墙化在工具上通过，但 initial SCC 10->8 且把完整下臂的三点把手收窄为唯一右端把手；
        这是玩家选择/读图损失，不是 clean prune。v5 over-prune 已拒绝。
      hard_facts: { cost_delta: 10->10, graph_status: complete, expected_trace_win: true, core_event_bypass: none, opening_delta: scc_10_to_8_same_exit_distance_but_handle_choice_removed, target_obligation_bypass: none }
      semantic_role: opening_comfort
  object_remove_prune: no_candidates_all_three_objects_move_on_canonical_core
  object_wallify_prune: no_candidates_all_three_objects_move_on_canonical_core
  space_prune: no_clean_removals
  wall_outline_prune: single_closed_outer_border_no_empty_outer_row_or_column
  removed_elements: []
  wallified_objects: []
  trimmed_outline: []
  retained_elements:
    - { kind: space, id_or_cell: [1, 5], reason: complete_C_left_handle_destination }
    - { kind: space, id_or_cell: [2, 5], reason: complete_C_middle_handle_destination }
  evidence_refs:
    - prototypes/reality_anchor/reports/layout_analysis_RA_FRESH_2026_07_13_C_HOOK_COCKPIT_v4_WALL_SPACE_1_5.json
    - prototypes/reality_anchor/reports/layout_analysis_RA_FRESH_2026_07_13_C_HOOK_COCKPIT_v4_WALL_SPACE_2_5.json
    - prototypes/reality_anchor/reports/layout_analysis_RA_FRESH_2026_07_13_C_HOOK_COCKPIT_v4_WALL_SPACE_1_2_5.json
    - prototypes/reality_anchor/reports/event_probe_RA_FRESH_2026_07_13_C_HOOK_COCKPIT_v4_WALL_SPACE_1_2_5.json
    - prototypes/reality_anchor/reports/RA_FRESH_2026_07_13_C_HOOK_COCKPIT_v5_overprune_reject.yml
