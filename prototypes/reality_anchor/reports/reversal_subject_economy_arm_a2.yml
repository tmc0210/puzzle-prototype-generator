reviews:
  - case: CASE_D
    main_player_facing_merit: "两类锚点先后接管同一批材料，切箱后再由 P/L 收尾，玩家需持续重估可受力对象。"
    dominant_aesthetic_problem: "B/S 三进三退与后段逐箱拉动形成往返编舞，核心洞见被执行负担稀释。"
    aesthetic_band: "2-3"
    verdict: borderline
    reason: "有强耦合轮廓，但成就感更像耐心兑现长序列，需实测操作是否仍清晰而非背谱。"

  - case: CASE_A
    main_player_facing_merit: "黏体在合并、切箱、重绑间反复改变可操作身份，两类锚点都参与解结，空间紧凑。"
    dominant_aesthetic_problem: "后半段连续重组缺少明显阶段落点，正确路线可能被感受为细碎姿态校准。"
    aesthetic_band: "4+"
    verdict: playtest_worthy
    reason: "每次转化都改写下一次受力关系，矛盾集中且密度高，虽有晦涩风险仍值得玩家验证。"

  - case: CASE_F
    main_player_facing_merit: "极小空间里两个箱、黏体与 B/S 互相传力；合并后再推动锚点完成，反馈连续。"
    dominant_aesthetic_problem: "P/L 未形成可辨作用，收尾是 B/S 下拉再上推，略像状态校正而非新洞见。"
    aesthetic_band: "2-3"
    verdict: borderline
    reason: "主链很紧，但一个显眼机制闲置且尾声折返，尚不足稳判审美4。"

  - case: CASE_C
    main_player_facing_merit: "开局把箱并入黏条，随后整体位移、切回两箱并分送三目标，身份变化直接服务空间分配。"
    dominant_aesthetic_problem: "切割后基本是逐个送目标，后段张力较早释放。"
    aesthetic_band: "4+"
    verdict: playtest_worthy
    reason: "核心洞见清楚，构造简洁，三份材料的去向可由形变自然读出，执行没有明显喧宾夺主。"

  - case: CASE_G
    main_player_facing_merit: "一次合并成 C 形大黏体，再切断连接并分别安置两臂与箱，形状变化具有鲜明主题。"
    dominant_aesthetic_problem: "切后先做右箱会永久失去上臂，远程顺序陷阱加上长通道回走，使失败暴露过迟。"
    aesthetic_band: "2-3"
    verdict: block
    reason: "核心形变优秀，但不可回返知识主要靠晚期惩罚教授，代价压过发现快感。"

  - case: CASE_E
    main_player_facing_merit: "同一黏条反复跨界切开、拉回重绑，最终一次传力切成两箱同时占标，首尾呼应。"
    dominant_aesthetic_problem: "多轮切开再复原高度同构，较长纯走位与封闭展示的 P/L 放大准备成本。"
    aesthetic_band: "2-3"
    verdict: block
    reason: "终局漂亮，但此前多次复原更像为终局铺设操作口令，整体经济性不足以支撑审美4。"

  - case: CASE_B
    main_player_facing_merit: "开局把黏体切成两箱，之后分置它们，终局再借三物传力移动 B/S 占标，因果链清楚。"
    dominant_aesthetic_problem: "主体转换很早完成，中段主要是常规箱位整理，唯一目标使终局空间关系较单薄。"
    aesthetic_band: "2-3"
    verdict: borderline
    reason: "短而干净，结尾有回扣，但机制矛盾展开不足，较像优秀小品而非稳定审美4。"

cross_case_notes: "高质量集中在材料身份变化立即改写后续受力关系、且空间反馈紧凑的 A、C。D、E 虽耦合多，却把亮点摊成长往返；F、B 短而清楚，但可见机制或展开不足。G 的形状主题最鲜明，然而晚期不可回返顺序陷阱与长通道让学习成本外溢。步数和事件密度未作加分依据；最终分歧应靠盲测观察玩家是否形成可解释洞见，而非只复现输入。"
