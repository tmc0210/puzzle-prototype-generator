request_id: req_001_staggered_bind_wall_tooth
exploration_id: RA_TASK_EXP_STICKY_IRREGULAR_BOUNDARY_20260718
design_space: >-
  两个彼此分离的普通箱从固定 B/S 边界的箱侧先后进入黏侧，面对两个彼此错开一格的黏块端点；
  改变箱子的进入顺序与各自推进深度，使动作后留下此前不存在的 L、S/Z 或 2x2 小黏块形；
  再让这些动后形状紧邻一个单齿墙口，用一次整块横移和一个后续正交施力位作为最小用法，
  比较哪种形状能避开墙齿并保留下一步操作位、哪种被齿挡住或丢失操作位。
sampling_axes:
  - 两个箱进入边界的先后次序
  - 第一个箱在第二个箱进入前推进一格或两格
  - 两个初始黏块端点的错位方向
  - 墙齿位于形成后异形的前缘凸格或凹口对应格
  - 横移后是否保留一个可达的正交推拉施力位
current_material_refs: []
do_not_repeat:
  - 只证明箱跨 B/S 会黏合
  - 开局直接给出正确 L/S/Z 后只做平移
  - 只证明某个方向 legal 或 force_blocked，而没有后续最小用法
  - 组装完整关卡、评价难度或推荐某个候选
materialization_target: >-
  至少发布一张 runtime-backed 局面卡：分离材料经顺序相关的 B/S 黏合形成此前不存在的工作异形，
  该异形随即在单齿墙口产生与 2x2 或镜像错形不同的整块横移结果，并留下可被下一次正交施力使用的具体操作位。
