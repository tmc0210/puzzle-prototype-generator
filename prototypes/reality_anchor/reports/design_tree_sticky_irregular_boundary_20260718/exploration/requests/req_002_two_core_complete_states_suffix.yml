request_id: req_002_two_core_complete_states_suffix
exploration_id: RA_TASK_EXP_STICKY_IRREGULAR_BOUNDARY_20260718
design_space: >-
  若干开局彼此分离、且单独看都只是单格或规整短条的黏块材料，加上一至两只从固定 B/S 箱侧进入的箱；
  玩家改变某个短条的预移、箱子进入次序或桥接位置后，能够现场形成两个拓扑或朝向不同的小异形结果
  （优先比较镜像 S/Z、左右悬臂 L、缺角方块），两者都能在同一 P/L 边界附近完成一次 P 侧整块推进
  与一次 L 侧正交拉动，但交接后的凸臂、凹口或目标端位置不同；再用一个极小墙齿、站位口或目标袋证明
  只有其中一个动后状态保留下一动作，且不能靠一次额外平移收敛到另一状态。
sampling_axes:
  - 规整短条在第二份材料接入前左移、右移或保持原位
  - 两只箱跨 B/S 的进入顺序与桥接格
  - 形成结果为镜像 S/Z、左右悬臂 L 或缺角方块
  - P/L 交接的接触行与正交拉动把手
  - 交接后两状态是否能通过一次额外平移互相收敛
  - 后段单齿、站位口或目标袋消费哪一枚凸臂或凹口
current_material_refs:
  - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_20260718/exploration/lexicon.md#ra-tl-mat-001
do_not_repeat:
  - 只比较同一异形的一格平移；若一状态能无代价收敛到另一状态，不算有效分流
  - 只有一个结果能完成眼前 P/L 推拉，另一个在交接前就被拒绝
  - 开局直接给出任一完整工作异形
  - 把后段做成与异形无关的独立箱子或锚点子题
  - 组装完整关卡、判断难度审美或推荐正式候选
materialization_target: >-
  发布一对 runtime-backed 局面卡或一张双结果材料卡：两种由分离规整材料现场形成的不同异形都能完成
  同一 P/L 近边界推进—正交拉动，但动后状态不能以一次额外平移互相消除差异；一个最小后续结构实际消费
  某一结果独有的凸臂、凹口或操作位。
