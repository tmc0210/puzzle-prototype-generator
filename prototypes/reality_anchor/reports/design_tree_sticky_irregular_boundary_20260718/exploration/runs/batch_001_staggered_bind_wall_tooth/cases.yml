runId: batch_001_staggered_bind_wall_tooth
title: "错阶顺序黏合形成 S/Z，并由单齿墙口与正交施力位消费"
notes: >-
  两个分离 crate 从固定 B/S 的 box 侧依次进入 sticky 侧，围绕两个对角错位的单格 sticky 端点形成 S/Z 或 2x2；
  比较同一上缘单齿下的整块右移，并用一次实际向下推动验证 S/Z 右移后保留的正交施力位。
defaults:
  maxExploreDepth: 18
  maxReturnDepth: 28
  maxStates: 40000
  maxTransitions: 160000
cases:
  - id: z_lower_first_tooth_then_down
    family: staggered_bind_wall_tooth
    variant: lower_first_depth_two_z_tooth_pass_and_orthogonal_push
    changed_variable: "下箱先推进到第二个 sticky 格，再让上箱跨线一格；墙齿位于 2x2 上前缘而不在 S/Z 的首步目标格"
    contrast_with:
      - square_upper_first_tooth_block
      - z_lower_first_stance_walled
    notes: "下箱先到 c7 连接错位端点，上箱后到 c6 补成 S/Z；整块右移后，玩家走到左上操作位并实际向下推动整块一格。"
    layout: |
      ############
      #........G.#
      #.C...M.#..#
      #.C....M...#
      #.@........#
      #..........#
      ####BS######
      ############
    actions:
      - left
      - up
      - right
      - right
      - right
      - right
      - down
      - left
      - left
      - left
      - left
      - up
      - up
      - right
      - right
      - right
      - right
      - up
      - right
      - down

  - id: square_upper_first_tooth_block
    family: staggered_bind_wall_tooth
    variant: upper_first_square_tooth_block
    changed_variable: "交换两箱进入顺序；下箱最后一次推进拖动三格 L 与下端点合成 2x2"
    contrast_with:
      - z_lower_first_tooth_then_down
      - square_upper_first_open_mouth_pass
    notes: "上箱先跨线，下箱后推进至第二格形成 2x2；同一右推触及上缘单齿并被挡住。"
    layout: |
      ############
      #........G.#
      #.C...M.#..#
      #.C....M...#
      #.@........#
      #..........#
      ####BS######
      ############
    actions:
