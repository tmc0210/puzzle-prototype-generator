    family: staggered_bind_wall_tooth
    variant: lower_first_z_tooth_pass_but_orthogonal_stance_walled
    changed_variable: "只把 S/Z 右移后的左上正交施力站位改成墙"
    contrast_with: z_lower_first_tooth_then_down
    notes: "S/Z 仍完成同一右移；玩家向上绕到站位入口后，进入指定左上施力格的动作被墙挡住。"
    layout: |
