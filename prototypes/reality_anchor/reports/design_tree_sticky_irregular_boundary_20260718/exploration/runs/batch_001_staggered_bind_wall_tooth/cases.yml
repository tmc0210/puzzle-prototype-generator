      - up
      - right
      - right
      - right
      - down
      - down
      - left
      - left
      - left
      - up
      - right
      - right
      - right
      - right
      - right

  - id: square_upper_first_open_mouth_pass
    family: staggered_bind_wall_tooth
    variant: upper_first_square_without_tooth_pass
    changed_variable: "只移除 2x2 上前缘目标格的单齿墙"
    contrast_with: square_upper_first_tooth_block
    notes: "保持上箱先、下箱后的 2x2 构形顺序，移除单齿后同一整块右移通过。"
    layout: |
      ############
      #........G.#
      #.C...M....#
      #.C....M...#
      #.@........#
      #..........#
      ####BS######
      ############
