exploration_id: RA_TASK_EXP_STICKY_IRREGULAR_BOUNDARY_20260718
prototype_id: reality_anchor
required_skill: sokoban-mechanism-lab
intent: mechanism_explore
publication_scope: task_local
workspace: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_20260718/exploration
dispatch_prompt: "使用 $sokoban-mechanism-lab，以 mechanism_explore 的 task_local 模式执行本文件。"
experience_seed: >-
  展开小型 L、S、Z、T、缺角方块等异形黏块在墙口、墙边、B/S 或 P/L 锚点边界附近的
  可动性、动作可逆性与状态变化；材料需要让具体占格形状改变下一步合法动作或可达施力位，
  并能被一个极小墙口、墙齿、目标袋、边界或站位限制消费。
player_prior:
  - 玩家已熟悉规整小黏块组的刚体可动性、拼接与切分。
  - 玩家已熟悉固定及可移动 B/S 锚点、P/L 锚点、推拉侧判定与多对象力链。
  - 基本走位、显然方向和普通单对象搬运不构成新材料。
allowed_mechanisms:
  - push_force
  - pull_force
  - sticky_rigid_body
  - box_to_sticky_binding
  - sticky_to_box_cutting
  - movable_box_sticky_anchor
  - movable_push_pull_anchor
  - dual_anchor
allowed_tools:
  - npx tsx src/cli.ts mechanism-lab-run prototypes/reality_anchor <cases.yml> --run-id <batch_id> --out-dir <task_run_dir> --write
  - npx tsx src/cli.ts explain-layout prototypes/reality_anchor <layout-file> --id <id> --targets K_runtime_smoke --max-states 300000 --graph-max-states 300000 --write
  - npx tsx src/cli.ts try-inputs prototypes/reality_anchor <layout-file> --id <id> --inputs <inputs> --write
