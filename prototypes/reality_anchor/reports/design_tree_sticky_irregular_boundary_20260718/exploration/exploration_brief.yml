exploration_id: RA_EXPLORATION_2026_07_18_STICKY_IRREGULAR_BOUNDARY
prototype_id: reality_anchor
experience_seed: >-
  黏块构成的 L 形、俄罗斯方块形（T/S/Z/方块缺角等）等小异形结构，在墙口、墙边、
  锚点边界（B/S 箱黏边界与 P/L 推拉边界）处的可动性、动作可逆性、状态变化。
  玩家关心的是：同一个整体形状在上述边界上产生逐格分叉的后果——它可能整进整出、
  可能被边界切成“跨界格变回独立箱子、剩余格按连通块裂开”、可能某个凸角被墙齿卡住
  导致整块推不动、可能靠凸角把手在看似有去无回的窄口全身而退；在 P/L 边界两侧，
  同一异形黏块的可动性、可拉性与可逆性也会随玩家所处 push/pull 侧而不同。
  不预设具体形状、构造方式或切割位置；关键是形状本身在边界处承担区分性责任。
player_prior:
  - 游戏后期玩家，已充分掌握规整形状小黏块组的可达性、可动性、拼接与切分。
  - 已掌握 B/S 锚点（固定与可移动）、P/L 锚点（固定与可移动）、多对象力链与各类腾挪技巧。
  - P/L 相关知识为更早期内容，玩家熟悉 push/pull 侧判定、边界交接与锚点本身可推拉。
allowed_mechanisms:
  - push_force
  - pull_force
  - movable_push_pull_anchor
  - sticky_rigid_body
  - box_to_sticky_binding
  - sticky_to_box_cutting
  - movable_box_sticky_anchor
  - dual_anchor
allowed_tools:
  - "npx tsx src/cli.ts explain-layout prototypes/reality_anchor <layout-file|-> --id <id> --targets K_runtime_smoke --max-states 300000 --graph-max-states 300000 --write"
  - "npx tsx src/cli.ts try-inputs prototypes/reality_anchor <layout-file|-> --id <id> --inputs <input1,input2,...> [--write]"
  - "npx tsx prototypes/reality_anchor/reports/probe_dual_axis_candidate.ts <layout-file> <id> 300000 80"
  - "npx tsx prototypes/reality_anchor/reports/probe_fixed_anchor_candidate.ts <layout-file> <id> <box_sticky|push_pull> 300000 80 strong_material"
  - 手摆 layout + 自写临时脚本（必须保存实际 layout、exact inputs 与机械结果）
source_boundary:
  allowed:
    - prototypes/reality_anchor/mechanism_lab/lexicon.md
  forbidden:
    - prototypes/reality_anchor/mechanism_lab/runs/
    - prototypes/reality_anchor/design_archive/
    - prototypes/reality_anchor/reports/design_tree_giant_sticky_piston_order_20260718/
    - 一切审美归档、人类评语、旧候选卡与当前 designer 的正式节点
workspace: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_20260718/exploration
notes:
  - 本 explorer 由 design studio controller 派遣，不继承任何设计对话。
  - 只生产任务内材料：最小 witness、材料卡、近邻反事实与未成立方向。
  - 不设计正式关卡、不读审美归档、不给材料分档、不评审候选。
  - 第一优先级是尽快发布已验证的最小 witness 与第一版 material_board.md，再按批继续。
