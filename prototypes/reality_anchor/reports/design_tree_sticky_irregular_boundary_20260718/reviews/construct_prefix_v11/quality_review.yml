  exact_version: v11_sha256_fb16d7c1587211705a29794d958a069b2cc47209dc7c2db2a1c19b040682e783
  opening_read: >-
    玩家在完整视野里看见两个彼此分离的横向二格黏块：一个已经贴着左侧四目标区域，另一个在右下方、玩家可从右侧直接推动。四个目标本身排成与预期工作块完全同形的 Z；上方 P/L、B/S 锚点虽被墙隔开，边界仍贯穿下方操作区，因此左上把手处在拉侧，右下把手处在推侧。对熟悉规则的后期玩家，开局构图几乎直接说明要把右下横条左移一次、再上推接到左上横条的右下方。
  player_actually_does: >-
    玩家先把右下横条左推一格，绕到其下方后上推，使它与左上横条黏合成开局不存在的四格 Z；再绕到 Z 的右下端，在推侧连续向左推动两次。第一次过 B/S 时上臂切出一个箱、其余部分保留黏连，第二次以力链继续推动已切出的箱并再切出两格，最终四个目标同时被覆盖。八个输入中只有四个改变对象，其余是短距离换位。
  key_visible_changes:
    - 第 4 步把两个分离的横向二格黏块真正合并为此前不存在的四格 Z，而不是平移一个预制异形。
    - 第 7 步把 Z 的上臂首格切成箱，同时下臂进入目标；异形的错行两臂开始被同一边界过程消费。
    - 第 8 步由剩余黏块推动先前箱子并继续切分，Z 的四格职责集中兑现为四目标全覆盖。
  visible_payoff: >-
    回报集中在最后两次左推：刚构成的 Z 被 B/S 边界逐行改写为箱与黏块的组合，并以一个力链同时填满 Z 形目标区。构形和边界消费在实物上都成立，且四格都进入终局责任。
  ending_read: >-
    第二次左推后立即胜利，没有高潮后的清理劳动；但因为目标从开局就把 Z 的构形与平移终点完整画出，收束更像对已公开答案的机械确认，而不是后期谜题的揭示。
  parent_delta_read: >-
    冻结父节点开局免费提供三格 L，玩家先跨 B/S 切出箱，再绕位重用余下黏块完成两个目标，主要内容是异形在边界后的分解与回用。当前子节点改为两个分离横条，玩家确实先合并出新的四格 Z，并让 Z 的错行两臂在连续两次过界中共同承担四目标；新增的是一次真实构形。不过父节点的较长回用过程被压缩成“照目标轮廓拼 Z 后连续左推”的即时消费，玩家需要建立的计划反而更少。
  exact_basis:
    - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_20260718/reviews/construct_prefix_v11/raw_packet.yml#frozen_parent
    - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_20260718/reviews/construct_prefix_v11/raw_packet.yml#candidate.solve_instance
