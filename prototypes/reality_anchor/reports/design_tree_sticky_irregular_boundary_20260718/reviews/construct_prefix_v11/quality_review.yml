      candidate 第 1、4、7、8 步是全部对象操作：左推横条、上推并 merge、连续两次左推并发生 sticky_to_box/force_chain；其余四步只是绕位。
    - >-
      开局目标格为上排相邻两格、下排右错一格的两格，恰与第 4 步合并后的四格 Z 同形；目标是该工作 Z 向左两格后的精确落点模板。
  perceptible_defects:
    - defect: >-
        Z 形目标把构形答案和后续移动方向同时完全泄露，使本应达到后期难度 3~5 的关卡缩成短机制 witness；错构 square 与 P/L 两侧把手虽在实物上存在，却没有形成足够真实、可感的选择。
      exact_basis: >-
        开局四目标就是工作 Z 的精确平移模板。把右下横条多左推一格再上推会形成 2×2 square，但它在动作前就与目标轮廓明显不符；正确 Z 合并后，右下推侧把手允许连续两次左移，而左上拉侧把手只能把形状向左带一步，随后玩家正前方即是墙、无法继续同方向操作。熟练玩家凭全图视野可在执行前排除二者，无需通过边界消费结果重新判断。规范解仅八步、四次对象操作，且选择已被目标与墙形预先剪除。
      player_effect: >-
        玩家得到的是清楚而紧凑的“拼出 Z、推过边界”演示，但几乎没有非显然规划：目标先替玩家决定黏合偏移，局部墙形再替玩家决定使用右下推把手。真实构形的机械事实因此没有转化为与后期定位相称的玩家推理，归档角色更接近 RA_CAND_0012/0016 一类强引导 join/cut witness，而未达到 RA_CAND_0011 或 RA_CAND_0025 所校准的强逻辑/主动构形档位。
      same_work_improvement_direction: >-
        保留“两条分离横条构成 Z，再由边界不可替代地消费 Z”的同题关系，但不要让目标直接给出 Z 的黏合偏移与整段平移终点；应让 square 和两侧把手在局部上都像可行方案，只有预见构成后的边界消费与回返条件才能排除错误选择。
      blocking: true
