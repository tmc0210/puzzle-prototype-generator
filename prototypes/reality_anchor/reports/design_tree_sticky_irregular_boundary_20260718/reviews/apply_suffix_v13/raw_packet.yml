review_attempt_id: RA_TREE_APPLY_SUFFIX_V13_QUALITY_01
prototype_id: reality_anchor
review_target: growth_child
prototype_rules:
  confirmed_rules:
    - 玩家所在 P/L 边界一侧在输入时决定本次为 push 或 pull；无 P/L 时全图为 push world。
    - push/pull 受力闭包递归包含同方向目标格上的全部可动物；任一分支被墙或越界时整步原子失败。
    - 多格 sticky 以完整连通分量作为刚体移动，移动后才按 B/S 边界归一化、合并或按连通块切分。
    - 拉世界中玩家只直接拉身后一格相邻对象；玩家目标格按整个受力闭包移动后的占用判断。
    - 所有目标必须同时被 crate、sticky 或锚点格覆盖才胜利；玩家覆盖不计。
  win_condition: all_targets_covered_by_objects
  object_and_event_semantics:
    - sticky 刚体任一格被墙、越界或不可动结构挡住时整块移动失败（force_blocked），凸角/横臂新增格都可能成为墙门。
    - sticky 连体块跨越 B/S 边界时，跨入箱世界的格变成独立箱子，剩余黏格按连通分量分裂。
    - 黏块推进墙口/通道后能否回返，取决于是否存在可达反向施力站位格且整块回推目标格开放；L 形凸角可提供侧向把手。
    - P/L 边界近旁，同一异形黏块从 P 侧推过与从 L 侧拉过呈现规则分叉：推则整块随力闭包前移，拉则只有身后相邻格被抽取、远端格留下、形状被改写；差异必须发生在边界附近，而非各处分别使用一次推和一次拉。
  player_prior:
    - 游戏后期玩家，已充分掌握规整形状小黏块组的可达性、可动性、拼接与切分。
    - 已掌握 B/S 锚点（固定与可移动）、各类腾挪基本技巧与多对象力链。
    - P/L 锚点为更早期知识，熟悉 push/pull 侧判定、边界交接与锚点本身可推拉。
    - 能迅速识别显然操作方向、基本可达性、局部几何关系和短死路；这些不作为难度。
human_review_constraints:
  - statement: 关卡定位游戏后期；玩家已充分熟悉规整形状小黏块组、拼接切分、B/S 推拉与腾挪；P/L 为更早期知识。
    human_source_ref: 本轮人类 brief（2026-07-18 对话原意）
  - statement: 预期难度 3~5；允许不同 slot 使用不同黏块形状，但核心与高潮必须是异形黏块在边界的可动性/可逆性/状态变化。
    human_source_ref: 本轮人类 brief（2026-07-18 对话原意）
  - statement: 注意与现有归档关卡防撞；RA_CAND_0010/0015/0011 仅作档位角色校准，不作设计素材。
    human_source_ref: 本轮人类 brief（2026-07-18 对话原意）
  - statement: 锚点边界包含 P/L 边界；利用异形块在 P/L 边界两侧的推拉可动性可成立且优于单纯墙口/墙边腾挪。
    human_source_ref: 本轮人类确认（2026-07-18 对话原意）
  - statement: P/L 两侧可动性差异必须在 P/L 边界附近体现；仅在不同位置分别使用推侧与拉侧各一次，不算兑现该核心。
    human_source_ref: 本轮人类追加修正（2026-07-18 对话原意）
  - statement: 对 construct_prefix 生长，简单推动或多轴平移一个已经成形的异形不计作合格前序；正确工作异形不得在开局免费给出，必须由分离材料拼接或切分—重黏真实构成此前不存在的工作形状、拓扑或朝向，并在后续墙口或锚点边界中被不可替代地消费。
    human_source_ref: 本轮人类明确纠正（2026-07-18 对话原意）
  - statement: 持续设计过程直到每个作品完整、设计树饱满；中间过程无需暂停等待人类确认。
    human_source_ref: 本轮人类指令（2026-07-18 对话原意）
