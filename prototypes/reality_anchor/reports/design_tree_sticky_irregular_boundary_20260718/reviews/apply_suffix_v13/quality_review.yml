    把右侧窄列标成 P 侧，唯一目标则在下方三格墙口之后。开局立即可见的二选一是：
    直接把右条下拉，或先绕到左条下方把左条下拉。对熟悉推拉侧判定的后期玩家，
    目标在下方以及墙口左齿同时强烈提示，合并后的异形需要把可供向下拉的凸臂留在右上。
  player_actually_does: >-
    玩家先绕到左条下方，将左横条下拉一格；再站到它右侧连续向右拉两次，使其接到
    未移动右横条的左下方，现场合成四格 Z。玩家此时落在 P 侧，从右向左把完整 Z 推过
    P/L 分界；随后在 L 侧抓住 Z 的右上凸臂，连续三次向下拉完整异形穿过墙口，最终由
    左下格覆盖目标。
  key_visible_changes:
    - >-
      第 3 步把左横条从 (2,5)-(3,5) 降到 (2,6)-(3,6)，首次决定两条材料的相对高度。
    - >-
      第 6—7 步把该横条向右拉并与右上横条合并，形成上排 (5,5)-(6,5)、
      下排 (4,6)-(5,6) 的四格 Z；工作异形在开局并不存在。
    - >-
      第 8 步完整 Z 从 P 侧左推，玩家跨到 L 侧；第 9—11 步同一 Z 连续下拉，
      错阶下沿避开左墙齿，最终覆盖 (3,9) 的目标。
  visible_payoff: >-
    Z 的右上凸臂在 P→L 左推后正好留在玩家身后，使下一次 down 从走路变成整块拉动；
    左下端则穿过墙口并最终压住目标。形状、动作侧与目标端在同一四格整体上连续可见，
    因而独立关卡没有退化成横条搬运或纯锚点腾挪。
  ending_read: >-
    合并和左推之后没有清箱或对象回收，三次同向下拉直接获胜；收束干净，但后两次下拉
