  opening_read: >-
    玩家在狭窄的右侧活动区看见上下两只箱子、左侧两枚彼此分离且错位的黏格、
    左下唯一目标，以及由上方 B/S、P/L 锚点标出的两条相邻竖向边界。
    对后期熟练玩家而言，题面直接提出的不是搬运一个现成异形，而是决定两只箱子
    穿过 B/S 后以什么顺序接到两枚分离黏格上，才能得到可在 P/L 交界处继续操作的整体。
  player_actually_does: >-
    玩家先从右侧把下箱左推过 B/S，使其转为黏格，再继续左推一次，令它同时接上
    原有的上下错位黏格，形成三格 L；随后绕回上箱右侧，把上箱推过 B/S，补成此前
    并不存在的四格 S 形。玩家再走到 S 形右下侧：从 P 侧把整块左推一格，自己随即
    落到 L 侧；下一步利用 S 形右上凸格作为身后把手向下拉动整块，使左下端落上目标。
  key_visible_changes:
    - >-
      第 2—4 步中，下箱由 (7,5) 经 B/S 转为 (5,5) 的黏格，随后移至 (4,5)，
      与开局分离的 (4,4)、(3,5) 两格合成三格 L。
    - >-
      第 9—10 步中，上箱由 (7,4) 推至 (5,4)，跨 B/S 转黏并与三格 L 合并，
      棋盘上首次出现 (4,4)、(5,4)、(3,5)、(4,5) 的四格 S 形。
    - >-
      第 13 步玩家从 P 侧把 S 形整体左推；第 14 步玩家已在 L 侧，借右上凸格
      向下拉动同一整体，左下端覆盖 (2,6) 的目标并立即获胜。
  visible_payoff: >-
    回报集中在最后相邻两步：刚构成的 S 形先横向整体推进，使玩家跨过 P/L 分界，
    随即由其错位凸格提供反向施力点，整块转为纵向拉动；目标端与把手端在同一个
    异形中同时兑现，因此形状不是额外填充物。
  ending_read: >-
    向下拉动后目标立刻由 S 形左下端覆盖并结束，没有高潮后的清理、重复运输或退休对象。
  parent_delta_read: >-
    冻结父节点开局已经给出三格 L：玩家先把它向左拉过 B/S，切出箱子覆盖左目标，
    再搬运余下竖条完成右目标。当前子节点改为从两枚分离黏格与两只箱子开始；新增的
    实际体验是先利用 B/S 的材料转换和合并顺序形成四格 S，再用该 S 的错位几何完成
