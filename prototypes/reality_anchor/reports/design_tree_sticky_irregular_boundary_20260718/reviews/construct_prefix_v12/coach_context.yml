experience_core:
  experience_statement: 玩家已把黏块当作“一整块一起动的刚体”。本关让玩家面对一个 L/T/S/Z 等小异形黏块， 亲眼看到同一个整体形状在墙口、墙边或锚点边界（B/S 与 P/L）处产生逐格分叉的后果： 凸角对准开口才能整进整出、凸角被墙齿卡住则整块推不动、某个旋转在窄口有去无回而 另一个旋转靠凸角把手全身而退、跨越 B/S 时跨界格变回箱子而剩余格按连通块裂开、 在 P/L 边界从 push 侧与 pull 侧经过时呈现不同的可动性与可逆性。玩家必须读出 具体形状、预见分叉并主动利用它，而不是把异形块当横条搬运。
  player_action: 玩家读出黏块的具体形状与边界的关系，主动选择旋转/拼法/进入方向/进入侧， 亲自执行让形状分叉兑现的关键动作序列（通过、卡住后换形、切割、pull 抽取或 利用可逆性窗口）。
  visible_payoff: 关键操作后，形状分叉产生可见且被后续使用的状态变化：整块通过/被拒之外的差异、 切出的箱子与剩余黏块各自承担新责任、pull 抽取后形状被改写、或“看似不可逆”的 局面被凸角把手撤销；该变化直接收束到目标覆盖。
  identity_conditions:
    - 核心动作发生时黏块保持异形连通形状，且该具体形状对结果有区分性责任。
    - 玩家必须亲自完成一次“读出形状 → 预见边界分叉 → 执行”的动作；分叉结果可见。
    - 边界分叉产生的状态变化被后续实际使用，最终收束到目标覆盖。
    - 主要体验回报来自异形黏块与边界的形状关系，而非锚点时序或纯腾挪。
