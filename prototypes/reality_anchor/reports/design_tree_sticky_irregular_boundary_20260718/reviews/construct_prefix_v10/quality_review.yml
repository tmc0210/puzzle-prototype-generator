  opening_read: 玩家开局看到固定 P/L 的分界投影穿过中央狭小操作区，一块预制 L 形黏块贴着分界，凸角压在一个目标上，另一目标紧邻其右侧；更下方的固定 B/S 分界与第三目标对齐。玩家所在小室几乎只把他送到 L 形左臂的施力面，右下回廊则暴露出到达凸角下方和最终绕到残块上方的路线。
  player_actually_does: 玩家先从 P 侧把完整 L 形向右推过 P/L 分界，使右下凸角成为 L 侧可拉的把手；随后绕到凸角下方，连续向下拉动同一刚体，第二次拉动跨过 B/S 分界并从 L 形切出一个箱子。箱子留在下方目标，剩余横向双格黏块被玩家绕行到上方后反向拉回，覆盖上方两个目标并结束。
  key_visible_changes:
    - 第 2 步完整 L 形横移过 P/L 分界，原先被凸角覆盖的目标被腾空，右侧目标转由同一凸角覆盖；异形凸角同时把新的下拉接触面送到 L 侧。
    - 第 7 步从 L 侧下拉时，完整 L 形换轴下移并一度同时覆盖上方双目标，说明前一步越界不是一次性位移，而是在同一边界局部建立了新的施力关系。
    - 第 8 步继续下拉跨过 B/S 分界，右下单格变成箱子并落在下方目标，余下黏格成为横向双格块；三个上方黏格状态被明确改写为“已消费箱子 + 可回收残块”。
    - 第 16 步从残块上方反向拉回横向双格黏块，一次覆盖上方两个目标，与已就位箱子共同触发胜利。
  visible_payoff: 回报集中在两次相邻动作上：先由 B/S 切分把 L 形凸角固化成下方目标箱，再由最后一次反向拉动让剩余双格黏块同时回填上方双目标。异形块的凸角、切分结果与回返方向都得到可见消费。
  ending_read: 最后一次拉动即完成全部目标，没有高潮后的清理；结尾短而清楚。
  parent_delta_read: 冻结父节点先把预制 L 形连续向左拉过边界，切出箱子后还要单独推箱，并多次搬运残余双格黏块收束。当前子节点把主要变化改成同一局部中的“P 侧横推完整 L 形—L 侧借凸角纵拉—B/S 切分—残块反向回拉”，边界关系和终局回报更集中，但对象操作也被压缩成几乎完全顺着通道执行的四个动作。
