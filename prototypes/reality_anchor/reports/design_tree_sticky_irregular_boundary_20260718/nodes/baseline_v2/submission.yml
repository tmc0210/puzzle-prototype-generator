designer_claim:
  player_experience_core: >-
    一个 3 格 L 形小异形黏块骑跨 P/L 边界，玩家在其 L（pull）侧、凸脚朝东站位。
    沿凸脚方向（东）被凸脚自我封锁（玩家目标格被自己形状的凸脚占据），
    唯一合法的互动动作是向西 pull 整块抽取；
    连续抽取第二步，领头格越过 B/S 边界被逐格切成独立箱子，剩余两格竖条留下。
    玩家必须读出 L 的具体形状（凸脚朝向）才能预见这次“只能抽出、且抽出即被切割”的分叉，
    并把切出的箱子与剩余黏条分别送上两个目标。
  player_action: >-
    玩家在凸脚笼中确认四向里只有 left 合法，执行 left,left 完成抽取与 B/S 逐格切割；
    随即把切出的箱子向上推上西袋目标，再绕到剩余竖条西侧，把它整体 pull 扫过东袋目标。
  visible_payoff: >-
    同一 L 形：东推 illegal、西抽 legal 且第二步触发 sticky_to_box:n1 把 L 改写成
    C+竖条；切出的箱子覆盖西目标（*），竖条终点覆盖东目标（*），两目标同拍完成胜利。
  why_this_level_exists: >-
    直接呈现“同一异形黏块在 P/L 边界两侧的推拉可动性分叉 + 跨越 B/S 时的逐格状态改写”，
    让玩家第一次把异形凸脚当作可读的边界把手，而不是把黏块当横条搬运。
  work_identity_conditions:
    - 核心动作是站在凸脚笼中的 west pull 抽取；若换成等格数横条，则不产生凸脚自我封锁与把手，分叉消失。
    - B/S 逐格切割必须由抽取第二步的领头格越界触发（sticky_to_box:n1），切出的箱子与剩余黏条各自覆盖一个目标。
    - 若玩家无需读凸脚朝向、靠任意站位即可完成，则形状未承担区分性责任，身份丢失。

packaging_account:
  opening: 玩家开局站在 L 形凸脚正西一格，凸脚左右各一格墙齿/自身形成凸脚笼，可立即观察四向合法性。
  preparation: 玩家试探四向，确认东/北/南均 illegal，只剩 west pull。
  reveal_or_use: 连续 west pull 第二步越过 B/S 边界触发切割，L 被改写为箱子+竖条。
  ending: 切出箱子上西袋目标、竖条 pull 扫过东袋目标，两目标覆盖后胜利。
  every_major_element_role:
    - 3 格 L 形黏块是形状检查主角：凸脚提供自我封锁与抽取把手，领头格承担 B/S 切割。
    - P/L 边界决定玩家所在侧为 pull world，使东向动作对形状为 push 语义、西向动作为 pull 语义，构成两侧可动性分叉。
    - B/S 边界承担切割合同，把越界领头格变回箱子。
    - 西袋目标消费切出箱子，东袋目标消费剩余竖条；两者强制切割产物分工。
    - 凸脚两侧墙齿与底部/右部墙体约束走位，使抽取成为唯一开门动作。
  known_perceptible_defects:
    - 切割后需一段绕位走位（约 6 步 walk）才能分别消费两个产物，walk 段不产生新洞见。
    - B/S 与 P/L 均固定且靠近，B/S 本体除切割合同外没有独立玩家操作回报。

