designer_claim:
  player_experience_core: >-
    玩家不是直接得到骑跨 B/S 边界的 L 形，而是面对一条横臂与一个单格材料：把它们
    拼成凸脚朝东的 L 才能继续整块左拉、逐格跨越 B/S 被切成箱子与竖条；向下拉横条
    或从上方拉单格形成的横条虽然会立即覆盖目标，却不能产生西目标所需的箱子。正确 L
    可以直接在边界前成形，也可先在右侧成形再可逆搬回，两者保持相同形状判断与产物职责。
  player_action: >-
    玩家先读出横条、单格、墙口和两个目标的关系，主动选择从下方进入把手位并向左
    拉单格拼出 L；随后连续左拉，使领头格跨入 B 侧变箱，最后在 P 侧分别推送箱子与
    竖条完成目标。
  visible_payoff: >-
    正确拼接后立刻出现三格 L；第二次整块左拉时，L 的领头格在 B/S 边界处变成独立
    箱子，剩余两格成为竖条。箱子向上覆盖西目标，竖条向右重新覆盖开局目标，切割
    产物各自承担一个可见且紧邻高潮的职责。
  why_this_level_exists: >-
    冻结 baseline 免费给出正确 L 与拉位；本节点让玩家必须在两个局部都像成功的横条
    拼法与一个 L 拼法之间，提前预见边界切割所需的凸脚方向与两种输出。前序选择因
    核心认知而被压缩，不是把玩家沿唯一局部路线送到父节点起点。
  work_identity_conditions:
    - 三格材料必须由玩家主动拼成凸脚朝东的 L，正确拼接后保持连通直至跨界切割。
    - 正确 L 与上下两个横条近邻拼法必须在同一实际布局中可执行，且两个横条状态均无法完成整关。
    - B/S 边界必须把 L 的领头格改写为箱子，并留下两格竖条；无此材料分叉不存在胜路。
    - 切出箱子固定承担西目标，剩余竖条固定承担东目标；主要回报来自异形与边界，而非锚点移动。

packaging_account:
  opening: >-
    玩家从右下方拥有可逆观察空间，可沿下路进入单格西侧，也可沿右上方抵达单格上侧；
    中央横条、右下单格与两目标构成清楚但不直接揭底的三格拼图。
  preparation: >-
    规范解前三步仅用于选择并抵达下方把手位；第四步向左拉单格，单格与横条合并成
    父节点同形同向的 L。上路拉单格与同站位下拉横条都能形成横条并短暂覆盖目标，
    但完整后缀搜索证明两者无法产生西目标所需的切割箱。完整胜路因果商还包含一条
    等价准备支路：先在右侧拼出同朝向 L，再在可逆搬运 SCC 内把它送回同一边界就位态；
    该支路没有改变所需形状、边界切割或产物职责。
  reveal_or_use: >-
    第四步 L 成形，第五步整块左移并让凸脚覆盖东目标，第六步继续左拉跨越 B/S，
    领头格变箱、竖条离开东目标；第七与第八步在 P 侧把两个产物分别推回各自目标。
  ending: 第八步竖条右推覆盖东目标即胜利；切割后只有两次产物兑现，没有高潮后清理。
  every_major_element_role:
    - 上方两格横条：正确 L 的横臂；错误下拉时会与单格合成覆盖东目标但不可切出所需产物的横条。
    - 右下单格：正确拼接的凸脚材料；向左拉才形成可跨界切割的 L，向上拉则形成另一条不可胜横条。
    - 东目标：既诱导局部横条覆盖，也在正确 L 第一次左移及切割后的最终推回中重复承担可见责任。
    - 西目标：只接受 B/S 切出的箱子，迫使玩家不能把“先覆盖东目标”误当作完整构造。
    - B/S：固定材料边界，负责把三格 L 改写成箱子加竖条；完整事件探针未发现缺少材料归一化的胜路。
    - P/L：固定力学边界；构造与切割发生在 L 侧的拉语义，切割后玩家进入 P 侧并推送两个产物。
    - 下方墙齿：允许玩家从右侧抵达正确把手位，同时否决拼好 L 后向下改线，保持边界切割高度唯一。
  known_perceptible_defects:
    - >-
      除规范解的直接拼 L 外，玩家还可先在右侧拼出同朝向 L 再搬回；这是完整因果商中的
      等价准备支路，而非唯一动作序列。若实玩把它读成绕路劳动而非可逆试探，应优先保留
      直接路线，不以封死支路的方式增加墙体噪音。

hard_evidence:
  solve_instance_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_20260718/nodes/construct_prefix_v6/layout.txt
  canonical_replay_ref: prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_20260718/nodes/construct_prefix_v6/canonical_replay.json
  solution_uniqueness:
    result: equivalent_variants_only
    search_scope: complete
    search_budget: maxStates=400000，terminalizeWins=true；实际完整图 193 状态、476 合法转移
    known_raw_winning_variants:
      - 深度 8：规范解，切割后先推箱上西目标，再推竖条回东目标。
      - 深度 9：与规范解相同对象职责和因果链，只多一个玩家走位后再完成竖条末推。
      - 深度 11：相同 L 构造与切割，先推竖条回东目标，最后推箱上西目标。
    equivalence_account: >-
      完整图的全部胜态做逆向闭包后得到 96 个 win-reaching 状态；去除玩家坐标为 10 个
      对象态。先在不聚合玩家坐标的原始闭包上消去循环，得到 14 个 raw SCC 与 12 条
      source-to-win DAG 路径；12 条逐条映射到对象逻辑后只有 4 条宏骨架，恰为 2×2：
      直接形成边界就位 L / 先在右侧形成同朝向 L 再可逆搬回，以及先完成箱子 / 先完成
      竖条。分类计数 1、2、3、6，未分类为 0。原始图禁用搜索与顺序探针证明全部骨架
      都必经同一 boundary-ready L、同一 pre-cut L、同一 B/S 切割产物态；终局也只有
      一个对象态类 C:1,3 与 M:3,4;3,5。故差异不改变形状判断、对象职责、目标分配或
      “拼出正确朝向 L→边界就位→整块左拉→跨界切割→两产物兑现”的依赖顺序。
      本声明不再声称 sticky_merge 必在同一坐标触发。
    evidence_refs:
      - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_20260718/evidence/construct_prefix_v6_uniqueness/results.json
      - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_20260718/evidence/construct_prefix_v6_uniqueness/report.md
      - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_20260718/evidence/construct_prefix_v6_causal_equivalence/results.json
      - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_20260718/evidence/construct_prefix_v6_causal_equivalence/report.md
      - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_20260718/evidence/construct_prefix_v6/layout_analysis.json
    evidence_limits:
      - 完整图证明只有一个最终对象态类；逻辑等价性仍按 docs/21 的对象职责、目标分配与因果先后作人工归类。
      - 对象态商只命名玩家逻辑；完整覆盖由 raw-state SCC 的 12 条路径逐条映射承担，避免把聚合伪拼接当可逆性证据。
  bypass_refs:
    - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_20260718/evidence/construct_prefix_v6/event_probe.json
    - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_20260718/evidence/construct_prefix_v6/fixed_anchor_probe_box_sticky.json
    - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_20260718/evidence/construct_prefix_v6/fixed_anchor_probe_push_pull.json
  identity_counterfactual_refs:
    - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_20260718/evidence/construct_prefix_v6/prefix_counterfactuals.json
    - prototypes/reality_anchor/reports/design_tree_sticky_irregular_boundary_20260718/evidence/construct_prefix_v6/prefix_counterfactuals.md
  evidence_limits:
    - 通用 fixed-anchor strong_material profile 还要求本作品未声明的锚点位移与 box_to_sticky；这些组可被绕过不构成当前声明失败。
    - 原型不保留 sticky 单元身份；“同一领头格”由 exact 构造、跨界前后占格与唯一最终对象职责共同支持。

