designer_claim:
  player_experience_core: >-
    玩家面对同一三格 L 在交叉边界附近的两种命运：先从 P 侧横推，使完整 L 骑跨 P/L；
    墙边立即否决继续横推，P 侧唯一可向下施力的位置又被墙齿删除，因此必须绕到 L 侧
    抓住凸脚向下拉。第二次拉动让凸脚跨入反置 B 区成为箱子，而横臂留在 S 区继续被拉向目标。
  player_action: >-
    开局先在两个局部合法对象动作中选择横推；若先纵推一格，完整 L 仍可从下方推回，形成一次
    可逆试探，但再纵推跨 S/B 就会切下错列凸脚并失去胜路。正确横推后读出墙边是换侧信号，
    沿 L 内角绕到凸脚下方，从 L 侧连续拉两格；切割后从右侧再拉横臂两格覆盖双目标。
  visible_payoff: >-
    正确横推把完整 L 从 P 侧送到边界上；墙边拒绝继续推进后，换到 L 侧即可沿另一轴移动。
    第二次下拉时凸脚单格变箱并落在目标，原 L 横臂保留为二格黏条，最终继续承担另外两个目标。
  why_this_level_exists: >-
    冻结父节点免费给出已坐好 B/S 切割拉位的 L；本节点要求玩家先利用 P/L 两侧和墙齿，
    把同一预制 L 定位到唯一能正确切下凸脚的列。它不再把“主动拼 L”作为记忆点，避免与
    RA_CAND_0025 碰撞；作品高潮是同一异形经 P 推、L 拉与 S/B 单格切割的连续边界命运。
  work_identity_conditions:
    - 正确胜路必须先让完整三格 L 在 P 侧向右推一格，并保持 L 形到第二次 L 侧下拉。
    - 墙边必须否决继续向右推；墙齿与 P/L 侧别共同删除向下推操作位，迫使玩家换到 L 侧凸脚拉位。
    - 反置 S/B 边界必须只把凸脚切成箱子，箱子与剩余横臂分别承担目标责任。
    - 开局纵推一格必须仍可完整回退；第二次纵推跨 S/B 后必须完整后缀无胜，形成清楚的可逆窗口与状态提交线。
    - 全部胜路不得通过移动锚点、重组 L、把箱子重新黏回或其它非等价结构绕过上述关系。

packaging_account:
  opening: >-
    开局同时看见预制 L、P/L、反置 S/B、墙齿与分离的三目标。玩家处于 L 左上侧，既可到左侧
    横推，也可到上侧纵推；锚点均被墙笼固定，不制造“锚点也要移动”的错误承诺。
  preparation: >-
    正确 first object action 是从 P 侧向右推完整 L；继续 right 立刻 force_blocked。
    纵推一格可绕到下方推回原对象态，但继续纵推触发错列切割后无胜。正确横推后，玩家沿
    内角通道抵达 x=6 的 L 侧凸脚下方，形成向下拉的唯一可胜边界姿态。
  reveal_or_use: >-
    第一次下拉保持完整 L；第二次下拉触发 sticky_to_box:n1，凸脚箱子直接覆盖 x=6,y=8 目标，
    横臂留在 x=5..6,y=7。玩家经右侧小回路到横臂右端，从 L 侧连续右拉两格覆盖双目标。
  ending: 第十五步横臂第二次右拉覆盖最后目标即胜；切割产物没有额外清理劳动。
  every_major_element_role:
    - 三格 L：横臂负责最终双目标，凸脚决定可达拉位并在 S/B 边界切为目标箱子。
    - P/L：让开局 P 侧横推与随后 L 侧凸脚拉发生在同一边界局部。
    - x=5,y=4 墙齿：删除 P 侧向下推位；玩家即使从 x=6 上方接触，也位于 L 侧而不能完成同一推法。
    - 右侧墙边：完整 L 正确横推后，下一次 right 因前臂撞墙而原子失败，形成换轴换侧信号。
    - 反置 S/B：第二次下拉只把 x=6,y=8 凸脚切成箱子，保留横臂连通性。
    - x=4,y=8 与 x=7,y=8 墙齿、下方封口：允许错误纵推一格时回退完整 L；一旦第二推切出 x=5,y=8 箱子，则锁住该错列产物，形成不可逆死路。
    - 右下回路：切割后允许玩家绕到横臂右端，不允许穿过目标箱改写其职责。
  known_perceptible_defects:
    - >-
      切割后的箱子在产生瞬间即覆盖目标，后段主要验证剩余横臂；若玩家完全未把开局纵推读成
      候选，前序判断可能偏紧凑。该玩家侧强度留给 fresh 阶段 A 与人工实玩判断。

