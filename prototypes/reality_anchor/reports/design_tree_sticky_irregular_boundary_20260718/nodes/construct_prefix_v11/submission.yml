designer_claim:
  player_experience_core: >-
    开局只有两条彼此分离的横向二连黏块，正确工作异形并不存在。玩家必须把下方材料
    与上方材料错位重黏成 Z；若对齐重黏则得到 2×2 方块并失去胜路。Z 构成后，同一块 Z
    在同一 P/L 与 B/S 重合边界附近既可由 P 侧推，也可由 L 侧拉；首次切割的对象结果相同，
    但 P 推保留右侧继续施力位，L 拉则让玩家被切出的箱子与墙袋封死。
  player_action: >-
    玩家先把下方二连块错位一格，再从下方向上推进并与上方二连块黏合成 Z；随后可绕到
    边界右侧的 P 把手或更远的左侧 L 把手。正确解从右侧连续向左推动：第一推让 Z 的左上格
    越过 B/S 成箱，第二推继续带动剩余异形并再切两格，最终形成三箱一黏的 Z 投影覆盖四目标。
  visible_payoff: >-
    第一次黏合把两份规整材料变成此前不存在的 Z；错误对齐则可见地变成方块。边界首切后，
    P 推与 L 拉都得到 C(4,6)+M(5,6)(5,7)(6,7)，差异集中在玩家落点与下一拍把手；正确 P 推
    再一拍把 Z 按列改写成 C(3,6)(4,6)(4,7)+M(5,7)，直接覆盖目标并结束。
  why_this_level_exists: >-
    冻结父节点免费给出已经骑跨 B/S 的三格 L；本节点把正确异形本身变成前序答案：玩家先从
    两条 domino 中构成 Z，再由 Z 的错位列宽决定边界切割谱，并用同一局部的 P 推/L 拉落点
    差异选择可继续的把手。它不是预制异形的一次平移，也不复用 RA_CAND_0025 的主动 L 与
    反复活塞；Z 只构成一次，随即在边界高潮中被完整消费。
  work_identity_conditions:
    - 初态不得含四连工作异形；全部胜路必须进入对象态 M(5,6)(6,6)(6,7)(7,7) 的 Z。
    - 使用同一两条二连材料对齐构成 2×2 方块后，完整后继必须无胜。
    - 构成后的 Z 必须在同一 P/L-B/S 边界局部发生材质切割；不得以分件单独覆盖目标替代。
    - 首次可胜切割必须由 P 侧 left push 完成；L 侧 left pull 虽产生相同对象结果，但其完整后继无胜。
    - 终局必须继续推动同一切后结构并触发 sticky_to_box:n2；三箱一黏的职责与终局对象 key 固定。

packaging_account:
  opening: >-
    上方二连材料被墙框锁在目标模板右侧，下方二连材料与玩家处于小型开放区；四枚目标形成
    可读的 Z 投影。固定 L/P 与 B/S 共用同一竖向边界，提示构成物随后会在这里接受推拉与切割。
  preparation: >-
    下方材料可先横移或上移，允许两种等价顺序抵达同一个 Z；多横移一格再合并会真实生成
    2×2 方块。玩家的承诺不是首个推动，而是选择以哪种错位拓扑完成 sticky_merge。
  reveal_or_use: >-
    Z 构成后，右侧短路给出 P 推把手，左侧绕路给出 L 拉把手。两侧首次切割的对象态相同，
    但墙袋与切出箱子只在 L 拉后封住玩家；P 推后仍贴着 Z 的右缘，可继续最后一推完成切割谱。
  ending: >-
    第八步继续 left push，同一次力链把两格跨入 B 区，三箱与一格残黏同时覆盖 Z 形四目标，
    没有高潮后的搬箱或清理。
  every_major_element_role:
    - 上下两条 domino：唯一原料；必须重黏成 Z，不能分件直接完成目标。
    - Z 的错位拓扑：决定列宽切割次序、P/L 两侧把手与终局三箱一黏的职责。
    - 2×2 错构形：使用同一原料的真实局部承诺，证明构形而非运输是前序问题。
    - 固定 P/L：右侧 P 推保留后续接触，左侧 L 拉改变玩家落点并触发墙袋封锁。
    - 固定 B/S：与 P/L 共线，把 Z 的三格逐次固化为箱，留下末端单格黏块。
    - 左侧墙袋与切出箱子：只在 L 拉后共同封死玩家，消费推拉动作后的可逆性差异。
    - 四枚 Z 形目标：提示构形方向并完整消费终局三箱一黏；不需要额外对象。
    - 底部墙带：限制错误方块和材料的重排路线，同时保留正确 Z 的两种等价装配顺序。
  known_perceptible_defects:
    - >-
      规范解只有 8 步，目标 Z 模板对熟练玩家提示较强；当前自评为后期难度 3，而非 4/5。
      它是否仍显得像短 witness、玩家是否会认真比较更远的 L 把手，必须交给 fresh Stage A。
    - >-
      正确 Z 可按“先横移再上合”或“先上移再左合”两种顺序构成；它们收敛为同一对象态与
      后续职责，不声明逐输入串唯一。

