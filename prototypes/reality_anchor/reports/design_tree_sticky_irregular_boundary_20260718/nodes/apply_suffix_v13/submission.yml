designer_claim:
  player_experience_core: >-
    初态只有两个分离的横二连 sticky，工作异形不存在。玩家可以先下拉左条，也可以先下拉
    右条；随后把另一条横向接入，会分别形成 Z 与反向 S。两者都能在 P/L 边界完成一次
    左推并利用凸臂正交拉动，但只有 Z 的右上凸臂能让玩家在 L 侧连续向下，把左下格带过
    左右墙齿并送到底墙目标；S 的相反凸臂撞上左墙齿，合并后也无法改向。
  player_action: >-
    玩家先向左绕到左条下方，在 L 侧 down pull 将左条降一行；回到其右侧连续 right pull，
    第二次把左条接到右条左下方，现场形成 Z。玩家落在 P 侧后向左 push 完整 Z，跨到 L 侧；
    随后连续三次 down pull，前两次让错阶前沿进入三格墙口，最后一次利用右上凸臂把左下格
    带到底墙目标。
  visible_payoff: >-
    相同两条材料可见地形成两种四格命运。先降右条得到的 S 也能向左跨界并向上拉，证明
    它不是不能动的假选项；但它的左上凸臂与下方左墙齿同列。先降左条得到的 Z 则把凸臂
    留在右上，左推后玩家正好站在它下方，连续 down 的每一拍都移动完整异形，最后一拍覆盖目标。
  why_this_level_exists: >-
    父节点要求玩家按材料顺序构成唯一 S，并在同一次 P/L 交接中收束；本节点把后缀约束
    反传到更早的相对高度选择：眼前都能完成边界动作的 Z/S，必须由底部墙口决定哪一条
    横料先下移。它保留“现场构成异形后由边界消费”的作品身份，但把判断从先后桥接推进到
    具体异形朝向与后续凸臂用途，不是给定异形的平移定位。
  work_identity_conditions:
    - 初态只能包含两个彼此分离的规整横二连 sticky；不得预制 Z、S、L 或其它工作异形。
    - 全部胜路必须现场 merge 成同一朝向 Z；分离横条、反向 S、2×2 与横四连不得取代。
    - 全部胜路必须让完整 Z 从 P 侧执行同一 left push 并落到 L 侧，不能在 L 侧异地装配后直接进入后缀。
    - P→L left push 后必须以 Z 的右上凸臂完成同一向下转向，并沿同一墙口连续消费。
    - 单目标必须由完整 Z 的左下格在最终 down pull 中覆盖；目标不得直接画出 Z 轮廓。

packaging_account:
  opening: >-
    两条横二连位于同一行，中间留两格；玩家站在右条左下方的 L 侧。左条与右条都可被
    下拉，P/L 标记清楚显示右条靠近动作侧交界。底部只有一个目标，左右墙齿给出三格口，
    不显示完整四格终态。
  preparation: >-
    先降左条后，玩家用两次 right pull 把它接到右条左下方；先降右条则可用相似动作把
    左条接到其左上方。两条路线都在六步内形成醒目的四格错阶构形，承诺发生在 merge，
    而不是之后的简单平移。
  reveal_or_use: >-
    Z merge 后玩家位于 P 侧，left push 让完整异形跨回 L 侧；Z 的右上臂此时位于玩家身后，
    down 立即变成正交 pull。S 也可完成 left push 与一次 up pull，但其朝向无法通过左墙齿。
    墙齿因此读取的不只是宽度，而是上、下两排各自向哪一侧错开。
  ending: >-
    Z 连续三次下拉：第一次确认 P→L 后的右上把手，第二次把下排送入墙口，第三次沿底墙
    把左下格压到唯一目标。没有切分后的清箱或高潮后的远距离回收。
  every_major_element_role:
    - 左横条：正确路线先下移的下排材料；错误路线中留在上排并形成反向 S。
    - 右横条：正确路线保持上排，提供 Z 的右上凸臂；错误路线先下移成为 S 的下排。
    - 固定 P/L：让构成 Z 后的 left 是 P 侧 push，并让玩家落到 L 侧后以 down 连续 pull 同一异形。
    - 固定 B/S：定义初始 sticky 合法区域；右侧墙封住 B/S 越界，避免以切分重置构形承诺。
    - 左墙齿：拒绝 S 的左上凸臂，并阻止左条过低后在墙口异地合 Z。
    - 右墙齿：阻止右条过低后绕开完整 Z 的 P→L left push，也阻止分离横条进入底部。
    - 右上天花挡格：阻止右条过高后在 L 侧异地合 Z；仍给 S 的上拉结果保留左侧空间。
    - 单个底部目标：只要求正确异形真正穿过墙口，不描出 Z 模板。
  known_perceptible_defects:
    - >-
      规范解只有 11 步、4 步 walk；主设计定位为后期难度 3。它依赖一次明确的构形选择，
      不主张达到难度 4/5；是否过短必须由 fresh Stage A 从玩家侧判断。
    - >-
      正确 Z merge 后的 left,down,down,down 是紧凑连续兑现，后段没有第二次重新规划；本节点
      的增长在于墙口把约束反传到 merge 前的高低选择，而不是增加多段解题。
    - >-
      错误 S 在完成 left push 与 up pull 后立即无后继，反馈清楚但惩罚不可逆；需要玩家侧审查
      判断这是否属于合理的后期构形承诺，而不是过硬死锁。

