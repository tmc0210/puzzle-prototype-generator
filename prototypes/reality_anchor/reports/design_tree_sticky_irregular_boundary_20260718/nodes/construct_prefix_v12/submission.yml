designer_claim:
  player_experience_core: >-
    开局只有两个错行单格 sticky 端点和两只独立箱，正确工作异形并不存在。两只箱都可从右侧
    向左跨 B/S，但哪只先占据两个端点之间的桥格，会决定先得到正确 L 还是镜像 L，并最终
    形成 S 或 2×2 方块。只有正确 S 的错行前沿能左推通过墙齿；左推后保留的右上悬臂又成为
    L 侧向下 pull 的直接接触面，使整块进入下方墙口并覆盖目标。
  player_action: >-
    玩家不推动眼前上箱越界，先转向下箱；下箱跨 B/S 后再左推一格，占据 `(4,5)` 并桥接
    `(4,4)`、`(3,5)` 两个端点，形成三格 L。随后上箱跨界补到 `(5,4)`，得到四格 S。
    玩家绕到 S 右下侧从 P 侧左推整块，再进入 L 侧向下，直接拉住身后的右上悬臂，把 S
    下拉进墙口，左下格覆盖唯一目标。
  visible_payoff: >-
    同样四格材料可见地形成两种命运：上箱先桥接、下箱补角会得到方块，其左推前沿撞上
    左上墙齿；下箱先桥接、上箱补角会得到 S，错行前沿避开墙齿。S 左推后玩家身后仍有
    右上悬臂，因此下一次 down 从 walk 变成整块 pull，形状的两个错位凸部连续兑现。
  why_this_level_exists: >-
    冻结父节点免费给出骑跨 B/S 的三格 L；本节点让玩家从四份非工作材料中先决定桥接顺序，
    真实构成此前不存在的 S，再由 S 本身的错行前沿与正交把手解释为什么该构形正确。它既
    不是预制异形的定位，也不复用 RA_CAND_0025 的主动 L 与反复活塞：S 只构成一次，随后
    在同一 P/L—墙口交接中被一次性消费。
  work_identity_conditions:
    - 初态不得含三格正确 L 或四格工作 S；全部胜路必须进入两者的同一 exact 对象态。
    - 上箱先桥接、下箱补成的 2×2 square 必须具有完整无胜后继。
    - 工作 S 必须由两次 box_to_sticky 与 sticky_merge 现场形成，不能由预制异形平移替代。
    - 全部胜路必须以工作 S 的错行前沿完成同一 left push，并随后以其右上悬臂完成 down pull。
    - 最终目标必须由完整 S 下拉后覆盖；分离端点、箱子或其它构形不得逐件覆盖取代。

packaging_account:
  opening: >-
    玩家开局站在上箱右侧，眼前动作与下箱转向都可见；左侧两个端点呈对角错行，B/S 与 P/L
    的竖向边界在上方明确标示。唯一目标位于左下墙口，只提示最终需要向下进入，不标出正确
    桥格、S 轮廓或平移终点。
  preparation: >-
    两箱可在 B 侧预推，真正承诺发生在谁先越界并占据桥格。下箱到 `(4,5)` 时连接两个端点，
    形成面向后续消费的正确 L；上箱先推进到镜像桥格则形成另一 L，继续补料成为方块。
  reveal_or_use: >-
    正确 S 与错误 square 都是紧凑四格构形。尝试向左时，square 的等宽上沿有一格进入墙齿，
    整块被拒；S 的上排右错一格，能整体左移。左移不是终点：玩家落在 S 右下，转入 L 侧
    后向下，身后的右上悬臂让整块被正交拉入下方墙口。
  ending: >-
    最终 down pull 同时完成第二次形状检查与目标覆盖；没有切后清箱、远距离回收或高潮后的
    搬运。目标只消费 S 的左下格，但整块能否抵达由四格前沿与把手共同决定。
  every_major_element_role:
    - 两个错行 sticky 端点：定义两个相邻桥接角；自身不是正确工作异形。
    - 下箱：正确的首桥材料；跨 B/S 后连接两端点，形成必经三格 L。
    - 上箱：补形材料；在正确 L 后跨 B/S 形成唯一工作 S；过早占桥会导向镜像 L/方块。
    - 固定 B/S：把箱按越界顺序转成黏料，使桥接次序成为不可逆构形承诺。
    - 固定 P/L：让 S 左移由 P 侧 push 完成，并让玩家随后在 L 侧以正交 down pull 抓住悬臂。
    - 左上墙齿：读取四格前沿；拒绝 square，放行右错一格的 S。
    - 下方墙口：保留玩家 down 目的地与 S 的完整目标格，消费正交 pull。
    - 单个底部目标：只要求异形真正进入墙口，不给出正确构形模板；不可删除唯一目标。
  known_perceptible_defects:
    - >-
      规范解 14 步，其中两只箱在 B 侧各有短距离预推；当前主设计判断为后期难度 3，而非 4/5。
      是否仍显得过短，必须交给 fresh Stage A，不能由完整图或对象动作数替代判断。
    - >-
      上箱先的错误要到下箱补成 square 后才在墙齿处确认，错误反馈比正确构形晚一个材料阶段；
      当前认为因果仍清楚，但真人是否觉得惩罚偏长需由玩家侧审查判断。
    - >-
      四条 raw SCC 胜路允许上箱在 B 侧预推时机不同，以及正确 L 做完整左移—右返；它们均
      收敛到同一 L、S、动作侧和终局职责，不声明原始输入串唯一。

