prototype_context:
  confirmed_rules:
    - 玩家所在 P/L 边界一侧在输入时决定本次为 push 或 pull；无 P/L 时全图为 push world。
    - push/pull 受力闭包递归包含同方向目标格上的全部可动物；任一分支被墙或越界时整步原子失败。
    - 多格 sticky 以完整连通分量作为刚体移动，移动后才按 B/S 边界归一化、合并或按连通块切分。
    - 拉世界中玩家只直接拉身后一格相邻对象；玩家目标格按整个受力闭包移动后的占用判断。
    - 所有目标必须同时被 crate、sticky 或锚点格覆盖才胜利；玩家覆盖不计。
  win_condition: all_targets_covered_by_objects
  object_and_event_semantics:
    - sticky 刚体任一格被墙、越界或不可动结构挡住时整块移动失败（force_blocked），凸角/横臂新增格都可能成为墙门。
    - sticky 连体块跨越 B/S 边界时，跨入箱世界的格变成独立箱子，剩余黏格按连通分量分裂。
    - 黏块推进墙口/通道后能否回返，取决于是否存在可达反向施力站位格且整块回推目标格开放；L 形凸角可提供侧向把手。
    - P/L 边界近旁，同一异形黏块从 P 侧推过与从 L 侧拉过呈现规则分叉：推则整块随力闭包前移，拉则只有身后相邻格被抽取、远端格留下、形状被改写；差异必须发生在边界附近，而非各处分别使用一次推和一次拉。
  allowed_mechanisms:
    - push_force
    - pull_force
    - movable_push_pull_anchor
    - sticky_rigid_body
    - box_to_sticky_binding
    - sticky_to_box_cutting
    - movable_box_sticky_anchor
    - dual_anchor
  tool_boundary:
    - solver、replay、graph、counterfactual 与 event probe 只验证机械事实，不提供审美结论。
    - explain-layout 与 try-inputs 使用当前 exact layout；完整图结论必须记录预算和 completeness。
    - 硬证据审查由 fresh evidence reviewer 独立执行；主 agent 不兼任。

player_context:
  basic_sokoban_experience_assumed: true
