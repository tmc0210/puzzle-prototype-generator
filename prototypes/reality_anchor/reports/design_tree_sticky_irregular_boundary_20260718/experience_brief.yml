    - 已掌握 B/S 锚点（固定与可移动）、各类腾挪基本技巧与多对象力链。
    - P/L 锚点为更早期知识，熟悉 push/pull 侧判定、边界交接与锚点本身可推拉。
    - 能迅速识别显然操作方向、基本可达性、局部几何关系和短死路；这些不作为难度。
