    黏块构成的 L 形、俄罗斯方块形等小异形结构在墙口、墙边、锚点边界的可动性、
    动作可逆性、状态变化。不限制异形结构的构造、切割、具体形状；允许几个 slot
    使用不同黏块形状，但关卡核心与高潮必须仍然是这一体验。锚点边界包含 P/L 边界：
    利用异形块在推拉锚点边界两侧的推拉可动性，关卡核心体验同样成立且优于单纯
