    human_source_ref: 本轮人类明确纠正（2026-07-18 对话原意）
  - statement: 持续设计过程直到每个作品完整、设计树饱满；中间过程无需暂停等待人类确认。
    human_source_ref: 本轮人类指令（2026-07-18 对话原意）
