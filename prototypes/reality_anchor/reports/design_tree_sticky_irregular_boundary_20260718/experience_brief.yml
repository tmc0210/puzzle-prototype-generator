    human_source_ref: 本轮人类 brief（2026-07-18 对话原意）
  - statement: 注意与现有归档关卡防撞；RA_CAND_0010/0015/0011 仅作档位角色校准，不作设计素材。
    human_source_ref: 本轮人类 brief（2026-07-18 对话原意）
  - statement: 锚点边界包含 P/L 边界；利用异形块在 P/L 边界两侧的推拉可动性可成立且优于单纯墙口/墙边腾挪。
    human_source_ref: 本轮人类确认（2026-07-18 对话原意）
