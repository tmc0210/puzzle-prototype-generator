experience_core:
  experience_statement: >-
    玩家已把黏块当作“一整块一起动的刚体”。本关让玩家面对一个 L/T/S/Z 等小异形黏块，
    亲眼看到同一个整体形状在墙口、墙边或锚点边界（B/S 与 P/L）处产生逐格分叉的后果：
    凸角对准开口才能整进整出、凸角被墙齿卡住则整块推不动、某个旋转在窄口有去无回而
    另一个旋转靠凸角把手全身而退、跨越 B/S 时跨界格变回箱子而剩余格按连通块裂开、
    在 P/L 边界从 push 侧与 pull 侧经过时呈现不同的可动性与可逆性。玩家必须读出
    具体形状、预见分叉并主动利用它，而不是把异形块当横条搬运。
  visible_setup: >-
    开局可见一个（或可由现有材料拼出的）小异形黏块，以及至少一处对它构成形状检查的
    边界：带墙齿的口、限制反向站位的墙边、B/S 边界或 P/L 边界；目标位置暗示形状
    分叉后的具体用途。
  player_action: >-
    玩家读出黏块的具体形状与边界的关系，主动选择旋转/拼法/进入方向/进入侧，
    亲自执行让形状分叉兑现的关键动作序列（通过、卡住后换形、切割、pull 抽取或
    利用可逆性窗口）。
  visible_payoff: >-
    关键操作后，形状分叉产生可见且被后续使用的状态变化：整块通过/被拒之外的差异、
    切出的箱子与剩余黏块各自承担新责任、pull 抽取后形状被改写、或“看似不可逆”的
    局面被凸角把手撤销；该变化直接收束到目标覆盖。
  why_level_exists: >-
    玩家此前只会用规整黏块组的可达性；本关让“具体形状”本身成为谜题主角，
    证明同一格数、同一刚体规则下，异形形状在边界处有不同的命运，且这种差异
    可以被玩家读出并利用。这是归档中尚无一关以此为主角的体验（0025 的 L 是
    活塞工具而非边界分叉主角）。
  core_boundary:
    central_objects:
      - 小异形黏块（L/T/S/Z/方块缺角等，具体形状不限）
      - 形状所面对的墙口/墙边/B-S 边界/P-L 边界
      - 由形状分叉产生的状态变化（切割产物、把手可逆性、两侧可动性差异）
    supporting_objects:
      - 目标、墙体、普通箱、P/L 与 B/S 锚点本体、走位空间
    mechanism_role_boundary: >-
      P/L 可作为核心边界出现（异形块在其两侧的推拉可动性差异属于核心），也可作为
      支持机制出现；但当主要回报变成“锚点也可推拉”或纯锚点刚体腾挪时，作品身份
      丢失，该方向应另开体验核心。

work_identity:
  conditions:
    - 核心动作发生时黏块保持异形连通形状，且该具体形状对结果有区分性责任。
    - 玩家必须亲自完成一次“读出形状 → 预见边界分叉 → 执行”的动作；分叉结果可见。
    - 边界分叉产生的状态变化被后续实际使用，最终收束到目标覆盖。
    - 主要体验回报来自异形黏块与边界的形状关系，而非锚点时序或纯腾挪。
  counterfactuals:
    - 把异形黏块换成等格数横条/单格后核心体验基本不变 → 形状未承担区分性责任，身份丢失。
    - 核心动作不发生任何形状分叉（无切割、无卡形、无可逆性差异、无两侧可动性差异），
      只是把给定黏块推到目标 → 退化为普通刚体搬运，身份丢失。
    - “P/L 两侧可动性差异”只在远离边界的对象上分别使用一次推和一次拉，
      分叉不发生在边界附近、也不由黏块形状决定 → 只是普通推拉混合使用，身份丢失。
    - 玩家无需读懂具体形状、靠局部显然操作即可走完 → 形状降为材料，身份丢失。
    - 高潮变成 P/L 锚点时序锁或双锚刚体腾挪 → 滑入另一体验核心（RA_CAND_0028 family 已饱和）。

