      从与正确拼法相同的前三步把手位执行 down 合法，触发 sticky_merge 并形成
      (3,5)、(4,5)、(5,5) 三格横条，立即覆盖东目标；从该 exact state 出发的完整
      4 状态后缀搜索无胜态。
  - claim_id: bs_cut_splits_l_into_box_and_tail
    claim: >-
      canonical 第六步 left 触发 pull_object、move_sticky_rigid 与 sticky_to_box；
      pre-cut L 被改写为 (1,4) 的箱子与 (2,4)、(2,5) 的两格竖条。
  - claim_id: canonical_pl_side_switch_changes_pull_to_push
    claim: >-
      canonical 构造与切割阶段在 P/L 的 L 侧执行 pull；切割后玩家进入 P 侧，
      第七、八步依次以 push 推动箱子和竖条完成两个目标。
  - claim_id: all_wins_use_single_construction_logic
    claim: >-
      complete 26-state graph 的 22-state win-reaching 逆向闭包在不聚合玩家坐标时有
      9 个 raw SCC、3 条 source-to-win DAG 路径；三条均只经过唯一的 initial materials
      -> boundaryReadyL sticky_merge 边，不存在异地合 L 后搬回或其它可胜构造逻辑。
  - claim_id: all_wins_keep_same_milestones_and_product_duties
    claim: >-
      三条 raw SCC 路径全部必经 boundaryReadyL、preCutL、postCutProducts、finalProducts；
      分别禁用四对象态的原始完整图搜索均无胜。三个 terminal 胜态只有一个对象态类：
