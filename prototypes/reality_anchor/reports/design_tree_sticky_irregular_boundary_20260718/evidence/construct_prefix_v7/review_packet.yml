      两个独立产物的最后兑现顺序或玩家终局站位。
  - claim_id: all_wins_use_declared_event_families
    claim: >-
      在当前完整图中分别禁止 pull、push、material normalization、sticky_merge、
      sticky_rigid_move 后，搜索均 complete 且无胜；完整可达图没有 anchor_boundary_shift 事件。

