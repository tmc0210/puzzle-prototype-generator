solution_uniqueness_review:
  declared_result: equivalent_variants_only
  search_scope: complete
  exact_version_match: true
  known_raw_winning_variants:
    - "胜态 57 的最短代表：left left up left left left up right（深度 8）"
    - "胜态 73 的最短代表：left left up left left left up down right（深度 9）"
    - "胜态 94 的最短代表：left left up left left left right down left up up（深度 11）"
  equivalence_evidence_basis:
    - >-
      construct_prefix_v6_uniqueness/results.json 报告 exact version 匹配的完整图：
      193 个可达状态、476 条转移、terminalizeWins=true、3 个胜态。
    - >-
      三个胜态去除玩家坐标后只有 1 个胜利对象态类；箱子均在 (1,3)，
      黏块均在 (3,4)、(3,5)。
    - >-
      三个胜态各给出一条实际最短代表输入；代表输入展示纯走位差异，以及切割后
      箱子与竖条完成顺序的换序。完整回返环与相互独立必要步骤的换序原则上可按
      工作室标准视为同一逻辑类。
  known_non_equivalent_win_refs: []
  status: unknown
  limits:
    - >-
      winningStates=3 只表示 terminalized 完整状态图有 3 个胜利状态，不表示完整图中
      只有 3 条原始胜路；循环、汇合及同一胜态的其它到达路径没有在允许证据中逐条
      枚举或形成路径等价商。
    - >-
      每个胜态的一条 shortestInputs 不能证明所有到达该胜态的胜路都保持相同对象职责、
      目标分配和依赖步骤因果先后。
    - >-
      事件缺失探针只证明所有胜路含指定 event pattern；它不证明事件实例、顺序、
      逐对象必要性，也不把全部胜路归入同一玩家逻辑类。
    - >-
      当前证据未给出已知非等价胜解，因此本项是证据不足的 unknown，而不是 contradicted。

claims:
  - claim_id: solvable_exact_trace
    claim: canonical inputs 共 8 步且全部合法，终态同时覆盖两个目标并胜利。
    status: supported
    evidence_basis:
      - >-
        layout.txt 的实算 SHA256 为 6bdff0b7ab64ca4558140b5b31567f94c28af3bce3e427dd3d05a5038a74cb03，
        与 exact version、solve instance 和 uniqueness artifact 一致。
      - >-
        canonical_replay.json 记录 inputs 为 left,left,up,left,left,left,up,right，
        executedSteps=8、legalThroughStep=8、completed=true；终态 isWin=true，箱子覆盖
        (1,3) 目标，黏块覆盖 (3,5) 目标。
      - prototypes/reality_anchor/mechanic.yml#win
    limits:
      - 单条 canonical replay 只支持该 exact trace 的合法与获胜，不单独支持完整解族结论。

  - claim_id: correct_prefix_constructs_required_l
    claim: >-
      前四步 left,left,up,left 全部合法；第四步触发 pull_object、move_sticky_rigid 与
      sticky_merge，把原横向二格黏块和右下单格合成占据 (3,4)、(4,4)、(4,5)
      的三格 L。该前缀后仍可在最短 4 步内完成关卡。
    status: supported
    evidence_basis:
      - >-
        prefix_counterfactuals.json 的 correct_l_merge 与 canonical_replay.json 第 1—4 步
        一致：前缀全部合法，第 4 步事件为 pull_object:sticky#2、move_sticky_rigid、
        sticky_merge:n1，afterKey 的黏块坐标为 3,4;4,4;4,5。
      - >-
        同一 exact 前缀状态的 suffixSolve found=true、cost=4，返回后缀
        left,left,up,right。
    limits:
      - 该反事实支持这个具名前缀的构造与四步后缀；它本身不证明所有胜路都必须经过这一精确前缀。

  - claim_id: two_nearby_bar_constructions_are_complete_dead_ends
    claim: >-
      lower-bar 前缀 left,left,up,down 与 upper-bar 前缀 up,up,left,up 均全部合法，
      分别形成局部横向三格黏块；从各自精确前缀状态出发的完整 96 状态后缀搜索均无胜态。
    status: supported
    evidence_basis:
      - >-
        prefix_counterfactuals.json 的 wrong_lower_bar_merge 记录 prefixLegal=true，
        黏块坐标为 3,5;4,5;5,5；suffixSolve searchStatus=complete、exploredStates=96、
        found=false。
      - >-
        prefix_counterfactuals.json 的 wrong_upper_bar_merge 记录 prefixLegal=true，
        黏块坐标为 3,4;4,4;5,4；suffixSolve searchStatus=complete、exploredStates=96、
        found=false。
    limits:
      - 结论只覆盖这两个具名 exact prefix state，不外推为其它所有错误构造均为死路。

  - claim_id: bs_cut_splits_l_into_box_and_tail
    claim: >-
      canonical 第六步 left 触发 pull_object、move_sticky_rigid 与 sticky_to_box；
      L 的领头格跨过 B/S 边界后成为位于 (1,4) 的独立箱子，剩余黏块为
      (2,4)、(2,5) 的竖条。
    status: supported
    evidence_basis:
      - >-
        canonical_replay.json 第 6 步 beforeKey 为 M:2,4;3,4;3,5，事件为
        pull_object:sticky#1、move_sticky_rigid、sticky_to_box:n1；afterKey 为
        C:1,4|M:2,4;2,5。
      - >-
        mechanic.yml 的 box_sticky_normalize 规定 legal move 后 box side cells 变 crate、
        sticky side cells 变 sticky cells，允许解释该坐标变化为 B/S 材料改写。
    limits:
      - 此项由 canonical 事件实例支持；逐胜路必要性另由事件探针审查，不能由本 trace 外推。

  - claim_id: pl_side_switch_changes_pull_to_push
    claim: >-
      构造与跨 B/S 切割期间玩家位于 P/L 的 L 侧并执行 pull；切割后玩家位于
      P 侧，canonical 第七、八步依次以 push 语义推动箱子和竖条完成两个目标。
    status: supported
    evidence_basis:
      - >-
        canonical_replay.json 第 4—6 步均发出 pull_object；第 6 步后玩家为 (1,5)，
        第 7 步发出 push_object:crate#1，第 8 步发出 push_object:sticky#1，并在第 8 步获胜。
      - >-
        状态键固定 P/L 为 P:1,2;L:2,2；mechanic.yml 规定输入时由玩家所在 P/L
        一侧选择 push 或 pull 语义，事件序列与切换前后语义一致。
    limits:
      - 支持的是 canonical trace 中这次侧区切换及其语义，不单独证明所有胜路的同序切换。

  - claim_id: every_win_uses_declared_material_chain
    claim: >-
      当前 exact v6 的完整 193 状态、476 转移图中，没有缺少 pull_event、
      material_normalization、sticky_merge 或 sticky_rigid_move 的胜路；固定锚点探针也未发现
      缺少 B/S 箱黏改写或 P/L 推拉分流的胜路。本 claim 不包含锚点位移或 box_to_sticky。
    status: supported
    evidence_basis:
      - >-
        event_probe.json 在与 exact layout 一致的图上对 pull_event、material_normalization、
        sticky_merge、sticky_rigid_move 分别得到 found=false、status=complete、
        exploredStates=193；layout_analysis.json 对应完整图为 193 状态、476 转移。
      - >-
        fixed_anchor_probe_box_sticky.json 的 fixed_box_sticky_effect 缺失胜路搜索为
        found=false、status=complete、exploredStates=196，且 fixed box_sticky 的完整可达扫描
        没有 forbidden anchor shift。
      - >-
        fixed_anchor_probe_push_pull.json 的 fixed_push_pull_effect 缺失胜路搜索为
        found=false、status=complete、exploredStates=196，且 fixed push_pull 的完整可达扫描
        没有 forbidden anchor shift。
    limits:
      - >-
        探针证明的是 event pattern / fixed-effect 级必要性，不证明某个具体事件实例、
        每个初始对象的逐对象必要性或各事件的唯一因果顺序。
      - >-
        原图确有缺少 anchor_boundary_shift:push_pull 与 anchor_boundary_shift:box_sticky 的
        canonical 胜路；claim 已明确排除锚点位移，因此不构成冲突。
      - >-
        fixed-anchor probe 是 196 状态的诊断变体图，只支持其声明的固定效果范围，
        不可替代原 exact 图的其它路径结论。

  - claim_id: all_wins_keep_same_product_duties
    claim: >-
      完整图有 3 个 raw 胜态，去除玩家坐标后仅有 1 个胜利对象态类：箱子固定在西目标
      (1,3)，竖条固定在东目标列 (3,4)、(3,5)。三条胜路都先完成同一 L 构造与 B/S
      切割，差异仅为玩家绕步以及切割后两个独立产品推送的先后。
    status: unknown
    evidence_basis:
      - >-
        construct_prefix_v6_uniqueness/results.json 的完整图确有 3 个 terminalized 胜态，
        三者 objectKey 相同：C:1,3 与 M:3,4;3,5；这支持终局产品落位一致。
      - >-
        三个胜态各自给出的一条 shortestInputs 都以前六步
        left,left,up,left,left,left 完成 L 构造和 B/S 切割；其后代表路径展示绕步和
        箱/竖条完成顺序换序。
      - >-
        完整 event probe 支持所有胜路都含 pull、材料改写、黏合和刚体移动这些事件模式。
    limits:
      - >-
        允许证据只给每个胜态的一条最短代表，不是全部胜路枚举；3 个胜态不能改写为
        只有 3 条胜路。
      - >-
        单一终局对象态类只证明终局落位相同，不证明所有到达路径的对象职责、目标分配
        和依赖步骤因果先后相同。
      - >-
        两个 bar 反事实只排除两个具名前缀；事件模式必要性也不证明每条胜路先经过同一
        精确 L 状态再切割。因此“所有胜路差异仅限绕步/独立换序”证据不足。

hard_failures:
  - >-
    solution_uniqueness_claim 声明 equivalent_variants_only，但允许证据未提供完整胜路的
    逻辑等价分类；按强制送审门不能判为 supported。

evidence_gaps:
  - >-
    需要从当前 exact complete graph 导出的全胜路逻辑等价证据：至少应明确消去回到同一
    完整状态的环，并对全部剩余 win-reaching 路径证明对象职责、目标分配和依赖因果顺序一致。
  - >-
    现有 3 条 shortestInputs 只是三个胜态的代表路径；缺少同一胜态其它到达路径以及汇合前
    分支的等价性覆盖说明。
  - >-
    event probe 没有事件实例、事件顺序或 per-object necessity 的覆盖，不能独自补足解族等价性。

overall_hard_status: incomplete
required_action: rerun_or_supply_evidence
