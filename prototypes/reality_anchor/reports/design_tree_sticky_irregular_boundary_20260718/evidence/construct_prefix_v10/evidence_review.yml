    claim: >-
      The reviewed layout is the exact v10 instance whose SHA256 is
      1c273480c51de2e3bbd284c2962729cd8cc7c38b549719f984b059f3cfd5a89a.
    status: supported
    evidence_basis:
      - >-
        Direct SHA256 of the allowed layout.txt equals
        1c273480c51de2e3bbd284c2962729cd8cc7c38b549719f984b059f3cfd5a89a.
      - >-
        construct_prefix_v10_uniqueness/results.json binds exactVersion,
        layoutPath, and the same layoutSha256; its artifact-local candidateId is
        RA_STICKY_IRREGULAR_BOUNDARY_CONSTRUCT_PREFIX_V10.
      - >-
        canonical_replay.json embeds the identical layout text and the same
        allowed layoutSource.
    limits:
      - >-
        canonical_replay.json does not itself carry an exactVersion field; its
        binding is by embedded layout content and layoutSource, cross-checked
        against the hashed layout and uniqueness results.
      - >-
        The review packet uses the stable candidate id
        RA_STICKY_IRREGULAR_BOUNDARY_CONSTRUCT_PREFIX, while versioned artifacts
        use RA_STICKY_IRREGULAR_BOUNDARY_CONSTRUCT_PREFIX_V10. Their literal id
        strings differ; exact-instance support rests on the matching exactVersion,
        layout path, embedded layout, and SHA256 rather than on candidate-id
        string equality alone.

  - claim_id: solvable_exact_trace
    claim: >-
      canonical inputs contain 16 legal steps and win on step 16 with the crate
      on (6,7) and the two-cell sticky arm on (5,5)(6,5).
    status: supported
    evidence_basis:
      - >-
        canonical_replay.json replay.completed=true, executedSteps=16,
        legalThroughStep=16; every recorded step is legal and final.isWin=true.
      - >-
        Step 16 is up with pull_object:sticky#1 and move_sticky_rigid; its final
        key is Ply:6,4|C:6,7|M:5,5;6,5|PL:P:5,1;L:6,1|BS:B:1,7;S:1,6.
      - >-
        layout_analysis.json independently returns the same 16-input winning
        trace at cost/depth 16.
    limits: []

  - claim_id: mandatory_p_side_right_push_opens_shape_gate
    claim: >-
      Every win first moves the intact L from (4,4)(5,4)(5,5) to
      (5,4)(6,4)(6,5) by right push; this opens (5,5), after which the player can
      pass through that gate to the lower action side.
    status: supported
    evidence_basis:
      - >-
        initialObjectActionAudit exhausts the 3-state player-only initial object
        closure and finds exactly one first object-action class and one viable
        class: right / push_object:sticky#1,move_sticky_rigid to the asserted key.
      - >-
        causalMilestones.milestoneEdgeNecessityChecks.pSideRightPush is
        complete/no-win when the exact edge is forbidden; forbidding the
        pSideRightPushedIntactL role is also complete/no-win.
      - >-
        canonical_replay steps 2-5 show the foot leave (5,5), then the player
        legally enters (5,5) and continues to (5,6).
      - >-
        tooth_block_replay independently shows the asserted step-2 rigid move
        and that another immediate right force is blocked, fixing the opening
        move to the one-cell shift shown in the canonical state.
    limits:
      - >-
        "P side", "L side", and "gate" are coordinate descriptions tied to the
        fixed anchors and this layout; the evidence supports the exact state
        transition and occupancy relation, not a generic named runtime event.

  - claim_id: mandatory_first_l_side_down_pull_recloses_gate
    claim: >-
      Every win moves the intact L from x=6 down to (5,5)(6,5)(6,6) by the first
      down pull, reoccupying the upper gate and cutting the walk-only return.
    status: supported
    evidence_basis:
      - >-
        causalMilestones gives one expected object-transition variant from
        pSideRightPushedIntactL to firstLSideDownPulledIntactL: down with
        pull_object:sticky#1 and move_sticky_rigid, rawEdgeCount=1.
      - >-
        The exact forbidden-edge check and the forbidden-role check are both
        complete/no-win, exploredStates=24.
      - >-
        canonical_replay step 7 records the asserted before/after keys and shows
        sticky cells at (5,5)(6,5)(6,6); layout walls plus those occupied cells
        block the player's walk-only route back through (5,5).
    limits:
      - >-
        "recloses" describes occupancy immediately after this mandatory
        transition. The complete graph also contains reversible backtracking
        inside the same raw SCC; the claim is not read as permanent closure under
        arbitrary later object motion.

  - claim_id: mandatory_second_l_side_down_pull_cuts_foot
    claim: >-
      Every win then uses a second down pull with rigid motion and
      sticky_to_box:n1, producing exactly crate (6,7) plus sticky arm
      (5,6)(6,6); forbidding the exact transition or normalization event removes
      all wins.
    status: supported
    evidence_basis:
      - >-
        canonical_replay step 8 records down with pull_object:sticky#1,
        move_sticky_rigid, sticky_to_box:n1 and the exact asserted output key.
      - >-
        causalMilestones.boundaryCutTransitionVariants contains exactly one
        variant with the asserted input, events, source, and output.
      - >-
        The exact secondLSideDownPullCut forbidden-edge check is complete/no-win
        at 28 states; search without any sticky_to_box:n1 edge is likewise
        complete/no-win at 28 states.
      - >-
        winReachingObjectKeys contains no other crate-bearing cut output.
    limits: []

  - claim_id: mandatory_l_side_up_pull_finishes_arm
    claim: >-
      Every win finishes from the post-cut state with an up pull that moves the
      sticky arm to (5,5)(6,5); there is no winning P-side push finish.
    status: supported
    evidence_basis:
      - >-
        causalMilestones.finalTransitionVariants contains exactly one variant:
        up / pull_object:sticky#1,move_sticky_rigid from the post-cut key to the
        sole final key.
      - >-
        The finalLSideUpPull exact forbidden-edge check is complete/no-win after
        exploring 1062 non-winning states.
      - >-
        canonical_replay step 16 reproduces this transition and wins.
    limits: []

  - claim_id: fixed_product_duties_and_terminal_object_key
    claim: >-
      Across all wins, the crate remains on target (6,7), the sticky arm covers
      targets (5,5)(6,5), and the complete graph has one win state and one
      terminal object key.
    status: supported
    evidence_basis:
      - >-
        The complete graph reports winningStates=1; winningObjectKeys contains
        only C:6,7|M:5,5;6,5|PL:P:5,1;L:6,1|BS:B:1,7;S:1,6.
      - >-
        The only win-reaching crate-bearing object keys are the post-cut key and
        final key; both keep C at (6,7).
      - >-
        causalMilestones.finalObjectDuties records crate target=true,
        movesAfterCut=0, and bothTargets=true for the final sticky arm.
      - >-
        mechanic.yml target_cover_win confirms that these object types cover
        goals for all_targets_covered_by_objects.
    limits:
      - >-
        One win state alone would not prove path necessity; path and duty claims
        are supported here by the complete reverse closure and separate
        transition/forbidden-edge evidence.

  - claim_id: complete_graph_has_single_player_logic_class
    claim: >-
      The 1063-state / 2471-transition complete graph has one winning state; its
      49-state / 109-transition win-reaching closure has four raw-state SCCs and
      one source-to-win condensation path, with only equivalent walk and
      complete-state-return variants around one four-milestone player logic
      class.
    status: supported
    evidence_basis:
      - >-
        layout_analysis.json and uniqueness/results.json independently report the
        identical complete graph counts and one winning state.
      - >-
        rawStateSccProof reports rawSccCount=4 and exactAcyclicPathCount=1 over
        unaggregated runtime state keys; analyze.ts shows the reverse closure,
        Tarjan SCC, and full condensation-path enumeration used to compute them.
      - >-
        allWinReachingObjectTransitionSignatures enumerates the full object-change
        vocabulary in the win closure: the four mandatory transitions, their
        reversible intact-L backtrack, and the audited horizontal trial/return;
        no alternate cut, finish, or object-duty transition appears.
      - >-
        All four milestone edges and roles have complete no-win bypass checks;
        the horizontal trial pair returns to the same complete runtime state and
        is optional.
    limits:
      - >-
        SCC membership by itself is not treated as uniqueness proof. Support also
        relies on the exhaustive win-reaching object-transition signatures,
        unique cross-SCC variants, exact milestone counterfactuals, and the
        explicit same-state trial return.
      - >-
        The evidence does not claim a unique raw input sequence and does not
        classify dead-branch behavior as a winning logic class.

  - claim_id: no_win_reaching_merge_rebind_or_anchor_shift
    claim: >-
      No winning path uses sticky_merge, box_to_sticky, or
      anchor_boundary_shift as a substitute for the mandatory chain.
    status: supported
    evidence_basis:
      - >-
        eventReachabilityCounts over the complete win-reaching subgraph is zero
        for anchorBoundaryShift, stickyMerge, and boxToSticky.
      - >-
        Full-graph counts distinguish dead branches: stickyMerge=11 and
        boxToSticky=17 are reachable only outside the reverse win closure, while
        anchorBoundaryShift=0 globally.
      - >-
        analyze.ts counts event prefixes on every edge in the complete graph and
        separately on every edge whose endpoints lie in the reverse win closure.
    limits:
      - >-
        The zero is scoped to win-reaching transitions. It does not claim that
        sticky_merge or box_to_sticky is globally unreachable in this layout.

