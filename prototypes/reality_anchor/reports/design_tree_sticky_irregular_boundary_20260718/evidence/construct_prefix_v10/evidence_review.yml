      construct_prefix_v10_uniqueness/results.json graph: complete, 1063 reachable
      states, 2471 legal transitions, 1 winning state; reverse win closure has 49
      states and 109 transitions.
    - >-
      construct_prefix_v10_uniqueness/results.json rawStateSccProof: 4 raw-state
