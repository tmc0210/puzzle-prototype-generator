claims:
  - claim_id: solvable_exact_trace
    claim: canonical inputs 共 17 步且全部合法，终态同时覆盖两个目标并胜利。
    status: supported
    evidence_basis:
      - canonical_replay.json: completed=true, executedSteps=17, legalThroughStep=17, every step legal=true, final.isWin=true
      - "final render: * at (1,3) = crate covering west goal, m at (5,4) = sticky cell covering east goal, satisfying all_targets_covered_by_objects"
      - inputs in replay exactly match solve_instance.canonical_inputs in the packet
      - independent solver (layout_analysis_baseline_v2.json) confirms found=true at cost 17 with the identical input sequence
    limits: []

  - claim_id: foot_cage_blocks_push_side
    claim: >-
      初始局面玩家站在 L 凸脚正西一格；四向中 east 被凸脚 destination_occupied、
      north 被凸脚 destination_occupied、south 为墙 destination_blocked，
      唯一合法互动动作是 west pull。
    status: supported
    evidence_basis:
      - layout + state keys: player at (3,5), L foot cell of the sticky L-triomino at (4,5); player stands exactly one cell west of the L foot
      - reviewer-run try-inputs: east(right) illegal destination_occupied (sticky foot cell), north(up) illegal destination_occupied (sticky cell at (3,4)), west(left) legal pull with pull_object:sticky#1
      - west is the only legal move at all from the initial state (graph initial region has exactly 1 commitment; SCC s0 outgoingCount=1), consistent with "唯一合法" for interactive moves
    limits:
      - Terminology deviation, non-material: south(down) is illegal with stop reason force_blocked, NOT destination_blocked. Under the verified runtime (mechanics.ts stepPush -> stepForce -> planObjectMove), the player is in the pull region, so south is a PULL of the movable sticky cell at (4,5) whose closure hits the wall at (4,6) -> force_blocked. destination_blocked is reserved for a wall directly in front of the player, which is not this geometry. The claimed reason string and its implicit push-side framing are wrong; the mechanical fact (south illegal, blocked by the wall behind the foot, west pull uniquely legal) is verified. Designer should fix the reason wording; no mechanical consequence.

  - claim_id: extraction_cuts_via_bs
    claim: >-
      canonical 第二步 left 触发 pull_object:sticky#1、move_sticky_rigid 与 sticky_to_box:n1，
      L 领头格越过 B/S 边界被切成独立箱子，剩余两格保持 sticky 竖条。
    status: supported
    evidence_basis:
      - canonical_replay.json step 2: events pull_object:sticky#1, move_sticky_rigid, sticky_to_box:n1; after-state C:1,4 with M:2,4;2,5 (crate at (1,4), sticky vertical domino at (2,4),(2,5))
      - mechanic.yml box_sticky_normalize + verified runtime boxStickySideAt (B at x=1 => box side = x<=1): the leading cell pulled to (1,4) enters the box side and converts to a crate
      - reviewer-run counterfactual: identical pulls with the B/S anchor relocated east produce pull_object:crate#3 twice, the full 3-cell group moving as crates, and NO sticky_to_box / no cut -- isolating the B/S boundary as the cause of the conversion and the cut
    limits:
      - The replay contains no explicit sticky_split event; the "cut" is established structurally (post-state group = 2-cell M plus independent crate) and causally (counterfactual above). The n1 suffix of sticky_to_box:n1 is not glossed in the packet artifacts; treated as an instance label, not judged.

  - claim_id: all_wins_assign_products_to_distinct_goals
    claim: >-
      当前 exact v2 的完整 766 状态图中，3 条 non-win -> win 入边最终都把切出箱子送上西目标
      且把剩余竖条送上东目标；去除玩家坐标后只剩一个胜利对象态类。
    status: supported
    evidence_basis:
      - "layout_analysis graph block: status=complete, reachableStateCount=766, winStateCount=3 (matches uniqueness results.json graph block: complete, 766 states, 1824 transitions, 3 winning states)"
      - "uniqueness results.json: all 3 winning states share objectKey C:1,3|M:5,3;5,4|PL:P:1,2;L:2,2|BS:B:1,1;S:2,1 => exactly 1 winning object-state class"
      - that class places the crate on the west goal (1,3) and the sticky vertical domino covering the east goal (5,4); anchors unmoved
      - "allWinningIncomingEdges=3, enumerated: depths 16->17 and 17->18 via right/pull (crate already on west goal), 24->25 via up/push of the crate onto the west goal; every edge lands in the same object class, so every graph win terminates with cut-crate=west goal and remnant=east goal"
    limits:
      - The crate carries indistinguishable identity in this prototype; "切出箱子" assignment is read from the object class and terminal edges, both consistent with the cut crate being the west-goal product in every win.
      - Complete-graph conclusion only because graph status is complete; not budget-exhausted.

  - claim_id: pl_boundary_makes_west_a_pull
    claim: >-
      玩家初始位于 P/L 的 push 侧；西侧移动按 pull 语义从身后一格抽取黏块，
      故 west 抽取由 P/L 边界规则分叉产生而非普通推动。
    status: supported
    evidence_basis:
      - mechanic.yml: pull_force semantics = player and the adjacent object behind move together; push_force = objects ahead pushed
      - verified runtime forceModeAt/isOnFirstAnchorSide: P at (1,2), L at (2,2) => push side = x<=1; player at x=3 is on the L (pull) side, so west movement uses pull semantics and draws the sticky cell from (4,5), one cell behind (east of) the player
      - canonical step 1: input left (west) emits pull_object:sticky#1 (not push_object), and the extracted cell is drawn from behind -- exactly pull semantics; no push-side geometry can extract an object from the east while moving west
    limits:
      - Terminology deviation, non-material: the claim text says "玩家初始位于 P/L 的 push 侧" (push side). Under the verified rule the player is on the PULL side (L side, x>=2). Every operational part of the claim -- west is a pull, extraction comes from the cell behind, and this is produced by the P/L boundary's side selection rather than ordinary pushing -- is verified; the side name in the sentence is a slip. Same wording-family slip as foot_cage_blocks_push_side; recommend the designer correct side naming in both claims.

