review_target: baseline_root

prototype_rules:
  confirmed_rules:
    - walk: 目标格为空时玩家移动一格（事件 walk）。
    - push_force（push region）: 玩家与前方受力对象闭包同时前移一格，力沿运动方向传递；任一对象的整组目标格中有墙或被堵则整步 illegal（force_blocked）。
    - pull_force（pull region）: 玩家与身后相邻对象的受力闭包同时前移一格；玩家目标格只需在整个闭包移动后腾空（玩家目标格被将移动对象的旧格占据不阻止该步）。
    - box_sticky_normalize（settle）: 每次合法移动后，B/S 锚点按坐标划分 box 侧与 sticky 侧；box 侧的对象格变为 crate，sticky 侧的对象格变为 sticky cell（事件 box_to_sticky:nN / sticky_to_box:nN）。
    - sticky_merge（settle）: 正交相邻的 sticky cell 合并为一个刚性块；不连通部分分成多个块（事件 sticky_merge:nN / sticky_split）。
    - target_cover_win: settle 后所有目标被 crate、sticky cell 或锚点格覆盖即胜；玩家站在目标上不算。
    - sticky_block 刚性组: 整组四连通块一起平移；任一格目标被墙/被堵则整步失败。
    - push_pull_anchor: P 格所在列为 push 侧标签、L 格所在列为 pull 侧标签；玩家输入瞬间所在列（相对锚点列）决定该步使用 push 还是 pull 语义。锚点本身可被推/拉移动。
    - box_sticky_anchor: B 格列与 S 格列之间按列划分 box/sticky 两侧（B 在左、S 在右时，x <= B.x 为 box 侧）。锚点本身可被推/拉移动。
  win_condition: all_targets_covered_by_objects（玩家不算）
  object_and_event_semantics:
    - "#": 墙（solid）
    - ".": 地板（walkable）
    - "G": 目标
    - "@": 玩家
    - "C": crate（可推可拉，目标覆盖，个体不可区分）
    - "M": sticky_block cell（可推可拉，刚性组，目标覆盖；当前可见区分仅为连通形状）
    - "P"/"L": push_pull_anchor 的 push 侧/pull 侧标签格
    - "B"/"S": box_sticky_anchor 的 box 侧/sticky 侧标签格
    - 事件: walk, push_object, pull_object, move_sticky_rigid, force_chain, box_to_sticky:nN, sticky_to_box:nN, sticky_merge:nN, sticky_split, anchor_boundary_shift
  player_prior:
    - 玩家已充分熟悉规整形状小黏块组的可达性/可动性、黏块拼接与切分、B/S 锚点推拉、各类腾挪基本技巧。
    - P/L 锚点相关知识为更早期内容且较为熟悉。

human_review_constraints: []

