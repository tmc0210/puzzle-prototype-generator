independent_reading:
  review_target: baseline_root
  node_id: RA_TREE_NODE_BASELINE_V2
  candidate_id: RA_BASELINE_STICKY_IRREGULAR_BOUNDARY
  exact_version: v2_sha256_b6abe9e2eb1c32b76cc67f7e9da19da294a3800ba53788d0670c464c584ffc22

  opening_read: >
    玩家看到一张 8x8 紧凑地图。左上是被墙廊道钉死的 B/S 与 P/L 两组静态锚点；
    西侧远端有一个目标 (1,3)，东侧偏右有一个目标 (5,4)。棋盘中部是一个三格
    L 形不规则黏块，横臂 (3,4)(4,4)、凸脚 (4,5)，玩家起点 (3,5) 恰在横臂西端
    正西一格，即天然站在整条横臂的 pull 位上。B/S 锚点按列在 x<=2 与 x>=3 之间
    划出一条 box/sticky 材料分界线，黏块横臂正压在这条线上，其西端一格 (3,4)
    再退一格就越界。竖墙 (4,6) 把底行分成西走廊与东侧室。

  player_actually_does: >
    玩家直接向左连拉两步：第一步把整个 L 形黏块西移一格，第二步领头格越过
    B/S 边界在 settle 中固化成独立 crate，L 形被切成 crate 加两格 sticky 竖条。
    玩家顺手把 crate 推上西侧目标。随后玩家沿底行绕过竖墙进入东侧室，把竖条
    先东拉两格、再北拉一格、最后东拉一格，竖条底格覆盖东侧目标，与已占的
    西侧目标同时成立，胜利。全程 17 步，其中约 11 步是纯走位绕位。

  key_visible_changes:
    - step 1：整个 L 形黏块随一次拉动整体西移，玩家直接见证不规则黏块作为刚性整体移动。
    - step 2：领头格越过 B/S 边界列固化为 crate，L 形被不可逆切成 crate 加竖条；这是全关唯一的材料变化与承诺点。
    - step 3：crate 被推上西侧目标，第一个目标关闭。
    - step 10/11：竖条作为刚体两次东拉，穿过东侧室抵近东目标西侧。
    - step 14：竖条被北拉一格，绕开东目标正西格（若竖条留在 (4,4)(4,5)，从东侧拉会把底格 (4,4) 拉离目标列，无法覆盖）。
    - step 17：竖条东拉一格，底格 (5,4) 覆盖东侧目标，双目标同时成立，胜利。

  visible_payoff: >
    回报集中在开局两步：一次拉动让整个不规则 L 形刚性移动，再一次拉动让
    越过 B/S 边界的领头格固化为 crate，把不规则形状按列切成两种材料、分别
    兑现两个位置与形状要求不同的目标。西目标要的是普通 crate，东目标要的是
    能绕过竖墙与目标西侧死角的竖直刚体；同一块 L 的两段各对一个。不规则形状
    承担真实责任：若横臂只有两格，领头格越界后剩余竖条会停在 (3,4)(3,5)，
    与走廊西墙相邻，没有任何接触位能把它东移，东目标无解；凸脚 (4,5) 同时
    提供了开局的合法拉位，并解释了开局为什么不能先推 crate 再切割。

  ending_read: >
    胜利即最后一步竖条底格落位东目标，无高潮后清理劳动。竖条顶格落在 (5,3)
    为无害余格。底行 (5,6)(6,6) 两格在规范解中不被访问，只提供可逆试探空间，
    属轻微松弛而非明确缺点。

