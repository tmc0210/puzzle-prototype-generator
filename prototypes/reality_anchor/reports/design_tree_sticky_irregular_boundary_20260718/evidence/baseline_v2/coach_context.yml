experience_core:
  experience_statement: >-
    黏块构成的 L 形、俄罗斯方块形等小异形结构在墙口、墙边、锚点边界的可动性、
    动作可逆性、状态变化。锚点边界包含 P/L 边界：利用异形块在 P/L 边界两侧的
    推拉可动性差异同样成立且更受偏好；但推拉可动性差异必须在 P/L 边界附近体现，
    仅在远处对普通对象分别使用推侧/拉侧特性不算。
  player_action: >-
    玩家读出小异形黏块的具体形状（凸脚朝向、把手位置），在边界近旁判断它从
    哪一侧、以何种动作（push/pull）可以被动，预见动作触发后的状态改写
    （如跨越 B/S 边界时的逐格切割/合并），并据此安排切割产物与后续消费。
  visible_payoff: >-
    同一异形黏块在边界两侧呈现可读的推拉可动性分叉；跨越边界时形状被逐格改写
    为新的对象组合；分叉产物各自被关卡消费，构成胜利的必要条件。
  identity_conditions:
    - 核心动作围绕小异形黏块在墙口/墙边/锚点边界近旁的可动性判断；若形状换成等格数规整条形后关系不变，则形状未承担区分性责任。
    - 推拉可动性差异必须在 P/L 边界附近体现（boundary-near），而非仅在远处对普通对象分别使用两侧特性。
    - 状态变化（如 B/S 逐格切割/合并）须由玩家在边界处的动作触发并被后续消费。

