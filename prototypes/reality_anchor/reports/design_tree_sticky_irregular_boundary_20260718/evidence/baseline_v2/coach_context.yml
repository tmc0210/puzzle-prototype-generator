allowed_mechanisms:
  - 任意小异形黏块形状（L/T/S/Z/方块缺角等）及其构造、切割、拼接
  - 墙体几何（墙口、墙边、齿、廊道、口袋）
  - P/L 锚点（可固定于笼中或在设计中移动使用）
  - B/S 锚点（可固定于笼中或在设计中移动使用）
  - 多个目标的布局消费
  - crate 与 sticky 的相互转换

