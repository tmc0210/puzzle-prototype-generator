candidate_version: v9
review_iteration: 2
packet_kind: claim_last_facts

prototype_rules:
  win_condition: all_targets_covered_by_objects
  push_pull_boundary: P=(4,12), L=(5,12); x<=4 push, x>=5 pull
  box_sticky_boundary_initial: S=(4,10), B=(5,10); x<=4 sticky, x>=5 box
  normalization: legal move 后按 B/S 半平面做 box/sticky 归一化；相邻 sticky 自动合并，跨 box side 的 sticky 格变箱，剩余 sticky 按连通块分裂

layout: |-
  ##########
  #####.####
  #...G.####
  #.#MMC.###
  #.###C.###
  #.#MMC..##
  #.##G...##
  #.....####
  ####.#####
  ####.#####
  ##@.SB.###
  ##########
  ####PL####
  ##########

initial_material_relations:
  upper_sticky_arm: [(3,3), (4,3)]
  lower_sticky_arm: [(3,5), (4,5)]
  crate_connector_column: [(5,3), (5,4), (5,5)]
  targets: [(4,2), (4,6)]
  start: [2,10]

exact_solution:
  cost: 28
  inputs: [right, right, up, up, up, up, right, right, up, right, down, left, left, down, left, left, left, left, up, up, up, up, up, right, right, right, right, up]
  non_walk_steps:
    - step: 2
      input: right
      events: [push_object:box_sticky_anchor, anchor_boundary_shift:box_sticky, box_to_sticky:n3, sticky_merge:n1]
      concrete_change: B/S 从 S4/B5 到 S5/B6；三格箱柱变黏，并与上下二格黏臂拼成一个七格 C 形刚体。
    - step: 10
      input: right
      events: [pull_object:sticky#1, move_sticky_rigid, sticky_to_box:n3, sticky_split:n1]
      concrete_change: 玩家在右下 L 侧拉整块 C 形右移；连接柱进入 x=6 变三箱，上下黏臂留在 x=4-5 并分裂。
    - step: 14
      input: down
      events: [pull_object:sticky#2, move_sticky_rigid]
      concrete_change: 下二格黏臂向下覆盖 (4,6)，玩家落到仍可离开的 (5,7)，下目标完成。
    - step: 28
      input: up
      events: [pull_object:sticky#1, move_sticky_rigid]
      concrete_change: 上二格黏臂向上覆盖 (4,2)，玩家进入 (5,1) 封闭袋，胜利。

hard_evidence:
  solver: {found: true, status: found, cost: 28, explored_states: 75}
  graph: {status: complete, reachable_states: 76, legal_transitions: 149, winning_states: 1}
  scc: {status: complete, sccs: 5, edges: 4, win_subgraph: one_win_continuation_per_scc, forced_win_prefix: 3/3}
  solution_uniqueness:
    result: unique_complete
    exact_optimal_input_paths: 2
    optimal_winning_states: 1
    distinct_optimal_non_walk_signatures: 1
    winning_object_configuration_groups: 1
  all_winning_path_events:
    status: complete
    missing_required_winning_path: false
    required: [anchor_boundary_shift:box_sticky, box_to_sticky, sticky_merge, sticky_to_box, sticky_split, pull_object, move_sticky_rigid]
  all_winning_path_sequence:
    status: complete
    violating_winning_path: false
    obligations:
      - 同一步 B/S 位移 + box_to_sticky + sticky_merge
      - 其后同一步 pull + move_sticky_rigid + sticky_to_box + sticky_split
      - 切割后至少两次独立 sticky rigid move
      - 任一胜路中不得在下目标尚未覆盖时先覆盖上目标
  reachable_scan:
    status: complete
    event_types: [anchor_boundary_shift, box_to_sticky, move_sticky_rigid, pull_object, push_object, sticky_merge, sticky_split, sticky_to_box, walk]
    allowed_exposure_through: dual_anchor
    later_events: none

