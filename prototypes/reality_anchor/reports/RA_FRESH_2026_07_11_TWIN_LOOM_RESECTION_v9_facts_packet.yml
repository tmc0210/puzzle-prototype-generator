routed_diagnostics:
  - initial_scc_states: 2
    neutral_meaning: 开局有一步可逆观察缓冲；第二步 B/S 推动是唯一可胜承诺。
  - forced_win_prefix: 3/3
    neutral_meaning: 三次不可逆 SCC handoff 的胜利连续方向固定；下臂动作留在同一 SCC，lower-before-upper 由单独目标顺序监控支持，而不是由 SCC 前缀单独支持。
  - solution_cost: 28
    neutral_meaning: 规范解走位较长；指标只把执行压力归为 aggregate band 3，不证明推理难度。

archive_taste_context:
  - candidate_id: RA_CAND_0017
    human_reviewed: true
    human_scores: {aesthetic: 4, difficulty: 5}
    human_comment: 极难末期挑战；推拉、拼接切割要求高，精巧、高密度、高耦合，但腾挪负担很高。
  - candidate_id: RA_CAND_0022
    human_reviewed: true
    human_scores: {aesthetic: 5, difficulty: 4}
    human_comment: 反直觉、空间利用率高、结构精巧，短步骤要求强洞见。
  - candidate_id: RA_CAND_0025
    human_reviewed: true
    human_scores: {aesthetic: 4, difficulty: 4}
    human_comment: 紧凑空间内主动构造 L 形，前段不喧宾夺主，终局提示恰当，强4。
  - candidate_id: RA_CAND_0024
    human_reviewed: true
    human_scores: {aesthetic: 1, difficulty: 3}
    human_comment: 双锚点与黏块抬高期待，实际仅推拉腾挪；警戒指标和机制标签掩盖玩家洞见缺失。

evidence_limits:
  - 工具事实不证明玩家会读出 C 形构造、顺序问题或反直觉价值。
  - P/L 固定不移动；它的责任来自 x=5 拉侧对三个关键 pull 的授权。
  - trace metrics 为 pilot，不可单独推出审美、洞见或最终难度。

