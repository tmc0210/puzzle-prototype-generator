attempt_log:
  serious_structural_attempts:
    - v1-v3: 五格 C 形单端点 family；箱柱可直接冒充端点或被锚点覆盖目标，放弃。
    - v4-v5: 七格 C 形双黏臂；核心事件成立，但开放空间产生大量无关状态和初始纵推旁路。
    - v6-v8: 收紧 B/S 槽、目标死端和回廊；v8 仍允许切出箱柱在胜前做非等价额外操作。
    - v9: 隔离下臂完成后的工作区，锁住切出箱柱；完整图收束为1个胜态与唯一非走位计划。
  local_repairs:
    - 用 x=3-4 二格黏臂替换单格端点，使初始箱柱不能冒充切割产物。
    - 把目标放在 x=4 push-side 列，而把拉把手放在 x=5 pull-side 列，迫使切后形状横移一格。
    - 把上方完成格做成一格死端；下臂必须在该封袋终局前完成，固定下先上后的收束。
  abandoned_families:
    - five_cell_single_endpoint_C

