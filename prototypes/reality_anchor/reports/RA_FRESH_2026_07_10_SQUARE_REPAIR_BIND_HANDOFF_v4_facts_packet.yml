player_facing_reading:
  opening_read: >-
    玩家被放在缺角 M 下方，唯一动作向上；这会把 M 刷成箱并补成箱态 2x2。
    随后右侧回路允许观察并移动 B/S。这个开局因果清楚，但没有动作前观察缓冲，
    opening-comfort 风险保留给独立 critic 与提交前专属流程。
  intended_solution_read: >-
    B/S 上移只把下排刷成黏块，故得到的不是终态，而是一把 CC/MM 混合刷子。
    玩家必须从唯一上口纵向剪下右列，制造 L3；同时让左箱先让位，再到 pull 侧
    变成单格 M。L3 与单格重新咬合成偏移正方形后，整块才能被固定 P/L 拉进目标。
  concrete_false_read: >-
    提前把上排 CC 向左剪看似最直接地靠近目标，而且动作合法、下排仍可移动；
    但它消耗了唯一上方驱动位，完整后继图无胜。错误原因在几何上可追溯到“先剪哪一轴”。
  state_responsibility:
    initial_sticky_singleton: 跨 B/S 补齐缺角，使后续混合刷形拥有四格材料。
    box_sticky_anchor: 必须向上移动一次，选择 CC/MM 混合产物；最终停在右侧，不覆盖目标。
    mixed_square: 不是搬运终态，而是必须被纵向消费的刷形中间态。
    right_column: 纵剪后变成 L3 的主体。
    remaining_crate: 先让位，再由固定 P/L 拉成缺角单格 M。
    rebound_square: L3 与单格在新偏移位重并，成为唯一可交付的完整刚体。
    push_pull_anchor: 完全固定；通过 pull 侧材料归一化与最终三次整体拉动完成交付。
  payoff_and_resolution: >-
    同四格材料依次承担箱态正方形、CC/MM 混合刷子、1+3 拆分、偏移黏态正方形四种职责；
    最终方块不是原样搬到目标，而是先被拆开、让位、跨侧重绑，再以整体覆盖四目标。

