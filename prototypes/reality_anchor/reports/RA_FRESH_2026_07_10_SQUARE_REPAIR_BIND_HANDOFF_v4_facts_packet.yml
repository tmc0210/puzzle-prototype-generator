prototype_context:
  confirmed_rules:
    - P/L 定义 push/pull 两侧；本候选 P/L 被墙完全固定，x <= 6 为 pull 侧，x >= 7 为 push 侧。
    - B/S 定义 box/sticky 两侧；本候选 B/S 可向上移动一次，合法动作后全局材料归一化。
    - 相邻 sticky 合并成刚体；推动刚体时，任一目标格受阻则整步失败。
    - force chain 会沿动作方向传递，链中任一对象无法移动则整步失败。
    - pull 世界中，玩家前格必须为空，身后相邻对象才会随玩家同向移动。
  win_condition: 所有 G 被箱、黏块或任意锚点格覆盖；玩家不算覆盖。
  tool_boundary:
    runtime_adapter: available
    solver_graph_agency: available
    event_count_and_prefix_state_probes: available
    prototype_specific_shape_necessity_probe: available
    curated_miner: unavailable

