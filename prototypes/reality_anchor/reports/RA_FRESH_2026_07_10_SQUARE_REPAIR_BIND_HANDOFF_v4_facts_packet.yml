    - B/S 向上移动一次，把下排两箱刷成 MM，得到上排 CC、下排 MM 的混合 2x2。
    - 玩家绕到唯一上口后向下推右上箱；force chain 同步下移右下黏块并触发归一化，混合正方形被主动剪成一枚箱与三格 L 黏块。
    - 剩余箱必须先左推让位，再在固定 P/L 的 pull 侧向下拉成单格 M；三格 L 随后左拉并与单格 M 重并为偏移后的黏态 2x2。
    - 完整黏态 2x2 最后由固定 P/L 的 pull 语义整体左拉三格覆盖四目标。
