reviews:
  - case: CASE_C
    main_player_facing_merit: 三格黏条先整体搬运，再被边界精确拆成两箱一黏，三个目标因而获得不同落点。
    dominant_aesthetic_problem: 拆分后基本是逐件送达，末段兑现略直白。
    aesthetic_band: "4+"
    verdict: playtest_worthy
    perceived_reversal: 玩家原本以为三格黏条会始终作为刚体行动，后来发现三格黏条竟然能被切成两箱与一格黏材，因此三目标可分别收束。
    reason: 合体、搬运、拆分和落点形成清楚的一次洞见，紧凑且可读。
  
  - case: CASE_G
    main_player_facing_merit: 七格C形黏材切掉连接部后同时分出双臂与箱，且上臂必须优先，局部切割产生全局次序。
    dominant_aesthetic_problem: 长走廊和三段远距收尾稀释决策密度，孤立P/L也无可见贡献。
    aesthetic_band: "4+"
    verdict: playtest_worthy
    perceived_reversal: 玩家原本以为七格C形黏材只能整体验证路线，后来发现七格C形黏材竟会切成双臂与三箱，因此切割次序决定能否回收全局。
    reason: 形状反转直接制造不可交换的行动顺序，足以支撑试玩，仍需检验走位拖沓感。
  
  - case: CASE_E
    main_player_facing_merit: 三格黏材经历切箱、回拉重黏、L形再切，最终用重建后的整体一次覆盖双目标。
    dominant_aesthetic_problem: 左右反复切回与重黏近似撤销，七步纯走位又拉长了关键因果。
    aesthetic_band: "2-3"
    verdict: borderline
    perceived_reversal: 玩家原本以为三格黏性材料切开后会分别使用，后来发现三格黏性材料竟须重新黏成L形再切开，因此真正资源是可反复改形的材料组。
    reason: 反直觉明确，但重复跨界让洞见更像繁复编排，尚不足以稳居审美4。
  
  - case: CASE_D
    main_player_facing_merit: 被B/S搬运的黏材先跨场运输，后借P/L改向并切成箱，两个边界在同一收束链中接力。
    dominant_aesthetic_problem: B/S三步右移又三步左返，随后仍有多轮拉取，核心变化被锚点往返淹没。
    aesthetic_band: "2-3"
    verdict: borderline
    perceived_reversal: 玩家原本以为被B/S搬运的黏性材料会保持整体抵达目标，后来发现被B/S搬运的黏性材料竟须切成箱并分别回拉，因此运输只是拆解前置。
    reason: 双边界接力有潜力，但玩家要穿过较多重复搬运才看见主矛盾。
  
  - case: CASE_B
    main_player_facing_merit: 两格黏材早早切成两箱，却不是各自占目标，而是被排成力链，最终带动B/S覆盖唯一目标。
    dominant_aesthetic_problem: 中段两箱摆位在终推前可能显得目的不明，反馈全压在最后一步。
    aesthetic_band: "4+"
    verdict: playtest_worthy
    perceived_reversal: 玩家原本以为两格黏性材料切成箱后要分别送达，后来发现两格黏性材料竟要以箱形排成力链，因此目标由B/S而非它们覆盖。
    reason: 单目标把材料身份与目标承担者的错位压得很紧，结尾能重释此前全部操作。
  
  - case: CASE_A
    main_player_facing_merit: 同一批黏材在两类锚点间反复合并、切箱和重定向，局部形态变化持续改变可施力关系。
    dominant_aesthetic_problem: 切、黏、搬锚频繁换挡，核心洞见可能被操作记忆和执行负担冲淡。
    aesthetic_band: "4+"
    verdict: playtest_worthy
    perceived_reversal: 玩家原本以为左推合并后的黏性材料应维持刚体直达目标，后来发现左推合并后的黏性材料竟须切箱再重黏，因此完成依赖主动拆毁已有整体。
    reason: 主动破坏再重建的矛盾清楚，且两种边界紧密介入；需试玩确认复杂度仍可读。
  
  - case: CASE_F
    main_player_facing_merit: 几乎没有空走，箱、黏材与B/S连续进入力链，十步内持续改变彼此的受力角色。
    dominant_aesthetic_problem: 终局把B/S下拉后立即上推，关键反转更像一步撤销，空间后果不够展开。
    aesthetic_band: "2-3"
    verdict: borderline
    perceived_reversal: 玩家原本以为被力链上推的B/S已经完成让位，后来发现被力链上推的B/S竟须下拉再推回，因此它既是通路调节器也是终局受力件。
    reason: 密度高且短，但最后的回摆尚未形成足够强的结构性重释。
  
cross_case_notes: 强者都让同一具体材料或形状在后半程推翻前半程用途：CASE_B以目标承担者错位最紧，CASE_C以整拆对应三目标最清楚，CASE_G把切割升级为全局先后约束，CASE_A则以主动拆毁整体见长。CASE_D、CASE_E的反转被往返执行稀释；CASE_F虽无空走，却主要靠即时回摆制造惊讶。是否达到审美4，关键不是变化次数，而是反转能否重释此前操作并产生新的空间决策。
