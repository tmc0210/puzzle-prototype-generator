task_classification: specific_prototype_level_design
prototype: reality_anchor
candidate_family: RA_FRESH_2026_07_10_REWRITE_BRUSH_SPLIT_RELAY
archive_lineage_policy:
  default: fresh_required
  authorized_archive_variant_work:
    enabled: false
  candidate_relation: fresh
  why_not_archive_variant: >-
    本轮不从任何 archive candidate、现有 level、run、packet 或同日其它线程材料的
    layout、对象角色、求解路线或因果链起步。

design_goal:
  intended_role: late_challenge_or_capstone
  known_before: all_current_reality_anchor_runtime_rules
  allowed_exposure_through: dual_anchor
  difficulty_target:
    floor: 4
    aspiration: 5
  aesthetic_target:
    floor: 4
    aspiration: 5
  prototype_requirement: >-
    同时存在 P/L 与 B/S；至少一个锚点可移动且所有胜利路径必须实际移动它。

lexicon_parts_source:
  source: prototypes/reality_anchor/mechanism_lab/lexicon.md
  selected_parts:
    - name: P/L 锚点边界重写：旧半格把手与侧边对象改侧
      role: >-
        先移动 P/L，释放旧半格或重标侧边 relay，使原本处于 pull-side 门后的
        driver 成为 push-side 可用把手。
    - name: B/S 移动边界刷产物：远程生成与门口消费
      role: >-
        由上述新把手驱动 B/S 跨线，远程把共享刚体资源改写为可分配的
        crate/sticky 输出，而不是把 B/S 当按钮。
  new_composition_logic: >-
    P/L 边界重写必须创造移动 B/S 的唯一可用 driver；B/S 移动随后必须把一个
    共享材料债拆成两种承担不同终局责任的输出。这样第一段不是独立开关，第二段
    也不是独立材料 witness；前段生成后段接口，后段反过来兑现前段牺牲的操作面。

design_claim:
  player_insight: >-
    玩家必须看出：当前真正缺少的不是把某个箱子直接送向目标，而是先牺牲初始
    P/L 边界位置，把旧 L 半格或侧边对象改写成 push-side driver；只有这个新把手
    才能移动 B/S，并把一个不可分配的共享刚体远程拆成两个各有终局职责的资源。
  causal_chain:
    - 识别初始目标路线被共享刚体的不可分配性与 B/S 把手关闭共同锁住。
    - 移动 P/L，释放旧半格或重标侧边 relay，形成先前不存在的 push-side driver。
    - 用该 driver 通过 force chain 移动 B/S，使边界跨过远处共享材料。
    - B/S 扫线把共享刚体改写/拆分为 crate 与 sticky 两类输出。
    - 将两类输出分别交给不同形状或站位要求的终局 consumer；错误顺序会丢失把手或留下不可消费尾债。
  why_not_execution: >-
    难点应来自三段因果责任：移动 P/L 会主动放弃初始边界；新边界只在正确一侧
    生成 B/S driver；B/S 刷出的两类输出必须预先分配。玩家不能靠最近 affordance、
    唯一显然动作、重复走廊腾挪或单纯增加步数取胜。
  required_winning_path_events:
    - anchor_boundary_shift:push_pull
    - anchor_boundary_shift:box_sticky
    - sticky_to_box_or_sticky_split
    - both_brush_outputs_consumed_by_distinct_terminal_responsibilities
  forbidden_winning_path_events:
    - win_without_push_pull_anchor_shift
    - win_without_box_sticky_anchor_shift
    - win_without_material_output_split_or_rewrite
  falsification:
    - 任一胜利路径缺少 P/L 位移、B/S 位移或材料拆分/改写，核心 claim 失败。
    - 若 P/L 移动前已有等价 B/S driver，边界重写只是装饰，核心 claim 失败。
    - 若刷出的两类输出没有不同终局责任，或其中一类可删除/墙化而不改变核心链，核心 claim 失败。
    - 若正解主要是路线税、重复搬运或唯一贴脸动作，而不要求预见资源角色变化，why_not_execution 失败。
    - 若双锚点与黏块在读图上承诺复杂几何但正解只消费普通腾挪，审美目标失败并换 family。

tool_questions:
  - 能否实例化一个完整可解、图搜索 complete 的紧凑布局？
  - 所有胜利路径是否都需要 P/L 与 B/S 的 anchor_boundary_shift？
  - 所有胜利路径是否都需要所声明的材料拆分/改写事件与两类输出职责？
  - 是否存在在 P/L 移动前直接驱动 B/S、直接覆盖目标或绕过共享刚体债的胜路？
  - 哪些开局起点提供观察空间而不改变核心链？
  - 哪些目标、对象、空地或外框可被删除、墙化或裁剪而不破坏核心链？
