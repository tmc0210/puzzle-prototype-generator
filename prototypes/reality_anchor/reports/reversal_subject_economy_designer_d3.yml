- case: CASE_G
  intended_reversal: 玩家原本以为【上黏臂】可留到右箱之后，后来发现【上黏臂】竟会因回路封死而失去操作位，因此必须先完成。
  subject_cost_fit: structurally_underpaid
  heaviest_cost_outside_subject: 七格C形体的合并切割与11步纯走
  designer_action: change_family
  exact_basis: 中性分支事实明确先做右箱后不可返回上黏臂

- case: CASE_E
  intended_reversal: 玩家原本以为【三格黏体】一次过界即可完成分配，后来发现【三格黏体】竟要回拉复黏再切，因此首切只是暂态。
  subject_cost_fit: borderline
  heaviest_cost_outside_subject: 30步路线与最长7步纯走
  designer_action: revise_structure
  exact_basis: 第4步首切，第13至15步复黏，第30步终切

- case: CASE_C
  intended_reversal: 玩家原本以为【新成三格黏条】只需整体搬运，后来发现【新成三格黏条】竟须切成两箱加一黏体，因此三目标可分盖。
  subject_cost_fit: well_supported
  heaviest_cost_outside_subject: 最长5步纯走
  designer_action: keep
  exact_basis: 第1步成条，第10至17步切分并依次盖三目标

- case: CASE_A
  intended_reversal: 玩家原本以为【合并后的黏体】只会越切越散，后来发现【合并后的黏体】竟须反复回黏重组再切，因此才能收束两目标。
  subject_cost_fit: well_supported
  heaviest_cost_outside_subject: 两类锚点的多次移位
  designer_action: keep
  exact_basis: 第3步合并，第6至27步持续切割、复黏与重定向

- case: CASE_F
  intended_reversal: 玩家原本以为【B/S锚点】移开只为让箱过界，后来发现【B/S锚点】竟须再下拉上推，因此回程本身完成关卡。
  subject_cost_fit: well_supported
  heaviest_cost_outside_subject: 两箱的预定位
  designer_action: keep
  exact_basis: 第2步移锚，第7步并黏，第9至10步锚点往返

- case: CASE_B
  intended_reversal: 玩家原本以为【B/S锚点】只负责切开黏体，后来发现【B/S锚点】竟要穿过三物链上移，因此边界本身成为末端解。
  subject_cost_fit: well_supported
  heaviest_cost_outside_subject: 两个切出箱的分离与对齐
  designer_action: keep
  exact_basis: 第1至3步切箱，第7至11步排链，第12步拉锚收尾

- case: CASE_D
  intended_reversal: 玩家原本以为【B/S锚点】连续右拉后应留在新侧，后来发现【B/S锚点】竟须三次左拉回原侧，因此首次远行只是在运料。
  subject_cost_fit: structurally_underpaid
  heaviest_cost_outside_subject: 后半段P/L与多箱操作
  designer_action: change_family
  exact_basis: 第6至8步右拉三次，第14至16步左拉三次
