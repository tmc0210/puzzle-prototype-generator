reviews:
  - case: CASE_E
    main_player_facing_merit: "同一材料在切箱、回融、再切之间往返，末步双目标收束清楚。"
    dominant_aesthetic_problem: "反转被多次同类往返与长走位稀释，隔离的P/L也未参与。"
    aesthetic_band: 2-3
    verdict: borderline
    reason: "局部洞见成立，但30步实现比核心回融反转更重。"
    perceived_reversal: "玩家原本以为【右端黏块】切成箱后就应作为独立货物，后来发现【右端黏块】竟然必须拉回并入L形黏块再切出，因此早期切割只是暂态。"
    subject_cost_fit: structurally_underpaid
    heaviest_cost_outside_subject: "未参战的P/L，以及围绕边界反复重建所需的长走位。"

  - case: CASE_F
    main_player_facing_merit: "箱、黏块与B/S在小空间内形成短而连续的受力接力。"
    dominant_aesthetic_problem: "结尾B/S下拉再推回略像位置校正，惊喜弱于中段转化。"
    aesthetic_band: 4+
    verdict: playtest_worthy
    reason: "10步内每个对象都参与同一转化与回推闭环。"
    perceived_reversal: "玩家原本以为【上方箱子】应独立运往目标，后来发现【上方箱子】竟然要跨界并入黏块，成为B/S回推链的一部分，因此货物转成了传力材料。"
    subject_cost_fit: well_supported
    heaviest_cost_outside_subject: "B/S的一次下拉回推与下方箱的短距让位。"

  - case: CASE_B
    main_player_facing_merit: "两格黏条先切成双箱、再分置并汇入末段受力链，转化紧凑。"
    dominant_aesthetic_problem: "中段分箱搬运稍常规，审美峰值集中在首尾。"
    aesthetic_band: 4+
    verdict: playtest_worthy
    reason: "切分改变了两格材料的用途，且末步共同回收其意义。"
    perceived_reversal: "玩家原本以为【两格黏条】应保持刚体整体移动，后来发现【两格黏条】竟然要先切成两箱、分开定位后再同入三物受力链，因此分裂才是协作前提。"
    subject_cost_fit: well_supported
    heaviest_cost_outside_subject: "为两箱分置提供的回绕空间与末端B/S锚点。"

  - case: CASE_G
    main_player_facing_merit: "三枚连接箱先融成C形黏体、再切回箱并拆臂，形态反转鲜明。"
    dominant_aesthetic_problem: "长通道、11步纯走位和三路收尾把核心切分洞见摊薄。"
    aesthetic_band: 2-3
    verdict: borderline
    reason: "合切逻辑有辨识度，但大地图主要在支付到达与清场成本。"
    perceived_reversal: "玩家原本以为【三枚连接箱】只是两条黏臂间的独立货物，后来发现【三枚连接箱】竟然先要融成C形连接部、再切回箱以拆开双臂，因此连接与分离由同一组材料完成。"
    subject_cost_fit: structurally_underpaid
    heaviest_cost_outside_subject: "长接近通道、双臂分别送达及不可逆先后顺序的回滚风险。"

  - case: CASE_A
    main_player_facing_merit: "切箱、重绑与改向持续牵动两类锚点，材料状态和空间强耦合。"
    dominant_aesthetic_problem: "多次相似重组使玩家较难抓住唯一审美焦点。"
    aesthetic_band: 4+
    verdict: playtest_worthy
    reason: "复杂度虽高，但大部分操作都在重释同一批材料的用途。"
    perceived_reversal: "玩家原本以为【首次切出的箱料】应保持为箱并分别交付，后来发现【首次切出的箱料】竟然要重新并入黏体、再受力切分和改向，因此切箱不是终态而是重组手段。"
    subject_cost_fit: well_supported
    heaviest_cost_outside_subject: "B/S与P/L的交替移位，以及狭窄区内的换侧走位。"

  - case: CASE_D
    main_player_facing_merit: "B/S往返搬运后交棒给P/L，形成两阶段机制接力。"
    dominant_aesthetic_problem: "第二锚点阶段与多次长距离回拉另起重心，34步显得拖长。"
    aesthetic_band: 2-3
    verdict: borderline
    reason: "B/S折返有反直觉性，却不足以统摄后半段P/L清场。"
    perceived_reversal: "玩家原本以为【B/S锚点】向右携料后应继续在新位置工作，后来发现【B/S锚点】竟然必须三次左拉回到原侧，因此它的前进只是为切出阶段性箱料。"
    subject_cost_fit: structurally_underpaid
    heaviest_cost_outside_subject: "B/S归位后的整套P/L下拉、双箱搬运与三次终局横推。"

  - case: CASE_C
    main_player_facing_merit: "箱先并入双黏格形成三格条，再切成三份各投目标，因果直观。"
    dominant_aesthetic_problem: "切分揭示后，三份送达略接近例行收尾。"
    aesthetic_band: 4+
    verdict: playtest_worthy
    reason: "17步内合体与分化互为前提，三个目标共同兑现同一洞见。"
    perceived_reversal: "玩家原本以为【三格黏条】是需要整体搬运的成品，后来发现【三格黏条】竟然要切成两箱与一格黏块分别落位，因此合并只是为了制造可控的三路货物。"
    subject_cost_fit: well_supported
    heaviest_cost_outside_subject: "B/S的两次横移和切分后三份货物的短程投放。"

cross_case_notes: "F、B、C以紧凑空间让同一材料的身份变化直接支付目标收束，主语与实现相称；A更复杂，但两类锚点仍持续服务同批箱料的重组。E、D、G虽有可复述反转，关卡却额外承担未用锚点、独立后半程或长通道多路清场，反转主语不足以偿付整体成本。"
