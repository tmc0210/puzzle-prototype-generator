task_scope:
  kind: prototype_specific_single_level_design
  prototype: reality_anchor
  generic_skill_or_process_changes: forbidden

archive_lineage_policy:
  default: fresh_required
  authorized_archive_variant_work:
    enabled: false
  candidate_relation: fresh
  note: >-
    只用 clean human-reviewed archive 校准审美与失败边界；不继承旧关布局、对象角色、
    因果链或求解路线。允许语料中的 C 形断桥只作为“拆开端点会替代整体”的反例，
    本轮不采用其切割 family。

design_target:
  intended_role: application
  difficulty_score_target: 3
  aesthetic_score_target: 4
  allowed_exposure_through: dual_anchor
  central_identity: >-
    一个视觉上完整、巨大的 C 形黏块在关键操作前保持单一四邻接刚体；玩家进入凹腔，
    朝开口方向行动并从内侧拉动整个 C，使上下两只相隔的钩臂在同一次刚体平移中
    同时改变两条物体线。关键效果必须依赖凹腔、开口方向和上下臂同时属于同一刚体。

reasoning_sketch:
  player_goal: >-
    玩家看到上下两条目标线各有一个需要向右推进的对象，但逐条处理会封死另一条线的
    操作位；需要找到一个能在同一时刻推进两线、又不从外侧逐个接近对象的操作方式。
  intended_question: >-
    怎样利用完整 C 形中间向右开放的凹腔，让玩家在腔内获得拉动接触，同时让 C 的
    上下钩臂同步作用于两条相隔的对象线？
  visible_premises:
    - >-
      开局能直接辨认由上横臂、左竖脊、下横臂组成且中间向右开口的完整 C 形；玩家可进入
      或已位于凹腔，但不能穿过黏块本体。
    - >-
      上下两只钩臂右端分别对准两个待推进对象；两对象之间的中行是 C 形凹口和玩家前格。
    - >-
      P/L 分区让玩家朝开口方向移动时拉动身后的左竖脊；黏块刚体规则会让上下臂与竖脊
      同步平移，并同时检查两条对象线。
    - >-
      地形要让先单独推进任一对象产生可见且较快的站位损失，而不是大量迟缓 deadend。
  intended_conclusion: >-
    先完成少量可逆观察或必要对齐，再进入 C 形凹腔；只有从凹腔朝开口方向拉动完整 C，
    才能让上下钩臂同步推进两条对象线并保留后续收束。凹口朝反方向、填满凹口、直条或
    独立黏块都不能建立这一同步作用。
  planned_mechanic_sequence:
    - 可逆观察并读出两条对象线不能安全地逐条处理
    - 调整或平移完整 C 形，使上下钩臂同时对准两条线
    - 玩家进入凹腔，在 pull side 朝开口方向行动，从内侧拉动完整 C
    - 完整 C 的两臂在同一次 move_sticky_rigid 中同步推动两条分离对象线
    - 使用同一 C 形的新位置或被同步改变的两线做短收束，不追加无关子题
  intended_feedback: >-
    关键输入后，玩家能同时看到整个 C 向开口方向平移、上下两条物体线一起前进，并且
    原先互斥的两个后续操作同时变得可行；反馈来自棋盘形状与两线同步变化，而不是事件标签。

identity_counterfactuals_to_verify:
  - name: split_components
    expected: 只拉动与玩家相邻的部件，不能同步带动上下钩臂，核心体验失败。
  - name: straight_bar
    expected: 失去两条相隔的臂端，不能在同一刚体位移中作用于上下两线。
  - name: filled_notch
    expected: 玩家失去凹腔操作位，不能从内侧朝开口方向拉动整体。
  - name: reversed_opening
    expected: 玩家前格、pull 接触面与两臂推进方向不再同时成立。

tool_questions:
  - 当前 P/L 与 B/S 锚点朝向能否让 C 所在区域同时是 pull side 与 sticky side，而钩臂前方对象保持 crate。
  - 一个 sticky 刚体平移同时接触两个独立对象时，runtime 是否会在同一次输入中合法传播两条 force chain。
  - 能否在完整图预算内得到唯一或仅等价换序的胜解，并让关键 C 形移动在第二个或更后的 reasoning unit 出现。
  - 逐条推进任一对象的失败是否能在少量输入内从局面直接看出，而不是形成大量迟缓 deadend。

archive_calibration:
  positive_candidates:
    - RA_CAND_0025
    - RA_CAND_0022
    - RA_CAND_0029
  negative_candidates:
    - RA_CAND_0024
    - RA_CAND_0027
    - RA_CAND_0030
    - RA_CAND_0031
    - RA_CAND_0032
  player_side_constraints:
    - 构造或调整段不能喧宾夺主；完整 C 的钩取必须是唯一亮点中心。
    - 地图与对象数量必须与亮点回报相称，优先紧凑、低噪声、短而有洞见。
    - 双锚若出现，必须只服务 C 形钩取的分区条件，不得开局演出后退休或制造未兑现 affordance。
    - 不能用工具事件齐全代替对 C 形整体几何的真实玩家使用。

target_routing_revision:
  from: difficulty_4_challenge
  to: difficulty_3_application
  timing: before_serious_candidate_packet
  reason: >-
    用户要求中等 application/challenge，未指定数值。v2 的玩家内容是两个清楚的结构判断，
    错误路线反馈快且没有长搜索面；按玩家侧定位应取中等 application（3），不能靠增加走位或
    噪声把它包装成 challenge（4）。审美目标与 C 形作品身份不变。

aesthetic_target_revision:
  from: 5
  to: 4
  timing: after_fresh_critic_attempt02
  reason: >-
    独立 critic 支持完整 C、凹口、双臂同步的一体化收束达到4分，但指出开局关键下拉可被廉价试出、
    末段第二次 right 在贴锚后直接，不足以达到5分正例的主动构造深度或反直觉承诺。
    用户要求为审美4分以上，因此收窄 claim，不改布局硬抬。
