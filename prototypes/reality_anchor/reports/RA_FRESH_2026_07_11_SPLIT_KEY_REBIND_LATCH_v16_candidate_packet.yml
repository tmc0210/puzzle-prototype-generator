player_facing_reading:
  opening_read: >-
    全视野同时给出三笔债：左上 P/L 与双目标错开，中央 L 形黏块包住玩家，底部 B/S、三箱桥、
    双切割格与密集目标相邻。玩家可以先在缺角内观察；首个有效动作是把 L 形向右推出再向下拉，
    由轮廓直接提示“正交施力会同时改变下层锚点”。
  intended_solution_read: >-
    第一次下拉会把三箱一起刷成黏块并接成共享 U 形。玩家必须把这块大轮廓横移、再整体抬升，
    才能进入上层从 L 侧拖动 P/L。回到底部后，之前赖以搬运的共享性反而成为障碍：必须让桥排
    穿过 B 侧恢复为箱，最后只把其中两格重新刷黏，留下一个独立目标责任。
  commitment_points:
    - "开局 B/S 下拉：三箱失去独立性、共享轮廓立即出现。"
    - "中段横移/抬升 U 形：改变上层通路，错误相位会失去施力格。"
    - "P/L 四格横拉：完成上层目标债；它是任何胜局必需但不声称改写下层力侧。"
    - "终局切桥：共享桥恢复独立箱，下一步选择性重黏并结算。"
  state_responsibility:
    - "三箱桥：独立资源 -> 共享 U 刚体 -> 切回箱 -> 两格重黏加一格独立。"
    - "初始黏块：提供 L 缺角与搬运骨架，并在中段形成可抬升大轮廓。"
    - "B/S：制造共享体、负责切割边界与末手重织；禁用其位移完整无解。"
    - "P/L：被 U 形抬升解锁并承担上方目标对；禁用其位移完整无解。"
  payoff_and_resolution: >-
    结尾把开局的“黏住更强”反转为“先切开才可分配”，再把切出的箱选择性重织。最终材质分布
    能回读开局为何要造 U、为何要保存独立箱债。P/L 的 payoff 是必要的上层泊位而非双向耦合，
    因此审美目标保守落在4分下界。

