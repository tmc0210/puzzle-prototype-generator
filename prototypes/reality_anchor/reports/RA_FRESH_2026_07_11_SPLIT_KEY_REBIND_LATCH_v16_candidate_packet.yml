design_claim:
  player_insight: >-
    黏住不是终态，而是临时制造可搬运的共享形状。开局先借 L 缺角侧拉 B/S，把三箱刷入并
    接成 U 形；重排、抬升该刚体后才获得上层 P/L 泊位。最后必须把桥排送过 B 侧切回箱，
    再移动 B/S 让其中两箱重黏成横条，同时让另一箱保持独立覆盖底目标。
  causal_chain:
    - "step1-2：L 缺角转向并侧拉 B/S，三箱 C->M，接入共享轮廓。"
    - "step3-13：重新定位、继续拼接并抬升 U 形，释放上层通行。"
    - "step18-21：从 L 侧横拉 P/L 四格，覆盖上方双目标。"
    - "step26-27：把共享桥压过 B 侧，sticky_to_box:n3；canonical trace 同时 sticky_split:n1。"
    - "step28：再次移动 B/S，box_to_sticky:n2 + sticky_merge:n1，闭合全部目标。"
  why_not_execution: >-
    责任在材质与拓扑之间转移：独立箱先失去可分配性以换取共享刚体搬运，抬升后的空间状态
    才允许 P/L 泊位，随后又必须主动放弃共享形状，经切割恢复独立性，再选择性重黏。
    28 步与 execution-pressure band 5 只描述操作压力；审美和洞见仍由玩家侧状态重读判断。
  falsification:
    - "存在完全不触发 sticky_to_box 的合法胜路。"
    - "存在完全不移动 P/L 或 B/S、或完全不发生 box_to_sticky/sticky_merge 的合法胜路。"
    - "U 形抬升与上层路线无可见因果，P/L 只是可删装饰。"
    - "玩家体验退化为只需沿唯一走廊按键，状态责任不可回读。"

