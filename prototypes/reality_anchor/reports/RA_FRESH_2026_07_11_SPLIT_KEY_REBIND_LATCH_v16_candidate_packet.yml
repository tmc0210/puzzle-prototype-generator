prototype_context:
  confirmed_rules:
    - "P/L 的 P 侧推、L 侧拉；B/S 的 B 侧为箱、S 侧为黏。"
    - "两锚点均为可平移、不可旋转的二格刚体；同类每关最多一个。"
    - "黏格四邻接自动合并；跨入 B 侧会转为独立箱，剩余连通块可能产生 sticky_split。"
    - "目标由箱、黏格或锚点占据才算覆盖，玩家不覆盖目标。"
  win_condition: all_targets_covered_by_crate_sticky_or_anchor_after_settle
  object_and_event_semantics:
    player_on_goal_does_not_cover: true
    anchor_cells_cover_goals: true
    sticky_to_box_is_the_cut_semantic: true
    sticky_split_is_a_possible_topology_consequence_not_the_definition_of_cut: true
    event_patterns_are_not_object_instance_proofs: true
  tool_boundary:
    runtime_adapter: implemented
    solver: implemented
    graph: implemented_but_budget_exhausted_for_exact_v16
    event_avoiding_bfs: complete_for_each_claimed_all_win_gate
    curated_miner: unavailable

