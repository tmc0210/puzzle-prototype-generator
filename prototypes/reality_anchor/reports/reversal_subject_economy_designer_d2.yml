- case: CASE_D
  intended_reversal: 玩家原本以为B/S锚只需把黏料送出，后来发现B/S锚竟要三次退回原侧，交棒给P/L锚，因此前段运输是可逆布置。
  subject_cost_fit: borderline
  heaviest_cost_outside_subject: P/L锚的两次下拉与末段三推
  designer_action: revise_structure
  exact_basis: B/S右拉三次、切箱后左拉三次；随后P/L承担收尾。

- case: CASE_G
  intended_reversal: 玩家原本以为七格C形黏体应整体送达，后来发现该黏体竟要切断三格连接处、分成两臂，因此整体成形只是为了精确拆分。
  subject_cost_fit: well_supported
  heaviest_cost_outside_subject: 最长11步纯走位与不可逆的先后次序
  designer_action: keep
  exact_basis: 第2步合成C形，第14步切开；两臂分别在第18、32步到位，且上臂必须先行。

- case: CASE_B
  intended_reversal: 玩家原本以为两格黏料应整体推进，后来发现同一批黏料竟要先切成两箱、再排成传力链，因此分裂反而提供终局动力。
  subject_cost_fit: well_supported
  heaviest_cost_outside_subject: 两箱分开对齐及B/S末拉
  designer_action: keep
  exact_basis: 第1至3步切分并推进，第7至11步排位，第12步借三物体传力完成。

- case: CASE_F
  intended_reversal: 玩家原本以为B/S锚上推后已完成作用，后来发现B/S锚竟要被新黏体拉下、再原路推回，因此首次上推是在制造回拉条件。
  subject_cost_fit: well_supported
  heaviest_cost_outside_subject: 两只箱的让位与越界合并
  designer_action: keep
  exact_basis: 第2步上推B/S，第7步合黏，第9步拉下，第10步推回即完成。

- case: CASE_A
  intended_reversal: 玩家原本以为第6步切出的两箱应分别送达，后来发现这批物料竟要在第10步重新黏合、第16步再次切开，因此首次分箱只是换向。
  subject_cost_fit: borderline
  heaviest_cost_outside_subject: 两类锚点的多轮搬运与27步总流程
  designer_action: revise_structure
  exact_basis: 第6步切两箱，第10步回黏，第15至16步重整再切；后段仍需P/L换向。

- case: CASE_E
  intended_reversal: 玩家原本以为第4步切出的右箱应直接留作目标箱，后来发现该箱竟要在第13步拉回并入L形黏体、再被切回，因此首次分箱只是重构材料。
  subject_cost_fit: well_supported
  heaviest_cost_outside_subject: 最长7步纯走位与无关P/L锚
  designer_action: keep
  exact_basis: 第4步切箱，第13步回黏，第14步再切、第15步再黏，最终第30步切开双收束。

- case: CASE_C
  intended_reversal: 玩家原本以为初始箱应单独送达，后来发现该箱竟要先并入两格黏料成三格条、再被拆成箱与黏体分别占三目标，因此它是材料母体。
  subject_cost_fit: well_supported
  heaviest_cost_outside_subject: B/S两次横移与最长5步走位
  designer_action: keep
  exact_basis: 第1步合成三格条，第10至11步切出两箱，第13至17步三份材料分别到位。
