reviews:
  - case: CASE_F
    main_player_facing_merit: "两只箱与B/S锚点在十步内互相改写用途，动作连续紧凑。"
    dominant_aesthetic_problem: "终局依赖锚点下拉再推回，观感稍像短促复位。"
    aesthetic_band: "4+"
    verdict: playtest_worthy
    perceived_reversal: "玩家原本以为上方箱子应直接去占目标，后来发现同一箱子竟要越过B/S并入黏料，因此它成了驱动锚点终局的材料。"
    reason: "箱子的身份转变清楚且牵动后续力链，局面小、空走极少，反转能直接落到操作体验。"

  - case: CASE_C
    main_player_facing_merit: "一条三格材料最终分赴三个目标，合并、搬运与切分形成清楚闭环。"
    dominant_aesthetic_problem: "切分后的三路收尾较顺，后半悬念可能消退偏快。"
    aesthetic_band: "4+"
    verdict: playtest_worthy
    perceived_reversal: "玩家原本以为三格黏条要作为整体搬运，后来发现同一材料组竟要切成两只箱和一格黏料，因此三个目标获得不同形态的解答。"
    reason: "先主动做大再主动拆开的矛盾鲜明，三种落点都服务同一材料命运，结构紧凑易读。"

  - case: CASE_E
    main_player_facing_merit: "黏料的切开、回黏、成L与终局再切构成持续而反直觉的形态推演。"
    dominant_aesthetic_problem: "中段左右反复与最长七步纯走位，可能把洞见磨成执行负担。"
    aesthetic_band: "4+"
    verdict: playtest_worthy
    perceived_reversal: "玩家原本以为L形黏体过境切开后便已完成分工，后来发现同一材料组竟要拉回重黏并在终局再切，因此早先的拆分只是塑形手段。"
    reason: "同一材料的反复变形有明确递进，终局同时覆盖两目标能回收前序；实际节奏仍需玩家体验确认。"

  - case: CASE_A
    main_player_facing_merit: "两类锚点与多批黏料持续互锁，几乎每次变形都会改变下一次受力条件。"
    dominant_aesthetic_problem: "回黏、再切、搬锚与转向过密，玩家可能难以辨认主线而只见状态噪声。"
    aesthetic_band: "4+"
    verdict: playtest_worthy
    perceived_reversal: "玩家原本以为经B/S切开的那批黏料已转成箱子完成分工，后来发现同一批材料竟要多次回黏、再切并转向，因此切开不是单向进程。"
    reason: "反转贯穿解法而非只在结尾出现，且两类边界共同约束它；复杂度高但耦合足以支持送测。"

  - case: CASE_D
    main_player_facing_merit: "B/S往返运料后接入P/L纵向操作，能形成跨锚点的长程联动。"
    dominant_aesthetic_problem: "同一路径三次右拉再三次左拉较机械，最终又转由P/L连续推动收尾。"
    aesthetic_band: "2-3"
    verdict: borderline
    perceived_reversal: "玩家原本以为B/S锚点要一路向右运送黏料，后来发现同一锚点竟要退回原侧，因此向右展开只是为切料创造暂态。"
    reason: "锚点回返可感知，却更像撤销运输位置；真正终局落在另一锚点上，使反转的审美重心被稀释。"

  - case: CASE_B
    main_player_facing_merit: "切出的两箱先分置再重排，最终共同传力拉动B/S，短流程内因果集中。"
    dominant_aesthetic_problem: "中段分置摘要较简略，实际局面中两箱重组是否一眼可读仍待体验。"
    aesthetic_band: "4+"
    verdict: playtest_worthy
    perceived_reversal: "玩家原本以为两格黏料切成箱后应各自处理，后来发现同一材料对竟要重新排成力链，因此分离反而是在准备一次协同拉动。"
    reason: "先拆散再协同的反差具体，且最终三对象力链直接完成目标；十二步规模让洞见不被走位淹没。"

  - case: CASE_G
    main_player_facing_merit: "七格C形黏体先合一再断接，并由分裂后的空间次序产生不可交换的完成顺序。"
    dominant_aesthetic_problem: "五次关键交互散在三十二步中，最长十一格纯走使材料反转与反馈相隔过远。"
    aesthetic_band: "4+"
    verdict: borderline
    perceived_reversal: "玩家原本以为七格C形黏体应保持整体推进，后来发现同一材料组竟要切断三格连接并拆成双臂，因此完整形状只是制造可排序部件的暂态。"
    reason: "合一后必须主动拆散且上臂优先，具备真实次序洞见；但大尺度通行可能削弱玩家对同一反转的持续感。"

cross_case_notes: "F、C、B用很短的操作链把同一对象的身份变化变成终局因果，反转最清楚。E、A拥有更丰富的回黏与再切，但需防止状态变化多到遮蔽主线。D的回返较像位置复原，终局重心又换到P/L。G的合一、断接与顺序锁定很有潜力，不过关键反馈被长距离通行拉开，故暂列边界。"
