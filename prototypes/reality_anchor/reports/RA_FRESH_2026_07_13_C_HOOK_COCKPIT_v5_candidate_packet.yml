attempt_log:
  serious_structural_attempts:
    - v1 开放 7x13 双钩；核心成立但图耗尽且空地过多。
    - v2 7x9 紧凑版；严格唯一与身份反事实通过。
    - v3 右移锚轨以纯化错误反馈；因非等价胜路被严格唯一审计拒绝。
    - v4 恢复紧轨并收窄 claim；全部硬证据重新通过。
    - v5 在 pre-submission 冗余检查中墙化起点行两个无责任空格；布局重进完整 review。
  local_repairs:
    - v1->v2 裁图、墙化锚轨、加入 C 初始对齐矛盾。
    - v3->v4 删除可单独操作锚点的间隙，完成唯一解修复。
    - critic attempt02 后仅将审美目标从5收窄为4；布局、玩家推理和机制范围不变。
  abandoned_families:
    - lexicon C 形断桥/拆端点 family：与完整 C 作品身份相反。
    - v3 纯墙反馈 family：允许单独锚点胜路，拒绝。

archive_taste_context:
  examples:
    - archive_id: RA_CAND_0025
      human_aesthetic_score: 5
      human_difficulty_score: 4
      human_comments: >-
        在狭小紧凑的空间中，将L形反复活塞这一关键高难亮点结构赋予合适的包装以要求玩家主动构造，
        前几步构造不喧宾夺主，终局也有恰到好处的提示。结构紧凑逻辑清晰亮点突出，是构造关类型的优秀案例。
    - archive_id: RA_CAND_0022
      human_aesthetic_score: 5
      human_difficulty_score: 4
      human_comments: >-
        这关的操作非常反直觉，将一个箱子先送入看似死局的死角，构造出拉锚点将两个箱子反向送入目标。
        空间利用率高，结构精巧。在较短的步骤中要求强玩家洞见以发现反直觉操作，是优秀的范例。
    - archive_id: RA_CAND_0024
      human_aesthetic_score: 1
      human_difficulty_score: 3
      human_comments: >-
        玩家看到中间的三个黏块、两个可动锚点，会期待更精彩的切割拼接构造或长链推动、黏块几何形状利用，
        实际却几乎只有推拉腾挪；不要迷信指标和探针，要从玩家角度思考。
    - archive_id: RA_CAND_0032
      human_aesthetic_score: 1
      human_difficulty_score: 3
      human_comments: >-
        开局段落使用到的要素完成后全部退休，和后面的黏块段割裂；务必杜绝拼接无关子关卡来提高机制覆盖、难度或审美。
