prototype_context:
  confirmed_rules:
    - P/L 为可移动两格刚体；P 侧推、L 侧拉，玩家输入时所在侧决定推拉。
    - B/S 为可移动两格刚体；B 侧为箱、S 侧为黏，合法动作后统一归一化。
    - sticky 四邻接自动合并为刚体；刚体任一目标格受阻则整个动作失败。
    - 拉世界中玩家前格必须为空，只拉身后一格相邻的完整对象实例；force 可递归传递。
  win_condition: 所有目标在结算后由 crate、sticky 或任一锚点格覆盖；玩家不算覆盖。
  object_and_event_semantics:
    C_shape: 初始七格 sticky 单一连通分量，坐标为上臂(1,1)-(3,1)、竖脊(1,2)、下臂(1,3)-(3,3)，凹口向右。
    pull_object: 玩家在 pull side 向空前格移动并拉动身后完整对象。
    move_sticky_rigid: 七格 C 形作为同一刚体平移。
    force_chain_n3: 末次输入同时移动 C、P/L、B/S 三个对象实例。
  tool_boundary:
    available: runtime replay, solver, complete graph, SCC/agency, all-win event probe, strict uniqueness audit
    unavailable: curated miner, PuzzleScript exporter/checker

slot_brief:
  intended_role: application
  target: >-
    玩家主动移动并从凹口内操作完整巨大 C 形，使上下双臂在同一刚体位移中同步推动两条锚点线；
    拆块、直条、填口或缺任一臂均不能成立。
  difficulty_expectation: 中等，数值目标3；错误反馈快，不用长度、重复或噪声增难。

mechanic_exposure_context:
  mechanic_window: Reality Anchor 全机制 application，双锚共存。
  allowed_exposure_through: dual_anchor
  claimed_core_events:
    - move_sticky_rigid
    - force_chain:n3
    - anchor_boundary_shift:push_pull
    - anchor_boundary_shift:box_sticky
  latest_exposure_timing_check:
    derived_latest_event_stage: movable_box_sticky_anchor
    claimed_latest_exposed_event: anchor_boundary_shift:box_sticky
    all_solution_required_evidence_ref: prototypes/reality_anchor/reports/event_probe_RA_FRESH_2026_07_13_C_HOOK_COCKPIT_v5.json
    canonical_occurrences:
      - step: 10
        operation_segment_ref: OS4_double_hook_finish
        reasoning_unit_refs: [RU2_use_notch_as_cockpit]
    status: later_phase_present
    revision_direction: none

design_target:
  aesthetic_score_target: 4
  difficulty_score_target: 3
  target_role_notes: >-
    中等 application；审美目标为4。短解允许成立，但亮点必须来自 C 的完整轮廓、凹口方向、
    主动整体位移和双臂同步，不从事件数量或轨迹指标取分。

solve_instance:
  layout: |-
    #########
    #MMM#####
    #M...LPG#
    #MMm.####
    #....SBG#
    ###.@####
    #########
  player_start: [4, 5]
  player_goal: 覆盖(7,2)、(3,3)、(7,4)三个目标。
  win_condition: all_targets_covered_by_objects

mechanism_scope:
  central:
    - 七格 C 在关键动作前后保持单一连通 sticky 刚体。
    - 玩家先整体下移 C，使凹腔换到中间隔离通道，再进入凹腔沿开口方向拉动。
    - 上下双臂在 step10 同时推动 P/L 与 B/S；左竖脊同时覆盖中间目标。
  allowed_support:
    - P/L 提供 pull side 并作为上钩臂的目标对象。
    - B/S 维持 sticky 语义并作为下钩臂的目标对象。
    - 墙只限制锚点轨道、呈现初始矛盾并保持凹腔通道清楚。
  incidental_allowed:
    - 玩家走位与目标上的初始 sticky overlay m。
  required_winning_path_events:
    - anchor_boundary_shift:push_pull
    - anchor_boundary_shift:box_sticky
    - move_sticky_rigid
    - force_chain:n3
  forbidden_winning_path_events:
    - sticky_split
    - sticky_merge
    - sticky_to_box
    - box_to_sticky
  forbidden_if_seen_anywhere: []

player_reasoning:
  canonical_trace_ref: prototypes/reality_anchor/reports/input_replay_RA_FRESH_2026_07_13_C_HOOK_COCKPIT_v5.json
  player_goal:
    description: >-
      把上方 P/L、下方 B/S 各向右移动一格覆盖目标，并让完整 C 的某一格覆盖中间目标；
      三者必须在同一终局保持覆盖。
    state_ref: v5.initial
  reasoning_units:
    - id: RU1_relocate_whole_C
      player_question: >-
        怎样让向右开口的 C 凹腔成为可用操作位，而不在进入时把紧邻入口的 P/L 一起拖进凹口？
      premises:
        - statement: >-
            初始 C 的中行凹腔与 L/P 在同一行；玩家从右向左进入时处于 pull side，身后的 P/L 会跟着左移。
          state_ref: v5.initial
        - statement: >-
            C 的下臂右端下方可站人；从该格向下移动时，玩家身后接触的是七格 C 的下臂，前格开放。
          state_ref: v5.step3.before
        - statement: >-
            整体下移一格后，凹腔落到中间墙廊，上下臂分别与 P/L、B/S 同行，且初始由下臂覆盖的(3,3)目标被腾空。
          state_ref: v5.step3.after
      conclusion: 先从下臂下方拉动整个 C 向下一格，再绕到新凹腔；不要先沿旧凹口进入。
      operation_refs: [OS1_lower_complete_C]
      alternative:
        status: replayed_attempt
        description: 开局直接沿旧凹口向左进入，再尝试向右拉 C。
        local_gain: 玩家确实到达初始凹腔内部，看似获得了内部把手位。
        from_state_ref: v5.initial
        exact_inputs: [up, up, up, left, left, right]
        result_state_ref: v4_alt_early_cavity.step6.illegal
        concrete_outcome: >-
          两次 left 分别把 P/L 从(5,2)-(6,2)拖到(3,2)-(4,2)；玩家到(2,2)后，right 的前格被 L 占住，
          以 pull_world_front_blocked 结束。局面失去两锚同步右推所需的上轨起点。
      feedback:
        - state_ref: v5.step3.after
          visible_change: >-
            七格 C 完整下移；原先在锚点行的凹腔改到中间墙廊，中央目标显露，上下臂同时对准两条锚轨。
    - id: RU2_use_notch_as_cockpit
      player_question: >-
        C 已对齐后，怎样用同一个动作关系同时把上下两个锚点推到右侧目标，并重新覆盖中间目标？
      premises:
        - statement: >-
            step3 后 C 的上、下臂右端分别在(3,2)、(3,4)，两锚左端在(5,2)、(5,4)，中间各隔(4,2)/(4,4)一格。
          state_ref: v5.step3.after
        - statement: >-
            中间墙廊只容玩家进入凹腔；玩家在(2,3)朝右时前格空、身后(1,3)是 C 的左竖脊，处于 pull side。
          state_ref: v5.step8.after
        - statement: >-
            两个锚点的右半格各自紧邻目标；C 的左竖脊在两次右拉后会从(1,3)到(3,3)。
          state_ref: v5.step8.after
      conclusion: >-
        从凹腔内连续向右拉完整 C 两次；第一次把双臂送到两锚旁，第二次由双臂同步推两锚，竖脊同时填中间目标。
      operation_refs: [OS2_enter_relocated_notch, OS3_prime_double_hook, OS4_double_hook_finish]
      alternative:
        status: not_claimed
        description: 两锚没有可供玩家逐个向右推的左侧站位；这是当前局面可见的空间前提，不伪造尝试序列。
        local_gain: none
        from_state_ref: v5.step3.after
        exact_inputs: []
        result_state_ref: not_applicable
        concrete_outcome: not_claimed
      feedback:
        - state_ref: v5.step9.after
          visible_change: C 整体右移一格，玩家仍在凹腔内，上下臂同时贴到两锚左端。
        - state_ref: v5.step10.after
          visible_change: >-
            完整 C 再右移一格；P/L 与 B/S 同时右移并覆盖上下目标，左竖脊落在中间目标，三目标同时覆盖并获胜。
  operation_segments:
    - id: OS1_lower_complete_C
      step_range: 1-3
      exact_inputs: [left, up, down]
      purpose: 走到下臂下方并把完整 C 下拉一格，使凹腔与双臂进入正确三行。
      supports_reasoning_units: [RU1_relocate_whole_C]
    - id: OS2_enter_relocated_notch
      step_range: 4-8
      exact_inputs: [right, up, up, left, left]
      purpose: 绕过下臂右端，从中间墙廊进入向右开放的凹腔。
      supports_reasoning_units: [RU2_use_notch_as_cockpit]
    - id: OS3_prime_double_hook
      step_range: 9-9
      exact_inputs: [right]
      purpose: 从凹腔内拉动完整 C，使上下臂同时靠到两个锚点左端。
      supports_reasoning_units: [RU2_use_notch_as_cockpit]
    - id: OS4_double_hook_finish
      step_range: 10-10
      exact_inputs: [right]
      purpose: 再拉完整 C；双臂同步推动两锚，竖脊覆盖中目标并获胜。
      supports_reasoning_units: [RU2_use_notch_as_cockpit]
  resolution:
    resolves: [RU1_relocate_whole_C, RU2_use_notch_as_cockpit]
    operation_refs: [OS1_lower_complete_C, OS2_enter_relocated_notch, OS3_prime_double_hook, OS4_double_hook_finish]
    final_state_ref: v5.step10.after
    visible_confirmation: 完整七格 C、P/L、B/S 三个刚体均向右排列，三个目标分别由 C 竖脊、P、B 覆盖。
  trace_partition:
    status: complete
    ordered_segment_ids: [OS1_lower_complete_C, OS2_enter_relocated_notch, OS3_prime_double_hook, OS4_double_hook_finish]
    uncovered_steps: []
    overlapping_steps: []

