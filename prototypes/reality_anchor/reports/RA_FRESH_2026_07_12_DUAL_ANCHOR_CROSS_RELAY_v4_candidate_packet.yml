prototype_context:
  confirmed_rules:
    - P/L 是可移动二格刚体；玩家输入时所在侧决定 push 或 pull，锚点只平移不旋转。
    - B/S 是可移动二格刚体；每次合法移动后按边界把箱与黏格归一化，相邻黏格自动合并，跨箱侧会分裂或切回箱。
    - pull 要求玩家前格可进入，并拉动身后一格相邻的完整对象；推拉都可形成 force chain。
    - 任一刚体目标格被墙、边界或不可移动结构挡住时，整次动作失败且状态不变。
  win_condition: 所有目标在结算后由箱、黏块或任一锚点格覆盖；玩家不计覆盖。
  object_and_event_semantics:
    anchor_boundary_shift_push_pull: P/L 本体实际平移。
    anchor_boundary_shift_box_sticky: B/S 本体实际平移并更新材料边界。
    box_to_sticky: 箱格进入 S 侧后变为黏格。
    sticky_merge: 原本分离的正交相邻黏格结算为同一刚体。
    sticky_to_box: 黏格进入 B 侧后变回独立箱。
  tool_boundary: runtime、solver、exact replay、完整 graph、SCC 与定向事件探针可用；curated miner 与 PuzzleScript exporter 不可用。

slot_brief:
  intended_role: dual_anchor_stage_challenge
  target: 双锚点共存下的受力交接、侧别重写、双箱转黏与竖条回切闭环
  difficulty_expectation: 至少4，追求更高

