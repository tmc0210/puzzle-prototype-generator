        operation_segment_ref: SEG1_lift_bs_with_crate
        reasoning_unit_refs: [RU1_borrowed_crate_lift]
      - step: 11
        operation_segment_ref: SEG3_late_bs_material_rewrite
        reasoning_unit_refs: [RU2_reposition_pl_for_second_bs]
    status: later_phase_present
    revision_direction: null

design_target:
  aesthetic_score_target: 4_floor_5_aspiration
  difficulty_score_target: 4_or_higher
  target_role_notes: >
    关卡用三个目标直接消费双锚与末段切回箱；玩家侧价值来自上箱、P/L、B/S、下箱与初始黏块在不同阶段
    为后续动作建立条件，不要求每件材料都进入终局，也不把事件数量、解长或完整图规模当作审美依据。

solve_instance:
  layout: |
    ########
    ##.@#..#
    ###CP..#
    ##G.L.G#
    ###BS#.#
    ##...M##
    #.GC####
    ########
  player_start: [3, 1]
  player_goal: null
  win_condition: all_targets_covered_by_objects

mechanism_scope:
  central:
    - 上箱先下推到 B 半格上方；P/L 右移建立 pull 侧后，玩家上拉 B/S，B 半格以 force chain 把上箱顶回原行，并让 B/S 到达左目标所在行。
    - P/L 随后再右移并下推，P 覆盖右目标且释放 B/S 右侧操作位；此前直接左推 B/S 会被 pull 前格门拒绝。
    - 后段左推 B/S 同时把上、下两箱变为分离黏块；初始右下黏块左拉两次，与下黏块合成竖向二格刚体。
    - 终手把竖条左拉过 B/S，两格同时 sticky_to_box；下格覆盖底目标。
  allowed_support:
    - 八步普通走位用于绕到锚点操作侧与末段拉位。
    - 两枚锚点分别覆盖左、右目标。
  incidental_allowed: []
  required_winning_path_events:
    - anchor_boundary_shift:push_pull
    - anchor_boundary_shift:box_sticky
    - pull_object
    - box_to_sticky
    - sticky_merge
    - move_sticky_rigid
    - sticky_to_box
  required_winning_path_event_counts:
    anchor_boundary_shift_push_pull: 3
    anchor_boundary_shift_box_sticky: 2
  forbidden_winning_path_events: []
  forbidden_if_seen_anywhere: []

player_reasoning:
  canonical_trace_ref: prototypes/reality_anchor/reports/input_replay_RA_FRESH_2026_07_12_DUAL_ANCHOR_CROSS_RELAY_v4.json
  player_goal:
    description: 覆盖盘面三个目标，并判断两枚锚点、两个箱与右下黏格怎样共享有限的操作位。
    state_ref: canonical.step_0
  reasoning_units:
    - id: RU1_borrowed_crate_lift
      player_question: 上箱堵在 B/S 上方时，怎样移动 B/S 到左目标行而不把箱永久推离？
      premises:
        - statement: 初始上箱在 x3,y2，B 半格在 x3,y4；直接继续向下会把箱与 B/S 一起送向下方窄区。
          state_ref: canonical.step_0
        - statement: P/L 的 P、L 竖排在 x4；把 P/L 右推一格后，玩家可站在 x4,y3 的 L 侧并向上拉身后的 B/S。
          state_ref: canonical.step_2
      conclusion: 先把箱下推一格作为 B 半格的受力端，再右移 P/L；从 L 侧上拉 B/S 时，B 半格同步把箱顶回 x3,y2，B/S 到达左目标所在行并等待后段左移覆盖。
      operation_refs: [SEG1_lift_bs_with_crate]
      alternative:
        status: replayed_attempt
        description: 上箱下推后继续向下推，直接把箱与 B/S 一起压向下方。
        local_gain: 一次输入同时移动箱与 B/S，看起来比先横移 P/L 更直接。
        from_state_ref: canonical.step_1
        exact_inputs: [down]
        result_state_ref: alt1.step_2
        concrete_outcome: >
          箱落在 x3,y4，B/S 下移到 y5；左目标仍空，上方 P/L 与 B/S 的 pull 交接线被拉开，
          当前 replay 没有取得任何目标或末段竖条条件；不对该局面的后续可恢复性作额外声称。
      feedback:
        - state_ref: canonical.step_4
          visible_change: B/S 上提到 y3，B 位于左目标右邻；上箱回到 x3,y2，第一次“下推”被可见地回收为受力交接。
    - id: RU2_reposition_pl_for_second_bs
      player_question: 第一次 B/S 上提后，怎样取得它右侧的左推站位并同时保住右目标覆盖？
      premises:
        - statement: step4 时 P/L 在 x5 竖排，L 半格仍占 x5,y3，因此该 B/S 右侧站位尚不存在；step5 把 P/L 右推到 x6 后，x5,y3 才变为空格。
          state_ref: canonical.step_4
        - statement: step5 的 x5,y3 虽已释放，但仍处于 L/pull 侧，直接从该格向左输入会因前格被 B/S 占住而失败；再从上方下推 P/L 后，P 位于右目标 x6,y3，x5,y3 才成为可左推 B/S 的 push 侧站位。
          state_ref: canonical.step_5
      conclusion: 先右推 P/L，再绕到上方把它下推；随后从 x5,y3 左推 B/S，才会同时保住右目标并把上下两箱转黏。
      operation_refs: [SEG2_drop_pl_to_goal, SEG3_late_bs_material_rewrite]
      alternative:
        status: replayed_attempt
        description: P/L 只右移、不下推，玩家直接下走到 x5,y3 并尝试左推 B/S。
        local_gain: 玩家立即到达 B/S 右侧，表面上省去绕到 P/L 上方的两步。
        from_state_ref: canonical.step_5
        exact_inputs: [down, left]
        result_state_ref: alt2.step_7
        concrete_outcome: >
          第一步到达 x5,y3；第二步因当前仍是 L 侧且前格被 B/S 占住，以 pull_world_front_blocked 失败，
          B/S、两箱和两个目标均不变化。
      feedback:
        - state_ref: canonical.step_8
          visible_change: P/L 下移后 P 覆盖右目标，x5,y3 变为空推位。
        - state_ref: canonical.step_11
          visible_change: B/S 左移到 x2-x3，B 此时覆盖左目标；x3,y2 与 x3,y6 两箱同时变成两个分离黏块，最新暴露事件在第二阶段产生结构变化。
    - id: RU3_merge_then_cut_vertical_pair
      player_question: 下部新黏格与右下初始黏格怎样组织成能够送达底目标的对象？
      premises:
        - statement: step11 后下黏块在 x3,y6，初始黏块在 x5,y5；二者相差两列和一行，仍是两个刚体。
          state_ref: canonical.step_11
        - statement: B/S 此时横放在 x2-x3,y3；把位于 x3 列的竖条向左拉一格会让两格同时跨到 B 侧。
          state_ref: canonical.step_15
      conclusion: 先把右下黏块连续左拉两格；第二拉使它在 x3,y5 与 x3,y6 的下黏块合并成竖条，再从底目标右侧向左拉整条跨界切回两箱。
      operation_refs: [SEG4_merge_and_cut]
      alternative:
        status: replayed_attempt
        description: 右下黏块只左拉一格便向下转位，试图直接处理底目标。
        local_gain: 黏块已从 x5,y5 移到 x4,y5，视觉上更接近下黏块和底目标。
        from_state_ref: canonical.step_13
        exact_inputs: [left, down]
        result_state_ref: alt3.step_15
        concrete_outcome: >
          第一手合法；第二手因玩家下方是尚未合并的 x3,y6 黏块而触发 pull_world_front_blocked。
          两块仍分离，无法用一次终手把两格同时切回箱。
      feedback:
        - state_ref: canonical.step_15
          visible_change: 第二次左拉后 x3,y5 与 x3,y6 合并成一根竖向二格黏块。
        - state_ref: canonical.step_17
          visible_change: 竖条左拉跨过 B/S 后两格同时变箱，下格覆盖 x2,y6 目标并立即胜利。
  operation_segments:
    - id: SEG1_lift_bs_with_crate
      step_range: 1-4
      exact_inputs: [down, right, down, up]
      purpose: 下推上箱、右移 P/L，进入 L 侧后上拉 B/S，并由 B 半格把上箱顶回原行。
      supports_reasoning_units: [RU1_borrowed_crate_lift]
    - id: SEG2_drop_pl_to_goal
      step_range: 5-8
      exact_inputs: [right, up, right, down]
      purpose: P/L 右移后绕到上方下推，使 P 覆盖右目标并释放 B/S 右侧站位。
      supports_reasoning_units: [RU2_reposition_pl_for_second_bs]
    - id: SEG3_late_bs_material_rewrite
      step_range: 9-11
      exact_inputs: [left, down, left]
      purpose: 进入新释放的 x5,y3 推位，左推 B/S 并把上下两箱同时转为分离黏块。
      supports_reasoning_units: [RU2_reposition_pl_for_second_bs]
    - id: SEG4_merge_and_cut
      step_range: 12-17
      exact_inputs: [down, down, left, left, down, left]
      purpose: 将初始黏块左拉两格与下黏块合并成竖条，再把竖条左拉跨界切回两箱完成底目标。
      supports_reasoning_units: [RU3_merge_then_cut_vertical_pair]
  resolution:
    resolves: [RU1_borrowed_crate_lift, RU2_reposition_pl_for_second_bs, RU3_merge_then_cut_vertical_pair]
    operation_refs: [SEG1_lift_bs_with_crate, SEG2_drop_pl_to_goal, SEG3_late_bs_material_rewrite, SEG4_merge_and_cut]
    final_state_ref: canonical.step_17
    visible_confirmation: 左目标由 B、右目标由 P、底目标由切回箱同时覆盖；终手结算后立即胜利。
  trace_partition:
    status: complete
    ordered_segment_ids: [SEG1_lift_bs_with_crate, SEG2_drop_pl_to_goal, SEG3_late_bs_material_rewrite, SEG4_merge_and_cut]
    uncovered_steps: []
    overlapping_steps: []

