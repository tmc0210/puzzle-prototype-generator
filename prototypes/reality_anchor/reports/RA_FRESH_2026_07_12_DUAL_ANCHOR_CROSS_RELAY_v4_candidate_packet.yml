    claimed_latest_exposed_event: anchor_boundary_shift:box_sticky
    all_solution_required_evidence_ref: prototypes/reality_anchor/reports/event_probe_RA_FRESH_2026_07_12_DUAL_ANCHOR_CROSS_RELAY_v4.json
    canonical_occurrences:
