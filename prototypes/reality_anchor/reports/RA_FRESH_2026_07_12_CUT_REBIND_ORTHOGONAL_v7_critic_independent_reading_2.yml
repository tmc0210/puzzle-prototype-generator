    - "canonical.step_20-step_24: 上箱与上端点合成二格横条，右移并上推后同时覆盖屋顶两个目标，x6,y2 仍空"
    - "canonical.step_30,step_34-step_35: 下箱与下端点合并覆盖 x6,y4；最后箱进入黏侧后右推，与屋顶横条合成三格 L 并获胜"
