player_facing_reading:
  opening_read: >-
    四目标在上方组成 T；一横一竖两锚紧邻其下，终态朝向可读。无箱或黏块，玩家先能走上两个目标观察。
  intended_solution_read: >-
    P/L 必须先下移释放 B/S 左拉站位；两锚随后同链上移，让 B/S 临时完成竖目标；
    B/S 又必须离开目标腾出 P/L 上拉站位；最后 B/S 左拉时撞上 P/L，两锚一起闭合 T。
  commitment_points:
    - 两步观察后 P/L 下移
    - B/S 临时完整泊位后的主动右移腾位
    - P/L 上拉后唯一 final left 同链收束
  state_responsibility:
    - P/L 初态占住 B/S pull handle
    - B/S 临时目标态占住 P/L pull handle
    - B/S 终局 pull 同时回收自身目标债与 P/L 横向错位债
  payoff_and_resolution: 最后一手同时移动两锚并精确填满开局 T，终局无拖尾
archive_taste_context:
  score_claim_allowed: true
  examples:
