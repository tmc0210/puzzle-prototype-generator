prototype: reality_anchor
role: late_game_challenge
targets:
  aesthetic_score_target: "至少4，追求5"
  difficulty_score_target: "至少4，追求5"
layout: |-
  ######
  ##.G.#
  #GGGS#
  #@PLB#
  #...##
  #..###
  ######
rules_and_scope:
  - 两种锚点都是不可旋转的可移动二格刚体
  - 本关无 crate、无 sticky；B/S 只提供二格刚体与目标覆盖
  - 玩家所在 P/L 区域决定 push 或 pull；force 可把两个锚点放入同一链
  - 四目标必须全部由对象覆盖；玩家站目标不计
solver_facts:
  shortest_cost: 17
  canonical_inputs: [up, right, down, right, left, left, down, down, right, up, left, up, up, right, right, up, left]
  canonical_non_walk_actions: 6
  graph_status: complete
  reachable_states: 178
  legal_transitions: 422
  winning_states: 1
canonical_state_changes:
  - step: 3
    fact: P/L 向下 push，释放旧 L 半格
  - step: 5
    fact: B/S 经该格向左 pull
  - step: 10
    fact: 两锚 n2 同链上移；B/S 两格完整覆盖竖目标
  - step: 15
    fact: B/S 向右 push，竖目标两格失去对象覆盖
  - step: 16
    fact: P/L 向上 pull 到横目标行，整体仍右错一格
  - step: 17
    fact: B/S 向左 pull 并撞上 P/L；n2 同链使两锚同时左移，四目标全部覆盖
