    - {candidate_id: RA_CAND_0017, human_reviewed: true, aesthetic_score: 4, difficulty_score: 5, role: difficulty_positive_and_overload_warning, human_comment: "极难末期挑战；精巧、高机制密度、高要素耦合值得学习，但大量腾挪很难。"}
    - {candidate_id: RA_CAND_0026, human_reviewed: true, aesthetic_score: 4, difficulty_score: 4, role: closest_anchor_rigid_positive, human_comment: "结构干净精巧；无材料承诺时聚焦锚点也是两格刚体可成立。"}
    - {candidate_id: RA_CAND_0024, human_reviewed: true, aesthetic_score: 1, difficulty_score: 3, role: negative, human_comment: "双锚与黏块抬高预期，实际只剩推拉腾挪；不要迷信指标和探针。"}
lineage_facts:
  policy: fresh_required
  authorized_archive_variant_work: false
  post_claim_duplicate_check: 未发现完整链同构
  closest_archive_risk: RA_CAND_0026 只共享 anchor-as-rigid 基础命题
routed_diagnostics:
  critic_focus:
    - 第一手背离目标是否不是唯一显然按钮
    - 临时完整泊位再腾位是否构成真实因果责任
    - 六个对象动作是否足以达到难度4+
    - final mixed-chain T closure 是否达到审美4/5
  scc_interpretation_required: true
evidence_limits:
  - 工具完整性不是质量 merit
  - winning_states=1 不代表只有一条输入序列
  - waypoint 事实不证明玩家洞见或审美
  - >-
    更强的 exact-transition probe 找到 21 步非最优 detour；所以 only canonical trace 使用六个直接相邻转移，
    all-win scope 仅保留 ordered states、n2>=2、中段 mixed-up 与终局 mixed-left
