      非阻断：后续对外表述可否把“再把 C 拉回”明确为“最终把 C 跨界拉回并触发 rebind/merge”，
      从而避免被误读为不存在任何更早的无效 crate pull？
  - >-
      非阻断：若后续要声称所有胜路都由同一对象实例完成同一步 rebind+merge，是否愿意把该声明降为
      returned-trace 叙事，或另行提供 per-object/coupling 证据？
