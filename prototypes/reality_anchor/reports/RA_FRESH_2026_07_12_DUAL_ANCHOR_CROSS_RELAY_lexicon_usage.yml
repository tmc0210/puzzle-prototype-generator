candidate_family: RA_FRESH_2026_07_12_DUAL_ANCHOR_CROSS_RELAY
source: prototypes/reality_anchor/mechanism_lab/lexicon.md
policy: vocabulary_parts_source_only
entries_used:
  - entry: P/L pull 抽取：玩家前格、对象目标格与侧向扫带
    selected_part: 用 P/L 的 pull 侧远程抽出 B/S anchor，并检查玩家前格与锚点两格目标位。
    new_relation: v4 中第一次上拉 B/S 的非接触 B 半格同步把上箱顶回原行；这只完成左目标与中段停位，不是终局。
  - entry: B/S 移动边界：箱组变为 CC、C+M 或黏块
    selected_part: 让 B/S 边界扫过远处对象，使同一占格组合在箱链与黏块之间切换。
    new_relation: v4 的第二次 B/S 左移同时把上下两箱变为分离黏块；下黏块必须与第三块黏块合并成竖条，再跨界切回两箱。
  - entry: P/L 锚点移位：腾出旧半格并改变推拉侧
    selected_part: 移动 P/L 后进入旧 L 半格，并在新侧别下处理此前不可操作的对象。
    new_relation: v4 中 P/L 先横移再下推；P 覆盖右目标的同时释放 x5,y3 站位，使后段 B/S 左推第一次合法。
actual_layout_relation:
  version: RA_FRESH_2026_07_12_DUAL_ANCHOR_CROSS_RELAY_v4
  summary: >
    选用的是三个 lexicon 局部动作语汇，但新关系是闭环责任：上箱先作为 B/S 上提的受力端，
    P/L 再以横移加下推开放第二个 B/S 把手；第二次 B/S 改写出的下黏块又与初始黏块合并，
    竖条跨界切回后才完成底目标。没有复用任何 archive layout、对象角色分配或既有解路线。
excluded_as_primary_family:
  - P/L L 形缺角活塞：避免复刻已归档 active-L constructor 的主要因果链。
  - 纯锚点刚体扫带：人类已标记该 family 饱和，且容易退化为双锚腾挪。
  - 固定 B/S 断桥：避免复刻近期未获人类接受的长链拼接/切割 family。
