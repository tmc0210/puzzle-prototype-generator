mechanism_scope:
  central:
    - B/S 把三箱桥拼入两条黏臂，形成七格 C 形；P/L 的 x=5 拉侧允许整块横拉并在 x=6 切出三箱。
    - 同一切割动作同时完成上、中两个 holding goals、把两条目标黏臂分离，并让初始被 x=3 黏格占住的中轴通道变为可走。
    - 切出的下箱正对右侧近目标；若立即完成该目标，箱会封住 pocket 唯一出口，玩家无法再处理两条黏臂。它必须留到最后。
  allowed_support:
    - 窄槽锁定两只 holding crates，避免它们替代黏臂或右侧终箱。
    - 上下黏臂的先后次序不作排他主张；唯一顺序主张是“两臂均早于右侧箱目标”。
