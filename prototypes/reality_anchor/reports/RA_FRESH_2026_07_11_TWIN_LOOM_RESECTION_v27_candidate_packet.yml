prototype_context:
  confirmed_rules:
    - P/L 固定在 x=4/5；玩家位于 x<=4 时为推世界，位于 x>=5 时为拉世界。
    - B/S 初始为 S4/B5；右推一格后为 S5/B6，并按新半平面归一化 box/sticky。
    - 正交相邻 sticky 自动拼成刚体；sticky 跨入 box side 时变为独立箱，剩余 sticky 按连通块分裂。
    - 所有 G 必须由对象覆盖；玩家站在 G 上不计覆盖。
  win_condition: all_targets_covered_by_objects
  object_and_event_semantics:
    - 初始上下两条二格黏臂位于 (3-4,3) 与 (3-4,5)，三格箱柱位于 x=5、rows 3-5。
    - B/S 右移把箱柱变黏并与两臂拼成七格 C 形；整体右拉后箱柱落在 x=6，切成三箱，两臂落在 x=4-5 并分裂。
    - 切出的上、中两箱立即落在 (6,3)、(6,4) 两个 holding goals；下箱仍位于 (6,5)，与右侧 (8,5) 目标同排。
  tool_boundary:
    - solver、complete graph、agency、event gate 与 exact replay 可支持机械事实。
    - 工具不授予审美、难度或 proposal-ready。

