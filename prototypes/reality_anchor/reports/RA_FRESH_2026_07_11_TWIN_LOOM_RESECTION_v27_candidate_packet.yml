design_target:
  aesthetic_score_target: 5
  difficulty_score_target: 5
  minimum_acceptable: {aesthetic: 4, difficulty: 4}
  target_role_notes:
    - 核心判断是延迟一个已经对齐、两步可完成的目标；不把42步、唯一解或高复用指标当难度。
    - 拼接与切割前缀仍是强制铺垫；价值主张来自切割同时生成 holding goals、打开中轴通道并制造近目标诱惑。

