player_facing_reading:
  opening: >-
    两个对角目标把注意力放在两枚不可旋转二格锚点的端点，而不再用冗余目标直接描出终态。
    玩家有两步可逆走位先进入目标区观察；没有箱或黏块，不会承诺材料谜题。
  causal_chain:
    - P/L 先向下 push，释放旧 L 半格作为 B/S 的左拉把手
    - B/S 经该把手向左 pull，建立第一次双锚碰撞关系
    - 从下方 push P/L，两锚 n2 同链上移，S 暂时覆盖上目标
    - B/S 必须右移撤销上目标覆盖，同时腾出 P/L 的上拉玩家站位
    - P/L 向上 pull，P 先覆盖下目标
    - B/S 向左 pull 触发第二次 n2；S 恢复上目标，P/L 左移使下目标覆盖者从 P 接力给 L
  payoff: >-
    最后一手不是两个锚各自归位，而是在同一向左力链中同时偿还两笔目标责任：
    B/S 恢复上目标，P/L 在移动中把下目标覆盖从 P 端交给 L 端。中段“先覆盖再腾位”
    因此被终局“双目标接力”重读，而不是单纯搬运。
claim_limits:
  - 不声称所有胜路都只有六次对象动作；存在 21 步非最优 P/L 往返 detour
  - 不声称全局首次 B/S shift 必定就是核心左拉；非最优路径可先移动并复原 B/S
  - all-win 范围只包括 ordered anchor states、n2 至少两次，以及中段/终局两个 exact mixed transition
  - v6 沿用 v5 的审美4/难度4 review_loop_state，不把提交前指标当作新质量评分
lexicon_used:
  - id: pl_transverse_handle_gate_matrix
    source_heading: P/L 横向把手：玩家前格门与锚点占格门
    realization: P/L 下推释放旧 L 半格；中段与终局由另一锚点消费非接触半格门
  - id: pl_pull_extraction_vertical_two_cell_object
    source_heading: P/L pull 抽取把手：前格门、占格目标门与扫带
    realization: 玩家站在旧 L 半格左拉垂直 B/S，并由二格目标位完整性约束动作
  - id: pl_mixed_force_chain_wall
    source_heading: P/L 长轴墙廊：L 端余量棘轮（mixed-chain 补谱）
    realization: 两枚锚点先同链上移、再同链左移；两次 n2 分别建立与结算状态债
  - id: single_object_goal_piston_order_lock
    source_heading: 单箱目标活塞顺序锁：推入覆盖与回撤撤销
    realization: 提取“目标覆盖必须主动撤销”的状态责任，改写成上目标覆盖/腾位/恢复与下目标端点接力
new_lexicon_linkage: >-
  双锚编结·目标接力：P/L 释放 B/S 抽取把手，B/S 的临时目标覆盖又占住 P/L pull 把手；
  腾位后 P/L 先以 P 端覆盖下目标，最终 B/S pull 让两锚同链左移，同时恢复上目标并把下目标
  从 P 端交给 L 端。该连接不依赖 crate/sticky 材料，只消费两种锚点的二格刚体、端点与把手关系。
