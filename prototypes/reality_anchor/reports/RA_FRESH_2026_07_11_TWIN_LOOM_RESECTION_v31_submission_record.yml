design_core:
  - 玩家先移动 B/S，把三箱柱刷入上下两条黏臂，拼成七格 C 形整体。
  - 玩家借固定 P/L 的拉侧整体横拉，三格连接柱切回箱；上箱覆盖唯一 holding goal，双臂成为独立目标件，下箱成为门箱。
  - 门箱目标是上下区唯一竖井的门。若切割后用 [down, down, right] 先完成门箱，玩家仍可离开，并用 [down, down, left, left, left, up, down] 完成下锚；只有回头处理上锚时才发现通路已消耗。
  - 所有胜路都要求上锚先于门箱；下锚可在上锚之后与门箱换序，因此只主张局部偏序。
