design_claim:
  player_insight: >-
    四个目标组成一个清楚的 T：水平 P/L 应占底横两格，垂直 B/S 应占右竖两格。
    但两个二格锚点不能直接依次归位。玩家必须先把 P/L 向下推离目标，释放旧 L 半格作为
    B/S 的左拉站位；把 B/S 左拉后，再从下方推动 P/L，使两个锚点同链上移，B/S 会率先
    完整覆盖竖目标。这个看似已经完成的泊位反而占住了 P/L 向上 pull 的玩家站位，所以必须
    把 B/S 右推离目标；随后向上拉 P/L，最后再从上方左拉 B/S。最后一拉让 B/S 撞上 P/L，
    两锚在同一 force chain 中同时左移，恰好一起落入 T 形终态。核心洞见是“先泊—腾位—同泊”。
  causal_chain:
    - P/L 向下 push，释放旧 L 半格
    - 经旧 L 半格向左 pull 垂直 B/S
    - 从下方 push P/L，与 B/S 同链上移，B/S 首次完整覆盖竖目标
    - B/S 向右离开目标，腾出 P/L 的上拉玩家站位
    - P/L 向上 pull 到横目标行但仍右错一格
    - B/S 向左 pull，碰撞并带动 P/L 同链左移，两锚同时完成 T 泊位
  why_not_execution: >-
    玩家能直接读出终态，却不能逐个就近归位。第一手物体动作背离目标；B/S 的完整目标覆盖
    是必须撤销的把手债；终局一手同时移动两锚并兑现开局轮廓。每个位置同时承担目标、玩家站位、
    非接触半格门和 force-chain 垫片责任，难点来自未来把手和状态责任，而非步骤长度或重复操作。
  falsification:
    - 任一胜路绕过任一锚点位移、任一锚点 pull 或两锚同链
    - 规范解中的 P/L 下移不产生随后被使用的 B/S 左拉站位
    - B/S 不必先完整泊位再右移腾出 P/L 把手
    - 终局 B/S 左拉不同时移动 P/L，或两锚可独立完成
    - 玩家主要通过走廊重复、路线税或盲试而非未来把手推理解决

