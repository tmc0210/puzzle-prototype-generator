player_facing_reading:
  opening_read: >-
    玩家开局一眼看到上方四目标组成 T；紧邻下方正好是一横一竖两枚锚点，终态朝向可读。
    没有箱或黏块，因此不会期待未兑现的材料谜题。玩家先能走上两个目标观察，再决定第一手物体动作。
  intended_solution_read: >-
    直接往目标送锚点没有合法把手。玩家要先把 P/L 向下推，才释放其旧 L 格供自己站立并左拉 B/S；
    绕到下方后，向上推 P/L 会因右半格撞上 B/S 而把两锚一起抬升。B/S 此时已完整落在竖目标上，
    但它占住 P/L 上拉所需的格，必须右推腾位。P/L 上拉后只覆盖横目标的右格；最后从上方左拉 B/S，
    B/S 撞上 P/L，二者一起左移，T 形在一手中闭合。
  commitment_points:
    - 开局两步观察后，step 3 把 P/L 向下推离目标；这是唯一 optimal 的首个对象承诺，但仍有可逆观察空间
    - step 10 两锚同链上移后，B/S 临时完成；玩家必须识别“完成态占住把手”而不是停止规划
    - step 15 右推 B/S 主动撤销两个目标覆盖；错误后续会进入 dead exit
    - step 16 后只剩 final left 同链收束，反馈明确且终局无拖尾
  state_responsibility:
    - P/L 初态既是边界也是 B/S 左拉把手的占位者；先下移才释放 handle
    - B/S 中段既是已完成竖目标对象，也是阻塞 P/L pull 玩家站位的门
    - P/L prefinal 已覆盖横目标两格中的右侧两格关系，但要由 B/S 最终碰撞整体左移
    - B/S 终局 pull 同时回收自身目标债与 P/L 横向错位债
  payoff_and_resolution: >-
    终局只有一个 left 输入，却让垂直 B/S 与水平 P/L 同时左移并精确填满开局看到的 T；
    它把“先把完整目标拆掉”的反直觉中段重读为必要的共同泊位准备，形成短而可视的 payoff。

