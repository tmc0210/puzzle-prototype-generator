    不接受两条真正可胜、职责不同或必要动作换序的计划。
  rejected_intermediate:
    candidate: RA_FRESH_2026_07_10_ROLE_RELAY_REWEAVE_v1
    reason: >-
      27 步胜路把一次保留的 B/S 必要位移提前到 P/L 必要往返之前并 exact-state 汇合，
      独立 critic 判为第二种对象动作计划；已拒绝，未入队。
  selected_direction: >-
    换用单箱、双移动锚的紧凑刷界活塞结构；非线性只来自唯一对象宏路径内部的空间回访、
    目标换责和同一箱子的材质循环。
  queue_policy: 新候选正式双审与提交前流程均通过前，不修改 levels 或 playable_queue。

prototype_context:
  confirmed_rules:
    - P/L 两格锚按玩家所在 P/L 侧决定 push 或 pull；锚本体可移动且可覆盖目标。
    - B/S 两格锚移动后，全局材料按新边界归一化；B/S 本体可移动且可覆盖目标。
    - push 可形成 force chain；链内对象必须整体可移动。
    - pull 要求玩家前格为空，并把身后相邻对象沿玩家方向抽入旧位。
    - sticky 连体块按刚体移动；本候选仅出现 singleton M，不发生 sticky_merge。
    - 所有 G 必须由箱、黏块或锚点覆盖；玩家站在 G 上不算覆盖。
  tool_boundary:
    runtime_adapter: available
    full_graph_and_agency: available
    event_count_product_graph: available
    walk_macro_unique_path_audit: available_candidate_specific
    human_live_play: not_run

