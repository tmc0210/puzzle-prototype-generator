    - P/L 下拉一格。
    - 箱子右推一格并再次触发 box_to_sticky:n1。
    - B/S 下推一格。
    - P/L 左拉一格，触发 force_chain:n2、move_sticky_rigid 与 sticky_to_box:n1。
    - P/L 再左拉一格，再次触发 force_chain:n2。
    - 箱子下拉一格获胜。
  required_winning_path_events:
    - anchor_boundary_shift:box_sticky at least 3
    - pull_object:box_sticky_anchor at least 2
    - push_object:box_sticky_anchor at least 1
    - anchor_boundary_shift:push_pull at least 3
    - pull_object:push_pull_anchor at least 3
    - pull_object:crate#1 at least 3
    - push_object:crate#1 at least 1
    - box_to_sticky:n1 at least 2
    - sticky_to_box:n1 at least 2
    - force_chain:n2 at least 2
    - move_sticky_rigid at least 1
