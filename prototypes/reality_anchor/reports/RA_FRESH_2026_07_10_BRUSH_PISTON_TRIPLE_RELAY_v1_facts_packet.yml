    - one winning state 单独不证明唯一解；旧 weak-walk 宏桥审计已明确作废。
    - directed-walk SCC simple-path 审计虽已由 root 完整重算，正式放行仍要求独立复核。
    - 本候选只有一个箱子，M 永远是 singleton；没有 sticky_merge，也没有多格黏块几何。
    - C/M 变化在视觉与 B/S 归一化事件上必经，但 singleton C 与 singleton M 的移动几何相同；critic 必须判断是否只是标签编排。
