critic_questions:
  - 严格对象宏路径唯一且空间复用5，是否从玩家侧消除了此前“用多解修线性”的误读？
  - 上目标四次换责、双锚三次位移和末段双 n2 是否形成一个清晰洞见，还是机制标签过密？
  - singleton M 没有多格几何，是否使 C/M 循环落入 RA_CAND_0024/0027 的 affordance 警戒？
  - 五步换侧走位是否被后续反向推离消费，还是足以构成路线税？
  - 玩家侧审美与难度能否均保守达到4；是否任一能支持5？

