player_facing_reading:
  opening_read: >-
    玩家位于两锚之间；最初 B/S 可从不同端部靠近，但严格审计显示两种最短入口只产生同一次上拉后的同一对象宏状态。
    初始对象宏路径没有第二条可胜计划。
  intended_solution_read:
    前五次对象动作依次抬升 B/S、把箱子拉到上目标、右移 B/S 刷回箱态、下拉 P/L；
    中段绕到箱左侧后主动把已覆盖目标的箱子推离，再下推 B/S；末段两次左拉 P/L 与箱/M 形成 n2 混链，
    最后一拉箱完成 P/C/S 三目标分工。
  payoff_and_resolution: >-
    上目标在 step5-7 由 M/C 暂占，step14 被主动清空，step17 又由 C 短暂恢复，step18 改由 P 接管；
    中目标则从早期 B 暂占变为终局箱，底目标由 S 接管。

