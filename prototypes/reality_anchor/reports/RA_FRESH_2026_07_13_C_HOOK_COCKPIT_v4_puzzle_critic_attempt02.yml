critic_items:
  - id: CI1_aesthetic_target_boundary
    type: score_boundary
    target_ref: design_target.aesthetic_score_target
    design_relation: >-
      玩家看见完整 C、两枚横向锚点和三个目标；step3 下拉 C 后凹口与双臂一次完成对齐，
      step9-10 连续右拉便贴锚并一次获胜。棋盘变化集中而整洁，但后续操作没有再次改序或重构。
    attack: >-
      该结构支持审美 4，却不足以支持 packet 声明的 5。RU1 错路投入短、反馈早，RU2 的第二次 right 在第一次贴锚后直接可见；
      三次对象移动形成漂亮演示，但没有达到 5 分正例所体现的主动构造深度或反直觉承诺。
    evidence_basis: >-
      layout；steps 3/9/10；RU1 alternative exact_inputs 与 concrete_outcome；
      RA_CAND_0022/0025 正向人评以及 RA_CAND_0031 的“显然少量重复拉动”负向警戒。
    player_facing_effect: >-
      玩家得到一个紧凑、统一、反馈强的 C 形双钩结算，但主要认知工作在第一次看懂“先下移再进凹口”后结束，
      终局视觉复杂度高于剩余决策深度。
    blocks_proposal_ready: true
    expected_designer_response: downgrade_or_hold
  - id: CI2_RU1_cheap_affordance_discovery
    type: nonblocking_risk
    target_ref: player_reasoning.RU1_relocate_whole_C
    design_relation: >-
      玩家从起点只需 left、up 站到下臂右端下方，再按 down 就会拉动完整 C；
      棋盘立即显露中心目标并把凹口、上下臂对齐到目标走廊，后续进入凹口的路径随之开放。
    attack: >-
      step3 很可能由起点附近最短的可交互位置被廉价试出，而不是必须先解决完整的 RU1 问题。
      旧凹口错路虽自然，但 P/L 从第一次 left 就可见跟随，最终阻塞也只需短投入，不能提供深搜索或强承诺。
    evidence_basis: layout；canonical steps 1-3；RU1 alternative steps 1-6。
    player_facing_effect: >-
      玩家仍需应用拉侧语义理解结果，但可以通过很少的局部试探获得关键对齐；这限制上界，却不破坏难度 3 application。
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI3_RU2_direct_second_pull
    type: nonblocking_risk
    target_ref: player_reasoning.RU2_use_notch_as_cockpit
    design_relation: >-
      step8 玩家已经在(2,3)凹口内，step9 向右后上下臂同时贴住两锚且玩家仍能向右；
      step10 相同输入直接把两锚推上目标并让竖脊覆盖中心。
    attack: >-
      第一次 right 的可见反馈把第二次 right 几乎完全提示出来，连续同向输入之间没有新的资源冲突、改序判断或风险比较。
    evidence_basis: steps 8-10；OS3_prime_double_hook；OS4_double_hook_finish。
    player_facing_effect: 终局反馈强而操作判断薄；适合难度 3 的收束，不足以单独支撑最高审美或更高难度。
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking

diagnostic_interpretations:
  - graph_fact: complete_graph reachable_states=33, legal_transitions=55, winning_states=1；strict shortest input path/signature 唯一。
    neutral_meaning: 当前规则下枚举图只有一个胜态，规范最短输入与非行走对象序列唯一。
    player_facing_interpretation: 唯一性不说明玩家是否需要洞见；结合具体轨迹，它只确认 down、right、right 对象序列没有等价胜法替代。
    verdict_effect: none
  - graph_fact: initial_scc states=10, exit_count=3, win_exit_count=1, dead_exit_count=2, nearest_win_exit_distance=4。
    neutral_meaning: 初始 SCC 有一个通向胜利的出口和两个死出口，最近胜出口距离为 4。
    player_facing_interpretation: >-
      RU1 的旧凹口路线提供一个自然错误方向，但锚点移动从首次 left 起可见、阻塞在短投入内出现；
      SCC 数量本身不把这种快速反馈的试错升级为高难推理。
    verdict_effect: caveat
  - graph_fact: split_blocks、straight_bar、filled_notch、no_upper_arm、no_lower_arm 均 complete_0_win。
    neutral_meaning: 这些身份改写在对应完整图中均无胜态，当前形状部件对可解性必要。
    player_facing_interpretation: >-
      玩家侧确实使用完整 C 的凹口作为站位、双臂同步接触两锚、竖脊回填中心；
      该事实排除了“部件纯装饰”，但必要性本身不证明审美 5。
    verdict_effect: none
  - graph_fact: all_win_required_groups=pl_shift, bs_shift, sticky_move, dual_force；latest claimed event 在 step10。
    neutral_meaning: 所有胜路都必须移动两锚、移动 sticky 并触发双重传力，最晚机制事件出现在结算步。
    player_facing_interpretation: >-
      两锚和完整 C 都一直承担到终局，没有 RA_CAND_0030/0032 所警告的早段退休，也没有 RA_CAND_0027 的未兑现可动 affordance；
      但事件必需与晚暴露不能替代玩家决策深度。
    verdict_effect: none

handoff_notes:
  - >-
    本候选没有 stitched 子关、退休要素或明显 affordance pollution：step3 的腾空与换层直接创造 step8 的凹口站位，
    两枚锚点和 C 的全部几何部件在 step10 同时结算。
  - >-
    若本轮硬性目标仍为 aesthetic_score_target=5，应保持 held_proposal；可选择降为审美 4 的紧凑 application 候选，
    或另行做结构修改后交给新的 fresh critic。当前 critic 不复审修改版。
