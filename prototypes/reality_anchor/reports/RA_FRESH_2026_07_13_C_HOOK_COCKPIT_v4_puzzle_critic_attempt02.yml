aesthetic_target_fit: >-
  supports_4_but_not_claimed_5。完整 C 的凹口、上下臂和左竖脊都在同一连续因果链中被消费，
  step10 的双锚同步覆盖与中心回填形成紧凑、清楚的终局，足以越过 1 分警戒中的 affordance 污染、要素退休和无关拼接。
  但核心对象操作只有 step3 的一次下拉与 step9-10 的连续两次右拉；RU1 的自然错路反馈很快，RU2 第一次贴锚后第二次 right 近乎显然。
  与人评 5 分正例的主动构造深度或反直觉承诺相比，当前材料不足以支持 aesthetic_score_target=5。

difficulty_target_fit: >-
  supports_target_3_application。玩家需应用 pull side 与 sticky 刚体几何，识别旧凹口会拖走 P/L，
  再用整体下移同时换凹口层、腾目标和对齐双轨；这是可分析的机制应用。
  错路在少量输入内暴露且意图解也可被最近 affordance 廉价试出，进入新凹口后的 right、right 又十分直接，
  因而支持常规 application 难度 3，不支持把它解释为更高阶洞见或搜索负担。

