aesthetic_target_fit: >-
  支持 aesthetic 4 下限，不支持 5 aspiration。双锚侧别交接和末段“转黏—合并—回切”有紧凑的具体 payoff，
  明显越过 RA_CAND_0024 的纯腾挪失败线；但 RU1 开场选择偏强制、RU3 的合并路线较直白，
  且第6-10步有一段操作侧绕行，尚未达到 RA_CAND_0022/0025 所描述的全程强洞见与高度凝练。

difficulty_target_fit: >-
  支持 difficulty 4 边界，不支持“更高”。RU2 要求玩家理解 P/L 不只占目标，还会把 x5,y3 从 pull 失败位重写为 push 位，
  并把该变化用于 B/S 与双箱材料转换，这是实质推理；但 RU1 的第一手受开局拓扑强制，RU3 的错误方向即时且可预见，
  三个 RU 并未各自提供同等强度的可分析选择，因此缺少支持高于4的玩家侧依据。

