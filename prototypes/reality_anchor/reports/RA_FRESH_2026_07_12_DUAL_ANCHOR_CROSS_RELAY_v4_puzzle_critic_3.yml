critic_items:
  - id: CI_RU1_ALTERNATIVE_NO_CONTRADICTION
    type: core_blocker
    target_ref: player_reasoning.reasoning_units.RU1_borrowed_crate_lift.alternative
    design_relation: >-
      玩家在 canonical.step_1 看见箱位于 (3,3)、B/S 紧随其下；alternative 只输入 down，
      把箱送到 (3,4)、B/S 送到 y5，棋盘只是暂时离开左目标行。
    attack: >-
      concrete_outcome 明确只说“当前 replay 没有取得条件”并拒绝判断可恢复性，因而没有给出玩家能据此排除该路线的矛盾。
      一步未得分不是失败理由；该 alternative 不能支撑“必须先横移 P/L 再上拉”的计划结论。
    evidence_basis: >-
      RU1 alternative exact_inputs=[down] 与 alt1.step_2 outcome；canonical.step_4 的正向反馈只能证明规范动作有效，
      不能证明 alternative 为认真路线或为何应被剪枝。
    player_facing_effect: >-
      RU1 目前把规范解与一个未被证伪的分支作对比，玩家的开局洞见强度被夸大；尤其 initial_scc_size_2_with_one_forced_viable_exit
      已提示开局进展口很窄，必须说明真正的决策状态与可见失败后果。
    blocks_proposal_ready: true
    expected_designer_response: revise_claim
  - id: CI_RU3_ALTERNATIVE_CHEAP_WALL_PROBE
    type: core_blocker
    target_ref: player_reasoning.reasoning_units.RU3_merge_then_cut_vertical_pair.alternative
    design_relation: >-
      玩家在 canonical.step_13 从 (4,5) 左拉黏格后站到 (3,5)，正下方 (3,6) 已有另一黏格，且其下 y7 是墙；
      alternative 的第二手 down 立即状态不变。
    attack: >-
      这不是会让玩家认真投入的竞争方案：目标方向被黏格与底墙直接封住，失败在输入前即可看见，且只需一次廉价探针确认。
      它没有证明玩家需要通过结构推理得出“两次左拉后合并”，只证明不能朝墙推/拉当前对象。
    evidence_basis: >-
      solve_instance.layout 的底墙、canonical.step_13、alternative exact_inputs=[left,down]、alt3.step_15 pull_world_front_blocked。
    player_facing_effect: >-
      末段的合并与回切 payoff 真实存在，但 RU3 作为独立高难推理单元的 alternative/矛盾不成立；
      需要换成同一状态下更自然且有局部收益的构形路线，或降低该 RU 对难度的领功。
    blocks_proposal_ready: true
    expected_designer_response: revise_claim
  - id: CI_DIFFICULTY_HIGH_BOUNDARY
    type: score_boundary
    target_ref: design_target.difficulty_score_target
    design_relation: RU2 的侧别重写是主要高强度决策，RU1 与 RU3 的现有 alternatives 未形成同等强度的可分析排除。
    attack: 当前材料支持 difficulty 4 边界，不支持高于4。
    evidence_basis: RU2 alt2 的即时模式失败、RU1 alt1 未证伪、RU3 alt3 的贴墙即时失败，以及人类 difficulty4 正例 RA_CAND_0022/0025/0028。
    player_facing_effect: 玩家会获得一个扎实的双锚模式切换与一个清晰终局构形，但不是三次同等级的深推理。
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI_AESTHETIC_FIVE_BOUNDARY
    type: score_boundary
    target_ref: design_target.aesthetic_score_target
    design_relation: >-
      step4 的反向顶箱、step8-11 的跨锚侧别交接、step15-17 的竖条合并回切构成三个可见阶段；
      但第6-10步包含绕位，开场与末段选择压力不均。
    attack: 支持 aesthetic 4 下限，不支持5；两处弱 alternative 也使设计说明比实际玩家洞见更饱满。
    evidence_basis: canonical.step_4、step_8、step_11、step_15、step_17 与 RA_CAND_0022/0025/0024/0028 的人类评语边界。
    player_facing_effect: 玩家能感到材料状态闭环与双锚互锁，但整体凝练度和持续惊喜尚未达到5分正例的描述强度。
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI_OPENING_FORCEDNESS
    type: nonblocking_risk
    target_ref: player_reasoning.RU1_borrowed_crate_lift
    design_relation: 开局玩家在 (3,1)，下方紧邻箱 (3,2)，顶部与左右受墙体限制；第一步 down 把箱推至 (3,3)。
    attack: routed graph fact 指出 initial_scc_size=2 且只有一个 forced viable exit，开场反直觉下推可能更多是唯一进展动作，而非主动洞见。
    evidence_basis: solve_instance.layout、canonical.step_1、hard_fact_summary_for_critic.routed_diagnostic_facts.initial_scc_size_2_with_one_forced_viable_exit。
    player_facing_effect: 玩家仍会在后续看到箱被反向顶回的回收感，但第一步本身不应承担高难选择的分值。
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI_LINEAGE_BOUNDARY
    type: diagnostic_note
    target_ref: archive_lineage_policy
    design_relation: >-
      当前 packet 的具体核心关系是上箱/B/S force chain、P/L 改写 B/S 推位、双箱同步转黏与竖条回切；
      给出的 archive anchors 只有人类评语，没有显示相同布局骨架、对象角色或解路线。
    attack: candidate_relation=fresh 与 why_not_archive_variant 是 designer 声明，本身不构成审美优点；但当前材料也没有可定位的 archive 核心继承，故不生成 lineage blocker。
    evidence_basis: archive_lineage_policy、mechanism_scope 与 archive_taste_context 的人类评语边界。
    player_facing_effect: none
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking

diagnostic_interpretations:
  - graph_fact: complete graph has 381 reachable states, 837 legal transitions, 1 winning state
    neutral_meaning: 在给定完整图中只有一个胜利状态；这描述终局拓扑，不描述玩家理解过程。
    player_facing_interpretation: 玩家探索最终必须汇入同一对象排布，错误路线不会以另一种终局构形获胜；这可能增强收束感，也可能增加搜索刚性。
    verdict_effect: none
  - graph_fact: shortest depth 17, shortest win state count 1, shortest input sequence count 1
    neutral_meaning: 最短层只有一个胜态和一条最短输入序列。
    player_facing_interpretation: 规范解没有同长替代顺序，但唯一性不证明每个步骤都需要洞见，也不证明自然可发现。
    verdict_effect: none
  - graph_fact: initial_scc_size_2_with_one_forced_viable_exit
    neutral_meaning: 初始可逆局部区域很小，且只有一个能继续通往胜利的出口。
    player_facing_interpretation: 开场试探面窄，第一步/首段容易表现为强制进展；这削弱把开局动作本身计为高难洞见的依据。
    verdict_effect: caveat
  - graph_fact: all winning paths require at least 3 P/L shifts, 2 B/S shifts, material normalization, sticky merge and sticky rigid move
    neutral_meaning: 完整探针未发现绕开这些事件或低于锚点移动计数门的胜路。
    player_facing_interpretation: 这些机制确实出现在所有胜路，但只有具体的 step8 侧别改写和 step11-17 构形后果支持玩家侧价值；事件门本身不加分。
    verdict_effect: none

handoff_notes:
  - >-
    保留 raw-only 初判原样；完整 packet 解释了 step8 的必要玩家侧因果，因此该初始疑点不再单独阻塞，
    但 RU1 与 RU3 的 replayed alternatives 不满足“认真路线 + 具体矛盾”标准，最终结论据此收紧为 revise_required。
  - >-
    重审时只需重写或降格 RU1、RU3 的 alternative/难度领功，并明确其可见剪枝理由；当前批评没有提出结构修改要求。
  - >-
    interface_pair_policy 未声明 target/ignored/risky pairs，pair diagnostics 为空；没有隐藏 pair 通过条件。
  - >-
    pre-submission 类原型流程只作为阶段合同，不计入审美、难度或 role fit 优点。
