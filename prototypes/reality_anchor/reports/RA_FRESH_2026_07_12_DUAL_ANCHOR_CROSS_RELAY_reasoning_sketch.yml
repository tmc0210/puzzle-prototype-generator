resolved_candidate_version: RA_FRESH_2026_07_12_DUAL_ANCHOR_CROSS_RELAY_v4
reasoning_sketch:
  player_goal: 用两枚锚点覆盖上方两个目标，并把下方目标最终交给由黏块切回的箱子。
  intended_question: >
    怎样先借 P/L 的侧别把 B/S 与上箱一起提到目标行，再把 P/L 改到右侧纵向停位，
    取得第二个 B/S 推位并把上下两箱同时变黏，最后把下方黏块拼成可跨界切回的竖条？
  visible_premises:
    - 上箱正好位于 B 半格的上方；B/S 上提时会用二格刚体的另一半把上箱一起顶回原行。
    - P/L 横移后仍占住 B/S 右侧下推位；必须再从上方把 P/L 下推，右侧目标才由 P 覆盖且 B/S 左推位才开放。
    - 第二次 B/S 左移会让上、下两箱同时变成分离黏块；初始右下黏块只有向左拉两格才会与下黏块正交相邻。
    - 合并后的竖向二格黏块跨过 B/S 左拉时，两格同时切回箱，较低一格覆盖终点目标。
  intended_conclusion: >
    先把上箱下推作为 B/S 上提时的受力端，再横移 P/L 建立 pull 侧完成第一次 B/S 位移；
    随后把 P/L 横移并下推到右目标，才能从右侧左推 B/S 完成后期双箱转黏；最后必须先拼成
    竖条再跨界左拉，不能逐格处理。
  planned_mechanic_sequence:
    - 下推上箱，右推 P/L；进入 L 侧后向上拉 B/S，B 半格同步把箱顶回上行，并把 B/S 提到左目标所在行。
    - 右推 P/L，再绕到其上方下推，使 P 覆盖右目标并开放 B/S 右侧站位。
    - 左推 B/S；上、下两箱同时 box_to_sticky，形成两个分离黏块。
    - 把右下初始黏块左拉两格，与下黏块合并成竖条；再向左拉竖条跨 B/S，切回两箱并完成底目标。
  intended_feedback:
    - 第一次 B/S 上提后，B 到达左目标右邻且上箱回到原行，玩家能看到“先下推箱”不是损失而是建立受力交接。
    - P/L 下推后，右目标从 L 覆盖改为 P 覆盖，玩家站位从被 pull 前格阻挡变为可左推 B/S。
    - 第二次 B/S 左移后，上下两箱同时变黏；右下黏块左拉两次时第二次即时合并成竖条。
    - 终手左拉让竖条两格同时变箱，底目标由下格直接覆盖并胜利。

tool_questions:
  - 是否存在不移动 P/L 即可取得后段 B/S 把手的旁路？
  - 是否所有胜路都需要 B/S 至少两次边界位移，且后一次落在第二或更后的 reasoning phase？
  - 是否存在把两个锚点直接推上目标、绕过材料责任链的非等价胜解？
  - 完整图内的胜解是否唯一，或仅有终局与机制顺序等价的走位变体？
