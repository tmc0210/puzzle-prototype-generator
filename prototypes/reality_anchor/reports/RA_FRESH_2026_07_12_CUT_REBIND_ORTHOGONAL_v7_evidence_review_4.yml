evidence_limits:
  - >-
    reachable graph 在 500000 状态预算耗尽，不能据此排除更深处的不同长解；
    equivalent_variants_only 只能按已提交的完整最短层与定向发现的换序变体理解，不能解释为
    unique_complete 或完整图的全解族分类。
  - >-
    anchor_boundary_shift:push_pull、box_to_sticky、sticky_merge、move_sticky_rigid 的
    avoid-event 扫描均 exhausted，只支持预算内未见旁路，不支持 all-solution necessity。
  - >-
    objectParticipation 未提供实例级归因；现有 exact trace 支持状态占位、事件 pattern 与已知
    两条路径的对象职责比较，不支持实例身份谱系或 per-object necessity。
  - >-
    calibrated_trace_metrics 不属于 evidence；本审查不评价审美、难度、好玩程度、玩家问题
    显著性或 campaign placement。
