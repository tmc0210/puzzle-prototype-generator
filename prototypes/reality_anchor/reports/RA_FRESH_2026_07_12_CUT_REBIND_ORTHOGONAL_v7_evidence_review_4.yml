supported_claims:
  - target_ref: player_reasoning.player_goal
    evidence_basis: >-
      description 现在只陈述规则层目标：让底部连续四格目标与上方分散四格目标同时被物体覆盖。
      它与 layout 中底部 x4-x7 的四个目标、上方 y1-y4 的四个目标以及
      all_targets_covered_by_objects 胜利条件一致，不再预述锚点列车、切割、重拼或最终 L
      等机械解法。
  - target_ref: player_reasoning.RU1_four_cell_anchor_train.premises
    evidence_basis: >-
      canonical.step_0 显示 P/L 位于 x2-x3,y7，B/S 位于 x2-x3,y6，底部目标连续位于
      x4-x7,y7，x8,y7 为外墙；同一初态的 C 形黏块占 x4,y2-y4 与 x5,y2/y4，因而连接柱
      在 x4、两个端点在 x5。结合 packet 已确认的 B/S 边界归一化规则，可从初态推出当
      B/S 最终停为 B:x4/S:x5 时，x4 三格转为箱而 x5 上下端保留为两个分离黏分量。
      canonical.step_14 的 exact 状态也验证该规则推导，状态为 C:4,2;4,3;4,4、
      M:5,2|5,4、BS:B:4,7;S:5,7、PL:P:6,7;L:7,7。
  - target_ref: player_reasoning.RU1_four_cell_anchor_train.alternative_and_feedback
    evidence_basis: >-
      alternative 已改为 not_claimed，exact_inputs 为空，不再把显然撞墙包装成竞争路线。
      overshoot replay 的 step 15 从 canonical step 14 输入 right，结果 legal=false、
      reason=force_blocked，且 before/after key 完全相同，支持其作为停位边界反馈的表述。
  - target_ref: player_reasoning.RU3_rebuild_final_l.premises
    evidence_basis: >-
      canonical.step_24 的 exact state 为顶部黏条 x6-x7,y1、空目标 x6,y2、剩余箱
      x4,y3-y4 与下端点 x5,y4，支持第一条 premise。canonical.step_30 的 exact state 为
      下端黏条 x5-x6,y4、唯一剩余箱 x4,y3、空目标 x6,y2；x4-x6,y2 均无对象阻挡，且
      x6,y2 与顶部黏格 x6,y1 正交相邻，支持第二条 premise。两条 premise 均只描述各自
      引用状态中的现有事实，没有借用 steps 31-35 的未来执行作为前提。
  - target_ref: player_reasoning.operation_segments_and_trace_partition
    evidence_basis: >-
      SEG1 至 SEG6 的 step_range 依次为 1-3、4-9、10-14、15-24、25-30、31-35；各段
      exact_inputs 与 canonical replay 对应区间逐项一致。六段连续覆盖全部 35 个输入，
      无缺步、无重叠，仍支持 trace_partition.status=complete、uncovered_steps=[]、
      overlapping_steps=[]。本轮 claim-only 修订未改变 operation segments 或 exact trace。
  - target_ref: solution_uniqueness
    evidence_basis: >-
      result 仍为合法枚举值 equivalent_variants_only，且本轮未改动其证据或边界。
      完整首胜层枚举在深度 35 得到 shortestPathCount=1、shortestWinStateCount=1；已知
