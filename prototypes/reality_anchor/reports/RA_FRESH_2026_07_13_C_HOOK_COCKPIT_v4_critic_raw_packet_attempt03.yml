prototype_rules:
  confirmed_rules:
    - P/L 是可移动两格刚体；玩家在 P 一侧推，在 L 一侧拉。
    - 拉动时玩家前格必须为空，只拉身后一格相邻的完整对象；力可递归传到其它可动物体。
    - B/S 是可移动两格刚体；B 一侧对象为箱，S 一侧对象为 sticky。
    - sticky 四邻接形成刚体；任一格目标位置受阻时整次刚体移动失败。
  win_condition: 结算后全部目标由 crate、sticky 或任一锚点格覆盖；玩家不算覆盖。
  object_and_event_semantics:
    - M 表示当前 sticky cell；相邻 M 属于同一连通刚体。
    - L/P 与 S/B 两对字符分别是两个横向两格锚点。
    - m 表示 sticky cell 覆盖目标，G 表示未被对象覆盖的目标。

