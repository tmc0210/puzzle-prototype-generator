candidate_version: RA_FRESH_2026_07_10_SQUARE_BIND_CROSSCUT_v7
review_iteration: 2
claim_last_review: true

slot_brief:
  intended_role: late_challenge_or_capstone
  known_before: all_current_reality_anchor_runtime_rules
  target: 双锚点后期挑战；难度至少 4，追求更高；审美至少 4，追求 5。

target_role_notes: >-
  这是状态重读与形状构造题，不把事件次数或搜索规模当谜底。第一次 B/S 位移后，
  两枚已在目标上的独立箱与竖黏条构成可信近解；玩家必须放弃“保留独立性”，先把
  四格全绑成 2x2 耦合搬运器，再横切解码。

design_claim:
  player_insight: >-
    半绑定态看似已经拥有正确材料分工：两箱仍独立且已解，竖黏条也已生成；但在
    pull 世界中先分配两箱会形成交叉死结。正确洞见是让第二次 B/S 位移把已解箱也
    变黏，主动牺牲独立性，借完整 2x2 同步横移；跨线后再按列恢复箱/黏分工。
  causal_chain:
    - 第一次左移 B/S 生成 C+M / C+M，并开放 x=6 下行入口；半绑定资源可立即操作。
    - 若先保留独立箱，上箱能覆盖左目标、下箱能进入终点列，随后玩家被两个箱卡成 pull knot；完整后继图无胜。
    - 正确计划在移动资源前第二次左移 B/S；两枚目标箱转换并与竖黏条合成完整 2x2。
    - 从左侧 pull 正方形一格；x=3 列 sticky_to_box 成两箱，x=4 列保持黏条并直接覆盖双目标。
    - 上箱左拉入 [2,5]；下箱最后下拉入 [3,7]；B/S 覆盖顶部双目标，固定 P/L 保持不动。
  why_not_execution: >-
    规范解 15 步含 10 次 walk，但 v6 的黏条回拉与七步换把手已删除。所主张的 4 档
    难度只来自一次具体、可执行、有局部收益却全局失败的状态误读，以及“全绑后再
    解码”的反向计划；若 critic 认为假方案不够可信或剩余走位仍主导节奏，则难度
    或审美门槛失败，必须继续改版。
  required_winning_path_events:
    - anchor_boundary_shift:box_sticky at least 2
    - box_to_sticky occurrence at least 2
    - sticky_merge occurrence at least 2
    - pull_object at least 1
    - move_sticky_rigid at least 1
    - sticky_to_box at least 1
  forbidden_winning_path_events:
    - crate pull before second B/S shift
    - sticky movement before second B/S shift
    - sticky_to_box before second B/S shift
    - win_without_fixed_P/L_pull_semantics
  falsification:
    - 任一完整 all-solution/count/phase probe 违反上述事件与阶段门，核心 claim 失败。
    - 若半绑定独立箱路线仍可胜，或其失败只是不可信的明显死角，玩家洞见 claim 失败。
    - 若完整 2x2 不是后续按列解码所必需，构造 claim 失败。
    - 若 P/L 可移动或 pull 语义可旁路，固定锚点读图承诺失败。
    - 若玩家侧评审仍只支持难度 3 或审美低于 4，不得提交待玩列表。

lineage_claim:
  relation: fresh_family_revision
  archive_variant_authorized: false
  why_not_archive_variant: >-
    本版只继承本轮 fresh family 的 2x2 横切核心，并针对 critic_1 的结构阻塞重写选择与
    路线；没有使用 archive、package 其它 level 或其它线程候选的布局与因果链。

lexicon_used:
  - B/S 绑定债：箱资源生成黏块形状
  - Pull 侧对象可动性：单箱基线与刚体墙口
new_linkage: >-
  第一次刷出 C+M / C+M 的假近解；单箱在 pull 墙口形成交叉死结，迫使玩家反向把
  已解箱也绑定成 2x2。完整正方形作为耦合搬运器横移后，B/S 再于目标列解码成
  两箱与竖黏条，使“先牺牲自由、后恢复分工”成为同一几何闭环。
