design_implication: >-
  该交换不是“目标不够严格”，而是两个操作在当前局部规则下可交换并汇合。
  真正修复必须让第一次 B/S 位移改变拉箱动作的可达性或合法性；
  仅加远端墙、换起点、换目标、把 B/S 在现有地板上平移，都不能保存历史差异。
  明确相位门结构已验证方向正确但当前 27 个种子全部不可解，若继续应重做工作区拓扑，
  不应再在 v6 外壳上追加局部补丁。

