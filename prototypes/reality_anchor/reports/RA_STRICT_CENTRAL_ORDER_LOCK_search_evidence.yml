  structural_reading: >-
    标准路线先在 (5,4) 向下拉 (5,3) 的箱，再第一次上移 B/S；
    绕过路线先上移 B/S，再执行同一空间动作。后者让箱在跨界时转黏并与邻格合并，
    两条路线随后汇合到完全相同的原始状态。因此只改目标或终局锚点位置无法区分这两段历史。

