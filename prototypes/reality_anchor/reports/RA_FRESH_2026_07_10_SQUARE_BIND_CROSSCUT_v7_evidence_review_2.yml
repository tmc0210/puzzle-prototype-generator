supported_claims:
  - claim: >-
      候选可解，且返回的最短 15 步实例确实执行“两次 B/S 左移—完整方形左拉横切—
      两箱分别落位”的因果链。
    evidence:
      - >-
        layout analysis 的 solver 为 found=true、shortest_cost=15、
        explored_states_before_shortest=277；canonical inputs 与 facts packet 完全一致。
      - >-
        返回 trace 的第 1、2 步各含 anchor_boundary_shift:box_sticky、
        box_to_sticky:n2、sticky_merge:n1；第 9 步含 move_sticky_rigid 与
        sticky_to_box:n2；第 10、15 步分别 pull 两个 crate。
      - >-
        goal coverage 在第 15 步逐格确认：[3,3]/[4,3] 由 B/S 两端覆盖，
        [4,5]/[4,6] 由保留的竖黏条覆盖，[2,5]/[3,7] 由两个箱覆盖并获胜。
    scope: returned_shortest_trace_instance_only

  - claim: >-
      所有胜路都至少出现两次 B/S 边界位移、两次 box_to_sticky 事件 occurrence、
      两次 sticky_merge 事件 occurrence，并至少出现一次刚体移动与一次 sticky_to_box。
    evidence:
      - >-
        anchor_boundary_shift:box_sticky min2：found_bypass_below_count=false，
        status=complete，explored_states=38624。
      - >-
        box_to_sticky min2：found_bypass_below_count=false，status=complete，
        explored_states=38940。
      - >-
        sticky_merge min2：found_bypass_below_count=false，status=complete，
        explored_states=39395。
      - >-
        move_sticky_rigid min1：found_bypass_below_count=false，status=complete，
        explored_states=38262。
      - >-
        sticky_to_box min1：found_bypass_below_count=false，status=complete，
        explored_states=38942。
      - >-
        fixed-anchor individual probes 另行确认 movable_box_sticky_shift、
        material_normalization、box_to_sticky、sticky_merge、sticky_rigid_move 均为
        found_bypass=false、status=complete、explored_states=38262。
    scope: all_winning_paths_event_pattern_and_occurrence_level

  - claim: >-
      胜路不能在累计两次 B/S 位移之前拉箱、移动黏块刚体或触发 sticky_to_box。
    evidence:
      - >-
        pull_object:crate before B/S count 2：found_violation_win=false，
        status=complete，explored_states=38624。
      - >-
        move_sticky_rigid before B/S count 2：found_violation_win=false，
        status=complete，explored_states=38931。
      - >-
        sticky_to_box before B/S count 2：found_violation_win=false，
        status=complete，explored_states=38931。
    scope: >-
      这是 winning-path phase gate，不是 reachable-exposure gate；早拉箱实际上可达，
      但含该早期动作的路径不能获胜。

  - claim: >-
      P/L 在完整可达空间中固定，且所有胜路都实际消费 pull 语义。
    evidence:
      - >-
        fixed-anchor reachable scan 为 status=complete、reachable_states=38262、
        legal_transitions=75120，anchor_boundary_shift:push_pull forbidden hits=none。
      - >-
        fixed_push_pull_effect 的模式为 pull_object；其 winning-path bypass probe 为
        found_bypass=false、status=complete、explored_states=38298。
      - >-
        combined fixed-anchor probe 同为 found_bypass=false、status=complete、
        explored_states=38298。
    scope: fixed_anchor_reachability_and_pull_event_necessity

  - claim: >-
      packet 指定的 12 步半绑定假方案到达一个具体、不可挽回的无胜状态。
    evidence:
      - >-
        trace 逐步确认 prefix 全部合法：第一次 B/S 左移后，上箱被拉到 [2,5]，
        下箱被拉到终点列上方，最终 reached layout 与 facts packet 一致。
