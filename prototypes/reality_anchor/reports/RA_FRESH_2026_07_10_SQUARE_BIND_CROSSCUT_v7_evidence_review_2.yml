unsupported_or_overclaimed:
  - claim: >-
      “完整 2x2 本身是所有胜路必经的形状状态，且正是这两枚初始已解箱与竖黏条
      共同形成该 2x2”目前没有 all-solution 必要性证据。
    reason: >-
      五个 count probes 只对 event pattern 的 occurrence 计数；例如
      box_to_sticky min2 证明至少两次匹配事件，并不证明每次均为 :n2、同一对箱参与，
      或四个格在同一时刻组成指定 2x2。三个 phase probes 只排除胜路在第二次 B/S
      位移前发生指定早期事件，也不等价于“所有胜路必经完整方形”。layout snapshots
      与 goal coverage 只覆盖返回的 canonical trace；layout analysis 明示没有
      instance-level object participation。complete graph 的 one winning state 也只约束
      终止状态，不能单独证明所有到达它的路径共享该中间形状。
    verdict_effect: core_blocker

  - claim: >-
      具体假方案对玩家是否可信、是否产生所述洞见，以及 10 次 walk 是否不主导节奏。
    reason: >-
      完整无胜后继图证明该具体状态不能恢复，但不能证明玩家会自然选择该分支、会把
      失败归因于“保留独立性”，或会从中读出“先全绑再解码”。这些属于 puzzle critic
      的玩家侧判断；工具证据也不能证明难度至少 4、审美至少 4 或 why_not_execution。
    verdict_effect: none

  - claim: >-
      固定 P/L 是相对于其它规则配置不可替代的唯一因果来源。
    reason: >-
      现有证据证明 P/L 不移动且所有胜路含 pull_object；没有移除、移动或改写 P/L
      的 counterfactual。结合 packet 已确认的运行时规则，足以支持“固定 pull 世界被
      实际消费”，但不能外推为更强的反事实唯一性。
    verdict_effect: caveat

evidence_limits:
  - >-
    所有 complete/no-bypass 数值均已回查原始 allowed evidence source，未发现 facts
    packet 与报告之间的数值或 status 不一致。
  - >-
    event pattern、带 n 的 event instance、对象参与和 per-object necessity 必须分开；
    本审查不把 pattern occurrence 自动解释成指定对象或指定 2x2 状态。
  - >-
    三个 event-before-count 报告是 winning violation probes；它们不能用来声称早期
    crate pull、sticky movement 或 sticky_to_box 在可达图中不存在。
  - >-
    fixed-anchor forbidden scan 才是完整 reachable exposure 证据；它只对
    anchor_boundary_shift:push_pull 给出 complete/none。
  - >-
    packet 将 dual_anchor 声明为 exposure sequence 的最后阶段，因此没有 later stage
    可排除；fixed-anchor all-solution probes 支持两类锚点效应都被胜路消费。本审查不从
    该阶段标签推导难度、品质或玩家知识掌握。
  - >-
    graph complete、winning_states=1、SCC/commitment 数量、forced prefix 与 scripted
    handoff 都不是谜题质量或唯一输入序列的结论。

scc_graph_interpretation:
  - graph_fact: >-
      主图 status=complete，reachable_states=38262，legal_transitions=75120，
      winning_states=1；SCC/agency 报告 branching_win_dag、forced viable prefix 1/5
      与 returned-solution scripted handoffs 2/4。
    neutral_meaning: >-
      在给定预算内可达状态图已完成，终止化后只有一个获胜状态；压缩图中存在分支、
      汇合与若干固定承诺。它不证明唯一输入序列、洞见强度、审美或难度。
    player_facing_interpretation: null
    verdict_effect: none

  - graph_fact: >-
      指定 12 步 false-near-win 前缀的 suffix graph 为 complete，states=37712，
      transitions=73990，wins=0。
    neutral_meaning: >-
      从该精确 reached state 出发，完整枚举中没有获胜后继。
    player_facing_interpretation: >-
      玩家若按该具体顺序先分配两箱，会到达局部看似接近完成、但无法挽回的状态。
    verdict_effect: merit

questions_for_designer:
  - >-
    请补一个以“从未进入指定完整 2x2 形状/角色状态”为规避条件的 complete
    all-solution probe，并明确状态谓词；若 found_bypass=false，才可保留“完整 2x2
    必需”的中心主张。
  - >-
    如果不补形状级 probe，请把中心 claim 降为“返回的 canonical 最短解使用完整
    2x2；所有胜路只已证明满足所列事件次数与阶段门”，不要继续声称形状或两枚箱的
    all-solution/per-object necessity。
