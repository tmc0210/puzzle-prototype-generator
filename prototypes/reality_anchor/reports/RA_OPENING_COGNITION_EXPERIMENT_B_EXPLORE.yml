experiment_condition: B_bounded_opening_exploration
artifact_status: temporary_process_calibration_not_official_review
candidate_version: RA_FRESH_2026_07_11_SPLIT_KEY_REBIND_LATCH_v17
player_context:
  campaign_position: late_game
  prior_knowledge: "玩家已熟悉本原型全部机制。"
  title_withheld: true
known_rules:
  - "方向输入移动玩家；物体受阻时整步失败。"
  - "P/L 是不可旋转的二格锚点：P 侧提供推边界，L 侧提供拉边界；锚点可整体平移。"
  - "B/S 是不可旋转的二格锚点：跨 B 侧会把黏格变成独立箱，跨 S 侧会把箱变成黏格；锚点可整体平移。"
  - "四邻接黏格自动合并，连通黏块作为刚体移动。"
  - "箱、黏格和锚点格可以覆盖目标；玩家不能覆盖目标。全部目标被对象覆盖后获胜。"
legend:
  "#": wall
  ".": floor
  G: goal
  "@": player
  C: crate
  "*": crate_on_goal
  M: sticky_cell
  P/L: push_pull_anchor
  B/S: box_sticky_anchor
initial_layout: |-
  ##########
  ##PL..GG.#
  ###.#....#
  ##MMM.####
  #.@M...###
  #...S..M##
  ###GBC*C##
  ###.GGG###
  ###GG#####
  ##########
exploration_tool:
  purpose: "模拟玩家开局试探；只输出逐步可见棋盘和 moved/blocked，不输出内部事件或解法。"
  command: "npx tsx prototypes/reality_anchor/reports/opening_explore_layout.ts prototypes/reality_anchor/reports/RA_FRESH_2026_07_11_SPLIT_KEY_REBIND_LATCH_v17.txt <inputs>"
  allowed_inputs: [up, down, left, right]
  total_input_budget_across_all_runs: 8
  reset_budget: 2
  usage_rule: >-
    每次命令从初始局面开始，等价于 reset。可以分最多三次调用，但所有命令的 input 数总和不得超过8；
    必须在结果中逐字列出全部调用，不能运行 solver、trace_layout、搜索脚本或读取其它报告。
procedure:
  - "在运行工具前先写下 initial hypothesis。"
  - "选择你认为自然或有信息价值的动作，不随机穷举。"
  - "探索结束后比较认知变化；目标不是通关。"
required_output:
  condition:
  before_exploration:
    observed_macro_goal:
    observed_primary_contradiction:
    predicted_first_strategy:
    interpretation_of_lower_structure:
  tool_calls: []
  after_exploration:
    observed_changes:
    revised_macro_goal:
    revised_primary_contradiction:
    newly_discovered_property:
    current_solution_idea:
    still_unexplained_or_overbuilt_structure:
    execution_or_search_burden:
    insight_vs_obvious_execution_risk:
    confidence:
