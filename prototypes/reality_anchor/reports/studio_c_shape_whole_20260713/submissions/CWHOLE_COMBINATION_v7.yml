designer_claim:
  player_experience_core: 玩家只移动一次竖直 P/L，把 C 上方的操作位纳入 push 侧；紧接着横移一步到同一局部，从该操作面连续推动完整 C 覆盖竖向错位目标。
  player_action: down 移动 P/L，right 进入完整 C 上方，down、down 推动同一完整 C。
  visible_payoff: P/L 一次下移立即建立相邻的 push 操作面；随后两次 C 整体下移持续消费这个边界状态并在第二次位移时胜利。
  why_this_level_exists: 把非核心的可移动 P/L 边界与完整 C 的刚体位移形成最短直接组合，删除 v6 可整段截去的第一次锚点转运。
  work_identity_conditions:
    - 唯一一次 P/L 位移后只隔一步就推动 C，不存在可截去的同类锚点前缀。
    - P/L 的最终位置持续决定后续两次 C 下推的 force mode。
    - C 始终是七格完整刚体，并由错位目标消费其上臂、竖脊与下臂。

packaging_account:
  opening: 玩家贴在竖直 P/L 上方，完整 C 紧邻边界下方，三目标继续向下展开；开局关系集中在同一窄局部。
  preparation: 向下推动 P/L 一格，直接把后续 C 操作位放入 push 侧。
  reveal_or_use: 向右一步切入 C 上方，连续两次下推完整 C。
  ending: 第二次下推立即覆盖全部目标。
  every_major_element_role:
    - 可移动 P/L 建立并持续维持后段所需的 push 操作面。
    - B/S 固定完整 C 的黏块身份，并与 P/L 并排显示两种边界。
    - 紧凑竖井限制 C 保持纵向行程。
    - 三目标消费完整 C 的三段轮廓。
  known_perceptible_defects:
    - 开局只有一次可行的锚点承诺，整体仍偏强制；价值依赖玩家把这次位移读成随后的操作面设置，而非独立锚点题。

slot_account:
  concrete_delta_from_baseline: 新增可移动 P/L 边界状态，玩家先建立操作制度，再使用预制完整 C；baseline 不需要该机制。
  application_added_authorship: not_applicable
  combination_supporting_mechanism: 可移动 P/L 边界。
  combination_not_base_rule_or_prerequisite: 完整 C 的黏块刚体移动在无 P/L 的全推世界即可成立；P/L 是另一个已知机制。
  combination_consumption_relation: 一格 P/L 位移把紧邻的 C 上方操作格纳入 push 区，随后的两次 C 下推连续消费该状态；预对齐版本从四手降为三手。
  challenge_ceiling_dimension: not_applicable
  non_equivalence_to_other_submissions:
    - 不构造 C，也不把 P/L 当作凹口载荷；组合产物是持续生效的施力边界位置。

