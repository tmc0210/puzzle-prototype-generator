designer_claim:
  player_experience_core: 玩家开局处于完整七格 C 的凹口内，C 的上下长臂与左侧墙共同形成围栏；玩家必须从内侧推动整块，直到长臂整体让出出口，再从外侧换轴推动同一完整形状完成四个稀疏目标。
  player_action: 从凹口内向右推动完整 C 两次，向左退出凹口并沿外侧绕到上操作面，再向下推动完整 C 一次。
  visible_payoff: 第一次整体位移后玩家仍被两条长臂夹住；第二次位移后凹口开口终于与上通道连通，玩家从形状内部走到外部；最后一次换轴位移同时覆盖四个稀疏目标并胜利。
  why_this_level_exists: 在不构造形状、不引入 P/L 或载荷的低风险 baseline 中，让完整 C 的整体轮廓直接改变玩家可通行空间，而不是把预制形状搬到同形目标模板。
  work_identity_conditions:
    - 开局即提供完整七格 C，三次对象移动均保持同一刚体。
    - 玩家初始位于凹口内；上下臂的长度决定整体右移一格后仍无法脱困、两格后才出现出口。
    - 玩家必须经历内侧施力、从凹口退出、外侧换轴施力三个可见阶段。
    - 终局只使用四个稀疏目标，不预先画出完整 C 轮廓。

packaging_account:
  opening: 紧凑墙体把玩家封在完整 C 的凹口内；唯一首要关系是从内侧推动竖脊，观察大形状何时释放自己。
  preparation: 连续两次向右推动同一完整 C；一次位移后出口仍被墙与长臂共同封住。
  reveal_or_use: 第二次位移后玩家从凹口左侧退出，沿上通道来到形状外侧上操作面。
  ending: 从外侧向下推动完整 C 一格，四个分散目标同时被上臂、竖脊与下臂覆盖并立即胜利。
  every_major_element_role:
    - 完整 C 的上下臂既是开局围栏，也是终局目标承担者。
    - 右侧竖脊提供凹口内施力面，并承担终局中部目标。
    - 左侧墙簇与 C 的开口共同形成可由整体位移解除的围栏。
    - 上通道只承担脱困后的操作面切换。
    - 四个目标稀疏消费上臂左端、竖脊及下臂两处，不描绘同形模板。
  known_perceptible_defects:
    - 前两次对象位移是同方向强制推动；其可见责任是逐格释放大 C 围栏，而不是让玩家在开局作路线选择。
    - 脱困后有五步纯走位用于从凹口内侧切换到上方外侧；紧凑墙体已将其压到同一形状周长上的最短换面路线。

