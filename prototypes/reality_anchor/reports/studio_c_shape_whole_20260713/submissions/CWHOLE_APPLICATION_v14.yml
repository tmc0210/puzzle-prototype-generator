designer_claim:
  player_experience_core: 玩家面对只有左竖脊与下臂的五格黏块骨架，在 box 侧自行选择顺序，把相邻两只箱分别向下送入 sticky 侧，逐格补成三格上臂；完整七格 C 出现后，再从左侧把它整体推入稀疏目标。
  player_action: 任选一只箱先向下插入，换到另一列插入第二只箱；沿已清空的箱列回到 C 左侧，再向右整体推动两次。
  visible_payoff: 第一次插入只延长上臂或产生待接孤块，第二次插入才把七格连成完整 C；随后两次刚体位移把新建上臂三格、左竖脊与下臂端点一起送上目标。
  why_this_level_exists: 相对直接提供完整 C 的 baseline，新增由玩家亲手完成两个材料转换与两次接入的显著作者责任；构造后的完整整体立即成为后半段唯一移动对象。
  work_identity_conditions:
    - 开局只有五格黏块骨架与两只普通箱，不存在完整 C。
    - 两只箱都必须越过固定 B/S 边界并进入相邻缺口，第二次接入后才首次出现七格完整 C。
    - 两只箱的插入顺序均可，由玩家选择；两种顺序都在十手内完成同一作品关系。
    - 后半段只移动合并后的七格刚体，终局上臂三目标要求两只新增单元继续共同承担责任。

packaging_account:
  opening: 两只箱并列悬在五格黏块骨架的两个上臂缺口上方；玩家可先站在任一列，B/S 清楚标出向下即进入 sticky 侧。
  preparation: 分别把两箱向下插入；每次都发生 box_to_sticky，规范顺序中两次都产生 sticky_merge。
  reveal_or_use: 第二次插入后完整七格 C 清楚出现；被清空的箱列同时形成返回左侧的短通道。
  ending: 玩家从左侧连续两次整体右推新构成的 C；第二次推动同时覆盖上臂三格、竖脊与下臂端点并胜利。
  every_major_element_role:
    - 两只箱分别补出上臂中格与右端格；删任一只都无法满足上臂三目标。
    - 固定 B/S 让箱只有进入下方时转黏并参与合并。
    - 五格骨架提供左竖脊与下臂，使两次插入累积为完整 C 而非独立箱题。
    - 箱列上方短通道允许玩家选择构造顺序，并在构造后回到左侧操作面。
    - 六个稀疏目标消费完整上臂、竖脊与下臂两端，不画出完整同形模板。
  known_perceptible_defects:
    - 两个构造动作都是向下插入相邻列，操作手势相似；差异来自插入顺序选择、第一次后的中间形态及第二次才完成整体。
    - 完成 C 后有四步走位回到左侧，再进行两次整体推动；这些格同时是构造列清空后形成的交接通道。

slot_account:
  concrete_delta_from_baseline: baseline 开局直接给出完整 C 并用它释放凹口；本关开局没有完整 C，玩家必须将两只普通箱逐一转黏接入，才获得可整体移动的七格形状。
  application_added_authorship: 玩家选择两只箱的插入顺序，并亲自完成两次跨边界材料转换与两阶段接入；预构造版从十手降为六手。
  combination_supporting_mechanism: not_applicable
  combination_not_base_rule_or_prerequisite: not_applicable
  combination_consumption_relation: not_applicable
  challenge_ceiling_dimension: not_applicable
  non_equivalence_to_other_submissions:
    - 唯一槽位职责是逐格建成完整 C；不移动 P/L，也不把 C 用作锚点载体。

