designer_claim:
  player_experience_core: 玩家直接操作预制的完整七格 C 形：先把它横向整体滑过墙柱，再换到上操作面，把同一完整轮廓向下压入七格 C 形目标模板。
  player_action: 向右整体推动两次，绕到上方，再向下整体推动一次。
  visible_payoff: 前两次位移让完整 C 的上下臂一起越过中央墙柱；换轴后整块一次落入与自身同形的完整目标轮廓并立即胜利。
  why_this_level_exists: 在不构造形状、不引入 P/L 或载荷的前提下，让完整 C 形的整体外轮廓直接承担清障半径、换操作面与终局对形责任，作为比两手 witness 更完整的 baseline。
  work_identity_conditions:
    - 开局即提供完整七格 C 形，且三次对象位移均保持同一刚体。
    - 玩家必须先让上下臂共同越过墙柱所在横截面，才有空间从上方进行纵向推动。
    - 终局七个目标与完整 C 轮廓一一对应，不是只消费前沿竖条。

packaging_account:
  opening: 完整 C 形、中央墙柱与右下方同形目标模板同时可见；玩家从凹口左侧直接获得第一操作面。
  preparation: 完整 C 横向右移两格，使上臂和下臂共同清出换轴空间。
  reveal_or_use: 玩家上绕两步切换到 C 的上操作面，向下推动整块。
  ending: 第三次刚体位移让七格 C 与七个目标完全重合并立即胜利。
  every_major_element_role:
    - B/S 只确立黏块刚体语义，不引入额外主动机制。
    - 中央墙柱给完整轮廓的横向净空以可见约束，并阻止只右移一格后立刻完成同一换轴动作。
    - 七个目标完整消费上臂、竖脊与下臂。
  known_perceptible_defects:
    - 最短解仍以两次同方向整体右推开头；它们的职责是让完整轮廓越过墙柱并取得换轴净空，而不是两个不同谜题判断。
    - 删除墙柱不会降低最短成本；墙柱的可证职责是改变一格横移后的换轴合法性与开局解族，而非增加最短步数。

