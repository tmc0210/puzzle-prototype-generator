designer_claim:
  player_experience_core: 玩家先把竖直 P/L 连续下移两格，使 C 上方的唯一操作格在两次下推期间属于 push 区，再把完整 C 推入错位目标竖井。
  player_action: down、down 移动 P/L，right 进入 C 上方，down、down 推动完整 C。
  visible_payoff: P/L 的新边界位置只隔一步就被同一局部的两次 C 位移连续消费；右上大空房已收紧为一格可逆观察叶。
  why_this_level_exists: 把非核心的可移动 P/L 状态与完整 C 的两格刚体行程直接组合，而不是先开门再退休。
  work_identity_conditions:
    - 两次边界移动完成后只隔一步即进入 C 的整体位移。
    - P/L 最终位置持续决定两次 C 下推的 force mode，不在核心开始前退休。
    - C 始终是七格完整刚体，并由三处错位目标消费。

packaging_account:
  opening: 玩家位于竖直 P/L 上方，右侧只保留一格可逆观察叶；C 竖井及错位目标在其下方集中可见。
  preparation: 连续两次下推 P/L，把 push 边界移动到 C 两格行程所需高度。
  reveal_or_use: 向右一步进入 C 顶部，连续两次下推完整 C。
  ending: 第二次下推立即覆盖三目标。
  every_major_element_role:
    - P/L 的两格位移决定玩家在两次 C 推动时的 force mode。
    - 起点右侧单格提供可逆观察；墙化它会把 initial SCC 从 2 缩为 1。
    - 紧凑竖井侧墙限制 C 保持纵向行程，并删除 v5 误导性的上部空房承诺。
    - 三目标消费上臂、竖脊与下臂。
  known_perceptible_defects:
    - 两次 P/L 下移是同方向重复输入；其价值依赖玩家读出边界的新位置会被随后的两次 C 推动持续使用。

slot_account:
  concrete_delta_from_baseline: 新增可移动 P/L 边界状态，且它直接决定 baseline 式 C 推动的 force mode。
  application_added_authorship: not_applicable
  combination_supporting_mechanism: 可移动 P/L 边界。
  combination_not_base_rule_or_prerequisite: baseline 在无 P/L 的全推世界直接使用完整 C；理解 C 的几何整体性不要求 P/L。
  combination_consumption_relation: 两格 P/L 位移把后续操作位纳入 push 区；C 随后的两次下推连续消费这一边界状态。预对齐版从 5 手降为 3 手。
  challenge_ceiling_dimension: not_applicable
  non_equivalence_to_other_submissions:
    - 不构造 C，也不把 P/L 当作凹口载荷；支持机制的产物是 force-mode 边界位置。

