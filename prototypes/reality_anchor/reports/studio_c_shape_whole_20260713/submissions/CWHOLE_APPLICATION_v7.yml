designer_claim:
  player_experience_core: 玩家先把箱推过 B/S 边界，补成完整七格 C，再换到凹口侧把新形成的整体推入七格 C 目标模板。
  player_action: 首步向下插入连接箱并触发 sticky merge，三步取得凹口侧操作位，随后连续两次整体右推。
  visible_payoff: 两条分离部件在第一手可见地合成 C；末两手保持该轮廓并精确覆盖完整 C 模板。
  why_this_level_exists: 相对 baseline，把“完整 C 已经存在”改成由玩家亲自构造核心对象并立即使用。
  work_identity_conditions:
    - 连接箱加入后形成七格、单连通、开口向右的 C。
    - 构造结果没有退休，紧接着承担两次刚体位移与七格模板覆盖。
    - 同对象数非 C 形不能完成相同模板。

packaging_account:
  opening: 玩家被置于连接箱正上方；下方可见缺一桥格的两部分和右侧完整 C 目标模板。
  preparation: 向下推箱跨入 sticky 侧，触发 box_to_sticky 与 sticky_merge。
  reveal_or_use: left、left、down 进入新 C 的左侧，right、right 推动完整刚体。
  ending: 第二次右推精确覆盖七格模板并立即胜利。
  every_major_element_role:
    - B/S 决定连接箱由 box 变 sticky。
    - 顶部单格开局口保证构造动作先发生，避免先拆动两部分。
    - 左侧通道只承担取得横推操作面。
    - 七个目标画出并消费完整 C 终局轮廓。
  known_perceptible_defects:
    - 首次构造动作被开局口强制，发现责任主要落在读出合并结果而非选择第一手。

slot_account:
  concrete_delta_from_baseline: baseline 直接给出完整 C；本关要求玩家先制造连接格、合并出 C，再以另一方向使用它。
  application_added_authorship: 玩家对核心对象本身的存在负责，而不只是为预制 C 做一格对齐。
  combination_supporting_mechanism: not_applicable
  combination_not_base_rule_or_prerequisite: not_applicable
  combination_consumption_relation: not_applicable
  challenge_ceiling_dimension: not_applicable
  non_equivalence_to_other_submissions:
    - 相对 baseline 新增核心对象构造。
    - 相对 combination 不移动 P/L，也不以边界状态改变 C 的操作合法性。
    - 相对 challenge 不运输载荷，也不撤销并恢复 C 的完成状态。

