designer_claim:
  player_experience_core: 玩家先把低一行的完整 C 形上推到三目标的正确高度，再绕入凹口，复用 baseline 的双臂先覆盖、脊后覆盖关系。
  player_action: 先整体上推建立终局对齐，绕过结构进入凹口，再整体右推两格。
  visible_payoff: 上推后 C 形与错位三目标对齐；最后两次右移依次兑现双臂与脊。
  why_this_level_exists: 把 baseline 直接提供的高度与凹口站位改为玩家必须亲自建立的条件。
  work_identity_conditions:
    - 同一完整 C 形承担开局上移与终局右移。
    - 上下侧墙阻止从外缘替代凹口完成右推。
    - 预先对齐后退化为两次 right 的 baseline 关系。

packaging_account:
  opening: C 形位于目标模板下一行，右下行程墙阻止直接横推，玩家位于下臂下方。
  preparation: 玩家先上推整块，再沿左侧通路进入凹口。
  reveal_or_use: 进入凹口后两次右推完成错位三目标覆盖。
  ending: 第二次右推后立即胜利。
  every_major_element_role:
    - 右下墙阻止未对齐时直接横推。
    - 上下左墙阻止对齐后从外臂横推，固定凹口操作责任。
    - 左侧通路承担移动大结构后重新进入凹口的必要路线。
  known_perceptible_defects:
