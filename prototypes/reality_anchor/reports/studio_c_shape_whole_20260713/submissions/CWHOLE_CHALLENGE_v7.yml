designer_claim:
  player_experience_core: 完整八格 C 初始已覆盖自己的三处形状目标；玩家必须撤销该完成状态，用左脊把竖直 P/L 载荷在凹口中送到远端双目标，再切到 pull 行把完整 C 拉回原位。
  player_action: right、right 以完整 C 推送凹口载荷，up 切换操作行，left、left 拉回 C 而把载荷留在远端。
  visible_payoff: C 的两臂约束载荷停留在凹口，左脊推动载荷；返回时 C 恢复三处形状目标，P/L 独立留在双目标上。
  why_this_level_exists: 探索完整 C 作为凹口运输工具的上限，并制造“先拆掉已完成 C，再恢复它”的反直觉阶段关系。
  work_identity_conditions:
    - 运输和返回的四次对象动作中 C 始终保持同一八格连通轮廓。
    - 首两次右推同时移动 C 与 P/L，末两次左拉只移动 C。
    - 去任一臂或改成同对象数非 C 形均不能完成。

packaging_account:
  opening: C 已压在三处目标上，P/L 竖直放在凹口靠左位置，远端有两个目标。
  preparation: 无独立前题；第一手即撤销 C 的完成并开始运输。
  reveal_or_use: 两次右推完成载荷运输，上移一格后两次左拉恢复 C。
  ending: 第二次左拉同时恢复 C 的三处目标，P/L 保留远端双目标，立即胜利。
  every_major_element_role:
    - C 的左脊是载荷 driver，上下臂定义凹口并承担形状目标。
    - 竖直 P/L 同时是两格载荷，并提供下行 push、上行 pull 的行差。
    - 导轨墙限制 C 只有三种水平位置，去掉开放房间旁路。
    - 五个目标分别表达 C 的恢复与载荷的留置。
    - v5 的右上 degree-1 空地已在 v6 墙化；v6 最右整列外框余量又经预提交反事实判定无责任，v7 已裁去；左下观察叶仍保留开局 SCC 责任。
  known_perceptible_defects:
    - P/L 是高 affordance 支持对象，独立 reviewer 可能把本关读成复杂 combination 而非保持作品身份的 challenge；若发生则不以解释覆盖否决。

slot_account:
  concrete_delta_from_baseline: 从直接把 C 推到目标，提升为先撤销 C 的已完成状态、用凹口运输载荷、再以相反 force mode 恢复 C。
  application_added_authorship: not_applicable
  combination_supporting_mechanism: not_applicable_for_declared_slot
  combination_not_base_rule_or_prerequisite: not_applicable_for_declared_slot
  combination_consumption_relation: not_applicable_for_declared_slot
  challenge_ceiling_dimension: 反直觉目标撤销、凹口载荷运输、同一完整 C 的 push/pull 往返复用。
  non_equivalence_to_other_submissions:
    - 相对 combination，P/L 不是先制造 C 行程合法性的边界前置；它被 C 作为载荷运输，并在 C 返回时留置。
    - 相对 application，C 开局已经完整，玩家不构造它。

