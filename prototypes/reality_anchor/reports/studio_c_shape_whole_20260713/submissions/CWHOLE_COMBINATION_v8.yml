slot: combination

designer_claim:
  player_experience_core: 完整七格 C 既包住凹口内玩家，又用闭口前沿顶住竖直 P/L；玩家从内侧推动整块两次时，C 与 P/L 每次同步右移。锚点停上远端双目标后，玩家退出凹口并把 C 单独向下落位，形成共同运输后的正交分流终局。
  player_action: 从凹口内向右推动完整 C 两次，并通过 force chain 同步推动 P/L；向左退出、绕到上方，再向下推动 C 一次。
  visible_payoff: 前两步每次都同时移动七格 C 与两格 P/L，第二步让 P/L 覆盖远端双目标；最后 C 向下离开锚点前沿，覆盖自己的四个稀疏目标，两个对象在同一终局中分别驻留。
  why_this_level_exists: 将非先修的可移动 P/L 作为完整 C 闭口前沿的可见受力对象与终局对象；它不再是核心前的门闩，而在主要位移和结算中持续被消费。
  work_identity_conditions:
    - 前两次 C 位移都必须同时出现 sticky rigid move、force chain 与 P/L boundary shift。
    - P/L 的两格最终位置覆盖远端双目标，不能在核心开始前退休。
    - 完整 C 先作为玩家围栏与双格推板，随后从锚点旁正交分流并覆盖自身目标。
    - C 与 P/L 的最终驻留位置不同，但同一步终局同时要求两者的覆盖结果。

packaging_account:
  opening: 玩家位于完整 C 凹口内；闭口右侧紧贴竖直 P/L，P/L 右方双目标与 C 下方目标同时可见。
  preparation: 无独立前置；第一手核心动作已经让 C 与 P/L 共同移动。
  reveal_or_use: 两次向右推动把 P/L 顶到远端目标，同时让 C 围栏释放玩家；玩家沿刚打开的凹口退出并换到上操作面。
  ending: 最后向下推动只移动完整 C，P/L 留在右侧双目标；C 覆盖四个自身目标时立即胜利。
  every_major_element_role:
    - 完整 C 的右竖脊与下臂前端同时接触 P/L 两格，使整个锚点作为单体被力链推动。
    - P/L 在共同运输中移动边界，并在终局覆盖双目标。
    - 左侧墙簇与完整 C 形成两格释放行程，确保共同运输不是一手点缀。
    - 上通道承担 C 与 P/L 分流后的操作面切换。
    - 四个 C 目标与两个锚点目标共同构成双对象终局。
  known_perceptible_defects:
    - 规范输入序列与 baseline v6 相同；玩家体验差异完全来自前两步同步推动 P/L、边界随动和双对象终局，而不是额外输入。
    - P/L 在最后一次 C 下移时保持静止；其持续责任由远端双目标而非继续施力体现。

slot_account:
  concrete_delta_from_baseline: baseline 的 C 只释放玩家并自行落位；本关同一围栏动作还必须同步运输可移动 P/L，并在终局把 C 与锚点分流到两组目标。
  application_added_authorship: not_applicable
  combination_supporting_mechanism: 可移动 P/L 及其双格刚体、边界随动与目标覆盖。
  combination_not_base_rule_or_prerequisite: 完整 C 的黏块刚体与围栏用法在 baseline 无 P/L 时已经完整成立；P/L 是另一项已知机制。
  combination_consumption_relation: C 的前两次整体位移直接 force-chain 推动 P/L，P/L 的结果位置覆盖双目标；最后 C 正交离开，形成玩家可见的共同运输与分流结算。
  challenge_ceiling_dimension: not_applicable
  non_equivalence_to_other_submissions:
    - P/L 位于 C 的闭口前沿并与 C 同向共同运输后正交分流；challenge 的 P/L 位于凹口内部，C 随后反向拉回自身并把锚点留泊。

