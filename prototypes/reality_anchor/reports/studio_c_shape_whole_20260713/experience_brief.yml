portfolio_id: RA_STUDIO_2026_07_13_C_SHAPE_WHOLE

prototype_context:
  confirmed_rules:
    - 玩家每次输入一个正交方向，空格可行走。
    - P/L 锚点按输入时玩家所在侧选择 push 或 pull；锚点本身是可移动的两格对象。
    - B/S 锚点在每个合法动作后全局归一化箱与黏块；正交相邻黏格合并为同一刚体。
    - 黏块连通分量作为完整刚体移动，任一目标格受阻都会阻止整体移动。
    - 推力或拉力可沿移动方向传播到其它可动物体。
  win_condition: 所有目标格在 settle 后被箱、黏块格或锚点格覆盖；玩家不计入覆盖。
  object_and_event_semantics:
    - C 是可推拉普通箱，M 是按当前连通形状整体移动的黏块。
    - P/L 与 B/S 都是可移动、可覆盖目标的两格锚点。
    - 关键可见事实以逐步棋盘变化为准；事件标签只作硬事实索引，不证明体验价值。
  tool_boundary:
    - solver、完整图、replay、bypass 与 counterfactual 只验证机械事实。
    - 原型 raw miner 与历史 runs 不作为设计来源；本轮不读取 mechanism_lab/runs。
    - 独立 reviewer 决定玩家侧 survive，独立 evidence reviewer 决定 queue admission。

curriculum_context:
  player_prior:
    - 已知普通推箱、目标覆盖、固定与可移动 P/L。
    - 已知 B/S 归一化、黏块拼接/切割和黏块刚体移动。
    - 已知锚点本身可以被推拉。
  intended_game_position: 黏块刚体与形状应用已建立后的中后期作品集
  duplicate_boundary:
    - 不复用归档关卡题面、canonical trace 或局部布局。
    - 不把 RA_CAND_0020 的 C 形切割三输出当作素材；本轮要求 C 形在关键阶段保持完整并以整体形状工作。
    - 不把 L 形活塞、纯锚点腾挪或黏块形状的被动动画改名为本核心。

