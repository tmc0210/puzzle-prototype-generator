experience_core:
  experience_statement: 玩家先读出一块完整、连通且缺口清楚的 C 形大黏块；在关键阶段亲自移动它，并发现只有保留完整 C 形时，其脊、上下臂与凹口才能在同一整体动作中共同解决局面。
  visible_setup: 开局或短准备后，C 形轮廓、凹口和将被它同时影响的局部结构都能直接从棋盘读出。
  player_action: 玩家选择并建立 C 形的正确整体运动方向或操作面，再亲手推动或拉动整块；分支可以增加建立入口、制造材料或多阶段复用的责任。
  visible_payoff: 一次关键刚体位移中，C 形至少两个彼此分离的部位和/或凹口同时产生可见作用，随后迅速收束。
  why_level_exists: 让玩家把黏块从“多个粘住的格子”重新理解为具有凹口、双臂和整体前沿的几何工具。
  core_boundary:
    central_objects:
      - 完整连通 C 形黏块及其凹口、脊和上下臂
      - 让 C 形整体位移并同时消费多个部位的关键关系
    supporting_objects:
      - 用于保持 sticky 语义的 B/S 锚点
      - 用于承接整体作用的目标、普通箱、墙口或非核心锚点

work_identity:
  conditions:
    - 关键动作前 C 形保持单一连通刚体，轮廓可辨，不能先被切成独立材料。
    - 关键动作中脊、上下臂、凹口至少有两个空间上分离的部分共同承担责任。
    - 玩家必须主动使完整 C 形发生决定性整体位移，而非只观看归一化动画。
    - 关键回报集中发生，高潮后不追加独立子题或长清理。
  counterfactuals:
    - 若删除任一臂或把 C 形换成条形，至少一个关键承接关系应失败或作品主要体验改变。
    - 若把凹口填满为实心矩形，玩家操作位、容纳关系或关键运动应失败或失去同一意义。
    - 若预先切开 C 形，局面即使仍可通关也不再是本作品身份。

baseline_brief:
  packaging_intent: direct_complete_realization
  expected_scale: 一眼可读的紧凑房间；短准备、一次集中整体作用、立即收束
  expected_player_load: 只要求识别 C 形完整刚体、凹口操作位与同时作用，不叠加独立前置谜题
  non_goals:
    - 不追求事件覆盖或对象数量
    - 不把切割 C 形作为高潮
    - 不用多目标重复处理填充流程

