independent_readings:
  - candidate_id: CWHOLE_BASELINE
    exact_version: CWHOLE_BASELINE_v4_sha256_88d1cadbb11b6205ca35953d194aea29b0da2c5e7de8749e911e9513478d3422
    design_role: baseline
    opening_read: >-
      开局最先读到的是一个已经完整连通的七格 C 形黏块、右下方与它完全同形的七目标轮廓，以及紧贴上臂左侧的玩家。中间单墙使目标轮廓与原形状错开，但题面仍直接把“把现成 C 形搬到同形槽里”摆在玩家面前。
    player_actually_does: >-
      玩家连续向右推动同一完整黏块两格，沿上方通道走两步换到上臂操作面，再向下推动一次。玩家没有建立、选择或重新解释 C 形，只沿目标轮廓给出的折线路径搬运预制刚体。
    visible_payoff: >-
      三次对象移动都让上下臂和右侧竖边同步位移；最后一次下推使七格 C 形与七个目标一次性完全重合，回报集中且清楚。
    ending_read: >-
      最后一次下推立即胜利，没有高潮后的清理劳动；但结束也进一步确认整关只兑现了现成形状到同形目标的直白演示。
    exact_basis:
      - "CWHOLE_BASELINE_v4.txt：初始七格黏块为上三格、右侧中一格、下三格的完整 C 形；七个目标在右下形成同形轮廓。"
      - "input_replay_CWHOLE_BASELINE_v4_CANONICAL.json steps 1-2：同一 sticky#1 连续整体右移，事件均只有 push_object:sticky#1 与 move_sticky_rigid。"
      - "同一 replay steps 3-4：仅有两步 walk；step 5 再整体下移并立即 isWin=true。"
    perceptible_defects:
      - defect: "baseline 仍是裸露的同形搬运 witness，而不是完整直接作品。"
        exact_basis: >-
          初始布局已经同时给出完整 C 形、同形目标轮廓和贴着唯一首要操作面的玩家；规范回放只包含右推两次、换面走两步、下推一次，除折线路径外没有新增需要玩家读出或完成的关系。
        player_effect: >-
          玩家见证了完整 C 形刚体可移动，却没有获得超出最小现象复现的谜题责任；中间单墙和一次换面不足以把演示提升为独立作品。
        same_work_improvement_direction: >-
          保留预制完整 C 形与低风险 baseline 体量，但让形状在到达终点前必须解决一个简洁、可见、属于完整形状本身的操作关系；不能只延长路线或增加走位。
        blocking: true
    cleanup_observations: []
    verdict: reject_candidate

  - candidate_id: CWHOLE_APPLICATION
    exact_version: CWHOLE_APPLICATION_v7_sha256_763a90266af2796aa8fbe4c6625fa9a463a6ecaf46c64249fde00d84a4518658
    design_role: application
    opening_read: >-
      开局可见一个缺少上臂中格的六格黏块轮廓、正悬在缺口上方的单箱、把玩家锁在单箱上方的一格入口，以及右侧完整 C 形目标轮廓。题面清楚预告先补形再整体右移，但也把补形动作直接摆成唯一出口。
    player_actually_does: >-
      玩家第一步只能向下推箱；箱进入 sticky 侧后转黏并立即与六格部件合并为七格 C 形。随后玩家走左、左、下三步到形状左侧，再连续右推两次，把完整 C 形送入同形目标。
    visible_payoff: >-
      第一步的材料转换与合并让缺口被补上，完整 C 形清楚出现；最后两次刚体右移逐步覆盖目标，第二次右推直接完成七目标覆盖。
    ending_read: >-
      最终右推立即胜利、没有收尾劳动；但主动构造只占开局一个被墙强制的输入，之后退回直线搬运同形 witness。
    exact_basis:
      - "CWHOLE_APPLICATION_v7.txt：玩家左右与上方均被墙封住，正下方是单箱；单箱正对六格黏块轮廓的唯一缺口。"
      - "input_replay_CWHOLE_APPLICATION_v7.json step 1：down 同时触发 push_object:crate#1、box_to_sticky:n1、sticky_merge:n1，并形成七格连通 C 形。"
      - "同一 replay steps 2-4 全为 walk；steps 5-6 仅将 sticky#1 连续右移两格，step 6 isWin=true。"
    perceptible_defects:
      - defect: "相对 baseline 的主动构造责任存在，但不够显著：补形是被墙和起点强制的一键动作。"
        exact_basis: >-
          玩家初始格只有向下推箱可推进流程；箱已与缺口竖直对齐，第一步即自动完成转黏、合并和完整 C 形。之后三步纯走位，最后两步重复直线推形。
        player_effect: >-
          玩家看见了构造事件，却几乎没有亲自决定如何建立核心条件；application 的作者性主要停留在按下唯一动作观看合并，无法与 baseline 拉开足够的玩家责任差异。
        same_work_improvement_direction: >-
          保留“补入缺失单元后立即把完整 C 形作为刚体消费”的同一作品关系，但让玩家对缺失单元的位置、进入 sticky 侧的时机或接入操作面承担一个简洁可读的主动选择，并让后续整形移动实际消费这项选择；不要追加无关前置小题。
        blocking: true
    cleanup_observations: []
    verdict: revise_and_rereview

  - candidate_id: CWHOLE_COMBINATION
    exact_version: CWHOLE_COMBINATION_v7_sha256_cf9f8986bf545cd70d74409a46599c4c288ba28a32cd8d67b3382227eb22c506
    design_role: combination
    opening_read: >-
      开局是狭窄竖槽里的玩家、正下方可移动竖直 P/L、左侧固定 B/S，以及紧接在 P/L 右下方的完整七格 C 形。P/L 首先像一道堵住出口的门闩，C 形下方三个分散目标则直接提示随后整体下移。
    player_actually_does: >-
      玩家先向下推动 P/L 一格以离开起始口袋，再向右走到 C 形上方，随后连续向下推动完整黏块两格覆盖三个目标。P/L 在第一步后保持原位，既不再被操作，也不与 C 形同动。
    visible_payoff: >-
      第一步只显示 P/L 下移和边界随之移动；主要回报发生在后两次 C 形整体下移，最终由 C 形的三个分散位置覆盖目标。两段回报先后发生，没有一个共同兑现时刻。
    ending_read: >-
      第二次下推 C 形即胜利，没有高潮后清理；但结束时 P/L 留在上方、已与终局目标和 C 形移动脱离，开场锚点段明显退休。
    exact_basis:
      - "input_replay_CWHOLE_COMBINATION_v7.json step 1：事件仅为 push_object:push_pull_anchor 与 anchor_boundary_shift:push_pull。"
      - "同一 replay step 2 仅为 walk；steps 3-4 事件仅为 push_object:sticky#1 与 move_sticky_rigid。"
      - "step 1 后 P/L 固定在 x=2 的 y=3..4；steps 3-4 黏块从 y=3..5 下移至 y=5..7，P/L 不再移动且不覆盖任何目标。"
    perceptible_defects:
      - defect: "另一机制只形成强制开场门闩，没有在同一体验链中被玩家可见地消费。"
        exact_basis: >-
          P/L 的唯一动作发生在 step 1；之后一格走位把流程切换为两次纯 C 形下推。机械回放没有任何一步同时移动、交接或共同结算 P/L 与 C 形，终局也不消费 P/L 的位置。
        player_effect: >-
          玩家先完成一个显然的锚点开门动作，再开始完整 C 形的直线 witness；这不是两种机制共同改变构造、操作空间、时序、状态、路线或终局去向的统一作品，而是短前缀接后题。
        same_work_improvement_direction: >-
          保留可移动 P/L 与完整 C 形的 combination 身份，但必须让锚点的移动状态在 C 形的关键操作或终局中继续承担可见责任，例如由两者直接发生操作面、时序或去向上的共同关系；不能只把锚点用作起点出口。
        blocking: true
    cleanup_observations: []
    verdict: reject_candidate

  - candidate_id: CWHOLE_CHALLENGE
    exact_version: CWHOLE_CHALLENGE_v6_sha256_2ae9b3f4386035ac4c3f77cdb777b753410717c7df6c0aa10b4fce5e87923c44
    design_role: challenge
    opening_read: >-
      开局首先看见一个八格完整 C 形黏块包住凹口内的竖直 P/L，C 形自身已有三处分散格落在目标上，而 P/L 右侧另有竖直双目标。玩家站在 C 形左侧，矛盾是必须先牺牲现有 C 形目标覆盖，把凹口中的锚点推出去，再设法让完整形状回来。
    player_actually_does: >-
      玩家连续向右推动完整 C 形两格；C 形通过凹口内接触把 P/L 一起推出两格。P/L 到达远端双目标后，玩家上移到 pull 操作位，再连续向左拉回完整 C 形两格，同时把 P/L 留在远端。
    visible_payoff: >-
      前两步让整个 C 形与其包住的 P/L 同步右移，原有三处覆盖撤销而远端双目标被 P/L 覆盖；后两次拉动让完整 C 形回到原位、恢复三处覆盖，却不带回 P/L。最后一次左拉同时完成“形状归位”和“锚点留泊”的双重结算。
    ending_read: >-
      C 形回到开局位置，P/L 永久留在右侧双目标，五个目标在最后一次拉动后同时满足并立即胜利。高潮就是结束，没有额外走位或清理。
    exact_basis:
      - "CWHOLE_CHALLENGE_v6.txt：八格 C 形的凹口内是竖直 L/P；C 形三格已压目标，P/L 右侧有两个空目标。"
      - "input_replay_CWHOLE_CHALLENGE_v6.json steps 1-2：每步同时出现 push_object:sticky#1、force_chain:n2、anchor_boundary_shift:push_pull、move_sticky_rigid，C 形与 P/L 同步右移。"
      - "同一 replay step 3 为一次 walk；steps 4-5 仅 pull_object:sticky#1 与 move_sticky_rigid，P/L 保持在远端。"
      - "step 2 后 P/L 覆盖远端双目标；step 5 后 C 形恢复三处原目标覆盖且 isWin=true。"
    perceptible_defects: []
    cleanup_observations: []
    verdict: survive_to_pre_submission_checks

role_and_difference_reading:
  baseline_complete_not_minimal_witness: >-
    否。baseline 虽有清楚形状、集中回报和无清理收束，但实际仍等同于方法论文档所界定的“预制完整形状移动到同形目标”直白 witness；两次右推、换面、一次下推没有增加足以构成完整作品的玩家关系。
  application_real_delta: >-
    有可见 delta，但不足以成立 application。玩家确实把一个箱子转黏并补成完整 C 形；然而起点三面封墙、箱与缺口预对齐，使新增责任退化为唯一可行的第一下输入。相对 baseline 的显著作者责任没有成立。
  combination_other_non_prerequisite_mechanism: >-
    可移动 P/L 名义上是另一项已知、非本核心前序的机制；固定 B/S 只是维持 sticky 语义的前序支持。问题不在机制身份，而在 P/L 的实际使用仅是一格开门。
  combination_player_visible_relation: >-
    否。P/L 在 step 1 下移后退休，完整 C 形从 step 3 才开始独立下移；没有共同移动、状态交接、目标接力或持续改变核心操作空间的可见关系。
  challenge_real_ceiling_attempt: >-
    是。challenge 不是靠步数或对象数增难，而是把完整 C 形同时用作包住 P/L 的可见结构、推出锚点的刚体和随后可单独拉回的回收体；它要求暂时撤销三处既有目标覆盖，完成“共同推出—分离回收—双端结算”的多阶段复用，属于紧凑的反直觉与形式关系上限尝试。
  pairwise_player_experience_differences:
    - "baseline 与 application：application 多出补入一格并发生转黏合并，但该动作被完全强制；两者主要消费阶段仍是把完整 C 形沿直线送入同形目标，差异尚不足以支撑两个已完成作品。"
    - "baseline 与 combination：combination 多出一次 P/L 开门，随后仍是预制 C 形直线搬运；锚点前缀没有形成不可替代的共同体验。"
    - "baseline 与 challenge：challenge 让 C 形先携 P/L 外移、再单独回收并恢复自身目标，玩家关系实质不同且不可由 baseline 替代。"
    - "application 与 combination：一个展示被强制的一格补形，另一个展示被强制的一格锚点开门；名义事件不同，但都只是直线 C 形 witness 前的短前缀，尚未成为两个完成质量足够的独立关系。"
    - "application 与 challenge：challenge 的形状—锚点共同推出与分离回收，不可由 application 的一键补形后直推替代。"
    - "combination 与 challenge：两者都出现 P/L，但 challenge 在同一步 force-chain 中共同移动并在终局分离结算；combination 的 P/L 在核心开始前退休，玩家体验实质不同。"
  role_or_redundancy_blockers:
    - "baseline 未越过最小 witness 与完整直接作品的边界。"
    - "application 的新增构造责任被做成唯一第一步，角色差异过薄。"
    - "combination 的 P/L 是开场门闩前缀，没有与完整 C 形共同兑现。"

segment_readiness:
  applicable: true
  every_level_independent_complete_work: no
  same_core_ordered_deepening: no
  experiences_non_substitutable: no
  major_standalone_possibilities_sufficiently_present: no
  exact_basis:
    - "baseline 的完整回放只兑现预制七格 C 形沿折线路径进入同形七目标。"
    - "application 的唯一构造动作发生在 step 1，随后三步走位和两次直推重复直白消费。"
    - "combination 的 P/L 只在 step 1 移动，C 形在 steps 3-4 独立完成目标，两机制没有共同结算。"
    - "challenge 的 steps 1-2 共同推出 C 形与 P/L、steps 4-5 只回收 C 形，形成当前段落中唯一明确完整且不可替代的深层关系。"
  missing_or_redundant_relations:
    - "缺少一个超越同形搬运 witness、但仍直接低风险地兑现完整 C 形作用的 baseline。"
    - "缺少让玩家对完整 C 形成立条件承担显著而不喧宾夺主责任的 application；当前一键补形过薄。"
    - "缺少让另一非先修机制与完整 C 形在同一主要体验中持续互相改变并共同兑现的 combination；当前锚点开门前缀应被替换。"
    - "challenge 已形成可保留的完整作品关系，不应因其余槽位未就绪而被抹除。"
  verdict: continue_segment_design

overall_verdict: continue_segment_design
