    opening_read: >-
      开局最醒目的是七格黏块组成的完整 C 形，开口朝左，玩家正站在凹口中面对右侧脊柱；
      右方三目标按“上下较近、中间较远”错开，直接承诺整形平移时的分时覆盖。
      B/S 被封在最左侧，只交代当前黏世界，不形成可执行支线。
    player_actually_does: >-
      玩家连续两次向右施力，让同一个七格刚体整体平移。第一次由上下两臂覆盖上下目标；
      第二次由脊柱抵达更远的中目标，同时两臂的后续格仍留在上下目标上。
    visible_payoff: >-
      同一个 C 形的两次整块滑动把三处错位目标在两个时刻协同覆盖，第二次移动立即完成关卡。
    ending_read: 高潮就是终局；没有额外走位、重复确认或高潮后清理。
