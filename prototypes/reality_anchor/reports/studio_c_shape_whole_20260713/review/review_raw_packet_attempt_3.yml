review_attempt_id: RA_CWHOLE_REVIEW_3
prototype_id: reality_anchor

prototype_rules:
  confirmed_rules:
    - 空目标格可行走；玩家每次输入一个正交方向。
    - 无 P/L 时全图为 push；有 P/L 时按输入时玩家所在侧选择 push 或 pull。
    - push 移动玩家前方相邻对象；pull 在前格为空时移动玩家并拉动身后相邻对象；力可传播。
    - B/S 在合法动作后按所在侧把箱与黏块归一化；相邻黏格合并为同一刚体。
    - 黏块连通分量整体平移，任一目标格受阻则整次对象移动失败。
  win_condition: settle 后所有目标被箱、黏块格或锚点格覆盖；玩家不计入覆盖。
  object_and_event_semantics:
    - M 是当前连通形状整体移动的黏块格。
    - 本 packet 中 B/S 锚点被墙固定。
    - m 表示目标上的黏块。
  player_prior:
    - 已知推、拉、固定 P/L、固定 B/S、黏块刚体移动与目标覆盖。

