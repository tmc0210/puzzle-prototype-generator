        exact_basis: >-
          review_raw_packet_attempt_2.yml 的 player_prior 明列“已知推、拉、固定 P/L”，而 input_replay_CWHOLE_COMBINATION_v1.json 两步均仅记录 pull_object:sticky#1 与 move_sticky_rigid。
        player_effect: >-
          玩家得到的是 baseline 两次整体右移的推拉镜像：操作关系由推前壁改成拉后壁，但没有建立或利用一项额外的组合条件，不能承担 combination 席位。
        same_work_improvement_direction: >-
          这不是同一 exact version 可微修的包装缺点；应移除该 combination 分支并允许档位留空，若另作则必须由真正非前序的支持机制产生一个随后被完整 C 形运动消费的条件。
