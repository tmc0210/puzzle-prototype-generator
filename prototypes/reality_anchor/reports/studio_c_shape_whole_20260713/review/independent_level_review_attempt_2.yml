  - candidate_id: CWHOLE_BASELINE
    exact_version: CWHOLE_BASELINE_v1_sha256_f7107731757265fdcee2ebeeb834e301b64c1f99b19ad730545a79931f928bc1
    slot: baseline
    opening_read: >-
      开局最醒目的是一个紧凑、完整的七格 C 形黏块与其右侧竖排三目标；玩家站在凹口中并正对 C 形内侧右壁，立即形成“从凹口推动整个形状向右平移”的直接 affordance。
    player_actually_does: >-
      玩家连续两次向右输入，每次都从凹口推动同一七格连通黏块刚体整体右移一格；没有前置子题、换相或额外对象操作。
    visible_payoff: >-
      第一次整体平移让上下两臂同时覆盖上下目标，第二次保持完整 C 形继续平移并让中部也覆盖目标，三点在同一整体运动中集中兑现。
    ending_read: >-
      第二次整体平移即胜利，高潮后没有走位或清理劳动。
