portfolio_comparison:
  baseline_complete_direct_read: >-
    baseline 是完整而直接的最小实现：玩家在 C 形凹口中连续两次右推，同一七格刚体以完整形状依次兑现上下目标与中目标，回报集中且立即结束。
  application_real_delta: >-
    application 的增量成立。baseline 已直接给出与目标同高的 C 形；application 要求玩家先把整块 C 形上移一格建立高度条件，再换到左侧把该条件用于两次横推。新增责任是玩家主动进行二维定位，不只是增加操作次数。
  combination_non_prerequisite_mechanism: >-
    不成立。唯一不同机制是固定 P/L 所提供的 pull，而 raw packet 将 pull 与固定 P/L 明列为玩家先验，因此它不能充当非前序 combination 机制。
  combination_consumption_relation: >-
    不成立。replay 中 P/L 直接把每次 right 解释为 pull 并同步移动 C 形，没有先形成材料、位置、入口、时机或新规则状态，再由核心后续消费的独立关系。
  challenge_real_ceiling_attempt: >-
    本批未提交 challenge；该档位允许为空，不构成阻塞。
  pairwise_player_experience_differences:
    - >-
      baseline 对 application：前者直接从凹口横推；后者先纵向移动完整 C 形、绕到另一操作面，再横推，玩家对核心条件的作者性有实质增加。
    - >-
      baseline 对 combination：前者推 C 形内侧前壁，后者在固定 P/L 下拉 C 形背脊；局部受力关系确有差异，但后者使用的是既有前序机制，差异不足以成立 combination 席位。
    - >-
      application 对 combination：前者完成二维定位并换侧使用已建立条件，后者只沿单一方向连续拉动两次；玩家责任明显不同。
  slot_or_redundancy_blockers:
    - >-
      CWHOLE_COMBINATION 的 combination 席位被阻塞：不能以玩家已知的固定 P/L/pull 替代非前序支持机制，也不能仅凭推拉镜像保留该档。

