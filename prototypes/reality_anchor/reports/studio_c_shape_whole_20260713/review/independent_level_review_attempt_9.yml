independent_readings:
  - candidate_id: CWHOLE_BASELINE
    exact_version: CWHOLE_BASELINE_v6_sha256_9059c8758e9ac3d02469319b7ff9e740f146ef0d4e92cc2a5ef97852c5b39d3a
    design_role: baseline
    opening_read: >-
      开局主体是一个七格、轮廓完整且向左开口的 C 形黏块；玩家位于凹口内，右侧与下方的分散目标同时提示它不能只做一次直线平移。固定 B/S 只说明全块保持 sticky，题面注意力集中在 C 的凹口、右脊和上下两臂。
    player_actually_does: >-
      玩家先把凹口当作施力位，将完整 C 形整体向右推两格；随后离开凹口并绕到上臂上方，改变施力面，再把同一个完整刚体向下推一格完成落位。玩家完成的是一次保持轮廓的两轴运输与换面操作，而不是拆分或逐格处理黏块。
    visible_payoff: >-
      第 1、2 步中七格轮廓每次都完整右移；第 8 步整块下移后，上臂左端、右脊和下臂两端同时覆盖四个分散目标，棋盘立即胜利。完整 C 的凹口用于开局施力，三段轮廓又共同参与终局结算。
    ending_read: >-
      最后一记向下推动就是高潮和终点；没有在完整 C 完成四点落位后再处理箱子、锚点或赶路。终局仍清楚保留完整 C 轮廓。
    exact_basis:
      - 初始 replay 状态的 M 坐标为上臂三格、右脊中格、下臂三格，玩家位于凹口中央。
      - canonical step 1-2 均为 push_object:sticky#1 与 move_sticky_rigid，after render 显示轮廓完整右移两次。
      - canonical step 3-7 只改变玩家站位，把操作面从凹口内转到上臂上方，没有改变任何对象。
      - canonical step 8 再次触发完整刚体移动；after render 中四个目标由同一 C 形覆盖且 isWin 为 true。
    perceptible_defects: []
    cleanup_observations: []
    verdict: survive_to_pre_submission_checks

  - candidate_id: CWHOLE_APPLICATION
    exact_version: CWHOLE_APPLICATION_v14_sha256_c853889c255da5030f37806ca2917ff12455217439770d46bae6a4e8cb997738
    design_role: application
    opening_read: >-
      开局黏块只有左侧竖脊和下臂，尚缺上臂右侧两格；这两个缺口正上方各有一个普通箱，玩家站在两箱上方。右侧目标群给出完整 C 的去向，但完整形状并未预制给玩家。
    player_actually_does: >-
      玩家选择先处理哪一个箱子，再分别把两箱各向下送过 B/S 边界：一个位置承担把新材料接到竖脊并形成连接段的责任，另一个位置承担补齐上臂端点的责任。两份 exact replay 表明两者可交换先后；两次放置都完成后，玩家绕到左侧，把自己构造出的七格完整 C 连续向右推动两格结算。
    visible_payoff: >-
      canonical 中第 1 步先出现与主体相连的上臂新格，第 4 步补齐端点；反向顺序中第 2 步先出现暂时分离的端点，第 5 步由另一格搭桥并整合为同一刚体。两条路径都在中段得到完整 C 的清楚剪影，随后整块右移并一次覆盖右侧六个目标，构造结果被立刻实际使用。
    ending_read: >-
      最后两步是构造完成后的整体应用，第二次右推即胜；没有在 C 形结算后继续清理。终局完整轮廓与右侧目标图形重合，开局两个普通箱也都已成为该轮廓的一部分。
    exact_basis:
      - 初始状态只有 M:3,3;3,4;3,5;4,5;5,5，两个普通箱位于 4,2 与 5,2，对应缺失的上臂连接位与端点位。
      - canonical step 1 与 step 4 分别触发 box_to_sticky；第一步同时 sticky_merge，第二步把上臂补齐为连续三格。
      - reverse replay step 2 先把右箱转成暂时分离的 sticky，step 5 再由左箱触发 sticky_merge；两种顺序均合法并完成同一构造。
      - canonical step 9-10 均为 move_sticky_rigid；step 10 after render 显示完整 C 覆盖右侧目标且 isWin 为 true。
    perceptible_defects: []
    cleanup_observations: []
    verdict: survive_to_pre_submission_checks

  - candidate_id: CWHOLE_COMBINATION
    exact_version: CWHOLE_COMBINATION_v8_sha256_600cabc71e11a2db13a58277c68668f466d70f5a8cb9aedca11acc245c21af6c
    design_role: combination
    opening_read: >-
      开局仍是完整七格 C 与凹口内玩家，但 C 的右脊外侧紧贴一个可移动竖向 P/L；C 的右中格和下臂右端分别顶住 P 与 L，最右目标对明显属于锚点，下面与左侧的目标属于 C。题面直接承诺两个刚体要在同一运输中发生关系。
    player_actually_does: >-
      玩家从凹口连续向右推完整 C，两处接触同时把整枚 P/L 向右传力，C 与锚点共同平移两格。随后玩家绕至 C 上方，仅把 C 向下推一格：P/L 留在最右目标对，C 则落到自己的四点目标群，完成共同移动后的分流结算。
    visible_payoff: >-
      第 1、2 步的 render 中，完整 C 与 P/L 每次同步右移，且同一步同时报告 sticky 刚体移动、force_chain 与 P/L 边界位移；第 8 步 C 单独下落，锚点保持在右端。终局同时可见 P/L 覆盖一列两目标、C 覆盖另外四个分散目标。
    ending_read: >-
      C 的下落把先前共同移动的两个刚体清楚分开并当场胜利；P/L 没有在开场后退休，也没有另起一个无关子题，最后仍承担可见目标覆盖。
    exact_basis:
      - 初始完整 C 的右侧两格分别与 P:6,3 和 L:6,4 相邻，P/L 右方有明确的两格目标终点。
      - canonical step 1-2 每步同时出现 push_object:sticky#1、force_chain:n2、anchor_boundary_shift:push_pull 与 move_sticky_rigid。
      - step 2 后 P/L 已位于最右列目标位置，完整 C 仍保持轮廓并与其相邻。
      - step 8 只移动 sticky 刚体；final render 中 P/L 保留在右侧目标列，C 覆盖自己的四点目标且 isWin 为 true。
    perceptible_defects: []
    cleanup_observations: []
    verdict: survive_to_pre_submission_checks

  - candidate_id: CWHOLE_CHALLENGE
    exact_version: CWHOLE_CHALLENGE_v6_sha256_2ae9b3f4386035ac4c3f77cdb777b753410717c7df6c0aa10b4fce5e87923c44
    design_role: challenge
    opening_read: >-
      开局是一个向右开口、上下臂更长的完整 C，竖向 P/L 嵌在凹口内；C 已覆盖上端、左脊和下端三个目标，而 P/L 右方另有一对空目标。玩家在 C 左侧，首先面对的是必须暂时破坏已有覆盖、用完整外壳搬运内部锚点的矛盾。
    player_actually_does: >-
      玩家先连续向右推动完整 C，C 的左脊把凹口中的 P/L 一并向右送两格；随后只向上换一次站位，利用已经移动后的 P/L pull 侧连续向左拉回完整 C。锚点留在右侧目标对，C 则完整穿回锚点外侧并恢复开局三处覆盖。
    visible_payoff: >-
      前两步是 C 与内嵌 P/L 的同步外送，后两次对象动作则反转为只拉 C、让 P/L 留在目标上；玩家能在五步内看到同一完整轮廓从已覆盖状态离开、搬运锚点、再原样复位。最终画面同时保留 C 的三个原目标和 P/L 的两个新目标。
    ending_read: >-
      第二次左拉即完成复位并胜利，C 与 P/L 的分离就是高潮；没有额外收尾。终局几乎恢复开局 C 轮廓，却把凹口内的锚点永久送到了右侧，结果非常集中。
    exact_basis:
      - 初始 M 坐标形成上下各三格、左脊两格的完整 C，P/L 位于其凹口；C 已覆盖三个目标，右侧另有 P/L 目标对。
      - canonical step 1-2 同时出现 sticky 刚体移动、force_chain:n2 与 anchor_boundary_shift:push_pull，C 和 P/L 共同右移。
      - canonical step 3 仅为一次向上 walk，把玩家置于 C 左侧且处在随后 pull 的操作位。
      - canonical step 4-5 均为 pull_object:sticky#1 与 move_sticky_rigid，P/L 坐标保持不变；step 5 后 C 回到原轮廓位置并 isWin 为 true。
    perceptible_defects: []
    cleanup_observations: []
    verdict: survive_to_pre_submission_checks

role_and_difference_reading:
  baseline_complete_not_minimal_witness: >-
    成立。它不是把预制 C 沿单一通道推入同形槽的一次 witness：玩家先从凹口内完成横移，再离开凹口、换到另一施力面完成正交落位；终局四个分散目标分别消费上臂、右脊和下臂。直接性符合 baseline，但完整的读形、换面和集中结算已经形成一关。
  application_real_delta: >-
    成立。baseline 直接提供完整七格 C，application 开局只给左脊与下臂；玩家必须亲自把两个普通箱转成黏块并分别放到连接位与端点位。两箱可交换顺序并不把责任降成事件计数：canonical 的中间态是先长出连接段，reverse 的中间态是先放置分离端点，第二个箱在两条路线中都承担闭合完整上臂的必要责任；随后构造结果被整体右推并结算。
  combination_other_non_prerequisite_mechanism: >-
    成立。可移动 P/L 不是完整 C 黏块刚体语义的前序组成；本关实际加入的是锚点作为可推动两格刚体及其移动边界。RA_CAND_0010、RA_CAND_0015、RA_CAND_0011 仅用于校准这一 P/L 核心从直接应用到更高挑战的档位尺度，没有被当作本作品布局素材。
  combination_player_visible_relation: >-
    成立。P/L 并非开场按钮或退休前题：完整 C 通过右侧两处同时接触把 P/L 连续推行两格，玩家每步都看到两个刚体共同移动；最后 C 向下分流、P/L 留在右侧目标对，二者在同一主体验内共同运输并分别结算。
  challenge_real_ceiling_attempt: >-
    成立。挑战不靠步数或对象数量，而是在紧凑五步中叠加已有目标暂时让位、C 包围 P/L 的嵌套几何、整形共同外送、push 到 pull 的操作反转，以及 C 抽回而锚点留驻的分离复位。相较 combination，它要求玩家理解完整 C 如何既搬运内部锚点又绕着已停下的锚点返回，因此仍是本段的体验上限。
  pairwise_player_experience_differences:
    - baseline 与 application：前者读取预制完整 C 的两轴运输，后者先用两个职责不同但顺序可交换的材料位亲自构造完整 C，再使用它。
    - baseline 与 combination：前者只运输并落位 C，后者要求 C 以双接触面同步推动另一枚两格刚体，并在终局分流。
    - baseline 与 challenge：前者从未满足状态走向一次落位，后者先让已覆盖目标空出，用 C 搬运内嵌锚点后再拉回复位。
    - application 与 combination：前者的新增责任在 C 成形之前的材料构造，后者从完整 C 出发，新增责任在与 P/L 的共同运动和分开结算。
    - application 与 challenge：前者强调把零件补成 C 后向单一方向使用，后者不构造形状，而把既有 C 作为可外送、可抽回的嵌套搬运外壳。
    - combination 与 challenge：前者是 C 外侧双接触推着 P/L 同行，随后 C 正交下落；后者把 P/L 包在凹口内，先共同外送，再利用 pull 让 C 反向返回而锚点留驻。
  role_or_redundancy_blockers: []

segment_readiness:
  applicable: true
  every_level_independent_complete_work: yes
  same_core_ordered_deepening: yes
  experiences_non_substitutable: yes
  major_standalone_possibilities_sufficiently_present: yes
  exact_basis:
    - baseline 用完整 C 的凹口施力、正交换面和多点落位建立直接完整读法，application 随后把完整形状的形成责任交给玩家。
    - application 的两条 exact replay 均先完成完整 C，再用同一完整刚体结算，说明段落没有从核心形状漂移到普通双箱顺序题。
    - combination 与 challenge 都有 P/L 参与，但 exact trace 分别显示外侧双接触共同推进后正交分流、内嵌共同外送后 pull 抽回，两种玩家关系不可互换。
    - 四关高潮后都在最后一次对象动作立即胜利，没有额外子题或清理劳动；每关的主要对象在终局仍承担可见覆盖责任。
    - 顺序从直接使用、主动构造、外部机制共同运动，推进到目标让位与嵌套搬运复位，责任与反直觉程度逐步加深。
  missing_or_redundant_relations: []
  verdict: segment_survived

