independent_readings:
  - candidate_id: CWHOLE_BASELINE
    exact_version: CWHOLE_BASELINE_v1_sha256_f7107731757265fdcee2ebeeb834e301b64c1f99b19ad730545a79931f928bc1
    slot: baseline
    opening_read: >-
      开局最先读到的是一块已经完整成形的七格 C 形黏块：玩家站在凹口内，右侧三目标与
      C 形的上臂、脊柱和下臂明确对齐；上方另悬着一组固定 B/S。
    player_actually_does: >-
      玩家从凹口连续向右推动两次，同一个七格连通体原样整体平移；没有构造、换面或
      额外收拾。
    visible_payoff: >-
      第一次整体右移同时覆盖上下两个目标，第二次继续右移后由同一完整 C 形一次占满
      三个目标，回报集中且清楚。
    ending_read: >-
      第二次核心动作后立即胜利，没有高潮后的劳动；作为 baseline，它是完整而直接的
      整体形状使用 witness。
    exact_basis:
      - prototypes/reality_anchor/reports/studio_c_shape_whole_20260713/candidates/CWHOLE_BASELINE_v1.txt
      - prototypes/reality_anchor/reports/input_replay_CWHOLE_BASELINE_v1.json#/initial
      - prototypes/reality_anchor/reports/input_replay_CWHOLE_BASELINE_v1.json#/steps/0
      - prototypes/reality_anchor/reports/input_replay_CWHOLE_BASELINE_v1.json#/steps/1
    perceptible_defects:
      - defect: 固定 B/S 作为醒目的原型机制信号出现，却完全不参与玩家操作、形状变化或目标兑现。
        exact_basis: >-
          初始布局顶部为 B/S；两步回放中唯一对象事件均为 sticky 刚体右移，B/S 状态始终保持
          B:4,1;S:4,2，完整 C 形也从未穿越其边界。
        player_effect: >-
          玩家会先把 B/S 与紧邻的黏块整体联系起来，但实际只需在其下方平推预制 C 形；这个
          高辨识度对象没有兑现任何期待，削弱了本来很干净的整体形状读题。
        same_work_improvement_direction: >-
          在不改变预制完整 C 形、凹口操作位、两次整体右移和三目标兑现的前提下，删除 B/S
          展示区并收紧上边界，让题面只承诺实际发生的整体刚体平移。
        blocking: true
    verdict: revise_and_rereview

  - candidate_id: CWHOLE_APPLICATION
    exact_version: CWHOLE_APPLICATION_v2_sha256_4ee70a4483ed80e37d3fce050489ab8a95a31a61d9140ceefb90531940853320
    slot: application
    opening_read: >-
      开局同样能读出完整七格 C 形，但它比右侧三目标低一行；玩家位于下臂正下方，首先可做的
      形状操作是把整个 C 形上推到目标行。固定 B/S 被完整墙带隔在题面上方。
    player_actually_does: >-
      玩家先把七格 C 形整体上推一格，主动建立其与三目标的纵向对齐；随后在开放空地中左、左、
      上走到下臂左侧，再连续右推两次，以完整形状覆盖目标。
    visible_payoff: >-
      首次上推把散开的形状与目标行校准；最后两次右推复现整体 C 形同时服务上、中、下三条线的
      可见回报，第二次右推立即胜利。
    ending_read: >-
      最后一记整体右推后立刻结束，核心高潮之后没有清理；但从纵向校准到横向兑现之间插入了三步
      纯走位。
    exact_basis:
      - prototypes/reality_anchor/reports/studio_c_shape_whole_20260713/candidates/CWHOLE_APPLICATION_v2.txt
      - prototypes/reality_anchor/reports/input_replay_CWHOLE_APPLICATION_v2.json#/initial
      - prototypes/reality_anchor/reports/input_replay_CWHOLE_APPLICATION_v2.json#/steps/0
      - prototypes/reality_anchor/reports/input_replay_CWHOLE_APPLICATION_v2.json#/steps/1
      - prototypes/reality_anchor/reports/input_replay_CWHOLE_APPLICATION_v2.json#/steps/2
      - prototypes/reality_anchor/reports/input_replay_CWHOLE_APPLICATION_v2.json#/steps/3
      - prototypes/reality_anchor/reports/input_replay_CWHOLE_APPLICATION_v2.json#/steps/4
      - prototypes/reality_anchor/reports/input_replay_CWHOLE_APPLICATION_v2.json#/steps/5
    perceptible_defects:
      - defect: 固定 B/S 被封在与玩法区完全断开的顶部陈列区，既不可接近也不参与任何状态变化。
        exact_basis: >-
          布局第 4 行是整行墙，将 B/S 与下方玩法空间完全隔断；六步回放中 B/S 始终保持
          B:4,1;S:4,2，全部对象事件只有同一 sticky 刚体的上移与右移。
        player_effect: >-
          独立陈列区把视觉注意力引向一个不可能被消费的原型机制，造成明确的 affordance 噪声，
          也让实际紧凑的整体形状题被无效顶部空间拉长。
        same_work_improvement_direction: >-
          删除封闭的 B/S 陈列区及分隔墙，把上边界收至实际玩法区；保留完整 C 形先上移校准、
          再右移覆盖三目标的关系。
        blocking: true
      - defect: 纵向校准后到横向兑现前的三步移动全部是开放空地中的无决策绕行。
        exact_basis: >-
          回放第 1 步完成关键的整体上推；第 2 至第 4 步依次为 left、left、up，事件均为 walk，
          棋盘对象没有任何变化；直到第 5 步才重新接触下臂并开始横推。
        player_effect: >-
          六步规范流程有一半只是把玩家从下方搬到左侧，新增责任的可见建立与最终消费被空场走位
          隔开，节奏明显松散。
        same_work_improvement_direction: >-
          在仍要求玩家先整体上推建立纵向对齐、再从侧面横推消费完整 C 形的前提下，压缩换面的
          空地和路线，使过渡尽快回到第二次核心操作。
        blocking: true
    verdict: revise_and_rereview

