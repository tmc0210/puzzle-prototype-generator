review_attempt_id: RA_CWHOLE_REVIEW_7
prototype_id: reality_anchor

prototype_rules:
  confirmed_rules:
    - 玩家每次输入一个正交方向；空格可行走。
    - 无 P/L 时全图为 push；有 P/L 时，以输入前玩家位置相对 P/L 边界选择 push 或 pull。
    - push 移动玩家前方对象；pull 要求玩家前格为空，并移动玩家及其身后对象；力可以向其它可动物传播。
    - P/L 与 B/S 都是可移动两格锚点；移动后边界随锚点改变。
    - 无 B/S 时全图为 box；有 B/S 时，每个合法动作后按新边界将箱与黏块全局归一化。
    - sticky 正交相邻格合并为单一刚体；任何目标格受阻都会使整块移动失败。
  win_condition: settle 后所有目标格都被箱、黏块格或锚点格覆盖；玩家不计入覆盖。
  object_and_event_semantics:
    - C 为普通箱，M 为黏块格；m 为目标上的黏块，G 为空目标。
    - P/L 分别标记 push 侧与 pull 侧；B/S 分别标记 box 侧与 sticky 侧。
    - force_chain 表示一次对象移动同时推动了另一个可动物；anchor_boundary_shift 表示对应锚点实际改变位置。
    - 目标 overlay 在对象覆盖时仍存在；render 中对象字形可覆盖 G。
  player_prior:
    - 已知普通推箱、目标覆盖、固定与可移动 P/L。
    - 已知 B/S 归一化、箱转黏、sticky merge、黏块刚体移动。
    - 已知锚点本身可以被推拉。

