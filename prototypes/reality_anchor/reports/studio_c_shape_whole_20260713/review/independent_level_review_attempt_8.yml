independent_readings:
  - candidate_id: CWHOLE_BASELINE
    exact_version: CWHOLE_BASELINE_v6_sha256_9059c8758e9ac3d02469319b7ff9e740f146ef0d4e92cc2a5ef97852c5b39d3a
    design_role: baseline
    opening_read: >-
      开局视觉中心是七格连通黏块组成的完整 C：上下各三格为两臂，右侧中格把两臂连成脊柱，
      玩家位于凹口内部，左侧又被墙封住。玩家首先面对的不是一个远处待搬对象，而是“自己被完整
      C 包住、只能借凹口向右推动整个形状”的直接矛盾。脊柱中格已压住一个目标，右下与下方还有
      三个稀疏目标，提前表明当前覆盖并非终局。左上 B/S 位于墙角，读作黏块材料边界背景；开局
      的尺寸、玩家位置和目标分布都把注意力集中在完整 C 上。
    player_actually_does: >-
      玩家先从 C 的凹口内部连续向右推动两次；两次都不是局部箱移动，而是同一七格连通黏块
      整体平移。第二次平移后凹口左侧终于与外部通道连通，玩家退出凹口，沿短路线绕到上臂上方，
      再向下推动一次，使仍保持完整的同一 C 整体正交下移。玩家不构造、不拆分形状，而是在两个
      不同施力侧实际使用这一个完整刚体。
    visible_payoff: >-
      前两次整体右移的阶段回报是 C 作为一扇大型刚体门让出凹口出口，同时撤掉开局已经覆盖的
      中间目标，明确要求继续处理。最终向下推动时，完整 C 的上臂左端、右侧脊柱和下臂两端在
      同一次可见平移中覆盖四个分散目标并立刻胜利；回报集中在一个清楚的整体落位，而不是逐格
      收尾。
    ending_read: >-
      第 8 步整体下移后立即胜利，七格 C 仍完整连通，四个目标分别由其上臂、右侧脊柱与下臂
      跨度覆盖。高潮之后没有走位、拆分或清理劳动；未参与移动的 B/S 仍留在左上墙角，也没有在
      终局抢走 C 形落位的视觉重心。
    exact_basis:
      - 初始 render 中七个 M 位于 (2,2)-(4,2)、(4,3)、(2,4)-(4,4)，组成完整 C；玩家位于 (3,3) 的凹口内。
      - 第 1、2 步均记录 push_object:sticky#1 与 move_sticky_rigid；七格坐标分别整体向右平移一格，形状没有拆分。
      - 第 2 步后玩家位于 (5,3)，C 位于 x=4..6 的同一完整构型，左侧通道已经打开，开局 (4,3) 的目标重新露出。
      - 第 3 至 7 步全为 walk，路线 left、left、up、up、right，只用于从凹口退出并换到上臂上方，没有附加子题或对象清理。
      - 第 8 步再次记录 push_object:sticky#1 与 move_sticky_rigid；七格 C 整体下移到 (4,3)-(6,3)、(6,4)、(4,5)-(6,5)。
      - 第 8 步后的四个覆盖目标位于 (4,3)、(6,4)、(4,5)、(6,5)，分布跨越上臂、右侧脊柱与下臂；同一步 isWin 变为 true。
    perceptible_defects: []
