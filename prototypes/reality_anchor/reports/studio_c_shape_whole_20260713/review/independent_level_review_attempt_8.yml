role_and_difference_reading:
  baseline_complete_not_minimal_witness: >-
    是。它不是把预制 C 沿单一方向直接推入同形目标的裸 witness：开局先让完整 C 成为包住玩家的
    可操作空间，玩家从凹口内用两次整体右移打开自己的出口并撤掉预覆盖目标；随后必须换到外侧
    施力面，把同一完整 C 正交下移，才由上下臂和右侧脊柱在一次落位中共同覆盖四个稀疏目标。
    “被形状包住—借整体移动脱出—换边—以完整形状集中收束”已经形成短而完整的玩家弧线。
    操作虽直接且强引导，但这符合 baseline 的低风险角色；当前 exact work 没有无意义前置、未兑现
    对象、核心退化或高潮后劳动，也没有仅靠增加复杂度才能解决的所谓缺口。
