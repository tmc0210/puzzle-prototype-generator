    slot: baseline
    opening_read: >-
      开局最先读到的是一个完整、连通的七格 C 形黏块：上下横臂与左侧竖边围出凹口，玩家正对凹口内侧的中段受力面，三个目标沿其右移轨迹排成上下臂与中段的对应落点。B/S 被收在左上角，只说明材料世界，没有与主要操作竞争。
    player_actually_does: >-
      玩家连续两次向右施力，让同一个七格刚体保持整体形状平移；没有构造前缀、换侧流程或额外对象交接。
    visible_payoff: >-
      第一次平移同时让上下臂覆盖上下目标，第二次再让中段覆盖最后目标；玩家直接看见完整 C 形的三个部位作为同一刚体共同兑现目标构图。
    ending_read: >-
      第二次整体平移就是高潮也是胜利，没有高潮后的走位、回收或清理。
