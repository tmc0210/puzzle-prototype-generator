portfolio_comparison:
  baseline_complete_direct_read: >-
    成立。baseline 用两次连续整体横移直接兑现完整 C 形的凹口操作位、上下臂和竖脊，没有额外流程，也没有高潮后清理。
  application_real_delta: >-
    增量真实：相对 baseline，玩家必须先把完整 C 形上移一格，主动建立目标对齐条件；但该增量目前被随后七步纯走位严重稀释，因此 exact version 需修订。
  combination_non_prerequisite_mechanism: >-
    成立。固定 P/L 是区别于完整黏块刚体移动的另一机制，不是推动预制 C 形本身不可缺少的组成部分；它把主区域置于 pull 侧。
  combination_consumption_relation: >-
    成立。P/L 产生的 pull 关系被玩家身后的完整 C 形立即消费，两次向右移动都直接拉动整个形状并完成目标覆盖，不存在先解完后退休的独立子题。
  challenge_real_ceiling_attempt: >-
    不成立。虽然同一形状发生横、纵两轴位移，但开局推左由口袋强制，换位只有三步单通路，末次推上直接胜利；流程没有增加玩家判断、构造、复用或反直觉责任。
  pairwise_player_experience_differences:
    - baseline 与 application：前者直接从已对齐凹口横推，后者先主动整体上移建立对齐；差异真实，但 application 的换位包装阻塞。
    - baseline 与 combination：两者都用两次横移完成同构回报，但 baseline 是从凹口推竖脊，combination 是在 P/L pull 侧向右走并把身后竖脊连同整个 C 形拉来，玩家与形状的施力关系实质不同。
    - baseline 与 challenge：challenge 增加了横移后换轴上推，但当前新增关系是强制流程，不足以承担 challenge 档位。
    - application 与 challenge：application 的新增责任是主动建立目标对齐；challenge 只呈现被口袋规定的双轴顺序，二者并非同一流程变体，但后者仍因档位不成立被否决。
    - combination 与 application/challenge：combination 的关键关系是固定 P/L 让玩家拉动身后完整形状，其余版本均在 push 规则下从形状前方施力。
  slot_or_redundancy_blockers:
    - application exact version 存在七步无对象变化的路线税，不能以真实档位增量补偿包装缺陷。
    - challenge exact version 只是强制双轴演示，不构成真实上限探索；challenge 档位应为空而不是保留该弱版本。

overall_verdict: revise_and_rereview
required_action: structural_revision
