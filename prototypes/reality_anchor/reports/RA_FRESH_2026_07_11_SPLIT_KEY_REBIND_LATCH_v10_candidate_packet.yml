design_claim:
  player_insight: >-
    黏住是临时制造共享形状。开局 L 形先侧拉 B/S，把三箱桥与远端黏格拼成 U 形；
    玩家搬运并抬升整块以打开 P/L 通道，横拉 P/L 覆盖上方双目标并改写末段施力侧。
    回到底部后必须把 U 形桥主动切成三个箱与两个黏端，再用末手 B/S 位移把其中两箱
    重黏成目标横条，保留第三箱覆盖底目标。
  causal_chain:
    - "right,down：L 缺角转向，B/S 下移；三箱桥 C->M 并 sticky_merge 成 U 形。"
    - "left；right,right；left：U 形与 B/S 重新定位，并把远端目标格纳入共享刚体。"
    - "up 路线与一次 sticky pull：抬升 U 形，打开上方锚点通道。"
    - "right,right：从 L 侧横拉 P/L 两格，使 P/L 覆盖上方目标对。"
    - "回到底部连续 down：先把 U 形送到边界，再让桥排 sticky_to_box:n3 + sticky_split:n1。"
    - "末手 down：force_chain:n3 移动 B/S；两箱 box_to_sticky:n2 并 sticky_merge:n1，全部目标闭合。"
  why_not_execution: >-
    每段操作都改变后续责任：第一次拼接用独立箱换共享 U 形；抬升 U 形打开 P/L 路线；
    P/L 既要覆盖目标又要改变末段施力侧；切割把共享桥恢复成可分配箱；末手只重黏两箱，
    第三箱保留独立目标债。23 步中有 37 个非 walk 事件，但该指标只描述执行压力；玩家价值
    必须来自这些状态重读，而不能由指标本身证明。
  falsification:
    - "存在接近23步的简单 splitless 胜路；当前最短已知 splitless 为48步。"
    - "最短胜路可不移动任一锚点、可省略首次三箱桥拼接或终局重拼。"
    - "U 形抬升与 P/L 通道无因果关系，或 P/L 只是目标覆盖装饰。"
    - "玩家体验退化为唯一走廊按键、重复同操作或不可读路线税。"

