player_facing_reading:
  opening_read: >-
    开局全视野把三个问题并排摆出：左上 P/L 紧邻横向双目标但向左错位；中部 L 形黏块把玩家
    卡在缺角；右下三箱桥、远端黏格、B/S 与密集目标像一个尚未接通的 U。第一手可观察移动
    不是立刻承诺，真正的第一笔是把 L 形向右推出后从缺角向下拉。
  intended_solution_read: >-
    第一次 down 不是单纯移锚，而是把三箱同时刷成桥，突然将远端黏格接进一个大 U 形。
    玩家随后用同一 U 形反复左拉/右推，但每次都改变 B/S 相对位置；将其上提后，上方 P/L
    才能从 L 侧连续横拉到目标对。回到底部，向下推 U 形时桥排变成三个独立箱并切断两端；
    最后一推又把其中两箱黏回横条，第三箱不黏，正好承担底部独立目标。
  commitment_points:
    - "step2 B/S 下刷：三箱失去独立性并接成 U；事件和轮廓反馈立即可见。"
    - "step8 B/S 左移：改变 U/边界相位，为后续抬升和终局列对齐。"
    - "step16-17 P/L 横拉：覆盖上方目标对，同时把末段区域留在正确推侧。"
    - "step22 切桥：三箱一度覆盖中排目标，但底目标仍空，明确提示还需一次重拼。"
  state_responsibility:
    - "初始三箱：桥材料 -> U 形共享刚体 -> 切出的三箱；其中两箱终局重黏，第三箱保持独立。"
    - "远端初始目标箱：先被刷入 U，随 U 搬运；split 后成为独立黏端并回到 vacate 目标。"
    - "B/S：首次造桥、二次对齐、末手重织并覆盖底部锚点目标。"
    - "P/L：上路锁与全局施力边界；抬升 U 后才可横移，最终覆盖明确的目标对。"
  payoff_and_resolution: >-
    终局在连续两步中完成“切开—重织”：倒数第二步把长桥切成可分配箱并让两端分离，最后一步
    又移动 B/S，把两箱黏成目标横条而保留第三箱。玩家可从最终材质分布回读为什么开局要造 U、
    为什么中段要横移 P/L、为什么切割后不能停手。

