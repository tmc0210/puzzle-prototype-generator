prototype_context:
  confirmed_rules:
    - "P/L 锚点的 P 侧为推、L 侧为拉；B/S 锚点的 B 侧为箱、S 侧为黏。"
    - "两种锚点都是可平移、不可旋转的二格刚体；同类每关最多一个。"
    - "黏格四邻接自动合并；跨入 B 侧变独立箱，剩余连通块可产生 sticky_split。"
    - "任一刚体占格目标被墙、边界或不可移动结构挡住时整步失败。"
  win_condition: all_targets_covered_by_crate_sticky_or_anchor_after_settle
  object_and_event_semantics:
    player_on_goal_does_not_cover: true
    anchor_cells_cover_goals: true
    event_patterns_are_not_object_instance_proofs: true
  tool_boundary:
    runtime_adapter: implemented
    solver: implemented
    graph: implemented_but_budget_exhausted_for_exact_v10
    curated_miner: unavailable
    puzzlescript_exporter: unavailable

