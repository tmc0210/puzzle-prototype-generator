review_iteration: 1

prototype_context:
  confirmed_rules:
    - P/L 固定在 x=4/5；x<=4 为推世界，x>=5 为拉世界。
    - B/S 初始 S4/B5；右推一格后 S5/B6，并按新边界归一化 box/sticky。
    - 相邻 sticky 自动合并；sticky 跨到 box side 时变箱，剩余 sticky 按连通块分裂。
    - 五个目标必须同时由对象覆盖；玩家站上目标不算覆盖。
  win_condition: all_targets_covered_by_objects
  object_and_event_semantics:
    - 初始两条二格黏臂位于 (3-4,3)/(3-4,5)，三格箱柱位于 x=5、rows 3-5。
    - B/S 右移拼成七格 C；整块右拉后，上中两箱落在 (6,3)/(6,4) holding goals，下箱落在 (6,5)，两臂落在 x=4-5 并分裂。
    - 下箱只需右拉一格即可覆盖 (7,5) 门箱目标，但该箱会占住通往上臂的竖井底口。
  tool_boundary:
    - solver、complete graph、exact replay、event-avoiding gate 与顺序 monitor 只支持机械事实。
    - 工具不授予审美、难度或 proposal-ready。

slot_brief:
  intended_role: late_game_dual_anchor_capstone
  target: 双锚点、黏块拼接与切割的末期困难关卡
  difficulty_expectation: 目标5，最低接受4

mechanic_exposure_context:
  mechanic_window: all_current_reality_anchor_runtime_rules
  allowed_exposure_through: dual_anchor
  claimed_core_events: [anchor_boundary_shift:box_sticky, box_to_sticky, sticky_merge, move_sticky_rigid, sticky_to_box, sticky_split, pull_object]

design_target:
  aesthetic_score_target: 5
  difficulty_score_target: 5
  minimum_acceptable: {aesthetic: 4, difficulty: 4}
  target_role_notes:
    - 不把32步、唯一最终配置或 pilot band 当作困难依据。
    - 核心推理是读取“目标箱也是门”：覆盖它并不困住玩家，反而让玩家继续取得下臂进展后才发现上臂竖井被封。

