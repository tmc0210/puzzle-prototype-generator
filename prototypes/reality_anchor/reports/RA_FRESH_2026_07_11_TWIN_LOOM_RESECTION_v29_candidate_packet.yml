  player_start: [2, 10]
  player_goal: null
  win_condition: all_targets_covered_by_objects

mechanism_scope:
  central:
    - B/S 把三箱桥拼入双臂，P/L 拉侧允许整块横拉并在 x=6 切出三箱。
    - 横切同时完成两只 holding goals、分离上下黏臂，并把下箱对准 (7,5) 门箱目标。
    - 门箱覆盖后玩家仍可从 (8,5) 向下离开并完成下臂，但箱占住 (7,5) 后永久封住右侧上行竖井；因此上臂必须先于门箱。
  allowed_support:
    - 上方桥把完成上臂后的玩家送回竖井；门箱随后封井，玩家转入下方回路。
    - 下臂可以在门箱前后完成，不作虚假排他主张。
  incidental_allowed: [canonical_walk, lower_gate_commutation_after_upper, reversible_gate_crate_vertical_detour]
  required_winning_path_events: [anchor_boundary_shift:box_sticky, box_to_sticky, sticky_merge, sticky_to_box, sticky_split, pull_object, move_sticky_rigid]
  forbidden_winning_path_events: []
  forbidden_if_seen_anywhere: []

player_reasoning:
  canonical_trace_ref: prototypes/reality_anchor/reports/layout_analysis_RA_FRESH_2026_07_11_TWIN_LOOM_RESECTION_v29.json#/solution/inputs
  player_goal:
    description: 保持两只 holding crates 落位，用两条黏臂覆盖上下目标，并用下箱覆盖门箱目标。
    state_ref: initialState
  forced_setup_disclaimer:
    - step 1-2 的 B/S 拼接为强制铺垫，不申报矛盾。
    - step 3-14 的抵达与整体切割为强制铺垫，不虚构“不拼接/不切割”的 alternative。
  reasoning_units:
    - id: RU1_upper_before_gate_crate
      player_question: 切割后，门箱目标只差一次拉动，是否应先覆盖它再去处理两条黏臂？
      premises:
        - statement: 切割态玩家位于 (7,3)；向下两步到 (7,5) 后再 right，会把 (6,5) 下箱拉到 (7,5) 目标，三步均合法。
          state_ref: prototypes/reality_anchor/reports/RA_FRESH_2026_07_11_TWIN_LOOM_RESECTION_v29_alternative_report.yml#/alternatives/0/replay_steps
        - statement: 门箱覆盖后玩家位于 (8,5)，仍可向下离开，经下方回路完成下黏臂；因此错误不会即时终止。
          state_ref: prototypes/reality_anchor/reports/RA_FRESH_2026_07_11_TWIN_LOOM_RESECTION_v29_alternative_report.yml#/alternatives/0/delayed_progress_probe
        - statement: 上黏臂唯一把手在上方竖井；(7,5) 被门箱占住后，下方回路无法越过该箱返回竖井，holding crate 又封住 x=6 上行位。
          state_ref: prototypes/reality_anchor/reports/RA_FRESH_2026_07_11_TWIN_LOOM_RESECTION_v29_alternative_report.yml#/alternatives/0/result_state
      conclusion: 先沿尚未封闭的 x=7 竖井完成上臂；随后门箱可以封井，下臂在门箱前后均可完成。
      operation_refs: [SEG3_upper_arm, SEG4_return_and_gate_crate, SEG5_lower_arm]
      alternative:
        status: exact_trace
        description: 切割后先向下回到门箱目标，立即拉下箱上目标，再从下方出口继续处理下臂。
        local_gain: 一次对象操作就完成门箱目标；玩家仍有活动空间，并能继续完成下黏臂目标。
        from_state_ref: keySnapshots/step=14/after
        exact_inputs: [down, down, right]
        blocked_operation: 门箱占住 (7,5) 竖井底口；完成下臂后玩家仍在下方，上目标为空且没有回到上方把手的路径。
        result_state_ref: prototypes/reality_anchor/reports/RA_FRESH_2026_07_11_TWIN_LOOM_RESECTION_v29_alternative_report.yml#/alternatives/0
        concrete_outcome: 三步 exact replay 全部合法并覆盖目标；随后七步 exact delayed probe 还能完成下目标；从门箱结果态续搜 complete、512051 states、no-win。
      feedback:
        - state_ref: keySnapshots/step=18/after
          visible_change: 正确先完成上臂后，玩家从顶部桥返回 x=7 竖井；此时再封井不会丢失上方任务。
        - state_ref: keySnapshots/step=25/after
          visible_change: 门箱落位后，上目标已经安全完成，玩家转入下方回路。
        - state_ref: keySnapshots/step=32/after
          visible_change: 下臂覆盖最后一个空目标，五目标同时覆盖并胜利。
  operation_segments:
    - id: SEG1_forced_anchor_merge
      step_range: 1-2
      exact_inputs: [right, right]
      purpose: 强制铺垫；右推 B/S 拼成七格 C。
      supports_reasoning_units: []
    - id: SEG2_forced_reach_and_crosscut
      step_range: 3-14
      exact_inputs: [up, up, up, right, right, right, up, up, up, up, left, right]
      purpose: 强制铺垫；抵达上侧右把手并整体横拉，切出三箱、分离双臂。
      supports_reasoning_units: []
    - id: SEG3_upper_arm
      step_range: 15-18
      exact_inputs: [up, left, left, up]
      purpose: 在门箱封井前先完成上黏臂。
      supports_reasoning_units: [RU1_upper_before_gate_crate]
    - id: SEG4_return_and_gate_crate
      step_range: 19-25
      exact_inputs: [right, right, down, down, down, down, right]
      purpose: 从顶部桥返回竖井，把下箱拉到门箱目标并转入下方回路。
      supports_reasoning_units: [RU1_upper_before_gate_crate]
    - id: SEG5_lower_arm
      step_range: 26-32
      exact_inputs: [down, down, left, left, left, up, down]
      purpose: 门箱封井后从下方回路完成下黏臂并胜利。
      supports_reasoning_units: [RU1_upper_before_gate_crate]
  resolution:
    resolves: [RU1_upper_before_gate_crate]
    operation_refs: [SEG1_forced_anchor_merge, SEG2_forced_reach_and_crosscut, SEG3_upper_arm, SEG4_return_and_gate_crate, SEG5_lower_arm]
