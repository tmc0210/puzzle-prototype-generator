player_facing_reading:
  opening_read: >-
    玩家先看到一个只能向下推进的竖直 P/L、其旧 L 行右侧的 relay 箱与横向 B/S，
    下方则是一格已压目标的三格 L 形黏块和三个空目标。上方孤立目标没有直接箱路。
    开局小口袋允许左右观察，但前两个有效 commitment 是 P/L 下移；它们把玩家送到
    relay 同行并把该行改为 push side。
  intended_solution_read: >-
    relay 右推 B/S 后，L 形被改写成一个箱和一条竖直黏条。规范解把单箱下推，
    再站到 pull side 向左拉黏条；黏条不能被逐格处理，它整体左移、侧推单箱，且
    跨回 box side 后变成两枚箱。随后侧移箱被向上拉入目标，原 relay 则沿同列
    向上推入孤立目标，完成四个对象的职责回收。
  commitment_points:
    - P/L 两次下移和 relay 推 B/S 是前三个 forced viable setup；这是可读性优点还是难度损失需 critic 判断。
    - B/S 刷线后存在一个真实 dead commitment；错误处理输出会失去唯一 progress 关系。
    - 规范解 step_7 下推单箱后，step_8 左拉黏条是核心不可逆移交；另有 11 步同职责胜路，所以不声称唯一动作序列。
  state_responsibility:
    relay_crate: 先驱动 B/S，最后覆盖 [4,2]。
    split_single_crate: 由 L 形的 x=5 格转换而来，终局覆盖 [4,5]。
    remaining_sticky_pair: 先保持竖直刚体，左拉时侧推单箱并转成两箱，终局覆盖 [5,5] 与 [5,6]。
    push_pull_anchor: 下移两次生成旧 L 行 push 接口，之后被墙锁住避免普通腾挪 bypass。
    box_sticky_anchor: 被 relay 右移一次完成刷线，之后由墙限制第二次横移。
  payoff_and_resolution: >-
    开局看似分散的 relay、双锚点和三格 L 形最后收束成四个目标箱；关键左拉同时
    完成刚体换位、单箱移交和二格材料回收。上方孤立目标由开局 relay 在最后一手
    回收，兑现“driver 不是一次性按钮”。

archive_taste_context:
  examples:
    - candidate_id: RA_CAND_0022
      role: positive_5_aesthetic_4_difficulty_anchor
      human_scores: {aesthetic: 5, difficulty: 4}
      human_comment: >-
        这关的操作非常反直觉，将一个箱子先送入看似死局的死角，构造出拉锚点将两个箱子反向送入目标。
        空间利用率高，结构精巧。在较短的步骤中要求强玩家洞见以发现反直觉操作，是优秀的范例。
      calibration_use: 短步骤必须承载强洞见与空间职责，不能靠长度伪装难度。
    - candidate_id: RA_CAND_0025
      role: positive_4_4_constructor_anchor
      human_scores: {aesthetic: 4, difficulty: 4}
      human_comment: >-
        在狭小紧凑的空间中，将L形反复活塞这一关键高难结构赋予合适的包装以要求玩家主动构造，
        前几步构造不喧宾夺主，终局也有恰到好处的提示（右上角双目标暗示L形结构）。
        整体达到强4分水准。是构造关类型的优秀案例。
      calibration_use: 前置 setup 必须服务核心且不抢戏，终局目标形状应兑现材料读法。
    - candidate_id: RA_CAND_0024
      role: negative_1_aesthetic_anchor
      human_scores: {aesthetic: 1, difficulty: 3}
      human_comment: >-
        这关是算法指标看不出来的非典型反例。看起来机制利用率高，并且有“右上的目标竟然需要用角落里的锚点而非看起来更显然的箱子达成”这一反转。
        但是玩家看到三个黏块、两个可动锚点会期待更精彩的切割拼接、长链推动或黏块几何利用，实际却几乎只用推拉腾挪而缺乏玩家洞见。
        双锚点可动污染读题、最终只得到腾挪关；警示是不要迷信指标和探针，要从玩家角度思考。
      calibration_use: 双锚点与黏块信号必须在终局真实消费，不得用 probe 标签冒充 payoff。
    - candidate_id: RA_CAND_0027
      role: negative_1_aesthetic_anchor
      human_scores: {aesthetic: 1, difficulty: 2}
      human_comment: >-
        典型反例。推拉锚点能推但解法不需要推，黏块能黏但不需要黏；即使触发黏块转化、拼接标签，
        也完全没有使用黏块几何结构性质。玩家看到大量机制可能性却完全没用上，解法远低于预期。
      calibration_use: 所有显著 affordance 必须成为必要玩家职责；v3 用 all-solution gate 排除未移动锚点与未移动黏条胜路。
