prototype_context:
  confirmed_rules:
    - P/L 以标签朝向定义 push/pull 两侧，锚点是可移动二格刚体。
    - B/S 以标签朝向定义 box/sticky 两侧；合法动作结算后全局归一化材料。
    - 相邻 sticky 自动合并为刚体；刚体任一目标格受阻则整步失败。
    - push/pull 可沿运动方向通过多对象 force chain 传力。
  win_condition: 所有 G 必须被箱、黏块或任意锚点格覆盖；玩家不算覆盖。
  object_and_event_semantics:
    anchor_boundary_shift_push_pull: P/L 本体发生平移。
    anchor_boundary_shift_box_sticky: B/S 本体发生平移。
    sticky_to_box: 黏格跨到 box side 后转为独立箱。
    move_sticky_rigid: 至少一个 sticky 连通刚体发生整体平移。
  tool_boundary:
    runtime_adapter: available
    solver_and_complete_graph: available
    event_probes: available
    raw_sampler: available_but_not_used
    curated_miner: unavailable

