critic_items:
  - id: CI_player_goal_is_solution_assignment
    type: core_blocker
    target_ref: player_reasoning.player_goal
    design_relation: >-
      玩家在 step 0 看见三个目标、两根锚点、两个箱和一个黏格；尚未操作时，只能以“让对象覆盖全部目标”为目标，
      具体由 B、P 与末段切回箱分别承担哪个目标，应当是后续推理结论。
    attack: >-
      当前 description 直接写成“左、右目标由两枚锚点覆盖，底目标交给末段竖向黏块切回箱”，把完整目标分工与终局解法冒充玩家目标，
      使三个 RU 的结论部分提前泄露，无法检验问题是否在行动前真实存在。
    evidence_basis: solve_instance.layout; canonical.step_0; player_reasoning.player_goal.description
    player_facing_effect: 设计说明把待发现的计划写进目标，夸大了 reasoning units 相对玩家原始信息的解释增量。
    blocks_proposal_ready: true
    expected_designer_response: revise_claim
  - id: CI_ru2_impossible_step4_standpoint
    type: core_blocker
    target_ref: player_reasoning.reasoning_units[RU2_reposition_pl_for_second_bs].premises[0]
    design_relation: >-
      step 4 时 P/L 位于 x5,y2-y3，L 正占 (5,3)，玩家在 (4,2)；step 5 把 P/L 推到 x6 后，(5,3) 才变为空格，
      玩家随后可下走入该格并尝试向左输入。
    attack: >-
      premise 声称 step 4 时玩家可“直接走到 x5,y3 左推 B/S”，但该格当时被 L 占据，这个尝试不存在。
      真正可重放的错误路线始于 step 5：P/L 已右移、站位已释放，但边界仍是 pull 侧；缺少下推 P/L 才导致 alt2 失败。
    evidence_basis: canonical.step_4; canonical.step_5; alternative alt2 exact_inputs [down,left]
    player_facing_effect: 把“格子被锚点占据”和“空格属于 pull 侧”混成一个 premise，读者无法准确复原玩家何时获得站位、为何仍需第二次锚点移动。
    blocks_proposal_ready: true
    expected_designer_response: revise_claim
  - id: CI_ru1_forced_and_recoverable_alternative
    type: nonblocking_risk
    target_ref: RU1_borrowed_crate_lift.alternative
    design_relation: >-
      开局玩家只可在 (2,1)-(3,1) 观察，唯一可推进出口是把 (3,2) 箱下推；step 1 后再按 down 会把箱与 B/S 一起下移，
      但 packet 明示该局面可经长绕行恢复；canonical 则右推 P/L 后从下方上拉 B/S，将箱顶回原位。
    attack: alternative 有自然的局部收益，但既非不可逆矛盾，且开局主推进高度受限，玩家可能主要靠一次短试而非行动前分析选出 canonical。
    evidence_basis: routed_diagnostic initial_scc_size_2_with_one_forced_viable_exit; alt1.concrete_outcome; canonical.step_1-4
    player_facing_effect: RU1 可作为紧凑受力交接，不宜独立领走高难或强反直觉功劳。
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI_ru3_question_prescribes_payoff
    type: nonblocking_risk
    target_ref: RU3_merge_then_cut_vertical_pair.player_question and alternative
    design_relation: >-
      step 11 玩家看见下黏格在 (3,6)、初始黏格在 (5,5)；左拉一次到 (4,5) 后若向下，前格立即被 (3,6) 黏格挡住，
      再左拉一次则在 step 15 直接合并成竖条，step 17 左拉完成目标。
    attack: >-
      “怎样让底目标由一次跨界动作完成”预设了答案形式；alternative 又在投入一手后立即失败，且墙体与对象位置把后续方向压得很窄，
      因此该单元的真实问题应是如何把两个分离黏格组织成可送达底目标的对象，而不是预先指定“一次跨界”。
    evidence_basis: canonical.step_11; canonical.step_14-17; alt3 exact_inputs [left,down]
    player_facing_effect: 终局形状回报成立，但当前问法夸大了结论的发现性与难度。
    blocks_proposal_ready: false
    expected_designer_response: revise_claim
  - id: CI_upper_crate_weak_late_consumption
    type: score_boundary
    target_ref: design_target.aesthetic_score_target and slot_brief.target
    design_relation: >-
      上箱从 (3,2) 下推至 (3,3)，step 4 被 B 顶回 (3,2)，step 11 与下箱同步转成黏格；之后玩家只移动 (5,5) 初始黏格和 (3,6) 下黏格，
      上方新黏格不再改变目标覆盖、可走位、刚体形状或操作顺序。
    attack: >-
      “双箱转黏”是机械事实，但只有下箱继续参与合并与回切；上箱的后半角色停在展示同步事件，令“双箱转黏闭环”和“同一上箱跨阶段交接”比实际玩家回报更饱满。
    evidence_basis: canonical.step_11-17; mechanism_scope.central; design_target.target_role_notes
    player_facing_effect: 不破坏双锚 stage challenge 与审美 4，但削弱单一亮点的完整回收，阻止以现状主张审美 5。
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI_difficulty_ceiling_cheap_failures
    type: score_boundary
    target_ref: slot_brief.difficulty_expectation
    design_relation: >-
      RU2 的省步路线在 step 5 后只需 [down,left] 就以状态不变失败；RU3 的少拉一步路线也只需 [left,down] 即以状态不变失败，
      而 canonical 后续分别只有一次 P/L 下推与一次额外左拉来解除障碍。
    attack: 两个后段问题都有可见因果，但失败反馈即时、可归因且枚举成本低；完整图唯一与事件门不增加玩家洞见。
    evidence_basis: alt2; alt3; canonical.step_5-8; canonical.step_13-17
    player_facing_effect: 支持难度 4 的多阶段计划，不支持把更高难度建立在短失败分支或图规模上。
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking

diagnostic_interpretations:
  - graph_fact: complete graph has 381 reachable states, 837 legal transitions, 1 winning state, shortest depth 17, and 1 shortest input sequence
    neutral_meaning: 在声明预算内穷尽的状态图中，胜态与最短输入序列唯一；非最短可逆 detour 仍可存在。
    player_facing_interpretation: 说明 canonical 对当前版本有明确机械责任，但不说明玩家会自然发现，也不把唯一性、图规模或 17 步转写成审美与难度优点。
    verdict_effect: none
  - graph_fact: initial SCC size is 2 with one forced viable exit
    neutral_meaning: 起点只含一个两状态可逆观察区，继续走向胜利的出口唯一。
    player_facing_interpretation: 玩家开局可左右观察但主推进必须先推上箱；这降低 RU1 第一动作的选择难度，并支持将其“强洞见”功劳限制为 caveat。
    verdict_effect: caveat
  - graph_fact: complete probes found no winning path omitting the required event groups, and every win has at least 3 P/L shifts and 2 B/S shifts
    neutral_meaning: 当前规则与版本下，所有胜路机械上必须经过这些事件类别与最低锚点移动次数。
    player_facing_interpretation: 证明双锚都不是可绕过的摆设，但事件必要性本身不证明这些移动有趣；玩家侧价值仍来自 step 8/11 改变站位、侧别、目标责任和材料的具体后果。
    verdict_effect: none

handoff_notes:
  - >-
    结构无需因本轮 critic 结论自动改版；先把 player_goal 改为玩家在 step 0 真正拥有的覆盖目标，把目标分工移回各 RU 的 conclusion / resolution，
