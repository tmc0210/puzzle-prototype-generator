trace_metric_interpretation:
  calibration_status: pilot
  solution_execution_pressure:
    metric_fact: reality_anchor_trace_metrics_v0 对当前 17-input canonical trace 给出 aggregateBand 4；solutionCost band 3、nonWalkEventCount band 5、heavyReuseRatio band 1。
    allowed_reading: 规范解的机制事件与状态管理较密集；该指标不测洞见、因果、反直觉或审美。
    player_facing_check: >-
      step 2/4/5/8/11 的锚点移动分别改变操作侧、目标覆盖或材料状态，step 14/15/17 改变黏块位置、合并与切回，绝大多数被后续消费；
      但 step 11 后上箱转黏没有后续消费，且 step 12-13、16 是直接转位，故高执行压力不能整体转写为优点或更高难度。
    verdict_effect: caveat
  solution_space_reuse:
    metric_fact: 当前 canonical trace 的 revisitRate band 3、heavyReuseRatio band 1，aggregateBand 2。
    allowed_reading: 规范解不主要依靠反复回到同一工作区；该指标不判断一次性穿行是否优雅。
    player_facing_check: >-
      上区完成双锚交接后，玩家转入下区造竖条，空间责任随状态变化而迁移；没有仅凭低复用值可确认的 shuttle 问题，
      也不能据此提高或降低审美与难度分数。
    verdict_effect: none
  unmeasured_dimensions:
    - causal_dependency
    - player_reasoning
    - counterintuitive_reframe
    - surprise_and_payoff

aesthetic_target_fit: >-
  支持审美 4 保底，不支持当前 claim 的 5 分追求。双锚的操作侧交接最终兑现为两侧目标覆盖，底部转黏、合并、整条回切形成明确形状回报，
  已明显越过 RA_CAND_0024 的纯腾挪失败线；但上箱在 step 11 转黏后不再参与造形、目标或路线变化，所谓“双箱转黏闭环”只有下箱完成后半闭环，
  前段亮点也不如 RA_CAND_0022/0025 那样全部汇入一个无冗余的核心回报，因此以 4 为可信边界。
difficulty_target_fit: >-
  支持难度 4，不支持仅凭当前材料追求更高。玩家必须前瞻 P/L 下推如何同时保住右目标并改变 (5,3) 的操作侧，且须把 B/S 左移、下箱转黏、
  竖条合并与终手回切连成顺序因果；这不是靠长度成立。但 opening 只有一个 forced viable exit，RU2 alternative 一次失败即显侧别，RU3 alternative 也在一次廉价碰撞中排除，
  终局选择面窄，故更高难度缺少足够玩家侧搜索或重构依据。

language_drift:
  obvious_overpackaging: false
