candidate_version: RA_FRESH_2026_07_10_SQUARE_REPAIR_BIND_HANDOFF_v4
workflow: reality_anchor_redundant_element_prune
execution_order: 3
ran_after:
  - RA_FRESH_2026_07_10_SQUARE_REPAIR_BIND_HANDOFF_v4_goal_prune_check.yml
  - RA_FRESH_2026_07_10_SQUARE_REPAIR_BIND_HANDOFF_v4_opening_comfort_check.yml
analysis_base_after_opening_selection: opening_connect_left_start_7_6
redundant_element_prune:
  status: pruned
  sequence:
    - goal_prune
    - object_remove_prune
    - object_wallify_prune
    - space_prune
    - wall_outline_prune
  candidates_checked:
    - element: {kind: goal, id_or_cell: all_four_goals}
      action_tested: remove
      result: keep
      reason: 四个目标均命中成本下降或核心事件/偏移重绑旁路；详见 goal-prune 报告。
      hard_facts:
        cost_delta: "22->20 or 22"
        graph_status: complete
        expected_trace_win: true
        core_event_bypass: present_for_three_same_cost_removals
        opening_delta: not_applicable
        target_obligation_bypass: present
      semantic_role: structural
    - element: {kind: object, id_or_cell: fixed_PL_pair}
      action_tested: remove
      result: keep
      reason: >-
        P/L 本身不移动但所有原版胜路都需要 pull；删除后规范 trace 全程合法却最终不胜，
        500000 状态内未找到胜路且完整图超预算。按硬门槛 unknown 不得删除。
      hard_facts:
        cost_delta: "23->unknown_no_win_within_500000"
        graph_status: exhausted
        expected_trace_win: false
        core_event_bypass: unknown
        opening_delta: not_used_due_hard_gate_failure
        target_obligation_bypass: unknown
      semantic_role: structural
    - element: {kind: object, id_or_cell: fixed_PL_pair}
      action_tested: wallify
      result: keep
      reason: >-
        P/L 墙化后规范 trace 同样最终不胜，500000 状态图超预算；不能证明只是 blocker，
        而原版 fixed-anchor 完整证据证明其 pull 语义在所有胜路中必需。
      hard_facts:
        cost_delta: "23->unknown_no_win_within_500000"
        graph_status: exhausted
        expected_trace_win: false
        core_event_bypass: unknown
        opening_delta: not_used_due_hard_gate_failure
        target_obligation_bypass: unknown
      semantic_role: structural
    - element: {kind: object, id_or_cell: movable_BS_pair}
      action_tested: candidate_screen
      result: keep
      reason: B/S 在规范解中实际移动，且所有胜路需要 anchor_boundary_shift:box_sticky；不进入静态对象删除/墙化候选。
      hard_facts:
        cost_delta: not_tested_active_object
        graph_status: complete_baseline
        expected_trace_win: true
        core_event_bypass: none
        opening_delta: none
        target_obligation_bypass: none
      semantic_role: structural
    - element: {kind: object, id_or_cell: initial_M_and_three_crates}
      action_tested: candidate_screen
      result: keep
      reason: 每个材料格都移动或转换并参与四格形态链；删除任一格还会使材料数少于四目标，不进入冗余对象候选。
      hard_facts:
        cost_delta: not_tested_active_material
        graph_status: complete_baseline
        expected_trace_win: true
        core_event_bypass: none
        opening_delta: none
        target_obligation_bypass: material_count_below_goal_count_if_removed
      semantic_role: structural
    - element: {kind: space, id_or_cell: [2, 4]}
      action_tested: wall_prune
      result: keep
      reason: 这是唯一 static degree 1 普通地面，规范解最终玩家站在该格以完成第三次整体 pull；属于明确把手与胜利落点。
      hard_facts:
        cost_delta: not_tested_trace_occupied_hard_screen
        graph_status: complete_baseline
        expected_trace_win: true
        core_event_bypass: none
        opening_delta: none
        target_obligation_bypass: final_pull_handle_removed_if_walled
      semantic_role: structural
    - element: {kind: space, id_or_cell: remaining_floor_cells}
      action_tested: candidate_screen
      result: keep
      reason: 其余普通空地 static degree >= 2；低度走廊格均被玩家路径、对象路径、锚点把手或开局观察区消费，没有单入口无责任 pocket。
      hard_facts:
        cost_delta: not_tested_no_prune_candidate
        graph_status: complete_baseline
        expected_trace_win: true
        core_event_bypass: none
        opening_delta: selected_initial_scc_13_preserved
        target_obligation_bypass: none
      semantic_role: read_graph
    - element: {kind: wall_outline, id_or_cell: outer_left_and_right_wall_only_columns}
      action_tested: trim
      result: trim
      reason: >-
        左右最外列均为纯墙且删后仍保留完整一层外墙；相对结构、事件序列、图、开局指标
        与四个形态门不变。上下外框的相邻行含机制格或可走格，不能继续裁剪。
      hard_facts:
        cost_delta: "23->23"
        graph_status: complete
        graph_states: "165454->165454"
        winning_states: "1->1"
        expected_trace_win: true
        core_event_bypass: none
        opening_delta: "SCC 13->13; nearest win exit 1->1; dead exits before first win 0->0"
        target_obligation_bypass: none
      semantic_role: none
  removed_elements:
    - {kind: wall_outline, id_or_cell: original_outer_column_x0}
    - {kind: wall_outline, id_or_cell: original_outer_column_x13}
  wallified_objects: []
  trimmed_outline:
    - 删除左右各一列纯外墙，宽度 14->12；保留一层完整墙框。
  retained_elements:
    - {kind: goal, id_or_cell: all_four_goals, reason: structural_constraints}
    - {kind: object, id_or_cell: fixed_PL_pair, reason: required_pull_semantics}
    - {kind: object, id_or_cell: movable_BS_pair, reason: required_anchor_shift}
    - {kind: object, id_or_cell: all_four_material_cells, reason: active_shape_chain_and_material_count}
    - {kind: space, id_or_cell: all_remaining_spaces, reason: trace_object_route_read_graph_or_opening_comfort}
    - {kind: wall_outline, id_or_cell: top_and_bottom_frame, reason: required_complete_wall_frame}
  resulting_candidate:
    version: RA_FRESH_2026_07_10_SQUARE_REPAIR_BIND_HANDOFF_v5
    layout: prototypes/reality_anchor/reports/RA_FRESH_2026_07_10_SQUARE_REPAIR_BIND_HANDOFF_v5.layout.txt
    combines:
      - opening_connect_left_start_7_6
      - trim_outer_left_and_right_wall_only_columns
    requires_fresh_evidence_and_reviews: true
