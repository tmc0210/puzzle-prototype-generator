design_claim:
  player_insight: >-
    开局二箱力链不是把两个箱分别送目标，而是在同一列同时生成“底部已交付箱”和
    “仍需回收的上层载体箱”。玩家必须先利用 P/L 的上下两侧把竖锚右拉再左推，
    腾还之后抽取载体所需的窄把手；再把 B/S 连续左拉，把材质边界织入同一中央廊道。
    B/S 随后下移并以 B 端接管中央目标，载体箱则从原列被上抽、横抽过新边界变为 M，
    绕同一右廊回访后下拉覆盖右目标。三个目标因此分别由残余箱、B 锚和再生黏块接力完成。
  causal_chain:
    - P 侧下推二箱力链；远端箱覆盖底部目标，近端箱成为待回收载体。
    - 玩家在 L 行右移时拉动竖向 P/L，再从 P 行左推复位；复位释放稍后抽箱所需的 [2,2] 通道。
    - 玩家在 L 侧连续左拉 B/S 两格，把 B/S 边界从右廊移到中央廊道。
    - 从 [2,2] 上抽载体箱；随后下推 B/S，使 B 端覆盖中央目标并打开横向抽取线。
    - 连续右抽载体箱；它跨过已重定位的 B/S 边界变为单格 M，再继续右抽。
    - 玩家绕右廊回到下方，从目标格向下拉 M；M 回到右目标，三种目标责任同时闭合。
  state_reuse_claim: >-
    [2,2]-[4,2] 中廊依次承担 P/L 回返通道、B/S 泊位、载体箱抽取线和材质跨界线；
    右廊先承担锚点余量，后承担 M 的绕行与终局把手。回访必须对应局面责任变化，不能只是 shuttle。
  why_not_execution: >-
    Trace Metric 只能描述规范解执行压力与空间复用。难度与审美只来自玩家能否读出
    二箱残余债、P/L 回返门、B/S 目标接管和 C->M 反向交付的因果闭环。
    若 P/L 往返只是无信息按键、B/S 左拉只是重复拖动、或终局可以不理解职责接力而沿唯一走廊执行，
    则高空间复用不得作为优点，候选必须降档或返工。
  falsification:
    - 完整图不 complete、winning state 不唯一，或可胜 SCC 出现职责分叉/汇合，候选失败。
    - 任一胜路绕过 P/L 位移、B/S 位移、二箱 force chain、载体箱抽取、box_to_sticky、黏块刚体移动或三目标既定分工，候选失败。
    - 若可胜路改变 P/L 往返、B/S 定位、载体抽取、B 接管、C->M、M 交付的宏观顺序，候选失败。
    - 若独立 critic 的审美或难度低于 4，或 required_action 非 none，不得提交。

lexicon_used:
  - heading: P/L 横向把手：玩家前格门与锚点占格门
    realization: 竖放 P/L 在 L 行被右拉、在 P 行被左推复位；墙廊与回返格共同消费两套把手。
  - heading: P/L pull 抽取把手：前格门、占格目标门与扫带
    realization: L 侧先抽出水平 B/S，再从窄列抽出单箱；对象整体目标格与玩家前格共同限制合法性。
  - heading: P/L 边界交接 / 边界活塞本体谱：箱链残余债
    realization: P 侧推动二箱力链后，远端箱留在底部目标，近端箱作为后续载体债被单独回收。
  - heading: B/S 移动边界刷产物：远程生成与门口消费
    realization: 连续左拉把材质边界移到中廊，随后单箱横抽跨界成为 M，并由右目标与绕行把手消费。

new_linkage: >-
  二箱残余债 -> P/L 双侧回返门 -> B/S 中廊定位 -> B 锚目标接管 ->
  残余箱跨界再生为 M -> 同一右廊反向交付。目标不是三个独立归位任务，
  而是箱、锚、黏块在一条唯一责任链中的三段接力。
