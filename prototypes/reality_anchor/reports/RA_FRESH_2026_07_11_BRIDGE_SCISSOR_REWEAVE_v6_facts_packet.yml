  total_cost: 64
  entry_relation: >-
    先把完整 C 形右移一格，随后在尚未把 P/L 拉到底部前就把 B/S 右推两格切桥；
    玩家得到 x=6 三箱与 x=7 上下端点，但失去规范路线的共享 P/L 推杆时序。
  concrete_phases:
    - >-
      steps 15-30：只把 P/L 拉下两行，分别从 x=6 抽走下、中、上三箱，在狭小左侧工作区
