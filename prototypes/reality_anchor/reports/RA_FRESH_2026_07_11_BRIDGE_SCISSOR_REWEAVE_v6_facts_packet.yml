    - >-
      steps 38-48：不把两端点桥接；分别把上、下单格黏端点送到 x=8 的上、下目标。
    - >-
      steps 45-64：把 P/L 泊在 x=8 中目标；再逐只推动三箱回填 x=6 的上、中、下目标。
  concept_comparison: >-
    该路线的总体概念是“把五个切割产物和 P/L 分别分配给六目标”，比重织概念更直白，
    但要维护更多独立对象、反复让位、撤销/回填目标并执行64步；它不是另一条短而干净的洞见路线。
  risk_boundary: >-
    不能声称重拼为所有胜路硬门；逐件路线可能被穷举型玩家发现，作为审美5边界与试玩 caveat 保留。

