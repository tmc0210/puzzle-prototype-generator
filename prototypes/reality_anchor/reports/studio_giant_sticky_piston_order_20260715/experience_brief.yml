experience_core:
  experience_statement: >-
    玩家面对几个彼此空间分离、各自推上目标后若要离开就必须拉回撤销的 P/L 活塞，
    先建立“它们不可能逐个都作为最后一步”的矛盾；随后准备并操作一个视觉上完整的大型黏块，
    用分布在结构不同位置的多个触点在同一刚体动作中把所有活塞同时送入目标。
  visible_setup: 多个同形狭廊目标活塞与一件具有明显对称轮廓、可覆盖所有入口的巨大完整黏块同时可见。
  player_action: 先使各活塞处于可被共同推进的同相状态，再把完整大黏块送入承诺位并完成一次同步终局 stroke。
  visible_payoff: 大结构整体平移，多个远端触点同拍命中各自箱子，多个目标在同一帧同时由 G 变为 * 并立即胜利。
  why_level_exists: >-
    单个目标活塞只给出“必须最后完成”；本作品让多个“最后”互相矛盾，并让巨大结构的完整连通性、
    多触点几何和原子受力闭包成为唯一自然的矛盾解法。
  core_boundary:
    central_objects:
      - 至少两个真实 P/L 目标活塞箱及其被迫回撤狭廊
      - 一个在同步动作开始时完整连通的大型多格 sticky 结构
      - 分布在结构不同位置、同一动作命中多个活塞的触点
    supporting_objects:
      - 固定 P/L 与 B/S 锚点
      - 限制单锁退出与大结构行程的墙体
      - 开局观察与绕行空间

work_identity:
  conditions:
    - 每个目标活塞单独推入后，若关卡尚未胜利，玩家必须 pull 回撤并撤销该目标。
    - 同步终局动作开始前，大结构是一个视觉完整且机械连通的 sticky 刚体。
    - 同一次刚体移动通过至少两个空间分离触点推动至少两个独立目标箱，并立即达成所有目标。
    - 少一触点、少一结构连接或任一触点分支被墙拒绝时，不能得到同一同步胜利。
    - 巨大结构的准备、移动和终局使用属于同一因果链，前置对象不在高潮前退休。
  counterfactuals:
    - 若任一活塞有侧向出口可保留目标，则多个“最后”不再矛盾，核心退化。
    - 若逐个推箱也能累积所有目标，则巨大结构不再承担同步责任。
    - 若大结构可拆成多个小块分别完成目标，则完整结构身份消失。
    - 若最终只由一个局部触点完成目标，其余结构只是装饰，则作品身份失败。

baseline_brief:
  packaging_intent: direct_complete_realization
  expected_scale: 约 18 至 24 格完整 sticky，三个空间分离的目标活塞；开局可直接读出整体 E/三叉轮廓。
  expected_player_load: >-
    只要求建立“几个最后动作不能逐个保留—先把活塞同步到同相—整体结构一次收束”的计划；
    不把辨形、对齐、走位或巨大尺寸算作困难。

