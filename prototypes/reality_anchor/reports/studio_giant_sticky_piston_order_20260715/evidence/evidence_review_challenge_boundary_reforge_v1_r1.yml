    - "responsibility audit / canonical_roles：119 inputs，责任序列 OPPPTTBBRF。"
    - "responsibility audit / interleaved_tip_reorder：191 inputs，责任序列 OPPPTBTBRF。"
    - "responsibility audit / top_bottom_bottom_top_order：183 inputs，责任序列 OPPPTBBTRF。"
    - "responsibility audit / bottom_top_top_bottom_order：121 inputs，责任序列 OPPPBTTBRF。"
    - "responsibility audit / bottom_top_bottom_top_order：185 inputs，责任序列 OPPPBTBTRF。"
    - "responsibility audit / bottom_before_top：113 inputs，责任序列 OPPPBBTTRF。"
  equivalence_evidence_basis:
    - >-
      attack_v4_targeted.ts 的 walkReach 对每条走位边逐步调用 Reality Anchor runtime，
      只接受 legal 且 events 全为 walk；责任 DP 在 O1/P3/T2/B2/R1/F1 限额内按对象态、
      玩家纯走位可达分量和已用计数去重。
