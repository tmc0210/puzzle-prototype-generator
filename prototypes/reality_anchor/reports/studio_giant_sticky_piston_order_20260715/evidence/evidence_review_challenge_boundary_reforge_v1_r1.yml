      只产生六个 winning role sequences，全部为 OPPP 开头、RF 结尾，并保持 T 内部两拍与
      B 内部两拍各自顺序。
    - >-
      六个 audit 胜路都实际回放为胜，全部保持相同 O/P/T/B/R/F 对象职责、三目标分配、
      关键事件与最终对象布局；差异只是上端 T 与下端 B 两项独立必要任务的六种交错。
    - >-
      130-input canonical replay 与 119-input canonical_roles 的对象事件链和最终对象布局相同；
      差异在纯走位、发射接触行和胜态玩家位置，属于工作室标准允许的纯走位差异。
    - >-
      search_summary_v1.json 记录 raw graph 前缀、对象宏图与定向攻击均未发现已知非等价胜解；
      已知多条胜路均落入同一 OPEN -> SHIFT_PL -> REORDER_BOTH -> RESTICK -> FIRE 逻辑类。
