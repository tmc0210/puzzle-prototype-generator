runId: baseline_trident_sync_final_v4
title: RA_FRESH_2026_07_15_TRIDENT_SYNC_FINAL_v4 三叉 E 形同步终局的作品身份反事实
notes: >-
  基准 case 的 layout 与 RA_FRESH_2026_07_15_TRIDENT_SYNC_FINAL_v4 逐字相同；
  验证三个 P/L 目标活塞逐个不能累积、21 格完整黏体一次三触点终局，以及触点、连通性和狭廊出口的责任。
defaults:
  maxExploreDepth: 20
  maxReturnDepth: 24
  maxStates: 50000
  maxTransitions: 200000
cases:
  - id: base_three_tip_sync_win
    family: giant_sticky_multi_piston_sync
    variant: connected_three_tip
    changed_variable: base
    contrast_with: cf_missing_lower_tip
    notes: 完整 21 格 E 形先对齐，再一次原子力链同时推动三箱上目标。
