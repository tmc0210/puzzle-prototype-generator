runId: challenge_boundary_reforge_identity_v1
title: RA_FRESH_2026_07_15_BOUNDARY_REFORGE_MASK_v1 锁箱、P/L 侧别与隔离走廊逐版本实验
notes: >-
  所有 full-board probe 均由 exact v1 的机械状态逐格导出。锁箱 probe 只把玩家放到代表锁的局部操作位，
  保留 exact v1 墙、目标、箱、终态 P/L 与同阶段对象；P/L 三组 probe 仅改变 P/L 的横向停位；
  漏回黏错误态逐格等于 exact 初始关 113-input 回放的 final render。
defaults:
  maxExploreDepth: 1
  maxReturnDepth: 2
  maxStates: 2000
  maxTransitions: 8000
cases:
