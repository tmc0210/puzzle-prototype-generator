    family: boundary_reforge_lock
    variant: exact_v1_final_pl_representative_top_lock
    changed_variable: 玩家仅被放到上锁箱 P 侧的局部操作位
    contrast_with: tip_push_with_pl_final_three
    notes: left 将 x5,y4 箱推上 x4,y4 目标；玩家随即位于 L 侧，right 必须以 pull_object 把箱拉回。
