runId: challenge_cathedral_e_dock_sync_v4
title: RA_FRESH_2026_07_15_CATHEDRAL_E_DOCK_SYNC_v4 坞接选择与双锁终局反事实
notes: >-
  基准 case 与 challenge exact v4 layout 逐字相同。它核验同一根 9 格共享 L 龙骨的两个真实坞接：
  上坞连接 86 格主 E 后形成可拉动的 95 格完整结构；下坞同样连接主 E，却额外吞入笼中制动齿，
  形成 96 格完整结构并在同一 L 拉动上整体 force_blocked。反事实只用于机械身份，不用于证明难度或审美。
defaults:
  maxExploreDepth: 24
  maxReturnDepth: 28
  maxStates: 50000
  maxTransitions: 200000
cases:
  - id: base_upper_dock_then_atomic_double_lock_win
    family: cathedral_e_shared_handle_dock
    variant: exact_v4
    changed_variable: base
    contrast_with: lower_dock_complete_but_braked
    notes: 上坞把 9 格共享 L 龙骨并入 86 格主 E；随后同一龙骨左拉，让上下远端触点同拍完成两个目标锁。
    layout: |
      #####################
      #...................#
      #...##############..#
      #..#GCMMMMMMMMMMMM#.#
      #...##.......MMMMM#.#
      #...........MMMMMM#.#
      #.............MMMM#.#
      #..........MMMMMMM#.#
      #............MMMMM#.#
      #..............MMM#.#
      #....#MMMMMMMMM.MM#.#
      #...@..........MMM#.#
      #.....#M#....MMMMM#.#
      #......#...MMMMMMM#.#
      #.............MMMM#.#
      #...........MMMMMM#.#
      #...##.......MMMMM#.#
      #..#GCMMMMMMMMMMMM#.#
      #...##############..#
      #####LP##############
      #####BS##############
      #####################
    actions: [right, right, up, down, left, left, up, up, right, left]

  - id: lower_dock_complete_but_braked
    family: cathedral_e_shared_handle_dock
    variant: wrong_lower_dock
    changed_variable: 把同一共享龙骨向下坞接
    contrast_with: base_upper_dock_then_atomic_double_lock_win
    notes: 第八拍发生真实 sticky_merge；最终得到含主 E、龙骨和制动齿的单一 96 格结构，第十六拍 left 整体 force_blocked。
    layout: |
      #####################
      #...................#
      #...##############..#
      #..#GCMMMMMMMMMMMM#.#
      #...##.......MMMMM#.#
      #...........MMMMMM#.#
      #.............MMMM#.#
      #..........MMMMMMM#.#
      #............MMMMM#.#
      #..............MMM#.#
      #....#MMMMMMMMM.MM#.#
      #...@..........MMM#.#
      #.....#M#....MMMMM#.#
      #......#...MMMMMMM#.#
      #.............MMMM#.#
      #...........MMMMMM#.#
      #...##.......MMMMM#.#
      #..#GCMMMMMMMMMMMM#.#
      #...##############..#
      #####LP##############
      #####BS##############
      #####################
    actions: [up, up, up, right, right, right, down, down, up, left, left, left, down, down, right, left]

