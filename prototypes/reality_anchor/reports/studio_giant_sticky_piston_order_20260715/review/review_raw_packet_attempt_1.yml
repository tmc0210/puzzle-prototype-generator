review_attempt_id: RA_GIANT_STICKY_PISTON_ORDER_REVIEW_1
prototype_id: reality_anchor
review_scope: segment

prototype_rules:
  confirmed_rules:
    - 玩家每次输入一个正交方向；空格可行走。
    - 有 P/L 时，以输入前玩家位置相对移动边界选择 push 或 pull；锚点本身也可被推拉，移动后边界随之改变。
    - push 移动玩家前方对象；pull 要求玩家前格为空，并移动玩家及其身后对象；力可向其它可动物传播。
    - 有 B/S 时，每个合法动作后按移动边界把箱与黏块全局归一化；锚点本身也可被推拉。
    - 正交相邻 sticky 合并成单一刚体；刚体任一目的格受阻会阻断整块移动。
  win_condition: settle 后所有目标格都被箱、黏块格或锚点格覆盖；玩家不计入覆盖。
  object_and_event_semantics:
    - C 为普通箱，M 为黏块格，G 为空目标，* 为被箱覆盖的目标。
    - P/L 分别标记 push 侧与 pull 侧；B/S 分别标记 box 侧与 sticky 侧。
    - force_chain 表示一次对象移动同时推动其它可动物；anchor_boundary_shift 表示对应锚点实际改变位置。

