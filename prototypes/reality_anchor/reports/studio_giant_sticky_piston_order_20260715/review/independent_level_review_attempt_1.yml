independent_readings:
  - slot: baseline
    candidate_id: RA_FRESH_2026_07_15_TRIDENT_SYNC_FINAL
    exact_version: v4_sha256_39839eef5d8c118500a0e4f3a48bfb9e38819fbb8a3cf06f6210f1e6ae58772b
    opening_read: >-
      开局中央是一整块巨大三叉黏块：一条竖脊在上、中、下伸出三条等长横臂，
      每条臂尖正对一组 C-G；玩家位于结构右侧，B/S 与 P/L 位于上方并给出当前材料侧与推侧。
      玩家首先看见的是“三条臂能否由同一次刚体移动同步做功”，而不是三个分离小题。
    player_actually_does: >-
      玩家沿开放通路绕到三叉左侧，在同一方向连续右推整块黏块两次。
      第一次让三条臂同时靠近各自箱子；第二次继续移动同一刚体并形成三路 force chain，
      把三只箱子同时推上目标，同时三枚臂尖在 B/S 边界下由黏块切成箱材。
    key_visible_changes:
      - >-
        step 13：全部 21 个黏块格保持连通并整体右移一格，三条臂同时从“隔一格”进入贴近三只箱子的准备态；这不是只改变玩家位置。
      - >-
        step 14：同一整块再次右移，三只箱子同步覆盖三个目标，三枚臂尖同步变为 C；棋盘在一次输入中从三路待发变为三路同时兑现。
    visible_payoff: >-
      回报集中在最后一次右推：巨大三叉的整体性被三路同步 force chain 直接看见，三个目标同帧覆盖，
      并以三枚同步切出的箱材留下清楚终局痕迹。
    ending_read: >-
      step 14 的同步推动即为胜利终局，高潮后没有清理、复位或额外赶路；全部三条臂、三只箱子与三个目标都在终局构图中保持可见。
    exact_basis:
