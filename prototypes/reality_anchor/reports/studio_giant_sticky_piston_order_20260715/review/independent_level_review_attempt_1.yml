role_and_difference_reading:
  baseline_complete_not_minimal_witness: >-
    成立。它虽然直接且核心对象操作只有两次整体右推，但作品不是把单格机制 witness 封进显然操作：
    开局用一个连通三叉同时建立三路预期，第一次推移统一进入接触态，第二次由同一刚体同步推动三箱并同步切出三枚臂尖，
    三目标同帧兑现后立即结束。其完整性来自清楚的三路形式关系与集中终局，不依赖把识形、对准、走位或操作精度虚构成难度。
  application_real_delta_from_baseline: >-
    成立。baseline 直接给出已连通、可发射的三叉；application 开局只给巨大主体与尚为箱材的上下延伸，
    玩家必须亲自移动 B/S 三次，让 2、2、4 个箱格依次转黏并并入同一刚体，然后才可从左侧发射。
    若这些材料预先全为黏块，关卡会退化为 baseline 式“到发力侧后整体一推”，因此新增责任是实际作品中的条件构造，不是地图放大或形式换皮。
  combination_other_non_prerequisite_mechanism: human_brief_exempt_not_reviewed
  combination_player_visible_relation: human_brief_exempt_not_reviewed
  challenge_real_ceiling_attempt: >-
    成立。challenge 不靠巨大题面和长走位申报上限；真实增量是先用 B/S 把同一整体的五齿拆为可单独处理的箱材，
    再改 P/L 操作边界，把上下两枚材料从相反方向送入三路活塞位，随后用 B/S 重黏，最后才允许一次整体左推同步做功。
    玩家必须跨越“整体不能直接用—拆开局部处理—重新成为整体”的多阶段计划，两个边界、五枚切出材料、三只目标箱和整个巨大刚体都进入最终因果链。
  common_core_still_recognizable: >-
    三关共同核心清楚可辨：一个远大于普通局部对象的连通黏块，以多个彼此分隔但几何对齐的活塞端在同一次刚体移动中同步推动多只箱子，
    并在 B/S 材料边界处留下同步切分的终局反馈。baseline 直接呈现，application 先锻造整体，challenge 先拆齿、局部就位再重铸整体；共同关系没有丢失。
  pairwise_player_experience_differences:
    - pair: baseline_vs_application
      reading: >-
        baseline 的玩家责任是读出并触发一个已完成的三路同步活塞；application 的玩家先通过连续可见的边界材料变化亲自完成巨大刚体，再触发双路同步。
        移除 application 会损失“把混合箱材逐段锻成整体后再使用”的体验，而非只损失另一种外形。
    - pair: baseline_vs_challenge
      reading: >-
        baseline 保持整体连通直至终局；challenge 必须暂时破坏整体，把关键齿变成独立箱并分别就位，再恢复连通后发射。
        移除 challenge 会损失“为了最终整体做功而先拆开、远程处理、再重铸”的多阶段规划。
    - pair: application_vs_challenge
      reading: >-
        application 是单向累积式锻造：边界逐步吸收材料，完成后一次使用；challenge 是可逆重构：先从整体切出材料、换操作边界、分别布置，再把材料黏回整体。
        二者都增加玩家作者性，但责任方向、阶段结构和局部材料自由度实质不同，不可互相替代。
  substitution_or_degradation: none_found
  role_misalignment: none_found
  blockers: []

segment_readiness:
  reviewed_slots:
    - baseline
    - application
    - challenge
  combination_status: human_brief_exempt_not_reviewed
  current_exact_versions_status: survive_to_pre_submission_checks
  basis: >-
    三个送审 exact version 各自无明确、可感、同题可修的 blocking 缺点，各自承担对应角色，
    且在同一巨大黏块多路活塞核心上形成直接呈现—主动锻造—可逆拆分重铸的真实递进。
