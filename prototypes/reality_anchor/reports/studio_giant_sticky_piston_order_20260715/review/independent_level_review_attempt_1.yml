      前两次各吸收两格，第三次同时吸收四格，形成上下两条可共同传力的长臂。
      随后玩家绕到主体左侧，只推一次整块黏块，便通过多路 force chain 把上下外侧箱同步送上目标。
    key_visible_changes:
      - step 1：B/S 右移，两个箱格转成黏块并与主体合并，上下对应部位同时长出第一段连接。
      - step 2：B/S 再右移，又有两个箱格转成黏块，上下长臂继续同步延伸。
      - step 3：B/S 第三次右移，四个箱格同时转黏并合并，原先混材的上下结构成为一个完整的巨大刚体。
      - >-
