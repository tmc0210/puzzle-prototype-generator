        - HP_RA_FRESH_2026_07_11_TWIN_LOOM_RESECTION_v31_001
      selection_reason: >-
        与“顺序”和大题面最相关的负例。人类原评否定的是开场事件不被后续复用、最终只剩显然重复顺序锁，
        不是单纯否定地图大或存在长路径；据此检查本批 challenge 的边界改造、分离材料与巨大黏块是否都进入最终因果链。
