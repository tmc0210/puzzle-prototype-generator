archive_calibration:
  index_or_summary_ref: prototypes/reality_anchor/design_archive/index.yml
  selected_anchors:
    - candidate_id: RA_CAND_0029
      calibration_role: positive
      human_comment_refs:
        - prototypes/reality_anchor/design_archive/candidates/RA_CAND_0029.md#human-verdict
        - HP_STUDIO_L_1_001
      selection_reason: >-
        与本批最直接相关的黏块活塞正例。人类原评认可的不是“发生了两次推动”这一事件数量，
        而是同一组要素在两个不同局部结构中先后承担推动与回收责任；据此校准本批每个阶段是否真的改变对象关系并继续被后续消费。
    - candidate_id: RA_CAND_0020
      calibration_role: negative_or_boundary
      human_comment_refs:
        - prototypes/reality_anchor/design_archive/candidates/RA_CAND_0020.md#human-verdict
        - HP_RA_LEX_2026_07_08_SPLIT_BRIDGE_DUAL_ENDPOINT_v1_001
      selection_reason: >-
        与本批多分支同步最相关的边界例。人类原评明确承认三个分支的行动本质重复，
        但清楚的几何对称仍使其成为完整可用作品；据此不把本批三路同步本身误判为空洞重复，同时仍检查各路是否共同兑现同一次可见回报。
