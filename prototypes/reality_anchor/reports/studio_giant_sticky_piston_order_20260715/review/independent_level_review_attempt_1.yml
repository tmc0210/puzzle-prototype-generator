    exact_version: v1_sha256_027825ee031100ce6600d163cf967201c0670ee356ffe98362e335b4ec573541
    opening_read: >-
      开局巨大不规则黏块面具占据上部主体，左侧有上、中、下三个凹入的 G-C 口袋；
      面具左缘另有五枚纵向黏块齿，其中三枚与目标口袋同高、两枚承担上下段连接。
      B/S 与玩家位于下方服务区，P/L 在更下一层。玩家首先面对的是：巨大刚体尚不能直接把三只箱子送入左侧目标，
      必须先借两个可移动边界把若干齿拆成可单独处理的材料，重新就位后再接回整体。
    player_actually_does: >-
      玩家先向右拉动 B/S 一格，把面具边界上的五枚黏块齿切成五只普通箱；
      再把 P/L 向左拉三格，改变上部操作区的推拉侧。随后玩家进入面具通路，
      将最上方切出箱向下推两格、最下方切出箱向上推两格，使它们与本来已经就位的中间箱共同占据三个凹口后的活塞位。
      玩家回到下方把 B/S 向左拉回一格，五只箱重新变成黏块并与主体合并；最后从面具右侧向左推动整个刚体一次，
      三个重新锻入整体的活塞同步把三只原有箱推上左侧三个目标。
    key_visible_changes:
      - >-
