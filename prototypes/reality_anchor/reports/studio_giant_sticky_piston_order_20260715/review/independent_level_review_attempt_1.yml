      - >-
        step 13-15：P/L 连续左移三格，操作边界实际换位，为随后在面具内部推送切出箱建立推侧；该锚点位置改变被后续箱操作使用。
      - >-
        step 59-60：上方切出箱被向下送入上凹口后的活塞位；step 99-100：下方切出箱被向上送入下凹口后的活塞位；中间活塞位从切出时已经对齐，三路因此形成同一终局构图但准备责任不同。
      - >-
        step 107：B/S 左移并发生 box_to_sticky:n5、sticky_merge:n1，五只箱重新黏回主体；此前分别处理的上、中、下齿现在重新成为同一巨大刚体的三个做功端。
      - >-
        step 130：整个面具左移，三路目标箱同时被推上目标，并发生 sticky_to_box:n5；拆分、边界换位、局部就位与重黏在同一个最终动作中统一兑现。
    visible_payoff: >-
      主要回报集中在“重黏后的一次整体左推”：玩家先前分开处理的三个活塞位突然重新表现为一个巨大刚体的同步三路输出，
      三个左侧目标同帧覆盖。step 1 的五齿拆分、两处箱位调整和 step 107 的重黏都直接决定这一终局，而不是独立过场。
    ending_read: >-
