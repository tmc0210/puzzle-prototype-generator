slot_and_portfolio_reading:
  baseline_complete_not_minimal_witness: >-
    成立。它虽然只需两次关键推动，但作品主语是三个真实 P/L 目标活塞顺序锁之间的
    “不能分别保留、必须同拍”矛盾；21 格完整三叉刚体同时承担三处远程接触，第二拍给出
    三处集中反馈。它不是把单个规则 witness 封进几步显然操作。
  application_real_delta_from_baseline: >-
    成立。baseline 直接给出完整三叉驱动体；application 要玩家实际移动 B/S，分三拍把
    8 只散箱并入同一主体，建立 29 格同步轮廓，并让边界终位在末拍继续决定推杆切分。
    预先满足这段构造责任才会退化为 baseline 式整块发射，因此差异是玩家作者性而非放大。
  combination_other_non_prerequisite_mechanism: >-
    human brief 明确豁免 combination 槽，本批无 combination 候选；不以缺槽、缺另一机制扣分。
  combination_player_visible_relation: human_brief_exempt_not_applicable
  challenge_real_ceiling_attempt: >-
    成立。challenge 的上限来自非单调计划：切出完整结构的五个触点、移动 P/L 改变操作相、
    向相反方向重排上下触点、撤销切分并复黏、最后才移动 107 格完整刚体。判断不使用
    130 步、题面大小、结构识别、触点对齐或普通走位作为难度证据。
  common_core_still_recognizable: >-
    三关都把封闭 P/L 目标活塞的不可分别保留关系，交给一件完整黏块从 P 侧远程同拍解决；
    最终回报都是一次整块 stroke 同时推动多个终端箱。baseline 预制、application 锻造、
    challenge 重铸触点，改变的是玩家与同一核心的关系，没有丢失共同核心。
  pairwise_player_experience_differences:
    - >-
      baseline vs application：前者读取预制三叉后直接发射；后者先用 B/S 把 8 只散箱逐列
      并入最终刚体，亲手建立同步条件。差异不是目标换位或多几步。
    - >-
      baseline vs challenge：前者接受正确触点轮廓并向右发射；后者必须先把错误轮廓切开，
      经过换相与上下反向重排后复黏，再向左发射。差异是非单调计划责任。
    - >-
      application vs challenge：前者的构造是单向吸收材料并立即使用；后者先拆掉既有完整性，
      只移动两个关键触点，再恢复完整性，P/L 也从固定边界变成必须主动迁移的计划工具。
  blockers: []
  segment_verdict: survive_to_pre_submission_checks

