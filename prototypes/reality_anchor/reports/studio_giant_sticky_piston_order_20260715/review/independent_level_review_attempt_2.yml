  - slot: challenge
    candidate_id: RA_FRESH_2026_07_15_BOUNDARY_REFORGE_MASK
    exact_version: v1_sha256_027825ee031100ce6600d163cf967201c0670ee356ffe98362e335b4ec573541
    mechanical_judgment: >-
      exact initial state 是一个 107 格单连通黏块，左边界五个 x=6 触点位于 y=2、5、9、13、16，
      而三个左向 P/L 目标活塞位于 y=4、9、14，开局触点分布不能完成三处同拍。
      step 1 实际右移 B/S，把五个触点切成箱，主体仍为一个 102 格连通块；step 13..15
      实际左移 P/L 到 L:x=5、P:x=6，为 x=6 切出箱换到可推相。step 59..60 把最上箱
      从 y=2 推到 y=4，step 99..100 把最下箱从 y=16 推到 y=14，中部 y=9 保持；
      step 107 把 B/S 拉回，五箱全部转黏并重新合成一件 107 格刚体。step 130 从右侧左推
      整块，五格跨 B/S、三处对齐触点触发 force_chain:n4，三个原箱同拍进入目标。
    player_side_judgment: >-
      玩家面对的计划责任不是识别巨大图案或执行 130 步，而是先承认完整黏块的现有触点
      不对，主动破坏它；再用 P/L 换相，使两个远端切出格能沿相反方向移到正确行；随后
      撤销切分、复黏成一个完整刚体，最后才允许整块发射。任何单个目标的直接完成都会把
      玩家留在 L 侧回返关系中，不能作为继续处理其余目标的稳定状态；只有重排后的完整
      刚体能从 P 侧一拍保留三处。巨大主体贯穿切分前、重排参照、复黏和最终 107 格刚体
      运动，不是围绕五个小格摆放的背景。
    opening_read: >-
      玩家首先看到一件几乎占满上部的完整黏块、左侧三个封闭 C-G 活塞口，以及黏块左缘
      五个并未全与活塞口同高的可切触点；下方相隔的 B/S、P/L 明确提供“先拆触点、换相重排、
      再恢复整块”的可能性。
    player_actually_does: >-
      先移动 B/S 切出五格，再移动 P/L 改变这些箱所在列的推拉相；把最上触点下移两格、
      最下触点上移两格，中间触点保留；随后把 B/S 拉回让五格复黏，绕到巨大刚体右侧，
      用最后一次左推同时发射三处活塞。
    key_visible_changes:
