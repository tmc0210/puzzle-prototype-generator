  - slot: application
    candidate_id: RA_FRESH_2026_07_15_FORGED_C_SYNC
    exact_version: v6_sha256_31debfe814fda7a58cc198234445f2b0d58d8aba063fc8b473e3364bded03879
    mechanical_judgment: >-
      exact initial state 只有一个 21 格、单连通的 3x7 黏块主体，右侧十只散箱尚未形成
      同步驱动轮廓。replay step 1..3 连续实际移动 B/S；每次 settle 分别把 2、2、4 只箱
      转成 sticky 并并入同一连通块，使主体按 21→23→25→29 格生长。B/S 终位仍决定
      最后一拍的材料边界。step 12 把这件 29 格完整刚体右推，触发 force_chain:n3 与
      sticky_to_box:n4；两个封闭 P/L 目标端点在同一 settle 中覆盖，构造材料同时承担
      推杆、连接和末拍再切分责任。
    player_side_judgment: >-
      相对 baseline，玩家不再接收预制完成的同步轮廓，而是亲手移动 B/S，让散箱逐列被
      吸收进同一件大黏块，并必须把边界停在能同时保留两处远端触点的位置。直线锚点操作
      虽受几何强引导，但每拍都改变最终对象关系，且产物在高潮中被完整使用；它不是把
      baseline 放大或多走几步。两处 P/L 端点仍不能作为可继续推进的独立保留状态，
      玩家最终用自己造出的统一刚体从 P 侧一次发射两处。
    opening_read: >-
      玩家先看见左侧厚实黏块、右侧上下镜像的散箱枝条和两个 C-G 终端；B/S 就在玩家身旁，
      三者的横向对齐直接提出“把散箱锻成一件能同时够到两端的完整结构”这一操作关系。
    player_actually_does: >-
