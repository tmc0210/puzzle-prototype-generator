    visible_payoff: >-
      最后一拍让巨大完整黏块整体移动，并在三个相距很远的活塞口同时出现 *；
      高潮把切分、P/L 换相、触点重排和复黏全部收束为同一个可见因果结果。
    ending_read: 整块左推后立即胜利；130 个输入中的普通绕行不作为难度依据，高潮后也无清理。
