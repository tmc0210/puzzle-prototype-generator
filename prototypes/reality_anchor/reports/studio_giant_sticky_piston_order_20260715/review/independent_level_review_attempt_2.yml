independent_readings:
  - slot: baseline
    candidate_id: RA_FRESH_2026_07_15_TRIDENT_SYNC_FINAL
    exact_version: v5_sha256_79dcb407d4464dc53e839129afb4e511a7785166d99a8fa58ad093509c9bdee4
    mechanical_judgment: >-
      exact initial state 是一个 21 格、单连通的三叉黏块，三个右端分别隔一格对准
      x=10 的 C 与 x=11 的 G；P/L 的 P、L 分居 x=9、x=10，三个端点都构成封闭的
      L 侧目标活塞位。逐个直接推入会让玩家进入 L 侧封闭回返位，继续离开会撤销目标；
      replay step 13 先把同一 21 格刚体整体右移，step 14 再次整体右移，三个端点同拍跨过
      B/S，触发 force_chain:n4 与 sticky_to_box:n3，并在一个 settle 中同时覆盖三个目标。
    player_side_judgment: >-
      玩家开局读到的不是三个可分别完成的小目标，而是三个不能分别保留的 P/L 顺序锁
      与一件恰好同时伸向三处的完整三叉刚体。实际解答责任很直接：找到刚体左侧操作位，
      用第一次推动让三臂同时接触，第二次推动远程发射全部端点。巨大完整黏块是唯一把
      三处锁从 P 侧同拍驱动的主体，不是背景；直白不等于最小 witness，因为被完整兑现的
      是三个真实锁之间的共同矛盾与一次集中反馈。
    opening_read: >-
      玩家首先看见一件横跨三层的完整三叉黏块；三条长臂右端以同样间距指向三个 C-G
      封闭端点，远处固定 P/L、B/S 的共同竖直边界让“分别推上去会被回撤、需要远程同拍”
      可以直接从题面读出。
    player_actually_does: >-
      玩家绕到上臂左端，连续两次向右推动同一个黏块刚体；没有逐个处理三个箱子，
      也没有把任一目标作为可保留的中间完成状态。
    key_visible_changes:
      - >-
        step 13：21 格黏块保持单一刚体，从 x=4..8 整体移到 x=5..9，三条臂同时贴近各自箱子。
      - >-
        step 14：同一刚体再次右移；三个端点同时转成箱，三只原箱同时被推到 G，
        题面在三条相距较远的行上同时出现三个 *。
    visible_payoff: >-
      第二次整块推动把三个原本不能分别保留的目标在同一个输入、同一次 settle 中全部点亮；
      回报集中且与开局三叉轮廓一一对应。
    ending_read: 第二次推动立即胜利，高潮后没有清理、回收或额外走位。
    exact_basis:
