source_and_hash_verification_checklist:
  build_command: npx tsx src/playable/exportPlayable.ts prototypes/reality_anchor
  runtime_capability: runtime_backed_playable_available_scaffold
  unsupported_claims: [puzzlescript_exporter, puzzlescript_checker]
  checks:
    - 在写入前重算三个 exact txt 的 byte SHA256，并与本草稿 exact_layout_byte_sha256 一致。
    - 从 levels.yml 解析三个 id；分别只有一条，title、layout、lineage、design_notes、expected_trace 均非空。
    - 将解析后的 level.layout 与 exact txt 统一 LF 并移除单个尾换行后逐字比较，同时核对 normalized SHA256。
    - 重放三个 expected_trace，要求 14/12/130 步全部 legal 且最终 win；事件使用现有 LevelDoc 接受的基名。
    - queue 三条必须是 source=package、level_id=对应 exact id、status=pending_playtest；catalog key 应为 package:<level_id>。
    - 重建 playable 后，在 playable/data.json 中按 id 精确找到三关，且 layout 规范化 hash 与 exact source 一致。
    - challenge 的导出说明仍为 unique_within_budget，并保留 raw graph exhausted@30000 边界；不得出现 unique_complete 或完整 SCC 唯一表述。
    - human handoff 的 playtest_status 只能是 pending_playtest，archive_status 必须是 not_archived_waiting_for_playtest。

audit_limits:
  - 本草稿未读取或假设 latest whole review verdict；所有相关 ref/status 均为显式占位符。
  - 本草稿没有修改 levels.yml、playable_queue.yml、playable 产物或 portfolio.yml。
  - pre_submission workflow 的 completed 表示规定检查已实际执行；challenge 的 kept_with_unknown 不等于 clean，也不授权裁剪。
