attempts:
  - attempt_id: BASELINE_TRIDENT_V1
    slot: baseline
    material_refs: [MAT-01, MAT-02]
    structural_hypothesis: >-
      三叉 E 形的三个等长前臂在第二次右推中同时接触三只箱；上下箱初始在目标且被终墙卡住，
      迫使玩家先各自拉回，同相后才能把 E 形推进承诺位并完成原子三触点终局。
    actual_result: >-
      完整图发现 cost=3 的直接旁路 down,down,right：上下目标开局已覆盖，玩家把中箱推入即刻胜利；
      大结构、同相化和同步 stroke 全部未参与。
    status: rejected_identity
    artifact_refs:
      - candidates/baseline/RA_FRESH_2026_07_15_TRIDENT_SYNC_RESET_v1.txt
  - attempt_id: BASELINE_TRIDENT_V2
    slot: baseline
    material_refs: [MAT-01, MAT-02]
    structural_hypothesis: >-
      在 E 形第二次右移才覆盖的位置增加结构目标，使单独推任一活塞后仍需离开并撤销；
      上下星箱若不先撤回又会在终墙前阻断整条三触点力链，因此玩家必须先同相化三箱、再推进完整结构。
    actual_result: >-
      cost=14 旁路只移动 E 形两次并推动中箱；上下箱始终留在目标，终态与“先撤回再推回”机械同一。
      原型没有历史锁存，故开局已覆盖目标无法承担必须先撤回的可证责任。
    status: rejected_identity
    artifact_refs:
      - candidates/baseline/RA_FRESH_2026_07_15_TRIDENT_SYNC_RESET_v2.txt
  - attempt_id: BASELINE_TRIDENT_V3
    slot: baseline
    material_refs: [MAT-01, MAT-02]
    structural_hypothesis: >-
      三只箱全部从 P/L 边界口的未完成同相位置开始；逐个推入都会因其它目标未完成而被迫拉回，
      巨型 21 格三叉 E 形先进入触点位，再在下一次右推中同时命中三箱并立即胜利。
    actual_result: pending_runtime
    status: revised
    artifact_refs:
      - candidates/baseline/RA_FRESH_2026_07_15_TRIDENT_SYNC_RESET_v3.txt
  - attempt_id: BASELINE_TRIDENT_V4
    slot: baseline
    material_refs: [MAT-01, MAT-02]
    structural_hypothesis: >-
      保留 v3 已成立的三锁同相与 21 格三叉 E 形完整结构，把 exact identity 改为不再暗示历史重置的
      SYNC_FINAL；三个空间分离的目标锁必须由同一个完整结构的三触点在最后一拍原子完成。
    actual_result: >-
      完整状态图为 complete（957 states / 2997 transitions / 9 raw win states）。最短解只需从右侧绕到结构背面，
      连续两次右推；终拍为 force_chain:n4 与 sticky_to_box:n3，三个目标同时覆盖。
      展开全部 9 个胜态后只有一个去玩家坐标的对象状态类和一个终局转移类：差异只来自玩家可在九个竖脊格任选接触点。
    status: evidence_ready
    artifact_refs:
      - candidates/baseline/RA_FRESH_2026_07_15_TRIDENT_SYNC_FINAL_v4.txt
  - attempt_id: APPLICATION_FORGED_C_V1
    slot: application
    material_refs: [MAT-01, MAT-03]
    structural_hypothesis: >-
      三次 B/S 扫线把上下两条直臂接入 3×7 厚脊，完成 27 格 C 形后一次右推同步两个锁箱。
    actual_result: >-
      最短解 cost=6 完全跳过 B/S 构造；未转化的同排箱构件本身形成直推链，厚脊一次右推就把两条链送上目标。
    status: rejected_identity
    artifact_refs:
      - candidates/application/RA_FRESH_2026_07_15_FORGED_C_SYNC_v1.txt
  - attempt_id: APPLICATION_FORGED_C_V2
    slot: application
    material_refs: [MAT-01, MAT-03]
    structural_hypothesis: >-
      把构件错层为钩尖与支撑轨，并以锁箱墙阻止未构造链直达；预期第三次扫线才补齐完成形。
    actual_result: >-
      最短解 cost=6 只扫两列；第二列形成的上排黏尖仍可沿同排推动第三列箱尖和目标箱，第三停位不必要。
    status: rejected_identity
    artifact_refs:
      - candidates/application/RA_FRESH_2026_07_15_FORGED_C_SYNC_v2.txt
  - attempt_id: APPLICATION_FORGED_C_V3
    slot: application
    material_refs: [MAT-01, MAT-03]
    structural_hypothesis: >-
      第三列同时包含目标行钩尖与相邻行支撑末格；前两列只延长支撑轨，不能用箱的正交邻接传力，
      第三次扫线后才把钩尖、支撑与厚脊合成一个 29 格完整双钩 C 形。
    actual_result: >-
      canonical 三次 right 构造后，一次 right 由完整 sticky#1 产生 force_chain:n3、sticky_to_box:n4 并双目标胜利；
      当前通用完整图在 500000 states 预算耗尽，需继续收束玩家可达空间后才能送审唯一性。
    status: revised
    artifact_refs:
      - candidates/application/RA_FRESH_2026_07_15_FORGED_C_SYNC_v3.txt
  - attempt_id: APPLICATION_FORGED_C_V4
    slot: application
    material_refs: [MAT-01, MAT-03]
    structural_hypothesis: >-
      用单线走廊封闭所有箱构件的直接操作，使状态图完备且第三停位强制发生，再从上钩尖直接启动完成形。
    actual_result: >-
      complete graph 仅 15 states 且唯一 raw win，但四次承诺全部强制；玩家没有在不完整形与完整形之间作判断，
      application 的构造责任退化为按住 right 的演示。
    status: rejected_no_experience_delta
    artifact_refs:
      - candidates/application/RA_FRESH_2026_07_15_FORGED_C_SYNC_v4.txt
  - attempt_id: APPLICATION_FORGED_C_V5
    slot: application
    material_refs: [MAT-01, MAT-03]
    structural_hypothesis: >-
      保留左侧独立试用通道：玩家在每个 B/S 停位都可绕到主体背面尝试；前两列的错层箱不传正交力，
      提前推动只移动厚脊与支撑轨并进入死分支，第三列才让上下钩尖成为同一个 29 格完成形。
    actual_result: >-
      complete graph 143 states / 338 transitions / 7 raw wins。唯一可胜承诺骨架是三次边界扫线后再推动完整主体；
      两扫提前尝试为 nonwin，缺上钩或缺上支撑末格的 canonical trace 只完成下目标。
      七胜态去玩家坐标后只有一个对象状态类与一个终局转移类。
    status: evidence_ready
    artifact_refs:
      - candidates/application/RA_FRESH_2026_07_15_FORGED_C_SYNC_v5.txt
  - attempt_id: CHALLENGE_DESCENDING_E_V1
    slot: challenge
    material_refs: [MAT-01, MAT-06, MAT-07]
    structural_hypothesis: >-
      上半体先向下落一格并入下半体，随后玩家绕到 L 侧中央向左拉动完整 27 格 E；
      上下远端触点在同一拉动中把两个目标锁同时推入目标。
    actual_result: >-
      canonical 的中央 pull 可胜，但完整求解发现 cost=7 的 down,right,right,right,right,down,left：
      合体后玩家从开放右缘绕到结构背面，以一次 left push 完成两个目标，直接消除了 pull driver 站位反转。
    status: rejected_identity
    artifact_refs:
      - candidates/challenge/RA_FRESH_2026_07_15_DESCENDING_E_PULL_SYNC_v1.txt
  - attempt_id: CHALLENGE_DESCENDING_E_V2
    slot: challenge
    material_refs: [MAT-01, MAT-06, MAT-07]
    structural_hypothesis: >-
      封闭巨型结构整个右缘，使最终 left 位移只能由玩家站在 L 侧中央向外拉动；
      上方仍保留纵向落位入口，故终局前必须完成一次 push-to-assemble，再发生 pull-to-finish。
    actual_result: >-
      最短解恢复为先 down 合体、再从中央 L 侧 left pull，终拍为 force_chain:n3 与 sticky_to_box:n3；
      但开放的上移与下移接触面让完整图在 500000 states 仍未闭合，产生大量与体验无关的巨物漂移状态。
    status: revised
    artifact_refs:
      - candidates/challenge/RA_FRESH_2026_07_15_DESCENDING_E_PULL_SYNC_v2.txt
  - attempt_id: CHALLENGE_DESCENDING_E_V3
    slot: challenge
    material_refs: [MAT-01, MAT-06, MAT-07]
    structural_hypothesis: >-
      在上缘增加单点止退、在下缘封轨：上半体只能向下并入下半体，合体 E 只能向左进入双锁；
      删除无关巨物漂移，不改变 push-to-assemble / pull-to-finish 的两段因果。
    actual_result: >-
      complete graph 158 states / 468 transitions / 1 win state，终局 pull identity 完整；
      但开局只有一个可行且唯一的承诺 down，首段合体退化为 scripted handoff，challenge 没有承担计划辨别责任。
    status: rejected_no_experience_delta
    artifact_refs:
      - candidates/challenge/RA_FRESH_2026_07_15_DESCENDING_E_PULL_SYNC_v3.txt
  - attempt_id: CHALLENGE_DESCENDING_E_V4
    slot: challenge
    material_refs: [MAT-01, MAT-06, MAT-07]
    structural_hypothesis: >-
      玩家开局站在未合体上半体的 L 侧拉柄；立即 left 会只拉动上半体，并让越过 B/S 边界的左端先转箱、
      破坏完整 E 的后续连通。正解先离开拉柄，绕到上方 down 合体，再回到同一功能位置 left 完成双锁。
    actual_result: >-
      开局 left 的确先拉上半体并转箱，但它左移后仍与下半体保留两格宽的可合并界面；
      solver 找到 cost=18 的更短胜路，沿错误拉动继续下落合并，并从新露出的右缘 push 完成，identity 再次被旁路。
    status: rejected_identity
    artifact_refs:
      - candidates/challenge/RA_FRESH_2026_07_15_DESCENDING_E_PULL_SYNC_v4.txt
  - attempt_id: CHALLENGE_DESCENDING_E_V5
    slot: challenge
    material_refs: [MAT-01, MAT-06, MAT-07]
    structural_hypothesis: >-
      把上下组件的接缝改为错齿：完整对齐时，上半体下缘 x9-10 与下半体单齿 x8 横向咬合，补成三格厚脊；
      若先 left，上半体下缘变成 x8-9，随后 down 会与 x8 单齿重叠而被阻断，且其右侧站位被结构与封轨围住。
    actual_result: >-
      canonical 仍为完整 E 的 down merge 后中央 left pull；但 500000 状态前缀已有 1934 个胜利对象态类、
      2753 个终局转移类，包含 sticky push、sticky pull 与多只独立箱直接完成，远非预算内唯一逻辑解族。
    status: rejected_identity
    artifact_refs:
      - candidates/challenge/RA_FRESH_2026_07_15_DESCENDING_E_PULL_SYNC_v5.txt
  - attempt_id: CHALLENGE_DESCENDING_E_V6
    slot: challenge
    material_refs: [MAT-01, MAT-06, MAT-07]
    structural_hypothesis: >-
      恢复两个目标锁的完整侧墙，不再用开墙制造破坏性切分。玩家起始在上半体下方；立即 up 会把它推到顶边、
      永久错过与下半体的接口。正解要绕到上方从反面 down 合体，再绕到 L 侧中央 left pull 完成双锁。
    actual_result: pending_runtime
    status: revised
    artifact_refs:
      - candidates/challenge/RA_FRESH_2026_07_15_DESCENDING_E_PULL_SYNC_v6.txt
  - attempt_id: CHALLENGE_BOUNDARY_REFORGE_MASK_V1
    slot: challenge
