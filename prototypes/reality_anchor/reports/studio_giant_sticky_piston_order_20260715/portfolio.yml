  current_batch_works_consulted:
    - candidate_id: RA_FRESH_2026_07_15_TRIDENT_SYNC_FINAL
      layout_ref: candidates/baseline/RA_FRESH_2026_07_15_TRIDENT_SYNC_FINAL_v5.txt
      replay_ref: ../input_replay_RA_FRESH_2026_07_15_TRIDENT_SYNC_FINAL_v5.json
      player_experience_read_from_actual_work: >-
        预制 21 格 E 形从背面右推两格，以三触点同拍消解三个目标锁；核心直接、完整，但不要求玩家作者结构。
    - candidate_id: RA_FRESH_2026_07_15_FORGED_C_SYNC
      layout_ref: candidates/application/RA_FRESH_2026_07_15_FORGED_C_SYNC_v6.txt
      replay_ref: ../input_replay_RA_FRESH_2026_07_15_FORGED_C_SYNC_v6.json
      player_experience_read_from_actual_work: >-
        玩家用 B/S 三列扫线把八只错层箱构件并入厚脊，再从背面右推完成 29 格双钩；
        新责任是判断完整触点集合何时生成，但最终仍是 push driver。
  new_work_intent:
    player_experience_to_add: >-
      玩家开局先沿两只 ordinary C 活塞经过；任一只顺手推上目标后，覆盖态都只有反向 L-pull
      可以离开，因此亲自建立“两个最后动作不能顺序保留”的矛盾。随后在开放工场中移动实际供应的
      短 H、R、T 三件：H 的同一连通件含全部目标触齿，R 补足串联桥，T 才把唯一可站的 P 侧把手
      带出后壁阴影。三件合成一个完整巨构、整体竖向注册后，最后一次右推同时完成两只活塞。
    concrete_difference_from_each_current_batch_work:
      - >-
        相对 baseline，玩家不再领取一件已完成的同步器并直接发射；他先在同一真实关卡中实际试到
        两枚活塞各自的强制回撤，再从三件彼此分离的供件中作者出唯一能同时触发两槽的完整刚体。
      - >-
        相对 application 的就地 B/S 三拍锻造，三件在开放区保留可错拼与可换序空间；玩家必须理解
        “触点面、串联桥、远端施力点”三种不同职责，而不是沿边界把预定散箱单调吸入主体。
    experience_lost_if_this_work_is_removed: >-
      作品集会失去“先亲手确认顺序锁矛盾，再在开放区为矛盾发明完整多组件执行器”的 challenge：
      baseline 与 application 都没有要求玩家证明实际供应的每个子装配不能单独银行任一目标，也没有
      把完整巨构的触点、传力桥和 P 侧施力点分配给不同供件后再统一收束。
  slot_commitment:
    baseline_complete_realization: inherited_from_RA_FRESH_2026_07_15_TRIDENT_SYNC_FINAL_v5
    application_added_player_responsibility: inherited_from_RA_FRESH_2026_07_15_FORGED_C_SYNC_v6
    combination_other_non_prerequisite_mechanism: human_brief_exempted
    combination_player_visible_relation: human_brief_exempted
    challenge_dimension: >-
      开放装配作者性 + 远程施力拓扑：短 H 单件拥有全部触点却藏在后壁阴影内，R/T 真子集均不能
      获得目标向施力；只有三件成为同一完整刚体并注册到位，T 的偏置把手才从 P 侧驱动 H 同拍触发全部 C。
      运输长度、辨形、对齐与走位不计作 challenge 难度。
  reduction_test: >-
    移除 P/L 后，两只 C 可按开局路线顺序直接保留，整套巨构变得不必要；移除 H 则无任何供件含目标触面；
    移除 R 则 H 与 T 不能形成授权传力链；移除 T 则 H/HR 仍在后壁阴影内无 P 侧右推源；任一运输错层
    若产生单齿远程推进即判失败，不能以“之后可能卡死”宽容；最终胜态必须由原两只 C 覆盖目标。

