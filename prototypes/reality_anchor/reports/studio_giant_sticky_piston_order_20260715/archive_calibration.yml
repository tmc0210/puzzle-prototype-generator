slot_role_calibration_only:
  source_core_is_different: true
  baseline:
    anchor: RA_CAND_0010
    role: >-
      直接、清楚、短因果链地完整兑现一个关系；玩家只需建立核心 timing，
      不靠额外子题或流程长度抬高定位。baseline 不是机制标签 witness，仍应有完整矛盾与收束。
  application:
    anchor: RA_CAND_0015
    role: >-
      在 baseline 关系上增加玩家作者性和对象复用：同一对象在前后阶段继续承担责任，
      多种操作围绕同一主要关系汇合；不能只是把 baseline 放大或多走几步。
  challenge:
    anchor: RA_CAND_0011
    role: >-
      在紧凑耦合中加入反直觉计划或临时撤销已满足状态的矛盾，要求玩家重写直觉；
      难度来自因果关系，不来自走位、读图或步骤长度。
  prohibited_use: 不复用三关的布局、对象职责、路线、操作顺序或因果链，只校准档位角色与跨档差异幅度。

player_side_boundaries:
  - 巨大结构、多个锚点或事件标签会抬高玩家预期；每个高 affordance 要素必须在核心高潮中兑现。
  - 不把巨大结构识别、触点对齐、精确操作、常规绕行或重复动作算作难度。
  - 大题面只兑现显然重复顺序锁属于明确反例；大型结构必须改变玩家的计划关系。
  - 多个活塞锁的价值应来自“各自都要求最后完成而彼此矛盾”，巨大完整结构的多触点同步动作必须直接解决或重写该矛盾。
  - 前置构造或切割不能成为退休的单行道演出；产出的结构、对象与空间必须继续服务同步活塞高潮。
  - 不用机制覆盖、事件数量、状态数或解长补偿任何玩家可感缺点。
  - 对称几何可以增强读图和形式完整性，但不能把本质重复动作伪装成新洞见。

positive_taste_only:
  - RA_CAND_0029：同一批要素在不同阶段承担不同活塞责任、结构差异与复用度可形成亮点；只取审美边界，不取结构素材。
  - RA_CAND_0025：主动构造必须短、服务后段反复使用，并在终局得到清楚消费；只取包装原则。
  - RA_CAND_0022：强洞见、短因果链和高空间责任优于长流程；只取完成质量原则。
  - RA_CAND_0017：后期挑战可高机制密度，但必须高耦合且有反直觉计划；不复制高腾挪负担。
  - RA_CAND_0021：锚点强推大黏块仅凭特殊结构仍只是中档边界，不能自动冒充高野心作品。
  - RA_CAND_0020：几何对称可抬高简单重复的完成度，但重复本身仍是明确上限。

