designer_claim:
  player_experience_core: >-
    玩家用 B/S 边界逐列锻造一个上下镜像的 29 格双钩 C 形；只有第三列同时把两枚钩尖和支撑末格
    变为 sticky，完整结构才能用两个远端触点同拍收束两个 P/L 目标顺序锁。
  player_action: >-
    玩家可在每个边界停位沿左侧通道绕到巨大主体背面试推；读出箱构件的正交邻接不传力后，
    将 B/S 连续右移三列，再绕回并从 7 格高厚脊任一点右推完成形。
  visible_payoff: >-
    前两次扫线只让上下支撑轨各长一格，第三次同时出现两枚远端钩尖并闭合整体轮廓；
    终拍整块 C 形右移，两只目标箱同时从 CG 变成 C*。
  why_this_level_exists: >-
    它把 baseline 的“领取成品并同步”推进到真实 application：玩家亲自决定何时完成大工具，
    构造出来的同一主体没有退休，而是立即承担双顺序锁终局。
  work_identity_conditions:
    - B/S 必须存在三个可见列位，转换事件依次为 box_to_sticky:n2、n2、n4。
    - 第三列必须同时含上下钩尖与支撑末格，使两枚钩尖只在最终扫线后连入 29 格主体。
    - 玩家必须能在前两停位提前试推并得到不触发目标的可见失败，而不是被走廊强制完成构造。
    - 胜利终拍必须由完成形同拍推动两只目标箱，且缺任一钩尖或连通末格都会失去对应目标。

packaging_account:
  opening: >-
    开局把 B/S 三格行程放在上方，把厚脊、两条箱支撑轨、两枚箱钩尖和两个 CG 锁箱纵向对齐；
    玩家同时能看到左侧试用通道。
  preparation: 玩家选择继续扫线或沿左侧通道提前试推；正确理解是让第三列完成两处正交连接。
  reveal_or_use: 第三次扫线产生 n4 转换，两个分离箱钩同时并入主体，29 格双钩轮廓完整出现。
  ending: 玩家绕到厚脊背面右推；远端上下钩同拍推箱上目标，胜利无拖尾。
  every_major_element_role:
    - 3×7 厚脊：始终存在的视觉主体、八只构件的黏接基底、终拍受力把手。
    - 八只错层箱构件：三列构造材料；前两列只延长支撑，第三列闭合上下钩。
    - B/S 锚点与三格行程：玩家作者工具，按 n2、n2、n4 改写触点集合和连通图。
    - 上下两只目标箱与目标：两组 P/L 单箱目标顺序锁，由完成形同拍收束。
    - 两个闭合侧袋：保留“推入后只能从 L 侧拉回”的锁箱性质；上袋另有局部 exact probe。
    - 左侧竖通道：让玩家可在每个构造停位亲自试用主体，避免构造序列退化成强制演示。
    - P/L 锚点：定义目标箱推拉侧别，并在终拍切下跨界的四格前缘。
  known_perceptible_defects:
    - 正确胜路中的三次 B/S 右移都属于唯一可胜承诺；实际判断在“何时停止并试用”，不是锚点路径规划。
    - 提前试推会进入不可恢复失败分支，需要重开；未完成的钩尖仍保持箱形，失败原因可直接从轮廓读出。
    - 两个目标锁在 exact solve 中不需要由玩家逐个进入；其回撤性质依赖玩家既有 P/L 知识和可见侧袋，并由局部 probe 核验。
    - 墙体为压缩可达状态而较密，巨大结构的轮廓清楚，但自由空间的视觉呼吸感弱于 baseline。
    - 构造后沿左通道回到主体背面有八步走位；本任务明确允许忽略巨大结构带来的走位审美损失。

slot_account:
  concrete_delta_from_baseline: >-
    baseline 从预制 21 格 E 形开始，只需把成品推入三触点终局；本关从 21 格厚脊与八只分离箱构件开始，
    玩家必须用 B/S 三个停位亲自生成钩尖和连通路径，最终同一主体达到 29 格后才可双触点终局。
  application_added_authorship: >-
    玩家决定何时停止边界扫线、可提前试用并观察错层箱不传正交力；第三列的 n4 转换由玩家亲手完成，
    且构造结果立即被消费为终局工具。
  combination_other_mechanism: human_brief_exempted
  combination_not_prerequisite_to_current_core: human_brief_exempted
  combination_player_visible_relation: human_brief_exempted
  challenge_ceiling_dimension: not_applicable
  concrete_experience_difference_from_current_batch_works:
    - >-
      相对 RA_FRESH_2026_07_15_TRIDENT_SYNC_FINAL_v4，新增的不是更多触点或更长路，
      而是把触点集合与大结构连通性本身交给玩家通过 B/S 构造。

