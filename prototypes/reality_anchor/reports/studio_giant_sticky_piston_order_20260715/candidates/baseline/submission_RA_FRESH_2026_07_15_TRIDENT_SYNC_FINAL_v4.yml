designer_claim:
  player_experience_core: >-
    三个空间分离的 P/L 目标活塞都要求自己成为最后动作，无法逐个保留完成；
    一个具有上下对称感的 21 格完整三叉 E 形黏块把三个互相冲突的最后动作压成同一拍。
  player_action: >-
    玩家可先从右侧进入任一锁箱口验证“推入后必须拉回”，再绕到巨大结构左侧，
    把整块 E 形右推一格进入承诺位，再右推一格同时命中三个箱子。
  visible_payoff: >-
    最后一拍整块巨大 E 形平移，三条远距横臂同拍接触，三个目标从 CG 同时变为 C*，立即结束。
  why_this_level_exists: >-
    作为 baseline，它不把识形、对齐或走位伪装成难度，而是完整、直接地让玩家亲手验证三重顺序矛盾，
    再由一个真正参与终局的超大完整结构消解矛盾。
  work_identity_conditions:
    - 三个目标必须各自位于只能从 L 侧原路退出的一格锁箱口，单独完成不能累积。
    - 21 格三叉 E 形必须在动作开始时保持一个连通刚体，并保留三个等相位触点。
    - 胜利终拍必须由同一输入的完整结构力链同时推动三只目标箱，而非逐个填目标。

packaging_account:
  opening: 玩家开局位于三只目标活塞与大结构之间，可直接读到三组 CG 口袋和巨大 E 形的对应三臂。
  preparation: 玩家只需决定不逐个纠缠活塞，并从顶部或底部开放通道走到结构背面。
  reveal_or_use: 第一次右推把完整结构送入三个触点都相邻的承诺位；第二次右推显露三触点原子力链。
  ending: 三个目标在同一可见拍同时覆盖，结构前端越过 P/L 后切成三只箱，胜利无拖尾。
  every_major_element_role:
    - 21 格 E 形：视觉主体、唯一三触点同步 driver，也是终局直接受力对象。
    - 三只箱与三个目标：三组彼此冲突的“必须最后完成”活塞。
    - 三对狭廊侧墙：迫使单独推入目标的玩家从 L 侧拉回，建立不可累积性。
    - 上下两个导向墙格：阻止巨大结构被纵向错移，保持三触点相位的可读性。
    - P/L 锚点：决定三只箱可推可拉，并在终拍切下三枚越界触点。
    - B/S 锚点：满足巨大黏体的边界合同；隔离固定，不参与本关玩家操作。
  known_perceptible_defects:
    - 顶部与底部绕行距离较长，但用户已明确巨大结构带来的走位审美损失可忽略；本关不把这段走位计作难度。
    - B/S 锚点在独立墙室中只承担规则合同，没有玩家侧操作回报。
    - 向左推动巨大结构会进入明显死路；目标全部在右侧，因此属于可读方向错误，不是隐藏陷阱。

