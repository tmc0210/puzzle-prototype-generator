designer_claim:
  player_experience_core: >-
    玩家把开局即完整的 107 格水平对称面具当作原材料：用 B/S 同时切出左缘五格，亲手把 P/L
    左移三格改写可施力侧，令上下端格各向中央重排两格，再把五格复黏回同一巨大刚体；
    终拍由重铸面具的三个远端触点同时完成三只真实 P/L 目标顺序锁。
  player_action: >-
    玩家先在下方拉动 B/S 切边，进入隔离轨把 P/L 拉到唯一止挡；随后可任选先处理上端或下端，
    但每端都要把切出箱向内推两格。重排完成后拉回 B/S，最后绕到面具右侧把完整主体向左推一格。
  visible_payoff: >-
    第一次切边让面具左缘五点同时变箱；P/L 三格行程把 x=6 从 L 侧改成 P 侧；上下两枚端格在远距离
    对称槽内向中线靠拢。B/S 拉回时五格同时恢复为黏块并重新并成单一 107 格面具，最终整面具左移，
    三个 G 在同一拍全部变为 *。
  why_this_level_exists: >-
    它把 baseline 的预制同步器和 application 的单调构造推进到真正的 challenge：完整形状先被主动破坏，
    同一批边缘格经过边界换相与远端重排后再恢复；P/L 锚点本体的移动、B/S 切分与三锁同拍不是并排子题，
    而是同一个巨大结构从原材料到终局执行器的连续责任链。
  work_identity_conditions:
    - 开局必须是一个 107 格、单连通、关于 y=9 水平轴对称的完整黏块面具，而非若干小组拼盘。
    - B/S 打开时必须同拍产生 sticky_to_box:n5；五个切出格都在后续复黏与终拍连通中承担位置责任。
    - P/L 必须从 L8|P9 左移三格到 L5|P6；少移一格时 x6 仍不可执行端格下推，第四次左移与纵移均不可达。
    - 上端 T×2 与下端 B×2 可独立交错，但两端都必须在复黏前完成；责任顺序不能跨越 R 或 F。
    - B/S 拉回必须产生 box_to_sticky:n5 与 sticky_merge:n1，恢复同一个 107 格主体；跳过它发射只能覆盖中央目标。
    - 终拍必须由动作前完整连通的巨大 sticky#1 左移，产生 force_chain:n4 并同时覆盖三目标。

packaging_account:
  opening: >-
    三个一格深目标口袋沿面具左缘纵向排列，107 格主体以对称“面具/立面”轮廓占据画面中央；
    B/S 与玩家在下方，P/L 单独置于更低的隔离横轨，两个边界的职责从开局即可同时读到。
  preparation: >-
    B/S 切出五点后，玩家进入下轨把 P/L 拉到止挡；再在上、下两个对称槽中把端格各推两格，
    其余三个切出格留作中部触点与上下连接桥。
  reveal_or_use: >-
    拉回 B/S 的一拍同时把五箱恢复为黏块并 merge，先前被拆开的面具以新的三触点左缘重新成为单一整体。
  ending: >-
    玩家从右侧向左推动完整面具；上、中、下三触点同拍把三只 C 推到 G，胜利紧跟终拍，无额外清理。
  every_major_element_role:
    - 107 格对称面具：开局完整作品、切分母体、102 格搬运核心、复黏基底与最终三触点执行器。
    - 五个 x6 左缘格：切分材料；上下端格改位为锁触点，y5/y13 成为复黏桥，中格维持中央触点。
    - B/S 锚点及单格行程：把同一五格从 sticky 切成 box，再在正确新位置整体恢复并入主体。
    - 可移动 P/L 及三格隔离轨：先把 x6 从 L 模式改成 P 模式授权端格重排，终态又把三只目标箱定义为真实顺序锁。
    - 三只 C、三个 G 与口袋墙：三组只可在最后保留覆盖的 P/L 目标活塞；代表锁 exact probe 核验推入与强制回撤。
    - 上下对称重排槽：给两枚端格各两格有职责位移，并让两端任务可换序而不改变逻辑族。
    - 下方隔离墙：阻止 P/L 过拉、纵移和 B/S 下移；墙位分别由 exact 可达审计与 force_blocked 支持。
  known_perceptible_defects:
    - 规范 exact replay 有 130 个输入但只有 10 次对象操作；大量步数来自在超大型结构两端往返，本任务明确不把走位损耗计为难度。
    - 三次连续 P/L 左拉没有中途选择，但它是把真实边界从 L8|P9 移到唯一功能位 L5|P6 的可见换相，不按重复操作计难度。
    - 墙体为了保持巨大结构与两个锚点的动作空间可审计而较密；视觉主体仍清楚，但空地呼吸感有限。
    - 三锁的逐个回撤性质在代表锁局部 exact probe 中直接核验；规范胜路不会要求玩家逐只进入，因为巨大面具正是矛盾的同步解。
    - 完整状态图在 30,000 状态预算耗尽，唯一性只能声明 unique_within_budget，不能写成完整 SCC 证明。

slot_account:
  concrete_delta_from_baseline: >-
    baseline 领取预制 21 格 E 形并两推同拍三锁；本关从 107 格完整面具出发，却必须先切出五格、移动 P/L、
    重排两个远端端格并复黏，完整主体经过“完整—切开—换相—重铸—完整”后才执行同类三锁终拍。
  application_added_authorship: >-
    application 通过 B/S 三列单调把八箱长成 29 格双钩；本 challenge 的作者责任是非单调的：
    玩家先破坏一个已经完整且可辨识的巨构，再改变另一条边界的力学分区，让被切材料换位后恢复同一作品。
  combination_other_mechanism: human_brief_exempted
  combination_not_prerequisite_to_current_core: human_brief_exempted
  combination_player_visible_relation: human_brief_exempted
  challenge_ceiling_dimension: >-
    同一 107 格作品跨越两条可移动边界重复承担五种状态责任；计划层要求固定 O→P×3→{T×2,B×2}→R→F，
    其中只有上下独立重排可交错。失败发射会先真实锁住中央目标，再因未复黏的力链矛盾阻断。
  concrete_experience_difference_from_current_batch_works:
    - 相对 baseline，难点从读取成品触点变为非单调地重写同一成品的触点集合与可施力侧。
    - 相对 application，新增的不是更多扫线，而是移动 P/L 本体、远端重排、复黏时机和提前发射的真实锁定后果。

