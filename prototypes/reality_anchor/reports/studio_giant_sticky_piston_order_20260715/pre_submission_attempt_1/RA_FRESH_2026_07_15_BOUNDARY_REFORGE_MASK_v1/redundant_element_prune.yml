      test_status: not_run_authority_gate
      result: keep
      reason: >-
        P/L 在 steps 13-15 左移三格；exact tip probes 证明第三格换相使同一端格 down 从非法变合法，
        隔离走廊 audit 又限制第四次左拉与纵移。它是主动规则边界，不是标记墙。
      hard_facts:
        cost_delta: unknown
        graph_status: exhausted_base_gate
        expected_trace_win: false
        core_event_bypass: not_applicable_original_trace_broken
        opening_delta: unknown
        target_obligation_bypass: tip_reorder_authorization_removed
      semantic_role: structural

    - element:
        kind: object
        id_or_cell: STICKY_COMPONENT_1
      action_tested: wallify
      test_status: not_run_after_remove_rejected
      result: keep
      reason: 主体在 canonical 中切分、复黏并整体移动，显然不是只承担静态 blocker 职责。
      hard_facts: &wallify_facts
        cost_delta: unknown
        graph_status: exhausted_base_gate
        expected_trace_win: false
        core_event_bypass: not_applicable_original_trace_broken
        opening_delta: unknown
        target_obligation_bypass: original_object_chain_broken
      semantic_role: structural
    - element:
        kind: object
        id_or_cell: CUT_TEETH_5
      action_tested: wallify
      test_status: not_run_after_remove_rejected
      result: keep
      reason: 五齿会转换，其中两格远端重排、三格共同恢复触点；墙化会抹除玩家可操作材料责任。
      hard_facts: *wallify_facts
      semantic_role: structural
    - element:
        kind: object
        id_or_cell: THREE_LOCK_CRATES
      action_tested: wallify
      test_status: not_run_after_remove_rejected
