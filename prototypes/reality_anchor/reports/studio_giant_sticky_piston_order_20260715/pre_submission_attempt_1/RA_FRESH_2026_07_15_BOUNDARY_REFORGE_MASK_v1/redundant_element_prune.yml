    - object_wallify_prune
    - space_prune
    - wall_outline_prune
  authority_gate:
    base_graph_status: exhausted
    base_graph_budget: 30000
    base_core_event_completeness: incomplete
    explanation: >-
      raw runtime 图在 30000 状态耗尽；已有 responsibility audit 只完整覆盖声明的
      O1/P3/T2/B2/R1/F1 字母表，不是任意动作族的完整核心事件 probe。按 authority，
      本轮禁止任何 clean prune，只做固定顺序的候选发现、当前 trace 责任核对与保留/unknown 记录。
    clean_prune_allowed: false
  stage_results:
    goal_prune:
      status: kept_with_unknown
      removed_count: 0
      retained_targets: [[4, 4], [4, 9], [4, 14]]
      evidence_ref: prototypes/reality_anchor/reports/studio_giant_sticky_piston_order_20260715/pre_submission_attempt_1/RA_FRESH_2026_07_15_BOUNDARY_REFORGE_MASK_v1/goal_prune_check.yml
    object_remove_prune:
      status: retained_or_unknown
      execution: read_only_responsibility_audit
      reason: 完整图门槛先行拒绝 clean remove；对象当前责任仍逐项核对。
    object_wallify_prune:
      status: retained_or_unknown
      execution: after_object_remove_read_only_audit
      reason: 按固定顺序只在 remove 阶段后检查；所有可动物都在 canonical 中移动、转换或做功，不是静态 blocker。
    space_prune:
      status: retained_or_unknown
      execution: candidate_discovery_only
      reason: 发现 8 个静态 degree<=1 普通地面；其中 2 格进入 canonical trace，其余因完整图不全维持 unknown。
    wall_outline_prune:
      status: clean_no_legal_trim_candidate
      execution: geometric_outline_audit_only
      reason: 四边没有裁掉一行/列后仍保持闭合全墙边界的合法 trim 候选。
  candidates_checked:
    - element:
        kind: goal
        id_or_cell: [[4, 4], [4, 9], [4, 14]]
      action_tested: remove
      test_status: three_single_delete_counterfactuals_executed
      result: unknown
      reason: 三个单删版本的 graph 与核心事件 product probe 均 exhausted；目标全部按 goal_prune authority 保留。
      hard_facts:
        cost_delta: "unknown->unknown"
        graph_status: exhausted
        expected_trace_win: true
        core_event_bypass: unknown
        opening_delta: not_evaluated_after_authority_rejection
        target_obligation_bypass: unknown
      semantic_role: structural

    - element:
        kind: object
        id_or_cell:
          id: STICKY_COMPONENT_1
          cells: 107
      action_tested: remove
      test_status: not_run_authority_gate
      result: keep
      reason: >-
        初态为唯一、四邻接完整且关于 y=9 对称的 107 格主体；canonical step 1 从它切出五格，
        step 107 恢复 107 格单体，step 130 由 sticky#1 整体左移完成三锁。它是作品主体而非装饰。
      hard_facts:
        cost_delta: unknown
        graph_status: exhausted_base_gate
        expected_trace_win: false
        expected_trace_basis: 删除主体会直接移除 canonical 的切分、复黏与终拍刚体对象。
        core_event_bypass: not_applicable_original_trace_broken
        opening_delta: unknown
        target_obligation_bypass: original_three_target_completion_broken
      semantic_role: structural

    - element:
        kind: object
        id_or_cell:
          id: CUT_TEETH_5
          cells: [[6, 2], [6, 5], [6, 9], [6, 13], [6, 16]]
      action_tested: remove
      test_status: not_run_authority_gate
      result: keep
      reason: >-
        五格同拍切出并同拍复黏；(6,2)/(6,16) 分别重排两格成为上下锁触点，(6,9) 保持中央触点，
        (6,5)/(6,13) 负责把改位端格重新接回 107 格主体。五格均有可见终局责任。
      hard_facts:
        cost_delta: unknown
        graph_status: exhausted_base_gate
        expected_trace_win: false
        expected_trace_basis: canonical 明确包含 sticky_to_box:n5 与 box_to_sticky:n5，且终拍由重铸后的三触点做功。
        core_event_bypass: not_applicable_original_trace_broken
        opening_delta: unknown
        target_obligation_bypass: three_lock_contact_set_broken
      semantic_role: structural

    - element:
        kind: object
        id_or_cell: { id: UPPER_LOCK_CRATE, cell: [5, 4], target: [4, 4] }
      action_tested: remove
      test_status: not_run_authority_gate
      result: keep
      reason: canonical step 130 的 force chain 将该位置箱推到上目标；删除会直接破坏三锁同拍终局。
      hard_facts: &lock_remove_facts
        cost_delta: unknown
        graph_status: exhausted_base_gate
        expected_trace_win: false
        core_event_bypass: not_applicable_original_trace_broken
        opening_delta: unknown
        target_obligation_bypass: original_target_cannot_be_covered_by_this_lock
      semantic_role: structural
    - element:
        kind: object
        id_or_cell: { id: CENTER_LOCK_CRATE, cell: [5, 9], target: [4, 9] }
      action_tested: remove
      test_status: not_run_authority_gate
      result: keep
      reason: canonical step 130 的 force chain 将该位置箱推到中目标；漏复黏错误态也以中锁提前覆盖显示其闩锁责任。
      hard_facts: *lock_remove_facts
      semantic_role: structural
    - element:
        kind: object
        id_or_cell: { id: LOWER_LOCK_CRATE, cell: [5, 14], target: [4, 14] }
      action_tested: remove
      test_status: not_run_authority_gate
      result: keep
      reason: canonical step 130 的 force chain 将该位置箱推到下目标；删除会直接破坏三锁同拍终局。
      hard_facts: *lock_remove_facts
      semantic_role: structural

    - element:
        kind: object
        id_or_cell: { id: BOX_STICKY_ANCHOR, cells: [[5, 20], [6, 20]] }
      action_tested: remove
      test_status: not_run_authority_gate
      result: keep
      reason: B/S 在 step 1 切出五齿、step 107 把改位五格恢复并 merge；两次动作连接“拆开”和“重铸”。
      hard_facts:
        cost_delta: unknown
        graph_status: exhausted_base_gate
        expected_trace_win: false
        core_event_bypass: not_applicable_original_trace_broken
        opening_delta: unknown
        target_obligation_bypass: restick_chain_removed
