prototype_rules:
  win_condition: all_targets_covered_by_objects
  push_pull_boundary: 固定 P/L 提供拉侧。
  box_sticky_boundary: 可移动 B/S 改写材料；相邻黏格合并，跨 B 侧切回箱并分裂。

slot_brief:
  intended_role: late_game_dual_anchor_resection_challenge
  target: 双锚点共存下的黏桥拼接、整体切割与目标门顺序规划。

designer_claim:
  summary: >-
    B/S 先把三箱纵柱刷入上下黏臂，拼成七格 C 形整体；固定 P/L 再把整体横拉，
    三格连接柱切回箱、双臂分裂。切出的下箱既是目标件，也是上下区域唯一竖井的门。
  claimed_highlights:
    - 一次整体切割同时完成材料转换、刚体分裂、目标反馈和三项后续职责分配。
    - 门箱早填后玩家仍可离开并完成下臂，错误具有持续局部收益，不是即时死袋。
    - 正解只要求上臂早于门箱；下臂仍可调度，避免后半段成为全序脚本。

