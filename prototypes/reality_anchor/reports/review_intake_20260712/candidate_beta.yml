player_reasoning:
  player_goal:
    description: 覆盖盘面全部目标，并安排切割后上下黏臂与门箱的完成次序。
    state_ref: canonical.step_0
  forced_setup_disclaimer:
    - step1-2 的 B/S 拼接为机制铺垫，不单独申报矛盾。
    - step3-14 的抵达与整体切割不虚构 alternative。
  reasoning_units:
    - id: RU1_upper_before_gate_crate
      player_question: 切割后门箱目标只差一次拉动，是否应先完成它再处理两条黏臂？
      premises:
        - 切割态门箱位于目标左侧，三步即可合法覆盖。
        - 覆盖后玩家仍能离开，并可继续完成下黏臂，局部计划持续产生正反馈。
        - 门箱同时占住竖井底口；另一列被切出箱占据，上臂把手无法从下方重新抵达。
      conclusion: 先沿未封闭的竖井完成上臂；之后门箱可封井，下臂在门箱前后均可完成。
      operation_steps: 15-32
      alternative:
        status: replayed_attempt
        exact_inputs: [down, down, right]
        local_gain: 一次对象操作完成门箱目标，玩家仍可活动并继续完成下臂。
        concrete_outcome: >-
          门箱覆盖目标后玩家仍可用七步完成下臂；从该结果态完整续搜无胜，未完成的上臂再无可达把手。
      feedback:
        - step18 上臂先完成，玩家仍可从顶部返回竖井。
        - step25 门箱落位时上方任务已安全完成。
        - step32 下臂完成并立即胜利。
  trace_partition:
    status: complete
    segments:
      - {steps: 1-2, purpose: 推动 B/S，使三箱与上下黏臂合并成七格整体}
      - {steps: 3-14, purpose: 抵达固定 P/L 拉侧并整体横切，生成双臂与切出箱}
      - {steps: 15-18, purpose: 封井前完成上臂}
      - {steps: 19-25, purpose: 返回并让门箱覆盖目标}
      - {steps: 26-32, purpose: 从下方回路完成下臂}

