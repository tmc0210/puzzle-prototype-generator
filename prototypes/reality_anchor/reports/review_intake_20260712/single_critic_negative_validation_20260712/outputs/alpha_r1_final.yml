validated_highlight:
  status: significant
  exact_scene: >-
    第 14 步之前，底部四目标、B/S 的 B:x4/S:x5 切割位与中央 C 形的三格连接柱共同要求同一锚点停位；第 14 步后，切出的五个输出一直延续到第 35 步终局 L。
  player_operation: >-
    玩家先抽出 P/L、压下 B/S，并从左侧两次强推 B/S/P/L 四格列车；随后把三箱分别送回黏侧，与两个端点重拼成屋顶横条、下端条和最终 L。
  board_change: >-
    一次列车停位同时覆盖底部四目标并把五格 C 形重写为三箱柱与两个黏端点；这些产物再被逐一重组，最终让屋顶横条扩成三格 L 并完成所有上方目标。
  player_value: >-
    玩家发现的不是事件并列，而是一个停位同时决定锚点归宿、切割几何与后续材料预算；被切开的形状随后以新的结构重新汇合，使前半决策持续约束终局。

