player_reading:
  core_visible_relation: >-
    开局右推 B/S 会把三箱纵柱送入黏侧，使其与上下两条二格黏臂合成七格整体；
    随后从右侧把整体拉回箱侧，又会把连接柱切回三个箱并释放上下黏臂。
  core_player_operation: >-
    玩家先用可移动 B/S 制造七格刚体，再借固定 P/L 提供的拉侧把它整体右拉并拆分，
    最后必须依次处理上黏臂、竖井门箱和下黏臂。
  core_board_change: >-
    一个由上下黏臂和三格连接柱组成的七格整体，在 step 14 被重切为上下两个独立黏臂与中线三个箱；
    之后三个输出分别覆盖上目标、竖井底口目标和下目标。
  core_planning_effect: >-
    玩家要把“合成后再切开”理解为一次输出制造，并进一步看出这些输出并非可任意排序：
    上黏臂的可达性必须在门箱和下黏臂收束前先兑现。

confirmed_aesthetic_problem:
  status: present
  exact_scene: >-
    step 14 刚完成整体右拉与拆分时，上下黏臂和三个中线箱都已成为可处理输出，
    但棋盘没有在玩家选择门箱优先时及时暴露上黏臂的访问债务。
  player_operation: >-
    玩家从 step 14 输入 [down, down, right]，先让门箱覆盖竖井底口目标且仍能向下离开；
    再输入 [down, down, left, left, left, up, down]，让下黏臂也覆盖下目标。
  board_change: >-
    两个目标先后被正确外观的独立输出覆盖，但这一收束同时令上黏臂把手不可达，
    该状态已无法完成剩余上目标。
  player_visible_harm: >-
    玩家在连续取得两次清楚、可归因的目标进展后才看到上黏臂失去把手；
    错误顺序因此不能从首次局部收益处及时剪枝，迫使玩家撤销一整段已被棋盘正向确认的收尾流程。
  raw_facts_sufficient: true

