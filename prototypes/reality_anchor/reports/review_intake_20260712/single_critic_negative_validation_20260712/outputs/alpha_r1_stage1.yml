player_reading:
  core_visible_relation: >-
    底部连续四目标要求玩家先把 B/S 与 P/L 排成同一横向列车；列车越过材料边界时，中央 C 形黏块会被切成三箱柱与上下两个黏端点，而这些输出正对应上方双目标和两个中部目标的后续重组空间。
  core_player_operation: >-
    玩家先右拉 P/L、下推 B/S，再从左侧用 B/S 强推整列锚点；完成切割后，分别把箱子送回黏侧与端点合并，移动二格刚体，并把最后一箱接到屋顶横条上。
  core_board_change: >-
    第 14 步同时令四格列车覆盖底部四目标并把 C 形切成五个可分配输出；第 20、30 步把箱子与上下端点重组为二格条，第 24 步把上横条送上屋顶双目标，第 35 步再合成三格 L 并完成全部覆盖。
  core_planning_effect: >-
    玩家在第 14 步前要规划锚点列车与切割位置，第 14 步后则要分配三个箱和两个端点；下端可以先处理但会多两步，最终仍须保留屋顶横条来接收最后一箱。

