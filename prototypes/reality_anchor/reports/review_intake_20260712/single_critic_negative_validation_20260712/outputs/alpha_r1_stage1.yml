exact_basis:
  - 原始布局与第 2、3、9、13、14 步机械状态共同给出双锚列车的形成、强推、目标覆盖和中央 C 形切割。
  - 第 20、24、30、35 步机械状态表明切割输出持续参与重组、目标覆盖和最终三格 L 收束，没有出现前段要素完成后与后段脱节的直接事实。
  - step14 的 raw alternative 明确证明上下端处理次序可交换且仍到达同一终局；这提供路线弹性，但没有显示玩家可感知的独立伤害。
  - 人类归档中的 1 分反例 RA_CAND_0024、RA_CAND_0027、RA_CAND_0031、RA_CAND_0032 分别校准了承诺落空、机制空用、单行道演出和子关卡割裂；当前 raw 未呈现这些失败所需的具体玩家后果。
  - 人类归档中的 RA_CAND_0020、RA_CAND_0025、RA_CAND_0029 用于校准大黏块拆分、主动构造与多阶段复用的难度和角色边界，不据此授予正向审美分。
