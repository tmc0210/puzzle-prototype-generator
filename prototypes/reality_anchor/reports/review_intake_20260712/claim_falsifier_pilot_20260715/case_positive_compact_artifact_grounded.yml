case_id: POSITIVE_COMPACT_REVERSAL_ARTIFACT_GROUNDED_TRUE
base_packet_ref: base_positive_compact_reversal.yml
replacement_rule: 以下 designer_claim 是唯一待审设计声明。

designer_claim:
  player_experience_core: >-
    作品把同一批两箱的运动关系从“向左推进的横链”连续改写成“逐箱重排的竖列”，
    再由 B/S force chain 把竖列向上送入目标；核心反转指可见运动方向和对象关系的改变，不声称所有玩家必然感到意外。
  player_action: >-
    steps1-3 将双箱横链推至左端；steps7-11 分别 push/pull 两箱，把横向邻接改成 B/S 上方的纵向邻接；
    step12 拉动 B/S，把竖列整体上送。
  visible_payoff: >-
    step3、step11、step12 依次给出左端横链、B/S 上方竖列和上箱覆盖目标三个清楚不同的可见状态。
  why_this_level_exists: >-
    在 12 步内让左侧狭小区域同时承担横链停放、逐箱拆分重排和终局竖向传力的前置准备，
    使最终 B/S 位移回收前面所有箱体操作责任。
  work_identity_conditions:
    - 两箱必须是从 step3 延续到 step12 的同一批责任对象。
    - steps7-11 必须真实改变两箱的位置和邻接方向，而非纯走位。
    - step12 必须由 B/S 位移与 force chain 消费 step11 的竖列关系并获胜。
    - 不声明 P/L 移动，也不声明左端在机械上是死局。
