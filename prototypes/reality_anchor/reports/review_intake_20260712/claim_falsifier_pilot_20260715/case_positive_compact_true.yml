case_id: POSITIVE_COMPACT_REVERSAL_TRUE_CLAIM
base_packet_ref: base_positive_compact_reversal.yml
replacement_rule: 以下 designer_claim 是唯一待审设计声明。

designer_claim:
  player_experience_core: >-
    玩家先把跨过材料边界生成的两箱推到左侧看似不利的位置，再逐箱改成同列上下排列；
    最后一手拉动 B/S，通过三对象 force chain 把箱列反向上送，使上箱覆盖目标。
  player_action: >-
    steps1-3 把横向双箱链推到左墙；steps7-11 不断重排这两箱，最终让它们在 B/S 上方形成竖列；
    step12 拉动 B/S，将竖列整体上送。
  visible_payoff: >-
    step3 两箱看似被送向左端，step7-11 却把同一批箱重排到 B/S 上方；
    step12 锚点上移并触发 force chain，上箱反向进入目标并立即获胜。
  why_this_level_exists: >-
    在 12 步小盘面中集中呈现一次方向重读：左端不是永久死局，而是把横向双箱链拆开并重排成竖向传力列的工作区。
  work_identity_conditions:
    - “看似不利位置”是玩家初读与方向预期，不声称两箱在左端机械不可移动。
    - 两箱在 steps7-11 必须继续被玩家分别推动或拉动并形成竖列。
    - 终手必须由 B/S 位移与 force chain 把箱列上送，而不是 P/L 位移。
