case_id: POSITIVE_ACTIVE_L_ONE_ATOM_FORGED
base_packet_ref: base_positive_active_l.yml
replacement_rule: 以下 designer_claim 是唯一待审设计声明；其中只刻意伪造 L 形责任连续性。

designer_claim:
  player_experience_core: >-
    玩家先在 step13 构造三格 L；此后同一个三格黏刚体保持连接、材料与成员完全不变，
    被作为永久活塞一路整体搬运到 step30，最终原样覆盖双目标。
  player_action: >-
    step13 以前负责构造 L；steps14-30 只负责为这一个持续完整的 L 刚体寻找移动路线，
    中途不再切割、分裂、转箱或重新合并其成员。
  visible_payoff: >-
    step13 出现的三格 L 在 step14、step15、step22 和 step30 始终保持同一连接形状；
    step30 它作为三格黏刚体原样覆盖两个目标并获胜。
  why_this_level_exists: >-
    展示一次构造即可永久获得同一 L 工具，并在后续十七步中不改变工具身份地持续复用。
  work_identity_conditions:
    - steps13-30 不得发生属于该 L 成员的 sticky_to_box、box_to_sticky、sticky_merge 或分裂。
    - step14 后必须仍是 step13 的同一三格连通黏刚体。
    - step30 覆盖目标的必须是未改写的三格黏刚体，而不是切回的箱。
