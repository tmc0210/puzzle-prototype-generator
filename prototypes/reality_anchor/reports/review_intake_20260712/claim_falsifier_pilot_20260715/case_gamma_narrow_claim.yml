case_id: GAMMA_NARROW_CLAIM
base_packet_ref: ../candidate_gamma.yml
replacement_rule: >-
  完全忽略 base packet 原有 designer_claim；以下 claim 是唯一待审设计声明。

designer_claim:
  player_experience_core: >-
    前段借上箱作为临时受力端上提 B/S；中段移动 P/L 改写 B/S 右侧站位的 push/pull 条件；
    末段只使用下方新黏格与右下初始黏格合并并回切。三个局部关系依次发生，不声明上箱转黏后仍参与终局。
  player_action: >-
    玩家先利用上箱完成 B/S 上提，再让 P/L 从 L 端覆盖右目标改为 P 端覆盖并释放左推站位，
    最后把下方新黏格与初始黏格排成竖条后左拉跨界。
  visible_payoff: >-
    step4 上箱回到原行且 B/S 上提；step8 P 覆盖右目标并释放 B/S 推位；
    step15 下方新黏格与初始黏格合并；step17 该两格结构跨界，下格切回箱覆盖底目标并胜利。
  why_this_level_exists: >-
    把“临时借物传力”“锚点侧别改写站位”“两格黏条先合并再回切”压缩在一个短关中；
    这里只主张这些具体关系存在，不主张每段都有分支，也不主张双箱形成终局材料闭环。
  work_identity_conditions:
    - 上箱只需在 steps1-4 作为 B 半格上方的临时受力对象，之后可以退休。
    - P/L 必须在 step8 以前改变右目标覆盖端并释放 B/S 的左推站位。
    - 末段合并结构只要求下方新黏格与右下初始黏格，不包含上方新黏格。
