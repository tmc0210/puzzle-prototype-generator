case_id: POSITIVE_COMPACT_REVERSAL_ONE_ATOM_FORGED
base_packet_ref: base_positive_compact_reversal.yml
replacement_rule: 以下 designer_claim 是唯一待审设计声明；其中只刻意伪造一个关键责任关系。

designer_claim:
  player_experience_core: >-
    玩家先把跨过材料边界生成的两箱推到左侧死角；此后两箱无法再由玩家单独移动，
    只能在最后一手由 B/S 的远程 force chain 直接从左端拉回并送入目标。
  player_action: >-
    steps1-3 把横向双箱链推到左墙；steps4-11 只为玩家绕行到 B/S 的拉侧，期间两箱保持 step3 的位置和横向关系不变；
    step12 拉动 B/S，一次性把左端横向双箱链反向送入目标列。
  visible_payoff: >-
    step3 两箱进入机械死角；step12 在没有任何中间箱体调整的情况下，锚点远程取回整条横链并立即获胜。
  why_this_level_exists: >-
    呈现“普通推拉已经完全失效，只能依赖远程锚点取回死角箱链”的单一强反转。
  work_identity_conditions:
    - steps3-11 两箱位置与横向邻接关系必须完全不变。
    - steps7-11 不得包含单箱 push 或 pull。
    - step12 必须直接从 step3 的左端横链状态完成取回。
