case_id: GAMMA_FORGED_CLAIM
base_packet_ref: ../candidate_gamma.yml
replacement_rule: >-
  完全忽略 base packet 原有 designer_claim；以下 claim 是唯一待审设计声明。

designer_claim:
  player_experience_core: >-
    B/S 左移使上下两箱同步转黏后，两个新黏格都继续进入末段竖条；
    玩家必须同时保留两者的操作责任，才能让终手把它们一起切回箱并完成左、下两个目标。
  player_action: >-
    玩家规划两只新黏格的汇合次序，使上、下新黏格与右下初始黏格先组成同一竖向结构，
    再整体跨界。
  visible_payoff: >-
    第 17 步三格竖向结构整体跨界，两只由箱转成的黏格同时切回箱，分别覆盖左目标和底目标。
  why_this_level_exists: >-
    展示“双箱同步转黏”不是一次事件标签，而是两个对象都持续承担终局责任的完整材料闭环。
  work_identity_conditions:
    - step11 转黏的上箱必须进入 step15 的末段合并结构。
    - step11 转黏的上下两箱必须都在 step17 再次切回箱。
    - 左目标与底目标必须由这两只再次切回的箱在终手共同完成。
