      method: direct_contradiction
      exact_basis:
        - "solve_instance.layout：M 位于 x4 的三格纵列以及 x5 的上下两端，构成五格 C 形。"
        - "player_reasoning.reasoning_units[RU1_four_cell_anchor_train].premises[1]：B/S 停为 B:x4/S:x5 时，x4 三格变箱而 x5 端点保黏。"
        - "player_reasoning.reasoning_units[RU1_four_cell_anchor_train].feedback：step14 时黏桥变为三箱柱和两个分离端点。"
        - "hard_evidence.target_events：sticky_to_box=1 且 sticky_split=1。"
      countercase: "尝试寻找切割产物数量、材料类型或连通性与声明不符的字段；指定包反而逐项给出一致结果。"
    status: survived_attack
    status_reason: "布局形状、停位前提、step14 反馈与事件统计共同支持该切割事实。"
    surviving_scope: "仅支持发生了所述切割，不支持这一结果必然被玩家提前预见。"

  - claim_id: "alpha_atom_03"
    claim_type: mechanical_fact
    normalized_proposition: "切割后的上端点、下端点和三箱均进入后续结构：屋顶横条、中部覆盖以及把屋顶横条扩成最终三格 L 的最后一箱。"
