      exact_basis:
        - "player_reasoning.reasoning_units[RU2_split_output_order].feedback：step24 时屋顶二格横条覆盖两个目标。"
        - "player_reasoning.reasoning_units[RU3_rebuild_final_l].premises[0]：step24 后还剩两箱与下端点。"
        - "player_reasoning.reasoning_units[RU3_rebuild_final_l].premises[1]：step30 时下端二格条覆盖中部目标，只剩一箱。"
