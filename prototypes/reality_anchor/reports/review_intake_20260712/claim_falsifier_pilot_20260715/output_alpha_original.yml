    status_reason: "三个阶段的剩余材料与反馈闭合，未找到任何切割产物失去后续职责。"
    surviving_scope: "支持材料全被利用的机械经济性；不单独证明这种利用构成玩家侧亮点。"

  - claim_id: "alpha_atom_04"
    claim_type: mechanical_fact
