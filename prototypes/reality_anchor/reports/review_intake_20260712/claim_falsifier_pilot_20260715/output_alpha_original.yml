claim_atoms:
  - claim_id: "alpha_atom_01"
    claim_type: mechanical_fact
    normalized_proposition: "P/L 与 B/S 能组成四格列车，并在 step14 覆盖底部连续四目标。"
    strongest_attack:
      method: direct_contradiction
      exact_basis:
        - "solve_instance.layout：底行 P/L 位于连续四目标左侧。"
        - "player_reasoning.reasoning_units[RU1_four_cell_anchor_train].conclusion：先抽 P/L 两格，再下压 B/S 并连续右推两次。"
        - "player_reasoning.reasoning_units[RU1_four_cell_anchor_train].feedback：step14 时列车覆盖底部四目标。"
