    status_reason: "包内给出了等终局的37步换序回放和35步规范成本，二者直接支持该命题。"
    surviving_scope: "只支持这一个已知换序变体及两步成本差，不推出所有换序都等价。"

  - claim_id: "alpha_atom_05"
