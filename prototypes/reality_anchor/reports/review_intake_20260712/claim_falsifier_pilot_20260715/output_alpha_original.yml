    status: survived_attack
    status_reason: "布局、动作结论和 step14 反馈相互一致，直接支持四格列车停位与目标覆盖。"
    surviving_scope: "仅成立为规范回放中的机械事实，不推出玩家必然把它理解为双约束规划。"

  - claim_id: "alpha_atom_02"
    claim_type: mechanical_fact
    normalized_proposition: "同一停位使 B/S 的材料边界穿过五格 C 形黏桥，把它切成 x4 的三箱柱和 x5 的两个分离黏端点。"
