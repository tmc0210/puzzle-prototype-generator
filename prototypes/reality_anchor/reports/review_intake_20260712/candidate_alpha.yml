prototype_rules:
  win_condition: all_targets_covered_by_objects
  push_pull_anchor: P/L 是可移动二格刚体；玩家所在侧决定 push 或 pull，锚点只平移不旋转。
  box_sticky_anchor: B/S 移动后重写材料边界；箱可转黏、相邻黏格自动合并，跨回 B 侧会切回箱并分裂。

slot_brief:
  intended_role: late_game_dual_anchor_material_reconstruction
  target: 双锚停位、C 形切柱、三路材料重拼与终局 L 形收束。

designer_claim:
  summary: >-
    两枚锚点先组成四格列车覆盖底部连续目标，同时让 B/S 的切割线精确穿过五格 C 形黏桥；
    切割产出的三箱柱与两个黏端点随后分别重拼为屋顶横条、中部覆盖和最终三格 L。
  claimed_highlights:
    - 同一次列车停位同时消费双锚目标责任和远端黏桥切割位置。
    - 切割产物不是废料；上下端点与三箱被分配到三个后续结构中。
    - 上下端可换序，但规范路线用更少换位完成屋顶，再回到底部构造终局 L。

