player_reasoning:
  player_goal:
    description: 让底部连续四目标与上方分散四目标同时被物体覆盖。
    state_ref: canonical.step_0
  reasoning_units:
    - id: RU1_four_cell_anchor_train
      player_question: 两个二格锚点怎样同时停在底部连续四目标，并让 B/S 切割线穿过黏桥连接柱？
      premises:
        - 初始 P/L 占底部左端，B/S 在上一行；四目标从 x4 连续到 x7，右端外侧是墙。
        - C 形连接柱在 x4、两个端点在 x5；B/S 停为 B:x4/S:x5 时，x4 三格变箱而 x5 端点保黏。
      conclusion: 先抽 P/L 两格，再把 B/S 下压并从左端连续右推两次，形成 B/S/P/L 四格列车。
      operation_steps: 1-14
      alternative:
        status: not_claimed
      feedback: step14 时列车覆盖底部四目标，黏桥同时变为三箱柱和两个分离端点。
    - id: RU2_split_output_order
      player_question: 切开后的上下端点都可先处理时，哪一顺序能最短地保留通向另一端的操作位？
      premises:
        - 切后玩家位于底部，三箱柱占 x4；上下端点分别在 x5,y2 与 x5,y4。
        - 下端点可先重拼并覆盖中部目标，但玩家会停在箱柱下侧。
      conclusion: 两端职责可换序；先完成上端再返回下端，少两步换位。
      operation_steps: 15-24
      alternative:
        status: replayed_attempt
        exact_inputs: [up, up, up, right]
        local_gain: 下端点与最下箱立即重拼并覆盖中部目标。
        concrete_outcome: 该路线仍可用总长37步到达与规范35步完全相同的终局，是等价换序而非旁路。
      feedback: step24 时屋顶二格横条覆盖两个目标。
    - id: RU3_rebuild_final_l
      player_question: 屋顶双目标完成后，怎样让剩余材料同时完成中部目标与屋顶下方第三目标？
      premises:
        - step24 时屋顶横条已覆盖两目标，第三目标仍空；还剩两箱与下端点。
        - step30 时下端二格条已覆盖中部目标，只剩一箱；该箱可沿横廊送到屋顶黏格下方。
      conclusion: 先完成下端条，再把最后箱转黏并送到屋顶下方，与横条拼成最终 L。
      operation_steps: 25-35
      alternative:
        status: not_claimed
      feedback: step35 形成三格 L，顶部三目标同时覆盖并立即胜利。
  trace_partition:
    status: complete
    segments:
      - {steps: 1-14, purpose: 双锚列车停位并切断 C 形连接柱}
      - {steps: 15-24, purpose: 重拼上端横条并覆盖屋顶双目标}
      - {steps: 25-30, purpose: 重拼下端横条并覆盖中部目标}
      - {steps: 31-35, purpose: 最后一箱转黏并构成终局 L}

