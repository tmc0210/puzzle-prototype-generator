materially_influential_archive_attacks:
  - candidate_id: RA_CAND_0022
    attack_influence: >-
      其人类5分来自短步骤内“先入死角再反向送箱”的高度凝练反转；Beta 的亮点清楚，但前14步为强制铺垫且换侧行走较长，故形成不支持5的上界。
  - candidate_id: RA_CAND_0025
    attack_influence: >-
      其人类5分要求玩家主动构造并反复消费 L 形结构；Beta 的 C 形整体由开局两步自动合并，玩家没有选择构造形状，故不能借七格规模抬到5。
  - candidate_id: RA_CAND_0020
    attack_influence: >-
      其三个切分输出本质重复，促使本评审检查 Beta 后段是否只是三次清理；Beta 的上臂、门箱与下臂分别承担保路、封井和收尾职责，未落入纯重复，但该攻击限制了分数上沿。
  - candidate_id: RA_CAND_0023
    attack_influence: >-
      其逐格处理三个输出略有重复，促使本评审不把 Beta 的三段短收尾数量本身当优点；Beta 的加分只来自切割后职责与次序关系。
  - candidate_id: RA_CAND_0024
    attack_influence: >-
      其高机制信号最终只兑现推拉腾挪，促使本评审核验双锚承诺；Beta 的 B/S 确实制造七格黏体，固定 P/L 确实切回三箱并分裂双臂，玩家可见几何职责得到兑现，未触发1分问题。
  - candidate_id: RA_CAND_0027
    attack_influence: >-
      其可动 P/L 与黏连 affordance 没有进入解法责任，促使本评审拒绝用事件标签领功；Beta 两条边界都改变同一七格对象的后续操作，因此未触发 affordance 空转。
  - candidate_id: RA_CAND_0030
    attack_influence: >-
      其大量自然、迟缓 deadend 是1分警戒；Beta 也存在持续局部收益后的失败，但当前只确认一条核心错误方向，且双列封井关系可在切割态预判，因此保留非阻塞风险而不降为1。
  - candidate_id: RA_CAND_0032
    attack_influence: >-
      其前段要素退休、后段独立 witness 是1分警戒；Beta 的同一七格整体在切割后产生上臂、门箱和下臂，并由封井次序继续相互约束，故不构成无关子关拼接。

score_calibration:
  human_archive_anchors_present: true
  score_claim_allowed: true
  archive_attack_calibration: complete
  aesthetic_boundary: >-
    支持4，不支持5。可记忆亮点是同一七格对象的合并、切割、职责分配与可预判封井次序；
    强制铺垫、较长换侧和单一核心问题使其达不到标杆级凝练或主动构造强度。
  difficulty_boundary: >-
    支持4，不支持5。玩家需要理解大刚体切割后的材料/通路变化，并抵抗三步得分的自然诱惑；
    但前14步不申报推理，核心只确认一个上臂先于门箱的偏序问题，没有难度5的持续重构或多阶段推理压力。

