critic_items:
  - id: CI_FORCED_SETUP_SCORE_CEILING
    type: score_boundary
    target_ref: forced_setup_disclaimer / claimed_highlights
    design_relation: >-
      玩家看见 S/B 紧邻起点和上室七个材料格；前两步推动 S/B 自动合并七格，随后沿走廊换侧并在 step 14 切割；
      棋盘变化醒目，但在切割前没有 designer 申报的真实选择，玩家后续操作只从切割态开始形成核心问题。
    attack: >-
      不能把合并、绕行、切割的事件数量或七格规模重复领功为多项玩家推理；它们共同只构成一次机制铺垫与一次可记忆转场。
    evidence_basis: forced_setup_disclaimer 明确 step 1-14 不申报 alternative
    player_facing_effect: 亮点清楚但主动发现与构造感弱于5分标杆
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI_DELAYED_POSITIVE_FEEDBACK
    type: nonblocking_risk
    target_ref: RU1_upper_before_gate_crate.alternative
    design_relation: >-
      玩家在 step 14 看见门箱三步可上目标；实际先走 [down,down,right] 后仍能离开，再走七步还能完成下黏臂；
      棋盘连续给出两个目标反馈，之后上黏臂把手才不可达，后续操作从“还能继续”变成无胜。
    attack: >-
      该路线对玩家足够自然且反馈明显迟延；虽可从门箱与另一切出箱共同封两列预判，不至于成为核心缺陷，但复玩时可能被感为一次成本偏高的顺序惩罚。
    evidence_basis: alternative exact inputs、concrete_outcome 与两列封井 premise
    player_facing_effect: 增加一次可归因但不即时的失败成本
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI_LOWER_ORDER_FREE_NOT_MERIT
    type: diagnostic_note
    target_ref: designer_claim.claimed_highlights[2] / hard_evidence.order_monitor
    design_relation: >-
      玩家在正解中先完成上臂，再完成门箱和下臂；packet 只用 order_monitor 声称下臂可在门箱前后调度，
      没有给出下臂先于门箱时的具体输入、棋盘变化和新增后续操作。
    attack: >-
      lower_arm_order_free 可以作为图事实保留，但在缺少另一顺序的玩家侧 exact replay 时，不能把“避免全序脚本”记作独立审美优点。
    evidence_basis: canonical trace 只展示 gate-before-lower；order_monitor 属于 graph evidence
    player_facing_effect: 不影响核心 RU1，通过时不额外加分
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI_TRACE_METRICS_MISSING
    type: context_gap
    target_ref: calibrated_trace_metrics
    design_relation: packet 未提供当前 analysis.solution.traceMetrics.calibrated 的原样副本，也未给 unavailable 原因
    attack: 不允许用 cost=32、reachable_states 或唯一解描述替代规范解执行压力与空间复用校准
    evidence_basis: candidate packet 字段缺失
    player_facing_effect: 当前4/4完全依据局面与操作关系，不获得任何指标加分；缺口随 handoff 保留
    blocks_proposal_ready: false
    expected_designer_response: add_context_next_review
  - id: CI_LATE_GAME_CEILING
    type: score_boundary
    target_ref: slot_brief.intended_role
    design_relation: >-
      玩家经历一次强制合并/切割铺垫后，主要解决上臂先于门箱的一个偏序问题；棋盘变化复杂，但独立推理单元不多。
    attack: 支持晚期阶段挑战，不支持把它描述成难度5或持续多阶段重构的终局峰值
    evidence_basis: forced_setup_disclaimer、唯一 RU1、RA_CAND_0017 人类难度5参照
    player_facing_effect: 对机制熟悉玩家的思考集中而非持续高压
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking

diagnostic_interpretations:
  - graph_fact: reachable_states=514270，legal_transitions=1058153，winning_states=3
    neutral_meaning: 当前规则下机械枚举的可达图规模与胜态数量
    player_facing_interpretation: 无法直接说明玩家看见多少自然选择、是否感到复杂或是否产生洞见
    verdict_effect: none
  - graph_fact: winning_object_configuration_groups=1，solution_uniqueness=equivalent_variants_only
    neutral_meaning: 已枚举胜解收束到一个对象构型组，差异被归为等价变体
    player_facing_interpretation: 不等于唯一计划更优雅，也不等于路线脚本化；没有额外玩家侧结论
    verdict_effect: none
  - graph_fact: upper_before_gate_on_all_wins=true，lower_arm_order_free=true
    neutral_meaning: 所有胜解满足上臂先于门箱，而下臂与门箱之间不存在同样的全胜解顺序约束
    player_facing_interpretation: >-
      上臂偏序只有结合 step 14 两列封井局面才成为玩家推理；下臂自由顺序缺少具体玩家回放，不计 merit
    verdict_effect: none
  - graph_fact: alternative continuation_found_win=false
    neutral_meaning: 指定门箱优先、再完成下臂的结果态在完整续搜中无胜
    player_facing_interpretation: >-
      自然路线连续获得两个目标反馈后失败，构成真实的延迟反馈风险；可见双列封井关系使该风险仍可归因和预判
    verdict_effect: caveat
  - graph_fact: solver found=true，cost=32
    neutral_meaning: 给定规范输入合法获胜且成本为32
    player_facing_interpretation: 只证明可审，不证明审美、难度或 role fit
    verdict_effect: none

handoff_notes:
  - >-
    最终结论与 frozen independent reading 完全同档：4/4、supports_with_noncore_caveats、proposal_ready_with_caveats、none；
    designer claim 只把门箱封井的玩家侧因果说清，没有令评分或 verdict 变宽松。
  - >-
    保留两个非阻塞边界：前14步只算铺垫，不应在后续说明中拆成多项洞见；门箱优先路线的局部正反馈较长，
    handoff 应持续将其描述为可预判的双列封井，而不是用完整续搜替代玩家可读性。
  - >-
    calibrated_trace_metrics 缺失已记录为 context_gap；除非后续另行路由，不影响本次基于玩家侧 exact 局面的结论，也不得用图规模补位。
