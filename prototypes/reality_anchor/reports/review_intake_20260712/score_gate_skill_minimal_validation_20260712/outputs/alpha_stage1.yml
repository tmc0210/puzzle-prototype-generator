critic_items:
  - id: score_boundary_not_5
    type: score_boundary
    target_ref: preliminary_aesthetic
    design_relation: step20 与 step30 的上下端点重组
    attack: >-
      两段都呈现“单箱跨回黏侧并与端点组成二格条”，当前 raw 所示差异不足以证明两次需要不同的核心洞见。
    evidence_basis: mechanically_derived_trace step20、step30；RA_CAND_0020 与 RA_CAND_0023 的重复分支人类下界。
    player_facing_effect: 玩家可能在识别第一次配对后，把第二次视为同构执行而非新的结构理解。
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: bottom_goal_carpet_readability_tradeoff
    type: nonblocking_risk
    target_ref: initial layout bottom row and step14
    design_relation: P/L、B/S 与底部四个连续目标的四格列车停靠
    attack: >-
      四个连续目标几乎直接标出两副二格锚点最终应排成的长度与停靠位置，可能让中央构造更像强提示下的执行。
    evidence_basis: layout 第8行 P/L 后紧邻四个连续 G；step14 恰由四格列车覆盖它们。
    player_facing_effect: 降低双锚列车用途的发现压力，但提高材料切割转折的可读性。
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: dual_anchor_claim_boundary
    type: diagnostic_note
    target_ref: post_step14 anchor roles
    design_relation: P/L 与 B/S 在中央转折后的持续责任
    attack: >-
      当前 raw 明确显示 B/S 后续继续参与 box_to_sticky 与 sticky_merge；未明确显示 P/L 在 step14 后还有除覆盖目标外的新操作责任。
    evidence_basis: significant_states step14、step20、step30、step35。
    player_facing_effect: 若第二阶段 claim 声称全程持续双锚耦合，应收窄为“前半双锚列车转折，后半 B/S 材料重组”。
    blocks_proposal_ready: false
    expected_designer_response: answer_from_packet

