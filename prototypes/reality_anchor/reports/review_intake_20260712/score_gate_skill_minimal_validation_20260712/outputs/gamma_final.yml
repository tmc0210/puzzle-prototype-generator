role_fit:
  intended_role: dual_anchor_stage_challenge
  status: not_supported_at_claimed_difficulty
  retained_role_value: >-
    作为双锚综合应用或常规挑战，关卡有明确价值；若必须占用 stage_challenge 槽位，需结构性增加可分析、非廉价枚举的计划压力，
    而不是增加步数、对象、重复腾挪或延迟反馈。
  allowed_resolution:
    - 降档为双锚常规挑战，并修正 RU1 replay 与 player_goal 后重新送审。
    - 暂缓当前版本；若坚持 stage_challenge 角色，另做结构修订并由 fresh critic 重新评审。

language_drift:
  obvious_overpackaging: false
  examples: []
  required_action: none
  checked_phrases:
    - phrase: 受力交接
      concrete_mapping: steps 1-4，上箱先下推，P/L 右移释放站位，上拉 B/S 时 B 半格把箱顶回原行。
    - phrase: 侧别重写
      concrete_mapping: steps 5-11，L 暂时覆盖右目标；P/L 下推后 P 接手目标，B/S 右侧站位从 pull 失败位变为可左推位置。
    - phrase: 材料闭环
      concrete_mapping: steps 11/15/17，两个箱转黏、下部黏格与初始黏格合并竖条、竖条跨 B 侧切回两箱。
  note: >-
    三个结构短语都能对应具体对象、操作、棋盘变化和后续操作变化，未达到 obvious_overpackaging；
    RU1 alternative 错误和 player_goal 混入解法概括是 claim 准确性问题，另由 critic_items 阻塞。

critic_items:
  - id: gamma_ru1_replayed_attempt_conflicts_with_raw
    type: core_blocker
    target_ref: player_reasoning.reasoning_units.RU1_borrowed_crate_lift.alternative
    design_relation: >-
      candidate 声称 exact_inputs=[down] 会“一次输入同时移动箱与 B/S”，concrete_outcome 也是“箱与 B/S 一起下移”；
      frozen raw 的 mechanically_derived_trace.step1 只记录 push_crate 和“上箱下推一格”。
    attack: >-
      replayed_attempt 没有产生 designer 声称的具体局面，local_gain 也建立在不存在的 B/S 位移上；
      因此 RU1 的 alternative 不能证明玩家会认真比较这条路线，也不能支撑其难度说明。
    evidence_basis:
      - "candidate RU1 alternative.exact_inputs=[down]"
      - "candidate RU1 local_gain=一次输入同时移动箱与 B/S"
      - "frozen raw step1 events=[push_crate], visible_change=上箱下推一格"
    player_facing_effect: 设计说明向玩家推理中注入了不存在的局面后果，夸大了开局选择的局部收益与矛盾。
    blocks_proposal_ready: true
    expected_designer_response: revise_claim
  - id: gamma_stage_challenge_role_mismatch
    type: core_blocker
    target_ref: slot_brief.intended_role
    design_relation: >-
      intended_role 是 dual_anchor_stage_challenge；可支持的推理点主要是 RU2 的侧别改写和 RU3 的先合并后切回，
      而两个有效 alternatives 都在第二个输入立即失败且状态不变。
    attack: >-
      及时反馈是优点，但这些路线可被廉价局部枚举排除，未形成阶段挑战所需的强反直觉重构、
      多阶段因果负担或能依据共同可见关系剪枝的高质量选择面。
    evidence_basis:
      - "RU2 alternative [down,left]：第二步失败且状态不变"
      - "RU3 alternative [left,down]：第二步失败且两块仍分离"
      - "RA_CAND_0015 人评 4/3：简洁、充分机制覆盖、清晰逻辑链"
      - "RA_CAND_0022 与 RA_CAND_0025 人评 5/4：分别有强死角反转和主动 L 形构造"
    player_facing_effect: 玩家更可能通过短局部试错确认顺序；这足以构成常规挑战，但与 stage challenge 槽位不匹配。
    blocks_proposal_ready: true
    expected_designer_response: downgrade_or_hold
  - id: gamma_player_goal_mixes_goal_and_solution_summary
    type: improvement_opportunity
    target_ref: player_reasoning.player_goal.description
    design_relation: >-
      “覆盖三个目标”是胜利目标；“判断双锚、两个箱和右下黏格如何共享有限操作位”是 designer 对解法内容的概括。
    attack: player_goal 应只陈述玩家追求的可见结果，具体操作位问题应落在对应 reasoning unit 的 player_question。
    evidence_basis:
      - "player_goal.description=覆盖三个目标，并判断双锚、两个箱和右下黏格如何共享有限操作位"
    player_facing_effect: 当前写法把解法分析伪装成玩家目标，模糊了玩家何时、为何产生具体问题。
    blocks_proposal_ready: false
    expected_designer_response: revise_claim
  - id: gamma_calibrated_trace_metrics_missing
    type: context_gap
    target_ref: calibrated_trace_metrics
    design_relation: candidate packet 完全缺少当前 analysis.solution.traceMetrics.calibrated 的原样副本或 unavailable 状态与原因。
    attack: 按 critic 输入合同必须显式提供该字段；本评审不能默认忽略，也不能从 canonical_cost 或 graph counts 代替推导。
    evidence_basis:
      - candidate_gamma.yml 中无 calibrated_trace_metrics 字段
    player_facing_effect: 不改变当前具体玩家侧判断，但使执行压力与空间复用的校准上下文缺失。
    blocks_proposal_ready: true
    expected_designer_response: add_context_next_review
  - id: gamma_forced_show_risk_retained
    type: nonblocking_risk
    target_ref: player_reasoning.reasoning_units
    design_relation: >-
      trace_partition 把 17 步分为三个目的段，但 RU2、RU3 的失败方向都在第二步立即失效；
      graph 唯一解也不能说明玩家会把这些段读成推理而非唯一合法操作。
    attack: >-
      关卡没有落入 RA_CAND_0031 那种无复用长开场，因为对象责任确有变化；
      但若首次玩家主要靠相邻格试探，机制闭环的难度价值仍会弱于设计说明。
    evidence_basis:
      - "RU2/RU3 alternatives 均为第二步立即失败"
      - "RA_CAND_0031 人评：事件齐全不能补偿单行道演出与显然顺序锁"
    player_facing_effect: 可能呈现为清楚好看的 4/3 综合应用，而非 4 难度的阶段挑战。
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: gamma_final_score_boundary
    type: score_boundary
    target_ref: aesthetic_target_fit_and_difficulty_target_fit
    design_relation: 具体跨锚点接力支持审美 4；现有玩家推理只支持难度 3。
    attack: 不得用 unique_complete、reachable_states=381、事件齐全或 canonical_cost=17 把 4/3 抬为 5/4。
    evidence_basis:
      - "steps 1/2/4、5/8/11、15/17 的具体责任变化"
      - "两个有效 alternatives 都在第二步立即失败"
      - "RU1 alternative 与 frozen raw 冲突"
    player_facing_effect: 亮点可记忆且机制兑现，但选择压力和反直觉重构不足以占用更高难度/审美档位。
    blocks_proposal_ready: false
    expected_designer_response: downgrade_or_hold

diagnostic_interpretations:
  - graph_fact: "reachable_states=381, legal_transitions=837, winning_states=1, solution_uniqueness=unique_complete"
    neutral_meaning: 在 packet 声明的状态图中只有一个获胜状态和一条完整最短输入序列，图规模为所列数值。
    player_facing_interpretation: 这些数值不说明玩家看见哪些路线自然、何时获得反馈，也不区分推理剪枝与逐项试错。
    verdict_effect: none
  - graph_fact: "all_winning_path_events 含双锚位移、pull、box_to_sticky、sticky_merge、move_sticky_rigid、sticky_to_box"
    neutral_meaning: packet 声明所有胜路都包含这些机械事件，且两类锚点位移各有最低次数。
    player_facing_interpretation: 事件确实对应 frozen reading 中的具体对象变化，但“所有事件都出现”只证明机制进入解，不证明其产生洞见或阶段挑战难度。
    verdict_effect: none
  - graph_fact: "solver.found=true, cost=17, explored_states=295"
    neutral_meaning: packet 声明存在 17 输入获胜解，并报告求解搜索规模。
    player_facing_interpretation: canonical 可执行是进入评审的前提；搜索规模不是人类玩家难度、审美或 role fit 的代理。
    verdict_effect: none

handoff_notes:
  - frozen independent_reading 与 initial_* 已原样保留；最终结论只收紧，没有放宽。
  - 当前版本可作为审美 4、难度 3 的双锚常规挑战候选，但不支持 dual_anchor_stage_challenge 角色。
  - 若选择降档，仍需删除 RU1 中不存在的 B/S 同步下移结果、把 player_goal 收束为覆盖目标，并显式补齐 calibrated_trace_metrics 后由 fresh critic 重新送审。
  - 若坚持 stage challenge，不应靠增加步数、对象、重复或延迟 deadend 增难；需要从可见矛盾出发重做能产生真实计划重构的结构，再由 fresh critic 评审。
