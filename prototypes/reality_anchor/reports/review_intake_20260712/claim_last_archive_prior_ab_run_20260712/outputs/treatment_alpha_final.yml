        达到“密度与耦合必须落到玩家后续动作”的标准。
    - candidate_id: RA_CAND_0005
      effect: >-
        用作双锚/长链 4 分正边界：本关四格锚点列车同样是玩家必须主动形成、并承担远端
        材料变化的结构，不只是把锚点排在目标上。
    - candidate_id: RA_CAND_0020
      effect: >-
        实质触发重复攻击：同为 C 形切分输出，0020 的三支重复行动只到 3/2；本关虽因
        step 14 的双重责任和最终 L 复用高一档，但上下支相似仍限制其难度与 5 分可能。
    - candidate_id: RA_CAND_0024
      effect: >-
        用作 affordance 检查：本关可见双锚和大黏块确实兑现切割、重拼与刚体几何，因此
        未落入“信号丰富、实际只腾挪”的 1 分失败；该对照不直接加分。
    - candidate_id: RA_CAND_0031
      effect: >-
        用作事件演出攻击：本关前 14 步的锚点移动在 step 14 同时产生两个持久后果，且
        切分部件后续复用，故不是无效开场；但也促使本评审拒绝用事件数量抬高难度。
    - candidate_id: RA_CAND_0032
      effect: >-
        用作子题割裂攻击：列车切分直接生成后段全部材料，前后存在对象与因果连续性，
        没有前段对象退休后另拼 witness。
    - candidate_id: RA_CAND_0022
      effect: >-
        用作 5 分上界：本关没有“主动进入似死局再反向解出”那种集中、强反直觉洞见。
    - candidate_id: RA_CAND_0025
      effect: >-
        用作 5 分上界：本关有重拼，但关键列车与初始 C 形均被目标几何强提示，未达到
        主动构造并反复使用亮点结构的标杆集中度。

