critic_items:
  - id: FINAL_BLOCKER_LINEAGE_01
    type: core_blocker
    target_ref: slot_brief_and_designer_claim.C_shape_column_three_way_rebuild
    design_relation: >-
      玩家看见的五个 M 与 RA_CAND_0020 一样形成 C 形，B/S 同样位于其下方；
      step 14 移动 B/S 后同样得到 x4 三箱柱与 x5 上下黏端，之后仍把这些输出分路送往目标。
    attack: >-
      designer claim 将“C 形切柱、三路材料重拼”明确列为本候选目标，却未声明或授权以 RA_CAND_0020 做 archive variant；
      新增双锚列车改变了触发方式并提高了回收密度，但没有消除主要布局骨架和输出角色的继承。
    evidence_basis:
      - candidate slot_brief.target
      - designer_claim.summary 与 claimed_highlights
      - candidate layout 与 step 14 feedback
      - RA_CAND_0020 layout、core logic 与人评
    player_facing_effect: >-
      完整体验的新鲜内容集中在“如何移动切割线”，切开之后的主问题仍是已归档的 C 形三路输出 family；
      因而不能按独立 late-game reconstruction 新候选放行。
    blocks_proposal_ready: true
    expected_designer_response: revise_now
  - id: FINAL_CLAIM_RU2_01
    type: score_boundary
    target_ref: RU2_split_output_order
    design_relation: >-
      玩家在 step 14 看见上下端点均可处理；canonical 先走上端在 step 24 覆盖屋顶，replayed alternative 先走下端也立即获得局部目标并在37步到达同终局。
    attack: >-
      该 unit 回答的是“哪条成功路线少两步”，不是避免失败或解锁新结构的必要洞见；
      若玩家不追求最短解，先下后上没有形成矛盾，因此 RU2 不应被用来抬高 late-game 核心推理密度。
    evidence_basis:
      - RU2 premises/conclusion
      - RU2 replayed_attempt 37步同终局
      - canonical 35步
    player_facing_effect: 两端选择提供自由度和较好节奏，但主要差异是换位效率，不构成新的解题门槛。
    blocks_proposal_ready: false
    expected_designer_response: revise_claim
  - id: FINAL_RISK_POST_SPLIT_01
    type: nonblocking_risk
    target_ref: RU2_and_RU3_steps_15_35
    design_relation: >-
      玩家在切分后依次看见上端+上箱、下端+下箱和最后箱；
      steps 20、30、35 各发生一次箱转黏并合并，棋盘依次完成屋顶横条、中部条和终局 L。
    attack: >-
      三次“箱接端点/既有黏块”的动作虽服务不同终局形状，但后两段的 premises 已几乎列出直接配对；
      玩家侧可能在 step 14 的中心洞见后转入顺次执行，限制审美上限。
    evidence_basis:
      - RU2/RU3 premises 与 conclusions
      - trace_partition steps 15-35
      - target_events box_to_sticky:3, sticky_merge:3 仅作定位，不作质量证明
      - RA_CAND_0020 与 RA_CAND_0023 人评重复边界
    player_facing_effect: 后半程仍有形状回收，但每支的独立惊喜可能不足，整体支持4而不支持5。
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: FINAL_CONTEXT_METRICS_01
    type: context_gap
    target_ref: calibrated_trace_metrics
    design_relation: packet 提供 solver、graph、shortest_layer 与事件计数，但完全缺少 calibrated_trace_metrics 或 unavailable 原因。
    attack: >-
      baseline 输入合同要求该字段原样提供；当前不能做规范解执行压力与空间复用的校准读取，
      也不能拿 explored_states、path_count 或事件计数代替。
    evidence_basis: candidate packet field absence
    player_facing_effect: 不影响已由具体局面形成的 lineage 与审美判断，但最终包上下文不完整。
    blocks_proposal_ready: true
    expected_designer_response: add_context_next_review
  - id: FINAL_DIAGNOSTIC_CLAIM_ROUTE_01
    type: diagnostic_note
    target_ref: claim_last_review.mode
    design_relation: 实际读取顺序为 raw-first artifact 落盘后才读取完整 candidate packet，但 packet 自报 mode:not_used。
    attack: 路由元数据与 controller 实际调用不一致；本评审按实际顺序记录 claim_last_used:true。
    evidence_basis:
      - frozen Stage 1 artifact
      - controller second-stage instruction
      - candidate claim_last_review.mode:not_used
    player_facing_effect: none
    blocks_proposal_ready: false
    expected_designer_response: add_context_next_review

diagnostic_interpretations:
  - graph_fact: "graph.status: exhausted, explored_states: 500001；evidence_limits 同时声明完整图未穷尽"
    neutral_meaning: 搜索在给定规模边界停止，不能声明完整图、完整 SCC 或全图唯一性。
    player_facing_interpretation: 该事实不说明玩家会感到结构精巧、困难或被迫；玩家侧结论仍来自布局和具体操作后果。
    verdict_effect: none
  - graph_fact: "shortest_layer.status: complete_through_first_win_depth, path_count: 1, win_state_count: 1"
    neutral_meaning: 在首胜深度内记录到一个最短输入路径和一个胜利状态，不排除更长的等价成功路线。
    player_facing_interpretation: 结合已 replay 的37步同终局路线，只能说明35步最短路线的收束性，不能把唯一最短路直接当作玩家洞见或审美优点。
    verdict_effect: none
  - graph_fact: "known_equivalent_variant.cost: 37, same_final_state: true"
    neutral_meaning: step 14 后至少存在先处理下端的合法较长成功顺序。
    player_facing_interpretation: 玩家无需靠试错找出唯一正确端点顺序；差异主要是两步换位效率，因此降低 forced-order 风险，但不增加核心难度分。
    verdict_effect: none

handoff_notes:
