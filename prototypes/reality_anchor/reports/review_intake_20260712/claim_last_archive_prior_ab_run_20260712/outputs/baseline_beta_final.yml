critic_items:
  - id: CI_MISSING_CALIBRATED_TRACE_METRICS
    type: context_gap
    target_ref: candidate_packet.calibrated_trace_metrics
    design_relation: >-
      packet 提供 canonical_cost 与 graph 规模，却没有提供当前 analysis.solution.traceMetrics.calibrated 的原样副本，
      也没有 status: unavailable 与原因。
    attack: >-
      技能输入合同要求该字段；缺失时不能默认为无关，也不能用 cost 或 graph 统计替代。
    evidence_basis: candidate_beta.yml contains no calibrated_trace_metrics field
    player_facing_effect: >-
      不改变当前基于具体局面的审美和难度分数，但阻止本轮进入 proposal_ready，需补齐上下文后由新评审处理。
    blocks_proposal_ready: true
    expected_designer_response: add_context_next_review
  - id: CI_FORCED_SETUP_SCORE_BOUNDARY
    type: score_boundary
    target_ref: player_reasoning.forced_setup_disclaimer_and_trace_partition.steps_1_14
    design_relation: >-
      玩家前两步推 B/S 形成七格整体，之后沿长竖井和右侧通道抵达拉侧，第 14 步完成整体切割。
    attack: >-
      designer 正确地没有为这 14 步虚构 alternative；相应地，它们也不能被重复计为多个推理层次来抬高后期难度。
    evidence_basis: forced_setup_disclaimer explicitly excludes steps 1-14 as a claimed contradiction
    player_facing_effect: >-
      玩家得到一次醒目的构造与切分，但主要规划集中在切割后的单一门序问题，支持难度 4 边界而不支持难度 5。
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI_DELAYED_BRANCH_FEEDBACK
    type: nonblocking_risk
    target_ref: player_reasoning.reasoning_units.RU1_upper_before_gate_crate.alternative
    design_relation: >-
      玩家先用三步让门箱覆盖底口目标，仍能离开并再用七步完成下臂，之后才剩下无把手可达的上臂。
    attack: >-
      两次局部成功使错误路线高度自然；只有切割态的双列竖井占用关系足够醒目并可提前推断时，
      这才是公平的顺序洞见，否则会转化为高成本返工。
    evidence_basis: replayed alternative and concrete_outcome in RU1; raw alternative from step 14
    player_facing_effect: >-
      玩家可能在投入十步并获得两个目标反馈后才发现失败，主观难度可能来自迟反馈搜索。
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI_MIRRORED_ARM_REPETITION
    type: nonblocking_risk
    target_ref: trace_partition.steps_15_18_and_26_32
    design_relation: >-
      上黏臂在第 18 步被拉入目标，下黏臂在第 32 步以相近的拉动完成；中央门箱负责改变二者访问顺序。
    attack: >-
      若实际手感中门箱对访问面的改写不够突出，两臂会像镜像重复输出，而非切分后职责分化。
    evidence_basis: canonical significant states at steps 18, 25, and 32
    player_facing_effect: >-
      后半段可能从局部偏序推理滑向按序消费三个输出，削弱七格切分的余韵。
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI_CLAIM_LAST_MODE_MISMATCH
    type: diagnostic_note
    target_ref: claim_last_review.mode
    design_relation: packet declares not_used while controller actually enforced raw-first then candidate-packet reading
    attack: 仅记录元数据不一致；本 critic 按实际读取顺序完成且冻结了 independent_reading。
    evidence_basis: frozen stage1 artifact predates reading candidate_beta.yml
    player_facing_effect: none
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking

diagnostic_interpretations:
  - graph_fact: reachable_states=514270, legal_transitions=1058153, winning_states=3, winning_object_configuration_groups=1
    neutral_meaning: 给定状态图中存在大量可达状态、三个位于同一对象构型组的胜利状态。
    player_facing_interpretation: 图规模和胜态数量本身不说明玩家会获得洞见、惊喜或公平难度。
    verdict_effect: none
  - graph_fact: upper_before_gate_on_all_wins=true and lower_arm_order_free=true
    neutral_meaning: 所有胜解满足上臂早于门箱，下臂相对门箱没有固定先后。
    player_facing_interpretation: >-
      与切割态可见的竖井双列占用关系合看时，它支持一个局部偏序而非全序脚本；
      玩家侧 merit 仍来自具体门箱操作和访问面变化，而不是 monitor 本身。
    verdict_effect: merit
  - graph_fact: alternative continuation_status=complete and continuation_found_win=false
    neutral_meaning: 先填门箱再完成下臂的指定结果态没有可达胜利。
    player_facing_interpretation: >-
      说明错误路线确实会保留活动空间和局部收益后失败；由于失败反馈较迟，它同时带来返工风险。
    verdict_effect: caveat

handoff_notes:
  - >-
    设计质量结论为审美 4、难度 4 边界；补齐 calibrated_trace_metrics 不能使此结论变宽，
    下一次重新送审必须使用新的 fresh critic。
  - >-
    保留两项玩家侧风险：门箱错误路线可能在十步和两个目标反馈后才暴露，以及上下黏臂收尾可能形成镜像重复。
  - >-
    critic 不授予 accepted、mainline、positive_reference 或 archive 身份。
