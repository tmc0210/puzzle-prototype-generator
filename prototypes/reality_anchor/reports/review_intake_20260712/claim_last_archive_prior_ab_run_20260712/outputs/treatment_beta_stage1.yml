stage1_handoff_notes:
  - >-
    第二阶段只可在同一 critic session 中继续读取 controller 明确提供的 candidate/facts/claim packet；不得覆写本 independent_reading，最终结论只能维持或更严格。
  - >-
    当前 structural_revision 的最低目标是：让门箱优先的失败在明显执行投入前可见，或允许玩家从该局面恢复；不能只靠说明文字把延迟死局重新命名为洞见。
