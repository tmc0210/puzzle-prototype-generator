stage1_critic_items:
  - id: CI_STAGE1_01
    type: core_blocker
    target_ref: "alternative from step 14"
    design_relation: >-
      玩家先完成门箱目标且保持退路，再完成下黏臂目标，最后才发现上黏臂把手已不可达。
    attack: >-
      当前顺序约束的失败反馈过晚，且错误路线连续获得两次目标覆盖的强正反馈。除非后续 packet 能用第 14 步当时可见的具体几何证明玩家可以在投入前可靠剪枝，
      否则这是结构性高成本分支，而不是值得奖励的反直觉洞见。
    evidence_basis: >-
      raw_alternatives.from=step14 的三步即时结果与七步 delayed_result。
    player_facing_effect: >-
      玩家可能在看似稳健地完成两个目标后被迫重置并重走合体、搬运和拆分段，难度质量被试错成本污染。
    blocks_proposal_ready: true
    expected_designer_response: revise_now
  - id: CI_STAGE1_02
    type: context_gap
    target_ref: "step 14 significant state"
    design_relation: >-
      门箱占位与上黏臂把手可达性之间的具体逐格关系未在 raw 显著状态中展示。
    attack: >-
      后续材料必须说明第 14 步当时玩家看见哪些墙、站位、对象位置，怎样在行动前推出门箱先入目标会封死上黏臂；
      只说明完整续搜无胜不能建立玩家侧可读性。
    evidence_basis: >-
      mechanically_derived_trace 仅给出第 14 步文字变化，未给出该状态的逐格布局。
    player_facing_effect: >-
      无法区分“可分析的先后依赖”与“试过才知道的顺序陷阱”。
    blocks_proposal_ready: true
    expected_designer_response: add_context_next_review
  - id: CI_STAGE1_03
    type: nonblocking_risk
    target_ref: "canonical steps 2-14"
    design_relation: >-
      七格整体在第 2 步形成，到第 14 步才拆分，中间主要沿单通道搬运。
    attack: >-
      核心状态变化之间可能有偏长的执行段，需要确认实际手感是否仍保持紧凑。
    evidence_basis: >-
      canonical_exact_inputs 与 significant_states 的事件间隔。
    player_facing_effect: >-
      可能稀释合并与拆分的惊喜，但不直接破坏主逻辑。
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking

