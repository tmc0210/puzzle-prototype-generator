  - ref: RA_CAND_0025
    role: positive_active_constructor
    human_basis: 主动构造 L 形并在终局被双目标提示和消费获人评审美5、难度4
    calibration_effect: 本候选也有形状重组与 L 形终局，但主动构造是否贯穿后半段仍未由 raw trace充分显示
  - ref: RA_CAND_0031
    role: negative_forced_order_show
    human_basis: 长开场机制演出、对象不复用且核心只剩显然重复顺序锁获人评审美1
    calibration_effect: 警戒 step 2-14 是否只是演出；本候选因 step 14 同时改变底部目标与上方材料、且后续继续使用输出而暂不落入该反例
  - ref: RA_CAND_0032
    role: negative_disconnected_subpuzzles
    human_basis: 前段要素退休、后段独立 witness 导致割裂获人评审美1
    calibration_effect: 本候选底部锚点横移直接生成后半段所需材料输出，前后存在因果交接，暂不构成独立子关拼接
  - ref: RA_CAND_0020
    role: lineage_and_repetition_boundary
    human_basis: C 形黏块切成三路输出，三分支实际重复但几何对称性使其获人评审美3、难度2
    calibration_effect: 本候选的同骨架继承构成阻塞；新增双锚列车与重拼形状虽提高独立体验，但不能替代 archive variant 授权或结构差异化

