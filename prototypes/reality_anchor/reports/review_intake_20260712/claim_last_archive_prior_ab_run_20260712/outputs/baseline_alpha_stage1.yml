critic_items:
  - id: IR_BLOCKER_LINEAGE_01
    type: core_blocker
    target_ref: candidate_layout_and_step14_material_split
    design_relation: >-
      玩家看见的五个 M 构成与 RA_CAND_0020 相同的 C 形，B/S 同样位于其下方；
      step 14 移动 B/S 边界后，棋盘同样产出上下黏端点和中间箱柱，后续仍分别把这些输出送往目标。
    attack: >-
      新增的 P/L+B/S 底部列车确实让触发方式与目标回收更丰富，但没有改变被继承的主要布局骨架和三路输出角色；
      raw packet 又没有明确授权以 RA_CAND_0020 做 archive variant work，按 critic 规则该 lineage 必须阻塞 proposal-ready。
    evidence_basis:
      - candidate layout C形 M + 下方 B/S
      - candidate trace step 14 sticky_to_box/sticky_split
      - RA_CAND_0020 layout 与 human-reviewed core logic
    player_facing_effect: >-
      熟悉该 archive family 的玩家仍会识别出同一“切 C 形、消费上下端与中柱”的主问题，
      新鲜感主要集中在触发切分的双锚列车，而非完整因果链的重新发明。
    blocks_proposal_ready: true
    expected_designer_response: revise_now
  - id: IR_RISK_POST_SPLIT_01
    type: nonblocking_risk
    target_ref: trace_steps_20_35
    design_relation: >-
      玩家在 step 14 后看见三个箱输出与两个黏端点；canonical 路线依次形成上横条、下二格条和终局 L；
      棋盘目标随之逐组被覆盖，后续操作按输出分支展开。
    attack: >-
      如果每个分支只是在最近端点旁推一次箱再搬到目标，后半段会接近 RA_CAND_0020/0023 所警示的重复消费；
      当前 raw significant states 未给出足够完整坐标来确认三次重组是否各自要求不同计划。
    evidence_basis:
      - trace steps 20,24,30,35
      - raw alternative from step 14
      - RA_CAND_0020 与 RA_CAND_0023 人评重复边界
    player_facing_effect: 中心反转之后可能出现解题强度下降，后半程更像执行已经显露的配对。
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: IR_CONTEXT_METRICS_01
    type: context_gap
    target_ref: calibrated_trace_metrics
    design_relation: raw packet 未包含该字段，本阶段也未运行任何工具补证据。
    attack: 不能用轨迹指标辅助检查规范解执行压力或空间复用；这不改变已经完成的玩家侧 raw-first 初判。
    evidence_basis: raw packet field absence
    player_facing_effect: none_at_raw_first_stage
    blocks_proposal_ready: false
    expected_designer_response: add_context_next_review

