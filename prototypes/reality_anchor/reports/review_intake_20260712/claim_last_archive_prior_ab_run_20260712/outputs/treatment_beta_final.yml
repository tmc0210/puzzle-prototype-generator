claim_effect_reason: >-
  designer claim 补全了 late-game role、门箱的双重职责以及“上臂先于门箱、下臂顺序自由”的意图，
  但它同时明确承认错误路线会持续产生局部收益；正解 feedback 不能为错误选择提供及时预警，
  graph/order facts 也只证明顺序必要，不证明玩家能在行动前读出顺序。因此不放宽 stage1 初判。

