handoff_notes:
  - 第二阶段不得覆写 independent_reading 或放宽 initial verdict/state/action。
  - 读取 designer claim 后重点核对：第 5 至 8 步的目标覆盖接力是否增加真实计划理由，以及关键决策处是否存在比两条立即非法尝试更自然、反馈更迟的错误路线。
  - 本阶段未读取 candidate packet、designer claim、旧评审或实验 handoff，未运行 solver、analyzer 或 graph。
