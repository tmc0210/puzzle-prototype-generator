critic_items:
  - id: CI_RAW_1
    type: nonblocking_risk
    target_ref: raw_alternatives
    design_relation: 玩家在关键状态看见可走方向 -> 尝试两个输入 -> 第二个输入立即非法且棋盘不变 -> 回到原状态继续枚举
    attack: >-
      两条替代都只证明局部动作受阻，未显示玩家能否从一个共同的可见关系提前剪枝；
      若其他自然方向也主要靠逐项试出非法，关卡难度会偏执行式搜索。
    evidence_basis: step5 后 [down,left] 与 step13 后 [left,down] 均在第二步失败且状态不变。
    player_facing_effect: 可能削弱计划感，但失败及时、回滚成本低，因此 stage1 不阻塞。
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI_RAW_2
    type: score_boundary
    target_ref: canonical steps 5 and 8
    design_relation: 玩家看见 P/L 对准右目标 -> 先右推再下推 -> 覆盖者由 L 换成 P -> 转入 B/S 与材料收尾
    attack: >-
      raw 尚未说明临时由 L 覆盖为何必须，或它排除了哪条认真可选的路线；在此之前，
      这段只足以作为紧凑目标接力，不足以单独支撑标杆级洞见。
    evidence_basis: step5 的 L 覆盖右目标与 step8 的 P 覆盖右目标。
    player_facing_effect: 限制审美上界，不否定第 11 至 17 步的真实材料链。
    blocks_proposal_ready: false
    expected_designer_response: answer_from_packet
  - id: CI_RAW_3
    type: context_gap
    target_ref: brief role fit
    design_relation: 玩家面对全规则双锚题 -> 执行 17 步复合链 -> 体验落在常规挑战附近 -> 是否匹配课程位置未知
    attack: 目标玩家、机制暴露窗口、目标难度与课程位置不在 raw packet 中，无法完成最终 role-fit 判断。
    evidence_basis: raw packet 只提供规则、布局、规范输入、机械轨迹、两条替代和 archive refs。
    player_facing_effect: 不影响 raw-first 独立读取，但第二阶段必须据 brief 收紧最终结论。
    blocks_proposal_ready: false
    expected_designer_response: answer_from_packet

