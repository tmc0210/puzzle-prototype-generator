packet_kind: anonymous_fact_pair
prototype_rules:
  symbols: {wall: '#', floor: '.', player: '@', crate: C, sticky: M, goal: G, push_pull_anchor: P/L, material_anchor: B/S}
  rules:
    - P/L 定义 push/pull 侧；B/S 定义箱/黏材料边界。
    - 箱跨入 S 侧转为黏格；黏格跨回 B 侧切回箱。
    - 相邻黏格自动合并为刚体；推拉可以形成 force chain。
  win_condition: 所有目标由对象覆盖。

case_A:
  layout: |-
    #######
    ##PL###
    #######
    ##..G##
    #MMM.G#
    #..#..#
    ##...@#
    #######
    ###SB##
    #######
  canonical_inputs: [up, up, left, right, down, down, left, left, left, up, up, right, left, right, left, down, down, right, right, up, up, down, right, down, left, left, left, up, up, right]
  event_steps:
    - {step: 4, input: right, events: [pull_object, move_sticky_rigid, sticky_to_box]}
    - {step: 11, input: up, events: [push_object, move_sticky_rigid]}
    - {step: 13, input: left, events: [pull_object, box_to_sticky, sticky_merge]}
    - {step: 14, input: right, events: [push_object, move_sticky_rigid, sticky_to_box]}
    - {step: 15, input: left, events: [pull_object, box_to_sticky, sticky_merge]}
    - {step: 22, input: down, events: [pull_object]}
    - {step: 30, input: right, events: [push_object, force_chain, move_sticky_rigid, sticky_to_box]}
  final_win: true

case_B:
  layout: |-
    ##########
    ######GG##
    ###.MMG.##
    ###.M...##
    ###.MMG.##
    ###...#.##
    #.BS@...##
    #.PLGGGG##
    ##########
  canonical_inputs: [down, right, right, up, left, left, up, left, down, left, left, down, right, right, up, up, up, up, up, right, right, down, right, up, left, left, left, down, down, right, up, left, up, right, right]
  event_steps:
    - {step: 2, input: right, events: [pull_object, anchor_boundary_shift]}
    - {step: 3, input: right, events: [pull_object, anchor_boundary_shift]}
    - {step: 9, input: down, events: [push_object, anchor_boundary_shift]}
    - {step: 13, input: right, events: [push_object, force_chain, anchor_boundary_shift]}
    - {step: 14, input: right, events: [push_object, force_chain, anchor_boundary_shift, sticky_to_box, sticky_split]}
    - {step: 20, input: up, events: [push_object, box_to_sticky, sticky_merge]}
    - {step: 24, input: up, events: [move_sticky_rigid]}
    - {step: 30, input: right, events: [push_object, box_to_sticky, sticky_merge]}
    - {step: 35, input: right, events: [move_sticky_rigid, sticky_merge]}
  final_win: true
