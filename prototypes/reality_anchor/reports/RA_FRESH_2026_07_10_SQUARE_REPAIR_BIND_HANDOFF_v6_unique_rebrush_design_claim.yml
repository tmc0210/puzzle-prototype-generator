candidate_family: RA_FRESH_2026_07_10_SQUARE_REPAIR_BIND_HANDOFF
candidate_version_planned: v6_unique_rebrush
lineage: current_turn_revision_after_human_feedback
review_iteration_planned: 5

human_feedback_correction:
  rejected_interpretation: "用两条真正可胜计划制造非线性"
  required_interpretation: "推箱子保持唯一正确解法；非线性来自唯一解内部的状态回读、空间复用和交叉依赖"

slot_brief:
  intended_role: late_challenge
  allowed_exposure_through: all_current_reality_anchor_runtime_rules
  target: "双锚点后期挑战；难度至少4并追求更高，审美至少4并追求5"
  hard_constraints:
    - complete_graph_has_exactly_one_winning_state
    - only_one_player-explainable_winning_responsibility_chain
    - both_anchor_types_present
    - at_least_one_anchor_movement_is_necessary

design_claim:
  player_insight: >-
    第一次把 2x2 拆成 1+3 并重绑，并不是终局成品；玩家必须回到同一中央工作区，
    让已重绑的正方形再次跨 B/S 刷线，重新获得可分配的上下材质，再沿不同把手完成第二次剪切。
    前半段制造的锚点位置与空出来的回返通道，同时决定后半段是否能取得第二把手。
  causal_chain:
    - 用初始 M 补成箱态 2x2，并移动 B/S 得到上箱下黏的混合方块。
    - 第一次纵剪得到单箱与 L3；经固定 P/L 抽取后偏移重绑成黏态 2x2。
    - 不直接交付；从下方回访中央工作区，把黏态 2x2 向上推过已移动的 B/S 边界，重刷成上箱下黏。
    - 对重刷后的同一方块执行第二次剪切/职责分配，得到最终可覆盖目标的唯一形态。
  why_not_execution: >-
    价值不来自增加步数或多解，而来自玩家必须否定“第一次重绑就是答案”，回读锚点位置、
    材质边界与同一 2x2 的新职责。若后半段只是重复同方向搬运，或能绕过 B/S/P/L，claim 失败。
  falsification:
    - 完整图出现两个或更多 winning states，候选失败。
    - 任一可胜轨迹绕过 B/S 移动、P/L 抽取、第一次重绑或第二次重刷，候选失败。
    - 规范解仍为 solution_space_reuse band 1，或回访只是不改变用途的 shuttle，候选失败。
    - 第一次重绑后只剩连续同向刚体搬运，候选失败。
    - 独立 critic 不能从玩家侧复述“同一构件变义回访”，候选失败。

tool_questions:
  - "完整图是否唯一 winning state，且核心事件在任一胜解中必经？"
  - "规范解是否出现中央工作区改变局面后再访问，并达到 space-reuse band 2 或更高？"
  - "SCC/agency 是否不再呈现 v5 的后半段连续单链动画，同时没有引入第二条可胜职责链？"

lexicon_parts:
  - "B/S 绑定债：箱资源生成黏块形状"
  - "B/S 移动边界刷产物：远程生成与门口消费"
  - "P/L 边界交接：推入、跨侧与抽取分配"
new_linkage: >-
  把 v5 的偏移重绑从终局交付物改成第二次刷线的输入；移动 B/S 同时承担材质刷线与回返把手门，
  让前半段的锚点位移在后半段被再次消费。该衔接只允许一条胜责链，不以多解制造非线性。
