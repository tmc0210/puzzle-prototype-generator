  - target_ref: mechanism_scope.central.C_shape_connectivity_at_step10
    evidence_basis: >-
      step10.before 的 sticky 坐标为 (2,2)-(4,2)、(2,3)、(2,4)-(4,4)，
      step10.after 为 (3,2)-(5,2)、(3,3)、(3,4)-(5,4)；两者都恰有七格、四邻接连通，
