      因此 replayed_attempt 的非空输入、结果状态与 concrete_outcome 均获得 exact trace 支持。
  - target_ref: player_reasoning.reasoning_units.RU2_use_notch_as_cockpit
    evidence_basis: >-
      step3.after、step8.after、step9.after 与 step10.before/after 支持 RU2 的坐标和动作关系：
      step8.after 玩家在 (2,3)，右前格 (3,3) 为空目标格，身后 (1,3) 是 C 的左竖脊；
