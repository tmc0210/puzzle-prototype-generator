      neutral_meaning: 这五个指定替换版本在各自完整可达图中均无胜态。
      player_facing_interpretation: >-
        对当前布局和胜利条件，删除竖脊中格造成的指定拆块、指定三格直条、填满凹口、
        删除上臂或删除下臂，都不能完成关卡；当前候选的完整七格连通 C、空凹口与两臂
        共同构成已被这些指定反事实覆盖的机械边界。
      verdict_effect: merit
unsupported_or_overclaimed: []
evidence_limits: >-
  本审查只支持机械事实，不评价审美、难度、玩家问题显著性、推理价值、role fit 或 campaign placement。
  unique_complete 依 strict audit 明定的纯走位差异与完整返回环等价准则成立，不表示任意含环原始输入串
  字面唯一。all-solution probe 支持 event pattern 必经，不单独证明任一对象实例的 per-object necessity。
  ALT replay 只证明该组六步 exact inputs 的具体失败，不证明玩家通常会选择该路线。
  五个反事实只证明明确替换版本在当前墙体、锚点、目标与胜利条件下无解，不能外推为所有拆块方式、
  所有直条尺寸/位置、所有填口变体或所有非 C 几何均无解。identity summary 以 v4 与 v2 基准 layout
  SHA256 相同为引用边界；本审查不扩张该边界。designer action 仅用于确认修订路由，不作为支持证据。
