      step3 的 down 合法并产生 pull_object:sticky#1 与 move_sticky_rigid。
  - target_ref: player_reasoning.reasoning_units.RU1_relocate_whole_C
    evidence_basis: >-
      canonical OS1 的 step1-3 inputs 为 [left,up,down]；step3.after 的 sticky 坐标为
      (1,2)-(3,2)、(1,3)、(1,4)-(3,4)，支持完整 C 下移一格、凹腔落到中间行、
