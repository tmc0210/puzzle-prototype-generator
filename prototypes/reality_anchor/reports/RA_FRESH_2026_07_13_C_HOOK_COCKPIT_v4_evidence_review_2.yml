      三目标在 step10.after 同时覆盖并获胜。RU2 的 alternative.status=not_claimed，
      不要求 replayed_attempt 输入。
  - target_ref: player_reasoning.operation_segments_and_trace_partition
    evidence_basis: >-
      OS1=step1-3 [left,up,down]、OS2=step4-8 [right,up,up,left,left]、
      OS3=step9 [right]、OS4=step10 [right] 均与 canonical exact replay 一致；
