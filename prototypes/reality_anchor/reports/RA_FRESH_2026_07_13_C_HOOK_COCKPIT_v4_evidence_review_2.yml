      均能在允许的 canonical replay 中解析。
  - target_ref: player_reasoning.reasoning_units.RU1_relocate_whole_C.alternative
    evidence_basis: >-
      新增获准的 ALT exact replay id 与 result_state_ref v4_alt_early_cavity.step6.illegal 对应；
      输入精确为 [up,up,up,left,left,right]，前五步合法。step4、step5 两次 left 分别产生
