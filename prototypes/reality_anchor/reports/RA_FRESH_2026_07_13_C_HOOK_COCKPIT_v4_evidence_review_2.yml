supported_claims:
  - target_ref: solution_uniqueness
    evidence_basis:
      result_value_check: unique_complete 严格属于允许值集合。
      consistency_check: >-
        v4 strict unique audit 与 v4 layout analysis 的 exact layout 一致；两者均报告
        complete graph、33 个可达状态、55 条合法转移、1 个胜利状态。strict audit 为 PASS，
        宏路径边均为桥、正向非 walk 标签唯一，最短 cost10 的 exact input path count 为 1
        且未截断；unique_complete 与所引完整图及严格审计不冲突。
      graph_fact:
        graph_fact: complete graph 中只有一个胜利状态，loop-erased/simple 胜路共享同一对象宏序列。
        neutral_meaning: 在审计声明的纯走位差异与完整返回环等价准则下，没有第二条对象操作计划。
        player_facing_interpretation: 玩家可以绕行或返回，但任何最终获胜路线都必须完成同一组三次对象宏动作。
        verdict_effect: merit
  - target_ref: mechanic_exposure_context.latest_exposure_timing_check
    evidence_basis: >-
      mechanic_exposure_sequence.yml 中 allowed_exposure_through=dual_anchor 的 new_events 为空，
      向前最近的非空 stage 是 movable_box_sticky_anchor，其事件为
      anchor_boundary_shift:box_sticky。dual_anchor 是序列末端，不存在需要排除的 later stage；
      packet 也未声明 forbidden_if_seen_anywhere。v4 event probe 的 bs_shift individual probe
      status=complete、exploredStates=33、no winning bypass found，支持该事件在所有胜路中必经。
  - target_ref: mechanic_exposure_context.latest_exposure_timing_check.canonical_occurrences
    evidence_basis: >-
      v4 canonical exact replay 中 anchor_boundary_shift:box_sticky 仅在 step10 出现；
      step10 精确落入 OS4_double_hook_finish 的 10-10，OS4 只映射
      RU2_use_notch_as_cockpit。独立派生结果为 movable_box_sticky_anchor / 
      anchor_boundary_shift:box_sticky / occurrence step10 -> RU2，故 status=later_phase_present，
      不属于 required_but_frontloaded。
  - target_ref: mechanic_exposure_context.claimed_core_events
    evidence_basis: >-
      canonical replay 的 step3、step9、step10 出现 move_sticky_rigid；step10 同时出现
      force_chain:n3、anchor_boundary_shift:push_pull 与 anchor_boundary_shift:box_sticky。
      末步前后状态显示七格 C、P/L、B/S 三个对象实例均向右移动一格，支持 n3 的对象参与解释。
  - target_ref: mechanism_scope.required_winning_path_events
    evidence_basis: >-
      event probe 对 pl_shift、bs_shift、sticky_move、dual_force 的四个 individual probe 均为
      complete，且均未找到 winning bypass；因此两种 anchor shift、move_sticky_rigid 与
      force_chain:n3 作为 event pattern 均由 all-solution gate 支持。
  - target_ref: mechanism_scope.forbidden_winning_path_events
    evidence_basis: >-
      complete strict audit 报告所有 loop-erased/simple 胜路共享同一必要对象宏序列，
      canonical 三个非 walk 标签仅包含 sticky 刚体移动、末步 n3 force chain 与两个 anchor shift；
      sticky_split、sticky_merge、sticky_to_box、box_to_sticky 均不在该胜利宏序列中，且审计未报告
      附着于胜利宏路径的 branch component。该结论限于 strict audit 的胜路等价准则，不扩写为
      forbidden_if_seen_anywhere。
  - target_ref: player_reasoning.reasoning_units.RU1_relocate_whole_C.premises[1].state_ref
    evidence_basis: >-
