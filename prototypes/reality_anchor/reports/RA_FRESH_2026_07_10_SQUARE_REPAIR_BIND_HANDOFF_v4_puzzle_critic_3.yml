      player_facing_interpretation: 箱被推离唯一上口的几何后果可追溯，但失败反馈不是即时，保留试玩风险。
      verdict_effect: caveat
    - graph_fact: 四个 exact shape 避让搜索均 complete 且未发现胜路旁路。
      neutral_meaning: 所有胜路都会经过箱态 2x2、黏态 2x2、指定 1+3 与指定偏移 2x2 状态。
      player_facing_interpretation: 必经只保证形态出现，不保证玩家主动理解；主动性仍须由轴选择、让位和重绑责任判断。
      verdict_effect: none
    - graph_fact: solution irreversible steps 9。
      neutral_meaning: 规范解包含九个离开当前可逆区域的步骤；该数值不是谜题深度评分。
      player_facing_interpretation: 单凭不可逆步数无法区分有意义承诺与线性执行。
      verdict_effect: none
  handoff_notes:
    - 当前保守评分为审美 4、难度 4；达到用户门槛，但两项均不支持 5。
    - 六步上口路线是真实路线税，试玩时应观察它是否明显打断刷形到纵剪的因果连续性。
    - 提前横剪的错误原因在几何上可见，但失败确认可能延迟；试玩时观察是否被体验为公平的轴选择。
    - 一次强制开局不作为优点；opening_comfort_check 仍须按原型提交前流程完成。

