prototype_context:
  confirmed_rules:
    - P/L 定义 push/pull 两侧；本候选 P/L 被墙完全固定，x <= 5 为 pull 侧，x >= 6 为 push 侧。
    - B/S 定义 box/sticky 两侧；本候选 B/S 可移动，合法动作后全局材料归一化。
    - 相邻 sticky 合并成刚体；刚体任一目标格受阻则整步失败。
    - force chain 沿动作方向传递，链中任一对象不能移动则整步失败。
    - pull 世界中，玩家前格必须为空，身后相邻对象才会随玩家同向移动。
  win_condition: 所有 G 被箱、黏块或任意锚点格覆盖；玩家不算覆盖。
