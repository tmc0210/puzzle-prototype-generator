player_facing_reading:
  opening_read: >-
    玩家可先向右站到缺角 M 下方，或向上进入左侧观察区；两手都只是 walk。正确计划主动
    回到 M 下方再向上补角。向上后若立即从左推 M 向右，会形成同距离的早期死承诺；其公平性留给 critic。
  intended_solution_read: >-
    B/S 上移生成 CC/MM 混合刷子；唯一上口纵剪右列得到 L3，剩余箱先让位再在固定 P/L
    侧抽成单格 M。L3 与单格在偏移位重并成正方形，最后整体拉入目标。
  concrete_false_read: >-
    提前横剪上排 CC 看似直接接近目标且动作合法，但消耗唯一上方驱动位；完整后继图无胜。
  payoff_and_resolution: >-
    四格材料依次承担箱态正方形、CC/MM 混合刷子、1+3 拆分、偏移黏态正方形；
    完整方块必须先拆、让位、跨侧补角并重绑，才成为可交付终态。

