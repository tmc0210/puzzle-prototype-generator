    - 唯一上口向下推右上箱；force chain 同步下移黏块并归一化，混合正方形被剪成一枚箱与三格 L 黏块。
    - 剩余箱先左推让位，再在固定 P/L 的 pull 侧向下拉成单格 M；L3 左拉后与它重并为偏移黏态 2x2。
    - 完整黏态 2x2 最后由固定 P/L 的 pull 语义整体左拉三格覆盖四目标。
