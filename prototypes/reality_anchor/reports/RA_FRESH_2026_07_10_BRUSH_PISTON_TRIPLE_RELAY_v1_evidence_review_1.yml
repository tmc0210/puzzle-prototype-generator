graph_reading:
  graph_fact: >-
    完整图为 151 状态、282 条合法边、1 个胜态；walk 宏可胜子图的 11 个节点恰为一条十边桥路径，
    没有附着的可胜宏节点或被压缩的 substantive 自环。
  neutral_meaning: >-
    在声明的 loop-erased 对象宏等价关系下，所有胜路都必须按相同顺序跨越相同十条对象宏边；
    输入串仍可因玩家走位而不同。
  player_facing_interpretation: >-
    玩家可以从 B/S 两个端部之一完成同一次首次上拉，但不能把箱、B/S、P/L 的必要阶段重新排序，
    也不能改用另一套目标职责计划获胜。
  verdict_effect: merit

supported_claims:
  - claim: causal_chain
    finding: supported
    basis: >-
      规范 trace、11 项 all-win 事件下限与十边唯一宏序列共同支持 B/S 上拉、箱两次 C->M、
      B/S 右拉 M->C、P/L 下拉、B/S 下推、末段双 n2、M->C 与最终下拉的顺序和必经性。
  - claim: uniqueness_claim_scope
    finding: supported
    basis: >-
      claim 明确不声称输入字符串唯一；在其纯 walk 与完整回返环消去口径内，完整宏图支持唯一 simple 对象动作序列。
  - claim: target_responsibility_relay
    finding: supported
    basis: 唯一终止胜态给出 P/C/S 三责；goal coverage 逐步支持上目标和中目标的撤销、回占与终局交接。
  - claim: dual_anchor_and_material_cycle_participation
    finding: supported
    basis: >-
      两种锚各至少移动三次、箱/M 两次双向转换、两次 n2 与一次 move_sticky_rigid 均由完整 product graph 证明每条胜路必经。
  - claim: state_reuse_premise
    finding: supported
    basis: 规范 trace 直接显示中上工作区先后承担刷界、换侧推离和末段混链/终局下拉职责。
  - claim: why_not_execution
    finding: supported_as_claim_hygiene
    basis: claim 没有把 calibrated Trace Metric 当作洞见或质量证明，并明确把玩家侧兑现交给 critic。
  - claim: new_linkage_mechanical_premise
    finding: supported
    basis: 每个箭头阶段均能映射到唯一宏路径的相邻对象动作及其后续消费。

unsupported_or_overclaimed:
  - item: player_insight_as_experienced_by_players
    status: not_proven_by_tool_evidence
    effect: caveat
    reading: >-
      工具证据支持“目标撤销、材料循环、双锚接力”的客观前提，但不能证明玩家会把它读成活塞洞见；
      singleton 标签编排是否兑现为认知重读必须由 puzzle critic 或真人试玩判断。
  - item: aesthetic_hypothesis_and_difficulty_hypothesis
    status: outside_evidence_reviewer_scope
    effect: none
    reading: 不评价审美、难度或 campaign placement；本 review 不可代替 critic 的 4 分门槛判断。
  - item: 三目标多次换责
    status: supported_only_as_collective_shorthand
    effect: caveat
    reading: >-
      上目标与中目标存在对象职责更替；底目标仅在 step 15 由 S 首次覆盖后保持到终局。
      因而该短语不能理解为三个目标各自都经历多位对象轮换。

