evidence_limits:
  - one winning state 单独不证明唯一对象计划；本结论依赖完整 graph 与 candidate-specific 宏桥审计。
  - 本候选只有一个箱子；M 始终为 singleton，没有 sticky_merge，也没有多格黏块几何。
  - singleton C 与 M 的平移几何相同；证据只证明边界转换和事件必经，不证明该转换具有足够玩家侧价值。
  - Trace Metric 的 execution5/space5 已逐字核对，但按 reviewer 纪律不进入 evidence verdict。
  - 没有真人试玩，错误分支公平性、可读性及玩家实际洞见均未获验证。
  - 不存在 allowed_exposure_through、最高知识或 forbidden reachable exposure claim；因此本轮不需要 exposure sequence gate。

