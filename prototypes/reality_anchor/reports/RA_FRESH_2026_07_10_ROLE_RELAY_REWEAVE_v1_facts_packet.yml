    方阵修补 v5 的逻辑稳健但中段过于线性；用户随后明确纠正：不得用两条职责不同的
    可胜计划制造非线性，推箱子应保持唯一解。
  rejected_intermediate:
    candidate: RA_FRESH_2026_07_10_SQUARE_REPAIR_BIND_HANDOFF_v6
    reason: >-
      虽只有一个 winning state，但完整枚举发现两种职责里程碑：先 B/S 后拉箱，或先拉箱后 B/S；
      分别产生 n1+n1 与 n2 转换，故已硬拒绝且未入队。
  selected_direction: >-
    换到全新紧凑 role-relay family：唯一不可逆可胜链内复用同一中廊，并让箱、B 锚、M
    分担三个目标。exact v1 已在正式分析前墙化一枚静止箱和一个无责任单格袋。
  queue_policy: 旧的方阵修补 v5 条目继续保留；新候选合格前不替换、不新增。

prototype_context:
  confirmed_rules:
    - P/L 两格锚按 P/L 两侧决定输入时的 push 或 pull；锚本体也是可移动二格刚体并可覆盖目标。
    - B/S 两格锚移动后，全局材料按新的 B/S 边界归一化；B/S 本体也可覆盖目标。
    - push 可沿方向形成 force chain；链中任一对象不能移动则整步失败。
    - pull 要求玩家前格为空，并把身后相邻对象沿玩家方向抽入旧位。
    - sticky 连体块按刚体移动；本候选只生成单格 M，但仍由 move_sticky_rigid 路径移动。
  win_condition: 所有 G 被箱、黏块或任意锚点格覆盖；玩家不算覆盖。
  object_and_event_semantics:
    - 初始两箱不可区分；规范解第一手对象动作以 force_chain:n2 同时下移。
    - P/L 竖放；下方 L 行可拉，上方 P 行可推。
    - B/S 横放；连续左移会把 box/sticky 分界线从右廊移入中央廊道。
  tool_boundary:
    runtime_adapter: available
    full_graph_and_agency: available
    event_count_product_graph: available
    event_order_product_graph: available
    shortest_and_scc_plan_enumeration: available_candidate_specific
