player_facing_reading:
  opening_read: >-
    全图只有两箱、三目标和两枚可动锚。两箱竖列正对底部目标，但单推上箱会推整条 n2；
    正确第一承诺先让底箱完成，同时保留上箱为后续载体。开局可逆区有 4 状态、三个出口，
    只有该 n2 出口可胜；另外两个早期承诺的公平性留给 critic。
  intended_solution_read: >-
    玩家不能直接上移穿过载体箱，只能借 P/L 本体在 L 行拉出、P 行推回，把自己换到上层。
    随后 B/S 被抽到载体右侧，载体上抽后 B/S 下压：B 端占中央目标，载体获得横向抽取线。
    载体穿过新 B/S 边界变 M，先被抽到右端；玩家再绕到目标下方，把 M 拉回自己刚站过的目标。
  commitment_points:
    - 开局选择是否以 n2 同时下推两箱；错误对象承诺不进入可胜 SCC 链。
    - P/L 回返与 B/S 第一格定位存在同职责的可逆准备次序；第二次 B/S 左拉后，唯一载体抽取链被锁定。
    - B/S 下压把 B 端留在中央目标；若未先抽出载体或未完成两格定位，完整顺序 probe 无胜。
    - 箱跨界成为 M 后，右目标必须由 M 而非玩家覆盖；最终拉动同时兑现规则与视觉反馈。
  state_responsibility: >-
    底箱在 step2 永久承担底目标；上箱先是 n2 近端、再是窄列载体、横向 pull 资源和 B/S 转换输入，
    最终以 M 身份承担右目标；P/L 承担玩家换层门并必须复位；B/S 先承担边界定位，后由 B 端承担中央目标。
  payoff_and_resolution: >-
    终局画面把三个目标明确分给三类对象：原箱、锚点端、再生黏块。step18 玩家亲自站在右目标上却仍未获胜，
    step19 离开并把身后 M 拉入旧位才完成，直观兑现“玩家不算覆盖”和前面的 C->M 身份接力。

