archive_taste_calibration:
  examples:
    - archive_id: RA_CAND_0022
      human_aesthetic_score: 5
      human_difficulty_score: 4
      human_comments: 这关的操作非常反直觉，将一个箱子先送入看似死局的死角，构造出拉锚点将两个箱子反向送入目标。空间利用率高，结构精巧。在较短的步骤中要求强玩家洞见以发现反直觉操作，是优秀的范例。
    - archive_id: RA_CAND_0025
      human_aesthetic_score: 5
      human_difficulty_score: 4
      human_comments: 在狭小紧凑的空间中，将L形反复活塞这一关键高难亮点结构赋予合适的包装以要求玩家主动构造，前几步构造不喧宾夺主，终局也有恰到好处的提示（右上角双目标暗示L形结构）。结构紧凑逻辑清晰亮点突出，是构造关类型的优秀案例。
    - archive_id: RA_CAND_0024
      human_aesthetic_score: 1
      human_difficulty_score: 3
      human_comments: 这关玩家看到中间的三个黏块、两个可动的锚点，会期待更精彩的切割拼接构造或长链推动、黏块几何形状利用，但是实际上几乎只用到推拉腾挪走位而缺乏玩家洞见；不要迷信指标和探针，要切实从玩家角度思考。
    - archive_id: RA_CAND_0028
      human_aesthetic_score: 4
      human_difficulty_score: 4
      human_comments: 纯锚点作为刚体的腾挪关卡，反复使用拉锚点扫带技巧；此类关通常短小紧凑、有反直觉步骤，但目前已经收录较多，不再需要此类集中考察锚点作为两格刚体性质的关卡。
