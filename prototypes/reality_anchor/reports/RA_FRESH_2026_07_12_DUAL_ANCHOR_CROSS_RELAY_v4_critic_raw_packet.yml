prototype_rules:
  confirmed_rules:
    - P/L 是可移动二格刚体；输入时玩家所在侧决定 push 或 pull，锚点只平移不旋转。
    - B/S 是可移动二格刚体；合法移动结算后按边界归一化箱/黏，相邻黏格自动合并。
    - pull 要求玩家前格可进入，并拉动身后一格相邻的完整对象；推拉均可形成同向 force chain。
    - 任一刚体目标格被墙、边界或不可移动结构挡住时，整次动作失败且状态不变。
  win_condition: 所有目标在结算后由箱、黏块或任一锚点格覆盖；玩家不计覆盖。
  object_and_event_semantics:
    crate: 独立可推拉单格对象。
    sticky: 四邻接黏格自动合成不可旋转刚体；跨 B 侧格会变回独立箱。
    push_pull_anchor: P/L 两格可动刚体，同时定义 push/pull 区域。
    box_sticky_anchor: B/S 两格可动刚体，同时定义箱/黏归一化边界。

