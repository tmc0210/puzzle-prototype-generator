experiment_id: RA_REVERSAL_SUBJECT_ECONOMY_PILOT_20260712
scope: anonymous_aesthetic_judgment
target_claim: 每个案例都作为审美4候选接受测试

mechanic_rules:
  symbols:
    "#": wall
    ".": floor
    "@": player
    G: target
    C: crate
    M: sticky_cell
    P: push-side endpoint of P/L anchor
    L: pull-side endpoint of P/L anchor
    S: sticky-side endpoint of B/S anchor
    B: box-side endpoint of B/S anchor
  movement: 玩家推动或拉动物体；相连 sticky 按刚体移动。
  push_pull_boundary: P/L 两格锚点划分推侧与拉侧，锚点本身在合法受力时也可移动。
  material_boundary: 对象跨 B/S 边界后在 sticky/box 间归一化；相邻 sticky 合并，跨回 box 侧会切成箱并按连通性分裂。
  win: 全部目标必须由 crate、sticky 或 anchor 覆盖。

human_calibration_anchors:
  - band: aesthetic_4
    human_comment: 机制使用多样、关卡设计密度高、各要素强耦合，玩家视角矛盾明显，综合质量较高。
  - band: aesthetic_4
    human_comment: 箱子需要被推进目标再拉出，需要较强反直觉洞见；在较小空间做出了紧凑的强逻辑关卡。
  - band: aesthetic_2
    human_comment: 用较小的目标位置改动极大弱化机制美感并增加腾挪难度；这种增加难度的方式是较差反例。

