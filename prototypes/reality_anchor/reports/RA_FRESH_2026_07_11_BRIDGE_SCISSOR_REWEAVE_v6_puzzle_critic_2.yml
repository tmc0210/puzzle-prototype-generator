critic_items:
  - id: CI2_NO_MERGE_ROUTE_CAVEAT
    type: nonblocking_risk
    target_ref: RU4_reweave_middle_then_move_as_rigid_bar.alternative
    design_relation: "玩家若在 P/L 尚未拉到底时提前切桥，会得到 x=6 三箱与 x=7 两端点；随后不回织，而是把两端点分别送入右列上下目标、P/L 泊入右列中目标，再把三箱逐个回填左列，64步获胜。"
    attack: "该路线以‘六对象逐件分配’为更直白的概念，穷举型玩家仍可能绕过重拼，因此不能声称重拼是所有胜路硬门，也限制凝练度与审美5分。"
    evidence_basis: "修订 facts 提供入口关系、steps15-30 抽取三箱、steps38-48 分送端点、steps45-64 泊 P/L 与回填三箱，以及反复让位、撤销/回填目标的风险边界。"
    player_facing_effect: "替代路线要求维护更多独立对象并承担显著更长的执行与站位负担，不是另一条短而干净的洞见路线；它可能稀释最强体验，但不足以推翻规范路线的核心因果或审美4下界。"
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI2_RU3_ALTERNATIVE_THIN
    type: nonblocking_risk
    target_ref: RU3_cut_old_bridge_and_assign_outputs
    design_relation: "玩家把 B/S 停在 B=x6、S=x7 后得到三箱与两黏端点，后续以中箱回织并让上下箱留作左列覆盖。"
    attack: "RU3 仍未单独给出另一个合法停位的局部收益与具体失败；该段本身更像精确对位，其推理价值主要依赖 RU1 早切反例及 RU4 后续消费。"
    evidence_basis: "claim 中 RU3 有 premises、conclusion、operations 与 feedback，但没有独立 alternative；designer_action 明确接受该边界且不主张每个单元均为强谜题。"
    player_facing_effect: "不破坏整体至少4的跨阶段难度，但继续限制难度5主张。"
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI2_AESTHETIC_FIVE_BOUNDARY
    type: score_boundary
    target_ref: target_scores.aesthetic
    design_relation: "规范路线把切割产物重新拼成三格竖条并立即整体覆盖右列；无重拼路线可通过逐件调度完成同一六目标。"
    attack: "规范体验足以支持4分下界；在实际试玩确认玩家自然选择回织、逐件路线不稀释终局惊喜之前，不支持5分。"
    evidence_basis: "RA_CAND_0025 提供强4紧凑构造下界，RA_CAND_0022 提供5分精巧反向构造正锚，RA_CAND_0024 提供机制承诺落空警戒；当前候选介于强4与待试玩确认的5之间。"
    player_facing_effect: "回织路线提供清晰几何回报，但概念更直白的长绕路仍可能让部分玩家以较差节奏完成关卡。"
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking
  - id: CI2_GRAPH_BUDGET_LIMIT
    type: diagnostic_note
    target_ref: graph_facts
    design_relation: "图搜索达到约300001状态、650484转移与13个胜态后耗尽预算。"
    attack: "该事实不能用于宣称 unique、完整 SCC、完整分支质量或额外玩家侧优点。"
    evidence_basis: "facts 明确 budget=300000、status=exhausted，且 evidence_limits 保留 unknown 边界。"
    player_facing_effect: "不新增可感知关系，只限制最终结论范围。"
    blocks_proposal_ready: false
    expected_designer_response: accept_as_nonblocking

