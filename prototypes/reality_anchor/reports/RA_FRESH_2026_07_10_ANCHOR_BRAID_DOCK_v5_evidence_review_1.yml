      cost/depth=17，规范输入与六个非走路对象动作逐步一致。
  - claim: "五个 required winning-path 事件组在所有胜路中都不可绕过。"
    evidence: >-
      event product 的 all-group 与五个 individual probe 均为 status=complete；五个
      individual probe 分别对 anchor_boundary_shift:push_pull、
      anchor_boundary_shift:box_sticky、force_chain:n2、
      pull_object:push_pull_anchor、pull_object:box_sticky_anchor 报告
      no winning bypass found。该结论只证明各 event pattern 至少出现一次，不证明次数或实例时序。
  - claim: "ordered waypoint 所声明的五个锚点状态按序出现在全部胜路中。"
    evidence: >-
      ordered waypoint product status=complete、exploredProductStates=439、
      found=false，报告 no winning path skipped the ordered anchor braid waypoints。
      因而支持 pl_lower_stage -> bs_left_extract -> mixed_up_bs_temp_dock ->
      bs_right_vacate -> pl_up_prefinal 的状态顺序。
  - claim: "在 packet 声明的 n2=两个对象实例共同移动语义下，任一 n2 实例只能是双锚共同参与。"
    evidence: >-
      exact layout 无 C/M，只有一枚 P/L 与一枚 B/S；mechanic.yml 的对象模型也将两类锚点
      各限制为至多一个可区分实例。返回 trace 的 step 10 与 step 17 均同时出现
      force_chain:n2 及两种 anchor_boundary_shift，支持这两处返回-trace 实例的双锚身份。
  - claim: "规范解中的临时泊位、腾位与终局覆盖事实成立。"
    evidence: >-
      goal-coverage replay 显示 step 10 的 B/S 两半覆盖 [3,1]、[3,2]；step 15 后二者均失去
      对象覆盖；step 16 的 P/L 覆盖 [2,2]、[3,2]；step 17 四目标分别由两枚锚点覆盖并获胜。
  - claim: "双锚 exposure claim 与两种锚点位移的 all-win gate 成立。"
    evidence: >-
      mechanic_exposure_sequence.yml 的最后阶段 dual_anchor 只新增双锚共存配置；exact layout
      静态包含 P/L 与 B/S，且 complete individual probes 分别证明两种 anchor shift 在所有胜路中必经。
      sequence 在 dual_anchor 之后没有更晚阶段，因此不存在 later-than-window 事件需要另行排除。
  - claim: "五种 forbidden material events 在完整可达空间中不可发生。"
    evidence: >-
      exact layout 没有 crate 或 sticky_block；mechanic.yml 的 normalize、merge 与 rigid movement
      规则只读取或移动既有 crate/sticky，不会从空材料集合生成材料。完整图 status=complete，
      因而 box_to_sticky、sticky_to_box、sticky_merge、sticky_split、move_sticky_rigid 均静态不可达。
  - claim: "graph completeness 足以支撑本次 all-win 与完整可达结论。"
    graph_fact: "graph status=complete；178 reachable states、422 legal transitions、1 winning state，未耗尽 300000 状态预算。"
    neutral_meaning: "报告给出的可达图已经闭合，而不是 budget-exhausted 前缀；winning state 数量是状态数，不是输入序列数。"
    player_facing_interpretation: "所有可胜路线与可达事件判断可按完整图审查，但不能据此宣称只有一条操作序列。"
    verdict_effect: merit
  - claim: "终局前存在单状态、单可胜后继的图收束。"
    graph_fact: >-
      SCC win subgraph 为 one_win_continuation_per_scc；可胜 SCC 路径为 0 -> 2 -> 5 -> 6，
      SCC 5 只有 1 state、1 outgoing，随后进入唯一 winning SCC。
    neutral_meaning: "任何胜路最终都必须经过同一个单状态 SCC 并沿唯一可胜 SCC 后继进入胜态。"
    player_facing_interpretation: "终局没有另一处可胜区域可绕开这一收束，但 SCC 摘要本身不为该边新增未报告的事件标签。"
    verdict_effect: merit
unsupported_or_overclaimed:
  - claim: "所有胜路都必有两次 mixed-anchor force_chain:n2，并分别绑定到中段上移与终局左收。"
    reason: >-
      返回 trace 确有 step 10、step 17 两个实例，但 all-win event probe 只门控
      force_chain:n2 至少一次；ordered waypoint artifact 证明的是锚点状态顺序，没有报告
      force_chain:n2 的计数下界，也没有把两个 waypoint 转移分别锁定为 n2 event instance。
      由于“两个 mixed-anchor chain”列在 central mechanism 中，该缺口不能仅以 caveat 保留。
  - claim: "P/L 下移是首次 B/S 左拉的必要前置，且各 waypoint 必由 packet 所写的具体 push/pull 动作进入。"
    reason: >-
      规范 trace 支持该实例叙述；现有 ordered waypoint 结果没有公开 event-aware predicate 或
      first-occurrence latch，因此状态先后不能自动升级为所有胜路上的首次事件与具体动作绑定。
  - claim: "player_insight 与 why_not_execution 已由工具事实证明。"
    reason: >-
      工具只支持其状态、事件和覆盖前提，不能证明玩家会形成“先泊—腾位—同泊”的理解，
      也不能证明难点不来自执行、路线或盲试。
evidence_limits:
  - >-
    mechanic.yml 定义 force_chain 基础事件，但未独立定义 :n2 后缀是否按对象实例计数；本审查的
    n2 身份推断以 packet 明示语义为前提，并由返回 trace 中两种 anchor shift 同步出现作实例级旁证。
  - >-
    winningStateCount=1 只表示唯一胜利状态；报告已正确避免把它写成唯一输入序列，本审查也不作该推断。
  - >-
    SCC/agency 摘要只作为拓扑与收束事实使用，不证明审美、难度、玩家洞见或 campaign placement。
  - >-
    v4_to_v5 counterfactual 没有列入四个 allowed artifact refs，故本审查未用它支持 verdict。
  - "calibrated_trace_metrics 按 reviewer 纪律完全忽略。"
