failure_boundary:
  established:
    - "真正的 sticky_merge + 多格 rigid 后续移动 + 锚点 force-chain 可以在 10 个对象输入内紧凑实现。"
    - "把开局锚点放进单出口 pocket，能锁住 opening，却不能自动锁住中段回访。"
    - "同一底廊同时承担绕行和 P/L 把手时，会提高局部复用感，也会开放 P/L/C 的换序。"
    - "仅靠目标合成可得到唯一胜态，但无法消除对象计划换序。"
  not_established:
    - "不存在合格 topology；本报告只覆盖上述 constrained motif sampler 与三个人工 U/return 家族。"
    - "space band 4 与严格唯一不可兼得；只证明当前门禁接口未同时做到。"

recommended_next_family_if_resumed:
  name: consumable_one_way_handle
  first_principle_change: >-
    不再让 P/L 把手从开局就暴露在绕行廊中。把手格应由 merge 后的连体形状自身占格
    才打开，并在第一次拉动后被 P/L 本体封回；这样 U 廊可以三次复用同一 hub，
    而未 merge 时既不能提前动 P/L，也不能回访 B/S。
  required_proof_before_candidate:
    - "directed pure-walk SCC 宏图中，唯一胜态的 loop-erased object plan 数=1。"
    - "canonical trace space reuse calibrated band >=4；不能靠无职责 walk 环堆叠。"
    - "移除 bridge crate 或任一 sticky 端点后，P/L 把手不能打开。"

