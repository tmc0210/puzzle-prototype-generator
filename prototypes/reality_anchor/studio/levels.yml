  - id: RA_STICKY_IRREGULAR_BASELINE_001_v3
    title: 异形边界·肩窝远扫
    layout: |-
      #########
      ###PL####
      #...#####
      #@#MMM.##
      #...M.SB#
      ####...G#
      #########
    design_notes: |
      设计树 baseline v3。预制小型 T 形把近端肩窝操作面与远端占格绑定；正确横推后下拉完整 T，远端扫带边界口袋中的 B/S。规范输入：down,right,right,right,down。2026-07-19 人类反馈实际难度约 1–2，未达到原目标 3，状态 needs_revision，已退出待玩队列。
    lineage:
      source: studio
      created_by: design_studio_controller
      created_at: 2026-07-19T00:00:00+08:00
  - id: RA_STICKY_IRREGULAR_CONSTRUCT_PREFIX_001_v2
    title: 异形边界·错位构形
    layout: |-
      #########
      #GBSMM###
      ####....#
      ###@MM..#
      ###.....#
      #########
    design_notes: |
      设计树 construct_prefix v2。玩家从两根横条主动选择错位 S，而非同样合法的 2x2；完整 S 的缺口避开墙齿，远端上臂在同一次左推中驱动 B/S。规范输入：right,down,right,up,right,right,up,left。2026-07-19 人类反馈实际难度约 1–2，未达到原目标 4，状态 needs_revision，已退出待玩队列。
    lineage:
      source: studio
      created_by: design_studio_controller
      created_at: 2026-07-19T00:00:00+08:00
  - id: RA_STICKY_IRREGULAR_APPLY_SUFFIX_001_v4
    title: 异形边界·远趾接力
    layout: |-
      #######
      #G#####
      #.B.###
      #GSMM##
      #.....#
      ##.MM.#
      ##...@#
      #######
    design_notes: |
      设计树 apply_suffix v4。错位 Z 与 2x2 都能完成眼前 B/S 左移；只有 Z 保留正交上推操作面与远趾，在后继上推中让 B/S 转角并完成双目标覆盖交接。规范输入：up,left,down,left,up,right,up,left,up。2026-07-19 人类反馈实际难度约 2–3，未稳定达到原目标 4，状态 needs_revision，已退出待玩队列。
    lineage:
      source: studio
      created_by: design_studio_controller
      created_at: 2026-07-19T00:00:00+08:00
