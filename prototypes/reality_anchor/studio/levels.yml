    design_notes: |
      Studio hand-made level accepted by 2026-07-11 human playtest as RA_CAND_0029, aesthetic 4 / difficulty 4. Human comment: two uses of the upper sticky blocks as pistons push the B/S anchor and eventually restore it; the two piston structures differ, making the local structure novel with high element reuse and space efficiency. Exact trace was not recorded in the studio level file.
    lineage:
      source: studio
