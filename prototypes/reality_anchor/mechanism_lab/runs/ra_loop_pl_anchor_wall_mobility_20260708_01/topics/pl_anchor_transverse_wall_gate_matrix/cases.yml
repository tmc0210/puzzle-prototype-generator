runId: ra_loop_pl_anchor_wall_mobility_20260708_01_pl_anchor_transverse_wall_gate_matrix
title: "P/L anchor 横向/竖向把手墙门矩阵"
notes: >
  比较 P/L anchor 本体在横放垂直位移和竖放水平位移时，墙格分别关闭玩家前格、
  P 半格目标格、L 半格目标格与移动后回返门的层次。所有正例都应移动 P/L anchor
  并出现 anchor_boundary_shift:push_pull；失败例在 notes 中标出门控层。
defaults:
  maxExploreDepth: 14
  maxReturnDepth: 24
  maxStates: 30000
  maxTransitions: 120000
cases:
  - id: h_p_push_down_open_return
    family: pl_anchor_transverse_wall_gate_matrix
    variant: horizontal_p_side_push_down_open_return
    changed_variable: "横放 PL；P 侧向下 push；P/L 两个目标格与移动后 L 侧回返前格都开放"
    contrast_with:
      - h_p_push_down_p_target_wall
      - h_p_push_down_l_target_wall
      - h_p_push_down_return_front_wall
    question: "P 侧向下推横放 PL 后，能否经旧 L 格转到 L 侧并把 anchor 拉回"
    notes: "正例；step1/step3 都应移动 P/L anchor，事件含 anchor_boundary_shift:push_pull；回返门开放。"
    layout: |
      #######
      #..G..#
      #.....#
      #.@...#
      #.PL..#
      #.....#
      #######
    actions: ["down", "right", "up"]

  - id: h_p_push_down_p_target_wall
    family: pl_anchor_transverse_wall_gate_matrix
    variant: horizontal_p_side_push_down_p_target_closed
    changed_variable: "只把 push 后 P 半格目标格改成墙"
    contrast_with: h_p_push_down_open_return
    question: "接触的 P 半格目标格被墙挡时，P 侧 push 是否在 footprint 层失败"
    notes: "失败例；门控层=P 半格目标门；预期首步 force_blocked。"
    layout: |
      #######
      #..G..#
      #.....#
      #.@...#
      #.PL..#
      #.#...#
      #######
    actions: ["down"]

  - id: h_p_push_down_l_target_wall
    family: pl_anchor_transverse_wall_gate_matrix
    variant: horizontal_p_side_push_down_l_target_closed
    changed_variable: "只把 push 后 L 半格目标格改成墙"
    contrast_with: h_p_push_down_open_return
    question: "未接触的 L 半格目标格被墙挡时，P 侧 push 是否同样在 footprint 层失败"
    notes: "失败例；门控层=L 半格目标门；预期首步 force_blocked。"
    layout: |
      #######
      #..G..#
      #.....#
      #.@...#
      #.PL..#
      #..#..#
      #######
    actions: ["down"]

  - id: h_p_push_down_return_front_wall
    family: pl_anchor_transverse_wall_gate_matrix
    variant: horizontal_p_side_push_down_post_shift_return_closed
    changed_variable: "首推目标格开放，但移动后 L 侧回返 pull 的玩家前格改成墙"
    contrast_with: h_p_push_down_open_return
    question: "首步已经移动 anchor 后，旧 L 格上的回返 pull 是否会被前格墙消费"
    notes: "消费型失败例；step1 正常移动并发出 anchor_boundary_shift:push_pull，step3 门控层=移动后回返门/玩家前格门，预期 destination_blocked。"
    layout: |
      #######
      #..G..#
      #.....#
      #.@#..#
      #.PL..#
      #.....#
      #######
    actions: ["down", "right", "up"]

  - id: h_p_push_up_open
    family: pl_anchor_transverse_wall_gate_matrix
    variant: horizontal_p_side_push_up_open
    changed_variable: "横放 PL；P 侧从下方向上 push，目标格开放"
    contrast_with: h_p_push_down_open_return
    question: "P 侧 push 的上/下镜像在无墙门时是否都能移动 anchor"
    notes: "正例；补 P 侧向上 push，不只重复向下把手。"
    layout: |
      #######
      #..G..#
      #.....#
      #.PL..#
      #.@...#
      #.....#
      #######
    actions: ["up"]

  - id: h_l_pull_down_open
    family: pl_anchor_transverse_wall_gate_matrix
    variant: horizontal_l_side_pull_down_open
    changed_variable: "横放 PL；L 侧从下方向下 pull，玩家前格与 P 半格目标格开放"
    contrast_with:
      - h_l_pull_down_front_wall
      - h_l_pull_down_p_target_wall
    question: "L 侧向下 pull 是否能在前格和非接触 P 半格目标格开放时移动 anchor"
    notes: "正例；补 L 侧向下 pull，不只重复旧的向上 pull。"
    layout: |
      #######
      #..G..#
      #.....#
      #.PL..#
      #..@..#
      #.....#
      #######
    actions: ["down"]

  - id: h_l_pull_down_front_wall
    family: pl_anchor_transverse_wall_gate_matrix
    variant: horizontal_l_side_pull_down_front_closed
    changed_variable: "只把 L 侧 pull 的玩家前格改成墙"
    contrast_with: h_l_pull_down_open
    question: "pull 的玩家前格被墙挡时，是否先于 footprint 检查失败"
    notes: "失败例；门控层=玩家前格门；预期首步 destination_blocked。"
    layout: |
      #######
      #..G..#
      #.....#
      #.PL..#
      #..@..#
      #..#..#
      #######
    actions: ["down"]

  - id: h_l_pull_down_p_target_wall
    family: pl_anchor_transverse_wall_gate_matrix
    variant: horizontal_l_side_pull_down_p_target_closed
    changed_variable: "玩家前格开放，但非接触 P 半格目标格改成墙"
    contrast_with: h_l_pull_down_open
    question: "L 侧 pull 时，非接触 P 半格目标格是否形成独立 footprint 门"
    notes: "失败例；门控层=P 半格目标门；L 半格目标格是玩家旧格，不能在直接 pull 中独立塞墙；预期 force_blocked。"
    layout: |
      #######
      #..G..#
      #.....#
      #.PL..#
      #.#@..#
      #.....#
      #######
    actions: ["down"]

  - id: v_p_push_right_open
    family: pl_anchor_transverse_wall_gate_matrix
    variant: vertical_p_side_push_right_open
    changed_variable: "竖放 P/L；P 侧从左向右 push，两个目标格开放"
    contrast_with: v_p_push_left_open
    question: "竖放 P/L 的右向横向 push 是否与左向镜像一样移动 anchor"
    notes: "正例；竖放横向把手的右向开放变体。"
    layout: |
      #######
      #..G..#
      #.....#
      #.@P..#
      #..L..#
      #.....#
      #######
    actions: ["right"]

  - id: v_p_push_left_open
    family: pl_anchor_transverse_wall_gate_matrix
    variant: vertical_p_side_push_left_open
    changed_variable: "竖放 P/L；P 侧从右向左 push，两个目标格开放"
    contrast_with: v_p_push_right_open
    question: "竖放 P/L 的左/右横向 push 在无墙门时是否等价"
    notes: "正例；竖放横向把手的左向开放变体，检查旋转方向而非旧横放垂直把手。"
    layout: |
      #######
      #..G..#
      #.....#
      #..P@.#
      #..L..#
      #.....#
      #######
    actions: ["left"]
