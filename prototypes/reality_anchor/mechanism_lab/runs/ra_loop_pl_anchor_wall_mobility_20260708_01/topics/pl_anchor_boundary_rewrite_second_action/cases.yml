runId: ra_loop_pl_anchor_wall_mobility_20260708_01_pl_anchor_boundary_rewrite_second_action
title: "P/L anchor 边界重写后的第二动作"
notes: >
  P/L anchor 本体先被 push 或 pull 长轴移动；移动后的旧 L 半格成为新的 push 侧站位，
  再由墙/目标消费第二动作。失败对照用墙阻止第二次锚点移动，避免把普通对象推拉误写成本题材。
defaults:
  maxExploreDepth: 18
  maxReturnDepth: 28
  maxStates: 30000
  maxTransitions: 120000
cases:
  - id: push_two_shift_old_l_push_crate_goal
    family: pl_anchor_boundary_rewrite_second_action
    variant: push_driver_old_l_becomes_push_site
    changed_variable: "P 侧 push 将水平 P/L anchor 连续右移两格，旧 L 半格释放并落入新 push side"
    contrast_with: push_second_shift_wall_blocks_rewrite
    question: "P 侧连续推动锚点后，旧 L 半格能否成为 push 侧站位，继续把下方箱子推入目标？"
    layout: |
      ########
      #......#
      #@PL...#
      #..C...#
      #..G...#
      ########
    actions: ["right", "right", "down"]

  - id: push_second_shift_wall_blocks_rewrite
    family: pl_anchor_boundary_rewrite_second_action
    variant: push_driver_second_shift_wall_blocked
    changed_variable: "L 端第二停位改成墙，第二次 anchor shift 被拒绝"
    contrast_with: push_two_shift_old_l_push_crate_goal
    question: "如果墙阻止第二次移动，旧 L 半格是否无法释放为后续 push 站位？"
    layout: |
      ########
      #......#
      #@PL.#.#
      #..C...#
      #..G...#
      ########
    actions: ["right", "right", "down"]

  - id: pull_two_shift_old_l_push_crate_goal
    family: pl_anchor_boundary_rewrite_second_action
    variant: pull_driver_old_l_becomes_push_site
    changed_variable: "L 侧 pull 将水平 P/L anchor 连续右移两格，玩家绕行到旧 L 半格并使用新 push side"
    contrast_with: pull_second_shift_front_wall_blocks_rewrite
    question: "L 侧连续拉动锚点后，玩家能否绕到旧 L 半格，用被重写出的 push 侧把下方箱子推入目标？"
    layout: |
      #########
      #.......#
      #..PL@..#
      #...C...#
      #...G...#
      #########
    actions: ["right", "right", "up", "left", "left", "left", "down", "down"]

  - id: pull_second_shift_front_wall_blocks_rewrite
    family: pl_anchor_boundary_rewrite_second_action
    variant: pull_driver_second_shift_front_wall_blocked
    changed_variable: "第二次 pull 的玩家前格改成墙，anchor 不能继续右移，旧 L 半格不释放"
    contrast_with: pull_two_shift_old_l_push_crate_goal
    question: "如果玩家前格墙阻止第二次 pull，边界重写后的旧 L push 站位是否不成立？"
    layout: |
      #########
      #.......#
      #..PL@.##
      #...C...#
      #...G...#
      #########
    actions: ["right", "right", "up", "left", "left", "left", "down", "down"]

  - id: push_one_shift_only_walks_not_consume
    family: pl_anchor_boundary_rewrite_second_action
    variant: one_shift_no_old_l_site
    changed_variable: "只推动一次 P/L anchor，玩家还没站到旧 L 半格"
    contrast_with: push_two_shift_old_l_push_crate_goal
    question: "只移动一次锚点时，后续 down 是否只是普通走路/错位，而非旧 L 半格上的 crate push consumer？"
    layout: |
      ########
      #......#
      #@PL...#
      #..C...#
      #..G...#
      ########
    actions: ["right", "down"]
