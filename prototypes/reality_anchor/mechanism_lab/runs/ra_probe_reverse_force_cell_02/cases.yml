runId: ra_probe_reverse_force_cell_02
title: "反向施力站位格与黏块形状缩放"
notes: "第二轮 explorer：验证第一轮的“绕到右侧”解释是否应改写为更精确的“反向施力站位格 / 把手”。"
defaults:
  maxExploreDepth: 14
  maxReturnDepth: 24
  maxStates: 20000
  maxTransitions: 80000
cases:
  - id: "vertical2_single_column_push_down"
    family: "rigid_sticky_reverse_force_spectrum"
    variant: "vertical2_single_column"
    changed_variable: "竖向 2 格条没有可达的下方反向施力站位格"
    contrast_with: "vertical2_loop_room_push_down"
    title: "2 格竖条在单列通道中下推"
    question: "把横向实验旋转成竖向后，没有下方站位格时是否仍不可回返？"
    layout: |
      BS###G#
      #######
      ##@####
      ##M####
      ##M####
      ##.####
      #######
    actions: ["down"]

  - id: "vertical2_loop_room_push_down"
    family: "rigid_sticky_reverse_force_spectrum"
    variant: "vertical2_loop_room"
    changed_variable: "增加侧向绕行空间，允许站到下方反向施力位"
    contrast_with: "vertical2_single_column_push_down"
    title: "2 格竖条在可绕行房间中下推"
    question: "同样下推 2 格竖条，增加侧向绕行后是否恢复从下方推回的路径？"
    layout: |
      BS#####G
      ########
      #..@...#
      #..M...#
      #..M...#
      #......#
      #......#
      ########
    actions: ["down"]

  - id: "sticky3_narrow_mouth_push_right"
    family: "rigid_sticky_reverse_force_spectrum"
    variant: "bar3_narrow_mouth"
    changed_variable: "3 格条右推后没有右侧站位格"
    contrast_with: "sticky3_wide_mouth_push_right"
    title: "3 格横条在窄口中右推"
    question: "3 格横条右推后如果右侧站位格被墙吃掉，是否不可回返？"
    layout: |
      BS###G#
      #######
      #@MMM.#
      #.....#
      #######
    actions: ["right"]

  - id: "sticky3_wide_mouth_push_right"
    family: "rigid_sticky_reverse_force_spectrum"
    variant: "bar3_wide_mouth"
    changed_variable: "相对窄口增加 1 格右侧余量"
    contrast_with:
      - "sticky3_narrow_mouth_push_right"
      - "sticky4_wide_for_3_not_4_push_right"
    title: "3 格横条在加宽一格的口中右推"
    question: "只把墙口加宽一格，3 格横条是否恢复可回返？"
    layout: |
      BS####G#
      ########
      #@MMM..#
      #......#
      ########
    actions: ["right"]

  - id: "sticky4_wide_for_3_not_4_push_right"
    family: "rigid_sticky_reverse_force_spectrum"
    variant: "bar4_same_width_as_bar3_wide"
    changed_variable: "保持口宽不变，将 3 格条换成 4 格条"
    contrast_with:
      - "sticky3_wide_mouth_push_right"
      - "sticky4_extra_wide_push_right"
    title: "4 格横条放进刚好救 3 格条的口"
    question: "同一个加宽口能救 3 格条，但换成 4 格条是否再次不可回返？"
    layout: |
      BS####G#
      ########
      #@MMMM.#
      #......#
      ########
    actions: ["right"]

  - id: "sticky4_extra_wide_push_right"
    family: "rigid_sticky_reverse_force_spectrum"
    variant: "bar4_extra_wide"
    changed_variable: "相对 bar4_same_width_as_bar3_wide 再增加 1 格右侧余量"
    contrast_with: "sticky4_wide_for_3_not_4_push_right"
    title: "4 格横条在再加宽一格的口中右推"
    question: "再加宽一格后，4 格横条是否也恢复可回返？"
    layout: |
      BS#####G#
      #########
      #@MMMM..#
      #.......#
      #########
    actions: ["right"]

  - id: "square2_narrow_push_right"
    family: "rigid_sticky_reverse_force_spectrum"
    variant: "square2_narrow"
    changed_variable: "2x2 右推后整面右侧无站位格"
    contrast_with: "square2_wide_push_right"
    title: "2x2 黏块在窄口中右推"
    question: "非条形的 2x2 黏块，如果右侧整面无站位格，是否不可回返？"
    layout: |
      BS##G#
      ######
      #@MM.#
      #.MM.#
      #....#
      ######
    actions: ["right"]

  - id: "square2_wide_push_right"
    family: "rigid_sticky_reverse_force_spectrum"
    variant: "square2_wide"
    changed_variable: "给 2x2 右侧整面留出一列站位格"
    contrast_with: "square2_narrow_push_right"
    title: "2x2 黏块在加宽口中右推"
    question: "只给 2x2 黏块右侧留出一列站位格，是否恢复可回返？"
    layout: |
      BS###G#
      #######
      #@MM..#
      #.MM..#
      #.....#
      #######
    actions: ["right"]

  - id: "lshape_handle_open"
    family: "rigid_sticky_reverse_force_spectrum"
    variant: "lshape_side_handle_open"
    changed_variable: "顶端无右侧站位格，但下方凸出格右侧把手开放"
    contrast_with: "lshape_handle_blocked_by_wall"
    title: "L 形黏块顶排无右侧站位格但侧向把手开放"
    question: "如果顶排右侧被墙封住，但 L 形下方凸出格旁边仍可站人，是否仍能推回？"
    layout: |
      BS##G#
      ######
      #@MM.#
      #.M..#
      #....#
      ######
    actions: ["right"]

  - id: "lshape_handle_blocked_by_wall"
    family: "rigid_sticky_reverse_force_spectrum"
    variant: "lshape_side_handle_blocked"
    changed_variable: "只用墙堵住下方凸出格右侧把手"
    contrast_with: "lshape_handle_open"
    title: "L 形黏块的侧向把手被墙封住"
    question: "只堵住 L 形下方凸出格右侧的站位格，是否会把可回返变成不可回返？"
    layout: |
      BS##G#
      ######
      #@MM.#
      #.M.##
      #....#
      ######
