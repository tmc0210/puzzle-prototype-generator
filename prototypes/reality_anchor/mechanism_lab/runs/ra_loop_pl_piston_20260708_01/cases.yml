runId: ra_loop_pl_piston_20260708_01
title: "P/L 边界往复活塞：本体形状与墙口消费"
notes: "比较单箱、箱链、二格 sticky 横条、L 形 sticky 在同一 P/L 边界 stroke 中的伸出 / 回撤 / 残余债和墙阻碍差异。"
defaults:
  maxExploreDepth: 10
  maxReturnDepth: 16
  maxStates: 12000
  maxTransitions: 60000
cases:
  - id: c_single_reversible_degenerate
    family: pl_boundary_piston_body_wall
    variant: single_crate_degenerate
    changed_variable: "活塞本体为单箱；无后续墙齿消费"
    contrast_with: cc_chain_pull_splits_debt
    notes: "单箱 push 跨界后紧接 pull 精确回到初态，作为退化标尺。"
    layout: |
      #########
      #..PL..G#
      #.......#
      #..@C...#
      #.......#
      #########
    actions: ["right", "left"]

  - id: cc_chain_pull_splits_debt
    family: pl_boundary_piston_body_wall
    variant: crate_chain_near_end_extract
    changed_variable: "活塞本体由 C 改为 CC；push 整链，pull 只抽近端"
    contrast_with: c_single_reversible_degenerate
    notes: "箱链 push 是整链推进；紧接 pull 只拉回近端箱，远端箱留下残余债。"
    layout: |
      #########
      #..PL..G#
      #.......#
      #..@CC..#
      #.......#
      #########
    actions: ["right", "left"]

  - id: mm_bar_side_tooth_pass_reversible
    family: pl_boundary_piston_body_wall
    variant: sticky_bar_side_tooth_pass
    changed_variable: "活塞本体为二格横条；侧齿在横条占格外"
    contrast_with: l_shape_side_tooth_blocks_stroke
    notes: "同一侧齿下，横条 right/left 可往复；侧齿没有消费横条。"
    layout: |
      #########
      #B#######
      #S#PL..G#
      #.......#
      #..@MM..#
      #....#..#
      #########
    actions: ["right", "left"]

  - id: l_shape_side_tooth_blocks_stroke
    family: pl_boundary_piston_body_wall
    variant: l_shape_side_tooth_block
    changed_variable: "横条增加下凸格成为 L 形；同一侧齿落到下凸格目标位"
    contrast_with:
      - mm_bar_side_tooth_pass_reversible
      - l_shape_wide_mouth_reversible
    notes: "L 形下凸格在 push stroke 的目标格撞侧齿，首步被 force_blocked。"
    layout: |
      #########
      #B#######
      #S#PL..G#
      #.......#
      #..@MM..#
      #...M#..#
      #########
    actions: ["right"]

  - id: l_shape_wide_mouth_reversible
    family: pl_boundary_piston_body_wall
    variant: l_shape_wide_mouth_pass
    changed_variable: "移除侧齿，L 形下凸格有行程余量"
    contrast_with: l_shape_side_tooth_blocks_stroke
    notes: "同一 L 形在宽一格空间中 right/left 可往复，说明侧齿是消费点。"
    layout: |
      #########
      #B#######
      #S#PL..G#
      #.......#
      #..@MM..#
      #...M...#
      #########
    actions: ["right", "left"]

  - id: mm_bar_head_wall_blocks_stroke
    family: pl_boundary_piston_body_wall
    variant: sticky_bar_head_wall_block
    changed_variable: "二格横条的前沿目标格加行程墙"
    contrast_with: mm_bar_side_tooth_pass_reversible
    notes: "横条右推时前端目标格撞墙，证明可撤回活塞仍需要伸出行程。"
    layout: |
      #########
      #B#######
      #S#PL..G#
      #.......#
      #..@MM#.#
      #.......#
      #########
    actions: ["right"]
