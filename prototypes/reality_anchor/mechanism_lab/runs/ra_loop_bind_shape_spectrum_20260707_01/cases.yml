runId: ra_loop_bind_shape_spectrum_20260707_01
title: "B/S 绑定 footprint 形状谱接同一右推墙口"
notes: "同一 B/S 绑定线和右侧墙口消费者下，比较单格、2/3 格竖条、L 形、分离部件与开口修正；重点解释为：过 B/S 线后粘成一整块，门口要看整块前面有没有路。"
defaults:
  maxExploreDepth: 14
  maxReturnDepth: 24
  maxStates: 20000
  maxTransitions: 80000
cases:
  - id: bs_shape_single_cell_lower_lane_pass
    title: 单格基线，下行一格口可通过
    family: bs_bind_shape_spectrum_mouth
    variant: single_cell_lower_lane_pass
    changed_variable: "只让一个 crate 跨过 B/S 线，输出 footprint 是单格"
    contrast_with:
      - bs_shape_two_bar_single_mouth_block
      - bs_shape_separated_lower_shortcut_pass
    question: "同一右推墙口里，单格 sticky 是否能沿下行一格口覆盖目标，作为后续 connected footprint 的基线？"
    actions: [right, right]
    layout: |
      ###########
      ####BS#####
      #.........#
      #.....#...#
      #..@C.G...#
      #.........#
      ###########

