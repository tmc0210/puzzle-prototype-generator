runId: ra_struct_rigid_tooth_consume_01
title: "竖向 sticky 刚体被墙齿目标口消费"
notes: "Reality Anchor 的 explorer run。本轮范围只看局部 B/S 归一化与 sticky merge 产物如何被一格墙齿目标口消费；不进入关卡设计，不读取历史设计归档、候选包、报告、采样配置或旧实验 run 材料。"
defaults:
  maxExploreDepth: 12
  maxReturnDepth: 16
  maxStates: 10000
  maxTransitions: 40000
cases:
  - id: rigid_pair_tooth_block
    family: rigid_tooth_mouth_consumption
    variant: "vertical_sticky_pair_with_upper_tooth"
    changed_variable: "双格竖向 sticky 刚体；上沿目标格被墙齿阻挡，下沿是目标口"
    contrast_with:
      - crate_pair_tooth_lower_pass
      - rigid_pair_open_mouth_pass
      - single_sticky_tooth_pass
    question: "同一格向右输入是否会因为刚体另一格撞墙而无法把下格送入目标口？"
    layout: |
      #######
      ###M# #
      ##@MG #
      #BS#  #
      #######
    actions: ["right"]

  - id: crate_pair_tooth_lower_pass
    family: rigid_tooth_mouth_consumption
    variant: "vertical_crate_pair_with_upper_tooth"
    changed_variable: "同形竖排对象保持为两个 crate；B/S 边界远置在右侧箱子区域"
    contrast_with: rigid_pair_tooth_block
    question: "墙齿只挡住上方 crate 的右侧时，下方 crate 是否仍可单独进入目标口？"
    layout: |
      #######
      ###C# #
      ##@CG #
      ### BS#
      #######
    actions: ["right"]

  - id: rigid_pair_open_mouth_pass
    family: rigid_tooth_mouth_consumption
    variant: "vertical_sticky_pair_with_two_cell_mouth"
    changed_variable: "保留双格 sticky 刚体，但移除上沿墙齿，形成双格宽通过口"
    contrast_with: rigid_pair_tooth_block
    question: "如果刚体两格前方都开放，双格 sticky 输出是否能整体进入目标口？"
    layout: |
      #######
      ###M  #
      ##@MG #
      #BS#  #
      #######
    actions: ["right"]

  - id: single_sticky_tooth_pass
    family: rigid_tooth_mouth_consumption
    variant: "single_sticky_with_upper_tooth"
    changed_variable: "保留墙齿和 sticky side，但移除上方相邻 sticky，避免 merge 成双格刚体"
    contrast_with: rigid_pair_tooth_block
    question: "同样墙齿下，单格 sticky 是否像单箱一样能进入下方目标口？"
    layout: |
      #######
      ####  #
      ##@MG #
      #BS#  #
      #######
    actions: ["right"]
