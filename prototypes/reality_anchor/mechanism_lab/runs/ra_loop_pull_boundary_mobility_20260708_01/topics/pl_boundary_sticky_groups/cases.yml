runId: ra_loop_pull_boundary_mobility_20260708_01_pl_boundary_sticky_groups
title: "P/L 边界邻域 sticky group 推拉可动性"
notes: >
  P/L 与 B/S 锚都封闭在上方隔间；P/L 只提供 x<=4 为 push、x>=5 为 pull 的全局边界，
  B/S 只使下半区的 M 保持 sticky。每个动作序列都要求玩家实际跨过 P/L 边界，
  并在 P 侧先 push sticky group，再在 L 侧 pull 或触发明确 pull 门控。
defaults:
  maxExploreDepth: 14
  maxReturnDepth: 20
  maxStates: 20000
  maxTransitions: 80000
cases:
  - id: pl_sticky_bar_push_pull_extract
    family: pl_boundary_sticky_group_handoff
    variant: two_cell_bar_positive_extract
    changed_variable: "L 侧前格与 footprint 目标均开放"
    contrast_with: [pl_sticky_bar_l_front_wall_gate, pl_sticky_l_shape_target_wall_gate]
    title: "二格横条：P 侧送到边界，L 侧继续抽出"
    question: "二格 sticky 横条在 P/L 分界邻域能否先由 P push 跨界，再由 L pull 利用玩家旧格继续右移？"
    notes: >
      active_rule=push_force/pull_force with move_sticky_rigid; material_source=box_sticky_normalize/sticky_merge;
      consumer=边界右侧开放把手格与开放目标格；incidental=sealed anchors/goal。
    layout: |
      ############
      #B##PL##..G#
      #S##########
      ##.........#
      #@MM.......#
      #..........#
      ############
    actions: ["right", "up", "right", "right", "right", "down", "right"]

  - id: pl_sticky_bar_l_front_wall_gate
    family: pl_boundary_sticky_group_handoff
    variant: two_cell_bar_pull_front_blocked
    changed_variable: "L 侧玩家前格改成墙；sticky footprint 自身目标仍可容纳"
    contrast_with: [pl_sticky_bar_push_pull_extract]
    title: "二格横条反例：L 侧前格门阻止抽出"
    question: "P 侧同样可以把二格条送到边界时，L 侧 pull 的玩家前格门是否独立阻断后续抽出？"
    notes: >
      active_rule=pull_force front-cell gate after P-side sticky push; material_source=box_sticky_normalize/sticky_merge;
      consumer=L 侧前格墙；incidental=sealed anchors/goal。
    layout: |
      ############
      #B##PL##..G#
      #S##########
      ##.........#
      #@MM..#....#
      #..........#
      ############
    actions: ["right", "up", "right", "right", "right", "down", "right"]

  - id: pl_sticky_bar_open_handle_return
    family: pl_boundary_sticky_group_handle_return
    variant: boundary_spanning_bar_reversible_handoff
    changed_variable: "sticky 横条初始跨界，P 侧下推后开放 L 侧上拉把手"
    contrast_with: [pl_sticky_bar_push_pull_extract]
    title: "打开把手后的回返正例：P 下推、L 上拉回原状"
    question: "跨界二格条是否能用 P 侧 push 先打开 L 侧把手格，再由 L 侧 pull 把 footprint 拉回原位？"
    notes: >
      active_rule=push_force/pull_force with same sticky footprint under different side checks;
      material_source=box_sticky_normalize/sticky_merge; consumer=边界两侧把手格互补；
      incidental=sealed anchors/goal。
    layout: |
      ############
      #B##PL##..G#
      #S##########
      ##..@......#
      ##..MM.....#
      ##.........#
      ############
    actions: ["down", "right", "up", "left"]

  - id: pl_sticky_l_shape_target_wall_gate
    family: pl_boundary_sticky_group_shape_gate
    variant: l_shape_pull_target_blocked
    changed_variable: "二格横条增加一个下凸 sticky cell，L 侧 pull 的额外 footprint 目标格为墙"
    contrast_with: [pl_sticky_bar_push_pull_extract]
    title: "L 形修正：前格开放但额外 footprint 目标格阻断 L 侧 pull"
    question: "同样的 P 侧送入与 L 侧把手，L 形 footprint 是否会因额外目标格被墙消费而从可抽出变为不可抽出？"
    notes: >
      active_rule=pull_force footprint check on rigid sticky group after P-side boundary push;
      material_source=box_sticky_normalize/sticky_merge; consumer=L 侧下凸目标格墙；
      incidental=sealed anchors/goal。
    layout: |
      ############
      #B##PL##..G#
      #S##########
      ##.........#
      #@MM.......#
      #..M.#.....#
      ############
    actions: ["right", "up", "right", "right", "right", "down", "right"]
