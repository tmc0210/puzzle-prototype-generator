runId: ra_loop_pull_boundary_mobility_20260708_01_sticky_wall_pull_mobility
title: "sticky wall pull mobility local probes"
notes: >
  Topic-local probes for sticky rigid footprint under pull_force. P/L only creates
  the pull region; B/S only supplies sticky material. Wall mouths, footprint target
  cells, and post-pull handle reachability are the consumers.
defaults:
  maxExploreDepth: 14
  maxReturnDepth: 24
  maxStates: 20000
  maxTransitions: 80000
cases:
  - id: single_crate_pull_clear
    family: pull_single_cell_material_control
    variant: crate_clear
    changed_variable: "material=crate; no B/S material source"
    contrast_with: single_sticky_pull_clear
    title: "单格 crate 在 pull 区域被向右拉动"
    question: "单格 crate 的 clear pull 是否只需要玩家前格为空和身后一格有对象？"
    notes: "active_rule=pull_force; material_source=crate; consumer=none beyond clear target cell."
    layout: |
      ##########
