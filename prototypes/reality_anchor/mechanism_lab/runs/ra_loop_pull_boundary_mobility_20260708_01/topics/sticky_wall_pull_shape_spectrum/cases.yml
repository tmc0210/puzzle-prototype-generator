runId: ra_loop_pull_boundary_mobility_20260708_01_sticky_wall_pull_shape_spectrum
title: "sticky wall pull shape spectrum补实验"
notes: >
  补齐 pull 侧黏块组 + 墙的形状谱。P/L 只提供 pull side；B/S 只提供合法
  sticky material。关键观察点是 pull_force 对 sticky rigid footprint 的目标格
  检查，以及 pull 后反向把手通路被墙 / crate / sticky 占用时的差异。
defaults:
  maxExploreDepth: 14
  maxReturnDepth: 24
  maxStates: 30000
  maxTransitions: 120000
cases:
  - id: bar3_side_pull_mid_wall_blocked
    family: sticky_pull_shape_spectrum
    variant: vertical_bar3_mid_wall
    changed_variable: "3格竖条中段目标格为墙"
    contrast_with: bar3_side_pull_open_mouth
    title: "3格竖条侧拉时中段目标墙拒绝"
    question: "3格竖条向右 pull 时，非接触中段目标墙是否让整步 force_blocked？"
    notes: "active_rule=sticky rigid footprint under pull_force; consumer=middle target wall."
    layout: |
      ###########
      #PL#.....G#
      #BS#......#
      #..#.M@...#
      #..#.M#...#
      #..#.M....#
      #..#......#
      ###########
    actions: ["right"]

  - id: bar3_side_pull_open_mouth
    family: sticky_pull_shape_spectrum
    variant: vertical_bar3_open
    changed_variable: "3格竖条三个目标格均开放"
    contrast_with: bar3_side_pull_mid_wall_blocked
    title: "3格竖条侧拉时三格目标口打开"
    question: "打开中段目标格后，3格竖条是否可整体 pull 通过？"
    notes: "同形正例；口宽从2个有效目标格扩到3个。"
    layout: |
      ###########
      #PL#.....G#
      #BS#......#
      #..#.M@...#
      #..#.M....#
      #..#.M....#
      #..#......#
      ###########
    actions: ["right"]

