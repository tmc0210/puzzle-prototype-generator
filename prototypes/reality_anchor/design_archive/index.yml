      人类接受的 Reality Anchor 正例，审美 4、难度 4。候选同时使用竖直 P/L
      与水平 B/S：P/L 提供 pull-side 和右侧目标压力，B/S 提供材料边界债务；
      上方 M 被墙封住后，返回解通过 box_to_sticky + sticky_merge 制造下方
