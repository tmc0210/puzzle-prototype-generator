schema_version: 2
prototype: candle_sokoban
status: human_maintained_draft
event_authority: prototypes/candle_sokoban/mechanic.yml
description: >
  candle_sokoban 的线性玩家知识暴露硬门。每个 branch 是一个玩家可理解、可独立
  设计的机制家族；new_events 可以包含同一知识自然产生的来源标签、边界结算标签和
  组合摘要，不再把这些诊断事件拆成额外课程阶段。allowed_exposure_through 及之前
  家族允许出现；之后家族的 new_events 在当前 exact version 的全部可达状态与边上
  必须完全不可达。缺少 complete reachable graph 时只能判 unknown。

event_exposure_sequence:
  - branch: basic_candle_manipulation
    title: 基础蜡烛操控
    player_rule: >
      玩家可以沿长轴推动蜡烛一格，也可以从侧面让它滚到下一步被阻挡的位置；一次多格侧滚
      仍只消耗一个行动。外露火焰能点盆也会杀死玩家；每次合法行动推进共享倒计时，燃烧边界
      会让所有已燃蜡烛同时从烛芯端缩短，最后一格燃尽后消失。
    source_rules: [walk, move_candle, contact_settlement, global_burn_and_shrink]
    new_events:
      - push_axis
      - roll_candle
      - roll_multi_cell_one_turn
      - light_brazier
      - player_died
      - countdown
      - shrink
      - burn_out
      - simultaneous_burn

  - branch: wall_dousing
    title: 墙体遮芯灭火
    player_rule: >
      已燃烛芯被墙遮住时立即熄灭；全部蜡烛熄灭后共享倒计时仍继续，若灭火发生在燃烧边界，
      已熄灭蜡烛会避开本次缩短。该门紧随基础操控，基础阶段只需短暂遮蔽这一自然边界结果。
    source_rules: [contact_settlement, global_burn_and_shrink]
    new_events:
      - extinguish_by_wall
      - countdown_without_lit_candle
      - boundary_extinguish_avoids_burn

  - branch: shared_fire_and_reignition
    title: 共享火焰与复燃
    player_rule: >
      已点亮火盆和外露已燃烛芯都能点燃外露未燃烛芯；点火不会重置共享倒计时，若发生在
      燃烧边界，新点燃的蜡烛会立即参加本次结算。
    source_rules: [contact_settlement, global_burn_and_shrink]
    new_events:
      - ignite_from_brazier
      - ignite_from_wick
      - ignite_midcycle
      - boundary_ignite_participates

  - branch: body_concealment_and_reexposure
    title: 烛身遮蔽与未燃重曝
    player_rule: >
      另一根蜡烛的烛身也会遮住已燃烛芯并使其熄灭；遮蔽烛身移开后，重新外露的烛芯保持未燃，
      不会因为重曝而自动复燃。玩家由此可以主动制造并解除可逆遮蔽。
    source_rules: [contact_settlement]
    new_events:
      - extinguish_by_candle_body
      - wick_reexposed_unlit

  - branch: retreating_flame_transfer
    title: 退焰点火
    player_rule: >
      燃烧缩短释放的格子会形成退后的火焰；若该格同时让另一根未燃蜡烛的烛芯刚刚外露，
      它会在同一燃烧边界被点燃。
    source_rules: [global_burn_and_shrink]
    new_events:
      - shrink_ignite

  - branch: rolling_contact_chain
    title: 滚动途中接触链
    player_rule: >
      侧滚的每个小步都会立即结算点盆、点火和灭火；这些途中变化不会让滚动提前停止，
      因而可以在同一次滚动中先灭火、再复燃，或在终点前点亮最后一个火盆。
    source_rules: [move_candle]
    new_events:
      - roll_intermediate_light_brazier
      - roll_last_brazier_before_endpoint
      - roll_intermediate_ignite
      - roll_intermediate_extinguish
      - roll_reignite_after_extinguish

runtime_witnesses:
  declared_trace_levels:
    basic_candle_manipulation:
      - CANDLE_SMOKE_01_LIGHT_BRAZIER
      - CANDLE_PROBE_02_SIDE_ROLL
      - CANDLE_PROBE_05_FIRE_DEATH
      - CANDLE_PROBE_10_EXPOSED_FLAME_DEATH
    wall_dousing:
      - CANDLE_EXPOSURE_02_WALL_DOUSE
    shared_fire_and_reignition:
      - CANDLE_PROBE_04_RECURSIVE_IGNITION
      - CANDLE_PROBE_07_UNLIT_COUNTDOWN
    body_concealment_and_reexposure:
      - CANDLE_PROBE_08_BODY_CONCEALMENT
    retreating_flame_transfer:
      - CANDLE_PROBE_06_BURN_SHRINK
    rolling_contact_chain:
      - CANDLE_PROBE_03_CONCEALED_FLAME
      - CANDLE_PROBE_07_UNLIT_COUNTDOWN
      - CANDLE_PROBE_09_INTERMEDIATE_LAST_BRAZIER
  complete_graph_boundary_levels:
    basic_candle_manipulation: CANDLE_PROBE_02_SIDE_ROLL
    wall_dousing: CANDLE_EXPOSURE_02_WALL_DOUSE
    shared_fire_and_reignition: CANDLE_PROBE_04_RECURSIVE_IGNITION
    body_concealment_and_reexposure: CANDLE_PROBE_08_BODY_CONCEALMENT
    retreating_flame_transfer: CANDLE_PROBE_06_BURN_SHRINK
    rolling_contact_chain: CANDLE_PROBE_03_CONCEALED_FLAME
  conformance_checks:
    basic_candle_manipulation: global_countdown_semantics
    wall_dousing: global_countdown_semantics
    shared_fire_and_reignition: global_countdown_semantics
    retreating_flame_transfer: global_countdown_semantics

explicitly_excluded:
  - id: generic_walk_and_win
    reason: walk 与 win_all_braziers_lit 是通用行动/目标事件，不是待隐藏机制。
  - id: generic_contact_events
    events: [ignite, extinguish]
    reason: 已由带来源或遮蔽原因的精确事件覆盖，不能作为更细阶段的独立 gate。
  - id: roll_step
    reason: 每次 roll_candle 都必然产生 roll_step，二者没有可分离的暴露窗口。
  - id: wick_only_negative_rule
    reason: “烛身接触火焰不会点燃”是负规则，没有不造伪事件即可使用的正向扳机。
  - id: same_step_recursive_chain
    reason: 没有区别于普通直接传火的新来源坐标，也没有独立可观察结果。
  - id: invalid_input_does_not_tick
    reason: 无效输入不产生 runtime edge 或事件，属于操作语义核验，不适合作为事件暴露 gate。
  - id: undo
    reason: undo 不属于 puzzle runtime 的状态转移与完整可达图。
  - id: death_before_win_priority
    reason: “死亡时不胜利”依赖事件缺席与结算顺序，不能由单个正向事件严格代表。

review_contract:
  later_event_absence_requires:
    - exact_candidate_version
    - complete_reachable_graph
    - raw_edge_events
  incomplete_or_sampled_scan_verdict: unknown
  event_occurrence_only_means: 该机制已可达，不证明必经、有效使用、难度或关卡质量。
