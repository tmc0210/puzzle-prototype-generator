mechanic: candle_sokoban
target_level_count: 20

tracks:
  - id: stage_1_move_and_complete
    title: 第一阶段：会推动，也会完成目标
    goals:
      - knowledge: [K_M1_axis_push]
        roles: [discovery]
        count: 1
        notes: 课程顺序 1；先建立长轴端推。
      - knowledge: [K_F1_flame_lights_brazier]
        roles: [discovery]
        count: 1
        notes: 课程顺序 2；明确目标接触发生在火焰投影。
      - knowledge: [K_M2_side_roll]
        roles: [discovery]
        count: 1
        notes: 课程顺序 3；一次输入展示多格滚动与实体停车。
      - knowledge: [K_F3_wick_only_ignition]
        roles: [discovery, boundary]
        count: 1
        notes: 课程顺序 4；先展示烛身接火失败，再让烛芯取火。
      - knowledge: [K_F2_lit_brazier_source]
        roles: [discovery]
        count: 1
        notes: 课程顺序 5；已点亮火盆作为稳定中继火源。

  - id: stage_2_fire_time_and_shape
    title: 第二阶段：火焰、时间与形状
    goals:
      - knowledge: [K_H1_exposed_flame_danger]
        roles: [discovery, boundary]
        count: 1
        notes: 课程顺序 6；危险格与燃烧端不可推。
      - knowledge: [K_T1_global_five_turn_beat]
        roles: [discovery]
        count: 1
        notes: 课程顺序 7；观察完整五回合节拍。
      - knowledge: [K_T2_M4_valid_actions_tick]
        roles: [discovery, boundary]
        count: 1
        notes: 课程顺序 8；区分成功行动与无效输入。
      - knowledge: [K_B1_shrink_from_wick_end]
        roles: [discovery]
        count: 1
        notes: 课程顺序 9；首次观察从烛芯端缩短。
      - knowledge: [K_B3_last_cell_burnout]
        roles: [discovery, guided_application]
        count: 1
        notes: 课程顺序 10；利用单格蜡烛燃尽打开通路。

  - id: stage_3_roll_as_event_path
    title: 第三阶段：一次侧滚是一条事件轨迹
    goals:
      - knowledge: [K_M3_long_roll_one_turn]
        roles: [discovery]
        count: 1
        notes: 课程顺序 11；空间距离与回合时间分离。
      - knowledge: [K_R1_per_step_contact]
        roles: [discovery, guided_application]
        count: 1
        notes: 课程顺序 12；沿途三个小步分别完成目标。
      - knowledge: [K_R2_fire_state_does_not_stop_roll]
        roles: [discovery, boundary]
        count: 1
        notes: 课程顺序 13；点火和熄灭都不改变实体终点。
      - knowledge: [K_H2_body_conceals_wick]
        roles: [discovery, boundary]
        count: 1
        notes: 课程顺序 14；由另一根蜡烛的烛身遮蔽火焰。
      - knowledge: [K_H3_expose_and_relight]
        roles: [guided_application]
        count: 1
        notes: 课程顺序 15；离开遮挡后必须重新接触火源。

  - id: stage_4_shared_fire_and_time
    title: 第四阶段：多根蜡烛共享火与时间
    goals:
      - knowledge: [K_F4_wick_to_wick_transfer]
        roles: [discovery]
        count: 1
        notes: 课程顺序 16；两个烛芯投影同格传火。
      - knowledge: [K_F5_same_step_recursive_chain]
        roles: [discovery, guided_application]
        count: 1
        notes: 课程顺序 17；同一小步点燃多个烛芯。
      - knowledge: [K_B2_simultaneous_shrink]
        roles: [discovery]
        count: 1
        notes: 课程顺序 18；两个点燃成员同步缩短。
      - knowledge: [K_T3_fire_state_does_not_reset_timer]
        roles: [discovery, boundary]
        count: 1
        notes: 课程顺序 19；熄灭和重燃不改变当前节拍。
      - knowledge: [K_T4_boundary_ignition_shrinks]
        roles: [discovery, boundary]
        count: 1
        notes: 课程顺序 20；最后一拍取火立即参加缩短。
