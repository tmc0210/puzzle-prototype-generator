mechanism_scope:
  central:
    - candle#2 开局向左侧滚必须先点亮火盆 10,3，再用烛身遮熄 candle#1
    - 首边界只能缩短 candle#2，并由退焰 shrink_ignite 未缩短的 candle#1
    - 玩家到达上廊入口时 candle#4 必须恰好缩成单格；所有胜路至少向左推动它三格
    - 第二边界必须得到 candle#1 len3、candle#2 len1，并烧尽 candle#4 开放通路
    - candle#1 必须在第三边界动作向下侧滚，依次点亮火盆 8,5、点燃 candle#3、再被其烛身遮熄
    - 同一边界必须烧尽 candle#2 并把新点燃 candle#3 缩成 len2
    - candle#3 再缩成 len1 后必须及时右滚，点亮火盆 9,8
  allowed_support:
    - 有效走位推进固定五拍倒计时
    - 火盆永久点亮
    - 不改变非 walk/countdown 事件签名的等价走位
  incidental_allowed:
    - 上层锁在两个燃烧边界之间的等价等待位置
  required_winning_path_events:
    - light_brazier:10,3
    - extinguish:candle#1:concealed
    - shrink:candle#2:len2
    - shrink:candle#4:len1
    - shrink_ignite:candle#1
    - push_axis:candle#4
    - shrink:candle#1:len3
    - shrink:candle#2:len1
    - burn_out:candle#4
    - light_brazier:8,5
    - ignite:candle#3
    - burn_out:candle#2
    - shrink:candle#3:len2
    - shrink:candle#3:len1
    - light_brazier:9,8
  forbidden_winning_path_events: []
  forbidden_if_seen_anywhere: []

player_reasoning:
  canonical_trace_ref: input_replay_CANDLE_FRESH_05_PHASE_SPLIT_WEAVE.json
  player_goal:
    description: 点亮三个未燃火盆，并保存足够的火种与长度完成末段接力
    state_ref: initial_state
  reasoning_units:
    - id: RU1
      player_question: 为什么开局必须让 candle#2 左滚后遮熄 candle#1？
      premises:
        - statement: candle#1 长 4、candle#2 长 3 且都点燃；首个燃烧边界还有四个有效行动
          state_ref: initial_state
        - statement: candle#2 左滚的火焰先经过火盆 10,3，终点上端烛身随后覆盖 candle#1 火焰
          state_ref: canonical_after_step_1
      conclusion: >
        让 candle#1 退出首边界燃烧集合，只缩短 candle#2；移除的烛身又在腾格中
        释放 candle#1 烛芯，使退焰重新点燃仍保持 len4 的 candle#1。
      operation_refs: [OP1]
      alternative:
        status: replayed_attempt
        description: 在首边界前从竖廊直接向左寻找上层锁入口
        local_gain: 玩家已接近上层走廊
        from_state_ref: initial_state
        exact_inputs: [left, up, up, up, left]
        result_state_ref: input_replay_CANDLE_FRESH_05_ALT_PREBOUNDARY_LOCK.json#final
        concrete_outcome: >
          第 5 个 left 因 destination_blocked 非法，倒计时仍为 1；玩家无法在
          candle#4 缩短前进入上层，也不能提前推动它修正拍点。
      feedback:
        - state_ref: canonical_after_step_1
          visible_change: 火盆 10,3 点亮，candle#1 熄灭，candle#2 停在其烛芯上方
        - state_ref: canonical_after_step_5
          visible_change: candle#2 缩成 len2，candle#1 保持 len4 并由 shrink_ignite 重燃
    - id: RU2
      player_question: 首边界后如何穿过上层锁，并把 A/B 的长度差带到下滚位置？
      premises:
        - statement: candle#4 已从 len2 缩成点燃单格，仍占据唯一上层通道
          state_ref: canonical_after_step_5
        - statement: 第二边界前 candle#1 len4、candle#2 len2 且都点燃
          state_ref: canonical_after_step_5
        - statement: 上廊左端只有 x=6 的竖向出口，可以到达 candle#1 中段上方
          state_ref: canonical_after_step_10
      conclusion: >
        至少向左推动 candle#4 三格并让第二边界到来；该边界将 A/B 同步缩成
        len3/len1，同时烧尽锁烛。玩家穿过上廊后只能从指定列向下侧滚 candle#1。
      operation_refs: [OP2]
      alternative:
        status: replayed_attempt
        description: 首边界后立刻连续推动锁烛，再用一步回走调整第二边界
        local_gain: 更早把锁烛推到左侧
        from_state_ref: canonical_after_step_5
        exact_inputs: [left, left, left, right, left]
        result_state_ref: input_replay_CANDLE_FRESH_05_ALT_LOCK_TIMING.json#after_step_10
        concrete_outcome: >
          该走位仍只能在第二边界后通过；非走路事件与 canonical 相同，说明局部
          等价等待不会改变锁烛燃尽、A/B len3/len1 和后续唯一出口。
      feedback:
        - state_ref: canonical_after_step_10
          visible_change: candle#4 燃尽消失，candle#1 len3、candle#2 len1，左侧出口开放
    - id: RU3
      player_question: 为什么 candle#1 必须在归零动作下滚，candle#3 又必须在下一次燃尽前右滚？
      premises:
        - statement: candle#1 下滚轨迹的火焰依次经过火盆 8,5、candle#3 烛芯和 candle#3 烛身
          state_ref: canonical_before_step_15
        - statement: candle#2 此时为点燃单格；candle#3 初始未燃 len3 且朝上
          state_ref: canonical_before_step_15
        - statement: 最终火盆 9,8 会阻挡 len2 candle#3 侧滚，缩成 len1 后碰撞面才消失
          state_ref: canonical_after_step_15
      conclusion: >
        第三边界动作先点目标、点燃 candle#3、再遮熄 candle#1；随后 candle#2
        燃尽而 candle#3 临界缩成 len2。再跨一个边界缩成 len1 后立即右滚完成。
      operation_refs: [OP3, OP4]
      alternative:
        status: replayed_attempt
        description: candle#3 已缩成 len1 后继续来回走，等它完全燃尽再尝试右移
        local_gain: 玩家仍能在接力烛左侧自由走位
        from_state_ref: canonical_after_step_20
        exact_inputs: [left, right, left, right, left, right, right, right]
        result_state_ref: input_replay_CANDLE_FRESH_05_ALT_RELAY_BURNOUT.json#final
        concrete_outcome: >
          第 25 步出现 burn_out:candle#3；随后玩家走到原推动位也没有蜡烛可滚，
          火盆 9,8 仍暗，最终状态不胜利。
      feedback:
        - state_ref: canonical_after_step_15
          visible_change: 火盆 8,5 已亮，candle#1 熄灭，candle#2 消失，candle#3 点燃并缩成 len2
        - state_ref: canonical_after_step_20
          visible_change: candle#3 缩成 len1，最终火盆不再阻挡右滚
        - state_ref: canonical_after_step_22
          visible_change: 右滚点亮火盆 9,8 并出现 win_all_braziers_lit
  operation_segments:
    - id: OP1
      step_range: 1-5
      exact_inputs: [left, up, up, up, up]
      purpose: 左滚 candle#2 点第一目标并遮熄 candle#1，推进首边界制造长度相位差
      supports_reasoning_units: [RU1]
    - id: OP2
      step_range: 6-14
      exact_inputs: [down, up, left, left, left, left, left, down, down]
      purpose: 推动上层锁并跨过第二边界，从唯一出口抵达 candle#1 上方
      supports_reasoning_units: [RU2]
    - id: OP3
      step_range: 15-20
      exact_inputs: [down, down, down, down, down, down]
      purpose: 临界下滚 candle#1 完成接力，再绕行使 candle#3 缩成 len1
      supports_reasoning_units: [RU3]
    - id: OP4
      step_range: 21-22
      exact_inputs: [right, right]
      purpose: 在 candle#3 燃尽前右滚，点亮最终火盆
      supports_reasoning_units: [RU3]
  resolution:
    resolves: [RU1, RU2, RU3]
    operation_refs: [OP1, OP2, OP3, OP4]
    final_state_ref: canonical_after_step_22
    visible_confirmation: 三个火盆全部点亮且玩家存活
  trace_partition:
    status: complete
    ordered_segment_ids: [OP1, OP2, OP3, OP4]
    uncovered_steps: []
    overlapping_steps: []

