candidate_id: CANDLE_FRESH_05_PHASE_SPLIT_WEAVE
candidate_version: v1
title: 错拍三折

prototype_context:
  confirmed_rules:
    - 全局燃烧周期固定为 5；每次有效行动推进，无效输入不推进
    - 倒计时从 1 结算时，以行动与接触结束后的点燃集合为准同步缩短或燃尽
    - 烛身遮挡火焰会立即熄灭；缩短腾格可以点燃刚外露的烛芯
    - 侧滚逐格处理火盆、点火与遮挡，但整段只消耗一个有效行动
    - 玩家存活且全部火盆点亮时胜利
  win_condition: all_braziers_lit
  object_and_event_semantics: 以 CANDLE_SOKOBAN_DESIGN.md 和 CANDLE_SOKOBAN_ASCII.md 为准
  tool_boundary: >
    solver、完整图、事件门和有序阶段门只支持机械事实；不据此宣称人工难度、
    审美分数、自然度或正式 campaign 位置。

slot_brief:
  intended_role: highest_difficulty_challenge_candidate
  target: >
    用开局遮火制造 A/B 长度相位差，再以会缩短并燃尽的上层锁固定第二边界，
    最后在一次归零侧滚中完成点目标、点接力烛、遮熄主烛和临界缩短。
  difficulty_expectation: highest_available_unscored_missing_human_archive_context

