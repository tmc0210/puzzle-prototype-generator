do_not_repeat:
  - 只复现 C 两格使侧滚 d2、单格使 d3，却不把 d2 终点接到 B 原端帽 consumer。
  - 用下一次 axis_push_blocked 当作 C consumer，但获胜者可以在删除 C 第二格后自愿停止轴推并保持同一职责。
  - 用长走廊、反复绕行、空等倒计时或无关对象堆积把两个局部探针串起来。
  - 把 C 到位变成唯一合法输入，或用纯死亡格替代可理解的错误对象处置。
  - 只给单条 replay，不跑两格 C、单格 C、B 端帽移除/缩短三个最小对照。

materialization_target: >-
  每张可用材料给出一个紧凑局部开始局面和连续非空输入串：C 到位并触发 extinguish_by_candle_body，
  后继由 C 第二格自动取得近停，随后最多一次离散重定位就由 B 原端帽取得第二停位或操作面。保存两格 C 正例、
  单格 C 对照、B 原端帽缺失对照，以及 C 到位前的错误对象处置。若声称错误不可补救或职责必经，提供局部完整图；
  图不完整时明确标为待 Designer 自证。只发布抽象局部卡片，不设计完整候选、玩家起点包装或难度。

acceptance_evidence:
  - 两格 C 正例包含非空 replay、明确的 d2/dN 终点和后续 B 原端帽 consumer。
  - 单格 C 对照不能仅靠选择少推一次恢复同一终点与职责。
  - 删除或缩短 B 原端帽后，后继不能维持同一终点、目标分配与对象角色。
  - 开局错误是对象状态差异，不是空等、纯走位填拍或唯一合法动作的反面。
  - 所有侧滚中间步不产生 rolling_contact_chain later event；不得产生 shrink_ignite。

forbidden_scope:
  - 不制作完整关卡，不指定候选墙形、玩家起点、目标难度或 exact version。
  - 不评价审美、唯一性、课程准入或待玩交付。
  - 不修改候选、账本、assignment、experience brief、通用流程或 prototype 代码。
