    human_comment_ref: prototypes/reality_anchor/playtest_reviews.yml#HP_STUDIO_L_1_001
    human_comment_text: >-
      两次利用上方两个黏块作为活塞推动箱黏锚点并最终归位，且两次活塞结构不同，
      整体结构新颖。要素复用度和空间利用率都较高。
    selected_reason: >-
      它直接校准同一组高 affordance 要素在同一关中承担不同但连续的空间职责；
      对 L11 的启发是遮板终点不能退休，后续必须重新读取其具体位置或形状。
    transfer_limit: 只学习要素复用和阶段间关系变化，不固定活塞、归位或重复次数。

  - candidate_id: ICE_CAND_0019
    prototype_id: ice_slide_escape
    candidate_ref: prototypes/ice_slide_escape/design_archive/candidates/ICE_CAND_0019.md
    aesthetic_score: 4
    difficulty_score: 4
    human_comment_ref: prototypes/ice_slide_escape/design_archive/candidates/ICE_CAND_0019.md#HC_ICE_CAND_0019_001
    human_comment_text: >-
      此关作为正例的优化是我直接提出的从原 v3 移除了 [4,1] 的左上 target。
      原版中，第一推 B 到 [4,1] 被 target 是过于自然的直接达成目标，玩家可以不理解其后续价值也顺手执行，因此无有效洞见；
      v4 中这一步不再有即时目标回报，只在后续 A 左推停到 [5,1] 时才显现为必要条件。
      因此该修改把一个显然的开锁步骤转化为延迟生效的隐藏结构，显著增强了第一步的非局部性和回读价值，
      同时没有破坏原关卡扎实的复杂互锁结构和逻辑链，在v4优化后完全可以作为一个后期较高难度关卡备选。
      但需注意此关仍然偏复合锁结构，因几乎每个关键步骤质量都尚可所以被接纳，实际并未有游戏流程末期仍然有效的真正精彩的洞见、
      有趣的局部结构或aha-moment（把一个已经在目标的冰推走在游戏前中期大概是新颖有趣的，但是后期这应该只是轻度亮点了）
    selected_reason: >-
      它校准即时奖励会让关键动作变成顺手开锁，而延迟到后继才解释早期位置选择能产生非局部回读；
      L11 的双重职责应让后继消费遮板终点，而不是在遮蔽发生时就把全部答案明示。
    transfer_limit: 只学习延迟读取与去除顺手奖励；不复制 stopper、目标删除或复合锁规模。

