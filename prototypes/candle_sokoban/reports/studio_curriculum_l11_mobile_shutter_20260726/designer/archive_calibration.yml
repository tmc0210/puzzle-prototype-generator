all_aesthetic_1_records_read:
  - candidate_id: RA_CAND_0024
    prototype_id: reality_anchor
    candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0024.md
    index_aesthetic_score: 1
    index_difficulty_score: 3
    human_comment_ref: prototypes/reality_anchor/playtest_reviews.yml#HP_RA_FRESH_2026_07_08_PULL_BRUSH_RETURN_v4_wall_trim_001
    human_comment_text: >-
      这关是算法指标看不出来的非典型反例。看起来机制利用率高，并且有“右上的目标竟然需要用角落里的锚点而非看起来更显然的箱子达成”这一反转。
      但是这关玩家看到中间的三个黏块、两个可动的锚点，会期待更精彩的切割拼接构造或是长链推动、黏块几何形状利用，但是实际上这关几乎只用到推拉腾挪走位而缺乏玩家洞见。
      黏块可达性用于限制玩家行动本身并不构成问题，但是双锚点可动过于污染读题，导致玩家期待值拉高，最后却只得到一个腾挪关。
      这关作为反例的警示仍然是不要迷信指标和探针，要切实地从玩家角度思考。
    calibration_for_l11: >-
      事件多、对象多或可动性高会抬高玩家期待；移动遮板若没有兑现其可移动空间职责，
      即使烛身灭火事件真实发生，也会成为机制信号高于玩家所得的反例。

  - candidate_id: RA_CAND_0027
    prototype_id: reality_anchor
    candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0027.md
    index_aesthetic_score: 1
    index_difficulty_score: 2
    human_comment_ref: prototypes/reality_anchor/playtest_reviews.yml#HP_RA_FRESH_2026_07_09_VACATE_MATERIAL_LOCK_v4_001
    human_comment_text: >-
      典型反例。affordance极差 1. 推拉锚点能推但解法不需要推 2. 黏块能黏但不需要黏，
      解法触发黏块转化、黏块拼接这些标签，但是完全没有使用任何黏块的几何结构性质。
      因此玩家能看到一堆机制可能性，结果完全没用上，解法远低于预期，留作典型警戒。
    calibration_for_l11: >-
      可移动遮板必须实际移动且使用移动后的具体占格关系；仅让烛身遮蔽标签出现，或把遮板
      降成可被普通挡块替代的物体，不构成其 affordance 的有效兑现。

  - candidate_id: RA_CAND_0030
    prototype_id: reality_anchor
    candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0030.md
    index_aesthetic_score: 1
    index_difficulty_score: 3
    human_comment_ref: prototypes/reality_anchor/playtest_reviews.yml#HP_RA_FRESH_2026_07_12_CUT_REBIND_ORTHOGONAL_v7_001
    human_comment_text: >-
      典型反例。1. 两个锚点作为高affordance要素，在开局几步搬运后只起到被动作用。拼接感明显 2. 黏块腾挪不算差但无亮点。
      通常这不单独构成问题，但是此关地图较大、要素极多。如此高设计成本但没有明显亮点，明显得不偿失。
      3. 开局不归位锚点而先推上方的5个被转化后的普通箱导向的deadend分岔极多且都难以快速验证。
    calibration_for_l11: >-
      移动遮板不能在完成遮蔽后退休为被动障碍；地图规模、对象数与延迟反馈不能代替其后继职责
      与目标保形关系的持续耦合。

  - candidate_id: RA_CAND_0031
    prototype_id: reality_anchor
    candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0031.md
    index_aesthetic_score: 1
    index_difficulty_score: 2
    human_comment_ref: prototypes/reality_anchor/playtest_reviews.yml#HP_RA_FRESH_2026_07_11_TWIN_LOOM_RESECTION_v31_001
    human_comment_text: >-
      典型反例。1. 开局十几步动作是不在之后复用空间或要素、仅有走位和推动箱子开路、无有效的deadend的单行道，拼接感极强（注意和一般性的唯一胜路区分）
      2. 关卡核心仅为显然的三次重复拉动顺序锁，对于如此大量要素、较大的关卡大小，明显得不偿失。
      额外注意，此关的机制看似利用充分，实际上推动锚点、推动、黏块合并、黏块切割全部存在于开局的十几步过场动画中，都是无效使用。
    calibration_for_l11: >-
      强制把遮板送到烛芯处的单行道演出不构成相对难度 5；前置动作必须影响玩家对后续同一关系的选择，
      不能只把 body concealment 事件搬上舞台。

  - candidate_id: RA_CAND_0032
    prototype_id: reality_anchor
    candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0032.md
    index_aesthetic_score: 1
    index_difficulty_score: 3
    human_comment_ref: prototypes/reality_anchor/playtest_reviews.yml#HP_RA_FRESH_2026_07_12_DUAL_ANCHOR_CROSS_RELAY_v4_001
    human_comment_text: >-
      典型反例。开局段落使用到的要素在完成后全部原地退休，和后面的两格黏块拉入目标段割裂感明显。
      关卡声称使用的黏块拼接合并机制的有效使用也全部来自后段拼接的witness。
      务必杜绝此类试图拼接一个无关子关卡以提高机制覆盖面和难度甚至审美的方法。
    calibration_for_l11: >-
      “目标原地保形”和“遮板终点空间职责”必须属于同一任务链；把烛身遮蔽 witness 与普通空间子题
      前后拼接，不能证明两项职责真正耦合。

  - candidate_id: ICE_CAND_0002
    prototype_id: ice_slide_escape
    candidate_ref: prototypes/ice_slide_escape/design_archive/candidates/ICE_CAND_0002.md
    index_aesthetic_score: 1
    index_difficulty_score: 1
    human_comment_ref: prototypes/ice_slide_escape/design_archive/candidates/ICE_CAND_0002.md#HC_001
    human_comment_text: >-
      d5是致命问题而非瑕疵。而且这关完全没有实际的思考量，你声称有一些死路，
      但是这些死路甚至都是绕远路，玩家按直觉看到啥就推啥就能轻松过关，完全没有挑战
    calibration_for_l11: >-
      工具发现 dead commitment 或必经事件不等于玩家需要思考；若看到遮板后直推至唯一位置即可完成，
      所谓死路和绕路不能把它抬到目标难度。

  - candidate_id: ICE_CAND_0004
    prototype_id: ice_slide_escape
    candidate_ref: prototypes/ice_slide_escape/design_archive/candidates/ICE_CAND_0004.md
    index_aesthetic_score: 1
