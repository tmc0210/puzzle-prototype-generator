  - candidate_id: ICE_CAND_0011
    prototype_id: ice_slide_escape
    candidate_ref: prototypes/ice_slide_escape/design_archive/candidates/ICE_CAND_0011.md
    index_aesthetic_score: 1
    index_difficulty_score: 3
    candidate_card_difficulty_score: 2
    source_conflict_note: index 记难度 3，candidate card 记难度 2；审美 1 与人评内容一致，本校准保留差异而不自行裁决。
    human_comment_ref: prototypes/ice_slide_escape/design_archive/candidates/ICE_CAND_0011.md#HC_ICE_CAND_0011_001
    human_comment_text: >-
