calibration_only_player_side_findings:
  - >-
    移动遮板的高 affordance 会主动承诺“可移动性为何必要”；后续候选至少要让玩家感到遮板终点的具体占格
    改变了同一任务链，不能只由工具证明对象参与。
  - >-
    目标原地保形与遮板终点职责必须互相约束：若删掉任一读取，剩余结构不应仍是完整的普通墙灭关或普通挡块关。
  - >-
    目标难度 5 应来自玩家预见遮蔽动作之后的空间读取、在若干局部可行选择中保留正确关系，
    而不是冗余走位、重复遮蔽、长路线、对象堆积或反馈迟缓的 deadend。
  - >-
    body concealment 与 wick reexposed 事件的发生只有机械意义；若玩家没有选择是否、何时、用哪个位置建立遮蔽，
    或遮板移开后的未燃区间没有被主动消费，不能据事件数量声称体验成立。
  - >-
    简单、直白的作品可以成立，但第一次机制应用若同时被指定为课程相对难度 5，至少需要一个早期决定在后继被重新解释；
    “把眼前可动物推到唯一终点”只达到教学或功能库存下界。

