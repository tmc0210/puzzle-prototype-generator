design_brief: >-
  为课程第 11 关制作唯一完整单关候选，目标相对难度 5，允许暴露到
  body_concealment_and_reexposure。玩家第一次主动学习烛身遮蔽：移动 C 的一次选择必须
  同时让燃烛 B 不移动而原地退出、冻结其完整轮廓，并把 C 的终点占格建立为同一任务链的
  后继空间接口；后续分别读取 B 的原位保形与 C 的终点职责。固定墙可复现静态形状不构成
  反例，作品价值来自玩家可选移动的双重结果。不得把遮蔽 witness 与普通挡块子题拼接，
  不要求移开 C；未燃重曝的主动窗口留给 L12。规划给出的停块方向可优先尝试，但若完整
  单关不可行，可在同一 candidate_id 下更换 structure family。难度必须来自早期选择对后继
  关系的预见与回读，不来自重复、冗余走位、对象堆积或延迟 deadend。
