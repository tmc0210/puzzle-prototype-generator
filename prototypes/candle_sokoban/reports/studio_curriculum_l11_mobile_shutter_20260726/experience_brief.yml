prototype_specific_routing:
  - allowed_exposure_through 固定为 body_concealment_and_reexposure。
  - 正式候选固定使用 all_braziers_lit，禁止 event_occurs。
  - exact 必须具有完整非空 replay、complete 可达图、完整解族/旁路/对象参与/身份反事实和 complete/pass exposure audit。
  - 所有可达边必须没有 shrink_ignite 或 rolling_contact_chain 家族的 later-event hit。
  - L11 不要求 C 移开或主动使用未燃重曝窗口；该体验留给 L12。

human_review_constraints:
  - 不能把 C 到位设计成无选择的开场动画或唯一显然操作。
  - 不能用重复遮蔽、冗余走位、对象堆积或延迟 deadend 制造难度。
  - C 到位后不能退休为普通挡块；B 也不能只贡献一次事件标签后退休。
  - 后继必须消费早期移动留下的具体状态并把约束传回，不得把遮蔽 witness 与独立挡块子题拼接。
  - 高事件覆盖、完整图或唯一解只提供机械否决条件，不能补偿缺乏玩家洞见或明确审美缺点。

