experience_core:
  experience_statement: >-
    玩家第一次把另一根蜡烛当作可移动遮板：为保住燃烛 B 的原坐标和完整轮廓，
    选择把两格 C 送到 B 的烛芯处；同一终点不只让 B 原地熄灭，还留下一个必须由后继对象读取的停块格。
    后继的离散停位再让玩家回读：早先选择的不是普通灭火，也不是普通挡块，而是一次同时写入两种必要结果的移动。
  visible_setup: >-
    开局能同时看见需要跨过燃烧边界仍保留完整原轮廓的燃烛 B、可抵达其烛芯的两格遮板 C、
    与 C 终点共列的后继滚动物，以及由正确停位继续完成的目标关系。
  player_action: >-
    玩家必须在边界前主动把 C 移到 B 的烛芯投影，使 B 不移动而退出燃烧；之后保留 C 在终点，
    推动同列后继对象，让它由 C 的邻格取得正确停位，并继续使用 B 保住的原位实体格完成同一胜利链。
  visible_payoff: >-
    C 到位时 B 在原地由燃转未燃且完整轮廓不变；跨界后 B 没有缩短，后继对象又被 C 邻格提前一格截停。
    正确停位与 B 保住的原位格连续参与最终目标，而错误退出方式分别失去其中一种接口。
  why_level_exists: >-
    墙体灭火只能教“把目标移到墙边退出”；本关让玩家发现灭火装置本身可以是可移动空间对象，
    一次位置选择能同时冻结另一对象并构造后继几何。这是烛身遮蔽相对墙灭的首个独立玩家价值。
  core_boundary:
    central_objects:
      - 目标燃烛 B 的原坐标、完整轮廓与边界参与状态
      - 两格可移动遮板 C 的遮芯格与相邻实体格
      - 同一链中读取 C 邻格离散停位的后继对象
      - 同一链中读取 B 原位完整轮廓的后继接口
    supporting_objects:
      - 把核心链闭合到 all_braziers_lit 的火盆
      - 约束操作面、阻止旁路并保持可读性的墙与必要空地
      - 只在确有跨对象职责时使用的额外火源或蜡烛

work_identity:
  conditions:
    - C 必须由玩家从非遮蔽位置移动到 B 的烛芯投影；初态不能静默遮蔽，规范解中 C 到位后不再移开。
    - C 到位必须触发 B 的 extinguish_by_candle_body，且 B 在不改变原坐标的情况下保持完整轮廓跨过至少一个燃烧边界。
    - C 的相邻实体格必须让后继对象取得一个离散且机械必要的停位或操作面；只读取灭火事件不成立。
    - B 保住的原尾格或原端帽格必须在同一胜利链中机械必要；只读取 C 的停块不成立。
    - 玩家在移动 C 前必须存在至少一个局部可行但无法同时保留两项结果的选择，目标难度来自预见后继关系，而非唯一强制动作。
    - 所有胜解都必须保留同一对象职责、目标分配和依赖因果；纯走位差异可以等价。
  counterfactuals:
    - 若让 B 自己贴墙退出，B 可保长但会丢失原坐标，B 原位 consumer 必须失败。
    - 若不让 B 在边界前退出，B 会缩短并丢失原端帽格，B 完整轮廓 consumer 必须失败。
    - 若把 C 缩为只占遮芯格的单格对象，B 仍可原地熄灭，但后继应多走一格并失去正确接口。
    - 若删除 C 终点 consumer，作品退化为普通烛身灭火 witness；若删除 B 原位 consumer，作品退化为普通移动停块题。
    - 若把终态直接预置成固定两格墙与未燃 B，静态形状可以相同，但玩家不再亲自作出一次同时写入两项结果的选择，因此不是同一作品。

level_brief:
  packaging_intent: complete_single_level
  expected_difficulty: 5
  expected_scale: >-
    紧凑中型单关；围绕 B、C 与一个连续 consumer 链组织，避免复刻上游三只诊断探针或堆积无关对象。
  expected_player_load: >-
    玩家需要同时追踪边界前 B 是否退出、B 的原坐标/长度、C 终点的相邻占格及后继对象的离散停位；
    执行本身应稳定，难点是较早选择为何能同时满足稍后的两种读取。

