prototype_context:
  confirmed_rules:
    - 每次合法行动先完成走动、轴推或侧滚，再结算遮蔽灭火与递归点火，随后推进共享五拍倒计时。
    - 燃烧边界只缩短当时仍点燃的蜡烛；已由墙或烛身遮蔽而熄灭的蜡烛避开该次缩短。
    - 另一根蜡烛的实体烛身可以遮住已燃烛芯并使其熄灭；被遮目标不需要移动。
    - 遮体移开后目标烛芯重曝但保持未燃；本关不要求移开遮体或主动使用重曝窗口。
    - 侧滚的移动距离不改变行动成本；无效输入不是 runtime edge，也不推进倒计时。
  win_condition: all_braziers_lit；玩家存活且完整回合结算后全部火盆点亮。
  object_and_event_semantics:
    - 多格蜡烛是刚性可轴推、可侧滚实体；cap 外一格是非实体烛芯投影。
    - 两格移动遮板 C 的一个实体格可占住 B 的烛芯投影，另一个实体格仍可承担碰撞或操作面职责。
    - extinguish_by_candle_body 只证明烛身遮芯事件发生，不证明玩家选择、对象双职责或作品质量。
    - wick_reexposed_unlit 属于当前允许家族，但作品身份不要求 C 在规范解中移开。
  allowed_mechanisms:
    - basic_candle_manipulation
    - wall_dousing
    - shared_fire_and_reignition
    - body_concealment_and_reexposure
  tool_boundary:
    - Candle runtime adapter、ASCII parser/renderer、solver、完整图、layout analyzer、try-inputs 与 exposure audit 已实现。
    - 正式证据只接受 Candle runtime；不得用其它原型的 PuzzleScript 结果替代。
    - Candle 专属 miner、candidate factory 与 PuzzleScript exporter/checker 未实现。
    - exact 的 later-event 缺席只在 exposure audit graph.status=complete、verdict=pass、forbidden_hits 为空时成立。

