    - 已会用墙体灭火让对象退出燃烧集合，并能用火盆或烛芯使对象复燃。
    - 已做过边界保长、错峰退出、有限火源窗口和暂停—恢复参与史。
    - 尚不知道烛身可以遮芯灭火，也不知道遮体移开后烛芯保持未燃。
