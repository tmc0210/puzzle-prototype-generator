experience_seed:
  human_seed: >-
    课程 L11 首次主动学习烛身遮蔽：玩家移动两格遮板 C，使燃烛 B 不平移而原地退出、
    冻结完整轮廓；C 的同一终点还必须建立同一任务链的后继空间接口，后续分别读取
    B 的原位保形与 C 的终点占格。固定墙可复现静态形状不是反例，价值来自可选移动的双重结果。

