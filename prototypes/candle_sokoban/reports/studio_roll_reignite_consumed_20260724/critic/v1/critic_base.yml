review_attempt_id: CANDLE_ROLL_REIGNITE_V1_CRITIC_001
prototype_id: candle_sokoban
prototype_rules:
  confirmed_rules:
    - 成功行动推进固定为 5 的全局燃烧倒计时；无效输入不推进倒计时。
    - 沿蜡烛长轴只能推动一格；从侧面推动会完整滚动至下一实体步被阻挡。
    - 多格滚动只消耗一个行动，但每个滚动小步都会先结算遮芯灭火，再递归结算已知火源点火与点盆。
    - 燃烧边界让所有此刻仍点燃的蜡烛同时从烛芯端缩短一格；单格蜡烛会燃尽消失。
    - 玩家进入外露火焰会死亡；死亡结算后才检查胜利。
  win_condition: 玩家存活，并在完整回合结算后点亮全部火盆（all_braziers_lit）。
  object_and_event_semantics:
    - 多格蜡烛是刚体；烛芯方向外一格是非实体火焰投影，蜡烛大小写表示是否点燃。
    - 墙可遮住已燃烛芯并立即触发 extinguish_by_wall；烛芯重新外露不会自行复燃。
    - 已点亮火盆是永久火源；外露烛芯在同格接触该火源时可触发 ignite_from_brazier。
    - roll_reignite_after_extinguish 只表示同一次滚动内先灭后燃真实发生，不证明它必经、被后继使用或具有难度。
    - 正式候选不得使用 event_occurs 胜利条件。
  player_prior:
    - 玩家已掌握 roll_intermediate_extinguish 及之前的全部 Candle 机制。
    - 玩家已掌握这些机制衍生的技巧和计算，具有全图视野、正常几何直觉与稳定操作能力。
