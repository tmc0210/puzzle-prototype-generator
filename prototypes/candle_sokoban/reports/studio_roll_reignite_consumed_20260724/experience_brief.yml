prototype_context:
  confirmed_rules:
    - 成功行动推进固定为 5 的全局燃烧倒计时；无效输入不推进倒计时。
    - 沿蜡烛长轴只能推动一格；从侧面推动会完整滚动至下一实体步被阻挡。
    - 多格滚动只消耗一个行动，但每个滚动小步都会先结算遮芯灭火，再递归结算已知火源点火与点盆。
    - 燃烧边界让所有此刻仍点燃的蜡烛同时从烛芯端缩短一格；单格蜡烛会燃尽消失。
    - 玩家进入外露火焰会死亡；死亡结算后才检查胜利。
  win_condition: 玩家存活，并在完整回合结算后点亮全部火盆（all_braziers_lit）。
  object_and_event_semantics:
    - 多格蜡烛是刚体；烛芯方向外一格是非实体火焰投影，蜡烛大小写表示是否点燃。
    - 墙可遮住已燃烛芯并立即触发 extinguish_by_wall；烛芯重新外露不会自行复燃。
    - 已点亮火盆是永久火源；外露烛芯在同格接触该火源时可触发 ignite_from_brazier。
    - roll_reignite_after_extinguish 只表示同一次滚动内先灭后燃真实发生，不证明它必经、被后继使用或具有难度。
    - 正式候选不得使用 event_occurs 胜利条件。
  allowed_mechanisms:
    - global_countdown
    - axis_push
    - flame_lights_brazier
    - exposed_flame_danger
    - candle_shrink
    - wall_extinguish
    - countdown_without_fire
    - wick_reexposed_unlit
    - candle_burn_out
    - side_roll
    - multi_cell_roll_one_turn
    - ignite_from_brazier
    - ignite_from_wick
    - candle_body_extinguish
    - simultaneous_burn
    - midcycle_ignition
    - boundary_extinguish_avoids_burn
    - boundary_ignite_participates
    - roll_intermediate_lights_brazier
    - roll_intermediate_ignition
    - roll_intermediate_extinguish
    - roll_reignite_after_extinguish
  tool_boundary:
    - 已实现 runtime adapter、ASCII parser/renderer、solver、完整图枚举、layout analyzer、诊断 probe、exposure audit 与 runtime-backed playable。
    - Candle 专属 miner、candidate factory 与 PuzzleScript exporter/checker 未实现，不得用其它原型结果替代 Candle runtime 证据。
    - 后续 exact 必须以当前布局的非空 replay、完整解族/可达图与 exposure audit 支撑；graph exhausted 不能当作 complete。

player_context:
  basic_sokoban_experience_assumed: true
  player_prior:
    - 玩家已掌握 roll_intermediate_extinguish 及之前的全部 Candle 机制。
    - 玩家已掌握这些机制衍生的技巧和计算，具有全图视野、正常几何直觉与稳定操作能力。
  prerequisite_mechanisms:
    - side_roll
    - multi_cell_roll_one_turn
    - wall_extinguish
    - wick_reexposed_unlit
    - ignite_from_brazier
    - candle_shrink
    - exposed_flame_danger
    - roll_intermediate_extinguish
  known_prior_level_refs: []

experience_seed:
  human_seed: >-
    玩家必须规划一次多格滚动，使同一根蜡烛在滚动途中先被墙熄灭、再从已知火源重新点燃，
    并在滚动结束后继续消费这个结果才能获胜；同次滚动中的熄灭后复燃不能只是自动 witness
    或一次性动画。

