experience_core:
  experience_statement: >-
    玩家从滚后必经的退焰火门槛倒推一次侧滚：同一根已燃多格蜡烛必须在一个输入中先让烛芯
    被墙熄灭，再经过玩家预先可知的火源复燃，并以正确终点、点燃状态与倒计时关系停下。
    滚动不是高潮后的自动动画；玩家随后还必须利用或解除这个终点点燃状态生成的退焰火门槛，
    才能取得最终操作位并点亮全部火盆。
  visible_setup: >-
    全图让玩家同时看见核心多格蜡烛、滚动路径中的遮芯墙、墙后已知火源、决定终点的止挡，
    以及滚后门位与最终火盆或其必要操作侧之间的关系；不依赖隐藏信息或操作失误制造谜题。
  player_action: >-
    玩家先从后继门位需要的终点、火态与节拍反推滚动路径和站位，再亲自执行一次多格侧滚，
    观察同一烛芯在滚动中先灭后燃；滚后继续管理站位与燃烧边界，主动处理复燃留下的火门槛，
    而不是让事件发生后直接胜利。
  visible_payoff: >-
    同一次滚动中，蜡烛火焰在墙位可见熄灭、在已知火源处重新点燃并继续滚动；终点仍点燃的
    蜡烛到燃烧边界后从烛芯端缩短，原实体门格虽腾空却被退焰投影覆盖。玩家此前对终点和节拍的
    规划由这个从实体阻挡转为致命火格的变化兑现，并在后继解法中被真正消费。
  why_level_exists: >-
    这关把玩家已掌握的“滚动途中会熄灭”推进为一个新的规划关系：墙熄不是失败结论，玩家可在
    同次不可中断的滚动中借已知火源恢复火焰；恢复后的状态又立刻成为后继必须预见和处理的约束。
    它展示的是跨越滚动内部事件与滚后局面的双层计划，不是新事件的 witness。
  core_boundary:
    central_objects:
      - 同一根在关键滚动开始前已点燃的多格蜡烛
      - 滚动中先于火源接触烛芯投影的遮芯墙
      - 滚动中位于墙后的已知且已点亮火源
      - 让核心蜡烛落到特定门位的终点止挡
      - 核心蜡烛的终点点燃状态、燃烧边界缩短与退焰投影
      - 必须读取并处理该退焰门槛的后继操作位或通路
    supporting_objects:
      - 承担 all_braziers_lit 正常胜利反馈的火盆
      - 只用于建立必要站位、滚动终点与短收束的墙和地面
      - 仅在不抢走核心时用于节拍或点火关系的最少支持对象

work_identity:
  conditions:
    - 核心蜡烛在关键滚动开始前必须点燃，且墙熄、从已知火源复燃、继续滚动和到达终点发生在同一个输入内。
    - 遮芯墙必须先于已知火源出现在同一烛芯的滚动轨迹上；玩家必须通过火源克服墙熄造成的终点失火风险。
    - 已知火源在关键滚动前已可被玩家确认，不得由同一滚动中的偶然事件临时生成而替代规划。
    - 核心蜡烛滚动后必须以点燃状态停在一个对后继有具体责任的终点；事件发生本身不得立即满足胜利。
    - 后继必须消费核心蜡烛的终点点燃状态及其位置或节拍后果，并把约束传回滚动前的终点、站位或时机选择。
    - 删除后继后，原本需要区分的滚动终点或火态必须重新等价；否则后继只是附加子题。
    - 所有允许胜解都必须由同一根核心蜡烛承担同次墙熄—复燃与滚后消费责任，不能由另一火源或无关段落代替。
    - 高潮后只保留兑现该消费与完成 all_braziers_lit 所需的短收束，不追加清理劳动。
  counterfactuals:
    - id: remove_wall_extinguish
      result: >-
        删除或绕开遮芯墙后，蜡烛无需克服途中熄灭即可保持终点点燃；已知火源不再承担“恢复失去的火”责任，
        即使后继火门槛仍可能相同，也已不是本关体验。
    - id: remove_or_unlight_known_source
      result: >-
        删除、熄灭或让火源不可在墙后接触烛芯时，核心蜡烛滚后保持熄灭，不发生预期缩短并继续实体堵门；
        后继关系不能按作品身份完成。
    - id: split_reignition_into_another_action
      result: >-
        若墙熄与复燃分属两次滚动或另一次行动，玩家不再规划不可中断滚动内部的先灭后燃顺序，作品身份消失。
    - id: remove_endpoint_stop
      result: >-
        若终点止挡被删除或失职，蜡烛滚离指定门位，后继格退化为普通安全空路，滚动终点不再被消费。
    - id: remove_post_roll_consumer
      result: >-
        若滚后门位、必要操作侧或最终通路不再读取点燃结果，墙熄—复燃只剩事件 witness 或一次性动画，
        不能构成完整关卡。
    - id: allow_always_lit_or_other_object_bypass
      result: >-
        若玩家可让核心蜡烛始终点燃、换另一对象提供同一后继效果，或从别路取得最终操作位，
        同次墙熄—复燃不再是作品的玩家责任。
    - id: replace_consumer_with_unrelated_endgame
      result: >-
        若后段只是独立点盆、搬运或计时题而不改变滚动前选择，它是拼接子题，不能作为滚后消费。

level_brief:
  packaging_intent: complete_single_level
  expected_difficulty: 4
  expected_scale: >-
    紧凑至中等；围绕一根核心蜡烛、一处墙熄—已知火源复燃轨迹、一个终点止挡和一个滚后
    consumer 建立完整单关，只加入使选择、回报与正常胜利成立所需的最少支持结构。
  expected_player_load: >-
    在已掌握前序规则的前提下，难点来自两层相互传递的计划：先由后继门位反推正确终点、火态与
    倒计时，再计算一次不可中断滚动内墙熄—复燃的接触顺序。至少要有多个局部看似可行的滚动或
    节拍选择，只有预见后继消费才能剪除；不得用长走位、重复动作、额外对象或反馈迟缓 deadend
    冒充难度 4。

