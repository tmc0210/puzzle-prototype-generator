prototype_specific_routing:
  - allowed_exposure_through 固定为 roll_reignite_after_extinguish；该分支之后没有更晚事件。
  - 正式候选只使用 all_braziers_lit；event_occurs 禁止。
  - 每个未来 exact 必须重跑 Candle exposure audit，且 graph.status=complete、verdict=pass、forbidden_hits 为空。
  - 任何布局、胜利条件或核心机制关系变化都会使旧 replay、graph、exposure 与 review 失效。
  - 当前阶段不建立 candidate_id、不画布局、不发布 exact；后续只允许 Controller 建立的唯一 candidate_id。

human_review_constraints:
  - 目标难度固定为 4，最低不得低于 4；当前没有 Candle 阶段内 clean archive，不能借用其它原型 difficulty_score 校准。
  - 玩家已掌握 roll_intermediate_extinguish 及之前机制；识别旧规则、基本走位、唯一显然操作与执行负担不计作难度。
  - 事件出现、完整图、唯一解或 Designer 叙事只能约束硬事实，不能证明关卡有趣或值得待玩。
  - 从玩家侧拒绝未兑现 affordance、单行道机制演出、开局对象退休、割裂后段、高潮后清理与路线税。
  - 首批材料只证明局部生成器；未来候选必须另行证明安全可解、后继真实消费、解族唯一性与作品身份在全部允许胜解中成立。

