cross_stage_aesthetic_calibration:
  positive_direction:
    - >-
      关键状态应由玩家主动规划和制造，并被后继局面真实消费；后继必须改变玩家对较早动作的
      理解，而不是在高潮后另起任务。
    - >-
      同一核心对象或关系可以多次承担责任，但每次应有结构差异、因果传递或归位兑现，不能只是
      重复操作。
    - >-
      可见回报、紧凑空间和因果集中度比事件数量、地图规模、原始步骤数更接近人类认可的亮点。
    - >-
      反直觉操作成立的前提是它解决开局可见矛盾，并在短因果链中得到明确回报。
  rejection_boundary:
    - >-
      只让 roll_reignite_after_extinguish 事件发生、只让同一次滚动播放熄灭再点燃过程，或只在
      终点保留点燃状态，都不能单独证明玩家体验成立。
    - >-
      如果高 affordance 的蜡烛、火源、墙口或火盆只用于一次 witness，随后退休或与末段割裂，
      应视为机制信号过度承诺或拼接风险。
    - >-
      若前序只是无有效选择的操作动画，后继只是重复推行或清理劳动，即使 canonical replay
      非空、事件齐全，也不构成完整单关包装。
    - >-
      不得用更长走位、更多蜡烛、更多火盆、更多反馈迟缓 deadend 或倒计时执行负担代替目标
      难度 4 所需的非显然玩家关系。

