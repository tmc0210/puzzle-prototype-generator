    aesthetic_score_from_human_comment: 5
    relevance: >-
      玩家主动构造稍后反复使用的 L 形关系；前段构造不抢戏，终局双目标给出适量提示并消费
      该结构。可校准“准备—主动构造—后继兑现”属于同一体验，而非附加段落。
