candidate_id: CANDLE_ROLL_REIGNITE_CONSUMED_001
target_difficulty: 4
structure_proposition: >-
  三格核心蜡烛第一次向下滚动时，左烛芯依次经过遮芯墙、既燃火盆和独占目标，再由下一行
  的实体止挡停在门位；同次先灭后燃使它在燃烧边界缩短，原左端实体格成为致命退焰门。
  玩家不能绕过这道门去取得下方操作侧，而要先从上方滚动缩短后的两格 candle：新烛芯点亮
  下方止挡火盆，随后在更低的墙位熄灭并停下，因此旧退焰门真正消失。玩家穿过刚清出的门，
  绕到同一 candle 下方，再向上滚动；它从刚才点亮的火盆复燃，并沿回程点亮剩余目标获胜。
player_reasoning_load:
  - 从最终向上滚动的操作侧反推：必须先让旧退焰门消失，才能进入 candle 下方。
  - 从下方新火盆反推第二次滚动既要移动核心 candle、又要为回程复燃留下已知火源。
  - 从首次终点与五拍边界反推三格 candle 必须在同一次滚动中先墙熄、后复燃并保持点燃。
  - 区分能触发首次滚动的局部站位、能在边界时到达第二操作侧的节拍，以及真正可完成回程的状态。
non_difficulty_sources:
  - 纯走位与输入执行不计作难度。
  - 不以重复动作、长路线、额外对象或反馈迟缓 deadend 增难。
revision_trigger: >-
  若 solver 显示不经同次墙熄—复燃即可获胜、玩家无需穿过旧退焰门即可取得下方操作侧、
  下方火盆不承担回程复燃责任，或玩家侧仍只剩单行道演出，则继续重构而不是局部补墙。
