design_brief: >-
  使用已完成的归档校准和首批 runtime-backed task-local 材料，围绕人类种子固定
  玩家可感的体验核心与可证伪作品身份：同一根蜡烛在一次多格滚动中先被墙熄灭、
  再从已知火源重新点燃，且滚动终点留下的结果必须由后继关系继续消费才能获胜。
  目标难度为 4，最低不得低于 4；不能把事件 witness、自动动画或单次操作本身当作完整体验。
  本阶段只完成 experience_brief，不画正式候选布局。
