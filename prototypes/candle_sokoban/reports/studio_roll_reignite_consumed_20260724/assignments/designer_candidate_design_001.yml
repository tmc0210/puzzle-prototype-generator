design_brief: >-
  在同一连续 Design Studio 工作台中制作唯一完整单关。目标难度固定为 4；玩家已掌握
  roll_intermediate_extinguish 及以前全部机制、技巧和计算。本关必须让玩家主动规划同一根
  多格蜡烛的一次多格滚动：途中先被墙熄灭、再从预先可知的火源复燃；滚动结束后的
  点燃状态、节拍、位置或操作关系必须被后继继续消费，且玩家不这样规划就不能以
  all_braziers_lit 获胜。避免自动 witness、一次性动画、无关子题拼接和纯腾挪增难。
