mechanical_claims:
  - claim_id: normal_win_and_replay
    claim: 17 步 canonical replay 全部合法，并在完整回合结算后玩家存活且 all_braziers_lit。
  - claim_id: exposure_gate
    claim: >-
      v1 对 allowed_exposure_through=roll_reignite_after_extinguish 的 exposure audit 为 complete/pass，
      layout 与 sequence digest 匹配，forbidden_hits 为空，raw graph 完整保存。
  - claim_id: same_roll_same_object_reignite
    claim: >-
      首次关键滚动中同一 candle#1 先在 d1 产生 extinguish_by_wall 与 roll_intermediate_extinguish，
      再在 d2 从已点亮火盆产生 ignite_from_brazier、roll_intermediate_ignite 与
      roll_reignite_after_extinguish；这些事件属于同一输入且滚动继续到终点。
  - claim_id: post_roll_consumption_all_wins
    claim: >-
      完整 first-win product graph 的全部首次胜利 product states 都含复燃后的 shrink、第二滚动点亮下盆并墙熄、
      玩家穿过旧退焰门取得 candle 下方操作侧、再由下盆复燃向上滚并点亮顶部终盆的有序历史。
  - claim_id: single_milestone_family
    claim: >-
      完整 first-win product graph 的 5 个 winning product states 只有一个 11 项里程碑签名；
      已列出的 6 条最短 raw inputs 仅交换独立走位，保持对象职责、目标分配与依赖因果。
  - claim_id: identity_counterfactuals
    claim: >-
      删除左列独占盆会产生不含首次墙熄—复燃的胜态；删除顶部 consumer 会在第 8 步提前胜；
      删除第二遮芯墙或承担下盆/止挡/复燃三责的火盆会使关卡无胜。

