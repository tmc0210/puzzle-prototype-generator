  player_experience: >-
    玩家把同一根三格蜡烛对齐后，规划一次多格下滚，使它在 d1 被墙熄灭、d2 从已知火盆复燃；
    复燃使蜡烛在燃烧边界缩短并形成退焰门。玩家随后必须用缩短后的同一蜡烛点亮下方火盆、
    再次被墙熄并清掉门，穿门取得下方操作侧，最后借刚点亮的火盆向上复燃并点亮顶部终盆。
  known_risks:
    - 中后段绕到下方操作侧的走位相对较长，洞见密度低于三次滚动本身；Critic 判断它仍承担必要空间关系。
    - Candle 当前没有带人类分数的阶段内前序样本；Critic只能确认它不明显低于目标 4，实际难度仍需人类试玩标定。
    - allowed_exposure_through 是当前暴露序列最后一个 branch，因此 exposure 的 forbidden branch 集为空；完整图仍支持 current exact 的复燃与消费声明。
