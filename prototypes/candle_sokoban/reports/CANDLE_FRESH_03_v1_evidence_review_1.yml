review_iteration: 1
candidate_version_reviewed: v1
review_input_type: candidate_version
verdict: supports_claim
review_loop_state: proposal_ready
required_action: none
supported_claims:
  - target_ref: solution_uniqueness
    evidence_basis: >
      result 为模板允许的合法值 equivalent_variants_only。CANDLE_FRESH_03_SHORTEST_AUDIT.json
      与对应审计脚本明确把搜索范围限定为完整枚举最短深度 26，并报告
      1,050,560 条最短输入序列、1 个忽略 walk/countdown 后的完整非走路事件签名；
      候选包的 scope_note 同样只声明最短解等价性，没有扩张为所有非最短胜路唯一，
      因而与完整图中的 5 个胜利状态及分支汇合事实不冲突。
  - target_ref: mechanism_scope.required_winning_path_events
    evidence_basis: >
      CANDLE_FRESH_03_REQUIRED_EVENTS_AUDIT.json 和对应审计脚本逐字使用六个候选事件：
      shrink_ignite:candle#2、shrink_ignite:candle#3、shrink_ignite:candle#4、
      light_brazier:8,5、light_brazier:1,4、light_brazier:1,7。审计在
      100000 状态预算内以 complete 结束，探索 5756 个非覆盖状态，未找到缺少任一
      必需事件的胜路；因此支持“六个事件均在所有胜路上必经”，但不推出固定顺序
      或固定出现次数。
  - target_ref: mechanic_exposure_context.latest_exposure_timing_check
    evidence_basis: >
      mechanic_window 的最后一个含 new_events 的阶段是
      final_height_change_and_completion，其中候选声明且由 all-solution required gate
      支持的末端事件是 light_brazier:1,7。规范最短轨迹的全部 occurrence 复核结果
      只有 step 26 一次；该步输入 left，事件序列包含三次 candle#4 roll_step、
      light_brazier:1,7、roll_candle、countdown 与 win。step 26 精确落在 OP6，
      OP6 只支持 RU3；RU3 是第三个 reasoning unit。因此 OP6/RU3 映射成立，
      且该事件确实位于第二个及以后 reasoning phase，later_phase_present 成立，
      不属于 required_but_frontloaded。
  - target_ref: mechanic_exposure_context.claimed_core_events
    evidence_basis: >
      level_analysis 的规范 26 步轨迹分别在 step 5、10、15 记录三次
      shrink_ignite，在 step 10、19、26 记录三个坐标化 light_brazier；坐标、对象
      身份和候选包 target_events 完全一致。required-events 完整门进一步证明这些
      event instances 在每条胜路上必经。
  - target_ref: player_reasoning.reasoning_units.RU1
    evidence_basis: >
      levels.yml 的实体布局与初始状态显示 candle#single5 占据 candle#2 向右侧滚的
      实体路径；规范 step 5 同时记录 burn_out:candle#single5、
      shrink:candle#1:len3 和 shrink_ignite:candle#2，step 10 的右滚随后点亮
      8,5 并触发 shrink_ignite:candle#3。这支持“先解除实体锁并点燃，再运输第一根
      子烛”的机械链。
  - target_ref: player_reasoning.reasoning_units.RU2.alternative
    evidence_basis: >
      replayed_attempt 提供 15 个非空 exact_inputs，全部执行且均合法。第 15 步
      left 的滚动在第一小步记录 extinguish:candle#3:concealed，最终 candle#3
      位于左侧但 lit=0；finalState 的 B 字段为 1,4:0、8,5:1、1,7:0，
      因而左上火盆确实未亮且状态未胜利。该回合边界只触发母烛和其他蜡烛缩短以及
      shrink_ignite:candle#4，没有重新点燃 candle#3。
  - target_ref: player_reasoning.reasoning_units.RU2
    evidence_basis: >
      权威遮蔽规则规定滚动每小步即时灭火；规范轨迹先在 step 15 让 candle#3
      shrink 至 len2，使朝下火焰从第 5 行上移到第 4 行，再于 step 19 左滚并记录
      light_brazier:1,4。结合上述精确失败回放，候选对“立即左滚会被母烛遮火，
      先缩短一次后才运输”的机械说明成立。
  - target_ref: player_reasoning.reasoning_units.RU3
    evidence_basis: >
      levels.yml 与规范快照符合权威朝上烛芯语义：candle#4 在 step 15 点燃后，
      step 20 缩短至 len3，step 25 再缩短至 len2；火焰随每次从上端缩短向下退一格。
      step 25 后火焰与左下火盆同处第 7 行，step 26 左滚记录
      light_brazier:1,7 与 win_all_braziers_lit，支持两次高度变化后完成目标的声明。
  - target_ref: player_reasoning.operation_segments
    evidence_basis: >
      OP1 至 OP6 的 exact_inputs 按 step_range 依次拼接为规范 solver 的全部 26 个
      输入：1-5、6-10、11-15、16-19、20-25、26。范围连续、互不重叠，
      覆盖 step 1-26，无 uncovered 或 overlapping step；各段目的也分别与该范围
      内实际的边界、缩短、滚动和点火事件一致。
  - target_ref: player_reasoning.resolution
    evidence_basis: >
      规范 step 26 的完整回合结算后，三个火盆均为已点亮，事件包含
      light_brazier:1,7 和 win_all_braziers_lit，玩家未死亡；这与权威“玩家存活且
      全部火盆点亮”胜利条件一致。
  - target_ref: evidence.reachable_event_exposure
    evidence_basis: >
      level_analysis 报告 graph status=complete、reachableStateCount=5761、
      legalTransitionCount=17940、winStateCount=5，预算为 100000 且未耗尽。
      因而候选可以把这些数值作为完整可达图的机械事实；候选没有把 SCC/分支事实
      用作审美、难度或多种核心解法的结论。
  - target_ref: evidence.graph_or_counterfactual_evidence.no_candle_movement
    evidence_basis: >
      level_analysis 的既有反事实记录 model=no_candle_movement、
      solvable=false、exploredStates=603、searchStatus=complete。该证据只支持
      “禁止蜡烛移动时不可解”这一反事实模型内的必要性，不证明某根具体蜡烛、
      某次具体移动或候选整体质量；候选的表述保持在此边界内。
unsupported_or_overclaimed: []
evidence_limits:
  - >
    required-events 完整门证明六个 event instances 在每条胜路中至少出现一次，
    不证明所有胜路采用规范轨迹的严格事件顺序，也不证明每个事件只出现一次。
  - >
    equivalent_variants_only 仅由完整最短深度审计支持：它说明所有 26 步最短输入
    序列归一为一个非走路事件签名，不是所有非最短胜路、所有玩家操作或完整图上的
    全局唯一解声明。
  - >
    complete graph 支持 5761 个可达状态、17940 条合法转移和 5 个胜利状态等机械
    事实；没有玩家侧解释时，SCC/branching_win_dag 的 verdict_effect 必须保持 none，
    不能据此评价好玩、自然、难度、审美或 campaign 位置。
  - >
    no_candle_movement 反事实只覆盖“所有蜡烛均不可移动”的模型，不能升级为
    per-object necessity，也不能证明每一个规范 operation 都逐一必要。
  - >
    canonical trace 中 light_brazier:1,7 只有 step 26 这一次 occurrence；该结论是
    规范最短轨迹事实，不应外推为所有胜路中的唯一 occurrence。
  - >
    本审查只确认候选包设计说明的机械前提、事件范围与证据对齐；不评价审美、
    好玩程度、人类感知难度、推理价值或正式 campaign placement。
questions_for_designer: []
