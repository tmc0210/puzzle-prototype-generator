candidate_id: CANDLE_FRESH_03_RECEDING_FLAME_RELAY
working_title: 退焰三渡
status: pre_layout_reasoning
target_difficulty: highest_available
global_burn_cycle: 5

lineage:
  policy: fresh_required
  authorized_archive_variant_work: false
  archive_taste_context: none_found
  note: >
    本轮不以既有关卡布局、求解路线或归档候选为起点；只使用权威蜡烛规则，
    尝试“同一根退焰母烛在不同燃烧边界依次释放多根子烛”的新因果链。

player_goal:
  visible_goal: 点亮三个彼此分离的火盆并存活
  intended_understanding: >
    开局点燃的横向母烛会每五个有效行动从烛芯端缩短；它的三个烛身格分别
    遮住三根未点燃竖烛的朝上烛芯。母烛退焰时依次腾出这些格，并在同回合
    点燃刚暴露的子烛。第二根子烛若立即左滚会穿过母烛火道并熄灭，必须等
    自身缩短后让火焰上移；第三根则要等两次缩短让火焰下降。玩家必须把三次
    释放看成一条有节拍的运输计划，而不是等全部蜡烛点燃后再处理。

player_problem:
  central_question: >
    怎样在固定五拍的三个燃烧窗口中安排走位和侧滚，使较早点燃、也更早缩短
    的子烛及时离开交叉区并点亮自己的火盆，同时不堵死后续子烛？
  why_not_execution: >
    玩家开局能看到全部对象，却不能立即操作尚被母烛压住烛芯的子烛；每次
    等待既释放下一根子烛，也消耗已经点燃子烛的长度。局部上“先滚最近的”
    可能点亮一个火盆，却可能把玩家或烛身留在下一根子烛的必经侧面。

visible_premises:
  - 母烛开局点燃，长度至少三格，烛芯端朝向其连续遮挡的三个子烛烛芯格
  - 三根子烛开局未点燃、纵向放置、烛芯朝上，且长度或滚动终点不同
  - 第一根子烛右侧有一格开局点燃的实体锁烛，在第一个边界燃尽前阻止提前侧滚
  - 三个火盆分处不同方向，不能由同一次直线滚动全部扫过
  - 全局倒计时固定从 5 开始；所有已经点燃的蜡烛在边界同步缩短
  - 交叉区应让错误的过早侧滚产生可见阻塞，但不依赖隐藏规则或无效输入耗时

expected_conclusions:
  - 第一个五拍边界不是纯等待点，而是第一根子烛的释放时刻
  - 第一根子烛必须在第二根释放前完成至少一次有意义的搬运或让位
  - 第二根不能在释放后立即穿越母烛，必须先缩短一次避开遮挡行
  - 第三根必须保留到第二次缩短后，才能把火焰送到最低目标行
  - 最后一个核心事件应晚于第二个推理阶段出现，不能把全部机制展示压在开局

intended_mechanic_sequence:
  - 用安全走位把倒计时推进到第一个边界，母烛缩短并 shrink_ignite 第一根子烛
  - 同一边界让一次性锁烛燃尽，解除第一根子烛的横滚实体阻挡
  - 侧滚或长轴推动第一根子烛，使其点亮目标并退出后续释放通道
  - 在第二个边界由母烛退焰点燃第二根子烛，同时第一根同步缩短
  - 等到第三个边界让第二根的火焰上移一行并点燃第三根，再将第二根滚向左上目标
  - 保留第三根到第五个边界，让其火焰下降两行，再滚向左下目标

reasoning_units:
  - id: RU1
    question: 为什么母烛下方的三根子烛开局都不着火，倒计时归零后却会逐根点燃？
    expected_answer: 母烛烛身遮住子烛烛芯；退焰只在刚腾出的格内传火，所以释放有严格节拍
    feedback: 第一次 shrink_ignite 明确揭示遮挡与退焰传火
  - id: RU2
    question: 第二根子烛点燃后，为什么不能像第一根一样立即滚向自己的火盆？
    expected_answer: 它朝下的火焰与母烛同处一行，左滚途中会被母烛烛身遮挡并熄灭
    alternative_to_test: 在第二次燃烧边界后立即把第二根子烛向左滚
    feedback: 回放应出现 extinguish 且目标保持未点亮；再等一次缩短后火焰上移才绕开母烛
  - id: RU3
    question: 怎样保留第三根子烛的操作侧和最后一个火盆的直线接触路线？
    expected_answer: 第二根滚走后赶到第三根右侧，并让第三根再经历两个边界才横滚
    feedback: 第一次缩短仍够不到最低火盆，第二次缩短才把火焰降到目标行

tool_questions:
  - 是否存在可解布局，且规范解至少跨越三个全局燃烧边界
  - 禁用蜡烛移动、缩短传火或任一子烛参与后是否均不可解
  - 是否存在一根子烛替代另一根子烛点亮目标的角色替换绕路
  - 是否存在等全部子烛释放后再统一处理的旁路
  - 是否仍能在第一个边界前滚动第一根子烛、用母烛外露火焰途中点燃它
  - 完整状态图能否证明每条胜路都包含三次指定 shrink_ignite 与三个目标点火
  - 最短解是否只有等价走位变体，而没有不同的核心事件顺序

discard_conditions:
  - 三个目标可由同一根子烛一扫而过
  - 玩家只需原地绕圈等待三个边界，再按任意次序滚动
  - 母烛或任一子烛可以直接替代另一对象完成其目标
  - 关键失败路线只表现为多走几步，不改变局面能力
  - 最新核心机制事件仍集中在第一个推理阶段
