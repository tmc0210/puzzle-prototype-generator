candidate_id: CANDLE_FRESH_06_RETURNING_FLAME_COLUMNS
working_title: 回焰错列
status: pre_layout_reasoning
target_difficulty: highest_available_human_pending
global_burn_cycle: 5

lineage:
  policy: fresh_required
  authorized_archive_variant_work: false
  archive_taste_context: none_found
  note: >
    不使用上廊燃尽锁、母烛连续释放、长度阶梯逐盆点亮或主烛熄灭后反向运输作为
    主链。新设计以同一根横烛在同一条竖向滚道内三次往返为核心；缩短改变火焰列，
    轴推又主动改列，使每次侧滚遇到的火源、目标、遮挡和接力烛都不同。

player_goal:
  visible_goal: 点亮四个分处三条火焰列的火盆
  intended_understanding: >
    横烛 A 第一次向上滚后必须保持点燃并在首边界缩短，使烛芯列左移一格；
    第二次向下滚使用新列，途中从稳定火盆取火、点亮第二目标，再由墙遮熄，
    因而不会在后续绕行时继续缩短。玩家随后把未燃 A 沿长轴右推两格，主动把
    下一次火焰列移到右侧。第三次向上滚时，A 先从稳定火盆取火，再点燃竖烛 B，
    随即被 B 烛身遮熄，之后从上层稳定火盆重燃并点亮第三目标。若该动作落在
    归零边界，B 会立即缩成最终火盆所需的火焰高度；玩家再从左侧把 B 向右滚动收尾。

player_problem:
  central_question: >
    如何把“燃烧缩短造成的被动左移”和“轴推造成的主动右移”组合成三条不同火焰列，
    并让第三次滚动中的两次点火与一次灭火恰好选择 B 而不是 A 参加归零结算？
  why_harder_than_prior_levels: >
    玩家不能只数长度或沿对角线逐盆推进；同一条竖向轨迹在三个阶段具有不同的火焰列，
    且第三次滚动内部的事件顺序决定边界成员集合。第二次滚动结束时 A 熄灭是局部损失，
    但它同时冻结长度，允许玩家跨越多个有效行动重排横向位置；真正收益要到第三次滚动
    才兑现。错误列可能仍能点亮前两个目标，却会在后段错过 B 的烛芯或让 B 火焰高度错误。

visible_premises:
  - A 是朝右横烛，开局点燃；侧滚不会改变朝向，燃烧只从右端缩短
  - 第一条火焰列包含第一目标，首边界缩短会让 A 的右端火焰向左退一列
  - 第二条火焰列从稳定火盆取火，经过第二目标，随后进入墙格而熄灭
  - A 熄灭后不会在绕行和轴推期间缩短；向右轴推两格会把第三次火焰列移到接力烛 B 的列
  - 第三条火焰列由下至上依次经过稳定火盆、B 的烛芯、B 的烛身、上层稳定火盆和第三目标
  - B 朝下，第三次滚动中被点燃；同一动作若触发边界，B 从下端缩短后火焰上退到最终目标行
  - B 右滚必须发生在下一次缩短之前，否则火焰高度会再次改变

expected_conclusions:
  - 第一次上滚后 A 必须参加首边界，得到用于第二次下滚的相邻火焰列
  - 第二次下滚必须按“取火 -> 点目标 -> 墙遮熄”结束，让 A 保存当前长度
  - 两次右轴推不是单纯运输，而是把第三次火焰列对齐 B 的烛芯与上层重燃源
  - 第三次上滚必须落在归零动作，按“取火 -> 点 B -> A 被遮熄 -> A 重燃 -> 点目标 -> B 缩短”结算
  - B 缩短后的第一高度窗口必须立即用于右滚完成最终火盆

intended_mechanic_sequence:
  - A 第一次向上侧滚，点亮第一目标并停在上侧滚位
  - 绕到 A 上方；首边界只让仍点燃的 A 缩短一格，火焰列左移
  - A 向下侧滚：从稳定火盆取火、点亮第二目标、再被墙遮熄，停在下侧滚位
  - 绕到 A 左端，向右轴推两格；A 保持未燃，不受跨边界走位影响
  - 绕到 A 下方，在归零动作向上侧滚
  - 侧滚途中依次 ignite A、ignite B、extinguish A、reignite A、light 第三目标
  - 同回合边界只缩短 B 到目标高度；绕到 B 左侧立即向右侧滚，点亮最终目标

reasoning_units:
  - id: RU1
    question: 为什么第一次上滚后的燃烧缩短是第二次滚动的必要对列，而不是资源损失？
    expected_answer: 缩短从右端移除一格，使不移动的左端保持原位而火焰列左移，正好进入第二目标列
    delayed_feedback: 第二次下滚的火焰在新列依次接触稳定火盆、目标和灭火墙
  - id: RU2
    question: 第二次下滚后为什么要保留熄灭状态，并额外右推两格？
    expected_answer: 熄灭让 A 在长绕行中保存长度；两次右推抵消并超过先前左移，把第三次火焰列送到 B 烛芯列
    delayed_feedback: 第三次上滚能先点燃 B，随后又被 B 烛身遮熄，证明横向改列被后段消费
  - id: RU3
    question: 为什么第三次上滚必须是归零动作，B 又为什么必须在下个边界前滚动？
    expected_answer: A 在同一滚动中最终重燃而 B 也保持点燃；若动作归零，两者都会缩短，除非 A 在 B 烛身处先被遮熄，才能只让 B 得到目标高度
    delayed_feedback: B 缩成指定长度后火焰与最终火盆同行；再缩短一次即错过

tool_questions:
  - 是否存在不让 A 首次缩短却仍能在第二条火焰列点亮目标的胜路
  - 是否存在 A 第二次下滚后保持点燃、靠额外缩短或其它轴推数仍可完成的旁路
  - 是否所有胜路都必须恰好消费两次 A 的右轴推，且第三次上滚经过 B 烛芯与烛身
  - 是否能证明第三次滚动中 A 在边界前已熄灭而 B 仍点燃，从而只缩短 B
  - 是否存在由 A 替代 B 点亮最终目标，或 B 在错误高度仍能侧滚点亮的旁路
  - 最短解是否只剩不改变非 walk/countdown 事件签名的等价走位

discard_conditions:
  - 三次侧滚只是相邻目标的可见阶梯，没有中途点火、灭火或成员集合变化
  - A 不必在第二次滚动结束时熄灭，错误长度可以靠等待自动修正
  - 轴推次数不影响第三次滚动接触 B 的烛芯与烛身
  - B 无需在临界动作点燃并缩短，或最终目标可由 A 直接完成
  - 主要难度来自长距离绕路而不是三次火焰列之间的因果关系
