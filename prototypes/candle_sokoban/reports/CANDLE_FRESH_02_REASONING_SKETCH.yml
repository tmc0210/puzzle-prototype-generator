design_target:
  role: 高难同步燃烧与空间塑形综合关
  allowed_exposure_through: not_claimed
  mechanism_scope:
    - simultaneous_shrink
    - staggered_burn_out
    - rolling_stop_geometry
    - brazier_as_body_blocker
  tool_questions:
    - 最短胜解是否必须经历四次燃烧边界与四次逐列侧滚？
    - 提前侧滚是否只能获得局部位移，不能绕过定时门与火盆形成的双重阻挡？
    - 全部最短解是否共享同一组非行走事件及次序？

reasoning_sketch:
  player_goal: >
    让右侧竖向运输烛沿左下对角线依次点亮四个火盆；每个火盆在点亮前
    同时也是阻挡运输烛烛身的实体。
  central_question: >
    为什么每次都必须等到下一个五回合边界同时烧掉当前竖向门烛、
    并缩短运输烛，才能把运输烛再向左滚动一列？
  visible_objects_and_positions:
    - 四根开局点燃的竖向门烛并排放置，长度依次为 4、3、2、1；它们的最下端都占据运输烛横滚所需的第 5 行。
    - 右侧运输烛开局点燃，长五格、烛芯朝下。
    - 四个未点火盆从右下向左上排成阶梯，每个都位于运输烛下一阶段的烛身占位格。
  expected_mechanism_sequence:
    - 第一个五回合边界让长度 1 的最右门烛燃尽，其余三根门烛各缩短一格；运输烛同步缩短一格。
    - 缩短后的运输烛向左滚到下一根门烛右侧，火焰落在第一火盆；未缩短前该火盆会挡住它的烛身。
    - 下一个五回合边界让当前最右门烛燃尽、运输烛下端再退一格：横向和纵向两道占位限制同时解除。
    - 玩家把运输烛再向左滚一列，点亮下一火盆；随后重复同一规律，但每次棋盘上的阻挡格和火焰高度都改变。
    - 第四次同步缩短后，最后一根门烛燃尽，运输烛成为单格，最后一次左滚点亮最高且最左的火盆。
  intended_feedback:
    - 每个燃烧边界后，当前最右门烛整体消失、运输烛下端退一格，形成清晰的对角线开锁反馈。
    - 每次侧滚只前进一列并立即点亮一个原先作为障碍的火盆。
    - 提前侧滚会被尚未腾出的火盆或门烛截停，玩家可直接看到少等一个边界缺少哪一格空间。
  intended_reasoning_units:
    - id: RU1
      question: 为什么四根门烛采用不同长度，且运输烛必须先缩短？
      conclusion: 先走到运输烛右侧，利用第五步让长度 1 的门烛燃尽，并让运输烛腾出第一火盆的实体格。
    - id: RU2
      question: 第一火盆点亮后，为什么运输烛不能连续向左滚？
      conclusion: 下一火盆仍占据运输烛最下端将进入的格，下一根竖向门烛也仍占据同列；必须等待下一次同步缩短。
    - id: RU3
      question: 后续三次推进是否仍由同一因果关系控制？
      conclusion: 每个边界都燃尽一根门烛并解除运输烛的一行纵向占位，随后只允许一次有效的左滚与一次点火。

layout_constraints:
  - 固定周期必须为 5。
  - 四个火盆必须同时承担目标和提前滚动的实体阻挡，不能只是装饰。
  - 四根定时门烛与运输烛必须在至少三个后续 reasoning phase 中继续改变局面。
  - 不新增核心规则之外的机关。
  - 若存在跳过任一燃烧边界或一次滚动即可获胜的路线，候选必须修订或淘汰。

status: reasoning_sketch_only
