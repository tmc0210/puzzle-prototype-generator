mechanical_claims:
  - claim_id: normal_win_and_replay
    claim: >-
      v2 的 29 步 canonical replay 全部合法，并在完整回合结算后玩家存活且以
      all_braziers_lit 正常获胜。
  - claim_id: complete_graph_and_single_winning_state
    claim: >-
      当前 exact 的完整可达图为 complete，包含 45726 states、133307 legal transitions
      与 1 个 winning state，且所有图证据与 layout digest、candidate id、exact version 对齐。
  - claim_id: exposure_gate
    claim: >-
      v2 对 allowed_exposure_through=rolling_contact_chain 的 exposure audit 为 complete/pass，
      layout 与 exposure sequence digest 匹配，forbidden_hits 为空，raw graph nodes/edges 完整保存。
  - claim_id: same_roll_wall_douse_then_reignite
    claim: >-
      核心 candle#1 在同一次五格侧滚中先于 d1 因墙遮芯熄灭，在 d2 未点亮历史盆，
      后于 d4 从 candle#3 的外露烛芯复燃；滚动继续至由 candle#2 身体形成的终点。
  - claim_id: cross_object_post_roll_consumption
    claim: >-
      candle#1 滚后仍点燃，后续缩短退焰点亮 candle#2 并最终燃尽；candle#3 后段回滚
      点亮历史盆并被原墙熄灭；candle#2 保存至终局并侧滚点亮末盆。
  - claim_id: single_first_win_milestone_family
    claim: >-
      完整首次胜利产品图包含 87607 product states、254986 legal product edges、
      1 个 winning product state 与 1 个首次里程碑顺序；63 条最短输入只存在普通走位换序，
      不改变三根蜡烛职责、目标分配或依赖因果。
  - claim_id: identity_counterfactuals
    claim: >-
      删除复燃、删除接收烛、用静态火源替代供火烛、或让核心滚后立即退休，四个反事实均在
      各自完整图中无胜；删除 d1 墙的对照仍可解，但最短解缩为 27 步且历史盆提前点亮，
      因而不保持当前作品身份的机械关系。

