known_perceptible_defects:
  - 核心揭示后的两段换侧路线局部选择较窄，若玩家未把走位视为共享时钟的一部分，执行段可能略显走廊化。
  - 原始最短输入有 63 条走位换序；逻辑解族唯一，但输入串层面的规范感不强。
