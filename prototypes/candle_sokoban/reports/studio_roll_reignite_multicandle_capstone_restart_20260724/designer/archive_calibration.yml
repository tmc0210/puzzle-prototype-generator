    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0006.md
    human_comment_id: HP_RA_EXP_2026_07_05_SOFT_HANDOFF_NO_MERGE_LOCK_v1_001
    boundary_role: difficulty_5_without_aesthetic_value
    calibrated_lesson: >-
      人类难度 5 不能单靠目标位置硬化和较差腾挪复杂度获得；当前关必须明显区别于这种路线税式增难。
  - candidate_id: RA_CAND_0019
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0019.md
    human_comment_id: HP_RA_LEX_2026_07_07_STROKE_SELECT_CMM_PAIR_v1_001
    boundary_role: obvious_mechanism_application
    calibrated_lesson: >-
      即使对象职责机械成立，只要关键动作与顺序过于显然，仍只是功能库存；目标 5 需要玩家建立跨滚动前后的非显然关系。
  - candidate_id: RA_CAND_0023
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0023.md
    human_comment_id: HP_RA_LEX_2026_07_08_BRUSH_TRIPLE_OUTPUT_v3_outer_wall_trim_001
    boundary_role: compact_but_repetitive_usable_floor
    calibrated_lesson: >-
      紧凑几何可让简单重复成为可用流程关，却不足以承担后期上限；多蜡烛不能被依次独立处理。
  - candidate_id: RA_CAND_0026
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0026.md
    human_comment_id: HP_RA_FRESH_2026_07_08_VACATE_INTERLOCK_v10_left_column_trimmed_001
    boundary_role: affordance_promise_alignment
    calibrated_lesson: >-
      对象只承担较窄职责并非天然缺点，前提是题面没有承诺更复杂用途；但当前人类 brief 已明确承诺多蜡烛互相作用，因此不能用此边界豁免对象失职。
  - candidate_id: RA_CAND_0028
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0028.md
    human_comment_id: HP_RA_FRESH_2026_07_10_ANCHOR_BRAID_DOCK_v6_001
    boundary_role: strong_family_but_saturated
    calibrated_lesson: >-
      短小、紧凑、反直觉的对象腾挪可以成立，但 family 本身不保证新鲜；本任务必须由 Candle 独有的火、长度与同回合滚动关系形成作品身份。

cross_archive_conclusions:
  target_difficulty_5: >-
    只接受由强耦合、多层预见、反直觉但可解释的对象关系产生的难度；路线税、目标位置硬化、重复搬运、迟缓 deadend 和大地图不计入设计目标。
  mechanism_density: >-
    机制密度必须表现为删除一个对象或机制就改变合法计划、顺序判断或对象职责，而不是 replay 事件标签更多。
  multicandle_affordance: >-
    至少两根蜡烛必须在同一双向因果链中持续承担职责；额外蜡烛若只是固定火源、独立目标处理器、操作障碍或旁观者，即视为失败。
  construction_and_payoff: >-
    前序若存在，必须让玩家为核心滚动所需状态作选择；滚动后的消费必须把约束传回此前，并尽快形成集中回报和收束。
  scale_and_feedback: >-
    规模与对象数由完整因果链所需决定，不设上限也不追求数量；错误结构应有相对及时、可读的反馈，避免用执行负担伪造深度。
  player_side_priority: >-
    后续任何 solver、graph、事件覆盖和唯一解证据只承担机械否决；作品是否精彩以玩家实际做出的判断、可见变化、对象复用和因果紧凑度为准。
