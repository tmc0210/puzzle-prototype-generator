all_aesthetic_1_records:
  - candidate_id: RA_CAND_0024
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0024.md
    human_comment_id: HP_RA_FRESH_2026_07_08_PULL_BRUSH_RETURN_v4_wall_trim_001
    human_judgment: >-
      多个可动锚点与黏块把玩家的期待抬到切割、拼接、长链推动和几何利用，实际却只兑现推拉腾挪；
      算法指标与表面机制利用率无法弥补玩家洞见缺失。
    transfer_to_current_task: >-
      多根蜡烛会天然承诺明灭、长度、烛芯投影、烛身遮挡和倒计时之间的互动；不能让大多数对象只限制走位，
      或让核心只剩一次可自动读出的滚动事件。
  - candidate_id: RA_CAND_0027
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0027.md
    human_comment_id: HP_RA_FRESH_2026_07_09_VACATE_MATERIAL_LOCK_v4_001
    human_judgment: >-
      可移动对象无需移动、可黏对象无需利用黏块几何，即使事件标签齐全也构成严重 affordance 污染。
    transfer_to_current_task: >-
      每根高 affordance 蜡烛都必须通过自身可见状态改变合法计划或对象职责；仅被事件扫过、固定供火或旁观不算参与。
  - candidate_id: RA_CAND_0030
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0030.md
    human_comment_id: HP_RA_FRESH_2026_07_12_CUT_REBIND_ORTHOGONAL_v7_001
    human_judgment: >-
      高 affordance 对象开局用完后退休，大地图和大量材料只换来普通腾挪；自然操作方向产生大量反馈迟缓的 deadend，
      是高设计成本而无相称亮点。
    transfer_to_current_task: >-
      其它蜡烛不能在核心滚动前就退休；错误计划的结构后果应可由火路、滚动终点、长度或相位较早读出，
      不能靠漫长执行后才揭露。
  - candidate_id: RA_CAND_0031
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0031.md
    human_comment_id: HP_RA_FRESH_2026_07_11_TWIN_LOOM_RESECTION_v31_001
    human_judgment: >-
      前段用齐大量机制却只是无有效选择、无后续复用的单行道演出；后段只剩显然重复顺序锁，事件覆盖没有玩家价值。
    transfer_to_current_task: >-
      核心滚动前的准备必须因预见滚动后的反向约束而产生选择，不能把熄灭、复燃和机制覆盖做成强制过场。
  - candidate_id: RA_CAND_0032
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0032.md
    human_comment_id: HP_RA_FRESH_2026_07_12_DUAL_ANCHOR_CROSS_RELAY_v4_001
    human_judgment: >-
      开局交接与末段黏块入目标彼此割裂，前段对象全部退休；拼接独立子题不能制造真实机制覆盖、难度或审美。
    transfer_to_current_task: >-
      多蜡烛准备、同回合熄灭复燃和滚后消费必须构成一条可回溯的因果链；删掉任何段落都应改变玩家对同一核心计划的理解。

selected_positive_records:
  - candidate_id: RA_CAND_0022
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0022.md
    human_comment_id: HP_RA_LEX_2026_07_08_PULL_CUT_ANCHOR_HANDOFF_v2_001
    selection_reason: 强反直觉洞见、紧凑空间、高空间利用率与短因果链最贴近本任务的精彩性要求。
    calibrated_lesson: >-
      高回报来自玩家主动做出一个看似违背局部常识、却为后续关系服务的决定；当前关的核心滚动也应结算此前的远期判断，
      不能只因动画罕见而成为亮点。
  - candidate_id: RA_CAND_0017
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0017.md
    human_comment_id: HP_RA_LEX_2026_07_06_VACATE_BIND_RETURN_v3_opening_comfort_001
    selection_reason: clean archive 中明确的人类难度 5 正例，且以高机制密度、高要素耦合和大量反直觉操作成立。
    calibrated_lesson: >-
      目标难度 5 可以由多机制、多对象共同承担，但每个机制必须进入同一推理与腾挪结构；高腾挪负担只有在持续兑现结构关系时才可接受。
  - candidate_id: RA_CAND_0025
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0025.md
    human_comment_id: HP_RA_FRESH_2026_07_09_ACTIVE_L_REBIND_v4_001
    selection_reason: 玩家主动构造亮点结构，前序不抢戏，终局提示并消费该结构。
    calibrated_lesson: >-
      若本关需要前序，玩家应为核心滚动所需的具体火路、长度、相位或操作位作选择；滚后状态必须兑现并解释这些选择。
  - candidate_id: RA_CAND_0029
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0029.md
    human_comment_id: HP_STUDIO_L_1_001
    selection_reason: 同一组要素在两个不同局部结构中重复承担推动与回收责任，具有高复用和新颖关系。
    calibrated_lesson: >-
      多蜡烛互动应让相同对象在核心滚动前后承担不同但连续的职责；重复参与必须改变关系，而不是重复同一操作。
  - candidate_id: RA_CAND_0001
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0001.md
    human_comment_id: HC_RA_CAND_0001_001
    selection_reason: 正交角色造成清楚玩家矛盾，并以强耦合和紧凑因果链承载高设计密度。
    calibrated_lesson: >-
      几何、火源、长度和相位可以同时进入题面，但应汇聚为一个玩家可说清的矛盾；不能成为四套并排计算。

