candidate_id: CANDLE_REIGNITE_MULTICANDLE_CAPSTONE_002
target_difficulty: 5
structure_proposition: >-
  玩家先从安全烛尾轴推核心横烛，使其轨道与五拍相位同时就位；第一次燃烧边界又同步缩短
  核心与供火烛，使供火烛的烛芯恰好进入核心轨道。核心随后在一次五格侧滚中依次墙灭、
  暗越历史盆、穿过空层、从供火烛复燃，并由接收烛身体截停。复燃核心的下一次缩短以退焰点亮接收烛；
  核心随后燃尽，供火烛必须在余下寿命内被推回并侧滚点亮此前暗越的历史盆。接收烛则借由
  同一全局时钟缩成单格，最终侧滚点亮末盆。供火烛点亮历史盆后又被核心用过的同一面墙熄灭，
  从而避开本次边界并退出火路。玩家从两个末目标及三根蜡烛的终局长度
  反推开局轴推、核心暗窗、两次对象交接和共同相位。
player_reasoning_load:
  - 识别开局必须从无火的尾端轴推核心；这一步同时决定 d1 墙列、d2 历史盆列和五拍边界。
  - 预演核心五格滚动的墙灭、暗越、供火烛复燃与接收烛截停，并理解始终点燃会提前改写历史盆。
  - 追踪三根蜡烛共享五拍边界时的长度：核心退焰点亮接收烛，供火烛仍需保留两格完成回填。
  - 从历史盆反推供火烛的两次轴推与一次侧滚；从末盆反推接收烛必须存续到单格后的终局侧滚。
  - 排除无复燃、静态火源替代供火烛、删除接收烛或让核心滚后立即退休等表面简化。
revision_rule: >-
  坐标微调不更新本文件；只有双向因果职责、历史状态载体或最终消费方式发生实质变化时更新。
