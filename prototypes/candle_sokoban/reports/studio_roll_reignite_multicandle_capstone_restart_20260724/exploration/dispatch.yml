experience_seed: >-
  展开“滚动中实际熄灭的一段时间会留下可继续使用的动态差异”的局部连续关系。核心蜡烛仍需在同一次多格侧滚中
  先因墙遮芯熄灭、再从已知火源复燃；至少另一根蜡烛动态改变核心并在滚后接收输出。正例必须让中间熄灭造成的
  状态差异在终点或紧随后继动作中仍可读，使删除复燃与让核心始终点燃分别留下不同的动态局面、合法用途或动作结果。
  所需历史由实际接触、状态、火路、相位或职责编码，不靠事件标签记忆；探索仍不是候选、包装、难度或 family 取舍。
player_prior:
  - 玩家已掌握 roll_intermediate_extinguish 及之前全部机制、衍生技巧和计算。
  - 玩家已玩过“回焰门”，本次材料服务于明显更深的后期组合。
