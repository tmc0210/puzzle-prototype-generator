request_id: designer_request_001
exploration_id: candle_roll_reignite_multicandle_capstone_restart_20260724
design_space: >-
  展开一类坐标无关的局部多蜡烛关系：某根多格蜡烛从侧面触发一次距离大于一格的滚动，
  其外露明烛芯在某个中间小步先被墙遮蔽而熄灭，又在更晚小步与玩家预先可辨认的火源重合而复燃；
  至少另一根蜡烛的长度、位置、明灭、烛芯投影、身体占格或行动次序，会实质改变这次滚动的可触发性、
  复燃窗口、停止位置、倒计时结算或滚后可用状态，而滚动烛留下的明火、位置、长度、朝向、相位或腾出的操作位
  又会反过来改变该其它蜡烛的后继合法动作或用途。探索对象是这一双向局部因果关系及其近邻退化，
  不是完整候选、关卡包装、难度判断或固定 structure family。
sampling_axes:
  - >-
    其它蜡烛对核心滚动的作用载体：烛身阻挡或释放滚动终点、烛芯火源与传火、烛身遮芯、
    长度/燃烧后占格变化、操作侧或行动顺序；寻找机械上不同的关系，不把静态额外火源当作充分材料。
  - >-
    核心滚烛对其它蜡烛的回传载体：滚后明火或烛芯投影、滚后身体占格/空位、滚后长度与朝向、
    倒计时边界参与或避烧，以及由此改变的可推、可滚、可点火、可避火或可点盆用途。
  - >-
    已知复燃火源的类型与责任：已点火盆、另一根外露明烛芯或递归火链；若使用火盆，
    仍需另一根蜡烛通过非静态火源职责改变核心滚动，并接受核心滚烛的反向影响。
  - >-
    同次滚动内的接触顺序：墙熄灭发生的小步、复燃发生的更晚小步、两者间距、复燃是否在终点前，
    以及滚动结束后哪些局面差异仍然存在并可被玩家操作。
  - >-
    全局节拍关系：普通中途复燃、midcycle ignition、燃烧边界中新点燃立即参与、先熄灭避开边界、
    同时燃烧和燃烧后长度变化；只区分会改变后续合法关系的相位差异。
  - >-
    蜡烛局部形态：核心滚烛与其它蜡烛的相对轴向、长度类别、烛芯朝向、身体接触面、墙口和玩家站位；
    不固定总蜡烛数、绝对坐标、完整地图几何或对象上限。
  - >-
    近邻退化：移除其它蜡烛、把它替换为静态火源或墙、提前点燃核心滚烛、删去墙熄灭、
    让复燃不发生、让滚后不再消费、或把双向关系拆成两个独立动作后，记录局部用途如何消失。
current_material_refs:
  - prototypes/candle_sokoban/docs/designer_contract.md
  - prototypes/candle_sokoban/docs/mechanic_exposure_sequence.yml
  - prototypes/candle_sokoban/mechanic.yml
  - src/prototypes/candle_sokoban/mechanics.ts
do_not_repeat:
  - 只证明 roll_reignite_after_extinguish 事件可触发、但没有另一根蜡烛双向参与的单对象 witness。
  - 另一根蜡烛仅固定提供一次火源，之后不再被核心滚烛结果改变的局面。
  - 把熄灭复燃段与滚后用烛段拼成两个互不约束的局部子题。
  - 只改变平移、旋转、换皮、滚动距离、重复次数或额外走位，而动作后操作关系没有实质变化的变体。
  - 以完整候选坐标、目标难度、审美结论、候选 family 取舍、对象数上限或包装流程作为探索条件。
materialization_target: >-
  把每种可复用的双向关系发布为最小局面卡：给出可运行开始局面、玩家站位、非空输入、
  每个关键滚动小步的灭火/复燃/停止事实、滚动结束后的实际局面、其它蜡烛在滚前与滚后的双向职责、
  最小局部用途、近邻退化和原始 runtime evidence；首批至少提供一个直白可靠材料，
  后续按上述结构轴扩展差异谱，不制作完整关卡。
