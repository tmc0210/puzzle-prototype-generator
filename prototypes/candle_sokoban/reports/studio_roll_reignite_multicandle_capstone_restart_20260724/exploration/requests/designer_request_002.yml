do_not_repeat:
  - 只回放一次核心滚动并把动作后的静态明灭差异称为“后继用途”。
  - 动作后 action table 只有普通 walk，未实际执行另一根蜡烛或核心滚烛的连续消费动作。
  - 另一根蜡烛只负责静态截停或一次供火，核心滚烛结果不改变其后续合法用途。
  - 后继动作即使删除复燃或把核心始终点燃也完全不变，因而只消费终点几何而未消费复燃结果。
  - 把核心滚动 witness 与另一个独立点盆、搬烛或计时段拼接，或用长走路/空转补足倒计时。
  - 仅采样普通镜像、平移、滚距或重复次数变化，以及任何完整候选、难度、审美、对象上限或 family 结论。
materialization_target: >-
  每张正向材料必须提供一个可运行开始局面和连续非空输入串，至少包含核心滚动与其后的实际消费动作；
  逐步保存每个动作前后 layout、滚动各小步事件、倒计时、蜡烛长度/明灭/烛芯投影、玩家站位和合法性。
  明确写出其它蜡烛如何在滚前改变核心，以及核心复燃输出如何在滚后改变该蜡烛的具体合法用途；
  同时提供删除复燃、静态对象替换、预先满足滚后状态和删除后继动作等近邻对照及原始 runtime evidence。
  只发布具有新连续操作关系的局部卡片，不制作完整关卡。
