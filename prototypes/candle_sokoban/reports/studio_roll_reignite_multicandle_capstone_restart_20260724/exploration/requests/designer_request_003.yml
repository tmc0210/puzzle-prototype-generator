request_id: designer_request_003
exploration_id: candle_roll_reignite_multicandle_capstone_restart_20260724
design_space: >-
  展开“滚动中实际熄灭的一段时间会留下可继续使用的动态差异”的局部连续关系。开始局面仍需允许一根多格核心蜡烛
  在同一次距离大于一格的侧滚中先因墙遮芯熄灭、再从玩家预先可辨认的火源复燃；至少另一根蜡烛必须以自身状态、
  占格、烛芯、操作位或行动时序改变这次滚动，并在滚动后接收核心输出。正例不仅要在滚后执行实际非空动作，
  还要让“曾在中间小步熄灭”所造成的状态差异在滚动终点或紧随其后的局部动作中仍然可读：删除复燃与让核心始终点燃
  都应分别留下不同的动态局面、合法用途或动作结果。这里不要求 runtime 记忆事件历史；所需历史必须由滚动途中真实发生或
  未发生的接触、明灭、长度、占格、火路、目标状态、相位或对象职责编码进后续状态。探索对象仍是可移植的局部关系，
  不是完整候选、关卡包装、难度、对象数量、structure family、几何或指定机制组合。
sampling_axes:
  - >-
    熄灭区间可留下的状态差异：比较核心在若干中间小步无火与全程有火时，哪些实际接触或结算会在滚动终点留下不同状态；
    只保留后续动作能读取的差异，不把事件标签本身当状态。
  - >-
    两侧反事实的分离方式：删除复燃后，核心的明灭、长度、相位或可用火路怎样改变后续；让核心始终点燃后，
    滚动途中本应缺失的无火窗口怎样造成另一种后续。两种对照不必以同一种载体失败。
  - >-
    其它蜡烛的双向责任：它在滚前以动态对象身份改变核心滚动或复燃条件，滚后又因核心留下的状态差异而获得、失去或改变
    一项实际操作职责；区分可由静态墙或预先满足状态替代的单向关系。
  - >-
    滚后消费的持续性：执行至少一个紧随滚动的合法动作，并检查其是否产生新的可用状态、目标推进、对象存续或后续操作差异；
    区分真正读取窗口与把刚点亮对象立即恢复原状、其间没有任何作用的开关动画。
  - >-
    初始明灭与动作次序：比较接收蜡烛预先明、预先灭或由链中点亮时，滚前作用和滚后职责是否仍不可替代；
    排除初始状态完全无关却被叙述为互相作用的摆法。
  - >-
    玩家连续操作条件：滚动、必要换侧与消费动作之间的站位和节拍是否紧凑，哪些行动承担结构责任；
    不用空转、长走路或重复搬运制造差异。
