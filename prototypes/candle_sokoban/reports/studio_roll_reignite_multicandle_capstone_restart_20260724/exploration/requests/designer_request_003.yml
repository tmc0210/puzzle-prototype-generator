do_not_repeat:
  - >-
    复现 TL-MC-002：核心滚后在边界缩短并点亮截停蜡烛，下一次轴推立即重新遮芯；接收蜡烛在点亮与再熄灭之间没有产生其它状态或用途。
  - >-
    正例与核心始终点燃对照在滚后具有相同的蜡烛明灭、长度、占格、火盆状态、倒计时和消费事件，只剩被删除墙格的地形差异。
  - >-
    把“删除复燃会阻止缩短与退焰点火”重复包装成新材料，却不补足始终点燃侧或后续用途侧的差异。
  - >-
    接收蜡烛预先明灭均不改变局部链，却仍把其初始明灭或滚中先熄灭叙述成必要职责。
  - >-
    只给动作后的 action table、事件可达统计或预算内图搜索，未实际执行正例与两侧反事实的连续输入串。
  - >-
    指定完整候选、目标难度、对象数量、绝对坐标、family、几何或某一种必须采用的后继用途。
materialization_target: >-
  每张正向材料提供一个可运行开始局面与连续非空输入串，至少覆盖核心滚动和滚后的实际消费动作；逐步保存动作前后 layout、
  滚动各小步事件、倒计时、所有相关蜡烛的长度/明灭/烛芯投影、火盆状态、玩家站位和合法性。除正例外，至少实际回放
  删除复燃、核心始终点燃、静态对象替换或预先满足接收状态、删除消费动作等近邻对照。明确指出正例、无复燃和始终点燃
  三者首次出现动态分歧的位置，以及该分歧怎样被滚后动作继续读取；若某侧仍等价，按证据边界报告，不将其发布为满足本请求的
  新正向材料。只发布具有新连续操作关系的局部卡片，不制作完整关卡。
