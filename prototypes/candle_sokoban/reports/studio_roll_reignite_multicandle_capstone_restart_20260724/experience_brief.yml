    删除复燃源会让核心保持未明二格并令该开关链消失。可是接收蜡烛在被点亮与再熄灭之间没有产生目标进展、对象存续或其它后续用途，
    且删除首段遮芯墙的始终点燃对照从滚动终点起复制了正例的蜡烛明灭、长度、占格、倒计时和消费事件。
    当前材料因此只提供“此刻点燃且会在边界缩短”的输出读取，不能让玩家为了滚中实际墙灭空窗而反推滚前构造；
    直接进入终局候选会把作品身份降为事件 witness 或迫使 Designer 凭空拼接一个后段。
  material_sufficiency:
    verdict: insufficient_for_candidate_entry
    independently_read_raw_refs:
      - prototypes/candle_sokoban/reports/studio_roll_reignite_multicandle_capstone_restart_20260724/exploration/runs/batch_001/results.json
      - prototypes/candle_sokoban/reports/studio_roll_reignite_multicandle_capstone_restart_20260724/exploration/runs/batch_001/report.md
      - prototypes/candle_sokoban/reports/studio_roll_reignite_multicandle_capstone_restart_20260724/exploration/runs/batch_001/explorer_notes.md
      - prototypes/candle_sokoban/reports/studio_roll_reignite_multicandle_capstone_restart_20260724/exploration/runs/batch_001/proposed_families.md
      - prototypes/candle_sokoban/reports/studio_roll_reignite_multicandle_capstone_restart_20260724/exploration/runs/batch_002/results.json
      - prototypes/candle_sokoban/reports/studio_roll_reignite_multicandle_capstone_restart_20260724/exploration/runs/batch_002/report.md
      - prototypes/candle_sokoban/reports/studio_roll_reignite_multicandle_capstone_restart_20260724/exploration/runs/batch_002/explorer_notes.md
      - prototypes/candle_sokoban/reports/studio_roll_reignite_multicandle_capstone_restart_20260724/exploration/runs/batch_002/proposed_families.md
    supported_local_facts:
      - 核心二格明横烛在同次三格滚动中 d1 被墙熄灭、d2 被已点火盆复燃，朝上竖烛的身体阻止 d4 且烛芯被终点身体覆盖。
      - 玩家用三步 Manhattan 最短路线到达轴推侧；第五次合法行动进入燃烧边界，明二格核心从烛芯端缩为单格，退焰点亮刚外露的竖烛。
      - 第六次向右轴推核心为实际消费动作：核心重新占住竖烛烛芯并将其熄灭；删除该动作会让两根蜡烛都保持点燃。
      - 删除复燃火盆时，核心滚后保持未明二格，不缩短也不退焰点亮竖烛；同一最终轴推仍合法，但开关链消失。
      - 删除 d1 遮芯墙让核心始终点燃时，受试链从滚动终点起与正例具有相同动态对象输出和后段事件；材料不支持后段辨认复燃历史。
      - 接收竖烛预先未明仍会在边界被点亮并在轴推中再熄灭；其初始明灭不是 TL-MC-002 后段成立的必要条件。
    blocking_material_gaps:
      - 接收竖烛在边界点亮后只被下一次轴推恢复为未明；点亮窗口内没有动作、目标进展、对象存续或下一操作差异，仍接近开关动画。
      - 始终点燃对照复制正例全部受试动态输出，说明当前后段只需要核心滚后为明并在边界缩短，不需要中间真实发生的墙熄灭空窗。
      - 另一根蜡烛的身体具有截停责任，但其初始明灭与滚中先熄灭均可删除；尚未形成会把后继约束传回滚前选择的完整双向责任。
      - 六个局部 case 在深度 7 内均无胜态，且没有证明临时点亮或重新遮灭会为任何更晚局部用途留下持久差异。
    explorer_next_sampling_axes_are_not_controller_instructions: true

