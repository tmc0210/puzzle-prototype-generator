  - Controller 校验 request 边界并调度 fresh Explorer；在墙灭空窗能编码为始终点燃对照无法复制、且可被滚后动作继续读取的动态状态前，不进入正式候选工作台。
  - 正式候选只允许 all_braziers_lit，并在 exact 发布后对完整可达图运行 allowed_exposure_through=roll_reignite_after_extinguish 的 exposure audit。
  - 所有 exact 证据必须与当前 layout digest、版本和暴露序列 digest 一致；机械证据不产生审美结论。

human_review_constraints:
  - 目标难度与最低可接受难度均为 5，且必须明显超过前序“回焰门”；不把路线税或对象数量计为难度。
  - 至少两根蜡烛进入同一双向因果链，另一根不能只是额外火源、独立目标处理器或旁观道具。
  - 核心复燃结果必须在滚动后继续消费；删掉复燃时原胜解失败或实质改变。
  - 尽可能多地有效使用当前机制，但不追求事件覆盖；每项机制都必须改变玩家决策、顺序或对象职责。
  - 不串联独立子谜题，不用长走路、重复搬运、更多目标或迟缓 deadend 伪造难度。
  - 后续只维护一个 candidate_id；完整 exact 必须经过独立 Evidence Reviewer 与单次 fresh Critic，最终只可交付 pending_playtest。
