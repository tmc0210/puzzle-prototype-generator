experience_core:
  experience_statement: >-
    玩家先把多根蜡烛组织成一条相互制约的火与几何因果链，再亲自触发核心蜡烛的一次多格滚动：
    该蜡烛在滚动中途被墙熄灭，又在后续小步从玩家已知的火源复燃；滚动结束留下的明灭、位置、长度、朝向、相位或操作位
    随即反过来改变至少另一根蜡烛的后继用途，并成为最终获胜不可删除的一环。
  visible_setup: >-
    开局让玩家同时看见核心滚烛、至少另一根会参与因果链的蜡烛、墙遮芯关系、可追踪火源与尚未完成的火盆；
    题面提供多种表面可信的滚动准备，但只有预见滚后反向约束的安排能保留完整后继。
  player_action: >-
    玩家主动选择多根蜡烛的相对状态与行动相位，触发核心蜡烛一次距离大于一格的侧滚，亲眼见证同一根蜡烛先被墙熄灭、
    后从已知火源复燃，并在滚动后继续使用该结果完成对其它蜡烛和最终火盆的处理。
  visible_payoff: >-
    同一次滚动中明火先消失再回来，滚动终点随即把此前分散的火源、烛身、长度或相位关系收束成新的可操作局面；
    该局面让另一根蜡烛获得或失去一个可见后继职责，并较快兑现为终局推进。
  why_level_exists: >-
    这关把“滚动中先熄灭再复燃”从单烛事件 witness 提升为多蜡烛互相塑形、互相偿还的后期综合洞见：
    玩家不是观看规则发生，而是用对滚后后果的预见来决定滚前构造。
  core_boundary:
    central_objects:
      - 执行同回合先墙熄灭后复燃的核心滚烛。
      - 至少一根与核心滚烛形成双向因果链的其它蜡烛；不固定蜡烛总数或具体职责载体。
      - 造成中途熄灭的墙遮芯关系。
      - 玩家可预先辨认、在熄灭之后重新点燃核心蜡烛的火源。
      - 滚动后继续消费复燃结果并把约束传回滚前选择的后继关系。
    supporting_objects:
      - 用于呈现、筛选与收束同一因果链的必要火盆、墙体、通路和站位。
      - 仅在确实改变合法计划或对象职责时使用的其它当前允许机制。

work_identity:
  conditions:
    - 核心滚烛必须在同一个距离大于一格的滚动行动中，先因墙遮芯熄灭，再在更晚小步从已知火源复燃。
    - 至少另一根蜡烛的长度、位置、明灭、烛芯投影、身体占格或行动顺序必须改变核心滚烛的滚动、复燃、停止、计时或滚后可用状态。
    - 核心滚烛的滚后结果必须反过来改变至少一根其它蜡烛的合法后继或最终职责，形成不可拆分的双向因果链。
    - 删除这次复燃、把核心滚烛预先保持点燃，或让它在滚动后立即退休，必须使原胜解失败或实质改变。
    - 若有前序准备，它必须要求玩家预见具体滚后状态来筛选构造；若有后继，它必须消费该状态并尽快收束，不能成为独立子题。
    - 所有高 affordance 蜡烛在终局前后持续承担可感职责；机制有效性按玩家计划和对象责任判断，不按事件标签判断。
  counterfactuals:
    - 把墙熄灭删去、移到滚动外，或让复燃早于熄灭，就失去“同一滚动中救活同一根蜡烛”的作品身份。
    - 把已知火源替换为无需规划的自动点火，或让核心滚烛只是被动经过事件序列，玩家不再亲自构造与使用核心关系。
    - 若其它蜡烛可替换成静态火盆、墙或独立目标处理器而不改变核心计划，便不构成多蜡烛互相作用。
    - 若核心滚烛完成滚动后即可从题面退休，或删除复燃仍可沿同一计划获胜，滚后消费与反向约束均未成立。
    - 若把准备段或收尾段单独删除后只减少步数、不改变核心滚动的正确构造条件，则该段属于拼接，应删除而非保留。

level_brief:
  packaging_intent: complete_single_level
  expected_difficulty: 5
  expected_scale: >-
    由完整双向因果链所需的最小清晰空间决定；至少两根蜡烛，但不预设对象数上限、family、几何、机制组合或步数。
  expected_player_load: >-
    玩家需同时追踪几何滚动、火源与遮芯、蜡烛长度/明灭和全局倒计时相位，并用滚后约束反推滚前安排；
    负担应来自计划耦合而非长走路、重复搬运或迟缓试错。

