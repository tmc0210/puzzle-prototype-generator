prototype_context:
  confirmed_rules:
    - 正式胜利条件固定为玩家存活，并在完整回合结算后点亮全部火盆；不得使用 event_occurs。
    - global_burn_cycle 固定为 5，初始倒计时为 5；每个合法行动只推进一次倒计时，无效输入不产生 edge 也不推进倒计时。
    - 多格蜡烛沿长轴只能推动一格；从侧面推动会连续滚动到下一小步被实体阻挡，整次滚动仍只算一个行动。
    - 滚动每个小步都先结算接触；烛芯先因墙或其它烛身遮蔽而熄灭，再由已点火盆或外露明烛芯递归点火与点盆。
    - 滚动中间小步的点火、灭火和点盆会真实改变后续小步，但不会让滚动提前停止。
    - 行动接触结算后推进全局倒计时；从 1 进入燃烧边界时，所有此刻仍点燃的蜡烛同时从烛芯端缩短一格，单格蜡烛燃尽消失。
    - 燃烧结算后才处理玩家死亡与 all_braziers_lit 胜利；外露火焰对玩家有致死危险。
    - 初始布局不得触发静默点火、灭火或点盆；烛芯投影不占实体格，只在 cap 方向外一格产生接触与火源语义。
  win_condition: all_braziers_lit_after_full_turn_and_player_alive
  object_and_event_semantics:
    - 每根蜡烛的长度、轴向、烛芯方向、明灭与身体占格共同决定可推、可滚、火源、遮芯和燃烧后的几何。
    - 已点火盆是永久火源；外露已燃烛芯可直接点燃另一根外露烛芯，烛身接触本身不是点火来源。
    - 墙或其它烛身遮住已燃烛芯会在同一次小步中先灭火；重新外露不会自动复燃，必须遇到已知火源。
    - 同回合滚动先熄灭后复燃由 roll_reignite_after_extinguish 标识，但事件出现本身不证明必经、有效使用或作品质量。
    - midcycle ignition 不重置全局节拍；边界行动中新点燃会立即参加燃烧，边界行动中先熄灭则避开本次燃烧。
  allowed_mechanisms:
    allowed_exposure_through: roll_reignite_after_extinguish
    branches:
      - global_countdown
      - axis_push
      - flame_lights_brazier
      - exposed_flame_danger
      - candle_shrink
      - wall_extinguish
      - countdown_without_fire
      - wick_reexposed_unlit
      - candle_burn_out
      - side_roll
      - multi_cell_roll_one_turn
      - ignite_from_brazier
      - ignite_from_wick
      - candle_body_extinguish
      - simultaneous_burn
      - midcycle_ignition
      - boundary_extinguish_avoids_burn
      - boundary_ignite_participates
      - roll_intermediate_lights_brazier
      - roll_intermediate_ignition
      - roll_intermediate_extinguish
      - roll_reignite_after_extinguish
    selection_policy: >-
      不预设必须组合哪些机制；只有移除某机制会改变合法计划、顺序判断、对象职责或胜解时，才计为有效使用。
  tool_boundary:
    - 可用 Candle runtime adapter、ASCII parser/renderer、solver、完整图枚举、layout analyzer、try-inputs replay、diagnostic probes 与 exposure audit。
    - exposure gate 只有完整可达图、verdict=pass 且 forbidden_hits 为空才通过；exhausted 未命中只能是 unknown。
    - Candle 专属 miner、candidate factory 与 PuzzleScript exporter/checker 未实现，不得用其它原型结果替代 runtime 证据。
    - batch_003 已补足“暗越未点火盆”这一持久历史载体与复燃后的对象存续分歧；Designer 可将其变形后进入唯一候选设计与完整自查。

player_context:
  basic_sokoban_experience_assumed: true
  player_prior:
    - 玩家已掌握 roll_intermediate_extinguish 及之前的全部机制、衍生技巧与计算。
    - 玩家拥有全图视野，能稳定理解基本几何、烛芯投影、滚动终点、火源与倒计时结算，不把执行错误当谜题内容。
    - 玩家已试玩前序关“回焰门”，认为其不差但不够难；新关必须在人类推理深度与解法精彩程度上明显超过它。
  prerequisite_mechanisms:
    - global_countdown_through_roll_intermediate_extinguish
  known_prior_level_refs:
    - prototypes/candle_sokoban/reports/studio_roll_reignite_multicandle_capstone_restart_20260724/calibration/prior_reignite_consumed_v1_replay.json
  predecessor_reading: >-
    前序用一根三格蜡烛完成同回合墙熄灭、火盆复燃与中途点盆，之后经燃烧缩短、再次滚动和复燃收束；
    新关不能只把相同事件链加长或增加对象，而要让多根蜡烛相互改变计划并产生滚后反向约束。

experience_seed:
  human_seed: >-
    玩家必须规划一次多格滚动，使同一根蜡烛在滚动途中先被墙熄灭、再从已知火源重新点燃，
    并在滚动结束后继续消费这个结果才能获胜；同时尽可能探索 Candle 后期上限，让至少两根蜡烛发生不可拆分的互相作用。

