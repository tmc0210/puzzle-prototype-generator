required_outputs:
  - 更新 experience_brief 的 task exploration 引用与材料充分性状态，不改变人类体验种子或唯一 candidate id。
  - 维护难度 5 的简短 reasoning sketch，只在结构命题实质变化时更新。
  - 从首个正式布局起制作完整终局关；局部材料不得直接作为 candidate exact。
  - 只有完整路线、玩家逻辑解族、身份反事实、对象参与和 complete exposure audit 全部通过后，才发布一个新的 immutable exact。
  - 当前 exact 必须包含 layout、all_braziers_lit solve instance、非空 canonical replay 的全部逐步状态与事件。
  - solution uniqueness 自查必须是 unique_complete、unique_within_budget 或 equivalent_variants_only；发现已知非等价胜解时继续工作而不发布。
  - exposure audit 使用 allowed_exposure_through=rolling_contact_chain，且 graph.status=complete、verdict=pass、forbidden_hits 为空。
  - 发布完整玩家侧 design reading、原始机械 artifacts 与 Designer submission packet；明确所有可感缺点或 none_identified。
  - 不写 candidate_ledger、dispatch、Critic packet/review、levels、playable_queue 或人类 handoff。
