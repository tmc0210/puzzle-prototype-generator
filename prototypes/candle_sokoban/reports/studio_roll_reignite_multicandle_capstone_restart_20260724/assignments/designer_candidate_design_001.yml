design_brief: >-
  在同一个连续 Design Studio 工作台中自主制作唯一完整单关，目标难度为 5（用户要求的
  难度 4 或更高下界之上）。玩家已掌握 candle_sokoban 全部机制、衍生技巧与计算。
  体验核心和作品身份以 experience_brief.yml 为准：至少两根蜡烛必须形成不可拆分的
  双向因果链，核心多格侧滚须在同一次滚动中先因墙遮芯熄灭、再从已知火源复燃，
  且滚后结果必须被继续消费并把约束传回滚前选择。第三批 task-local 材料只提供
  可提取、变形或舍弃的局部语料，不指定 family、布局、对象数、机制组合或后继用途。
  若材料已足够，持续工作直到发布完整 immutable exact 与 submission packet；
  若确实不足，只提交新的坐标无关 Explorer request 后返回 Controller。
