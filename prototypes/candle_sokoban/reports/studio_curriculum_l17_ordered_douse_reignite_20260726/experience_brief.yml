material_selection_account:
  selected_relation: >-
    采用等距反向滚道的局部关系：墙把燃态写灭，已亮火盆把燃态写燃；初始燃烧时两种写入不交换，
    d5 同构火焰插口直接读取最后状态。
  runtime_readback:
    douse_then_reignite: >-
      `up,right,down` 全部合法；核心滚动 d5，d1 extinguish_by_wall、d2 wick_reexposed_unlit、
      d3 ignite_from_brazier、d5 light_brazier；最终 candle lit=1、consumer lit=1、countdown=2。
    source_then_douse: >-
      `down,right,up` 全部合法；核心滚动 d5，d1 火源对初始燃态幂等且无 ignite，
      d3 extinguish_by_wall、d4 wick_reexposed_unlit；最终 candle lit=0、consumer lit=0、countdown=2。
    counterfactuals: >-
      删墙退化为普通常燃输出；删火源只剩灭火；d2 截停删去第二次写入；consumer 横移保留燃烧终态却失去点盆读取。
  retained_for_design:
    - 同一初态内由玩家选择相反接触顺序。
    - 两路准备步数、滚距、对象长度和倒计时相同，使终点差异归因于最后写入。
    - 墙与火源均为严格非终点接触，consumer 只在终点读取。
    - 反序首个火源接触只作幂等写燃，不宣称产生 ignite 或两路事件多重集相同。
  not_carried_forward_as_level:
    - Explorer 的具体 8x13 镜像 ASCII、绝对坐标和 d1/d3/d5 距离不是正式候选。
    - 两步开放走位只是等长控制，不构成难度、前序或玩家选择。
    - 两端同时存在的未亮火盆是局部测量仪器；不能原样变成 all_braziers_lit 下必须额外清理或无法同时完成的双目标。
    - 本批没有完整可达图、完整关卡解族、难度或审美结论，不能替正式 exact 背书。

