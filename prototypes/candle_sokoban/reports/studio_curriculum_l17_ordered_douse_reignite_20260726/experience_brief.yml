prototype_context:
  confirmed_rules:
    - 玩家可沿蜡烛长轴推动一格，也可从侧面触发滚动；滚动直到下一小步被实体阻挡。
    - 侧滚的每个小步都立即按“先灭火、再递归点火/点盆”结算接触，途中变化不会让滚动提前停止。
    - 烛芯被墙或另一根蜡烛烛身遮住时熄灭；外露未燃烛芯可从已亮火盆或已燃烛芯接火。
    - 每个合法行动只推进一次共享倒计时；global_burn_cycle 固定为 5，滚动距离不增加行动成本。
    - 燃烧边界只缩短结算时仍燃烧的蜡烛；新点燃者可参加当次边界，已熄灭者避开缩短。
    - 无效输入不是 runtime edge 且不推进倒计时；初始布局不得依赖静默点火、灭火或点盆。
  win_condition: 玩家存活，并在完整回合结算后点亮全部火盆。
  object_and_event_semantics:
    - 多格蜡烛是刚体；cap 方向之外一格是非实体烛芯投影，火焰位于外露且已燃的烛芯投影。
    - 已亮火盆永久保持点亮并成为火源；火焰会杀死进入其格的玩家。
    - 本关核心中的墙接触和火源接触都是对同一滚烛燃烧状态的写入；路径中最后一次有效写入决定终点亮灭。
    - 反序路的首次火源接触对初始燃烛可能是幂等，不把两路误写成具有相同事件多重集。
  allowed_mechanisms:
    - basic_candle_manipulation
    - wall_dousing
    - shared_fire_and_reignition
    - body_concealment_and_reexposure
    - retreating_flame_transfer
    - rolling_contact_chain
  tool_boundary:
    - 可用 runtime adapter、ASCII parser/renderer、solver、完整图、layout analyzer、runtime-backed playable、诊断 probe 和 exposure audit。
    - Candle 专属 miner、candidate factory、PuzzleScript exporter/checker 未实现；不得用其它原型工具结论替代 Candle runtime 证据。
    - 当前阶段不运行 layout、solve、replay、diagnostic 或 exact 工具；只固定体验简报和校准。

