prototype_specific_routing:
  - allowed_exposure_through 固定为 rolling_contact_chain；正式 exact 必须在完整可达图上 exposure complete/pass 且 forbidden_hits 为空。
  - 正式候选固定使用 all_braziers_lit，不得使用 event_occurs。
  - 课程探索 probe 与 optional direction 只证明体验核心可行，不能直接充当候选布局或 exact。
  - knowledge.yml、curriculum.yml、diagnostic levels.yml、旧 Candle reports 和未发布探索材料均禁止作为设计来源。
  - 首批 task lexicon 已读取并完成材料选择；只有 Controller 后续发出 candidate_design assignment 后才可开始正式布局。
  - 当前 experience_brief assignment 结束时 candidate_id 仍为 null，不运行 solve、replay、diagnostic，也不发布 exact。

human_review_constraints:
  - 不把唯一显然滚道、强制按钮或“把眼前对象推到底”包装成难度 5。
  - 不把灭火、复燃、途中事件数量或完整图指标当作正向审美价值。
  - 不用重复同构步骤、无关子题、单行道前奏或高潮后清理抬高规模。
  - 所有高 affordance 对象都要在玩家侧兑现职责，避免轨道、火源或可动接触体只作读题污染。
  - 错误顺序应产生接近、可理解的终态差，而不是大量反馈迟缓 deadend。
  - 优先保持紧凑因果链、对象强耦合、延迟回读和可预见的反直觉选择。
  - 不把 Explorer 的两只未亮终点盆原样变成正式双目标；成功后的 all_braziers_lit 收束必须直接、无额外清理子题。
