experience_core:
  experience_statement: >-
    玩家把一记长滚读成有先后次序的状态程序：在两个局部都说得通的滚法中，主动选出让墙先熄灭、
    火源后复燃的顺序，使同一滚烛以燃烧终态抵达；反序虽经过同样两类接触位置，却以未燃终态抵达。
    两路不是相同事件多重集的换序：反序首次火源接触对初始燃态为幂等，不产生 ignite。
  visible_setup: >-
    开局清楚展示同一根初始燃烛、可比较的两个滚动方向或轨道、各自严格位于终点前的遮芯接触与火源接触，
    以及几何同构、只读取终态火焰的终点 consumer；不能在构图上直接把正确顺序标成唯一答案。
  player_action: >-
    玩家先完成与最终顺序直接相关的必要定位或路线选择，再亲自触发一记连续长滚，
    让同一根蜡烛依次经过两个接触写入点。
  visible_payoff: >-
    正确顺序在滚动终点留下清楚可见的燃烧烛芯，并立即通过同构火焰插口完成必要输出；
    反序到同类终点时烛芯未燃，接口保持沉默，玩家能回读最后一次有效写入为何覆盖前态。
  why_level_exists: >-
    L16 已把侧滚路径和终点作为两套职责；L17 首次要求玩家把路径内部的接触次序当作非交换程序，
    并让终点只读取程序的最终状态。这一“顺序覆盖→终态读取”关系不能由 L16 的双职责替代。
  core_boundary:
    central_objects:
      - 同一根被滚动且被连续写入燃态的蜡烛
      - 产生遮芯灭火的接触关系
      - 在后序位置重新点火的火源接触关系
      - 让玩家选择接触顺序的方向、轨道或可移动接触体
      - 几何同构并直接读取最终亮灭的终点火焰插口
    supporting_objects:
      - 为两个局部合理方案提供操作面的墙与必要站位
      - 把终点状态接入 all_braziers_lit 的必要火盆
      - 只用于压缩路径、阻止旁路或快速收束的边界墙

work_identity:
  conditions:
    - 同一初态内存在至少两个局部合理、由玩家可主动选择的接触顺序；不是两张对照图或唯一合法滚法。
    - 同一根滚烛在一次连续长滚中同时经历遮芯写入和火源写入，途中接触不让滚动提前停止。
    - 墙→火源得到燃烧终态，火源→墙得到未燃终态；成功与失败的对象长度、滚距和倒计时成本保持可比。
    - 两端 consumer 的几何与职责同构，直接区分滚动结束时的亮灭，而不是读取不同距离、不同长度或额外对象身份。
    - 终点输出属于标准 all_braziers_lit 胜利链，且没有其它火源或后续复燃旁路替代滚动所得终态。
    - 必要准备会压缩顺序选择，主要对象在核心前后继续承担同一关系；高潮后尽快结束。
    - 新意只属于顺序覆盖与终态读取；L16 的逐小步结算和路径/终点双职责只作为玩家先验。
  counterfactuals:
    - 删除遮芯接触后，成功路退化为普通燃烛滚到终点，顺序覆盖消失。
    - 删除后序火源后，只剩途中灭火，墙→火源不再恢复燃烧终态。
    - 把两路改成同一接触顺序、只留唯一合法轨道或让正确方向一眼可见，会退化成机制 witness。
    - 预亮终点、错开 consumer 或允许别处补火后，滚动终态不再被直接消费。
    - 把两次接触拆到两次行动，或到终点后再复燃，会破坏“一记长滚写完、终点立即读取”的作品身份。
    - 若难度主要来自同一输入末尾立即缩短/避烧和端帽释放，则作品已漂移到 S06_T03 边界提交方向。

level_brief:
  packaging_intent: complete_single_level
  expected_difficulty: 5
  expected_scale: >-
    紧凑中型；围绕一项主要顺序判断安排必要准备、一记核心长滚和立即终点读取，
    不用多个重复轨道、长前奏或高潮后清理扩容。
  expected_player_load: >-
    高推理、低执行摩擦。玩家需要比较两种局部都合理的接触次序，预见最后一次有效写入，
    并把终点火焰插口反向读成对早先路线的约束；不依赖规则遗忘、精确操作或大规模试错。

