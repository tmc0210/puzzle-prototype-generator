experience_seed:
  human_seed: >-
    玩家选择滚动方向、轨道或途中接触体，让同一根滚烛按墙→火源或火源→墙的顺序被连续写入；
    前者到终点燃烧，后者到终点未燃，再由同构终点 consumer 直接读取最终状态。目标相对难度为 5。

