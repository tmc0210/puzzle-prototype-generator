design_brief: >-
  基于已定稿 L17 experience_brief 与正式 task-local material，设计唯一完整单关候选。
  玩家必须在同一初态中主动比较至少两个局部合理的接触顺序，让同一根滚烛在一次连续长滚中经历墙灭与火源写入；
  墙→火源留下燃烧终态，火源→墙留下未燃终态，并由同构终点 consumer 立即读取。L16 的逐小步结算与
  路径/终点双职责只是先验；本关新意必须是最后有效写入覆盖前态。目标难度 5，但不能靠唯一显然轨道、
  事件数量、长前奏或高潮后清理。可离开 probe 的布局、方向、d1/d3/d5 与 consumer 形式并启动新结构族，
  只要作品身份与 all_braziers_lit 闭环不变。
