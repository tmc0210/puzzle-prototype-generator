required_outputs:
  - 物化并持续修订唯一工作布局，实际运行 runtime-backed replay、solver、complete graph、exposure 与候选专属反事实；不得只停留在文字规划。
  - 维护难度 5 reasoning sketch 和玩家侧重读，证明两个接触顺序都局部合理、终点读取同构且错误顺序反馈接近可读。
  - 检查每个主要元素职责、高潮后收束、非拼接前序/后继及所有已知胜解的玩家逻辑等价；顺序程序不得被别处补火或预亮 consumer 旁路。
  - 只有完整关卡和全部自查成立时发布一个不可变 exact version 与完整 submission packet；已知非等价胜解则继续修订或 withdraw。
  - exact 必须使用 all_braziers_lit，提供 rolling_contact_chain complete/pass exposure 与供 fresh Evidence Reviewer 独立核验的原始 artifact。

