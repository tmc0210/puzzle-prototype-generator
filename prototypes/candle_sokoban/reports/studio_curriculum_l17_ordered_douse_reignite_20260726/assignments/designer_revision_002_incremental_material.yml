design_brief: >-
  延续 post-archive revision。Controller 已核验并授权第二批 task-local material：第一次把可移动遮芯体承诺在共享火源前/后，
  第二次用可移动 stopper 选择近停/远停，近远 consumer 的需求形成 2×2 输出矩阵并反向筛选第一次承诺。
  可把该关系作为新结构材料，但不得复制 probe 完整布局，也不得把可移动对象放好后与静态墙完全等价的事实包装成额外洞见。
  正式关卡必须让两次选择在同一玩家流程中连续成立；Explorer 尚未在一个无边界 trace 中串起第一次入位与第二判断，
  共同缩短只是背景，不能由 Designer 假定为已证明。仍保持“设计并行、资格门串行”：可以发布新 exact，
  但 L16 新合格 delivery 更新 prior 并完成 impact audit 前不得启动 Reviewer/Critic/交付。
