design_brief: >-
  为 Candle Sokoban 课程第 17 关固定玩家侧体验核心：玩家选择滚动方向、轨道或途中接触体，
  让同一根滚烛按墙→火源或火源→墙的顺序被连续写入；前者到终点燃烧，后者到终点未燃，
  再由同构终点 consumer 直接读取最终状态。目标相对难度为 5。玩家已完成 L16，知道逐小步接触与
  路径/终点双职责；本关的新意必须是顺序覆盖与终态读取。请先独立完成 clean archive 校准，
  不得把课程探索 probe 直接当正式候选。
