      #....r.#
      #....o.#
      #....O.#
      #......#
      #......#
      #......#
      #....o.#
      #@r....#
      ########
    actions: [right]
    inputs: [right]
  - id: replace_contact_with_wall
    family: post_commitment_fixed_object_boundary
    variant: fixed_wall_dousing
    changed_variable: "把 d1 单格遮芯烛身换成固定墙，保留远 stopper"
    contrast_with: early_contact_far_stop
    notes: "核验已放置烛身的灭火效果是否可由固定墙复现；差异只应在来源标签与可移动性。"
    layout_ref: layouts/replace_contact_with_wall.txt
    layout: |
      ########
      #..@...#
      #..1R..#
      #....#.#
      #....o.#
      #....O.#
      #......#
      #......#
      #......#
      #....o.#
      #..r...#
      ########
    actions: [down]
    inputs: [down]
  - id: replace_stopper_with_wall
    family: post_commitment_fixed_object_boundary
    variant: fixed_wall_stop
    changed_variable: "把远端单格 stopper 换成固定墙，保留 d1 遮芯烛身"
    contrast_with: early_contact_far_stop
    notes: "核验已放置 stopper 的止滚效果是否可由普通墙复现。"
    layout_ref: layouts/replace_stopper_with_wall.txt
    layout: |
      ########
      #..@...#
