  - id: post_early_commit_choose_far
    family: post_commitment_integrated_trace
    variant: early_then_far
    changed_variable: "d1 遮芯已承诺后，把近 stopper 向左推出主烛体列，保留远 stopper"
    contrast_with: [post_early_commit_choose_near, post_late_commit_choose_far]
    notes: "第二判断发生在首个输入；等步走位后主烛已同构缩成二格，再以一记 d7 滚动完成 d1 灭、d3 复燃、d7 远盆读取。"
    layout_ref: layouts/post_early_commit_choose_far.txt
    layout: |
      ########
      #......#
      #..11R.#
      #....r.#
      #....o.#
      #.r@.O.#
      #......#
      #......#
      #......#
      #....o.#
      #..r...#
      ########
    actions: [left, up, up, up, up, right, down]
    inputs: [left, up, up, up, up, right, down]
