revision_001_structure_hypothesis:
  proposition: >-
    主烛 A 初始未燃；先滚向上端或下端时，在靠近该端的固定火源处点燃并点亮第一只 consumer。
    随后玩家把横向单格烛 Q 先侧滚到上/下端邻行，再沿轴推入 A 的 wick-only 程序列。
    A 与 Q 放在同一端时，回程长滚先被 Q 烛身灭火、再经过固定火源复燃，另一端 consumer 读取燃态；
    放在异端时，最后一次 Q 遮芯发生在最后火源之后，另一端保持未亮。
  post_commitment_judgment: >-
    第一次选择 A 的端点后，Q 的上/下位置仍未决定；Q 的正确位置由 A 的回程方向决定。
    反过来，若玩家先只把 Q 侧滚到候选端侧但尚未推入程序列，之后 A 的端点也必须与之配对。
  structural_compaction: >-
    两只 endpoint consumer 同时作为 Q 侧滚的纵向 stopper；Q 的 body 只进入 A 的 wick 投影列，
    不实体截停主滚；两端固定火源同时负责首次端点点燃与回程复燃。
  principal_risk: >-
    即使机械真值表成立，玩家也可能只读到“主烛与小烛放同一边”的显眼配对，仍仅属难度3；
    若玩家侧没有非局部的最后写入预见，不发布新 exact。
structure_change_history:
  - version: workbench_001
    proposition: >-
      以两端真实目标取代 Explorer 的双测量盆问题：任一路先点亮出发端，
      只有上→下的墙→火源贯穿滚动能立即点亮另一端并胜利。
  - version: workbench_005
    proposition: >-
      压缩为 11x13 后局部关系和完整 exposure 均成立，但完整图发现错列长滚后可在终点横推补点，
      因而没有达到作品身份。
  - version: workbench_006
    proposition: >-
      上下端帽用 x=2/x=8 双 stopper 分别截停初始 body 与正确对齐 body；
      错列 body 越过 consumer 行并被端墙锁住，完整图中所有胜解开始强制同一顺序程序。
  - version: workbench_007
    proposition: >-
      删除端帽后方四个无职责单格地板；canonical、反序、完整 exposure、解族与八项近邻对照重跑通过，
      玩家侧重读认为可送独立审查，难度 5 仍明确留给 fresh Critic 校准。
  - version: exact_001_post_archive_reassessment
    proposition: >-
      新增 Candle 专属人评档案后撤销送审判断。exact_001 虽机械闭合，但玩家只在开局做上/下二择，
      上向 d4 后决策空间坍塌，直接落入 CANDLE_CAND_0003 的审美1/难度2失败族；
      保持 exact_001 不可变，后续必须在同一 candidate 内换结构族。
  - version: revision_001_workbench_008
    proposition: >-
      从暂停点概念改为双端固定火源 + 可移动横向单格烛 Q。A 初始未燃以避免准备期计时漂移；
      A 首次到端由该端火源点燃并取得 consumer，Q 再进入同端邻行作为回程的首个灭火写入。
      当前仅物化最小工作布局，尚未获得 runtime 支持。
