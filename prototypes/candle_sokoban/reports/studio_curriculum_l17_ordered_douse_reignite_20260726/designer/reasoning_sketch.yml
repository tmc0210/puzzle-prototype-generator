target_difficulty: 5

player_relation:
  opening_question: >-
    同一根燃烛可以先送到上端或下端；两个端点都能以相同步骤先点亮一个目标，
    玩家必须预见随后贯穿全轨时墙和火源的相对次序，不能只追逐眼前目标。
  structural_hypothesis: >-
    上端发车后，核心长滚按墙→火源到达下端，留下燃烧终态并点亮第二盆；
    下端发车后，同距长滚按火源→墙到达上端，最后写成未燃并留下第二盆未亮。
    两路起点准备、初次目标回报、滚距、长度和倒计时保持同构。
  payoff: >-
    正确路在同一记贯穿滚动里从中途墙灭恢复到燃烧，并在另一端立即完成 all_braziers_lit；
    错误路同样先取得一盆，却在另一端以未燃烛芯停住，直接揭示最后写入覆盖前态。

packaging_claim:
  opening: 中央长燃烛与上下同构端点同时可见；玩家可主动选择先去上端或下端。
  preparation: >-
    端点定位与轴推直接点亮第一只目标，并把缩短后的蜡烛对齐到共同写入列；
    不添加独立子题，两个方向使用同构输入骨架。
  core: 一次连续贯穿侧滚经过严格非终点墙 / 火源接触，并在另一端由同构未亮火盆读取。
  ending: 正确滚动的终点点盆即刻满足 all_braziers_lit，不追加回程或清理。

counterfactual_targets:
  - 删除墙后两种发车都退化为常燃输出，错误路也可点亮第二盆。
  - 删除中途火源后，正确路墙灭后无法复燃。
  - 预亮任一端点目标会削弱“先取一盆、再预见另一端”的顺序选择。
  - 移开终点盆后仍可写出终态，但作品没有直接 consumer。
  - 若存在不经过墙→火源核心滚动的胜解，当前 family 必须继续修订。

current_structure_family: coupled_main_endpoint_and_movable_body_contact_commitments
