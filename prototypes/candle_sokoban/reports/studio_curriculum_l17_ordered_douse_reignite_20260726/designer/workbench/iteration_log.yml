candidate_id: CANDLE_CURRICULUM_L17_ORDERED_DOUSE_REIGNITE_001
workbench_status: mutable

iterations:
  - version: workbench_001
    layout_shape: symmetric_staging_then_full_track_order_program
    actual_runtime_check:
      command: >-
        npx tsx src/cli.ts try-inputs prototypes/candle_sokoban
        prototypes/candle_sokoban/reports/studio_curriculum_l17_ordered_douse_reignite_20260726/designer/workbench/layout.txt
        --id CANDLE_CURRICULUM_L17_ORDERED_DOUSE_REIGNITE_001
        --inputs right,down,right,up,left,up,up,up,up,right,right,up,right,down
      result: failed_as_expected_after_geometry_review
      legal_through_step: 9
      stopped_at_step: 10
      stop_reason: axis_push_blocked
      decisive_events:
        - step_4_roll_d4_crossed_main_wall_at_d2
        - extinguish_by_wall:candle#1
        - endpoint_consumer_remained_unlit
    diagnosis: >-
      初始 wick 已在主程序列 x=9；预备上滚先经过灭火墙，错误地提前执行一次写状态，
      并以未燃、未收缩的长度抵达上端，随后端侧轴推被 consumer 挡住。
    disposition: replaced_in_place_same_candidate

  - version: workbench_002
    change: >-
      将初始横烛及首段 consumer 整体左移一列，使预备滚在 x=8 只点亮所选端点；
      三次端侧右推配合两个燃烧边界，把最终 wick 对齐到独立的主程序列 x=9。
    intended_top_sequence:
      - down
      - right
      - up
      - left
      - up
      - up
      - up
      - up
      - right
      - right
      - right
      - up
      - right
      - down
    intended_bottom_sequence:
      - up
      - right
      - down
      - left
      - down
      - down
      - down
      - down
      - right
      - right
      - right
      - down
      - right
      - up
    pending_checks:
      - actual_runtime_replay_both_orders
      - solver_complete_graph
      - no_bypass_and_solution_family
    actual_runtime_check:
      result: both_routes_blocked_at_step_10
      stop_reason: axis_push_blocked
      diagnosis: >-
        端点 consumer 虽允许 wick 投影重叠，却是 solid；首次右推后它位于下一次 body
        平移目标格，因而阻断后续对齐。两路都在预备 roll 正常点亮所选 consumer，
        说明预备轨与主程序列已经成功分离，但端点必须从轴推行移走。
    disposition: replaced_in_place_same_candidate

  - version: workbench_003
    change: >-
      把两枚预备 consumer 从 staging 终点移到各自 d3 的严格途中格；
      它们仍在对称预备 roll 中提供相同即时奖励，却不再阻塞终点行的三次轴推。
    pending_checks:
      - actual_runtime_replay_both_orders
      - exact_core_event_order_and_terminal_read
      - solver_complete_graph
    actual_runtime_check:
      result: both_routes_reached_step_13_but_core_roll_blocked
      stop_reason: roll_blocked
      diagnosis: >-
        最终主滚 body 覆盖 x=5..8，因此 x=8 的途中 consumer 会在第一小步成为实体阻挡；
        永久目标不能同时作为预备奖励并留在主滚的 body 扫掠带内。
    disposition: replaced_in_place_same_candidate

  - version: workbench_004
    change: >-
      删除途中预备 consumer；改在 x=9 的上、下 staging 行各放同构终点插口。
      初始 wick 在 x=8，因此预备滚不会读它们；三次右推后的最后一次轴推把起点插口点亮，
      随后的全轨主滚仅以 body x=5..8 经过通道，在另一端由 wick x=9 读取最终亮灭。
    expected_core:
