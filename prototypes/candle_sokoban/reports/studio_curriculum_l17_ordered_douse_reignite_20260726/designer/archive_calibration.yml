all_aesthetic_1_records_read:
  - candidate_id: CANDLE_CAND_0003
    candidate_ref: prototypes/candle_sokoban/design_archive/candidates/CANDLE_CAND_0003.md
    human_comment_ids: [HP_CANDLE_CURRICULUM_L16_PATH_OUTPUT_ENDPOINT_001_exact_001_001]
    layout_read: true
    calibration_read: >-
      这是与当前课程和 runtime 完全同域的最高权重反例：L16 虽有长滚路径输出、尾端接口和完整硬证据，
      人类实际只读到“先推左上还是右下”的开局二择；一旦先推左上，后续盲目右推，决策空间坍塌。
      审美1、难度2直接否定把单次开局选择后的自动机械链声称为难度5。
  - candidate_id: ICE_CAND_0002
    candidate_ref: prototypes/ice_slide_escape/design_archive/candidates/ICE_CAND_0002.md
    human_comment_ids: [HC_001]
    layout_read: true
    calibration_read: >-
      工具支持、事件命中和局部 dead commitment 没有转化为玩家思考；玩家只需按直觉推眼前对象，
      且可达 d5 是致命规则外溢。L17 不能让正确滚道成为唯一显然动作。
  - candidate_id: ICE_CAND_0004
    candidate_ref: prototypes/ice_slide_escape/design_archive/candidates/ICE_CAND_0004.md
    human_comment_ids: [HC_001]
    layout_read: true
    calibration_read: >-
      三次简单 d4 的重复仍只是教学。L17 即使连续出现多次灭火/复燃，也不能把重复事件当作难度或应用。
  - candidate_id: ICE_CAND_0011
    candidate_ref: prototypes/ice_slide_escape/design_archive/candidates/ICE_CAND_0011.md
    human_comment_ids: [HC_ICE_CAND_0011_001]
    layout_read: true
    calibration_read: >-
      顺序逻辑成立仍可因冗余墙地、可删开局、未披露多解与正例形状污染而整体失败；
      L17 的必要准备必须参与同一顺序判断，画布和解族声明都要干净。
  - candidate_id: ICE_CAND_0037
    candidate_ref: prototypes/ice_slide_escape/design_archive/candidates/ICE_CAND_0037.md
    human_comment_ids: [HC_ICE_CAND_0037_001]
    layout_read: true
    calibration_read: >-
      三个无洞见步骤的拼接和接口外溢不能靠完整图、required event 或 review-ready 补偿；
      L17 必须有真实的顺序比较与严密终点读取。
  - candidate_id: RA_CAND_0024
    candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0024.md
    human_comment_ids: [HP_RA_FRESH_2026_07_08_PULL_BRUSH_RETURN_v4_wall_trim_001]
    layout_read: true
    calibration_read: >-
      高 affordance 对象会抬高玩家期待；若最终只兑现普通腾挪，机制利用率再高也失败。
      L17 出现的轨道、火源和可动接触体都必须承担实际顺序选择责任。
  - candidate_id: RA_CAND_0027
    candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0027.md
    human_comment_ids: [HP_RA_FRESH_2026_07_09_VACATE_MATERIAL_LOCK_v4_001]
    layout_read: true
    calibration_read: >-
      事件标签齐全但没有使用对象的结构性质，是 affordance 污染。L17 的接触链要由玩家操纵，
      不能只在 replay 中自动触发漂亮标签。
  - candidate_id: RA_CAND_0030
    candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0030.md
    human_comment_ids: [HP_RA_FRESH_2026_07_12_CUT_REBIND_ORTHOGONAL_v7_001]
    layout_read: true
    calibration_read: >-
      大地图、多对象和反馈迟缓 deadend 若没有相称亮点，就是高设计成本低回报；
      L17 应让错误顺序的反馈接近且可读，不用大量迟滞分支堆难度。
  - candidate_id: RA_CAND_0031
    candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0031.md
