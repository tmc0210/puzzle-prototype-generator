current_candidate_recalibration:
  assessed_version: exact_001
  submission_status: rejected_before_dispatch
  direct_similarity_to_negative_archive: >-
    exact_001 的玩家内容同样集中在开局“先上还是先下”的单次二择。正确上端发车后，
    余下是沿左边回到端行、连续右推直到对齐、绕到操作面并触发唯一向下 d8；
    虽然 d8 内的墙→火源覆盖比 L16 机械主题更纯，但玩家决策空间在首个 d4 后已经坍塌。
  revised_difficulty_prediction: 2
  revised_aesthetic_prediction: 1_to_2
  verdict: do_not_submit_exact_001
  required_next_structure: >-
    同一 candidate 必须换结构族；首次承诺后仍要有至少一个会反向约束开局选择的实质判断，
    且不能依赖燃烧边界、重复轴推或更多静态轨道把规模伪装成难度。
