l17_calibration_conclusions:
  positive_requirements:
    - 玩家在长滚发生前面对至少两个局部合理的顺序方案，并亲自选择方向、轨道或接触体安排。
    - 早先选择的意义由终点的同构 consumer 直接揭示；正确顺序不是唯一可走线的被动演出。
    - 同一根滚烛、两次接触和终点读取形成紧凑因果链，主要对象不在核心前后退休。
    - 难度 5 来自预见“最后一次有效写入覆盖前态”的非局部计划，而非步数、事件数或慢反馈 deadend。
    - 首次方向/对象承诺后必须仍保留至少一个非盲推、非重复输入的实质判断，并让它与终态读取共同约束前一步；不能只在开局做一次二择。
    - 若使用多对象或顺序锁，后段必须重读前段留下的关系，且达到比 CANDLE_CAND_0004 的紧凑常规流程更高的耦合度。
  rejection_signals:
    - 只需按可见轨道或唯一合法方向滚动。
    - 把多次灭火、点火或途中事件的覆盖数当成玩家内容。
    - 两条同构路径只是重复动作，或一条路径明显是装饰性假分支。
    - 终点火盆已预亮、可被别的火源完成，或 consumer 不区分滚烛最终亮灭。
    - 无关前序、高潮后清理、冗余空间或高 affordance 但无职责的对象抬高规模与期待。
    - 开局二择后，剩余动作只是沿墙走位、连续同轴推或触发已经唯一的长滚；这是 CANDLE_CAND_0003 的直接失败族。
    - 把普通二择包装成写入/读回，或用完整图强制事件掩盖玩家洞见弱；这是 CANDLE_CAND_0002 的下界。
  course_specific_boundary: >-
    L16 已实际教会逐小步接触与路径/终点双职责；L17 只把“接触顺序覆盖并由终态读取”作为新意。
    同一输入在燃烧边界立即触发缩短/避烧属于后续 S06_T03 方向，不应抢占本关体验核心。

