unverified_next_structure_hypothesis:
  family_name: post_commitment_player_placed_dousing_contact
  status: conceptual_only_no_layout_no_runtime
  relation: >-
    主滚烛 A 的第一次承诺仍是送到上端或下端；承诺后，玩家再操纵一根未燃单格竖烛 Q，
    先沿轴选择上方或下方行，再侧滚到 A 的 wick-only 列。Q 的烛身作为可移动遮芯写入，
    固定已亮火盆作为另一写入；第二选择必须依据 A 的发车方向决定 Q 放在火源之前还是之后。
  intended_truth_table:
    - first_commitment: A_top_then_roll_down
      second_judgment: Q_above_source
      path_order: Q_body_douse_then_source_reignite
      intended_terminal: lit_success
    - first_commitment: A_top_then_roll_down
      second_judgment: Q_below_source
      path_order: source_then_Q_body_douse
      intended_terminal: unlit_failure
    - first_commitment: A_bottom_then_roll_up
      second_judgment: Q_below_source
      path_order: Q_body_douse_then_source_reignite
      intended_terminal: lit_success
    - first_commitment: A_bottom_then_roll_up
      second_judgment: Q_above_source
      path_order: source_then_Q_body_douse
      intended_terminal: unlit_failure
  conceptual_geometry_constraints:
    - A 的最终 body 与 Q 必须分列；Q 只占 A 的 wick projection 列，不能实体阻断主滚。
    - Q 初始位于程序列左侧，先可上下轴推，再向右侧滚到固定 stopper；上/下位置在 A 第一次承诺后仍可选。
    - 上下终点 consumer 必须同构；任一正确组合在一次主滚终点立即 all_braziers_lit，不追加清理。
    - 固定火源位于两种 Q 位置之间，使主滚方向与 Q 位置共同决定写入顺序。
  why_it_may_escape_exact_001_failure: >-
    第一次上/下承诺不再唯一决定答案；承诺后仍需把 Q 放到与发车方向匹配的一侧，
    第二判断会反向解释第一次承诺，玩家不能在首次 d4 后盲推到底。
  known_risks_to_test_after_resume:
    - 真值表可能仍只是“方向×位置”的显式二阶段配对，只达到常规流程难度3；必须从玩家侧检验是否有真正非局部洞见。
    - Q 若只能在视觉上明显放到发车侧，第二操作会退化为执行而非判断。
    - Q 的移动、倒数和自身 wick 可能引入边界计时或意外火传播，抢走顺序核心。
    - 多个正确镜像组合必须证明玩家逻辑等价；任何错列、终点补推或其它火源旁路都要在完整图中排除。
    - 可移动烛身替代固定墙是否仍满足 revision 的体验身份，要在恢复后据更新 prior 与选定 material 重新核对。

