candidate_id: CANDLE_FRESH_03_RECEDING_FLAME_RELAY
candidate_version: v1
title: 退焰三渡

prototype_context:
  confirmed_rules:
    - 全局燃烧周期固定为 5；每次有效行动推进一次，无效输入不推进
    - 倒计时从 1 结算时，所有仍点燃蜡烛同步缩短或燃尽
    - 缩短后退火焰只在刚腾出的烛身格内点燃同格重新暴露的烛芯
    - 烛身遮挡烛芯时，已点燃蜡烛立即熄灭；滚动逐格处理接触
    - 玩家存活且全部火盆点亮时胜利
  win_condition: all_braziers_lit
  object_and_event_semantics: 以 CANDLE_SOKOBAN_DESIGN.md 和 CANDLE_SOKOBAN_ASCII.md 为准
  tool_boundary: >
    solver、完整状态图、反事实和事件门只支持机械事实；不据此宣称审美分数、
    人类感知难度或 campaign 位置。

slot_brief:
  intended_role: challenge_or_capstone_candidate
  target: >
    用三个连续退焰点火窗口、一次可见的遮火失败和两个不同火焰高度的目标，
    制作当前规则集下的高推理负荷单关。
  difficulty_expectation: target_3_plus_unscored_missing_human_archive_context

