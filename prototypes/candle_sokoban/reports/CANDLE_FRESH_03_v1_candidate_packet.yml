  mechanic_window:
    - stage: relay_lock_release
      new_events:
        - burn_out:candle#single5
        - shrink_ignite:candle#2
    - stage: first_transport_and_second_release
      new_events:
        - light_brazier:8,5
        - shrink_ignite:candle#3
    - stage: delayed_height_change_and_third_release
      new_events:
        - shrink_ignite:candle#4
        - light_brazier:1,4
    - stage: final_height_change_and_completion
      new_events:
        - light_brazier:1,7
  allowed_exposure_through: final_height_change_and_completion
  claimed_core_events:
    - shrink_ignite:candle#2
    - shrink_ignite:candle#3
    - shrink_ignite:candle#4
    - light_brazier:8,5
    - light_brazier:1,4
    - light_brazier:1,7
  latest_exposure_timing_check:
    derived_latest_event_stage: final_height_change_and_completion
    claimed_latest_exposed_event: light_brazier:1,7
    all_solution_required_evidence_ref: CANDLE_FRESH_03_REQUIRED_EVENTS_AUDIT.json
    canonical_occurrences:
      - step: 26
        operation_segment_ref: OP6
        reasoning_unit_refs: [RU3]
    status: later_phase_present
    revision_direction: none

design_target:
  aesthetic_score_target: unscored_missing_human_archive_context
  difficulty_score_target: target_3_plus_unscored
  target_role_notes: >
    作为最高难度方向候选送人工试玩；没有 clean human-reviewed archive，
    因此不声明量化难度、审美达标或正式 campaign 位置。

solve_instance:
  layout: |-
    ###########
    ######.####
    #....3.####
    #....3.####
    #o...d.####
    ###111R.o.#
    ####u.u...#
    #o..4.2U..#
    #...4@2...#
    #...4.#####
    ###########
  player_start: "5,8"
  player_goal: not_applicable
  win_condition: all_braziers_lit

mechanism_scope:
  central:
    - 母烛在前三个燃烧边界依次以 shrink_ignite 点燃 candle#2、candle#3、candle#4
    - candle#single5 在首个边界燃尽，解除 candle#2 的提前横滚实体锁
    - candle#3 必须先缩短使向下火焰上移，避开母烛遮挡行后再左滚
    - candle#4 必须在点燃后缩短两次，使向上火焰下降到左下火盆所在行
  allowed_support:
    - 有效走位推进固定五拍倒计时
    - 侧滚直到实体阻挡
    - 火盆永久点亮
  incidental_allowed:
    - 不改变非走路事件顺序的走位变体
  required_winning_path_events:
    - shrink_ignite:candle#2
    - shrink_ignite:candle#3
    - shrink_ignite:candle#4
    - light_brazier:8,5
    - light_brazier:1,4
    - light_brazier:1,7
  forbidden_winning_path_events: []
  forbidden_if_seen_anywhere: []

player_reasoning:
  canonical_trace_ref: level_analysis_CANDLE_FRESH_03_RECEDING_FLAME_RELAY.json
  player_goal:
    description: >
      点亮右侧、左上和左下三个火盆；每根子烛必须在自己的火焰高度与目标行
      对齐时横滚，同时避开母烛造成的遮火。
    state_ref: initial_state
  reasoning_units:
    - id: RU1
      player_question: >
        为什么第一根子烛开局不能滚，首个燃烧边界后又应在什么时候向右运输？
      premises:
        - statement: candle#2 右侧相邻格由开局点燃的单格锁烛占据，提前向右滚被实体阻挡
          state_ref: initial_state
        - statement: 母烛最右烛身遮住 candle#2 的朝上烛芯；两者会在首个边界同时改变
          state_ref: initial_state
      conclusion: >
        先用安全上下走位推进首个边界，使锁烛燃尽且母烛退焰点燃 candle#2；
        再把 candle#2 留到第二个边界动作向右滚，点亮右火盆并同步触发下一根子烛。
      operation_refs: [OP1, OP2]
      alternative:
        status: not_claimed
        description: 在锁烛燃尽前提前右滚 candle#2
        local_gain: none
        from_state_ref: initial_state
        exact_inputs: []
        result_state_ref: not_applicable
        concrete_outcome: 该输入会被实体锁烛阻挡且无效，不进入撤销历史
      feedback:
        - state_ref: canonical_after_step_5
          visible_change: 单格锁烛消失，母烛缩短，candle#2 点燃并获得向右滚动空间
        - state_ref: canonical_after_step_10
          visible_change: 右侧火盆点亮，candle#3 同时由第二次母烛退焰点燃
    - id: RU2
      player_question: >
        candle#3 已点燃且左侧火盆可见，为什么不能立即向左滚？
      premises:
        - statement: candle#3 的烛芯朝下，刚点燃时火焰位于第 5 行
          state_ref: canonical_after_step_10
        - statement: 母烛仍有烛身占据第 5 行的左滚路径，火焰经过该格会被遮挡
          state_ref: canonical_after_step_10
      conclusion: >
        必须先推进到第三个燃烧边界；candle#3 从烛芯端缩短后火焰上移到第 4 行，
        才能横越母烛上方并点亮左上火盆。
      operation_refs: [OP3, OP4]
      alternative:
        status: replayed_attempt
        description: candle#3 点燃后，在第三个燃烧边界动作中直接向左滚
        local_gain: 立即把 candle#3 送到左侧边界
        from_state_ref: initial_state
        exact_inputs:
          - up
          - up
          - down
          - up
          - down
          - up
          - down
          - up
          - down
          - right
          - up
          - up
          - up
          - up
          - left
        result_state_ref: input_replay_CANDLE_FRESH_03_ALT_EARLY_SECOND_ROLL.json#finalState
        concrete_outcome: >
          第 15 步滚动途中出现 extinguish:candle#3:concealed；candle#3 到达左侧但
          保持未点燃，左上火盆仍为未点亮，且本次边界不会把它重新点燃。
      feedback:
        - state_ref: canonical_after_step_15
          visible_change: candle#3 长度变为 2、火焰从第 5 行上移到第 4 行，candle#4 同时点燃
        - state_ref: canonical_after_step_19
          visible_change: candle#3 横越母烛上方，左上火盆点亮且火焰没有熄灭
    - id: RU3
      player_question: >
        candle#4 已在第三个边界点燃，为什么还不能立即点亮左下火盆？
      premises:
        - statement: candle#4 朝上，点燃时火焰位于第 5 行，而左下火盆位于第 7 行
          state_ref: canonical_after_step_15
        - statement: 每次缩短会从上端移除一格并让火焰下降一行
          state_ref: confirmed_rule_shrink
      conclusion: >
        先在第 20 步让 candle#4 缩短到 3 格，再在第 25 步缩短到 2 格；
        此时火焰才下降到第 7 行，最后向左滚动即可点亮左下火盆。
      operation_refs: [OP5, OP6]
      alternative:
        status: not_claimed
        description: candle#4 只缩短一次便向左滚
        local_gain: 可以更早移动到左侧
        from_state_ref: canonical_after_step_20
        exact_inputs: []
        result_state_ref: not_applicable
        concrete_outcome: 火焰仍在第 6 行，与第 7 行火盆不共格
      feedback:
        - state_ref: canonical_after_step_25
          visible_change: candle#4 只剩 2 格，火焰下降到左下火盆所在第 7 行
        - state_ref: canonical_after_step_26
          visible_change: candle#4 左滚点亮最后火盆，玩家存活并触发胜利
  operation_segments:
    - id: OP1
      step_range: 1-5
      exact_inputs: [up, up, down, up, down]
      purpose: 在两格安全竖槽中推进首个边界，释放并点燃 candle#2
      supports_reasoning_units: [RU1]
    - id: OP2
      step_range: 6-10
      exact_inputs: [up, down, up, down, right]
      purpose: 保持正确侧面站位，在第二个边界向右滚 candle#2 并释放 candle#3
      supports_reasoning_units: [RU1]
    - id: OP3
      step_range: 11-15
      exact_inputs: [up, up, up, up, up]
      purpose: 走到 candle#3 右上侧并等待其缩短避开母烛遮挡行，同时释放 candle#4
      supports_reasoning_units: [RU2, RU3]
    - id: OP4
      step_range: 16-19
      exact_inputs: [up, down, down, left]
      purpose: 回到 candle#3 右侧，在火焰上移后向左滚并点亮左上火盆
      supports_reasoning_units: [RU2]
    - id: OP5
      step_range: 20-25
      exact_inputs: [down, down, down, down, down, down]
      purpose: 沿中央竖槽回到 candle#4 右侧，并让它完成两次同步缩短
      supports_reasoning_units: [RU3]
    - id: OP6
      step_range: 26
      exact_inputs: [left]
      purpose: 在火焰下降到第 7 行后左滚 candle#4，点亮最后火盆
      supports_reasoning_units: [RU3]
  resolution:
    resolves: [RU1, RU2, RU3]
    operation_refs: [OP1, OP2, OP3, OP4, OP5, OP6]
    final_state_ref: canonical_after_step_26
    visible_confirmation: 三个火盆全部点亮，事件包含 win_all_braziers_lit
  trace_partition:
    status: complete
    ordered_segment_ids: [OP1, OP2, OP3, OP4, OP5, OP6]
    uncovered_steps: []
    overlapping_steps: []

