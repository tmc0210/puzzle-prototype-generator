replacement_claims:
  - claim_id: relight_source_necessity
    claim: >-
      x7,y6 已点火盆是 v1 核心后段复燃源；只把该格 O 改为 o 的反事实在统一预声明预算内
      complete 枚举 11,436 个状态、30,878 条边且零终局。必要性只限定于 v1 与此单变量反事实。
  - claim_id: counterfactual_boundaries
    claim: >-
      删除 x7,y3 双职责对象、以墙替代该对象、或把 x7,y6 已点火盆改为未点火盆，三者的 raw graph
      均 complete 且零终局。把 x6,y7 端点单格烛改成墙或左移一格仍可解，所以只声明 v1 中端点参与，
      不声明它对可解性单独必要。名为 shift_start_one_cell_right 的实际变体同时封墙旧起点且仍可解，
      不是纯相位反事实，不支持“错相位必然破坏”。
  - claim_id: supplement_version_identity
    claim: >-
      supplement 只增加 v1 的反事实证据；v1 layout、solve instance 与 canonical replay digest 前后不变，
      没有发布新 exact。

