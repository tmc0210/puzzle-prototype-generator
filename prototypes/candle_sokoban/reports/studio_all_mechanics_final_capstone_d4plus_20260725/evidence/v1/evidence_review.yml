  - claim_id: screen_key_participation
    claim: x7,y3 左向单格烛既在核心滚动 d1 充当烛身屏体、d2 未燃重曝，又在所有终局中执行后段侧滚与横推并点最后火盆；不存在无屏体胜解。
    status: supported
    evidence_basis:
      - prototypes/candle_sokoban/reports/studio_all_mechanics_final_capstone_d4plus_20260725/candidate/versions/v1/layout.txt
      - src/prototypes/candle_sokoban/mechanics.ts
      - 原始初态把 x7,y3 左向单格烛标识为 candle#single2；edge 13 的 d1/d2 接触序列含 extinguish_by_candle_body:candle#1 与 wick_reexposed_unlit:candle#1/candle#single2。
      - required_event_audit 对 roll_candle:candle#single2:d1、push_axis:candle#single2 与 light_brazier:3,4 均记录所有胜路必经；里程碑顺序无违例。
      - 核心 roll 事件只在 edge 13 可达且对所有胜路必经，故当前 exact 不存在绕过该屏体接触关系的胜路。
    limits:
      - 该结论证明当前 exact 内无屏体旁路；不替代“删除对象”反事实的独立版本核验。

  - claim_id: relight_source_necessity
    claim: x7,y6 已点火盆在受保护接触之后复燃长烛；将其改为未点火盆的完整反事实图无终局。
    status: unknown
    evidence_basis:
      - 当前 exact 的唯一核心 edge 13 含 ignite_from_brazier:candle#1:7,6，且该 edge 对所有胜路必经，支持基线中的复燃来源参与和无旁路。
      - counterfactuals.yml 汇总 remove_late_relight_source 为 graph.status=complete、winning_states=0。
    limits:
      - remove_late_relight_source 的 layout_ref 未列入 allowed evidence sources，且汇总未给反事实 layout digest、搜索预算或原始 nodes/edges；无法独立确认“改为未点火盆”与零终局完整图属于同一反事实 exact。

  - claim_id: endpoint_and_relay_participation
    claim: x6,y7 上向单格烛挡停长滚并在旧端帽格接受退焰；竖烛随后在 x6,y6 消费末端双火源，且所有终局都必经 ignite:candle#2。
    status: supported
    evidence_basis:
      - prototypes/candle_sokoban/reports/studio_all_mechanics_final_capstone_d4plus_20260725/candidate/versions/v1/canonical_replay.json
      - edge 13 含 shrink_ignite:candle#single4；step 5 后 x6,y7 单格烛已燃，且 candle#1 的已燃烛芯与该单格烛烛芯同在 x6,y6。
      - step 10 的竖烛滚动在 x6,y6 触发 ignite:candle#2 与 ignite_from_wick:candle#2:6,6；required_event_audit 记录 ignite:candle#2 对所有胜路必经。
      - required_event_audit 与 milestone_order_audit 还记录端点退焰先于竖烛点火，且无胜路顺序违例。
    limits:
      - 双火源结论只表示同格来源共同存在并参与该 relay；不表示端点烛是唯一或单独必要火源。

  - claim_id: counterfactual_boundaries
    claim: 删除屏体、删除复燃源、错开终点与错相位均破坏声明关系；固定墙替换仍可能借缩短长烛残火获胜，所以不声明端点烛是 x6,y6 唯一火源或单独必要火源。
    status: unknown
    evidence_basis:
      - prototypes/candle_sokoban/reports/studio_all_mechanics_final_capstone_d4plus_20260725/candidate/versions/v1/diagnostics/counterfactuals.yml
      - counterfactuals.yml 为六个变体记录 graph status、状态/边/终局计数及声明的事件缺失或局部 replay 摘要。
    limits:
