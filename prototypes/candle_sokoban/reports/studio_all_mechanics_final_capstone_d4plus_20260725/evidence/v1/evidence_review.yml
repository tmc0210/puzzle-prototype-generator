      - prototypes/candle_sokoban/reports/studio_all_mechanics_final_capstone_d4plus_20260725/candidate/versions/v1/diagnostics/complete_graph_and_solution_family.json
      - 原始 nodes/edges 数量分别为 57,796/164,149，索引连续、节点 key 唯一、边端点均有效；5 个 winning nodes 与汇总一致。
    limits:
      - terminalize_wins=true，终局节点无出边；图完备性只适用于当前 exact 与该搜索合同。

  - claim_id: solution_family
    claim: 5 个终局代表只含走位/相位回返，以及同一已取得竖烛火源对同一钥匙的退焰或直接点火局部实现差异；对象职责、目标分配和核心因果相同。
