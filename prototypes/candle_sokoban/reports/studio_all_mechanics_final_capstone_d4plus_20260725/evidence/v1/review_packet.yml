mechanical_claims:
  - claim_id: canonical_solve
    claim: 规范 23 输入 replay 全部合法，完整回合结算后玩家存活且全部火盆点亮。
  - claim_id: complete_graph_shape
    claim: 在声明预算内完整枚举 57,796 个状态、164,149 条边与 5 个终局状态；graph status 为 complete。
  - claim_id: solution_family
    claim: 5 个终局代表只含走位/相位回返，以及同一已取得竖烛火源对同一钥匙的退焰或直接点火局部实现差异；对象职责、目标分配和核心因果相同。
  - claim_id: exposure_gate
    claim: allowed_exposure_through=rolling_contact_chain 的当前 exact exposure audit 为 pass、graph complete、forbidden_hits 为空，exact/layout/sequence digest 完整。
  - claim_id: core_roll_edge
    claim: 所有终局都必经同一核心边；该边包含 roll_reignite_after_extinguish:candle#1:d1->d4、boundary_ignite_participates:candle#1、shrink:candle#1:len1 与 shrink_ignite:candle#single4。
  - claim_id: screen_key_participation
    claim: x7,y3 左向单格烛既在核心滚动 d1 充当烛身屏体、d2 未燃重曝，又在所有终局中执行后段侧滚与横推并点最后火盆；不存在无屏体胜解。
  - claim_id: relight_source_necessity
    claim: x7,y6 已点火盆在受保护接触之后复燃长烛；将其改为未点火盆的完整反事实图无终局。
  - claim_id: endpoint_and_relay_participation
    claim: x6,y7 上向单格烛挡停长滚并在旧端帽格接受退焰；竖烛随后在 x6,y6 消费末端双火源，且所有终局都必经 ignite:candle#2。
  - claim_id: counterfactual_boundaries
    claim: 删除屏体、删除复燃源、错开终点与错相位均破坏声明关系；固定墙替换仍可能借缩短长烛残火获胜，所以不声明端点烛是 x6,y6 唯一火源或单独必要火源。

