counterfactuals:
  - id: remove_dual_role_screen_key
    layout_ref: counterfactual_layouts/no_screen_remove_key.txt
    change: 删除 x7,y3 左向单格烛，同时移除核心烛身屏体和后段终盆钥匙。
    graph: { status: complete, reachable_states: 4751, legal_transitions: 13656, winning_states: 0 }
    result: unsolvable
    identity_reading: 同一对象不是一次性遮蔽按钮；删除它同时切断核心烛身灭火和唯一终盆执行者。

  - id: replace_dual_role_screen_key_with_wall
    layout_ref: counterfactual_layouts/fixed_wall_replace_key.txt
    change: 用固定墙替换 x7,y3 左向单格烛，不另补终局钥匙。
    graph: { status: complete, reachable_states: 2288, legal_transitions: 6176, winning_states: 0 }
    result: unsolvable
    identity_reading: 固定墙可灭火，却不能保留关键烛芯并承担后段侧滚、受火和终盆横推，不是无损替换。

  - id: remove_late_relight_source
    layout_ref: counterfactual_layouts/no_relight_source.txt
    change: 把 x7,y6 已点火盆 O 改成未点火盆 o。
    graph: { status: complete, reachable_states: 11436, legal_transitions: 30878, winning_states: 0 }
    result: unsolvable
    identity_reading: 长烛 d1 熄灭后无后段复燃源，不能在核心动作边界腾出旧端帽并形成末端输出。

  - id: replace_endpoint_singleton_with_wall
    layout_ref: counterfactual_layouts/endpoint_wall.txt
    change: 把 x6,y7 上向单格端点烛替换成固定墙。
    graph: { status: complete, reachable_states: 45158, legal_transitions: 130183, winning_states: 5 }
    shortest_cost: 23
    result: solvable_but_identity_changed
    missing_exact_event: shrink_ignite:candle#single4
    identity_reading: >-
      固定墙继续挡停长烛，缩短长烛自身也继续提供 x6,y6 火源；但 u->U、受火体与挡块同体、
      末端双火源这三个可见关系消失。该反事实限制 v1 的声明为“双火源状态直接参与”，
      不把端点烛夸大成唯一火源。

  - id: shift_endpoint_one_cell_left
    layout_ref: counterfactual_layouts/endpoint_shift_left.txt
    change: 上向单格端点烛从 x6,y7 左移到 x5,y7，使其烛芯错离旧端帽格。
    graph: { status: complete, reachable_states: 49827, legal_transitions: 142625, winning_states: 5 }
    shortest_cost: 23
    result: solvable_but_identity_changed
    missing_exact_event: shrink_ignite:candle#single4
    identity_reading: 错移端点仍能挡停长烛，却不会接受旧端帽退焰，作品的几何错格回报消失。

  - id: shift_start_one_cell_right
    layout_ref: counterfactual_layouts/phase_start_one_right.txt
    change: 玩家起点从 x2,y2 右移到 x3,y2，最短接近少一个合法行动。
    graph: { status: complete, reachable_states: 57391, legal_transitions: 164657, winning_states: 4 }
    shortest_cost: 20
    result: solvable_but_identity_changed
    local_replay:
      inputs: [up, right, right, down, up]
      core_roll_events: [roll_reignite_after_extinguish:candle#1:d1->d4, countdown:2->1]
      following_action_events: [countdown:1->5, shrink:candle#1:len1, shrink_ignite:candle#single4]
    identity_reading: 核心滚与缩短/端点点亮被拆成两个动作，失去 v1 的同动作高潮。

evidence_limits:
  - 端点烛与缩短长烛共享 x6,y6 火源格；它真实点亮并参与末端双火源，但不是唯一必要来源。
  - remove/fixed-wall 同时移除双责任对象的后段钥匙职责；它们证明不能无损替换整个对象，
    不单独量化只改变遮蔽事件的更窄反事实。
