schema_version: 1
prototype_id: candle_sokoban
course_position: final_all_mechanics_exposed
ordered_prior_level_refs: []
human_authorized_player_prior:
  source: 当前任务人类输入
  statement: >-
    玩家已经掌握游戏全部前序机制、各机制的衍生技巧与计算；本关是机制全部暴露后的最终高难关。
assumed_mastery:
  - branch: basic_candle_manipulation
    techniques:
      - 轴推与侧滚的操作位规划
      - 滚动距离不增加行动成本
      - 共享倒计时与燃烧缩短计算
      - 多根已燃蜡烛同时缩短
  - branch: wall_dousing
    techniques:
      - 墙体遮芯灭火
      - 边界灭火避开当轮燃烧
      - 全灭状态继续推进共享倒计时
  - branch: shared_fire_and_reignition
    techniques:
      - 火盆和外露火焰复燃
      - 中途复燃不重置共享倒计时
      - 边界复燃立即参与缩短
  - branch: body_concealment_and_reexposure
    techniques:
      - 烛身主动遮芯灭火
      - 移开遮蔽物后的未燃重曝
      - 可逆遮蔽的先后关系
  - branch: retreating_flame_transfer
    techniques:
      - 用缩短释放格触发同边界退焰点火
      - 预留烛芯外露时机和接触格
  - branch: rolling_contact_chain
    techniques:
      - 逐小步读取滚动途中接触
      - 同次滚动途中点盆、点火、灭火
      - 终点前点最后火盆
      - 同次滚动先灭后复燃
calibration_limit: >-
  Candle 当前没有可授权为 clean human-reviewed archive 的正式前序课程布局；本文件完整表达
  人类授权的课程位置与玩家先验，不把 runtime 诊断关或旧未归档报告伪装成前序课程。
