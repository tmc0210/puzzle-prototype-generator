calibration_synthesis:
  positive_bar_for_this_task:
    - >-
      最终高难关的主要负担应来自需要提前预见的状态、时序、操作面与对象责任；后续必须兑现并
      重读前面的决定，而不是只把正确动作串成长链。
    - >-
      多机制可以成立，但必须被同一个玩家关系强耦合：同一对象、空间或状态在前后承担持续且
      可感的责任。机制事件出现、对象数量和图复杂度都不是正向审美价值。
    - >-
      目标难度 5 应至少达到 RA_CAND_0017 所代表的高密度、高耦合、反直觉终局强度；若只达到
      ICE_CAND_0006 的扎实组合或 ICE_CAND_0019 的复合锁，即使可解且难度接近 4，也不足以自动
      成为最终 capstone。
    - >-
      强回报可以来自集中洞见、延迟显现的必要条件、对象角色重读或同一局部结构的多次非重复
      使用；无需靠地图膨胀或把全部机制逐项展示来证明完整。
  non_compensable_failures:
    - 高 affordance 对象或机制信号没有得到相称兑现。
    - 前序是可删除的单行道演出，或对象完成后退休而不参与后续。
    - 把独立 witness、重复动作或无关子题拼接成所谓全机制关。
    - 通过目标位置、走位、长路线或反馈迟缓 deadend 单纯抬高难度。
    - 用事件覆盖、唯一解、完整图、探针、步骤数或对象数量补偿玩家洞见不足。
    - 高潮之后继续清理，或主要对象只承担被动挡块、倒计时税和路线税。
  candle_specific_translation:
    - >-
      “玩家已掌握全部六个机制家族”是玩家先验，不是要求候选逐项触发全部诊断事件的配额。
      后续体验核心必须先由 task-local 正向材料与玩家关系决定。
    - >-
      共享倒计时允许步行和往返具有计算责任，因此不能机械删路；但每段移动仍需改变时序选择、
      操作位或对象状态，不能只靠行动数制造终局难度。
    - >-
      若使用滚动途中接触链、退焰点火、遮蔽/重曝或复燃，它们必须改变玩家此前的构造选择或
      对象责任，不能各自作为一次表演后退休。
    - >-
      开局可见的多根蜡烛、火盆、墙口与多种火状态会天然产生高机制承诺；正式候选必须谨慎控制
      affordance，确保中央对象的可见可能性在解中获得相称回报。
  deferred_until_explorer_material:
    - experience_statement
    - visible_setup
    - player_action
    - visible_payoff
    - why_level_exists
    - core_boundary
    - work_identity
    - structure_family
    - formal_layout

