    所有终局都必经同一核心边、同一端点输出、同一竖烛取火、同一竖烛下推、同一钥匙侧滚、
    同一钥匙横推和同一终盆分配；原始输入差异来自走位/相位回返，以及钥匙从同一已取得竖烛火源
    接受退焰点火或直接烛芯点火的局部准备差异，没有对象替代、目标改派或核心旁路。

