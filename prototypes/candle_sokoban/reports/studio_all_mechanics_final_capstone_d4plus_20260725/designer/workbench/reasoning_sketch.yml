known_perceptible_defects:
  - >-
    竖烛取火后的局部相位整理包含可见回返；原型合同明确允许倒计时计算，但 Critic 仍可能认为这一段
    反馈弱于核心长滚，需要按完整回放判断它是必要预备还是节奏拖延。
