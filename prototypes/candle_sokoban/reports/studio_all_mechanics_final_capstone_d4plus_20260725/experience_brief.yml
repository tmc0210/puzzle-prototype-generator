prototype_specific_routing:
  - 正式候选必须使用 all_braziers_lit，不得使用 event_occurs。
  - 本课程位置允许暴露到 rolling_contact_chain；全部六个家族是玩家先验，不是逐项事件配额。
  - 正式 exact 必须用 Candle 原始 replay、完整图与 exposure audit 重新核验，graph exhausted 不能算通过。
  - 长步行与原地往返可承担倒计时计算，不因比例高自动扣分；但不得单独充当难度或包装。
  - 后续只建立一个 candidate_id；结构修订或换 family 仍属于同一候选工作台。
  - 当前只固定体验核心与作品身份；没有 layout、solve instance、candidate id 或 exact version。

human_review_constraints:
  - 目标难度固定为 5，最低不得低于 4；扎实组合关或普通复合锁不足以自动承担最终 capstone。
  - 不因全部机制已掌握而要求候选逐项展示六个家族；只保留服务同一玩家关系的机制与对象。
  - 高 affordance 对象必须得到相称兑现，不能在开场事件演出后退休。
  - 不接受重复动作堆叠、无关 witness 拼接、目标位置硬化、路线长度或反馈迟缓 deadend 作为主要增难方式。
  - 事件覆盖、唯一解、完整图、探针和步骤数只有否决/约束作用，不提供正向审美价值。
  - 核心输出必须被后继直接消费并把约束传回准备阶段；高潮后不得另起清理子题。

