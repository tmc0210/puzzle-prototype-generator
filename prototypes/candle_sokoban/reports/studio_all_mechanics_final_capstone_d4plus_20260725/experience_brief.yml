prototype_context:
  confirmed_rules:
    - 正式胜利只在完整回合结算后检查：玩家存活且全部火盆已点亮。
    - 全局燃烧周期固定为 5；每次合法行动推进共享倒计时，无效输入不推进。
    - 蜡烛只能沿长轴推动一格，或从侧面滚到下一步被实体阻挡的位置；多格滚动仍只消耗一个行动。
    - 滚动每个小步都先结算遮蔽灭火，再结算火盆或外露火焰递归点火；途中状态会影响后续小步。
    - 已燃烛芯被墙或其它烛身遮住时熄灭；移开遮蔽物后只会未燃重曝，不会自动复燃。
    - 已点火盆与外露已燃烛芯都可复燃外露未燃烛芯；复燃不重置共享倒计时。
    - 燃烧边界只缩短结算时仍点燃的蜡烛；缩短腾出的旧端帽格可触发退焰点火。
    - 全部蜡烛熄灭时倒计时仍推进；边界前熄灭的蜡烛会避开该次缩短。
  win_condition: all_braziers_lit
  object_and_event_semantics:
    - 多格蜡烛是刚体；cap 方向外一格是逻辑烛芯投影，不单独占实体。
    - 火盆是实体；点亮后永久保持火源身份。
    - roll_intermediate_extinguish 与 roll_reignite_after_extinguish 描述同次滚动内的火焰状态链。
    - boundary_ignite_participates 表示边界前复燃的蜡烛立即参加本次缩短。
    - shrink_ignite 只说明退焰点火真实发生，不自动证明前面的遮蔽与复燃在胜解中必要。
    - 玩家进入外露火焰会死亡；死亡先于最终胜利判定。
  allowed_mechanisms:
    - basic_candle_manipulation
    - wall_dousing
    - shared_fire_and_reignition
    - body_concealment_and_reexposure
    - retreating_flame_transfer
    - rolling_contact_chain
  allowed_exposure_through: rolling_contact_chain
  tool_boundary:
    implemented:
      - Candle runtime adapter 与 ASCII parser/renderer
      - solver、完整图枚举与 layout analyzer
      - try-inputs 非空 replay
      - runtime-backed playable、诊断 probes 与 exposure audit
    unavailable:
      - Candle 专属 miner
      - candidate factory
      - PuzzleScript exporter/checker
    evidence_limit: >-
      当前 Explorer 材料只支持给定非空输入的确定性 replay 与局部结构差异；正式候选的可解性、
      解族、必经性、对象责任和完整 exposure gate 必须等 exact 发布后重新取证。

player_context:
  basic_sokoban_experience_assumed: true
  player_prior:
    - 已掌握轴推、侧滚操作位、滚动距离不增加行动成本、火焰危险与全局倒计时计算。
    - 已掌握燃烧缩短、多烛同时缩短、燃尽消失与边界相位规划。
    - 已掌握墙体遮芯灭火、边界灭火避烧及全灭状态继续推进倒计时。
    - 已掌握火盆/烛芯复燃、中途复燃不重置倒计时及边界复燃立即参与缩短。
    - 已掌握烛身主动遮蔽、未燃重曝与可逆遮蔽的先后关系。
    - 已掌握退焰点火所需的旧端帽格、烛芯外露时机与站位计算。
    - 已掌握滚动途中逐小步点盆、点火、灭火、终点前点最后火盆与同次滚动先灭后复燃。
  prerequisite_mechanisms:
    - basic_candle_manipulation
    - wall_dousing
    - shared_fire_and_reignition
    - body_concealment_and_reexposure
    - retreating_flame_transfer
    - rolling_contact_chain
  known_prior_level_refs: []
  prior_course_ref: prototypes/candle_sokoban/reports/studio_all_mechanics_final_capstone_d4plus_20260725/prior_course.yml
  prior_course_limit: >-
    当前没有获授权的 Candle clean human-reviewed 正式前序布局；玩家知识以上述人类授权先验为准，
    不从 runtime 诊断关、旧 Candle 报告或未归档材料反推课程。

experience_seed:
  human_seed: >-
    面向已经掌握全部六个机制家族、衍生技巧和计算的终局熟练玩家，设计最终高难单关；首批材料
    提供一次侧滚中的烛身灭火、未燃重曝、途中火盆复燃、燃烧边界缩短与旧端帽退焰点火依赖。
  selected_direction: >-
    把一次不可中止的长侧滚编排成“主动熄灭形成暗窗—越过必须暂时保持未燃的关键接触—后段
    复燃—同动作跨边界缩短—旧端帽退焰点燃终点挡块”的连续火焰状态程序。

