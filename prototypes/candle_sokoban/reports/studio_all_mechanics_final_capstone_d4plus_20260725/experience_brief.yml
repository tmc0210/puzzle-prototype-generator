experience_core:
  experience_statement: >-
    玩家把一次不可中止的长侧滚预先编排成一段可见的火焰状态程序：先用自己布置或保留的烛身
    主动熄灭滚动长烛，让未燃烛芯穿过一处必须暂时保持未燃的关键接触；越过后再由已点火盆
    复燃，恰在共享倒计时边界缩短，并用腾出的旧端帽退焰点燃兼作滚动终点挡块的单格烛；这个
    新火源随即成为收束整关所必需的输出。
  visible_setup: >-
    开局让玩家同时看见一根可长距离侧滚的已燃长烛、它的烛芯侧轨、可移动的烛身屏体、暗窗内
    需要暂时保持未燃的关键烛芯或火源、后段已点火盆、终点单格烛挡块，以及公开的共享倒计时。
    这些对象共同提出矛盾：长烛最终必须燃烧并缩短，但不能从头到尾保持点燃。
  player_action: >-
    玩家在提交核心侧滚前，必须预见整条侧轨，选择并完成遮蔽位置、受保护接触、复燃来源、
    倒计时相位与终点挡块/受火体的准备；随后亲手发动一次不可中止的长侧滚，让火焰按预定区间
    消失、保持熄灭、重新出现并在边界传给下一根蜡烛。
  visible_payoff: >-
    同一次滚动中，玩家先看到长烛火焰被烛身吞掉、未燃烛芯越过关键接触，再在后段火盆旁复燃；
    滚停后长烛立刻缩短，原端帽格腾空并点亮正好挡住它的单格烛。核心画面把“熄火”反转成
    成功传火的必要准备，而非失败或绕路。
  why_level_exists: >-
    这关把熟练玩家已知的遮蔽、重曝、复燃、滚动逐步结算、共享相位与退焰点火重新解释为一段
    必须事先编排的单行动程序；价值不在事件数量，而在玩家发现“为了让火焰最终到达有用位置，
    必须先让它在正确区间死去”。
  core_boundary:
    central_objects:
      - 承载火焰状态、滚动轨迹与边界缩短的已燃多格长烛。
      - 由玩家主动布置或保留、决定暗窗起点的可移动遮蔽烛身。
      - 位于暗窗内、必须暂时保持未燃且在后续仍有责任的关键烛芯或火源。
      - 位于遮蔽之后、在边界结算前恢复长烛火焰的已点火盆。
      - 烛身兼作滚动终点挡块、烛芯落在旧端帽格并接受退焰点火的单格蜡烛。
      - 把前述状态压进同一次行动的共享倒计时边界相位。
    supporting_objects:
      - 只用于让玩家构造核心关系、提供必要操作位或收束可达性的墙与通道。
      - 只在能约束核心准备或直接消费核心输出时才允许出现的其它蜡烛与火盆。
      - 把新点燃单格烛或末端双火源快速转化为 all_braziers_lit 的短收束结构。

work_identity:
  conditions:
    - >-
      同一次玩家发动的侧滚必须按顺序实际发生：烛身遮蔽灭火、未燃重曝、暗窗内关键接触保持
      未燃、后段火盆复燃、边界复燃参与缩短、旧端帽格退焰点燃终点单格烛。
    - >-
      烛身遮蔽必须改变完整胜解所需的后续状态：玩家不是为了触发事件而熄火，而是为了让某个
      有后续责任的关键接触在滚动经过时保持未燃。
    - >-
      遮蔽体必须是玩家能够主动安排或有意义地保留的蜡烛，其可移动性决定暗窗区间；它不是可由
      固定墙无损替换的事件按钮。
    - >-
      复燃火盆必须由此前选择获得或保留为火源；复燃发生在受保护接触之后、边界结算之前，且
      缺少它就不会腾出旧端帽格。
    - >-
      共享相位必须与其它准备互相约束：正确相位由完整计划产生，不能靠与对象状态无关的孤立
      往返随意修正而仍保留同一玩家判断。
    - >-
      终点单格烛同时承担几何挡块与退焰受火体责任；它的位置决定滚动停止点、旧端帽错格与
      `u -> U` 的可见回报。
    - >-
      新点燃单格烛或末端双火源状态必须直接参与胜利收束；高潮后只允许短而必要的兑现，不得
      另起清理子题。
    - >-
      正式包装至少提供两个局部看似可行的准备方案，只有预见完整侧滚的暗窗、复燃与端帽结果
      才能区分；难度来自前后依赖而不是执行唯一动作。
  counterfactuals:
    - change: 删除遮蔽烛身，让长烛从头保持点燃。
      identity_failure: >-
        若仍能保护关键接触并以同一因果关系获胜，就退化为 Explorer 的 case_c 普通缩短 shortcut，
        “主动熄火”不再是玩家洞见，本作品身份失败。
    - change: 用固定墙替换可移动遮蔽烛身，或预先把它锁死在唯一位置。
      identity_failure: >-
        暗窗不再由玩家构造或保留，烛身遮蔽只剩自动动画；作品失去对完整轨迹的主动编排。
    - change: 删除暗窗内必须暂时保持未燃的关键接触，或让它预先点燃且不影响后续。
      identity_failure: >-
        熄火没有消费对象，前半链可整体退休；关卡只剩复燃接退焰点火的 witness。
    - change: 删除、熄灭或前移后段复燃火盆。
      identity_failure: >-
        长烛要么边界避烧、旧端帽不腾出，要么在受保护接触之前过早复燃；完整状态程序断裂。
    - change: 让核心侧滚发生在非燃烧边界，或允许玩家在不改变其它准备的情况下任意等待校相。
      identity_failure: >-
        前者不会缩短或点亮终点烛；后者把高难相位关系降成独立倒计时税。
    - change: 将终点单格烛错开旧端帽一格、换成墙，或让其它实体单独决定滚动终点。
      identity_failure: >-
        挡块与受火体责任分离，旧端帽错格回报消失；作品不再是同一几何关系。
    - change: 新点燃单格烛及末端双火源不参与后续胜利，核心之后另接独立收尾。
      identity_failure: >-
        退焰点火只剩机制展示，后继不能把约束传回此前准备，整关变成拼接。

level_brief:
  packaging_intent: complete_single_level
  expected_difficulty: 5
  minimum_acceptable_difficulty: 4
  expected_scale: >-
    单一共享空间内的中等规模、高关系密度终局关；核心侧滚前允许紧密耦合的构造与相位准备，
    核心侧滚后只留直接消费新火源的短收束。规模由关系需要决定，不以机制数量或步数扩张。
  expected_player_load: >-
    玩家需要同时维护长烛的滚动侧轨、火焰明暗区间、一个必须暂时保持未燃的对象、复燃窗口、
    共享倒计时边界、缩短后的端帽错格与终点受火体责任，并从终局用途反推此前准备。
  opening_intent: >-
    先呈现“长烛必须最终点燃并缩短，却不能全程点燃”的可读矛盾；不把遮蔽、复燃与终点关系
    预先排成唯一操作的教学展示。
  ending_intent: >-
    以长烛缩短、终点挡块点燃和该新火源被胜利条件立即消费为高潮；不追加独立机制展示或清理。

reasoning_sketch:
  structural_thesis: >-
    难点来自一次不可中止滚动对多个此前准备的同时验收。玩家必须从终点旧端帽退焰反推相位与
    挡块位置，再从复燃窗口反推暗窗终点，并从必须暂时保持未燃的关键接触反推遮蔽体位置；这些
    关系共同决定同一动作，而不是按局部顺序逐段开锁。
  dependency_chain:
    - 后继胜利消费需要终点单格烛被点燃。
    - 终点单格烛被点燃需要旧端帽在本动作边界腾出。
    - 旧端帽腾出需要长烛在受保护接触之后、边界之前复燃。
    - 受保护接触保持未燃需要长烛在经过它之前由可移动烛身主动熄灭。
    - 遮蔽位置、复燃来源、共享相位与终点挡块必须在提交侧滚前共同成立。
  principal_falsifiers:
    - 无遮蔽仍存在同因果胜解。
    - 暗窗内没有任何后续责任被保护。
    - 相位可由无代价往返独立修正。
    - 终点受火体不参与胜利收束。
    - 玩家可只靠局部唯一动作完成全部准备，无需预见侧滚后果。

