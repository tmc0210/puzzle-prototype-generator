design_brief: >-
  在已完成的独立归档校准和当前 task-local 首批已验证材料基础上，固定一个面向全部机制已掌握玩家的
  完整体验核心与可证伪作品身份。目标难度 5，最低不得低于 4；课程位置是全部六个家族暴露后的
  最终高难关。首批材料提供一次侧滚中的烛身灭火、未燃重曝、途中火盆复燃、燃烧边界缩短与旧端帽
  退焰点火依赖；可以选用、变形或仅作为边界材料，但只固定一个体验核心，不开始正式布局。
