  - id: stage_06_rolling_contact_chain
    title: 滚动途中接触链
    status: completed
    phase: selected
    allowed_exposure_through: rolling_contact_chain
    player_prior:
      - 已掌握所有前序机制，包括退焰同格交接和跨边界接力。
      - 尚不知道侧滚每个小步都会立即结算点盆、点火与灭火，而且接触不会使滚动提前停下。
    target_player_capabilities:
      - 把侧滚路径与最终停点视为两套可同时消费的接口，而不是只看终点。
      - 能用途中接触的先后顺序写入滚烛的最终燃烧状态。
      - 能把一次长滚的最终接触状态接到同动作末尾的燃烧边界，控制是否缩短。
    theme_shortlist:
      - id: S06_T01_PATH_OUTPUT_ENDPOINT_BODY_DUTY
        priority: first
        status: mainline_core
        outcome: >-
          A 一次 d4 长滚在非终点 d2 点盆，d4 尾格跨两个缩短边界仍截停 Q；Q 因而停在可上推列。
          短滚只点盆而失去终点职责，预亮/错列盆只剩终点链，删除 Q 只剩 drive-by，普通轴推不能同时复现。
          两项是同一动作累积的必要成果；正式关卡需把 Q 上推接入标准胜利闭环。
        design_space: >-
          一根燃烛侧滚时，火焰只在途中某个小步扫过目标火盆，最终停点不再对齐该盆；
          同一滚动的实体终点同时成为下一对象的停块、遮板或操作面。过早停只建立路径输出，
          另一轨道只取得终点职责，只有正确长滚在一个行动内同时完成二者。
      - id: S06_T02_ORDERED_DOUSE_REIGNITE_WRITES_ENDPOINT_STATE
        priority: second
        status: mainline_core
        outcome: >-
          同图上下 d5 长滚以相反顺序经过墙与火源；墙→火源终点燃烧并点盆，火源→墙终点未燃。
          两路等距、同长度、同倒计时且由同构终点接口读取；反序首次火源接触为幂等，核心是最后有效状态写入覆盖前态。
        design_space: >-
          同一次侧滚沿途依次经过遮芯点与火源点；“先灭后燃”到终点为燃，“先燃后灭”到终点为未燃。
          玩家通过滚动方向、轨道或可移动接触体决定顺序，终点后的同一 consumer 读取最终亮灭而非事件数量。
      - id: S06_T03_BOUNDARY_CONTACT_PROGRAM
        priority: third
        status: mainline_core
        outcome: >-
          countdown=1 的同一长滚先写最终亮灭，随即决定参加缩短或避烧；燃烧路端帽释放并 shrink_ignite 接收烛，
          未燃路保长并继续遮芯。countdown=2 保留路径终态与端点输出，却删除即时缩短/释放，证明不是 T02 后多等一拍。
        design_space: >-
          把有序接触长滚放在倒计时 1：滚动途中最终写成燃烧就参加本次边界，最终写成未燃则避开缩短；
          一次行动同时决定终点状态和边界后长度，再由紧邻空间/火焰接口读取。
    batches_completed:
      - batch_stage06_001_path_output_endpoint_body_duty
      - batch_stage06_002_ordered_douse_reignite
      - batch_stage06_003_boundary_contact_program
    mainline_cores:
      - S06_T01_PATH_OUTPUT_ENDPOINT_BODY_DUTY
      - S06_T02_ORDERED_DOUSE_REIGNITE_WRITES_ENDPOINT_STATE
      - S06_T03_BOUNDARY_CONTACT_PROGRAM
