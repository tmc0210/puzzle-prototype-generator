    material_ref: prototypes/candle_sokoban/reports/curriculum_planning_20260725/experience_cores.yml#S01_T03_BURNOUT_REMOVES_ROLL_STOP
  - id: S01_T04_SIMULTANEOUS_SHRINK_GEOMETRY
    title: 共享时钟跨对象保形顺序锁
    material_ref: prototypes/candle_sokoban/reports/curriculum_planning_20260725/experience_cores.yml#S01_T04_SIMULTANEOUS_SHRINK_GEOMETRY
