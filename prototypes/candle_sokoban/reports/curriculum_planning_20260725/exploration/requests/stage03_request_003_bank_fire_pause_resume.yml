do_not_repeat:
  - 只做“墙灭后再从火盆点着”的复燃演示，没有暂停区间或长度 consumer。
  - 只做先点 P、后点 Q 的普通两盆顺序，B 在中间没有因退出而保住可用形状。
  - 把前一墙体核心“先点盆再墙灭保尾”原样重演；本轮必须让 P 成为后续取回火焰的存储点。
  - 让暂停期间的工作成为独立小题，或用无意义走动跨边界。
  - 让复燃动作先产生未燃重曝再于后续行动点火；当前阶段要求同动作直接进入稳定火源接口。
  - 把完整伪关卡作为单条 Lexicon；只发布新原子结构或补现有原子证据。
  - 设计正式关卡、判断课程优先级或编辑 experience_cores.yml。
materialization_target: >-
  找到一个“存火—暂停—取火”闭环：B 先把火永久留在 P，墙灭跨过必要工作区间保形，
  再从 P 同动作复燃，并以保住的长度与火焰完成同一最终链；不暂停和不复燃对照分别破坏几何与火焰职责。
  完整组合留作 optional direction，Lexicon 只记录可独立拼接的局部关系。
