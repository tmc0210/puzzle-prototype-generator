allowed_exposure_through: shared_fire_and_reignition
design_space: >-
  同一燃烛 B 先以外露火焰点亮永久火盆 P，把火焰状态存入场景；随后 B 的烛芯贴墙灭火，
  在玩家完成另一段直接准备最终通路的必要工作时跨过至少一个共享边界而保持长度；
  最后移动 B，使刚重新外露的未燃烛芯在同一行动落到 P 的火源格并立即复燃，
  再以保住的实体长度和取回的火焰完成最终火盆 Q 或同一胜利链。
  不暂停会让 B 在工作期间过度缩短并失去最终几何；暂停后不复燃则几何仍在但 Q 无法点亮。
sampling_axes:
  - B 初始长度 2—4 格；先点 P、墙灭、跨边界、从 P 复燃、点 Q 五段必须属于同一布局与完整 trace。
  - 墙与 P 的相对位置要使 B 从遮芯状态移动后直接在 P 上复燃，避免留下 `wick_reexposed_unlit` 晚期暴露。
  - 暂停区间内的行动必须直接打开 B 到 Q 的滚道、准备操作面或移动后继对象，不用独立小题或空走。
  - 比较从不墙灭、墙灭但不复燃、正确存火—暂停—取火三路；至少前两条分别隔离长度职责与火焰职责。
  - 预先点亮 P，检查 B 的第一段存火职责是否消失；移除 P 或使其未燃，检查复燃接口是否消失。
  - 移除最终长度 consumer 或预亮 Q，检查暂停与取火是否只剩无用途状态变化。
  - 若存在早复燃/晚复燃选择，验证加入不重置倒计时是否给最终长度留下额外界限；不是硬要求。
  - 指定 trace 不得使用烛身遮蔽、未燃重曝、退焰点火或滚动途中接触链。
