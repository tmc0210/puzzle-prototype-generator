do_not_repeat:
  - 仅把三根蜡烛做成长中短陈列，或用三个互不影响的小检查分别读取它们。
  - 只要求第一次边界前选择 A/B 谁保长；那已经属于上一批的单次分配。
  - 把第三根蜡烛当装饰，删除它或删除第二次退出后仍保留完整核心。
  - 用可删走步跨过第二个边界，或让错误顺序只增加普通路程。
  - 用更晚阶段的复燃、烛身遮蔽、退焰点火或滚动途中接触承担联合 consumer。
  - 设计完整关卡、判断课程优先级或声称结构值得占一关。
materialization_target: >-
  找到一个真正需要两次退出决策的联合长度序列：玩家通过不同周期墙灭主动制造三个层级，
  一个连续后继结构读取至少两处尾端差异；同周期退出、交换周期和删掉第二读取点的对照能证明
  它不是第一批“把一格分给 A/B”的重复。若只能得到更复杂的长度陈列，则不发布新条目。
