request_id: stage01_request_003_shared_clock_cross_object_order
exploration_id: candle_curriculum_stage01_basic_countdown_20260725
stage_id: stage_01_basic_countdown
allowed_exposure_through: basic_candle_manipulation
design_space: >-
  开始摆法有两处都必须完成的燃烛操作，玩家从可读的中央区域选择先处理 A 还是 B；
  两根蜡烛共享五拍倒计时，因此在 A 花费的每个合法行动都会同时消耗 B 的长度/寿命；
  正确顺序保留短烛的实体格或烛芯可达关系并让两处共同完成同一正常胜利目标，反向顺序则让短烛先缩短或燃尽，
  紧接的火盆对齐、操作面或滚动停点因此失效。
sampling_axes:
  - A/B 初始长度 1—3 格与各自完成最小用途所需的 1—4 个合法行动。
  - 先短任务/先长任务两个顺序必须来自同一布局，并在第一个共享边界处出现可读分歧。
  - 至少尝试一个由轴推点盆消费短烛长度的版本，以及一个由侧滚停点或实体操作面消费的版本。
  - 增加短烛一格长度，使两个顺序都成立，作为期限边界对照。
  - 禁用 global_burn_and_shrink 或移除短烛 consumer，检查顺序约束是否消失。
  - 两处输出必须共同服务同一个 all_braziers_lit 目标或同一后继结构，排除两个互不相关的小题拼接。
  - 避免任何墙体遮芯、复燃、烛身遮蔽、退焰点火和滚动途中接触事件。
current_material_refs:
  - prototypes/candle_sokoban/reports/curriculum_planning_20260725/exploration/lexicon.md
  - prototypes/candle_sokoban/reports/curriculum_planning_20260725/exploration/lexicon_index.md
  - prototypes/candle_sokoban/reports/curriculum_planning_20260725/exploration/runs/batch_stage01_002_burnout_removes_roll_stop/explorer_notes.md
do_not_repeat:
  - 只展示两根蜡烛同时 shrink 或 burn_out。
  - 用两个不同初始布局分别演示两个顺序，而不是让玩家在同一局面选择。
  - 把明显的“先救快燃尽对象”口令本身当作结构；必须有具体长度或几何 consumer。
  - 用无意义来回走动制造全部顺序差，或把两个互不影响的小题并排放置。
  - 沿用动态滚动挡块作为唯一 consumer；本轮要寻找跨对象共享时钟的独立关系。
  - 设计完整关卡、判断课程优先级或声称结构值得占一关。
materialization_target: >-
  找到至少一个跨对象顺序锁：玩家在同一布局选择 A/B 顺序，A 的必要操作真实推进 B 的共享寿命，
  B 的长度或存在状态随后被一个最小后继消费；反向顺序、加长边界或禁用燃烧对照能说明顺序锁来自共享时钟，
  而不是普通路程或两个独立子题。若只能得到同步燃烧展示或显然期限题，则不发布新条目。

