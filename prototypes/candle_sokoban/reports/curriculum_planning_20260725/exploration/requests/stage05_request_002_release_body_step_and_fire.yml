stage_id: stage_05_retreating_flame
allowed_exposure_through: retreating_flame_transfer
design_space: >-
  让已燃 A 的末格占住未燃 B 的烛芯投影格；该格同时也是 B 沿自身长轴向前推动时，端帽身体要进入的下一格。
  边界前 B 即使有火也无法前推，因为 A 的实体仍占目的格；A 若一格燃尽或提前移开，只会把目的格释放，却不能把退焰火交给 B。
  只有 A 存活缩短时，该格从实体阻挡变成非实体火焰投影并 shrink_ignite B；B 的下一次直接轴推进入刚释放格，
  让当前火焰继续前移并完成同一输出。这里释放的是“蜡烛身体目的格”，不是供玩家踩入的安全格。
sampling_axes:
  - 正确路：A 存活缩短同时释放 B 的前进一步并点燃 B；边界后的下一次 B 轴推合法且直接输出。
  - 只释放无火：一格 A 燃尽或等价近邻，让 B 以相同长度和相同轴推几何进入该格，但不能完成 fire consumer。
  - 只有火无空间：在边界前以普通来源点亮 B，同时 A 末格仍占目的格；B 保持燃烧但轴推被实体阻挡。
  - A 末格提前移开且无普通火源时，B 可前推但保持未燃；用来隔离 release 与 handoff 的双重职责。
  - 将最终火盆预亮或移走前向封口，分别移除火焰读取与刚释放目的格的空间读取。
  - 指定正确 trace 不得让玩家进入火焰格，不得使用滚动途中接触链，且输出前不得重新取火。
