do_not_repeat:
  - 把 A 释放的火焰投影格说成玩家可以安全进入的操作站位。
  - 再做一次长 B/短 B 命中远近火盆；本批必须读取“轴推目的格由实体阻挡变可进入”。
  - 只证明轴推从非法变合法，或只证明 shrink_ignite 点火，而没有同一后继动作同时消费两者。
  - 在输出前墙灭、从火盆复燃或借其他烛芯重新取火。
  - 把失败输入本身当成关卡核心；它只作为“火有了但空间没开放”的反事实。
  - 编辑 Controller 账本或把完整组合写入 Lexicon。
materialization_target: >-
  一个双许可的同链 existence proof：A 的同一次存活缩短把 B 的下一身体目的格从占用变为空闲，并把 B 点燃；
  B 下一次直接轴推既依赖该格已释放，也用交来的当前火焰完成输出。只释放或只传火都在同一动作接口失败。
