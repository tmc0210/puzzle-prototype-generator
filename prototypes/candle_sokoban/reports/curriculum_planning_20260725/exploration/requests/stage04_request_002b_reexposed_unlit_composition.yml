stage_id: stage_04_body_concealment
allowed_exposure_through: body_concealment_and_reexposure
design_space: >-
  把未燃重曝的空间交接、暂存时序和准确长度门压进同一初始布局与胜利链。
  C 离开 B 烛芯格时把玩家交到唯一清场站位；玩家必须趁 B 未燃直接准备后继探针/单列门，
  再主动复燃 B，使其只经历一次边界并留下中间长度。立即复燃应使 B 过短，永不复燃应使 B 过长且无火，
  不移开 C 则无法准备 consumer；只有暂存路线通过同一长度门并用 B 火焰完成最终输出。
sampling_axes:
  - 同一布局完整回放不移开、立即复燃、暂存后复燃、永不复燃四路中的至少三条关键路线。
  - 玩家进入未燃烛芯格后的下一必要动作必须直接移动门、探针或打开唯一消费通路。
  - 三/二/一格的近/中/远门与最终火焰输出必须接在动态生成之后，不用静态终局替代。
  - 移除单列封墙、预亮最终火盆或移除后继火源，分别隔离长度、火焰与复燃职责。
  - 不得使用退焰点火或滚动途中接触链。
current_material_refs:
  - prototypes/candle_sokoban/reports/curriculum_planning_20260725/exploration/lexicon.md
  - prototypes/candle_sokoban/reports/curriculum_planning_20260725/exploration/runs/batch_stage04_002_reexposed_unlit_staging_window/explorer_notes.md
  - prototypes/candle_sokoban/reports/curriculum_planning_20260725/exploration/runs/batch_stage04_002_reexposed_unlit_staging_window/proposed_families.md
do_not_repeat:
  - 再次把重曝时序与长度门分开验证。
  - 用开放走路或独立小题填满未燃区间。
  - 只读取火焰或只读取长度，未形成共同最终链。
  - 把完整组合发布成 Lexicon 条目或编辑 experience_cores.yml。
materialization_target: >-
  一份同布局 composition existence proof：重曝交出的站位直接准备 consumer；暂存后复燃动态生成目标长度与火焰，
  并通过同一门完成胜利；立即复燃、永不复燃或保持遮蔽在该链的不同接口失败。若不能闭合则维持 material_only。
