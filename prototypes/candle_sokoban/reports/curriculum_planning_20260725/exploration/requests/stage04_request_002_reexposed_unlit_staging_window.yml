request_id: stage04_request_002_reexposed_unlit_staging_window
exploration_id: candle_curriculum_stage04_body_concealment_20260725
stage_id: stage_04_body_concealment
allowed_exposure_through: body_concealment_and_reexposure
design_space: >-
  燃烛 B 先被可移动遮体 C 原地熄灭；随后玩家为完成同一任务链移动 C，重新开放 B 的烛芯格或操作面。
  C 移开后 B 的烛芯外露但保持未燃，玩家利用这个“空间已打开、参与状态仍关闭”的记忆区间，
  先重新定位 B、穿过原火焰接口或跨过共享边界保形；之后再从受控火源主动复燃 B，
  用准备好的几何与火焰完成最终输出。
sampling_axes:
  - C 先遮蔽、后移开的两个终点都必须承担空间职责；B 在两次动作间保持原位。
  - 移开 C 的同一行动必须产生 `wick_reexposed_unlit` 且没有立即复燃；后续另一个明确动作才让 B 接触火源。
  - 暂存区间内至少完成一次直接准备最终 consumer 的 B 轴推/侧滚、玩家穿行或跨边界保形。
  - 同一布局比较不移开 C、移开后立即接触火源、正确未燃暂存后再复燃三路。
  - 不移开 C 应因空间接口仍被占而失败；立即复燃应因过早参与或火焰状态破坏几何；不再复燃应能完成几何但欠缺最终输出。
  - 移除后继火源、预亮最终火盆或移除长度/位置 consumer，分别隔离重曝记忆、火焰职责与几何职责。
  - 不得使用退焰点火或滚动途中接触链。
current_material_refs:
  - prototypes/candle_sokoban/reports/curriculum_planning_20260725/exploration/lexicon.md
  - prototypes/candle_sokoban/reports/curriculum_planning_20260725/exploration/lexicon_index.md
