  - prototypes/candle_sokoban/reports/curriculum_planning_20260725/exploration/runs/batch_stage03_003_bank_fire_pause_resume/explorer_notes.md
do_not_repeat:
  - 只证明移开 C 后 B 不会自动复燃，或把 `wick_reexposed_unlit` 事件本身当核心。
  - 只把 C 移开作为普通开路，B 的未燃记忆没有被时间或后继火焰消费。
  - 复刻墙灭后的暂停—复燃；本轮必须由可移动遮体的离开同时恢复此前被占的空间接口。
  - 让 B 永远保持未燃而不再承担火焰职责，或让复燃与前面几何准备成为两个独立小题。
  - 把完整伪关卡作为 Lexicon 条目；只发布细粒度结构。
  - 设计正式关卡、判断课程优先级或编辑 experience_cores.yml。
materialization_target: >-
  找到一个“移开遮板后状态记忆”的完整组合：C 离开同时恢复空间接口，但 B 仍未燃；
  玩家利用这段区间直接准备最终几何，再主动复燃并完成同一输出链。不移开、立即复燃、永不复燃
  三条对照分别证明空间、时机与火焰职责。完整组合留作 optional direction，Lexicon 只收原子关系。
