  - prototypes/candle_sokoban/reports/curriculum_planning_20260725/exploration/lexicon.md#shrink_vacated_wick_cell_becomes_nonsolid_flame_gate
  - prototypes/candle_sokoban/reports/curriculum_planning_20260725/exploration/lexicon.md#equal_translation_offsets_flame_socket_by_length
do_not_repeat:
  - 只把 T01 的单次早/晚接火换成三根蜡烛，没有第二个独立边界和中继职责。
  - 预先把 A/B/C 完全摆好后只空走十拍见证两个 shrink_ignite。
  - 最终只检查 C 是否点亮，不读取过早接火造成的长度差。
  - relay 后把 C 灭掉并从固定火源重取火。
  - 使用滚动途中点火、灭火或点盆。
  - 编辑 Controller 账本或把完整接力伪关卡写入 Lexicon。
materialization_target: >-
  一个两边界接力的同链 existence proof：玩家先建立 B 的双链接中继位，A 在第一边界把火交给 B，
  B 在第二边界把火交给 C；正确、过早、断链三路动态生成“恰长燃烧、过短燃烧、保长未燃”，
  并由同一连续 consumer 读取。若只能做静态事件 witness，应降为 material_only。
