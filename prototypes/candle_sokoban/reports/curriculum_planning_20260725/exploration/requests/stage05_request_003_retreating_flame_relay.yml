stage_id: stage_05_retreating_flame
allowed_exposure_through: retreating_flame_transfer
design_space: >-
  在第一燃烧边界前，玩家把未燃中继 B 送入一个精确槽位：B 的烛芯投影受已燃 A 的端帽遮蔽，
  而 B 自己的端帽同时遮住未燃 C 的烛芯。第一边界只有 A 在燃烧集合中，A 存活缩短后退焰点燃 B；
  B 不参加已完成的结算。第二边界 B 再存活缩短，退焰点燃 C，使火种每个边界只沿遮蔽链接前进一段。
  最终同一 consumer 应区分“正确节拍得到完整燃 C”“B 提前已燃导致 C 早一轮加入并多烧一格”“B 过短燃尽或错位导致 C 未燃”。
sampling_axes:
  - 至少验证 A→B 与 B→C 发生在相邻两个不同边界，不能在同一边界递归跨两段。
  - 正确路需包含玩家在第一边界前把 B 推入或保留在同时连接 A、C 的中继槽；不接受纯静态等待 witness。
  - 早路让 B 在第一边界前普通接火或初始已燃，使 C 在第一边界过早接火；第二边界后 C 应比正确路短一格但仍有火。
  - 断链路用一格 B 燃尽、B 错位或缺失第二遮蔽链接，使第二边界后 C 保长但未燃。
  - 同一最终动作链同时读取 C 的长度与火：早路长度失败，断链路火焰失败，正确路完成输出。
  - 指定 trace 不得在 relay 之后另处复燃 C，不得使用 rolling_contact_chain 途中事件；完整可达图按 exposure 门核对。
current_material_refs:
