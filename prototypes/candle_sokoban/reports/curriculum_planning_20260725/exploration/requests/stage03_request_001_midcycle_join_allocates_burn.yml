do_not_repeat:
  - 只证明未燃烛芯会被火盆/火焰点燃，或点火不会重置倒计时。
  - 把“边界前点燃会立即参加缩短”事件标签本身当体验核心。
  - 只复刻墙体阶段的 A/B 保长分配，却不让玩家通过加入时机主动选择 B 的燃烧历史。
  - 让早/晚路线最终仍有不同亮灭状态或不同烛芯端位置，混淆长度 consumer。
  - 用两个不同初始布局代替同一局面中的加入时机选择。
  - 设计完整关卡、判断课程优先级或声称结构值得占一关。
materialization_target: >-
  找到至少一个“入场相位分配一次燃烧”的局部结构：同一未燃 B 可在边界前后加入，
  两路最终同为燃烧、烛芯端对齐，却因是否参加那次边界留下相邻长度；一个最小后继明确读取该格。
  若只有点火事件、亮灭差或普通路程差，则不发布正向条目。
