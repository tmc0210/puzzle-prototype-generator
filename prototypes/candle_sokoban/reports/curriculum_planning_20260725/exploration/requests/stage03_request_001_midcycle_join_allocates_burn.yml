stage_id: stage_03_shared_fire_reignition
allowed_exposure_through: shared_fire_and_reignition
design_space: >-
  一根已燃驱动烛 A 维持共享倒计时，未燃 B 的外露烛芯可通过已点火盆或 A 的外露火焰加入燃烧集合。
  同一布局允许玩家在首次边界前点燃 B，或先完成另一段必要操作、跨过边界后再点燃 B；点火不会重置倒计时，
  因而早加入的 B 多经历一次缩短，晚加入的 B 保留一格。随后让两路 B 都处于燃烧且烛芯端对齐，
  用只擦过差异格的侧滚停点、轴推面或火盆距离读取它究竟参加了几次燃烧结算。
sampling_axes:
  - B 初始长度 2—4 格，优先比较一次缩短后的相邻长度，不用直接燃尽作为正向入口。
  - 点火源分别尝试已点火盆与另一根外露燃烛；至少一种必须形成同布局早/晚加入选择。
  - 边界前后的必要行动由操作 A、移动 B 或到达点火接口构成，不用原地等待凑拍。
  - 点火后通过同样的轴推/侧滚把 B 烛芯端重新对齐，排除 consumer 只读最终位置或是否燃烧。
  - 至少尝试一个离散侧滚停点 consumer，以及一个轴推面或目标距离 consumer。
  - 把 B 初始设为已燃，检查加入选择是否消失；移除点火源或下游 consumer，检查是否只剩不可用状态差。
  - 指定 trace 不得使用烛身遮蔽、未燃重曝、退焰点火或滚动途中接触链。
