do_not_repeat:
  - 只做“把烛芯推进墙里就保长”的直接应用，没有先消费其燃烧态。
  - 只让早灭路线少点一个盆、晚灭路线少一格，却没有同一成功窗口同时连接两个 consumer。
  - 用可删的来回走动或远距离空走人为制造倒计时压力。
  - 把已经选中的 A/B 保长名额分配换皮；本轮必须围绕同一对象先用燃烧态、后用实体态。
  - 用更晚阶段的复燃把早灭错误轻易恢复，或让烛身遮蔽/滚动途中事件承担关键关系。
  - 设计完整关卡、判断课程优先级或声称结构值得占一关。
materialization_target: >-
  找到至少一个真正的双用途时间窗：同一 A 必须先以燃烧态完成 P，再在边界前墙灭保住特定实体格，
  该格随后由 B 的最小动作读取；过早、及时、过晚三条路线分别留下可核验的不同失败/成功局面。
  若无法把前后两段都变成不可替代的 consumer，则不发布新条目。
