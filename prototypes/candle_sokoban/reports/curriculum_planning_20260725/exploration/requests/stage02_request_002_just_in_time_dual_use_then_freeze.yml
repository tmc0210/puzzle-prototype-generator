stage_id: stage_02_wall_dousing
allowed_exposure_through: wall_dousing
design_space: >-
  一根燃烛 A 在同一局面中承担前后两个不同用途：它必须先保持外露燃烧，通过必要的轴推或侧滚让火焰点亮火盆 P；
  随后又必须在首次共享边界前把烛芯送入墙体退出燃烧，保住一格实体长度。
  过早走灭火路线会让 P 保持未燃；完成 P 后拖过边界再灭火会让 A 先缩短，丢失的那格使另一根蜡烛 B
  在紧接的侧滚停点、轴推面或通口 consumer 上得到错误结果。只有“先用火，再及时冻结形状”的窗口同时满足两段用途。
sampling_axes:
  - A 初始长度 2—4 格；从点亮 P 到贴墙灭火的必要行动预算尝试跨越倒计时剩余 1—3 拍。
  - 前段火焰用途至少尝试轴推改变烛芯对齐、侧滚改变火焰行/列两种路径；禁止用原地等待制造窗口。
  - 后段实体 consumer 至少尝试 B 的离散侧滚近/远停点，以及 A 保留尾端格提供/封锁轴推操作面。
  - 同一初始布局明确比较过早灭火、先点 P 后及时灭火、先点 P 但跨界后灭火三条可选路线。
  - 把 P 预先点亮，检查“必须先保持燃烧”的前半约束是否消失；移除后段 consumer，检查及时/过晚是否只剩长度差。
  - 给 A 增加一格寿命或将倒计时余量增加一拍，检查原本过晚路线是否恢复，界定窗口来源。
  - 指定 trace 不得使用火盆/烛芯复燃、烛身遮蔽、未燃重曝、退焰点火或滚动途中接触链。
