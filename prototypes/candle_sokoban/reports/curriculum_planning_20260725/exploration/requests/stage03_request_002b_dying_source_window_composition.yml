allowed_exposure_through: shared_fire_and_reignition
design_space: >-
  收口同一有限火源接火窗口：A 的两次边界寿命、B 的早/中/晚加入和只接受中间长度的后继门
  必须出现在同一初始布局与完整 trace 中。跨第一个边界的必要工作要直接准备 D 的滚道、单列上推口
  或 B 的最终点盆面；窗口路线在第二边界后生成准确三格燃 B，随后 D 恰停在唯一上推列，
  上推 D 后玩家直接取得 B 的轴推面并用 B 火焰完成同一胜利关系。早接二格应过冲该列，
  过晚四格未燃应在近端阻断或即便通过也欠缺最终火焰。
sampling_axes:
  - 从 batch 002 已验证的退移火源、准确长度门和正交交接三个局部结构出发，但重新组成一份同布局 exact。
  - 至少回放同一布局的早接、窗口接、A 燃尽后再接三条完整路线；不能用静态终局替代任一路。
  - 第一周期工作必须移动 D、打开其唯一通路或准备 B 最终点盆面；删除这段工作应让 consumer 未准备好。
  - 窗口路线的几何与火焰输出必须共同服务同一 all_braziers_lit 或单一不可替代后继链。
  - 早接与过晚失败应分别由准确长度的两侧界限读取，不能只以多走几步或无火事件收口。
  - 删除远点墙、把最终火盆预亮或把 A 换成永久火盆，分别检查长度下界、火焰职责与时间窗上界。
  - 指定 trace 不得使用烛身遮蔽、未燃重曝、退焰点火或滚动途中接触链。
current_material_refs:
  - prototypes/candle_sokoban/reports/curriculum_planning_20260725/exploration/lexicon.md
  - prototypes/candle_sokoban/reports/curriculum_planning_20260725/exploration/lexicon_index.md
