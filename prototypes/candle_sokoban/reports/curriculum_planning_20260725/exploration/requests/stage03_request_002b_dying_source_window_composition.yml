do_not_repeat:
  - 再次把动态早/中/晚和静态准确长度门分开验证。
  - 用与 consumer 无关的 C 点盆或开放区走动填满第一个周期。
  - 只证明中间长度可用，却不要求 B 已燃；或只要求 B 有火，却不读取中间长度。
  - 让早/晚错误可无代价回到窗口路线，或只增加普通路程。
  - 把完整伪关卡发布成 Lexicon 条目；仅把新增原子结构或对现有原子的证据合并入 Lexicon。
  - 设计正式关卡、判断课程优先级或编辑 experience_cores.yml。
materialization_target: >-
  一份同布局三路 exact composition：窗口接火生成准确长度与火焰，并立即通过此前由必要工作准备的 consumer 链；
  早接、过晚分别在同一链的不同界面失败。若无法闭合，保留 batch 002 的原子材料并将该体验核心降级，
  不发布新的粗粒度 Lexicon family。
