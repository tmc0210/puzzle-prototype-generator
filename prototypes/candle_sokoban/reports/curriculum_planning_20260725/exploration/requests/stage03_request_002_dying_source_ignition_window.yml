do_not_repeat:
  - 只做“在火源消失前点燃 B”的普通期限题，没有过早点燃造成的实体代价。
  - 只做早/晚加入的一次尾格差；本轮必须由有限寿命火源同时给出时间窗上界。
  - 把 A 燃尽、B 点燃或 B 缩短事件本身当成果。
  - 用无意义等待跨过第一个或第二个边界。
  - 让准确长度与火焰身份服务两个互不相关的小题；两者必须共同进入同一后继用途或胜利关系。
  - 把完整伪关卡发布成单条 Lexicon；只发布可独立拼接的细粒度结构。
  - 设计完整关卡、判断课程优先级或编辑 experience_cores.yml。
materialization_target: >-
  找到一个双边界接火窗口：早接火让 B 过度缩短，第一边界后接火留下正确长度与火焰，
  A 燃尽后则无法接火；永久源、延寿源和移除任一 consumer 的对照能证明上下界都不可删。
  完整组合留作 optional direction，Lexicon 只接收其中可独立拼接的局部结构。
