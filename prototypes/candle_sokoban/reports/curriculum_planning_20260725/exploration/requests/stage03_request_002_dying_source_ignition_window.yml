design_space: >-
  一根短燃烛 A 是未燃 B 唯一可用的火源，并会在第二次共享燃烧边界燃尽。B 若在第一次边界前接火，
  到 A 消失时会多经历两次缩短；若等第一次边界后、第二次边界前接火，只经历一次缩短；
  若拖到 A 燃尽后则永久失去点火接口。后继结构同时要求 B 已取得火焰身份，并保有中间那档准确长度，
  从而把“不能太早，也不能太晚”的接火窗口写进实体几何和后续火源职责。
sampling_axes:
  - A 优先二格燃烛：第一次边界缩成单格并移动火焰投影，第二次边界燃尽；必须实际处理点火接口随缩短退移。
  - B 初始长度 3—5 格，目标是早接火少两格、窗口接火少一格、未接火保持原长三档，不用 B 直接燃尽。
  - 同一布局提供第一次边界前接火、两边界之间接火、A 燃尽后尝试接火三条路线；跨周期行动必须是必要对象操作。
  - 后继几何至少尝试只接受“少一格”中间长度的侧滚停点或连续轴推接口，而非只区分有火/无火。
  - 再让 B 的外露火焰点亮火盆或接力给另一个未燃对象，证明取得火焰身份也是必要输出。
  - 把 A 换成永久已点火盆，检查上限是否消失；把 A 增加一格，检查接火窗口是否延后一周期。
  - 把 B 初始设为已燃，或移除几何 consumer / 后继火焰输出，分别隔离加入选择、长度下界与火焰职责。
  - 指定 trace 不得使用烛身遮蔽、未燃重曝、退焰点火或滚动途中接触链。
