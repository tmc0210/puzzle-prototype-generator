task_lexicon_ref: prototypes/candle_sokoban/reports/curriculum_planning_20260725/exploration/lexicon.md
task_index_ref: prototypes/candle_sokoban/reports/curriculum_planning_20260725/exploration/lexicon_index.md
publication_layers:
  lexicon: >-
    只发布可独立拼接的细粒度局部结构，每条说明输入状态、局部变换、最小 consumer 与适用边界；
    不把整个伪关卡、完整玩家命题或多段动作链作为单条 lexicon family。
  experience_core: >-
    Explorer 可以提出玩家侧命题，但只写入本 batch 的 proposed_families.md；由 Controller 决定是否抽象进入 experience_cores.yml。
  optional_direction: >-
    具体布局、动作回放和多个局部结构的组合留在 run artifacts，视为非约束性的可选探索方向。
