required_skill: sokoban-mechanism-lab
intent: mechanism_explore
publication_scope: task_local
workspace: prototypes/candle_sokoban/reports/curriculum_planning_20260725/exploration
dispatch_prompt: "使用 $sokoban-mechanism-lab，以 mechanism_explore 的 task_local 模式执行本文件。"
experience_seed: >-
  为 20—25 关 Candle 课程的滚动途中接触阶段寻找“同一长滚的路径事件与终点职责共同构成选择”的可玩结构；
  不把 roll_intermediate_* 事件 witness、单纯沿途点盆或碰火死亡当成果。
player_prior:
  - 已掌握全部前序机制，包括退焰交接、blocker→fuel 与跨边界接力。
  - 尚不知道侧滚每个小步都会立即结算接触，而且点火、灭火或点盆不会让滚动提前停止。
allowed_mechanisms:
  - basic_candle_manipulation
  - wall_dousing
  - shared_fire_and_reignition
  - body_concealment_and_reexposure
  - retreating_flame_transfer
  - rolling_contact_chain
allowed_tools:
  - Candle runtime adapter、ASCII parser 与逐步 replay
  - mechanism-lab-run 的局部动作回放、最终动作表与有界状态图
  - task-local 诊断脚本，但不得进入完整关卡设计
