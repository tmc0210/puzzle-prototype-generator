sampled_axes:
  - 两格 A 存活缩短，把 B 的烛芯投影／前推目的格从实体占用改成非实体退焰。
  - 边界前相同 B 轴推被挡，边界后下一次直接 B 轴推合法并点盆。
  - 一格 A 燃尽只释放无火；B 以相同长度完成相同轴推但不输出。
  - A 错列让空间提前开放但不交火；B 同样可推但不输出。
  - 移走前方未亮火盆后，退焰交接与轴推仍成立但火焰没有 consumer。
  - 已燃 B 与占住其烛芯格的 A 不能形成自然稳定态；初始接触结算会熄灭 B，解析器拒绝静默变化。
