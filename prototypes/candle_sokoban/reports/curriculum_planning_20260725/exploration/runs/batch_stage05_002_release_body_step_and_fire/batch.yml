next_sampling_axes:
  - 若 Controller 采用本方向，体验命名应落在“实体封口变成携火通道”，不要声称火与空间是两把可独立持有的钥匙。
  - 正式设计需把四次计时走步替换为必要工作，保持玩家全程不踩火，并完成 later-exposure 全图审计。
  - 若要让 A 在 B 推过接口后继续保火，需要另开结构轴；当前最短接法会由 B 烛身遮住 A 的新烛芯。
