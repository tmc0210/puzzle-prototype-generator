runId: batch_stage03_002_dying_source_ignition_window
title: "有限退移火源给出过早/窗口/过晚三档，并由准确长度与火焰共同消费"
notes: >-
  同一 A/B/C 局部图比较 B 在 A 第一次缩短前、两次边界之间和 A 燃尽后接火；
  再用静态二/三/四格 B 隔离一个只接受三格燃烛的连续 consumer。
defaults:
  maxExploreDepth: 10
  maxReturnDepth: 16
  maxStates: 16000
  maxTransitions: 64000
  win:
    type: event_occurs
    event: never_occurs
cases:
  - id: early_join_two_burns_then_realigns_len2_lit
    family: dying_source_double_boundary_window
    variant: before_first_boundary_overburn
    changed_variable: "B 在第一边界前进入 A 的旧火焰格"
    contrast_with:
      - middle_join_one_burn_realigns_len3_lit
      - late_after_burnout_stays_len4_unlit
    notes: >-
      第一步把四格 B 右推一格，B 的投影进入二格 A 的旧火焰格并接火；
      之后下推一根单格燃烛 C 点亮永久火盆并绕回操作侧，跨过两次边界。B 参加两次缩短，
      A 先退移再燃尽；最后把 B 再右推两格，使其烛芯端与窗口分支同列，留下二格燃烛。
    layout: |
      ..............
      ..............
      ..............
      ...@333r..L2..
      ...D..........
      ..............
      ..#o#.........
      ...#..........
    actions: [right, left, down, left, up, up, right, down, left, right, right, right, right]

  - id: middle_join_one_burn_realigns_len3_lit
    family: dying_source_double_boundary_window
    variant: between_boundaries_exact_len_and_fire
    changed_variable: "先让 A 缩短一次，再把 B 推入退移后的火焰格"
    contrast_with:
      - early_join_two_burns_then_realigns_len2_lit
      - late_after_burnout_stays_len4_unlit
      - prelit_b_removes_join_choice
    notes: >-
      先下推单格燃烛 C 点亮永久火盆，并沿外侧路线于第五拍让 A 从二格缩成单格；
      第七、八拍连续右推 B，第二推使 B 的投影进入 A 退移到 x10 的火焰格并接火。
      第十拍 A 燃尽、B 只缩短一次，最终为三格燃烛且烛芯投影与早分支同在 x9。
    layout: |
      ..............
      ..............
      ..............
      ...@333r..L2..
      ...D..........
      ..............
      ..#o#.........
      ...#..........
    actions: [down, left, up, up, right, down, right, right, left, left]

  - id: late_after_burnout_stays_len4_unlit
    family: dying_source_double_boundary_window
    variant: after_second_boundary_no_fire
    changed_variable: "等 A 在第二边界燃尽后才把 B 推到对齐列"
    contrast_with:
      - middle_join_one_burn_realigns_len3_lit
      - permanent_brazier_removes_upper_deadline
      - longer_a_delays_upper_deadline
    notes: >-
      先下推 C 点亮永久火盆，再让有限烛 A 经历第一次缩短和第二次燃尽；
      第十一拍右推 B 一格，使其烛芯投影与前两路最终同在 x9，但已无火源，故保持四格未燃。
    layout: |
      ..............
      ..............
      ..............
      ...@333r..L2..
      ...D..........
      ..............
      ..#o#.........
      ...#..........
    actions: [down, left, up, up, right, down, left, up, right, down, right]

  - id: permanent_brazier_removes_upper_deadline
    family: dying_source_double_boundary_window
    variant: permanent_source_after_second_boundary
    changed_variable: "把有限 A 换成固定已点亮火盆"
    contrast_with: late_after_burnout_stays_len4_unlit
    notes: >-
      同样先跨过两次边界，再把 B 右推两格，使投影进入 x10 的永久火盆；
      B 仍能在第二边界后接火，原本由 A 燃尽形成的上限消失。
    layout: |
      ..............
      ..............
      ..............
      ...@333r..O...
      ...D..........
      ..............
      ..#o#.........
      ...#..........
    actions: [down, left, up, up, right, down, left, up, right, down, right, right]

  - id: longer_a_delays_upper_deadline
    family: dying_source_double_boundary_window
    variant: three_cell_source_survives_second_boundary
    changed_variable: "A 从二格增为三格，火焰接口多退移一周期"
    contrast_with: late_after_burnout_stays_len4_unlit
    notes: >-
      A 使用 L22；第二边界后仍剩单格并把火焰投影退到 x11。
      第十一至十三拍把 B 连推三格，B 的投影进入 x11 并接火，证明上限随 A 寿命延后一周期。
    layout: |
      ...............
      ...............
      ...............
      ...@333r..L22..
      ...D...........
      ...............
      ..#o#..........
      ...#...........
    actions: [down, left, up, up, right, down, left, up, right, down, right, right, right]

  - id: prelit_b_removes_join_choice
    family: dying_source_double_boundary_window
    variant: prelit_control_overburns
    changed_variable: "B 初始已燃，删除何时加入的选择"
    contrast_with: middle_join_one_burn_realigns_len3_lit
    notes: >-
      重放窗口路线，但 B 开局即燃；它在第一、第二边界都缩短，最终不会留下三格中间档。
    layout: |
      ..............
      ..............
      ..............
      ...@333R..L2..
      ...D..........
      ..............
      ..#o#.........
      ...#..........
    actions: [down, left, up, up, right, down, right, right, left, left]

  - id: exact_len3_lit_passes_gate_and_lights
    family: exact_middle_length_with_fire_output
    variant: len3_lit_combined_consumer
    changed_variable: "B 为三格且已燃"
    contrast_with:
      - len4_lit_blocks_probe_near
      - len2_lit_overshoots_gate
      - exact_len3_unlit_passes_gate_but_no_light
      - exact_len3_lit_without_brazier_has_no_fire_output
    notes: >-
      B 占 x8..10，未燃竖烛 D 从 x6 侧滚一格停在 x7；玩家从下方把 D 上推过 x7 的单格口，
      随即站到 B 尾端左侧并右推 B。B 的外露火焰只在这一步到达 x12 火盆并点亮它。
    layout: |
      ..............
      ..............
      ........#.....
      ......u.......
      .....@4.22R.o.
      ..............
      ..............
    actions: [right, down, right, up, right]

  - id: len4_lit_blocks_probe_near
    family: exact_middle_length_with_fire_output
    variant: len4_near_roll_blocked
    changed_variable: "B 多保留一格尾端，占据 x7"
    contrast_with: exact_len3_lit_passes_gate_and_lights
    notes: >-
      四格 B 占 x7..10；D 初始已贴住 B 尾端，同一第一步 right 为 roll_blocked，
      无法进入后续上推口与 B 的点盆推动面。
    layout: |
      ..............
      ..............
      ........#.....
      ......u.......
      .....@4333R.o.
      ..............
      ..............
    actions: []

  - id: len2_lit_overshoots_gate
    family: exact_middle_length_with_fire_output
    variant: len2_far_stop_blocked_up
    changed_variable: "B 少一格尾端，D 侧滚到 x8"
    contrast_with: exact_len3_lit_passes_gate_and_lights
    notes: >-
      二格 B 占 x9..10；D 滚到 x8 后，玩家绕到其下方，同一上推被 x8,y2 的墙挡住，
      因而不能站到 B 尾端左侧执行点盆轴推。
    layout: |
      ..............
      ..............
      ........#.....
      ......u.......
      .....@4..5R.o.
      ..............
      ..............
    actions: [right, down, right, right]

  - id: len2_without_far_wall_can_use_up_lane
    family: exact_middle_length_with_fire_output
    variant: far_endpoint_consumer_removed
    changed_variable: "删除 x8 上方只阻挡短 B 远停点的墙"
    contrast_with: len2_lit_overshoots_gate
    notes: >-
      二格 B 仍让 D 滚到 x8；删除 x8,y2 墙后，同样绕到 D 下方时 up 重新合法。
      这只隔离单列上推口对远停点的消费，不声称二格分支已完成后续点盆链。
    layout: |
      ..............
      ..............
      ..............
      ......u.......
      .....@4..5R.o.
      ..............
      ..............
    actions: [right, down, right, right]

  - id: exact_len3_unlit_passes_gate_but_no_light
    family: exact_middle_length_with_fire_output
    variant: len3_unlit_fire_identity_control
    changed_variable: "保留三格几何，但 B 改为未燃"
    contrast_with: exact_len3_lit_passes_gate_and_lights
    notes: >-
      D 仍通过 x7 单格上推口，B 的最终右推也合法；但未燃 B 没有火焰输出，x12 火盆保持未点亮。
    layout: |
      ..............
      ..............
      ........#.....
      ......u.......
      .....@4.22r.o.
      ..............
      ..............
    actions: [right, down, right, up, right]

  - id: exact_len3_lit_without_brazier_has_no_fire_output
    family: exact_middle_length_with_fire_output
    variant: fire_consumer_removed
    changed_variable: "删除 B 最终火焰投影处的火盆"
    contrast_with: exact_len3_lit_passes_gate_and_lights
    notes: >-
      精确三格仍让 D 通过单格口，B 最终右推也合法，但删除 x12 火盆后只剩对象位移，不再有火焰输出。
    layout: |
      ..............
      ..............
      ........#.....
      ......u.......
      .....@4.22R...
      ..............
      ..............
    actions: [right, down, right, up, right]
