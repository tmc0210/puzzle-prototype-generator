runId: batch_stage03_002b_dying_source_window_composition
title: "同图有限火源窗口：必要通路准备、三档长度门与最终火焰输出"
notes: >-
  同一布局回放早接、窗口接、火源消失后再接；第一周期把阻住 D 回返路的 E 推离，
  窗口路线用 D 的滚动动作先读取三格 B，再允许后续共享边界继续缩短 B，最后由同一 B 点亮唯一火盆。
defaults:
  maxExploreDepth: 8
  maxReturnDepth: 16
  maxStates: 12000
  maxTransitions: 48000
  win:
    type: all_braziers_lit
cases:
  - id: middle_window_same_layout_completes_single_chain
    family: dying_source_window_same_layout_composition
    variant: middle_join_exact_endpoint_and_fire_win
    changed_variable: "第一次边界后接退移火焰，D 在下一边界结算前先锁存中间终点"
    contrast_with:
      - early_join_same_layout_stops_at_far_wall
      - late_join_same_layout_passes_geometry_but_unlit
      - middle_without_corridor_preparation_misses_len3_read
      - middle_without_final_brazier_has_no_output
    notes: >-
      第 1 拍下推 E，直接打开从 B 左侧绕回 D 操作面的唯一短路；第 5 拍 A 首次缩短。
      第 7、8 拍两推 B，在 A 退移后的火焰格接火；第 10 拍 B 缩为三格。
      第 15 拍侧滚 D：动作先以三格 B 决定中间终点，再结算下一次缩短。
      第 20 拍上推 D 后玩家恰在 B 尾端左侧；随后五次轴推穿过已燃尽 A 的旧占格，
      最后一推用 B 的火焰点亮唯一火盆并获胜。
    layout: |
      ....................
      ....................
      ............#.......
      ........u...........
      ........4@333r..L2o.
      ......#..d..........
      ....................
      ....................
    actions: [down, up, up, right, left, down, right, right, down, left, left, left, left, up, right, down, right, right, right, up, right, right, right, right, right]

  - id: early_join_same_layout_stops_at_far_wall
    family: dying_source_window_same_layout_composition
    variant: early_join_short_tail_far_endpoint
    changed_variable: "先推 B 接旧火焰，再完成同一 E 通路准备"
    contrast_with:
      - middle_window_same_layout_completes_single_chain
      - early_without_far_wall_can_push_up
    notes: >-
      第 1 拍 B 提前接火；随后仍把 E 推离并把 B 送到与窗口分支相同的烛芯端。
      B 多参加一次边界，D 因短尾端多滚一列到 x12；玩家到达其下方时，`up` 被该列上墙拒绝。
    layout: |
      ....................
      ....................
      ............#.......
      ........u...........
      ........4@333r..L2o.
      ......#..d..........
      ....................
      ....................
    actions: [right, left, down, up, right, right, right, down, left, left, left, left, left, up, right, down, right, right, right, right]

  - id: late_join_same_layout_passes_geometry_but_unlit
    family: dying_source_window_same_layout_composition
    variant: after_source_burnout_long_tail_near_endpoint
    changed_variable: "A 第二次边界燃尽后才推 B 到对齐列"
    contrast_with: middle_window_same_layout_completes_single_chain
    notes: >-
      同样先推开 E，但让 A 经第二边界燃尽后才一推 B；B 保持四格且未燃。
      D 被长尾端截在 x10；玩家仍可上推 D 并继续轴推 B，但 B 没有火焰，唯一火盆保持未点亮。
    layout: |
      ....................
      ....................
      ............#.......
      ........u...........
      ........4@333r..L2o.
      ......#..d..........
      ....................
      ....................
    actions: [down, up, up, right, left, down, up, right, left, down, right, down, left, left, left, up, right, down, right, right, up, right, right, right]

  - id: early_without_far_wall_can_push_up
    family: dying_source_window_same_layout_composition
    variant: far_endpoint_consumer_removed
    changed_variable: "删除 x12 上方只拒绝过早短尾端的墙"
    contrast_with: early_join_same_layout_stops_at_far_wall
    notes: >-
      重放过早路线并删除远列上墙；D 仍停在 x12，但到达其下方后 `up` 恢复合法。
    layout: |
      ....................
      ....................
      ....................
      ........u...........
      ........4@333r..L2o.
      ......#..d..........
      ....................
      ....................
    actions: [right, left, down, up, right, right, right, down, left, left, left, left, left, up, right, down, right, right, right, right]

  - id: middle_without_corridor_preparation_misses_len3_read
    family: dying_source_window_same_layout_composition
    variant: return_lane_left_blocked
    changed_variable: "保留 E 在 x9,y5，不执行第一拍通路准备"
    contrast_with: middle_window_same_layout_completes_single_chain
    notes: >-
      B 仍在窗口接火并于第二边界成为三格；返回时从右侧推动 E，只会让它停到 x6 墙旁的 x7，
      玩家到 x8 后同一 `left` 变成 `roll_blocked`，不能在 B 下一次缩短前到达 D 左侧。
    layout: |
      ....................
      ....................
      ............#.......
      ........u...........
      ........4@333r..L2o.
      ......#..d..........
      ....................
      ....................
    actions: [up, right, left, down, up, down, right, right, down, left, left, left]

  - id: middle_without_final_brazier_has_no_output
    family: dying_source_window_same_layout_composition
    variant: final_fire_consumer_removed
    changed_variable: "删除 B 最终火焰投影处的唯一火盆"
    contrast_with: middle_window_same_layout_completes_single_chain
    notes: >-
      重放完整窗口链；长度门、D 上推与 B 的五次轴推都仍合法，但最后没有永久火焰输出，也不会获胜。
    win:
      type: event_occurs
      event: never_occurs
    layout: |
      ....................
      ....................
      ............#.......
      ........u...........
      ........4@333r..L2..
      ......#..d..........
      ....................
      ....................
    actions: [down, up, up, right, left, down, right, right, down, left, left, left, left, up, right, down, right, right, right, up, right, right, right, right, right]
