runId: batch_stage02_003_staggered_exit_length_vector
title: "跨两边界错峰墙灭后的 4/3/2 尾端阶梯"
notes: "三根等长燃烛错峰退出 -> 对齐烛芯端留下长/中/短尾端阶梯 -> 同一未燃横向单格探针连续读取三处占格与缺口"
defaults:
  maxExploreDepth: 9
  maxReturnDepth: 12
  maxStates: 30000
  maxTransitions: 120000
cases:
  - id: staggered_432_full_chain
    family: staggered_exit_length_vector
    variant: generated_432_single_probe_chain
    changed_variable: "A/B/C 分别在第一边界前、两边界之间、第二边界后墙灭"
    contrast_with:
      - swapped_342_first_phase_collapses
      - same_cycle_442_second_pass_blocked
      - c_medium_433_first_tail_push_blocked
      - c_removed_second_tail_push_legal
    notes: "同一初始布局先生成 4/3/2，再把同一未燃横向单格探针依次送过 A 近停、B 占格/缺口和 C 缺口/占格；动作止于探针进入 C 的 x8 缺口。"
    layout: |
