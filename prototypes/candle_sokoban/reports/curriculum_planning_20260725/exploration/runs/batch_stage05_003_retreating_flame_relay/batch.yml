sampled_axes:
  - 玩家在第一边界动作中把三格未燃 B 推入同时连接 A 与 C 的直角中继槽。
  - A→B 与 B→C 分属相邻两个燃烧边界；结算后接火者不在同边界继续缩短或传火。
  - 过早路让 C 在第一边界接火、第二边界缩成两格燃烧；准传路让 C 在第二边界接火并保持三格燃烧。
  - 一格 B 在第一边界接火、第二边界燃尽，C 保持三格未燃。
  - 同一尾行停墙让三格与两格 C 侧滚到相同 x 终点；y=4 远插口同时拒绝两格燃与三格未燃。
  - 下移到 y=5 的近插口恢复过早路输出；移除远插口后正确 relay 不再产生点盆输出。
  - 五条指定 trace 均未触发 rolling_contact_chain 事件；开放局部图能到达晚事件，不能作为正式 exposure-clean 候选。
