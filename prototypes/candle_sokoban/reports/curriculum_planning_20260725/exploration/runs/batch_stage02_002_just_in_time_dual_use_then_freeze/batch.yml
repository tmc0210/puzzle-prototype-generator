  - 同一初始布局中的过早、及时、过晚三条路线。
  - A 先轴推点 P，再在第四拍墙灭保三格；或先准备 B，在第五拍缩成二格后复位墙灭。
  - 两路烛芯端对齐后，B 同列下一次 down 的 axis_push_blocked / push_axis consumer。
  - P 预亮的前段反事实。
  - 删除 B 的后段反事实。
  - 静态补回一格尾端的余量边界。
  - 一步侧滚在终点点 P 的前段近邻；未形成同一 A 的后续墙灭窗口。
  - 指定 trace 的后期事件缺席检查。
