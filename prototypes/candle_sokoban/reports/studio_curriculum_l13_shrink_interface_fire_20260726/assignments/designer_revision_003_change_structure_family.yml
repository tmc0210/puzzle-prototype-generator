design_brief: >-
  依据已校验的 Designer action，保留同一 candidate 与 blocker-to-fuel 体验核心，但更换结构族；不要求
  保留 exact_003 的布局、坐标、强制 C、开局预对齐或单通路自动计时/站位。新 family 必须从第一性原理
  让玩家在边界前主动建立或保全接口：A 的存活长度/对齐、B 的接火位置、边界拍与 B 后继直接消费中，
  至少一个关键条件不能开局全部满足，且玩家必须在多个局部可行的对象操作之间以未来 blocker->fuel 翻转
  压缩选择。正确承诺后仍要有至少一次读取此前具体状态或几何的生产性判断；不能回到一次二择后线性兑现。
  边界后的下一次对象操作仍应直接用 B 消费同一接口与火，不在高潮后拼接清理段。不得用加长路线、裸等待、
  目标硬化、重复 witness、无反馈 deadend 或无关对象子题抬难度；每个主要对象都必须在同一因果链履职。
  目标是被玩家实物支持的相对难度 5，不是事件密度或指标 5。可优先试新的局部材料方向；若现有 task-local
  lexicon 不足，可按模板向 exploration_request_root 写一个抽象关系 request，交 Controller 调度 Explorer。
  完成后发布同一 candidate 的新 immutable exact，完整重跑 replay、完整图、解族、对象参与、身份反事实与
  complete/pass exposure；Critic 退回意见与修改说明不得进入新送审包或后续 Critic base。
