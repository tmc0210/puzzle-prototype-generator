design_brief: >-
  为课程第 13 关建立体验简报。人类指定核心是 S05_T02_SHRINK_RELEASES_INTERFACE_AND_FIRE：
  让实体封口在共享燃烧边界上翻成携火通道。玩家此前已完成 L01-L12 所列知识，
  本关允许暴露到 retreating_flame_transfer，目标相对难度为 5。体验核心必须从玩家主动选择、
  动后可见的 blocker→fuel 同格原子翻转、下一次直接轴推的最小 consumer 与错误反事实出发；
  规划中的 optional direction 可优先校准，但不可行时可换新结构族。此阶段只完成归档校准与体验简报，
  不发布 layout 或 exact。
