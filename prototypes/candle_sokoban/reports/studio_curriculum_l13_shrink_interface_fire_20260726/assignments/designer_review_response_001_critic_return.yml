design_brief: >-
  Fresh Critic 已明确退回 exact_003。它认可退焰接火与紧接轴推的因果集中、表达干净，也确认没有
  拼接或清理税；但开场侧滚和短通路自然完成计时与站位，交接发生后 B 的燃烧态、轴推方向与正上方
  火盆立即显出答案。对已掌握 L01-L12 的玩家，当前作品无需在决策前整合 A 存活长度、接口身份翻转、
  B 接火与后继消费，因而只是紧凑演示，确认低于目标难度 5。结合新增 Candle 人评归档，当前结构还
  命中“开局二择后决策坍缩”的直接风险。请只回应本轮 Critic：选择 revise_candidate、
  change_structure_family、withdraw_exact 或仅在 packet 有事实错误时 dispute_raw_packet。不得改写 exact_003，
  不得在本 assignment 下开始新布局或发布新 exact；下一轮结构工作由 Controller 依据 action 另发 assignment。
