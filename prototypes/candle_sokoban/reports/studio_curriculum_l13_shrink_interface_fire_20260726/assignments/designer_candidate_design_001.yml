design_brief: >-
  依据已验证的 experience_brief，为课程 L13 的唯一候选 CANDLE_CURRICULUM_L13_001
  运行连续 Design Studio 工作台并制作完整单关。目标体验是玩家主动保留仍可存活且对齐的 A 到共享边界，
  使同一格从遮芯且封路的实体端帽原子翻成非实体退焰 fuel；B 在结算后接火，下一次直接轴推
  必须同时消费通路与火。目标相对难度 5，allowed_exposure_through=retreating_flame_transfer，
  正式胜利只能是 all_braziers_lit。fixture 只是局部材料且 exposure fail，不得直接包装成候选；
  必须把计时动作换成与核心因果相连的必要选择，封闭 rolling_contact_chain later-event 旁路。
  规划 optional direction 可优先尝试；若实际不可行，可在同一体验核心和 candidate id 下更换结构族。
  难度 5 必须维护 reasoning sketch。只有完整关卡、规范 replay、解族自查、identity counterfactual、
  complete/pass exposure 与玩家侧重读全部成立后，才发布第一份 immutable exact 和强制送审包。
