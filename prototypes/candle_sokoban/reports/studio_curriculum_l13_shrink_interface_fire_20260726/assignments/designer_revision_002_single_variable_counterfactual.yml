design_brief: >-
  Fresh Evidence Reviewer 已支持 exact_002 的 exact integrity、规范解、完整图、equivalent_variants_only、
  必经事件链、无传火/复燃旁路、对象参与及 exposure gate；唯一未知项是 mechanical identity
  counterfactuals。现有 receiver_one_cell_gap 不是从当前 exact 只移动 B 一格的单变量变体，而是同时
  改变画布、墙形、玩家、火盆、移除 C，并改变 A/B 长度和整体位置，且其中另有 A 侧滚直接点盆旁路，
  因而不能隔离支持“B 错列/一格间隙”。继续同一候选工作台，不得修改 frozen exact_002；以当前 exact
  为基准优先构造一份严格单变量的 B 错列反事实：保持 10x6 画布、全部墙、玩家、火盆、A、C、全部
  对象长度/方向/燃烧态不变，只把 B 移动恰好一个正交格，或以同等严格且可审计的最小单变量表达错列。
  对该变体运行 raw replay、complete graph 和身份分析，并显式披露全部胜路族/旁路。若 runtime/parser
  使任何合法单变量错列都无法表达，则不得拿复合 fixture 代替；应收窄或删除送审包中无法支持的
  “一格间隙”声明，并让保留的反事实措辞与实际证据严格一致。发布新的 immutable exact_003（主布局和
  体验关系可保持不变），重新绑定 manifest、submission packet、provenance 与所有主证据。不得把审查
  文字写进审美叙事，不得修改 Controller 账本、Critic 或交付状态。
