initial_read:
  - 两格燃烧 A 横在单格未燃 B 上方；A 端帽与 B 烛芯投影重合，B 推进方向的火盆全图可见。
  - 燃烧 C 挡在玩家与核心之间；唯一首拍把 C 向右侧滚两格并由 A 尾部遮灭，玩家落在上下分叉点。
  - 分叉后向上可绕到 A 尾侧并真实推走 A，向下则进入 B 尾侧站位线。

canonical_read:
  - 首拍退出 C，却由 A 烛身完成遮灭与夹持，使准备工序与核心实体关系绑定。
  - 第 5 拍 A 从两格缩为单格；旧端帽格由实体 blocker 原子翻成退焰 fuel，并以 shrink_ignite 点燃 B。
  - 第 6 拍直接轴推 B；B 占入旧端帽格，烛芯点亮 (6,1) 火盆并正常胜利。

wrong_read:
  - "`right, up, right, right` 会真实推动 A；A 新烛芯撞墙熄灭，错列身体继续堵住 B。"
  - 该端点在完整图中不能到达胜利，失败反馈直接对应“把未来火源当成普通挡路物清走”。

