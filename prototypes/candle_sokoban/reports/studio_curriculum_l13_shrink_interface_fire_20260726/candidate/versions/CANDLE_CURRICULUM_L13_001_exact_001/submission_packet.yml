designer_claim:
  player_experience_core: >-
    玩家保留看似应该提前清走的两格燃烛 A 到共享边界；A 的实体端帽原地消失并成为退焰 fuel，
    同格点燃 B。玩家随即直接把 B 推入刚腾出的格，让同一份火点亮必要火盆。
  player_action: >-
    首拍侧滚 C 并让 A 尾部遮灭它；在落位后的上下分叉放弃推走 A，改走短线抵达 B 尾侧。
    第 5 拍见证 A->B 交接，第 6 拍直接向上轴推 B。
  visible_payoff: >-
    A 旧端帽格在同一边界由实体封口变为退焰，B 当场由未燃变为燃烧；下一推让 B 身体占入该格，
    烛芯进入紧邻火盆并正常胜利，同时 B 烛身遮住 A，集中结束接力。
  why_this_level_exists: >-
    课程此前已经教会墙灭、共享边界、遮芯和未燃重曝；本关第一次把“挡路实体”和“未来火源”压成
    同一个必须保留到边界的空间—火焰接口，并要求玩家用最终职责反判眼前的清障诱惑。
  work_identity_conditions:
    - A 在目标边界前必须保持燃烧、两格存活长度与接口对齐，边界后缩为单格。
    - A 旧端帽格在边界前同时遮住 B 烛芯并阻挡 B 下一次轴推。
    - 同一格在边界后同时失去实体阻挡并以 retreating flame 触发 shrink_ignite B。
    - B 获火后的下一次对象操作必须是直接轴推 B；不得插入 A、C 或其它对象任务。
    - B 的直接推必须占入旧端帽格并同拍 light_brazier:6,1、win_all_braziers_lit。
    - C 必须在首拍侧滚并由 A 尾部遮灭；保留核心关系的胜路中 C 不得再次参与。
    - 所有胜路只能在纯移动时序和无后继的终局同拍 B 燃尽上变化。

packaging_account:
  opening: >-
    10x6 画面中 A、B、C、共享格与火盆全部同屏。首拍 C 侧滚是唯一进展，但它把玩家交到真实上下分叉：
    向上可绕到 A 尾侧并合法推 A，向下则进入 B 尾侧准备线。
  preparation: >-
    正确首拍让 C 由 A 尾部遮灭并夹住；余下四拍是从同一分叉取得 B 操作侧。删除 C 后完整图仍可赢，
    但首拍退化为 walk，说明当前准备拍承担对象职责而不是裸耗倒计时。
  reveal_or_use: >-
    第 5 拍集中结算 shrink A 与 shrink_ignite B；该拍同时开放实体通道和授予火焰，没有普通点火中间态。
  ending: >-
    规范路线第 6 拍直接推 B，点亮唯一火盆并正常胜利；高潮后没有走位、清理或第二子题。
  every_major_element_role:
    - A：实体封口、C 遮灭/夹持体、唯一退焰来源；错误推法会墙灭且继续堵路。
    - B：初始未燃接收者、接口消费者与唯一火盆输出载体。
    - C：首拍必要对象工序，把边界准备绑定到 A 烛身并建立上下承诺分叉。
    - brazier:6,1：B 获火后的紧接必要消费者和正式胜利终点。
    - A 火焰侧墙：使提前推 A 的错误承诺产生可见墙灭且不可恢复。
    - B 右侧墙与紧凑外壳：关闭 C/B 的无关滚动操作面，并把对象关系保持在单一小簇。
    - 下方四格操作面：允许从分叉取得 B 尾侧，不承担独立路线谜题。
  known_perceptible_defects:
    - 第一拍 C 侧滚是唯一合法进展；局部选择压力从落位后的上下分叉才开始。
    - 正确分支一旦读懂，后四拍空间路线线性；难度主要来自预见关系而非操作复杂度。
    - C 可能先被读成入口钥匙；删除反事实证明其准备身份，但玩家可感价值仍需 Critic 判断。
    - 完整图有深度 8 与 10 的纯移动时序胜态；它们不改变对象骨架，但可能削弱“紧接”的表面节奏。

