    mutation: 删除 C，保留玩家、A、B、火盆与墙形。
    graph: {status: complete, states: 550, edges: 1444, winning_states: 3, shortest_cost: 6}
    exposure: {verdict: pass, forbidden_hits: 0}
    canonical_difference: 同样六个输入的首拍从 roll+douse C 退化为 walk；前五拍不再有任何对象准备事件。
    result: solvable_but_player_preparation_identity_removed
    refs: [counterfactuals/cf_support_removed_layout.txt, counterfactuals/cf_support_removed_graph.json]

  - id: source_lengthened
    mutation: A 从两格改为三格，保留端帽、B、C 与火盆。
    graph: {status: complete, states: 4359, edges: 11320, winning_states: 6}
    exposure: {verdict: fail, forbidden_hits: 1, forbidden_event: roll_intermediate_extinguish:candle#single2:d1}
    non_equivalent_witnesses:
      - {winning_node: 135, shortest_cost: 12, account: 首次交接后推 A 遮灭 B，下一边界二次 shrink_ignite B。}
      - {winning_node: 218, shortest_cost: 14, account: B 燃尽后 A 二次退焰点燃 C，再滚/推 C 点盆。}
      - {winning_node: 233, shortest_cost: 14, account: 延后推 A 遮灭 B 后再次 shrink_ignite B。}
    result: second_transfer_and_support_takeover_families_reappear
    refs: [counterfactuals/cf_source_long_layout.txt, counterfactuals/cf_source_long_graph.json]

