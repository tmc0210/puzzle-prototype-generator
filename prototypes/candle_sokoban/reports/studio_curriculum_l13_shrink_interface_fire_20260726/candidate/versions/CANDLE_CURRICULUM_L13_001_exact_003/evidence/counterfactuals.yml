      只把 B（candle#single3）从 (6,3) 下移到 (6,4)，Manhattan distance=1；10x6 画布、全部墙、
      玩家、火盆、A、C、全部对象方向/长度/燃烧态不变。
    counterfactual_layout_sha256: 780f0371316d97d4828262268592f5317a6aed75cc5319b8cfe473cf21dfd34e
    direct_replay:
      inputs: [right, down, right, right, up]
      target_boundary_events: [shrink:candle#1:len1, shrink_ignite:candle#single2]
      receiver_b_shrink_ignite: false
      final_win: false
    graph: {status: complete, states: 278, edges: 718, winning_states: 0}
    full_graph_identity_result:
      winning_path_families: []
      winning_bypass_count: 0
      shrink_ignite_receiver_edge_count: 0
      push_receiver_edge_count: 0
      ordinary_ignite_receiver_edge_count: 0
      alternative_shrink_ignite_c_edge_count: 11
    downstream_disclosure: >-
      B 不再截停 C，故 C 首拍多滚一格并使 roll_intermediate_extinguish 可达；目标边界可把 A 的退焰交给 C，
      但完整图没有胜态。这些都是同一位置干预的实际下游结果，不隐藏为“只改火焰”。
    result: strict_single_variable_shift_is_unsolvable_and_exact_alignment_is_required
    claim_limit: >-
      只支持“当前 exact 的 B 精确对齐不可移除”；不声称错列版仍可解、会在下一推普通点燃 B，或保留 C 的
      滚动终点和 B 的操作面。
    refs:
      - counterfactuals/cf_receiver_b_shift_down/layout.txt
      - counterfactuals/cf_receiver_b_shift_down/replay.json
      - counterfactuals/cf_receiver_b_shift_down/complete_graph.json
      - counterfactuals/cf_receiver_b_shift_down/identity_analysis.json

