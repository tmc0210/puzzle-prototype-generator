conclusion: >-
  当前 exact 的两格 A、单格 B、必要 C 工序、同格对齐和紧邻 consumer 共同关闭提前清 A、
  二次传火、C 接管、B 多推修复与无消费输出。严格 B 下移一格反事实证明当前精确对齐不可移除；
  不再把旧复合 fixture 的“仍可解但普通点火”行为外推为当前 exact 的单变量性质。全部十项反事实均由
  exact_003 白名单内 artifact 支持。
