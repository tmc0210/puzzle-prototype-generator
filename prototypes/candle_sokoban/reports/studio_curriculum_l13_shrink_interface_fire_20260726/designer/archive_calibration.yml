target_transfer:
  positive_requirements:
    - >-
      开局必须让玩家看见 A 末格同时是 B 烛芯遮蔽体和下一次轴推的身体目的格，
      使 blocker 与潜在 fuel 的矛盾在行动前可读。
    - >-
      玩家必须主动选择让仍可存活的 A 保持对齐直到边界；不能由唯一走廊或无选择动画自动完成。
    - >-
      边界后同一格的 blocker->fuel 翻转必须集中、可见，B 随即得到火且刚释放格可由其身体进入。
    - >-
      最小 consumer 固定为 B 的下一次直接轴推：同一动作既进入刚释放格，又把当前火焰送到前方输出。
    - >-
      难度 5 应来自玩家预见准确边界形态并安排必要工序和操作侧，而不是空走凑拍、路线税、
      大地图、重复 witness 或反馈迟缓的 deadend 数量。
    - >-
      若有前序，它必须让玩家在多个局部可行的 A 处理方式中为最终同格接口作选择；
      若有后继，它只能消费这次原子翻转留下的状态，不能另起独立子题。
  decisive_counterfactuals:
    - >-
      A 在边界前被移开或错列：通行空间可能开放，但 B 不从同格退焰接火，直接轴推几何可成立而输出失败。
    - >-
      A 只剩一格并在边界燃尽：同一通道开放，但没有存活缩短留下的退焰火，B 保持未燃。
    - >-
      移除前方火盆或等价火焰 consumer：接口翻转仍发生，但退焰所得火没有玩家可感的后继职责。
    - >-
      在 A 仍占 B 烛芯格时预先令 B 燃烧不是稳定可持有的双钥匙反事实；接触结算会立即以烛身遮蔽熄灭 B。
  rejection_signals:
    - 核心只在 canonical replay 中发生，但玩家从开局没有真实选择。
    - 关键前缀只是单行道搬运、开放走路凑四拍或完成后退休的机制演出。
    - 依靠多个事件、多个对象或多个段落补偿 blocker->fuel 翻转本身不清楚。
    - B 的直接轴推只消费通路、不消费火，或只消费火、不消费刚释放身体目的格。
    - 引入 rolling_contact_chain 的可达旁路或途中点盆来替代本关的直接轴推 consumer。

