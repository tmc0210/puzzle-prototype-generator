publication_result: >-
  work_13 的 identity、player-side、完整图、全胜解族、required participation、反事实、direct replay 与 exposure
  均通过 Designer 自查；已从相同 layout hash 发布首个 immutable exact 和强制送审包。

identity_gates:
  - id: living_source_at_target_boundary
    status: passed
    requirement: 目标边界发生前 A 持续燃烧且保持接口对齐，边界后 A 仍存活。
  - id: atomic_blocker_to_fuel
    status: passed
    requirement: 同一旧端帽格在目标边界原子地由实体阻挡格变为非实体退焰燃料格，并由该事件以 shrink_ignite 点燃 B。
  - id: exactly_one_transfer
    status: passed
    requirement: 每个标准胜利只出现一次点燃 B 的 shrink_ignite；不得通过操作 A、灭掉 B 或等待边界制造第二次传火。
  - id: immediate_receiver_push
    status: passed
    requirement: B 首次获火后的下一次对象操作必须是对 B 的直接轴推，且该推同拍穿过已打开的接口并点亮必需火盆。
  - id: no_post_transfer_object_task
    status: passed
    requirement: 首次传火与点盆推之间不得操作 A、C 或任何其他对象；只允许不改变对象骨架的纯走位时序松弛。
  - id: no_ordinary_ignition_bypass
    status: passed
    requirement: 不存在 ignite_from_wick、滚动接触、复燃或其他火源替代目标 shrink_ignite 的胜利。

player_side_gates:
  - id: real_opening_choice
    status: passed
    requirement: 开局至少有一个机械合法且局部可理解的对象承诺会破坏接口；错误不是被墙直接禁止，也不是纯粹随机试错。
  - id: player_builds_read
    status: passed
    requirement: 玩家必须主动识别并保留“活着且对齐的 A”，而不是只沿唯一走廊走到计时点。
  - id: no_route_tax
    status: passed
    requirement: 边界前的动作承担对象判断、站位或状态准备，不以无意义绕路或等待单纯凑拍。
  - id: difficulty_five
    status: passed
    requirement: 难度来自读懂实体端帽到退焰燃料的原子翻转及其一次性后果，而非路线搜索、隐藏状态或操作长度。
  - id: immediate_payoff
    status: passed
    requirement: 玩家在识别传火后立即用下一次对象操作兑现点盆，保持清晰的因果回声。

mechanical_evidence_gates:
  - id: complete_solution_graph
    status: passed
    requirement: 从最终 exact version 完整枚举可达状态和全部标准胜利，不以抽样或单条 replay 代替。
  - id: solution_family_identity
    status: passed
    requirement: 全部标准胜利归入同一对象事件骨架；变体只能发生在不改变对象参与和核心时序的纯移动层。
  - id: exposure_complete
    status: passed
    requirement: 对全部可达转移做暴露检查；只允许 retreating_flame_transfer 暴露，滚动相关事件全闭合。
  - id: required_participation
    status: passed
    requirement: A 的目标 shrink、B 的 shrink_ignite、B 的直接轴推与必需火盆点亮在所有胜利中均为必要事件。
  - id: counterfactuals
    status: passed
    requirement: >-
      至少完整验证：提前移动或熄灭 A、A 在目标边界前燃尽、B 初始错列、移除支撑结构、
      错过首次传火窗口、传火后先操作其他对象，均不能保留作品身份或标准胜利。
  - id: exact_replay
    status: passed
    requirement: 最短标准解与每个等价解族代表均在 immutable exact version 上逐动作回放，事件与对象 id 稳定可引用。

publication_rule: >-
  仅当上述 identity、player_side 与 mechanical_evidence 三组门槛全部通过，且玩家侧重读确认作品不是被迫走廊，
  才可发布 CANDLE_CURRICULUM_L13_001 的第一个 immutable exact version。
