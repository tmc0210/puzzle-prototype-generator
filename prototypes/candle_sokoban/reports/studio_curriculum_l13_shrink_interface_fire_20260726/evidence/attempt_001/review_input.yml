mechanical_claims:
  - claim_id: exact_integrity
    claim: 所有主要 artifact 均绑定当前 candidate、exact、solve instance 与 layout digest，正式胜利为 all_braziers_lit。
  - claim_id: canonical_solve
    claim: 规范输入 right,down,right,right,right,up 全部合法，并在第 6 拍完整结算后由存活玩家点亮全部火盆。
  - claim_id: complete_graph_scope
    claim: 可达图搜索 complete，含 3619 nodes、9424 legal edges、3 terminal win states。
  - claim_id: equivalent_variants_only
    claim: 全部胜路只有同一生产性对象因果骨架；允许差异仅为纯移动时序与终局同拍 B 是否燃尽，无已知非等价胜解。
  - claim_id: required_winning_event_chain
    claim: 所有胜路都按 C 首拍侧滚并由 A 尾遮灭、A 从 len2 缩为 len1 且同拍 shrink_ignite B、B 下一次对象操作轴推并同拍 light_brazier 与 win 的顺序完成。
  - claim_id: no_transfer_or_ignition_bypass
    claim: 任一胜路均不存在第二次 shrink_ignite、普通 wick/brazier 点火 B、rolling-contact 点火、C 再参与、交接后其它对象任务或多推修复链。
  - claim_id: one_shot_object_participation
    claim: A、B、C 与唯一火盆在全部胜路中按已声明对象职责参与，required-winning 事件组是 win cut。
  - claim_id: mechanical_identity_counterfactuals
    claim: 证据所列提前推/墙灭 A、A 单格燃尽、A 未燃、B 错列、移除 C、A 加长、错过 B 火窗、交接后先操作 A、预点 B 与移位 consumer 均破坏对应身份条件或标准胜利链。
  - claim_id: exposure_gate
    claim: 当前 exact 的完整 exposure graph status=complete、verdict=pass、forbidden_hits 为空，rolling_contact_chain later event 全不可达。

