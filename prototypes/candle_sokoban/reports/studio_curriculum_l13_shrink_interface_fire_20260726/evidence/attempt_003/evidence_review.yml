  - claim_id: one_shot_object_participation
    claim: A、B、C 与唯一火盆在全部胜路中按已声明对象职责参与，required-winning 事件组是 win cut。
    status: supported
    evidence_basis:
      - 七项 required event 逐项删边后均无胜路，证明这些 event instances 在当前 exact 中分别构成 win cut。
      - C 只在首拍 roll+douse 参与；A 必须 len2->len1 并提供 B 的 shrink_ignite，B 必须直接轴推点亮唯一火盆；全部胜路维持相同对象 id 与 consumer 坐标 6,1。
      - support-C 删除反事实仍有 3 个胜态，但首拍退化为 walk，恰好支持 C 的作品身份参与而不把它误称为裸可解性必要对象。
    limits:
