  - claim_id: mechanical_identity_counterfactuals
    claim: 所列反事实破坏对应身份条件或标准胜利链；严格只将 B 下移一个正交格会消除 B 的 shrink_ignite、轴推与全部标准胜利，因而当前 exact 的 B 精确对齐不可移除。
