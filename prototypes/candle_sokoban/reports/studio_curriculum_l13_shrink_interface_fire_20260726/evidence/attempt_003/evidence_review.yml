      - 初态之后含 C 的 win-coaccessible edge=0；胜路中除 C 首拍侧滚和 B 终局轴推外无其它 push/roll 对象操作。
      - significant_non_milestone_edges 与 unexpected_milestone_companions 均为空，三个 terminal wins 均在直接消费边结束。
    limits:
