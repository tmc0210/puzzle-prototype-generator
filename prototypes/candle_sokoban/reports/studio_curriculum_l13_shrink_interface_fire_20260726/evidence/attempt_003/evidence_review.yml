      - B 预点布局被 runtime 的静默初始接触检查拒绝，错误为 B 被 A 烛身遮灭，不能形成稳定预点旁路。
      - B 下移反事实的布局逐格比较只有 (6,3) u->. 与 (6,4) .->u，其他画布内容不变；实际 SHA-256 为 780f0371316d97d4828262268592f5317a6aed75cc5319b8cfe473cf21dfd34e。
      - B 下移 complete graph status=complete，实际 278 nodes、718 edges、0 wins；全部边中 B 相关事件为 0，B shrink_ignite=0、普通点火=0、轴推=0，而 C shrink_ignite edge=11。
      - B 下移五拍 replay 直接显示 C 首拍多滚一格、rolling-contact later event 可达，目标边界由 A shrink_ignite C 而非 B，且不胜利。
    limits:
      - B 下移同时改变 C 的滚动终点、触发 roll_intermediate_extinguish，并封闭 B 的操作面；证据只支持“当前 exact 的 B 精确对齐不可移除”。
      - 不声明 B 下移版仍可解、只改变火焰，或会在下一推普通点燃 B；其 exposure verdict 为 fail 也只描述该反事实，不污染当前 exact 的 exposure 结论。
      - C 删除版可解；其反事实只证明准备工序的作品身份职责被移除，不证明 C 对正式胜利条件的裸可解性必要。

