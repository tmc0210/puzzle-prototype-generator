dispatch_prompt: "使用 $sokoban-mechanism-lab，以 mechanism_explore 的 task_local 模式执行本文件。"
experience_seed: >-
  探索退焰点火中的同格 blocker→fuel 原子翻转：一根仍可存活的燃烛在共享边界缩短，
  它刚释放的端帽格原先既遮住接收烛的烛芯、又封住接收烛下一次轴推的身体目的格；
  边界后该格成为非实体退焰，接收烛在结算后点燃，并能在下一次直接轴推中进入旧封口。
  只研究局部结构、接口与近邻退化，不规定完整候选、包装、难度或 consumer 取舍。
player_prior:
  - 玩家具备基础推箱子经验，已掌握轴推、侧滚、烛芯投影和全火盆目标。
  - 玩家已掌握共享五拍倒数、同步缩短、燃尽，以及跨对象顺序规划。
  - 玩家已掌握墙体灭火、共享火焰与复燃、烛身遮蔽和未燃重曝。
  - 玩家尚未在正式课程中掌握 retreating_flame_transfer；本槽位用于其首个直观同格应用。
allowed_mechanisms:
  - basic_candle_manipulation
  - wall_dousing
  - shared_fire_and_reignition
  - body_concealment_and_reexposure
  - retreating_flame_transfer
allowed_tools:
