do_not_repeat:
  - >-
    只复现已知 blocker->fuel 六步正例，却不在首次交接后实际尝试移动来源、再次等待边界和重复点火。
  - >-
    只证明接收烛的最短下一推可点盆，却不实际让接收烛错过窗口、缩短后尝试一推或多推补救。
  - >-
    以完全封死来源烛或删除开局错误处置方向关闭回收，从而把玩家判断改成唯一合法走廊。
  - >-
    通过长路线、空等、重复搬运或完整关卡包装制造一次性；局部材料必须由对象接触、存活、占格或火路承担约束。
  - >-
    只给事件计数、预算内搜索或单条最短解，未执行正例与回收/补救对照的连续非空输入串。

materialization_target: >-
  每张正向材料提供一个可运行开始局面与连续非空输入串，覆盖目标 shrink_ignite、紧随其后的单次
  直接 consumer，以及首次交接后的来源回收尝试和接收者错窗补救尝试。逐步保存动作前后 layout、
  倒计时、相关蜡烛的长度/明灭/烛芯投影、玩家站位、合法性和完整事件。若声称关闭回收或补救，
  提供局部完整图；图不完整时只能标为待 Designer 自证的假设。只发布抽象局部卡片与近邻对照，
  不制作完整关卡，不指定候选坐标、墙形、玩家起点、包装或 exact version。

required_contrasts:
  - 首次交接后立即直接推 B 的正例。
  - 首次交接后先移动 A、再等待边界的回收尝试。
  - 错过首推窗口后让 B 缩短、再尝试一推或多推的补救。
  - 边界前提前移动或墙灭 A 的错误处置。

acceptance_evidence:
  - 每个可用结构给出非空 direct replay 与关键事件顺序。
  - 对回收和补救对照给出明确可胜/不可胜结论及 runtime 原因。
  - 若声称关闭旁路，需提供局部完整图；若图不完整，只能标为待 Designer 自证的假设。
  - 结论必须保持抽象，不引用当前候选的坐标、墙形、玩家起点、关卡包装或 exact version。

forbidden_scope:
  - 不设计完整关卡，不给出候选布局或起点包装。
  - 不评价难度、审美、课程位置、唯一性或待玩准入。
  - 不修改候选、账本、assignment、experience brief 或 prototype 通用代码。
