requested_by_role: designer
intent: mechanism_explore
publication_scope: task_local

design_space: >-
  展开退焰交接的“一次性接口”局部关系：来源烛 A 在目标边界缩短后必须继续存活，接收烛 B
  必须在同格获得 shrink_ignite，随后一次直接轴推消费通道与火；但完整可达关系中，第一次交接
  之后不得通过再次移动、遮蔽、重曝或等待 A 形成第二次退焰交接或普通复燃，也不得让 B 错过
  首个 consumer 后通过缩短和多推补救。边界前仍须保留一个真实可执行的错误对象处置方向，
  不能用完全钉死 A 代替玩家选择。探索对象是可移植的局部一次性约束，不是完整候选、玩家起点、
  墙形包装、目标难度或指定 structure family。

abstract_question: >-
  在退焰交接中，来源烛 A 必须于目标边界缩短后继续存活，接收烛 B 必须在同格获得
  shrink_ignite，随后一次直接轴推消费通道与火。请探索最小的“一次性交接”局部结构：完整可达图中，
  第一次交接之后不得通过再次移动、遮蔽、重曝或等待 A，形成第二次 shrink_ignite、普通 wick
  reignition，或把 B 的一次 consumer 退化成多推补救；同时边界前仍须存在一个真实可执行的
  错误对象处置方向，而非把 A 完全钉死。

why_needed: >-
  已知材料证明 blocker->fuel 的正向六步关系，但尚未覆盖“来源存活后可被再次推回接口”的
  recycling 旁路，也未覆盖“接收烛缩短后以多次轴推补救”的长解。Designer 需要的是可复用的
  局部一次性约束，不是某个候选布局的坐标修补。

sampling_axes:
  - 来源烛在目标边界前后的最小长度，以及长度变化对再次占入共享接口的影响。
  - 接收烛为单格或多格时，错过首个 consumer 窗口后是否仍可通过缩短与多推获胜。
  - 静态墙、已退出的支撑烛身体或接收烛自身占入，能否在不阻止首次 consumer 的前提下关闭来源回收。
  - 开局可移动/可墙灭来源作为错误承诺时，怎样保证该操作不可在更晚边界恢复为等价交接。
  - 只允许一步轴推和无中间接触的一步侧滚作为局部旋钮；任何 rolling_contact_chain later event 必须关闭。

