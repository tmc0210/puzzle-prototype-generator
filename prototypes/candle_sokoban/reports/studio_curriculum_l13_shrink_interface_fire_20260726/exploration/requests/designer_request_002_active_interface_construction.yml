schema_version: 1
request_id: l13_designer_request_002_active_interface_construction
exploration_id: candle_curriculum_l13_shrink_interface_fire_20260726
design_task_id: candle_curriculum_l13_shrink_interface_fire_20260726
requested_by_role: designer
intent: mechanism_explore
publication_scope: task_local

design_space: >-
  展开退焰点火中“主动建立并保全一次性接口”的局部结构：开局时，燃烧来源烛 A 的端帽、
  未燃接收烛 B 的烛芯投影、以及 B 点燃后下一次直接轴推所需的身体目的格，至少有一项尚未
  处于最终共享格关系；玩家必须在目标燃烧边界前通过对象操作建立或保全三者重合。边界前应有
  多个局部合法且看似能推进的对象操作或操作次序，但只有预见 A 在边界后的存活/释放格、B 的
  点火位置与紧接 consumer 的操作面，才能剪去错误构造。第一次正确承诺之后、目标边界之前，
  还须有至少一次生产性对象判断读取此前留下的长度、朝向、站位侧或可达面；目标边界结算后，
  B 获得 shrink_ignite，且 B 的下一次对象操作就是进入旧封口的直接轴推 consumer。探索对象是
  可移植的局部构造关系与近邻退化，不是完整候选、墙形包装、玩家起点、目标难度或 exact version。

abstract_question: >-
  哪些最小可运行局面能让玩家先用对象操作主动建立或保全 A 端帽、B 烛芯投影与 B 下一推身体
  目的格的共享接口，再凭此前形成的对象状态作第二次生产性判断，最后在 A 缩短但继续存活时让
  该格由 blocker 翻转为 fuel，并让 B 在 shrink_ignite 后的下一次对象操作直接消费同一格与火？
  请同时寻找能使两种以上边界前局部操作都合法、却由未来 consumer 几何自然区分的近邻结构。

why_needed: >-
  当前 task lexicon 的 MAT-L13-001 与 MAT-L13-002 都从已完成的共享格对齐开始，证明了交接和
  一次性关闭，却没有提供主动构造接口、保全接口或在首次承诺后读取早先状态的材料。现有材料
  因而只能支持“等待边界后直接消费”的局部演示，不能支持需要前瞻剪枝的结构族。

sampling_axes:
  - >-
    最终共享接口由移动 A、移动 B、改变其中一者的朝向/操作面，或先移动再保全来建立；开局至少
    一项关键重合未满足，且只走路或等待不能自动完成构造。
  - >-
    A 在目标边界前后的长度与剩余寿命：正确构造必须让 A 在释放共享格后继续存活，近邻错误构造
    则因过短、过早墙灭、错位或错误操作面而失去 blocker->fuel 关系。
  - >-
    B 的长度、烛芯投影方向和轴推轨道：点燃格必须同时是 B 下一次直接轴推的身体目的格；改变
    一格位置、方向或推面时，点火与 consumer 至少有一项自然失效。
  - >-
    两个以上边界前对象操作或次序都局部合法的构造分叉；比较它们在目标边界、B 的下一推操作面
    和 consumer 可达性上的差异，不以唯一合法走廊代替前瞻判断。
  - >-
    第一次正确对象承诺后、目标边界前的状态回读：其后的生产性对象操作必须依赖此前留下的 A
    长度/位置、B 朝向/轨道、玩家操作侧或共享格可达面，而不是独立的小谜题或纯走位。
  - >-
    接口建立时机相对共享倒数的窗口；测试过早、恰时和过晚构造是否产生可辨认且非补救性的差异，
    不用空等或长路线充当时机内容。
  - >-
    轴推优先；若采样侧滚，只把无接触侧滚当局部旋钮，并验证正向材料在允许机制暴露审计中不会
    产生 rolling_contact_chain 或其它晚于 retreating_flame_transfer 的事件。

