do_not_repeat:
  - >-
    重复 MAT-L13-001 / MAT-L13-002 的静态预对齐：开局已经同时满足 A 端帽、B 烛芯投影和 B
    下一推身体目的格的重合，玩家只需等待、保留不动或沿单走廊抵达操作位。
  - >-
    让唯一合法的开局对象操作自动完成对齐、倒数时机和后续站位，使所谓构造退化为强制动画。
  - >-
    只增加走位距离、空等、目标盆加固、重复见证、与交接无关的锁钥或独立子题来制造步骤和分叉。
  - >-
    把第二次判断放在交接完成后的清理阶段；B 点燃后的下一次对象操作必须仍是消费同一接口的直接轴推。
  - >-
    只给单条正解或事件计数，不实际执行局部可行的错误对象操作、不同构造次序和一格/一方向近邻对照。

materialization_target: >-
  至少发布两张不可互相折叠的正向局部材料卡，覆盖不同的主动接口构造轴。每张给出可运行开始局面、
  两条以上边界前局部合法对象操作/次序、连续非空正例输入，以及至少一个“先期看似成立、未来直接
  consumer 失效”的近邻对照。逐步保存动作前后 layout、共享倒数、A/B 的长度/明灭/烛芯投影、
  玩家站位、操作合法性和完整事件；明确标出第一次构造承诺、承诺后的状态回读、目标 shrink_ignite
  与 B 紧随其后的直接 consumer。正向卡优先给出完整可达图与 exposure audit；图不完整时不得声称
  关闭全部旁路。只发布抽象局部卡片、结构旋钮和近邻退化，不制作完整关卡或指定包装。

required_contrasts:
  - 开局关键重合未全部满足、通过对象操作主动建立并保全接口的正例。
  - 第一次正确承诺后，因读取早先对象状态而必须作出的第二次生产性对象判断。
  - 局部同样合法但导致 A 不存活、B 不在共享格点燃、或 B 下一推无法直接消费的错误构造。
  - 删除或预先满足接口构造步骤后，前瞻分叉随之消失的对照。
  - 正确目标边界结算，以及 B 不插入其它对象操作便直接轴推消费同一共享格与火的连续回放。

acceptance_evidence:
  - 每张可用材料都有非空 direct replay、关键 before/after layout 和事件顺序。
  - 正例实际展示 A 在目标边界后继续存活、共享格由实体占用变为退焰、B 获得 shrink_ignite。
  - 正例实际展示 B 的下一次对象操作是进入旧封口的直接轴推 consumer。
  - 对每个主要构造分叉给出未来失效点与 runtime 原因，而非以审美或难度措辞代替。
  - 运行允许机制暴露审计；任何 rolling_contact_chain 或其它晚于 retreating_flame_transfer 的暴露均不得进入正向卡。
  - 若声称局部关系无旁路，需提供完整图；否则把结论明确降为待 Designer 自证的局部假设。

forbidden_scope:
  - 不设计完整关卡，不给出候选布局、玩家起点、目标包装、课程难度或 exact version。
  - 不读取审美归档、正式候选、review、Critic 意见或 Designer 工作台。
  - 不评价作品质量、structure family 去留、唯一性或待玩准入。
  - 不修改候选、账本、assignment、experience brief、review 文件或 prototype 通用代码。
