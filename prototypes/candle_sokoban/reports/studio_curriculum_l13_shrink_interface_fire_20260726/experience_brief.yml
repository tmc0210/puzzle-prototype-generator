experience_core:
  experience_statement: >-
    玩家保留一个看似应该提前清走的实体封口直到共享燃烧边界，亲眼看见同一格从挡住 B 的 A 端帽
    原子翻成点燃 B 的非实体退焰，并立刻把 B 直接推入这格，让刚获得的火完成必要输出。
  visible_setup: >-
    共享接口格、A 的存活长度与燃烧状态、B 的未燃烛芯、B 的前推方向和前方必要火焰输出都应在全图中可读。
    包装还要让玩家看见若提前移动 A、让 A 过短或错列，通道与火焰职责会分离。
  player_action: >-
    玩家主动选择让仍可存活的 A 保持对齐到准确边界，同时用必要的对象工作把自己交到 B 尾侧；
    边界翻转后，不经另一个对象步骤，下一次行动直接沿 B 长轴推进。
  visible_payoff: >-
    边界前被 A 端帽占住且遮住 B 烛芯的格子，在同一结算后清空实体并出现退焰关系，B 同格点燃；
    紧接轴推让 B 端帽占入旧封口，新烛芯立即点亮必要火盆或等价直接火焰 consumer。
  why_level_exists: >-
    此前玩家已会主动控制退出、加入、遮蔽和未燃重曝；本关第一次把这些知识压缩成一个不可拆的空间—火焰接口：
    旧载体的实体占格与火源不是两把可分别持有的许可，而是在边界上由同一格完成 blocker->fuel 身份翻转。
  core_boundary:
    central_objects:
      - 边界后仍存活的燃烧来源蜡烛 A
      - 初始未燃且沿轴直接推进的接收蜡烛 B
      - A 旧端帽格、B 初始烛芯格与 B 下一推身体目的格重合的共享接口格
      - 共享燃烧边界与 shrink_ignite 交接
      - B 下一次直接轴推所消费的必要火焰输出
    supporting_objects:
      - 只为制造真实时机选择、保留 A 对齐或交出 B 尾侧站位而存在的最少墙与对象
      - 若完整胜利需要多个火盆，其余火盆只能把约束传回核心，不得成为独立子题

work_identity:
  conditions:
    - 玩家必须在边界前主动选择保留仍可存活且对齐的 A，而不是由唯一走廊自动触发翻转。
    - 共享接口格在边界前同时承担遮住 B 烛芯和实体阻挡 B 轴推两项责任。
    - 同一共享接口格在边界后同时失去实体阻挡并以 A 的退焰点燃刚重曝的 B。
    - B 获火后的下一次有效对象操作必须是沿长轴直接推入该共享格，不插入另一个对象任务。
    - 该直接轴推必须同时消费通行与火：进入旧封口，并以 B 当前火焰完成标准胜利所需输出。
    - 正确路的必要工序必须在边界前准备同一接口或 B 尾侧站位，不能只是开放走路凑拍。
    - 后续所有允许胜解族都必须保留上述对象职责与因果依赖；旋转、尺寸或具体 consumer 可变，但同格原子翻转不可变。
  counterfactuals:
    - >-
      A 在边界前移开或错列：通道可以开放，但 B 不在同一边界从退焰接火；相同直接轴推几何不能完成火焰输出。
    - >-
      A 在边界只剩一格而燃尽：共享格开放、B 可推进，但没有存活缩短留下的退焰，B 保持未燃。
    - A 初始未燃或已提前退出：它不在目标边界缩短，共享格仍被实体封住，B 不能直接轴推。
    - >-
      B 与 A 旧端帽格错开一格：边界只负责开门，B 在下一推后才通过普通 ignite_from_wick 接火，
      已不再是本作品的同格原子翻转。
    - >-
      移除 B 直接轴推后的必要火焰 consumer：接口转换仍发生，但退焰所得火没有玩家可感职责，作品核心不完整。
    - >-
      试图在 A 仍占共享格时预先令 B 燃烧：A 烛身会在接触结算中遮芯熄灭 B，不能形成“有火但仍封路”的稳定双钥匙状态。

level_brief:
  packaging_intent: complete_single_level
  expected_difficulty: 5
  expected_scale: >-
    紧凑到中等；只容纳让玩家为最终共享接口作选择的必要前序、一次集中翻转和紧接的直接 consumer，
    高潮后尽快以标准胜利结束。
  expected_player_load: >-
    高规划、低执行噪声。玩家需同时预见 A 的存活与对齐、边界拍、B 的尾侧站位和翻转后的直接轴推；
    不以长路线、空走、重复事件或高潮后清理制造难度。
  opening_intent: >-
    让 A/B/共享格/输出构成一个可读矛盾：A 既是挡路物又是唯一未来火源。至少提供一个提前清 A、
    让 A 过短或错列的局部诱惑，使玩家必须以最终接口反向判断，而不是顺走唯一通道。
  preparation_intent: >-
    边界前的合法行动必须是保留 A 对齐、安排必要对象或取得 B 尾侧操作面的实际工作；
    删除这些动作会改变核心完成状态，不能复用 fixture 的来回空走。
  payoff_and_ending_intent: >-
    边界动画与 B 点燃是集中 payoff，下一次直接轴推马上兑现火与通路；若不是最终火盆，剩余内容只能是
    同一状态的一步收束，不得另起清理段。

allowed_design_sources:
  - 当前 assignment 明列的 Candle runtime、规则、暴露序列、课程槽位与 prior_course。
  - 当前任务正式发布的 task-local lexicon/index 与其 runtime-backed raw evidence。
  - Controller 明确提供的 Reality Anchor 与 Ice Slide Escape clean archive，仅用于抽象审美校准。
  - docs/17 与 docs/21 的玩家体验核心、作品身份、完整单关包装和 Design Studio 合同。

prototype_specific_routing:
  - allowed_exposure_through 固定为 retreating_flame_transfer；rolling_contact_chain 任一 later event 在完整可达图中都必须不可达。
  - 正式候选胜利条件只能是 all_braziers_lit；不得使用 event_occurs。
  - fixture exposure fail 只否定其作为完整候选，不否定 MAT-L13-001 的局部 replay 事实。
  - knowledge.yml、curriculum.yml、诊断 levels.yml、旧 Candle 报告和未发布实验材料不得进入后续设计来源。
  - 退焰共享格只供 B 身体进入，不能诱导或要求玩家踩入火焰。
  - 后续 exact 必须重新固定 layout/solve instance，运行完整非空 replay、解族自查与 complete/pass exposure audit。

human_review_constraints:
  - 机械事件出现、图完整、唯一解或对象数量不能提供正向审美价值。
  - 玩家无法或无必要选择的 shrink_ignite 不构成体验核心；唯一走廊代做角色翻转时必须重构。
  - 长走路和来回耗拍在 Candle 中不自动是审美缺点，但本关的边界准备若只是空耗倒计时，就没有设计职责。
  - 不用路线税、目标位置硬化、重复 witness、无反馈 deadend 或拼接子题把相对难度抬到 5。
  - 不让 A/B 的可见 affordance 承诺未兑现的侧滚、复燃或多段任务；每个主要对象都要在同一因果链中履职。
  - optional direction 只作起点；若它不能产生真实玩家选择或封闭 later exposure，可在同一体验核心下更换结构族。

