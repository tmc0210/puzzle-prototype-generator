runId: batch_005_overhang_shared_stop
title: "外伸尾段共享止挡与连续相位退离"
notes: "B 核心前短侧滚配置 -> A 墙熄灭/伙伴复燃核心 -> 外伸尾段止挡 consumer -> 三输入末段；并隔离共享止挡、无外伸段、A 不复燃与 B 保持点燃对照"
defaults:
  maxExploreDepth: 14
  maxReturnDepth: 24
  maxStates: 24000
  maxTransitions: 90000
cases:
  - id: configured_continuous_tail_chase
    family: overhang_shared_stop
    variant: configured_continuous_tail_chase
    changed_variable: "B 先短侧滚到 producer 列；完整保留配置、核心后真实玩家原位、尾段追赶与 consumer 后两输入"
    contrast_with: [shared_stop_immediate_consumer, no_overhang_stop_enters_core, no_reignite_core]
    notes: "六格 B 在 y12 外伸尾段由右侧墙把配置短滚限制为一格；玩家绕到 A 输入侧期间连续跨越两个燃烧边界，记录 A/B 缩短是否已经把 producer 火窗、墙齿列与核心终点关系拆开。"
    layout: |
      ..........
      ......o...
      ..........
      ..........
      ...1111R..
      .......#..
      ..........
      .....@U...
      ......2...
      ...#..2...
      ......2...
      ......2...
      ......2.#.
      ..........
    actions: [right, left, up, left, left, left, up, up, up, right, down]

  - id: shared_stop_immediate_consumer
    family: overhang_shared_stop
    variant: shared_stop_immediate_consumer
    changed_variable: "从核心边界后的局面直接触发 B consumer，隔离共享终止墙与外伸尾段的逐小步关系"
    contrast_with: [configured_continuous_tail_chase, keep_lit_terminal_shift]
    notes: "A 为三格燃横条，B 为四格燃竖条；B 左滚 d1 经过 A 火焰，d2 被 A 身体遮芯，d3 后由 x3,y8 墙在下一步接住 B 的最上端。随后玩家左、左、上，在 consumer 后第三输入从 A 右端下侧触发回滚，观察 A 的缩短火焰列能否点亮 x6,y1 火盆；本 case 只证明局部 consumer/末段几何，不冒充连续接入。"
    layout: |
      ..........
      ......o...
      ..........
      ..........
      ..........
      ..........
      ..........
      ...11R....
      ...#...U@.
      .......2..
      .......2..
      .......2..
      ..........
    actions: [left, left, left, up]

  - id: no_overhang_stop_enters_core
    family: overhang_shared_stop
    variant: no_overhang_stop_enters_core
    changed_variable: "把尾段止挡放回 A 的 producer 前身体目标格 x5,y7"
    contrast_with: [shared_stop_immediate_consumer, configured_continuous_tail_chase]
    notes: "A 从 y4 下滚；墙齿先在 y5 遮芯，y6 只重新外露，但 x5,y7 的近停墙同时挡住 A 身体，使 A 到不了 B 位于 x7,y7 的火焰。"
    layout: |
      ..........
      ......o...
      ..........
      ...@......
      ...111R...
      .......#..
      ..........
      .....#....
      .......U..
      .......2..
      .......2..
      .......2..
      ..........
      ..........
    actions: [down]

  - id: no_reignite_core
    family: overhang_shared_stop
    variant: no_reignite_core
    changed_variable: "保持 B 实体、外伸尾段和共享止挡，但把 producer B 设为熄灭"
    contrast_with: [configured_continuous_tail_chase, no_overhang_stop_enters_core]
    notes: "A 可越过墙齿并继续到终点，但 x7,y7 没有火源；用于隔离 A 复燃对后继燃烧身份的必要性。"
    layout: |
      ..........
      ......o...
      ..........
      ...@......
      ...111R...
      .......#..
      ..........
      ..........
      .......u..
      ...#...2..
      .......2..
      .......2..
      ..........
      ..........
    actions: [down]

  - id: keep_lit_terminal_shift
    family: overhang_shared_stop
    variant: keep_lit_terminal_shift
    changed_variable: "把 A 的缩短横条左移两格；B 在止挡前经过 A 火焰，但不会把烛芯送进 A 身体"
    contrast_with: [shared_stop_immediate_consumer]
    notes: "同样由 x3,y8 墙接住 B 尾段；B 左滚到 x4 时其烛芯只到 x4,y7 的 A 火焰，下一步即被墙阻止，因此保持点燃。继续同样左、左、上，玩家不会触到 A，x6,y1 火盆保持未亮。"
    layout: |
      ..........
      ......o...
      ..........
      ..........
      ..........
      ..........
      ..........
      .11R......
      ...#...U@.
      .......2..
      .......2..
      .......2..
      ..........
    actions: [left, left, left, up]
