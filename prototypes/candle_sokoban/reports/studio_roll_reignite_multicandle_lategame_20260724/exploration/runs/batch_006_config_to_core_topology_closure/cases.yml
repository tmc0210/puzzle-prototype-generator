runId: batch_006_config_to_core_topology_closure
title: "配置落点到核心输入侧的有限拓扑收口"
notes: "B 来侧/去侧与轴推/短侧滚的代表卡；只核验首界前配置落点、墙齿占格与 A 正确输入侧，不进入完整候选。"
defaults:
  maxExploreDepth: 11
  maxReturnDepth: 20
  maxStates: 18000
  maxTransitions: 70000
cases:
  - id: approach_short_roll_extinguishes_a
    family: config_to_core_topology
    variant: approach_short_roll_extinguishes_a
    changed_variable: "B 身体放在 A 核心来侧，并从相邻列短滚进 producer 列"
    contrast_with: [away_short_roll_wrong_side, away_axis_push_boundary_before_core]
    notes: "B 左滚一格后由 A cap 挡住；B 身体占入 A 初始烛芯格，配置当步先产生 extinguish_by_candle_body:A，因而不能再由墙齿承担核心第一次熄灭。"
    layout: |
      ............
      .o..........
      ............
      ............
      ...111R.2@..
      ........2...
      ........D...
      ............
      ............
    actions: [left]

  - id: approach_wall_tooth_blocks_config
    family: config_to_core_topology
    variant: approach_wall_tooth_blocks_config
    changed_variable: "在来侧短滚卡补回 A 右向核心 d1 必需的墙齿"
    contrast_with: approach_short_roll_extinguishes_a
    notes: "墙齿位于 x7,y5；B 左滚第一步的中段也必须占 x7,y5，所以同一配置输入为 roll_blocked。移除墙齿才能短滚，但随后 B 身体在 x7,y4 提前遮掉 A 初始烛芯。"
    layout: |
      ............
      .o..........
      ............
      ............
      ...111R.2@..
      .......#2...
      ........D...
      ............
      ............
    actions: [left]

  - id: axis_push_uses_wall_tooth_stand
    family: config_to_core_topology
    variant: axis_push_uses_wall_tooth_stand
    changed_variable: "把 B 左端压到离 A 最近的合法轴推位；玩家配置站位正是 A 右滚 d1 墙齿格"
    contrast_with: away_axis_push_boundary_before_core
    notes: "不放墙时右轴推合法；若补回 x4,y5 的 A d1 墙齿，玩家初态与墙占同格，布局不成立。把 B/玩家再右移一格即成为 away_axis_push_boundary_before_core 的最近合法保墙版。"
    layout: |
      ............
      .o..........
      ...1........
      ...1........
      ...D........
      ....@222R...
      ............
      ............
      ............
    actions: [right]

  - id: away_short_roll_wrong_side
    family: config_to_core_topology
    variant: away_short_roll_wrong_side
    changed_variable: "B 保持在墙齿去侧，以一次向下短滚配置；玩家落在 A 的去侧"
    contrast_with: [approach_short_roll_extinguishes_a, away_axis_push_boundary_before_core]
    notes: "B 被尾段下方墙限制为一格短滚；玩家再走一格到 A 右侧，第二输入只能从错误侧把 A 向左滚，不能触发右向的墙熄灭/伙伴复燃核心。"
    layout: |
      ............
      .o..........
      ...1........
      ...1.@......
      ...D.222R...
      ....#.......
      .....#......
      ............
      ............
    actions: [down, left, left]

  - id: away_axis_push_boundary_before_core
    family: config_to_core_topology
    variant: away_axis_push_boundary_before_core
    changed_variable: "B 保持在墙齿去侧，以离墙最近的合法右轴推配置"
    contrast_with: [approach_short_roll_extinguishes_a, away_short_roll_wrong_side]
    notes: "若 B 再向墙靠近一列，配置前左端或玩家就占住墙齿格；当前最近合法版配置后必须从墙下绕过 A，抵达正确左输入侧前已触发首个同步燃烧边界。"
    layout: |
      ............
      ............
      ...1........
      ...1........
      ...D........
      .o..#@222R..
      ............
      ............
      ............
    actions: [right, left, down, left, left, left, up, up, right]

  - id: mirrored_short_roll_wrong_side
    family: config_to_core_topology
    variant: mirrored_short_roll_wrong_side
    changed_variable: "把去侧短滚代表卡左右镜像，交换左/右核心输入侧"
    contrast_with: away_short_roll_wrong_side
    notes: "镜像后保留同一占格关系：短滚落点仍在 A 的错误输入侧，两输入内接触 A 时只会沿反方向滚离墙齿。"
    layout: |
      ............
      .o..........
      ........1...
      ......@.1...
      ...L222.D...
      .......#....
      ......#.....
      ............
      ............
    actions: [down, right, right]
