runId: batch_004_consumer_terminal_responsibility
title: "B 边界剥火后的终局责任谱"
notes: "靠烛芯端 A 核心 -> 四输入内 B 首次轴推 -> B 边界剥火 -> 一个周期内的保存长度、操作侧与复燃来源对照"
defaults:
  maxExploreDepth: 18
  maxReturnDepth: 28
  maxStates: 30000
  maxTransitions: 120000
cases:
  - id: far_terminal_no_source
    family: consumer_terminal_responsibility
    variant: far_terminal_no_source
    changed_variable: "B 被 A 烛身熄灭后只保留远端三格实体，不提供新的火源"
    contrast_with: [far_terminal_late_brazier, keep_lit_shortened_control]
    notes: "A 核心后第 4 输入首次轴推 B；第二个边界由 A 单格身体剥火，B 保持三格并停在远侧；随后四步取得 B 左轴推侧并推动一次。"
    layout: |
      ...............
      ...............
      ...#.222R......
      .@U............
      ..1.........#..
      ...............
      ........#......
      ...............
      ..............o
    actions: [right, right, right, up, right, right, right, up, right, down, left, down, down, down, right]

  - id: far_terminal_late_brazier
    family: consumer_terminal_responsibility
    variant: far_terminal_late_brazier
    changed_variable: "只在远端一次轴推后的 B 烛芯格增加已亮火盆，并在下一格放未亮火盆"
    contrast_with: [far_terminal_no_source, fixed_producer_identity_control]
    notes: "与无火源版同 replay；consumer 后第五个输入把保存三格 B 推到固定火盆取火，继续轴推观察是否成为紧邻点盆段。"
    layout: |
      ...............
      ...............
      ...#.222R......
      .@U............
      ..1.........#..
      ............Oo.
      ........#......
      ...............
      ...............
    actions: [right, right, right, up, right, right, right, up, right, down, left, down, down, down, right, right, right]

  - id: keep_lit_shortened_control
    family: consumer_terminal_responsibility
    variant: keep_lit_shortened_control
    changed_variable: "A 终止墙右移一格，使 B 的下滚投影不再经过 A 身体"
    contrast_with: [far_terminal_no_source, far_terminal_late_brazier]
    notes: "保留同一 B 轴推与远端输入；B 在 consumer 边界保持点燃并同步缩短，比较末段轴推投影。"
    layout: |
      ...............
      ...............
      ...#.222R......
      .@U............
      ..1..........#.
      ............Oo.
      ........#......
      ...............
      ...............
    actions: [right, right, right, up, right, right, right, up, right, down, left, down, down, down, right, right, right]

  - id: near_stop_static_tooth
    family: consumer_terminal_responsibility
    variant: near_stop_static_tooth
    changed_variable: "把 B 的止挡墙从远侧 y6 移到近侧 y4"
    contrast_with: [far_terminal_no_source]
    notes: "近侧止挡墙同时落入 A 的两格身体扫掠带；观察 A 核心是否仍能到达 B 火焰并复燃继续。"
    layout: |
      ...............
      ...............
      ...#.222R......
      .@U............
      ..1.....#...#..
      ...............
      ...............
      ...............
      ..............o
    actions: [right, right, right, up, right, right, right, up, right, down]

  - id: fixed_producer_identity_control
    family: consumer_terminal_responsibility
    variant: fixed_producer_identity_control
    changed_variable: "删除 B，并在原 producer 火焰格放已亮火盆"
    contrast_with: [far_terminal_no_source, far_terminal_late_brazier]
    notes: "固定火盆仍可让 A 同次滚动复燃，但原 B 接管输入只成为普通走动；用于隔离 moving partner 身份。"
    layout: |
      ...............
      ...............
      ...#.....O.....
      .@U............
      ..1.........#..
      ...............
      ...............
      ...............
      ..............o
    actions: [right, right, right, up, right, right, right, up, right, down]

  - id: far_terminal_safe_projection_expiry
    family: consumer_terminal_responsibility
    variant: far_terminal_safe_projection_expiry
    changed_variable: "A 初始增加一格，使 B consumer 后留下单格燃 A；B 的熄灭烛芯格位于 A 尾端正下方"
    contrast_with: [far_terminal_no_source, near_stop_static_tooth]
    notes: "consumer 后 B 的熄灭投影在 x11,y6，是从下方轴推单格 A 的操作格；回放从原位绕过终止墙前往该格，记录 A 是否先燃尽。"
    layout: |
      ...............
      ...............
      ...#.222R......
      .@U............
      ..1............
      ..1.........#..
      ...............
      ........#......
      ..............o
    actions: [right, right, right, up, right, right, right, up, right, down, right, right, right, right, right, down, down, down, down, left, left, up]
