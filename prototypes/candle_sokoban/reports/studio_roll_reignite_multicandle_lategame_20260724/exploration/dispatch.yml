experience_seed: >-
  收口检验“配置动作把玩家直接交给核心输入侧”的双蜡烛连续拓扑。玩家先用一次有对象变化的
  轴推或短侧滚配置伙伴 B，使 B 的外露火焰成为核心 A 的滚中复燃窗口，并同时确定 B 后继
  consumer 的接触轴与外伸尾段止挡关系；该配置结束后的玩家原位必须在不穿过 A/B 身体、
  不进入外露火焰的前提下，于至多两个合法输入内到达 A 的核心侧滚接触格。A 核心须在初始
  第一个燃烧边界之前发生，随后连续进入 B 被 A 烛身剥火、尾段近停、B 让出操作格与 A 回滚
  点盆的同一 replay。优先采样真正改变玩家侧拓扑的旋转、镜像和配置方向，不再增加长蜡烛
  抵消走路燃烧。
player_prior:
  - 玩家已掌握 roll_intermediate_extinguish 及之前全部机制。
  - 玩家已掌握相关衍生技巧与计算。
  - 玩家已玩过单蜡烛的回焰门，本次材料服务于明显更深的后期组合。
