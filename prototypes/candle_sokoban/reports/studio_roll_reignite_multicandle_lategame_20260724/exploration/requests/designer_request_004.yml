do_not_repeat:
  - 从 A 中段触发核心后再绕墙取得 B 操作侧的 batch_002 路线。
  - 只把 B consumer 压到四输入，却让 A 火焰总在 B 熄灭前经过或与其投影正交分离的 batch_003 轴。
  - 让 B 被剥火后滚到远侧，再用超过一个周期的空走返回或取固定火源。
  - 增加只提供一次火焰、只充当终点墙或在 consumer 后退休的第三根蜡烛。
  - 末段在 B 保持点燃、同步缩短或 A 不复燃时仍可原样完成的事件展示。

materialization_target: >-
  发布极小 runtime-backed 连续局面卡：从靠烛芯端触发 A 核心开始，包含核心后玩家原位、B 轴推接管、
  B 被 A 烛身剥火的边界 consumer，以及 consumer 后一个周期内由 B 的保存长度、熄灭状态、投影或操作侧
  直接承担的末段责任。每张正向卡须带 B 保持点燃/同步缩短与固定火源身份对照；若末段短窗均不成立，
  发布结构化负结果并明确是终点距离、操作侧、长度等价还是复燃来源导致失败。只做局部材料，不制作候选。

