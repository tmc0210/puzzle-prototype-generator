request_id: designer_request_001
exploration_id: candle_reignite_multicandle_task_local_20260724
prototype_id: candle_sokoban
required_skill: sokoban-mechanism-lab
intent: mechanism_explore
publication_scope: task_local

design_space: >-
  探索一个最小双蜡烛局部关系谱。核心蜡烛 A 是一根已燃的多格直线蜡烛，玩家从侧面触发 A 的多格滚动；
  A 的烛芯投影在滚动的某个中间小步先被墙边界遮住而熄灭，随后重新外露，并在同一次滚动的更晚小步
  与伙伴蜡烛 B 的已知外露火焰投影重合而复燃。B 不能只是一枚静止火源：A 的滚动终态必须以自身的
  身体占格、外露烛芯、明灭、长度或共享倒计时状态，改变 B 随后的站位、轴推、侧滚、遮芯、复燃或燃烧结算关系；
  同时 B 的长度、朝向、火焰投影或可移动空间必须改变 A 的复燃窗口或滚动后局面。

local_objects:
  - 已燃多格核心蜡烛 A，包含直线身体、cap 方向和一格烛芯投影。
  - 伙伴蜡烛 B，包含可变长度、朝向、明灭状态、直线身体和一格烛芯投影。
  - 能在 A 的滚动扫掠中只遮住若干中间小步烛芯投影的局部墙边界。
  - 只为终止滚动、限定操作侧或形成近邻对照所必需的最少墙体；不加入完整关卡目标包装。

occupancy_shape:
  - A 的身体是沿烛芯轴排列的多格刚体，滚动方向与该轴垂直，滚动距离严格大于一格。
  - 墙边界与 A 的身体扫掠不碰撞，但会让 A 的烛芯投影经历“外露—墙遮蔽—重新外露”。
  - B 的身体不得与 A 的扫掠占格重叠；B 的外露火焰投影在 A 重新外露后的某个滚动小步与 A 的烛芯投影重合。
  - A 的滚动终点附近保留可读的 A/B 身体、烛芯投影和玩家操作侧关系，能够检查动作后谁阻挡、释放、点燃或威胁谁。

local_boundaries:
  - 墙遮芯必须发生在滚动中间小步，且同次滚动中有更晚的有效复燃小步。
  - 复燃后滚动至少再推进一个小步或到达一个可区分的终态，以免复燃与终点成为无法拆读的单帧标签。
  - B 的火焰来源在核心动作前已知且外露；初始局面不得依赖静默点火、灭火或点盆。
  - A 的滚动终态不是局部实验的胜利终点，而是一个仍需消费 A/B 关系的动作后局面。

standing_positions:
  - 记录触发 A 侧滚所需的玩家接触侧，以及滚动后玩家实际停留的接触原位。
  - 记录动作后 B 每个有意义的轴推侧、侧滚侧和绕位站位；标出哪些站位因 A 的终态而被占用、开放或置于外露火焰危险中。
  - 若后继关系依赖先移动 A 或 B 才能取得操作侧，分别记录移动前后的最小站位变化。

post_action_state:
  - A 在同一次多格滚动中已经先被墙熄灭、再由 B 的已知火焰复燃，并以点燃状态结束该行动。
  - B 仍保留可操作或可结算的后继职责；共享倒计时只因整次滚动推进一次，不因中途复燃重置。
  - 动作后的 A/B 位置、长度、明灭、烛芯投影和玩家站位共同产生至少一种双向关系：
    B 决定 A 的复燃窗口，而 A 的终态反过来改变 B 的下一项合法操作、遮芯/复燃状态、燃烧参与或必要操作位。

local_uses:
  - 作为“伙伴蜡烛提供同次滚动复燃条件，核心滚动终态反向约束伙伴”的可拼接局部材料。
  - 作为比较共享倒计时边界前后，复燃后的 A 与仍燃 B 是否同时缩短、是否释放或夺走局部操作位的材料。
  - 作为替换 B 为固定火盆、删去 A 的复燃、或移走动作后 A/B 接触关系时，双向职责是否退化的反事实材料。

sampling_axes:
  - A 的长度、烛芯朝向、滚动方向与总滚动距离。
  - B 的长度、轴向、烛芯朝向、初始明灭，以及 B 的火焰投影与 A 重新外露小步的相对关系。
  - 墙遮芯边界的占格形状：单格墙齿、短墙唇、窄口边缘，以及遮蔽小步与复燃小步之间的间隔。
  - A 的复燃发生在滚动中段或倒数小步；复燃后保留一格、数格或终点邻接关系。
  - 滚动前共享倒计时相位；区分普通中周期复燃与边界行动中新点燃立即参与燃烧的动作后局面。
  - >-
    A 对 B 的动作后责任类型：占用或释放 B 的轴推侧、阻挡或开放 B 的侧滚扫掠、
    以外露火焰改变 B 的安全站位、或通过同时缩短改变 B 的后继操作空间。
  - >-
    B 对 A 的责任强度：只提供火焰投影、火焰投影加长度/朝向窗口、
    或火焰窗口同时受 B 的可移动空间与倒计时状态约束。
  - 近邻退化：用已点火盆替换 B、令 B 无后继操作、令 A 复燃后立即失去用途、或让 A/B 两段可以独立退休。

current_material_refs: []

do_not_repeat:
  - 只含一根蜡烛的“墙熄灭—固定火盆复燃—滚动结束”直白 witness。
  - B 只固定提供一次火焰、核心滚动后永不再被操作或结算的局面。
  - A/B 分别完成两个互不回传约束的局部 probe，再以走位串接的结构。
  - 只增加滚动距离、空地走位、重复对位或事件标签数量而不改变动作后操作关系的旋转、平移和扩张。

materialization_target: >-
  发布若干极小、runtime-backed 的局面卡。每张卡包含开始摆法、非空输入、逐步状态与事件、
  A 的墙熄灭和由 B 复燃的小步距离、动作后 A/B 的占格与站位关系、一个最小后继用法、
  以及至少一个把双向职责退化为单向 witness 的近邻对照。只发布可复用局部材料，不制作完整候选、
  不评价难度或作品质量。

