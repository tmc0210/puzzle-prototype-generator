  - prototypes/candle_sokoban/reports/studio_roll_reignite_multicandle_lategame_20260724/exploration/runs/batch_001_partner_window_handle_strip/proposed_families.md

do_not_repeat:
  - 只复刻已有 producer 与 consumer 分段 probe，却不验证二者之间实际玩家路线。
  - 用长度大于局部关系所需的 A 当作计时尺，让玩家穿越长走廊后再消费。
  - 用三次以上同向轴推或空地往返仅为推进倒计时，不产生新的对象关系。
  - A 只点一个独立火盆、B 只点另一个独立火盆，二者没有反向约束。
  - B 被固定火盆替换后仍能保留相同核心与末段职责的退化结构。

materialization_target: >-
  发布若干极小、runtime-backed 的连续局面卡。每张卡从 B 的主动配置开始，包含 A 核心滚动、动作后玩家
  原位到首次反向消费的完整输入、逐步状态与事件、共享倒计时边界、至少一个 A/B 身份退化对照，
  并明确报告 producer-to-consumer 的实际动作数。只发布局部材料，不制作候选、不评价难度或家族取舍。

request_boundary:
