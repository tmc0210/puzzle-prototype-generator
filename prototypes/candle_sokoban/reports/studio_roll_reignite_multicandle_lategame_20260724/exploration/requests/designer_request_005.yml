do_not_repeat:
  - batch_004 中止挡位于 A 身体扫掠带、因而在 producer 火焰前截断 A 的静态近停版。
  - B consumer 滚到远侧边界后，再用四步以上空走取得操作侧。
  - 核心后用多次轴推才把 B 烛芯与 A 终态对齐；对齐应由核心前配置同时承担。
  - 用固定晚火源、第三根一次性火窗或额外目标处理器弥补 B 熄灭后的责任缺口。
  - 单纯证明更长 B 能被止挡；若保存长度、近停站位或 A 终态没有进入紧邻末段，不算新材料。

materialization_target: >-
  发布极小 runtime-backed 连续局面卡：玩家先主动配置 B，使其烛芯成为 A 的 producer 火窗、其外伸尾段
  对准 A 扫掠区外的近侧止挡；随后 A 完成墙熄灭、由 B 复燃并继续，B 再被 A 终态烛身剥火并在
  外伸段止挡下近停；consumer 后至多一个周期内，B 的避烧保长、熄灭投影、近侧操作位或 A 缩短
  直接承担点盆/紧邻点盆责任。正向卡必须带无外伸段、A 不复燃与 B 保持点燃对照；若仍不成立，
  发布结构化负结果，区分所需 B 长度、核心前配置成本、止挡冲突与末段等价性。只做局部材料，不制作候选。

