do_not_repeat:
  - batch_005 中 B 配置后九步绕到 A 输入侧、跨两次边界再用初始坐标触发核心的连续负例。
  - 通过给 A/B 各加两格来抵消配置路线燃烧；长度不能替代局部玩家侧拓扑。
  - 只复现隔离的 B 剥火、近停或 A 回滚点盆，而没有从 B 配置开始的完整连续 replay。
  - 采用 Explorer 上一批 next_sampling_axes 里的普通镜像作为理由；只有配置后玩家侧距离真正降至两输入内的版本才计入。
  - 固定晚火源、第三根一次性对象、远端边界回程、等待相位或核心后多次轴推补对齐。

materialization_target: >-
  若存在，发布一张极小 runtime-backed 完整连续卡：一次必要 B 配置结束后，玩家至多两输入抵达 A
  核心侧；A 在首个燃烧边界前完成墙熄灭、由 B 复燃并继续；随后 B 被 A 烛身剥火并由外伸尾段
  近停，让出操作格；玩家至多三输入回滚仍燃 A 并点亮唯一火盆。正向卡须带删除 B 配置、A 不复燃、
  B 保持点燃与无尾段止挡对照。若所有合法旋转/镜像均因初态重叠、B 阻断到 A 的短路、producer
  投影不对齐或核心后操作侧断裂而失败，发布结构化负结果并明确收口原因；只做局部材料，不制作候选。

