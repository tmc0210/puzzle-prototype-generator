do_not_repeat:
  - 继续给 batch_002 的当前朝向增加长度、终止墙距离或换侧走廊。
  - 只复现 A 的墙熄灭与 B 回焰，却没有同一连续 replay 中的 B consumer。
  - consumer 首次操作没有 A/B 接触事件，只凭动作计数声称已经反向消费。
  - 用固定火盆保留相同 producer 与 terminal consumer，令伙伴对象可以被完整替换。
  - 用长蜡烛、长通道、重复推动或无对象变化的走位承担当量计时。

materialization_target: >-
  发布极小的 runtime-backed 连续局面卡。每张正向卡从 B 的主动配置开始，包含 A 核心动作、
  核心后玩家原位到首次 B consumer 的完整输入、consumer 子步事件、边界结算、consumer 后 B 的
  一项必要责任，以及固定火源或 A 终态一格差对照。若所有短窗轴均不成立，发布结构化负结果，
  明确是操作侧、对象分隔、熄灭顺序还是边界结算导致失败；不制作完整候选或评价难度。

