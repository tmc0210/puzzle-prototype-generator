material_sufficiency_decision:
  decision: sufficient_to_fix_experience_core
  rationale:
    - >-
      首批正向材料已由非空 runtime replay 支撑：伙伴蜡烛 B 的外露火焰能在 A 同一次多格滚动中、
      A 先被墙熄灭之后重新点燃 A，且 A 会在复燃后继续滚动到可区分的终态。
    - >-
      A 的终态又会反向改变 B 的后继：相邻的一格终点差异能让 B 从“轴推后被 A 身体挡死”
      切换为“可以侧滚，但第一小步被 A 身体遮芯而熄灭”；在燃烧边界还会留下 A 缩短、B 避烧的分流状态。
    - >-
      B 熄灭对照删除 A 的同滚复燃，固定火盆对照保留复燃却删除伙伴后继，足以把双向对象职责
      与单向事件 witness 区分开。因此已经可以固定玩家体验与作品身份，无需先选择完整 family。
  evidence_boundary:
    - >-
      首批 probe 把生产端、B 的轴推接管和 B 的侧滚消费拆开；生产动作后的玩家位置到 B 尾端、
      再到 B 下侧操作位的连续路线尚未证明。
    - >-
      各消费 probe 复刻对象状态但重新放置玩家，parser 也重置倒计时；它们证明局部占格接法，
      不证明完整连续 replay、必经顺序、可解性、唯一性或难度。
    - >-
      `x10/x11`、三格长度、当前朝向和三次轴推只是已验证材料坐标，不是候选 family、正式布局或作品身份条件。
    - >-
      正式设计必须重新建立从生产端到消费操作位的连续路线，并实际验证期间不会提前移动 A/B、
      错过倒计时相位、触发非预期缩短或把后继退化成独立子题；若当前材料 family 无法做到，应重构 family。

prototype_context:
  confirmed_rules:
    - 每次合法行动才推进一次全局倒计时；无效输入不产生 runtime edge，也不推进倒计时。
    - 多格蜡烛沿轴只能推一格，从侧面会持续滚到下一小步被实体阻挡；整次多格滚动只消耗一个行动。
    - 滚动每个小步都先结算接触；已燃烛芯若被墙或其它烛身遮住会先熄灭，随后才递归处理外露火源点火与点盆。
    - 烛芯重新外露不会自动复燃；只有与已点火盆或另一根外露已燃烛芯同格才会重新点燃。
    - 倒计时从 1 进入燃烧边界时，当前仍燃的全部蜡烛从烛芯端同时缩短一格；本行动先熄灭的蜡烛避开燃烧，新点燃的蜡烛参加燃烧。
    - 玩家进入外露火焰会在行动结算中死亡；死亡时不能胜利。
    - 初始布局不得依赖静默点火、灭火或点盆；global_burn_cycle 固定为 5。
  win_condition: 玩家存活，并在完整行动与燃烧结算后点亮全部火盆。
  object_and_event_semantics:
    - 多格蜡烛的身体是直线刚体；cap 方向之外一格是非实体烛芯投影。
    - 伙伴烛芯直接复燃核心蜡烛由 ignite_from_wick 与 roll_intermediate_ignite 记录。
    - 同一次滚动先熄灭后复燃由 roll_reignite_after_extinguish 记录，但事件本身不证明玩家职责或作品价值。
    - 其它烛身遮芯由 extinguish_by_candle_body 记录；燃烧边界前熄灭避烧由 boundary_extinguish_avoids_burn 记录。
    - 多根仍燃蜡烛共同缩短由 simultaneous_burn 记录；事件可达不等于机制被有效使用。
  allowed_mechanisms:
    - global_countdown
    - axis_push
    - flame_lights_brazier
    - exposed_flame_danger
    - candle_shrink
    - wall_extinguish
    - countdown_without_fire
    - wick_reexposed_unlit
    - candle_burn_out
    - side_roll
    - multi_cell_roll_one_turn
    - ignite_from_brazier
    - ignite_from_wick
    - candle_body_extinguish
    - simultaneous_burn
    - midcycle_ignition
    - boundary_extinguish_avoids_burn
    - boundary_ignite_participates
    - roll_intermediate_lights_brazier
    - roll_intermediate_ignition
    - roll_intermediate_extinguish
    - roll_reignite_after_extinguish
  allowed_exposure_through: roll_reignite_after_extinguish
  tool_boundary:
    - 已实现 Candle runtime adapter、ASCII parser/renderer、solver、完整图枚举、layout analyzer、runtime-backed playable、诊断 probe 与 exposure audit。
    - Candle 专属 miner、candidate factory 与 PuzzleScript exporter/checker 未实现；不得用其它原型工具结果替代 Candle runtime 证据。
    - 当前局部材料只支持明确 replay 中的动作、状态、事件和占格事实；有限深度 graph 与 exhausted return search 不支持全称或不可回返结论。
    - 正式 exact 必须使用 all_braziers_lit，并对当前版本运行完整 replay、解族自查和 complete reachable-graph exposure audit。

player_context:
