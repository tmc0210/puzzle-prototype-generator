experience_core:
  experience_statement: >-
    玩家先把伙伴蜡烛 B 布置成核心蜡烛 A 的晚段续火窗口，同时预见 A 滚动终态还要反过来处理 B；
    随后亲手触发 A 的多格滚动，看着 A 的烛芯先被墙压灭、越过 B 的身体后由 B 的火焰重新点燃并继续滚到预定终态；
    滚动结束后，玩家再利用 A 留下的身体、外露火焰或燃烧长度改变 B 的下一次移动、明灭与燃烧参与，
    让“救火者”B 成为被 A 反向约束并继续用于终局的对象。
  visible_setup: >-
    开局应让玩家同时看见两根高 affordance 多格蜡烛、A 烛芯扫掠线上的墙遮蔽边界、B 可提供的外露火焰窗口、
    A 的若干可信终点关系和共享倒计时；这些关系应给出多个看似可行的安排，而不是暴露唯一对位动作。
  player_action: >-
    玩家必须在核心滚动前主动选择或构造 B 的位置、火焰投影、A 的滚动终点与行动相位，
    使 A 在同滚中按“墙熄灭 -> B 烛芯复燃 -> 继续滚动”结算；随后取得 B 的真实操作位，
    用 A 的终态完成一次会改变 B 明灭、合法运动或燃烧责任的后继操作。
  visible_payoff: >-
    第一层回报是在一次连续滚动中清楚看到 A 从燃到熄、由 B 再燃并越过复燃点继续前进；
    第二层回报是滚后 A/B 角色倒转：A 的终态使 B 被挡、被烛身剥火或在燃烧边界与 A 分流，
    棋盘留下两根蜡烛不同的明灭、长度或操作空间，直接供终局继续消费。
  why_level_exists: >-
    “回焰门”已经证明单蜡烛同滚熄灭复燃可发生；本关值得独立存在，是因为它把该事件升级为双蜡烛的前后互相负责：
    玩家不是观看自动复燃，而是用 B 设计 A 的复燃窗口，再用 A 的结果重新解释 B 的摆位、长度和后继命运。
  core_boundary:
    central_objects:
      - 核心多格蜡烛 A
      - 伙伴蜡烛 B
      - A 滚动扫掠线上的墙遮芯边界
      - B 的已知外露火焰投影
      - A 的滚动终态与 B 的后继操作位关系
      - 共享倒计时以及 A/B 在燃烧边界的不同参与状态
    supporting_objects:
      - 为开始点火、全部火盆胜利和终局反馈所需的最少火盆
      - 只负责限定滚动终点、通路和站位的最少墙体
      - 仅在不分走双蜡烛核心责任时才允许加入的其它对象

work_identity:
  conditions:
    - >-
      玩家必须在核心滚动之前同时为 B 的火焰窗口和 A 的滚动终态作选择；
      只理解“让 A 复燃”而不预见 B 的滚后消费，不能稳定完成整关。
    - >-
      同一根多格 A 必须在同一次多格滚动中先被墙熄灭、随后由 B 的外露已燃烛芯直接复燃，
      并在复燃后至少继续一个可见小步到达可区分终态。
    - >-
      B 的长度、位置、朝向、明灭、烛芯投影或操作顺序必须改变 A 的复燃窗口、终点或后继状态；
      B 不能只是不可移动的一次性火源。
    - >-
      A 的复燃状态和滚动终态必须反向改变 B 的下一次合法运动、遮芯/复燃、必要站位、燃烧参与或后继用途；
      B 在核心滚动后仍须承担终局责任。
    - >-
      后继必须消费 A 留下的具体位置、明灭、长度或倒计时相位，并把约束传回核心滚动前的配置选择；
      删除后继会让原本必须区分的 A/B 配置重新等价。
    - >-
      A 的同滚复燃不能只多一个事件标签：若删去该复燃，原胜解必须失败或因 A 不再燃烧、缩短、提供火焰或开放空间而实质改变。
    - >-
      多机制使用以玩家决策与对象职责为准；烛芯互点、烛身遮芯、同时燃烧、边界避烧/参与和明火危险
      只有在删除后会改变计划、对象身份或胜解时才计入作品。
    - >-
      高潮后的内容只收束并消费双蜡烛状态，不能另起独立目标处理器或清理劳动；全部主要高 affordance 对象在终局前后都保持职责。
  counterfactuals:
    - >-
      若用固定已点火盆替换 B 而 A 仍能完成相同核心与终局，则只剩单向复燃 witness，作品身份失败。
    - >-
      若 B 熄灭、移位或换向后 A 仍以相同小步和状态复燃，则 B 没有承担复燃窗口责任，作品身份失败。
    - >-
      若删除墙遮芯、让 A 预先熄灭或让 A 在复燃后不再继续滚动，玩家不再见证同滚“失火—续火—继续前进”，作品身份失败。
    - >-
      若 A 不复燃但同一后继仍可原样完成，或 A 的终点任意变化都不改变 B 的操作与终局，则复燃和终态没有被消费，作品身份失败。
    - >-
      若 B 提供一次火焰后退休，或 A/B 分别进入互不回传约束的独立子谜题，则多蜡烛只形成拼接式机制展示，作品身份失败。
    - >-
      若主要难度来自走到 B 操作位的长距离路线、重复轴推、等待倒计时或反馈迟缓 deadend，
      而不是预见 A/B 角色反转，则不满足目标难度与作品身份。

level_brief:
  packaging_intent: complete_single_level
  expected_difficulty: 5
  minimum_acceptable_difficulty: 5
  expected_scale: >-
    紧凑的中等规模终局关；以两根承担双向职责的主蜡烛和一个共享操作区为核心，
    只添加胜利、站位和终点所必需的火盆与墙，不用长廊、目标数量或额外对象制造规模。
  expected_player_load: >-
    玩家同时追踪 A/B 的身体几何、两条烛芯投影、明灭、长度和五拍共享倒计时，
    并从滚后 B 的消费反推滚前火焰窗口、终点与相位；难点来自多个模型约束同一决定，
    不是记忆操作串或机械试错。
  reasoning_sketch_required: true
  construction_requirement: >-
    前序必须让尚未预见滚后 B 消费的熟练玩家面对多个可信配置；理解所需 A 终态、B 火焰窗口、
    后继操作侧和倒计时相位后，选择才明显收敛。不得把玩家沿单行道送入 lexicon 局面。
  ending_requirement: >-
    后继消费产生可见的 A/B 状态分流后，应尽快利用该分流点亮剩余火盆并结束，
    不追加与双蜡烛角色反转无关的搬运、等待或独立子题。

allowed_design_sources:
  - 当前人类 brief 与完整玩家前序。
  - 当前任务由 $sokoban-mechanism-lab 以 mechanism_explore/task_local 正式发布的 lexicon、batch 和原始 runtime evidence。
  - 当前 assignment 明确提供的 clean archive 校准与两类 Controller calibration view。
  - Candle designer contract、mechanic exposure sequence、mechanic.yml 与 runtime mechanics authority。

prototype_specific_routing:
  - 正式候选胜利条件固定为 all_braziers_lit，不得使用 Explorer probe 的 event_occurs。
  - 当前允许暴露到 roll_reignite_after_extinguish；未来 exact 必须用 complete reachable graph 证明没有更晚事件命中。
  - 所有 layout、replay、解族、对象责任与 exposure 证据必须引用同一个当前 exact；任何核心关系变化都使旧证据失效。
  - 本简报不选择 x10/x11、长度、朝向或完整 family；候选施工可变形或更换 family，但必须保持作品身份条件。
  - 本阶段不画正式布局、不发布 exact；后续只围绕唯一 candidate_id 持续设计。

human_review_constraints:
  - 目标难度与最低接受难度固定为 5，且必须明显超过人类认为“不够难”的“回焰门”；不得给前序虚构数值评分。
  - 不以事件数量、对象数量、solver 指标、唯一 witness、长距离走位、重复搬运或等待周期证明难度与质量。
  - 至少两根蜡烛必须处于同一双向因果链；另一根蜡烛不能只是额外火源、独立目标处理器或旁观道具。
  - 首批材料的生产端到消费操作位连续路线未证明；正式候选必须以完整非空 replay 重新证明，不能把 probe 拼接当成作品事实。
  - 若任何段落可以独立退休，或删除后其它部分原样成立，应删改而不是用更多机制补偿。
  - 最终是否值得进入游戏由独立硬证据、fresh Critic 与人类试玩决定；本简报和局部材料不授予准入状态。
