experience_seed:
  human_seed: >-
    玩家必须规划一次多格滚动，使同一根蜡烛在滚动途中先被墙熄灭、再从已知火源重新点燃，
    并在滚动结束后继续消费这个结果才能获胜；本关要探索后期难度与解法精彩程度上限，
    让多根蜡烛发生不可拆分的相互作用，而不是堆事件、对象或路线。
  designer_focus: >-
    把“伙伴救火”反转成“被救回的核心蜡烛随后接管伙伴命运”：玩家必须同时准备 B 的火焰窗口、
    A 的滚动终点和燃烧相位，使 B 先在 A 同滚中复燃 A，A 再以滚后身体、火焰或缩短状态
    改变 B 的下一次操作与燃烧责任。

