iteration: v19
status: rejected_local_probe
layout_ref: candidate_v19.layout
probe_intent: >-
  把 producer 旋转为水平 A 的纵向侧滚，并让水平 B 的外露火焰落在 A 烛芯扫掠列；
  观察 A 核心动作后的玩家原位能否直接接入 B 的后继操作侧。
observed_core:
  completed: true
  event: roll_reignite_after_extinguish:candle#1:d1->d4
  continued_after_reignite: true
observed_failure: >-
  简单旋转没有消除拓扑分离：为了让 B 的火焰位于 A 身体扫掠之外，A 与 B 的身体必然分居
  共享火焰列两侧；A 终态因此不会直接成为 B 的碰撞或遮芯对象。玩家取得有意义的 B 操作侧前
  仍会先跨燃烧边界。该 probe 只证明旋转后的 producer，不构成候选或正向 consumer。
disposition_reason: >-
  继续补长度或走廊只会复现 batch_002 的路线税。下一步需要 consumer 动作本身制造新的对象关系：
  在跨界动作中先让 B 熄灭，再由 A 终态决定 B 的复燃、避燃或点盆，而不是要求玩家先绕到第二操作侧。
