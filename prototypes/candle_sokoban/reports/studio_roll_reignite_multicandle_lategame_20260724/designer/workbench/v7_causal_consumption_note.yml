from_version: v7
disposition: rejected_insufficient_reverse_consumption
reason: >-
  v7 虽通过完整图确认 21 步核心接力且无机械旁路，但 A 在 B 边界剥火后的继续缩短没有
  反向约束 B 的终局；后段主要是走到常燃源。前 10 步又是 forced viable，仍接近事件
  齐全的单行道演出，不足以自信达到难度 5。
transformation: >-
  v8 把 A 改为三格短寿命。A 必须在首次长滚中重燃，随后持续缩短并在第 15 步烧尽；
  在此之前其固定尾格堵住 B 通往常燃源的轴推。B 则必须在第 10 步被 A 剥火并避燃，
  才能活到 A 消失后穿过旧尾格、取火并点终点。
