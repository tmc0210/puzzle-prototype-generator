schema_version: "sokoban.designer.solution_family_note.v1"
candidate_id: CANDLE_REIGNITE_MULTICANDLE_CAPSTONE_001
from_version: v8
disposition: rejected_experience_core_mismatch
mechanical_reading: >-
  v8 全图最短 19 步仍保留 A 同滚重燃、A 尾格对 B 的遮芯、边界分流、A 烧尽、B 取火
  与终点消费；它不是机械旁路。但最短族让 B 在核心滚动后先从错误列下滚，再用轴推
  把一格 B 送入 A 尾格，并未在核心滚动前主动构造 B 的复燃窗口。
experience_mismatch: >-
  体验简报要求玩家在核心滚动前同时选择或构造 B 的位置/火焰投影、A 终点和行动相位；
  v8 的 B 初始火焰窗口已固定，A 首滚仍被物理强制，故不冻结。
transformation: >-
  v9 镜像并重建上层：B 灯芯朝左且初始错一列，玩家开局需先左推 B，再绕墙到 A
  右侧触发向左长滚；后半把同一 B 推回 A 终端列完成边界剥火。A 终端由常燃火盆
  止挡，A 烧尽后 B 穿过旧终端从同一火盆取火，并点亮其下方终点。
