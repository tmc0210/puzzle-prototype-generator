difficulty_5_argument:
  demanded_reasoning:
    - 必须同时追踪 A、B 的朝向、灯芯端、长度、点燃状态和共享倒计时。
    - A 第一次滚动同时包含墙齿灭火、B 借火和借火后续滚三个阶段，不能只按终点推理。
    - B 的上滚入口不是灯芯端，玩家要反推中段接触点、上滚各子步与 A 火焰/实体的先后关系。
    - B 是否在燃烧边界前灭火会反转两根蜡烛的后续长度关系，并决定 A 能否越过终点火盆。
    - 单看局部事件都不足以得解，必须把连续路线与倒计时一起排到第 17 步。
  current_risks:
    - 开局 A 的正确长滚入口可能过于直白，若解族显示几乎强制，则达不到难度 5。
    - 目前地形开放，可能存在等待、提前移动 A、绕过 B 剥火或让 A 在别处缩短的旁路。
    - B 配置只有两次同向轴推，若没有可信替代计划，构造感可能不足。
    - 终局转场虽承担一次必要燃烧，但仍需玩家侧重读确认不是路线税。
  acceptance_rule: >-
    只有在完整求解、连续精确回放、解族/旁路检查、对象参与反事实和玩家侧重读都支持
    难度至少 5 后，才允许冻结 immutable exact version；v0 不构成送审候选。

identity_counterfactuals_to_test:
  - id: replace_B_with_lit_brazier
    expected: A 可借火但失去 B 后续剥火与责任交接，作品身份应实质改变或不可解。
  - id: leave_B_unlit_before_A_roll
    expected: A 不能重燃，不能继续缩短到终局高度，应不可解。
  - id: omit_B_boundary_extinguish
    expected: 若 B 不在燃烧步灭火，B 与 A 同时缩短，后续职责关系和解应失败或实质改变。
  - id: remove_post_consumer
    expected: 删除终局火盆或让 A 无需缩到两格即可点火，会使重燃后的持续燃烧失去消费，身份应失败。
  - id: replace_A_with_brazier
    expected: B 可能仍可被点火，但不存在 A 的终端实体剥火和终局长度门，应不可视为同一作品。

