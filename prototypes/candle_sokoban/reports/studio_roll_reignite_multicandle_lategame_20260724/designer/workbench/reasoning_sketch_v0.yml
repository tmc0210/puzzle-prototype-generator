candidate_id: CANDLE_REIGNITE_MULTICANDLE_CAPSTONE_001
workbench_version: v0
prototype_id: candle_sokoban
difficulty_target: 5
difficulty_minimum: 5
status: exploratory_not_frozen

experience_hypothesis:
  central_sentence: >-
    玩家必须让 B 在 A 第一次长滚中把已经被墙齿灭掉的 A 重新点燃，随后又把 B
    推入 A 的火焰/实体双层边界，使 B 在跨燃烧横滚时被 A 剥火、由 A 代替它承受
    缩短；只有继续保持燃烧的 A 再缩到两格，才穿得过旧止挡并点亮终点火盆。
  player_construction:
    - 第一次 A 长滚的正确时机决定它能否在越过墙齿后从 B 借火并继续保持点燃。
    - 两次轴推把 B 的灯芯对到 A 的终端列；随后必须从 B 中段下方横滚上行，才能让灯芯先接触 A 火焰、再进入 A 实体而剥火。
    - B 的横滚必须落在倒计时 1；该步里 B 先灭，故 B 避过本轮缩短，而 A 继续缩短。
    - A 还必须带火跨过下一次燃烧，从三格变两格，才不被终点火盆的实体高度挡住。
  player_visible_causal_chain:
    - 墙齿先熄灭 A。
    - A 的灯芯随后接触 B 的火焰，A 重新点燃，并仍向右多滚一格才停。
    - B 的灯芯上滚时先碰 A 火焰，下一子步又进入 A 实体，B 熄灭。
    - 同一动作跨燃烧：B 不缩，A 缩短。
    - A 下一次燃烧后只剩两格，终于能从终点火盆下方穿过并点火。

