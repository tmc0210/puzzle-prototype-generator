schema_version: "sokoban.designer.workbench_note.v1"
candidate_id: CANDLE_REIGNITE_MULTICANDLE_CAPSTONE_001
from_version: v4
disposition: rejected_invalid_consumption_geometry
reason: >-
  v4 的 A 重燃、B 反向剥火与边界避燃均连续成立；但 B 在下层向常燃源轴推时，目标
  实体格与 A 固定尾端重合，实际动作被 axis_push_blocked，终局消费不可执行。
transformation: >-
  v5 将 B 的终局行下移一格。两格 B 先推进常燃源重燃；下一燃烧步缩成一格，使灯芯
  列左移；随后横滚向下，新灯芯列恰好点最终火盆。A 的首次长滚和 B 的边界剥火
  几何保持不变。
