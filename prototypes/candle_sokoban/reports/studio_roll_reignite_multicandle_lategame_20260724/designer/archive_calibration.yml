all_aesthetic_1_records_read:
  - candidate_id: RA_CAND_0024
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0024.md
    human_comment_ref: HP_RA_FRESH_2026_07_08_PULL_BRUSH_RETURN_v4_wall_trim_001
    calibrated_reading: >-
      双可动锚点和三个黏块发出很高的结构承诺，实际却主要兑现推拉腾挪；指标上机制利用率高、
      甚至存在目标对象反转，也不能补偿玩家没有得到切割、拼接、长链或几何洞见。
  - candidate_id: RA_CAND_0027
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0027.md
    human_comment_ref: HP_RA_FRESH_2026_07_09_VACATE_MATERIAL_LOCK_v4_001
    calibrated_reading: >-
      可动 P/L 无需移动，sticky 虽触发转化和拼接标签却没有使用任何黏块几何；
      可见 affordance 与真实解法职责不匹配会让机制信号反噬作品。
  - candidate_id: RA_CAND_0030
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0030.md
    human_comment_ref: HP_RA_FRESH_2026_07_12_CUT_REBIND_ORTHOGONAL_v7_001
    calibrated_reading: >-
      两个高 affordance 锚点开局搬运后退化为被动要素；大地图、大量对象与反馈迟缓的自然 deadend
      形成高设计成本，却只兑现普通黏块腾挪。
  - candidate_id: RA_CAND_0031
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0031.md
    human_comment_ref: HP_RA_FRESH_2026_07_11_TWIN_LOOM_RESECTION_v31_001
    calibrated_reading: >-
      开局十几步虽用齐锚点移动、推箱、合并和切割，实际是无有效分支、无后续空间或对象复用的单行道演出；
      事件齐全不等于机制被玩家有效使用。
  - candidate_id: RA_CAND_0032
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0032.md
    human_comment_ref: HP_RA_FRESH_2026_07_12_DUAL_ANCHOR_CROSS_RELAY_v4_001
    calibrated_reading: >-
      开局双锚交接完成后全部退休，后段黏块 witness 与前段没有因果回传；
      拼接无关子关卡不能制造真实的机制覆盖、难度或审美。

independently_selected_positive_records:
  - candidate_id: RA_CAND_0017
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0017.md
    human_comment_ref: HP_RA_LEX_2026_07_06_VACATE_BIND_RETURN_v3_opening_comfort_001
    selection_reason: >-
      人类明确认可其高机制密度与高要素耦合；推拉、拼接、切割、材料转换和刚体移动在同一终局关系中持续承担职责，
      可校准“复杂但不是机制清单”的正例。
  - candidate_id: RA_CAND_0022
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0022.md
    human_comment_ref: HP_RA_LEX_2026_07_08_PULL_CUT_ANCHOR_HANDOFF_v2_001
    selection_reason: >-
      短步骤内先把箱子送进看似死角，再借锚点与 force-chain 反向送入目标；高难来自强反直觉洞见、
      紧凑空间与因果反转，而不是路线长度。
  - candidate_id: RA_CAND_0025
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0025.md
    human_comment_ref: HP_RA_FRESH_2026_07_09_ACTIVE_L_REBIND_v4_001
    selection_reason: >-
      玩家主动构造 L 形反复活塞，前序构造不喧宾夺主，终局继续消费该形状；
      是“准备—亮点—后继”保持同一作品身份的强正例。
  - candidate_id: RA_CAND_0029
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0029.md
    human_comment_ref: HP_STUDIO_L_1_001
    selection_reason: >-
      同一组黏块两次以不同局部结构充当活塞，并最终归位；人类认可其要素复用和空间利用，
      可校准高 affordance 对象在不同阶段持续有职责。

independently_selected_lower_bound_records:
  - candidate_id: RA_CAND_0019
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0019.md
    human_comment_ref: HP_RA_LEX_2026_07_07_STROKE_SELECT_CMM_PAIR_v1_001
    selection_reason: >-
      推锚点与后续拉动过于显然，虽是合法应用也只形成水关库存；机制存在不自动形成洞见。
  - candidate_id: RA_CAND_0020
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0020.md
    human_comment_ref: HP_RA_LEX_2026_07_08_SPLIT_BRIDGE_DUAL_ENDPOINT_v1_001
    selection_reason: >-
      三个分支本质重复，只因几何对称与读图清楚成为可用下界；重复动作不能冒充多重因果职责。
  - candidate_id: RA_CAND_0023
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0023.md
    human_comment_ref: HP_RA_LEX_2026_07_08_BRUSH_TRIPLE_OUTPUT_v3_outer_wall_trim_001
    selection_reason: >-
      核心概念简单、逐格处理略重复，紧凑几何只能把它托到可用流程关；适合作为“流程完整但亮点有限”的下界。

independently_selected_boundary_records:
  - candidate_id: RA_CAND_0006
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0006.md
    human_comment_ref: HP_RA_EXP_2026_07_05_SOFT_HANDOFF_NO_MERGE_LOCK_v1_001
    boundary: insight_difficulty_vs_route_tax_difficulty
    selection_reason: >-
      仅改目标位置便把难度抬到高腾挪复杂度，同时削弱原有机制美感；它是“更难但更差”的直接边界。
  - candidate_id: RA_CAND_0026
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0026.md
    human_comment_ref: HP_RA_FRESH_2026_07_08_VACATE_INTERLOCK_v10_left_column_trimmed_001
    boundary: focused_affordance_vs_affordance_pollution
    selection_reason: >-
      B/S 只作为两格刚体仍可成立，因为局面没有额外材料承诺黏块构造；
      这说明对象不必用尽全部规则，但可见 affordance 必须与作品实际焦点一致。
  - candidate_id: RA_CAND_0028
    record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0028.md
    human_comment_ref: HP_RA_FRESH_2026_07_10_ANCHOR_BRAID_DOCK_v6_001
    boundary: strong_family_example_vs_family_saturation
    selection_reason: >-
      短小紧凑、反复复用拉锚点扫带是强例；但人类明确指出同类已收录较多，
      高完成度不能自动成为继续复制同型结构的理由。

calibrated_distinctions:
  high_mechanism_density_and_strong_coupling:
    positive_refs:
      - RA_CAND_0017
      - RA_CAND_0025
      - RA_CAND_0029
    definition: >-
      多种机制共同改变同一计划中的对象职责、可用形状、操作侧或后继结果；主要对象跨阶段复用，
      删除其中一个关系会改变早先选择或后续消费，而不是只少一个事件标签。
  event_complete_but_ineffective_use:
    negative_refs:
      - RA_CAND_0027
      - RA_CAND_0031
      - RA_CAND_0032
    definition: >-
      事件可以齐全，甚至形成唯一动作序列，但若它们集中在不被后续复用的过场、没有使用对象几何 affordance，
      或来自互不回传约束的拼接段落，玩家实际没有获得相称内容。
  insight_driven_high_difficulty:
    positive_refs:
      - RA_CAND_0022
      - RA_CAND_0017
    definition: >-
      难度来自必须预见后继而采取反直觉构造、对象复用或短而强的关系反转；
      一旦洞见成立，操作长度与局面反馈仍然紧凑清楚。
  route_tax_driven_high_difficulty:
    negative_or_boundary_refs:
      - RA_CAND_0006
      - RA_CAND_0024
      - RA_CAND_0030
    definition: >-
      难度主要来自目标位置造成的额外腾挪、长距离走位、重复搬运或反馈迟缓的 deadend；
      它增加执行和搜索负担，却没有增加新的玩家关系。

prior_course_calibration:
  level_id: CANDLE_ROLL_REIGNITE_CONSUMED_001_V1
  title: 回焰门
  layout_ref: >-
    prototypes/candle_sokoban/reports/studio_roll_reignite_consumed_20260724/candidate/versions/v1/layout.txt
  canonical_replay_ref: >-
    prototypes/candle_sokoban/reports/studio_roll_reignite_consumed_20260724/candidate/versions/v1/canonical_replay.json
  actual_layout_read: true
  full_mechanical_replay_read: true
  human_feedback:
    text: 这关不算差，但是不够难；希望继续探索游戏后期难度和解法精彩程度的上限。
    numeric_difficulty_score: null
    calibration_use: >-
      只作为当前目标必须明确超过的阶段内下界；没有人类数值评分，不推断分数或精确分差。
  player_prior:
    mastered_through: roll_intermediate_extinguish
    includes_derived_skills_and_calculations: true
    has_played_this_level: true
  player_side_reading:
    - >-
      规范解共 17 个合法行动。第 4 步的四格滚动在同一次行动中先由墙熄灭、再由已点火盆复燃，
      随后点亮一个火盆；该滚动本身机械反馈清楚。
    - >-
      核心滚动之前只有一次轴推和两步对位；关键关系一旦看出，复燃、点盆和停止大多在滚动中自动结算。
    - >-
      后继确实继续消费核心结果：燃烛随后缩短、再次滚动点盆并熄灭，最后从已点火盆复燃后长滚点亮末盆。
    - >-
      作品只有一根蜡烛，中段存在较长的无火走位与倒计时推进；它没有多蜡烛之间的双向对象职责，
      因而不能作为本次后期目标的复杂度模板。
  lower_bound_statement: >-
    回焰门是玩家明确认为“不够难”的阶段内下界，不是坏关，也没有可供引用的数值难度分。

designer_calibration_conclusions:
  - >-
    本次多蜡烛目标不能靠事件覆盖或对象数量达成；第二根蜡烛必须改变核心滚动的复燃条件、位置或后继操作关系，
    核心蜡烛的结果也必须反向改变第二根蜡烛的用途。
  - >-
    高难应来自玩家同时预见几何、火源、长度和倒计时的同一因果链，而不是拉长对位、走路、重复滚动或晚反馈死路。
  - >-
    核心滚动可以是准备的集中结算点，但动作后局面必须留下会回传到早先配置的真实约束；
    另一根高 affordance 蜡烛不能在提供一次火源后退休。
  - >-
    首批局部语料缺口是“伙伴蜡烛参与核心复燃，并由核心滚动终态反向改变其后续操作关系”的最小双蜡烛关系谱；
    该缺口已抽象到 designer_request_001.yml，不含正式候选、坐标、包装或难度取舍。

