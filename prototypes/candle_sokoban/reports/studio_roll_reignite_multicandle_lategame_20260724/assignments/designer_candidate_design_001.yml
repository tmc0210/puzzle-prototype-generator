required_outputs:
  - 难度 5 的简短 reasoning_sketch，只在结构命题实质变化时更新。
  - 一个完成自查后发布的不可变 exact version；发布前工作布局和中间 replay 不编号。
  - 当前 exact 的 layout、all_braziers_lit solve instance、非空 canonical replay 全逐步状态与事件。
  - 完整连续 replay 必须重新证明生产端到 B 后继操作位的路线、倒计时与对象状态，不得把分段 probe 当成作品事实。
  - 当前 exact 的完整解族唯一性自查、bypass、作品身份反事实、对象参与和 exposure audit 原始 artifact。
  - exposure audit 使用 allowed_exposure_through=roll_reignite_after_extinguish，graph complete、verdict pass、forbidden_hits 为空。
  - 证明至少两根蜡烛双向参与；固定火盆替换、B 退休、A 不复燃或滚后消费删除等反事实必须破坏作品身份或胜解。
  - 完整玩家侧 design reading 与 Designer submission packet；若存在非等价胜解、目标难度明显不成立或体验身份失败则继续工作而不发布。
  - 不写 candidate_ledger、Critic packet/review、levels、playable_queue 或人类 handoff。
