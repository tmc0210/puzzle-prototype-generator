design_brief: >-
  按已由 Designer 固定的 experience_brief，在同一连续工作台中制作唯一完整单关。
  目标与最低接受难度均为 5；玩家已掌握前序全部机制、技巧并玩过回焰门。
  候选必须以 all_braziers_lit 获胜，并保持 experience_brief 中可证伪的作品身份：
  B 负责 A 同次多格滚动中的墙熄后复燃窗口，A 的滚后具体状态反向改变 B 的合法操作、明灭、
  燃烧责任或终局用途。局部材料不是指定 family；Designer 自主选择、变形、重构或更换结构。
  若发现新的局部材料缺口，先写坐标无关 request 交 Controller 调度，不由 Controller补设计答案。
