design_brief: >-
  这是纠正流程后的全新 fresh Designer 入口。独立完成 clean archive 校准，核对玩家刚试玩的前序关与人类反馈，
  并由 Designer 自己识别完成体验种子所缺的一个局部设计空间，写成与候选坐标、包装和具体布局无关的
