candidate_id: CANDLE_FRESH_04_SMOTHERED_REVERSE_RELAY
working_title: 灭焰逆渡
status: pre_layout_reasoning
target_difficulty: highest_available
global_burn_cycle: 5

lineage:
  policy: fresh_required
  authorized_archive_variant_work: false
  archive_taste_context: none_found
  note: >
    本轮不沿用既有燃烧门、逐格阶梯或母烛连续释放结构。设计起点是玩家主动
    让主烛在滚动途中熄灭，以解除“不能从燃烧端端推”的方向限制；随后改变
    烛芯所在列、重新取火，再利用全局周期改变接力烛的火焰高度。

player_goal:
  visible_goal: 点亮三个未燃火盆；一个开局已燃火盆只作为稳定火源
  intended_understanding: >
    开局点燃的横向主烛不能从烛芯端反推。玩家先把它向上侧滚：火焰先扫过
    第一个火盆，再被一格锁烛的烛身遮住而熄灭；滚动继续，主烛停在上层。
    锁烛的火焰暂时封住主烛右端通路，首个燃烧边界将锁烛烧尽。此后玩家才能
    站到原烛芯侧，把已熄灭主烛沿长轴向左反推，改变其烛芯列。

player_problem:
  central_question: >
    怎样把“熄灭”当作获得反向端推权限的必要中间态，并在主烛重燃后再次
    传火给接力烛，让接力火焰恰好缩短到最终目标行？
  why_not_execution: >
    初次上滚本身会点亮一个目标，看似已经取得进展；但若不理解途中熄灭是
    为了从原燃烧端施力，就无法改变主烛的烛芯列。重燃后若只顾把主烛推到
    第二目标，接力烛初始火焰高度仍对不准最终目标；必须把绕到其左侧的行动
    与同步缩短相结合，等火焰降到第 4 行后再滚动。

visible_premises:
  - 主烛开局点燃、横向、烛芯朝右；玩家左侧是致死火焰、右侧是墙、下方是稳定火盆，只有向上侧滚能形成存活进程
  - 第一目标位于主烛初始烛芯列，遮火锁烛位于该列更上方
  - 主烛上滚经过第一目标后，火焰会与锁烛烛身同格并熄灭，但滚动不中止
  - 锁烛和单格火焰闩都在首个全局燃烧边界燃尽
  - 主烛熄灭后，原烛芯格才可安全站立并用于向左端推
  - 上墙只在左侧第 2 列留下滚位；未反推的主烛上方无施力格，左推一格后才与该下滚位对齐
  - 改列后的主烛可在向下滚动时让烛芯经过开局已燃火盆而重新点燃
  - 第二目标与接力烛初始烛芯同格；主烛点亮目标时也会递归点燃接力烛
  - 接力烛初次受火时火焰位于第 2 行，最终目标位于第 4 行
  - 接力烛为四格竖烛；传火边界及绕行中的下一边界会让火焰依次下降两行

expected_conclusions:
  - 初次遮火不是惩罚，而是获得反向端推权限的必要状态转换
  - 必须等锁烛燃尽后才能安全进入主烛原烛芯侧，不可用无效输入消耗倒计时
  - 主烛必须恰好向左反推一格；不推无法接入上墙缺口，多推会封住左侧入口
  - 主烛重燃并点亮第二目标后，必须利用到达接力烛左侧的走位推进两次缩短
  - 最终接力烛只有在火焰降到第 4 行后右滚，才能扫到第三目标

intended_mechanic_sequence:
  - 向上侧滚主烛，先点亮第一目标，再途经锁烛烛身产生 extinguish
  - 用有效走位推进到首个边界，让锁烛和火焰闩燃尽并开放主烛右端与下层路径
  - 从原烛芯侧向左端推已熄灭主烛一格，使烛芯列与稳定火盆对齐
  - 从上侧向下滚动主烛，使未燃烛芯经过已燃火盆并 ignite
  - 再次把主烛侧滚回上层，离开稳定火盆实体，随后沿长轴向右推动
  - 主烛火焰同时点亮第二目标并 ignite 接力烛
  - 绕到接力烛左侧，并用必要走位推进两次同步缩短
  - 从接力烛侧面推动，使其保持点燃并点亮第三目标

reasoning_units:
  - id: RU1
    question: 为什么要主动让已经点燃的主烛熄灭？
    expected_answer: 熄灭后玩家才能进入原火焰格，从烛芯端向左反推并改变烛芯列
    feedback: 初次滚动先点目标、再出现 extinguish；首边界锁烛燃尽后右端通路开放
  - id: RU2
    question: 主烛反推到哪一列、怎样重新取得火焰？
    expected_answer: 让未燃烛芯的纵向滚动轨迹穿过稳定火盆，再侧滚离开火盆实体
    alternative_to_test: 不推，或再向左多推一格后尝试进入上墙缺口
    feedback: 正确的一格反推能从第 2 列向下滚并出现 ignite；多推一格会让主烛封住左侧入口，重放在第 21 步 roll_blocked
  - id: RU3
    question: 主烛点燃接力烛后，接力火焰何时才与第三目标同一行？
    expected_answer: 传火边界先让四格接力烛缩短一次，绕到左侧时再跨过一个边界，第二次缩短后火焰落到第 4 行
    alternative_to_test: 在只缩短一次的高度寻找侧推位置，或错过第二次缩短后的窗口
    feedback: 高度不对时右滚不会点亮第三目标；第二次缩短后从左侧右滚会在第一小步点亮它

tool_questions:
  - 是否存在默认预算内可解布局，规范解同时包含 light_brazier、extinguish、axis push、ignite 和 relay
  - 主烛是否确实必须经历至少一次 extinguish 后才能完成所有目标
  - 是否存在不改变烛芯列、直接利用初始火焰或已点亮第一目标完成后续目标的旁路
  - 是否存在主烛替代接力烛点亮第三目标，或接力烛替代主烛点亮前两目标的角色替换
  - 是否存在接力烛不经历两次缩短、在其它火焰高度完成第三目标的路径
  - 完整图能否证明目标事件和关键对象事件在所有胜路中必经
  - 最短解是否只有等价走位变体，没有不同的核心事件顺序

discard_conditions:
  - 初次熄灭可以完全跳过
  - 玩家无需从原烛芯侧反推主烛
  - 任意反推格数都能重燃，列对齐没有决策意义
  - 接力烛无需把火焰缩短到第三目标所在行
  - 同一根蜡烛可以替代另一根完成其目标
  - 主要难度来自长距离空地走动或搜索状态膨胀，而不是可见因果链
