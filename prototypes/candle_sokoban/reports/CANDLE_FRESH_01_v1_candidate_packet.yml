prototype_context:
  confirmed_rules:
    - 全局燃烧周期固定为 5，所有有效行动推进同一个倒计时。
    - 归零时所有仍点燃的蜡烛同时缩短；缩短腾格可触发同格烛芯传火。
    - 侧滚逐格处理点燃、火盆接触与遮蔽熄灭。
  win_condition: 玩家存活且全部火盆点亮
  object_and_event_semantics: 以 CANDLE_SOKOBAN_DESIGN.md 和 CANDLE_SOKOBAN_ASCII.md 为准
  tool_boundary: solver 与 graph 只提供机械证据，不提供审美或难度评分

slot_brief:
  intended_role: 当前本地试玩队列中的高难综合机制候选
  target: 把固定五回合燃烧、缩短传火、遮蔽熄灭和火盆重燃串成一条可读因果链
  difficulty_expectation: highest_available_unscored

mechanic_exposure_context:
  mechanic_window: canonical_shortest_trace
  allowed_exposure_through: not_claimed
  claimed_core_events:
    canonical_only:
