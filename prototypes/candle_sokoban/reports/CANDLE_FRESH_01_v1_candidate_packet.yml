      - step_6_light_relay_then_extinguish
      - step_10_burn_out_candle_1
      - step_13_reignite_candle_2
      - step_22_light_final_brazier_and_win
    all_shortest:
      - one_shared_non_walk_event_signature
  latest_exposure_timing_check:
    derived_latest_event_stage: RU3
    claimed_latest_exposed_event: canonical_step_13_ignite_candle_2
    all_solution_required_evidence_ref: not_claimed
    canonical_occurrences:
      - step: 13
        operation_segment_ref: OP4
        reasoning_unit_refs: [RU3]
    status: later_phase_present
    revision_direction: none

design_target:
  aesthetic_score_target: unscored_missing_human_archive_context
  difficulty_score_target: highest_available
  target_role_notes: 不作量化评分；等待真实玩家试玩校准

