  title: 交芯留焰
  target_difficulty: 4+
  player_experience: >-
    玩家首步主动把未燃接收烛推入交叉芯位；第一个共享边界必须移动辅助烛点亮左盆，
    同时保留交叉供体缩短并完成退焰接火。缩后供体继续点亮上盆，第二边界让接收烛缩成单格；
    最后一次不可中止五格长滚连续点亮中盆与远盆并立即胜利。主动决策在于构造接收关系、
    分配边界对象职责并跨阶段保留接收烛火态，而不在胜可达分支数量。
  known_risks:
    - 前四步包含一次对象构造和三步转位；真实玩家是否会把第五码对象职责选择读成主动承诺，仍以试玩为准。
    - 难度 4+ 与终盘紧凑感已获 fresh Critic 支持，最终体感仍由人类试玩校准。
