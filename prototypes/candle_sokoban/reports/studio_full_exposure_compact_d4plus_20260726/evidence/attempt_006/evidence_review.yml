claims:
  - claim_id: candidate_exact_layout_alignment
    claim: >-
      candidate、exact、layout、solve instance 与全部 current-exact mechanical evidence 对齐；layout SHA-256 为
      6a0728145fbc9f2a762e4fd823d9e97cfec649433bc9ff2d9247f1e18477a812。
    status: supported
    evidence_basis:
      - exact_manifest.yml 与 solve_instance.yml 均声明 candidate CANDLE_FULL_EXPOSURE_COMPACT_CAPSTONE_003、exact_005、同一 layout_ref、all_braziers_lit、global_burn_cycle=5 和同一 layout digest。
      - 对 layout.txt 独立计算 SHA-256 得 6a0728145fbc9f2a762e4fd823d9e97cfec649433bc9ff2d9247f1e18477a812。
      - canonical_replay.json、graph_analysis.json、solution_family_audit.json、recovery_counterfactuals.yml、object_participation.yml 与 exposure_audit.json 的 id/exact/candidate 或 layout identity 字段均指向当前 exact；未使用旧版本 artifact。
    limits: []

  - claim_id: canonical_normal_win
    claim: 14 个 canonical inputs 全部合法，玩家存活并以 all_braziers_lit 正常胜利。
    status: supported
    evidence_basis:
      - canonical_replay.json 记录 executedSteps=14、legalThroughStep=14、completed=true，终态 D:0 且四个火盆均为 1，final.isWin=true。
      - 将 14 个 inputs 逐边对照 exposure_audit.json 的 complete raw graph，全部 before key、edge events 与 after key 一致，最终到达 winning node 1741。
      - mechanics.ts 的 all_braziers_lit 判定要求玩家未死亡且存在的全部火盆点亮；终态满足该条件。
    limits: []

  - claim_id: graph_complete_current_exact
    claim: 当前 exact 完整可达图 status=complete，107188 states、309398 legal transitions、3 terminal winning states。
    status: supported
    evidence_basis:
      - graph_analysis.json、solve_instance.yml、solution_family_audit.json 与 exposure_audit.json 的图摘要一致：status=complete、107188 states、309398 legal transitions、3 wins、max_states=700000。
      - exposure_audit.json 保存 107188 个连续索引 raw nodes 与 309398 个连续索引 raw edges；全部边端点有效，winning nodes 恰为 1741、5227、8381。
      - exposure_audit.json 的图预算声明 terminalize_wins=true、terminalize_zero_candle_loss=true，符合当前原型 complete graph 的终局合同。
    limits: []

  - claim_id: equivalent_winning_family_only
    claim: >-
      完整图的三个胜态代表深度为 14、18、20；全部胜路保持 candle#3 点 (1,5)、candle#1 退焰交接后点 (7,3)、
      candle#2 必须 shrink_ignite、再缩成单格并以一次长滚点亮 (7,5) 与 (10,5)。18/20 步版本只增加再次遮芯和再次退焰，
      不改变目标分配、对象职责或关键依赖，故声明为 equivalent_variants_only。
    status: contradicted
    evidence_basis:
      - complete raw graph 与三个代表 inputs 支持胜态深度 14、18、20，也支持共同的目标分配和所列必经事件。
      - 14 步代表只含一次 shrink_ignite:candle#2，之后 candle#2 持续点燃；18 步代表含 extinguish_by_candle_body:candle#2，随后必须再发生一次 shrink_ignite:candle#2 才恢复用于终局长滚的火态。
      - 该重交接并未回到同一机械状态，且改变 receiver 的火态依赖和燃烧时间线；按 Studio 标准不属于纯走位、完整回返、对称重标号或独立步骤换序。
    limits:
      - 对象职责与目标分配相同不足以覆盖依赖因果差异。

  - claim_id: required_roles_events_and_order
    claim: >-
      全部胜路必经 candle#2 首次轴推、candle#3 点 (1,5)、candle#1 第一次缩短、candle#2 shrink_ignite、
      candle#1 点 (7,3)、candle#2 缩成单格，以及 candle#2 在同一次多格长滚中先后点亮 (7,5) 与 (10,5)；
      声明的事件次序不存在胜路违反。
    status: supported
    evidence_basis:
      - 对 complete raw graph 分别删除每个 required event pattern 后，初态均无法到达任何胜态；与 solution_family_audit.json 的 required_winning_events 一致。
      - 在 complete raw graph 上以“是否已见 first event”为状态做顺序核验，六组 order_checks 均不存在可胜违反路径。
      - 进一步按单边复合事件核验：全部胜路都必须经过 push_axis:candle#3 后同边 light_brazier:1,5、push_axis:candle#1 后同边 light_brazier:7,3，以及 candle#2 同一滚动边内先 light_brazier:7,5、再 light_brazier:10,5、最后 roll_candle:candle#2。
      - object_participation.yml 的对象事件清单与上述 raw graph 结果一致。
    limits:
      - 本项只支持列明对象、事件实例与先后关系的机械事实，不把 role 名称解释为审美或玩家体验质量。

  - claim_id: wrong_boundary_and_delayed_progress_are_nonwinning
    claim: >-
      第 5 步错误边界状态与第 8 步错误分支已点亮 (7,3)/(1,5) 两盆的状态，均位于 complete graph 内且不能再到达胜态。
    status: supported
    evidence_basis:
      - wrong_boundary_step5 的 inputs 从 raw node 0 逐边到达声明的 node 12；对三个胜态做反向可达闭包后，node 12 不在闭包中。
      - delayed_wrong_two_braziers_step8 的 inputs 从 raw node 0 逐边到达声明的 node 75；node 75 同样不在胜态反向可达闭包中。
      - recovery_counterfactuals.yml 与 solution_family_audit.json 对两个 state index、observed progress 和 win_reachable=false 的记录一致。
    limits: []

  - claim_id: no_alternative_receiver_reignition_on_winning_paths
    claim: >-
      任一胜路均不含 candle#2 的 ignite_from_brazier、ignite_from_wick 或 wick_reexposed_unlit；接收烛的胜利火态必须来自 shrink_ignite。
    status: supported
    evidence_basis:
      - 在 complete raw graph 中筛选所有“初态可达且边后状态可达胜态”的边，未发现 ignite_from_brazier:candle#2、ignite_from_wick:candle#2 或 wick_reexposed_unlit:candle#2。
      - 删除全部含 shrink_ignite:candle#2 的边后初态不能到达任何胜态，故至少一次该事件为所有胜路必经。
      - solution_family_audit.json、recovery_counterfactuals.yml 与 object_participation.yml 的相应字段和 raw graph 结果一致。
    limits:
      - 该结论不声称所有胜路恰好只发生一次 shrink_ignite；18/20 步代表实际发生两次。

  - claim_id: strict_exposure_gate
    claim: >-
      exposure graph complete，verdict=pass，forbidden_hits 为空，允许暴露到 rolling_contact_chain，当前 ordered sequence 没有更晚机制分支。
    status: supported
    evidence_basis:
      - exposure_audit.json 的 exact_version、layout_sha256 与当前 exact 一致，graph.status=complete、verdict=pass、forbidden_hits=[]。
      - 对 mechanic_exposure_sequence.yml 独立计算 SHA-256 得 32bf172b2358a676a1a2f65bdf91ec9ebb16b5cb2827a8b7e30ef443995cf00c，与 manifest 和 exposure report 一致。
      - rolling_contact_chain 是 mechanic_exposure_sequence.yml 的最后一个 branch；report 列出全部六个 allowed branches、零 forbidden branches，并保存完整 raw nodes/edges。
    limits:
      - 因 allowed_exposure_through 已是当前序列末支，本项只核验报告身份、图完备性和不存在配置中的更晚分支，不把可达事件数量解释为质量。

