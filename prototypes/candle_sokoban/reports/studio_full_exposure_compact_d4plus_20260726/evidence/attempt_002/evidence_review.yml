solution_uniqueness_review:
  declared_result: equivalent_variants_only
  search_scope: complete
  exact_version_match: true
  known_raw_winning_variants:
    - >-
      DIRECT_BACKBONE：terminal winning nodes 1533、2214；已给最短 witness 深度分别为
      17、19，沿同一直接生产链完成六个里程碑。
    - >-
      DONOR_SHIFT_RECEIVER_REPAIR：terminal winning nodes 4423、5551；已给最短 witness
      深度分别为 23、25；在第一轮 donor-to-receiver 点火之后额外发生
      push_axis:candle#1、extinguish:candle#2:concealed、
      extinguish_by_candle_body:candle#2，之后再由新的 shrink_ignite:candle#2 修复。
  equivalence_evidence_basis:
    - >-
      solution_equivalence_all_wins.json 的 strict automaton 对 nodes 4423、5551 均返回
      violated=true、other=true、incomplete=true，strict_event_equivalent=false；因此原始显著
      事件轨迹确为两族，而不是纯输入串差异。
    - >-
      role_level_automaton 只有在显式 quotient 掉供体横移—受体熄灭—受体复燃修复后才返回
      bad_winning_product_states=[]；该窄 criterion 证明六个选定生产性里程碑仍有序，却不能自行
      证明 docs/21 要求的全部对象职责与依赖因果保持。
    - >-
      docs/21 只允许在保持对象职责、目标分配和依赖因果时把原始变体归为同一玩家逻辑类。
      repair 胜路让 candle#1 额外承担横推遮熄与再次点火修复，使 candle#2 经历点燃—熄灭—
      复燃，并把 candle#2 的 len2 缩短从 donor len1 边界推迟到 donor burn_out 边界；对象职责
      和燃烧依赖时序均已改变。
    - >-
      当前 exact 的 win-coaccessible induced graph 含 120 nodes、228 edges，raw SCC 为
      120 个单点分量且无 internal edge；拓扑核对处理完全部 120 nodes。repair 分支因此不是
      可按“完整回返环”忽略的循环 stutter。
  known_non_equivalent_win_refs:
    - >-
      prototypes/candle_sokoban/reports/studio_full_exposure_compact_d4plus_20260726/candidate/evidence_supplements/exact_001/solution_equivalence_all_wins.json
