    claim: >-
      全部 9 个胜态都要求 candle#1 对 candle#2 产生 shrink_ignite；右盆 (9,1) 由 candle#3 轴推点亮；
      左盆 (4,2) 由缩短至 len2 的 candle#2 向左侧滚点亮。全部胜路保持同一对象职责、目标分配和两边界相位关系。
    status: supported
    evidence_basis:
      - "从 complete raw_graph 独立传播 solution_family_audit.ts 定义的 9-bit mask，得到 5793 个 state-signature pairs，全部 9 个胜态均且仅为 mask=205。"
