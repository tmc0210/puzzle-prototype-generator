      - "胜路上 10 条 shrink_ignite:candle#2 边的前后 state key 均显示退焰目标格为 (5,1)，唯一缩短后火焰来源为 candle#1；这与 mechanics.ts 的 vacatedBySurvivingFlame/shrink_ignite 规则一致。"
      - "mechanics.ts 先完成当次已燃蜡烛缩短，再以退焰点燃 candle#2；candle#2 后续必须在另一燃烧边界缩至 len2 才执行唯一胜路左滚，因此两边界相位关系由状态与结算顺序共同支持。"
