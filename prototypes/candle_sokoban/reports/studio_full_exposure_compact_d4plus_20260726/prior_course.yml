derived_skill_assumptions:
  - 精确计算共享五回合倒数、边界缩短、同步燃烧与燃尽。
  - 预判轴推、侧滚全程及每个中间小步的接触结算。
  - 主动构造墙体或烛身遮芯、未燃重曝、火盆与烛芯复燃。
  - 规划退焰点火、边界点火参与、边界灭火避烧和多对象次序窗口。
  - 识别滚动途中点盆、灭火、复燃及终点前点亮最后火盆。
