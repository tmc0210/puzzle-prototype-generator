prototype_specific_routing:
  - 后续只建立一个 candidate_id；工作布局不取得 exact 身份，自查完成前不得发布版本。
  - allowed_exposure_through 固定为 rolling_contact_chain；未来 exact 必须以完整 reachable graph 通过 exposure audit，graph exhausted 只能判 unknown。
  - 正式候选必须使用 all_braziers_lit，不得使用 event_occurs；初始静默结算必须无事件。
  - 每次设计与修订都需实际读取完整非空 replay、逐步状态、事件、对象参与和工具边界。
  - 发布 exact 前必须完成玩家侧重读、非等价胜解排查与解族唯一性自查；本阶段不发布 layout、solve instance、replay 或 exact。
  - 候选若被接受，冗余对象/区域清理与 exposure/conformance/playable 重检由 Controller 按 pre-submission workflow 机械执行，不返回 Designer 作审美判断。

human_review_constraints:
  - 全机制已掌握只定义玩家先验，不要求在一关中逐项展示全部机制；任何高 affordance 对象都必须兑现玩家可感的结构责任。
  - 不把事件数量、同一步大量事件、非空 replay、完整图或唯一解当作审美和难度的正向证明。
  - 不用多个独立 witness、重复步骤或开局机制演出拼接终盘关；前后内容必须消费同一核心状态。
  - 不靠目标位置硬化、腾挪税、冗余走位、等待倒数或反馈迟缓的 deadend 达成难度 4。
  - 允许长步行与原地来回移动服务共享倒数，但只有存在“不等待”的真实选择且时机改变后续责任时，才可计入谜题内容。
  - 优先保留短步骤中的强预见、反直觉操作、空间/要素高复用与集中回报；高潮后尽快结束。

