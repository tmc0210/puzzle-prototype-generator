prototype_context:
  confirmed_rules:
    - 玩家可沿蜡烛长轴推动一格，或从侧面让整根蜡烛滚到下一步被实体阻挡的位置。
    - 多格侧滚只消耗一个合法行动，但每个滚动小步都会立即结算遮芯灭火、递归点火与点盆；途中变化不终止滚动。
    - 每个合法行动推进固定 global_burn_cycle=5 的共享倒数；无效输入不产生 runtime edge，也不推进倒数。
    - 倒数从 1 跨越燃烧边界时，所有仍点燃的蜡烛同时从烛芯端缩短一格；单格燃尽消失。
    - 墙或另一根蜡烛的烛身遮住已燃烛芯时会先灭火；遮蔽物移开后只形成未燃重曝，不会自动复燃。
    - 已点亮火盆与外露已燃烛芯可以点燃同格外露未燃烛芯；点火不重置共享倒数。
    - 燃烛缩短后腾出的末端格可以形成退焰；若同格刚好重曝另一根未燃烛芯，可在同一边界触发 shrink_ignite。
    - 玩家进入外露火焰会在本行动末死亡；死亡优先于正常胜利。
  win_condition: 玩家存活，并在完整行动结算后点亮全部火盆（all_braziers_lit）。
  object_and_event_semantics:
    - 多格蜡烛是不可拆分的刚体；cap 方向外一格是逻辑烛芯投影，不占实体格。
    - 火盆是实体阻挡；点亮后永久保持点亮，并成为火源。
    - 接触结算顺序为先熄灭所有被遮已燃芯，再递归点火与点盆，随后推进共享倒数并在边界同步缩短。
    - 正式关卡初始静默接触结算不得产生点火、灭火或点盆事件。
    - 非胜利且蜡烛已经全部消失的状态是完整图搜索的失败终局。
  allowed_mechanisms:
    - basic_candle_manipulation
    - wall_dousing
    - shared_fire_and_reignition
    - body_concealment_and_reexposure
    - retreating_flame_transfer
    - rolling_contact_chain
  tool_boundary:
    - 当前可用 Candle runtime adapter、ASCII parser/renderer、solver、完整图枚举、layout analyzer、try-inputs、runtime-backed playable、diagnostic probes 与 exposure audit。
    - Candle 专属 miner、candidate factory、PuzzleScript exporter/checker 当前未实现；不得用其它原型证据替代 Candle runtime 证据。
    - task-local exact replay 只证明指定输入上的局部关系；完整候选的可解性、解族、事件必经和 exposure 必须对未来 exact 另行取证。

player_context:
  basic_sokoban_experience_assumed: true
  player_prior:
    - 玩家已完整掌握全部六个 Candle 机制家族及其衍生技巧，不需要机制教学或规则提醒。
    - 玩家能精确计算共享五回合倒数、边界同步缩短与燃尽。
    - 玩家能预判轴推、不可中止侧滚全程及每个中间小步的接触结算。
    - 玩家能主动构造墙体或烛身遮芯、未燃重曝、火盆/烛芯复燃与退焰点火。
    - 玩家能规划边界点火参与、边界灭火避烧、多对象次序窗口与滚动途中点盆/灭火/复燃。
  prerequisite_mechanisms:
    - {order: 1, branch: basic_candle_manipulation, mastery: complete_with_derived_techniques}
    - {order: 2, branch: wall_dousing, mastery: complete_with_derived_techniques}
    - {order: 3, branch: shared_fire_and_reignition, mastery: complete_with_derived_techniques}
    - {order: 4, branch: body_concealment_and_reexposure, mastery: complete_with_derived_techniques}
    - {order: 5, branch: retreating_flame_transfer, mastery: complete_with_derived_techniques}
    - {order: 6, branch: rolling_contact_chain, mastery: complete_with_derived_techniques}
  known_prior_level_refs:
    - prototypes/candle_sokoban/reports/studio_full_exposure_compact_d4plus_20260726/prior_course.yml
  prior_level_boundary_note: >-
    人类为本任务直接提供的是完整 mastery boundary，而不是可逐关引用的实际关卡清单；
    不从禁止的课程规划材料、curriculum.yml、knowledge.yml 或诊断 levels.yml 补造前序关卡。

experience_seed:
  human_seed: >-
    在全部机制及衍生技巧已掌握的终盘语境中，让两根异轴蜡烛争用同一狭窄交叉口：
    玩家需要为共享燃烧边界安排退出与接收的先后关系，再由一次不可中止长侧滚在途中
    消费并读出此前选择。成品必须紧凑，目标难度为 4，不做机制教学或事件展览。

