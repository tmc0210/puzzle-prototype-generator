experience_core:
  experience_statement: >-
    玩家把两根异轴蜡烛和同一交叉芯位读成一个跨共享边界的先后装置：先在仍有多个
    局部可行动作时，主动构造“燃烛末端将于本轮腾出、未燃接收烛恰在该格重曝”的状态；
    随后提交一次不可中止长侧滚，让终点前火盆是否被点亮集中兑现此前对退出顺序、
    共享倒数和退焰位置的预见。
  visible_setup: >-
    开局同时可见两根异轴蜡烛争用的狭窄交叉口、距离燃烧边界的共享倒数、接收烛的
    长侧滚跑道与终点前火盆。至少两种局部上可行的交叉口处理方式应保留不同的后续责任，
    不能把正确摆法直接画成无需选择的实验装置。
  player_action: >-
    玩家亲自安排边界前的对象位置与行动次序，使燃烛在共享边界从交叉格退出并由接收烛
    接到退焰；之后从侧面推动接收烛，接受长滚不可中止的承诺并用途中火盆消费其起滚前火态。
  visible_payoff: >-
    共享边界时燃烛明显缩短、交叉芯位换由接收烛带火；紧接着接收烛贯穿跑道，
    在尚未抵达终点前点亮远端火盆。正确先后关系由一个集中、不可撤回的远端亮火结果兑现。
  why_level_exists: >-
    单独的遮芯、退焰点火或长滚途中点盆都已是玩家熟知事实；本关存在的理由是让玩家把
    三者压缩成同一个跨边界因果承诺：前一阶段决定哪一格会成为退焰接收点，后一动作才
    消费这个状态。玩家不是观看事件串，而是预见、构造并亲手触发其远端读出。
  core_boundary:
    central_objects:
      - 负责在共享燃烧边界缩短并腾出交叉末端格的已燃蜡烛
      - 芯位占用同一交叉格、先接退焰再承担不可中止长侧滚的未燃蜡烛
      - 同时承担遮芯/重曝与退焰接收的狭窄交叉芯位
      - global_burn_cycle=5 的共享边界与两烛火态/长度变化
      - 位于长滚途中、消费接收烛起滚前火态的火盆
    supporting_objects:
      - 只为形成必要站位、阻断中途补火 shortcut 与收紧读图的墙体
      - 若正常胜利还需其它火盆，其作用只能把核心状态传回前序选择或在高潮动作中共同收束

work_identity:
  conditions:
    - 正确解必须由玩家在共享边界前构造“腾出的燃烛末端格与未燃接收烛芯位同格”，而非开局自动满足或只靠强制走位等待。
    - 同一接收烛必须先承担交叉口的退焰接收，再承担不可中止长侧滚；两段责任不能拆给互不相关对象。
    - 长滚途中 consumer 必须机械地区分接收烛在起滚前是否已点燃，且正确分支在终点前产生可见点盆回报。
    - 至少一个边界前局部可行动作必须只有在玩家预见长滚 consumer 时才能正确取舍，使后继约束真实传回前序构造。
    - 燃烛余下的烛身、芯火、墙体与跑道必须封住未接火分支的顺滚补火 shortcut，不能让错误次序在途中恢复等价。
    - 高潮后的收束必须短；不得在长滚读出之后另接与交叉口状态无关的清理子题。
    - 正式候选使用 all_braziers_lit，且完整胜解族都保持上述对象责任和因果顺序。
  counterfactuals:
    - 若接收烛预先点燃、由邻近火盆直接补火或能在长滚途中从燃烛余芯补火，边界前先后选择失去责任，作品身份不成立。
    - 若交叉格不是本轮缩短腾出的末端格，只剩普通遮芯与未燃重曝，不再是同一作品。
    - 若删除途中火盆或把读出改成不消费火态的普通位移，前序构造没有后继约束，核心关系断裂。
    - 若把边界前内容改成五步唯一走位、自动燃烧演出或独立机制 witness，玩家没有主动构造，作品身份不成立。
    - 若长滚可以在点盆前停止或改由多次可撤回轴推完成，玩家不再提交一次不可中止承诺，作品身份改变。
    - 若另加墙灭火、复燃或其它机制段落但其状态不回传到交叉口取舍，只会形成拼接子题，必须删除。

level_brief:
  packaging_intent: complete_single_level
  expected_difficulty: 4
  expected_scale: >-
    最终保持紧凑：优先两根核心多格蜡烛、一个共享交叉口、一条可读长滚跑道和极少量火盆；
    画布只保留产生真实选择、必要站位、shortcut 筛选和短收束所需空间，不预设具体尺寸或布局。
  expected_player_load: >-
    熟练玩家需同时维护共享倒数、两烛长度/火态、交叉格在边界前后的占用、至少两种构造顺序
    的后续差异，以及长滚每个小步的火源路径；难度来自跨边界预见和反直觉次序，不来自规则回忆、
    冗余走位、目标位置硬化或迟缓 deadend。

