selection_policy: >-
  当前 Candle 没有人类 clean archive 课程关可作为阶段标尺，且人类明确禁止课程规划材料；
  因此阶段难度投影独立选取 clean human-reviewed archive 中三个难度 4、紧凑且依赖要素耦合的
  跨原型阶段挑战，只作通用认知负担下界。其余选取的 clean archive 覆盖审美 1—5 的教学下界、
  腾挪增难反例、无思考量反例、扎实复合锁、强复用标杆与重复拼接反例，只作跨阶段审美校准。
  这些来源由 Controller 独立选择，不沿用 Designer 的唯一 anchors，也不作为当前布局设计来源。
