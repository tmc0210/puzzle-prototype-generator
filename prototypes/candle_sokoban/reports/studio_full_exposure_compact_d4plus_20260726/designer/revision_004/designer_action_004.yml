design_response_and_refs:
  - >-
    接受 Critic 对玩家关系的判断。exact_004 的三面墙出生位已把供体下滚规定成唯一可推进开场；
    随后的自然绕位又自动消耗第一次倒数。完整图中可达的“提前移桥”失败分支并不是玩家开局实际面对的
    同级局部承诺，因而不能把机械反事实冒充前序选择。
  - >-
    放弃 exact_004 的出生墙廊、赶路定时与“先自动搭桥、后依次验收两盆”因果骨架，不以增墙、加步、
    绕路、自动事件、隐藏计数或包装说明修补；继续使用同一 candidate_id，但下一版按新 structure family
    从开放操作面重建。
  - >-
    新 family 的发布门槛是：开局或早段至少存在两种都能立即推进对象关系的安排或操作顺序；错误安排
    不能由出生地形或唯一走廊当场裁掉，只能由玩家预见边界后仍开放目标之间的对象职责与操作面冲突而排除。
    共享相位必须由一次会改变对象位置、火态或职责的主动操作决定，不能由去往下一操作位的自然步行恰好触发。
  - >-
    已实际更换为“开放目标先成为供体火源、再由主动边界行动退焰接收”的工作结构族，并完成短 replay、
    complete graph 旁路读取与紧凑旋转族的出生位扫描。结果见
    prototypes/candle_sokoban/reports/studio_full_exposure_compact_d4plus_20260726/designer/revision_004/withdrawal_diagnosis_004.yml。
  - >-
    单格供体版本没有 shrink_ignite，且 complete graph 存在边界后才移动接收烛、末滚途中从已亮火盆补火的
    非等价胜路；多格供体版本虽能在第 5 步主动完成点盆、点燃供体与退焰接收，但全部十步内紧凑版本仍把
    点第一盆规定成唯一有效开场。移动出生位以开放第二种早段对象承诺后，错误顺序又能在下一周期由供体余芯
    或已亮火盆恢复。
  - >-
    在不增加步数、墙廊、绕路、自动期限或隐藏计数的约束下，继续封旁路只能让筛选器取代体验核心。
    因此正式撤回 CANDLE_FULL_EXPOSURE_COMPACT_CAPSTONE_003_exact_004；不发布下一 exact 或送审包，
    也不把未满足 Critic 玩家关系要求的工作布局交给 Reviewer 或人类试玩。
