    reachable_states=3497、legal_transitions=10981、winning_states=0。
  locked_correct_bypass: >-
    同一锁族的正确 stage 完整图为 complete，reachable_states=5728、legal_transitions=18034、
    winning_states=12；最短 5 步胜路不依赖 shrink_ignite，而是先轴推供体、滚开挡位，再让未燃接收烛
    在长滚第 2 小步从供体余芯 ignite_from_wick，随后途中点两盆。该旁路正是体验核心明列必须截断的
    “顺滚补火”，不能作为 exact 基础。

structure_rebuild_assessment:
  - >-
    开放操作面保留玩家选择时，错误分支仍能移动遮芯对象、换线或利用剩余火源恢复；失败只是延迟，不是职责丢失。
  - >-
    用固定墙位把错误分支做成 complete 无胜时，墙位直接规定余烛和接收烛的操作轴，早段反筛退化为位置硬化。
  - >-
    给正确分支开放操作面又会恢复长滚途中普通补火；继续加锁、加火源或加边界只会引入自动期限、重复验收或独立筛选器。
  - >-
    因而当前结构族不能同时满足真实早段双承诺、主动职责变化、后继不可恢复反筛、紧凑高密度与作品身份。

