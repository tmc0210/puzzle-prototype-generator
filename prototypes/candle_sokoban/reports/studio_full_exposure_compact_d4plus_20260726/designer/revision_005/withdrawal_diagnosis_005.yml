player_side_result:
  intended_structure: >-
    早段让两种供体安排都在共享边界把同一接收烛 shrink_ignite；正确供体缩后余身留在接收烛长滚后方，
    错误供体余身留在首格烛芯轨迹。两边局部都完成退焰接收，只有后继长滚才读出余身职责。
  positive_local_read: >-
    正确 stage 中，1R 在交叉芯位缩成后方 R，接收烛右滚途中点亮两个开放火盆；错误 stage 中，L1
    缩成前方 L，接收烛第一小步发生 extinguish_by_candle_body，首次滚动不点盆。
  why_not_a_level: >-
    首次滚动的可见差异不等于不可恢复的早段承诺。开放结构允许玩家移开遮芯烛、移动烛身行挡块，或轴推
    接收烛换线后跨周期补火；把这些恢复逐一封死后，玩家读到的是固定操作面锁和目标位置硬化，不再是两个
    都自然推进、由远端职责冲突反筛的对象安排。

