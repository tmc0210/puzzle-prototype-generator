probe_id: dual_transfer_filter_001
status: work_only
player_side_question: >-
  两个边界操作都让同一个接收烛获得退焰火，但正确供体烧尽；错误供体留下的烛身恰好位于接收烛长滚的第一格烛芯轨迹。
  后续消费是否能把两种局部等价进展反向区分，并且错误余烛是否无法被移走后修复？
objects:
  correct_donor: "(5,2) 的单格 R；向下滚至 (5,3)，边界烧尽并把火交给 (5,4) 的 u。"
  wrong_donor: "(6..7,3) 的未燃 l1；左推后从 (4,3) 的 O 点燃，边界缩成 (6,3) 的 L，并把火交给同一 u。"
  receiver: "(5,4) 的 u；获火后向右长滚，烛芯经过 (6..10,3)。"
  later_filter: "错误余烛 (6,3) 在长滚第一小步遮住接收烛芯；正确分支该格为空。"
gates:
  - 这里只验证局部机制，不代表候选布局；前四拍走步仅用于把第五拍对准边界，最终设计不得保留这种空等候。
  - 必须继续验证错误余烛的全部移动与再点火修复旁路。

probe_v2:
  correction: >-
    未选择供体初始改放在 (8..9,3)。正确分支第一拍把它向下滚到 (8..9,5)，既是主动职责安排，
    也让单格 R 在第五拍进入 (7,3) 时不再被遮火；错误分支则把该供体左推到 (7..8,3)。
  expected_correct_boundary: "down, up, up, left, down；最后一拍应 burn_out 正确供体并 shrink_ignite 接收烛。"
  expected_wrong_boundary: >-
    先把 l1 左推到头部占 (7,3)，由 (6,3) 的 O 点燃；边界后余身应留在 (8,3)，成为接收烛向右长滚的首格遮火体。

probe_v3:
  source_reuse: >-
    将 (6,3) 的永久火盆源改成 (6,4) 的单格 U。它的烛芯仍能在错误供体入位时点燃供体，
    但会在同一边界烧尽，从而把 (6,3)/(6,4) 还给玩家，正确分支可在下一轮四拍内到达接收烛左操作面。
  correct_trace: "down, up, up, left, down, left, down, down, right"
  expected: >-
    第五拍同时烧尽 L 与 U，并由 L 对 u 产生 shrink_ignite；第九拍接收烛向右长滚，途中点亮两个开放火盆并获胜。

stage_filter_probe:
  purpose: >-
    暂时拆开开局，只验证“正确余身在后、错误余身在前”是否真的被接收烛消费区分；stage 文件不是候选，也不承担玩家侧开局。
  correct: "1R 在 (6..7,3) 缩成 (6,3) 的 R；源烛已在入位前主动移开，可把余身向下滚开，再从左面滚动接收烛。"
  wrong: "L1 在 (7..8,3) 缩成 (8,3) 的 L；接收烛向右第一小步的烛芯被该余身遮灭。"

locked_recovery_probe:
  purpose: >-
    纳入 batch_005 的 19/24 步恢复反例后，不再依赖一次滚动失败；用两个局部操作面冲突检查错误余烛与接收烛能否换线。
  blockers:
    - "(8,2) 阻止错误余烛从烛芯行侧滚；其轴推清障与对接收烛补火要求相反占位。"
    - "(7,5) 阻止接收烛轴推换线；向下操作面又是当前共享火格，保持燃烧时玩家不能站入。"
    - "正确局面的 (6,4) 单格 L 在边界前封住接收烛左操作面；它被 (7,4) 接收烛和 (6,3) 供体夹住，不能提前移开，只能在同一边界烧尽后开放长滚。"
  claim_boundary: "只有 complete graph 才能把该局部锁提升为不可恢复；在此之前仍是 work probe。"
