design_response_and_refs:
  - >-
    CANDLE_FULL_EXPOSURE_COMPACT_CAPSTONE_003_exact_004 已由上一轮正式撤回；本 assignment 不恢复该布局、
    十步脚本或火桥因果，而是在同一 candidate_id 下重新进入结构设计。撤回依据见
    prototypes/candle_sokoban/reports/studio_full_exposure_compact_d4plus_20260726/designer/revision_004/withdrawal_diagnosis_004.yml。
  - >-
    接受新的紧凑定义：以版面尺度、对象复用和行动关系密度衡量，不设总步数硬上限。必要新增动作必须改变
    对象位置、火态、操作面、共享相位承诺或后继责任；不以空走、墙廊、绕路、自动期限、隐藏计数、重复验收
    或事件堆叠制造复杂度。
  - >-
    新结构先从玩家侧建立三项关系：早段至少两种对象安排或顺序都能立即产生局部进展；相位或职责切换由玩家
    主动操作对象造成；中后段仍开放目标与操作面冲突只接受其中一种早段承诺，并使错误承诺不能在下一周期恢复。
    只有这三项在实际布局中可见成立后，才使用 solver、replay 与图工具核验。
  - >-
    继续保持同一体验核心：玩家亲自构造退焰接收，再让同一接收烛以不可中止长滚消费其起滚前火态。允许增加
    与该核心共享对象和状态的前序/后继，但高潮后不追加独立清理子题；若完整玩家关系与机械自查不能同时成立，
    则不发布 exact_005。
  - >-
    实际重建先验证了“双供体都对同一接收烛 shrink_ignite、由缩后余身位置让后继长滚反筛”的玩家关系；
    正确与错误局部 replay 均成立，但 Mechanism Lab 找到 19 步移动挡块恢复与 24 步固定火盆换线恢复，
    证明首次长滚失败不是不可逆职责判断。详见
    prototypes/candle_sokoban/reports/studio_full_exposure_compact_d4plus_20260726/exploration/runs/batch_005_dual_transfer_later_filter/report.md。
  - >-
    本地进一步用两个局部操作面锁封住恢复；错误 stage 的 complete graph 为 3497 states、0 wins，
    但正确 stage 的 complete graph 出现 5 步“移供体/挡位后长滚途中从余芯普通补火”的胜路，不含
    shrink_ignite。继续加锁会把早段选择硬化成墙位与目标位置筛选，违反本 assignment 的结构要求。
  - >-
    因而正式收口本次同候选结构重建：维持 exact_004 撤回，不发布 exact_005 或送审包，不把 work probe
