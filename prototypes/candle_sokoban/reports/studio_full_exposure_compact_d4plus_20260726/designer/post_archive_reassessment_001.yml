continuation_direction:
  status: continue_same_candidate_workbench
  required_player_relation: >-
    重建第五步之后的主动决策：首次交接完成后至少保留两种眼前可行的供体/接收者职责分配或顺序，
    后继长滚必须只接受其中一种，并把筛选责任反向传回交叉构造；不能再以“不要显然熄火”充当决策。
  structure_family_choice: designer_owned
  next_exact_gate: >-
    只有实际 replay、完整解族、玩家侧重读、对象参与、恢复反事实和 exposure 自查全部通过后，
    才发布同一 candidate 的下一不可变 exact。
