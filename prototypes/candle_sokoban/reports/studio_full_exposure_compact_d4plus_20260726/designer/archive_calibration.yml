task_calibration_boundary:
  target_difficulty: [4, 5]
  positive_requirements:
    - 早期选择必须依赖对后续同一对象、交叉口或火焰状态责任的预见。
    - 同一高 affordance 对象与共享空间必须在核心前后继续承担改变后的机械责任。
    - 关键操作应带来集中可见的状态重读，且高潮后尽快结束。
    - 紧凑来自因果密度与空间复用，不来自删去必要站位或把反馈推迟成腾挪税。
  rejection_boundaries:
    - 不把全事件覆盖、多个事件同一步共现或长滚动动画当作玩家洞见。
    - 不用互不相关的遮芯、退焰、复燃或滚动 witness 拼接成终盘关。
    - 不让可动蜡烛、火盆或交叉口在开局演出后退休。
    - 不靠目标位置硬化、冗余走位、迟缓 deadend 或重复同类动作凑难度。
    - 不把固定唯一流程误报为主动构造；玩家必须面对可行但后续责任不同的真实选择。

