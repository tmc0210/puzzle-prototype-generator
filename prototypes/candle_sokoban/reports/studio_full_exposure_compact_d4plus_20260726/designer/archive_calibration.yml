all_aesthetic_1_original_human_comments_read:
  - candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0024.md
    comment_ids: [HP_RA_FRESH_2026_07_08_PULL_BRUSH_RETURN_v4_wall_trim_001]
    calibration: 高机制信号若只兑现普通腾挪，会制造 affordance 承诺落空。
  - candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0027.md
    comment_ids: [HP_RA_FRESH_2026_07_09_VACATE_MATERIAL_LOCK_v4_001]
    calibration: 可动、可黏等可见能力必须在玩家几何推理中有真实责任，事件标签不能代替。
  - candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0030.md
    comment_ids: [HP_RA_FRESH_2026_07_12_CUT_REBIND_ORTHOGONAL_v7_001]
    calibration: 高 affordance 对象开局后退休、大画布和迟缓 deadend 会使设计成本失配。
  - candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0031.md
    comment_ids: [HP_RA_FRESH_2026_07_11_TWIN_LOOM_RESECTION_v31_001]
    calibration: 前缀即使用齐机制，只要是不可复用的单行道演出，仍不是谜题内容。
  - candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0032.md
    comment_ids: [HP_RA_FRESH_2026_07_12_DUAL_ANCHOR_CROSS_RELAY_v4_001]
    calibration: 不得拼接独立 witness 来抬高机制覆盖、难度或审美。
  - candidate_ref: prototypes/ice_slide_escape/design_archive/candidates/ICE_CAND_0002.md
    comment_ids: [HC_001]
    calibration: 局部死路和事件使用不等于思考量；按直觉见物即推的流程不足以承担挑战。
  - candidate_ref: prototypes/ice_slide_escape/design_archive/candidates/ICE_CAND_0004.md
    comment_ids: [HC_001]
    calibration: 三次重复简单教学仍是教学，重复次数不会自动形成终盘应用。
  - candidate_ref: prototypes/ice_slide_escape/design_archive/candidates/ICE_CAND_0011.md
    comment_ids: [HC_ICE_CAND_0011_001]
    calibration: 冗余画布、可删开局、未披露多解和正例形状污染都属于实质缺陷。
  - candidate_ref: prototypes/ice_slide_escape/design_archive/candidates/ICE_CAND_0037.md
    comment_ids: [HC_ICE_CAND_0037_001]
    calibration: 重复步骤拼接与接口外溢会击穿 meta/关卡身份，机械通过不能补偿。

