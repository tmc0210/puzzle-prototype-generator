design_brief: >-
  exact_004 及其十步内替代族已经正式撤回。继续保留同一 candidate_id，但从新的结构族重建。
  “紧凑”以版面尺度、对象复用和每次行动的关系密度衡量，不设十步硬上限；允许为真实选择、
  延迟兑现和后继反筛选增加必要步骤，但不得用空走、墙廊、绕路、自动期限、隐藏计数或重复验收
  制造表面复杂度。熟练玩家在开局或早段必须实际面对至少两种都局部推进的对象安排或行动顺序，
  正确选择只能通过预见中后段仍开放目标、对象职责、火态和操作面的冲突来判断。相位与职责变化
  必须由主动对象操作造成。关卡应在紧凑空间内尽可能复用并组合已公开机制，使后段重新解释并筛选
  早段构造，而不是沿唯一进程依次展示机制。

