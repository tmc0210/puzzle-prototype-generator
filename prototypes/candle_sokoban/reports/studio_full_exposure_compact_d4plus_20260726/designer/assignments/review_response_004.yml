design_brief: >-
  Fresh Critic 已退回 exact_004。中段遮灭—复燃火桥有清楚的延迟兑现，但出生位三面墙把供体下滚规定成
  唯一能推进作品的开场；之后到接收烛右侧的自然路线又自动耗完首个倒数。所谓“提前移桥”不是玩家在开局
  实际面对的可推进承诺，火桥仍是线性行程中自动搭成、稍后自动验收的中继站；左盆后再走到横烛下方上滚
  也仍是同一编排。下一结构必须让熟练玩家在开局或早段实际拥有至少两条局部可推进的对象安排/操作顺序，
  且只有预见中后段仍开放目标之间的相互制约才能选对；不能由出生地形立即裁掉，也不能让自然赶路自动完成
  相位。后段必须改变早段构造的意义，而非只展示其预定结果。不得用更多步数、绕路、墙廊、自动事件或隐藏计数修补。
