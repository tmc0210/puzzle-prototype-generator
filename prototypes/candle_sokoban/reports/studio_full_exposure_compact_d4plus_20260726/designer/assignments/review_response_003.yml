design_brief: >-
  Fresh Critic 已退回 exact_003：开局对象次序虽要求预见末尾传火、缩短和侧滚，但第一次边界过早且完整地
  同时确认右盆与接收烛点燃；此后只剩继续推工作烛、沿近乎单一路径赶到接收烛侧边、让第二边界自然到达，
  再执行终局长滚。后半没有新的关系迫使玩家重读开局，也没有两个仍开放目标持续互相牵制，仍是“一次准备、
  一段转场、一次收尾”的线性编排。修订必须让后继实际重新解释并筛选开局构造，使多个目标或对象职责在中后段
  保持真实牵制；不得以增加步数、绕路、额外自动事件、隐藏计数或包装解释回应。
