design_brief: >-
  人类新增 Candle 专属 clean human-reviewed archive 后，要求原持续 Designer 重新读取完整归档，
  从玩家侧独立自评当前 delivery_002 是否仍满足“紧凑、全机制暴露、难度 4+ 的最终高难单关”。
  不得把唯一解、胜可达分支数量、事件覆盖或机械链长度当作审美与难度的正向依据；必须逐段判断
  玩家是否在掌握全部前序后仍需主动建立假设、比较可行构造、分配对象职责、作出承诺，并由后继关系
  反向筛选这些决定。尤其要与 CANDLE_CAND_0002/0003 的普通二择和承诺后决策坍塌边界比较，
  也要与 CANDLE_CAND_0001/0004 的可用下界比较。

  若复评合格，写明合格依据与仍存风险后停止，不修改 layout、exact、账本或待玩状态。
  若复评不合格，立即把 delivery_002 / reviewed exact_006 标记为 Designer 侧 do_not_submit，并在同一
  candidate 与连续工作台内继续重做；structure family 的保留或更换完全由 Designer 决定。不得只改叙述，
  必须重建玩家主动决策关系，完成 runtime-backed replay、完整解族、对象参与、反事实和 exposure 自查后，
  才发布下一份不可变 exact 交回 Controller。

