design_brief: >-
  fresh Evidence Reviewer 支持 exact_005 的版本身份、14 步正常胜利、完整图、必经事件/次序、两个错误分支不可恢复、
  替代补火不存在和 exposure gate，但否定 `equivalent_variants_only`：14 步胜路在首次 shrink_ignite 后持续保火；
  18/20 步胜路会让 candle#2 再次被烛身遮芯熄灭，并依赖第二次 shrink_ignite 恢复。该差异改变接收烛火态的
  依赖因果，不属于允许的等价变体。exact_005 因作品身份硬失败退回，未进入 Critic。

  继续同一候选，由 Designer 独立决定布局修订。下一 exact 必须以实际完整解族消除非等价胜利逻辑，不能只改名、
  改写等价说明或缩窄声明。人类最新反馈同时要求：不得再使用 forced-viable 数量、比例或连续段评价质量、难度、
  线性度；完整图只核验作品身份和旁路，玩家侧判断只看路径中是否存在主动建立、选择或保留关系的决策。

