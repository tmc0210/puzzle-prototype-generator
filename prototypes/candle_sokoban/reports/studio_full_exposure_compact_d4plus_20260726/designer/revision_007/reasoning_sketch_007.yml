expected_decision_sequence:
  - 前四步把玩家送到两个燃烛操作面共邻的决策位，并把共享倒数送到边界前。
  - 第五步推辅助烛，点左盆且让交叉供体留驻到边界，完成唯一一次 shrink_ignite。
  - 第六至十步把缩为单格的供体滚到上行并轴推点亮上盆；第二边界让供体烧毁、接收者缩为单格。
  - 第十一至十四步到达接收者左侧并提交不可中止长滚，同时点亮两个远盆并获胜。

publication_gate:
