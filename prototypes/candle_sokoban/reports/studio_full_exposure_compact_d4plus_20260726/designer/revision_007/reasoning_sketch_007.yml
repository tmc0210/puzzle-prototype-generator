  - 完整可达图 complete。
  - 全部胜态的最短代表保持同一一次性交接、持续保火与最终长滚因果链。
  - 错误第五步、延迟错误状态和重遮后等待燃尽状态均不可达胜利。
  - 对象参与、事件必经、顺序、recovery counterfactual 与 exposure audit 均完成。

