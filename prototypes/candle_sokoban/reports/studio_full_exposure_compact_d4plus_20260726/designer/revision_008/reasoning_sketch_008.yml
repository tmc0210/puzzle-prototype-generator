rejected_basis:
  versions: [CANDLE_FULL_EXPOSURE_COMPACT_CAPSTONE_003_delivery_002, CANDLE_FULL_EXPOSURE_COMPACT_CAPSTONE_003_exact_006]
  player_failure: >-
    强制开局后只有第五步普通二择；正确选择完成后，单格供体的上盆路线和接收者最终长滚都是单向兑现，
    没有第二个需要比较的可行构造，落入 Candle 新归档的普通二择与承诺后坍塌边界。
  reassessment_ref: prototypes/candle_sokoban/reports/studio_full_exposure_compact_d4plus_20260726/designer/post_archive_reassessment_001.yml

new_structure_hypothesis:
  retained_core: >-
    第一次共享边界仍由玩家选择移动辅助烛、保留交叉供体，让接收者在供体腾出的末端格取得退焰；
    同一接收者最终以不可中止长滚途中点盆。
  changed_relationship: >-
    供体首次边界后保留两格。玩家在交接完成后面对两种都利用已掌握机制的构造：立即侧滚两格供体，
    或先挪辅助烛取得供体轴推面，让供体回占交叉芯位、熄灭接收者并在下一边界第二次交接。
  later_filter: >-
    上方滚动端点在供体尾格列设墙、帽格列留孔。两格供体被尾格墙截停在点盆行；
    第二次交接后只剩单格供体，它会穿过帽格孔滚到更高一行，且左侧是墙，无法轴推到上盆。
  player_reason: >-
    玩家必须预见“是否保留供体长度”会改变后继整根侧滚的停止行和轴推操作面；
    这不是避免显然破坏，而是在两种交接策略之间分配供体的长度、交叉职责与远端点盆职责。

archive_calibration_target:
  beyond_CANDLE_CAND_0002: 不只一次写入/读回二择；首次承诺后还有供体长度与重交接策略选择。
  avoid_CANDLE_CAND_0003: 后继不是盲推；必须从上方不对称墙孔反读供体应保持两格。
  beyond_CANDLE_CAND_0001_0004_lower_bound: 同一供体连续承担交接、可选重交接与长度敏感滚动端点，关系发生重读而非重复流程。
  forbidden_quality_proxies:
    - forced-viable 数量、比例或连续段
    - win-reachable outdegree
    - 唯一解、事件数、图规模或机械链长度

working_layout_ref: prototypes/candle_sokoban/reports/studio_full_exposure_compact_d4plus_20260726/designer/revision_008/work/layout_v001.layout
