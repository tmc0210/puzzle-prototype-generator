candidate_id: CANDLE_FULL_EXPOSURE_COMPACT_CAPSTONE_003
exact_version: CANDLE_FULL_EXPOSURE_COMPACT_CAPSTONE_003_exact_003
structure_family: open_role_assignment_with_phase_gate

player_relation:
  opening_read: >-
    三根蜡烛和两只火盆全部可见。右盆与竖向工作烛同列；左盆紧贴接收烛左侧，
    既像滚动目标，又在接收烛仍为三格时实体挡住该滚动。供体末端压住接收烛芯位。
    玩家起点到工作烛下方与接收烛左侧各有一条五行动准备路线，必须在首个边界前先选职责方向。
  early_local_constructions:
    - 把竖向工作烛向上推去点右盆；这是局部可行且为完整胜路保留的职责分配。
    - 提前移动交叉口供体或接收烛；局部移动可行，但会失去首个边界的退焰接收或把接收烛送离其唯一可完成的左盆职责。
    - 在首个边界后立即滚动仍为三格的接收烛；右向滚动可行，但会把接收烛送离左盆所需操作面，左向则被左盆实体挡住。
  global_filter: >-
    左盆只有接收烛能点；接收烛必须先在交叉口接火，再保留到第二个共享边界。
    第二次缩短把它的芯行从 y=1 下移到 y=2，使同一左盆由“身体挡块”变成
    “滚动途中芯位 consumer”。因此右盆必须交给工作烛，供体必须留驻到首个边界，
    接收烛必须延迟提交且保留右侧操作面。
  payoff: >-
    第二个边界后，玩家从右侧提交一次向左不可中止长滚；第一小步即越过原本阻挡身体的
    左盆并点亮它，随后继续滚到左端，正常胜利。后继实际消费了前面的对象分工和相位等待。

identity_conditions:
  - 首个边界必须由 candle#1 缩短产生 candle#2 的 shrink_ignite。
  - 右盆必须由 candle#3 轴推点亮；接收烛不得代替该职责形成胜路。
  - 左盆必须由 candle#2 在缩短后向左滚动点亮；三格状态下该盆必须实际阻挡其身体带。
  - 接收烛下方的单墙固定其后期操作面，排除“上推后多烧一轮再以单格完成”的第二逻辑类；该墙不接触任何规范解芯位。
  - 所有胜路必须保留供体、接收烛、工作烛三种不同职责和两个共享边界的先后依赖。

counterfactual_read:
  - 删除左盆或把它移出缩短后的芯行，会取消对接收烛相位与职责的后继约束。
  - 把左盆从 x=4,y=2 移到三格状态已可通过的位置，会让接收烛无需等待第二边界，结构降为普通滚动点盆。
  - 让其它蜡烛可到达左盆芯行，会产生职责旁路；当前顶墙、轴向和操作面共同排除该关系。
  - 若供体在首个边界前离开交叉口，接收烛不获得 shrink_ignite，完整图中不存在胜路。

known_limits:
  - 原始输入串因开放走位和倒数消耗存在多种等价排列；完整胜路的对象职责与因果顺序保持一致。
  - 完整图有九个终局状态，但 task-local family audit 只发现一个胜解逻辑签名；差异只在开放走位、倒数状态和终局玩家位置，不改变对象职责或事件因果。
