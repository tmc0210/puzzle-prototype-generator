candidate_id: CANDLE_FULL_EXPOSURE_COMPACT_CAPSTONE_003
exact_version: CANDLE_FULL_EXPOSURE_COMPACT_CAPSTONE_003_exact_003

opening: >-
  玩家从下方中央同时看见两条等长准备方向：向右抵达工作烛下方，或向左再向上抵达
  接收烛左侧。两条路线都恰在首个共享边界形成一次局部可行提交，选择不是走廊分岔后的
  自动事件串，而是决定哪根烛承担右盆、哪根烛必须保留给左盆。
key_judgment: >-
  接收烛在三格时向左被火盆实体挡住，向右却能长滚并点亮右盆；这个即时回报是死路，
  因为它同时熄灭并封死工作烛，左盆也失去唯一接收者。玩家必须把右盆留给工作烛，
  并让接收烛在交叉口接火后继续留驻到第二个燃烧边界。
operation_relation: >-
  第二个边界把接收烛从三格缩为两格，使左盆不再落在身体带，而恰好落到上移后的芯行；
  下方单墙同时封住把它上推再多烧一轮的替代逻辑。玩家从右侧提交向左侧滚时，火盆由
  先前的实体挡块变为第一小步的火态 consumer。
visible_payoff: >-
  左盆在不可中止长滚第一小步点亮，接收烛继续滚至左端，立即触发正常胜利；高潮后没有清理段。
wrong_role_probe: >-
  inputs=[left,left,up,up,up,right] 会在首个边界后让接收烛右滚、点亮右盆并熄灭工作烛；
  exact 完整图反向可达检查确认该终态 final_state_can_reach_win=false。
known_perceptible_defects:
  - none_identified
