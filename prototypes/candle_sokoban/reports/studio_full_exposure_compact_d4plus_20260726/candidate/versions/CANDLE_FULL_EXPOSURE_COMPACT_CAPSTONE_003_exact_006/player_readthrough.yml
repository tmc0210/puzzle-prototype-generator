schema_version: 1
candidate_id: CANDLE_FULL_EXPOSURE_COMPACT_CAPSTONE_003
exact_version: CANDLE_FULL_EXPOSURE_COMPACT_CAPSTONE_003_exact_006
reader_assumption: 已掌握全部 Candle 机制及衍生技巧的熟练玩家

visible_read:
  opening: >-
    玩家先把未燃竖烛推入交叉芯位；随后沿短通道抵达同时邻接辅助烛与交叉供体的决策位。
    两根燃烛都是可操作对象，且共享倒数已到边界前一拍。
  first_active_decision: >-
    第五步的左推不是等待动作：玩家选择辅助烛，立即点亮左盆，同时主动保留交叉供体，
    让它在本轮缩短腾出交叉芯位并把退焰交给接收者。若改为上滚供体，接收者只未燃重曝，
    即使后来取得两个盆的进度也无法恢复。
  retained_relation: >-
    第一次交接后，玩家还不能直接结束；必须保持接收者持续带火，同时把已缩成单格的供体
    转去上行点盆。若用供体回占交叉芯位，接收者会熄灭，而单格供体下一边界只燃尽，不能重交接。
  payoff: >-
    第二边界同时烧毁供体与辅助烛，并把接收者缩成单格。玩家三步抵达其左侧后向右提交长滚；
    接收者在不可中止的五格滚动中先点近盆、后点终点前远盆，第一次边界建立并一路保留的火态
    在同一高潮动作中被集中读出。
  ending: >-
    远盆点亮即正常胜利，没有再接与交叉关系无关的清理子题。

active_decision_judgment:
  quality_basis:
    - 玩家第五步在两个可操作燃烛之间建立“移动辅助烛、保留供体”的关系。
    - 玩家随后必须保留接收者火态，并把供体的剩余单格分配给上盆；重遮会破坏此前关系。
    - 最终长滚同时消费接收者的对象身份、持续火态与此前上盆进度，后继约束回传到第五步。
  excluded_proxies:
    - 不使用 forced-viable 数量、比例或连续段评价质量、难度或线性。
    - 不使用 win-reachable outdegree 评价玩家选择价值。
    - 完整图只用于核验唯一因果链、旁路与恢复反事实。

comparison_to_exact_005:
  retained: >-
    交叉位置、接收者、辅助烛、全部火盆、最终长跑道、第五步主动选择与 14 步高潮节奏均保留。
  structural_revision: >-
    供体初始由三格改为两格，首次边界后由两格改为单格；它仍承担上盆再利用，却不能在重遮后
    再次缩短并第二次 shrink_ignite。修订删除的是非等价恢复逻辑，不是文字重分类。

known_perceptible_defects:
  - 开局前三步包含短通道定位，但它们同时把接收者推进交叉位并把玩家送到双对象决策面；没有独立子题。
  - 供体缩短为单格后只侧滚一格，空间表演弱于 exact_005 的两格供体；其职责是把一次性交接锁死并完成上盆，高潮仍由接收者五格长滚承担。

self_read_result: 作品核心成立，可送独立硬证据审查

