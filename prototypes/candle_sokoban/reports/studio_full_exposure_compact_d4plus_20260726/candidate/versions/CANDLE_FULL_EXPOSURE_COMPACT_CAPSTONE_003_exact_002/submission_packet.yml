designer_claim:
  player_experience_core: >-
    玩家把同一根竖烛先读成完整横烛的长度敏感止挡，再读成帽端退焰接收器；接到的火态经过一次缩短后由六格长滚送入近盆并交给第三烛，第三烛再跨边界缩短，以改变后的火头列完成第二次长滚。
  player_action: >-
    先向下侧滚 candle#1 构造帽端/芯位交叉；沿左侧走到 candle#2 缩短后的操作侧，向右长滚 candle#2；随后移动到 candle#3 缩短后的受力格，向上长滚 candle#3。
  visible_payoff: >-
    第一次边界可见 candle#1 退焰点燃 candle#2；candle#2 的六格滚在第三小步同时点亮近盆并点燃 candle#3；最终 candle#3 的四格滚在倒数第二小步点亮远盆并立即正常胜利。
  why_this_level_exists: >-
    把已掌握的止挡、退焰接收、共享倒计时、缩短后火头换列和滚动中接触压缩成一条连续火态接力；修订墙要求首次接火后供体真正退出交叉责任，不能用回推遮熄与再次点燃另造时序。
  work_identity_conditions:
    - candle#1 必须以三格完整长度侧滚到 candle#2 上方，并由 candle#2 帽端止挡。
    - candle#2 必须由首次 shrink_ignite 接火，随后在下一边界直接缩为两格并完成六格侧滚。
    - candle#1 在首次接火后不得回占接收芯位、遮熄 candle#2 或承担第二次修复点火。
    - candle#2 六格滚必须在途中点亮 brazier:7,5 并点燃 candle#3，不能由残余火头或火盆补火替代。
    - candle#3 必须跨下一次边界缩为两格，再以新的火头列完成四格侧滚并点亮 brazier:8,2。
    - 正常胜利必须是 all_braziers_lit 且玩家存活；死亡、事件胜利或删除对象均不等价。

packaging_account:
  opening: >-
    12x9 紧凑画面中，三格 candle#1 位于 candle#2 上方；入口仍只允许向下侧滚，立即建立止挡与交叉芯位关系。供体右下的单格墙清楚收回其落位后的后操作侧。
  preparation: >-
    candle#1 落位后，玩家沿左侧不回访路线前往 candle#2 第二次边界缩短后的操作侧；两次边界依次完成首次退焰点火与接收器火头下移。
  reveal_or_use: >-
    candle#2 向右六格滚，把此前火态一次展示为近盆点亮、candle#3 接力点燃和自身被体段遮火；玩家继续走向 candle#3 新受力格。
  ending: >-
    第三次边界令 candle#3 从三格缩为两格，玩家向上侧滚它；其新火头列在倒数第二小步点亮远盆，正常胜利在同一动作结算。
  every_major_element_role:
    - candle#1：完整长度供体、candle#2 的止挡测试对象、唯一一次退焰火源及后续边界相位标记。
    - candle#2：candle#1 的几何止挡、退焰接收器、第二次边界的缩短对象和六格长滚火态载体。
    - candle#3：由 candle#2 途中点燃的接力烛、第三次边界的缩短对象及最终四格长滚载体。
    - brazier:7,5：candle#2 第三滚动小步的途中消费者，使接收火态必须由长滚兑现。
    - brazier:8,2：candle#3 缩短后新火头列的远端消费者和正常胜利收束点。
    - 供体后侧筛选墙：阻止首次接火后把缩短供体推回交叉芯位；删除它会恢复一条非等价 repair 胜路。
    - candle#2 左侧约束墙与紧凑通道：限定必要操作侧，并让三轮倒数由走向下一操作位自然推进。
  known_perceptible_defects:
    - 入口侧滚仍是唯一合法进展，首步本身缺少选择压力。
    - canonical 空间路线较线性；难度 4 主要来自三次边界、两次不可中止长滚和火头列变化的联合预演。
    - 画布较 exact_001 多一列；该列用于把 repair 筛选墙与接力烛上滚芯列分离，但仍可能让构图显得偏长。

