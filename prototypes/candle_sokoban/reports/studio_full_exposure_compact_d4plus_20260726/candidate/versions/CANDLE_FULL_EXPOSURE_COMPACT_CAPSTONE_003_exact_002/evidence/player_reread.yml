initial_read:
  - 三格供体仍位于竖接收烛上方，接收烛帽端同时显示侧滚止挡与未来退焰接收关系。
  - 供体右下方的单格墙收回其落位后的后操作侧；它与右移后的接力烛跑道分列，不会成为接力灭火资源。
  - 两只火盆分别落在接收烛六格长滚的第三小步芯位和接力烛缩短后的最终芯列。
canonical_read:
  - 第一步把完整供体侧滚到接收烛上方；玩家沿左侧移动，第一次边界以退焰点燃接收烛。
  - 第二次边界同步把供体缩为单格、接收烛缩为两格；接收烛随后六格长滚，在第三小步点盆并点燃接力烛，第四小步被接力烛体段遮火。
  - 接力烛跨第三次边界缩为两格；玩家到达其新受力格后向上长滚，在倒数第二小步点亮远盆并立即正常胜利。
repair_read:
  - exact_001 repair 依赖的供体后操作位已被收回；玩家不能在首次接火后将缩短供体轴推回接收芯位。
  - 完整胜路没有任何 repair signature 边；删除该墙的结构反事实会恢复相同 repair 责任链。
