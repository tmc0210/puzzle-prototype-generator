designer_claim:
  player_experience_core: >-
    玩家把同一根竖烛先读成完整横烛的长度敏感止挡，再读成帽端退焰的接收器；接到的火态经过一次缩短后由五格长滚送入近盆并交给第三烛，第三烛再跨边界缩短，以改变后的火头列完成第二次长滚。
  player_action: >-
    先向下侧滚 candle#1 构造帽端/芯位交叉；沿左侧走到 candle#2 缩短后的操作侧，向右长滚 candle#2；随后移动到 candle#3 缩短后的受力格，向上长滚 candle#3。
  visible_payoff: >-
    第一次边界可见 candle#1 退焰点燃 candle#2；candle#2 的五格滚在第二小步同时点亮近盆并点燃 candle#3；最终 candle#3 的四格滚在倒数第二小步点亮远盆并立即正常胜利。
  why_this_level_exists: >-
    把已掌握的止挡、退焰接收、共享倒计时、缩短后火头换列和滚动中接触压缩成一个连续火态接力，检验玩家能否跨三个边界预演同一状态，而不是逐个触发独立机制见证。
  work_identity_conditions:
    - candle#1 必须以三格完整长度侧滚到 candle#2 上方，并由 candle#2 帽端止挡。
    - candle#2 必须由 shrink_ignite 接火，随后缩为两格并完成五格侧滚。
    - candle#2 五格滚必须在途中点亮 brazier:6,5 并点燃 candle#3，不能由残余火头或火盆补火替代。
    - candle#3 必须跨下一次边界缩为两格，再以新的火头列完成四格侧滚并点亮 brazier:7,2。
    - 正常胜利必须是 all_braziers_lit 且玩家存活；死亡、事件胜利或删除对象均不等价。

packaging_account:
  opening: >-
    11x9 紧凑画面中，三格 candle#1 位于 candle#2 上方，candle#2 的帽端明显阻挡其向下侧滚；入口只有向下侧滚这一项合法进展，先建立作品的共享交叉关系。
  preparation: >-
    candle#1 落位后，玩家沿不回访路线前往 candle#2 在第二次边界缩短后的操作侧；两次边界依次完成退焰点火与接收器火头下移。
  reveal_or_use: >-
    candle#2 向右五格滚，把先前不可见的火态用途一次展示为近盆点亮、candle#3 接力点燃和自身被体段遮火；玩家随后继续走向 candle#3 新受力格。
  ending: >-
    第三次边界令 candle#3 从三格缩为两格，玩家向上侧滚它；其新火头列在倒数第二小步点亮远盆，正常胜利在同一动作结算，无死亡或墙熄灭尾声。
  every_major_element_role:
    - candle#1：完整长度供体、candle#2 的止挡测试对象、首次退焰火源及后续边界相位标记。
    - candle#2：candle#1 的几何止挡、退焰接收器、第二次边界的缩短对象和五格长滚火态载体。
    - candle#3：由 candle#2 途中点燃的接力烛、第三次边界的缩短对象及最终四格长滚载体。
    - brazier:6,5：candle#2 第二滚动小步的途中消费者，使接收火态必须由长滚兑现。
    - brazier:7,2：candle#3 缩短后新火头列的远端消费者和正常胜利收束点。
    - candle#2 左侧约束墙：阻止无贡献的回访操作侧，删除后胜态由 4 增至 8 且出现更弱的等价路线族。
    - 紧凑通道：把三轮倒计时转化为前往下一操作侧的连续移动，使 canonical 无等待、无回访。
  known_perceptible_defects:
    - 入口侧滚受紧凑墙形约束为唯一合法动作，首步本身缺少选择压力。
    - 难度 4 主要来自三次边界、两次长滚和火头列变化的联合预演；若玩家立即读懂止挡关系，执行段会较顺。
    - canonical 的空间路线较线性，审美价值依赖火态接力是否足以抵消较少的操作分支。

