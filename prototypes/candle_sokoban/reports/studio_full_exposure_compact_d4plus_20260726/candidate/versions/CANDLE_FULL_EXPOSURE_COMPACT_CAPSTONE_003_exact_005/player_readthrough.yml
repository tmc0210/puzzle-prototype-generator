schema_version: 1
candidate_id: CANDLE_FULL_EXPOSURE_COMPACT_CAPSTONE_003
exact_version: CANDLE_FULL_EXPOSURE_COMPACT_CAPSTONE_003_exact_005
expected_difficulty: 4+

opening_read: >-
  玩家从竖向未燃接收烛尾端出发。第一步上推不是等动画，而是亲手把接收烛芯送进横向燃烛末端格；
  随后三步转到两根燃烛之间，把共享倒数送到 1。四个未亮火盆、两格辅助燃烛、三格交叉供体和
  被 (7,5) 火盆挡住的接收烛侧滚面都在开局可见。

central_choice: >-
  第5步从同一玩家格可左推辅助烛，也可上滚交叉供体。左推立即点亮左盆；上滚立即点亮上盆。
  两格辅助烛在错误边界只缩成单格，并不会立刻消失，错误分支还能在第8步补亮左盆；因此正确性
  不能仅靠“保住一次性辅助物”读出。玩家必须预见：只有让供体留到边界缩短，接收烛才会取得退焰。

middle_reinterpretation: >-
  正确边界后，缩成两格的供体不退休：玩家把它上滚到天花板下，再沿轴推动点亮上盆。
  第二次共享边界同时把接收烛从两格缩成单格。位于 (7,5) 的火盆由此改变意义：此前它是
  两格接收烛侧滚的实体挡块，缩短后则成为单格接收烛芯轨迹上的第一个 consumer。

payoff: >-
  最后一次不可中止五格右滚在第1小步点亮 (7,5)，第4小步点亮 (10,5)，第5小步才停住；
  玩家直接看到“先接退焰、再参加一次边界缩短”把原先被火盆挡住的对象变成能从其下方贯穿跑道的输出。

solution_family_read: >-
  完整图另有较长的再遮芯/再退焰交接变体；它们仍保持同一目标分配和对象责任，不允许火盆或普通烛芯
  替代首次 shrink_ignite，也不能从第5步错误分支恢复。

known_perceptible_defects:
  - >-
    最短解前四步的站位较受约束，且最短解在洞见成立后收束明确；若玩家把这段只读成“按唯一通道赶边界”，
    仍可能感到线性。Designer 判断首步对象构造、第5步双进展承诺、错误分支延迟进展和中盆前后双重责任
    已使难度来自关系推演，但把该线性感风险明确交给独立 Critic 判断。
