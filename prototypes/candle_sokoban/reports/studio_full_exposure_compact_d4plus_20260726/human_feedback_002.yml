feedback: >-
  forced-viable commitments / 胜可达出度比例是无意义的质量指标。若存在多个可能通向胜利的路径，
  Designer 反而可能需要投入大量工作封闭 bypass，以保持作品身份；因此胜可达分支少不能推出玩家体验线性，
  胜可达分支多也不能推出存在有意义选择。关键只在于这条路径中是否存在玩家主动决策。

required_design_read: >-
  不再使用 forced-viable 数量、比例或连续段作为关卡质量、难度或线性度的正负依据。回到玩家侧逐项说明：
  玩家在何处主动建立关系、在何处基于可见后继责任选择对象职责或顺序、错误理解为何在当时局部合理，
  后续如何兑现或反筛选该决策。唯一解、旁路封闭和完整图仍只承担机械作品身份核验，不替代玩家主动决策判断。

controller_boundary: >-
  本文件只记录并转交人类反馈；结构设计、修订方法与作品判断仍由 Designer 独立负责。
