sampled_axes:
  - 辅助燃烛与交叉供体分别在边界滚动，并在不同滚动小步点亮同一个近端火盆。
  - 交叉供体留驻缩短 / 先退出并在墙端失火，对接收烛 shrink_ignite / 未燃重曝的对照。
  - 接收烛原芯行直接长滚的远盆读出，以及近盆与原芯行的正交分离。
  - 退出供体封闭操作面与开放操作面的移动恢复对照。
  - 错误边界状态下接收烛轴推换线、近盆复燃，以及首次失败长滚后的轴推阻塞。
