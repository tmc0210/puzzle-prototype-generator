runId: batch_005_dual_transfer_later_filter
title: "双退焰输入之后的余身过滤与恢复对照"
notes: >-
  二格右向燃烛末端预先占住竖向未燃接收烛芯位，以五个合法走动到达共享边界；
  再比较同一接收烛向右长滚时，未选二格烛身、固定挡块与可移动挡块怎样改变先灭、复燃和点盆。
cases:
  - id: vacated_cap_then_fixed_source_success
    family: dual_transfer_later_filter
    variant: fixed_source_reached
    changed_variable: "接收烛长滚可抵达保留火源与末端火盆"
    contrast_with: vacated_cap_then_fixed_blocker_failure
    notes: "正例：五个非空输入完成 shrink_ignite；长滚先被未选二格烛身遮灭，再由已亮火盆复燃并点末端盆。"
    layout: |
      ............
      ............
      ............
      ............
      ....1R.3r.Oo
      .....u......
      .....2......
      .....2......
      @........r..
      ............
    actions: [up, right, right, right, right, right]
  - id: vacated_cap_then_fixed_blocker_failure
    family: dual_transfer_later_filter
    variant: fixed_blocker_before_source
    changed_variable: "在接收烛身行加入不可移动已亮火盆，使侧滚在复燃源前停下"
    contrast_with: vacated_cap_then_fixed_source_success
    notes: "错例：仍以五个非空输入完成 shrink_ignite，但右滚被固定实体提前挡停，只出现烛身遮灭。"
    layout: |
      ............
      ............
      ............
      ............
      ....1R.3r.Oo
      .....u...O..
      .....2......
      .....2......
      @...........
      ............
    actions: [up, right, right, right, right, right]
  - id: movable_blocker_failure
    family: dual_transfer_later_filter
    variant: movable_blocker_before_source
    changed_variable: "把固定火盆挡块换成可移动的未燃单格竖烛"
    contrast_with: movable_blocker_recovery
    notes: "边界与原定左滚同上；单格烛位于接收烛身行，预计先造成同样的提前停滚。"
    layout: |
      ............
      ............
      ............
      ............
      ....1R.3r.Oo
      .....u...r..
      .....2......
      .....2......
      @...........
      ............
    actions: [up, right, right, right, right, right]
  - id: movable_blocker_recovery
    family: dual_transfer_later_filter
    variant: move_blocker_then_roll
    changed_variable: "先把单格挡块沿轴移出接收烛身行，再执行同一长滚"
    contrast_with: movable_blocker_failure
    notes: "恢复 probe：若移开挡块后能重现先灭、复燃、点盆，则可移动未选对象不能支撑不可逆过滤。"
    layout: |
      ............
      ............
      ............
      ............
      ....1R.3r.Oo
      .....u...r..
      .....2......
      .....2......
      @...........
      ............
    actions: [up, up, up, right, right, right, right, right, right, right, up, right, right, down, up, left, left, down, right]
  - id: delayed_or_axis_recovery
    family: dual_transfer_later_filter
    variant: delay_and_axis_probe
    changed_variable: "错误分支在原定长滚前后改用轴推或跨入下一燃烧周期"
    contrast_with: vacated_cap_then_fixed_blocker_failure
    notes: "恢复 probe：只记录实际合法动作、点火来源和点盆结果，不以预算耗尽证明不可恢复。"
    layout: |
      ............
      ............
      ............
      ............
      ....1R.3r.Oo
      .....u...O..
      .....2......
      .....2......
      @...........
      ............
    actions: [up, up, up, right, right, right, right, right, right, right, up, right, down, left, down, down, down, right, down, right, right, right, up, up]
