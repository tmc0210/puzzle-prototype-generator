design_brief: >-
  在已校验的 experience brief 下，为唯一候选 CANDLE_FULL_EXPOSURE_COMPACT_CAPSTONE_003
  完成一关最终紧凑、难度 4 或更高、允许暴露到 rolling_contact_chain 的全机制终盘关。
  玩家已掌握全部机制及其衍生技巧；难度应来自跨共享边界的主动构造、对象/空间复用与
  不可中止长侧滚对早期次序的读出，不来自等待演出、机制 witness 拼接、目标硬化、腾挪税或冗余画布。
  只维护一个连续工作台和一个候选；工作布局不编号，只有完整自查通过的冻结快照才能发布 exact。
  严禁读取或借用 curriculum_planning_context.md、curriculum_planning_20260725/** 及其中相关体验核心，
  也不得读取旧 Candle studio 候选或报告作为设计来源。
