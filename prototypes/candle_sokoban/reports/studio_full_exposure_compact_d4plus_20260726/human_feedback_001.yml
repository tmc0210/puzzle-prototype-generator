feedback: 关卡呈现明显线性编排；已知这一缺点仍提交待玩，浪费了人类时间。
controller_interpretation:
  - 机械耦合复杂不能补偿玩家侧线性执行。
  - 明确可感的线性编排缺点必须在送审前消除，不能作为待玩风险转交给人类。
  - 后续在同一候选下更换结构族；不对当前布局做局部增墙、加步数或事件堆叠式修补。
required_player_relationship:
  - 熟练玩家必须在局部可行的构造之间作出由后续对象职责、操作面和燃烧相位共同筛选的选择。
  - 前序选择必须被后续局面实际消费；移除后继后，若早期选择仍同样显然，则结构不合格。
  - 等待或赶路只有在存在真实的不等待选择、且相位选择会改变后续关系时才可承担难度。
  - 机制必须由玩家主动构造和利用，不能靠唯一走廊自动依次触发。
