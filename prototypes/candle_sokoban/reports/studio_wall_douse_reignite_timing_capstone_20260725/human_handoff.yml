  player_experience: >-
    玩家先在首轮燃烧边界主动把四格目标蜡烛的烛芯推入墙后灭火，使它缺席该轮燃烧并保住一格；
    随后必须让它在第二轮边界前从静态火盆复燃并重新参与共享缩短。这个参与时机与辅助蜡烛、
    横向瞬时止挡的燃烧日程共同决定目标何时成为单格、能否被截停并交付最终火盆。
  known_risks:
    - t1 与 t3 首次复燃都能赶上同一个第二轮边界；逻辑唯一性依赖“参与哪一轮”而非唯一接触倒数。
    - row4 三只已亮火盆与五格横止挡的构图偏工程化，需要真人确认其整体读图与回报是否舒适。
    - 当前没有合法 clean Candle 前序关提供数值难度标尺；难度 5 是目标，需由人类试玩最终校准。
    - 原坐标 (5,4)、(6,4) 两只中部火盆替墙在完整图上行为中性；按人类意见保留统一三盆构图。
