design_task_id: candle_wall_douse_reignite_timing_capstone_20260725
candidate_id: CANDLE_WALL_REIGNITION_TIMING_CAPSTONE_001
exact_version: v2

player_side_reading:
  opening: >-
    玩家从右侧竖道连续上行，必须在首个五拍边界把四格左向目标烛向左轴推一格；新烛芯正好进入
    `(4,2)` 墙而熄灭。目标因此主动缺席首轮燃烧，保住四格；横止挡和辅助烛则同时缩短。
  preparation: >-
    墙灭后玩家既能接近上方辅助烛，也能从目标右上方把它向下滚到 `(4,3)` 已亮火盆。真正的计划
    不是单纯等待：目标必须在第二轮边界前复燃并参加该轮，辅助烛还要在自身燃尽前跨轮送到上盆。
  core_reveal: >-
    规范最短解在倒数 t1 把目标滚下一格：静态火盆复燃目标，复燃与边界同一输入结算，目标立刻从
    四格缩成三格。完整全胜解只有 t1/t3 两类首次复燃倒数；二者都让目标参加同一个第二轮边界，
    而不是把复燃拖到下一轮。
  consumer: >-
    row4 三只既燃火盆是实体 footprint 筛：二格以上目标的身体必撞 x7/x6/x5，只有缩成单格、身体
    仅占 x8 的目标能向下滚。与此同时五格横止挡从左向右退烧，第四轮只剩 x8 单格；及时目标在
    同一边界变成单格后，会被它截停在 row5。晚一轮复燃者等到单格时止挡已消失，只能滚到 row6，
    其右侧与下侧操作位都是墙，无法回收。
  ending: >-
    目标停在 row5 后，玩家用三步取得其右侧；第四步左推令单格目标的左烛芯点亮 `(6,5)`，同一
    边界上目标与横止挡一起燃尽并立即以 all_braziers_lit 获胜，没有高潮后的清理。

difficulty_reading:
  expected: 5
  counted_reasoning:
    - 从最终 `(6,5)` 反推目标必须以单格停在 `(8,5)`，再反推横止挡第四轮必须仍保留 x8 单格。
    - 从 row4 footprint 筛反推目标在第四轮必须恰好从二格缩到一格，不能早也不能晚。
    - 由目标长度链反推出首轮必须墙灭保长、第二轮必须复燃参燃，并同时安排辅助烛跨轮点亮上盆。
    - 识别目标、辅助烛与横止挡在四个边界上的同步长度表，以及最终四拍回位与燃尽同回合获胜。
    - 区分“火源仍在”与“已经错过止挡窗口”：晚复燃表面上仍能点火，却已在空间上不可逆失败。
  not_counted_as_difficulty:
    - 开局竖道的四次上行。
    - 玩家已经掌握的轴推、侧滚、墙灭火、静态复燃与五拍倒数规则本身。
    - raw 输入串中相邻独立走位的交换数量。
  calibration_boundary: >-
    难度 5 是 Designer 根据当前玩家先验、四轮反推深度和跨对象同步作出的送审预期；图规模与解串
    数量不作为难度证据，最终难度和审美判断留给独立 Puzzle Critic。

major_element_responsibility:
  - element: target candle#1
    responsibility: 贯穿首轮墙灭保长、第二轮静态复燃、len3/len2/len1 三次参燃、止挡停位与终盆交付。
  - element: wall (4,2)
    responsibility: 目标首轮边界的主动墙灭火点；删除后完整反事实无胜态。
  - element: lit brazier (4,3)
    responsibility: 墙后任一可达重曝的静态复燃源；删除后完整反事实无胜态。
  - element: auxiliary candle#4 and brazier (14,1)
    responsibility: 跨前两轮缩短后仍需三次轴推完成的上盆责任；删除辅助烛后完整反事实无胜态。
  - element: fire grate braziers (5,4), (6,4), (7,4)
    responsibility: 分别挡住四格、三格、二格目标身体，只放行 x8 单格；删除后三轮身份退化为 14 步旁路。
  - element: transient stopper candle#3
    responsibility: 左端逐轮退烧而右端固定；第四轮留下 x8 单格，把及时目标截停在唯一终点行。
  - element: lit brazier (3,6) and wall (9,6)
    responsibility: 分别固定横止挡的左烛芯与右轴操作面，使它只承担倒数止挡而不能被玩家搬运。
  - element: brazier (6,5)
    responsibility: 只由 row5 单格目标最后左推点亮；删除后胜利退化为只完成上盆。
  - element: row7 wall and right corridor
    responsibility: row7 墙把晚到目标锁死在 row6；右廊让正确目标在剩余四拍内取得终推操作侧。
  - element: lit brazier (7,1) and upper walls
    responsibility: 固定上层操作面，阻止残余目标或辅助烛把上层走廊变成第二搬运场。

solution_family_reading:
  result: equivalent_variants_only
  logical_family_count: 1
  raw_shortest_input_count: 306
  winning_runtime_states: 1
  winning_product_states: 2
  reignite_countdown_classes:
    - t1
    - t3
  equivalence: >-
    306 条最短输入来自狭小走廊中相邻独立步的交换，以及目标首次接触火源为 t1 或 t3；两类都在
    同一个第二轮边界前复燃，并共享 wall_douse > static_reignite > len3 > len2 >
    len1_and_stopper_window > singleton_delivery 的唯一里程碑签名、同一对象职责和同一唯一胜态。
  non_equivalent_winning_family_found: false

known_perceptible_defects:
  - t1 与 t3 都能赶上同一第二轮边界；作品要求选择正确参燃边界，不要求唯一的火源接触倒数。
  - row4 三盆与 row6 长横烛有明显工程化密度，但它们分别直接消费目标 footprint 和参燃截止窗口。
evidence_limits:
  - 玩家侧重读与难度判断仍需独立 Puzzle Critic；完整图和 Designer 自评不证明审美质量。
  - task-local 产品图把同一 runtime state、单调历史和复燃倒数类合流；不以 raw 输入串数量定义逻辑解数。
