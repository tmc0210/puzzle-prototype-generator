experience_core:
  experience_statement: >-
    玩家把“燃着”理解为可主动排程的参与状态：先在恰当边界前用墙暂时撤掉一根关键蜡烛的
    燃烧资格，保住它的一格实体与相应操作面；随后不是尽快复燃，而是预见后继空间责任，选择
    让它在边界前保长复燃或在边界上复燃并立即少一格，最终用所选 footprint 完成同一计划。
  visible_setup: >-
    开局可见一根长度足以产生一格 footprint 差的已燃目标蜡烛、可遮住其烛芯的墙、合法复燃火源、
    共享倒计时，以及会读取目标末端格或操作侧的后继空间关系；这些要素共同承诺一次主动时机选择。
  player_action: >-
    玩家必须亲自把目标烛芯送入墙后，在燃烧边界前灭火避烧；再通过承担其它对象或操作侧责任的
    行动推进共享相位，把同一目标蜡烛送到已点亮火盆或外露已燃烛芯处静态复燃，并选择它是否立即
    参加边界缩短；之后利用所得长度、空格或操作面继续完成点盆计划。
  visible_payoff: >-
    复燃行动结算后，玩家立即看到目标蜡烛保留末端格或烧掉末端格，原先被实体占据/阻挡的格与
    操作侧随之保持或腾空；紧邻 consumer 随即把同一个推滚关系变成可行或被挡，并把结果传向胜利。
  why_level_exists: >-
    本关把墙从单纯的灭火障碍提升为共享燃烧日程的主动控制器，也把复燃从恢复状态提升为对
    “参加哪一次燃烧”的承诺；它让玩家用空间责任而非倒数空耗来计划一根蜡烛何时在场、何时缺席。
  core_boundary:
    central_objects:
      - 承担墙灭火、复燃和 footprint 输出的同一根目标蜡烛
      - 使烛芯可主动遮蔽的墙边界
      - 共享倒计时与被跳过/被参加的燃烧边界
      - 已点亮火盆或外露已燃烛芯形成的合法静态复燃源
      - 直接读取长度、末端空格或操作面的后继 consumer
      - 由该 consumer 继续推进的未点亮火盆责任
    supporting_objects:
      - 为取得操作侧或准备相位而必须搬运的其它蜡烛
      - 限制侧滚终点、塑造窄通道和火焰安全面的墙
      - 只提供可读反馈而不独立成题的辅助火盆

work_identity:
  conditions:
    - >-
      同一根初始已燃目标蜡烛必须由玩家主动墙灭火，并因在边界接触结算中先熄灭而至少保住一个
      本会被烧掉的实体格；预先未燃或自动灭火不满足此条件。
    - >-
      玩家必须在不重置共享倒计时的前提下主动复燃该目标蜡烛；复燃发生在哪个相位必须决定它
      保长还是立即参加燃烧并缩短。
    - >-
      至少一个后继空间责任必须区分这两个 footprint：读取被烧掉末端格、烛芯位置、轴推背面、
      侧滚操作面或必需通道中的一项，并对最终点盆计划不可替代。
    - >-
      墙灭火与复燃之间的相位推进动作必须同时承担对象搬运、火源准备、操作侧取得或通道责任；
      不能只靠可自由增删的短/长路线或往返等待。
    - >-
      若同时使用火盆与源烛芯两种复燃源，二者必须共同改变同一计划中的长度、火源或操作责任；
      不得分别成为独立 witness 或机制清单。
    - >-
      前序机制组合必须因预见核心所需相位和 footprint 而产生选择，后继必须消费核心留下的具体状态；
      任何完成后退休的独立段落均不属于作品身份。
  counterfactuals:
    - 删除墙或让目标蜡烛不经主动墙灭火就避开该次燃烧，玩家不再控制“本轮缺席”，作品身份消失。
    - 让复燃重置倒计时，或让中途/边界复燃留下相同长度和 footprint，时机承诺不再成立。
    - 删除后继 consumer，或把挡位移到两种长度都同样受阻/同样可行的位置，相位选择只剩事件表演。
    - 加入可无责任往返的等待区，使玩家能在不改变任何对象责任时任意选择复燃相位，核心退化为自由调钟。
    - 把最终点盆改成灭火/复燃之后另起的独立子题，前后因果断裂，不再是同一作品。
    - >-
      仅观察到源烛缩短后火焰后退、却没有实际后继消费该新火焰位置时，不能把这一变化计入作品身份；
      当前简报不对此作正向承诺。

level_brief:
  packaging_intent: complete_single_level
  expected_difficulty: 5
  expected_scale: >-
    中等且尽量紧凑；允许多根蜡烛和多次边界，但每个主要对象、通道与行动都必须回到同一灭火—复燃—
    footprint—点盆因果链，规模只扩到足以让操作侧与对象责任替代自由调相。
  expected_player_load: >-
    对熟练玩家要求同时追踪共享相位、目标与源蜡烛长度、墙遮芯状态、复燃来源、火焰危险、
    推滚操作面和后继点盆责任；高难来自这些变量的联合计划与反事实排除，不来自执行税。

