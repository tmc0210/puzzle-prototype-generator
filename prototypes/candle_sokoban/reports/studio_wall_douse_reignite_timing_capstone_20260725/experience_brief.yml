prototype_specific_routing:
  - 正式候选只使用 all_braziers_lit，不得使用 event_occurs。
  - allowed_exposure_through 固定为 shared_fire_and_reignition；后续三个机制家族的事件在完整可达图上必须不可达。
  - 滚动可作为基础操控使用，但点火必须在滚动终点静态结算；不得触发 rolling_contact_chain 的途中点火或灭火事件。
  - 不使用烛身遮蔽/重曝、退焰点火或滚动途中接触链来制造本关难度。
  - 发布 exact 前必须保存当前布局的非空 replay、完整图、解族/旁路与 exposure audit 原始 artifact。

human_review_constraints:
  - 人类要求难度至少 4；Controller 将目标固定为 5。
  - 当前没有合法 clean Candle 前序关可提供数值难度标尺；不得借用其它原型的 difficulty_score。
  - 归档校准只支持审美判断：高难应来自同一因果链中的主动构造、反直觉承诺、强耦合和要素复用。
  - 不以路线税、相位空耗、事件数量、对象堆叠、反馈迟缓 deadend、开场机制动画或割裂子题抬高难度。
  - 高 affordance 对象必须承担玩家可感的责任；若可见能力只产生标签却无几何/时机用途，应删改。
  - 高潮后应尽快以点盆计划收束，不追加与核心无关的清理劳动。
