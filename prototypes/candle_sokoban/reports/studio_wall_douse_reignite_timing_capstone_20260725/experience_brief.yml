design_task_id: candle_wall_douse_reignite_timing_capstone_20260725

prototype_context:
  confirmed_rules:
    - 玩家每次合法行动推进共享倒计时；无效输入不形成 runtime edge，也不推进倒计时。
    - 蜡烛可沿长轴推动一格，也可从侧面触发完整滚动；一次多格滚动只推进一次共享倒计时。
    - 接触结算先熄灭被墙或其他烛身遮住的已燃烛芯，再递归结算外露火源的点火与点盆。
    - 已燃烛芯被墙遮住会立即熄灭；若接触发生在燃烧边界前，熄灭蜡烛避开该次缩短。
    - 已点亮火盆和外露已燃烛芯可以点燃外露未燃烛芯，复燃不重置共享倒计时。
    - 从 countdown=1 进入燃烧边界时，当前仍点燃的全部蜡烛同时从烛芯端缩短一格；
      在该次接触结算中刚复燃的蜡烛立即参加本轮缩短。
    - 全局燃烧周期固定为 5；完整回合按移动、接触、倒计时与燃烧、死亡、胜利的顺序结算。
  win_condition: 玩家存活，并在完整回合结算后点亮全部火盆（all_braziers_lit）。
  object_and_event_semantics:
    - 多格蜡烛是刚性实体；cap 方向外相邻一格是非实体烛芯投影，烛芯外露时可传火并会杀死玩家。
    - 已点亮火盆是永久火源；未点亮与已点亮火盆均为实体挡块。
    - >-
      墙灭火的价值不是事件标签，而是把目标蜡烛从某次 simultaneous burn 的参与集合中移除，
      从而保留一个烛身格、烛芯位置或操作面。
    - >-
      中途复燃可以保留当前长度；边界复燃会先点亮再立即缩短。两种结果必须由后继空间责任读取，
      才构成有效的 shared_fire_and_reignition 使用。
  allowed_exposure_through: shared_fire_and_reignition
  allowed_mechanisms:
    - basic_candle_manipulation
    - wall_dousing
    - shared_fire_and_reignition
    - push_axis
    - roll_candle
    - roll_multi_cell_one_turn
    - light_brazier
    - player_died
    - countdown
    - shrink
    - burn_out
    - simultaneous_burn
    - extinguish_by_wall
    - countdown_without_lit_candle
    - boundary_extinguish_avoids_burn
    - ignite_from_brazier
    - ignite_from_wick
    - ignite_midcycle
    - boundary_ignite_participates
  tool_boundary:
    - 当前实现可用：Candle runtime、ASCII parser/renderer、solver、完整图枚举、layout analyzer、try-inputs、playable 与 exposure audit。
    - 当前不可用：Candle 专属 miner、candidate factory、PuzzleScript exporter/checker；不得用其它原型结果替代 Candle runtime 证据。
    - 正式候选必须对当前 exact 运行非空 replay、完整解族/图诊断与 exposure audit；旧版本证据不沿用。

player_context:
  basic_sokoban_experience_assumed: true
  player_prior:
    - 玩家拥有全图信息、稳定执行能力和基本类推箱几何直觉。
    - 玩家已完全掌握 basic_candle_manipulation 与 wall_dousing，以及两者全部衍生技巧和计算。
    - 玩家能计算共享倒计时、轴推、侧滚一回合计时、长度变化、火焰危险、墙灭火与边界避烧。
    - 玩家不会把长走位、规则遗忘、读图失误或执行唯一操作当作谜题内容。
  prerequisite_mechanisms:
    - basic_candle_manipulation
    - wall_dousing
  known_prior_level_refs: []

experience_seed:
  human_seed: >-
    玩家需要通过分析，主动把已燃蜡烛的烛芯送到墙后灭火，并在计划好的共享倒计时相位把它
    重新送到已点亮火盆或另一根外露已燃蜡烛的烛芯处复燃，以控制它跳过或参加某次燃烧边界；
    相位选择必须共同决定长度、占格、火源位置与后继操作位，而不是等待固定步数或观看被动动画。

task_exploration:
  required_skill: sokoban-mechanism-lab
  intent: mechanism_explore
  publication_scope: task_local
  dispatch_ref: prototypes/candle_sokoban/reports/studio_wall_douse_reignite_timing_capstone_20260725/exploration/dispatch.yml
  task_lexicon_ref: prototypes/candle_sokoban/reports/studio_wall_douse_reignite_timing_capstone_20260725/exploration/lexicon.md
  task_index_ref: prototypes/candle_sokoban/reports/studio_wall_douse_reignite_timing_capstone_20260725/exploration/lexicon_index.md
  first_material_batch_ref: prototypes/candle_sokoban/reports/studio_wall_douse_reignite_timing_capstone_20260725/exploration/runs/batch_001_brazier_phase_gate/batch.yml
  selected_material_refs:
    - prototypes/candle_sokoban/reports/studio_wall_douse_reignite_timing_capstone_20260725/exploration/lexicon.md#火盆复燃的被烧掉末端格侧滚门
    - prototypes/candle_sokoban/reports/studio_wall_douse_reignite_timing_capstone_20260725/exploration/lexicon.md#后退源火焰复燃的双烛侧滚门
    - prototypes/candle_sokoban/reports/studio_wall_douse_reignite_timing_capstone_20260725/exploration/runs/batch_001_brazier_phase_gate/report.md
    - prototypes/candle_sokoban/reports/studio_wall_douse_reignite_timing_capstone_20260725/exploration/runs/batch_002_wick_phase_gate/report.md
  material_reading:
    supported_relations:
      - >-
        countdown=1 墙灭火可以让二格目标烛避开本轮缩短；随后在 countdown=3 中途复燃保留二格，
        在 countdown=1 边界复燃则立即烧掉末端，只留一格。
      - >-
        把墙压在可能被烧掉的末端格下方，可让同一个侧滚输入在二格结果中 roll_blocked，
        在一格结果中合法；把墙移到幸存格下方则两种结果都被挡。
      - >-
        外露源烛可在首个边界从三格缩成二格并准备静态复燃位置；边界复燃时源烛和目标烛会同步缩短。
    limits:
      - >-
        两批短/长接近路线只是调出 countdown=3 与 countdown=1 的实验 harness；正式作品必须用对象搬运、
        火源准备、目标操作侧取得或其它空间责任承担这些行动，不能保留自由路线调相。
      - >-
        双烛材料已观察到源火焰在第二个边界后再后退一格，但尚无独立后继 consumer；除非后续实际
        probe 验证其点盆或接力责任，否则不得把源火焰后退写成作品亮点或身份条件。
      - >-
        当前材料只提供局部事实与接法，不决定正式 structure family、包装规模、难度或候选布局。

