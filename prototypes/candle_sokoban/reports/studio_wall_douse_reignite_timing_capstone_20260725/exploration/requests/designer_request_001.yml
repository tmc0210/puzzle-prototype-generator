request_id: designer_request_001
exploration_id: candle_wall_douse_reignite_timing_task_local_20260725
design_space: >-
  展开一种坐标无关的局部“相位选择器”：一根长度至少为二、初始已燃且可沿轴推的蜡烛，
  能由玩家主动把烛芯推到墙后，在共享倒计时的燃烧边界前熄灭并跳过该次缩短；随后玩家
  再把它移到可外露烛芯的位置，并在不同共享相位通过已点亮火盆或另一根外露已燃烛芯复燃。
  比较中途复燃保留当前长度与边界复燃立即缩短后所留下的不同长度、实体占格、烛芯火源位置
  和玩家操作侧。每张正向局面必须接一个最小后继 consumer，使上述差异直接决定下一次轴推或
  侧滚所需操作位、通道/挡位占用、火源能否到达未点火盆或另一外露烛芯中的至少一项；不得只
  证明 extinguish、ignite 或 boundary_ignite_participates 事件出现。只使用墙遮芯灭火与静态接触
  复燃，排除烛身遮蔽、燃烧退焰点火和滚动途中接触链。
sampling_axes:
  - >-
    灭火相位：在 countdown=1 的合法移动接触结算中主动墙灭火并立即避开本轮燃烧边界，
    对照提前一回合灭火、边界后才灭火、始终保持点燃；记录动作后 countdown、lit 状态和长度。
  - >-
    复燃相位：同一未燃外露烛芯分别在 countdown=1 接触火源并立即参加边界缩短，以及在
    countdown=2/3/4 的代表性中途相位复燃；优先寻找仅相差一回合却留下不同 footprint 的配对。
  - >-
    复燃来源：永久已点亮火盆与另一根外露已燃烛芯分别作为火源；对烛芯来源记录源蜡烛是否
    同时缩短、火源投影是否随边界后退，以及这些变化能否进入同一个最小 consumer。
  - >-
    蜡烛长度与朝向：测试二至四格目标蜡烛、水平/竖直及 cap 朝向，使“保留一格”和“立即少一格”
    在实体占格、烛芯投影或可站操作面上产生可读而非纯数值的差异。
  - >-
    墙口与复燃接法：比较直墙死端、墙旁凹口、单格转接口，以及火盆/源烛芯位于重曝路径的
    正前方或侧邻；保留能让灭火、重曝和复燃都由玩家选择，而非移动动画自动完成的接法。
  - >-
    最小后继 consumer：分别采样长度决定能否让出通道/保留挡位、占格决定能否取得轴推或侧滚
    操作位、烛芯位置决定能否点燃尚未点亮火盆或接力未燃烛芯；consumer 应在一至数个必要行动内
    给出可见反馈，并能反向排除错误相位。
  - >-
    相位可调空间：比较不存在无责任等待位、存在少量但会改变空间责任的合法行动、以及可任意
    往返空耗 countdown 的近邻；寻找时机由结构计划约束而不是靠固定等待或自由调相的局面。
  - >-
    操作面责任：比较目标蜡烛缩短前后玩家可绕行侧、轴推背面、侧滚触发面和火焰危险格；记录
    哪个操作面由先前灭火/复燃选择保存或牺牲。
current_material_refs: []
do_not_repeat:
  - 只出现灭火、复燃或边界参燃事件，但所有后继局面等价的 witness。
  - 通过原地往返、长路线或唯一合法动作把 countdown 调到固定数的被动时钟题。
  - 不灭火仍可得到同一长度、占格、火源与操作位的局面。
  - 任意复燃相位都被同一个 consumer 接受，或 consumer 根本不区分边界立即缩短与中途复燃。
  - 火盆和烛芯两个来源只是换皮，不改变源的空间责任、边界后位置或后继接法。
  - 灭火完成后对象退休，再拼接一个独立点盆 witness；或前后段可以各自独立完成。
  - 使用 extinguish_by_candle_body、wick_reexposed_unlit、shrink_ignite 或任何 rolling_contact_chain 事件。
  - 旋转、平移、重复次数或额外走位是唯一差异的材料。
materialization_target: >-
  首批优先发布至少两组 runtime-backed 配对局面：一组以已点亮火盆复燃，一组以外露已燃烛芯
  复燃；每组都同时包含“墙灭火跳过边界 -> 中途复燃保长”和“墙灭火跳过边界 -> 边界复燃立即
  缩短”的正向近邻，并接同一种最小 consumer 明确区分结果。每项材料须给出开始摆法、非空输入、
  每次关键行动前后的 countdown/长度/lit/占格/烛芯投影、关键事件、动作后局面、最小用法、可接入
  的墙口/通道/操作位、近邻退化和原始 runtime artifact 引用。若某来源无法形成有效 consumer，
  保留原始 probe 并明确失败边界，不把纯事件 witness 发布为正向 lexicon 材料。
