design_task_id: candle_wall_douse_reignite_timing_capstone_20260725
prototype_id: candle_sokoban

ordered_prior_levels: []

prior_course_boundary: >-
  当前仓库没有可合法作为 shared_fire_and_reignition 之前课程关的 clean Candle 关卡：
  prototypes/candle_sokoban/levels.yml 仅是诊断探针，已有 studio 待玩关暴露到更晚的
  rolling_contact_chain，均不得伪装成本任务前序。因此 Critic 的完整前序关引用为空。

human_declared_player_prior:
  mastered_branches:
    - basic_candle_manipulation
    - wall_dousing
  includes_derived_skills_and_calculations: true
  rules_known:
    - 玩家能沿蜡烛长轴推动一格，也能从侧面触发整段滚动；一次多格滚动只推进一次共享倒计时。
    - 每次合法行动推进共享倒计时；燃烧边界会让当时仍点燃的全部蜡烛同时从烛芯端缩短。
    - 已燃烛芯被墙遮住会立即熄灭；若在燃烧边界前熄灭，则避开该次缩短。
    - 玩家已能计算走位、轴推、侧滚、火焰危险、长度变化和共享倒计时相位。

target_branch_new_knowledge:
  branch: shared_fire_and_reignition
  rules:
    - 已点亮火盆和外露已燃烛芯可以点燃外露未燃烛芯。
    - 复燃不重置共享倒计时。
    - 在燃烧边界复燃的蜡烛会立即参加该次缩短。
