      点火若只重复同一判断，也不能承担本关核心。

designer_calibration_commitments:
  - >-
    墙灭火、跳过燃烧边界、复燃、边界立即参燃、长度变化、火源位置和后继操作位必须改变
    同一个计划；删去其中关键关系后，不应只少一个事件。
  - >-
    前序构造必须因预见后继 consumer 而压缩选择；后继必须区分不同灭火/复燃相位留下的
    长度、占格、火源或操作面，并把约束传回时机判断。
  - >-
    不以倒计时空耗、长路线、事件数量、对象堆叠、反馈迟缓的 deadend 或割裂 witness
    制造高难；复杂前序机制只有进入同一因果链并被后继复用才保留。
  - >-
    玩家已掌握全部前序规则和计算，因此难度只能来自非显然的联合计划、状态承诺和责任分配，
    不能来自规则遗忘、读图失误或执行精度。

status: complete_for_experience_brief_stage
