current_structure_hypothesis: >-
  采用永久静态复燃源、跨轮辅助交付、实体 footprint 筛和瞬时横止挡的三烛 family。目标烛在
  首轮边界主动推入墙后跳过燃烧，必须在第二轮边界前复燃参燃；它随后与五格横止挡同步缩短。
  第四轮只有单格目标能穿过 row4 三盆，且横止挡仍剩 x6 单格把它截停在 row5；晚一轮复燃时，
  目标变单格的边界上止挡已消失，只会落入 row6 锁死位。终推点盆与两烛燃尽同回合获胜。
player_reasoning_claim: >-
  熟练玩家必须从 `(6,5)` 的单格停位反推横止挡第四轮应剩一格，再反推目标必须在同一轮变单格；
  由此推出首轮墙灭保长、第二轮复燃参燃，并把辅助烛上盆的跨轮搬运塞进同一四轮长度表。
revision_obligations:
  - 用必要对象或操作侧责任替换 Explorer 的开放短/长路线夹具。
  - 让所有胜解都经过墙灭火避烧、烛芯复燃、边界复燃参燃与最终 footprint consumer。
  - 不把源火焰二次后退写成亮点，除非另有实际 consumer；优先不增加独立子题。
  - 完整图不得命中 body_concealment_and_reexposure 及之后机制事件。
  - 删除可以任意往返调相、无责任等待、独立点盆或高潮后清理的空间。
