design_brief: >-
  围绕已冻结的 experience brief，在一个连续工作台中制作唯一完整单关。目标难度固定为 5，
  暴露上限固定为 shared_fire_and_reignition。玩家必须主动用墙灭火控制目标蜡烛缺席某次燃烧，
  再以承担对象、火源、通道或操作侧责任的行动推进相位，选择中途复燃保长或边界复燃立即缩短，
  并由后继点盆计划消费 footprint/操作面差异。可以高密度组合全部前序机制，但不得靠自由等待、
  长路线、事件清单、烛身遮蔽、退焰点火或滚动途中接触链增难。只发布一个完成自查的 exact；
  工作草稿可持续覆盖。若局部材料缺口出现，先写坐标无关的 Designer request 交 Controller 调度。
