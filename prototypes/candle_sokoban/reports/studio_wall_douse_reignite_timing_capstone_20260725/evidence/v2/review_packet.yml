mechanical_claims:
  - claim_id: normal_win_and_replay
    claim: >-
      v2 的 25 步 canonical replay 全部合法，并在完整回合结算后玩家存活且以 all_braziers_lit 正常获胜。
  - claim_id: exposure_gate
    claim: >-
      v2 对 allowed_exposure_through=shared_fire_and_reignition 的 exposure audit 与 exact/sequence digest 匹配，
      reachable graph 为 complete，verdict=pass，forbidden_hits 为空，并保存完整 raw graph。
  - claim_id: all_wins_use_wall_douse_and_reignite_schedule
    claim: >-
      完整 first-win product graph 的全部首次胜利历史都包含同一目标烛的墙灭火、静态复燃、
      复燃后 len3、随后 len2 与 len1，以及单格交付；没有绕过墙灭火或复燃时序的胜解。
  - claim_id: auxiliary_and_transient_stopper_participation
    claim: >-
      全部首次胜利历史都包含辅助 candle#4 的轴推与上盆，以及 candle#3 缩成单格、最终与交付同步燃尽；
      这些对象不是未参与的可见 affordance。
  - claim_id: reignite_boundary_family
    claim: >-
      完整产品图只有首次复燃 t1 与 t3 两类 winning product state；二者都进入同一个第二轮燃烧边界，
      共享唯一里程碑签名、相同对象职责、目标分配与最终 winning runtime state，没有晚一轮复燃胜解。
  - claim_id: identity_counterfactuals
    claim: >-
      删除目标首推后的烛芯墙、静态复燃火源、辅助 candle#4 或瞬时止挡 candle#3 都使完整图无胜；
      删除 row4 footprint 筛或终盆则产生更早/更多胜态，机械上支持这些结构承担基线身份责任。

