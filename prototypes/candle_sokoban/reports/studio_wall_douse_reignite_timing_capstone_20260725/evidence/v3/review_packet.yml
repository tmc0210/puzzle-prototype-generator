forbidden_inputs:
  - Designer 的体验核心、包装、自评、已知审美缺点、难度叙事或逐盆保留决策
  - Designer submission.yml（除本 packet 已机械提取的 solution_uniqueness 字段）
  - Designer 的 brazier_wall_counterfactual_summary.yml；只允许读取本 packet 和逐项 raw artifacts
  - Explorer lexicon、设计材料、archive、Critic 校准、旧 review 或人类交接
  - 任何其它 exact 或旧 Evidence Review

review_contract:
  - 使用 $sokoban-evidence-reviewer 严格输出 evidence-reviewer-template 的结构化硬证据审查。
  - 不替 Designer 补跑 solver、图、反事实或事件 probe；证据不足写 unknown/incomplete。
  - 逐盆 literal 替墙与 settled surrogate 必须严格区分，不得把非法初态伪报为 complete graph。
  - 可读取完整 graph 原始证据，但不评价审美、难度、包装、火盆是否好看或待玩资格。
