solution_uniqueness_review:
  declared_result: equivalent_variants_only
  search_scope: complete
  exact_version_match: true
  known_raw_winning_variants:
    - up up up up left up down up left down up right right right right left left down left left down down right down left
    - up up up up left down up up left down up right right right right left left down left left down down right down left
    - up up up up left up left down up down up right right right right left left down left left down down right down left
  equivalence_evidence_basis:
    - >-
      v3 solution_family.json 与 layout digest a842aa84756a54db1b8cba87555272dafff1ad4fa620f4b3373a0ebe960bff88
      匹配；first-win 单调历史/首次复燃倒数产品图标为 complete，覆盖 8594 个 base states、30132 个
      product states、81021 条 legal edges 与 2 个 winning product states。
    - >-
      requiredHistory 的 10 个机械旗标在所有 winning traces 上均为 true，且 winningMilestoneSignatures
      只有 wall_douse>static_reignite>target_len3>target_len2>target_len1_and_gate_open>singleton_delivery
      一个签名。
    - >-
      两个 winning product states 分别属于 t1、t3 首次复燃；二者 minimumDepth 均为 25，代表回放落到同一
      winning runtime state，并保持相同 candle#1/candle#3/candle#4 职责、目标分配和 row5 终局停位。
    - >-
      shortestWinningFamily 记录 cost=25、rawShortestInputCount=306；packet 列出的三条 raw 变体均能在该
      artifact 的最短代表或 t1/t3 winning representative 中找到。
    - >-
      v3 exposure_audit.json 的完整 raw graph 独立给出 8594 个唯一节点、23086 条合法边和唯一 winning
      runtime state；raw edge 事件计数与审计汇总逐项一致。
  known_non_equivalent_win_refs: []
  status: supported
  limits:
    - >-
      equivalent_variants_only 按玩家逻辑类而非原始输入串判定；纯走位回环、必要走位/独立行动换序在相同
      runtime state 与相同单调历史处合流，不另计逻辑解族。
    - 306 是最短 winning raw input 串数量，不是对含任意回环的无限原始输入串计数。
    - 产品图在首次胜利处终止扩展；本结论只覆盖胜利前的玩家逻辑类。

claims:
  - claim_id: normal_win_and_replay
    claim: >-
      v3 的 25 步 canonical replay 全部合法，并在完整回合结算后玩家存活且以 all_braziers_lit 正常获胜。
    status: supported
    evidence_basis:
      - >-
        exact_manifest、layout、solve_instance 与 canonical_replay 的 candidate/level、v3、layout 和 25 个 inputs
        一致；实算 layout SHA-256 与声明的 a842aa84756a54db1b8cba87555272dafff1ad4fa620f4b3373a0ebe960bff88
        相等。
      - >-
        canonical_replay 记录 completed=true、executedSteps=25、legalThroughStep=25；25 条 step 全为 legal，
        最后一步在 countdown:1->5 和两根单格蜡烛 burn_out 后发出 win_all_braziers_lit。
      - >-
        final state 为 D:0、全部 8 只火盆 lit、isWin=true，符合 runtime 在完整倒计时/燃烧结算、死亡结算后
        才检查 all_braziers_lit 的权威顺序。
    limits: []

  - claim_id: current_exact_complete_graph_and_exposure
    claim: >-
      v3 的 reachable graph complete，为 8594 states / 23086 transitions / 1 winning state；
      allowed_exposure_through=shared_fire_and_reignition 的审计与 exact/sequence digest 匹配，
      verdict=pass、forbidden_hits 为空，并保存完整 raw graph。
    status: supported
    evidence_basis:
      - >-
        layout_analysis 与 exposure_audit 均标记 graph.status=complete，预算 max_states=500000；计数为
        8594/23086/1。
      - >-
        exposure_audit 的 exact_version=v3、layout digest 与当前 exact 相等；sequence digest
        f5f0b771ed6b3c5f2b55955bf47f9b2f8196a6f9db88313063b600ce6123266e 与白名单 exposure sequence
        文件的实算 digest 相等，allowed_exposure_through 为 shared_fire_and_reignition。
      - >-
        raw_graph 实含 8594 个唯一 index 节点和 23086 个唯一 index 边，边端点均在范围内；按 raw edges
        重计事件与 reachable_event_counts 逐项一致，winning=true 节点恰为 1，forbidden_hits 为空且
        verdict=pass。
    limits:
      - 唯一 winning runtime state 本身不用于证明所有胜路的事件历史；该部分由完整产品图另行支持。

  - claim_id: current_exact_solution_family
    claim: >-
      v3 的完整 first-win product graph 为 30132 product states / 81021 edges / 2 winning states；
      全胜解必经目标墙灭、静态复燃、len3/len2/len1、辅助烛上盆、瞬时止挡单格窗口与最终交付，
      只有一个里程碑签名；首次复燃只落在 t1/t3 且都参加同一燃烧边界。
    status: supported
    evidence_basis:
      - >-
        v3 solution_family 的 graph.status=complete，base/product/edge/winning-product 计数分别为
        8594/30132/81021/2。
      - >-
        requiredHistory.requiredMask=1023 且 everyWinningTraceHasAllRequiredFlags=true；10 个旗标逐项记录
        violatingWinningTraceCount=0，覆盖墙灭、静态复燃、目标 len3/len2/len1、辅助轴推/上盆、止挡缩至
        单格、单格后最终点盆与止挡最终燃尽。
      - >-
        winningMilestoneSignatures 仅 1 项；timingVariants 仅 t1 与 t3，各 1 个 winning product state，
        minimumDepth=25。canonical t1 回放还直接记录 ignite_midcycle:t1 与
        boundary_ignite_participates:candle#1 同轮发生。
    limits:
      - t3 代表路径由完整产品图记录；不是用单条 canonical t1 trace 外推。

  - claim_id: brazier_top_anchor_wall_counterfactual
    claim: >-
      原坐标 (7,1)、v3 坐标 (5,1) 的已亮火盆替墙后图仍 complete 且有胜，exposure 仍 pass，
      核心胜利历史不变；但完整 losing interaction 图扩大到 9153 states / 24497 transitions，
      extinguish_by_wall 可达边数增加，因此替换不是行为中性，也不产生胜利旁路或机制泄漏。
    status: supported
    evidence_basis:
      - >-
        b71 literal layout 删除左侧两列全墙后，逐字等于 v3 layout 仅把 (5,1) 的 O 替为 #；其 layout
        文件实算 digest 与 reachable/exposure artifact 的 00ae416a...70d 相等。
      - >-
        reachable_graph 与 exposure raw_graph 逐节点、逐边一致，均 complete，为 9153 states、24497
        legal transitions、1 win；exposure sequence digest 匹配，forbidden_hits 为空且 verdict=pass。
      - >-
        raw events 中 extinguish_by_wall=87，高于 v3 基线 44；product graph complete，10 个 required-history
        旗标仍全胜路必经，仍只有同一 milestone signature、t1/t3 两类和 cost=25 / 306 条最短 raw 串。
    limits:
      - &mapped_counterfactual_limit >-
        逐盆 raw artifact 的标签为 exact_version_basis=v2 或 revision_001_*；本审查仅因其 literal layout
        去掉最左两列全墙后逐字等于当前 v3 的对应单点替换，并以坐标 x-2 读取。结论不外推到其它布局变更。

  - claim_id: brazier_upper_goal_wall_counterfactual
    claim: >-
      原坐标 (14,1)、v3 坐标 (12,1) 的待点火盆替墙后 complete graph 有 2 个 winning states，
      product graph 有 6 个 winning states，辅助烛轴推不再全胜解必经、上盆职责完全消失，
      因而产生对象职责旁路，但 exposure 仍 pass。
    status: supported
    evidence_basis:
      - >-
        b141 literal layout 经两列全墙裁边后，逐字等于 v3 仅把 (12,1) 的 o 替为 #；layout digest 在
        layout/reachable/exposure 三处一致。
      - >-
        reachable/exposure raw graph 逐项一致且 complete，为 10862 states、29286 transitions、2 wins；
        exposure verdict=pass 且 forbidden_hits 为空。
      - >-
        product graph complete，为 36073 product states、97318 edges、6 wins；auxiliary_axis_push 有 2 个
        violating winning product states，upper_brazier_after_auxiliary_push 对全部 6 个 winning product
        states 都不成立，直接支持轴推不再必经与原上盆职责消失。
    limits:
      - *mapped_counterfactual_limit

  - claim_id: brazier_reignite_source_wall_counterfactual
    claim: >-
      原坐标 (4,3)、v3 坐标 (2,3) 的已亮火盆替墙后 complete graph 无胜态，
      且不再有目标静态复燃来源；exposure 审计本身仍 complete/pass。
    status: supported
    evidence_basis:
      - >-
        b43 literal layout 经两列全墙裁边后，逐字等于 v3 仅把 (2,3) 的 O 替为 #；layout digest 在
        layout/reachable/exposure 三处一致。
      - >-
        reachable/exposure raw graph 逐项一致且 complete，为 4836 states、12832 transitions、0 wins；
        shortest_solution.found=false，完整产品图也为 0 winning product states。
      - >-
        raw event_counts 没有 ignite、ignite_from_brazier、ignite_midcycle 或
        boundary_ignite_participates；exposure 仍 complete/pass 且 forbidden_hits 为空。
    limits:
      - *mapped_counterfactual_limit

  - claim_id: brazier_two_neutral_grate_cells
    claim: >-
      原坐标 (5,4)/(6,4)、v3 坐标 (3,4)/(4,4) 两只中部已亮火盆分别替墙后，
      complete graph、raw edges 的 from/to/action/events、胜态、完整产品图、复燃时机类与 exposure
      均和裁边基线逐项一致；二者的火盆属性并非机械必要，墙能等价承担实体筛挡位。
    status: supported
    evidence_basis:
      - >-
        b54/b64 两份 literal layout 各自裁去最左两列全墙后，分别逐字等于 v3 只把 (3,4)/(4,4) 的 O
        替为 #；两份 layout digest 均与各自 reachable/exposure artifact 匹配。
      - >-
        两份 reachable/exposure raw graph 各自逐节点、逐边一致且 complete，均为 8594 states、23086
        transitions、1 win，计数与 v3 基线完全相同。
      - >-
        将原坐标事件中的 x 减 2 后，两份 counterfactual 的全部 23086 条 raw edge 在
        index/from/to/input(action)/events 上均与 v3 raw graph 零差异；node index/depth/winning 也零差异。
      - >-
        两份完整产品图也都为 30132 product states、81021 edges、2 wins，10 个必经旗标、唯一 milestone
        signature、t1/t3、cost=25 与 306 条最短 raw 串均和 v3 基线一致；exposure 均 pass 且零 forbidden hit。
    limits:
      - *mapped_counterfactual_limit
      - 等价结论只针对这两个具体坐标各自的 O-to-# 替换，不推广到第三只右侧格栅火盆。

  - claim_id: brazier_right_grate_wall_counterfactual
    claim: >-
      原坐标 (7,4)、v3 坐标 (5,4) 的右侧已亮火盆替墙后 complete graph 无胜态，
      并出现 roll_intermediate_extinguish 与 wick_reexposed_unlit 各 38 次，exposure verdict=fail；
      该格必须是不会灭芯的实体通道，不能换墙。
    status: supported
    evidence_basis:
      - >-
        b74 literal layout 经两列全墙裁边后，逐字等于 v3 仅把 (5,4) 的 O 替为 #；layout digest 在
        layout/reachable/exposure 三处一致。
      - >-
        reachable/exposure raw graph 逐项一致且 complete，为 9333 states、25046 transitions、0 wins；
        shortest_solution.found=false，完整产品图也为 0 winning product states。
      - >-
        raw event_counts 与 exposure forbidden_hits 均逐项记录 roll_intermediate_extinguish=38、
        wick_reexposed_unlit=38，且命中同一组 38 个 edge indexes；exposure verdict=fail。
      - >-
        runtime 权威顺序说明墙会先熄灭被遮烛芯，侧滚又逐小步结算接触；该 literal wall replacement
        因而把原实体筛挡位改成了会灭芯的通道并使胜利消失。
    limits:
      - *mapped_counterfactual_limit
      - 机械必要性结论限于“不能替成墙”；不声称已穷举所有可能的其它实体材质。

  - claim_id: brazier_final_goal_wall_counterfactual
    claim: >-
