prototype_context:
  confirmed_rules:
    - 全局燃烧周期固定为 5，所有有效行动推进同一个倒计时。
    - 归零时所有仍点燃的蜡烛先同时缩短或燃尽，再统一处理缩短接触。
    - 火盆和其它烛身阻挡烛身侧滚；侧滚逐格处理火盆接触。
  win_condition: 玩家存活且全部火盆点亮
  object_and_event_semantics: 以 CANDLE_SOKOBAN_DESIGN.md 和 CANDLE_SOKOBAN_ASCII.md 为准
  tool_boundary: solver、graph 和事件门只提供机械证据，不提供审美或难度评分

slot_brief:
  intended_role: 当前本地试玩队列中的高难同步燃烧候选
  target: 让四根不同长度门烛与运输烛的同步燃烧形成四级对角线空间锁
  difficulty_expectation: highest_available_unscored

