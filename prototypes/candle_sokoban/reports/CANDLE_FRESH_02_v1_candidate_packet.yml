  solver_result: solved_cost_21_explored_6742
  trace_summary: 21 步规范解包含四个燃烧边界、四根门烛依次燃尽、运输烛四次缩短与四段左滚点火
  target_events:
    - burn_out:candle#single4@5
    - light_brazier:6,9_and_burn_out:candle#2@10
    - light_brazier:5,8_and_burn_out:candle#3@15
    - light_brazier:4,7_and_burn_out:candle#4@20
    - light_brazier:3,6_and_win@21
  object_or_instance_evidence: exact trace 中 candle#single4、candle#2、candle#3、candle#4 按初始长度 1 至 4 依次燃尽，candle#5 完成全部点火
  winning_path_event_checks: 完整覆盖搜索在 26066 个状态后未找到缺少任一门烛燃尽或火盆点火事件的胜路
  replayed_attempt_evidence: input_replay_CANDLE_FRESH_02_ALT_EARLY_SECOND_ROLL.json 在第 9 个输入返回 roll_blocked
  reachable_event_exposure: not_claimed
  graph_or_counterfactual_evidence:
    - graph 完整，reachable_states=26069，winning_states=3
    - no_candle_movement 反事实完整搜索无解
    - all-shortest 深度 21 完整枚举，10324175 条输入序列在扁平化后共享 1 种非行走事件次序
  evidence_limits:
    - all-shortest 等价结论忽略 walk、countdown 和燃烧边界落在哪个输入上的分组差异
    - 不声称任意长度胜解只有一种操作节奏
    - 完整事件门证明事件存在性，不单独证明玩家侧审美价值

