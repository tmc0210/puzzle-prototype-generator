    claimed_latest_exposed_event: burn_out:candle#4
    all_solution_required_evidence_ref: CANDLE_FRESH_02_REQUIRED_EVENTS_AUDIT.json
    canonical_occurrences:
      - step: 20
        operation_segment_ref: OP4
        reasoning_unit_refs: [RU3]
    status: later_phase_present
    revision_direction: none

