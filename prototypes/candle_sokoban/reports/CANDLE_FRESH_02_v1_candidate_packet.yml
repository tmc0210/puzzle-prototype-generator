player_reasoning:
  canonical_trace_ref: level_analysis_CANDLE_FRESH_02_DIAGONAL_BURN_LOCK.json
  player_goal:
    description: 用唯一的运输烛沿对角线依次点亮四个火盆
    state_ref: initial
  reasoning_units:
    - id: RU1
      player_question: 为什么最右门烛和运输烛都必须先经历一次燃烧？
      premises:
        - statement: 长度 1 的最右门烛占据运输烛向左滚动所需的第 5 行和第 6 列
          state_ref: initial
        - statement: 运输烛最下端与第一火盆同处第 9 行，未缩短时火盆会阻挡其烛身进入第 6 列
          state_ref: initial
      conclusion: 先用五个有效行动让最右门烛燃尽、运输烛缩短，再从右侧向左滚
      operation_refs: [OP1, OP2]
      alternative:
        status: not_claimed
        description: 开局尚未到达运输烛施力位，不声明其它自然尝试
        local_gain: none
        from_state_ref: initial
        result_state_ref: not_applicable
        concrete_outcome: not_applicable
      feedback:
        - state_ref: step_5
          visible_change: 最右单格门烛消失，其余门烛和运输烛各缩短一格
        - state_ref: step_10
          visible_change: 运输烛滚到第 6 列并点亮 (6,9)，长度 2 门烛同时燃尽
    - id: RU2
      player_question: 点亮第一火盆后为什么不能立刻完成第二次左滚？
      premises:
        - statement: 第 5 列仍有长度 2 门烛的剩余单格
          state_ref: alternate_step_6
        - statement: 第二火盆 (5,8) 仍占据运输烛最下端将进入的格
          state_ref: alternate_step_6
      conclusion: 必须等下一燃烧边界同时燃尽当前门烛并缩短运输烛
      operation_refs: [OP3]
      alternative:
        status: replayed_attempt
        description: 第一次滚动后立即走到运输烛右侧并再次向左推
        local_gain: 尝试提前进入第二目标列
        from_state_ref: alternate_step_6
        exact_inputs: [left, left, left]
        result_state_ref: alternate_step_9_blocked
        concrete_outcome: 第三个输入返回 roll_blocked，运输烛和倒计时均不改变
      feedback:
        - state_ref: step_15
          visible_change: 长度 3 门烛燃尽，运输烛缩至两格并点亮 (5,8)
    - id: RU3
      player_question: 后两级锁是否仍由同一组可见占位关系控制？
      premises:
        - statement: 剩余门烛仍按长度从右向左排列，下一根最短者占据运输烛下一列
          state_ref: step_15
        - statement: 未点火盆仍沿左上方向各高一行、左一列
          state_ref: step_15
      conclusion: 继续让每个五回合边界燃尽一根门烛并缩短运输烛，再各左滚一列
      operation_refs: [OP4, OP5]
      alternative:
        status: not_claimed
        description: 不声明任意长度胜解只有一种行走节奏
        local_gain: none
        from_state_ref: step_15
        result_state_ref: not_applicable
        concrete_outcome: not_applicable
      feedback:
        - state_ref: step_20
          visible_change: 最后一根门烛燃尽，运输烛缩为单格并点亮 (4,7)
        - state_ref: step_21
          visible_change: 单格运输烛左滚并点亮 (3,6)，全部目标完成
  operation_segments:
    - id: OP1
      step_range: 1-5
      exact_inputs: [down, up, down, up, down]
      purpose: 推进首个燃烧边界，燃尽最右门烛并缩短其它四根火烛
      supports_reasoning_units: [RU1]
    - id: OP2
      step_range: 6-10
      exact_inputs: [down, down, down, left, left]
      purpose: 抵达运输烛右侧，滚至第 6 列点亮第一火盆，并触发第二边界
      supports_reasoning_units: [RU1]
    - id: OP3
      step_range: 11-15
      exact_inputs: [up, down, left, left, left]
      purpose: 调整施力位置，滚至第 5 列点亮第二火盆，并触发第三边界
      supports_reasoning_units: [RU2]
    - id: OP4
      step_range: 16-20
      exact_inputs: [up, up, down, down, left]
      purpose: 推进第四边界，滚至第 4 列并点亮第三火盆
      supports_reasoning_units: [RU3]
    - id: OP5
      step_range: 21-21
      exact_inputs: [left]
      purpose: 在全部门烛消失后滚至第 3 列，点亮最终火盆
      supports_reasoning_units: [RU3]
  resolution:
    resolves: [RU1, RU2, RU3]
    operation_refs: [OP1, OP2, OP3, OP4, OP5]
    final_state_ref: step_21
    visible_confirmation: 四个火盆均为 O，事件含 win_all_braziers_lit
  trace_partition:
    status: complete
    ordered_segment_ids: [OP1, OP2, OP3, OP4, OP5]
    uncovered_steps: []
    overlapping_steps: []

