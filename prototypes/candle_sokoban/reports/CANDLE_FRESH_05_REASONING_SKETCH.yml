candidate_id: CANDLE_FRESH_05_PHASE_SPLIT_WEAVE
working_title: 错拍双焰
status: pre_layout_reasoning
target_difficulty: harder_than_released_fresh_01_through_03
global_burn_cycle: 5

lineage:
  policy: fresh_required
  authorized_archive_variant_work: false
  archive_taste_context: none_found
  note: >
    不复用焚门后回火、长度阶梯锁、母烛连续释放或主烛熄灭反推的核心链。
    新设计从“同一全局燃烧边界中，玩家通过主动控制点燃状态选择哪根蜡烛缩短”
    起步；目标是先制造长度差，再交换燃烧角色，让早期选择在后续空间关系中兑现。

human_feedback_constraint:
  source: current_user_feedback
  statement: 已发布的几个新关缺少难度，后续必须继续加难度
  design_response:
    - 不以解长、空走或大状态数充当难度
    - 至少包含三个相互依赖的 reasoning units
    - 早期选择的错误结果延迟到后续燃烧边界才显现
    - 同一核心对象必须跨阶段改变角色，不能把三个独立小题首尾相接
    - 完整胜路审计必须证明燃烧成员选择和阶段顺序不可绕过

player_goal:
  visible_goal: 点亮三个分处不同高度的未燃火盆；一个稳定火盆只作为重燃源
  intended_understanding: >
    两根等长点燃蜡烛若一直同步燃烧，长度差永远为零，烛芯高度也无法分别对准
    两条目标通道。玩家必须在第一个边界前只熄灭 A，让 B 单独缩短；之后重新点燃 A、
    熄灭 B，在第二个边界让 A 单独缩短。这样不是简单恢复对称，而是利用两根蜡烛
    已经交换过位置和遮挡关系，使同样长度落在不同通道并开放新的操作侧。

player_problem:
  central_question: >
    如何把“当前哪些蜡烛处于点燃状态”当作全局周期的可编程掩码，连续两次选择
    不同燃烧成员，并把两次长度变化转化为新的站位、传火和目标高度？
  why_harder_than_prior_levels: >
    前三关多由可见长度阶梯或单向接力直接提示下一步；本关要求玩家预测下一燃烧
    边界的成员集合。第一次主动熄灭的局部结果只是少烧一根，真正收益要等 B 缩短、
    两根蜡烛交换通道并完成第二次选择后才显现。错误顺序仍可继续若干合法操作，
    但会在后段失去正确高度或操作侧，不能靠逐方向试一两步立即排除。

visible_premises:
  - A 与 B 开局等长且都点燃，共用全局倒计时 5；若不改变点燃状态会同步缩短
  - A 可在第一边界前滚入 B 的烛身投影而熄灭，B 保持外露
  - B 第一次单独缩短后腾出的烛身格开放一条换位通道，并让其火焰移到第一目标高度
  - 稳定火盆位于换位后的 A 烛芯轨迹上，可重新点燃 A，但不会自动点燃 B
  - B 在换位后可被 A 的烛身遮火，从而退出第二次燃烧成员集合
  - 第二边界只缩短 A；A 后退的火焰必须暴露并点燃一根接力烛，而 B 保留第一次形成的长度
  - 最终两根主烛虽然长度可能再次相同，但处于交换后的不同通道，火焰分别对应第二目标与接力通道
  - 接力烛的终局滚动必须依赖第二次边界中新暴露的操作侧，不能在第一阶段提前完成

expected_conclusions:
  - 第一次边界前必须让 A 熄灭、只让 B 燃烧，制造第一个相位差
  - B 缩短后的空格不是单纯开门，而是两根主烛换位和重燃 A 的唯一接口
  - 第二次边界前必须让 B 熄灭、只让 A 燃烧；燃烧成员选择与第一次相反
  - 两次选择的目的不是保持某根蜡烛更长，而是把相同的长度状态写入不同空间通道
  - 最后接力烛的点燃、操作侧开放和最终火盆必须共同依赖第二次选择

intended_mechanic_sequence:
  - 侧滚 A，使其烛芯被 B 的烛身遮住并 extinguish；B 仍点燃
  - 用受限有效动作推进第一个全局边界，只让 B shrink
  - 利用 B 腾出的格交换两根主烛的通道位置
  - 让 A 烛芯经过稳定火盆并 ignite
  - 将 B 滚到 A 烛身遮住其烛芯的位置并 extinguish；A 保持点燃
  - 推进第二个全局边界，只让 A shrink，并由腾格退焰 ignite 接力烛
  - 分别运输 A 与保留长度的 B，点亮两个不同高度火盆
  - 从第二边界才开放的操作侧推动接力烛，点亮最终火盆

reasoning_units:
  - id: RU1
    question: 第一个燃烧边界应该让哪根蜡烛退出燃烧集合？
    expected_answer: 熄灭 A、保留 B，使 B 单独缩短并开放换位格
    delayed_feedback: 边界后 B 变短且通道开放；A 保持原长，第一处长度差形成
  - id: RU2
    question: 换位和重燃后，第二个边界为什么必须反过来只烧 A？
    expected_answer: B 的现有长度负责后段目标高度；A 必须缩短才能以退焰暴露接力烛并打开新操作侧
    delayed_feedback: A 缩短并点燃接力烛，B 保持长度；两根主烛的空间角色完成交换
  - id: RU3
    question: 两根主烛和接力烛的运输顺序怎样避免互相封住操作侧？
    expected_answer: 先用保留长度的 B 完成其高度目标并腾出侧面，再运输 A，最后从第二边界新开放的一侧推动接力烛
    delayed_feedback: 三个目标按空间依赖依次可达；任一提前运输都会封住至少一个后续施力格

tool_questions:
  - 是否能构造紧凑布局，使所有胜路都必须在第一边界前 extinguish A 且保持 B 点燃
  - 是否能证明第二边界前必须 extinguish B、reignite A，并且两次燃烧成员集合相反
  - 是否存在让两根蜡烛同步缩短后仍能靠额外运输完成目标的旁路
  - 是否存在不交换通道、直接从稳定火盆取火或由另一根蜡烛替代接力烛的旁路
  - 错误成员选择能否保留数步局部合法进展，而不是立即撞墙暴露
  - 最终目标事件能否落在 RU3，避免最新机制暴露前置
  - 最短解是否只有等价走位变体，且完整图能证明有序燃烧成员选择

discard_conditions:
  - 两次边界的燃烧成员集合不需要相反
  - 同步缩短两根蜡烛仍可取胜
  - 只靠等待或长距离走位即可修正错误相位
  - 换位只是视觉移动，不改变后续施力格、火焰高度或传火关系
  - 接力烛可以在第二次选择前点燃或完成最终目标
  - 主要难度来自记 5 拍或执行 40 步以上空走，而不是跨阶段因果预测
