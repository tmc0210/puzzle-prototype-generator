candidate_id: CANDLE_FRESH_05_PHASE_SPLIT_WEAVE
working_title: 错拍三折
status: evidence_complete_human_pending
target_difficulty: harder_than_released_fresh_01_through_03
global_burn_cycle: 5

lineage:
  policy: fresh_required
  authorized_archive_variant_work: false
  archive_taste_context: none_found
  note: >
    不复用焚门后回火、长度阶梯锁、母烛连续释放或主烛熄灭反推的核心链。
    新设计从“同一全局燃烧边界中，玩家通过主动控制点燃状态选择哪根蜡烛缩短”
    起步；目标是用垂直烛 B 的侧滚同时取得局部目标并遮熄横烛 A，让首个边界
    只有 B 缩短，第二边界再让已经错开长度的 A/B 同步缩短。第三边界中，
    A 必须在一次侧滚里依次点目标、
    点燃接力烛 C、再被 C 的烛身遮熄，使新点燃 C 独自参加同回合缩短。

human_feedback_constraint:
  source: current_user_feedback
  statement: 已发布的几个新关缺少难度，后续必须继续加难度
  design_response:
    - 不以解长、空走或大状态数充当难度
    - 至少包含三个相互依赖的 reasoning units
    - 早期选择的错误结果延迟到后续燃烧边界才显现
    - 同一核心对象必须跨阶段改变角色，不能把三个独立小题首尾相接
    - 完整胜路审计必须证明燃烧成员选择和阶段顺序不可绕过

player_goal:
  visible_goal: 点亮三个分处不同高度的未燃火盆
  intended_understanding: >
    B 开局向左侧滚时，火焰先点亮上方目标，烛身随后盖住 A 的火焰。第一个边界
    只让 B 缩短，B 后退的火焰在刚腾出的格内重新点燃 A。玩家不能停在这里：
    必须先等上层时序锁缩成单格，再把它沿窄廊至少推三格；它在第二边界燃尽后，
    玩家才能穿过上廊抵达 A 上方。该边界同时让 A/B 同步缩短并保持首边界制造的
    长度差。A 缩短后的火焰列才会在下一次下滚中依次穿过第二目标、C 的烛芯和 C 的烛身。

player_problem:
  central_question: >
    如何把“当前哪些蜡烛处于点燃状态”当作全局周期的可编程掩码，让首边界只烧 B、
    次边界同步保留长度差、第三边界烧尽 B 并只缩短新点燃 C，同时控制 A 的火焰列
    与 C 的最终火焰行？
  why_harder_than_prior_levels: >
    前三关多由可见长度阶梯或单向接力直接提示下一步；本关要求玩家预测下一燃烧
    边界的成员集合。第一次遮熄 A 的局部结果只是少烧一根，真正收益要等 B 缩短
    后退焰重燃 A；第二边界保持的长度差又要到 A 下滚时才兑现。
    错误拍点仍可继续若干合法操作，但会在后段错过 C 的点燃/缩短窗口，
    不能靠逐方向试一两步立即排除。

visible_premises:
  - A 开局长 4、B 开局长 3，且都点燃，共用全局倒计时 5
  - B 向左侧滚时火焰经过第一目标；终点处 B 的上端烛身覆盖 A 的火焰，A 熄灭而 B 保持外露
  - B 第一次单独缩短会移除覆盖 A 烛芯的上端烛身；B 的退焰与重新外露的 A 烛芯同格，A 在边界后点燃
  - 上层 candle#4 开局长 2 且点燃；玩家到达窄廊入口时它恰在首边界缩成单格，首边界前不能提前推动
  - 首边界后 A 长 4、B 长 2 且都点燃；玩家必须把 candle#4 沿上廊至少推三格，第二边界时 A/B 同步缩成 3 与 1，candle#4 同时燃尽开放通路
  - 上廊末端只有 A 中段上方一格可作为下滚施力位，迫使火焰列对准第二目标与 C 烛芯
  - A 下滚发生在第三边界动作：先点第二目标，再点燃 C，随后 A 火焰进入 C 烛身而熄灭
  - C 在归零前刚被点燃且仍燃烧，因此参加同一次结算并缩短；A 已熄灭，B 在该边界燃尽
  - 绕到 C 左侧时还会跨过下一边界，使 C 再缩短一次；最终侧滚必须发生在 C 燃尽前

expected_conclusions:
  - 第一次边界前必须由 B 的滚动遮熄 A，只让 B 燃烧并用退焰重燃 A
  - candle#4 只能在首边界缩成单格后推动，并且必须至少推动三格；第二边界燃尽后才能穿过上廊
  - 首边界制造的长度差必须在第二边界同步缩短后保留，直到 A 下滚
  - A 只能从被墙限定的中段向下滚，固定火焰列并同时对准第二目标与 C
  - 第三边界动作必须按“点目标 -> 点 C -> A 被遮熄 -> C 缩短”的顺序完成
  - C 第二次缩短后的单格高度是最终滚动窗口；多走一个边界即燃尽

intended_mechanic_sequence:
  - 向左侧滚 B：先点亮第一目标，再用 B 的上端烛身遮住 A 火焰并 extinguish A
  - 沿右侧竖廊推进第一个边界：B 单独 shrink，退焰在腾格内 shrink_ignite A；candle#4 同时缩成单格
  - 将 candle#4 沿上层窄廊至少向左推三格；第二边界让 A/B 同步 shrink、candle#4 burn_out，保持长度差并开放通路
  - 从唯一开放的 A 中段上方进入下滚施力位
  - 绕到 A 上侧，在第三边界动作向下侧滚 A
  - A 滚动途中依次 light 第二目标、ignite C、再被 C 烛身 extinguish
  - 同回合归零只让 C shrink；绕到 C 左侧时下一边界再让 C shrink 到单格
  - 在 C 燃尽前向右侧滚，点亮第三目标

reasoning_units:
  - id: RU1
    question: 为什么 B 的开局右滚既要点目标，又必须停在遮住 A 火焰的位置？
    expected_answer: 让 A 退出首边界燃烧集合，只烧 B，并用 B 的退焰重新点燃未缩短的 A
    delayed_feedback: 首边界后 B 变短、A 保持原长且重新点燃，形成第一处相位差
  - id: RU2
    question: A 重燃后，为什么必须先把上层时序锁推过窄廊，并等它在第二边界燃尽后再从指定烛身格向下滚？
    expected_answer: 首边界前时序锁仍长 2，无法提前通过；首边界后它缩成单格可推，第二边界又同时把 A/B 缩成 3 与 1并烧尽锁烛，才开放通路
    delayed_feedback: 第二边界后锁烛消失、B 只剩单格；A 的固定火焰列在下滚中依次点目标、点 C、再被 C 遮熄
  - id: RU3
    question: 为什么 A 下滚必须落在归零动作，之后 C 又必须赶在下一次燃尽前滚动？
    expected_answer: 归零前先点燃 C、再遮熄 A，结算时只有 C 缩短；绕行再缩短一次后火焰恰到最终目标行
    delayed_feedback: C 变为单格并获得唯一目标高度；再拖过一个边界即完全燃尽

tool_questions:
  - 是否能构造紧凑布局，使所有胜路都必须先由 B 遮熄 A，再以 shrink_ignite 重燃 A
  - 是否能证明第二边界必须同步得到 A len3 / B len1，且 A 只能从指定中段下滚
  - 是否能证明 candle#4 在首边界前不可推动、所有胜路都至少推动三格，并在第二边界燃尽后才开放通路
  - 是否存在首边界同时缩短 A/B，或绕开上廊拍点后仍能完成 C 接力的旁路
  - 是否存在由 A 或 B 替代 C 点亮最终目标，或 C 在第三边界前提前点燃的旁路
  - 错误成员选择能否保留数步局部合法进展，而不是立即撞墙暴露
  - 最终目标事件能否落在 RU3，避免最新机制暴露前置
  - 最短解是否只有等价走位变体，且完整图能证明有序燃烧成员选择

discard_conditions:
  - 首边界不需要只缩短 B，或无需 shrink_ignite A
  - 第二边界不需要保留 A len3 / B len1 的错拍长度
  - A 可以从其它烛身格下滚而仍对准第二目标与 C
  - 只靠等待或长距离走位即可修正错误相位
  - C 可以在 A 下滚前点燃，或无需同回合临界缩短即可完成最终目标
  - 主要难度来自记 5 拍或执行 40 步以上空走，而不是跨阶段因果预测
