candidate_id: CANDLE_FRESH_04_SMOTHERED_REVERSE_RELAY
candidate_version: v2
title: 灭焰逆渡

prototype_context:
  confirmed_rules:
    - 全局燃烧周期固定为 5；每次有效行动推进一次，无效输入不推进
    - 倒计时从 1 结算时，所有仍点燃蜡烛同步缩短或燃尽
    - 烛身遮挡火焰时蜡烛立即熄灭；侧滚逐格处理点火、遮挡与火盆接触
    - 已熄灭蜡烛可以从原烛芯端反向轴推，烛芯接触火焰时可以重新点燃
    - 玩家存活且全部火盆点亮时胜利
  win_condition: all_braziers_lit
  object_and_event_semantics: 以 CANDLE_SOKOBAN_DESIGN.md 和 CANDLE_SOKOBAN_ASCII.md 为准
  tool_boundary: >
    solver、完整状态图、事件门、结构门和反事实只支持机械事实；不据此宣称
    人类感知难度、审美分数、自然度或 campaign 位置。

slot_brief:
  intended_role: challenge_or_capstone_candidate
  target: >
    把主动熄灭变成获得反向端推权限的必要中间态，再要求精确改列、稳定火源重燃、
    反向运输和接力烛高度窗口，形成三个连续且彼此依赖的推理阶段。
  difficulty_expectation: highest_available_unscored_missing_human_archive_context

mechanic_exposure_context:
  mechanic_window:
    - stage: forced_smother_and_release
      new_events:
        - light_brazier:12,5
        - extinguish:candle#1:concealed
        - burn_out:candle#single1
    - stage: reverse_alignment_and_reignite
      new_events:
        - push_axis:candle#1
        - ignite:candle#1
    - stage: reverse_relay_transfer
      new_events:
        - ignite:candle#2
        - light_brazier:13,2
    - stage: delayed_relay_height_and_completion
      new_events:
        - shrink:candle#2:len3
        - shrink:candle#2:len2
        - light_brazier:14,4
  allowed_exposure_through: delayed_relay_height_and_completion
  claimed_core_events:
    - extinguish:candle#1:concealed
    - burn_out:candle#single1
    - burn_out:candle#single4
    - ignite:candle#1
    - ignite:candle#2
    - shrink:candle#2:len3
    - shrink:candle#2:len2
    - light_brazier:12,5
    - light_brazier:13,2
    - light_brazier:14,4
  latest_exposure_timing_check:
    derived_latest_event_stage: delayed_relay_height_and_completion
    claimed_latest_exposed_event: light_brazier:14,4
    all_solution_required_evidence_ref: CANDLE_FRESH_04_REQUIRED_EVENTS_AUDIT.json
    canonical_occurrences:
      - step: 57
        operation_segment_ref: OP7
        reasoning_unit_refs: [RU3]
    status: later_phase_present
    revision_direction: none

design_target:
  aesthetic_score_target: unscored_missing_human_archive_context
  difficulty_score_target: target_3_plus_unscored
  target_role_notes: >
    作为当前规则集最高难度方向候选送人工试玩；没有 clean human-reviewed archive，
    因而不声明量化难度、审美达标或正式 campaign 位置。

solve_instance:
  layout: |-
    ##################
    #..##########....#
    #............o...#
    #...........Du...#
    #............2o..#
    #...........o2...#
    #..11111111R.2...#
    #........R.@#.####
    #..........O..####
    #..###############
    ##################
  player_start: "11,7"
  player_goal: not_applicable
  win_condition: all_braziers_lit

mechanism_scope:
  central:
    - 主烛第一次上滚必须先点亮火盆 12,5，再被 candle#single1 烛身遮火而熄灭
    - candle#single1 与致死火焰闩 candle#single4 必须在首个燃烧边界燃尽
    - 已熄灭主烛必须从原烛芯侧向左轴推一格，留下 x=2..10、y=2 的精确对齐
    - 主烛必须从该对齐位置下滚到 y=8，使烛芯经过稳定火盆 11,8 而重新点燃
    - 主烛回到上层后向右轴推，点亮火盆 13,2 并点燃同格烛芯的 candle#2
    - candle#2 必须连续缩短到 len3 与 len2，使朝上火焰下降到火盆 14,4 所在行后右滚完成
  allowed_support:
    - 有效走位推进固定五拍全局倒计时
    - 侧滚持续到实体阻挡
    - 火盆永久点亮
    - 点燃的主烛在运输过程中同步缩短
  incidental_allowed:
    - 不改变非 walk/countdown 事件序列的等价走位变体
  required_winning_path_events:
    - extinguish:candle#1:concealed
    - burn_out:candle#single1
    - burn_out:candle#single4
    - ignite:candle#1
    - ignite:candle#2
    - shrink:candle#2:len3
    - shrink:candle#2:len2
    - light_brazier:12,5
    - light_brazier:13,2
    - light_brazier:14,4
  forbidden_winning_path_events: []
  forbidden_if_seen_anywhere: []

player_reasoning:
  canonical_trace_ref: input_replay_CANDLE_FRESH_04_SMOTHERED_REVERSE_RELAY.json
  player_goal:
    description: >
      点亮三个未燃火盆；利用开局稳定火盆重新点燃主烛，再把火传给竖直接力烛。
    state_ref: initial_state
  reasoning_units:
    - id: RU1
      player_question: >
        开局三面受限时，为什么必须把点燃的主烛向上滚，并接受它在途中熄灭？
      premises:
        - statement: 玩家右侧是墙、下方是稳定火盆实体，左侧一步会进入 candle#single4 的火焰并死亡
          state_ref: initial_state
        - statement: 主烛朝右点燃，玩家不能从其燃烧端向左轴推；上方滚动路径先经过火盆 12,5，再经过 candle#single1 烛身
          state_ref: initial_state
      conclusion: >
        只有向上侧滚能形成存活进程；滚动先取得第一个目标，再让烛身遮住火焰，
        把主烛转成可从原烛芯侧反推的未燃状态。随后用有效走位推进首个边界，
        等遮火锁烛与致死火焰闩燃尽，才进入主烛右侧。
      operation_refs: [OP1]
      alternative:
        status: replayed_attempt
        description: 开局向左，试图直接接近主烛原烛芯侧
        local_gain: 立即进入主烛右端附近的一格
        from_state_ref: initial_state
        exact_inputs: [left]
        result_state_ref: input_replay_CANDLE_FRESH_04_ALT_START_LEFT.json#final
        concrete_outcome: >
          第 1 步虽然是合法 walk，却同时出现 player_died:candle#single4；玩家死亡，
          所有火盆仍未新增点亮，不能继续取得主烛右端站位。
      feedback:
        - state_ref: canonical_after_step_1
          visible_change: 火盆 12,5 已亮，主烛停在 y=2 且变为未点燃
        - state_ref: canonical_after_step_5
          visible_change: candle#single1 与 candle#single4 同时燃尽，主烛右侧和下层入口开放
    - id: RU2
      player_question: >
        已熄灭主烛应向左反推几格，之后怎样重新点燃并把它送回上层？
      premises:
        - statement: 上墙只有 x=1..2 的缺口；主烛原本占 x=3..11、y=2，未改列时无法从上侧向下滚
          state_ref: canonical_after_step_5
        - statement: 稳定火盆位于 11,8；主烛向左一格后烛芯落在 x=10，向下滚时火焰接触范围会经过该火盆
          state_ref: canonical_after_step_9
        - statement: 若再左推一格，主烛会占 x=1..9、y=2，把玩家进入上方滚位所需的左入口封死
          state_ref: input_replay_CANDLE_FRESH_04_ALT_OVER_SHIFT.json#after_step_10
      conclusion: >
        主烛必须只左推一格到 x=2..10。玩家从左侧缺口绕到其上方并向下滚，
        主烛到 y=8 时从稳定火盆重新取火；再经下层缺口绕回并向上滚，才能在
        上层从左向右轴推，把火送到第二目标与接力烛。
      operation_refs: [OP2, OP3, OP4, OP5]
      alternative:
        status: replayed_attempt
        description: 在正确左推一格后再额外左推一格，再尝试进入上方滚位
        local_gain: 让主烛烛芯进一步靠近稳定火盆所在列
        from_state_ref: initial_state
        exact_inputs: [up, up, up, up, down, up, right, up, left, left, down, left, left, left, left, left, left, left, left, left, up, up, right, down]
        result_state_ref: input_replay_CANDLE_FRESH_04_ALT_OVER_SHIFT.json#final
        concrete_outcome: >
          第二次 left 把主烛推至 x=1..9、y=2；玩家绕到 x=1,3 后，第 21 步 up
          因主烛封住缺口而 roll_blocked，回放只合法到第 20 步，无法执行下滚重燃。
      feedback:
        - state_ref: canonical_after_step_9
          visible_change: 主烛只向左移动一格，左端 x=2 与上墙缺口精确对齐
        - state_ref: canonical_after_step_24
          visible_change: 主烛已滚到 y=8，并在滚动中出现 ignite:candle#1
        - state_ref: canonical_after_step_34
          visible_change: 主烛重新滚回 y=2，稳定火盆实体不再阻挡后续轴推
        - state_ref: canonical_after_step_48
          visible_change: 火盆 13,2 点亮，candle#2 同时点燃
    - id: RU3
      player_question: >
        candle#2 刚点燃时火焰在第 2 行，什么时候右滚才能碰到第 4 行的最终火盆？
      premises:
        - statement: candle#2 朝上且初始总长四格，点燃时占 x=13、y=3..6，火焰位于 y=2
          state_ref: canonical_after_step_48
        - statement: 每次燃烧缩短都从上端移除一格，使朝上火焰向下移动一行
          state_ref: confirmed_rule_shrink
        - statement: 最终火盆位于 14,4；右滚从左侧施力，第一小步会让火焰经过该格
          state_ref: canonical_after_step_55
      conclusion: >
        利用从第二目标向接力烛左侧绕行的有效动作跨过两个燃烧边界，使 candle#2
        依次缩短到 len3 和 len2；火焰到 y=4 后立即从左侧右滚，第一小步点亮最终火盆。
      operation_refs: [OP6, OP7]
      alternative:
        status: replayed_attempt
        description: 在正确窗口前后继续绕行，等 candle#2 再缩短一次才右滚
        local_gain: 仍能到达接力烛左侧并完成一次合法右滚
        from_state_ref: initial_state
        exact_inputs: [up, up, up, up, down, up, right, up, left, down, left, left, left, left, left, left, left, left, left, left, up, up, right, down, down, down, down, down, down, left, down, down, right, up, up, up, up, up, up, left, up, right, right, right, right, right, right, right, down, down, down, down, right, right, right, right, left, down, up, right, right]
        result_state_ref: input_replay_CANDLE_FRESH_04_ALT_LATE_RELAY.json#final
        concrete_outcome: >
          第 60 步 candle#2 缩短到 len1，火焰降到 y=5；第 61 步右滚合法并到达右侧，
          但没有 light_brazier:14,4，最终火盆仍暗且状态未胜利。
      feedback:
        - state_ref: canonical_after_step_50
          visible_change: candle#2 缩短到 len3，火焰从 y=2 降到 y=3
        - state_ref: canonical_after_step_55
          visible_change: candle#2 缩短到 len2，火焰降到最终火盆所在 y=4
        - state_ref: canonical_after_step_57
          visible_change: 右滚第一小步点亮火盆 14,4，随后出现 win_all_braziers_lit
  operation_segments:
    - id: OP1
      step_range: 1-5
      exact_inputs: [up, up, up, up, down]
      purpose: 强制上滚主烛，点亮第一目标、接受遮火熄灭，并推进首边界烧掉两根单格烛
      supports_reasoning_units: [RU1]
    - id: OP2
      step_range: 6-9
      exact_inputs: [up, right, up, left]
      purpose: 进入主烛原烛芯侧，只向左轴推一格完成精确对齐
      supports_reasoning_units: [RU2]
    - id: OP3
      step_range: 10-24
      exact_inputs: [down, left, left, left, left, left, left, left, left, left, left, up, up, right, down]
      purpose: 绕过左上缺口站到主烛上侧，向下滚到 y=8 并从稳定火盆重新点燃
      supports_reasoning_units: [RU2]
    - id: OP4
      step_range: 25-34
      exact_inputs: [down, down, down, down, down, left, down, down, right, up]
      purpose: 经左下缺口回到主烛下侧，再把点燃主烛滚回上层
      supports_reasoning_units: [RU2]
    - id: OP5
      step_range: 35-48
      exact_inputs: [up, up, up, up, up, left, up, right, right, right, right, right, right, right]
      purpose: 到达主烛左侧并连续右推，点亮第二目标且点燃 candle#2
      supports_reasoning_units: [RU2]
    - id: OP6
      step_range: 49-56
      exact_inputs: [down, down, down, down, right, right, right, right]
      purpose: 绕到 candle#2 左侧，同时推进两个边界使其缩短到 len2
      supports_reasoning_units: [RU3]
    - id: OP7
      step_range: 57
      exact_inputs: [right]
      purpose: 在火焰位于 y=4 的唯一高度窗口右滚，点亮最终火盆
      supports_reasoning_units: [RU3]
  resolution:
    resolves: [RU1, RU2, RU3]
    operation_refs: [OP1, OP2, OP3, OP4, OP5, OP6, OP7]
    final_state_ref: canonical_after_step_57
    visible_confirmation: 三个未燃火盆全部点亮，玩家存活，事件包含 win_all_braziers_lit
  trace_partition:
    status: complete
    ordered_segment_ids: [OP1, OP2, OP3, OP4, OP5, OP6, OP7]
    uncovered_steps: []
    overlapping_steps: []

