prototype_specific_routing:
  - 这是针对 candle_sokoban 的特定原型体验简报，不是泛化逻辑、流程或 Controller 状态修改。
  - 当前 Candle 没有阶段内 clean human-reviewed archive；不得把其它原型的难度、规则或课程位置移植为本关证据。
  - 禁止读取或引用旧 Candle report 的候选、Critic、review、ledger、levels 或 handoff artifact。
  - 允许暴露仅到 shared_fire_and_reignition；body_concealment_and_reexposure 及之后分支全部排除。
  - 后续候选设计必须在同一条对象责任链中验证两个 timing windows，不能新建第二个体验候选来分摊核心。

human_review_constraints:
  - target_difficulty: 4
  - minimum_acceptable_difficulty: 4
  - allowed_exposure_through: shared_fire_and_reignition
  - unique_candidate_required: true
  - no_numeric_candle_stage_archive_available: true
  - difficulty_judgment_rule: >-
      难度目标来自本次 human brief；Reality Anchor 记录只能校准紧凑因果链、对象复用、反直觉洞见和
      反路线税标准，不能提供 Candle 的数值难度替代品。
  - aesthetic_boundary: >-
      只接受玩家可读的紧凑因果链：每次复燃/保留都要改变责任、空间或下一操作，并在后续得到回收；
      事件覆盖、装饰性火盆、退场对象、无亮回程和拼接式前后段均不是合格体验。
  - final_delivery_status: pending_playtest
