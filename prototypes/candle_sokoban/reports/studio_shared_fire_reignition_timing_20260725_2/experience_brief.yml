design_task_id: candle_shared_fire_reignition_timing_20260725_2

prototype_context:
  confirmed_rules:
    - Candle 的移动、推动与侧向滚动均由四方向输入完成；玩家可以直接操控蜡烛的占位与朝向。
    - 蜡烛与墙发生规定的推入接触时可以被墙灭火；灭火是玩家主动安排的对象状态转换，不是自动事件。
    - 蜡烛接触已点燃火盆或符合规则的共享火源时可以复燃；复燃保留在当前允许机制分支内。
    - 全局倒计时以固定周期推进；蜡烛在不同周期位置复燃，会在边界或中段产生不同的参与关系。
    - 当前允许的 shared_fire_and_reignition 事件包括从火盆/蜡芯复燃、周期中复燃、边界复燃参与和同时燃烧。
    - 仍燃蜡烛会按当前周期收缩；一次边界消费中哪些蜡烛参与，会直接改变对象长度与后续可操作空间。
    - 胜利条件是所有目标火盆点燃；本任务不得借用 shared_fire_and_reignition 之后的机制事件来完成胜利。
    - 无初始静默接触假设；点火、灭火、收缩和胜利必须由逐步玩家动作与真实 runtime 状态一致产生。
  win_condition: all_braziers_lit
  object_and_event_semantics:
    - "1D：两格纵向蜡烛，作为墙灭火后仍可被侧向滚动复燃的主要时机对象。"
    - "2R：另一根横向仍燃蜡烛，承担并展示共享边界消费中的并行责任。"
    - "O：已点燃火盆，作为短侧滚复燃的可读落点；火盆必须服务于时机因果而非装饰。"
    - "wall_dousing：玩家先把 1D 推入墙侧使其熄灭，获得一个有状态差异的可复燃对象。"
    - "ignite_midcycle：中段复燃让 1D 在下一次边界到来前重新进入燃烧责任。"
    - "boundary_ignite_participates：边界复燃让 1D 与 2R 同时参与本次消费，改变两者长度和责任。"
    - "simultaneous_burn：并行收缩必须可见地改变后续对象关系，不能只作为事件日志覆盖。"
  allowed_mechanisms:
    - basic_candle_manipulation
    - wall_dousing
    - shared_fire_and_reignition
  tool_boundary:
    - 原型 runtime adapter、ASCII parser/renderer 与 layout analyzer
    - try_inputs、逐步 replay、complete reachable graph 与 solver
    - exposure_audit 及逐步事件/状态一致性诊断
    - 只使用当前 task-local exploration、原型机制文档和本 assignment 指定的 clean archive 校准
    - 本阶段只提交体验简报与归档校准，不设计 exact、不写候选或流程控制 artifact

player_context:
  basic_sokoban_experience_assumed: true
  player_prior:
    - 玩家已掌握 shared_fire_and_reignition 之前的全部 Candle 机制。
    - 玩家已掌握 wall_dousing、shared fire、复燃以及由此衍生的规则和计算。
    - 玩家不需要通过本关学习输入、基础蜡烛移动或倒计时的字面规则。
  prerequisite_mechanisms:
    - basic_candle_manipulation
    - wall_dousing
    - shared_fire_and_reignition
  known_prior_level_refs: []

experience_seed:
  human_seed: >-
    玩家需要通过分析主动使用墙灭火和重燃机制来控制蜡烛的参与倒数时机；本轮必须至少有两个
    有后果的主动 timing windows，选择要改变仍燃对象责任、可达区域或下一步操作，而不能靠无亮
    回程、重复往返或固定节拍制造难度。

