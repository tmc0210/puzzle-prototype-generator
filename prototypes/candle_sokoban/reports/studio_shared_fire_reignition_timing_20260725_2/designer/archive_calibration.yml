task_local_calibration_inputs:
  human_brief_ref: prototypes/candle_sokoban/reports/studio_shared_fire_reignition_timing_20260725_2/human_brief.yml
  prior_course_ref: prototypes/candle_sokoban/reports/studio_shared_fire_reignition_timing_20260725_2/prior_course.yml
  lexicon_ref: prototypes/candle_sokoban/reports/studio_shared_fire_reignition_timing_20260725_2/exploration/lexicon.md
  lexicon_index_ref: prototypes/candle_sokoban/reports/studio_shared_fire_reignition_timing_20260725_2/exploration/lexicon_index.md
  material_report_ref: prototypes/candle_sokoban/reports/studio_shared_fire_reignition_timing_20260725_2/exploration/runs/shared_fire_reignition_timing_explorer_20260725/report.md
  local_material_conclusions:
    - >-
      boundary t=1 复燃可以让 1D 在同一边界与 2R 同时收缩；保留熄灭则由 2R 单独承担，1D 保持两格熄灭。
    - >-
      midcycle t=2 复燃会使下一次边界前的轴向操作合法；同位置保留熄灭会维持 axis_push_blocked，形成下一步选择差异。
    - >-
      两个窗口应被组合为同一局部结构的前后约束：第一个窗口决定第二个窗口可用的对象长度、槽位和火源关系。
    - >-
      local exploration 已明确排除 body_concealment_and_reexposure、retreating_flame_transfer、
      rolling_contact_chain、长侧滚与等待；正式候选仍需再次完成 exposure audit。

calibration_findings:
  preserve:
    - 紧凑布局中的强因果链，而不是宽地图中的搬运量。
    - 反直觉但可读的主动操作：先灭火，再选择合适窗口复燃。
    - 同一批对象的职责复用；1D 与 2R 的长度、燃烧资格和空间资格持续影响目标。
    - 每个关键操作都有可见 payoff，尤其是同时收缩、对象责任交换和下一操作合法性。
  reject:
    - 只有事件日志或火盆亮灭变化、但不改变玩家选择的机制覆盖。
    - 开局后蜡烛退场、前后两段互不读取状态的拼接式包装。
    - 无亮回程、重复往返、固定节拍、等待计时和宽通道旁路。
    - 通过增加对象数量、分支数量或长路线冒充难度 4。
  candle_application: >-
    本校准只给出作品身份与审美边界，不替代 Candle 的难度证据。候选必须在 shared_fire_and_reignition
    门内把 boundary t=1 与 midcycle t=2 变成两个不同且相互约束的主动选择，并让后续目标读取选择结果。

handoff_constraints:
  allowed_exposure_through: shared_fire_and_reignition
  forbidden_exposure:
    - body_concealment_and_reexposure
    - retreating_flame_transfer
    - rolling_contact_chain
  target_difficulty: 4
  minimum_acceptable_difficulty: 4
  difficulty_evidence_policy: >-
    Candle 当前无阶段内 clean archive；不得从 Reality Anchor 的人评难度字段推导 Candle 难度。难度只能在后续
    exact 的真实 replay、完整图、解族与玩家侧审查中判断；本文件仅确立至少两个后果 timing windows 的设计门槛。
  no_exact_layout_in_this_artifact: true
  no_candidate_created_in_this_artifact: true
