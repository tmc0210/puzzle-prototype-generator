boundary:
  current_prototype_clean_archive:
    status: absent
    checked_path: prototypes/candle_sokoban/design_archive
    consequence: >-
      Candle 没有可作为 shared_fire_and_reignition 阶段数值难度校准的 clean human-reviewed archive；
      不使用 Candle 的 knowledge.yml、curriculum.yml、levels.yml、mechanism_lab/cases.yml 或旧 report。
  cross_stage_source:
    prototype_id: reality_anchor
    clean_archive_index_ref: prototypes/reality_anchor/design_archive/index.yml
    eligibility: clean_archive_and_human_reviewed
    use_only_for: >-
      跨阶段审美边界校准：紧凑因果链、强耦合、对象复用、反直觉洞见、后果可读和对路线税的排斥。
    do_not_transfer:
      - Reality Anchor 的机制规则
      - Reality Anchor 的数值难度
      - Reality Anchor 的课程位置或玩家先验
      - Reality Anchor 的布局坐标或对象语义

reading_audit:
  full_clean_archive_index_read: true
  full_index_ref: prototypes/reality_anchor/design_archive/index.yml
  all_aesthetic_score_1_records:
    - record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0024.md
      review_status: human_reviewed
      calibration_takeaway: >-
        机制信号很强却只有普通推拉路由；事件/机制标签没有转化为玩家洞见，且存在路线税。对 Candle 的约束是：
        不能以 shared fire 事件覆盖替代玩家时机因果。
    - record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0027.md
      review_status: human_reviewed
      calibration_takeaway: >-
        可见锚点和 sticky 物件并未承担必要职责，形成 affordance pollution；对 Candle 的约束是每个火盆、
        墙和蜡烛都要回收为责任/可达性后果，不能只是展示入口。
    - record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0030.md
      review_status: human_reviewed
      calibration_takeaway: >-
        大图、多对象和开局后对象退场掩盖了局部因果，分支带来死路但没有匹配 payoff；对 Candle 的约束是
        缩小空间、复用 1D/2R，并让早期状态持续影响后续目标。
    - record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0031.md
      review_status: human_reviewed
      calibration_takeaway: >-
        10 步以上单线开场像动画，只有明显的重复拉动顺序；对 Candle 的约束是两个时机窗口必须由玩家
        主动选择并改变下一步，不得用固定节拍或无亮回程伪造负荷。
    - record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0032.md
      review_status: human_reviewed
      calibration_takeaway: >-
        开场锚点交接与后续 sticky 目标脱节，早期对象退场，整体像拼接的子谜题；对 Candle 的约束是墙灭火、
        两次复燃和最终目标必须属于同一条对象责任链。
  related_positive_records:
    - record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0022.md
      review_status: human_reviewed
      calibration_takeaway: >-
        紧凑、短、空间利用高；把箱子送进表面死角再通过锚点/链式关系完成目标，反直觉但因果可读。转译为
        Candle 的标准是：玩家要主动让 1D 熄灭，再在看似不合时宜的窗口复燃，并承担可验证的后果。
    - record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0025.md
      review_status: human_reviewed
      calibration_takeaway: >-
        小空间主动构造 L 形活塞结构，前置设置不压倒，后续目标会读取这个结构。转译为 Candle 的标准是：
        早期 wall dousing 必须构造中段复燃的资格，不能作为独立序幕。
    - record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0026.md
      review_status: human_reviewed
      calibration_takeaway: >-
        小空间集中于刚性对象与目标腾挪，单一对象避免虚假 affordance。转译为 Candle 的标准是：对象少而职责
        明确，1D 长度和 2R 的责任变化应直接决定后续操作。
    - record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0028.md
      review_status: human_reviewed
      calibration_takeaway: >-
        短、紧凑，以刚性扫掠/接力复用空间；同时提示同类焦点已经存在 archive 饱和。转译为 Candle 的标准是：
        只保留两种真正不同的 timing window，不堆叠同构复燃见证。
    - record_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0029.md
      review_status: human_reviewed
      calibration_takeaway: >-
        两种不同的活塞结构复用同一批元素并保持高空间利用，形成新颖性。转译为 Candle 的标准是：
        t=1 与 t=2 的选择必须重排同一批蜡烛、火盆和槽位的责任，而不是两个互不相干的房间。
  related_boundary_retrieval_summaries:
    - record_ref: prototypes/reality_anchor/design_archive/index.yml#RA_CAND_0017
      retrieval_basis: clean_archive_index_summary
      calibration_takeaway: >-
        高密度操作与过多交互更接近上界，不作为 Candle 的数值目标；提醒候选保持两窗口和少对象的可读上限。
    - record_ref: prototypes/reality_anchor/design_archive/index.yml#RA_CAND_0019
      retrieval_basis: clean_archive_index_summary
      calibration_takeaway: >-
        较低难度、重复分支/按钮路由与路线成本不应被包装成难度；提醒候选让每个 timing choice 都改变状态关系。
    - record_ref: prototypes/reality_anchor/design_archive/index.yml#RA_CAND_0020
      retrieval_basis: clean_archive_index_summary
      calibration_takeaway: >-
        重复分支和低信息往返属于下界警示；Candle 不得用等待、长回程或重复复燃制造目标难度。
    - record_ref: prototypes/reality_anchor/design_archive/index.yml#RA_CAND_0021
      retrieval_basis: clean_archive_index_summary
      calibration_takeaway: >-
        仍不足以支撑强难度判断的简化结构可作为下界参考；Candle 的目标是至少两个互相约束的后果窗口，
        但不把该跨阶段记录的分数换算为 Candle 分数。

