design_brief: >-
  在同一 candidate 内完成唯一单关候选。体验核心不是事件数量，而是玩家必须主动计算两个有后果的时机窗口：
  先用墙灭火改变一根蜡烛是否参加边界，再在仍有另一根蜡烛承担倒计时责任的可读窗口选择边界或 t2 中周期重燃；
  每个选择必须立即改变对象责任、可达区域、火源责任或下一步合法操作，并反向约束更早安排。避免上一轮常见失败：
  C2 燃尽后的无亮回程、固定路线相位复燃、反复上下移动等待、把亮态重叠做成 forbidden branch。允许重构
  structure family，但不得越过 shared_fire_and_reignition；完整图只保留一个玩家逻辑里程碑签名或等价站位变体。
  目标难度至少 4，优先紧凑强耦合与对象重复复用，不用路线税或装饰物件制造负荷。完成完整 replay、解族、
  exposure、反事实和玩家侧自查后发布 exact v1；不要写 ledger、critic、levels、queue 或 handoff。
