design_brief: >-
  请先从玩家侧完成体验简报与归档校准。目标是 shared_fire_and_reignition 阶段、难度至少 4；玩家已掌握
  全部前序机制与衍生计算。体验种子仍是通过分析主动使用墙灭火和重燃控制蜡烛参与倒数，但本轮明确要求
  至少两个有后果的主动 timing windows：选择会改变仍燃对象责任、可达区域或下一次操作，不能靠无亮回程、
  重复往返或固定节拍制造难度。读取完整前序边界和 clean archive 校准，阅读 task-local lexicon；不要设计
  exact，不要写 ledger、critic packet、levels、queue 或 handoff。
