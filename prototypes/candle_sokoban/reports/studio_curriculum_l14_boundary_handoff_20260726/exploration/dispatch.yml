exploration_id: candle_curriculum_l14_boundary_handoff_20260726
prototype_id: candle_sokoban
required_skill: sokoban-mechanism-lab
intent: mechanism_explore
publication_scope: task_local
workspace: prototypes/candle_sokoban/reports/studio_curriculum_l14_boundary_handoff_20260726/exploration
dispatch_prompt: "使用 $sokoban-mechanism-lab，以 mechanism_explore 的 task_local 模式执行本文件。"
experience_seed: >-
  探索退焰交接的加入相位差：边界前让 B 通过普通接触点燃时，A 与 B 都支付本次燃烧，B 缩短一格；
  若 A 持续遮住 B 烛芯直到 A 存活缩短，B 在结算后由退焰接火，边界后仍是完整燃烛。两路边界后 B
  都燃烧，B 的第一次直接移动应以相同输入和位移把“完整/短一格”的当前火焰写入相邻插口，并由
  同一 consumer 同时读取长度与退焰所得火。只研究局部关系、接口和近邻退化，不规定完整候选、包装、
  难度或具体最终 consumer。
player_prior:
  - 玩家具备基础推箱子经验，已掌握轴推、侧滚、烛芯投影和全火盆目标。
  - 玩家已掌握共享五拍倒数、同步缩短/燃尽、墙灭、共享火焰、烛身遮蔽与未燃重曝。
  - 玩家已见过退焰把同一实体封口翻成携火通道；本槽位深化为旧载体付费、新载体结算后完整接班。
allowed_mechanisms:
  - basic_candle_manipulation
  - wall_dousing
  - shared_fire_and_reignition
  - body_concealment_and_reexposure
  - retreating_flame_transfer
allowed_tools:
  - npx tsx src/cli.ts explain-layout prototypes/candle_sokoban <layout-file|-> --id <id> --max-states 300000 --graph-max-states 300000 --write
  - npx tsx src/cli.ts try-inputs prototypes/candle_sokoban <layout-file|-> --id <id> --inputs <input1,input2,...> --write
  - npx tsx src/prototypes/candle_sokoban/exposureAuditCli.ts <layout-file|-> --id <id> --exact-version <exact> --allowed-exposure-through retreating_flame_transfer --max-states 300000 --out <report.json>
source_boundary:
  allowed:
    - prototypes/candle_sokoban/docs/designer_contract.md
    - prototypes/candle_sokoban/docs/mechanic_exposure_sequence.yml
