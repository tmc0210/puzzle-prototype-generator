design_brief: >-
  为课程第 14 关建立体验简报。人类指定核心是 S05_T01_BOUNDARY_HANDOFF_PRESERVES_RECEIVER：旧载体
  支付边界，接火者以完整燃烧态接班。玩家应在边界前真实选择让 B 普通接火并支付本轮，或维持 A 对 B
  的遮蔽直到 A 存活缩短、B 在结算后由退焰接火；两路边界后 B 都燃烧，B 的第一次直接移动用同一
  consumer 同时读取其长度与当前火焰。目标相对难度 5，允许暴露到 retreating_flame_transfer。规划方向
  可优先校准，但若空走计时、固定火源旁路或预对齐结构无法产生玩家主动选择，应换结构族。此阶段只完成
  clean archive 校准与体验简报，不设计 layout 或 exact；新增 Candle 人评归档必须纳入玩家侧校准。
