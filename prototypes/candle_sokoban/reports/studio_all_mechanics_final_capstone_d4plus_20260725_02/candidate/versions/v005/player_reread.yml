schema_version: 1
artifact_kind: player_side_reread
candidate_id: CANDLE_ALL_MECHANICS_FINAL_CAPSTONE_002
exact_version: v005

opening_read: >-
  全图只有两根蜡烛。上方四格 writer、中央墙与已亮火盆把“同滚先灭后燃”直接展示出来；竖直
  两格 relay 下方有两格可推空间，左下终盆却与 relay 初始身体同在 y7。玩家开场真正写入的不是
  一个开关，而是 relay 的纵坐标：下推一格和两格在局部都看似有用，较晚终盆才说明哪一格正确。

preparation_and_local_reveal: >-
  玩家还要让 writer 自然缩短两次，使端帽/灯芯列移到 relay 列，再从上方把它下滚。若 relay 只推
  一格，writer 走 d3；若推两格，writer 走 d4。两条历史都会在同一次滚动中 d2 撞墙灭火、d3 被
  (6,5) 火盆复燃，随后都能在下一边界 shrink_ignite relay。因此“接力有没有成功”不会即时泄露答案。

delayed_readout: >-
  relay 接火后再过一个共享边界。错误的一推输出缩成 y7 单格，火焰在 y6；终盆本身占据 y7 并挡住
  横滚，继续等又会燃尽。正确的两推输出缩成 y8 单格，火焰在 y7；玩家从右侧左滚 d6，火焰在 d5
  点亮 (2,7)，并在同一动作正常胜利。高潮是在最后一滚回读开场纵坐标，没有独立清理尾题。

backward_reasoning: >-
  终盆要求最终 wick 行为 y7，反推出第二边界前 relay 必须占 y7-y8，再反推出开场必须下推两格；
  同一停靠又反过来决定 writer 的 d4 止点。玩家需同时维护对象长度、共享五拍边界、body/wick 分层
  与墙灭后复燃的接触顺序，不能用局部成功动画代替未来规划。

difficulty_reread:
  target: 5
  minimum: 4
  designer_estimate: 4_to_5
  support: >-
    主要负荷是一次早期空间选择同时写入 writer 止距、退焰接收坐标和下一边界后的 wick 行；两个
    局部成功输出直到最终读出才分流。它至少构成难度 4 的复合反推；地图紧凑、对象少，是否达到
    完整难度 5 仍应交给 fresh Critic 与人类试玩，而不是由图规模或事件数量宣布。

known_perceptible_defects:
  - 正解开场有两步可逆调相；完整图的深度 22 与 24 胜态也只在这段相位分配上不同，未达到逐输入唯一。
  - 两推 relay 的方向在看懂终盆火焰行后较明确；思考量集中在非局部反推，而不是局部搬运分支。

self_verdict: >-
  v004 的第三根 consumer 与可拆右翼已全部删除。v005 的左下读出直接筛选一推、两推两个局部成功
  输出；整区删除反事实会让二者重新等价。机械门禁闭合，值得送 fresh Evidence Reviewer，再由单次
  Puzzle Critic 判断难度与审美。
