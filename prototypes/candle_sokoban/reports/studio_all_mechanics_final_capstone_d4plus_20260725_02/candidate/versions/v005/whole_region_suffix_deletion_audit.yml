proper_suffix_candidates:
  - id: final_relay_roll_only
    apparent_suffix: 第二边界后从 (7,8) 把单格 relay 左滚并点亮 (2,7)
    why_not_detachable: >-
      该一步读取的是开场停靠写入的纵坐标；一推输出在相同第二边界后实体位于 y7、火焰位于 y6，
      火盆本身阻断其横滚，且下一边界会燃尽。删除这一读出会直接取消早先二推要求。
    evidence: 全胜路均需 roll_candle:candle#2:d6 与 light_brazier:2,7；一推局部输出不在 win-reachable 集合
    verdict: coupled
  - id: post_transfer_boundary_walk
    apparent_suffix: shrink_ignite 之后到第二边界的走位
    why_not_independent: >-
      这组动作不是另一个子题；它结算两格 relay 的唯一一次保留性缩短，把早期停靠值转成最终 wick 行，
      同时让 writer 燃尽，随后立即读取，无额外对象或清理任务。
    verdict: timing_bridge_within_same_relation
  - id: entire_left_lower_readout_region
    apparent_suffix: 左下火盆与整条横向读出带
    deletion_counterfactual_ref: prototypes/candle_sokoban/reports/studio_all_mechanics_final_capstone_d4plus_20260725_02/candidate/versions/v005/counterfactuals/suffix_deleted_redirected.txt
    early_choice_changed: true
    solution_family_changed: true
    same_prefix_only_early_win: false
    verdict: coupled

