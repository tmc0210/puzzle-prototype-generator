schema_version: 1
candidate_id: CANDLE_ALL_MECHANICS_FINAL_CAPSTONE_002
exact_version: v001
target_difficulty: 5
minimum_difficulty: 4

player_read:
  opening: >-
    全图同屏给出右向 writer、墙、两格活动火源、writer 轨道里的未燃 guard、两格 bridge、
    三格 relay、横向 consumer 和唯一火盆。玩家出生在 guard 左侧；把 guard 向右侧滚会把它
    锁入由墙、source 与 bridge 围出的凹位，同时开放 writer 的最终接触历史。
  preparation: >-
    guard 不动时，writer 即使先被墙遮灭、再从活动火源复燃，也会在经过原 guard body 时再次
    熄灭，无法点 bridge。玩家必须在第一燃烧边界前先移走 guard，并让 writer 与 source 同步
    缩成单格；这不是腾挪税，而是在未来滚动发生前写定“最后一次相反接触是谁”。
  reveal_or_use: >-
    canonical step 9 的一次向下侧滚依次产生 wall douse、source-wick reignition 与 bridge ignition；
    step 10 的边界让 bridge 缩短并退焰点 relay，step 15 的边界再让 relay 缩短并退焰点 consumer。
    玩家由 consumer 的目标列反读出，开场真正决定的是两次边界后仍会延续的火源身份。
  ending: >-
    consumer 再跨一个边界缩成两格，沿轴总计左移五格；下一边界把它烧成目标邻列的单格，
    最后一次向上侧滚用左侧灯芯点盆并立即正常获胜。结尾只消费同一延迟火源，不增加独立子题。

difficulty_read:
  claimed_band: 5
  lower_bound: 4
  basis:
    - 需要同时追踪 guard 的未来遮蔽位置、writer/source 的准备边界和关键滚动的逐小步末态。
    - bridge 与 relay 连续两次退焰传递把开场选择延迟到 consumer 才读取，局部动作不能直接验证全链。
    - consumer 的五格定位跨越燃烧相位，且两格阶段被墙限制，必须预见最终单格灯芯列。
    - 完整胜解族只有等价时序变体；难度声明来自关系回读，不来自胜态数量或步数。
  calibration_limit: >-
    当前 Candle 没有获授权的 clean human-reviewed 正式课程布局；难度 5 是 Designer 送审声明，
    独立 Critic 仍可依据完整前序与人类审美判断否决或判断低于预期。

perceptible_defects:
  - 开场正确 guard 侧滚在完整图上是唯一 viable 首步；洞见在于理解其未来末端遮蔽职责，而不是操作分支数量。
  - 正解包含共享倒数所需的步行与调相；这些动作不提供额外洞见，但直接维持同一参与集合。
  - 两个胜态允许把 consumer 的部分轴推分配到相邻燃烧相位；二者不改变对象位置终值或因果链。
