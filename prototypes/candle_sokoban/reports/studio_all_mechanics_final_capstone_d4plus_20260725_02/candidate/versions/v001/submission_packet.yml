designer_claim:
  player_experience_core: >-
    玩家先把后置 guard 移出 writer 的未来灯芯轨道，把一次侧滚的最后相反接触从“复燃后再被烛身遮灭”
    改写为“墙灭后由活动灯芯复燃”；这个最终点燃状态写入 bridge，再经 bridge 与 relay 的两次退焰
    传递成为 consumer 的较晚火源，最后由正常点盆回读。
  player_action: >-
    开场侧滚 guard 并管理准备边界；随后执行一次逐小步墙灭、灯芯复燃和 bridge 点火的 writer 侧滚，
    管理两次共享边界，把 consumer 跨相位左推五格，最后向上侧滚点亮唯一火盆。
  visible_payoff: >-
    writer 的关键滚动立即显示灭火、复燃与 bridge 点燃；紧接的两个边界依次显示 bridge 点 relay、
    relay 点 consumer。consumer 最终进入开局火盆的独占灯芯列，使玩家看到开场 guard 选择被延迟读取。
  why_this_level_exists: >-
    关卡把已知的滚动逐步接触、墙灭火、共享倒数与退焰点火压成一个长期状态写入关系：玩家早先移动的
    不是普通挡块，而是决定两轮以后哪根烛仍有火的“最后接触”。
  work_identity_conditions:
    - guard 必须在关键滚动前由玩家移走；不移走则复燃后的 writer 再被 guard body 遮灭。
    - writer 的 wall douse、source-wick reignition 与 bridge ignition 必须发生在同一次滚动 edge。
    - bridge→relay 与 relay→consumer 两次 shrink_ignite 必须连续属于正常胜利因果链。
    - consumer 必须是唯一能进入目标灯芯列并点亮火盆的对象。
    - 删除 guard 或墙只能产生作品身份退化版，不能成为 exact 内的旁路。

packaging_account:
  opening: >-
    同屏展示 writer、前置墙、活动 source、后置 guard、bridge、relay、consumer 和火盆；玩家从 guard 左侧开始，
    既能看到立即可操作对象，也能沿竖直接触列读到较晚链条。
  preparation: >-
    玩家先把 guard 向右侧滚并锁入凹位，再利用第一燃烧边界把 writer/source 同步缩成关键单格关系。
  reveal_or_use: >-
    一次 writer 侧滚完成先灭后燃和 bridge 写入；后两个边界逐级转移火源。consumer 的长度与目标墙带把
    这条火源约束传回五格定位和最终灯芯列。
  ending: >-
    consumer 在同一火源关系内缩成单格，最后一次上滚点盆并立即 all_braziers_lit；无死亡回报或独立清理段。
  every_major_element_role:
    - candle#1 是玩家执行状态写入的 rolling writer。
    - candle#5 是跨准备边界后提供后置复燃的活动 source。
    - candle#single3 是玩家必须移走的后置 guard，删除会产生更短预燃直达族。
    - candle#6 是接受滚动末态并在下一边界退焰点 relay 的 bridge。
    - candle#2 是再下一边界退焰点 consumer 的 relay。
    - candle#3 是五格定位后唯一点盆的 delayed consumer。
    - brazier@2,1 是唯一正常胜利目标。
    - 墙带分别承担 wall douse、对象静态锁和两格 consumer 目标走廊阻断。
  known_perceptible_defects:
    - 开场正确 guard 侧滚是完整图上的唯一 viable 首步，思考分支多于操作分支。
    - 正解含多次为共享倒数服务的步行；它们维持同一参与集合，但本身不增加新洞见。
    - 两个胜态允许 consumer 推烛分布有等价时序差异，未达到逐输入唯一。

