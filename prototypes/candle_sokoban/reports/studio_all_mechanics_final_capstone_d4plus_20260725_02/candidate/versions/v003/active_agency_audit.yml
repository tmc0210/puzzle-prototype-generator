    玩家必须在 candle#2 已接火并缩成两格后，从尾端向右横滚三格；这不是最终 consumer 搬运，
    而是把中继烛同时用作移动火源、灯盆消费者和下一退焰覆盖体。
  meaningful_operation:
    action_edge_events:
      - light_brazier:6,6
