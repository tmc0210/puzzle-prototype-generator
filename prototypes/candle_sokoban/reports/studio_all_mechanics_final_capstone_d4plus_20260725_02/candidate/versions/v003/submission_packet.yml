designer_claim:
  player_experience_core: >-
    玩家把 opening receiver 的一格轴推读成两项未来写入：既决定 writer 能否在同一滚动里以“墙灭后火盆复燃”
    的末态结束，也决定该末态跨界后落到哪根烛上。receiver 接火后不会自动退休；玩家还要把它横滚三格，
    途中点亮封锁错误历史的火盆，再把端帽放到 consumer 灯芯上，最后由较晚 consumer 正常点终盆。
  human_feedback_response: >-
    v002 的 candle#6→candle#2→candle#3 被动 shrink_ignite 链已整体删除。v003 只有三根蜡烛；writer 后的
    第一转换由 opening 轴推预先构造且错误多推不可解，第二转换由接火 receiver 的实际横滚构造，
    同时产生可见点盆与 consumer 覆盖。普通 walk/countdown 与最终 consumer 上滚均未计作两次主动接力。
  visible_payoff: >-
    writer 的关键 edge 显示墙灭、火盆复燃和 receiver 点燃；稍后 receiver 横滚立刻点亮原先封路的火盆，
    并在边界中点亮 consumer。最终 consumer 只保留一个短延迟读出。
  work_identity_conditions:
    - opening receiver 必须恰好轴推一格；多推一格后的完整图状态不可达胜。
    - writer 墙灭、火盆复燃、d3 侧滚和 shrink_ignite candle#2 必须在同一 edge。
    - 未亮火盆 (6,6) 必须封死提前 writer 回推，并由已接火 candle#2 的主动横滚点亮。
    - candle#2 横滚布置与后继 shrink_ignite candle#3 必须出现在每条胜路。
    - candle#3 必须延迟烧成单格并独占点亮 (9,2)。

packaging_account:
  opening: 同屏显示两格选择、多推空间、writer 相反接触、封锁火盆、consumer 与终盆。
  preparation: 一格轴推同时写物理停点和退焰接收位；玩家再走到 writer 端帽操作面。
  reveal_or_use: writer 写入跨界点 receiver；receiver 再由玩家横滚消费封锁火盆并布置 consumer 接火。
  ending: consumer 延迟一界烧成单格，上滚 d6 点终盆并立即 all_braziers_lit。
  every_major_element_role:
    - candle#1：同一 edge 先灭后燃的 rolling writer。
    - candle#2：开场停块/第一接收者/主动移动火源/第二退焰覆盖体。
    - candle#3：延迟 consumer 与独占终盆读出。
    - brazier@4,5：writer 后置复燃源。
    - brazier@6,6：错误历史回推锁与主动 relay 横滚的即时目标。
    - brazier@9,2：最终正常胜利目标。

