  minimum: 4
  designer_estimate: 4_to_5
  player_reread_ref: prototypes/candle_sokoban/reports/studio_all_mechanics_final_capstone_d4plus_20260725_02/candidate/versions/v003/player_reread.yml
  known_perceptible_defects:
    - 正解仍有普通相位走位；它们未被计作主动性或难度。
    - 两个胜态有等价 consumer 相位差异，未达到逐输入唯一。
    - 正确 relay 操作方向较清楚，主要洞见在早先构造与非局部职责复用。
