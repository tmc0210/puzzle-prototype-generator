schema_version: 1
artifact_kind: player_side_reread
candidate_id: CANDLE_ALL_MECHANICS_FINAL_CAPSTONE_002
exact_version: v003

opening_read: >-
  全图只留三根蜡烛，但同屏展示 writer、两层相反接触、竖向 receiver、封锁火盆、横向 consumer 和终盆。
  竖烛可连续轴推，玩家先要判断“推一格”同时在写 writer 停点与未来退焰接收位；多推不是等待差异，而是不可解几何。

preparation_and_reveal: >-
  玩家绕到 writer 的端帽操作面时已经看见倒数将跨界。正确下滚不是固定轨道演出：它只有在早先 receiver
  位置正确时才走完空格→墙灭→火盆复燃，并在同一边界明确点亮 receiver。提前下滚会停在墙后，
  且封锁火盆让旧版“再推回去”不可恢复。

second_active_use: >-
  receiver 接火后不会靠普通走路自动把火传给 consumer。玩家必须重新绕到它尾端，亲自横滚三格；
  途中点亮原先封路的火盆，终点端帽再压住 consumer 灯芯。此时玩家会回读：封路物既是错误历史的锁，
  也是正确中继必须主动消费的目标。

ending: >-
  横滚跨界后 consumer 点燃；再过一界烧成单格，玩家沿短下廊到操作位，上滚一次点亮终盆并立即胜利。
  高潮后没有新的独立子题。

difficulty_reread:
  target: 5
  minimum: 4
  designer_estimate: 4_to_5
  support: >-
    熟练玩家已知所有规则，实际负荷来自一次轴推同时写两种关系、同一 writer edge 的接触末态、
    过早历史被封锁火盆不可逆地切断，以及接火 receiver 的第二次对象级使用。它高于固定复合锁，
    但紧凑地形使操作面较清楚，是否达到完整难度 5 应交给 fresh Critic，而不是由事件数宣布。

known_perceptible_defects:
  - 正解仍含为五拍相位服务的走位；这些步不计作主动性或难度。
  - 完整图有深度 28 与 30 两个等价 consumer 相位代表，未达到逐输入唯一。
  - 第二次 relay 横滚在正确状态下操作方向较明确，主要思考量在是否提前构造该状态，而非局部搬运分支。

self_verdict: >-
  相比 v002，右下自动动画链已被删除；两个 writer 后状态转换都有必要玩家对象操作和完整图反例。
  作品至少达到难度 4 的紧凑复合回读，值得送 fresh Evidence Reviewer 与单次 Puzzle Critic 独立判断。
