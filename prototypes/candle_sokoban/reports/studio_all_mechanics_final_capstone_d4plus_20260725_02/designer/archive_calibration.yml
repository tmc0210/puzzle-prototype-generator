archive_read:
  contract_application: >-
    按 docs/29 从完整 index/retrieval summaries 开始；完整读取所有明确审美 1 分
    候选的人类原评语，再为本次最终高难任务独立选择正例与下界/边界例。候选目录
    被视为按 index 定向读取的归档池，不全量打开所有 layout。

  reality_anchor:
    index_ref: prototypes/reality_anchor/design_archive/index.yml
    index_or_retrieval_summaries_read_complete: true
    additional_authorized_review_ref: prototypes/reality_anchor/playtest_reviews.yml
    additional_authorized_review_read_complete: true
    all_aesthetic_1_records_read:
      - candidate_id: RA_CAND_0024
        candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0024.md
        human_comment_ref: HP_RA_FRESH_2026_07_08_PULL_BRUSH_RETURN_v4_wall_trim_001
        human_original_comment_read: true
        calibration: >-
          高机制信号和指标支持不能补偿玩家实际只得到普通腾挪；可见 affordance
          承诺切割、拼接或几何利用时，解法必须兑现相称洞见。
      - candidate_id: RA_CAND_0027
        candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0027.md
        human_comment_ref: HP_RA_FRESH_2026_07_09_VACATE_MATERIAL_LOCK_v4_001
        human_original_comment_read: true
        calibration: >-
          事件标签出现不等于机制性质被玩家使用；能推却无需推、能黏却不用几何，
          会形成严重 affordance 污染。
      - candidate_id: RA_CAND_0030
        candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0030.md
        human_comment_ref: HP_RA_FRESH_2026_07_12_CUT_REBIND_ORTHOGONAL_v7_001
        human_original_comment_read: true
        calibration: >-
          大地图、大量对象和高设计成本若只兑现普通腾挪，且自然分支反馈迟缓，
          不能因内容多而取得审美价值。
      - candidate_id: RA_CAND_0031
        candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0031.md
        human_comment_ref: HP_RA_FRESH_2026_07_11_TWIN_LOOM_RESECTION_v31_001
        human_original_comment_read: true
        calibration: >-
          开场单行道机制演出若不复用空间或要素，后段又只剩显然重复锁，属于
          事件齐全掩盖玩家内容不足。
      - candidate_id: RA_CAND_0032
        candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0032.md
        human_comment_ref: HP_RA_FRESH_2026_07_12_DUAL_ANCHOR_CROSS_RELAY_v4_001
        human_original_comment_read: true
        calibration: >-
          前段对象完成后退休、后段另做一个 witness，是割裂子题；不得靠拼接
          无关段落提高机制覆盖、难度或审美。
    selected_related_positive_records_read:
      - candidate_id: RA_CAND_0017
        candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0017.md
        human_comment_ref: HP_RA_LEX_2026_07_06_VACATE_BIND_RETURN_v3_opening_comfort_001
        human_original_comment_read: true
        archive_scores: {aesthetic: 4, difficulty: 5}
        selection_reason: >-
          与本任务同属机制全部掌握后的高难终局校准；人类认可精巧结构、高机制密度、
          高要素耦合、强推理和反直觉操作，而非把事件数量本身当价值。
      - candidate_id: RA_CAND_0022
        candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0022.md
        human_comment_ref: HP_RA_LEX_2026_07_08_PULL_CUT_ANCHOR_HANDOFF_v2_001
        human_original_comment_read: true
        archive_scores: {aesthetic: 5, difficulty: 4}
        selection_reason: >-
          用短步骤、紧凑空间和一个强反直觉构造形成明确洞见；校准“难度与回报来自
          非局部理解，而不来自地图规模或操作税”。
    selected_lower_bound_or_boundary_records_read:
      - candidate_id: RA_CAND_0006
        candidate_ref: prototypes/reality_anchor/design_archive/candidates/RA_CAND_0006.md
        human_comment_ref: HP_RA_EXP_2026_07_05_SOFT_HANDOFF_NO_MERGE_LOCK_v1_001
        human_original_comment_read: true
        archive_scores: {aesthetic: 2, difficulty: 5}
        selection_reason: >-
          直接校准本任务最危险的假成功：通过目标位置和腾挪复杂度达到难度 5，
          却显著削弱机制美感。难度达标不能补偿作品退化。

  ice_slide_escape:
    index_ref: prototypes/ice_slide_escape/design_archive/index.yml
    index_or_retrieval_summaries_read_complete: true
    all_aesthetic_1_records_read:
      - candidate_id: ICE_CAND_0002
        candidate_ref: prototypes/ice_slide_escape/design_archive/candidates/ICE_CAND_0002.md
        human_comment_ref: HC_001
        human_original_comment_read: true
        calibration: >-
          工具支持、重复机制事件和探针 dead commitments 不能把“看到什么就推什么”
          的直觉流程变成挑战；规则暴露越界还会直接否定阶段主张。
      - candidate_id: ICE_CAND_0004
        candidate_ref: prototypes/ice_slide_escape/design_archive/candidates/ICE_CAND_0004.md
        human_comment_ref: HC_001
        human_original_comment_read: true
        calibration: >-
          三次重复的简单机制教学仍只是教学，重复次数不会自动形成 application 或 capstone。
      - candidate_id: ICE_CAND_0011
        candidate_ref: prototypes/ice_slide_escape/design_archive/candidates/ICE_CAND_0011.md
        human_comment_ref: HC_ICE_CAND_0011_001
        human_original_comment_read: true
        calibration: >-
          核心顺序逻辑存在仍不足以挽救巨大冗余、可删除开场动作、未披露多解和
          既有正例形状污染；作品完整性与身份必须由当前实物承担。
      - candidate_id: ICE_CAND_0037
        candidate_ref: prototypes/ice_slide_escape/design_archive/candidates/ICE_CAND_0037.md
        human_comment_ref: HC_ICE_CAND_0037_001
        human_original_comment_read: true
        calibration: >-
          完整图、required-event 与审查通过都不能补偿三个无洞见重复步骤的拼接，
          也不能把致命接口外溢降为非核心 caveat。
    selected_related_positive_records_read:
      - candidate_id: ICE_CAND_0024
        candidate_ref: prototypes/ice_slide_escape/design_archive/candidates/ICE_CAND_0024.md
        human_comment_ref: HC_ICE_CAND_0024_001
        human_original_comment_read: true
        archive_aesthetic_score: 5
        selection_reason: >-
          人类认可的关键不是两段各自机制多，而是相同空间、对象和状态被强复用，
          后段不读成独立子关；遮蔽与先前诱惑还在后续得到兑现。
        metadata_note: >-
          index 的 difficulty_score 为 4，candidate record 顶层为 3，内部校准 packet
          的设计目标又为 4；本次只使用无冲突的人类审美原评语，不用该冲突字段锚定难度。
    selected_lower_bound_or_boundary_records_read:
      - candidate_id: ICE_CAND_0006
        candidate_ref: prototypes/ice_slide_escape/design_archive/candidates/ICE_CAND_0006.md
        human_comment_ref: HC_001
        human_original_comment_read: true
        candidate_record_scores: {aesthetic: 3, difficulty: 3}
        selection_reason: >-
          全知识顺序链可以是扎实组合关，但人类明确认为它低于最终挑战，且左侧绕路
          是负担；这界定了“机制组合成立”与“最终 capstone 成立”的差距。
        metadata_note: >-
          index 记录 4/4，而 candidate record 记录 3/3；按 archive 的
          source_of_truth: candidate_records 记录冲突，并以人类原评语的定性边界为准。
      - candidate_id: ICE_CAND_0019
        candidate_ref: prototypes/ice_slide_escape/design_archive/candidates/ICE_CAND_0019.md
        human_comment_ref: HC_ICE_CAND_0019_001
        human_original_comment_read: true
        archive_scores: {aesthetic: 4, difficulty: 4}
        selection_reason: >-
          扎实复合锁可达到后期 4 分难度，但人类仍指出它没有流程末期仍然有效的
          精彩洞见、局部结构或 aha-moment；这是本任务最低不得低于 4 的关键上界警告。

fresh_selection_statement: >-
  本次正例与边界例完全根据两个 clean archive 的当前完整 index 和人类原评语重新选择；
  未读取、引用或沿用任何旧 Candle task 的归档选择、Designer 自评或 review。

calibration_conclusions_for_later_brief:
  positive_bar:
    - >-
      最终高难候选应让若干机制、对象、空间和共享相位围绕同一个玩家关系强耦合；
      机制覆盖只是可能的副产物，不是创作目标。
    - >-
      高价值推理通常要求较早决定依赖对后续状态的预见，并在后来产生集中、可见的回读；
      短而强的非局部洞见可以高于长而复杂的腾挪。
    - >-
      若存在前序或后继，它们必须复用并消费核心对象/状态，把约束传回此前判断；
      任何完成后退休的段落都不能作为增加难度或机制数量的手段。
    - >-
      目标难度 5 需要超越“扎实复合锁”的最低难度 4 边界，形成对全部已知规则仍然
      新鲜的玩家关系；不能靠重复 witness、迟缓 deadend、地图膨胀或操作税达成。
  negative_bar:
    - 高 affordance 对象必须在玩家逻辑中兑现其可见承诺，不能只产生事件标签或被动动画。
    - 开场准备若不影响后续选择、不复用空间或对象，应视为可删的拼接演出。
    - 重复同类步骤、完整事件覆盖、唯一胜路和高工具指标都不提供正向审美价值。
    - 难度 5 与审美价值相互独立；由腾挪复杂度制造的高难可直接成为负例。
    - Candle 的长步行与原地倒数移动按原型合同不自动是缺点，但也不自动构成谜题内容或难度。
  unresolved_until_task_local_publication:
    - 不固定体验核心。
    - 不选择 structure family。
    - 不分配六个机制家族的使用配额。
    - 不判断哪一种局部结构能承担目标难度与作品身份。

