selected_material_evidence:
  material_id: rolling_order_delayed_source
  role_in_future_work: central_causal_kernel_not_candidate
  situation_card:
    start: >-
      两格朝左已燃横烛向下侧滚两格；它的烛芯轨道先经过墙、后经过已亮火盆；
      滚动终点的横烛旧端帽压住一根三格朝上未燃竖烛的烛芯，竖烛左侧由墙封住侧滚。
    non_empty_inputs:
      - down
      - up
      - right
      - left
      - down
      - right
      - down
      - down
      - down
      - left
      - left
    observed_after_action: >-
      step 1 的滚动小步先 `extinguish_by_wall`、后 `ignite_from_brazier`，使横烛以点燃末态结束滚动；
      step 5 的第一个共享边界令横烛缩短并 `shrink_ignite` 竖烛；step 10 的第二个共享边界令横烛
      燃尽、竖烛缩短，竖烛旧端帽格变成外露火焰格。
    verified_minimal_use: >-
      step 11 从旧端帽格右侧向左输入：正例合法进入火焰并死亡；顺序反例和少源反例中该格仍被
      未缩短烛身占据，且左墙封住侧滚，所以相同输入为 `roll_blocked`。
  comparisons:
    - case: wall_then_brazier_positive
      fact: 先墙灭火后火盆复燃，两个边界后形成较晚火焰格。
    - case: brazier_then_wall_reversed
      fact: 最后接触为墙，横烛以未燃末态结束；两次边界都没有烛参与，最终被烛身阻挡。
    - case: wall_then_floor_no_reignite
      fact: 墙灭火后只有未燃重曝，没有后置火源；两次边界都无燃烧参与者，最终被烛身阻挡。
    - case: floor_then_brazier_prelit_degenerate
      fact: 后续几何与正例相同，但没有途中灭火/复燃，证明预燃直达可绕过“滚动写入”作品关系。
  evidence_refs:
    - prototypes/candle_sokoban/reports/studio_all_mechanics_final_capstone_d4plus_20260725_02/exploration/runs/batch_001_rolling_order_delayed_source/results.json
    - prototypes/candle_sokoban/reports/studio_all_mechanics_final_capstone_d4plus_20260725_02/exploration/runs/batch_001_rolling_order_delayed_source/report.md
    - prototypes/candle_sokoban/reports/studio_all_mechanics_final_capstone_d4plus_20260725_02/exploration/runs/batch_001_rolling_order_delayed_source/proposed_families.md
  evidence_boundary:
    - 只验证当前朝向、两格横烛、三格竖烛、两格滚距、固定墙与已亮火盆；不外推镜像、其它长度或滚距。
    - 只验证当前两根蜡烛的参与集合；可移动烛芯火源、第三根烛和三烛部分参与集合尚未验证。
    - 当前唯一 consumer 是玩家死亡与反例 `roll_blocked`；正常胜利 consumer 尚未验证。
    - 去掉前置遮蔽会退化为预燃普通缩短；最终作品若不能排除该反事实，就没有使用滚动途中写入身份。
    - “途中遇到过火源”不是结论；只有滚动结束时的最终点燃状态决定第一个边界参与资格。
  designer_adaptation_commitment: >-
    正式作品必须把较晚火焰接入 `all_braziers_lit` 的必胜因果链，并让玩家在滚动前主动决定
    接触末态；不得沿用死亡 probe 作为作品回报。这个 adaptation 是 brief 承诺，不是 Explorer
    已证明事实，后续必须由正式布局的 replay、反事实与解族证据验证。

