experience_core:
  experience_statement: >-
    玩家必须把一次滚动读成对未来火焰位置的“写入”：通过较早空间准备，让滚动烛芯最后按
    “先被遮灭、后由火源复燃”的顺序结束，使这根烛取得第一个共享边界的参与资格；该资格随后
    以退焰点火传给第二根烛，又在下一个共享边界变成一格较晚火源。玩家最终用这格火源完成
    正常胜利链，回读自己早先决定的不是滚动终点，而是两轮之后哪里仍有火。
  prior_expectation: >-
    熟练玩家知道滚动逐小步结算，也知道共享倒数和退焰点火；但仍容易先把滚动轨道理解为
    搬运几何，把灭火与复燃看成即时局部事件，而不把最后接触状态当成跨两个边界传播的信息。
  visible_setup: >-
    开局应同时展示可被不同顺序读取的遮蔽面与火源、负责写入的滚烛、被其端帽压住烛芯的
    接力烛，以及较晚必须取得火焰的正常胜利 consumer；玩家能从全图预见这些对象可能相连，
    但不能只凭局部直觉确定正确的滚动准备、边界相位与保留状态。
  player_action: >-
    玩家先为未来 consumer 选择并构造滚动的最后接触顺序，执行一次逐小步先灭后燃的侧滚，
    再主动管理两次共享边界之间的站位、参与集合和对象保留，使火焰先跨烛转移、后迁移到旧端帽格，
    最后消费该较晚火源完成点盆链。
  visible_payoff: >-
    第一个边界中滚烛明显缩短并点燃原本被压住的接力烛；第二个边界中滚烛燃尽、接力烛缩短，
    原先由烛身占据的格子变成外露火焰；这个火焰随即成为最后胜利链的必要来源，而非死亡陷阱。
  why_level_exists: >-
    这关把玩家已经分别掌握的滚动接触、灭火/复燃、共享相位和退焰点火压成一种新的长期关系：
    空间接触顺序可以像写入状态一样，经两次时间结算后在别处被读取。它要求预见、构造和消费
    同一因果链，目标是终局级回读，不是再做一次机制展示。
  core_boundary:
    central_objects:
      - 一根负责逐小步写入最终点燃状态的可滚动已燃横烛。
      - 产生相反状态作用且顺序可由玩家早先空间决定的遮蔽面与复燃火源。
      - 一根烛芯先被滚烛端帽压住、后通过第一个边界退焰点火的接力烛。
      - 两次有明确对象参与差异的共享燃烧边界。
      - 直接消费第二个边界后较晚火焰、并通向正常点亮全部火盆的后继关系。
    supporting_objects:
      - 只用于提供操作位、倒数调相、限制错误滚动方向或让错误历史及时反馈的地形与对象。
      - 不改变核心写入、跨边界传递与读取关系的其它火盆或蜡烛；若不能承担必要职责则不加入。

work_identity:
  conditions:
    - >-
      滚动后的点燃末态必须由同一次滚动中至少两个相反接触的先后决定，且正确历史是先灭后燃；
      玩家必须在滚动前通过非平凡空间选择决定这个顺序，而不是沿固定轨道执行唯一动作。
    - >-
      正确与错误历史的关键差异不能在滚动终点立即被一个局部目标完全结算；它必须先决定第一边界
      是否缩短并点燃另一根烛，再经第二边界形成较晚火焰格。
    - >-
      第二根烛、两个共享边界和最终 consumer 必须属于同一必胜因果链；后继必须消费较晚火焰，
      并把约束传回最初的滚动顺序和相位准备。
    - >-
      正常胜利必须需要这条延迟火源链；任何允许永久火源、预燃直达或其它蜡烛绕过它的胜路都破坏作品身份。
    - >-
      高潮是玩家看到旧烛身格转化为未来火源并立即理解早先选择；高潮后只保留短消费，不追加独立清理子题。
  counterfactuals:
    - >-
      若交换墙与火源顺序、移除后置火源，或让滚烛以未燃末态结束，则第一边界无参与、第二根烛不被点燃、
      较晚火焰不存在；若整关仍可胜，作品身份失败。
    - >-
      若移除前置遮蔽，或让滚烛预先保持点燃就能得到相同后续状态，则作品退化为普通预燃缩短，
      不再是滚动接触顺序写入。
    - >-
      若预先点燃接力烛、移除第一边界的跨烛转移，或把两个边界压成即时效果，则延迟传递与回读消失。
    - >-
      若最终较晚火焰只用于杀死玩家、装饰事件覆盖，或后继不改变最初应该选择的滚动历史，
      则 Explorer probe 尚未被转化为完整作品。
    - >-
      若前序准备可不理解最终火源位置就局部走完，或准备对象完成后整体退休，前序就是拼接演出。
    - >-
      若通过增加重复滚动、地图规模、原地倒数或长腾挪来达到难度，而没有增加对同一延迟火源关系的预见，
      则难度不属于本作品身份。

level_brief:
  packaging_intent: complete_single_level
  abstract_structure_family: delayed_fire_state_programming_and_consumption
  structure_family_scope: >-
    只固定“滚动顺序写入 -> 第一边界跨烛转移 -> 第二边界较晚火源 -> 正常胜利消费”的关系；
    不固定 Explorer 坐标、朝向、墙带、已亮火盆位置或完整 layout family。
  expected_difficulty: 5
  minimum_acceptable_difficulty: 4
  expected_scale: >-
    只使用足以让滚动准备、两个共享边界与最终 consumer 相互约束的紧凑完整画布；不按固定尺寸、
    蜡烛数量或步骤数立配额，规模必须与终局回读相称。
  expected_player_load: >-
    主要负荷是同时追踪滚动小步最后接触、两次共享倒数相位、两根核心蜡烛的长度/点燃身份，
    并从最终 consumer 反推较早空间准备。走位和倒数等待可以存在，但不承担虚构难度的职责。
  difficulty_reasoning_sketch:
    - 玩家面对的不是规则发现，而是把六个已知家族中的若干事实组合成跨空间、跨对象、跨两边界的计划。
    - 至少两个局部看似可行的滚动/相位准备应在即时几何上相近，只有预见最终 consumer 才能区分。
    - 错误历史可以延迟到第一或第二边界暴露，但不得依赖漫长盲试；正确理解应显著压缩选择。
    - 仅有固定轨道上的一次先灭后燃、固定走五拍和一次点盆，明显低于本任务难度边界。
  packaging_account:
    opening: >-
      同屏呈现可被重排或从不同方向消费的遮蔽/火源关系、滚烛、被压住烛芯的接力烛和最终 consumer，
      让玩家看见“某格以后必须有火”但尚不能直接获得火源。
    preparation: >-
      玩家必须从最终 consumer 反推滚烛的接触末态和两次边界相位，选择正确操作面并保留接力结构；
      准备本身必须包含可区分选择，不能是唯一动作动画。
    reveal_or_use: >-
      侧滚即时只写入点燃末态；第一个边界揭示跨烛点火，第二个边界把结果搬成较晚火焰格，
      使玩家在同一因果链中完成“写入、等待、读取”。
    ending: >-
      较晚火焰由一个短而必需的正常胜利 consumer 直接消费，随后点亮最后火盆并结束；
      不沿用玩家死亡，不追加与核心无关的清理、重复滚动或独立点盆段。

allowed_design_sources:
  - 当前 assignment 白名单中的 Candle 规则、机制暴露、handoff 与 prior_course。
  - 当前任务 `mechanism_explore/task_local` 正式发布的 lexicon、index 与 batch_001 原始回放材料。
  - 当前任务已完成的 clean archive calibration artifact。

prototype_specific_routing:
  - 正式候选胜利条件必须为 all_braziers_lit，不能使用 event_occurs 或玩家死亡作为作品结束。
  - 后续 exact 的 allowed_exposure_through 固定为 rolling_contact_chain，并需对完整可达图运行 strict exposure audit。
  - 初始布局不能依赖静默点火、灭火或点盆；每项核心状态变化必须由非空合法行动产生。
  - 正式设计阶段必须逐步读取实际 replay，核对滚动每个小步、两次边界、对象身份和最终 consumer。
  - 当前材料的固定已亮火盆只是已验证局部火源；若改用烛芯火源、第三根烛或其它 consumer，必须重新验证。
  - 接受后的 redundant-element prune 属于 Controller 提交前流程，不由 Designer 在本阶段执行。

human_review_constraints:
  - 目标难度为 5，最低不得低于 4；“扎实复合锁”只能作为下界，不能自动满足最终 capstone。
  - 不要求六个机制家族逐项出现；任何加入的高 affordance 对象都必须在玩家逻辑中兑现职责。
  - 长步行、高步行比例和原地往返倒数在 Candle 中不自动是负面审美，但也不自动提供谜题内容或难度。
  - 机制事件覆盖、唯一胜路、工具指标、重复次数和地图规模均不能补偿割裂、冗余或洞见缺失。
  - 不使用旧 Candle reports、既有待玩关、诊断 levels 或未获当前 task-local provenance 的材料。

