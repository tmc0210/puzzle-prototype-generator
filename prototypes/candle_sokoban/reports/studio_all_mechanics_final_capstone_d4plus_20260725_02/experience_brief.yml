prototype_context:
  confirmed_rules:
    - 每次合法行动先执行玩家移动、轴推或侧滚；侧滚逐小步结算接触，但整次滚动只推进一次共享倒数。
    - 接触结算先熄灭被墙或烛身遮住的已燃烛芯，再由已亮火盆和外露已燃烛芯递归点火与点盆。
    - 共享倒数固定五拍；燃烧边界让当时仍点燃的全部蜡烛同步从烛芯端缩短，单格烛燃尽消失。
    - 缩短腾出的旧烛帽格可通过退焰点火点燃刚刚外露的另一根烛芯。
    - 玩家死亡后不能胜利；无效输入不是 runtime edge，也不推进倒数。
  win_condition: 玩家存活，并在完整回合结算后点亮全部火盆。
  object_and_event_semantics:
    - 蜡烛是有朝向、长度、点燃状态的刚体；烛芯投影在端帽方向外一格，不占实体。
    - 墙和其它烛身都可遮芯；火盆既是实体阻挡，也是点亮后永久存在的火源。
    - 本 brief 的中心事实链涉及逐小步滚动接触、墙灭火、火源复燃、共享边界缩短、退焰点火与同步燃烧。
    - 事件出现只证明机械可达；有效使用、玩家难度、作品身份和审美仍须由正式候选及独立审查支持。
  allowed_mechanisms:
    - basic_candle_manipulation
    - wall_dousing
    - shared_fire_and_reignition
    - body_concealment_and_reexposure
    - retreating_flame_transfer
    - rolling_contact_chain
  allowed_exposure_through: rolling_contact_chain
  tool_boundary:
    - 已实现 runtime adapter、ASCII parser/renderer、solver、完整图、layout analyzer、try-inputs、exposure audit 与 runtime-backed playable。
    - Candle 专属 miner、candidate factory 与 PuzzleScript exporter/checker 未实现。
    - 当前 Explorer 回放只提供局部结构事实；未来正式候选的布局、完整回放、解族、对象责任与 exposure 必须针对当前 exact 重跑。

player_context:
  basic_sokoban_experience_assumed: true
  player_prior:
    - 熟练掌握轴推、侧滚、滚距不增加行动成本、操作位规划、火焰危险和共享倒数计算。
    - 熟练掌握墙体灭火、边界灭火避烧、全灭状态继续倒数、火盆/烛芯复燃和边界复燃立即参与缩短。
    - 熟练掌握烛身遮蔽与未燃重曝、退焰点火、多个蜡烛的同步参与集合。
    - 熟练逐小步读取滚动途中点盆、点火、灭火与先灭后复燃，并能预见终点前事件。
  prerequisite_mechanisms:
    - basic_candle_manipulation
    - wall_dousing
    - shared_fire_and_reignition
    - body_concealment_and_reexposure
    - retreating_flame_transfer
    - rolling_contact_chain
  known_prior_level_refs: []
  prior_authority_ref: prototypes/candle_sokoban/reports/studio_all_mechanics_final_capstone_d4plus_20260725_02/prior_course.yml
  prior_limit: >-
    当前没有获授权为 clean human-reviewed archive 的 Candle 正式前序布局；难度判断以
    人类授权的“全部六个家族及衍生技巧均已掌握”课程位置为准，不把诊断关当课程关。

experience_seed:
  human_seed: >-
    面向全部机制已经掌握的终局熟练玩家，制作一关目标难度 5、最低难度 4 的全新最终挑战；
    优先研究早先空间选择怎样通过滚动接触顺序和共享燃烧边界，在较晚位置生成火源。
  designer_interpretation: >-
    选择首批材料的核心关系，但不选择其固定坐标或死亡 consumer：把一次滚动中“最后接触
    决定末态”视为一次状态写入，再让该状态跨两次共享边界、跨两根蜡烛传递，最终由正常
    胜利链读取。作品关注的是玩家主动编程并延迟读取火焰位置，不是事件展示或机制配额。

