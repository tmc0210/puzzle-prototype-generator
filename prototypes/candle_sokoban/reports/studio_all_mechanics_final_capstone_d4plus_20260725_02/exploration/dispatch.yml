exploration_id: candle_all_mechanics_final_capstone_materials_20260725_02
prototype_id: candle_sokoban
required_skill: sokoban-mechanism-lab
intent: mechanism_explore
publication_scope: task_local
workspace: prototypes/candle_sokoban/reports/studio_all_mechanics_final_capstone_d4plus_20260725_02/exploration
dispatch_prompt: "使用 $sokoban-mechanism-lab，以 mechanism_explore 的 task_local 模式执行本文件。"
experience_seed: >-
  面向已经掌握全部六个机制家族及其衍生计算的终局熟练玩家，从后期知识中任取一个新的
  可运行小结构；优先探索同一共享燃烧边界前后，多个蜡烛的参与集合如何被滚动途中接触、
  主动遮蔽/重曝、复燃与退焰点火共同改写，并让早先的空间选择决定较晚的火源位置。
  只发布局部材料，不规定完整候选、难度、作品身份或 structure family 取舍。
player_prior:
  - 已掌握基础蜡烛轴推、侧滚、火焰危险、共享倒计时、燃烧缩短与多烛同时燃烧。
  - 已掌握墙体遮芯灭火、边界灭火避烧和无燃烛倒计时。
  - 已掌握火盆/烛芯复燃、midcycle 点火与边界点火立即参与缩短。
  - 已掌握烛身遮蔽灭火、移开后的未燃重曝与可逆遮蔽。
  - 已掌握退焰点火及其站位、时序和共享倒计时计算。
  - 已掌握滚动途中逐小步接触、途中点盆/点火/灭火、终点前点最后火盆与先灭后复燃。
allowed_mechanisms:
  - basic_candle_manipulation
  - wall_dousing
  - shared_fire_and_reignition
  - body_concealment_and_reexposure
  - retreating_flame_transfer
  - rolling_contact_chain
allowed_tools:
  - npx tsx src/cli.ts tool-maturity prototypes/candle_sokoban
  - npm run candle:conformance
  - npx tsx src/cli.ts explain-layout prototypes/candle_sokoban <layout-file|-> --id <id> --max-states 300000 --graph-max-states 300000 --write
  - npx tsx src/cli.ts try-inputs prototypes/candle_sokoban <layout-file|-> --id <id> --inputs <input1,input2,...> --write
  - npx tsx src/prototypes/candle_sokoban/exposureAuditCli.ts <layout-file|-> --id <id> --exact-version <exact> --allowed-exposure-through rolling_contact_chain --max-states 300000 --out <report.json>
