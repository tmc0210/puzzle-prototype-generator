  - claim_id: canonical_solve
    claim: 规范 28 输入 replay 全部合法，完整回合结算后玩家存活并点亮唯一火盆。
  - claim_id: complete_graph_shape
    claim: >-
      在 maxStates=500000、maxDepth=200、terminalize wins 与 zero-candle losses 的声明预算下，
      完整枚举 11231 个可达状态、36043 条合法边与 2 个胜态；graph status 为 complete。
  - claim_id: solution_family
    claim: >-
      两个 raw winning state 的代表深度为 28 与 30；二者具有同一 guard 终位、同一 writer 核心滚动边、
      同一 bridge→relay→consumer 两次退焰链、五次 consumer 轴推与同一终滚点盆，只含两步调相/推烛分配差异。
  - claim_id: all_wins_required_relation_chain
    claim: >-
      所有胜路都必经 opening guard roll、同一 writer edge 上的 wall douse/source-wick reignition/bridge write、
      bridge 退焰点 relay、relay 退焰点 consumer，以及 consumer 终滚点盆；任一胜路至少五次 consumer 轴推。
  - claim_id: object_participation
    claim: >-
      writer、active source、movable guard、bridge、relay、delayed consumer 与唯一 brazier 都在完整胜解族中承担
      object_participation.yml 声明的具体机械职责；没有已知不参与的主要对象。
  - claim_id: identity_counterfactuals
    claim: >-
      guard 不移动时无胜路；整根删除 guard 得到完整的 12755 状态/5 胜态/最短 26 的退化图；删除核心墙得到
      完整的 29148 状态/2 胜态/最短 28 预燃退化图；删除 active source 得到完整的 64065 状态/0 胜态图；
      baseline 胜路不能绕过 bridge→relay、relay→consumer 或最终 consumer readout。
  - claim_id: no_candle_movement_counterfactual
    claim: 禁用 candle movement 的反事实完整枚举 540 状态且不可解。
  - claim_id: exposure_gate
