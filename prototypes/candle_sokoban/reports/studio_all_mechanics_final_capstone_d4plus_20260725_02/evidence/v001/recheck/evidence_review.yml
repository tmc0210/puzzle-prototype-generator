        brazier@2,1 是 level.yml 中唯一正常目标，两个且仅有的 win node 均由同一 candle#3 终滚 edge
        发出 light_brazier:2,1；object_participation.yml 所列各主要对象均有上述 exact raw evidence。
    limits:
