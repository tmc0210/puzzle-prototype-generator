solution_uniqueness_review:
  declared_result: equivalent_variants_only
  search_scope: complete
  exact_version_match: true
  known_raw_winning_variants:
    - >-
      win_state_index=4308；bfs_depth=28；terminal state 为
      P:3,8|D:0|T:2/5|C:candle#3:3:left:1:3,1|candle#single3:-:up:0:6,6|B:2,1:1。
    - >-
      win_state_index=4939；bfs_depth=30；terminal state 为
      P:3,8|D:0|T:5/5|C:candle#single3:-:up:0:6,6|B:2,1:1。
  equivalence_evidence_basis:
    - >-
      exposure_audit.json 的 complete raw graph 实含 11231 nodes、36043 legal edges 和且仅有
      win node 4308/4939；winning_state_representatives.jsonl 的两条输入链逐步沿 raw edge
      复核后分别精确抵达这两个 terminal win，深度为 28/30，state key 一致。
    - >-
      两条代表均且各一次执行 guard roll_candle:candle#single3:d2、writer
      roll_candle:candle#1:d8、bridge shrink_ignite:candle#2、relay
      shrink_ignite:candle#3、五次 push_axis:candle#3 与同一终局 roll_candle:candle#3:d7；
      guard 终位均为 6,6，目标分配和依赖因果不变。
    - >-
      对 complete raw graph 的 win-reachable 子图逐边复核：160 条 viable edges 中涉及物体移动的
      edge 只包含同一 guard roll（1 条）、同一 writer roll（1 条）、consumer 轴推（10 条，
      分布在相邻相位）与两个终局 consumer roll；不存在其它对象移动、其它 writer edge、其它
      consumer 终滚或其它目标分配。
    - >-
      对 raw graph 独立执行关系避让可达性检查，删除任一 opening guard roll、同一 writer
      灭火/复燃/写入复合 edge、bridge→relay、relay→consumer 或 consumer 终滚点盆 edge 后均
      无 win；有序关系自动机也未发现缺链、乱序或少于五次 consumer 轴推的胜路。
    - prototypes/candle_sokoban/reports/studio_all_mechanics_final_capstone_d4plus_20260725_02/candidate/versions/v001/solution_family_self_check.yml
    - prototypes/candle_sokoban/reports/studio_all_mechanics_final_capstone_d4plus_20260725_02/candidate/versions/v001/required_relations_audit.json
  known_non_equivalent_win_refs: []
  status: supported
  limits:
    - >-
      玩家逻辑类唯一不要求原始输入串唯一；complete graph 中同一逻辑链可含纯走位、完整回返和
      相邻相位内必要步骤分配差异。本结论只支持对象职责、目标分配与依赖因果保持的机械等价，
      不评价玩家体验是否把变体感受为等价。

claims:
  - claim_id: exact_identity_and_normal_win
    claim: >-
      所有 exact artifact 均绑定 candidate=CANDLE_ALL_MECHANICS_FINAL_CAPSTONE_002、version=v001、
      layout digest=07f6b42d7fb8634537083b11acf60fc5ac28b2e38ef84370481f02a1175211ca；
      正式胜利为 all_braziers_lit，燃烧周期为 5。
    status: supported
    evidence_basis:
      - >-
        layout.txt 实算 SHA-256 为 07f6b42d7fb8634537083b11acf60fc5ac28b2e38ef84370481f02a1175211ca；
        level.yml、solve_instance.yml、artifact_manifest.yml 与 exposure_audit.json 的 candidate/version/
        layout identity 一致。
      - >-
        level.yml 声明 win.type=all_braziers_lit 与 global_burn_cycle=5；designer_contract.md、
        mechanic.yml 和 mechanics.ts 对正常胜利、玩家存活、完整回合结算及固定 cycle=5 的定义一致。
      - >-
        frozen exact 的全部允许 artifact 以及三份 mutation layout 的实算哈希均与 artifact_manifest.yml、
        supplement_manifest.yml 和 reproduction.json 记录一致；未读取 manifest 中的禁读叙事 artifact。
    limits: []

  - claim_id: canonical_solve
    claim: 规范 28 输入 replay 全部合法，完整回合结算后玩家存活并点亮唯一火盆。
    status: supported
    evidence_basis:
      - >-
        solve_instance.yml 给出 28 个非空输入；canonical_replay.md 逐步记录 1..28 全部 legal，最终
        D:0、B:2,1:1，并在第 28 步完整 countdown 结算后发出 light_brazier:2,1 与
        win_all_braziers_lit。
      - >-
        同一输入链在 exposure_audit.json raw graph 中从 node 0 逐 action 唯一跟随到 win node 4308；
        输入数、深度、终态 state key 与 winning_state_representatives.jsonl 一致。
    limits: []

  - claim_id: complete_graph_shape
    claim: >-
      在 maxStates=500000、maxDepth=200、terminalize wins 与 zero-candle losses 的声明预算下，
      完整枚举 11231 个可达状态、36043 条合法边与 2 个胜态；graph status 为 complete。
    status: supported
    evidence_basis:
      - >-
        exposure_audit.json 标记 graph.status=complete、reason=null、budget.max_states=500000、
        terminalize_wins=true、terminalize_zero_candle_loss=true；raw_graph 实含 11231 个顺序且 state key
        唯一的 nodes、36043 个顺序且端点均存在的 edges，以及且仅有两个 winning nodes。
      - >-
        graph_analysis.md 独立汇总相同的 complete/11231/36043/2；solve_instance.yml 声明
        max_depth=200。raw graph 实际未设深度截断且 max_observed_depth=64，因此完整覆盖该 200 深度预算。
    limits:
      - actual_depth_cutoff=null；以无深度截断的 complete graph 覆盖声明的 maxDepth=200。

  - claim_id: solution_family
    claim: >-
      两个 raw winning state 的代表深度为 28 与 30；二者具有同一 guard 终位、同一 writer 核心滚动边、
      同一 bridge→relay→consumer 两次退焰链、五次 consumer 轴推与同一终滚点盆，只含两步调相/
      推烛分配差异。
    status: supported
    evidence_basis:
      - >-
        complete raw graph、两个 terminal state 与两条代表路径逐 edge 复核均一致；两条 movement 序列
        完全相同，较长代表只在 writer 后加入 up/down 两步，并把同样五次 consumer 轴推分配到相邻相位。
      - >-
        win-reachable 子图的全部物体移动 edge 只出现该 guard、writer、consumer 的同职责动作；
        required_relations_audit.json 与 solution_family_self_check.yml 的关系字段与 raw graph 重算一致。
    limits:
      - 该 claim 只描述玩家逻辑类的机械等价，不作体验判断。

  - claim_id: all_wins_required_relation_chain
    claim: >-
      所有胜路都必经 opening guard roll、同一 writer edge 上的 wall douse/source-wick reignition/
      bridge write、bridge 退焰点 relay、relay 退焰点 consumer，以及 consumer 终滚点盆；任一胜路至少
      五次 consumer 轴推。
    status: supported
    evidence_basis:
      - >-
        对 exposure_audit.json complete raw graph 逐项删除含目标事件的 edge 并重做从 node 0 到任一
        win node 的可达性：五项关系各自均无 avoiding win。
      - >-
        writer 必经 edge 同时包含 roll_candle:candle#1:d8、extinguish_by_wall:candle#1、
        ignite_from_wick:candle#1:4,5、ignite_from_wick:candle#6:4,7 与
        roll_reignite_after_extinguish:candle#1:d1->d2；完整 win-reaching 子图中该 writer edge 只有一条。
      - >-
        以 guard→writer→shrink_ignite:candle#2→shrink_ignite:candle#3→至少五次
        push_axis:candle#3→终滚点盆的有序自动机遍历 complete graph，未发现未完成该有序链或轴推少于
        五次的 winning path。
    limits: []

  - claim_id: object_participation
    claim: >-
      writer、active source、movable guard、bridge、relay、delayed consumer 与唯一 brazier 都在完整胜解族中
      承担 object_participation.yml 声明的具体机械职责；没有已知不参与的主要对象。
    status: supported
    evidence_basis:
      - >-
        complete win-reaching 子图中唯一可胜物体移动集合为 guard 准备滚、writer 复合滚、consumer 五次轴推
        与终滚；所有胜路还必经 candle#6→candle#2 与 candle#2→candle#3 的两次 shrink_ignite。
      - >-
        writer 必经复合 edge 的 source-wick 坐标与 candle#5 职责一致；active_source_removed complete graph
