    status: supported
    evidence_basis:
      - >-
        独立 replay 中一推 d3 与两推 d4 都出现 extinguish_by_wall:candle#1、
        ignite_from_brazier:candle#1:6,5 与 shrink_ignite:candle#2；输出分别为 lit len2
        cells=(7,7)(7,6) 与 cells=(7,8)(7,7)。
      - >-
        在 complete baseline 图上反向标记 win-reachable：一推输出 state index 2243 不在集合内且
        distanceToWin=null；两推输出 state index 2348 在集合内且 shortest_remaining=7。
      - 独立最小事件计数审计得到任一胜路 push_axis:candle#2 的最小次数为 2。
    limits: []

  - claim_id: whole_region_deletion_changes_early_equivalence
    claim: >-
      删除左下读出区并在 (6,3) 放置 audit-only 未亮火盆、仍使用 all_braziers_lit 后，完整图为
      30117 states/81972 edges/25 wins；一推与两推历史都正常胜，因而改变早期正确选择/输出等价类，
      不是同一唯一前缀单纯提前胜。
    status: supported
    evidence_basis:
      - >-
        suffix_deleted_redirected.txt 实际移除 (2,7) 终盆及左下 y7/y8 读出带，并在 (6,3) 设置 o；
        parser 仍使用 mechanic 的 all_braziers_lit。
      - >-
        独立重枚举得到 complete 30117 states / 81972 edges / 25 raw wins；一推 d3 历史和两推 d4
        历史的终步都直接产生 light_brazier:6,3 与 win_all_braziers_lit。
      - >-
        baseline 中一推局部成功输出已由 complete 图证明不可达任何胜态，而 deletion 版该一推历史成为
        正常胜路；因此新增的是原先被下游排除的早期选择类，不可能只是原唯一两推胜前缀提前终止。
    limits:
      - 此反事实只证明机械分类改变，不评价删除区的体验价值。

  - claim_id: all_wins_required_relation_chain
    claim: >-
      所有胜路均需要 writer d4 同滚墙灭/复燃、退焰点亮 relay、relay 第二边界成为 y8 单格并以 d6
      左滚点亮终盆；全胜路至少两次 relay 轴推。
    status: supported
    evidence_basis:
      - >-
        在 complete baseline 图上逐项删除含目标事件的边后均无法到达胜态：同滚墙灭+火盆复燃、
        writer d4、shrink_ignite:candle#2、shrink:candle#2:len1、d6+light_brazier:2,7 全部为 required。
      - 最小事件计数得到 relay_axis_pushes=2、writer d4=1、relay d6=1。
    limits:
      - 事件组必要性按完整图边事件解释，不把唯一 win state 数量误当作事件路径证明。

  - claim_id: identity_counterfactuals
    claim: >-
      移除 (6,4) writer 墙后完整图 92870/263031/2，规范解仍胜但写入链事件消失；移除 (6,5)
      复燃火盆后完整图 220398/622728/0。
    status: supported
    evidence_basis:
      - >-
        独立重枚举 no_writer_wall.txt 得到 complete 92870 states / 263031 edges / 2 wins；22 输入仍正常胜，
        且 extinguish_by_wall:candle#1、ignite_from_brazier:candle#1:6,5、
        roll_reignite_after_extinguish 均缺席。
      - >-
        独立重枚举 no_reignite_source.txt 得到 complete 220398 states / 622728 edges / 0 wins。
    limits:
      - 只支持这些对象与声明事件链的机械关系，不作作品质量判断。

  - claim_id: exposure_gate
    claim: >-
      allowed_exposure_through=rolling_contact_chain；audit 绑定当前 exact，graph complete、verdict pass、
      forbidden_hits=0，raw graph 为 98961 nodes/276326 edges。
    status: supported
    evidence_basis:
      - >-
        exposure_audit.json 的 exact_version=v005、layout_sha256=e898...fda4、
        sequence_sha256=32bf...f00c 均与当前文件实算值一致。
      - >-
        该 audit 记录 allowed_exposure_through=rolling_contact_chain、verdict=pass、graph.status=complete、
        forbidden_hits=[]、raw_graph nodes=98961/edges=276326。
    limits:
      - rolling_contact_chain 是当前序列最后一支，forbidden_branches 为空；该 pass 不证明事件必经或质量。

  - claim_id: object_participation
    claim: >-
      两根蜡烛、两个火盆、(6,4) 墙与 (8,7) timing-lock 墙均承担声明机械职责；不存在第三 consumer
      或独立右翼对象。
    status: supported
    evidence_basis:
      - >-
        layout 与 runtime state 只有 candle#1、candle#2、(6,5)/(2,7) 两火盆；全部胜路必要性与
        no-source/no-writer-wall 反事实分别绑定两蜡烛、两火盆和 (6,4) 墙的职责。
      - >-
        reviewer 独立移除 (8,7) 墙后，完整图的 win-reachable 子图由 131 states/286 edges 扩大为
        153 states/357 edges，状态键与边签名集合均改变，证明其确实约束可胜路线/时机空间。
      - frozen layout 不含第三蜡烛、第三火盆或独立右翼 consumer。
    limits:
      - >-
        (8,7) 墙不是 per-object necessity：删除后仍有 2 个同键胜态、最短深度仍为 22，且核心事件链
