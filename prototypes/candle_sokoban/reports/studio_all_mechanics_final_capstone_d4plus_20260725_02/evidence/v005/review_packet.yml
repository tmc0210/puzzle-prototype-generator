mechanical_claims:
  - claim_id: exact_identity_and_normal_win
    claim: >-
      所有 exact artifact 均绑定 candidate=CANDLE_ALL_MECHANICS_FINAL_CAPSTONE_002、version=v005、
      layout digest=e898...fda4；正式胜利为 all_braziers_lit，燃烧周期为 5。
  - claim_id: canonical_solve
    claim: >-
      规范 22 输入 replay 全部合法；完整回合结算后玩家存活且两个火盆全部点亮。胜路包含 candle#2
      两次下推、candle#1 d4 下滚、同滚墙灭后由 (6,5) 火盆复燃、退焰点亮 candle#2、candle#2
      再缩为单格并 d6 左滚点亮 (2,7)。
  - claim_id: complete_graph_shape
    claim: >-
      在 maxStates=300000、maxDepth=200 的声明预算下，完整枚举 98961 个可达状态、276326 条合法边、
      2 个 raw winning state；max observed depth=79，graph status=complete，未命中预算边界。
  - claim_id: solution_family
    claim: >-
      两个 raw winning state 的 BFS 代表深度为 22 与 24；二者都含至少两次 candle#2 轴推、同一
      candle#1 d4 墙灭/火盆复燃/退焰转移、同一 candle#2 第二边界与 d6 终滚，差异只在开场可逆
      调相分配，未发现非等价胜解族。
  - claim_id: downstream_selects_between_two_local_successes
    claim: >-
      一推 candle#2 的历史以 candle#1 d3 同样完成墙灭、火盆复燃与 shrink_ignite，输出 lit len2
      relay=(7,7)(7,6)，但在完整 exact 中不可达胜；两推历史以 d4 完成同组局部事件，输出
      relay=(7,8)(7,7)，可达胜且最短剩余 7 输入。完整胜路最少需要两次 candle#2 轴推。
  - claim_id: whole_region_deletion_changes_early_equivalence
    claim: >-
      删除左下终盆、其 y7 火焰行、y8 横滚通道与左端点，并在 writer 公共轨道 (6,3) 设置 audit-only
      未亮火盆、仍用 all_braziers_lit 后，完整图为 30117 states/81972 edges/25 wins；一推 d3 与两推
      d4 历史都能正常胜利。因完整 exact 只接受两推，这一反事实改变了早期正确选择集合与输出等价类，
      不是让同一个唯一前缀单纯提前胜利。
  - claim_id: all_wins_required_relation_chain
    claim: >-
      所有胜路均需要 candle#1 d4 同滚墙灭后复燃、随后退焰点亮 candle#2、candle#2 再经边界缩成
      y8 单格并以 d6 左滚点亮终盆；全胜路最少包含两次 candle#2 轴推。
  - claim_id: identity_counterfactuals
    claim: >-
      移除 (6,4) writer 灭火墙后完整图为 92870 states/263031 edges/2 wins，规范输入仍胜但墙灭、火盆
      复燃与同滚再燃事件消失；移除 (6,5) 复燃火盆后完整图为 220398/622728/0。
  - claim_id: exposure_gate
    claim: >-
      当前 exact 的 allowed_exposure_through=rolling_contact_chain；exposure audit 绑定当前 layout，
      graph complete、verdict pass、forbidden_hits=0，raw graph 为 98961 nodes/276326 edges。
  - claim_id: object_participation
    claim: >-
      两根蜡烛、两个火盆、(6,4) 墙与 (8,7) timing-lock 墙均在全部胜路或作品身份反事实中承担声明职责；
      无仅用于展示动画的第三 consumer 或独立右翼对象。

solution_uniqueness_claim:
  extracted_by: Controller 从 Designer submission packet 仅提取机械 uniqueness 字段
  result: equivalent_variants_only
  search_scope: complete
  search_budget: maxStates=300000; maxDepth=200
  known_raw_winning_variants:
    - win_state_index=9220; bfs_depth=22
    - win_state_index=11959; bfs_depth=24
  equivalence_account: >-
    两个胜态使用同一二推写入、writer d4 接触链、退焰转移、relay 第二边界和 d6 终滚；较长代表只把
    第二次轴推跨到 writer 第一次缩短之后，早期写入值、对象位置计划、接触顺序和目标分配不变。
  evidence_limits:
    - 完整图和全胜路必要关系支持机械胜族；“两种调相在人类体验上等价”仍不属于硬证据审查。

