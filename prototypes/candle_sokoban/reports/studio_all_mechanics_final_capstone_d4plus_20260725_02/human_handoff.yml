  player_experience: >-
    玩家开场把 relay 下推一格或两格，写入未来的纵坐标。两种写入都能让 writer 在 d3/d4 下滚时
    先被墙熄灭、再由火盆复燃，并在下一燃烧边界以退焰点亮 relay，局部反馈故意同为成功；但较晚
    终盆要求 relay 再缩成 y8 单格后，以 y7 火焰行左滚点盆，因此只接受两推输出。答案不是在局部
    动画中给出，而是由最后读出反向传回开场选择。
  known_risks:
    - 两个主要位移由墙体终点强力收束；识别长时序关系后，后续执行分支较少。
    - 最后两步接近纯读出，不再提出新子题；价值在于兑现此前停放、退焰和同步燃烧共同准备的状态。
    - 完整图有深度 22 与 24 两个机械等价的开场调相代表，不是逐输入唯一。
    - fresh Critic 未能确认目标难度 5，但也没有证据低于最低难度 4；最终难度交给真人试玩。
    - delivery v006 只裁去最右侧一列纯外墙；全部保留坐标、完整状态/边图和机制事件与 reviewed v005 相同。
  anti_stitching_evidence: >-
    完整 exact 中，一推 d3 与两推 d4 都完成墙灭—复燃—shrink_ignite 的局部成功链，但仅两推输出
    可达胜；删除整个左下读出区并仍用 all_braziers_lit 重定向后，两种历史才都能胜。后段因此改变
    前段正确选择集合与输出等价类，不是消费唯一既成状态的可拆尾关。
