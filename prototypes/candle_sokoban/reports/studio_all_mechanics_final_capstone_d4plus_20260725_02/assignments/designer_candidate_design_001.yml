design_brief: >-
  在同一连续 Design Studio 工作台中完成唯一全新最终高难单关。体验核心与作品身份以当前
  experience_brief 为准：玩家必须通过较早的滚动接触顺序写入点燃末态，使它跨第一燃烧边界
  退焰传给第二根烛、跨第二边界形成较晚火源，并由正常 all_braziers_lit 胜利链直接读取。
  目标难度 5，最低不得低于 4；全部六个机制家族及衍生计算都是玩家先验，但机制没有使用配额。
  难度必须来自对同一延迟火源关系的非局部预见、构造与消费，不得靠旧 Candle 布局、重复 witness、
  地图膨胀、目标硬化或纯腾挪税。持续修改工作布局并亲自读取实际 replay/diagnostics；只有完整作品、
  正常胜利、解族自查、对象责任、作品身份和 strict exposure gate 同时成立时，才发布首个不可变 exact。
