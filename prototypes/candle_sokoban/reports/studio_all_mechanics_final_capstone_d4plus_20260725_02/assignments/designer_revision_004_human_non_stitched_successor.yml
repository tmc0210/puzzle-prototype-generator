design_brief: >-
  人类已把 delivery v004 退回同一候选：中央 gate 火盆右侧的 consumer 翼可以整体删除，而前 19 步
  动作和事件完全不变；同一个第 20 步 right 会直接胜利，完整删翼反事实最短仅 19 步。这证明右翼
  只是消费唯一既成状态的拼接尾段，没有把任何约束反向传回前段。保留 experience brief 中“主动
  写入并延迟读取火焰位置”的核心，不保留 v004 几何或现有 family。新后继必须参与同一个谜题：
  它要筛选前段至少两种眼前都能完成局部核心动作的输出状态，或以同等强度使早期正确选择依赖
  后继需求；删除后继并把正常胜利收束到中段时，早期正确选择、解族或核心完成状态等价关系必须
  发生实质变化，不能只让同一前缀提前胜利。必须对大块 proper suffix / region 做实际删除耦合审计，
  不能用对象必经事件、更多动画、机制数量或地图长度替代。目标难度 5、最低难度 4；允许彻底重构
  structure family。持续使用唯一 workbench，亲自读取实际 replay/diagnostics；全部非拼接、正常胜利、
  解族、对象责任、作品身份和 strict exposure 同时成立后，才发布下一个不可变 exact 与送审包。
