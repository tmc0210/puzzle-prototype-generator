required_outputs:
  - 维护新的难度 5 reasoning sketch，明确哪一个较晚需求会筛选较早的多个局部成功输出状态。
  - 在唯一工作布局上持续制作、实跑与结构修订；不得把 v004 的右翼换皮或继续延长。
  - >-
    产出 downstream_coupling_audit：列出前段至少两个局部成功但全局命运不同的输出状态、后继读取的
    具体差异，以及删除后继/重定向正常胜利后早期选择或解族怎样实质变化。
  - >-
    产出 whole-region / suffix deletion audit：针对视觉或流程上可识别的大块后继，验证不存在
    “同一核心前缀完全不变、只提前胜利”的可拆卸 proper suffix。
  - >-
    发布下一个可送审 exact：layout、level/solve instance、canonical inputs、结构化 replay、完整图或
    预算边界、解族自查、exposure audit、对象参与、身份反事实、玩家侧重读与 artifact manifest。
  - >-
    为新 exact 填写完整 submission packet；存在拼接后继、已知非等价胜解、正常胜利不成立、
    作品身份失败或 exposure 非 complete/pass 时不得送审，也不得写 Controller 状态或全局待玩文件。
