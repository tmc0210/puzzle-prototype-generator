design_brief: >-
  人类已把 delivery v002 退回同一候选：writer 之后的右下 candle#6 → candle#2 → candle#3
  主要靠普通走步跨边界自动 shrink_ignite，除最终 consumer 搬运外没有相称的玩家主动操作，属于
  “一大串毫无意义的动画”。这不是局部清理，而是同一候选的结构性返工。保留 experience brief
  中玩家主动写入、跨边界传递和较晚读取的作品核心，不保留旧几何或旧对象链。writer 之后至少
  两个关键下游状态转换必须由玩家通过有意义的对象操作、位置选择或时序选择主动构造或触发，
  且错误选择须真实改变后续几何、参与集合或可解性；普通步行倒数与最终 consumer 的单独搬运均
  不足以充当主动接力。可优先变形 batch_002 的“玩家轴推 relay 同时写入滚动停块与退焰接收位”
  材料；若缺少非死亡 consumer 或第二个主动中继，可在 task-local requests 下提交抽象探索请求。
  目标难度 5、最低难度 4；机制无使用配额，宁可删除被动对象，也不要追求事件数量。持续修改唯一
  workbench，亲自读取实际 replay/diagnostics；完整作品、主动性审计、正常胜利、解族自查、对象责任、
  作品身份与 strict exposure gate 同时成立后，才发布下一个不可变 exact 与送审包。
