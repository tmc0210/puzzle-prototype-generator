required_outputs:
  - 维护同一候选的难度 5 reasoning sketch；明确玩家关系怎样取代 v002 的被动右下链。
  - 在唯一工作布局上持续制作、实跑和结构修订；不得把 v002 的坐标、对象数量或事件覆盖当作保留目标。
  - >-
    产出主动性审计：逐项标出 writer 之后至少两个关键状态转换对应的玩家对象操作/位置或时序选择、
    错误选择的可见后果，以及它如何把约束反向传回较早准备；普通 walk/countdown 不计。
  - >-
    发布下一个可送审 exact：layout、level/solve instance、canonical inputs、逐步结构化 replay、完整图或
    预算边界、解族自查、exposure audit、对象参与、身份反事实、玩家侧重读与 artifact manifest。
  - >-
    为新 exact 填写完整 submission packet；存在被动动画链、已知非等价胜解、正常胜利不成立、
    作品身份失败或 exposure 非 complete/pass 时不得送审，也不得写 Controller 状态或全局待玩文件。
