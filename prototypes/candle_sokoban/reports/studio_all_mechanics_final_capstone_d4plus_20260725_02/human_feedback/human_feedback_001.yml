schema_version: 1
design_task_id: studio_all_mechanics_final_capstone_d4plus_20260725_02
candidate_id: CANDLE_ALL_MECHANICS_FINAL_CAPSTONE_002
exact_version_seen: v002
feedback_kind: human_playtest_return
human_status: needs_revision

human_feedback:
  - "右下角这一堆机制全是在放动画。"
  - "玩家除了对最终蜡烛的推动，有什么操作是需要主动触发的吗？"
  - "继续修改。现在这个右下角一大串玩意毫无意义。"

controller_mechanical_confirmation:
  winning_family_observation: >-
    v001/v002 的全部胜路中，玩家直接操作的关键蜡烛只有开场 guard、writer 与最终 consumer；
    右下的 candle#6 和 candle#2 从未被玩家轴推或侧滚。
  passive_chain: >-
    writer 写入之后，candle#6 与 candle#2 只在普通步行推进的共享边界上自动发生 shrink、
    shrink_ignite 与 burn_out；玩家没有为它们选择位置、操作方向或触发方式。
  consequence: >-
    因而右下链条虽然产生了多个真实 runtime 事件，却没有形成相称的玩家决策；除最终 consumer
    搬运外，它主要是一段确定性的倒数动画，未兑现 experience brief 中“玩家主动编程并延迟读取火焰位置”的承诺。

required_response:
  revision_scope: structural_revision_same_candidate
  preserve:
    - 原 experience brief 的玩家主动写入、跨边界传递与较晚读取关系。
    - 目标难度 5、最低难度 4，以及玩家已掌握全部前序机制的课程位置。
  replace:
    - 被动的右下 candle#6 → candle#2 → candle#3 自动接力结构。
    - 只靠普通步行推进倒数、看事件自动播放的中段。
  acceptance_boundary:
    - writer 之后至少两个关键下游状态转换必须由玩家主动构造或触发。
    - 每个主动转换都必须包含有意义的对象操作、位置选择或时序选择；任意普通走步不计入。
    - 错误选择必须真实改变后续几何、参与集合或可解性，不能只有事件文本或动画差异。
    - 只在末尾推动最终 consumer 不足以满足主动接力要求。
    - 机制没有使用配额；宁可删掉被动对象，也不要用更多事件掩盖无决策链条。
