schema_version: 1
prototype_id: candle_sokoban
course_position: final_all_mechanics_exposed
ordered_prior_level_refs: []
human_authorized_player_prior:
  source: 当前任务人类输入
  statement: >-
    玩家已经掌握游戏全部前序机制、各机制衍生的技巧与计算；本关位于机制全部暴露后的
    最终高难位置，允许并鼓励复杂组合。
assumed_mastery:
  - branch: basic_candle_manipulation
    techniques:
      - 轴推、侧滚与操作位规划
      - 滚动距离不增加行动成本
      - 火焰危险、共享倒计时、燃烧缩短和多烛同时燃烧
  - branch: wall_dousing
    techniques:
      - 墙体遮芯灭火
      - 边界灭火避开当轮燃烧
      - 全灭状态继续推进共享倒计时
  - branch: shared_fire_and_reignition
    techniques:
      - 火盆与烛芯共享火焰
      - 中途复燃不重置倒计时
      - 边界复燃立即参与缩短
  - branch: body_concealment_and_reexposure
    techniques:
      - 烛身主动遮蔽灭火
      - 移开遮蔽物后的未燃重曝
      - 可逆遮蔽的先后关系
  - branch: retreating_flame_transfer
    techniques:
      - 缩短腾空旧端帽格触发退焰点火
      - 受火烛芯的外露位置与共享相位计算
  - branch: rolling_contact_chain
    techniques:
      - 逐小步读取滚动途中接触
      - 同次滚动途中点盆、点火、灭火和先灭后复燃
      - 终点前点亮最后火盆
calibration_limit: >-
  Candle 当前没有获授权为 clean human-reviewed archive 的正式前序课程布局；本文件完整表达
  人类授权的课程位置与玩家先验，不把 runtime 诊断关、旧 Candle 报告或既有待玩关伪装成前序课程。
