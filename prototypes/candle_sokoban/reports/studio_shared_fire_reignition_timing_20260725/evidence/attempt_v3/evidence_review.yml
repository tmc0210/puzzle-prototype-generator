  - claim_id: terminal_object_participation
    claim: "canonical 与四条代表胜路中可观察到 C1/C2 的不同终端责任：C2 点亮右目标后燃尽，C1 最终点亮左目标并保留；删除 C2 或共享复燃源会使对应反事实无胜解。"
