    limits:
      - "这只是否定所声明 required flags 的 bypass，不等同于唯一逻辑解，也不否定四个非等价 milestone signatures。"

  - claim_id: exposure_later_event_absence
    claim: "allowed_exposure_through=shared_fire_and_reignition 的当前 exact exposure audit 通过；完整可达图的 forbidden_hits 为空，后三个 branch 的 later events 未命中。"
    status: supported
    evidence_basis:
