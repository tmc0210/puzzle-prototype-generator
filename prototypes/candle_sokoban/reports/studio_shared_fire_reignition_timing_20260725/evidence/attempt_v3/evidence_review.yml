      - "exposure_audit.json exposure_gate.allowed_exposure_through=shared_fire_and_reignition，forbidden_branches 为后三家族"
      - "exposure_audit.json graph.status=complete，verdict=pass，forbidden_hits=[]，raw_graph.nodes=11643、edges=31793"
      - "独立 raw edge 扫描中 8 个 forbidden event pattern 命中数为 0"
