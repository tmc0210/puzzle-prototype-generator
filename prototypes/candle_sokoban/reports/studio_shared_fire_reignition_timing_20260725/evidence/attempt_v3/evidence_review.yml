  - claim_id: normal_win
    claim: "canonical replay 非空且 24 步均标记 legal=true；最终玩家存活、全部火盆点亮，并由 all_braziers_lit 胜利。"
    status: supported
    evidence_basis:
      - "solve_instance.yml input_count=24、complete=true、win=true、final_state 中 D:0 且三个 brazier 均为 1"
      - "canonical_replay.json replay.completed=true、executedSteps=24、legalThroughStep=24、final.isWin=true"
