      - "exposure_audit.json graph.status=complete，raw_graph.nodes=11643，raw_graph.edges=31793"
      - "独立只读校验：节点/边索引唯一、节点键唯一、端点合法、11643 个节点全部从节点 0 可达、5 个胜态均无出边"
      - "raw graph 的各事件模式计数与 exposure_audit.json reachable_event_counts 逐项一致"
