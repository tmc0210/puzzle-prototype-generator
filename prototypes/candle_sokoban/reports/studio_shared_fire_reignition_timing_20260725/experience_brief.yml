design_task_id: candle_shared_fire_reignition_timing_20260725

prototype_context:
  confirmed_rules:
    - 每次合法行动推进 global_burn_cycle=5 的共享倒计时；倒计时从 1 进入边界时，所有当时已燃蜡烛同时从烛芯端缩短一格。
    - 蜡烛可沿轴推动，也可从侧面滚动到下一次被阻挡的位置；滚动仍只消耗一次行动。
    - 墙体遮住已燃烛芯时立即灭火；灭火不会暂停共享倒计时，且边界时已熄灭蜡烛避开本次缩短。
    - 已点亮火盆和外露已燃烛芯都能点燃外露未燃烛芯；点火不重置倒计时。
    - 在倒计时边界发生的复燃会让该蜡烛立即参加本次缩短；中周期复燃则等待下一次边界。
    - 玩家进入外露火焰会死亡；正式候选必须保持玩家存活并在完整结算后点亮全部火盆。
    - 无效输入不产生合法 runtime edge，也不推进倒计时。
  win_condition: 玩家存活，并在完整回合结算后点亮全部火盆；不得使用 event_occurs 胜利条件。
  object_and_event_semantics:
    - wall 是实体墙与 wick_concealer；candle 是多格、刚性、可推动、可滚动、投影烛芯且可燃对象。
    - brazier 点亮后永久成为火源；wick_projection 非实体但可重叠，并在已燃时成为火源。
    - 当前 exact 允许的事件族止于 basic_candle_manipulation、wall_dousing、shared_fire_and_reignition。
    - 当前 exact 禁止 body_concealment_and_reexposure、retreating_flame_transfer、rolling_contact_chain 的事件。
  allowed_mechanisms:
    - basic_candle_manipulation
    - wall_dousing
    - shared_fire_and_reignition
  tool_boundary:
    - runtime adapter、ASCII parser/renderer、solver、complete reachable graph、layout analyzer
    - try-inputs、explain-layout、exposure-audit
    - Candle 没有专属 miner 或 PuzzleScript exporter；不以其它原型工具替代 runtime 事实。

player_context:
  basic_sokoban_experience_assumed: true
  player_prior:
    - 玩家已掌握 basic_candle_manipulation 及其滚动、燃烧、玩家死亡和共享倒计时计算。
    - 玩家已掌握 wall_dousing，理解墙灭火不停止倒计时，以及边界灭火可避开本次缩短。
    - 玩家已掌握 shared_fire_and_reignition 及此前机制的衍生技巧和计算。
  prerequisite_mechanisms:
    - basic_candle_manipulation
    - wall_dousing
    - shared_fire_and_reignition
  known_prior_level_refs: []

experience_seed:
  human_seed: 玩家需要通过分析主动使用墙灭火和重燃机制来控制蜡烛的参与倒数时机。

