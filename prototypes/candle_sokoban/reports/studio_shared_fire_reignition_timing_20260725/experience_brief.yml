experience_core:
  experience_statement: 玩家先把四格主蜡烛送进左侧墙口并让它熄灭，使它跨过共享倒数边界而保留原长；右侧多格蜡烛在早段和复燃后的边界持续收缩，随后玩家在中周期 t2 从左侧已亮火盆复燃主蜡烛，主动让两根蜡烛重新加入下一次缩短。复燃后的两个边界分别改变 C1/C2 长度、下方 staging 的可达位置和右侧 wick 责任，玩家先用 C2 点亮右火盆，再用继续缩短到单格的 C1 点亮左火盆。
  visible_setup: 紧凑空间中可见一根四格左烛芯主蜡烛、右侧四格亮蜡烛、左侧已亮共享火盆、上方两个待点火火盆和一枚遮住主蜡烛左烛芯的墙口；C2 的收缩方向、两个目标 wick、下方 staging 与五拍相位都应从开局几何中读出。
  player_action: 玩家必须先主动向下推入墙口灭火，再向右进入 C2 的边界轨道并绕到主蜡烛下方；不能把熄灭后的原长当成自动保存，而要在倒数降到中周期 t2 时向上回滚，从已亮火盆复燃 C1。此后玩家沿下方 staging 走位，使第一、第二个复燃后边界分别消费 C1/C2；C2 收到单格后从下方点亮右火盆，随后玩家回收 C1 的单格位置并点亮左火盆。
  visible_payoff: 玩家看到 C1 先在墙口内保持原长，C2 在早段收缩；t2 复燃后两个连续边界同时重写两根蜡烛长度与玩家站位，C2 的单格 wick 先点亮右火盆，之后 C1 的单格 wick 点亮左火盆，说明玩家控制的是参与倒数的时机，而非单纯走到终点。
  why_level_exists: 让玩家把已知的墙灭火和共享火焰从被动规则提升为主动时机工具；这关只保留一条紧凑的“保长—中周期复燃—逐拍消耗—终端点火”因果链，使倒数相位、火源来源、墙口和最终烛芯共同构成独立体验。
  core_boundary:
    central_objects:
      - 需要被墙口保留长度、按中周期复燃并逐边界消耗的四格主蜡烛
      - 在早段和复燃后边界持续收缩、在单格状态承担右侧目标火盆责任的多格蜡烛
      - 精确遮住主蜡烛左烛芯的单格墙口与两侧操作位
      - 负责第一次复燃和最终点火反馈的已点亮火盆与待点火火盆
      - 共享 global_burn_cycle 与边界参与集合
    supporting_objects:
      - 仅用于形成紧凑玩家可达性的外围墙
      - 玩家安全走位所需的最小地面缓冲
      - 下方 staging 作为复燃后边界之间的最小安全走位，不承担独立机制

work_identity:
  conditions:
    - 主蜡烛必须主动进入墙口并熄灭，且在熄灭期间跨过至少一次共享倒数边界而不缩短，保住墙口前的四格长度。
    - 主蜡烛必须在墙灭火后于中周期 t2 从已亮火盆复燃，并参加紧接着的边界缩短；不执行这次复燃不能复现同一终局。
    - 右侧多格蜡烛必须参加早段及复燃后的边界消费，并在 len1 状态从下方点亮右侧目标火盆；它不引入后续机制分支。
    - 规范解必须消费主蜡烛的 4→3→2→1 三次缩短；复燃后的前两个边界必须分别改变两根蜡烛的长度、玩家可达位置或下一操作责任。
    - 主蜡烛最终 len1 wick 必须点亮左侧目标火盆；两个目标火盆共同消费墙灭火与 t2 复燃留下的长度和火源关系。
    - 终局必须消费由墙灭火与中周期复燃留下的蜡烛长度、火源位置和操作位；高潮后不得另起独立子题。
  counterfactuals:
    - 若把墙口向右错开，主蜡烛不会在第一步得到“熄灭但保长”的状态，规范复燃相位与后续三次缩短关系消失。
    - 若把复燃改为边界复燃，主蜡烛会立即参加该边界，后续终局所需的 4→3→2→1 窗口不再与规范解相同。
    - 若删去已亮火盆或把它改成未亮，墙灭火后没有规范的中周期复燃来源；若删去墙口，主蜡烛无法保留初始长度，作品身份消失。
    - 若删去右侧亮单格，首边界不再改变中段责任，前段的玩家因果链退化为纯走位。
    - 若删去任一目标火盆，分别会移除 C1 或 C2 的终端消费；若删去 C2，复燃后的第二条责任链与右侧 staging 关系消失。
    - 若把终局改成与前段无关的普通点盆子题，前段保长与复燃相位不再被消费，则构成拼接式机制展示而非本关。

level_brief:
  packaging_intent: complete_single_level
  expected_difficulty: 4
  expected_scale: 紧凑中型封闭图；一根四格主蜡烛、一根四格共享倒数蜡烛、两个目标火盆共用一条短而密的墙口—火源—staging—倒数链，不用大地图填充路线。
  expected_player_load: 玩家需同时记住共享倒数相位、两根蜡烛明灭与剩余长度、t2 复燃窗口、两个边界后的可达位置、C2 右 wick 与 C1 左 wick 的责任；关键选择少但每次都要预见后续参与集合。

