    - exposure audit 必须在完整图上验证 later-event absence；graph.status=complete 且 forbidden_hits 为空。
    - exact、layout digest、replay、图和送审包必须指向同一不可变版本。

human_review_constraints:
  - 不把 Reality Anchor 的难度分、课程位置或规则带入 Candle；目标难度来自当前 brief 的玩家先验和本 exact 的关系。
  - 不以事件覆盖、解数、SCC 数量或工具指标替代玩家侧判断。
  - 送审包只交给 Controller，不组装 Critic packet，不写 review verdict、ledger、levels、queue 或 handoff。
  - 后续只维护 candidate_id=CANDLE_SHARED_FIRE_REIGNITION_TIMING_001，不创建候选数组或第二个候选。
