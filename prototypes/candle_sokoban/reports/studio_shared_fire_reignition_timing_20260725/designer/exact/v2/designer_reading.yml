  preparation: 右移与 C2 的近旁关系把右侧亮单格推入首边界燃尽责任，玩家随后转入下方通道。
  core_reveal: 无亮蜡烛的倒数让玩家在下方通道作短位移，回到左火盆时选择 t2 中周期复燃，而不是等到新的机制分支。
  consumption: 复燃后的每个边界都改变 C1 长度；t2→t1 先收窄，下一边界循环并压缩为 len2，再至 len1，玩家必须持续读位置与终端负担。
  ending: 最后 singleton 的 wick 把同一共享火焰转交给目标火盆和终端接收端，形成可见闭环。
difficulty_reading:
  expected: 4
  counted_reasoning:
