    - 读 C2 的首边界燃尽责任，选择下方通道而不是回到开局回路。
    - 在无亮火倒数中决定回到左火盆的 t2 窗口。
    - 把每次 C1 缩短后的新长度/站位当作下一步终点规划。
  not_counted:
