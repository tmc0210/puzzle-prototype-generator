designer_reading:
  player_facing_criteria:
    - 开局可见的多根蜡烛和火盆必须共同指向“谁在何时参与倒数”，而非只展示火焰事件。
    - 墙灭火应是玩家主动选择的时机工具；若熄灭只是被动接触结果，核心不成立。
    - 重燃后的新状态必须改变后续操作侧、火源关系或燃烧相位，不能只是自动动画。
    - 多对象在前后段继续承担责任，不能出现一段完成后整体退休的独立子题。
    - 目标难度来自预见相位、明灭状态、火源路径和操作位的耦合；不以无意义步行或路线税填充。
  rejection_tests:
    - 删除一根蜡烛或一个火盆后，若“墙灭火—重燃—参与倒数”的时序洞见仍等价，说明对象有冗余。
    - 预先点燃或不执行墙灭火仍能用同一因果顺序获胜，说明主动时机不是身份条件。
    - 前段灭火完成后所有蜡烛退休、后段只是普通点盆，说明发生了拼接式包装。
    - 只增加更长路程、更多重复蜡烛或更晚终局而没有新的玩家关系，属于难度膨胀而非挑战。

calibration_conclusion: >-
  Candle 候选应保持小而密的单一因果链：玩家先识别共享倒数不是自动节拍，而是可由墙体灭火暂停参与、再由
  火盆或外露烛芯重燃来重新安排参与边界；同一根蜡烛和火盆要在这一链条中反复改变责任。跨阶段归档只提供
  “紧凑、主动构造、对象复用、反直觉但可回收”的审美边界，不提供 Candle 的规则、难度或课程证据。
