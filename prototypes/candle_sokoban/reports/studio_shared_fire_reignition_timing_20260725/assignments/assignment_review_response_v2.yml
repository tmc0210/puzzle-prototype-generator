design_brief: >-
  v2 的 fresh Critic 认可墙灭火—t2 复燃—后续边界缩短—终端点火的核心可读，但再次指出中段主要是上下往返的
  重复等待：除一次复燃时机外，已掌握的共享倒计时关系被拉成缺乏新决策的计数动作；相对全部前序更像已知
  关系的时序迁移加简单组合，后半段结构回报不足。请在同一 candidate 内重构，而不是增加步数或微调往返：
  让至少两次复燃后的边界消费分别改变可达区域、对象可用性、火源责任或玩家下一次操作选择，且这些改变
  反向约束更早的墙灭火/复燃计划。所有内容必须仍只使用 basic_candle_manipulation、wall_dousing、
  shared_fire_and_reignition；不暴露 body_concealment_and_reexposure、retreating_flame_transfer 或
  rolling_contact_chain。若当前 family 无法在不制造路线税的情况下承担该关系，可在同一 candidate 内换 structure
  family；完成完整自查后发布 v3，并提供规范化 action、完整 replay、解族、反事实和 exposure artifacts。
