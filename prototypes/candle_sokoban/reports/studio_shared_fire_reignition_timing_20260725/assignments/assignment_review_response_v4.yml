exact_version_basis: v4
design_brief: >-
  Fresh Evidence Reviewer 支持 v4 的全部硬证据；fresh Puzzle Critic 退回同一候选：当前体验把 C2 先完成并燃尽、
  无亮回程、C1 t2 复燃严格串联，C2 燃尽后的倒计时不再产生玩家决策，t2 复燃主要是固定路线的相位结果；
  复燃后的上下移动也偏向等待既定缩短，因此不能确认难度达到 4。请在同一 candidate 内回应这一玩家侧问题，
  不要增加路线税或保留等待段来冒充时序压力。重构为至少两个玩家可读、可主动选择的 timing decisions：墙灭火
  与 shared-fire reignition 的时机必须改变仍可用的对象/可达区域/目标责任/下一次操作选择，并反向约束更早的计划；
  蜡烛存活期间的倒计时要持续制造取舍，而不是只用上下往返消耗拍数。保留体验种子“通过分析主动使用墙灭火和重燃
  控制蜡烛参与倒数时机”，组合尽量多的前序机制，但严格不暴露 body_concealment_and_reexposure、
  retreating_flame_transfer 或 rolling_contact_chain。完整图必须仍只支持一个逻辑里程碑签名（或明确的等价站位变体），
  canonical replay 必须逐步 eventWin 一致；完成 exposure、反事实和玩家侧自查后发布 v5，或在确实无法形成有意义
  timing experience 时 withdraw_exact，但不得创建第二 candidate。
