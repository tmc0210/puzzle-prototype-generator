schema_version: 1
prototype_id: candle_sokoban
course_position: shared_fire_and_reignition
ordered_prior_level_refs: []
human_authorized_player_prior:
  source: 当前任务人类输入
  statement: >-
    玩家已经掌握游戏中所有前序机制和各机制衍生的技巧和计算；本关至少要求
    wall_dousing，并把 shared_fire_and_reignition 作为当前目标机制家族。
assumed_mastery:
  - branch: basic_candle_manipulation
    techniques:
      - 轴推与侧滚的操作位规划
      - 滚动距离不增加行动成本
      - 共享倒计时与燃烧缩短计算
      - 多根已燃蜡烛同时缩短
  - branch: wall_dousing
    techniques:
      - 墙体遮芯灭火
      - 边界灭火避开当轮燃烧
      - 全灭状态继续推进共享倒计时
target_branch: shared_fire_and_reignition
target_difficulty: 4
minimum_acceptable_difficulty: 4
calibration_limit: >-
  Candle 当前没有可授权为 clean human-reviewed archive 的正式前序课程布局；
  目标难度只依据人类明确的课程位置与前序掌握，不把 runtime 诊断关或旧 Candle
  报告伪装成阶段样本。
