design_brief: >-
  这是 candle_sokoban 的特定原型单关设计任务。体验种子是：玩家需要通过分析主动使用
  墙灭火和重燃机制来控制蜡烛的参与倒数时机。目标暴露到 shared_fire_and_reignition；
  玩家已掌握全部前序机制、技巧和计算；目标难度至少为 4，并鼓励复杂但有因果复用的前序
  机制组合。先独立完成 clean archive 校准；Explorer 首批 task-local 材料发布后再固定体验
  核心、作品身份和唯一候选方向。
