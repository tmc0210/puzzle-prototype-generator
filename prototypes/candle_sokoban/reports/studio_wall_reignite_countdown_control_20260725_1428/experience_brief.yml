prototype_context:
  confirmed_rules:
    - 每次合法走动、轴推或侧滚只推进一次全局倒数；global_burn_cycle 固定为 5。
    - 已燃烛芯被墙遮住时立即灭火；灭火后共享倒数继续推进，若跨过 t1 边界则该蜡烛保持当前长度。
    - 已点亮火盆和外露已燃烛芯都能在同格烛芯接触时复燃未燃蜡烛；复燃不重置倒数。
    - t1 边界行动中发生的复燃会参加同一轮缩短；正常胜利必须在完整结算后由存活玩家点亮全部火盆。
    - 初始局面不得依赖静默点火、灭火或点盆；无效输入不推进倒数。
  win_condition: all_braziers_lit_and_player_alive_after_full_turn_settlement
  object_and_event_semantics:
    - 横向/纵向刚性多格蜡烛可沿轴推一格，侧滚到下一阻挡位置；烛芯投影不占实体格。
    - 墙只承担实体阻挡与烛芯遮蔽；火盆是永久火源，已燃烛芯是可移动火源。
    - 目标暴露到 shared_fire_and_reignition，允许 basic_candle_manipulation 与 wall_dousing 的自然前序事件。
  allowed_mechanisms:
    - basic_candle_manipulation
    - wall_dousing
    - shared_fire_and_reignition
  tool_boundary:
    - runtime adapter / ASCII parser / renderer
    - solver、逐步 replay、完整 reachable graph
    - Candle exposure audit
    - task-local Designer 诊断脚本；不使用 Candle-specific miner、PuzzleScript exporter/checker 或旧 levels.yml

player_context:
  basic_sokoban_experience_assumed: true
  player_prior:
    - 玩家已经掌握所有前序机制、技巧和倒数计算。
    - 玩家能够读取全图、识别显然的可达性、站位、轴推与侧滚操作面。
  prerequisite_mechanisms:
    - basic_candle_manipulation：轴推、侧滚、全局倒数、同时缩短、火焰致死。
    - wall_dousing：主动把燃烧蜡烛的烛芯送入墙面灭火，并理解灭火后倒数仍继续。
  known_prior_level_refs: []

experience_seed:
  human_seed: 玩家需要通过分析主动使用墙灭火和重燃机制来控制蜡烛的参与倒数时机。

