experience_core:
  experience_statement: 玩家亲自把一根正在燃烧、看似必须赶紧使用的蜡烛推入同一面墙使其熄灭，主动把它从本轮燃烧中保存下来；随后利用仍在流逝的共享倒数，把另一根蜡烛送进同格火源复燃，并在下一次 t1 边界前决定再次让墙面暂停哪一根、何时让同一组火源重新接上。玩家最终发现墙不是一次性灭火按钮，而是反复改写蜡烛参与倒数时机的“闸门”。
  visible_setup: 开局把同一面有缺口的墙、两条可被墙边停位的蜡烛、一个已点亮火盆和一条可移动的燃烧火源放在同一读图关系中；火盆与外露烛芯的同格/错列差异可见但不能直接兑现。
  player_action: 玩家必须按共享倒数选择先灭火、跨过边界保存长度、再把未燃烛芯送入火盆或另一根外露燃烛芯；随后将已经使用过的墙边停位和火源槽重新安排，在不同倒数相位重复该因果关系，而不是分别完成几个独立 witness。
  visible_payoff: 墙边蜡烛保持原长度跨过 t1，复燃动作不重置倒数；若复燃正好发生在 t1，蜡烛立即缩短并改变后续可达的火源/站位关系，之后同一墙口再次灭火或放行会让玩家看到之前的时序选择被回收。
  why_level_exists: 把前序的墙体灭火和共享倒数从一次性规则见证提升为同一组空间关系的反复时序控制：玩家必须为后继复燃所需的长度、火源和墙口状态提前作选择，且后继结果会反过来决定前面哪一次灭火才是正确的。
  core_boundary:
    central_objects:
      - 同一面有缺口的墙及其两个可重复使用的墙边停位
      - 至少两根会在不同阶段被墙灭火、保存、复燃并再次改变状态的蜡烛
      - 已点亮火盆与外露燃烛芯两种共享火源
      - 全局倒数 t3/t1 相位与边界缩短/避烧差异
    supporting_objects:
      - 最终需要点亮的未点亮火盆
      - 只承担站位、滚动阻挡和读图节奏的普通墙/地面

work_identity:
  conditions:
    - 规范胜解必须至少两次使用同一墙面造成有效 extinguish_by_wall，并让灭火后的未燃长度跨越共享倒数边界。
    - 规范胜解必须至少一次以已点亮火盆、至少一次以外露已燃烛芯作为同格复燃来源；两种来源不是并列装饰，而要改变后续倒数/站位选择。
    - 至少一次复燃发生在 t1 边界并参加当轮缩短，至少一次复燃发生在中段并把后续灭火/复燃安排传回此前决定。
    - 关键蜡烛在前序和后继中承担不同但连续的时序职责；任何单独删去墙边保存、火源来源或后继再灭火关系都应使完整胜解或核心回报消失。
  counterfactuals:
    - 把同一墙的缺口改成完全开放地面，应产生新的火源/路线或失去必需的墙灭火时序，不能保持作品身份。
    - 将火盆错开一列或把外露烛芯改为烛身相邻，应保留轴推合法性但失去复燃及后续倒数消费，证明同格火源关系有职责。
    - 预先点燃所有需要复燃的蜡烛，或删除后继再次灭火段，前面的保存长度与 t1 选择应明显变得显然或不再影响胜利。
    - 删除任一承担跨阶段时序责任的核心蜡烛，不能只消除它自己的自燃/缩短事件后仍保持同一对象路线、倒数和胜利关系。

level_brief:
  packaging_intent: complete_single_level
  expected_difficulty: 4
  expected_scale: 紧凑的双墙口/共享火源中庭，3 根左右蜡烛、3 个火盆，前后关系交织但高潮后立即结束
  expected_player_load: 玩家需要维护全局倒数相位，判断两次墙灭火的保存价值、火源来源替换和 t1 复燃是否应立即缩短；不依赖盲目试错或大量无意义走位

