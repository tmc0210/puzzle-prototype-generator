human_review_constraints:
  - 不把 Explorer 局部材料直接当作完整候选或难度结论。
  - 不把事件覆盖、图规模、步数或唯一解替代玩家侧判断。
  - 不把前序/后继拆成独立子题；每段必须改变同一墙灭火—倒数—重燃关系。
  - 正式 exact 发布后保持布局、solve instance、replay 和证据冻结。
