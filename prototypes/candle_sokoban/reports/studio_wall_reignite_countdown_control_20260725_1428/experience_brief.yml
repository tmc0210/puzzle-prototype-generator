experience_core:
  experience_statement: 玩家先把正在燃烧的长蜡烛送入墙口使其熄灭，接受共享倒数仍会流逝，却把这次保存换成更晚的火源接触；随后让第二根未燃蜡烛接入火盆，等待三次边界缩短改变它的可用长度，再把目标送入唯一终止位。墙是时序闸门：它改变哪根蜡烛此刻参与燃烧，而不是一次性按钮。
  visible_setup: 开局同时可读到顶端的墙口—燃烧蜡烛—已燃火盆关系，以及右下未燃蜡烛、下方火盆和墙边目标槽；亮/灭状态提示先后职责，但不依赖静默点火。
  player_action: 玩家必须先完成墙灭火并穿过共享倒数边界，再在中段火源槽让第二根蜡烛接火，主动等待长度变化，最后从正确操作侧把它送入目标；这些动作共享同一倒数和墙边站位，不是并列子题。
  visible_payoff: 第一根蜡烛跨过 t1 仍保留长度，第二根蜡烛接火发生在中段并随后缩短三次；顶端目标先被点亮，末端目标只在长度和站位同时正确时兑现，胜利立即收束。
  why_level_exists: 把前序墙灭火、共享倒数和火盆接火压进一个连续的双对象时序：前段保存的行动窗口决定玩家能否读懂后段等待，后段的长度兑现再决定最终目标槽可达。
  core_boundary:
    central_objects:
      - 顶部墙口及其墙边停位，负责把燃烧蜡烛从倒数中暂时摘出
      - 一根先灭火再由火盆复燃的长蜡烛，以及一根后继接火并跨三次边界缩短的蜡烛
      - 两个已点亮火盆作为共享火源，两个目标火盆作为连续回报
      - 全局倒数 t4/t1 相位与边界缩短/避烧差异
    supporting_objects:
      - 最终需要点亮的未点亮火盆
      - 只承担站位、滚动阻挡和读图节奏的普通墙/地面

work_identity:
  conditions:
    - 规范胜解必须使用墙口造成有效 extinguish_by_wall，并让第一根燃烧蜡烛跨越共享倒数边界而不缩短；该保存必须改变后段火源接入时机。
    - 规范胜解必须先以已点亮火盆复燃第一根蜡烛，再以另一已点亮火盆点燃后继蜡烛；两次接火分别改变前段回报与后段长度窗口。
    - 后继蜡烛必须经历三次共享倒数缩短，且最终目标点火发生在一次完整结算中；提前接火或提前进入目标槽都不构成同一回报。
    - 两根蜡烛在前序和后继中承担不同但连续的时序职责；删除墙口、顶端火源、下方火源或任一目标火盆都应破坏规范胜解或作品回报。
  counterfactuals:
    - 把同一墙的缺口改成完全开放地面，应产生新的火源/路线或失去必需的墙灭火时序，不能保持作品身份。
    - 将火盆错开一列或把外露烛芯改为烛身相邻，应保留轴推合法性但失去复燃及后续倒数消费，证明同格火源关系有职责。
    - 预先点燃所有需要复燃的蜡烛，或删除后继再次灭火段，前面的保存长度与 t1 选择应明显变得显然或不再影响胜利。
    - 删除任一承担跨阶段时序责任的核心蜡烛，不能只消除它自己的自燃/缩短事件后仍保持同一对象路线、倒数和胜利关系。

level_brief:
  packaging_intent: complete_single_level
  expected_difficulty: 4
  expected_scale: 紧凑的双区共享火源中庭，2 根蜡烛、4 个火盆，前后关系交织但高潮后立即结束
  expected_player_load: 玩家需要维护全局倒数相位，判断两次墙灭火的保存价值、火源来源替换和 t1 复燃是否应立即缩短；不依赖盲目试错或大量无意义走位

