calibrated_design_conclusions:
  - 人类审美不由事件数量、工具指标、完整图或机制标签覆盖补偿；可见机制承诺必须在玩家操作后的结构变化中兑现。
  - 同一对象或空间的多次使用只有在后一次改变前一次留下的具体状态、角色或时机关系时才构成复用；并列执行相同动作或两个独立接口会退化为拼接子题。
  - 前序必须让玩家为后续墙面关系作选择，后继必须消费该关系并把约束传回前面的灭火/重燃判断；开局搬运或高潮后清理若不改变核心推理，应删除。
  - 延迟显现的必要条件、隐藏 stopper、同一结构跨时段换角色和非局部第一步，是把直观看见的动作提升为阶段挑战的可靠方向；纯拉长走位或增加 deadend 不是难度。
  - 对本任务而言，墙灭火、共享倒数与火源重燃必须形成同一个可回读的因果关系：玩家主动把同一墙变成“先避开本轮缩短、再在倒数中重燃并继续消费剩余时间”的工具，并在不止一处回到该关系；不能拆成灭火 witness、重燃 witness、倒数 witness 的顺序展览。
  - 正式候选应保持紧凑、集中且回报相称；允许有复杂前序，但每个主要蜡烛、墙、火盆与通路都要继续参与核心时序，而不是完成开场后退休。

known_archive_limits:
  - 两份 clean archive 均不是 candle_sokoban 的前序课程；不把其难度分直接移植为 Candle 难度。
  - Ice 的 meta 正例只提供跨时空复用和回读的抽象校准，不复制其接口几何；Reality Anchor 的高密度正例只提供强耦合与主动构造原则。
  - 未读取任何旧 Candle report、旧 Candle candidate、旧 Candle Critic 或 runtime 诊断 levels。

