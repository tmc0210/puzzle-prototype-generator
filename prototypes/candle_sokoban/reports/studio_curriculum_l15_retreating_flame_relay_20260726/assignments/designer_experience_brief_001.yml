design_brief: >-
  为课程第 15 关建立体验简报。人类指定核心是 S05_T03_RETREATING_FLAME_RELAY：玩家把未燃 B 布置成
  同时连接 A 与 C 的双链接中继，A→B、B→C 分属相邻燃烧边界，火每个边界只前进一步。准传、过早、
  断链必须在同一初态成为真实玩家选择，并由同一 C consumer 区分恰长燃、过短燃、完整未燃；不能只见证
  两次 shrink_ignite。目标相对难度 5，允许暴露到 retreating_flame_transfer。边界前与两边界间的动作
  都必须是必要空间/对象工作，不得用空走计时；侧滚途中 later exposure 必须在完整图封闭。规划方向可优先，
  失败时可换结构族。此阶段只完成 clean archive 校准与体验简报，不设计 layout 或 exact；新增 Candle 人评
  归档必须纳入玩家侧校准。
