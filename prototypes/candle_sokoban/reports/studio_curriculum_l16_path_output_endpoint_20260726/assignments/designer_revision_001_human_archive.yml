design_brief: >-
  人类已试玩 exact_001 并以审美1、难度2归档为明确反例：玩家实际只面对“先推左上还是右下”一次二择，
  开局先推左上后只需盲目右推，首个承诺后决策空间坍塌。保持 exact_001 全目录不可变并在同一 candidate 内
  换结构族。L16 的作品身份仍是同一记长滚同时产生严格途中必要输出和终点实体职责；但目标难度5必须来自
  玩家在首次承诺后仍有至少一个实质判断、后段 consumer 会反向筛选前段规划、主要对象与空间被连续复用，
  不能靠事件华丽、重复轴推、长走位、普通二择或自动机械链。可完全离开 exact_001/probe 的布局与 consumer。
