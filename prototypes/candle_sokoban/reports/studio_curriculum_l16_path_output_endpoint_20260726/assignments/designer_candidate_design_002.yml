design_brief: >-
  接管同一 L16 候选的首次正式设计阶段。前一 Designer 只留下 reasoning sketch，未物化工作布局、未发布 exact；
  现在基于已定稿 experience_brief 和 task-local lexicon，把玩家关系实际做成完整单关并运行 runtime 证据。
  同一长滚必须同时完成严格途中永久输出与最终实体职责，后继继续接入 all_braziers_lit；相对难度目标 5。
  可重构 structure family，不受 sketch 坐标设想或课程 probe 布局约束，但只能维持此一个 candidate_id。
