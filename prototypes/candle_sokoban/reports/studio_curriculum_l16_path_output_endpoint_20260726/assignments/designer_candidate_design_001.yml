design_brief: >-
  依照已定稿 experience_brief，为课程 L16 制作唯一完整单关候选：玩家必须选择一记不可中止长侧滚，
  在途中点亮标准胜利必要火盆，并把最终烛身尾端留作后继对象的必要实体接口；后继必须继续接到同一
  all_braziers_lit 胜利链。相对难度目标 5。开放转场、路径输出或终点职责单独成立、短滚、预亮、
  错列及普通轴推替代都必须在同一 exact 的玩家关系或硬反事实中被排除。正式候选可改换尺寸、结构族
  和 consumer，不受课程 probe 布局约束；只能维持此一个 candidate_id。
