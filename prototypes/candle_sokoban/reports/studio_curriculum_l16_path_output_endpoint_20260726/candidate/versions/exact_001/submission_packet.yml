    search_scope: complete
    search_budget: max_states=300000；实际 17337 states / 54606 legal transitions，完整结束
    known_raw_winning_variants:
      - 13 个原始 winning states；7 种燃烧终态签名。
      - Q 因滚后剩余长度不同，需要在同一 x=7 列上推 1 至 3 次。
      - A 完成双职责后可被做无后续作用的尾声轴推；另有走位与共享倒数相位差异。
    equivalence_account: >-
      所有胜解都包含同一 A 对齐、同一 A d4、同一 d2 严格途中点盆、同一 Q 左滚 d2、
      同一 A 尾端 (6,6) 截停和同一最终上推关系；10 类强制事件移除与 5 组事件顺序检查全部通过。
      原始差异不改变责任对象、关系坐标、事件来源或玩家推理，只改变时序、已消费对象的尾声动作或推进次数。
