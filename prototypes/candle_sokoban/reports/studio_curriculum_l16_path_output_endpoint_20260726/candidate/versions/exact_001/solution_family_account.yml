  alternative_structural_rolls_on_win_reaching_subgraph: none

variant_account:
  - 13 个终局节点压成 7 种燃烧终态签名；差异来自到达 Q 前的走位相位、A 是否已燃尽、Q 剩余长度。
  - Q 在尾端截停时可能剩 3、2 或 1 格，因此沿同一 x=7 轴推 1 至 3 次才让退行火焰点亮最终火盆；玩家关系不变。
  - A 的轴推计数可为 1 至 4；首个右推是强制对齐，额外次数只发生在 A 已完成路径输出且已被 Q 消费为停止块之后，是无后续职责的尾声操作。
  - 空走、共享倒数相位、已消费 A 的尾声移动以及 Q 因剩余长度产生的同轴推进次数，均不产生另一种结构解。

designer_conclusion: >-
  完整图中没有另一组对象、另一种长滚、另一条点盆来源或不用尾端消费的胜解；
  已知原始胜解差异属于同一玩家逻辑的时序与无效尾声变体，因此报告 equivalent_variants_only。
