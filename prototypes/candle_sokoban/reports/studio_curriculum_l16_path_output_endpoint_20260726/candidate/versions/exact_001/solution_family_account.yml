mandatory_structure:
  - A 至少一次轴推并在长滚前完成 x=3..6 对齐。
  - A 恰好一次 d4 长滚，d1 途中取火、d2 严格途中点亮 (2,4)。
  - Q 恰好一次向左 d2 滚动，d1 途中取火，并在 d2 消费 A 的 (6,6) 反灯芯尾端。
  - Q 随后沿 x=7 向上轴推，最终点亮 (7,2)。

mechanical_checks:
  mandatory_event_removal_checks: 10
  every_removal_eliminates_all_wins: true
  required_event_order_checks: 5
