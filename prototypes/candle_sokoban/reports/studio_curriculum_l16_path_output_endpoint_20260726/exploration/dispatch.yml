dispatch_prompt: "使用 $sokoban-mechanism-lab，以 mechanism_explore 的 task_local 模式执行本文件。"
experience_seed: >-
  为课程第 16 关展开“一记长滚同时经营扫过路径与最终落点”：玩家选择一记不可中止的长侧滚，
  途中火焰必须写入一个标准胜利所需的永久火盆输出，最终烛身落点又必须成为后继对象的停块、
  遮板或操作面；只做路径输出、只做终点职责、短滚或普通轴推都不能完成同一连续任务。
player_prior:
  - 具备基础推箱子走位经验，已掌握 Candle 的轴推、侧滚、烛芯投影、全火盆目标和共享五拍倒计时。
  - 已掌握燃烧缩短与燃尽、墙体灭火、火盆与烛芯复燃、烛身遮蔽与未燃重曝、退焰点火及跨边界接力。
  - 尚未被正式教学“侧滚每个小步都立即结算接触，路径与终点可同时形成两套接口”。
allowed_mechanisms:
  - basic_candle_manipulation
  - wall_dousing
  - shared_fire_and_reignition
  - body_concealment_and_reexposure
  - retreating_flame_transfer
  - rolling_contact_chain
allowed_tools:
