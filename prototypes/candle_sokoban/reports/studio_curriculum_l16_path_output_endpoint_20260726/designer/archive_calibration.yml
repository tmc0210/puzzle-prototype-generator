calibration_conclusions_for_l16:
  - >-
    核心单位必须是一记不可拆的长侧滚：途中永久点亮一个标准胜利必要火盆，
    同时在终点留下被后继对象直接读取的实体接口。
  - >-
    两项职责必须共同改变滚动前的玩家选择。若删掉后继后，长滚终点选择不再需要区分，
    或预亮途中火盆后仍保留完整谜题，则原包装没有把两项责任耦合成同一关。
  - >-
    终点 consumer 必须足够接近并把约束传回此前判断；不得在核心后另起一段独立子题，
    也不得让滚烛在高潮后承担清理劳动。
  - >-
    难度 5 应来自玩家同时预见路径火焰投影、最终身体占格、后继对象操作面与标准胜利义务；
    不来自大地图、长走位、重复长滚、对象数量或事件数量。
  - >-
    途中点盆不能只是 roll_intermediate 事件 witness。火盆必须属于 all_braziers_lit 目标，
    且在所有允许胜解中由该长滚的途中小步负责。
  - >-
    终点实体接口不能只是稳定停块的展示。后继对象必须实际使用该占格改变停点、操作面、
    遮蔽关系或可进入格，并继续通向剩余标准胜利目标。
  - >-
    首次教学滚动小步结算时允许产生清楚惊喜，但正式解题负担必须落在可回读、可预见的双重规划上，
    不能把规则不知道或操作不准当作难度。
  - >-
    归档仅提供审美关系；任何具体布局、坐标、冰块/锚点形态和动作链均不进入 Candle 正式设计来源。

