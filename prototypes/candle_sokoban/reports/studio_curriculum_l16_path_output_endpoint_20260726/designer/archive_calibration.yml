candle_archive_revision_calibration:
  index:
    ref: prototypes/candle_sokoban/design_archive/index.yml
    sha256: 68563d7194d8c6685c48bbe838b292491dcf07cb69f8067c48a4c71dfa8c2b59
    complete_index_read: true
    candidate_count: 4
    all_candidate_cards_read: true
  candidate_cards:
    - candidate_id: CANDLE_CAND_0001
      ref: prototypes/candle_sokoban/design_archive/candidates/CANDLE_CAND_0001.md
      sha256: 03f1fe7060dd9becc6a9331f7a66926571bd9efe84e4c17fa812c84b1448cf1e
      human_comment_id: HP_CANDLE_ALL_MECHANICS_FINAL_CAPSTONE_001_v2_001
      aesthetic_score: 3
      difficulty_score: 3
      weight: related_positive_lower_bound
      calibration_read: >-
        退焰和多事件链能形成一定洞见，但人类只认作难度 3 常规流程；事件丰富不能为 L16 的难度 5 背书。
    - candidate_id: CANDLE_CAND_0002
      ref: prototypes/candle_sokoban/design_archive/candidates/CANDLE_CAND_0002.md
      sha256: 0f7c686c4c7b1dd246ec244b0fad95aca61cfc52a6e5e7b9e1791ba6db2e9bbc
      human_comment_id: HP_CANDLE_ALL_MECHANICS_FINAL_CAPSTONE_002_v006_001
      aesthetic_score: 3
      difficulty_score: 2
      weight: direct_binary_choice_lower_bound
      calibration_read: >-
        开局写入一次或两次、末端再读回的普通二择即使机械成立也只有难度 2；
        新结构不能把“选距离、选次数、选先后”包装成反向约束。
    - candidate_id: CANDLE_CAND_0003
      ref: prototypes/candle_sokoban/design_archive/candidates/CANDLE_CAND_0003.md
      sha256: 7edee7bce62d9431374f20ad2eb78316a4646d3661cb04a4c8c001af88ba7a57
      human_comment_id: HP_CANDLE_CURRICULUM_L16_PATH_OUTPUT_ENDPOINT_001_exact_001_001
      aesthetic_score: 1
      difficulty_score: 2
      weight: highest_weight_direct_counterexample
      calibration_read: >-
        这是本 revision 的最高权重直接反例。exact_001 虽有严格途中点盆、尾端 consumer、完整图和解族证据，
        玩家实际只需先推左上对象，之后盲目右推，首个承诺后决策空间坍塌；任何同构流程都必须否决。
    - candidate_id: CANDLE_CAND_0004
      ref: prototypes/candle_sokoban/design_archive/candidates/CANDLE_CAND_0004.md
      sha256: f2fcf9ad792d7f7ce5831f4e05d207845f7c74e124adf4519d9c4615d406d6f4
      human_comment_id: HP_CANDLE_WALL_REIGNITION_TIMING_CAPSTONE_001_V4_001
      aesthetic_score: 3
      difficulty_score: 3
      weight: compact_reuse_positive_lower_bound
      calibration_read: >-
        紧凑空间和路径复用能避免顺序锁读作拼接，但“先灭火、再处理另一对象、再复燃”仍只到难度 3；
        新 L16 需要更强的跨阶段判断，而不是再加一个顺序锁。
  human_feedback:
    ref: prototypes/candle_sokoban/reports/studio_curriculum_l16_path_output_endpoint_20260726/human_feedback/exact_001.yml
    sha256: 90607723d97802005256e9361912cf820a22f66cbc89859bbc5bc0eaff71e7c6
    exact_version: exact_001
    human_scores: {aesthetic: 1, difficulty: 2}
    direct_failure: >-
      玩家开局面对的只是“先动哪支蜡烛”，正确承诺后没有新的实质判断；长走位、重复右推和丰富事件都未形成玩家负荷。
  exact_001_frozen_baseline:
    ref: prototypes/candle_sokoban/reports/studio_curriculum_l16_path_output_endpoint_20260726/candidate/versions/exact_001
    layout_sha256: 61e8934282bc48a21ae200ea7ec2c99309ab24617df79a0f8c5673f13fa34d2b
    directory_verified_unchanged: true
    mechanical_fact_not_a_quality_defense: >-
      complete/pass、13 个胜点和必经事件证明机械身份，却不能反驳人类对审美 1、难度 2 与决策坍塌的裁决。
  revision_design_threshold:
    - 首次不可逆或有代价的承诺之后，至少保留一个不能靠盲推完成的实质判断。
    - 该后续判断必须读取 consumer 的操作面、燃烧长度、遮蔽状态或停点，并反向筛选长滚前的路径与端点规划。
    - 错误前段构造应能完成途中输出或局部接口之一，但在后段暴露缺失关系；不得只是开局二择后立刻撞墙。
    - 主要对象和同一紧凑空间必须在承诺前、核心长滚和 consumer 阶段连续复用，不能前段对象退休、后段另起题。
    - 难度说明必须逐项列出玩家判断及其可见信息来源；不引用图规模、事件数、步数或重复轴推作为难度理由。
  direct_difference_requirements:
    versus_CANDLE_CAND_0002: >-
      不使用一次/两次、先/后、左/右等普通二择作为核心；后段必须要求组合读取至少两个前段留下的关系。
    versus_CANDLE_CAND_0003: >-
      首个正确动作不能决定余下全部流程；核心长滚之后仍须有会失败、且失败原因能回指长滚规划的实质 consumer 判断。

