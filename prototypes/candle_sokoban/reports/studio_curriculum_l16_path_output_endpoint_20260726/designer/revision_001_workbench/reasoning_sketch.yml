family_hypothesis: mutual_stop_foldback
player_relation_hypothesis: >-
  Q 先以竖直身体限定 A 的长滚终点；A 的同一次长滚在严格途中点亮必要火盆并继续到 Q 前。
  此后 Q 不能直接朝目标推进，而要先横滚撤离 A、沿轴改变高度，再折返：折返途中取火，
  并由 A 的反灯芯尾端截停到最终操作列。玩家需要在长滚后重新读取两个对象的互换职责。

substantive_judgments:
  - judgment: 预测 Q 的初始身体会把 A 截在哪一行，并确认该距离既越过路径火盆又留下正确尾端。
    information_source: A 的烛芯列、途中火盆、Q 顶端与 A 滚道同屏可见。
  - judgment: A 长滚后不能把 Q 直接推向终点；Q 必须先从 A 身下横滚撤离，才获得沿轴升位的空间。
    information_source: A 占据 Q 正上方，直接上推被实体阻挡；右侧开放区与上升通道可见。
  - judgment: Q 升到哪一行，必须同时满足折返时经过火源、下一步被 A 的反灯芯尾端截停、截停后烛芯对准最终火盆。
    information_source: 火源、A 尾端、最终火盆三者给出三个坐标约束；不是单一方向二择。
  - judgment: 选择折返而不是继续外滚或在错误高度回滚。
    information_source: 只有折返轨迹同时取得火与尾端停止；错误构造可保留途中火盆但失去终点链。

archive_difference:
  versus_CANDLE_CAND_0002: >-
    不是一次/两次写入的普通二择；Q 的高度、火焰投影、A 尾端碰撞行与最终烛芯列必须同时成立。
  versus_CANDLE_CAND_0003: >-
    A 长滚只是中点承诺；其后仍需把原先作为 A 停块的 Q 重构为撤离—升位—折返 consumer，
    正确开局动作不会自动决定余下输入。

packaging_target:
  opening: A、路径火盆、作为远端挡块的 Q、折返火源与最终火盆同屏可回读。
  climax: A 的长滚在途中点盆后继续，撞出由 Q 确定的远端落点。
  post_commitment: Q 撤离并折返；这一段消费同一空间和两个核心对象，不另起清理题。
  ending: Q 被 A 尾端截停并立即用取得的轴推面完成最终火盆。

rejection_conditions:
  - A 长滚后 Q 只需连续同方向推动或唯一合法输入即可收束。
  - Q 无需改变高度，或火源、尾端、最终目标中任一坐标不参与筛选。
  - 未让 Q 先承担 A 的远端挡块职责，导致前后只剩普通 stopper 展示。
  - 任一允许胜解不含严格途中点盆、Q 撤离—升位—折返或 A 反灯芯尾端截停。
  - 玩家侧难度说明依赖事件数量、长走位、图规模或倒数噪声。
