  player_experience: >-
    玩家先把长烛定位到可从上方发动的位置，再用同一记四格侧滚让烛芯在严格中途接火并点亮必要火盆，
    同时把反烛芯尾格留在远端。转场和燃烧缩短后，第二根蜡烛向左侧滚，必须由该尾格截停到可立即向上轴推的列，
    再完成最后火盆。途中输出和终点实体职责因此在滚动前就必须一起规划。
  known_risks:
    - 第 4 步核心长滚之后有一段较长转场；机械上同时承担共享倒计时与接近后继操作面，但真人仍需判断节奏是否紧凑。
    - 本任务启动时 L01-L15 的其它并行交付尚无可核验 actual exact；目标难度 5 以课程知识先验和独立人评校准约束，最终课程相对难度仍待真人串行试玩确认。
    - 机器证据支持完整图、解族和核心对象参与；作品是否产生预期的“同动作双职责”洞见仍以真人体验为准。
