      - "全部 win-reaching Q 滚动边均为 action=left、x=9 到 x=7、d1 发出 ignite_from_brazier:candle#2:8,3；全部 win-reaching Q 轴推边均为 action=up 且 body 保持在 x=7。"
      - "15 条最终点盆边全部是 Q 在 x=7 向上轴推并同时发出 light_brazier:7,2 与 win_all_braziers_lit；Q 轴推次数的 1 至 3 次变体不改变目标关系。"
    limits: []

