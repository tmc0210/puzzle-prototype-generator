  - claim_id: "required_winning_path_output"
    claim: >-
      所有胜解都要求 A 的同一次 d4 侧滚在严格中间 d2 由 A 点亮火盆 (2,4)，并继续到 d4 终点；
      预亮该盆的反事实会删除这项 required-winning 路径职责。
    status: supported
    evidence_basis:
      - "完整图上分别移除 A d4、A d1 途中取火、A d2 途中点盆或 light_brazier:2,4 边后，起点均不可达任何 winning node。"
      - "全部 20 条 win-reaching A d4 边的 action 都为 down，源 A 均为 x=3..6/y=2 对齐；raw events 顺序均含 d1 取火、d2 light_brazier:2,4、d3、d4，并到达 y=6 终点。"
      - "prelit_path_layout.txt 只把 (2,4) 改为已亮；prelit_path_analysis.md 的完整图为 16107 states/50816 transitions/13 wins，最短解仍为 23 步，但 A 滚动不再发出 light_brazier:2,4 或 roll_intermediate_light_brazier:candle#4:d2。"
    limits:
      - "预亮反事实证明该路径输出的机械身份关系被删除，不产生审美或价值结论。"

  - claim_id: "required_winning_endpoint_body_duty"
    claim: >-
      所有胜解中 A 的反灯芯尾端 cell (6,6) 都是 Q 左滚 d2 的实体停止来源；删除 Q 后完整图无胜，
      Q 反向滚和 A 未对齐分支都不能完成相同目标关系。
    status: supported
    evidence_basis:
      - "全部 24 个 win-reaching Q d2 源状态的 A body 只为 (6,6) 或 (6,6);(5,6)，Q action 全为 left，Q 从 x=9 到 x=7；runtime 的下一次左移目标包含 (6,6)，该格在 layout 中不是墙或火盆，故停止实体来源为 A 尾端。"
      - "solution_family_report.json 的 endpoint source 审计与独立 raw-graph 读取一致；移除 Q_endpoint_roll_d2 事件边后无胜路。"
      - "delete_q_analysis.md 完整结束于 3163 states、9878 transitions、0 winning states。"
      - "unaligned_a_replay.md 的未对齐下滚在 step 3 以 roll_blocked 非法结束；完整图同时证明所有胜路必含唯一的对齐后 A d4。"
      - "q_wrong_direction_replay.md 的 Q 向右仅滚 d1，不取火且不胜；complete win-reaching 子图中没有任何 Q 向右滚边，所有可继续获胜的 Q 滚动均为向左 d2。"
    limits:
      - "对象必要性、停止来源与方向旁路是机械结论；不推导该关系是否有趣。"

  - claim_id: "required_winning_q_output"
    claim: "所有胜解都由 Q 在滚动途中从 (8,3) 既亮火盆取火，并从截停后的 x=7 列轴推点亮最终火盆 (7,2)。"
    status: supported
