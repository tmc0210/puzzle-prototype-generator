solution_uniqueness_review:
  declared_result: equivalent_variants_only
  search_scope: complete
  exact_version_match: true
  known_raw_winning_variants:
    - "完整图含 13 个 winning state；它们归并为 7 种 candle/brazier 机械终态签名，且全部火盆签名一致。"
    - "A 的轴推计数为 1 至 4：胜路上的开局轴推都只把 A 从 x=2..5 对齐到 x=3..6；额外左推只出现在 Q 已完成尾端消费之后。"
    - "Q 的轴推计数为 1 至 3；胜路上的 Q 轴推全部沿 x=7 向上，并以同一 (7,2) 火盆点亮关系结束。"
    - "其余已知差异是走位/倒数相位、燃烧后剩余长度、燃尽状态及职责已完成后的 A 尾声动作；13 个 winning state 不等于仅有 13 条原始输入串。"
  equivalence_evidence_basis:
    - "complete_graph_exposure.json：graph.status=complete；原始图为 17337 nodes、54606 edges、13 winning nodes，逐边索引和引用有效，且全部节点从 node 0 可达。"
    - "solution_family_report.json 与 analyze_solution_family.mjs：对完整原始图重算后的结构化结果与已存报告完全一致；10 类 mandatory-event removal 均使胜点不可达，5 组 edge-level 顺序检查均无违反胜路。"
    - "完整图 win-reaching 子图只有 A 向下 d4 与 Q 向左 d2 两类滚动；A 的 d4 边全部在 d1 从 (2,3) 取火、d2 点亮 (2,4)，随后继续 d3、d4；Q 的 d2 边全部在 d1 从 (8,3) 取火。"
    - "完整图中所有 Q d2 胜路边都从 x=9 滚到 x=7，源状态 A 形态只为 (6,6) 或 (6,6);(5,6)，并包含阻止下一小步的 (6,6) 尾端；其它胜路滚动形态不存在。"
    - "solution_family_account.yml：candidate_id、exact_version、完整图计数、对象职责与已知变体归类均指向当前 exact_001。"
  known_non_equivalent_win_refs: []
  status: supported
  limits:
    - "结论是当前 runtime 完整状态图下的玩家逻辑类唯一，不主张原始输入串唯一；完整图按合同 terminalize wins 与 zero-candle no-win 终局。"
    - "solution_family_report.required_event_order 是 edge 粒度检查；同一滚动 edge 内的微观先后必须以 raw edge events 读取。本轮已直接核验 A 的真实顺序为 d1 取火、d2 点盆、d3、d4、随后发出 d4 滚动摘要。"
    - "单条 unaligned / wrong-direction replay 只支持对应精确尝试；更广的无旁路结论来自当前 exact 的 complete win-reaching subgraph，而不是由单条 probe 外推。"

