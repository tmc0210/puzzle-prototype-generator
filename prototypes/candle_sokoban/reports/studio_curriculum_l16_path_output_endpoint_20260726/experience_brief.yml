experience_core:
  experience_statement: >-
    玩家面对一个“路径目标不在停点、后继接口又要求远端实体落点”的同动作双重规划题：
    亲手触发一记长侧滚，看到燃烧烛芯在滚动途中点亮标准胜利必要火盆而滚动不停，
    随后用停在终点的烛身直接改写后继对象的动作结果，并由该后继继续完成剩余标准胜利链。
  prior_expectation: >-
    玩家已会按最终停点规划侧滚，但尚未正式知道每个滚动小步都会结算接触；
    因而容易把途中火盆视为不能与远端停点同时取得的目标。
  visible_setup: >-
    开局应同时可读地展示一根可长侧滚的燃烛、位于非终点小步上的未点火盆、
    远端停止区域，以及一个其后滚动终点与操作面明确依赖该终点烛身占格的后继对象。
    玩家应能从后继对象的轴推需求反读出它必须被截停在哪一列；两项职责必须在滚动前共同可推理，
    不能把后继藏成高潮后的新题。
  player_action: >-
    玩家先决定并建立能兼得两项结果的滚道与停止关系，再从正确操作侧触发同一记不可中止长侧滚：
    烛芯途中扫过必要火盆，烛身继续前进到反烛芯尾格可截停后继对象的位置；随后用后继对象的
    侧滚读取停块，并从得到的操作面沿轴推动它进入剩余胜利链。
  visible_payoff: >-
    火焰在途中越过火盆格时将其点亮，蜡烛没有停下；滚动结束后，终点反烛芯尾格把后继对象的
    侧滚截停到准确列，玩家随即从新取得的操作面沿轴推动该对象，进入完成剩余标准目标所需的局面。
  why_level_exists: >-
    本关首次把侧滚读成两套同时写入的接口：烛芯路径可以留下永久火焰输出，烛身终点可以留下
    持续空间责任。它让玩家学会规划整条滚道而不只看终点，并证明一拍动作可以同时经营途中状态与落点实体。
  core_boundary:
    central_objects:
      - 执行唯一核心长侧滚的燃烧多格蜡烛。
      - 位于严格非终点小步、由该滚动途中点亮的标准胜利必要火盆。
      - 长滚终点的烛身占格与该占格形成的实体接口。
      - 必须直接消费终点接口的后继可动对象。
      - 由后继链继续完成的至少一个剩余标准胜利义务。
    supporting_objects:
      - 只为建立长滚距离、操作侧和明确终点所需的墙、实体挡块或通路。
      - 只在必要时提供初始火焰、倒计时相位或玩家安全操作面的辅助对象。

work_identity:
  conditions:
    - 核心动作必须是同一根多格蜡烛的一次多小步侧滚，不能拆成多次推动或多次短滚。
    - 标准胜利必要火盆必须在终点之前的小步被点亮，且滚动在点盆后继续。
    - 滚烛终点的反烛芯端实体占格必须保留到后继动作，并把后继对象截停到一个明确、可立即使用的轴推操作面。
    - 若存在转场或一次缩短，必须保留负责停块的尾格；不能让接口职责落在先被缩短删掉的烛芯端。
    - 途中火盆与后继消费都必须属于同一条 all_braziers_lit 胜利链；完成其中一项而不完成另一项不能胜利。
    - 后继关系必须把约束传回滚动前，使玩家必须同时选择正确路径和正确终点，而非顺序执行两个独立任务。
    - 同一初始局面必须包含至少一个玩家可理解的错误构造：它能取得路径输出或终点链之一，却不能兼得两者；难度不能由相邻 probe 的作者对照代替。
    - 核心回报后应尽快收束，不追加与终点接口无关的清理段。
  counterfactuals:
    - >-
      若把途中火盆预亮、删除或移到终点，长滚只剩实体落点职责，滚动小步路径输出不再构成作品核心。
    - >-
      若删除后继对象、让它不再接触终点接口，或预置到无需该占格也能完成的位置，
      长滚终点只剩装饰，路径—终点双重规划消失。
    - >-
      若把长滚拆成“先在火盆处短停、再另一次滚到终点”，一拍同时累积两项必要结果的作品身份消失。
    - >-
      若普通轴推、预置终点或不扫过途中火盆的替代路线也能建立同一后继局面并胜利，
      侧滚路径职责没有被隔离。
    - >-
      若长滚在火盆行近停后，后继对象仍能在别处取得同一轴推操作面，或远滚后仍能回到所需列，
      终点尾格没有真实消费责任。
    - >-
      若拿掉后继后所有能点亮途中火盆的滚动状态重新等价，说明后继原本确实参与同一谜题；
      若拿掉后仍需完全相同的终点判断，则后继只是追加子题，必须重构。

level_brief:
  packaging_intent: complete_single_level
  expected_difficulty: 5
  expected_scale: >-
    紧凑到中等的一屏单关；规模只需容纳一次清楚长滚、一个直接后继消费和短收束，
    不以对象数量或走廊长度扩充体量。
  expected_player_load: >-
    主要负担是同时反推烛芯路径、最终烛身占格、后继对象动作面与标准胜利义务；
    允许首次看到途中结算带来惊喜，但难度不能建立在规则遗忘、读图失误、操作不准、空走计时或机械试错上。
  opening_intent: >-
    同屏暴露“近处路径火盆”和“远处终点 consumer”的表面矛盾，让玩家知道这两个目标必须由同一滚烛解决。
  preparation_intent: >-
    只保留会改变核心滚动操作侧、路径对齐、终点位置或后继操作面的必要准备；
    每个较早决定都应因预见后继接口而被压缩。正式单关必须把 probe 中固定的近停/远停对照
    改写为同一初始局面内的玩家选择或构造结果，不能把作者换墙后的两个局面冒充玩家分支。
  climax_and_ending_intent: >-
    长滚途中点盆与终点落位形成连续高潮，紧接一次或极短后继消费兑现实体接口，随后结束标准胜利链。
  selected_material_transformation_requirements:
    - 缩短 probe 中长滚后到 Q 读取之间的开放转场，或把转场中的行动全部变成准备同一后继接口的必要工作。
    - 把 Q 的停点与轴推接入标准胜利所需的具体输出；“轴推合法”本身不能作为完整 consumer。
    - 给玩家提供同图可理解的错误构造，使只完成路径输出、只完成终点链或短滚近停成为实际可比较的失败关系。
    - 删除或赋予 probe 远端火盆真实责任；不得保留只为阻止局部测试提前胜利的附带对象。
    - 正式布局完成后重新运行当前 exact 的完整 replay、解族、对象责任与 complete graph；局部材料证据不随变形继承。

allowed_design_sources:
  - 当前 assignment 的 input_refs 与 design_handoff required docs。
  - prototypes/ice_slide_escape/design_archive/index.yml 与其本简报明确读取的人类原评语，仅用于抽象审美校准。
  - prototypes/reality_anchor/design_archive/index.yml 与其本简报明确读取的人类原评语，仅用于抽象审美校准。
  - 当前 assignment 明确提供、具有 mechanism_explore/task_local publication provenance 的 task lexicon、索引、首批 run 与原始 runtime evidence。

prototype_specific_routing:
  - 正式候选胜利条件固定为 all_braziers_lit，禁止 event_occurs。
  - 当前关 allowed_exposure_through 固定为 rolling_contact_chain；后续 exact 仍须以 complete reachable graph 通过 exposure audit。
  - 途中火盆必须是标准胜利必要目标；事件出现本身不证明必经、有效使用、难度或质量。
  - 当前任务首批已验证 lexicon 已取得；选用的是局部关系，不是课程探索 optional direction 或 Explorer probe 的完整布局。
  - 候选接受后的 redundant_element_prune、严格 exposure 重检、conformance 与 playable build 由 Controller 执行，不属于 Designer 阶段。

human_review_constraints:
  - 不把一次滚动中的大量事件或多格距离视为难度与亮点。
  - 不用重复长滚、重复点盆、空走计时、大地图或大量对象填充难度 5。
  - 不让前序在核心前独立退休，也不让后继成为高潮后的割裂子题。
  - 不保留高 affordance 但无职责的蜡烛、火盆、墙体接口或可见机制可能性。
  - 不从跨原型归档复制具体布局、坐标、对象形态或动作链。

stage_boundary:
  experience_brief_complete: true
  experience_brief_finalized: true
  archive_calibration_complete: true
  formal_layout_started: false
  candidate_id_created_by_designer: false
  task_local_material_selection_complete: true
  next_designer_gate: >-
    等待 Controller 提供绑定唯一 candidate_id 的后续 candidate_design assignment；在此之前不建立工作布局、solve instance 或 exact。
