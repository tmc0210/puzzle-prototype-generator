prototype_context:
  confirmed_rules:
    - 玩家可沿长轴推动蜡烛一格，也可从侧面触发完整侧滚，直到下一小步被实体阻挡。
    - 侧滚每个小步立即结算灭火、递归点火和点盆；途中变化不会让滚动提前停止。
    - 一次多格侧滚仍只算一个合法行动，并只在整次行动后推进一次共享五拍倒计时。
    - 完整行动末尾先结算共享燃烧与缩短，再判玩家死亡，最后检查标准胜利。
    - 已点亮火盆永久保持点亮并可作为火源；外露已燃烛芯可点盆、点火，也会杀死玩家。
    - 初始布局不得静默点火、灭火或点盆；无效输入不形成 runtime edge，也不推进倒计时。
  win_condition: 玩家存活，并在完整回合结算后点亮全部火盆（all_braziers_lit）。
  object_and_event_semantics:
    - 多格蜡烛是刚性实体；cap 方向外一格为非实体烛芯投影。
    - 墙或其它烛身遮住已燃烛芯会先使其熄灭；重曝烛芯保持未燃，除非同格火源再点燃。
    - 当前关首次正式教授滚动小步逐次接触；核心机械现象是 roll_intermediate_light_brazier。
    - 中途点亮的火盆状态会保留到滚动终点，滚烛的最终烛身占格则继续作为实体参与后继动作。
  allowed_mechanisms:
    - basic_candle_manipulation
    - wall_dousing
    - shared_fire_and_reignition
    - body_concealment_and_reexposure
    - retreating_flame_transfer
    - rolling_contact_chain
  allowed_exposure_through: rolling_contact_chain
  tool_boundary:
    - 当前已实现 Candle runtime、ASCII parser/renderer、solver、完整图、layout analyzer、replay、诊断 probes 与 exposure audit。
    - Candle 专属 miner、candidate factory、PuzzleScript exporter/checker 未实现，不得用其它原型证据替代。
    - 本阶段不制作布局、不运行 candidate solve/replay，也不发布 exact。

