mechanic: candle_sokoban

knowledge:
  - id: K_M1_axis_push
    type: interaction
    statement: 从蜡烛端部施力会让整根蜡烛沿长轴平移一格，玩家进入原尾端格。
    source:
      kind: declared
      rule: M1
      events: [push_axis]
    detector:
      required_events: [push_axis]
    evidence:
      strength: strong

  - id: K_F1_flame_lights_brazier
    type: interaction
    statement: 外露蜡烛火焰与未点燃火盆同格时，火盆被永久点亮。
    source:
      kind: declared
      rule: F1
      events: [light_brazier]
    detector:
      required_events: [light_brazier]
    evidence:
      strength: strong

  - id: K_M2_side_roll
    type: interaction
    statement: 从烛身侧面推动会让整根蜡烛逐格滚动，直到下一小步被实体或边界阻挡。
    source:
      kind: declared
      rule: M2
      events: [roll_step, roll_candle]
    detector:
      required_events: [roll_candle]
    evidence:
      strength: strong

  - id: K_F3_wick_only_ignition
    type: interaction
    statement: 普通烛身接触火焰不会点燃蜡烛，只有外露烛芯接触有效火源才会点燃。
    source:
      kind: declared
      rule: F3
      events: [extinguish, ignite]
    detector:
      required_events: [extinguish, ignite]
    evidence:
      strength: strong

  - id: K_F2_lit_brazier_source
    type: interaction
    statement: 外露未燃烛芯伸入已点亮火盆格时，蜡烛被点燃并可继续送火。
    source:
      kind: declared
      rule: F2
      events: [ignite, light_brazier]
    detector:
      required_events: [ignite, light_brazier]
    evidence:
      strength: strong

  - id: K_H1_exposed_flame_danger
    type: interaction
    statement: 玩家主动进入外露火焰会死亡，因此不能从燃烧端推动蜡烛。
    source:
      kind: declared
      rule: H1
      events: [player_died, push_axis]
    detector:
      required_events: [push_axis, light_brazier]
    evidence:
      strength: strong

  - id: K_T1_global_five_turn_beat
    type: interaction
    statement: 所有成功行动共同推进唯一的五回合全局倒计时。
    source:
      kind: declared
      rule: T1
      events: [countdown]
    detector:
      required_events: [countdown]
    evidence:
      strength: strong

  - id: K_T2_M4_valid_actions_tick
    type: interaction
    statement: 没有火焰时成功行动仍推进倒计时，无效输入不推进倒计时或棋盘状态。
    source:
      kind: declared
      rule: T2_M4
      events: [countdown]
    detector:
      required_events: [countdown]
    evidence:
      strength: strong

  - id: K_B1_shrink_from_wick_end
    type: interaction
    statement: 燃烧边界从烛芯端移除一格烛身，其余烛身不动，火焰向内退一格。
    source:
      kind: declared
      rule: B1
      events: [shrink]
    detector:
      required_events: [shrink]
    evidence:
      strength: strong

  - id: K_B3_last_cell_burnout
    type: interaction
    statement: 单格燃烧蜡烛在燃烧边界完全消失，烛身和火焰同时移除。
    source:
      kind: declared
      rule: B3
      events: [burn_out]
    detector:
      required_events: [burn_out]
    evidence:
      strength: strong

  - id: K_M3_long_roll_one_turn
    type: interaction
    statement: 无论侧滚跨越多少格，整段侧滚都只算一个有效行动。
    source:
      kind: declared
      rule: M3
      events: [roll_step, roll_candle, countdown]
    detector:
      required_events: [roll_candle, countdown]
    evidence:
      strength: strong

  - id: K_R1_per_step_contact
    type: interaction
    statement: 侧滚的每个小步都会独立结算火盆、点火、熄灭和传火接触。
    source:
      kind: declared
      rule: R1
      events: [roll_step, light_brazier]
    detector:
      required_events: [roll_step, light_brazier]
    evidence:
      strength: strong

  - id: K_R2_fire_state_does_not_stop_roll
    type: interaction
    statement: 侧滚途中点燃或熄灭不会改变由实体碰撞决定的滚动终点。
    source:
      kind: declared
      rule: R2
      events: [ignite, extinguish, roll_candle]
    detector:
      required_events: [ignite, extinguish, roll_candle]
    evidence:
      strength: strong

  - id: K_H2_body_conceals_wick
    type: interaction
    statement: 墙或其他蜡烛的烛身与烛芯同格时会遮蔽烛芯，并立即熄灭已有火焰。
    source:
      kind: declared
      rule: H2
      events: [extinguish]
    detector:
      required_events: [extinguish]
    evidence:
      strength: strong

  - id: K_H3_expose_and_relight
    type: interaction
    statement: 遮挡移开后烛芯重新外露但不会自动复燃，必须再次接触有效火源。
    source:
      kind: declared
      rule: H3
      events: [extinguish, ignite]
    detector:
      required_events: [extinguish, ignite]
    evidence:
      strength: strong

  - id: K_F4_wick_to_wick_transfer
    type: interaction
    statement: 已燃火焰与未燃外露烛芯投影到同一格时，会立即点燃后者。
    source:
      kind: declared
      rule: F4
      events: [ignite]
    detector:
      required_events: [ignite]
    evidence:
      strength: strong

  - id: K_F5_same_step_recursive_chain
    type: interaction
    statement: 新产生的火焰会在同一个移动小步继续参与传火，直到不再新增点燃。
    source:
      kind: declared
      rule: F5
      events: [ignite, light_brazier]
    detector:
      required_events: [ignite, light_brazier]
    evidence:
      strength: strong

  - id: K_B2_simultaneous_shrink
    type: interaction
    statement: 同一燃烧边界让所有仍点燃的蜡烛同时缩短，结果不依赖处理顺序。
    source:
      kind: declared
      rule: B2
      events: [shrink]
    detector:
      required_events: [shrink]
    evidence:
      strength: strong

  - id: K_T3_fire_state_does_not_reset_timer
    type: interaction
    statement: 点燃、熄灭和重新点燃只改变蜡烛状态，不刷新、暂停或加速全局倒计时。
    source:
      kind: declared
      rule: T3
      events: [extinguish, ignite, countdown]
    detector:
      required_events: [extinguish, ignite, countdown]
    evidence:
      strength: strong

  - id: K_T4_boundary_ignition_shrinks
    type: interaction
    statement: 倒计时为 1 的行动中新点燃且仍燃烧的蜡烛，会立即参加本次缩短。
    source:
      kind: declared
      rule: T4
      events: [ignite, shrink]
    detector:
      required_events: [ignite, shrink]
    evidence:
      strength: strong
