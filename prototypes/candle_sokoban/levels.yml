mechanic: candle_sokoban

levels:
  - id: CANDLE_SMOKE_01_LIGHT_BRAZIER
    title: Push Flame Into Brazier
    global_burn_cycle: 5
    layout: |-
      #########
      #@111R.o#
      #########
    expected_trace:
      - input: right
        events: [push_axis, light_brazier, countdown, win_all_braziers_lit]
    expected_events: [push_axis, light_brazier, countdown, win_all_braziers_lit]
    design_notes: >
      Primary solver and playable smoke. One axial push moves the projected
      flame onto the only brazier.

  - id: CANDLE_PROBE_02_SIDE_ROLL
    title: Side Roll Until Blocked
    global_burn_cycle: 5
    layout: |-
      ########
      #..1...#
      #.@1...#
      #..D.###
      #...o..#
      ########
    expected_trace:
      - input: right
        events: [roll_candle, light_brazier, countdown, win_all_braziers_lit]
    expected_events: [roll_step, roll_candle, light_brazier, win_all_braziers_lit]
    design_notes: >
      The vertical candle rolls right by one small step, then its lower body
      would hit the wall. Its projected flame lands on the only brazier, so the
      same roll demonstrates the mechanism and completes a formal objective.

  - id: CANDLE_PROBE_03_CONCEALED_FLAME
    title: Wall Conceals Flame
    global_burn_cycle: 5
    layout: |-
      #########
      #.1...#.#
      #@1...#.#
      #.D...#.#
      #..#Oo..#
      #########
    expected_trace:
      - input: right
        events: [extinguish, ignite, light_brazier, roll_candle, win_all_braziers_lit]
    expected_events: [roll_step, extinguish, ignite, light_brazier, win_all_braziers_lit]
    design_notes: >
      A single side roll carries the projected flame across a wall, extinguishing
      it, then across a lit brazier to reignite it, and finally across the only
      unlit brazier to complete the formal objective.

  - id: CANDLE_PROBE_04_RECURSIVE_IGNITION
    title: Shared Wick Cell Ignition
    global_burn_cycle: 5
    layout: |-
      ##########
      #@111R.o.#
      #......u.#
      #........#
      ##########
    expected_trace:
      - input: right
        events: [push_axis, ignite, light_brazier, countdown, win_all_braziers_lit]
    expected_events: [push_axis, ignite, light_brazier, win_all_braziers_lit]
    design_notes: >
      After the push, candle#1's flame and the singleton candle wick share one
      logical cell while the same cell overlaps the only brazier. The singleton
      ignites during the contact closure and the brazier provides a formal win.

  - id: CANDLE_PROBE_05_FIRE_DEATH
    title: Walk Around the Flame
    global_burn_cycle: 5
    layout: |-
      #######
      #.@...#
      #o.L1.#
      #######
    expected_trace:
      - input: right
        events: [walk, countdown]
      - input: right
        events: [walk, countdown]
      - input: right
        events: [walk, countdown]
      - input: down
        events: [walk, countdown]
      - input: left
        events: [push_axis, light_brazier, countdown, shrink, win_all_braziers_lit]
    expected_events: [walk, push_axis, light_brazier, countdown, shrink, win_all_braziers_lit]
    design_notes: >
      Moving down from the start enters the exposed flame and kills the player.
      The safe route walks around the flame, reaches the candle's tail side, and
      pushes left on the fifth valid action so the flame enters the only brazier
      during the normal global burn boundary.

  - id: CANDLE_PROBE_06_BURN_SHRINK
    title: Global Burn Shrinks Every Lit Candle
    global_burn_cycle: 5
    layout: |-
      ###########
      #@........#
      #.#111R.o.#
      #.....u..##
      #.....2..##
      #.........#
      ###########
    expected_trace:
      - input: down
        events: [walk, countdown]
      - input: down
        events: [walk, countdown]
      - input: right
        events: [walk, countdown]
      - input: right
        events: [walk, countdown]
      - input: right
        events: [walk, countdown, shrink, shrink_ignite]
      - input: right
        events: [walk, countdown]
      - input: right
        events: [roll_candle, light_brazier, countdown, win_all_braziers_lit]
    expected_events: [countdown, shrink, shrink_ignite, roll_candle, light_brazier, win_all_braziers_lit]
    design_notes: >
      The fifth valid turn shortens the lit horizontal candle. Its retreating
      flame exposes and ignites the vertical candle's formerly concealed wick.
      The player must then roll that newly lit candle right to light the only
      brazier and complete a formal objective.

  - id: CANDLE_PROBE_07_UNLIT_COUNTDOWN
    title: Countdown Advances Before Ignition
    global_burn_cycle: 5
    layout: |-
      #########
      #@..1..##
      #...1..##
      #...d..##
      #....Oo##
      #########
    expected_trace:
      - input: right
        events: [walk, countdown]
      - input: right
        events: [walk, countdown]
      - input: right
        events: [roll_candle, ignite, light_brazier, countdown, win_all_braziers_lit]
    expected_events: [countdown, roll_candle, ignite, light_brazier, win_all_braziers_lit]
    design_notes: >
      Two successful walks advance and reset the board countdown while no candle
      is lit. The following side roll crosses a lit brazier, ignites the candle,
      and then lights the only unlit brazier for a formal win.

  - id: CANDLE_LEVEL_01_TWO_ALTARS
    title: 双层祭坛
    global_burn_cycle: 5
    layout: |-
      ##########
      #........#
      #@111R.o.#
      #........#
      #........#
      #......o.#
      ##########
    expected_trace:
      - input: right
        events: [push_axis, light_brazier, countdown]
      - input: up
        events: [walk, countdown]
      - input: right
        events: [walk, countdown]
      - input: down
        events: [roll_candle, light_brazier, countdown, win_all_braziers_lit]
    expected_events: [push_axis, roll_candle, light_brazier, countdown, win_all_braziers_lit]
    design_notes: >
      入门应用关。玩家先沿长轴推动燃烧蜡烛点亮上方火盆，再绕到蜡烛上方侧推，
      让同一团火焰向下滚动并点亮下方火盆。

  - id: CANDLE_LEVEL_02_CARRY_THE_SPARK
    title: 携火而行
    global_burn_cycle: 5
    layout: |-
      ##########
      #......o.#
      #........#
      #......O.#
      #..111r..#
      #........#
      #..@.....#
      ##########
    expected_trace:
      - input: up
        events: [walk, countdown]
      - input: up
        events: [roll_candle, ignite, light_brazier, countdown, win_all_braziers_lit]
    expected_events: [walk, roll_candle, ignite, light_brazier, countdown, win_all_braziers_lit]
    design_notes: >
      玩家从下方侧推未点燃的横向蜡烛。烛芯在滚动途中经过已点燃火盆取得火种，
      随后继续滚动，在停止前把火送到未点燃火盆。

  - id: CANDLE_LEVEL_03_BURIED_SPARK
    title: 埋藏的火种
    global_burn_cycle: 5
    layout: |-
      #############
      #@.....2....#
      #......d...##
      #..1111R.oo##
      #...........#
      #############
    expected_trace:
      - input: right
        events: [walk, countdown]
      - input: right
        events: [walk, countdown]
      - input: right
        events: [walk, countdown]
      - input: right
        events: [walk, countdown]
      - input: right
        events: [walk, countdown, shrink, shrink_ignite]
      - input: right
        events: [roll_candle, light_brazier, countdown, win_all_braziers_lit]
    expected_events: [walk, shrink, shrink_ignite, roll_candle, light_brazier, countdown, win_all_braziers_lit]
    design_notes: >
      四步接近动作推进全局燃烧倒计时。第一根蜡烛随后缩短，露出并点燃原本埋在
      端帽下方的朝下烛芯；玩家再向右侧推新点燃的蜡烛，依次点亮两个火盆。

  - id: CANDLE_CHALLENGE_01_CLEAR_THE_FLUE
    title: 清空火道
    global_burn_cycle: 5
    layout: |-
      ############
      #.......o..#
      #..1.....#.#
      #.@1.......#
      #..D.......#
      #.......o..#
      #..........#
      #..2222r...#
      #..........#
      ############
    design_notes: >
      竖向火烛必须先向右滚动点亮中层火盆，再从右侧反推到棋盘左端，为下方横烛
      腾空上滚火道。横烛随后在上滚途中从中层火盆取火，并把火送到顶层火盆。

  - id: CANDLE_CHALLENGE_02_TWIN_RELEASE
    title: 穿焰双路
    global_burn_cycle: 5
    layout: |-
      ##################
      #@...............#
      #................#
      #..111R..o444R..o#
      #.....u......u...#
      #.....2......3...#
      #................#
      ##################
    design_notes: >
      左侧竖烛先穿过第一根火烛的外露火焰，点亮中间火盆，随后又被右侧烛身遮蔽
      而熄灭。全局燃烧边界释放右侧竖烛后，玩家还要调整两根旧蜡烛的占位，才能
      把新火焰送到最右侧火盆。

  - id: CANDLE_FRESH_01_BURNED_GATE_RETURN
    title: 焚门归火
    global_burn_cycle: 5
    layout: |-
      ############
      #..........#
      #.....#....#
      #......1.o.#
      #..222rD...#
      #..........#
      #@.....o...#
      #......#...#
      #.....#....#
      ############
    design_notes: >
      第一根火烛在首个燃烧边界缩短时释放并点燃第二根蜡烛。第二根蜡烛先向下滚动，
      点亮中继火盆后让烛芯撞入遮蔽格而熄灭；待第一根蜡烛在下一燃烧边界完全燃尽，
      再把第二根蜡烛反向滚回中继火盆取火，最后沿长轴推向终点。

  - id: CANDLE_FRESH_02_DIAGONAL_BURN_LOCK
    title: 燃阶双锁
    global_burn_cycle: 5
    layout: |-
      #############
      #..........@#
      #..U........#
      #..4U.......#
      #..43U......#
      #..432U..5..#
      #..o.....5..#
      #...o....5..#
      #....o...5..#
      #.....o..D..#
      #...........#
      #############
    design_notes: >
      四根开局点燃的竖向门烛长度依次为 4、3、2、1，最下端共同占据运输烛
      横滚所需的行。每个燃烧边界会依次燃尽当前最右门烛，同时让运输烛下端
      向上退一行；横向与纵向两道限制都解除后，运输烛才能向左滚一列，
      点亮对角线上的下一个火盆。

  - id: CANDLE_FRESH_03_RECEDING_FLAME_RELAY
    title: 退焰三渡
    global_burn_cycle: 5
    layout: |-
      ###########
      ######.####
      #....3.####
      #....3.####
      #o...d.####
      ###111R.o.#
      ####u.u...#
      #o..4.2U..#
      #...4@2...#
      #...4.#####
      ###########
    design_notes: >
      横向母烛的三个末端烛身格依次遮住三根纵向子烛的烛芯。母烛每逢全局
      燃烧边界退去一格，并在刚腾出的格内点燃对应子烛。第一根子烛右侧的
      单格燃烧锁烛会在首个边界燃尽，避免提前滚动借母烛外焰点火。右侧短烛
      随后滚向右侧火盆；上方反向子烛若立即左滚会被母烛遮火，必须先缩短一次
      让火焰上移；最后一根长烛还要再经历两次缩短，使火焰下降两行后才可触及左下火盆。

  - id: CANDLE_FRESH_04_SMOTHERED_REVERSE_RELAY
    title: 灭焰逆渡
    global_burn_cycle: 5
    layout: |-
      ##################
      #..##########....#
      #............o...#
      #...........Du...#
      #............2o..#
      #...........o2...#
      #..11111111R.2...#
      #........R.@#.####
      #..........O..####
      #..###############
      ##################
    design_notes: >
      朝右燃烧的单格火焰闩、右墙和稳定火盆让开局只有向上滚动长横烛能形成存活进程；
      主烛先点亮右侧火盆，
      越过一行后火焰被单格锁烛的烛身
      遮住而熄灭；锁烛燃尽后，玩家才能从原燃烧端把主烛向左反推，使烛芯列
      对准下方稳定火盆。主烛重新取火并回到上层后点亮第二火盆、点燃接力烛，
      随后必须利用绕到接力烛左侧的行动窗口推进两次同步缩短，把接力火焰
      降到第三目标所在行，才能由接力烛完成终局。

  - id: CANDLE_FRESH_05_PHASE_SPLIT_WEAVE
    title: 错拍三折
    global_burn_cycle: 5
    layout: |-
      ###############
      ######...L4.###
      ######.####.###
      ######.##.o.###
      #####111R..U###
      #####...o..2@##
      #####......2###
      #####...u######
      #####...3o....#
      #####...3.....#
      #####...#######
      ###############
    design_notes: >
      开局只能向左滚动纵烛：它的火焰先点亮上层火盆，烛身再遮熄横烛。首个
      全局边界只缩短纵烛，并以退焰重新点燃横烛；下一边界两烛同步缩短，
      形成横烛 3 格、纵烛 1 格的错拍状态，同时烧尽上廊的两格时序锁烛。
      横烛因此只能在第三个边界动作向下滚动，途中先点亮第二火盆、
      再点燃接力烛，随后自身被接力烛身遮熄；归零时只让接力烛缩短。接力烛
      再缩成单格后，邻近火盆才不再阻挡侧滚，并成为最后的点火目标。

  - id: CANDLE_CURRICULUM_01_AXIS_PUSH
    title: 01 向前一格
    global_burn_cycle: 5
    layout: |-
      ##########
      #........#
      #@.11R.o.#
      #........#
      ##########
    expected_trace:
      - input: right
        events: [walk, countdown]
      - input: right
        events: [push_axis, light_brazier, countdown, win_all_braziers_lit]
    expected_events: [walk, push_axis, light_brazier, countdown, win_all_braziers_lit]
    design_notes: >
      课程顺序 1，主要教学 M1 长轴端推。玩家先走到蜡烛尾端，再向右推动一次；
      蜡烛保持横向与烛芯端不变，玩家进入原尾端格，火焰随之向火盆移动。

  - id: CANDLE_CURRICULUM_02_FLAME_TO_BRAZIER
    title: 02 火焰入盆
    global_burn_cycle: 5
    layout: |-
      #######
      #..@..#
      #..1..#
      #..D..#
      #.....#
      #..o..#
      #######
    expected_trace:
      - input: down
        events: [push_axis, light_brazier, countdown, win_all_braziers_lit]
    expected_events: [push_axis, light_brazier, countdown, win_all_braziers_lit]
    design_notes: >
      课程顺序 2，主要教学 F1 火焰点亮火盆。玩家从上方沿长轴推动竖烛；
      烛身不会进入火盆，真正抵达火盆格的是端帽下方的火焰投影。

  - id: CANDLE_CURRICULUM_03_SIDE_ROLL
    title: 03 滚到尽头
    global_burn_cycle: 5
    layout: |-
      ########
      #......#
      #....o.#
      #.11R..#
      #..@...#
      #......#
      ########
    expected_trace:
      - input: up
        events: [roll_candle, light_brazier, countdown, win_all_braziers_lit]
    expected_events: [roll_step, roll_candle, light_brazier, countdown, win_all_braziers_lit]
    design_notes: >
      课程顺序 3，主要教学 M2 侧推持续滚动。玩家从下方侧推横烛一次，
      蜡烛逐格向上滚到边界决定的终点；途中火焰经过火盆并完成目标。

  - id: CANDLE_CURRICULUM_04_WICK_TAKES_FIRE
    title: 04 只有烛芯接火
    global_burn_cycle: 5
    layout: |-
      #########
      ####@####
      #.11r.o.#
      #.....O.#
      #.......#
      #.#U#...#
      #.......#
      #########
    expected_trace:
      - input: down
        events: [roll_candle, extinguish, countdown]
      - input: down
        events: [walk, countdown]
      - input: left
        events: [walk, countdown]
      - input: left
        events: [walk, countdown]
      - input: left
        events: [walk, countdown]
      - input: down
        events: [walk, countdown]
      - input: right
        events: [push_axis, countdown]
      - input: left
        events: [walk, countdown]
      - input: down
        events: [walk, countdown]
      - input: down
        events: [walk, countdown]
      - input: right
        events: [walk, countdown]
      - input: right
        events: [walk, countdown]
      - input: right
        events: [walk, countdown]
      - input: right
        events: [walk, countdown]
      - input: up
        events: [walk, countdown]
      - input: up
        events: [roll_candle, ignite, light_brazier, countdown, win_all_braziers_lit]
    expected_events:
      [walk, push_axis, roll_step, roll_candle, extinguish, ignite, light_brazier, countdown, win_all_braziers_lit]
    design_notes: >
      课程顺序 4，主要教学 F3 只有烛芯能够接火。第一次下滚时，未燃横烛的
      普通烛身覆盖下方火烛的火焰格，只会压灭火源而不会被点燃。玩家把横烛
      沿长轴右推一格后再向上滚，新的烛芯列才会先经过已点亮火盆取得火种，
      随后把火送入上方目标。

  - id: CANDLE_CURRICULUM_05_BRAZIER_RELAY
    title: 05 从火盆取火
    global_burn_cycle: 5
    layout: |-
      ############
      #..........#
      #..2......##
      #.@2......##
      #..d......##
      #....O..o.##
      #..........#
      ############
    expected_trace:
      - input: right
        events: [roll_candle, ignite, light_brazier, countdown, win_all_braziers_lit]
    expected_events: [roll_step, roll_candle, ignite, light_brazier, countdown, win_all_braziers_lit]
    design_notes: >
      课程顺序 5，主要教学 F2 已点亮火盆是永久火源。玩家从左侧推动未燃竖烛
      向右滚动；朝下烛芯先经过已点亮火盆取火，再沿同一条轨迹把火送到未点亮火盆。

  - id: CANDLE_CURRICULUM_06_FLAME_DETOUR
    title: 06 绕开火焰
    global_burn_cycle: 5
    layout: |-
      ########
      #..o...#
      #.@....#
      #..U...#
      #......#
      ########
    expected_trace:
      - input: down
        events: [walk, countdown]
      - input: down
        events: [walk, countdown]
      - input: right
        events: [walk, countdown]
      - input: up
        events: [push_axis, light_brazier, countdown, win_all_braziers_lit]
    expected_events: [walk, push_axis, light_brazier, countdown, win_all_braziers_lit]
    design_notes: >
      课程顺序 6，主要教学 H1 火焰危险与燃烧端不可推。玩家若从起点向右进入
      朝上火烛的外露火焰会死亡；安全解必须绕到蜡烛下端，再沿长轴向上推动，
      让火焰进入顶端火盆。

  - id: CANDLE_CURRICULUM_07_GLOBAL_BEAT
    title: 07 五步一拍
    global_burn_cycle: 5
    layout: |-
      #############
      #...........#
      #......2...##
      #@.....2...##
      #......d...##
      #.......O.o##
      #...........#
      #############
    expected_trace:
      - input: right
        events: [walk, countdown]
      - input: right
        events: [walk, countdown]
      - input: right
        events: [walk, countdown]
      - input: right
        events: [walk, countdown]
      - input: right
        events: [walk, countdown]
      - input: right
        events: [roll_candle, ignite, light_brazier, countdown, win_all_braziers_lit]
    expected_events: [walk, roll_step, roll_candle, ignite, light_brazier, countdown, win_all_braziers_lit]
    design_notes: >
      课程顺序 7，主要教学 T1 全局五回合倒计时。玩家必须先连续走五步到达竖烛
      左侧，观察倒计时从 5 回到 5；第六个有效行动侧滚蜡烛，途中从稳定火盆取火
      并点亮目标。

  - id: CANDLE_CURRICULUM_08_VALID_ACTIONS
    title: 08 动了才计时
