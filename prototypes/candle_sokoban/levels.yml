mechanic: candle_sokoban

levels:
  - id: CANDLE_SMOKE_01_LIGHT_BRAZIER
    title: Push Flame Into Brazier
    global_burn_cycle: 5
    layout: |-
      #########
      #@111R.o#
      #########
    expected_trace:
      - input: right
        events: [push_axis, light_brazier, countdown, win_all_braziers_lit]
    expected_events: [push_axis, light_brazier, countdown, win_all_braziers_lit]
    design_notes: >
      Primary solver and playable smoke. One axial push moves the projected
      flame onto the only brazier.

  - id: CANDLE_PROBE_02_SIDE_ROLL
    title: One-Step Side Roll
    global_burn_cycle: 5
    layout: |-
      #######
      #.#1.##
      ##@1.##
      #.#D.##
      #...o##
      #######
    expected_trace:
      - input: right
        events: [roll_candle, light_brazier, countdown, win_all_braziers_lit]
    expected_events: [roll_step, roll_candle, light_brazier, win_all_braziers_lit]
    design_notes: >
      Closed full-graph boundary witness for basic side rolling. The only legal
      transition rolls the vertical candle exactly one cell and wins; later
      wall dousing and per-substep contact summaries are unreachable.

  - id: CANDLE_EXPOSURE_02_WALL_DOUSE
    title: Wall Douse Then Light
    global_burn_cycle: 5
    layout: |-
      #########
      #########
      ##@11R.##
      ###.#####
      ###D#####
      ###.#####
      ###o#####
      #########
    expected_trace:
      - input: right
        events:
          - push_axis
          - extinguish_by_wall
          - countdown
      - input: down
        events: [walk, countdown]
      - input: down
        events: [push_axis, light_brazier, countdown, win_all_braziers_lit]
    expected_events:
      - push_axis
      - extinguish_by_wall
      - light_brazier
      - countdown
      - win_all_braziers_lit
    design_notes: >
      Earliest post-basic exposure boundary. One axial push places candle#1's
      projected wick in the wall and irreversibly douses it. The player then
      walks to a separate singleton candle and pushes its flame into the brazier.
      The complete graph has a normal win but cannot reach reignition, body
      concealment, retreating fire, or rolling contact summaries.

  - id: CANDLE_PROBE_03_CONCEALED_FLAME
    title: Wall Conceals Flame
    global_burn_cycle: 5
    layout: |-
      #########
      #.1...#.#
      #@1...#.#
      #.D...#.#
      #..#Oo..#
      #########
    expected_trace:
      - input: right
        events:
          - extinguish_by_wall
          - ignite_from_brazier
          - roll_multi_cell_one_turn
          - roll_intermediate_extinguish
          - roll_intermediate_ignite
          - roll_reignite_after_extinguish
          - light_brazier
          - win_all_braziers_lit
    expected_events:
      - roll_step
      - extinguish_by_wall
      - ignite_from_brazier
      - roll_multi_cell_one_turn
      - roll_intermediate_extinguish
      - roll_intermediate_ignite
      - roll_reignite_after_extinguish
      - light_brazier
      - win_all_braziers_lit
    design_notes: >
      A single side roll carries the projected flame across a wall, extinguishing
      it, then across a lit brazier to reignite it, and finally across the only
      unlit brazier to complete the formal objective.

  - id: CANDLE_PROBE_04_RECURSIVE_IGNITION
    title: Shared Wick Cell Ignition
    global_burn_cycle: 5
    layout: |-
      ##########
      #@111R.o.#
      ##.....u.#
      ##########
    expected_trace:
      - input: right
        events: [push_axis, ignite_from_wick, light_brazier, countdown, win_all_braziers_lit]
    expected_events: [push_axis, ignite_from_wick, light_brazier, win_all_braziers_lit]
    design_notes: >
      After the push, candle#1's flame and the singleton candle wick share one
      logical cell while the same cell overlaps the only brazier. The singleton
      ignites during the contact closure and the brazier provides a formal win.
      The closed fixture has one legal edge, so no later concealment or rolling
      contact family is reachable anywhere in its complete graph.

  - id: CANDLE_PROBE_05_FIRE_DEATH
    title: Walk Around the Flame
    global_burn_cycle: 5
    layout: |-
      #######
      #.@...#
      #o.L1.#
      #######
    expected_trace:
      - input: right
        events: [walk, countdown]
      - input: right
        events: [walk, countdown]
      - input: right
        events: [walk, countdown]
      - input: down
        events: [walk, countdown]
      - input: left
        events: [push_axis, light_brazier, countdown, shrink, win_all_braziers_lit]
    expected_events: [walk, push_axis, light_brazier, countdown, shrink, win_all_braziers_lit]
    design_notes: >
      Moving down from the start enters the exposed flame and kills the player.
      The safe route walks around the flame, reaches the candle's tail side, and
      pushes left on the fifth valid action so the flame enters the only brazier
      during the normal global burn boundary.

  - id: CANDLE_PROBE_06_BURN_SHRINK
    title: Isolated Retreating-Flame Ignition
    global_burn_cycle: 5
    layout: |-
      ###########
      ######o####
      ###111R.###
      ######u####
      #@.....####
      ###########
    expected_trace:
      - input: right
        events: [walk, countdown]
      - input: right
        events: [walk, countdown]
      - input: right
        events: [walk, countdown]
      - input: right
        events: [walk, countdown]
      - input: right
        events: [walk, countdown, shrink, shrink_ignite]
      - input: up
        events:
          - push_axis
          - extinguish_by_candle_body
          - light_brazier
          - countdown
          - win_all_braziers_lit
    expected_events:
      - countdown
      - shrink
      - shrink_ignite
      - push_axis
      - extinguish_by_candle_body
      - light_brazier
      - win_all_braziers_lit
    design_notes: >
      Five corridor walks trigger the burn boundary. The horizontal candle
      shrinks and its retreating flame exposes and ignites the singleton candle.
      One axial push then moves that candle's wick into the brazier for a normal
      win. The complete graph contains no side-roll contact summary.

  - id: CANDLE_PROBE_07_UNLIT_COUNTDOWN
    title: Countdown Advances Before Ignition
    global_burn_cycle: 5
    layout: |-
      #########
      #@..1..##
      #...1..##
      #...d..##
      #....Oo##
      #########
    expected_trace:
      - input: right
        events: [walk, countdown_without_lit_candle, countdown]
      - input: right
        events: [walk, countdown_without_lit_candle, countdown]
      - input: right
        events:
          - roll_candle
          - roll_multi_cell_one_turn
          - ignite_from_brazier
          - ignite_midcycle
          - roll_intermediate_ignite
          - light_brazier
          - countdown
          - win_all_braziers_lit
    expected_events:
      - countdown_without_lit_candle
      - roll_candle
      - roll_multi_cell_one_turn
      - ignite_from_brazier
      - ignite_midcycle
      - roll_intermediate_ignite
      - light_brazier
      - win_all_braziers_lit
    design_notes: >
      Two successful walks advance and reset the board countdown while no candle
      is lit. The following side roll crosses a lit brazier, ignites the candle,
      and then lights the only unlit brazier for a formal win.

  - id: CANDLE_PROBE_08_BODY_CONCEALMENT
    title: 轴推烛身遮芯后再释放
    global_burn_cycle: 5
    layout: |-
      #########
      ####1####
      ####D####
      ##@l....#
      ####D####
      ####.####
      ####o####
      #########
    expected_trace:
      - input: right
        events:
          - push_axis
          - extinguish_by_candle_body
      - input: right
        events:
          - push_axis
          - wick_reexposed_unlit
      - input: down
        events: [push_axis, light_brazier, countdown, win_all_braziers_lit]
    expected_events:
      - push_axis
      - extinguish_by_candle_body
      - wick_reexposed_unlit
      - light_brazier
      - win_all_braziers_lit
    design_notes: >
      第一次轴推让未燃单格蜡烛的烛身盖住竖直蜡烛的已燃烛芯；第二次轴推
      移开烛身，使目标烛芯重新外露但保持未燃。第三次轴推使用另一根已燃
      单格蜡烛点盆并正常获胜。全图不需要多格侧滚，因此不会提前触发退焰
      点火或滚动途中接触链。

  - id: CANDLE_PROBE_09_INTERMEDIATE_LAST_BRAZIER
    title: 最后一个火盆在滚动终点前点亮
    global_burn_cycle: 5
    layout: |-
      #########
      #..1..#.#
      #.@1..#.#
      #..D..#.#
      #...o...#
      #########
    expected_trace:
      - input: right
        events:
          - light_brazier
          - roll_candle
          - roll_multi_cell_one_turn
          - roll_intermediate_light_brazier
          - roll_last_brazier_before_endpoint
          - win_all_braziers_lit
    expected_events:
      - light_brazier
      - roll_candle
      - roll_multi_cell_one_turn
      - roll_intermediate_light_brazier
      - roll_last_brazier_before_endpoint
      - win_all_braziers_lit
    design_notes: >
      唯一火盆在第一个滚动小步被点亮，但蜡烛仍继续滚到由墙体决定的终点，
      然后本次行动才结束。

  - id: CANDLE_PROBE_10_EXPOSED_FLAME_DEATH
    title: 进入外露火焰会死亡
    global_burn_cycle: 5
    layout: |-
      #######
      #.@...#
      #o.L1.#
      #######
    win:
      type: event_occurs
      event: player_died
    expected_trace:
      - input: down
        events: [walk, countdown, player_died]
    expected_events: [walk, countdown, player_died]
    design_notes: >
      玩家以一次合法移动进入外露火焰。死亡在该行动的全局倒计时之后结算，
      并产生独立 runtime 事件。
